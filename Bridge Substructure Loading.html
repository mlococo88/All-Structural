<!DOCTYPE html>
<html lang="en">
<head>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #eceeeb; --surface: #ffffff; --sidebar: #f6f7f5; --band: #e2e5e0;
  --border: #dde1db; --border-hi: #c3c9c1;
  --text: #17212b; --text-dim: #4a5562; --muted: #7a8590;
  --blue: #2346c2; --blue-dim: rgba(35,70,194,.07); --blue-mid: rgba(35,70,194,.20);
  --pass: #15724a; --pass-dim: rgba(21,114,74,.09);
  --fail: #b8322a; --fail-dim: rgba(184,50,42,.08);
  --warn: #9a6410; --warn-dim: rgba(154,100,16,.10);
  --info: #1f5ea8; --info-dim: rgba(31,94,168,.08);
  --conc: #b9bdb6; --water: #3f7f95;
  --sans: 'Barlow', 'Segoe UI', Arial, sans-serif;
  --cond: 'Barlow Semi Condensed', 'Barlow', 'Segoe UI', Arial, sans-serif;
  --side-w: 360px; --r: 6px; --r-lg: 10px;
  --ring: 0 0 0 3px rgba(35,70,194,.22);
}
html { font-size: 14px; -webkit-text-size-adjust: 100%; }
body { font-family: var(--sans); font-feature-settings: "tnum" 1; background: var(--bg); color: var(--text); line-height: 1.45; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* header */
header { height: 54px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.logo-name { font-family: var(--cond); font-weight: 700; font-size: 1.28rem; letter-spacing: .01em; }
.brand-sub { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-spacer { flex: 1; }
.hdr-group { display: flex; gap: 6px; flex-wrap: nowrap; }
.btn { border: 1px solid var(--border-hi); background: var(--surface); border-radius: var(--r); padding: 6px 12px; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover { color: #fff; background: #1b38a0; }
.btn-sm { padding: 3px 9px; font-size: .82rem; }

/* bridge strip: the unit navigator */
.strip { flex: none; background: var(--band); border-bottom: 1px solid var(--border-hi); padding: 8px 16px 4px; position: relative; }
.strip-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 2px; }
.strip-title { font-family: var(--cond); font-weight: 600; font-size: .95rem; }
.strip-note { color: var(--muted); font-size: .8rem; }
#strip-host svg { display: block; width: 100%; height: 118px; }
#strip-host .u { cursor: pointer; }
#strip-host .u:hover .uc { fill: #cfd6e8; }
#strip-host .u.sel .uc { fill: var(--blue); stroke: var(--blue); }
#strip-host .u.sel text.ul { fill: var(--blue); font-weight: 700; }

/* app body */
.app { flex: 1; display: flex; min-height: 0; }
.side { width: var(--side-w); flex: none; display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid var(--border); min-height: 0; }
.itabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
.itab { flex: 1; border: 0; background: none; padding: 10px 4px 8px; font-family: var(--cond); font-weight: 600; font-size: .95rem; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
.itab.active { color: var(--blue); border-bottom-color: var(--blue); }
.sidebar { flex: 1; overflow-y: auto; padding-bottom: 40px; }
.sec-h { font-family: var(--cond); font-weight: 700; font-size: 1rem; padding: 14px 16px 6px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.sec-h small { font-family: var(--sans); font-weight: 500; color: var(--muted); font-size: .8rem; }
.sec-body { padding: 0 16px 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.sec-body.one { grid-template-columns: 1fr; }
.fld { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fld.full { grid-column: 1 / -1; }
.fld label { font-size: .8rem; color: var(--text-dim); font-weight: 500; }
.fld .in { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border-hi); border-radius: var(--r); }
.fld .in:focus-within { border-color: var(--blue); box-shadow: var(--ring); }
.fld input, .fld select, .fld textarea { border: 0; background: transparent; padding: 5px 7px; width: 100%; min-width: 0; outline: none; }
.fld textarea { min-height: 70px; resize: vertical; }
.fld .u { color: var(--muted); font-size: .78rem; padding-right: 7px; white-space: nowrap; }
.fld.ro .in { background: var(--band); }
.fld.bad .in { border-color: var(--fail); }
.fld .sli input.sli-in { border: 1px solid var(--border-hi); border-radius: var(--r); background: var(--surface); padding: 4px 6px; }
.fld.bad .sli { outline: 1px solid var(--fail); outline-offset: 2px; }
.note { font-size: .82rem; color: var(--text-dim); padding: 2px 16px 8px; }
.note.pad { padding: 6px 16px; }
/* SLNL (2026-11-08, engineer: a long note "will likely get overlooked because it's too long"): a long note as a bold lead and a list (slNL) */
.slNL .slNLl { font-weight: 600; color: var(--text); margin: 0 0 1px; }
.slNL .slNLu { margin: 2px 0 3px; padding-left: 18px; }
.slNL .slNLu > li { margin: 1px 0; max-width: none; overflow-wrap: anywhere; }
.slNL .slNLu .slNLu { margin: 1px 0 2px; }
.slNL .slNLk { font-weight: 600; }
.slNL .slNLa { color: var(--warn); font-weight: 600; margin: 2px 0 4px; }
@media print { .slNL .slNLu > li { break-inside: avoid; } }
.seg { display: flex; border: 1px solid var(--border-hi); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: none; padding: 5px 6px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--text-dim); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--blue); color: #fff; }
.mini-t { width: 100%; border-collapse: collapse; font-size: .85rem; }
.mini-t th { text-align: left; font-weight: 600; color: var(--text-dim); font-size: .78rem; padding: 3px 4px; border-bottom: 1px solid var(--border-hi); }
.mini-t td { padding: 2px 3px; border-bottom: 1px solid var(--border); }
.mini-t input, .mini-t select { width: 100%; border: 1px solid transparent; border-radius: 4px; padding: 3px 4px; background: transparent; text-align: right; }
.mini-t select { text-align: left; }
.mini-t input:hover, .mini-t select:hover { border-color: var(--border-hi); background: var(--surface); }
.mini-t input:focus, .mini-t select:focus { border-color: var(--blue); background: var(--surface); outline: none; }
.mini-t td.lbl { font-weight: 600; white-space: nowrap; }
/* SLLAY: the Bridge pane Supports table fits the sidebar: fixed column widths, the Superstructure select wide enough for its options */
.mini-t.sup-t { table-layout: fixed; }
.mini-t.sup-t th { white-space: normal; vertical-align: bottom; }
.mini-t.sup-t td.lbl { overflow: hidden; text-overflow: ellipsis; }
.mini-t.sup-t select { padding-left: 2px; padding-right: 0; }
.unit-pick { display: flex; gap: 6px; padding: 12px 16px 2px; flex-wrap: wrap; }
.unit-pick button { border: 1px solid var(--border-hi); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: .84rem; font-weight: 600; cursor: pointer; }
.unit-pick button.on { background: var(--blue); border-color: var(--blue); color: #fff; }

/* main */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.tab-bar { display: flex; flex-wrap: wrap; gap: 0 2px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; }   /* SLLAY (2026-11-10): the tabs wrap onto rows (as the abutment and steel-bridge apps) instead of one sideways-scrolling row */
.tab-btn { border: 0; background: none; padding: 11px 10px 9px; font-family: var(--cond); font-weight: 600; font-size: .95rem; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-btn.plan { color: var(--muted); font-weight: 500; }
.tab-btn .ph { font-family: var(--sans); font-size: .68rem; font-weight: 600; border: 1px solid var(--border-hi); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.tab-sep { width: 1px; background: var(--border); margin: 9px 4px; flex: none; }
.tab-panels { flex: 1; overflow-y: auto; padding: 18px 22px 60px; }
.tab-panel { display: none; }   /* SLLAY: full width of the output pane (was max-width 1180px) */
.tab-panel.active { display: block; }
#tab-v3d.active { display: flex; flex-direction: column; max-width: none; height: 100%; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 16px; }
.card-h { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-h h2 { font-family: var(--cond); font-weight: 700; font-size: 1.12rem; }
.card-h .sub { color: var(--muted); font-size: .84rem; }
.card-b { padding: 12px 16px 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }
.fact { background: var(--surface); padding: 8px 12px; }
.fact b { display: block; font-family: var(--cond); font-size: 1.25rem; font-weight: 600; }
.fact span { font-size: .8rem; color: var(--text-dim); }
.tscroll { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tbl th { text-align: left; font-weight: 600; font-size: .8rem; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--border-hi); white-space: nowrap; vertical-align: bottom; }
.tbl th.right, .tbl td.val { text-align: right; }
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl td.lbl { font-weight: 600; white-space: nowrap; }
.tbl tr.tot td { font-weight: 700; border-top: 1px solid var(--border-hi); }
/* SLLAY: the Combinations table: headers wrap, the effect labels stay on one line in a sticky first column; in a pane narrower than
   1400 px each "max / min" is set on two lines (max over min), so the table fits the pane when it can and scrolls in its own box
   (label column kept in view) when not */
.tbl.cmb th { white-space: normal; }
.tbl.cmb th, .tbl.cmb td { padding-left: 6px; padding-right: 6px; }
.tbl.cmb tr > :first-child { white-space: nowrap; position: sticky; left: 0; z-index: 1; background: var(--surface); }
.tbl.cmb .nw { white-space: nowrap; }
.tscroll.cmb-w { container-type: inline-size; }
@container (max-width: 1399px) { .tbl.cmb .nw { display: block; } }
.tbl td.dim { color: var(--muted); }
.chk { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
.chk:last-child { border-bottom: 0; }
.chk .tag { flex: none; font-size: .74rem; font-weight: 700; border-radius: 4px; padding: 1px 7px; margin-top: 2px; min-width: 44px; text-align: center; }
.tag.pass { background: var(--pass-dim); color: var(--pass); } .tag.fail { background: var(--fail-dim); color: var(--fail); }
.tag.warn { background: var(--warn-dim); color: var(--warn); } .tag.info { background: var(--info-dim); color: var(--info); }
.chk .where { font-weight: 600; margin-right: 4px; }
.pill { display: inline-block; font-size: .76rem; font-weight: 600; border-radius: 4px; padding: 0 6px; margin: 1px 2px 1px 0; }
.pill.fix { background: var(--fail-dim); color: var(--fail); } .pill.exp { background: var(--blue-dim); color: var(--blue); } .pill.gd { background: var(--warn-dim); color: var(--warn); }
.dwg { width: 100%; height: auto; display: block; background: #fbfcfa; border: 1px solid var(--border); border-radius: var(--r); }
.dwg.dwg-geo { max-width: 1120px; margin: 0 auto; }   /* SLLAY: the Geometry plan and elevation keep a readable scale on a wide screen */
.dwg-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--text-dim); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.plan-list { margin: 4px 0 0 18px; }
.plan-list li { margin-bottom: 5px; max-width: 78ch; }
.man h3 { font-family: var(--cond); font-size: 1.05rem; margin: 16px 0 4px; }
.man h3:first-child { margin-top: 0; }
.man p, .man li { max-width: 80ch; margin-bottom: 6px; }
.man ul { margin-left: 18px; }
.man code { font-size: .86rem; background: var(--band); padding: 0 4px; border-radius: 3px; }

/* 3D */
.v3-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.v3-bar label { font-size: .85rem; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.v3-bar select { border: 1px solid var(--border-hi); border-radius: var(--r); padding: 4px 6px; background: var(--surface); }
#v3-host { flex: 1; min-height: 480px; position: relative; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: linear-gradient(#f4f6f3, #dfe3de); }
#v3-host canvas { display: block; }
#v3-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-dim); padding: 20px; text-align: center; }

#flash { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 8px 16px; border-radius: var(--r); font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90vw; }
#flash.on { opacity: 1; }
#flash.fail { background: var(--fail); }

@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  .app { flex-direction: column; }
  .side { width: 100%; max-height: none; }
  .hdr-group .btn { padding: 5px 8px; font-size: .8rem; }
  .brand-sub { display: none; }
  header { height: auto; padding: 8px 10px; flex-wrap: wrap; }
  .hdr-group { flex-wrap: wrap; min-width: 0; }   /* PHN (2026-11-02): the header buttons wrap instead of widening the page */
  .tab-btn { padding: 8px 8px 6px; }
}
/* SLLAY: phone header in two rows: title, All tools; then the project chip, Undo, Redo and Print on one line (the chip shortens) */
@media (max-width: 600px) {
  header { gap: 4px 8px; padding: 6px 10px; }
  .hdr-spacer { display: none; }
  header .hdr-group { flex: 1 1 100%; flex-wrap: nowrap; align-items: center; }
  header .hdr-group [data-sp="row"] { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap !important; }
  header .hdr-group .spChip { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  header .hdr-group .spChip > * { white-space: nowrap; flex: none; }
  header .hdr-group .spChip > b { flex: 0 1 auto; min-width: 0; }
  header .hdr-group .btn { flex: none; }
}
@media print {
  header, .strip, .side, .tab-bar, #flash { display: none !important; }
  body { height: auto; overflow: visible; background: #fff; display: block; }
  .app, .main, .tab-panels { display: block; overflow: visible; padding: 0; }
  .card { break-inside: avoid; border-color: #bbb; }
}
/* "All tools" link */
.bx-all-tools { font-size: .82rem; color: var(--muted); text-decoration: none; white-space: nowrap; }
.bx-all-tools:hover { color: var(--blue); text-decoration: underline; }
@media print { .bx-all-tools { display: none !important; } }
/* SLHD (2026-11-05): Open / Save, the abutment and foundation hand-offs and Export DXF are in the Project input tab (#slPrjPane);
   the header keeps the title, a read-only project line (a link to that tab), Undo / Redo, Projects… and Print */
#hdrProj { font-size: .85rem; color: var(--muted); text-decoration: none; max-width: 30em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; margin-right: 4px; }
#hdrProj:hover { color: var(--blue); text-decoration: underline; }
#hdrProj .hdrNone { font-style: italic; }
#slPrjPane .slGrp { grid-column: 1 / -1; }
#slPrjPane .slGrp > b { display: block; font-size: .85rem; }
#slPrjPane .slGrp .note { padding: 0 0 4px; }
#slPrjPane .slRow { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 900px) { #hdrProj { flex: 1 1 100%; max-width: none; order: -1; } }
</style>

<script>
/* BridgeXfer v1 — cross-tool hand-off helper. Spec: HANDOFF.md. Duplicated verbatim in each tool that sends or receives (CLAUDE.md §3). */
(function(){
  if(window.BridgeXfer) return;
  var NS='bridgeSuite.v1.';
  function lsOK(){ try{ var k='__bx_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
  function sharedProject(){
    try{ var m=JSON.parse(localStorage.getItem(NS+'projectMeta')||'null');
      if(m && m._schema==='bridge-project-meta' && m.fields) return { name:m.fields.projectName||'', bridgeId:m.fields.bridgeId||'' };
    }catch(e){}
    return null;
  }
  function stamp(channel, payload, producer, producerFile){
    var p={}; for(var k in payload) if(Object.prototype.hasOwnProperty.call(payload,k)) p[k]=payload[k];
    p.schemaVersion = p.schemaVersion || 1;
    p.producer = p.producer || producer || document.title;
    p.producerFile = p.producerFile || producerFile || decodeURIComponent((location.pathname.split('/').pop()||''));
    p.producedAt = new Date().toISOString();
    if(!p.project) p.project = sharedProject() || { name:'', bridgeId:'' };
    if(!p.notes) p.notes = [];
    return p;
  }
  function publish(channel, payload, producer, producerFile){
    if(!payload || !payload._schema) return { error:'payload has no _schema' };
    var p=stamp(channel, payload, producer, producerFile);
    if(!lsOK()) return { error:'Browser storage is not available. Use "Export hand-off (JSON)" instead.', payload:p };
    try{
      localStorage.setItem(NS+channel, JSON.stringify(p));
      localStorage.setItem(NS+channel+'.updatedAt', p.producedAt);
    }catch(e){ return { error:'Could not save hand-off (storage full?): '+e.message, payload:p }; }
    return { ok:true, payload:p };
  }
  function validate(p, schema, maxVersion){
    if(!p || typeof p!=='object') return 'not a hand-off object';
    if(p._schema!==schema) return 'wrong data type ('+(p._schema||'none')+'), expected '+schema;
    if(!(p.schemaVersion<= (maxVersion||1))) return 'newer format (v'+p.schemaVersion+') than this tool supports (v'+(maxVersion||1)+')';
    return null;
  }
  function read(channel, schema, maxVersion){
    var raw=null;
    try{ raw=localStorage.getItem(NS+channel); }catch(e){ return { error:'Browser storage is not available.' }; }
    if(!raw) return { error:'Nothing has been sent on this channel yet.' , empty:true };
    var p; try{ p=JSON.parse(raw); }catch(e){ return { error:'Stored hand-off is corrupt.' }; }
    var err=validate(p, schema, maxVersion); if(err) return { error:err };
    return { ok:true, payload:p };
  }
  function markAdopted(channel, receiverId, producedAt){
    try{ localStorage.setItem(NS+channel+'.adopted.'+receiverId, producedAt||''); }catch(e){}
  }
  function isNew(channel, receiverId){
    try{
      var at=localStorage.getItem(NS+channel+'.updatedAt'); if(!at) return false;
      return at!==localStorage.getItem(NS+channel+'.adopted.'+receiverId);
    }catch(e){ return false; }
  }
  function exportFile(channel, payload){
