<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section Property Calculator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{
  --navy-900:#16304F; --navy-800:#1E3A5F; --blue-600:#2563EB;
  --green-600:#059669; --red-600:#DC2626; --amber-700:#B45309;
  --slate-50:#F8FAFC; --slate-100:#F1F3F5; --slate-200:#E4E7EB;
  --slate-400:#94A3B8; --slate-900:#0F172A;
  --ink:var(--slate-900); --paper:#fff; --panel:var(--slate-50); --line:var(--slate-200);
  --accent:var(--navy-800); --pass:var(--green-600); --fail:var(--red-600); --warn:var(--amber-700);
  --font-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-doc:"Times New Roman",Times,serif;
  --mono:Consolas,"SFMono-Regular",Menlo,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--font-doc);font-size:10pt;color:var(--ink);background:#efede8}
#app{position:fixed;top:0;right:0;bottom:0;left:0;max-width:1500px;margin:0 auto;
  overflow:hidden;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 12px rgba(0,0,0,.12)}
#hdr{flex:0 0 auto;border-bottom:3px solid var(--navy-900);padding:8px 14px 7px;background:var(--accent);color:#fff;z-index:20}
#hdr .titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#hdr h1{font-size:14.5pt;margin:0;letter-spacing:.4px;font-family:var(--font-ui);font-weight:600;color:#fff}
#hdr .byline{font-size:9pt;color:#C7D4E4;margin-top:1px;font-family:var(--font-ui)}
#hdr .alltools{display:inline-block;margin-top:2px;font-family:var(--font-ui);font-size:8.5pt;color:#C7D4E4;text-decoration:none}
#hdr .alltools:hover{color:#fff;text-decoration:underline}
#hdr .hdrBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#hdr .hdrBtns button{font-family:var(--font-ui);font-size:9pt;padding:4px 11px;border:1px solid #ffffff55;border-radius:4px;background:#ffffff1c;color:#fff;cursor:pointer}
#hdr .hdrBtns button:hover{background:#ffffff33}
#hdr .hdrBtns button.primary{background:#fff;color:var(--navy-800);font-weight:600}
#projGrid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:4px 8px;margin-top:6px}
#projGrid label{display:block;font-family:var(--font-ui);font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#B9C8DB;margin-bottom:1px}
#projGrid input{width:100%;font-family:var(--font-ui);font-size:9pt;padding:3px 5px;border:1px solid #ffffff33;border-radius:3px;background:#ffffff14;color:#fff}
#projGrid input::placeholder{color:#8FA3BC}
#projShare{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
#projShare button{font-family:var(--font-ui);font-size:8pt;padding:2px 8px;border:1px solid #ffffff44;border-radius:3px;background:#ffffff14;color:#fff;cursor:pointer}
#projShare button:hover{background:#ffffff2a}
#main{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
#inputPanel{flex:0 0 33%;max-width:450px;min-width:330px;overflow-y:auto;border-right:2px solid var(--line);background:var(--panel);padding:9px 10px 40px}
#outputPanel{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;padding:0 14px 60px;background:var(--paper)}
#tabBar{position:sticky;top:0;z-index:15;background:var(--paper);border-bottom:2px solid var(--accent);padding:7px 0 0;display:flex;flex-wrap:wrap;gap:2px}
#tabBar button{display:inline-flex;align-items:center;font-family:var(--font-ui);font-size:9pt;padding:5px 11px;border:1px solid var(--line);border-bottom:none;background:var(--slate-100);color:#41546E;cursor:pointer;border-radius:5px 5px 0 0}
#tabBar button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.tabDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:0 0 8px}
.tabDot.pass{background:var(--pass)} .tabDot.fail{background:var(--fail)} .tabDot.na{background:#B8C2CE}
.govStrip{display:flex;align-items:center;gap:9px;padding:5px 14px;font-family:var(--font-ui);font-size:9.5pt;border-bottom:1px solid var(--line);background:var(--slate-100);color:var(--ink);flex-wrap:wrap}
.govStrip.pass{background:#EAF6EE;border-bottom-color:#9ED3B0}
.govStrip.fail{background:#FBEAEA;border-bottom-color:#E2A2A2}
.govTxt{font-weight:600}
.govSec{margin-left:auto;color:#5A6B80;font-size:9pt}
.govBadge{font-weight:700;letter-spacing:.4px;padding:1px 8px;border-radius:4px;background:rgba(0,0,0,.06)}
.govStrip.pass .govBadge{color:var(--pass)} .govStrip.fail .govBadge{color:var(--fail)}
.tabPage{padding:10px 2px}
.sec{border:1px solid var(--line);border-radius:6px;margin:9px 0;background:var(--paper);overflow:hidden}
.secHead{display:flex;align-items:center;gap:7px;padding:6px 10px;background:linear-gradient(#F6F8FA,#EDF1F5);cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.secHead .caret{width:0;height:0;border-left:6px solid var(--accent);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.sec:not(.collapsed) .caret{transform:rotate(90deg)}
.secTitle{font-family:var(--font-ui);font-size:10pt;font-weight:600;color:var(--accent);margin:0}
.secBody{padding:8px 11px}
.sec.collapsed .secBody{display:none}
.fRow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(90px,1.25fr) 36px;gap:6px;align-items:center;margin:3px 0}
.fRow label{font-size:10pt}
.fRow .unit{font-family:var(--font-ui);font-size:8pt;color:#64748B}
input[type=text],input[type=number],select,textarea{font-family:var(--font-ui);font-size:9.5pt;padding:3px 5px;border:1px solid #C6CFDA;border-radius:3px;background:#fff;color:var(--ink);width:100%}
input[type=number]{text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid #BFD3F2;border-color:var(--blue-600)}
input.bad,select.bad{border-color:var(--fail)!important;background:#FDECEC!important}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent)}
button{font-family:var(--font-ui)}
.btn{font-size:9pt;padding:4px 10px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:4px;cursor:pointer}
.btn:hover{background:#EFF4FA}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.btn.sm{font-size:8pt;padding:2px 7px}
.btnRow{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0;align-items:center}
.chkRow{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:10pt}
table.tbl{border-collapse:collapse;width:100%;margin:5px 0;font-size:9.5pt}
table.tbl th{background:#DCE6F1;color:var(--navy-900);font-family:var(--font-ui);font-size:8.5pt;font-weight:700;padding:3px 6px;border:1px solid #B9C8DB;text-align:center}
table.tbl td{padding:2.5px 6px;border:1px solid var(--line);text-align:center}
table.tbl td.lft,table.tbl th.lft{text-align:left}
table.tbl tr.gov td{background:#FEF6E7}
table.tbl td.b{font-weight:700}
table.tbl td.ng{color:var(--fail);font-weight:700}
table.tbl td.ok{color:var(--pass);font-weight:700}
.tscroll{overflow-x:auto;max-width:100%}
table.cfg{border-collapse:collapse;width:100%;font-size:9pt}
table.cfg th{font-family:var(--font-ui);font-size:8pt;color:#64748B;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line)}
table.cfg td{padding:2px 4px;vertical-align:middle}
table.cfg input,table.cfg select{font-size:8.8pt;padding:2px 4px}
.hint{font-family:var(--font-ui);font-size:8pt;color:#6B7A8F;margin:2px 0}
.small{font-size:8.5pt}
.note{font-size:9pt;color:#4A5568;background:#F6F8FA;border:1px solid var(--line);border-radius:4px;padding:5px 9px;margin:6px 0}
.warnBox{font-size:9.5pt;color:#7C4A03;background:#FEF6E7;border:1.5px solid #F0C36D;border-radius:5px;padding:7px 10px;margin:7px 0}
.errBox{font-size:9.5pt;color:#8C1D1D;background:#FDECEC;border:1.5px solid #F1A8A8;border-radius:5px;padding:7px 10px;margin:7px 0}
.okBox{font-size:9.5pt;color:#065F46;background:#E8F7F0;border:1.5px solid #7FD1B0;border-radius:5px;padding:7px 10px;margin:7px 0;font-weight:600}
.errBox ul,.warnBox ul{margin:3px 0 0 18px;padding:0}
/* dashboard */
.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);border-left:5px solid var(--pass);border-radius:6px;padding:10px 14px;margin:8px 0;background:#FBFDFC}
.hero.fail{border-left-color:var(--fail);background:#FFFBFB}
.hero .hL{font-family:var(--font-ui)}
.hero .hK{font-size:8pt;text-transform:uppercase;letter-spacing:.6px;color:#64748B}
.hero .hN{font-size:15pt;font-weight:700;color:var(--navy-900)}
.hero .hD{font-size:9pt;color:#4A5568}
.hero .hP{font-family:var(--font-ui);font-size:24pt;font-weight:700;color:var(--pass);text-align:right}
.hero.fail .hP{color:var(--fail)}
.hero .hPs{font-family:var(--font-ui);font-size:8pt;color:#64748B;text-align:right}
#dash{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:8.5pt;border:1.5px solid;border-radius:5px;padding:4px 9px;cursor:pointer;background:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.pass{border-color:#9CD6BC}.chip.pass .dot{background:var(--pass)}
.chip.fail{border-color:#F1A8A8;background:#FDF3F3}.chip.fail .dot{background:var(--fail)}
.chip.na{border-color:#CBD5E1;color:#64748B}.chip.na .dot{background:#94A3B8}
.chip .ratio{font-weight:700}
/* calc sheet blocks */
.eqb{border:1px solid var(--line);border-radius:6px;margin:9px 0;overflow:hidden;background:#fff;break-inside:avoid}
.eqb.ng{border-color:#E9A9A4}
.eqbT{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 11px;border-bottom:1px solid var(--line);font-family:var(--font-ui);font-size:9.5pt;font-weight:600;color:var(--navy-900);background:#FAFBFC}
.eqbT .ref{font-weight:400;color:#6B7A8F;font-size:8.5pt;text-align:right}
.eqbM{background:#F7F8FA;border-left:3px solid var(--blue-600);padding:4px 14px;margin:0;overflow-x:auto;overflow-y:hidden}
.eqb.ng .eqbM{border-left-color:var(--fail);background:#FDF7F6}
.eqbM .katex-display{margin:5px 0;text-align:left}
.eqbM .katex-display>.katex{text-align:left}
.eqbM .eqTxt{font-family:var(--mono);font-size:9.5pt;padding:4px 0}
.eqbW{padding:5px 11px 7px}
.eqbW .wh{font-family:var(--font-ui);font-size:8pt;font-weight:600;color:#6B7A8F;margin-bottom:2px}
.eqbW table{width:100%;border-collapse:collapse}
.eqbW td{padding:2px 0;vertical-align:baseline;font-size:9.5pt;border-bottom:1px dotted #E8ECF1}
.eqbW td.ws{width:76px;white-space:nowrap;padding-right:8px;color:var(--navy-800)}
.eqbW td.wd{color:#3C4A5E}
.eqbW td.wv{font-family:var(--mono);text-align:right;white-space:nowrap;padding-left:10px;font-size:9pt}
.eqbW td.wv .wu{color:#7C8CA3;font-family:var(--font-ui);font-size:8pt;margin-left:3px}
.eqbW td.wsrc{font-family:var(--font-ui);font-size:8pt;color:#6B7A8F;padding-left:12px;white-space:normal;width:34%}
.eqbR{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 11px;border-top:1px solid var(--line);font-family:var(--font-ui);font-size:9.5pt;flex-wrap:wrap}
.eqbR .res{font-weight:700}
.eqbR .st{font-weight:700;padding:1px 9px;border-radius:4px}
.eqbR .st.ok{color:var(--pass);background:#E8F7F0}
.eqbR .st.ng{color:var(--fail);background:#FDECEC}
.eqbR .st.na{color:#64748B;background:var(--slate-100)}
.badge{display:inline-block;font-family:var(--font-ui);font-size:7.5pt;font-weight:600;padding:0 5px;border-radius:3px;line-height:1.5;vertical-align:baseline;margin-left:3px;white-space:nowrap}
.badge.vfy{background:#FEF3C7;color:#92400E;border:1px solid #F0C36D}
.badge.ok{background:#E8F7F0;color:#065F46;border:1px solid #7FD1B0}
.badge.ng{background:#FDECEC;color:#8C1D1D;border:1px solid #F1A8A8}
.badge.na{background:var(--slate-100);color:#64748B;border:1px solid #CBD5E1}
.badge.use{background:#E0EAF6;color:var(--navy-800);border:1px solid #B9C8DB}
tr.inuse td{background:#EEF4FB}
/* schematic, plots */
.schemWrap{border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;margin:6px 0;overflow-x:auto}
svg text{font-family:var(--font-ui)}
.plotHold{width:100%;height:260px;margin:4px 0 10px}
/* manual */
.manH{font-size:12.5pt;color:var(--navy-900);border-bottom:1.5px solid var(--navy-900);padding-bottom:2px;margin:14px 0 6px;font-family:var(--font-ui)}
.manH3{font-size:10.5pt;color:var(--navy-800);margin:10px 0 4px;font-family:var(--font-ui)}
.manP{margin:5px 0;line-height:1.45}
.manList{margin:4px 0 6px;line-height:1.4}
textarea{min-height:64px;resize:vertical;font-family:var(--font-doc);font-size:10pt}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;font-family:var(--font-ui);font-size:9pt;padding:7px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:.94}
#toast.warn{background:var(--warn)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C4CDD8;border-radius:5px}
#printReport{display:none}
/* narrow screens: panels stack and the page scrolls */
@media (max-width:820px){
  html,body{overflow:auto;height:auto}
  #app{position:static;max-width:none;overflow:visible;display:block}
  #main{display:block;overflow:visible}
  #inputPanel{max-width:none;min-width:0;border-right:none;border-bottom:2px solid var(--line);overflow:visible;padding-bottom:12px}
  #outputPanel{overflow:visible;padding:0 8px 40px}
  #projGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tabBar{position:static}
  .fRow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px}
  .eqbW td.wsrc{display:block;width:auto;padding-left:0}
  .hero .hP{text-align:left}
  .plotHold{height:300px}
}
@media print{
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  #toast,#prOverlay{display:none!important}
}
/* ---- Section Property Calculator additions ---- */
#inputPanel{flex:0 0 31%;max-width:430px;min-width:320px}
#spcInTabs{position:sticky;top:-9px;z-index:12;display:flex;flex-wrap:wrap;gap:2px;margin:-9px -10px 8px;padding:7px 10px 0;background:var(--panel);border-bottom:2px solid var(--accent)}
#spcInTabs .spcInTab{display:inline-flex;align-items:center;font-family:var(--font-ui);font-size:9pt;padding:5px 9px;border:1px solid var(--line);border-bottom:none;background:var(--slate-100);color:#41546E;cursor:pointer;border-radius:5px 5px 0 0}
#spcInTabs .spcInTab:hover{background:#EFF4FA}
#spcInTabs .spcInTab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
#spcInTabs .spcInTab:focus-visible{outline:2px solid #BFD3F2;outline-offset:1px}
.spcInDot{display:none;width:7px;height:7px;border-radius:50%;background:var(--fail);margin-left:6px;box-shadow:0 0 0 1.5px #fff}
.spcInTab.has-err .spcInDot{display:inline-block}
.spcInPane[hidden]{display:none!important}
/* canvas */
#cvBlock{margin:8px 0 4px}
#cvTools{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:0 0 5px}
#cvTools button{font-family:var(--font-ui);font-size:8.5pt;padding:3px 7px;border:1px solid #C6CFDA;background:#fff;color:#2B3A4E;border-radius:4px;cursor:pointer;line-height:1.3;min-width:26px}
#cvTools button:hover{background:#EFF4FA;border-color:var(--blue-600)}
#cvTools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#cvTools button:disabled{opacity:.4;cursor:default}
#cvTools .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
#cvWrap{position:relative;border:1px solid #B9C8DB;border-radius:6px;background:#FCFDFE;height:clamp(340px,60vh,860px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cvSvg{display:block;width:100%;height:100%;cursor:default}
#cvSvg.panning{cursor:grabbing}
#cvSvg.adding{cursor:crosshair}
#cvSvg text{font-family:var(--font-ui);pointer-events:none}
#cvStatus{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-ui);font-size:8pt;color:#5A6B80;padding:3px 2px}
#cvTip{position:absolute;pointer-events:none;background:rgba(22,48,79,.93);color:#fff;font-family:var(--font-ui);font-size:8pt;line-height:1.35;padding:4px 7px;border-radius:4px;white-space:nowrap;z-index:5;display:none}
#cvHint{position:absolute;left:8px;top:8px;background:#FEF6E7;border:1px solid #F0C36D;color:#7C4A03;font-family:var(--font-ui);font-size:8.5pt;padding:4px 8px;border-radius:4px;display:none;z-index:4;max-width:calc(100% - 16px)}
#ctxMenu{position:fixed;z-index:80;min-width:220px;max-width:min(330px,94vw);max-height:80vh;overflow:auto;background:#fff;border:1px solid #B9C8DB;border-radius:6px;box-shadow:0 8px 28px rgba(15,25,40,.25);padding:4px 0;font-family:var(--font-ui);font-size:9pt}
#ctxMenu[hidden]{display:none}
#ctxMenu .mi{display:flex;justify-content:space-between;gap:14px;padding:4px 12px;cursor:pointer;color:#1F2D3D;white-space:nowrap}
#ctxMenu .mi:hover,#ctxMenu .mi:focus{background:#E8F0FB;outline:none}
#ctxMenu .mi.dis{color:#A0AAB6;cursor:default;background:none}
#ctxMenu .mi .k{color:#8A97A8;font-size:8pt}
#ctxMenu .mh{padding:5px 12px 2px;font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#7C8CA3;border-top:1px solid var(--line);margin-top:3px}
#ctxMenu .mh:first-child{border-top:none;margin-top:0}
/* key properties */
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin:6px 0}
.kp .t{border:1px solid var(--line);border-radius:5px;padding:4px 8px;background:#FBFCFD;font-family:var(--font-ui)}
.kp .t .k{font-size:7.8pt;color:#64748B}
.kp .t .v{font-size:10.5pt;font-weight:600;color:var(--navy-900);font-family:var(--mono)}
.kp .t .v .u{font-family:var(--font-ui);font-size:8pt;font-weight:400;color:#7C8CA3;margin-left:3px}
.kp .t.na .v{color:#94A3B8;font-weight:400}
table.plist{border-collapse:collapse;width:100%;font-size:9pt;font-family:var(--font-ui)}
table.plist th{font-size:8pt;color:#64748B;text-align:left;padding:2px 3px;border-bottom:1px solid var(--line)}
table.plist td{padding:2px 3px;border-bottom:1px solid #EEF1F4;vertical-align:middle}
table.plist tr.sel td{background:#E3EDFA}
table.plist tr{cursor:pointer;user-select:none;-webkit-user-select:none}
table.plist .sw{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.25);vertical-align:-1px;margin-right:4px}
table.plist button{font-size:8pt;padding:0 5px;border:1px solid #C6CFDA;background:#fff;border-radius:3px;cursor:pointer;color:#2B3A4E}
.inlDims{display:flex;flex-wrap:wrap;align-items:center;gap:2px 3px;margin-top:2px;font-size:8.5pt;color:#475569}
.inlDims input,.inlDims select{user-select:text;-webkit-user-select:text;font-size:8.5pt;padding:1px 3px;height:auto}
.inlDims input{width:58px}
.inlDims select{max-width:150px}
.inlDims .il{font-style:italic;color:#334155}
#dimEd{position:absolute;z-index:6;display:none;background:#fff;border:1.5px solid #2563EB;border-radius:5px;padding:3px 5px;box-shadow:0 3px 10px rgba(15,23,42,.25);font-family:var(--font-ui);font-size:9pt;align-items:center;gap:4px}
#dimEd input{width:84px;font-size:10pt;padding:2px 4px}

<script>
/* BridgeXfer v1 — cross-tool hand-off helper. Spec: HANDOFF.md. Duplicated verbatim in each tool that sends or receives (CLAUDE.md §3). */
(function(){
  if(window.BridgeXfer) return;
  var NS='bridgeSuite.v1.';
  function lsOK(){ try{ var k='__bx_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
  function sharedProject(){
    try{ var m=JSON.parse(localStorage.getItem(NS+'projectMeta')||'null');
      if(m && m._schema==='bridge-project-meta' && m.fields) return { name:m.fields.projectName||'', bridgeId:m.fields.bridgeId||'' };
    }catch(e){}
    return null;
  }
  function stamp(channel, payload, producer, producerFile){
    var p={}; for(var k in payload) if(Object.prototype.hasOwnProperty.call(payload,k)) p[k]=payload[k];
    p.schemaVersion = p.schemaVersion || 1;
    p.producer = p.producer || producer || document.title;
    p.producerFile = p.producerFile || producerFile || decodeURIComponent((location.pathname.split('/').pop()||''));
    p.producedAt = new Date().toISOString();
    if(!p.project) p.project = sharedProject() || { name:'', bridgeId:'' };
    if(!p.notes) p.notes = [];
    return p;
  }
  function publish(channel, payload, producer, producerFile){
    if(!payload || !payload._schema) return { error:'payload has no _schema' };
    var p=stamp(channel, payload, producer, producerFile);
    if(!lsOK()) return { error:'Browser storage is not available. Use "Export hand-off (JSON)" instead.', payload:p };
    try{
      localStorage.setItem(NS+channel, JSON.stringify(p));
      localStorage.setItem(NS+channel+'.updatedAt', p.producedAt);
    }catch(e){ return { error:'Could not save hand-off (storage full?): '+e.message, payload:p }; }
    return { ok:true, payload:p };
  }
  function validate(p, schema, maxVersion){
    if(!p || typeof p!=='object') return 'not a hand-off object';
    if(p._schema!==schema) return 'wrong data type ('+(p._schema||'none')+'), expected '+schema;
    if(!(p.schemaVersion<= (maxVersion||1))) return 'newer format (v'+p.schemaVersion+') than this tool supports (v'+(maxVersion||1)+')';
    return null;
  }
  function read(channel, schema, maxVersion){
    var raw=null;
    try{ raw=localStorage.getItem(NS+channel); }catch(e){ return { error:'Browser storage is not available.' }; }
    if(!raw) return { error:'Nothing has been sent on this channel yet.' , empty:true };
    var p; try{ p=JSON.parse(raw); }catch(e){ return { error:'Stored hand-off is corrupt.' }; }
    var err=validate(p, schema, maxVersion); if(err) return { error:err };
    return { ok:true, payload:p };
  }
  function markAdopted(channel, receiverId, producedAt){
    try{ localStorage.setItem(NS+channel+'.adopted.'+receiverId, producedAt||''); }catch(e){}
  }
  function isNew(channel, receiverId){
    try{
      var at=localStorage.getItem(NS+channel+'.updatedAt'); if(!at) return false;
      return at!==localStorage.getItem(NS+channel+'.adopted.'+receiverId);
    }catch(e){ return false; }
  }
  function exportFile(channel, payload){
    var p=payload; if(!p){ try{ p=JSON.parse(localStorage.getItem(NS+channel)); }catch(e){} }
    if(!p) return { error:'Nothing to export.' };
    var blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(p._schema||channel)+'_'+(p.producedAt||'').slice(0,19).replace(/[:T]/g,'-')+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 60000);
    return { ok:true };
  }
  function importFile(file, schema, maxVersion, cb){
    var fr=new FileReader();
    fr.onload=function(){ var p; try{ p=JSON.parse(fr.result); }catch(e){ cb({ error:'File is not valid JSON.' }); return; }
      var err=validate(p, schema, maxVersion); cb(err? { error:err } : { ok:true, payload:p }); };
    fr.onerror=function(){ cb({ error:'Could not read file.' }); };
    fr.readAsText(file);
  }
  function describe(p){ return (p.producer||'?')+' — '+(p.producedAt? new Date(p.producedAt).toLocaleString():'?')+((p.project&&p.project.name)?' — '+p.project.name:''); }
  window.BridgeXfer={ NS:NS, publish:publish, read:read, validate:validate, markAdopted:markAdopted, isNew:isNew, exportFile:exportFile, importFile:importFile, describe:describe, sharedProject:sharedProject };
})();
</script>
<script>
/* Shared project info buttons (HANDOFF.md §4.1, channel bridgeSuite.v1.projectMeta). Uses window.BridgeXfer.
   map: [{shared:'<HANDOFF field>', key:'<this tool's field>', label:'<this tool's label>', accept:optional fn(v)->bool}]
   values: { <tool key>: <current value> } */
(function(){
  if(window.ProjMetaUI) return;
  var FIELDS=['projectName','bridgeId','jobNo','client','location','preparedBy','checkedBy','date'];
  function s(v){ return (v===undefined||v===null)?'':String(v); }
  function share(map, values, producer, producerFile){
    var fields={}; FIELDS.forEach(function(k){ fields[k]=''; });
    map.forEach(function(m){ fields[m.shared]=s(values[m.key]); });
    var r=window.BridgeXfer.publish('projectMeta', {_schema:'bridge-project-meta', project:{ name:fields.projectName, bridgeId:fields.bridgeId }, fields:fields}, producer, producerFile);
    if(r.error){ alert('Could not share project info: '+r.error); return r; }
    var lines=map.map(function(m){ return '  '+m.label+': '+(fields[m.shared]||'(blank)'); });
    alert('Project info shared with the other tools:\n\n'+lines.join('\n'));
    return r;
  }
  function use(map, values, receiverId){
    var r=window.BridgeXfer.read('projectMeta','bridge-project-meta',1);
    if(r.error){ alert('Shared project info: '+r.error+(r.empty?'\n\nOpen a tool that has project info and click "Share project info" first.':'')); return null; }
    var p=r.payload, f=(p.fields&&typeof p.fields==='object')?p.fields:{}, patch={}, lines=[], skipped=[];
    map.forEach(function(m){
      var v=s(f[m.shared]);
      if(v.trim()==='') return;                                   /* never blank a field */
      if(m.accept && !m.accept(v)){ skipped.push('  '+m.label+': "'+v+'" (not a valid value here)'); return; }
      if(v===s(values[m.key])) return;
      patch[m.key]=v; lines.push('  '+m.label+': "'+s(values[m.key])+'" → "'+v+'"');
    });
    if(!lines.length){ alert('Shared project info ('+window.BridgeXfer.describe(p)+') has nothing new for this tool.'+(skipped.length?'\n\nNot used:\n'+skipped.join('\n'):'')); return null; }
    if(!confirm('Use shared project info from '+window.BridgeXfer.describe(p)+'?\n\nThis will overwrite:\n'+lines.join('\n')+(skipped.length?'\n\nNot used:\n'+skipped.join('\n'):''))) return null;
    window.BridgeXfer.markAdopted('projectMeta', receiverId, p.producedAt);
    return patch;
  }
  window.ProjMetaUI={ share:share, use:use };
})();
/* Section Property Calculator: shared project info field map (header fields). */
var SPC_PROJ_MAP=[{shared:'projectName',key:'name',label:'Project'},

                  {shared:'client',key:'client',label:'Client'},
                  {shared:'preparedBy',key:'designer',label:'Prepared by'},
                  {shared:'checkedBy',key:'checker',label:'Checked by'},
                  {shared:'date',key:'date',label:'Date'}];
</script>

function wireKeys() {
  document.addEventListener('keydown', e => {
    const t = e.target, tag = (t && t.tagName) || '';

    if ($('prOverlay')) return;
    const k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (k === 'Escape') { closeMenu(); if (POLY) { cancelPoly(); return; } if (SEL.size) { SEL = new Set(); SELORD = []; rebuildInputs(); drawCanvas(); updateToolState(); } return; }
    if (POLY) { if (k === 'Enter') { e.preventDefault(); finishPoly(); } else if (k === 'Backspace') { e.preventDefault(); POLY.pts.pop(); polyHint(); drawCanvas(); } return; }
    if (ctrl && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (ctrl && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
    if (ctrl && (k === 'c' || k === 'C')) { if (SEL.size) { e.preventDefault(); copySel(); } return; }
    if (ctrl && (k === 'v' || k === 'V')) { e.preventDefault(); paste(); return; }
    if (ctrl && (k === 'd' || k === 'D')) { e.preventDefault(); actDuplicate(); return; }
    if (ctrl && (k === 'a' || k === 'A')) { e.preventDefault(); SEL = new Set(M.parts.map(p => p.id)); SELORD = M.parts.map(p => p.id); rebuildInputs(); drawCanvas(); updateToolState(); return; }
    if (ctrl) return;
    if (k === 'Delete' || k === 'Backspace') { if (SEL.size) { e.preventDefault(); actDelete(); } return; }
    if (k === 'h' || k === 'H') { actFlip('h'); return; }
    if (k === 'v' || k === 'V') { actFlip('v'); return; }
    if (k === 'r') { actRotate(90); return; } if (k === 'R') { actRotate(-90); return; }
    if (k === 'f' || k === 'F') { fitView(); return; }
    if (k === 'l' || k === 'L') { M.settings.labels = !M.settings.labels; updateToolState(); drawCanvas(); autosave(); return; }
    const st = (M.settings.nudge > 0 ? M.settings.nudge : 0.125) * (e.shiftKey ? 10 : 1);
    if (k === 'ArrowLeft') { e.preventDefault(); nudge(-st, 0); } else if (k === 'ArrowRight') { e.preventDefault(); nudge(st, 0); } else if (k === 'ArrowUp') { e.preventDefault(); nudge(0, st); } else if (k === 'ArrowDown') { e.preventDefault(); nudge(0, -st); }
  });

  window.addEventListener('blur', closeMenu);
}

      ['J', isNum(T.J) ? nf(T.J, 'I') : 'n/a', un('I'), { h: isNum(T.J) ? VFY : esc(T.why || '') }],
      ['C<sub>w</sub>', isNum(T.Cw) ? nf(T.Cw, 'W') : 'n/a', un('W'), { h: isNum(T.Cw) ? VFY : esc(T.cwWhy || '') }],
      ['Shear centre (x, y) from the origin', T.sc ? nf(T.sc[0], 'L') + ', ' + nf(T.sc[1], 'L') : 'n/a', un('L'), ''],
      ['x<sub>o</sub>, y<sub>o</sub> (shear centre from the centroid)', T.sc ? nf(T.xo, 'L') + ', ' + nf(T.yo, 'L') : 'n/a', un('L'), ''],
      ['r̄<sub>o</sub> = √(x<sub>o</sub>² + y<sub>o</sub>² + (I<sub>x</sub>+I<sub>y</sub>)/A)', T.sc ? nf(Math.sqrt(T.ro2), 'L') : 'n/a', un('L'), 'AISC 360-16 Eq. E4-9 form']
    ].map(r => r.map((c, i) => i === 0 ? { h: c } : c)), { left: [0, 3] }));
  });
  if (R.single) pg.appendChild(aisCompare(R.single));
  mkSec(pg, 'pParts', 'Parts', body => body.appendChild(partsTable()));
}
function partsTable() {
  return tblEl(['Label', 'Description', 'x (centroid)', 'y (centroid)', 'Rotation', 'Mirr.', 'n', 'A', 'Basis'], R.rows.map(r => {
    const p = partById(r.id);
    return [r.lbl, partDesc(p), nf(r.x, 'L'), nf(r.y, 'L'), (+(+p.rot || 0).toFixed(3)) + '°', p.mir ? 'yes' : '', String(+(r.n).toPrecision(4)), nf(r.A, 'A'), r.tab ? 'AISC tab.' : (p.type === 'shape' ? 'plate model' : 'geometry')];
  }), { left: [0, 1] });
}

/* ---- Calc detail ---- */
function buildCalc(pg) {
  const L = un('L'), A = un('A'), I = un('I');
  mkSec(pg, 'cTab', 'Parallel-axis table (each part about its own centroid, then transferred)', body => {
    body.appendChild(el('div', 'hint', 'Units: ' + L + ', ' + A + ', ' + un('S') + ', ' + I + '. Holes have negative A. Columns with n are transformed (multiplied by the modulus ratio n). d<sub>x</sub> = x̄<sub>i</sub> − x̄, d<sub>y</sub> = ȳ<sub>i</sub> − ȳ.'));
    const rows = R.rows.map(r => [r.lbl, String(+r.n.toPrecision(4)), nf(r.A, 'A'), nf(r.nA, 'A'), nf(r.x, 'L'), nf(r.y, 'L'), nf(r.Ax, 'S'), nf(r.Ay, 'S'), nf(r.Ixo, 'I'), nf(r.Iyo, 'I'), nf(r.Ixyo, 'I'), nf(r.dx, 'L'), nf(r.dy, 'L'), nf(r.Ady2, 'I'), nf(r.Adx2, 'I'), nf(r.Adxdy, 'I')]);
    const sm = k => R.rows.reduce((s, r) => s + r[k], 0);
    rows.push({ cls: 'gov', cells: [{ h: '<b>Σ</b>' }, '', '', { h: '<b>' + nf(sm('nA'), 'A') + '</b>' }, '', '', { h: '<b>' + nf(sm('Ax'), 'S') + '</b>' }, { h: '<b>' + nf(sm('Ay'), 'S') + '</b>' }, { h: '<b>' + nf(sm('Ixo'), 'I') + '</b>' }, { h: '<b>' + nf(sm('Iyo'), 'I') + '</b>' }, { h: '<b>' + nf(sm('Ixyo'), 'I') + '</b>' }, '', '', { h: '<b>' + nf(sm('Ady2'), 'I') + '</b>' }, { h: '<b>' + nf(sm('Adx2'), 'I') + '</b>' }, { h: '<b>' + nf(sm('Adxdy'), 'I') + '</b>' }] });
    body.appendChild(tblEl(['Part', 'n', 'A<sub>i</sub>', 'n·A<sub>i</sub>', 'x̄<sub>i</sub>', 'ȳ<sub>i</sub>', 'n·A·x̄', 'n·A·ȳ', 'n·I<sub>xo</sub>', 'n·I<sub>yo</sub>', 'n·I<sub>xyo</sub>', 'd<sub>x</sub>', 'd<sub>y</sub>', 'n·A·d<sub>y</sub>²', 'n·A·d<sub>x</sub>²', 'n·A·d<sub>x</sub>d<sub>y</sub>'], rows, { left: [0] }));
    body.appendChild(el('div', 'hint', 'I<sub>xo</sub>, I<sub>yo</sub>, I<sub>xyo</sub>: each part about its own centroid, in the section x–y directions (a rotated part\'s own inertia tensor is rotated: I′ = T·I·Tᵀ). Rolled shapes: plate model, unless "AISC tab." is ticked for that part.'));
  });
  const sA = R.A, sAx = R.rows.reduce((s, r) => s + r.Ax, 0), sAy = R.rows.reduce((s, r) => s + r.Ay, 0);
  mkSec(pg, 'cCen', 'Centroid', body => {
    calc(body, { title: 'Centroid from the origin', ref: 'statics', lines: [TX`\bar{x}=\frac{\Sigma n_i A_i \bar{x}_i}{\Sigma n_i A_i}=\frac{${nt(sAx, 'S')}}{${nt(sA, 'A')}}=${nt(R.cx, 'L')}\ \text{${L}}`, TX`\bar{y}=\frac{\Sigma n_i A_i \bar{y}_i}{\Sigma n_i A_i}=\frac{${nt(sAy, 'S')}}{${nt(sA, 'A')}}=${nt(R.cy, 'L')}\ \text{${L}}`], result: `x̄ = ${nu(R.cx, 'L')}, ȳ = ${nu(R.cy, 'L')}` });
  });
  mkSec(pg, 'cI', 'Moments of inertia about the centroid (parallel-axis theorem)', body => {
    const s = k => R.rows.reduce((a, r) => a + r[k], 0);
    calc(body, { title: 'I about the centroidal axes', ref: 'parallel-axis theorem', lines: [
      TX`I_x=\Sigma n_i\left(I_{xo,i}+A_i d_{y,i}^2\right)=${nt(s('Ixo'), 'I')}+${nt(s('Ady2'), 'I')}=${nt(R.Ix, 'I')}\ \text{${I}}`,
      TX`I_y=\Sigma n_i\left(I_{yo,i}+A_i d_{x,i}^2\right)=${nt(s('Iyo'), 'I')}+${nt(s('Adx2'), 'I')}=${nt(R.Iy, 'I')}\ \text{${I}}`,
      TX`I_{xy}=\Sigma n_i\left(I_{xyo,i}+A_i d_{x,i} d_{y,i}\right)=${nt(s('Ixyo'), 'I')}+${nt(s('Adxdy'), 'I')}=${nt(R.Ixy, 'I')}\ \text{${I}}`], result: '' });
    calc(body, { title: 'Section moduli and radii of gyration', ref: 'S = I/c, r = √(I/A)', lines: [
      TX`S_{x,top}=\frac{I_x}{c_{top}}=\frac{${nt(R.Ix, 'I')}}{${nt(R.ct, 'L')}}=${nt(R.Sxt, 'S')},\quad S_{x,bot}=\frac{${nt(R.Ix, 'I')}}{${nt(R.cb, 'L')}}=${nt(R.Sxb, 'S')}`,
      TX`S_{y,left}=\frac{I_y}{c_{left}}=\frac{${nt(R.Iy, 'I')}}{${nt(R.cl, 'L')}}=${nt(R.Syl, 'S')},\quad S_{y,right}=\frac{${nt(R.Iy, 'I')}}{${nt(R.cr, 'L')}}=${nt(R.Syr, 'S')}`,
      TX`r_x=\sqrt{I_x/A}=${nt(R.rx, 'L')},\quad r_y=\sqrt{I_y/A}=${nt(R.ry, 'L')}\ \text{${L}}`], result: '' });
  });
  mkSec(pg, 'cP', 'Principal axes', body => {
    calc(body, { title: 'Principal moments of inertia', ref: 'Mohr\'s circle', lines: [
      TX`I_{1,2}=\frac{I_x+I_y}{2}\pm\sqrt{\left(\frac{I_x-I_y}{2}\right)^2+I_{xy}^2}=${nt((R.Ix + R.Iy) / 2, 'I')}\pm${nt(Math.hypot((R.Ix - R.Iy) / 2, R.Ixy), 'I')}`,
      TX`I_1=${nt(R.I1, 'I')},\quad I_2=${nt(R.I2, 'I')}\ \text{${I}}`,
      TX`\theta_p=\tfrac{1}{2}\,\mathrm{atan2}\!\left(-2I_{xy},\ I_x-I_y\right)=${(R.thp * 180 / Math.PI).toFixed(4)}^{\circ}`,
      TX`r_{min}=\sqrt{I_2/A}=${nt(R.r2, 'L')}\ \text{${L}}`], result: 'θp: angle from +x to the major axis 1, counter-clockwise. Rotated-axis check: I(θp) = (Ix+Iy)/2 + (Ix−Iy)/2·cos2θp − Ixy·sin2θp = ' + nf((R.Ix + R.Iy) / 2 + (R.Ix - R.Iy) / 2 * Math.cos(2 * R.thp) - R.Ixy * Math.sin(2 * R.thp), 'I') + ' ' + I });
  });
  mkSec(pg, 'cG', 'Part geometry (plate model)', body => {
    body.appendChild(tblEl(['Part', 'Model', 'Dimensions'], M.parts.map(p => { const g = SPC.partGeom(p); return [p.lbl, (p.hole ? 'hole: ' : '') + (p.type === 'shape' ? g.desc + ' as plates' : SPC.TYPES[p.type].name), Object.keys(g.dims).map(k => k + ' = ' + nf(g.dims[k], 'L', 4)).join(', ') + (p.type === 'poly' ? (g.prims[0] ? g.prims[0].pts.length + ' vertices' : '') : '')]; }), { left: [0, 1, 2] }));
  });
}

/* ---- Plastic tab ---- */
function buildPlas(pg) {
  const S = un('S'), L = un('L'), A = un('A');
  pg.appendChild(el('div', 'note', 'Plastic neutral axis (PNA): the line that divides the (n-weighted) area into two equal halves, found by bisection on the exact area of each polygon and circle on one side of the line. Z = A<sub>above</sub>·d<sub>above</sub> + A<sub>below</sub>·d<sub>below</sub> (distances from the PNA to the centroids of the two halves). Geometry of the plate model (fillets neglected), also for parts set to "AISC tabulated".' + (R.anyN ? ' <b>Transformed (n-weighted) areas</b>: the PNA balances n·A, which is meaningful only when n is the ratio of yield strengths.' : '')));
  const blk = (title, p, axis, ref) => calc(pg, { title, ref: 'plastic section modulus', lines: [
    TX`\Sigma A_{above}=\Sigma A_{below}=\tfrac{A}{2}=${nt(R.Ageo / 2, 'A')}\ \text{${A}}\quad\Rightarrow\quad \text{PNA at } ${axis}=${nt(p.c, 'L')}\ \text{${L}}`,
    TX`Z=A_{1}d_{1}+A_{2}d_{2}=${nt(p.Aup, 'A')}\times${nt(p.dUp, 'L')}+${nt(p.Adn, 'A')}\times${nt(p.dDn, 'L')}=${nt(p.Z, 'S')}\ \text{${S}}`],
    result: `Z = ${nu(p.Z, 'S')}` + (p.flat ? ' (the PNA lies in a gap with no material: any position in the gap gives the same Z)' : '') });
  blk('Z<sub>x</sub> — bending about the x axis (PNA horizontal)', R.plX, 'y');
  blk('Z<sub>y</sub> — bending about the y axis (PNA vertical)', R.plY, 'x');
  blk('Z<sub>1</sub> — about the major principal axis', R.pl1, TX`s_2`);
  blk('Z<sub>2</sub> — about the minor principal axis', R.pl2, TX`s_1`);
  pg.appendChild(el('div', 'hint', 's<sub>1</sub>, s<sub>2</sub>: coordinates along the principal directions u<sub>1</sub> = (cos θp, sin θp), u<sub>2</sub> = (−sin θp, cos θp), measured from the origin.'));
  pg.appendChild(tblEl(['Shape factor', 'Value'], [['Z<sub>x</sub> / S<sub>x,min</sub>', nf(R.SFx, 'n', 4)], ['Z<sub>y</sub> / S<sub>y,min</sub>', nf(R.SFy, 'n', 4)], ['Z<sub>1</sub> / S<sub>1</sub>', nf(R.Z1 / R.S1, 'n', 4)], ['Z<sub>2</sub> / S<sub>2</sub>', nf(R.Z2 / R.S2, 'n', 4)]].map(r => [{ h: r[0] }, r[1]]), { left: [0] }));
}

/* ---- Torsion tab ---- */
function buildTors(pg) {
  const T = R.tors, I = un('I'), L = un('L');
  pg.appendChild(el('div', 'warnBox', '<b>Thin-wall approximation — verify.</b> St. Venant J and the warping constant C<sub>w</sub> are computed on the centre-line model of the plates (thin-walled beam theory, e.g. AISC Design Guide 9, Seaburg &amp; Carter 1997; Vlasov). Fillets are neglected. Results are approximate; for thick or stocky parts, check by another method.'));
  (T.warn || []).forEach(w => pg.appendChild(el('div', 'warnBox', esc(w))));
  (T.notes || []).forEach(w => pg.appendChild(el('div', 'note', esc(w))));
  mkSec(pg, 'tCon', 'Contacts (parts that touch are connected for torsion)', body => {
    if (!T.contacts.length) { body.appendChild(el('div', 'hint', 'No parts touch each other.')); return; }
    body.appendChild(el('div', 'hint', 'Touching parts are assumed connected continuously (welded or continuously bolted) along the contact. Untick a contact to treat the two parts as separate for torsion (e.g. stitch-bolted or intermittently welded). Area properties are not affected.'));
    const t = el('table', 'tbl'); t.appendChild(el('tr', null, '<th>Connected</th><th class="lft">Parts</th>'));
    T.contacts.forEach(c => {
      const tr = el('tr'); const td = el('td'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = c.on;
      cb.addEventListener('change', () => { pushUndo(); const off = new Set(M.contacts.off); if (cb.checked) off.delete(c.key); else off.add(c.key); M.contacts.off = [...off]; afterGeo(false); });
      td.appendChild(cb); tr.appendChild(td); tr.appendChild(el('td', 'lft', esc(c.la + ' — ' + c.lb))); t.appendChild(tr);
    });
    body.appendChild(t);
  });
  mkSec(pg, 'tJ', 'St. Venant torsion constant J', body => {
    T.comps.forEach((C, ci) => {
      const head = `<b>${T.comps.length > 1 ? 'Piece ' + (ci + 1) + ': ' : ''}${esc(C.parts.join(', '))}</b> — ${C.J === null ? 'n/a: ' + esc(C.why) : esc(C.method)}`;
      body.appendChild(el('div', 'subh', head));
      if (C.J === null) return;
      if (C.rect) calc(body, { title: 'Solid rectangle', ref: 'Roark (Young & Budynas 7th Ed.) Table 10.7 case 4', lines: [TX`J=b t^3\left[\tfrac13-0.21\tfrac{t}{b}\left(1-\tfrac{t^4}{12b^4}\right)\right]=${nt(C.rect.b, 'L')}\times${nt(C.rect.t, 'L')}^3\left[\ldots\right]=${nt(C.J, 'I')}\ \text{${I}}`], result: 'J = ' + nu(C.J, 'I') });
      else if (C.circ && C.circ.d) calc(body, { title: 'Solid circle', ref: 'exact', lines: [TX`J=\frac{\pi d^4}{32}=${nt(C.J, 'I')}\ \text{${I}}`], result: 'J = ' + nu(C.J, 'I') });
      else if (C.circ) calc(body, { title: 'Circular tube', ref: 'exact (thick-walled)', lines: [TX`J=\frac{\pi\left(D^4-d^4\right)}{32}=${nt(C.J, 'I')}\ \text{${I}}`], result: 'J = ' + nu(C.J, 'I') });
      else {
        if (C.open.length) {
          const rows = C.open.map(o => [o.src + (o.ext ? ' (extension to a junction)' : ''), nf(o.L, 'L'), nf(o.t, 'L'), nf(o.L / o.t, 'n', 3), nf(o.j, 'I')]);
          rows.push({ cls: 'gov', cells: [{ h: '<b>Σ open</b>' }, '', '', '', { h: '<b>' + nf(C.Jo, 'I') + '</b>' }] });
          body.appendChild(tblEl(['Element', 'b (centre-line length)', 't', 'b/t', 'b·t³/3'], rows, { left: [0] }));
          calc(body, { title: 'Open elements', ref: 'AISC Design Guide 9 (thin-walled open sections)', lines: [TX`J_{open}=\Sigma\frac{b\,t^3}{3}=${nt(C.Jo, 'I')}\ \text{${I}}`], result: '' });
          if (C.stocky && C.stocky.length) body.appendChild(el('div', 'warnBox', 'Element(s) with b/t &lt; 10 (' + esc([...new Set(C.stocky)].join(', ')) + '): bt³/3 overestimates J of stocky plates (a square bar: bt³/3 = 0.333b⁴ vs 0.141b⁴ exact).'));
        }
        if (C.merges && C.merges.length) body.appendChild(el('div', 'note', 'Plates in face contact are combined over their overlap into one element of thickness t₁ + t₂ (continuous connection along both edges assumed): ' + esc([...new Set(C.merges.map(m => m.a + ' + ' + m.b))].join('; ')) + '.'));
        C.cells.forEach((c, k) => {
          const wr = c.walls.filter(w => !w.link).map(w => [w.src + (w.ext ? ' (ext.)' : ''), nf(w.L, 'L'), nf(w.t, 'L'), nf(w.w, 'n')]);
          wr.push({ cls: 'gov', cells: [{ h: '<b>∮ds/t</b>' }, '', '', { h: '<b>' + nf(c.dsT, 'n') + '</b>' }] });
          body.appendChild(el('div', 'subh', 'Closed cell ' + (k + 1) + ': enclosed (centre-line) area A<sub>m</sub> = ' + esc(nu(c.A, 'A'))));
          body.appendChild(tblEl(['Wall', 's (length)', 't', 's/t'], wr, { left: [0] }));
        });
        if (C.cells.length === 1) { const c = C.cells[0]; calc(body, { title: 'Closed cell (Bredt)', ref: 'Bredt–Batho; AISC Design Guide 9', lines: [TX`J_{closed}=\frac{4A_m^2}{\oint ds/t}=\frac{4\times${nt(c.A, 'A')}^2}{${nt(c.dsT, 'n')}}=${nt(C.Jc, 'I')}\ \text{${I}}`], result: '' }); }
        else if (C.cells.length > 1) calc(body, { title: 'Multi-cell section', ref: 'thin-walled multi-cell torsion (shear flows q_i)', lines: [TX`\oint_i \frac{q\,ds}{t}=2A_{m,i}\ (G\theta=1)\ \Rightarrow\ q_i;\qquad J=2\Sigma A_{m,i}\,q_i=${nt(C.Jc, 'I')}\ \text{${I}}`], result: 'Cells: ' + C.cells.map((c, i) => `A${i + 1} = ${nf(c.A, 'A')}, q${i + 1} = ${nf(c.q, 'n', 4)}`).join('; ') });
        if (C.cells.length) body.appendChild(el('div', 'hint', 'The b·t³/3 terms of the cell walls (Σ = ' + esc(nu(C.JwallOpen, 'I')) + ') are not added (small compared with the closed-cell term).'));
        calc(body, { title: 'J of this piece', ref: '', lines: [TX`J=J_{closed}+J_{open}=${nt(C.Jc || 0, 'I')}+${nt(C.Jo || 0, 'I')}=${nt(C.J, 'I')}\ \text{${I}}`], result: 'J = ' + nu(C.J, 'I'), badge: VFY });
      }
    });
    if (T.comps.length > 1) body.appendChild(el('div', T.J === null ? 'errBox' : 'okBox', T.J === null ? 'J = n/a (see above)' : 'J = Σ of the separate pieces = ' + esc(nu(T.J, 'I')) + ' (pieces not connected twist independently)'));
  });
  mkSec(pg, 'tCw', 'Shear centre and warping constant C<sub>w</sub>', body => {
    if (!isNum(T.Cw)) { body.appendChild(el('div', 'note', 'C<sub>w</sub> and the shear centre: n/a — ' + esc(T.cwWhy || 'not computed'))); return; }
    const S = T.sect;
    if (S) {
      calc(body, { title: 'Sectorial coordinates (open thin-walled section)', ref: 'Vlasov; AISC Design Guide 9 App. C', lines: [
        TX`\omega_B(s)=\int_0^s r_B\,ds\ \ (\text{pole }B=\text{centroid of the centre-line model})`,
        TX`x_o=\frac{I_y I_{\omega x}-I_{xy}I_{\omega y}}{I_xI_y-I_{xy}^2},\qquad y_o=\frac{I_{xy}I_{\omega x}-I_xI_{\omega y}}{I_xI_y-I_{xy}^2}\quad(I_{\omega x}=\textstyle\int\omega_B\,y\,t\,ds,\ I_{\omega y}=\int\omega_B\,x\,t\,ds)`,
        TX`C_w=\int\omega_n^2\,t\,ds,\qquad \omega_n=\omega_S-\tfrac{1}{A}\textstyle\int\omega_S\,t\,ds`,
        TX`C_w=${nt(T.Cw, 'W')}\ \text{${un('W')}}`], result: `Shear centre at (${nf(T.sc[0], 'L')}, ${nf(T.sc[1], 'L')}) ${L}; from the centroid x_o = ${nf(T.xo, 'L')}, y_o = ${nf(T.yo, 'L')} ${L}`, badge: VFY });
      body.appendChild(el('div', 'hint', `Centre-line model: A = ${esc(nu(S.A, 'A'))}, centroid (${esc(nf(S.cx, 'L'))}, ${esc(nf(S.cy, 'L'))}), I<sub>x</sub> = ${esc(nu(S.Ix, 'I'))}, I<sub>y</sub> = ${esc(nu(S.Iy, 'I'))} (no t³/12 terms). Check: with the pole at the shear centre, ∫ω·x·t ds = ${esc(nf(S.check.Iwy, 'n', 3))} and ∫ω·y·t ds = ${esc(nf(S.check.Iwx, 'n', 3))} (should be ≈ 0). Thin-wall theory gives C<sub>w</sub> = 0 for sections whose elements all meet at one point (angles, tees, cruciforms); AISC tabulates small non-zero values for those.`));
    } else body.appendChild(el('div', 'note', esc(T.cwMethod) + ': C<sub>w</sub> = ' + esc(nu(T.Cw, 'W'))));
  });
}

/* ---- Q tab ---- */
function buildQ(pg) {
  const q = M.q;
  mkSec(pg, 'qIn', 'Cut line', body => {
    chkRow(body, 'Show the cut line on the drawing (drag it there)', chkIn(() => q.on, v => { q.on = v; if (v && !isNum(q.pos)) q.pos = q.dir === 'v' ? R.cx : R.cy; }, 'q_on', false));
    fRow(body, 'Direction', selIn([['h', 'horizontal cut (Q about the x axis; shear V parallel to y)'], ['v', 'vertical cut (Q about the y axis; shear V parallel to x)']], () => q.dir, v => { q.dir = v; q.pos = v === 'v' ? R.cx : R.cy; }, 'q_dir', false), '');
    fRow(body, q.dir === 'v' ? 'Cut at x' : 'Cut at y', numIn(() => qPos(), v => { q.pos = v; }, 'q_pos', { k: 'L' }), un('L'));
    const r = el('div', 'btnRow'); r.appendChild(btn('At the centroid', 'sm', () => { q.pos = q.dir === 'v' ? R.cx : R.cy; compute(); renderOutput(); drawCanvas(); autosave(); })); body.appendChild(r);
    fRow(body, 'Shear force V (optional)', numIn(() => q.V, v => { q.V = v; }, 'q_V', { k: 'F', blank: true, ph: 'none' }), un('F'), 'Phase 1: Q is the property; enter V to see q = V·Q/I and the average shear stress on the cut.');
  });
  if (!q.on) { pg.appendChild(el('div', 'note', 'Tick "Show the cut line" (or use the Q cut button on the drawing toolbar) to compute Q.')); return; }
  const Qr = SPC.qcut(R, q.dir, qPos(), q.V); if (!Qr) return;
  const hv = q.dir === 'v', ax = hv ? 'y' : 'x';
  mkSec(pg, 'qRes', 'First moment of area Q and shear flow', body => {
    calc(body, { title: `Q of the part ${hv ? 'to the right of' : 'above'} the cut, about the centroidal ${ax} axis`, ref: 'Q = A′·ȳ′', lines: [
      hv ? TX`Q_y=A'\left(\bar{x}'-\bar{x}\right)=${nt(Qr.Aup, 'A')}\times${nt(Qr.Aup ? Qr.Qy / Qr.Aup : 0, 'L')}=${nt(Qr.Qy, 'S')}\ \text{${un('S')}}` : TX`Q_x=A'\left(\bar{y}'-\bar{y}\right)=${nt(Qr.Aup, 'A')}\times${nt(Qr.Aup ? Qr.Qx / Qr.Aup : 0, 'L')}=${nt(Qr.Qx, 'S')}\ \text{${un('S')}}`],

    const g = (c, v) => ent.push(String(c).padStart(3), String(v));

    const pline = (ly, pts, closed = true) => { g(0, 'POLYLINE'); g(8, ly); g(66, 1); g(10, 0); g(20, 0); g(30, 0); g(70, closed ? 1 : 0);
      pts.forEach(q => { g(0, 'VERTEX'); g(8, ly); g(10, fmt(q[0])); g(20, fmt(q[1])); g(30, 0); grow(q[0], q[1]); }); g(0, 'SEQEND'); g(8, ly); };
