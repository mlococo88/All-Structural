/* =====================================================================
   COMPOSITE CONSTRUCTION STAGE
   Unshored erection is usually what sizes the beam: the bare steel
   section carries the wet concrete. Shored construction is checked
   differently and says so.
   ===================================================================== */
function constrCfg(){
  const c=compCfg();
  if(!c.constr)c.constr={};
  const d={shored:false,trib:null,deckPsf:2,consLL:25,superDL:0,LL:0,
    Lb:null,camber:0,denPre:360,absPre:1.0,denLL:360,denTot:240,LLpct:100};
  Object.keys(d).forEach(k=>{if(c.constr[k]===undefined)c.constr[k]=d[k];});
  return c.constr;
}
function constructionStage(p,r){
  const c=compCfg(),k=constrCfg();
  const out={warns:[],notes:[]};
  const L=(c.L>0)?c.L:(isMember()?(S.member.Lb||0):totalL());
  if(!(L>0))return{blocked:'Enter the composite span L to run the construction-stage check.'};
  out.L=L;
  const g=slabGeom(c);
  const trib=(k.trib!=null&&k.trib>0)?k.trib:((c.sLeft||0)+(c.sRight||0))/2;
  out.trib=trib;
  const fill=(c.orient==='perp')?(c.ribFill!=null?c.ribFill:0.5):
             (c.orient==='para')?(c.ribFill!=null?c.ribFill:1.0):0;
  const tEq=g.tSolid+fill*g.hr+g.haunch;
  out.tEq=tEq;
  out.wSlab=trib*(tEq/12)*(c.wc||145)/1000;
  out.wDeck=trib*(k.deckPsf||0)/1000;
  out.wSelf=(p.Wt||0)/1000;
  out.wDpre=out.wSlab+out.wDeck+out.wSelf;
  out.wLpre=trib*(k.consLL||0)/1000;
  out.wSuper=trib*(k.superDL||0)/1000;
  out.wLL=trib*(k.LL||0)/1000;
  out.shored=!!k.shored;
  /* --- strength: bare steel under wet concrete (simple span assumed) --- */
  const Lb=(k.Lb!=null&&k.Lb>0)?k.Lb:L;
  out.Lb=Lb;
  const cap=flexFor(p,'x',Lb*12,1);
  out.cap=cap;
  out.phiMn=cap.blocked?0:cap.phiMn/12;
  out.wu=1.2*out.wDpre+1.6*out.wLpre;
  out.Mu=out.wu*L*L/8;
  out.dcrM=out.shored?null:(out.Mu/(out.phiMn||1e-9));
  const sh=shearMajor(p,null,S.design.stiff);
  out.phiVn=sh.phi*sh.Vn;out.shRoute=sh.route;
  out.Vu=out.wu*L/2;
  out.dcrV=out.shored?null:(out.Vu/(out.phiVn||1e-9));
  /* --- deflection --- */
  const dfl=(w,I)=>5*w*1728*Math.pow(L,4)/(384*EKSI*I);
  out.dPre=dfl(out.wDpre,p.Ix);
  out.camber=k.camber||0;
  out.dPreNet=out.dPre-out.camber;
  const dnP=(k.denPre==null||k.denPre==='')?360:k.denPre;
  out.limPre=Math.min(dnP>0?L*12/dnP:Infinity,(k.absPre>0)?k.absPre:Infinity);
  if(!isFinite(out.limPre))out.limPre=null;
  out.dcrPre=(out.shored||out.limPre==null)?null:(out.dPreNet/out.limPre);
  const I2=(r&&!r.blocked&&r.ILB)?r.ILB:p.Ix;
  out.ILB=I2;
  out.dSuper=dfl(out.wSuper,I2);
  const llp=(k.LLpct==null||k.LLpct==='')?100:k.LLpct;
  out.dLL=dfl(out.wLL*(llp/100),I2);
  const dnL=(k.denLL==null||k.denLL==='')?360:k.denLL;
  out.limLL=dnL>0?L*12/dnL:null;
  out.dcrLL=out.limLL==null?null:out.dLL/out.limLL;
  out.dTot=(out.shored?0:out.dPreNet)+out.dSuper+out.dLL;
  const dnT=(k.denTot==null||k.denTot==='')?240:k.denTot;
  out.limTot=dnT>0?L*12/dnT:null;
  out.dcrTot=out.limTot==null?null:out.dTot/out.limTot;
  if(out.shored)out.notes.push('Shored construction: the wet concrete is carried by the shores, so the bare steel section is not checked for it. When the shores are struck the <b>entire</b> dead load acts on the composite section \u2014 the total deflection below reflects that, and the pre-composite rows are omitted.');
  else{
    if(out.dcrM>1)out.warns.push('The bare steel section is overstressed under wet concrete \u2014 the construction stage governs, not the composite stage.');
    if(out.dcrPre>1)out.warns.push('Pre-composite deflection exceeds the limit. Increase the section or add camber; AISC Design Guide 3 recommends the lesser of L/360 and 1 in for concrete plus self weight.');
  }
  if(k.Lb==null)out.notes.push('The construction unbraced length defaults to the full span. If the deck is attached as it is laid it braces the top flange, and a shorter L\u1D47 may be justified \u2014 state it explicitly rather than relying on the default.');
  out.simpleOnly=true;
  return out;
}
/* =====================================================================
   COMPOSITE CROSS SECTION  (Plotly, to scale)
   Steel shape, haunch, deck ribs, slab, the plastic neutral axis and
   the plastic stress blocks that produced Mn.
   ===================================================================== */
function compXsecFig(p,r,opts){
  opts=opts||{};
  const c=compCfg(),g=slabGeom(c);
  const shapes=[],anns=[],data=[];
  const beff=r.ew.beff, Ycon=g.Ycon, hr=g.hr, ha=g.haunch, ts=g.tSolid;
  const STEEL='#5B7290',EDGE='#16304F',CONC='#C9CFD6',CEDGE='#8A929B';
  const COMP='#B42318',TENS='#1D4ED8';
  /* --- concrete: solid slab --- */
  shapes.push({type:'rect',x0:-beff/2,x1:beff/2,y0:ha+hr,y1:Ycon,
    fillcolor:CONC,opacity:.75,line:{color:CEDGE,width:1.2},layer:'below'});
  /* --- deck ribs: draw the counted fraction solid, the rest as voids --- */
  if(hr>0){
    const wrIn=Math.max(1,c.wr||6);
    const pitch=wrIn*2;
    const n=Math.max(1,Math.round(beff/pitch));
    const fill=(c.orient==='perp')?(c.ribFill!=null?c.ribFill:0.5):
               (c.orient==='para')?(c.ribFill!=null?c.ribFill:1.0):0;
    for(let i=0;i<n;i++){
      const x0=-beff/2+i*(beff/n),x1=x0+(beff/n)*Math.max(0.05,Math.min(1,fill));
      shapes.push({type:'rect',x0,x1,y0:ha,y1:ha+hr,fillcolor:CONC,opacity:.75,
        line:{color:CEDGE,width:0.8},layer:'below'});
    }
    shapes.push({type:'rect',x0:-beff/2,x1:beff/2,y0:ha,y1:ha+hr,fillcolor:'rgba(0,0,0,0)',
      line:{color:CEDGE,width:1.2,dash:'dot'}});
    anns.push({x:-beff/2,y:ha+hr/2,text:' deck ribs \u2014 '+fmt(100*fill,0)+'% counted',showarrow:false,
      xanchor:'left',font:{size:8.5,color:'#5A6B80'},bgcolor:'rgba(255,255,255,.8)'});
  }
  if(ha>0)shapes.push({type:'rect',x0:-p.bf/2*1.3,x1:p.bf/2*1.3,y0:0,y1:ha,
    fillcolor:CONC,opacity:.6,line:{color:CEDGE,width:1},layer:'below'});
  /* --- steel shape, top of steel at y = 0 --- */
  const gm=xsecGeom(p);
  const sPath=gm.paths.map(pa=>'M '+pa.map(q=>fmt(q[0],4)+','+fmt(q[1]-p.d/2,4)).join(' L ')+' Z').join(' ');
  shapes.push({type:'path',path:sPath,fillcolor:STEEL,opacity:.6,fillrule:'evenodd',
    line:{color:EDGE,width:1.5}});
  /* --- stress blocks --- */
  if(!opts.noStress){
    shapes.push({type:'rect',x0:-beff/2,x1:beff/2,y0:Ycon-r.a,y1:Ycon,
      fillcolor:COMP,opacity:.35,line:{color:COMP,width:1}});
    anns.push({x:beff/2,y:Ycon-r.a/2,text:'0.85f\u2032c   C = '+fmt(r.C,0)+' kip ',showarrow:false,
      xanchor:'right',font:{size:9,color:'#7A1710'},bgcolor:'rgba(255,255,255,.85)'});
    if(r.x>0){
      shapes.push({type:'rect',x0:-p.bf/2,x1:p.bf/2,y0:-Math.min(r.x,p.tf),y1:0,
        fillcolor:COMP,opacity:.5,line:{width:0}});
      if(r.x>p.tf)shapes.push({type:'rect',x0:-p.tw/2,x1:p.tw/2,y0:-r.x,y1:-p.tf,
        fillcolor:COMP,opacity:.5,line:{width:0}});
    }
    shapes.push({type:'rect',x0:-p.bf/2,x1:p.bf/2,y0:-p.d,y1:-p.d+p.tf,
      fillcolor:TENS,opacity:.35,line:{width:0}});
    shapes.push({type:'rect',x0:-p.tw/2,x1:p.tw/2,y0:-p.d+p.tf,y1:-Math.max(r.x,p.tf),
      fillcolor:TENS,opacity:.35,line:{width:0}});
    if(r.x<p.tf)shapes.push({type:'rect',x0:-p.bf/2,x1:p.bf/2,y0:-p.tf,y1:-r.x,
      fillcolor:TENS,opacity:.35,line:{width:0}});
    anns.push({x:p.bf/2,y:-p.d+p.tf/2,text:' F\u1D67 tension ',showarrow:false,xanchor:'left',
      font:{size:8.5,color:'#123A8A'},bgcolor:'rgba(255,255,255,.85)'});
  }
  /* --- PNA --- */
  const yPNA=(r.x>0)?-r.x:(Ycon-r.a);
  shapes.push({type:'line',x0:-beff/2,x1:beff/2,y0:yPNA,y1:yPNA,
    line:{color:'#B45309',width:2,dash:'dashdot'}});
  anns.push({x:-beff/2,y:yPNA,text:'PNA'+(r.x>0?(' \u2014 '+fmt(r.x,3)+' in below top of steel'):' in the slab')+' ',
    showarrow:false,xanchor:'left',yshift:9,font:{size:9,color:'#B45309'},bgcolor:'rgba(255,255,255,.9)'});
  /* --- dimensions --- */
  const padX=beff*0.09, padY=(Ycon+p.d)*0.30, pad=Math.min(padX,padY);
  const dimH=(x0,x1,y,txt)=>{
    shapes.push({type:'line',x0,x1,y0:y,y1:y,line:{color:'#64748B',width:1}});
    [x0,x1].forEach(x=>shapes.push({type:'line',x0:x,x1:x,y0:y-pad*0.18,y1:y+pad*0.18,line:{color:'#64748B',width:1}}));
    anns.push({x:(x0+x1)/2,y,text:txt,showarrow:false,yshift:10,font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.9)'});
  };
  const dimV=(y0,y1,x,txt)=>{
    shapes.push({type:'line',x0:x,x1:x,y0,y1,line:{color:'#64748B',width:1}});
    [y0,y1].forEach(y=>shapes.push({type:'line',x0:x-pad*0.18,x1:x+pad*0.18,y0:y,y1:y,line:{color:'#64748B',width:1}}));
    anns.push({x,y:(y0+y1)/2,text:txt,showarrow:false,textangle:-90,xshift:-11,
      font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.9)'});
  };
  dimH(-beff/2,beff/2,-p.d-padY*0.55,'b<sub>eff</sub> = '+fmt(beff,1)+'" = '+fmt(r.ew.beffFt,2)+' ft');
  dimV(0,Ycon,beff/2+padX*0.80,'Y<sub>con</sub> = '+fmt(Ycon,2)+'"');
  dimV(-p.d,0,-beff/2-padX*0.80,'d = '+fmt(p.d,2)+'"');
  if(hr>0)dimV(ha,ha+hr,-beff/2-padX*0.32,'h<sub>r</sub> = '+fmt(hr,2)+'"');
  dimV(Ycon-r.a,Ycon,-beff/2+padX*0.32,'a = '+fmt(r.a,2)+'"');
  const hov=[{x:0,y:Ycon-r.a/2,t:'Compression block<br>a = '+fmt(r.a,3)+' in<br>C = '+fmt(r.C,1)+' kip'},
    {x:0,y:-p.d/2,t:p.lbl+'<br>A\u209b = '+fmt(p.A,2)+' in\u00B2<br>A\u209bF\u1D67 = '+fmt(r.Py,0)+' kip'},
    {x:0,y:(ha+hr+Ycon)/2,t:'Solid slab '+fmt(ts,2)+' in<br>f\u2032c = '+fmt(c.fc,2)+' ksi'}];
  data.push({x:hov.map(h=>h.x),y:hov.map(h=>h.y),mode:'markers',
    marker:{size:16,color:'rgba(0,0,0,0)'},hoverinfo:'text',text:hov.map(h=>h.t),showlegend:false});
  const xr=[-beff/2-padX*1.6,beff/2+padX*1.6],yr=[-p.d-padY*1.0,Ycon+padY*0.45];
  return{data,layout:{
    title:opts.title?{text:opts.title,font:{size:11,family:'Arial'},x:0}:undefined,
    margin:{l:28,r:28,t:opts.title?28:14,b:26},height:opts.height||400,
    xaxis:{range:xr,visible:false},
    yaxis:{range:yr,visible:false,scaleanchor:'x',scaleratio:1},
    shapes,annotations:anns,showlegend:false,
    paper_bgcolor:'#fff',plot_bgcolor:'#fff',hovermode:'closest'}};
}
function compXsecBlock(body,p,r,opts){
  const id=(opts&&opts.id)||'xsecComp';
  plotHolder(body,id,(opts&&opts.height)||400);
  regPlot(id,compXsecFig(p,r,opts||{}));
  body.appendChild(el('div','hint','Drawn to scale (equal x and y scales) from the resolved geometry. Red is the plastic compression block, blue the yielded tension zone, and the dash-dot line is the plastic neutral axis that produced M\u2099 above. Deck ribs are drawn at the fraction of rib concrete counted in A\u1D9C \u2014 the drawn rib pitch is indicative, not a deck profile.'));
}
/* ---- construction-stage inputs ---- */

  body.appendChild(el('div','hint','A <b>simple span</b> is assumed for the construction-stage moments, shears and deflections \u2014 stated in the output. For a continuous or otherwise loaded beam, check the pre-composite condition in beam analysis mode with composite switched off.'));

/* ---- construction-stage output ---- */

     ['Metal deck','pre-composite',cs.wDeck,cs.shored?'shores':'bare steel'],

      .forEach(rw=>{const tr=el('tr');

   checks every region against whichever capacity applies. Positive
   moment (slab in compression) uses the Chapter I composite strength;
   negative moment uses the bare steel section, because the slab is in
   tension there and contributes nothing.

function applyCompositeToRegions(A,D){
  const c=A&&A.comp;
  if(!c||c.blocked||!D||!D.perCombo)return;
  const phiC=c.phiMn/12;
  D.compActive=true;D.compPhiMn=phiC;
  let anyPos=false,anyNeg=false;
  D.perCombo.forEach(C=>{
    (C.regions||[]).forEach(r=>{
      if(r.sign>0){
        anyPos=true;
        r.basis='composite';
        r.steelPhiMn=r.phiMn;
        r.steelGov=r.cap&&r.cap.gov?r.cap.gov.name:null;
        r.phiMn=phiC;
        r.LbFt=0;                  /* the cured slab braces the compression flange continuously */
        r.Cb=1;
        r.blocked=null;
        r.cap={route:'I3.2a',blocked:null,ls:[],Lb:null,Cb:null,
          gov:{name:'Composite plastic moment',clause:'\u00A7I3.2a(1)'}};
        r.dcr=r.Mu/(phiC||1e-9);
      }else{anyNeg=true;r.basis='steel';}
    });
    C.flexGov=(C.regions||[]).reduce((m,r)=>r.dcr>(m?m.dcr:-1)?r:m,null);
  });
  D.compAnyPos=anyPos;D.compAnyNeg=anyNeg;
  /* governing positive-moment result, for the Composite tab */
  let g=null;
  D.perCombo.forEach(C=>(C.regions||[]).forEach(r=>{
    if(r.basis==='composite'&&(!g||r.dcr>g.dcr))g={dcr:r.dcr,Mu:r.Mu,name:C.name,r};
  }));
  D.compGov=g;
}

/* =====================================================================
   COMPOSITE INPUT INHERITANCE
   Anything the model already knows is inherited rather than retyped.
   Every inherited value is displayed next to the field it fills, so
   nothing is silently assumed.
   ===================================================================== */
function compInherit(){
  const c=compCfg(),k=constrCfg(),out={};
  const mem=(typeof isMember==='function')&&isMember();
  const tribOn=!mem&&S.trib&&S.trib.on;
  /* span: §I3.1a is written per span, not for the whole member */
  if(mem)out.L={v:S.member.Lb||null,src:'unbraced length in Member Check mode'};
  else{
    const spans=(S.geom&&S.geom.spans)||[];
    const lg=spans.length?Math.max.apply(null,spans.map(s=>s.L)):null;
    out.L={v:lg,src:spans.length>1?('longest span of '+spans.length+' \u2014 \u00A7I3.1a is per span'):'span length'};
  }
  /* beam spacing from the tributary widths already entered */
  if(tribOn&&S.trib.twL>0)out.sLeft={v:2*S.trib.twL,src:'2 \u00D7 left tributary width'};
  if(tribOn&&S.trib.twR>0)out.sRight={v:2*S.trib.twR,src:'2 \u00D7 right tributary width'};
  /* construction tributary width */
  if(tribOn&&(S.trib.twL>0||S.trib.twR>0))
    out.trib={v:(S.trib.twL||0)+(S.trib.twR||0),src:'left + right tributary width'};
  else{
    const sl=(c.sLeft!=null?c.sLeft:(out.sLeft?out.sLeft.v:0)),sr=(c.sRight!=null?c.sRight:(out.sRight?out.sRight.v:0));
    if(sl||sr)out.trib={v:(sl+sr)/2,src:'half the beam spacing each side'};
  }
  /* post-composite pressures from the tributary generator */
  if(tribOn&&S.trib.p){
    if(S.trib.p.DL>0)out.superDL={v:S.trib.p.DL,src:'DL pressure in the tributary generator'};
    if(S.trib.p.LL>0)out.LL={v:S.trib.p.LL,src:'LL pressure in the tributary generator'};
  }
  return out;
}
function inhVal(key,own){
  const i=compInherit()[key];

  return{v:i?i.v:null,src:i?i.src:null,own:false};

function inhHint(key,own,unit,extra){
  const r=inhVal(key,own);
  if(r.own)return extra||'';
  if(r.v==null)return (extra?extra+' ':'')+'<b>no value available to inherit \u2014 enter one</b>';

/* merged configuration actually used by the engines */
function compEffCfg(){
  const c=compCfg(),k=constrCfg();

  const dnT=(k.denTot==null||k.denTot==='')?240:k.denTot;

/* =====================================================================

   Loads that act before the concrete cures deflect the bare steel
   section; loads applied afterwards deflect the composite section on
   I_LB. The two curves are summed. The default is bare steel for every
   load — the composite benefit is opted into explicitly, per load.

  const c=(S.composite&&S.composite.postLoads)||{};

/* solve with a subset of the loads by temporarily switching the others off */
function solveSubset(fac,Iin4,keep){
  const saved=S.loads.map(l=>l.off);
  S.loads.forEach(l=>{if(!keep(l))l.off=true;});
  let sol=null,dc=null;
  try{sol=solveFor(fac,Iin4);dc=sol?deflCurve(sol.R,fac,Iin4):null;}
  finally{S.loads.forEach((l,i)=>{l.off=saved[i];});}

  if(!anyPost)return null;
  const pre=solveSubset(c.f,Ibare,l=>!isPostComp(l));
  const post=solveSubset(c.f,Icomp,l=>isPostComp(l));
  if(!pre.dc||!post.dc)return null;
  const d=pre.dc.d.map((v,i)=>v+post.dc.d[i]);
  const R=(pre.sol.R||[]).map((r,i)=>({v:(r.v||0)+((post.sol.R[i]||{}).v||0),
    m:(r.m||0)+((post.sol.R[i]||{}).m||0)}));

function applyCompositeDeflection(A){

  const cp=A.comp;
  if(!cp||cp.blocked||!(cp.ILB>0))return;
  const Ibare=A.sect.Ix,Icomp=cp.ILB;

  A.svc.forEach(sc=>{

function tabStatusMap(){
  const m={},D=AN&&AN.design;
  const worse={pass:1,na:0,fail:2};
  const put=(tab,st)=>{if(!tab)return;if(!m[tab]||worse[st]>worse[m[tab]])m[tab]=st;};
  if(D&&D.checks)D.checks.forEach(ch=>put(ch.tab,ch.na?'na':(ch.dcr>1.0001?'fail':'pass')));
  if(AN&&AN.svc)AN.svc.forEach(sc=>sc.perSpan.forEach(ps=>{
    if(ps.pass==null)put('tabService','na');else put('tabService',ps.pass?'pass':'fail');}));
  if(AN&&AN.comp)put('tabMx',AN.comp.blocked?'fail':'pass');
  if(AN&&AN.constr&&!AN.constr.blocked){
    const w=[AN.constr.dcrM,AN.constr.dcrV,AN.constr.dcrPre,AN.constr.dcrLL,AN.constr.dcrTot]
      .filter(v=>v!=null&&isFinite(v));
    if(w.length)put('tabMx',Math.max.apply(null,w)>1.0001?'fail':'pass');
  }
  if(AN&&AN.blockers&&AN.blockers.length)put('tabSchem','fail');
  if(AN&&AN.results){
    const bad=AN.results.some(r=>r.status!=='PASS');
    put('tabBatch',bad?'fail':'pass');
  }
  return m;
}

function govSummary(){

/* =====================================================================
   ONE MEMBER SPAN
   L_b is the unbraced length; the span is a different quantity. Member
   check mode had no span field, so self weight, deflection, torsion and
   the composite effective width each asked for one — and the composite
   module inherited L_b, which is wrong wherever the beam is braced at
   intervals. A single span now feeds all of them.
   ===================================================================== */
function memberSpan(){
  if(!isMember())return{v:null,src:null};
  const m=S.member||{};
  if(m.L>0)return{v:m.L,src:'entered'};
  if(m.cont&&m.Lb>0)return{v:m.Lb,src:null};
  if(m.Lb>0)return{v:m.Lb,src:'unbraced length \u2014 no span entered',fallback:true};
  return{v:null,src:null};
}
function spanFor(own,label){
  if(own!=null&&own>0)return{v:own,src:'entered'};
  if(isMember()){const s=memberSpan();return s;}
  const sp=(S.geom&&S.geom.spans)||[];
  if(!sp.length)return{v:null,src:null};
  return{v:Math.max.apply(null,sp.map(x=>x.L)),src:sp.length>1?'longest span':'span length'};
}
function spanHint(own,extra){
  const s=spanFor(own);
  if(own!=null&&own>0)return extra||'';
  if(s.v==null)return'<b>no span available \u2014 enter one</b>';
  return'blank \u2192 <b>'+fmt(s.v,2)+' ft</b>'+(s.src?(' ('+s.src+')'):'')+
    (s.fallback?' \u2014 <b>enter the real span if the beam is braced at intervals</b>':'')+(extra?'. '+extra:'');
}
/* composite inherits the SPAN, never the brace spacing */
function compInherit(){
  const c=compCfg(),out={};
  const tribOn=!isMember()&&!isBatch()&&S.trib&&S.trib.on;
  const sp=spanFor(null);
  if(sp.v!=null)out.L={v:sp.v,src:isMember()?('member span'+(sp.fallback?' \u2014 falling back to the unbraced length':'')):
    (((S.geom.spans||[]).length>1)?'longest span \u2014 \u00A7I3.1a is per span':'span length')};
  if(tribOn&&S.trib.twL>0)out.sLeft={v:2*S.trib.twL,src:'2 \u00D7 left tributary width'};
  if(tribOn&&S.trib.twR>0)out.sRight={v:2*S.trib.twR,src:'2 \u00D7 right tributary width'};
  if(tribOn&&(S.trib.twL>0||S.trib.twR>0))
    out.trib={v:(S.trib.twL||0)+(S.trib.twR||0),src:'left + right tributary width'};
  else{
    const sl=(c.sLeft!=null?c.sLeft:(out.sLeft?out.sLeft.v:0)),sr=(c.sRight!=null?c.sRight:(out.sRight?out.sRight.v:0));
    if(sl||sr)out.trib={v:(sl+sr)/2,src:'half the beam spacing each side'};
  }
  if(tribOn&&S.trib.p){
    if(S.trib.p.DL>0)out.superDL={v:S.trib.p.DL,src:'DL pressure in the tributary generator'};
    if(S.trib.p.LL>0)out.LL={v:S.trib.p.LL,src:'LL pressure in the tributary generator'};
  }
  return out;
}
/* self weight and deflection inherit the same span */
function memberDefl(p){
  const df=S.member&&S.member.defl;
  if(!df||!df.on)return null;
  const L=spanFor(df.L).v;
  if(!(L>0)||df.w==null)return{err:'Enter the service load and span for the deflection check.'};
  const cfg=DEFL_CFG[df.cfg]||DEFL_CFG.simple;
  const c=(df.cfg==='custom')?(df.c||5/384):cfg.c;
  const pt=(df.cfg==='cantP'||df.cfg==='simpleP');
  const I=(df.I!=null&&df.I>0)?df.I:p.Ix;
  const d=pt? c*df.w*Math.pow(L*12,3)/(EKSI*I)
            : c*df.w*1728*Math.pow(L,4)/(EKSI*I);
  const den=(df.den==null||df.den==='')?360:df.den;   /* blank defaults; 0 means report only */
  const lim=den>0?L*12/den:null;
  return{d,lim,den,c,I,pt,cfgLab:cfg.lab,L,w:df.w,
    dcr:lim!=null?d/lim:null,pass:lim!=null?d<=lim*1.0001:null};
}
function openTorsionFor(A){
  const cfg=torCfg();
  if(!cfg)return null;
  const L=spanFor(cfg.L).v;
  if(!(L>0))return{blocked:'No torsional span is available \u2014 enter one, or give the member span.'};
  return torsionOpen(A.sect,{L,caseId:cfg.caseId,T:cfg.T||0,pos:cfg.pos});
}

/* ---- extend the per-row check ---- */
const __batchCheckRowBase=null;
function batchExtras(R){
  const row=R.row,p=R.p;
  if(!p||R.blockers.length)return;
  const num=v=>(v==null||v===''||!isFinite(v))?null:+v;
  /* --- composite --- */
  if(num(row.cSlab)>0){
    if(p._kind!=='I')R.warns.push('Composite data supplied but \u00A7I3.2 covers I-shapes only \u2014 the row was checked as bare steel.');
    else{
      const orient=(String(row.cOr||'PERP').trim().toUpperCase().indexOf('PARA')===0)?'para':
                   (String(row.cOr||'').trim().toUpperCase().indexOf('NONE')===0)?'none':'perp';
      const sp=num(row.cSp)||8;
      const cfg={L:R.Lx,sLeft:sp,sRight:sp,tSolid:num(row.cSlab),hr:num(row.cHr)||0,haunch:0,
        orient,ribFill:null,fc:num(row.cFc)||4,wc:num(row.cWc)||145,
        mode:'pct',pct:num(row.cPct)!=null?num(row.cPct):100};
      const cm=compositeMn(p,cfg);
      if(cm.blocked)R.warns.push('Composite: '+cm.blocked);
      else{
        R.comp=cm;R.phiMnComp=cm.phiMn/12;
        R.dcrMxSteel=R.dcrMx;R.phiMnSteel=R.phiMnx;
        R.phiMnx=R.phiMnComp;R.dcrMx=R.dem.Mux/(R.phiMnComp||1e-9);
        R.compPct=cm.pct;R.compBasis='Ch. I';
        (cm.warns||[]).forEach(w=>R.warns.push('Composite: '+String(w).replace(/<[^>]+>/g,'')));
        R.notes.push('Positive-moment capacity is the composite section (\u00A7I3.2a): \u03C6M\u2099 = '+
          fmt(R.phiMnComp,1)+' kip\u00B7ft at '+fmt(cm.pct,0)+'% action, against '+fmt(R.phiMnSteel,1)+
          ' kip\u00B7ft bare steel. Construction-stage and negative-moment conditions are NOT checked in batch.');
      }
    }
  }
  /* --- J10 --- */
  const lb=num(row.lb),Rc=num(row.Rconc);
  if(lb>0&&(p._kind==='I'||p._kind==='C')){
    const atEnd=/^(y|t|1)/i.test(String(row.lbEnd||''));
    const ed=atEnd?0:1e6;
    const wly=j10WLY(p,lb,ed),wlc=j10WLC(p,lb,ed);
    R.j10={lb,atEnd,phiWLY:wly.phi*wly.Rn,phiWLC:0.75*wlc.Rn};
    if(Rc>0){R.j10.R=Rc;R.dcrWLY=Rc/R.j10.phiWLY;R.dcrWLC=Rc/R.j10.phiWLC;}
    else R.notes.push('A bearing length was given without a concentrated force, so \u00A7J10 shows capacity only.');
  }else if(lb>0)R.warns.push('\u00A7J10 web provisions apply to I-shapes and channels; the bearing length was ignored.');
  /* --- deflection --- */
  const w=num(row.wServ);
  if(w!=null&&R.Lx>0){
    const I=(R.comp&&R.comp.ILB>0)?R.comp.ILB:p.Ix;
    const d=5*w*1728*Math.pow(R.Lx,4)/(384*EKSI*I);
    const den=(num(row.deflDen)==null)?360:num(row.deflDen);
    const lim=den>0?R.Lx*12/den:null;
    R.defl={w,I,d,den,lim,dcr:lim==null?null:d/lim};
    R.notes.push('Deflection uses a simple span of '+fmt(R.Lx,2)+' ft and I = '+fmt(I,0)+
      ' in\u2074'+(R.comp?' (composite I\u1D38\u1D2E)':' (bare steel I\u2093)')+'.');
  }
  /* --- governing, including the new checks --- */
  const cand=[['M\u2093',R.dcrMx],['M\u1D67',R.dcrMy],['V\u2093',R.dcrVx],['V\u1D67',R.dcrVy],
    ['P',R.dcrP],['Torsion',R.torMode?R.dcrT:null],['WLY',R.dcrWLY],['WLC',R.dcrWLC],
    ['Deflection',R.defl?R.defl.dcr:null],
    ['Interaction',R.inter?R.inter.value:null]].filter(c=>c[1]!=null&&isFinite(c[1]));
  const g=cand.reduce((m,c)=>c[1]>(m?m[1]:-1)?c:m,null);
  R.gov=g?g[0]:null;R.govDCR=g?g[1]:null;
  R.status=R.blockers.length?'BLOCKED':(R.govDCR!=null&&R.govDCR>1.0001?'FAIL':'PASS');
}

/* =====================================================================
   MOMENT CAPACITY vs STUD COUNT
   φMn re-evaluated through the §I3.2a plastic distribution at every
   stud count, so the curve is the capacity itself rather than a sketch.
   Answers the question the stud layout actually poses: how many studs
   before the demand is met, and where does adding more stop helping.
   ===================================================================== */
function studCurveFig(p,r,opts){
  opts=opts||{};
  const cfg=compEffCfg();
  if(!r||r.blocked)return null;
  const st=studQn(cfg,p);
  const Qn=st.Qn;
  if(!(Qn>0))return null;
  const Cmax=r.Cmax;
  const nFull=Math.ceil(Cmax/Qn);
  const n25=Math.ceil(0.25*Cmax/Qn);
  const nMax=Math.max(nFull+Math.ceil(nFull*0.30),nFull+4,(opts.nNow||0)+4);
  const xs=[],ys=[];
  const step=Math.max(1,Math.round(nMax/120));
  for(let n=0;n<=nMax;n+=step){
    const c2=Object.assign({},cfg,{mode:'pct',pct:100*Math.min(1,(n*Qn)/Cmax)});
    const m=compositeMn(p,c2);
    xs.push(n);ys.push(m.blocked?null:m.phiMn/12);
  }
  const phiFull=(function(){
    const m=compositeMn(p,Object.assign({},cfg,{mode:'pct',pct:100}));
    return m.blocked?null:m.phiMn/12;})();
  const bare=(function(){const c3=flexFor(p,'x',0,1);return c3.blocked?null:c3.phiMn/12;})();
  const ymax=Math.max(phiFull||0,opts.Mu||0)*1.16;
  const shapes=[],anns=[];
  if(n25>0){
    shapes.push({type:'rect',x0:0,x1:n25,y0:0,y1:ymax,fillcolor:'#FBECEC',opacity:.6,line:{width:0},layer:'below'});
    anns.push({x:n25/2,y:ymax*0.05,text:'< 25% action',showarrow:false,font:{size:8.5,color:'#B42318'}});
  }
  shapes.push({type:'rect',x0:n25,x1:nFull,y0:0,y1:ymax,fillcolor:'#FDF3E3',opacity:.5,line:{width:0},layer:'below'},
    {type:'rect',x0:nFull,x1:nMax,y0:0,y1:ymax,fillcolor:'#E7F3EC',opacity:.5,line:{width:0},layer:'below'});
  anns.push({x:(n25+nFull)/2,y:ymax*0.05,text:'partial composite',showarrow:false,font:{size:8.5,color:'#B45309'}},
    {x:(nFull+nMax)/2,y:ymax*0.05,text:'full composite \u2014 extra studs add nothing',showarrow:false,font:{size:8.5,color:'#046C4E'}});
  [[n25,'25% \u2014 '+n25+' studs'],[nFull,'full \u2014 '+nFull+' studs']].forEach(([n,t])=>{
    shapes.push({type:'line',x0:n,x1:n,y0:0,y1:ymax,line:{color:'#64748B',width:1,dash:'dash'}});

/* =====================================================================
   CROSS SECTION ON THE SCHEMATIC TAB, AND TIGHTER FIGURE FRAMING
   A locked 1:1 aspect means a tall-thin section is height-limited in a
   wide container and floats in whitespace. Sizing the holder to the
   figure's own aspect removes it.
   ===================================================================== */
function figAspect(fig){
  const xr=fig.layout.xaxis.range,yr=fig.layout.yaxis.range;
  if(!xr||!yr)return null;
  const w=Math.abs(xr[1]-xr[0]),h=Math.abs(yr[1]-yr[0]);
  return h>0?w/h:null;
}
function fitHolder(node,fig,height,mL,mR,mT,mB){
  const a=figAspect(fig);
  if(!a)return;
  const m=fig.layout.margin||{};
  const plotH=height-((m.t||0)+(m.b||0));
  const px=Math.round(plotH*a)+((m.l||0)+(m.r||0))+8;
  node.style.maxWidth=Math.max(260,px)+'px';
  node.style.margin='0 auto';
}

/* =====================================================================
   FULLY WORKED INTERMEDIATE VARIABLES
   Every quantity that feeds a result is shown as symbol = expression =
   substituted numbers = value, so each step can be re-done by hand.
   ===================================================================== */
function subEq(sym,expr,subst,val,unit){
  return sym+'='+expr+'='+subst+'=\\mathbf{'+val+'}'+(unit?('\\ \\text{'+unit+'}'):'');
}
/* ---------------- Chapter G shear, all routes ---------------- */
function shearBlock(body,p,sh,title){
  const Fy=p.mat.Fy,E=EKSI,rt=Math.sqrt(E/Fy);
  body.appendChild(el('div','note','<b>'+title+'</b> \u2014 '+sh.route+'. '+(sh.note||'')));
  if(sh.route==='G5'){
    const Lv=sh.Lv,Dt=p.Dt;
    body.appendChild(eqBlock({title:'Critical stress \u2014 the larger of the two buckling expressions, capped by shear yielding',ref:'Eqs. G5-2a, G5-2b, \u00A7G5',
      lines:[subEq('\\tfrac{D}{t}','\\tfrac{'+fmt(p.OD,3)+'}{'+fmt(p.tdes,3)+'}','',fmt(Dt,2),''),
        subEq('F_{cr1}','\\tfrac{1.60E}{\\sqrt{L_v/D}\\,(D/t)^{5/4}}',
          '\\tfrac{1.60('+E+')}{\\sqrt{'+fmt(Lv,1)+'/'+fmt(p.OD,3)+'}\\;('+fmt(Dt,2)+')^{5/4}}',fmt(sh.F1,2),'ksi'),
        subEq('F_{cr2}','\\tfrac{0.78E}{(D/t)^{3/2}}','\\tfrac{0.78('+E+')}{('+fmt(Dt,2)+')^{3/2}}',fmt(sh.F2c,2),'ksi'),
        subEq('0.6F_y','0.6('+Fy+')','',fmt(0.6*Fy,2),'ksi'),
        'F_{cr}=\\min\\left[\\max(F_{cr1},F_{cr2}),\\,0.6F_y\\right]=\\mathbf{'+fmt(sh.Fcr,2)+'}\\ \\text{ksi}'],
      vars:[['L_v',fmt(Lv/12,2)+' ft','maximum-shear to zero-shear distance'],
        ['A_g',fmt(p.A,2)+' in\u00B2','gross area']]}));
    body.appendChild(eqBlock({title:'Nominal shear strength',ref:'Eq. G5-1',
      lines:[subEq('V_n','\\tfrac{F_{cr}A_g}{2}','\\tfrac{'+fmt(sh.Fcr,2)+'('+fmt(p.A,2)+')}{2}',fmt(sh.Vn,2),'kip')]}));
  }else{
    /* --- web (or flange) area --- */
    const minor=(sh.route==='G6'||sh.route==='G4 (weak)');
    let awLines=[],hLine=null;
    if(minor&&(p._kind==='I'||p._kind==='C')){
      awLines.push(subEq('A_w','2b_ft_f','2('+fmt(p.bf,3)+')('+fmt(p.tf,3)+')',fmt(sh.Aw,3),'in^2'));
      awLines.push('\\text{\u2014 the two flanges resist weak-axis shear (\u00A7G6)}');
    }else if(p._kind==='R'){
      const h=minor?p.bFlat:p.hFlat,dimName=minor?'B':'H',dim=minor?p.B:p.Ht;
      hLine=subEq(minor?'b':'h',dimName+'-3t',fmt(dim,3)+'-3('+fmt(p.tdes,3)+')',fmt(h,3),'in');
      awLines.push(subEq('A_w','2'+(minor?'b':'h')+'t','2('+fmt(h,3)+')('+fmt(p.tdes,3)+')',fmt(sh.Aw,3),'in^2'));
    }else{
      awLines.push(subEq('A_w','d\\,t_w',fmt(p.d,3)+'('+fmt(p.tw,3)+')',fmt(sh.Aw,3),'in^2'));
      awLines.push('\\text{\u2014 \u00A7G2.1 defines }A_w\\text{ as the overall depth times the web thickness}');
    }
    body.appendChild(eqBlock({title:'Area resisting shear',ref:minor?'\u00A7G6':'\u00A7'+sh.route,
      lines:(hLine?[hLine]:[]).concat(awLines),
      vars:(p._kind==='I'||p._kind==='C')?[['d',fmt(p.d,3)+' in',''],['t_w',fmt(p.tw,3)+' in','']]:
        [['t',fmt(p.tdes,3)+' in','design wall thickness']]}));
    /* --- shear coefficient --- */
    if(sh.route==='G2.1(a)'){
      body.appendChild(eqBlock({title:'Web shear coefficient \u2014 the \u00A7G2.1(a) exception applies',ref:'\u00A7G2.1(a)',
        lines:[subEq('\\tfrac{h}{t_w}','\\tfrac{'+fmt(webH(p),3)+'}{'+fmt(p.tw,3)+'}','',fmt(p.htw,2),''),
          subEq('2.24\\sqrt{\\tfrac{E}{F_y}}','2.24\\sqrt{\\tfrac{'+E+'}{'+Fy+'}}','',fmt(2.24*rt,2),''),
          '\\tfrac{h}{t_w}='+fmt(p.htw,2)+'\\le '+fmt(2.24*rt,2)+'\\ \\Rightarrow\\ C_{v1}=\\mathbf{1.00}\\ \\text{and}\\ \\phi_v=\\mathbf{1.00}'],
        vars:[['h',fmt(webH(p),3)+' in','clear distance between flanges, from the tabulated h/t_w']]}));
    }else{
      const kv=sh.kv!=null?sh.kv:(minor?1.2:5),lam=minor?((p._kind==='R')?p.btdes:(p.bf/((p._kind==='I')?2:1))/p.tf):((p._kind==='R')?p.htdes:p.htw);
      const lim=1.10*Math.sqrt(kv*E/Fy);
      const l2=1.37*Math.sqrt(kv*E/Fy);
      const isCv2=(p._kind==='R'||minor);
      const lines=[subEq('\\lambda',isCv2?'\\tfrac{'+(minor&&p._kind!=='R'?'b':(minor?'b':'h'))+'}{t}':'\\tfrac{h}{t_w}','',fmt(lam,2),''),
        subEq('1.10\\sqrt{\\tfrac{k_vE}{F_y}}','1.10\\sqrt{\\tfrac{'+fmt(kv,2)+'('+E+')}{'+Fy+'}}','',fmt(lim,2),'')];
      if(isCv2)lines.push(subEq('1.37\\sqrt{\\tfrac{k_vE}{F_y}}','1.37\\sqrt{\\tfrac{'+fmt(kv,2)+'('+E+')}{'+Fy+'}}','',fmt(l2,2),''));
      if(lam<=lim)lines.push('\\lambda='+fmt(lam,2)+'\\le '+fmt(lim,2)+'\\ \\Rightarrow\\ C_v=\\mathbf{1.00}');
      else if(isCv2&&lam<=l2)lines.push(subEq('C_{v2}','\\tfrac{1.10\\sqrt{k_vE/F_y}}{\\lambda}','\\tfrac{'+fmt(lim,2)+'}{'+fmt(lam,2)+'}',fmt(sh.Cv,3),''));
      else if(isCv2)lines.push(subEq('C_{v2}','\\tfrac{1.51k_vE}{\\lambda^2F_y}','\\tfrac{1.51('+fmt(kv,2)+')('+E+')}{('+fmt(lam,2)+')^2('+Fy+')}',fmt(sh.Cv,3),''));
      else lines.push(subEq('C_{v1}','\\tfrac{1.10\\sqrt{k_vE/F_y}}{h/t_w}','\\tfrac{'+fmt(lim,2)+'}{'+fmt(lam,2)+'}',fmt(sh.Cv,3),''));
      body.appendChild(eqBlock({title:'Web shear coefficient',ref:isCv2?'Eqs. G2-9 to G2-11':'Eqs. G2-3, G2-4',
        lines,vars:[['k_v',fmt(kv,2),minor?'\u00A7G6 uses k_v = 1.2':(p._kind==='R'?'\u00A7G4 uses k_v = 5':'\u00A7G2.1(b)')]]}));
    }
    body.appendChild(eqBlock({title:'Nominal shear strength',ref:minor?'Eq. G6-1':'Eq. G2-1',
      lines:[subEq('V_n','0.6F_yA_wC_v','0.6('+Fy+')('+fmt(sh.Aw,3)+')('+fmt(sh.Cv,3)+')',fmt(sh.Vn,2),'kip')]}));
  }
  body.appendChild(eqBlock({title:'Design shear strength',ref:'\u00A7G1',
    lines:[subEq('\\phi_vV_n',fmt(sh.phi,2)+'V_n',fmt(sh.phi,2)+'('+fmt(sh.Vn,2)+')',fmt(sh.phi*sh.Vn,2),'kip')],
    vars:[['\\phi_v',fmt(sh.phi,2),sh.route==='G2.1(a)'?'\u00A7G2.1(a) rolled I-shape exception':'\u00A7G1']]}));
}
/* ---------------- Table B4.1b classification, worked ---------------- */
function classFlexBlock(body,p,D){
  const Fy=p.mat.Fy,E=EKSI,rt=Math.sqrt(E/Fy);
  const rows=[],eqs=[];
  const push=(nm,c,lamExpr,lamSub,lpExpr,lrExpr,cs)=>{
    rows.push([nm,fmt(c.lam,2),fmt(c.lp,2),fmt(c.lr,2),'Case '+cs,c.cls]);
    eqs.push(subEq('\\lambda_{'+nm[0].toLowerCase()+'}',lamExpr,lamSub,fmt(c.lam,2),''));
    eqs.push('\\qquad '+subEq('\\lambda_p',lpExpr,lpExpr.replace(/E/,'\\,'+E).replace(/F_y/,Fy),fmt(c.lp,2),'')+
      ',\\quad '+subEq('\\lambda_r',lrExpr,lrExpr.replace(/E/,'\\,'+E).replace(/F_y/,Fy),fmt(c.lr,2),''));
  };
  if(p._kind==='I'||p._kind==='C'){
    const c=D.clsF;

/* =====================================================================
   SENSITIVITY
   Each driving input is perturbed ±10% and the whole model re-solved
   through the production engine, so the reported change is the real
   one rather than a derivative of a simplified expression. Answers the
   checker's question: what would move this answer, and by how much?
   ===================================================================== */
const SENS_STEP=0.10;
let SENS_CACHE={key:null,rows:null,base:null};
function worstCheck(){
  const D=AN&&AN.design;
  if(!D||!D.checks)return null;
  let g=null;
  D.checks.forEach(ch=>{if(!ch.na&&ch.dcr!=null&&isFinite(ch.dcr)&&(!g||ch.dcr>g.dcr))g=ch;});
  return g;
}
function sensParams(){
  const out=[];
  const add=(label,unit,get,set,note)=>{
    const v=get();
    if(v==null||!isFinite(v)||Math.abs(v)<1e-12)return;
    out.push({label,unit,get,set,v,note});
  };
  if(isMember()){
    const rows=S.member.rows||[];
    const sumOf=k=>rows.reduce((a,r)=>a+Math.abs(r[k]||0),0);
    const scale=(k,f)=>rows.forEach(r=>{if(r[k])r[k]=r[k]*f;});
    [['M\u1D64\u2093','kip\u00B7ft','Mux'],['V\u1D64\u2093','kip','Vux'],['P\u1D64','kip','Pu'],
     ['M\u1D64\u1D67','kip\u00B7ft','Muy'],['V\u1D64\u1D67','kip','Vuy'],['T\u1D64','kip\u00B7ft','Tu']]
      .forEach(([lab,u,k])=>{
        const base=sumOf(k);
        if(base<=1e-12)return;
        out.push({label:lab,unit:u,v:base,note:'all cases scaled together',
          get:()=>sumOf(k),set:v=>{const f=v/(sumOf(k)||1);scale(k,f);}});
      });
    add('L\u1D47 (unbraced length)','ft',()=>S.member.Lb,v=>{S.member.Lb=v;},'drives lateral-torsional buckling');
    add('C\u1D47','\u2014',()=>S.member.Cb,v=>{S.member.Cb=v;},'assumed, not derived from a moment diagram');
    add('Member span L','ft',()=>S.member.L,v=>{S.member.L=v;},'feeds self weight, deflection, torsion and b\u2091\u2093\u2093');
    add('L\u1D9C\u2093','ft',()=>S.design.Lcx,v=>{S.design.Lcx=v;});
    add('L\u1D9C\u1D67','ft',()=>S.design.Lcy,v=>{S.design.Lcy=v;});
  }else{
    const spans=S.geom.spans||[];
    const tot=spans.reduce((a,s)=>a+s.L,0);
    if(tot>0)out.push({label:'All span lengths','unit':'ft',v:tot,note:'scaled together',
      get:()=>spans.reduce((a,s)=>a+s.L,0),
      set:v=>{const f=v/(spans.reduce((a,s)=>a+s.L,0)||1);spans.forEach(s=>{s.L*=f;});}});
    if(S.trib&&S.trib.on){
      Object.keys(S.trib.p||{}).forEach(cid=>{
        add(cid+' pressure','psf',()=>S.trib.p[cid],v=>{S.trib.p[cid]=v;},'tributary generator');
      });
      add('Tributary width (both sides)','ft',()=>(S.trib.twL||0)+(S.trib.twR||0),
        v=>{const b=(S.trib.twL||0)+(S.trib.twR||0)||1,f=v/b;S.trib.twL*=f;S.trib.twR*=f;});
    }
    const man=S.design.man||{};
    [['P\u1D64','kip','Pu'],['M\u1D64\u1D67','kip\u00B7ft','Muy'],['V\u1D64\u1D67','kip','Vuy'],['T\u1D64','kip\u00B7ft','Tu']]
      .forEach(([lab,u,k])=>{
        const sum=()=>Object.keys(man).reduce((a,c)=>a+Math.abs((man[c]||{})[k]||0),0);
        if(sum()<=1e-12)return;
        out.push({label:lab+' (manual)',unit:u,v:sum(),note:'all combinations scaled together',
          get:sum,set:v=>{const f=v/(sum()||1);Object.keys(man).forEach(c=>{if(man[c]&&man[c][k])man[c][k]*=f;});}});
      });
    if(!S.bracing.topCont)add('Top-flange L\u1D47','ft',()=>S.bracing.LbTop,v=>{S.bracing.LbTop=v;});
    add('Bottom-flange L\u1D47','ft',()=>S.bracing.LbBot,v=>{S.bracing.LbBot=v;});
  }
  if(S.composite&&S.composite.on){
    const c=S.composite;
    if(c.mode==='pct')add('Composite action','%',()=>c.pct,v=>{c.pct=Math.min(100,v);},'capped at 100%');
    else add('Stud count','\u2014',()=>c.nStuds,v=>{c.nStuds=Math.max(0,Math.round(v));});
    add("Concrete f'c",'ksi',()=>c.fc,v=>{c.fc=v;});
    add('Solid slab above deck','in',()=>c.tSolid,v=>{c.tSolid=v;});
    add('Beam spacing (left)','ft',()=>c.sLeft,v=>{c.sLeft=v;},'sets b\u2091\u2093\u2093 with L/8');
  }
  if(S.design.stiff&&S.design.stiff.on)
    add('Stiffener spacing a','in',()=>S.design.stiff.a,v=>{S.design.stiff.a=v;});
  return out;
}
function runSensitivity(){
  if(isBatch()||!AN||(AN.blockers&&AN.blockers.length))return null;
  const key=JSON.stringify(S);
  if(SENS_CACHE.key===key)return{rows:SENS_CACHE.rows,base:SENS_CACHE.base};
  const base=worstCheck();
  if(!base)return null;
  const baseInfo={dcr:base.dcr,label:base.label,combo:base.combo};
  const params=sensParams();
  const rows=[];
  const probe=(pr,f)=>{
    let out={dcr:null,label:null};
    try{
      pr.set(pr.v*(1+f));
      computeAll();
      if(!(AN.blockers&&AN.blockers.length)){
        const w=worstCheck();
        if(w)out={dcr:w.dcr,label:w.label};
      }
    }catch(e){}
    try{pr.set(pr.v);computeAll();}catch(e){}
    return out;
  };
  params.forEach(pr=>{
    const lo=probe(pr,-SENS_STEP),hi=probe(pr,SENS_STEP);
    if(lo.dcr==null&&hi.dcr==null)return;
    const dLo=(lo.dcr!=null)?lo.dcr-baseInfo.dcr:null;
    const dHi=(hi.dcr!=null)?hi.dcr-baseInfo.dcr:null;
    const span=Math.max(Math.abs(dLo||0),Math.abs(dHi||0));
    rows.push({p:pr,lo,hi,dLo,dHi,span,
      flip:(hi.label&&hi.label!==baseInfo.label)||(lo.label&&lo.label!==baseInfo.label),
      crosses:((lo.dcr!=null&&(lo.dcr>1)!==(baseInfo.dcr>1))||(hi.dcr!=null&&(hi.dcr>1)!==(baseInfo.dcr>1)))});
  });
  S=JSON.parse(key);computeAll();
  rows.sort((a,b)=>b.span-a.span);
  SENS_CACHE={key,rows,base:baseInfo};
  return{rows,base:baseInfo};
}
/* ---- tornado chart + table ---- */
function sensFig(res){
  const rows=res.rows.slice(0,12).reverse();
  if(!rows.length)return null;
  const names=rows.map(r=>r.p.label);
  const lo=rows.map(r=>r.dLo!=null?r.dLo:0);
  const hi=rows.map(r=>r.dHi!=null?r.dHi:0);
  const txt=(arr,sign)=>arr.map((v,i)=>{
    const d=(sign<0?rows[i].lo:rows[i].hi);
    return d.dcr!=null?('DCR '+fmt(d.dcr,3)):'n/a';});
  const data=[
    {x:lo,y:names,type:'bar',orientation:'h',name:'\u221210%',marker:{color:'#7FA6D9'},
     hovertext:txt(lo,-1),hovertemplate:'%{y}<br>\u221210% \u2192 %{hovertext}<br>\u0394DCR %{x:+.3f}<extra></extra>'},
    {x:hi,y:names,type:'bar',orientation:'h',name:'+10%',marker:{color:'#D98A7F'},
     hovertext:txt(hi,1),hovertemplate:'%{y}<br>+10% \u2192 %{hovertext}<br>\u0394DCR %{x:+.3f}<extra></extra>'}];
  const mx=Math.max(0.02,Math.max.apply(null,lo.concat(hi).map(Math.abs))*1.25);
  const shapes=[{type:'line',x0:0,x1:0,y0:-0.5,y1:names.length-0.5,line:{color:'#334155',width:1.4}}];
  const anns=[];
  const toOne=1-res.base.dcr;
  if(Math.abs(toOne)<=mx){
    shapes.push({type:'line',x0:toOne,x1:toOne,y0:-0.5,y1:names.length-0.5,
      line:{color:'#B42318',width:1.4,dash:'dash'}});
    anns.push({x:toOne,y:names.length-0.5,text:'DCR = 1.00',showarrow:false,yanchor:'bottom',
      font:{size:9,color:'#B42318'},bgcolor:'rgba(255,255,255,.85)'});
  }
  return{data,layout:{
    title:{text:'Change in governing DCR for \u00B110% on each input (base DCR = '+fmt(res.base.dcr,3)+')',
      font:{size:11,family:'Arial'},x:0},
    margin:{l:170,r:20,t:30,b:40},height:Math.max(200,44+rows.length*26),
    barmode:'overlay',bargap:0.35,
    xaxis:{title:{text:'\u0394 DCR',font:{size:9.5}},range:[-mx,mx],gridcolor:'#EEF1F5',zeroline:false},
    yaxis:{automargin:true,tickfont:{size:9}},
    shapes,annotations:anns,
    legend:{font:{size:8.5},orientation:'h',y:1.14,x:1,xanchor:'right'},
    paper_bgcolor:'#fff',plot_bgcolor:'#fff',hovermode:'closest'}};
}
function buildSensSection(pg){
  if(isBatch())return;
  mkSection('sumSens','Sensitivity \u2014 What Moves the Answer',body=>{
    let res=null;
    try{res=runSensitivity();}catch(e){body.appendChild(el('div','errBox','Sensitivity run failed: '+e.message));return;}
    if(!res||!res.rows.length){
      body.appendChild(el('div','note','No governing ratio is available to perturb yet.'));return;}
    body.appendChild(el('div','note','Each input below is changed by \u00B110% on its own and the <b>whole model is re-solved</b> through the same engine that produced the results \u2014 these are actual recomputed ratios, not derivatives of a simplified formula. Everything else is held fixed, so interactions between two inputs are not captured.'));
    const fig=sensFig(res);
    if(fig){const id='sensFig';plotHolder(body,id,fig.layout.height);regPlot(id,fig);}
    const t=el('table','tbl');
    const hd=el('tr');['Input','Base','Units','\u221210% \u2192 DCR','+10% \u2192 DCR','Largest \u0394','Note'].forEach(h=>hd.appendChild(el('th',null,h)));
    t.appendChild(hd);
    res.rows.forEach(r=>{
      const tr=el('tr');
      const note=[r.crosses?'<b style="color:var(--fail)">crosses DCR = 1.00</b>':'',
        r.flip?'governing check changes':'',r.p.note||''].filter(Boolean).join('; ');
      [r.p.label,fmt(r.p.v,3),r.p.unit,
       r.lo.dcr!=null?fmt(r.lo.dcr,3):'\u2014',
       r.hi.dcr!=null?fmt(r.hi.dcr,3):'\u2014',
       (r.span>0?('\u00B1'+fmt(r.span,3)):'negligible'),note]
        .forEach((v,i)=>tr.appendChild(el('td',(i===0||i===6)?'lft':null,''+v)));
      if(r.crosses)tr.className='gov';
      t.appendChild(tr);
    });
    body.appendChild(t);
    const crit=res.rows.filter(r=>r.crosses);
    const flat=res.rows.filter(r=>r.span<0.002);
    body.appendChild(el('div',crit.length?'errBox':'okBox',
      crit.length?('A 10% change in '+crit.map(r=>'<b>'+r.p.label+'</b>').join(' or ')+
        ' moves the design across DCR = 1.00. Those inputs deserve the most scrutiny in checking.'):
      'No single input at \u00B110% moves the design across DCR = 1.00 from a base of '+fmt(res.base.dcr,3)+'.'));
    if(flat.length)body.appendChild(el('div','hint','Insensitive at \u00B110%: '+
      flat.map(r=>r.p.label).join(', ')+'. These do not currently govern; a larger change may still matter.'));
    body.appendChild(el('div','hint','\u00B110% is a probe, not a code requirement, and section properties are not varied because changing a shape changes all of them at once. Where a row says the governing check changes, the ratio shown is for the <b>new</b> governing limit state, which is why some entries move more than expected.'));
  },pg);
}
/* =====================================================================
   FOUR MORE CHARTS
   ===================================================================== */
function regPlot(id,fig,tries){
  PLOTREG[id]=fig;
  const n=tries||0;
  const node=document.getElementById(id);
  if(typeof Plotly==='undefined'||!node){
    if(n>60)return;
    setTimeout(()=>regPlot(id,fig,n+1),typeof Plotly==='undefined'?300:30);
    return;
  }
  try{
    const pr=Plotly.react(id,fig.data,fig.layout,fig.config||PLOTCFG);
    if(fig.onClick&&node.on){
      const bind=()=>{try{node.removeAllListeners&&node.removeAllListeners('plotly_click');
        node.on('plotly_click',ev=>{try{fig.onClick(ev);}catch(e){}});}catch(e){}};
      if(pr&&pr.then)pr.then(bind);else bind();
    }
  }catch(e){}
}
/* ---------------------------------------------------------------------
   1. CAPACITY ENVELOPE ON THE MOMENT DIAGRAM  (beam mode)
   --------------------------------------------------------------------- */
function capEnvFig(A,D,C){
  if(!A||!A.stations||!A.stations.length||!C||!C.regions)return null;
  const cb=A.combos.find(x=>x.id===C.id);
  if(!cb||!cb.M)return null;
  const xs=A.stations,Mabs=cb.M.map(Math.abs);
  const capX=[],capY=[],dcrX=[],dcrY=[];
  C.regions.forEach(r=>{
    if(r.x1==null)return;
    capX.push(r.x1,r.x2,null);capY.push(r.phiMn,r.phiMn,null);
  });
  xs.forEach((x,i)=>{
    let reg=null;
    C.regions.forEach(r=>{if(r.x1!=null&&x>=r.x1-1e-9&&x<=r.x2+1e-9&&!reg)reg=r;});
    if(reg&&reg.phiMn>0){dcrX.push(x);dcrY.push(Mabs[i]/reg.phiMn);}
  });
  const ymax=Math.max.apply(null,capY.filter(v=>v!=null).concat(Mabs))*1.15;
  const shapes=[],anns=[];
  C.regions.forEach((r,i)=>{
    if(r.x1==null)return;
    if(i>0)shapes.push({type:'line',x0:r.x1,x1:r.x1,y0:0,y1:ymax,line:{color:'#94A3B8',width:1,dash:'dot'}});
    const mid=(r.x1+r.x2)/2;
    anns.push({x:mid,y:ymax,yanchor:'top',yshift:-2,showarrow:false,
      text:(r.basis==='composite'?'composite':(r.flange||'')+' flange')+'<br>DCR '+fmt(r.dcr,2),
      font:{size:8.5,color:r.dcr>1?'#B42318':'#334155'},bgcolor:'rgba(255,255,255,.85)'});
  });
  nodeXs().slice(1,-1).forEach(nx=>shapes.push({type:'line',x0:nx,x1:nx,y0:0,y1:ymax,
    line:{color:'#CBD5E1',width:1}}));
  return{data:[
    {x:xs,y:Mabs,name:'|M\u1D64|',line:{color:'#B42318',width:2},fill:'tozeroy',
     fillcolor:'rgba(180,35,24,.10)',hovertemplate:'x = %{x:.2f} ft<br>|M\u1D64| = %{y:.1f} kip\u00B7ft<extra></extra>'},
    {x:capX,y:capY,name:'\u03C6M\u2099 available',line:{color:'#046C4E',width:2.6},connectgaps:false,
     hovertemplate:'\u03C6M\u2099 = %{y:.1f} kip\u00B7ft<extra></extra>'},
    {x:dcrX,y:dcrY,name:'DCR',yaxis:'y2',line:{color:'#1D4ED8',width:1.4,dash:'dot'},
     hovertemplate:'x = %{x:.2f} ft<br>DCR = %{y:.3f}<extra></extra>'}],
   layout:{
    title:{text:'Demand against available strength along the beam \u2014 '+C.name,font:{size:11,family:'Arial'},x:0},
    margin:{l:58,r:52,t:30,b:40},height:330,
    xaxis:{title:{text:'x (ft)',font:{size:9.5}},gridcolor:'#EEF1F5',zeroline:false},
    yaxis:{title:{text:'moment (kip\u00B7ft)',font:{size:9.5}},range:[0,ymax],gridcolor:'#EEF1F5'},
    yaxis2:{title:{text:'DCR',font:{size:9.5}},overlaying:'y',side:'right',range:[0,Math.max(1.1,Math.max.apply(null,dcrY)*1.2)],
      showgrid:false,tickfont:{size:8.5}},
    shapes,annotations:anns,
    legend:{font:{size:8.5},orientation:'h',y:1.16,x:1,xanchor:'right'},
    paper_bgcolor:'#fff',plot_bgcolor:'#fff',hovermode:'x unified'}};
}
function capEnvBlock(body,A,D,C){
  const fig=capEnvFig(A,D,C);
  if(!fig){body.appendChild(el('div','hint','Capacity envelope unavailable for this combination.'));return;}
  const id='capEnv_'+C.id;
  plotHolder(body,id,330);
  regPlot(id,fig);
  body.appendChild(el('div','hint','The green step is the available \u03C6M\u2099 in each moment region \u2014 it changes where the compression flange changes, where the unbraced length changes, and (with composite action) where the slab goes into tension. Dotted grey lines are region boundaries at the inflection points; solid grey are interior supports. The blue trace on the right axis is the demand/capacity ratio at every station, so the tight part of the beam is visible rather than just its worst value.'));
}
/* ---------------------------------------------------------------------
   2. BATCH — GOVERNING DCR BY MEMBER
   --------------------------------------------------------------------- */
function batchDcrFig(res){
  const rows=res.filter(r=>r.govDCR!=null&&isFinite(r.govDCR))
    .slice().sort((a,b)=>b.govDCR-a.govDCR);
  const blocked=res.filter(r=>r.govDCR==null||!isFinite(r.govDCR));
  if(!rows.length&&!blocked.length)return null;
  const lab=r=>'#'+(r.row.mid!=null?r.row.mid:'?')+(r.row.desc?(' '+r.row.desc):'');
  const names=rows.map(lab).concat(blocked.map(lab));
  const vals=rows.map(r=>r.govDCR).concat(blocked.map(()=>0));
  const cols=rows.map(r=>r.govDCR>1.0001?'#B42318':'#046C4E').concat(blocked.map(()=>'#94A3B8'));
  const hov=rows.map(r=>'governs: '+(r.gov||'\u2014')+'<br>'+(r.lbl||r.row.size||'')+'<br>'+r.status)
    .concat(blocked.map(r=>'BLOCKED<br>'+((r.blockers||[])[0]||'').slice(0,60)));
  const h=Math.max(220,60+names.length*20);
  return{data:[{x:vals,y:names,type:'bar',orientation:'h',marker:{color:cols},
    hovertext:hov,hovertemplate:'%{y}<br>DCR %{x:.3f}<br>%{hovertext}<extra></extra>'}],
   layout:{
    title:{text:'Governing demand/capacity ratio by member',font:{size:11,family:'Arial'},x:0},
    margin:{l:170,r:24,t:30,b:40},height:h,bargap:0.3,
    xaxis:{title:{text:'governing DCR',font:{size:9.5}},gridcolor:'#EEF1F5',
      range:[0,Math.max(1.15,Math.max.apply(null,vals.concat([1]))*1.12)]},
    yaxis:{automargin:true,autorange:'reversed',tickfont:{size:9}},
    shapes:[{type:'line',x0:1,x1:1,y0:-0.5,y1:names.length-0.5,line:{color:'#B42318',width:1.6,dash:'dash'}}],
    annotations:[{x:1,y:-0.5,text:'DCR = 1.00',showarrow:false,yanchor:'bottom',
      font:{size:9,color:'#B42318'},bgcolor:'rgba(255,255,255,.85)'}],
    showlegend:false,paper_bgcolor:'#fff',plot_bgcolor:'#fff'},
   onClick:ev=>{
     const i=ev&&ev.points&&ev.points[0]?ev.points[0].pointNumber:null;
     if(i==null)return;
     const all=rows.concat(blocked);
     if(all[i])openBatchRow(all[i]);
   }};
}
/* ---------------------------------------------------------------------
   3. P–M INTERACTION ENVELOPE  (§H1.1)
   --------------------------------------------------------------------- */
function pmFig(D){
  const pts=[],labels=[],cols=[];
  D.perCombo.forEach(C=>{
    const t=C.inter&&C.inter.terms;if(!t)return;
    const m=(t.Mx||0)+(t.My||0),pp=t.P||0;
    pts.push([m,pp]);labels.push(C.name);
    cols.push(C.inter.value>1.0001?'#B42318':'#1D4ED8');
  });
  if(!pts.length)return null;
  const mMax=Math.max(1.15,Math.max.apply(null,pts.map(p=>p[0]))*1.15);
  const pMax=Math.max(1.15,Math.max.apply(null,pts.map(p=>p[1]))*1.15);
  const env={x:[0,0.9,1.0],y:[1.0,0.2,0]};
  return{data:[
    {x:env.x,y:env.y,name:'\u00A7H1 envelope',mode:'lines',line:{color:'#046C4E',width:2.4},
     hovertemplate:'M\u1D63/M\u1D9C = %{x:.3f}<br>P\u1D63/P\u1D9C = %{y:.3f}<extra>limit</extra>'},
    {x:[0,1.0],y:[0.2,0.2],name:'P\u1D63/P\u1D9C = 0.2 (H1-1a / H1-1b)',mode:'lines',
     line:{color:'#9AA7B8',width:1,dash:'dot'},hoverinfo:'skip'},
    {x:pts.map(p=>p[0]),y:pts.map(p=>p[1]),mode:'markers+text',name:'combinations',
     marker:{size:11,color:cols,symbol:'diamond',line:{color:'#fff',width:1.4}},
     text:labels.map(l=>' '+l),textposition:'middle right',textfont:{size:8.5,color:'#334155'},
     hovertext:labels,hovertemplate:'%{hovertext}<br>M\u1D63/M\u1D9C = %{x:.3f}<br>P\u1D63/P\u1D9C = %{y:.3f}<extra></extra>'}],
   layout:{
    title:{text:'Combined force interaction \u2014 demand points against the \u00A7H1 envelope',
      font:{size:11,family:'Arial'},x:0},
    margin:{l:58,r:20,t:30,b:44},height:340,
    xaxis:{title:{text:'M\u1D63\u2093/M\u1D9C\u2093 + M\u1D63\u1D67/M\u1D9C\u1D67',font:{size:9.5}},range:[0,mMax],gridcolor:'#EEF1F5'},
    yaxis:{title:{text:'P\u1D63/P\u1D9C',font:{size:9.5}},range:[0,pMax],gridcolor:'#EEF1F5'},
    legend:{font:{size:8.5},orientation:'h',y:1.15,x:1,xanchor:'right'},
    paper_bgcolor:'#fff',plot_bgcolor:'#fff',hovermode:'closest'}};
}
/* ---------------------------------------------------------------------
   4. COLUMN CURVE  φPn vs Lc
   --------------------------------------------------------------------- */
function colCurveFig(p,cc,D,Pu){
  const Fy=p.mat.Fy,E=EKSI;
  const Lx=D.Lcx/12,Ly=D.Lcy/12;
  const Lmax=Math.max(Lx,Ly,1)*1.8;
  const N=90,xs=[],yx=[],yy=[];
  for(let i=1;i<=N;i++){
    const L=Lmax*i/N;
    xs.push(L);
    let a=null,b=null;
    try{a=compStrength(p,L*12,1e-3,1e-3);}catch(e){}
    try{b=compStrength(p,1e-3,L*12,L*12);}catch(e){}
    yx.push(a&&!a.blocked?a.phiPn:null);
    yy.push(b&&!b.blocked?b.phiPn:null);
  }
  const trans=r=>4.71*Math.sqrt(E/Fy)*r/12;
  const shapes=[],anns=[];
  const ymax=Math.max.apply(null,yx.concat(yy).filter(v=>v!=null).concat([Pu||0]))*1.12;
  [[trans(p.rx),'x\u2013x transition','#7C3AED'],[trans(p.ry),'y\u2013y transition','#B45309']].forEach(([L,t,c])=>{
    if(L>Lmax)return;
    shapes.push({type:'line',x0:L,x1:L,y0:0,y1:ymax,line:{color:c,width:1,dash:'dash'}});
    anns.push({x:L,y:ymax,text:t+'<br>L\u1D9C = '+fmt(L,1)+' ft',showarrow:false,yanchor:'top',yshift:-2,
      font:{size:8.5,color:c},bgcolor:'rgba(255,255,255,.85)'});
  });
  if(Pu>0){
    shapes.push({type:'line',x0:0,x1:Lmax,y0:Pu,y1:Pu,line:{color:'#B42318',width:1.6,dash:'dash'}});
    anns.push({x:0,y:Pu,text:'P\u1D64 = '+fmt(Pu,1),showarrow:false,xanchor:'left',yshift:9,
      font:{size:9,color:'#B42318'},bgcolor:'rgba(255,255,255,.85)'});
  }
  const data=[
    {x:xs,y:yx,name:'\u03C6P\u2099 governed by x\u2013x',line:{color:'#7C3AED',width:2},
     hovertemplate:'L\u1D9C = %{x:.2f} ft<br>\u03C6P\u2099 = %{y:.1f} kip<extra>x\u2013x</extra>'},
    {x:xs,y:yy,name:'\u03C6P\u2099 governed by y\u2013y',line:{color:'#B45309',width:2},
     hovertemplate:'L\u1D9C = %{x:.2f} ft<br>\u03C6P\u2099 = %{y:.1f} kip<extra>y\u2013y</extra>'},
    {x:[Lx],y:[(function(){try{const a=compStrength(p,Lx*12,1e-3,1e-3);return a.blocked?null:a.phiPn;}catch(e){return null;}})()],
     mode:'markers',name:'L\u1D9C\u2093 used',marker:{size:11,color:'#7C3AED',symbol:'diamond',line:{color:'#fff',width:1.5}},
     hovertemplate:'L\u1D9C\u2093 = %{x:.2f} ft<br>%{y:.1f} kip<extra></extra>'},
    {x:[Ly],y:[(function(){try{const b=compStrength(p,1e-3,Ly*12,Ly*12);return b.blocked?null:b.phiPn;}catch(e){return null;}})()],
     mode:'markers',name:'L\u1D9C\u1D67 used',marker:{size:11,color:'#B45309',symbol:'diamond',line:{color:'#fff',width:1.5}},
     hovertemplate:'L\u1D9C\u1D67 = %{x:.2f} ft<br>%{y:.1f} kip<extra></extra>'},
    {x:[Math.max(Lx,Ly)],y:[cc.phiPn],mode:'markers+text',name:'governing \u03C6P\u2099',
     marker:{size:13,color:'#046C4E',symbol:'star',line:{color:'#fff',width:1.5}},
     text:[' '+fmt(cc.phiPn,0)],textposition:'middle right',textfont:{size:9,color:'#046C4E'},
     hovertemplate:'governing \u03C6P\u2099 = %{y:.1f} kip<extra></extra>'}];
  return{data,layout:{
    title:{text:'Design compressive strength vs effective length',font:{size:11,family:'Arial'},x:0},
    margin:{l:58,r:20,t:30,b:42},height:330,
    xaxis:{title:{text:'L\u1D9C (ft)',font:{size:9.5}},range:[0,Lmax],gridcolor:'#EEF1F5'},
    yaxis:{title:{text:'\u03C6P\u2099 (kip)',font:{size:9.5}},range:[0,ymax],gridcolor:'#EEF1F5'},
    shapes,annotations:anns,
    legend:{font:{size:8.5},orientation:'h',y:1.18,x:1,xanchor:'right'},
    paper_bgcolor:'#fff',plot_bgcolor:'#fff',hovermode:'closest'}};
}
