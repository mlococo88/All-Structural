function comboTable(list,isSvc){
  const t=el('table','cfg');
  const hd=el('tr');
  const cols=['On'].concat(S.cases.map(c=>c.id)).concat(isSvc?['L/den']:[]).concat(['','']);
  cols.forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
  list.forEach((c,i)=>{
    const tr=el('tr');
    const tdOn=el('td');tdOn.appendChild(chkInput(()=>c.on!==false,v=>{c.on=v;},(isSvc?'sv':'cb')+'on'+i));tr.appendChild(tdOn);
    S.cases.forEach(cs=>{
      const td=el('td');
      const inp=numInput(()=>c.f[cs.id]!=null?c.f[cs.id]:null,v=>{
        if(v==null||v===0)delete c.f[cs.id];else c.f[cs.id]=v;
      },0.1,(isSvc?'sv':'cb')+i+'_'+cs.id);
      inp.style.width='46px';inp.placeholder='0';
      td.appendChild(inp);tr.appendChild(td);
    });
    if(isSvc){
      const td=el('td');
      const inp=numInput(()=>c.den||0,v=>{c.den=v||0;},60,'svden'+i);
      inp.style.width='52px';td.appendChild(inp);tr.appendChild(td);
    }
    const tdN=el('td','hint');tdN.textContent=comboName(c.f);tdN.style.textAlign='left';tr.appendChild(tdN);
    const tdX=el('td');
    const del=el('button','btn sm danger','\u2715');
    del.addEventListener('click',()=>{list.splice(i,1);rebuildInputs();schedule(true);});
    tdX.appendChild(del);tr.appendChild(tdX);
    t.appendChild(tr);
  });
  return t;
}
function loadTable(){
  const t=el('table','cfg');t.id='loadTbl';
  const hd=el('tr');['Name','Type','Case','Span','v\u2081','v\u2082','x\u2081','x\u2082','On',''].forEach(h=>hd.appendChild(el('th',null,h)));
  t.appendChild(hd);
  S.loads.forEach((ld,i)=>{
    const locked=!!ld.gen;
    const tr=el('tr',locked?'locked':null);
    const tdN=el('td');tdN.style.textAlign='left';
    tdN.innerHTML=(ld.nm||'')+(locked?'<span class="genBadge">'+(ld.gen.src==='sw'?'auto SW':'trib')+'</span>':'');
    tr.appendChild(tdN);
    if(locked){
      tr.appendChild(el('td','hint','uniform'));
      const chip=el('span','caseChip',ld.lc);chip.setAttribute('style',caseStyle(ld.lc));
      const tdc=el('td');tdc.appendChild(chip);tr.appendChild(tdc);
      tr.appendChild(el('td','hint','all'));
      tr.appendChild(el('td',null,fmt(ld.mag,3)));
      tr.appendChild(el('td','hint','kip/ft'));
      tr.appendChild(el('td','hint','\u2014'));tr.appendChild(el('td','hint','\u2014'));
      const tdOn=el('td');tdOn.appendChild(chkInput(()=>!ld.off,v=>{ld.off=!v;},'ldon'+i));tr.appendChild(tdOn);
      tr.appendChild(el('td','hint',''));
      t.appendChild(tr);return;
    }
    const tdT=el('td');
    tdT.appendChild(selInput(['point','uniform','trap','moment'],()=>ld.type,v=>{
      const spL=spanLen(ld);
      const val=ld.type==='trap'?(ld.sm!=null?ld.sm:1):(ld.mag!=null?ld.mag:1);
      const pos=ld.type==='trap'?(ld.sx||0):(ld.pos!=null?ld.pos:spL/2);
      ld.type=v;
      if(v==='point'||v==='moment'){ld.mag=val;ld.pos=pos;ld.allSpans=false;}
      else if(v==='uniform'){ld.mag=val;}
      else{ld.sm=val;ld.em=ld.em!=null?ld.em:val;ld.sx=0;ld.ex=spL;ld.allSpans=false;}
      clampLoad(ld);rebuildInputs();
    },o=>({point:'Point',uniform:'Uniform',trap:'Trapez.',moment:'Moment'}[o]),null,'ldtp'+i));
    tr.appendChild(tdT);
    const tdC=el('td');
    tdC.appendChild(selInput(S.cases.map(c=>c.id),()=>ld.lc,v=>{ld.lc=v;},null,null,'ldlc'+i));
    tr.appendChild(tdC);
    const tdS=el('td');
    const spanOpts=S.geom.spans.map((_,k)=>''+k).concat(ld.type==='uniform'?['all']:[]);
    tdS.appendChild(selInput(spanOpts,
      ()=>ld.allSpans?'all':''+(ld.si||0),
      v=>{if(v==='all'){ld.allSpans=true;}else{ld.allSpans=false;ld.si=+v;}clampLoad(ld);},
      o=>o==='all'?'All':'Sp '+(+o+1),null,'ldsp'+i));
    tr.appendChild(tdS);
    const mk=(get,set,key)=>{const td=el('td');td.appendChild(numInput(get,set,'any',key));return td;};
    if(ld.type==='trap'){
      tr.appendChild(mk(()=>ld.sm,v=>{ld.sm=v||0;},'ldv1'+i));
      tr.appendChild(mk(()=>ld.em,v=>{ld.em=v||0;},'ldv2'+i));
      tr.appendChild(mk(()=>ld.sx,v=>{ld.sx=v||0;clampLoad(ld);},'ldx1'+i));
      tr.appendChild(mk(()=>ld.ex,v=>{ld.ex=v||0;clampLoad(ld);},'ldx2'+i));
    }else if(ld.type==='uniform'){
      tr.appendChild(mk(()=>ld.mag,v=>{ld.mag=v||0;},'ldv1'+i));
      tr.appendChild(el('td','hint','\u2014'));tr.appendChild(el('td','hint','\u2014'));tr.appendChild(el('td','hint','\u2014'));
    }else{
      tr.appendChild(mk(()=>ld.mag,v=>{ld.mag=v||0;},'ldv1'+i));
      tr.appendChild(el('td','hint','\u2014'));
      tr.appendChild(mk(()=>ld.pos,v=>{ld.pos=v||0;clampLoad(ld);},'ldx1'+i));
      tr.appendChild(el('td','hint','\u2014'));
    }
    const tdOn=el('td');tdOn.appendChild(chkInput(()=>!ld.off,v=>{ld.off=!v;},'ldon'+i));tr.appendChild(tdOn);
    const tdX=el('td');
    const del=el('button','btn sm danger','\u2715');
    del.addEventListener('click',()=>{S.loads.splice(i,1);rebuildInputs();schedule(true);});
    tdX.appendChild(del);tr.appendChild(tdX);
    t.appendChild(tr);
  });
  if(!S.loads.length){
    const tr=el('tr');const td=el('td','hint','No loads yet \u2014 enable the tributary generator or add loads above.');
    td.colSpan=10;tr.appendChild(td);t.appendChild(tr);
  }
  return t;
}
/* =====================================================================
   TABS + RENDER PIPELINE
   ===================================================================== */
function TABS(){return[
  ['tabSummary','Summary'],
  ['tabSchem','Schematic & Inputs'],
  ['tabDerive','Load Derivation'],
  ['tabAnalysis','Analysis Results'],
  ['tabService','Serviceability'],
  ['tabSection','Section Properties'],
  ['tabChecks','Design Checks'],
  ['tabValid','Validation'],
  ['tabManual','User Manual']
];}
function buildTabs(){
  const bar=$('tabBar');bar.innerHTML='';
  const tabs=TABS();
  if(!tabs.find(t=>t[0]===S.ui.tab))S.ui.tab='tabSummary';
  tabs.forEach(([id,label])=>{
    const b=el('button',null,label);
    if(id===S.ui.tab)b.classList.add('active');
    b.addEventListener('click',()=>{S.ui.tab=id;autosave();buildTabs();});
    bar.appendChild(b);
  });
  renderTab();
}
function renderTab(){
  const pages=$('tabPages');pages.innerHTML='';
  const pg=el('div','tabPage');pg.id='page_'+S.ui.tab;pages.appendChild(pg);
  resetSecNum();
  if(AN&&AN.blockers&&AN.blockers.length&&S.ui.tab!=='tabManual'&&S.ui.tab!=='tabValid'){
    const b=el('div','errBox','<b>Output withheld \u2014 the model is not valid:</b><br>'+AN.blockers.map(x=>'\u2022 '+x).join('<br>'));
    pg.appendChild(b);
    if(S.ui.tab!=='tabSchem')return;
  }
  switch(S.ui.tab){
    case 'tabSummary':buildSummaryTab(pg);break;
    case 'tabSchem':buildSchemTab(pg);break;
    case 'tabDerive':buildDeriveTab(pg);break;
    case 'tabAnalysis':buildAnalysisTab(pg);break;
    case 'tabService':buildServiceTab(pg);break;
    case 'tabSection':buildSectionTab(pg);break;
    case 'tabChecks':buildChecksTab(pg);break;
    case 'tabValid':buildValidTab(pg);break;
    case 'tabManual':buildManualTab(pg);break;
  }
}
let schedT=null;
function schedule(structural){
  $('updDot').classList.add('show');
  clearTimeout(schedT);
  schedT=setTimeout(()=>{
    computeAll();
    if(structural)rebuildInputs();
    renderTab();
    autosave();pushHist();
    $('updDot').classList.remove('show');
  },160);
}
function fullRebuild(){
  computeAll();buildProjHeader();rebuildInputs();buildTabs();autosave();pushHist();
}
/* ---- combo display selector (shared) ---- */
function comboSelector(parent,label){
  if(!AN||!AN.combos.length)return;
  if(!AN.combos.find(c=>c.id===S.disp.combo))S.disp.combo=AN.combos[0].id;
  const govI=governingComboId();
  const sel=selInput(AN.combos.map(c=>c.id),()=>S.disp.combo,v=>{S.disp.combo=v;},
    id=>{const c=AN.combos.find(x=>x.id===id);return c.name+(id===govI?'  (governing |M|)':'');},null,'dispCombo');
  fRow(parent,label||'Diagrams show combination',sel,'');
}
function governingComboId(){
  if(!AN||!AN.combos.length)return null;
  let gi=AN.combos[0].id,best=-1;
  AN.combos.forEach(c=>{if(Math.abs(c.Mabs.v)>best){best=Math.abs(c.Mabs.v);gi=c.id;}});
  return gi;
}
function curCombo(){return AN.combos.find(c=>c.id===S.disp.combo)||AN.combos[0];}
/* =====================================================================
   TAB — SUMMARY DASHBOARD (§4)
   ===================================================================== */
function buildSummaryTab(pg){
  const checks=[];
  /* stability */
  checks.push({label:'Model stability',ref:'mechanics',status:AN.stable?'pass':'fail',
    detail:AN.stable?'stable':'mechanism',tab:'tabSchem'});
  /* equilibrium per combo */
  AN.combos.forEach(c=>{
    const err=Math.abs(c.sumR-c.sumF);
    const ok=err<=Math.max(1e-6,Math.abs(c.sumF)*1e-6+1e-6);
    checks.push({label:'\u03A3R = \u03A3F \u2014 '+c.name,ref:'statics',status:ok?'pass':'fail',
      detail:fmt(c.sumR,3)+' vs '+fmt(c.sumF,3)+' kip',tab:'tabAnalysis'});
  });
  /* deflection checks */
  AN.svc.forEach(sc=>{
    sc.perSpan.forEach(ps=>{
      if(ps.lim==null){
        checks.push({label:'\u03B4 span '+(ps.span+1)+' \u2014 '+sc.name,ref:'report only',status:'na',
          detail:fmt(Math.abs(ps.dmax)*12,3)+' in (no limit set)',tab:'tabService'});
      }else{
        checks.push({label:'\u03B4 \u2264 L/'+sc.den+' \u2014 span '+(ps.span+1)+', '+sc.name,ref:'IBC 1604.3',
          status:ps.pass?'pass':'fail',
          detail:'DCR '+fmt(ps.ratio,2),tab:'tabService'});
      }
    });
  });
  /* stage-2 placeholders: honest N/A, not silent absence (§4, §8) */
  ['Flexure (Ch. F)','Shear (Ch. G)','Compression (Ch. E)','Combined forces (Ch. H)','Concentrated forces (J10)','HSS torsion (H3)'].forEach(nm=>{
    checks.push({label:nm,ref:'Stage 2',status:'na',detail:'not yet implemented',tab:'tabChecks'});
  });
  const dash=el('div');dash.id='dash';
  checks.forEach(c=>{
    const chip=el('div','chip '+c.status);
    chip.appendChild(el('span','dot'));
    chip.appendChild(el('span',null,c.label));
    chip.appendChild(el('span','ratio',c.status==='na'?'N/A':c.detail));
    chip.title=c.detail+' ['+c.ref+']';
    chip.addEventListener('click',()=>{S.ui.tab=c.tab;autosave();buildTabs();});
    dash.appendChild(chip);
  });
  pg.appendChild(dash);
  const fails=checks.filter(c=>c.status==='fail');
  pg.appendChild(el('div',fails.length?'errBox':'okBox',
    fails.length?('One or more checks FAIL \u2014 see red chips ('+fails.length+').'):
    'All implemented checks pass. Strength checks (flexure, shear, axial, interaction, J10, torsion) arrive in Stage 2 and are shown N/A above so their absence is explicit, not silent.'));
  AN.bracingNotes.forEach(n=>pg.appendChild(el('div','warnBox',n)));
  AN.warns.forEach(n=>pg.appendChild(el('div','warnBox',n)));
  mkSection('sumPeaks','Envelope Peaks \u2014 Strength Combinations',body=>{
    if(!AN.env){body.appendChild(el('div','note','No strength combinations enabled.'));return;}
    const mx=(arr,C)=>{let bi=0;for(let i=1;i<arr.length;i++)if(Math.abs(arr[i])>Math.abs(arr[bi]))bi=i;
      return{v:arr[bi],x:AN.stations[bi],c:C[bi]};};
    const vE=mx(AN.env.Vmx.map((v,i)=>Math.abs(v)>Math.abs(AN.env.Vmn[i])?v:AN.env.Vmn[i]),
                AN.env.Vmx.map((v,i)=>Math.abs(v)>Math.abs(AN.env.Vmn[i])?AN.env.VmxC[i]:AN.env.VmnC[i]));
    const mPos=mx(AN.env.Mmx,AN.env.MmxC),mNeg=mx(AN.env.Mmn,AN.env.MmnC);
    const t=el('table','tbl');
    const hd=el('tr');['Quantity','Value','at x (ft)','Governing combination'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    const nameOf=id=>{const c=AN.combos.find(x=>x.id===id);return c?c.name:id;};
    [['|V|max',fmt(vE.v,2)+' kip',fmt(vE.x,2),nameOf(vE.c)],
     ['+M max',fmt(Math.max(0,mPos.v),2)+' kip\u00B7ft',fmt(mPos.x,2),nameOf(mPos.c)],
     ['\u2212M max',fmt(Math.min(0,mNeg.v),2)+' kip\u00B7ft',fmt(mNeg.x,2),nameOf(mNeg.c)]
    ].forEach(r=>{const tr=el('tr');r.forEach((v,i)=>tr.appendChild(el('td',i===0?'lft':null,v)));t.appendChild(tr);});
    body.appendChild(t);
    const rt=el('table','tbl');
    const rh=el('tr');['Node','R max (kip)','combo','R min (kip)','combo'].forEach(h=>rh.appendChild(el('th',null,h)));rt.appendChild(rh);
    S.geom.nodes.forEach((nd2,j)=>{
      if(nd2.t==='free')return;
      const e=AN.env.R[j],tr=el('tr');
      [NN[j],fmt(e.mx,2),nameOf(e.mxC),fmt(e.mn,2),nameOf(e.mnC)].forEach((v,i)=>tr.appendChild(el('td',i===0?'lft':null,v)));
      if(e.mn<-1e-6)tr.className='gov';
      rt.appendChild(tr);
    });
    body.appendChild(rt);
    if(AN.env.R.some((e,j)=>S.geom.nodes[j].t!=='free'&&e.mn<-1e-6))
      body.appendChild(el('div','warnBox','Uplift: at least one support reaction goes negative under a strength combination (highlighted). Verify anchorage; Stage-2 bracing logic treats reversed-curvature cases per the note on the Summary tab.'));
  },pg);
  mkSection('sumAssume','Engineering Assumptions',body=>{
    body.appendChild(el('div','note',(S.assume&&S.assume.trim())?S.assume.replace(/\n/g,'<br>'):'<i>None entered. Use the Assumptions box in the input panel.</i>'));
  },pg);
}

  },pg);
  mkSection('schGeom','Geometry Echo',body=>{
    const t=el('table','tbl');
    const hd=el('tr');['Span','L (ft)','Left node','Right node'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    S.geom.spans.forEach((sp,i)=>{
      const tr=el('tr');
      [i+1,fmt(sp.L,2),NN[i]+' ('+S.geom.nodes[i].t+')',NN[i+1]+' ('+S.geom.nodes[i+1].t+')']
        .forEach((v,k)=>tr.appendChild(el('td',k>1?'lft':null,''+v)));
      t.appendChild(tr);
    });
    body.appendChild(t);
    body.appendChild(el('div','note','Total length L = '+fmt(totalL(),2)+' ft. Sign conventions: loads +down, reactions +up, sagging M+, applied couples +CCW, \u03B4 reported +down.'));
  },pg);
  mkSection('schLoads','Load Echo (unfactored)',body=>{
    const t=el('table','tbl');
    const hd=el('tr');['Name','Type','Case','Extent','Magnitude','Status'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    S.loads.forEach(ld=>{
      const tr=el('tr');
      const ext=ld.allSpans?'entire beam':('span '+((ld.si||0)+1)+(ld.type==='point'||ld.type==='moment'?(' @ '+fmt(ld.pos,2)+' ft'):(ld.type==='trap'?(' x='+fmt(ld.sx,2)+'\u2013'+fmt(ld.ex,2)+' ft'):'')));
      const mag=ld.type==='point'?fmt(ld.mag,3)+' kip':
        ld.type==='moment'?fmt(ld.mag,3)+' kip\u00B7ft (+CCW)':
        ld.type==='uniform'?fmt(ld.mag,3)+' kip/ft':
        fmt(ld.sm,3)+' \u2192 '+fmt(ld.em,3)+' kip/ft';
      [ld.nm+(ld.gen?' (generated)':''),ld.type,ld.lc,ext,mag,ld.off?'EXCLUDED':'active']
        .forEach((v,k)=>tr.appendChild(el('td',k===0||k===3?'lft':null,''+v)));
      if(ld.off)tr.style.opacity=.5;
      t.appendChild(tr);
    });
    if(!S.loads.length){const tr=el('tr');const td=el('td','hint','No loads.');td.colSpan=6;tr.appendChild(td);t.appendChild(tr);}
    body.appendChild(t);
  },pg);
}
function drawSchematic(){
  const wrap=el('div','schemWrap');
  const SVGNS='http://www.w3.org/2000/svg';
  const L=totalL(),nX=nodeXs();
  const W=860,H=250,PL=42,PR=30,beamY=150;
  const sx=x=>PL+(x/L)*(W-PL-PR);
  const svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width','100%');
  const add=(tag,attrs,title)=>{
    const e2=document.createElementNS(SVGNS,tag);
    Object.keys(attrs).forEach(k=>e2.setAttribute(k,attrs[k]));
    if(title){const t=document.createElementNS(SVGNS,'title');t.textContent=title;e2.appendChild(t);}
    svg.appendChild(e2);return e2;
  };
  const txt=(x,y,str,size,anchor,color,bold)=>{
    const t=add('text',{x,y,'font-size':size||10,'text-anchor':anchor||'middle',fill:color||'#334155','font-weight':bold?'700':'400'});
    t.textContent=str;return t;
  };
  /* beam */
  add('rect',{x:sx(0),y:beamY-4,width:sx(L)-sx(0),height:8,fill:'#5B7290',rx:2});
  /* supports */
  S.geom.nodes.forEach((nd2,j)=>{
    const px=sx(nX[j]);
    if(nd2.t==='pin'){
      add('path',{d:'M'+px+' '+(beamY+4)+' l-10 16 l20 0 z',fill:'#fff',stroke:'#16304F','stroke-width':1.6},'Node '+NN[j]+': pin/roller');
      for(let k=-11;k<=7;k+=6)add('line',{x1:px+k,y1:beamY+26,x2:px+k+5,y2:beamY+20,stroke:'#94A3B8','stroke-width':1});
    }else if(nd2.t==='fixed'){
      add('line',{x1:px,y1:beamY-16,x2:px,y2:beamY+16,stroke:'#16304F','stroke-width':3.2},'Node '+NN[j]+': fixed');
      for(let k=-14;k<=12;k+=6)add('line',{x1:px,y1:beamY-14+ (k+14),x2:px-7,y2:beamY-8+(k+14),stroke:'#94A3B8','stroke-width':1});
    }else{
      txt(px,beamY+22,'free',8.5,'middle','#9F1239');
    }
    txt(px,beamY+40,NN[j],10.5,'middle','#16304F',true);
  });
  /* span dims */
  S.geom.spans.forEach((sp,i)=>{
    const x1=sx(nX[i]),x2=sx(nX[i+1]),y=beamY+56;
    add('line',{x1,y1:y,x2,y2:y,stroke:'#64748B','stroke-width':1});
    [[x1,1],[x2,-1]].forEach(([ax,d])=>add('path',{d:'M'+ax+' '+y+' l'+(6*d)+' -3 l0 6 z',fill:'#64748B'}));
    add('line',{x1,y1:y-4,x2:x1,y2:y+4,stroke:'#64748B'});
    add('line',{x1:x2,y1:y-4,x2:x2,y2:y+4,stroke:'#64748B'});
    txt((x1+x2)/2,y-4,fmt(sp.L,2)+' ft',9.5,'middle','#334155');
  });
  /* loads */
  let mxW=0,mxP=0;
  S.loads.forEach(ld=>{
    if(ld.off)return;
    if(ld.type==='point')mxP=Math.max(mxP,Math.abs(ld.mag));
    else if(ld.type==='uniform')mxW=Math.max(mxW,Math.abs(ld.mag));
    else if(ld.type==='trap')mxW=Math.max(mxW,Math.abs(ld.sm),Math.abs(ld.em));
  });
  const wH=w=>mxW?12+34*Math.abs(w)/mxW:0;
  const pH=p=>mxP?20+30*Math.abs(p)/mxP:0;
  const TCOL={point:'#10b981',uniform:'#f59e0b',trap:'#8b5cf6',moment:'#f43f5e'};
  S.loads.forEach(ld=>{
    if(ld.off)return;
    const si=Math.min(ld.si||0,S.geom.spans.length-1),x0=nX[si],spL=S.geom.spans[si].L;
    const col=TCOL[ld.type];
    if(ld.type==='uniform'){
      const gx1=ld.allSpans?0:x0,gx2=ld.allSpans?L:x0+spL,h=wH(ld.mag);
      add('rect',{x:sx(gx1),y:beamY-6-h,width:sx(gx2)-sx(gx1),height:h,fill:col,opacity:.28,stroke:col},
        ld.nm+': w = '+fmt(ld.mag,3)+' kip/ft ('+ld.lc+')');
      for(let x=gx1;x<=gx2+1e-9;x+=Math.max((gx2-gx1)/10,.5))
        add('path',{d:'M'+sx(Math.min(x,gx2))+' '+(beamY-6-h*0.35)+' l-3 -6 l6 0 z',fill:col,transform:'rotate(180 '+sx(Math.min(x,gx2))+' '+(beamY-8)+')'});
      txt((sx(gx1)+sx(gx2))/2,beamY-9-h,ld.nm+' = '+fmt(ld.mag,2)+' klf',8.5,'middle',col,true);
    }else if(ld.type==='trap'){
      const gx1=x0+(ld.sx||0),gx2=x0+(ld.ex||spL),h1=wH(ld.sm),h2=wH(ld.em);
      add('path',{d:'M'+sx(gx1)+' '+(beamY-6)+' L'+sx(gx1)+' '+(beamY-6-h1)+' L'+sx(gx2)+' '+(beamY-6-h2)+' L'+sx(gx2)+' '+(beamY-6)+' Z',
        fill:col,opacity:.28,stroke:col},ld.nm+': '+fmt(ld.sm,3)+' \u2192 '+fmt(ld.em,3)+' kip/ft ('+ld.lc+')');
      txt((sx(gx1)+sx(gx2))/2,beamY-10-Math.max(h1,h2),ld.nm,8.5,'middle',col,true);
    }else if(ld.type==='point'){
      const gx=x0+Math.max(0,Math.min(spL,ld.pos||0)),h=pH(ld.mag),px=sx(gx);
      const down=ld.mag>=0;
      add('line',{x1:px,y1:beamY-6-h,x2:px,y2:beamY-8,stroke:col,'stroke-width':2.4},
        ld.nm+': P = '+fmt(ld.mag,3)+' kip @ x='+fmt(gx,2)+' ft ('+ld.lc+')');
      add('path',{d:down?('M'+px+' '+(beamY-6)+' l-5 -9 l10 0 z'):('M'+px+' '+(beamY-6-h)+' l-5 9 l10 0 z'),fill:col});
      txt(px,beamY-10-h,ld.nm+'='+fmt(ld.mag,1)+'k',8.5,'middle',col,true);
    }else{
      const gx=x0+Math.max(0,Math.min(spL,ld.pos||0)),px=sx(gx);
      add('path',{d:'M'+(px-10)+' '+(beamY-16)+' A10 10 0 1 1 '+(px+9)+' '+(beamY-19),fill:'none',stroke:col,'stroke-width':2.2},
        ld.nm+': M = '+fmt(ld.mag,3)+' kip\u00B7ft (+CCW) @ x='+fmt(gx,2)+' ft ('+ld.lc+')');
      add('path',{d:'M'+(px+9)+' '+(beamY-19)+' l-7 -2 l3 7 z',fill:col});
      txt(px,beamY-30,ld.nm+'='+fmt(ld.mag,1),8.5,'middle',col,true);
    }
  });
  /* bracing annotation */
  txt(PL,16,'Top flange: '+(S.bracing.topCont?'continuously braced':('Lb = '+fmt(S.bracing.LbTop,1)+' ft')),9,'start','#0F766E',true);
  txt(PL,29,'Bottom flange: Lb = '+(S.bracing.LbBot!=null?fmt(S.bracing.LbBot,1)+' ft':'support-to-support (default)'),9,'start','#0F766E');
  txt(W-PR,16,(AN&&AN.sect?AN.sect.lbl+' \u00B7 '+AN.sect.mat.name:''),9.5,'end','#16304F',true);
  wrap.appendChild(svg);
  return wrap;
}
/* =====================================================================
   TAB — LOAD DERIVATION (§0: symbolic → substituted → result)
   ===================================================================== */
function buildDeriveTab(pg){
  if(!S.trib.on&&!S.trib.sw){
    pg.appendChild(el('div','note','The tributary generator and auto self-weight are both off; all loads are entered directly. Nothing to derive.'));
    return;
  }
  mkSection('dvTrib','Area \u2192 Line Load Conversion',body=>{
    body.appendChild(el('div','note','One-way tributary model: the deck spans perpendicular to this beam and delivers load as if simply supported on it. w = p\u00B7(TW\u2097+TW\u1D63)/1000 + w\u2097\u1D62\u2099\u2091. Deck continuity over the beam (which raises the delivered reaction) is neglected \u2014 standard practice, disclosed per Manual \u00A70.3.'));
    S.cases.forEach(cs=>{
      const p=S.trib.p[cs.id]||0,ln=S.trib.line[cs.id]||0;
      if(!p&&!ln)return;
      const w=tribW(cs.id);
      body.appendChild(eqBlock({
        title:'Case '+cs.id+(cs.name&&cs.name!==cs.id?' \u2014 '+cs.name:''),
        lines:[
          'w_{'+cs.id+'} = \\frac{p\\,(TW_L+TW_R)}{1000} + w_{line}',
          'w_{'+cs.id+'} = \\frac{'+p+'\\,('+fmt(S.trib.twL,2)+'+'+fmt(S.trib.twR,2)+')}{1000} + '+fmt(ln,3)+' = \\mathbf{'+fmt(w,4)+'}\\ \\text{kip/ft}'
        ],
        vars:[['p',p+' psf','area pressure, case '+cs.id],
              ['TW_L,\\,TW_R',fmt(S.trib.twL,2)+', '+fmt(S.trib.twR,2)+' ft','tributary width each side'],
              ['w_{line}',fmt(ln,3)+' kip/ft','directly applied line load (facade, partitions, etc.)']]
      }));
    });
  },pg);
  if(S.trib.sw)mkSection('dvSW','Automatic Self-Weight \u2192 Dead Case',body=>{
    const p=resolveSection();
    const w=selfWeightW();
    body.appendChild(eqBlock({
      title:'Member self-weight ('+(p?p.lbl:'?')+')',
      lines:['w_{sw} = \\frac{W_{shape}}{1000} = \\frac{'+fmt(p?p.Wt:0,1)+'}{1000} = \\mathbf{'+fmt(w,4)+'}\\ \\text{kip/ft}'],
      vars:[['W_{shape}',fmt(p?p.Wt:0,1)+' lb/ft','nominal shape weight, '+DBVER+(p&&p._src.Wt==='ovr'?' (user override)':'')]]
    }));
    body.appendChild(el('div','hint','Changing the shape updates w_sw and re-runs the analysis automatically.'));
  },pg);
  mkSection('dvFact','Factored Line Loads per Combination',body=>{
    const gen=S.loads.filter(ld=>ld.gen&&!ld.off);
    if(!gen.length){body.appendChild(el('div','note','No active generated loads.'));return;}
    const t=el('table','tbl');
    const hd=el('tr');
    ['Combination'].concat(gen.map(g=>g.nm)).concat(['\u03A3 w (kip/ft)']).forEach(h=>hd.appendChild(el('th',null,h)));
    t.appendChild(hd);
    S.combos.filter(c=>c.on!==false).forEach(c=>{
      const tr=el('tr');
      tr.appendChild(el('td','lft',comboName(c.f)));
      let sum=0;
      gen.forEach(g=>{
        const v=(c.f[g.lc]||0)*g.mag;sum+=v;
        tr.appendChild(el('td',null,fmt(v,3)));
      });
      tr.appendChild(el('td',null,'<b>'+fmt(sum,3)+'</b>'));
      t.appendChild(tr);
    });
    body.appendChild(t);
    body.appendChild(el('div','hint','Cell = load factor \u00D7 unfactored w. Manually entered loads (if any) act in addition to these.'));
  },pg);
}
/* =====================================================================
   TAB — ANALYSIS RESULTS  (§7.1 every combination fully worked)
   ===================================================================== */
function buildAnalysisTab(pg){
  comboSelector(pg);
  const c=curCombo();if(!c)return;
  mkSection('anDia','Diagrams \u2014 '+c.name,body=>{
    ['plotV','plotM'].forEach(id=>{const d=el('div','plotHold');d.id=id;body.appendChild(d);});
    body.appendChild(el('div','hint','Interactive: hover for values, drag to zoom, double-click to reset. Legend entries toggle. Grey dashed = interior supports; the envelope band (all enabled combinations) is drawn behind the active combination.'));
    setTimeout(drawDiagrams,30);
  },pg);
  /* per-combination worked sections — §7.1 with §7.2 identical-actions cross-ref */
  const seen={};
  AN.combos.forEach(cb=>{
    mkSection('anC_'+cb.id,'Combination '+cb.name+(cb.id===governingComboId()?' \u2014 governing |M|':''),body=>{
      const sig=cb.sig;
      if(seen[sig]&&seen[sig]!==cb.id){
        const ref=AN.combos.find(x=>x.id===seen[sig]);
        body.appendChild(el('div','note','Produces factored actions <b>identical</b> to combination <b>'+ref.name+'</b> (all case factors equal); see that section for the complete derivation. Repeating it would add length without information (\u00A77.2).'));
        return;
      }
      seen[sig]=cb.id;
      body.appendChild(el('div','note','<b>Direct Stiffness Method</b> \u2014 Euler-Bernoulli elements, global assembly, Gaussian elimination with partial pivoting. Boundary conditions: '+
        S.geom.nodes.map((n2,j)=>NN[j]+' '+(n2.t==='free'?'free':n2.t==='fixed'?'(v=0, \u03B8=0)':'(v=0)')).join('; ')+'.'));
      body.appendChild(eqBlock({title:'Element stiffness (per span, EI = '+fmt(EKSI*( AN.sect?AN.sect.Ix:0)/144,0)+' kip\u00B7ft\u00B2)',
        lines:['\\mathbf{k}_e=\\frac{EI}{L^3}\\begin{bmatrix}12&6L&-12&6L\\\\6L&4L^2&-6L&2L^2\\\\-12&-6L&12&-6L\\\\6L&2L^2&-6L&4L^2\\end{bmatrix},\\qquad \\mathbf{K}_{ff}\\,\\mathbf{d}_f=\\mathbf{f}_f,\\qquad \\mathbf{R}=\\mathbf{f}-\\mathbf{K}\\mathbf{d}'],
        vars:[['E','29{,}000 ksi','steel modulus'],['I',fmt(AN.sect?AN.sect.Ix:0,1)+' in\u2074','resolved I\u2093 of '+(AN.sect?AN.sect.lbl:'')]]}));
      /* reactions */
      S.geom.nodes.forEach((nd2,j)=>{
        if(nd2.t==='free')return;
        const R=cb.R[j];
        const lines=['R_{'+NN[j]+'}=\\boxed{'+fmt(R.v,3)+'\\ \\text{kip}\\uparrow}'+(Math.abs(R.m)>1e-6?(',\\qquad M^R_{'+NN[j]+'}='+fmt(R.m,3)+'\\ \\text{kip\u00B7ft}'):'')];
        body.appendChild(eqBlock({title:'Reaction at node '+NN[j]+' ('+nd2.t+')',lines}));
      });
      const eqOk=Math.abs(cb.sumR-cb.sumF)<=Math.max(1e-6,Math.abs(cb.sumF)*1e-6);
      body.appendChild(el('div',eqOk?'okBox':'errBox',
        'Equilibrium: \u03A3R = '+fmt(cb.sumR,4)+' kip vs \u03A3F\u2193 = '+fmt(cb.sumF,4)+' kip '+(eqOk?'\u2713':'\u2717 MISMATCH')));
      /* peaks + criticals */
      const t=el('table','tbl');
      const hd=el('tr');['Quantity','Value','at x (ft)'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
      [['V max',fmt(cb.Vmax.v,3)+' kip',fmt(cb.Vmax.x,3)],
       ['V min',fmt(cb.Vmin.v,3)+' kip',fmt(cb.Vmin.x,3)],
       ['M max (+)',fmt(cb.Mmax.v,3)+' kip\u00B7ft',fmt(cb.Mmax.x,3)],
       ['M min (\u2212)',fmt(cb.Mmin.v,3)+' kip\u00B7ft',fmt(cb.Mmin.x,3)]
      ].forEach(r=>{const tr=el('tr');r.forEach((v,i)=>tr.appendChild(el('td',i===0?'lft':null,v)));t.appendChild(tr);});
      body.appendChild(t);
      if(cb.zV.length)body.appendChild(el('div','note','<b>V = 0 (moment extrema / L\u1D65 stations):</b> x = '+cb.zV.map(x=>fmt(x,3)).join(', ')+' ft'));
      if(cb.inf.length)body.appendChild(el('div','note','<b>Inflection points (M = 0):</b> x = '+cb.inf.map(x=>fmt(x,3)).join(', ')+' ft \u2014 <i>not</i> brace points.'));
      if(cb.negR.length)body.appendChild(el('div','note','<b>Negative-moment regions (bottom flange in compression):</b> '+
        cb.negR.map(r=>fmt(r[0],2)+'\u2013'+fmt(r[1],2)+' ft (len '+fmt(r[1]-r[0],2)+' ft)').join('; ')));
    },pg);
  });
  mkSection('anTable','Tabulated Results \u2014 '+c.name,body=>{
    body.appendChild(stationTable(c));
    body.appendChild(el('div','hint','Rows: span tenth-points, supports, V=0 stations, load points and user stations. Shear at a point-load station is reported just left / just right of the load.'));
  },pg);
}
function stationTable(cb){
  const nX=nodeXs();
  const rows=[];
  S.geom.spans.forEach((sp,i)=>{
    for(let k=0;k<=10;k++)rows.push({x:nX[i]+k/10*sp.L,tag:k===0?('node '+NN[i]):k===10?('node '+NN[i+1]):('sp'+(i+1)+' 0.'+k+'L')});
  });
  cb.zV.forEach(x=>rows.push({x,tag:'V=0'}));
  userXList().forEach(x=>rows.push({x,tag:'user'}));
  const seen={};
  const list=rows.filter(r=>{const k=r.x.toFixed(5);if(seen[k])return false;seen[k]=1;return true;}).sort((a,b)=>a.x-b.x);
  const t=el('table','tbl');
  const hd=el('tr');['x (ft)','','V\u2097 (kip)','V\u1D63 (kip)','M (kip\u00B7ft)'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
  list.forEach(r=>{

      detail:ch.na?(ch.detail||'N/A'):('DCR '+fmt(ch.dcr,2)+(ch.combo?(' \u2014 '+ch.combo):'')),

        .forEach((v,i)=>tr.appendChild(el('td',i<3?'lft':null,''+v)));

  mkSection('sumAssume','Engineering Assumptions',body=>{
    body.appendChild(el('div','note',(S.assume&&S.assume.trim())?S.assume.replace(/\n/g,'<br>'):'<i>None entered.</i>'));

}

          'M_n=F_{cr}S_x='+fmt(d.Fcr,1)+'\\times '+fmt(p.Sx,1)+'=\\mathbf{'+fmt(L2.Mn,0)+'}\\ \\text{kip\u00B7in}\\le M_p']}));

    const FLB=cap.ls.find(l=>l.name.includes('Flange'));

    const L2=cap.ls.find(l=>l.name.includes('Lateral'));
    if(L2&&L2.applies)body.appendChild(eqBlock({title:'Lateral-torsional buckling',ref:L2.clause,
      lines:['L_p='+fmt(L2.d.Lp/12,2)+'\\ \\text{ft},\\ L_r='+fmt(L2.d.Lr/12,1)+'\\ \\text{ft}\\ \\Rightarrow\\ M_n=\\mathbf{'+fmt(L2.Mn,0)+'}\\ \\text{kip\u00B7in}']}));
  }
  if(cap.route==='F8'){
    const gl=cap.ls.find(l=>l.applies);

function buildFlexTab(pg){
  const D=AN.design,p=AN.sect;

  mkSection('fxCls','Section Classification \u2014 Flexure (Table B4.1b)',body=>{classFlexBlock(body,p,D);},pg);
  mkSection('fxCap','Member Flexural Strength \u2014 Major Axis (C\u1D47 = 1 reference)',body=>{
    body.appendChild(el('div','note','Capacities below are evaluated at the bracing entered for each flange with C\u1D47 = 1. Per-combination sections then apply the demand \u2014 and, in calculated-C\u1D47 mode, re-evaluate LTB with the worst-window C\u1D47.'));
    if(D.member){
      flexCapBlock(body,p,D.capTop,'Compression flange \u2014 L\u1D47 = '+(D.LbTop>0?fmt(D.LbTop,2)+' ft':'0 (continuously braced)')+', C\u1D47 = '+fmt(D.CbUser,2));

      flexCapBlock(body,p,D.capBot,'Bottom flange in compression (M < 0) \u2014 L\u1D47 = '+fmt(D.LbBot,2)+' ft'+(D.LbBotDefaulted?' (default: support-to-support)':''));
    }
  },pg);
  mkSection('fxShear','Member Shear Strength',body=>{
    if(p._kind==='P')body.appendChild(el('div','note','Round sections: V\u2099 depends on L\u1D65 (distance from maximum shear to zero shear), which varies by combination \u2014 see the per-combination sections below.'));
    else shearBlock(body,p,D.shearX,'Major-axis shear');

      if(seen[cb.sig]&&seen[cb.sig]!==cb.id){
        const ref=AN.combos.find(x=>x.id===seen[cb.sig]);
        body.appendChild(el('div','note','Factored actions identical to <b>'+ref.name+'</b> \u2014 all checks and results match that section exactly (\u00A77.2).'));
        return;
      }
      seen[cb.sig]=cb.id;
      const t=el('table','tbl');
      const hd=el('tr');[D.member?'Case':'Region (ft)','Flange','L\u1D47 (ft)','C\u1D47','M\u1D64 (kip\u00B7ft)','\u03C6M\u2099 (kip\u00B7ft)','DCR','Governing LS'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
      C.regions.forEach(r=>{
        const tr=el('tr');
        [r.x1==null?(r.tag||'\u2014'):(fmt(r.x1,1)+' \u2013 '+fmt(r.x2,1)),r.flange,r.LbFt===0?'cont.':fmt(r.LbFt,1),fmt(r.Cb,2),
         fmt(r.Mu,1),r.blocked?'\u2014':fmt(r.phiMn,1),r.blocked?'BLOCKED':fmt(r.dcr,3),
         r.blocked?r.blocked:(r.cap.gov?r.cap.gov.name:'')]
          .forEach((v,i)=>tr.appendChild(el('td',i===7?'lft':null,''+v)));
        if(r===C.flexGov)tr.className='gov';
        t.appendChild(tr);
      });
      body.appendChild(t);
      if(D.member&&D.sw)body.appendChild(el('div','note','M\u1D64 and V\u1D64 above include the self-weight additions \u0394M = '+fmt(D.sw.dM,2)+' kip\u00B7ft, \u0394V = '+fmt(D.sw.dV,2)+' kip (derivation on the Summary tab).'));
      const g=C.flexGov;

        if(g.mode==='calc'&&g.win){

            lines:['C_b=\\tfrac{12.5M_{max}}{2.5M_{max}+3M_A+4M_B+3M_C}=\\tfrac{12.5('+fmt(q.Mmax,1)+')}{2.5('+fmt(q.Mmax,1)+')+3('+fmt(q.MA,1)+')+4('+fmt(q.MB,1)+')+3('+fmt(q.MC,1)+')}=\\mathbf{'+fmt(g.Cb,2)+'}'],
            vars:[['M_A,M_B,M_C','kip\u00B7ft','|M| at window quarter points'],['M_{max}',fmt(q.Mmax,1)+' kip\u00B7ft','max |M| in window']]}));
        }

          ref:g.cap.gov?g.cap.gov.clause:'',
          lines:['\\text{DCR}=\\tfrac{M_u}{\\phi_bM_n}=\\tfrac{'+fmt(g.Mu,1)+'}{'+fmt(g.phiMn,1)+'}=\\mathbf{'+fmt(g.dcr,3)+'}'+(g.dcr>1?'\\ \\color{#B42318}{\\text{FAIL}}':'\\ \\checkmark')]}));
      }else if(g&&g.blocked)body.appendChild(el('div','errBox',g.blocked));

      body.appendChild(eqBlock({title:'Shear DCR',ref:C.shearX.route,
        lines:['\\text{DCR}=\\tfrac{V_u}{\\phi_vV_n}=\\tfrac{'+fmt(C.Vu,2)+'}{'+fmt(C.shearX.phi*C.shearX.Vn,1)+'}=\\mathbf{'+fmt(C.dcrVx,3)+'}\\quad(V_u\\ \\text{at }x='+fmt(C.VuX,2)+'\\ \\text{ft})']}));
    },pg);
  });
}

  if(!D){pg.appendChild(el('div','errBox','Design pass unavailable'+(AN.designError?': '+AN.designError:'.')));return;}
  mkSection('axDem','Manual Member Demands (imported)',body=>{
    body.appendChild(el('div','note','These demands are <b>user-entered</b>, not derived from the planar beam analysis; they are shown with the imported-value styling used throughout. Second-order amplification must be included by the user. Edit them in the <b>Manual Member Demands</b> section of the input panel.'));
    const t=el('table','tbl');
    const hd=el('tr');['Combination','P\u1D64 (kip)','M\u1D64\u1D67 (kip\u00B7ft)','V\u1D64\u1D67 (kip)','T\u1D64 (kip\u00B7ft)'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    D.perCombo.forEach(C=>{
      const tr=el('tr');
      [C.name,C.man.Pu||0,C.man.Muy||0,C.man.Vuy||0,C.man.Tu||0].forEach((v,i)=>{
        const td=el('td',i===0?'lft':null,typeof v==='number'?fmt(v,1):v);
        if(i>0&&v)td.style.cssText='color:#7A4A00;background:#FFF8EC';
        tr.appendChild(td);});
      t.appendChild(tr);
    });
    body.appendChild(t);
  },pg);
  mkSection('axComp','Compressive Strength (Chapter E)',body=>{
    if(!D.comp){body.appendChild(el('div','note','No P\u1D64 entered on any combination \u2014 compression capacity not evaluated (honest N/A, not a pass).'));return;}
    if(D.comp.blocked){body.appendChild(el('div','errBox',D.comp.blocked));return;}
    const cc=D.comp;
    const t=el('table','tbl');
    const hd=el('tr');['Mode','Clause','L\u1D9C (ft)','L\u1D9C/r','F\u2091 (ksi)'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    cc.modes.forEach(m=>{const tr=el('tr');
      [m.name,m.clause,fmt(m.L/12,1),m.s?fmt(m.s,1):'\u2014',fmt(m.Fe,1)].forEach((v,i)=>tr.appendChild(el('td',i===0?'lft':null,v)));
      if(m===cc.govFe)tr.className='gov';t.appendChild(tr);});
    body.appendChild(t);
    if(cc.slMax>200)body.appendChild(el('div','warnBox','L\u1D9C/r = '+fmt(cc.slMax,0)+' exceeds the recommended limit of 200 (E2 commentary).'));
    body.appendChild(eqBlock({title:'Critical stress',ref:'Eqs. E3-2, E3-3',
      lines:['F_y/F_e='+fmt(p.mat.Fy/cc.govFe.Fe,2)+(p.mat.Fy/cc.govFe.Fe<=2.25?'\\le 2.25\\Rightarrow F_{cr}=0.658^{F_y/F_e}F_y':'> 2.25\\Rightarrow F_{cr}=0.877F_e')+'=\\mathbf{'+fmt(cc.Fcr,1)+'\\ \\text{ksi}}']}));
    if(cc.eff.length){
      body.appendChild(el('div','warnBox','Slender element(s) in compression \u2014 effective area per E7: '+cc.eff.map(e2=>e2.el).join('; ')));
      body.appendChild(eqBlock({title:'Effective area',ref:'E7',
        lines:['A_e=A_g-\\Sigma(b-b_e)t='+fmt(p.A,2)+'-'+fmt(p.A-cc.Ae,2)+'=\\mathbf{'+fmt(cc.Ae,2)+'\\ \\text{in}^2}']}));
    }
    body.appendChild(eqBlock({title:'Compressive strength',ref:'Eq. E7-1 / E3-1',
      lines:['P_n=F_{cr}A_e='+fmt(cc.Fcr,1)+'\\times '+fmt(cc.Ae,2)+'=\\mathbf{'+fmt(cc.Pn,0)+'\\ \\text{kip}};\\quad \\phi_cP_n=0.90\\times '+fmt(cc.Pn,0)+'=\\mathbf{'+fmt(cc.phiPn,0)+'\\ \\text{kip}}']}));
  },pg);
  mkSection('axMinor','Minor-Axis Flexural & Shear Strength (for manual demands)',body=>{
    if(!D.perCombo.some(C=>C.man.Muy||C.man.Vuy)){body.appendChild(el('div','note','No M\u1D64\u1D67 or V\u1D64\u1D67 entered \u2014 minor-axis capacities shown for reference only if needed.'));}
    flexCapBlock(body,p,D.flexY,'Minor-axis flexure');
    if(D.shearY)shearBlock(body,p,D.shearY,'Minor-axis shear');
  },pg);
  mkSection('axTors','Torsional Strength (H3 \u2014 HSS only)',body=>{
    if(!D.tors){body.appendChild(el('div','note','No T\u1D64 entered \u2014 torsion not evaluated.'));return;}
    if(D.tors.blocked){body.appendChild(el('div','errBox',D.tors.blocked));return;}
    body.appendChild(eqBlock({title:'HSS torsional strength',ref:'H3.1 ('+D.tors.clause+')',
      lines:['F_{cr}=\\mathbf{'+fmt(D.tors.Fcr,1)+'\\ \\text{ksi}};\\quad T_n=F_{cr}C='+fmt(D.tors.Fcr,1)+'\\times '+fmt(p.Cc,1)+'=\\mathbf{'+fmt(D.tors.Tn,0)+'\\ \\text{kip\u00B7in}}',
        '\\phi_TT_n=0.90\\times '+fmt(D.tors.Tn,0)+'=\\mathbf{'+fmt(D.tors.phiTn,0)+'\\ \\text{kip\u00B7in}='+fmt(D.tors.phiTn/12,1)+'\\ \\text{kip\u00B7ft}}'],
      vars:[['C',fmt(p.Cc,1)+' in\u00B3','HSS torsional constant']]}));
    body.appendChild(el('div','note','If T\u1D64 \u2264 0.2\u03C6T\u2099, torsion is neglected in interaction (H3.2); otherwise Eq. H3-6 replaces H1 \u2014 see per-combination interaction below.'));
  },pg);
  mkSection('axJ10','Concentrated Forces \u2014 Web Local Yielding & Crippling (J10)',body=>{
    if(!D.j10){body.appendChild(el('div','note','J10 web provisions apply to I-shapes and channels; the current section is an HSS. Locally loaded HSS faces should be verified separately (Chapter K / manufacturer data).'));return;}
    if(D.j10.lbSup==null&&D.j10.lbPt==null){
      body.appendChild(el('div','warnBox','No bearing lengths entered \u2014 J10 checks report N/A. Enter l\u1D47 at supports and/or point loads in Design Parameters to run them. An unchecked limit state is never treated as passing.'));return;}
    const locs=D.j10.locs.filter(l=>l.lb!=null);
    body.appendChild(el('div','note','Checked locations (l\u1D47 as entered; end criteria from geometry): '+locs.map(l=>l.label+' @ x = '+fmt(l.x,1)+' ft').join('; ')));
    const w0=locs[0];
    if(w0&&w0.wly){
      body.appendChild(eqBlock({title:'Web local yielding \u2014 '+w0.label,ref:'Eq. '+w0.wly.clause+' (\u03C6 = 1.00)',
        lines:['R_n=F_yt_w('+(w0.wly.atEnd?'2.5':'5')+'k+l_b)='+p.mat.Fy+'\\times '+fmt(p.tw,3)+'('+(w0.wly.atEnd?'2.5':'5')+'\\times '+fmt(p.kdes,3)+'+'+fmt(w0.lb,2)+')=\\mathbf{'+fmt(w0.wly.Rn,1)+'\\ \\text{kip}}']}));
      body.appendChild(eqBlock({title:'Web local crippling \u2014 '+w0.label,ref:'Eq. '+w0.wlc.clause+' (\u03C6 = 0.75)',
        lines:['R_n=\\mathbf{'+fmt(w0.wlc.Rn,1)+'\\ \\text{kip}}\\quad\\left(t_w='+fmt(p.tw,3)+',\\ t_f='+fmt(p.tf,3)+',\\ d='+fmt(p.d,1)+',\\ l_b/d='+fmt(w0.lb/p.d,3)+'\\right)']}));
    }
    body.appendChild(el('div','hint','Per-combination demands and DCRs are tabulated below. Sidesway web buckling (J10.4) is <b>not</b> checked \u2014 it depends on flange rotational restraint conditions not modeled here; see the manual.'));
    D.perCombo.forEach(C=>{
      if(!C.j10||!C.j10.some(r=>r.dcrWLY!=null))return;
      const t=el('table','tbl');
      const hd=el('tr');[''+C.name,'Demand (kip)','\u03C6R\u2099 WLY','DCR','\u03C6R\u2099 WLC','DCR'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
      C.j10.forEach(r=>{
        if(r.dcrWLY==null)return;
        const tr=el('tr');
        [r.label,fmt(r.dem,1),fmt(r.wly.phi*r.wly.Rn,1),fmt(r.dcrWLY,3),fmt(0.75*r.wlc.Rn,1),fmt(r.dcrWLC,3)]
          .forEach((v,i)=>tr.appendChild(el('td',i===0?'lft':null,v)));
        if(r.dcrWLY>1||r.dcrWLC>1)tr.className='gov';
        t.appendChild(tr);
      });
      pgAppendUnder(t,C,pg);
      function pgAppendUnder(tt){body.appendChild(tt);}
    });
    body.appendChild(el('div','note','A DCR > 1 at a support or load point calls for bearing stiffeners (J10.8) or a longer bearing length.'));
  },pg);
  /* per-combination interaction — §7.1 */
  const seen={};
  AN.combos.forEach(cb=>{
    const C=D.perCombo.find(x=>x.id===cb.id);if(!C)return;
    mkSection('axC_'+cb.id,'Interaction \u2014 '+cb.name,body=>{
      const sig=cb.sig+'|'+JSON.stringify(C.man);
      if(seen[sig]&&seen[sig]!==cb.id){
        const ref=D.perCombo.find(x=>x.id===seen[sig]);
        body.appendChild(el('div','note','Identical actions and manual demands as <b>'+ref.name+'</b> \u2014 see that section (\u00A77.2).'));
        return;
      }
      seen[sig]=cb.id;
      if(C.compBlocked)body.appendChild(el('div','errBox','Compression: '+C.compBlocked));
      if(C.torsBlocked)body.appendChild(el('div','errBox','Torsion: '+C.torsBlocked));
      const tm=C.inter.terms;
      const ratioLines=[];
      if(tm.P)ratioLines.push('\\tfrac{P_r}{P_c}=\\tfrac{'+fmt(C.man.Pu,1)+'}{'+fmt(C.phiPn||0,0)+'}='+fmt(tm.P,3));
      ratioLines.push('\\tfrac{M_{rx}}{M_{cx}}='+fmt(tm.Mx,3)+'\\ \\text{(governing flexure DCR)}');
      if(tm.My)ratioLines.push('\\tfrac{M_{ry}}{M_{cy}}=\\tfrac{'+fmt(Math.abs(C.man.Muy),1)+'}{'+fmt(C.phiMny||0,1)+'}='+fmt(tm.My,3));
      body.appendChild(eqBlock({title:'Demand/capacity ratios',ref:'Ch. H',lines:[ratioLines.join(',\\quad ')]}));
      if(C.torsNeglect)body.appendChild(el('div','note','T\u1D64/\u03C6T\u2099 = '+fmt(C.dcrT,3)+' \u2264 0.20 \u2192 torsion neglected in interaction (H3.2).'));
      let line;
      if(C.inter.eq==='H3-6')line='\\left(\\tfrac{P_r}{P_c}+\\tfrac{M_r}{M_c}\\right)+\\left(\\tfrac{V_r}{V_c}+\\tfrac{T_r}{T_c}\\right)^2='+
        fmt(tm.P+tm.Mx+tm.My,3)+'+('+fmt(tm.V,3)+'+'+fmt(tm.T,3)+')^2=\\mathbf{'+fmt(C.inter.value,3)+'}';
      else if(C.inter.eq==='H1-1a')line='\\tfrac{P_r}{P_c}+\\tfrac{8}{9}\\left(\\tfrac{M_{rx}}{M_{cx}}+\\tfrac{M_{ry}}{M_{cy}}\\right)='+
        fmt(tm.P,3)+'+\\tfrac{8}{9}('+fmt(tm.Mx,3)+'+'+fmt(tm.My,3)+')=\\mathbf{'+fmt(C.inter.value,3)+'}';
      else line='\\tfrac{P_r}{2P_c}+\\left(\\tfrac{M_{rx}}{M_{cx}}+\\tfrac{M_{ry}}{M_{cy}}\\right)='+
        fmt(tm.P/2,3)+'+('+fmt(tm.Mx,3)+'+'+fmt(tm.My,3)+')=\\mathbf{'+fmt(C.inter.value,3)+'}';
      body.appendChild(eqBlock({title:'Interaction \u2014 Eq. '+C.inter.eq,ref:C.inter.eq,
        lines:[line+(C.inter.value>1?'\\ \\color{#B42318}{>1.0\\ \\text{FAIL}}':'\\ \\le 1.0\\ \\checkmark')]}));
    },pg);
  });
}
/* =====================================================================
   VALIDATION TAB — Stage-1 benchmarks + AISC Design Example checks
   ===================================================================== */
function runDesignExamples(){
  const out=[];
  const add=(id,desc,got,exp,unit,tol)=>{out.push({id,desc,got,exp,unit,ok:Math.abs(got-exp)<=tol*Math.abs(exp)});};
  try{
    /* F.1-1B — W18×50 A992, continuously braced */
    let p=sectionFor('W','W18X50','A992');
    let c=flexMajorIC(p,0,1);
    add('F.1-1B','W18\u00D750 continuous \u2014 \u03C6M\u2099',c.phiMn/12,379,'kip\u00B7ft',0.005);
    /* F.1-2B — Lb = 11.7 ft, Cb = 1.01 */
    c=flexMajorIC(p,11.7*12,1.01);
    add('F.1-2B','W18\u00D750, L\u1D47 = 11.7 ft, C\u1D47 = 1.01 \u2014 M\u2099',c.Mn,4060,'kip\u00B7in',0.01);
    /* F.1-3B — Lb = 17.5 ft, Cb = 1.30 (elastic LTB) */
    c=flexMajorIC(p,17.5*12,1.30);
    add('F.1-3B','W18\u00D750, L\u1D47 = 17.5 ft, C\u1D47 = 1.30 \u2014 M\u2099',c.Mn,3840,'kip\u00B7in',0.01);
    const ltb=c.ls.find(l=>l.name.includes('Lateral'));
    add('F.1-3B','\u2026 elastic F\u1D9C\u02B3',ltb.d.Fcr,43.2,'ksi',0.01);
    /* F.2-2B — C15×33.9 A36, Lb = 5 ft (validates channel c factor) */
    p=sectionFor('C','C15X33.9','A36');
    c=flexMajorIC(p,5*12,1.0);
    add('F.2-2B','C15\u00D733.9, L\u1D47 = 5 ft \u2014 M\u2099 (channel c factor)',c.Mn,1740,'kip\u00B7in',0.015);
    /* F.7B — HSS10×6×3/16 A500B, noncompact flange */
    p=sectionFor('HSSR','HSS10X6X3/16','A500B_R');
    c=flexRectHSS(p,'x',0,1);
    add('F.7B','HSS10\u00D76\u00D7\u2075\u2044\u2081\u2086 \u2014 \u03C6M\u2099 (F7-2 noncompact flange)',c.phiMn/12,57.0,'kip\u00B7ft',0.01);
    /* F.9B — Pipe 8 X-Strong A53B */
    p=sectionFor('PIPE','Pipe8XS','A53B');
    c=flexRound(p);
    add('F.9B','Pipe 8 X-Strong \u2014 M\u2099 (compact, F8-1)',c.Mn,1090,'kip\u00B7in',0.01);
    /* G.1A — W24×62 shear, φ = 1.00 route */
    p=sectionFor('W','W24X62','A992');
    let sv=shearMajor(p);
    add('G.1A','W24\u00D762 \u2014 \u03C6V\u2099 (G2.1(a), \u03C6 = 1.00)',sv.phi*sv.Vn,306,'kip',0.01);
    /* H.5 — HSS6×4×1/4 A500B: shear, flexure, torsion */
    p=sectionFor('HSSR','HSS6X4X1/4','A500B_R');
    sv=shearMajor(p);
    add('H.5','HSS6\u00D74\u00D7\u00BC \u2014 \u03C6V\u2099 (G4)',sv.phi*sv.Vn,61.4,'kip',0.01);
    c=flexRectHSS(p,'x',0,1);
    add('H.5','HSS6\u00D74\u00D7\u00BC \u2014 \u03C6M\u2099 (F7-1)',c.phiMn,353,'kip\u00B7in',0.01);
    const tor=torsionHSS(p,0);
    add('H.5','HSS6\u00D74\u00D7\u00BC \u2014 \u03C6T\u2099 (H3)',tor.phiTn,251,'kip\u00B7in',0.01);
    /* G.8B — kv from stiffener spacing (Eq. G2-5; identical in 360-10 and 360-16) */
    {
      const fake={_kind:'I',hClear:33.0,htw:106,tw:0.3125,d:36,mat:{Fy:36}};
      let K=stiffKv(fake,{on:true,a:60.0});
      add('G.8B','Built-up girder, a/h = 1.82 \u2014 k\u1D65 (Eq. G2-5)',K.kv,6.51,'\u2014',0.005);
      K=stiffKv(fake,{on:true,a:99.0});
      add('G.8B','\u2026 second panel, a/h = 3.0 \u2014 k\u1D65',K.kv,5.56,'\u2014',0.005);
      K=stiffKv(fake,{on:true,a:150.0});
      add('G2.1(b)','a/h = 4.55 > 3.0 \u2014 k\u1D65 reverts to 5.34 (360-16)',K.kv,5.34,'\u2014',0.002);
      K=stiffKv(fake,null);
      add('G2.1(b)','unstiffened web \u2014 k\u1D65 = 5.34',K.kv,5.34,'\u2014',0.002);
    }
    /* --- F.3B: W21x48, noncompact flange, continuously braced (anchors the F3 route) --- */
    p=sectionFor('W','W21X48','A992');
    c=flexMajorIC(p,0,1);
    add('F.3B','W21\u00D748 \u2014 \u03BB = b\u1DA0/2t\u1DA0 (noncompact flange)',p.bf/(2*p.tf),9.47,'\u2014',0.005);
    add('F.3B','\u2026 M\u209A = F\u1D67Z\u2093',50*p.Zx,5350,'kip\u00B7in',0.005);
    add('F.3B','\u2026 M\u2099 (Eq. F3-1, flange local buckling)',c.Mn,5310,'kip\u00B7in',0.005);
    add('F.3B','\u2026 \u03C6M\u2099',c.phiMn/12,398,'kip\u00B7ft',0.005);
    add('F.3B','\u2026 \u00A7F3 route selected',c.route==='F3'?1:0,1,'\u2014',0.001);
    /* --- G.7: C9x20 weak-axis shear (anchors §G6) --- */
    p=sectionFor('C','C9X20','A36');
    sv=shearMinor(p);
    add('G.7','C9\u00D720 F\u1D67=36 \u2014 A\u1D65 = 2b\u1DA0t\u1DA0',sv.Aw,2.19,'in\u00B2',0.01);
    add('G.7','\u2026 V\u2099 (\u00A7G6, k\u1D65 = 1.2)',sv.Vn,47.3,'kip',0.01);
    add('G.7','\u2026 \u03C6V\u2099 (\u03C6 = 0.90)',sv.phi*sv.Vn,42.6,'kip',0.01);
    /* --- E.11: Pipe 10 STD compression, Fy = 35 (anchors E3 for round sections) --- */
    {
      const pp=sectionFor('PIPE','Pipe10STD','A53B');
      const cp2=compStrength(pp,30*12,30*12,30*12);
      add('E.11','Pipe 10 STD F\u1D67=35, KL = 30 ft \u2014 KL/r',cp2.govFe.s,97.8,'\u2014',0.005);
      add('E.11','\u2026 F\u2091 (Eq. E3-4)',cp2.govFe.Fe,29.9,'ksi',0.01);
      add('E.11','\u2026 F\u1D9C\u02B3 (Eq. E3-2)',cp2.Fcr,21.4,'ksi',0.01);
      add('E.11','\u2026 \u03C6P\u2099',cp2.phiPn,221,'kip',0.01);
      add('E.11','\u2026 wall not slender',cp2.clsC.wall.cls==='nonslender'?1:0,1,'\u2014',0.001);
    }

    /* E.1C — W14×132, Lc = 30 ft both axes */
    p=sectionFor('W','W14X132','A992');
    const cp=compStrength(p,360,360,360);
    add('E.1C','W14\u00D7132, L\u1D9C = 30 ft \u2014 \u03C6P\u2099',cp.phiPn,892,'kip',0.012);
    add('E.1C','\u2026 governing L\u1D9C/r (y\u2013y)',cp.govFe.s||cp.slMax,95.7,'\u2014',0.01);
  }catch(e){out.push({id:'ERROR',desc:''+(e&&e.message||e),got:0,exp:0,unit:'',ok:false});}
  return out;
}
function buildValidTab(pg){
  pg.appendChild(el('div','note','Two independent test families run <b>live</b> through the production code path every time this tab renders: (1) closed-form mechanics benchmarks through the analysis solver, and (2) AISC Design Examples (v14.0, published results \u2014 the governing equations are unchanged in AISC 360-16 for every case used) through the Stage-2/3 capacity engine.'));
  mkSection('valBench','Analysis Benchmarks (closed form)',body=>{
    let res=[];
    try{res=runBenchmarks();}catch(e){body.appendChild(el('div','errBox','Benchmark run failed: '+e.message));}
    const t=el('table','tbl');
    const hd=el('tr');['Benchmark','Computed','Closed form','Status'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    let fails=0;
    res.forEach(r=>{
      const tr=el('tr');
      [r.name,fmt(r.got,4),fmt(r.exp,4),r.ok?'<b style="color:var(--pass)">PASS</b>':'<b style="color:var(--fail)">FAIL</b>']
        .forEach((v,i)=>tr.appendChild(el('td',i===0?'lft':null,v)));
      if(!r.ok){tr.className='gov';fails++;}
      t.appendChild(tr);
    });
    body.appendChild(t);
    body.appendChild(el('div',fails?'errBox':'okBox',fails?fails+' benchmark(s) FAILED.':'All '+res.length+' analysis benchmarks pass.'));
  },pg);
  mkSection('valAISC','AISC Design Example Checks (capacity engine)',body=>{
    const res=runDesignExamples();
    const t=el('table','tbl');
    const hd=el('tr');['Example','Check','Computed','Published','Units','Status'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    let fails=0;
    res.forEach(r=>{
      const tr=el('tr');
      [r.id,r.desc,fmt(r.got,1),fmt(r.exp,1),r.unit,r.ok?'<b style="color:var(--pass)">PASS</b>':'<b style="color:var(--fail)">FAIL</b>']
        .forEach((v,i)=>tr.appendChild(el('td',i<2?'lft':null,''+v)));
      if(!r.ok){tr.className='gov';fails++;}
      t.appendChild(tr);
    });
    body.appendChild(t);
    body.appendChild(el('div',fails?'errBox':'okBox',fails?fails+' design-example check(s) FAILED \u2014 do not rely on strength results.':
      'All '+res.length+' design-example checks pass (F2 I & channel, F7, F8, G2, G4, H3, E3). Tolerances 0.5\u20131.5% reflect the rounding used in the published solutions.'));
    body.appendChild(el('div','hint','Still not independently anchored: \u00A7F4 and \u00A7F5 (noncompact and slender webs \u2014 no rolled shape reaches them), \u00A7E4 torsional buckling, \u00A7E7 where the effective-width reduction actually bites, \u00A7J10, and the \u00A7H1 composition of the individual ratios. These are direct transcriptions of the Specification equations, exercised by construction but not compared against a published answer \u2014 hand-check them before relying on them in production.'));
  },pg);
  mkSection('valEC','Independent Reference Checks (ENERCALC)',body=>{
    body.appendChild(el('div','note','A second commercial AISC 360-16 implementation, used to anchor routes the AISC Design Examples do not reach: elastic lateral-torsional buckling (Eq. F2-4), rectangular HSS flexure and shear at F\u1D67 = 36 ksi, minor-axis flexure (\u00A7F6 and \u00A7F7), compression governed by the y-axis, lightweight-concrete stud strength, and a partial-composite section with the plastic neutral axis in the web.'));
    let res=[];
    try{res=enercalcSelfTest();}catch(e){body.appendChild(el('div','errBox','Reference self-test failed: '+e.message));}
    const t=el('table','tbl');
    const hd=el('tr');['Ref','Check','Computed','Reference','Units','Status'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    let f=0;
    res.forEach(r=>{
      const tr=el('tr');
      [r.id,r.desc,fmt(r.got,3),fmt(r.exp,3),r.unit,r.ok?'<b style="color:var(--pass)">PASS</b>':'<b style="color:var(--fail)">FAIL</b>']
        .forEach((v2,i)=>tr.appendChild(el('td',i<2?'lft':null,''+v2)));

    body.appendChild(el('div',f?'errBox':'okBox',f?f+' reference check(s) FAILED.':'All '+res.length+' reference checks agree within 0.5\u20131%.'));
    body.appendChild(el('div','hint','These are agreement checks against another program, not against a published code answer \u2014 two implementations can share a misreading. They complement the AISC Design Example anchors above rather than replacing them. Note that the reference composite case states an effective width of 8.50 ft where \u00A7I3.1a would limit it to '+fmt(27.68/4,2)+' ft for the 27.68 ft span; the comparison uses the stated width so that the flexural calculation is what is being compared.'));
  },pg);
  mkSection('valComp','Composite Beam Checks (Chapter I)',body=>{
    body.appendChild(el('div','note','The composite engine is compared against the published AISC Design Examples I.1 and I.2 (direct calculation), the beam design in Part III, and Manual Table 3-21 stud strengths.'));
    let res=[];
    try{res=compositeSelfTest();}catch(e){body.appendChild(el('div','errBox','Composite self-test failed: '+e.message));}
    const t=el('table','tbl');

        .forEach((v2,i)=>tr.appendChild(el('td',i<2?'lft':null,''+v2)));
      if(!r.ok){tr.className='gov';f++;}

    });
    body.appendChild(t);
    body.appendChild(el('div',f?'errBox':'okBox',f?f+' composite check(s) FAILED.':'All '+res.length+' composite checks pass.'));
    body.appendChild(el('div','hint','Not anchored to a published target: the PNA-in-web branch, parallel-deck rib fill, and lightweight-concrete E\u1D9C \u2014 these follow the same equations but were not exercised by an embedded example.'));
  },pg);
  mkSection('valTor','Warping-Torsion Solver Verification',body=>{
    body.appendChild(el('div','note','The open-section torsion solver is checked three independent ways on every view: against a finite-difference solution of the same differential equation, against two analytical limiting cases, and by torsional equilibrium.'));
    let res=[];

    const t=el('table','tbl');

    let f=0;

    body.appendChild(el('div',f?'errBox':'okBox',f?f+' torsion check(s) FAILED.':'All '+res.length+' torsion solver checks pass.'));
    body.appendChild(el('div','hint','No published worked example for open-section torsion is embedded \u2014 AISC Design Guide 9 is a separate document. These are self-consistency checks, not a comparison against a published answer; verify against DG 9 by hand before relying on the result in production.'));
  },pg);
  if(AN&&AN.svc&&AN.svc.length){

const MANUAL={};const MANUAL_ORDER=[];
function manPart(id,title,blocks){MANUAL[id]={title,blocks};MANUAL_ORDER.push(id);}
function manRender(host,blocks){
  blocks.forEach(b=>{
    if(b.h){host.appendChild(el('h2','manH',b.h));return;}
    if(b.h3){host.appendChild(el('h3','manH3',b.h3));return;}
    if(b.p){host.appendChild(el('p','manP',b.p));return;}
    if(b.eq){const d=el('div','manEq');tex(d,b.eq,true);host.appendChild(d);return;}
    if(b.eqn){const d=el('div','manEq');tex(d,b.eqn[0],true);host.appendChild(d);
      host.appendChild(el('div','manEqNote',b.eqn[1]));return;}
    if(b.ul){const u=el('ul','manList');b.ul.forEach(t=>u.appendChild(el('li',null,t)));host.appendChild(u);return;}
    if(b.ol){const u=el('ol','manList');b.ol.forEach(t=>u.appendChild(el('li',null,t)));host.appendChild(u);return;}
    if(b.tbl){const t=el('table','tbl');const hr=el('tr');
      b.tbl.head.forEach(h=>hr.appendChild(el('th',null,h)));t.appendChild(hr);
      b.tbl.rows.forEach(r=>{const tr=el('tr');
        r.forEach((c,i)=>tr.appendChild(el('td',i===0?'lft':null,''+c)));t.appendChild(tr);});
      host.appendChild(t);return;}
    if(b.def){const t=el('table','tbl');const hr=el('tr');
      ['Symbol','Units','Meaning'].forEach(h=>hr.appendChild(el('th',null,h)));t.appendChild(hr);
      b.def.forEach(r=>{const tr=el('tr');
        const c0=el('td','lft');tex(c0,r[0],false);tr.appendChild(c0);
        tr.appendChild(el('td',null,r[1]));tr.appendChild(el('td','lft',r[2]));t.appendChild(tr);});
      host.appendChild(t);return;}
    if(b.note){host.appendChild(el('div','note',b.note));return;}
    if(b.warn){host.appendChild(el('div','warnBox',b.warn));return;}
    if(b.key){host.appendChild(el('div','manKey',b.key));return;}
  });
}
function buildManualTab(pg){

manPart('p0','0. Read This First',[
{h:'0.1 What this program does (Stage 1)'},
{p:'This program models a single-line, multi-span continuous steel beam in a vertical plane, solves it by the direct stiffness method for user-defined load cases and LRFD load combinations, generates line loads from tributary areas and pressures, computes service-level deflections against per-span limits, and resolves AISC section properties (with user override) from the embedded '+DBVER+'. It is the analysis foundation for the AISC 360-16 LRFD member strength checks that install in Stage 2.'},
{key:'Stage boundary: in this build <b>no strength check is performed</b>. Every strength limit state appears in the Summary dashboard as an explicit N/A so its absence is visible, never silent.'},
{h:'0.2 What this app does NOT do'},
{ul:[
'<b>No strength design (yet).</b> Flexure, shear, axial, interaction, torsion, and concentrated-force checks are Stage 2. Do not size a member from this build.',
'<b>No axial or lateral analysis.</b> The model is a planar beam with vertical loads only: no axial DOF, no frame action, no lateral loads in the plane of the diagram. Axial force and weak-axis moment will be manual (imported) inputs in Stage 2.',
'<b>No second-order effects.</b> The analysis is first-order elastic.',
'<b>No composite action.</b> Bare-steel stiffness only. (Groundwork for staged/composite EI exists internally but is inactive.)',
'<b>No moving/pattern load automation.</b> Live load is applied where you put it. For continuous beams, pattern (skip) loading governs positive moments and must currently be built by the user as separate cases/combinations \u2014 see \u00A70.3.',
'<b>No unbalanced snow, drift, partial or sliding snow generation</b> \u2014 pressures you enter are applied as given.',
'<b>No support settlement, springs, hinges, haunches, or variable sections.</b>',
'<b>No vibration, ponding, fatigue, or fire checks.</b>'
]},
{h:'0.3 Known limitations and assumptions'},
{h3:'Euler-Bernoulli bending'},
{p:'Shear deformation is neglected (no Timoshenko terms). For typical rolled beams at span/depth \u2265 10 the deflection error is under ~3%; for very deep, short members the reported deflections are slightly unconservative.'},
{h3:'One-way tributary model'},
{p:'The load generator treats the deck as simply supported strips delivering p\u00D7TW to this beam. Where the deck is structurally continuous over this beam, the true delivered reaction can exceed p\u00D7TW (up to ~25% for two equal continuous deck spans). This is the near-universal office convention, but it is a modeling choice, disclosed here.'},
{h3:'Pattern live load is the user\u2019s responsibility'},
{p:'Uniform live load on all spans simultaneously under-predicts both peak positive span moments (alternate-span pattern governs) and peak support moments (adjacent-span pattern governs) in continuous beams. Create additional live cases (e.g. LL1, LL2 on alternating spans) and combinations if pattern effects matter for your configuration.'},
{h3:'Deflection integration'},
{p:'Deflection is obtained by numerically double-integrating M/EI (600 stations) with \u03B4 = 0 enforced at the first and last supports. Because the exact moment field already satisfies compatibility, interior supports come out at \u03B4 \u2248 0 automatically; the residual is reported on the Validation tab and is pure integration error.'},
{h3:'Deflections are service-level and factored moments are strength-level'},
{p:'Strength combinations never drive the deflection check and service combinations never appear in the envelopes \u2014 the two families are kept separate by construction, correcting a common spreadsheet defect.'},
{h3:'Inflection points are not brace points'},
{p:'The default bottom-flange unbraced length is support-to-support, per AISC 360-16 Commentary Appendix 6. Entering a shorter L_b,bot asserts that a physical bottom-flange brace exists.'},
{warn:'<b>This application is an engineering aid, not a substitute for engineering judgment.</b> The user is responsible for the design, for verifying load factors against the governing code edition, and for independent checking of results. A licensed engineer must review any deliverable produced from this tool.'}
]);

manPart('p4','IV. Methodology',[
{h:'IV.1 Direct stiffness solution'},
{eqn:['\\mathbf{k}_e=\\frac{EI}{L^3}\\begin{bmatrix}12&6L&-12&6L\\\\6L&4L^2&-6L&2L^2\\\\-12&-6L&12&-6L\\\\6L&2L^2&-6L&4L^2\\end{bmatrix}','Euler-Bernoulli element with DOFs (v\u2081, \u03B8\u2081, v\u2082, \u03B8\u2082); assembled per span with per-span EI; solved as K_ff d_f = f_f by Gaussian elimination with partial pivoting; reactions recovered as R = f \u2212 Kd.'],},
{h:'IV.2 Fixed-end forces'},
{eqn:['FER_{point}:\\ R_1=\\frac{Pb^2(L+2a)}{L^3},\\ M_1=\\frac{Pab^2}{L^2},\\ R_2=\\frac{Pa^2(3L-2a)}{L^3},\\ M_2=-\\frac{Pa^2b}{L^2}','Closed form for point loads and couples; partial trapezoids integrate the point-load influence numerically at 240 stations per load. Couple FER signs verified against SS (R = \u00B1M\u2080/L) and fixed-fixed (FEM = M\u2080/4) closed forms.']},
{h:'IV.3 Internal actions'},
{p:'V(x) and M(x) are evaluated <b>exactly</b> by statics on the left free body at every reporting station (never interpolated from a grid), with stations placed at supports, load points \u00B1\u03B5, span tenth-points, and V = 0 crossings. This removes the peak-clipping defect of uniform-grid sampling: the shear at a point-load face is captured exactly.'},
{h:'IV.4 Deflection'},
{eqn:['EI\\,v\'\'=M(x)\\ \\Rightarrow\\ \\delta_{down}(x)=-\\left[\\iint \\frac{M}{EI}\\,dx^2 - C_1x - C_2\\right]','Double numerical integration (600 stations, trapezoidal), constants from \u03B4 = 0 at the first and last supports (cantilever: \u03B4 = \u03B8 = 0 at the fixed node). Interior-support residuals are reported on the Validation tab.']},
{h:'IV.5 Tributary conversion'},
{eq:'w_{case}=\\frac{p_{case}\\,(TW_L+TW_R)}{1000}+w_{line}\\,,\\qquad w_{sw}=\\frac{W_{shape}}{1000}'},
{h:'IV.6 Section resolution'},
{p:'Three tiers: (1) geometry \u2014 overridable; (2) slenderness ratios \u2014 <i>always</i> recomputed from resolved geometry (for I-shapes the clear web h is backed out of the tabulated h/t\u1D65 at database thickness, then re-ratioed); (3) properties \u2014 individually overridable with provenance displayed. HSS flat widths use b = B\u22123t, h = H\u22123t per Spec. \u00A7B4.1b(d)/G4 when corner radii are unknown. A500 design wall = 0.93t\u2099\u2092\u2098 (as tabulated); A1085 uses the nominal wall.'},
{h:'IV.7 Stage-2 interfaces already in place'},
{ul:['Per-combination exact M/V evaluation at arbitrary x (C\u1D47 quarter-point sampling)','V = 0 station list (round-HSS L\u1D65)','Negative-moment region maps (compression-flange selection)','Per-span EI slots (composite staging)','Combination stage tags (construction vs final)']}
]);

/* Safety net: if for any reason the app has not filled the viewport, size it
   directly. A short app with the document unable to scroll is unusable, so
   this must never be left to the stylesheet alone. */
function lockLayout(){
  const app=document.getElementById('app');
  if(!app)return;
  const vh=(window.innerHeight||document.documentElement.clientHeight||0);
  if(!vh)return;
  if(app.clientHeight<Math.min(240,vh*0.5)){
    app.style.position='fixed';app.style.top='0';app.style.left='0';
    app.style.right='0';app.style.bottom='0';app.style.height=vh+'px';
  }else if(app.style.height&&Math.abs(app.clientHeight-vh)>2){
    app.style.height=vh+'px';
  }
}
function init(){
  /* a print artifact left behind by a cancelled print would otherwise sit
     in the document and give the page a second scrollbar */
  const stray=document.getElementById('printReport');if(stray)stray.remove();
  lockLayout();
  window.addEventListener('resize',lockLayout);
  const a=lsGet(LS_AUTO);
  if(a){try{const d=JSON.parse(a);if(d&&d.v===2){S=mergeState(defaultState(),d);toast('Restored last session');}}catch(e){}}
  computeAll();
  buildProjHeader();
  rebuildInputs();
  buildTabs();
  hist=[JSON.stringify(S)];hIdx=0;
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
    if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo();}
  });
  /* re-render equations once KaTeX arrives (deferred script) */
  let tries=0;
  const kt=setInterval(()=>{
    if(window.katex){clearInterval(kt);renderTab();}
    else if(++tries>100)clearInterval(kt);
  },150);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
