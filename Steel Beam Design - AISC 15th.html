<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steel Beam Designer — AISC 360-16</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js" charset="utf-8"></script>
<style>
:root{
  --navy-900:#16304F; --navy-800:#1E3A5F; --blue-600:#2563EB;
  --green-600:#059669; --red-600:#DC2626; --amber-700:#B45309;
  --slate-50:#F8FAFC; --slate-100:#F1F3F5; --slate-200:#E4E7EB;
  --slate-400:#94A3B8; --slate-900:#0F172A;
  --ink:var(--slate-900); --paper:#fff; --panel:var(--slate-50); --line:var(--slate-200);
  --accent:var(--navy-800); --pass:var(--green-600); --fail:var(--red-600); --warn:var(--amber-700);
  --font-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-doc:"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
/* the app owns the viewport; only the two panels scroll. Nothing may
   push the document itself into a second scrollbar. */
#printReport{display:none}
body{font-family:var(--font-doc);font-size:10pt;color:var(--ink);background:#efede8}
/* Fixed to the viewport rather than sized by a percentage chain: the
   height cannot then depend on html/body resolving, which is what broke
   the layout. left/right 0 with max-width and auto margins still centres. */
#app{position:fixed;top:0;right:0;bottom:0;left:0;max-width:1500px;margin:0 auto;
  overflow:hidden;display:flex;flex-direction:column;background:var(--paper);
  box-shadow:0 0 12px rgba(0,0,0,.12)}
#hdr{flex:0 0 auto;border-bottom:3px solid var(--navy-900);padding:8px 14px 7px;background:var(--accent);color:#fff;z-index:20}
#hdr .titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#hdr h1{font-size:14.5pt;margin:0;letter-spacing:.4px;font-family:var(--font-ui);font-weight:600;color:#fff}
#hdr .byline{font-size:9pt;color:#C7D4E4;margin-top:1px;font-family:var(--font-ui)}
#hdr .stageTag{font-family:var(--font-ui);font-size:8.5pt;background:#ffffff22;border:1px solid #ffffff44;border-radius:4px;padding:2px 8px;color:#DCE6F1;align-self:center}
#projGrid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:4px 8px;margin-top:6px}
#projGrid label{display:block;font-family:var(--font-ui);font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#B9C8DB;margin-bottom:1px}
#projGrid input{width:100%;font-family:var(--font-ui);font-size:9pt;padding:3px 5px;border:1px solid #ffffff33;border-radius:3px;background:#ffffff14;color:#fff}
#projGrid input::placeholder{color:#8FA3BC}
#main{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
#inputPanel{flex:0 0 33%;max-width:460px;min-width:340px;overflow-y:auto;border-right:2px solid var(--line);background:var(--panel);padding:9px 10px 40px}
#outputPanel{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;padding:0 14px 60px;background:var(--paper)}
#tabBar{position:sticky;top:0;z-index:15;background:var(--paper);border-bottom:2px solid var(--accent);padding:7px 0 0;display:flex;flex-wrap:wrap;gap:2px}
#tabBar button{font-family:var(--font-ui);font-size:9pt;padding:5px 11px;border:1px solid var(--line);border-bottom:none;background:var(--slate-100);color:#41546E;cursor:pointer;border-radius:5px 5px 0 0}
.tabDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:0 0 8px;vertical-align:middle}
.tabDot.pass{background:var(--pass)}
.tabDot.fail{background:var(--fail)}
.tabDot.na{background:#B8C2CE}
#tabBar button{display:inline-flex;align-items:center}
.govStrip{display:flex;align-items:center;gap:9px;padding:5px 14px;font-family:var(--font-ui);font-size:9.5pt;
  border-bottom:1px solid var(--line);background:var(--slate-100);color:var(--ink)}
.govStrip.pass{background:#EAF6EE;border-bottom-color:#9ED3B0}
.govStrip.fail{background:#FBEAEA;border-bottom-color:#E2A2A2}
.govStrip.na{background:var(--slate-100)}
.govTxt{font-weight:600}
.govSec{margin-left:auto;color:#5A6B80;font-size:9pt}
.govBadge{font-weight:700;letter-spacing:.4px;padding:1px 8px;border-radius:4px;background:rgba(0,0,0,.06)}
.govStrip.pass .govBadge{color:var(--pass)}
.govStrip.fail .govBadge{color:var(--fail)}
@media print{.govStrip{display:none!important}}
#tabBar button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.tabPage{padding:10px 2px}
/* sections */
.sec{border:1px solid var(--line);border-radius:6px;margin:9px 0;background:var(--paper);overflow:hidden}
.secHead{display:flex;align-items:center;gap:7px;padding:6px 10px;background:linear-gradient(#F6F8FA,#EDF1F5);cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.secHead .caret{width:0;height:0;border-left:6px solid var(--accent);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.sec.collapsed .caret{transform:rotate(0deg)}
.sec:not(.collapsed) .caret{transform:rotate(90deg)}
.secTitle{font-family:var(--font-ui);font-size:10pt;font-weight:600;color:var(--accent);margin:0}
.secBody{padding:8px 11px}
.sec.collapsed .secBody{display:none}
/* input rows */
.fRow{display:grid;grid-template-columns:minmax(120px,1.35fr) minmax(70px,1fr) 42px;gap:6px;align-items:center;margin:3px 0}
.fRow label{font-size:10pt}
.fRow .unit{font-family:var(--font-ui);font-size:8pt;color:#64748B}
input[type=text],input[type=number],select,textarea{font-family:var(--font-ui);font-size:9.5pt;padding:3px 5px;border:1px solid #C6CFDA;border-radius:3px;background:#fff;color:var(--ink);width:100%}
input[type=number]{text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid #BFD3F2;border-color:var(--blue-600)}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent)}
button{font-family:var(--font-ui)}
.btn{font-size:9pt;padding:4px 10px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:4px;cursor:pointer}
.btn:hover{background:#EFF4FA}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.btn.sm{font-size:8pt;padding:2px 7px}
.btnRow{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}
/* tables */
table.tbl{border-collapse:collapse;width:100%;margin:5px 0;font-size:9.5pt}
table.tbl th{background:#DCE6F1;color:var(--navy-900);font-family:var(--font-ui);font-size:8.5pt;font-weight:700;padding:3px 6px;border:1px solid #B9C8DB;text-align:center}
table.tbl td{padding:2.5px 6px;border:1px solid var(--line);text-align:center}
table.tbl td.lft{text-align:left}
table.tbl tr.gov td{background:#FEF6E7}
table.cfg{border-collapse:collapse;width:100%;font-size:9pt}
table.cfg th{font-family:var(--font-ui);font-size:8pt;color:#64748B;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line)}
table.cfg td{padding:2px 4px}
table.cfg input,table.cfg select{font-size:8.8pt;padding:2px 4px}
/* load table */
#loadTbl td input[type=number]{width:62px}
#loadTbl .locked{opacity:.62}
.genBadge{font-family:var(--font-ui);font-size:7pt;background:#E0EAF6;color:var(--navy-800);border:1px solid #B9C8DB;border-radius:3px;padding:0 4px;margin-left:3px}
.caseChip{font-family:var(--font-ui);font-size:7.5pt;border-radius:3px;padding:1px 5px;font-weight:700}
/* equation blocks */
.eqBlock{border-left:3px solid #C9D6E6;padding:4px 10px;margin:7px 0;background:#FBFCFE}
.eqTitle{font-family:var(--font-ui);font-size:8.5pt;font-weight:600;color:var(--navy-800);margin-bottom:2px}
.eqRef{float:right;font-weight:400;color:#7C8CA3;font-size:8pt}
.eqLine{margin:3px 0;overflow-x:auto}
.katex{font-size:1.02em}
.varList{font-size:9pt;color:#3C4A5E;border-top:1px dashed #D8DFE8;margin-top:4px;padding-top:3px}
.varList>div{margin:1px 0}
/* notes / boxes */
.note{font-size:9pt;color:#4A5568;background:#F6F8FA;border:1px solid var(--line);border-radius:4px;padding:5px 9px;margin:6px 0}
.warnBox{font-size:9.5pt;color:#7C4A03;background:#FEF6E7;border:1.5px solid #F0C36D;border-radius:5px;padding:7px 10px;margin:7px 0}
.errBox{font-size:9.5pt;color:#8C1D1D;background:#FDECEC;border:1.5px solid #F1A8A8;border-radius:5px;padding:7px 10px;margin:7px 0;font-weight:600}
.okBox{font-size:9.5pt;color:#065F46;background:#E8F7F0;border:1.5px solid #7FD1B0;border-radius:5px;padding:7px 10px;margin:7px 0;font-weight:600}
/* dashboard chips */
#dash{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:8.5pt;border:1.5px solid;border-radius:5px;padding:4px 9px;cursor:pointer;background:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.pass{border-color:#9CD6BC}.chip.pass .dot{background:var(--pass)}
.chip.fail{border-color:#F1A8A8;background:#FDF3F3}.chip.fail .dot{background:var(--fail)}
.chip.na{border-color:#CBD5E1;color:#64748B}.chip.na .dot{background:#94A3B8}
.chip.warn{border-color:#F0C36D}.chip.warn .dot{background:var(--warn)}
.chip .ratio{font-weight:700}
/* schematic */
.schemWrap{border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;margin:6px 0;overflow-x:auto}
svg text{font-family:var(--font-ui)}
/* plot holders */
.plotHold{width:100%;height:250px;margin:4px 0 10px}
.plotHold3{height:230px}
/* misc */
.hint{font-family:var(--font-ui);font-size:8pt;color:#7C8CA3;margin:2px 0}
.small{font-size:8.5pt}
.ovrIn{background:#FFF7E8 !important;border-color:#E0B25A !important}
.dirty{color:var(--warn);font-weight:700}
textarea{min-height:64px;resize:vertical;font-family:var(--font-doc);font-size:10pt}
.manNav{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;position:sticky;top:34px;background:var(--paper);padding:4px 0;z-index:10;border-bottom:1px solid var(--line)}
.manNavBtn{font-size:8pt;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--slate-100);color:#41546E;cursor:pointer}
.manNavBtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.manH{font-size:12.5pt;color:var(--navy-900);border-bottom:1.5px solid var(--navy-900);padding-bottom:2px;margin:14px 0 6px}
.manH3{font-size:11pt;color:var(--navy-800);margin:10px 0 4px}
.manP{margin:5px 0;line-height:1.42}
.manList{margin:4px 0 6px;line-height:1.4}
.manKey{border-left:4px solid var(--blue-600);background:#EFF5FE;padding:6px 10px;margin:7px 0;font-size:9.5pt}
.manEq{margin:6px 0}
.manEqNote{font-size:9pt;color:#4A5568;margin:-2px 0 6px 12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;font-family:var(--font-ui);font-size:9pt;padding:7px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:.94}
#updDot{position:fixed;top:8px;right:14px;font-family:var(--font-ui);font-size:8pt;color:#fff;background:var(--blue-600);border-radius:4px;padding:2px 8px;opacity:0;transition:opacity .15s;z-index:99}
#updDot.show{opacity:.9}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C4CDD8;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="titleRow">
      <div>
        <h1>Steel Beam Designer &mdash; AISC 360-16 (LRFD)</h1>
        <div class="byline">by Mario Lococo</div>
      </div>
      <div class="stageTag" id="stageTag">Stage 1 &middot; Analysis Engine, Loads &amp; Sections &middot; strength checks arrive in Stage 2</div>
    </div>
    <div id="projGrid"></div>
  </div>
  <div id="main">
    <div id="inputPanel"></div>
    <div id="outputPanel">
      <div id="tabBar"></div>
      <div id="tabPages"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="updDot">recalculating&hellip;</div>
<script>
"use strict";
/* =====================================================================
   Steel Beam Designer — AISC 360-16 LRFD — Stage 1
   Stage 1 scope: continuous-beam analysis engine (direct stiffness),
   load cases/combinations, tributary load generation, service-level
   deflection checks, AISC shape database + overrides, bracing inputs,
   validation benchmarks, user manual skeleton.
   Design strength checks (Ch. F/G/E/H/J10) land in Stage 2.
   ===================================================================== */
const EKSI=29000, GKSI=11200;              /* ksi */
const NN='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.innerHTML=txt;return e;}
function fmt(v,d){if(v===undefined||v===null||!isFinite(v))return'\u2014';const p=(d===undefined)?2:d;
  const a=Math.abs(v);let s=v.toFixed(p);
  if(a!==0&&a<0.5*Math.pow(10,-p))s=v.toExponential(2);
  return s;}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1900);}
const TEX_CMD={'\u2264':'\\le ','\u2265':'\\ge ','\u2260':'\\ne ','\u2248':'\\approx ',
  '\u00D7':'\\times ','\u2212':'-','\u2192':'\\to ','\u00B1':'\\pm ','\u221E':'\\infty ',
  '\u03B1':'\\alpha ','\u03B2':'\\beta ','\u03B3':'\\gamma ','\u0394':'\\Delta ','\u03B4':'\\delta ',
  '\u03B8':'\\theta ','\u03BB':'\\lambda ','\u03C0':'\\pi ','\u03C1':'\\rho ','\u03C3':'\\sigma ',
  '\u03C4':'\\tau ','\u03C6':'\\phi ','\u03A3':'\\Sigma ','\u00B0':'^{\\circ}','\u2032':'\\prime '};
/* modifier letters and unicode sub/superscripts have no KaTeX glyph */
const TEX_SUB={'\u1D62':'i','\u1D63':'r','\u1D64':'u','\u1D65':'v','\u1D66':'b','\u1D67':'y',
  '\u1D9C':'c','\u1DA0':'f','\u1D47':'b','\u1D48':'d','\u1D49':'e','\u1D4D':'g','\u1D50':'m',
  '\u1D52':'o','\u1D56':'p','\u1D57':'t','\u1D58':'u','\u1D5B':'v','\u1D2E':'B','\u1D38':'L',
  '\u02B3':'r','\u02E1':'l','\u02E2':'s','\u02B0':'h','\u2090':'a','\u2091':'e','\u2092':'o',
  '\u2093':'x','\u2095':'h','\u2096':'k','\u2097':'l','\u2098':'m','\u2099':'n','\u209A':'p',
  '\u209B':'s','\u209C':'t','\u2080':'0','\u2081':'1','\u2082':'2','\u2083':'3','\u2084':'4',
  '\u2085':'5','\u2086':'6','\u2087':'7','\u2088':'8','\u2089':'9'};
const TEX_SUP={'\u00B2':'2','\u00B3':'3','\u00B9':'1','\u2070':'0','\u2074':'4','\u2075':'5',
  '\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9'};
const SUB_RE=new RegExp('['+Object.keys(TEX_SUB).join('')+']+','g');
const SUP_RE=new RegExp('['+Object.keys(TEX_SUP).join('')+']+','g');
const SPECIAL_RE=new RegExp('['+Object.keys(TEX_SUB).join('')+Object.keys(TEX_SUP).join('')+
  Object.keys(TEX_CMD).join('')+'\u00B7]');
function texMath(s){
  s=s.replace(SUB_RE,m=>'_{'+m.split('').map(ch=>TEX_SUB[ch]).join('')+'}');
  s=s.replace(SUP_RE,m=>'^{'+m.split('').map(ch=>TEX_SUP[ch]).join('')+'}');
  s=s.replace(/\u00B7/g,'\\cdot ');
  Object.keys(TEX_CMD).forEach(k=>{s=s.split(k).join(TEX_CMD[k]);});
  return s;
}
/* a \text{...} group cannot hold subscripts, superscripts or symbols, so it is
   split into text runs with the special characters rendered in math between */
function texTextGroup(inner){
  if(!SPECIAL_RE.test(inner))return '\\text{'+inner+'}';
  const out=[];let buf='';
  for(const ch of inner){
    if(SPECIAL_RE.test(ch)){
      if(buf){out.push('\\text{'+buf+'}');buf='';}
      out.push(texMath(ch));
    }else buf+=ch;
  }
  if(buf)out.push('\\text{'+buf+'}');
  return out.join('');
}
function texSafe(src){
  let s=String(src),parts=[];
  s=s.replace(/\\text\{([^{}]*)\}/g,(m,inner)=>{parts.push(inner);return '\u0001'+(parts.length-1)+'\u0001';});
  s=texMath(s);
  s=s.replace(/\u0001(\d+)\u0001/g,(m,i)=>texTextGroup(parts[+i]));
  return s;
}
function tex(elm,src,disp){
  const s=texSafe(src);
  if(window.katex){try{katex.render(s,elm,{throwOnError:false,displayMode:!!disp});return;}catch(e){}}
  elm.textContent=src;
}
function eqBlock(opts){
  const wrap=el('div','eqBlock');
  const t=el('div','eqTitle');t.textContent=opts.title||'';
  if(opts.ref){const r=el('span','eqRef');r.textContent='['+opts.ref+']';t.appendChild(r);}
  wrap.appendChild(t);
  (opts.lines||[]).forEach(src=>{const l=el('div','eqLine');tex(l,src,true);wrap.appendChild(l);});
  if(opts.vars&&opts.vars.length){
    const v=el('div','varList');
    opts.vars.forEach(vd=>{const row=el('div');const sym=el('span');tex(sym,vd[0],false);
      row.appendChild(sym);row.appendChild(document.createTextNode(' = '+vd[1]+(vd[2]?' \u2014 '+vd[2]:'')));v.appendChild(row);});
    wrap.appendChild(v);
  }
  return wrap;
}
/* ---- collapsible section with autosaved collapse state + dynamic numbering ---- */
let __secNum=0;
function resetSecNum(){__secNum=0;}
function mkSection(id,title,builder,parent,opts){
  if(typeof MSKIP==='function'&&MSKIP(id))return;
  opts=opts||{};
  const sec=el('div','sec');sec.setAttribute('data-secid',id);
  if(S.ui.collapse[id])sec.classList.add('collapsed');
  const head=el('div','secHead');head.appendChild(el('span','caret'));
  const n=opts.noNum?'':((++__secNum)+'. ');
  head.appendChild(el('h2','secTitle',n+title));
  head.addEventListener('click',()=>{sec.classList.toggle('collapsed');
    S.ui.collapse[id]=sec.classList.contains('collapsed');autosave();});
  sec.appendChild(head);
  const body=el('div','secBody');builder(body);sec.appendChild(body);
  parent.appendChild(sec);return sec;
}
/* ---- focus-preserving field machinery ---- */
let __fSeq=0;
function tagField(e,key){e.setAttribute('data-fkey',key||('f'+(++__fSeq)));return e;}
function captureUI(){
  const a=document.activeElement;
  if(!a||!a.getAttribute)return null;
  const k=a.getAttribute('data-fkey');if(!k)return null;
  const st={key:k};
  try{st.selS=a.selectionStart;st.selE=a.selectionEnd;}catch(e){}
  return st;
}
function restoreUI(st){
  if(!st)return;
  const e=document.querySelector('[data-fkey="'+st.key+'"]');
  if(!e)return;
  e.focus();
  try{if(st.selS!=null)e.setSelectionRange(st.selS,st.selE);}catch(err){}
}
/* ---- bound inputs ---- */
function numInput(get,set,step,key){
  const i=document.createElement('input');i.type='number';if(step!=null)i.step=step;
  i.value=(get()===null||get()===undefined||get()==='')?'':get();
  tagField(i,key);
  i.addEventListener('input',()=>{const v=i.value===''?null:parseFloat(i.value);
    if(i.value===''||isFinite(v)){set(v);schedule();}});
  return i;
}
function txtInput(get,set,key){
  const i=document.createElement('input');i.type='text';i.value=get()||'';tagField(i,key);
  i.addEventListener('input',()=>{set(i.value);schedule();});
  return i;
}
function chkInput(get,set,key){
  const i=document.createElement('input');i.type='checkbox';i.checked=!!get();tagField(i,key);
  i.addEventListener('change',()=>{set(i.checked);schedule(true);});
  return i;
}
function selInput(opts,get,set,labelFn,valFn,key){
  const s=document.createElement('select');tagField(s,key);
  opts.forEach(o=>{const op=document.createElement('option');
    op.value=valFn?valFn(o):o;op.textContent=labelFn?labelFn(o):o;s.appendChild(op);});
  s.value=get();
  s.addEventListener('change',()=>{set(s.value);schedule(true);});
  return s;
}
function fRow(parent,label,input,unit,hint){
  const r=el('div','fRow');
  const l=el('label');l.innerHTML=label;if(hint)l.title=hint;
  r.appendChild(l);r.appendChild(input);r.appendChild(el('span','unit',unit||''));
  parent.appendChild(r);return r;
}
/* =====================================================================
   MATERIALS
   ===================================================================== */

/* =====================================================================
   SHAPE DATABASE ACCESS + OVERRIDE RESOLUTION
   ===================================================================== */
const _dbCache={};
function shapesOf(fam){return DB[fam]||[];}
function shapeRow(fam,label){
  const key=fam+'|'+label;
  if(_dbCache[key])return _dbCache[key];
  const kind=DBKIND[fam],keys=DBKEYS[kind];
  const arr=shapesOf(fam);
  const raw=arr.find(r=>r[0]===label)||arr[0];
  if(!raw)return null;
  const o={_kind:kind,_fam:fam};
  keys.forEach((k,i)=>o[k]=raw[i]);
  _dbCache[key]=o;return o;
}
/* Resolve section: DB values + user overrides.
   Tier 1 geometry may be overridden; Tier 2 slenderness ratios are ALWAYS
   recomputed from resolved geometry (never trusted from the DB once geometry
   changes); Tier 3 properties are individually overridable. */
const OVR_FIELDS={
  I:['d','bf','tf','tw','kdes','hClear','A','Ix','Zx','Sx','rx','Iy','Zy','Sy','ry','J','Cw','rts','ho','Wno','Sw1','Qf','Qw','Wt'],
  C:['d','bf','tf','tw','kdes','hClear','xbar','eo','A','Ix','Zx','Sx','rx','Iy','Zy','Sy','ry','J','Cw','rts','ho','ro','Hc','Wno','Sw1','Qf','Qw','Wt'],
  R:['Ht','B','tdes','tnom','A','Ix','Zx','Sx','rx','Iy','Zy','Sy','ry','J','Cc','Wt'],
  P:['OD','tdes','tnom','A','Ix','Zx','Sx','rx','J','Cc','Wt']
};
function resolveSection(){
  const fam=S.section.family,db=shapeRow(fam,S.section.label);
  if(!db)return null;
  const kind=db._kind,mat=matOf(S.section.grade);
  const p={_kind:kind,_fam:fam,lbl:db.lbl,mat,_built:!!S.section.builtUp};
  const src={};
  OVR_FIELDS[kind].forEach(k=>{
    const ov=S.section.ovr[k];
    if(ov!=null&&ov!==''&&isFinite(ov)){p[k]=+ov;src[k]='ovr';}
    else{p[k]=db[k];src[k]='db';}
  });
  /* HSS design wall thickness rule: A1085 uses nominal wall */
  if((kind==='R'||kind==='P')&&mat.tRule==='nom'&&src.tdes!=='ovr')
    {p.tdes=p.tnom;src.tdes='rule';}
  /* Tier 2 — slenderness ratios recomputed from resolved geometry */
  if(kind==='I'||kind==='C'){
    p.bf2tf=p.bf/(2*p.tf);
    /* h (clear web between fillets) is not tabulated; back it out from the DB
       ratio at DB thickness, then re-ratio with the resolved thickness. */
    const hDb=(db.htw!=null&&db.tw)?db.htw*db.tw:null;
    if(src.hClear!=='ovr')p.hClear=hDb;
    p.htw=(p.hClear!=null&&p.tw)?p.hClear/p.tw:db.htw;
  }else if(kind==='R'){
    /* AISC G4 / B4 convention when corner radii unknown: flat = outside − 3t */
    p.bFlat=p.B-3*p.tdes;p.hFlat=p.Ht-3*p.tdes;
    p.btdes=p.bFlat/p.tdes;p.htdes=p.hFlat/p.tdes;
  }else if(kind==='P'){
    p.Dt=p.OD/p.tdes;
    p.Iy=p.Ix;p.Zy=p.Zx;p.Sy=p.Sx;p.ry=p.rx;
  }
  p._src=src;
  p.overridden=Object.keys(S.section.ovr).filter(k=>S.section.ovr[k]!=null&&S.section.ovr[k]!=='');
  return p;
}
/* Consistency checks — idealized re-derivation vs resolved values (§8) */
function sectionWarnings(p){
  const w=[];
  if(!p)return w;
  const pct=(a,b)=>Math.abs(a-b)/Math.abs(b)*100;
  if(p._kind==='I'||p._kind==='C'){
    const Acalc=2*p.bf*p.tf+(p.d-2*p.tf)*p.tw;
    if(pct(Acalc,p.A)>5)w.push('Cross-section area inconsistency: A = '+fmt(p.A)+' in\u00B2 resolved vs '+fmt(Acalc)+' in\u00B2 recomputed from d, b\u2093, t\u2093, t\u1D65 (idealized, no fillets). Check overrides for consistency.');
    const Zc=p.bf*p.tf*(p.d-p.tf)+0.25*p.tw*Math.pow(p.d-2*p.tf,2);
    if(p._kind==='I'&&pct(Zc,p.Zx)>6)w.push('Plastic modulus inconsistency: Z\u2093 = '+fmt(p.Zx)+' in\u00B3 resolved vs '+fmt(Zc)+' in\u00B3 recomputed from overridden geometry (idealized).');
  }else if(p._kind==='P'){
    const Acalc=Math.PI/4*(p.OD*p.OD-Math.pow(p.OD-2*p.tdes,2));
    if(pct(Acalc,p.A)>4)w.push('Area inconsistency: A = '+fmt(p.A)+' in\u00B2 vs '+fmt(Acalc)+' in\u00B2 from OD and t_des.');
  }else if(p._kind==='R'){
    const Acalc=2*p.tdes*(p.B+p.Ht-2*p.tdes)-(4-Math.PI)*Math.pow(2*p.tdes,2)/2;
    if(pct(Acalc,p.A)>7)w.push('Area inconsistency: A = '+fmt(p.A)+' in\u00B2 vs \u2248'+fmt(Acalc)+' in\u00B2 from wall geometry.');
  }
  return w;
}

let S=defaultState();
function mergeState(base,inc){
  if(inc==null||typeof inc!=='object')return base;
  Object.keys(inc).forEach(k=>{
    if(Array.isArray(inc[k]))base[k]=inc[k];
    else if(inc[k]&&typeof inc[k]==='object'){if(!base[k]||typeof base[k]!=='object')base[k]={};mergeState(base[k],inc[k]);}
    else base[k]=inc[k];
  });
  return base;
}

let hist=[],hIdx=-1,histT=null;
function pushHist(){
  clearTimeout(histT);
  histT=setTimeout(()=>{
    const s=JSON.stringify(S);
    if(hist[hIdx]===s)return;
    hist=hist.slice(0,hIdx+1);hist.push(s);
    if(hist.length>80)hist.shift();
    hIdx=hist.length-1;
  },400);
}
function undo(){if(hIdx<=0)return;hIdx--;S=mergeState(defaultState(),JSON.parse(hist[hIdx]));fullRebuild();toast('Undo');}
function redo(){if(hIdx>=hist.length-1)return;hIdx++;S=mergeState(defaultState(),JSON.parse(hist[hIdx]));fullRebuild();toast('Redo');}

function fmtF(v){const r=Math.round(v*100)/100;return Number.isInteger(r)?r.toFixed(1):(''+r);}
function comboName(f){
  const act=S.cases.filter(cs=>(f[cs.id]||0)!==0);
  if(!act.length)return'(all factors zero)';
  return act.map(cs=>fmtF(f[cs.id])+cs.id).join(' + ');
}

const CASE_CLR={DL:['#dbeafe','#1d4ed8'],LL:['#dcfce7','#15803d'],SL:['#e0f2fe','#0369a1'],WL:['#fae8ff','#86198f']};
const XPAL=[['#fef3c7','#92400e'],['#ffe4e6','#9f1239'],['#ede9fe','#5b21b6'],['#ccfbf1','#0f766e']];
function caseStyle(id){
  const fc=CASE_CLR[id];if(fc)return'background:'+fc[0]+';color:'+fc[1];
  let xi=0;for(const cs of S.cases){if(CASE_CLR[cs.id])continue;if(cs.id===id)break;xi++;}
  const p=XPAL[xi%XPAL.length];return'background:'+p[0]+';color:'+p[1];
}
/* =====================================================================
   TRIBUTARY LOAD GENERATOR  (§0: derivation shown in Load Derivation tab)
   Generated loads carry ld.gen and are locked in the load table.
   ===================================================================== */
function tribW(caseId){
  const p=S.trib.p[caseId]||0,ln=S.trib.line[caseId]||0;
  return p*(S.trib.twL+S.trib.twR)/1000+ln;   /* kip/ft */
}
function selfWeightW(){
  const p=resolveSection();
  return p?(p.Wt||0)/1000:0;                  /* kip/ft */
}
function syncGenLoads(){
  /* preserve user off-flags per generated load id */
  const offMap={};
  S.loads.forEach(ld=>{if(ld.gen)offMap[ld.gen.src+'|'+(ld.gen.lc||'')]=!!ld.off;});
  S.loads=S.loads.filter(ld=>!ld.gen);
  if(S.trib.on){
    S.cases.forEach(cs=>{
      const w=tribW(cs.id);
      if(Math.abs(w)>1e-9){
        S.loads.push({id:'g_'+cs.id,nm:'w_'+cs.id+' (trib)',type:'uniform',lc:cs.id,
          allSpans:true,mag:w,off:offMap['trib|'+cs.id]||false,
          gen:{src:'trib',lc:cs.id,p:S.trib.p[cs.id]||0,line:S.trib.line[cs.id]||0,twL:S.trib.twL,twR:S.trib.twR}});
      }
    });
  }
  if(S.trib.sw){
    const w=selfWeightW();
    if(w>1e-9)S.loads.push({id:'g_sw',nm:'self weight',type:'uniform',lc:'DL',
      allSpans:true,mag:w,off:offMap['sw|DL']||false,gen:{src:'sw',lc:'DL',w}});
  }
}
/* manual load helpers */
let __ldSeq=0;
function newLoadId(){return'u'+(++__ldSeq)+'_'+Date.now()%100000;}
function autoName(type){
  const pre=type==='point'?'P':type==='moment'?'M':'w';
  const used=S.loads.filter(l=>(l.nm||'').startsWith(pre)).map(l=>parseInt((l.nm||'').slice(pre.length),10)).filter(n=>!isNaN(n));
  let n=1;while(used.includes(n))n++;return pre+n;
}
function spanLen(ld){const sp=S.geom.spans;return ld.allSpans?totalL():(sp[Math.min(ld.si||0,sp.length-1)]||{L:1}).L;}
function clampLoad(ld){
  const spL=spanLen(ld);
  if(!ld.allSpans&&(ld.si==null||ld.si>S.geom.spans.length-1))ld.si=Math.max(0,S.geom.spans.length-1);
  if(ld.type==='point'||ld.type==='moment')ld.pos=Math.max(0,Math.min(spL,ld.pos||0));
  else if(ld.type==='trap'){
    ld.sx=Math.max(0,Math.min(spL,ld.sx||0));
    ld.ex=Math.min(spL,ld.ex==null?spL:ld.ex);
    if(ld.ex<=ld.sx)ld.ex=Math.min(spL,ld.sx+Math.max(.01,spL*.05));
  }
}

   LEGACY IMPORT — Shear_and_Moment_Diagrams project JSON
   ===================================================================== */
function importLegacy(d){
  const CF={kip:1,lb:0.001,kN:0.2248089,N:0.0002248089};
  const LF={ft:1,in:1/12,m:3.280840,cm:0.03280840};
  const cf=CF[d.fu]||1,lf=LF[d.lu]||1;
  const st=defaultState();
  st.proj.name=d.projName||'Imported Beam';
  st.geom.spans=(d.spans||[{L:12}]).map(sp=>({L:+(sp.L*lf).toFixed(6)}));
  st.geom.nodes=(d.nodes||[]).map(n=>({t:(n.t==='roller')?'pin':n.t}));
  while(st.geom.nodes.length<st.geom.spans.length+1)st.geom.nodes.push({t:'pin'});
  if(d.cases&&d.cases.length)st.cases=d.cases.map(c=>({id:c.id,name:c.name||c.id}));
  if(d.combos&&d.combos.length)st.combos=d.combos.map((c,i)=>({id:c.id||('imp'+i),f:Object.assign({},c.f),on:c.on!==false,stage:'final'}));
  st.trib.on=false;st.trib.sw=false;
  st.loads=(d.loads||[]).map(ld=>{
    const o={id:newLoadId(),nm:ld.nm||'',type:ld.type==='distributed'?'trap':ld.type,lc:ld.lc||'DL',
      allSpans:!!ld.allSpans&&ld.type==='uniform',si:ld.si||0,off:!!ld.off};
    if(ld.type==='point'){o.mag=ld.mag*cf;o.pos=ld.pos*lf;}
    else if(ld.type==='moment'){o.mag=ld.mag*cf*lf;o.pos=ld.pos*lf;}
    else if(ld.type==='uniform'){o.mag=ld.mag*cf/lf;}
    else{o.sm=ld.sm*cf/lf;o.em=ld.em*cf/lf;o.sx=(ld.sx||0)*lf;o.ex=(ld.ex||0)*lf;}
    if(!o.nm)o.nm=autoName(o.type);
    return o;
  });
  st.disp.userX=d.userXs||'';
  S=st;
  toast('Legacy project imported \u2014 loads converted to kip/ft. Section, material and bracing use defaults; set them in the input panel.');
  fullRebuild();
}

/* =====================================================================
   ANALYSIS ENGINE — Direct Stiffness Method, Euler-Bernoulli elements
   Units: geometry ft, forces kip, moments kip·ft, EI kip·ft².
   Sign conventions (stated once, per §0.2):
     • applied transverse loads positive DOWNWARD (gravity)
     • support reactions positive UPWARD
     • internal moment positive SAGGING; shear follows left-segment statics
     • applied couples positive COUNTER-CLOCKWISE
     • deflection δ reported positive DOWNWARD
   ===================================================================== */
function totalL(){return S.geom.spans.reduce((s,sp)=>s+sp.L,0);}
function nodeXs(){const x=[0];S.geom.spans.forEach(sp=>x.push(x[x.length-1]+sp.L));return x;}
function gauss(Ai,bi){
  const n=bi.length,A=Ai.map(r=>[...r]),b=[...bi];
  for(let i=0;i<n;i++){
    let m=i;for(let k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[m][i]))m=k;
    [A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];
    if(Math.abs(A[i][i])<1e-14)continue;
    for(let k=i+1;k<n;k++){const c=A[k][i]/A[i][i];for(let j=i;j<n;j++)A[k][j]-=c*A[i][j];b[k]-=c*b[i];}
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){x[i]=b[i];for(let j=i+1;j<n;j++)x[i]-=A[i][j]*x[j];if(Math.abs(A[i][i])>1e-14)x[i]/=A[i][i];}
  return x;
}
function elemK(EI,L){const a=EI/(L*L*L);
  return[[12*a,6*L*a,-12*a,6*L*a],[6*L*a,4*L*L*a,-6*L*a,2*L*L*a],[-12*a,-6*L*a,12*a,-6*L*a],[6*L*a,2*L*L*a,-6*L*a,4*L*L*a]];}
/* Fixed-end reactions for the loads on one span (downward-positive loads).
   Point & couple closed-form; distributed by numeric integration (N=240).
   Sign of the couple FER verified: SS beam R=±M0/L; FF beam FEM=M0/4. */
function spanFER(spL,loadsInSpan,fac){
  const r=[0,0,0,0];
  loadsInSpan.forEach(ld=>{
    const fk=fac[ld.lc]||0;if(!fk)return;
    if(ld.type==='point'){
      const P=ld.mag*fk,a=Math.max(0,Math.min(spL,ld.pos)),b=spL-a,L=spL;
      r[0]+=P*b*b*(L+2*a)/(L*L*L);r[1]+=P*a*b*b/(L*L);
      r[2]+=P*a*a*(3*L-2*a)/(L*L*L);r[3]-=P*a*a*b/(L*L);
    }else if(ld.type==='moment'){
      const C=ld.mag*fk,a=Math.max(0,Math.min(spL,ld.pos)),b=spL-a,L=spL;
      r[0]+=C*(6*a*b)/(L*L*L);r[1]-=C*b*(b-2*a)/(L*L);
      r[2]-=C*(6*a*b)/(L*L*L);r[3]+=C*a*(2*b-a)/(L*L);
    }else{
      const x1=ld.type==='uniform'?0:(ld.sx||0),x2=ld.type==='uniform'?spL:(ld.ex||spL);
      const w1=(ld.type==='uniform'?ld.mag:ld.sm)*fk,w2=(ld.type==='uniform'?ld.mag:ld.em)*fk;
      const N=240,dx=(x2-x1)/N;
      for(let k=0;k<N;k++){
        const s=x1+(k+.5)*dx,w=w1+(w2-w1)*(x2>x1?(s-x1)/(x2-x1):0),b=spL-s,L=spL;
        r[0]+=w*b*b*(L+2*s)/(L*L*L)*dx;r[1]+=w*s*b*b/(L*L)*dx;
        r[2]+=w*s*s*(3*L-2*s)/(L*L*L)*dx;r[3]-=w*s*s*b/(L*L)*dx;
      }
    }
  });
  return r;
}
/* spanEI(i): per-span EI in kip·ft². Composite groundwork — a span-level EI
   override slot exists so staged/composite stiffness can slot in later. */
function spanEI(i,Ifallback){
  const sp=S.geom.spans[i];
  const Iin4=(sp&&sp.Iovr!=null&&sp.Iovr>0)?sp.Iovr:Ifallback;
  return EKSI*Iin4/144;    /* kip/in²·in⁴ → kip·in² → /144 → kip·ft² */
}
function loadsForSpan(i){
  return S.loads.filter(ld=>!ld.off&&((!ld.allSpans&&Math.min(ld.si||0,S.geom.spans.length-1)===i)||(ld.allSpans&&ld.type==='uniform')));
}
function isStable(){
  const nSup=S.geom.nodes.filter(n=>n.t!=='free').length;
  const nFix=S.geom.nodes.filter(n=>n.t==='fixed').length;
  return nFix>0||nSup>=2;
}
/* Solve one factor set. Pure: no state mutation. */
function solveFor(fac,Iin4){
  const sp=S.geom.spans,ns=sp.length,nn=ns+1,nd=2*nn;
  const K=Array.from({length:nd},()=>new Array(nd).fill(0));
  const f=new Array(nd).fill(0);
  sp.forEach((s2,i)=>{
    const ke=elemK(spanEI(i,Iin4),s2.L),d=[2*i,2*i+1,2*i+2,2*i+3];
    for(let a=0;a<4;a++)for(let b=0;b<4;b++)K[d[a]][d[b]]+=ke[a][b];
    const fr=spanFER(s2.L,loadsForSpan(i),fac);
    f[2*i]+=fr[0];f[2*i+1]+=fr[1];f[2*i+2]+=fr[2];f[2*i+3]+=fr[3];
  });
  const con=new Array(nd).fill(false);
  S.geom.nodes.forEach((n2,i)=>{if(n2.t==='free')return;con[2*i]=true;if(n2.t==='fixed')con[2*i+1]=true;});
  const free=[];for(let i=0;i<nd;i++)if(!con[i])free.push(i);
  const df=gauss(free.map(i=>free.map(j=>K[i][j])),free.map(i=>f[i]));
  const dF=new Array(nd).fill(0);free.forEach((dof,x)=>dF[dof]=df[x]);
  const Kd=dF.map((_,i)=>K[i].reduce((s2,k,j)=>s2+k*dF[j],0));
  const R=S.geom.nodes.map((n2,j)=>n2.t==='free'?{v:0,m:0}:{v:f[2*j]-Kd[2*j],m:f[2*j+1]-Kd[2*j+1]});
  return{R,dF};

/* Exact V & M at any X by statics on the left segment.
   A reaction couple enters the internal sagging moment with NEGATIVE sign
   (verified: FF midspan P → M_end = −PL/8, M_mid = +PL/8). */
function evalVM(X,R,fac){
  const nX=nodeXs(),sp=S.geom.spans;
  let V=0,M=0;
  S.geom.nodes.forEach((_,j)=>{if(nX[j]<=X+1e-9){V+=R[j].v;M+=R[j].v*(X-nX[j])-R[j].m;}});
  S.loads.forEach(ld=>{
    if(ld.off)return;const fk=fac[ld.lc]||0;if(!fk)return;
    if(ld.allSpans&&ld.type==='uniform'){const w=ld.mag*fk;V-=w*X;M-=w*X*X/2;return;}
    const si=Math.min(ld.si||0,sp.length-1),x0=nX[si],spL=sp[si].L;
    if(ld.type==='point'){
      const gx=x0+Math.max(0,Math.min(spL,ld.pos)),P=ld.mag*fk;
      if(gx<=X+1e-9){V-=P;M-=P*(X-gx);}
    }else if(ld.type==='moment'){
      const gx=x0+Math.max(0,Math.min(spL,ld.pos));
      if(gx<=X+1e-9)M-=ld.mag*fk;
    }else{
      const lx1=ld.type==='uniform'?0:(ld.sx||0),lx2=ld.type==='uniform'?spL:(ld.ex||spL);
      const gx1=x0+lx1,gx2=x0+lx2;
      const w1=(ld.type==='uniform'?ld.mag:ld.sm)*fk,w2=(ld.type==='uniform'?ld.mag:ld.em)*fk;
      if(gx1<X+1e-9){
        const T=Math.min(X,gx2)-gx1;
        if(T>0){const ls=lx2-lx1||spL,sl2=(w2-w1)/ls;
          V-=w1*T+sl2*T*T/2;M-=((X-gx1)*(w1*T+sl2*T*T/2)-(w1*T*T/2+sl2*T*T*T/3));}
      }
    }
  });
  return{V,M};
}
/* Station list (Seam B): union of uniform grid, node points, load points ±ε
   (so shear discontinuities are captured exactly, fixing the grid-clipping
   defect of the predecessor app), distributed-load ends, and user stations. */
function stationList(){
  const L=totalL(),nX=nodeXs(),sp=S.geom.spans;
  const set=new Set();
  const add=x=>{if(x>=-1e-9&&x<=L+1e-9)set.add(Math.max(0,Math.min(L,+x.toFixed(9))));};
  const nGrid=Math.max(240,sp.length*60);
  for(let i=0;i<=nGrid;i++)add(i/nGrid*L);
  nX.forEach(add);
  const EPS=1e-6;
  S.loads.forEach(ld=>{
    if(ld.off)return;
    const si=Math.min(ld.si||0,sp.length-1),x0=nX[si],spL=sp[si].L;
    if(ld.type==='point'||ld.type==='moment'){
      const gx=x0+Math.max(0,Math.min(spL,ld.pos||0));add(gx-EPS);add(gx);add(gx+EPS);
    }else if(ld.type==='trap'){add(x0+(ld.sx||0));add(x0+(ld.ex||spL));}
  });
  userXList().forEach(add);
  return Array.from(set).sort((a,b)=>a-b);
}
function userXList(){
  return(S.disp.userX||'').split(',').map(s=>parseFloat(s.trim())).filter(n=>isFinite(n)&&n>=0&&n<=totalL());
}
/* Deflection by double integration of M/EI (per-span EI aware).
   Constants set by δ=0 at the FIRST and LAST supported nodes; the exact M

function deflCurve(R,fac,Iin4){

    let si=0;for(let i=0;i<S.geom.spans.length;i++)if(x>=nX[i]-1e-9)si=i;

  };
  const F1=new Array(n+1).fill(0),F2=new Array(n+1).fill(0);

    F1[i]=F1[i-1]+.5*(Ms[i-1]/EIat(xs[i-1]-1e-9)+Ms[i]/EIat(xs[i]-1e-9))*dx;
  }
  for(let i=1;i<=n;i++){const dx=xs[i]-xs[i-1];F2[i]=F2[i-1]+.5*(F1[i-1]+F1[i])*dx;}
  const sup=S.geom.nodes.map((nd2,j)=>nd2.t!=='free'?j:-1).filter(j=>j>=0);
  if(sup.length<2&&!S.geom.nodes.some(n2=>n2.t==='fixed'))return null;
  const F2at=x=>{
    const t=x/L*n,i0=Math.max(0,Math.min(n-1,Math.floor(t))),fr=t-i0;
    return F2[i0]+(F2[i0+1]-F2[i0])*fr;
  };
  let C1,C2;
  if(sup.length>=2){
    const xa=nX[sup[0]],xb=nX[sup[sup.length-1]];
    C1=(F2at(xb)-F2at(xa))/((xb-xa)||1);C2=F2at(xa)-C1*xa;
  }else{
    /* single fixed support (cantilever): δ=0 and slope=0 there */
    const j=S.geom.nodes.findIndex(n2=>n2.t==='fixed');
    const xa=nX[j];
    const F1at=x=>{const t=x/L*n,i0=Math.max(0,Math.min(n-1,Math.floor(t))),fr=t-i0;return F1[i0]+(F1[i0+1]-F1[i0])*fr;};
    C1=F1at(xa);C2=F2at(xa)-C1*xa;
  }
  /* v (up) = F2 − C1·x − C2 folded; δ down = −v */
  return{xs,d:xs.map((x,i)=>-(F2[i]-C1*x-C2)),residuals:sup.slice(1,-1).map(j=>({node:j,d:-(F2at(nX[j])-C1*nX[j]-C2)}))};
}
/* =====================================================================
   computeAll — the analysis result bus (Seam A)
   ===================================================================== */
let AN=null;
function computeAll(){
  if(S.mode==='batch')return computeBatch();
  if(S.mode==='member')return computeMember();
  syncGenLoads();
  const sect=resolveSection();
  const Iin4=sect?sect.Ix:1;
  const res={stable:isStable(),sect,warns:sectionWarnings(sect),blockers:[],notes:[]};
  S.geom.spans.forEach((sp,i)=>{if(!(sp.L>0))res.blockers.push('Span '+(i+1)+' has non-positive length.');});
  if(!res.stable)res.blockers.push('Structure is a mechanism: provide at least one fixed support or two supported nodes.');
  if(res.blockers.length){AN=res;return res;}
  res.L=totalL();res.nX=nodeXs();
  res.stations=stationList();
  /* ---- strength combinations ---- */
  res.combos=[];
  S.combos.filter(c=>c.on!==false).forEach(c=>{
    const sol=solveFor(c.f,Iin4);
    const V=[],M=[];
    res.stations.forEach(x=>{const e=evalVM(x,sol.R,c.f);V.push(e.V);M.push(e.M);});
    const pk=(arr,sgn)=>{let bi=0;for(let i=1;i<arr.length;i++)if(sgn*arr[i]>sgn*arr[bi])bi=i;return{v:arr[bi],x:res.stations[bi]};};
    const absPk=arr=>{let bi=0;for(let i=1;i<arr.length;i++)if(Math.abs(arr[i])>Math.abs(arr[bi]))bi=i;return{v:arr[bi],x:res.stations[bi]};};
    /* zero-shear & inflection (linear between stations) */
    const zV=[],inf=[];
    for(let i=0;i<V.length-1;i++){
      if(V[i]*V[i+1]<0){const dx=res.stations[i+1]-res.stations[i];
        zV.push(res.stations[i]-V[i]*dx/(V[i+1]-V[i]));}
    }
    for(let i=0;i<M.length-1;i++){
      if(M[i]*M[i+1]<0){const dx=res.stations[i+1]-res.stations[i];
        const xi=res.stations[i]-M[i]*dx/(M[i+1]-M[i]);
        if(xi>res.L*.003&&xi<res.L*.997)inf.push(xi);}
    }
    /* negative-moment regions (bottom-flange compression) */
    const negR=[];let open=null;
    for(let i=0;i<M.length;i++){
      const neg=M[i]<-1e-6;
      if(neg&&open==null)open=res.stations[i];
      if(!neg&&open!=null){negR.push([open,res.stations[i]]);open=null;}
    }
    if(open!=null)negR.push([open,res.L]);
    /* equilibrium check ΣR = ΣF↓ */
    let tF=0;
    S.loads.forEach(ld=>{
      if(ld.off||ld.type==='moment')return;const fk=c.f[ld.lc]||0;if(!fk)return;
      if(ld.allSpans&&ld.type==='uniform'){tF+=ld.mag*fk*res.L;return;}
      const spL=S.geom.spans[Math.min(ld.si||0,S.geom.spans.length-1)].L;
      if(ld.type==='point')tF+=ld.mag*fk;
      else if(ld.type==='uniform')tF+=ld.mag*fk*spL;
      else tF+=((ld.sm+ld.em)/2)*fk*((ld.ex||spL)-(ld.sx||0));
    });
    const tR=sol.R.reduce((s,r)=>s+r.v,0);
    res.combos.push({id:c.id,name:comboName(c.f),f:c.f,R:sol.R,V,M,
      Vmax:pk(V,1),Vmin:pk(V,-1),Vabs:absPk(V),Mmax:pk(M,1),Mmin:pk(M,-1),Mabs:absPk(M),
      zV:dedupe(zV),inf:dedupe(inf),negR,sumF:tF,sumR:tR,
      sig:JSON.stringify(S.cases.map(cs=>[cs.id,c.f[cs.id]||0]))});
  });
  /* ---- envelope across strength combos ---- */
  if(res.combos.length){
    const E2={Vmx:[],Vmn:[],Mmx:[],Mmn:[],VmxC:[],VmnC:[],MmxC:[],MmnC:[]};
    res.stations.forEach((x,i)=>{
      let vmx=-1e18,vmn=1e18,mmx=-1e18,mmn=1e18,a='',b='',c2='',d='';
      res.combos.forEach(cb=>{
        if(cb.V[i]>vmx){vmx=cb.V[i];a=cb.id}if(cb.V[i]<vmn){vmn=cb.V[i];b=cb.id}
        if(cb.M[i]>mmx){mmx=cb.M[i];c2=cb.id}if(cb.M[i]<mmn){mmn=cb.M[i];d=cb.id}
      });
      E2.Vmx.push(vmx);E2.Vmn.push(vmn);E2.Mmx.push(mmx);E2.Mmn.push(mmn);
      E2.VmxC.push(a);E2.VmnC.push(b);E2.MmxC.push(c2);E2.MmnC.push(d);
    });
    E2.R=S.geom.nodes.map((nd2,j)=>{
      let mx=-1e18,mn=1e18,mxC='',mnC='',mm=0,mmC='';
      res.combos.forEach(cb=>{
        if(cb.R[j].v>mx){mx=cb.R[j].v;mxC=cb.id}
        if(cb.R[j].v<mn){mn=cb.R[j].v;mnC=cb.id}
        if(Math.abs(cb.R[j].m)>Math.abs(mm)){mm=cb.R[j].m;mmC=cb.id}
      });
      return{mx,mn,mxC,mnC,mm,mmC};
    });
    res.env=E2;
  }
  /* ---- service combinations: deflection ---- */
  res.svc=[];
  S.svc.filter(c=>c.on!==false).forEach(c=>{
    const sol=solveFor(c.f,Iin4);
    const dc=deflCurve(sol.R,c.f,Iin4);
    const perSpan=[];
    if(dc){
      S.geom.spans.forEach((sp,i)=>{
        const xa=res.nX[i],xb=res.nX[i+1];
        let dm=0,dx=xa;
        dc.xs.forEach((x,k)=>{if(x>=xa-1e-9&&x<=xb+1e-9&&Math.abs(dc.d[k])>Math.abs(dm)){dm=dc.d[k];dx=x;}});
        const lim=c.den>0?sp.L/c.den:null;   /* ft — per-span length (defect fix) */
        perSpan.push({span:i,dmax:dm,x:dx,lim,ratio:lim?Math.abs(dm)/lim:null,
          pass:lim?Math.abs(dm)<=lim*1.0001:null});
      });
    }
    res.svc.push({id:c.id,name:comboName(c.f),f:c.f,den:c.den,R:sol.R,defl:dc,perSpan});
  });
  /* ---- bracing advisory ---- */
  res.bracingNotes=[];
  const anyNeg=res.combos.some(cb=>cb.negR.length);
  if(anyNeg&&S.bracing.LbBot==null){
    const longest=Math.max(...S.geom.spans.map(sp=>sp.L));
    res.bracingNotes.push('Negative moment exists under at least one strength combination but no bottom-flange unbraced length is entered. Stage-2 flexure checks will default L_b,bot to the longest span ('+fmt(longest)+' ft) — the distance between supports — because an inflection point is NOT a brace point (AISC 360-16 Commentary App. 6).');
  }
  if(S.bracing.topCont){
    res.combos.forEach(cb=>{
      const allNeg=cb.M.every(m=>m<1e-6)&&cb.M.some(m=>m<-1e-6);
      if(allNeg)res.bracingNotes.push('Combination '+cb.name+' produces negative moment over the full length (net uplift / reversal): the continuously braced TOP flange does not brace the compression (bottom) flange. Stage-2 checks will treat this combination as unbraced between supports.');
    });
  }
  if(res.combos&&res.combos.length){try{designAll(res);}catch(e){res.designError=''+(e&&e.message?e.message:e);}}
  AN=res;return res;
}

/* =====================================================================
   AISC 360-16 CAPACITY LIBRARY (Stage 2/3)
   Pure functions. Internal units: kip, in, ksi, kip·in.
   Every function returns ALL candidate limit states, never just the min.
   ===================================================================== */
const SQ=Math.sqrt,PI=Math.PI;
function sectionFor(fam,label,gradeId){
  const keep={f:S.section.family,l:S.section.label,g:S.section.grade,o:S.section.ovr};
  S.section={family:fam,label:label,grade:gradeId,ovr:{}};
  const p=resolveSection();
  S.section={family:keep.f,label:keep.l,grade:keep.g,ovr:keep.o};
  return p;
}
/* ---------- Table B4.1b classification (flexure) ---------- */
function classifyFlex(p){
  const Fy=p.mat.Fy,E=EKSI,rt=SQ(E/Fy);
  const mk=(lam,lp,lr,cs)=>({lam,lp,lr,case:cs,cls:lam<=lp?'compact':lam<=lr?'noncompact':'slender'});
  if(p._kind==='I'||p._kind==='C'){
    const lamF=(p._kind==='I')?p.bf/(2*p.tf):p.bf/p.tf;
    return{flange:mk(lamF,0.38*rt,1.0*rt,'10'),web:mk(p.htw,3.76*rt,5.70*rt,'15')};
  }
  if(p._kind==='R'){
    return{x:{flange:mk(p.btdes,1.12*rt,1.40*rt,'17'),web:mk(p.htdes,2.42*rt,5.70*rt,'19')},
           y:{flange:mk(p.htdes,1.12*rt,1.40*rt,'17'),web:mk(p.btdes,2.42*rt,5.70*rt,'19')}};
  }
  /* round */
  const c=mk(p.Dt,0.07*E/Fy,0.31*E/Fy,'20');c.max=0.45*E/Fy;return{wall:c};
}
/* ---------- Table B4.1a classification (compression) ---------- */
function classifyComp(p){
  const Fy=p.mat.Fy,E=EKSI,rt=SQ(E/Fy);
  const mk=(lam,lr,cs)=>({lam,lr,case:cs,cls:lam<=lr?'nonslender':'slender'});
  if(p._kind==='I'||p._kind==='C'){
    const lamF=(p._kind==='I')?p.bf/(2*p.tf):p.bf/p.tf;
    return{flange:mk(lamF,0.56*rt,'1'),web:mk(p.htw,1.49*rt,'5')};
  }
  if(p._kind==='R')return{wallB:mk(p.btdes,1.40*rt,'6'),wallH:mk(p.htdes,1.40*rt,'6')};
  return{wall:mk(p.Dt,0.11*EKSI/Fy,'9')};
}
/* ---------- F2–F5: I-shapes & channels, major axis ---------- */
function flexMajorIC(p,Lb,Cb){
  const Fy=p.mat.Fy,E=EKSI,cls=classifyFlex(p);
  const Mp=Fy*p.Zx,My=Fy*p.Sx;
  const c=(p._kind==='C')?(p.ho/2)*SQ(p.Iy/p.Cw):1.0;
  const out={phi:0.9,ls:[],cls,Mp,route:'',c,Lb,Cb,blocked:null};
  const wc=cls.web.cls,fc=cls.flange.cls;
  if(p._kind==='C'&&(fc!=='compact'||wc!=='compact')){
    out.blocked='Channel with noncompact/slender elements is outside this tool (AISC F2 covers compact channels only). All rolled C/MC at Fy \u2264 50 ksi are compact; check overrides.';
    return out;
  }
  const push=(name,clause,Mn,applies,note,d)=>out.ls.push({name,clause,Mn,applies,note,d:d||{}});
  const ltbF2=(MpEff)=>{ /* F2.2, also reused by F3 */
    const rts=p.rts,ho=p.ho,Sx=p.Sx;
    const Lp=1.76*p.ry*SQ(E/Fy);
    const JcSh=p.J*c/(Sx*ho);
    const Lr=1.95*rts*(E/(0.7*Fy))*SQ(JcSh+SQ(JcSh*JcSh+6.76*Math.pow(0.7*Fy/E,2)));
    let Mn,reg,Fcr=null;
    if(Lb<=Lp){Mn=MpEff;reg='Lb \u2264 Lp';}
    else if(Lb<=Lr){
      Mn=Math.min(MpEff,Cb*(MpEff-(MpEff-0.7*Fy*Sx)*(Lb-Lp)/(Lr-Lp)));reg='Lp < Lb \u2264 Lr (F2-2)';
    }else{
      Fcr=Cb*PI*PI*E/Math.pow(Lb/rts,2)*SQ(1+0.078*JcSh*Math.pow(Lb/rts,2));
      Mn=Math.min(MpEff,Fcr*Sx);reg='Lb > Lr (F2-3/4)';
    }
    return{Mn,Lp,Lr,reg,Fcr,JcSh};
  };
  if(wc==='compact'&&fc==='compact'){
    out.route='F2';
    push('Yielding','F2.1 (F2-1)',Mp,true,'M_p = F_yZ_x');
    if(Lb>0){const L2=ltbF2(Mp);push('Lateral-torsional buckling','F2.2',L2.Mn,true,L2.reg,L2);}
    else push('Lateral-torsional buckling','F2.2',Infinity,false,'continuously braced \u2014 N/A');
  }else if(wc==='compact'){
    out.route='F3';
    push('Yielding (reference)','F2-1',Mp,false,'FLB and LTB govern in F3');
    if(Lb>0){const L2=ltbF2(Mp);push('Lateral-torsional buckling','F3.1 \u2192 F2.2',L2.Mn,true,L2.reg,L2);}
    else push('Lateral-torsional buckling','F3.1',Infinity,false,'continuously braced \u2014 N/A');
    const lam=cls.flange.lam,lp=cls.flange.lp,lr=cls.flange.lr;
    if(fc==='noncompact'){
      const Mn=Mp-(Mp-0.7*Fy*p.Sx)*(lam-lp)/(lr-lp);
      push('Compression flange local buckling','F3.2 (F3-1)',Mn,true,'noncompact flange',{lam,lp,lr});
    }else{
      let kc=4/SQ(p.htw);kc=Math.max(0.35,Math.min(0.76,kc));
      const Mn=0.9*E*kc*p.Sx/(lam*lam);
      push('Compression flange local buckling','F3.2 (F3-2)',Mn,true,'slender flange',{lam,kc});
    }
  }else if(wc==='noncompact'){
    out.route='F4';
    const lamW=cls.web.lam,lpw=cls.web.lp,lrw=cls.web.lr;
    const Myc=Fy*p.Sx;
    let Rpc=Mp/Myc;
    Rpc=Math.min(Mp/Myc,(Mp/Myc)-((Mp/Myc)-1)*((lamW-lpw)/(lrw-lpw)));
    const aw=Math.min(10,(p.hClear*p.tw)/(p.bf*p.tf));
    const rt2=p.bf/SQ(12*(1+aw/6));
    push('Compression flange yielding','F4.1 (F4-1)',Rpc*Myc,true,'R_pc = '+fmt(Rpc,3),{Rpc,aw});
    if(Lb>0){
      const FL=0.7*Fy,JSh=p.J/(p.Sx*p.ho);
      const Lp=1.1*rt2*SQ(E/Fy);
      const Lr=1.95*rt2*(E/FL)*SQ(JSh+SQ(JSh*JSh+6.76*Math.pow(FL/E,2)));
      let Mn,reg;
      if(Lb<=Lp){Mn=Rpc*Myc;reg='Lb \u2264 Lp';}
      else if(Lb<=Lr){Mn=Math.min(Rpc*Myc,Cb*(Rpc*Myc-(Rpc*Myc-FL*p.Sx)*(Lb-Lp)/(Lr-Lp)));reg='F4-2';}
      else{const Fcr=Cb*PI*PI*E/Math.pow(Lb/rt2,2)*SQ(1+0.078*JSh*Math.pow(Lb/rt2,2));
        Mn=Math.min(Rpc*Myc,Fcr*p.Sx);reg='F4-5';}
      push('Lateral-torsional buckling','F4.2',Mn,true,reg,{Lp,Lr,rt:rt2});
    }else push('Lateral-torsional buckling','F4.2',Infinity,false,'continuously braced \u2014 N/A');
    const lam=cls.flange.lam,lp=cls.flange.lp,lr=cls.flange.lr;
    if(fc==='noncompact')push('Compression flange local buckling','F4.3 (F4-13)',
      Rpc*Myc-(Rpc*Myc-0.7*Fy*p.Sx)*(lam-lp)/(lr-lp),true,'noncompact flange');
    else if(fc==='slender'){let kc=Math.max(0.35,Math.min(0.76,4/SQ(p.htw)));
      push('Compression flange local buckling','F4.3 (F4-14)',0.9*E*kc*p.Sx/(lam*lam),true,'slender flange',{kc});}
  }else{
    out.route='F5';
    const aw=Math.min(10,(p.hClear*p.tw)/(p.bf*p.tf));
    const Rpg=Math.min(1,1-aw/(1200+300*aw)*(p.htw-5.7*SQ(E/Fy)));
    const rt2=p.bf/SQ(12*(1+aw/6));
    push('Compression flange yielding','F5.1 (F5-1)',Rpg*Fy*p.Sx,true,'R_pg = '+fmt(Rpg,3),{Rpg,aw});
    if(Lb>0){
      const Lp=1.1*rt2*SQ(E/Fy),Lr=PI*rt2*SQ(E/(0.7*Fy));
      let Fcr,reg;
      if(Lb<=Lp){Fcr=Fy;reg='Lb \u2264 Lp';}
      else if(Lb<=Lr){Fcr=Math.min(Fy,Cb*(Fy-0.3*Fy*(Lb-Lp)/(Lr-Lp)));reg='F5-3';}
      else{Fcr=Math.min(Fy,Cb*PI*PI*E/Math.pow(Lb/rt2,2));reg='F5-4';}
      push('Lateral-torsional buckling','F5.2',Rpg*Fcr*p.Sx,true,reg,{Lp,Lr,Fcr,rt:rt2});
    }else push('Lateral-torsional buckling','F5.2',Infinity,false,'continuously braced \u2014 N/A');
    const lam=cls.flange.lam,lp=cls.flange.lp,lr=cls.flange.lr;
    let Fcr2=Fy;
    if(fc==='noncompact')Fcr2=Fy-0.3*Fy*(lam-lp)/(lr-lp);
    else if(fc==='slender'){const kc=Math.max(0.35,Math.min(0.76,4/SQ(p.htw)));Fcr2=0.9*E*kc/(lam*lam);}
    push('Compression flange local buckling','F5.3',Rpg*Fcr2*p.Sx,fc!=='compact',fc+' flange');
  }
  finishFlex(out);return out;
}
/* ---------- F6: I & C minor axis ---------- */
function flexMinorIC(p){
  const Fy=p.mat.Fy,E=EKSI,cls=classifyFlex(p);
  const Mp=Math.min(Fy*p.Zy,1.6*Fy*p.Sy);
  const out={phi:0.9,ls:[],Mp,route:'F6',cls};
  out.ls.push({name:'Yielding',clause:'F6.1 (F6-1)',Mn:Mp,applies:true,
    note:'M_p = F_yZ_y \u2264 1.6F_yS_y'+(Fy*p.Zy>1.6*Fy*p.Sy?' \u2014 1.6F_yS_y cap governs':'')});
  const f=cls.flange;
  if(f.cls==='noncompact')out.ls.push({name:'Flange local buckling',clause:'F6.2 (F6-2)',
    Mn:Mp-(Mp-0.7*Fy*p.Sy)*(f.lam-f.lp)/(f.lr-f.lp),applies:true,note:'noncompact flange'});
  else if(f.cls==='slender'){const Fcr=0.69*E/(f.lam*f.lam);
    out.ls.push({name:'Flange local buckling',clause:'F6.3 (F6-3/4)',Mn:Fcr*p.Sy,applies:true,note:'F_cr = 0.69E/\u03BB\u00B2 = '+fmt(Fcr,1)+' ksi'});}
  else out.ls.push({name:'Flange local buckling',clause:'F6.2',Mn:Infinity,applies:false,note:'compact flange \u2014 N/A'});
  finishFlex(out);return out;
}
/* ---------- F7: rectangular HSS (axis 'x' or 'y') ---------- */
function seSlenderRect(p,axis){
  /* effective section modulus with be removed from compression flange (F7-4) */
  const Fy=p.mat.Fy,E=EKSI,t=p.tdes;
  const H=axis==='x'?p.Ht:p.B, bF=axis==='x'?p.bFlat:p.hFlat, bt=bF/t;
  const be=Math.min(bF,1.92*t*SQ(E/Fy)*(1-0.38/bt*SQ(E/Fy)));
  const dA=(bF-be)*t, yE=(H-t)/2, A2=p.A-dA;
  const ybar=(-dA*yE)/A2;
  const I0=axis==='x'?p.Ix:p.Iy;
  const I2=I0-dA*yE*yE-A2*ybar*ybar+0; /* remove strip about old NA, transfer to new */
  const Ieff=I0-dA*yE*yE;               /* about old centroid */
  const Icg=Ieff-A2*ybar*ybar;
  const ccomp=H/2-ybar;                 /* ybar negative → ccomp > H/2 */
  return{be,dA,ybar,Icg,ccomp,Se:Icg/ccomp};
}
function flexRectHSS(p,axis,Lb,Cb){
  const Fy=p.mat.Fy,E=EKSI,cls=classifyFlex(p)[axis];
  const Z=axis==='x'?p.Zx:p.Zy,Ssec=axis==='x'?p.Sx:p.Sy;
  const Mp=Fy*Z;
  const out={phi:0.9,ls:[],cls,Mp,route:'F7 ('+axis+')',Lb,Cb,blocked:null};
  const push=(name,clause,Mn,applies,note,d)=>out.ls.push({name,clause,Mn,applies,note,d:d||{}});
  push('Yielding','F7.1 (F7-1)',Mp,true,'M_p = F_yZ');
  const f=cls.flange;
  if(f.cls==='noncompact')push('Flange local buckling','F7.2 (F7-2)',
    Math.min(Mp,Mp-(Mp-Fy*Ssec)*(3.57*f.lam*SQ(Fy/E)-4.0)),true,'noncompact flange',{lam:f.lam});
  else if(f.cls==='slender'){const se=seSlenderRect(p,axis);
    push('Flange local buckling','F7.2 (F7-3/4)',Fy*se.Se,true,'slender flange \u2014 S_e = '+fmt(se.Se,2)+' in\u00B3 (b_e = '+fmt(se.be,2)+' in)',se);}
  else push('Flange local buckling','F7.2',Infinity,false,'compact flange \u2014 N/A');
  const w=cls.web;
  if(w.cls==='noncompact')push('Web local buckling','F7.3 (F7-6)',
    Math.min(Mp,Mp-(Mp-Fy*Ssec)*(0.305*w.lam*SQ(Fy/E)-0.738)),true,'noncompact web',{lam:w.lam});
  else if(w.cls==='slender'){out.blocked='Rect HSS with slender web in flexure is outside this tool (F7.3(c)); no catalog shape reaches this \u2014 check overrides.';}
  else push('Web local buckling','F7.3',Infinity,false,'compact web \u2014 N/A');
  if(axis==='x'&&Lb>0){
    const ry=p.ry,JA=SQ(p.J*p.A);
    const Lp=0.13*E*ry*JA/Mp,Lr=2*E*ry*JA/(0.7*Fy*(axis==='x'?p.Sx:p.Sy));
    let Mn,reg;
    if(Lb<=Lp){Mn=Infinity;reg='Lb \u2264 Lp \u2014 N/A';push('Lateral-torsional buckling','F7.4',Infinity,false,reg,{Lp,Lr});}
    else if(Lb<=Lr){Mn=Math.min(Mp,Cb*(Mp-(Mp-0.7*Fy*p.Sx)*(Lb-Lp)/(Lr-Lp)));
      push('Lateral-torsional buckling','F7.4 (F7-10)',Mn,true,'Lp < Lb \u2264 Lr',{Lp,Lr});}
    else{Mn=Math.min(Mp,2*E*Cb*JA/(Lb/ry));
      push('Lateral-torsional buckling','F7.4 (F7-11)',Mn,true,'Lb > Lr',{Lp,Lr});}
  }else if(axis==='x')push('Lateral-torsional buckling','F7.4',Infinity,false,'continuously braced \u2014 N/A');
  finishFlex(out);return out;
}
/* ---------- F8: round HSS / pipe ---------- */
function flexRound(p){
  const Fy=p.mat.Fy,E=EKSI,cls=classifyFlex(p).wall;
  const Mp=Fy*p.Zx;
  const out={phi:0.9,ls:[],cls,Mp,route:'F8',blocked:null};
  if(cls.lam>cls.max){out.blocked='D/t = '+fmt(cls.lam,1)+' exceeds 0.45E/F_y = '+fmt(cls.max,1)+' \u2014 outside AISC F8 scope.';return out;}
  if(cls.cls==='compact')out.ls.push({name:'Yielding',clause:'F8.1 (F8-1)',Mn:Mp,applies:true,note:'compact: D/t \u2264 0.07E/F_y'});
  else if(cls.cls==='noncompact'){
    out.ls.push({name:'Yielding (reference)',clause:'F8-1',Mn:Mp,applies:false,note:''});
    out.ls.push({name:'Local buckling',clause:'F8.2 (F8-2)',Mn:(0.021*E/cls.lam+Fy)*p.Sx,applies:true,note:'noncompact wall'});
  }else{
    const Fcr=0.33*E/cls.lam;
    out.ls.push({name:'Yielding (reference)',clause:'F8-1',Mn:Mp,applies:false,note:''});
    out.ls.push({name:'Local buckling',clause:'F8.3 (F8-3/4)',Mn:Fcr*p.Sx,applies:true,note:'slender wall, F_cr = '+fmt(Fcr,1)+' ksi'});
  }
  finishFlex(out);return out;
}
function finishFlex(o){
  if(o.blocked){o.Mn=0;o.gov=null;return;}
  const app=o.ls.filter(l=>l.applies);
  o.gov=app.reduce((m,l)=>l.Mn<m.Mn?l:m,app[0]||{Mn:o.Mp,name:'Yielding'});
  o.Mn=o.gov?o.gov.Mn:o.Mp;
  o.phiMn=o.phi*o.Mn;
}
function flexFor(p,axis,Lb,Cb){
  if(p._kind==='I'||p._kind==='C')return axis==='x'?flexMajorIC(p,Lb,Cb):flexMinorIC(p);
  if(p._kind==='R')return flexRectHSS(p,axis,Lb,Cb);
  return flexRound(p);
}
/* ---------- Chapter G shear ---------- */
function cv2Of(lam,kv,Fy){
  const E=EKSI,a=1.10*SQ(kv*E/Fy),b=1.37*SQ(kv*E/Fy);
  if(lam<=a)return{Cv2:1,reg:'G2-9'};
  if(lam<=b)return{Cv2:a/lam,reg:'G2-10'};
  return{Cv2:1.51*kv*E/(lam*lam*Fy),reg:'G2-11'};
}
function shearMajor(p,LvIn){
  const Fy=p.mat.Fy,E=EKSI;
  if(p._kind==='I'){
    const Aw=p.d*p.tw,lim=2.24*SQ(E/Fy);
    if(p.htw<=lim)return{Vn:0.6*Fy*Aw,phi:1.00,Cv:1,Aw,route:'G2.1(a)',note:'rolled I, h/t_w = '+fmt(p.htw,1)+' \u2264 2.24\u221A(E/F_y) = '+fmt(lim,1)+' \u2192 \u03C6_v = 1.00'};
    const kv=5.34,a=1.10*SQ(kv*E/Fy);
    const Cv1=p.htw<=a?1:a/p.htw;
    return{Vn:0.6*Fy*Aw*Cv1,phi:0.90,Cv:Cv1,Aw,route:'G2.1(b)',note:'C_v1 per G2-3/G2-4, k_v = 5.34'};
  }
  if(p._kind==='C'){
    const Aw=p.d*p.tw,kv=5.34,a=1.10*SQ(kv*E/Fy);
    const Cv1=p.htw<=a?1:a/p.htw;
    return{Vn:0.6*Fy*Aw*Cv1,phi:0.90,Cv:Cv1,Aw,route:'G2.1(b)',note:'channel \u2014 \u03C6_v = 0.90 (the 1.00 factor applies to rolled I-shapes only)'};
  }
  if(p._kind==='R'){
    const Aw=2*p.hFlat*p.tdes,cv=cv2Of(p.htdes,5,Fy);
    return{Vn:0.6*Fy*Aw*cv.Cv2,phi:0.90,Cv:cv.Cv2,Aw,route:'G4',note:'A_w = 2ht, h = H \u2212 3t, k_v = 5, C_v2 per '+cv.reg};
  }
  /* round G5 */
  const Lv=LvIn||1e9,Dt=p.Dt;
  const F1=1.60*E/(SQ(Lv/p.OD)*Math.pow(Dt,1.25));
  const F2c=0.78*E/Math.pow(Dt,1.5);
  const Fcr=Math.min(0.6*Fy,Math.max(F1,F2c));
  return{Vn:Fcr*p.A/2,phi:0.90,Fcr,F1,F2c,Lv,route:'G5',note:'F_cr = max(G5-2a, G5-2b) \u2264 0.6F_y = '+fmt(0.6*Fy,1)+' ksi; L_v = '+fmt(Lv/12,2)+' ft'};
}
function shearMinor(p){
  const Fy=p.mat.Fy;
  if(p._kind==='I'||p._kind==='C'){
    const b=(p._kind==='I')?p.bf/2:p.bf;
    const cv=cv2Of(b/p.tf,1.2,Fy);
    const Aw=p.bf*p.tf;
    return{Vn:0.6*Fy*Aw*cv.Cv2*2,phi:0.90,Cv:cv.Cv2,Aw:2*Aw,route:'G6',note:'both flanges, k_v = 1.2, b/t_f = '+fmt(b/p.tf,1)};
  }
  if(p._kind==='R'){
    const Aw=2*p.bFlat*p.tdes,cv=cv2Of(p.btdes,5,Fy);
    return{Vn:0.6*Fy*Aw*cv.Cv2,phi:0.90,Cv:cv.Cv2,Aw,route:'G4 (weak)',note:'A_w = 2bt'};
  }
  return shearMajor(p);
}
/* ---------- Chapter E compression ---------- */
function compStrength(p,Lcx,Lcy,Lcz){
  const Fy=p.mat.Fy,E=EKSI,G2=GKSI;
  const out={phi:0.9,modes:[],blocked:null};
  if(p._kind==='C'){out.blocked='Axial compression on channels is not supported (singly symmetric flexural-torsional buckling, E4, is out of scope by design decision).';return out;}
  const fe=[];
  const sx=Lcx/p.rx,sy=Lcy/p.ry;
  fe.push({name:'Flexural buckling, x\u2013x',clause:'E3-4',Fe:PI*PI*E/(sx*sx),s:sx,L:Lcx});
  fe.push({name:'Flexural buckling, y\u2013y',clause:'E3-4',Fe:PI*PI*E/(sy*sy),s:sy,L:Lcy});
  if(p._kind==='I'&&Lcz>0){
    const Fez=(PI*PI*E*p.Cw/(Lcz*Lcz)+G2*p.J)/(p.Ix+p.Iy);
    fe.push({name:'Torsional buckling',clause:'E4-2',Fe:Fez,s:null,L:Lcz});
  }
  const govFe=fe.reduce((m,f)=>f.Fe<m.Fe?f:m,fe[0]);
  const Fcr=(Fy/govFe.Fe<=2.25)?Math.pow(0.658,Fy/govFe.Fe)*Fy:0.877*govFe.Fe;
  out.modes=fe;out.govFe=govFe;out.Fcr=Fcr;
  out.slMax=Math.max(sx,sy);
  /* E7 slender elements → effective area */
  const cc=classifyComp(p);out.clsC=cc;
  let Ae=p.A,eff=[];
  const beOf=(b,t,lam,lr,c1,c2)=>{
    const thr=lr*SQ(Fy/Fcr);
    if(lam<=thr)return{be:b,b,red:0,lam,thr,lr};
    const Fel=Math.pow(c2*lr/lam,2)*Fy;
    const be=Math.min(b,b*(1-c1*SQ(Fel/Fcr))*SQ(Fel/Fcr));
    return{be,b,red:(b-be)*t,Fel,lam,thr,lr,c1,c2};
  };
  if(p._kind==='I'){
    if(cc.flange.cls==='slender'){const r=beOf(p.bf/2,p.tf,cc.flange.lam,cc.flange.lr,0.22,1.49);
      Ae-=4*r.red;eff.push({el:'flanges (4 half-widths)',...r});}
    if(cc.web.cls==='slender'){const r=beOf(p.hClear,p.tw,cc.web.lam,cc.web.lr,0.22,1.49);
      Ae-=r.red;eff.push({el:'web',...r});}
  }else if(p._kind==='R'){
    if(cc.wallB.cls==='slender'){const r=beOf(p.bFlat,p.tdes,cc.wallB.lam,cc.wallB.lr,0.20,1.38);
      Ae-=2*r.red;eff.push({el:'walls b (\u00D72)',...r});}
    if(cc.wallH.cls==='slender'){const r=beOf(p.hFlat,p.tdes,cc.wallH.lam,cc.wallH.lr,0.20,1.38);
      Ae-=2*r.red;eff.push({el:'walls h (\u00D72)',...r});}
  }else{ /* round E7.2 */
    if(cc.wall.cls==='slender'){
      if(p.Dt>0.45*E/Fy){out.blocked='Round section D/t exceeds 0.45E/F_y \u2014 outside E7.2.';return out;}
      Ae=(0.038*E/(Fy*p.Dt)+2/3)*p.A;
      eff.push({el:'round wall (\u00A7E7.2)',be:null,b:null,lam:cc.wall.lam,thr:null,red:p.A-Ae});
    }
  }
  out.Ae=Ae;out.eff=eff;
  out.Pn=Fcr*Ae;out.phiPn=0.9*out.Pn;
  return out;
}
/* ---------- H3 torsion (HSS only) ---------- */
function torsionHSS(p,Lin){
  const Fy=p.mat.Fy,E=EKSI;
  const out={phi:0.9,C:p.Cc,blocked:null};
  if(p._kind==='R'){
    const ht=p.htdes,a=2.45*SQ(E/Fy),b=3.07*SQ(E/Fy);
    if(ht<=a){out.Fcr=0.6*Fy;out.clause='H3-3';}
    else if(ht<=b){out.Fcr=0.6*Fy*a/ht;out.clause='H3-4';}
    else if(ht<=260){out.Fcr=0.458*PI*PI*E/(ht*ht);out.clause='H3-5';}
    else{out.blocked='h/t > 260 \u2014 outside H3.1(b).';return out;}
  }else if(p._kind==='P'){
    const F1=1.23*E/(SQ(Lin/p.OD)*Math.pow(p.Dt,1.25));
    const F2c=0.60*E/Math.pow(p.Dt,1.5);
    out.Fcr=Math.min(0.6*Fy,Math.max(F1,F2c));out.clause='H3-2a/b';
  }else{out.blocked='Torsion on an open section (I-shape or channel) is governed by \u00A7H3.3, which requires the normal and shear stresses from a warping-torsion analysis (AISC Design Guide 9) \u2014 outside the scope of this tool. Check the axial, flexural and shear stresses independently per \u00A7H3.3, or use an HSS, for which \u00A7H3.1/H3.2 is implemented here.';return out;}
  out.Tn=out.Fcr*p.Cc;out.phiTn=0.9*out.Tn;
  return out;
}
/* ---------- J10 concentrated forces (I & C) ---------- */
function j10WLY(p,lbIn,endDistIn){
  const Fy=p.mat.Fy,k=p.kdes,atEnd=endDistIn<=p.d;
  const Rn=Fy*p.tw*((atEnd?2.5:5)*k+lbIn);
  return{Rn,phi:1.00,atEnd,clause:atEnd?'J10-3':'J10-2',k};
}
function j10WLC(p,lbIn,endDistIn){
  const Fy=p.mat.Fy,E=EKSI,d=p.d,tw=p.tw,tf=p.tf;
  const root=SQ(E*Fy*tf/tw),ratio=Math.pow(tw/tf,1.5);
  const atEnd=endDistIn<d/2;
  let Rn,clause;
  if(!atEnd){Rn=0.80*tw*tw*(1+3*(lbIn/d)*ratio)*root;clause='J10-4';}
  else if(lbIn/d<=0.2){Rn=0.40*tw*tw*(1+3*(lbIn/d)*ratio)*root;clause='J10-5a';}
  else{Rn=0.40*tw*tw*(1+(4*lbIn/d-0.2)*ratio)*root;clause='J10-5b';}
  return{Rn,phi:0.75,atEnd,clause};
}
/* =====================================================================
   DESIGN ORCHESTRATION — regions, Cb, per-combination checks
   ===================================================================== */
function longestSpan(){return Math.max(...S.geom.spans.map(sp=>sp.L));}
function effLbTop(){return S.bracing.topCont?0:(S.bracing.LbTop!=null?S.bracing.LbTop:longestSpan());}
function effLbBot(){return S.bracing.LbBot!=null?S.bracing.LbBot:longestSpan();}
function manOf(id){const m=(S.design&&S.design.man&&S.design.man[id])||{};
  return{Pu:m.Pu||0,Muy:m.Muy||0,Vuy:m.Vuy||0,Tu:m.Tu||0};}
/* moment-sign regions for one analysis combo */
function flexRegions(cb,A){
  const xs=A.stations,M=cb.M,L=A.L,tol=Math.max(1e-6,1e-4*Math.max(...M.map(Math.abs),1e-9));
  const regs=[];let cur=null;
  for(let i=0;i<xs.length;i++){
    const s=M[i]>tol?1:M[i]<-tol?-1:0;
    if(s!==0){
      if(!cur||cur.sign!==s){if(cur)regs.push(cur);cur={x1:xs[i],x2:xs[i],sign:s};}
      else cur.x2=xs[i];
    }else if(cur){cur.x2=xs[i];}
  }
  if(cur)regs.push(cur);
  if(!regs.length)regs.push({x1:0,x2:L,sign:1});
  /* extend adjacent regions to meet at the inflection point midway */
  for(let i=0;i<regs.length-1;i++){const mid=(regs[i].x2+regs[i+1].x1)/2;regs[i].x2=mid;regs[i+1].x1=mid;}
  regs[0].x1=0;regs[regs.length-1].x2=L;
  return regs.filter(r=>r.x2-r.x1>1e-6);
}
function sampleMabs(cb,x1,x2,n,extra){
  let mx=0,at=x1;
  const test=x=>{const m=Math.abs(evalVM(x,cb.R,cb.f).M);if(m>mx){mx=m;at=x;}};
  for(let i=0;i<=n;i++)test(x1+(x2-x1)*i/n);
  /* an even sweep can step over a peak that sits exactly at a V = 0 station
     or a load point, so test those explicitly as well */
  if(extra)extra.forEach(x=>{if(x>=x1-1e-9&&x<=x2+1e-9)test(x);});
  return{M:mx,x:at};
}
function cbQuarter(cb,x1,x2,extra){
  const Lw=x2-x1;
  const Mmax=sampleMabs(cb,x1,x2,40,extra).M;
  const MA=Math.abs(evalVM(x1+0.25*Lw,cb.R,cb.f).M);
  const MB=Math.abs(evalVM(x1+0.50*Lw,cb.R,cb.f).M);
  const MC=Math.abs(evalVM(x1+0.75*Lw,cb.R,cb.f).M);
  const Cb=Mmax>1e-9?12.5*Mmax/(2.5*Mmax+3*MA+4*MB+3*MC):1;
  return{Cb,Mmax,MA,MB,MC};
}
function touchesFreeEnd(x1,x2,A){
  const n0=S.geom.nodes[0],nN=S.geom.nodes[S.geom.nodes.length-1];
  return(n0.t==='free'&&x1<1e-6)||(nN.t==='free'&&x2>A.L-1e-6);
}
/* evaluate one region for one combo → worst-window DCR */
function regionCheck(cb,reg,A,p){
  const flange=reg.sign>0?'top':'bottom';
  const LbFt=flange==='top'?effLbTop():effLbBot();
  const Lb=LbFt*12;
  const mode=(S.design&&S.design.CbMode)||'unity';
  const regLen=reg.x2-reg.x1;
  const out={x1:reg.x1,x2:reg.x2,sign:reg.sign,flange,LbFt,mode};
  const crit=(cb.zV||[]).concat(A&&A.stations?A.stations:[]);
  const dem=sampleMabs(cb,reg.x1,reg.x2,60,crit);
  out.Mu=dem.M/1;out.xMu=dem.x;   /* kip·ft */
  if(mode==='unity'||Lb<=0){
    out.Cb=1;
    const cap=flexFor(p,'x',Lb,1);
    out.cap=cap;out.phiMn=cap.blocked?0:cap.phiMn/12;
    out.dcr=cap.blocked?Infinity:(out.Mu/(out.phiMn||1e-9));
    if(cap.blocked)out.blocked=cap.blocked;
    return out;
  }
  /* calculated Cb: worst window of physical length Lb within the region */
  const wLen=Math.min(regLen,LbFt);
  const steps=(regLen-wLen>1e-6)?16:0;
  let worst=null;
  for(let k2=0;k2<=steps;k2++){
    const a=reg.x1+(steps?(regLen-wLen)*k2/steps:0),b=a+wLen;
    const q=cbQuarter(cb,a,b,crit);
    let Cb=touchesFreeEnd(a,b,A)?1:q.Cb;
    const cap=flexFor(p,'x',Lb,Cb);
    const phiMn=cap.blocked?1e-9:cap.phiMn/12;
    const dcr=q.Mmax/phiMn;
    if(!worst||dcr>worst.dcr)worst={a,b,q,Cb,cap,phiMn,dcr};
  }
  out.Cb=worst.Cb;out.win=worst;out.cap=worst.cap;
  out.phiMn=worst.phiMn;out.Mu=worst.q.Mmax;out.dcr=worst.dcr;
  if(worst.cap.blocked)out.blocked=worst.cap.blocked;
  return out;
}
/* ---------- master design pass ---------- */
let DZ=null;
function designAll(A){
  const p=A.sect;DZ=null;
  if(!p||!A.combos||!A.combos.length)return;
  const D={p,warns:[],perCombo:[],checks:[]};
  D.clsF=classifyFlex(p);D.clsC=classifyComp(p);
  D.LbTop=effLbTop();D.LbBot=effLbBot();
  D.LbTopDefaulted=!S.bracing.topCont&&S.bracing.LbTop==null;
  D.LbBotDefaulted=S.bracing.LbBot==null;
  /* member capacities for display (Cb = 1 reference) */
  D.capTop=flexFor(p,'x',D.LbTop*12,1);
  D.capBot=flexFor(p,'x',D.LbBot*12,1);
  const anyMuy=A.combos.some(cb=>manOf(cb.id).Muy!==0);
  const anyPu=A.combos.some(cb=>manOf(cb.id).Pu>0);
  const anyVuy=A.combos.some(cb=>manOf(cb.id).Vuy!==0);
  const anyTu=A.combos.some(cb=>manOf(cb.id).Tu!==0);
  D.flexY=(anyMuy||true)?flexFor(p,'y',0,1):null;
  D.shearX=(p._kind==='P')?null:shearMajor(p,null,S.design.stiff);           /* round is per-combo (Lv) */
  D.shearY=shearMinor(p);
  const dsn=S.design||{};
  const Ltot=totalL();
  D.Lcx=(dsn.Lcx!=null?dsn.Lcx:Ltot)*(dsn.Kx||1)*12;
  D.Lcy=(dsn.Lcy!=null?dsn.Lcy:(D.LbTop||longestSpan()))*(dsn.Ky||1)*12;
  D.Lcz=(dsn.Lcz!=null?dsn.Lcz:(D.LbTop||longestSpan()))*(dsn.Kz||1)*12;
  D.comp=(D.Lcx>0&&D.Lcy>0)?compStrength(p,D.Lcx,D.Lcy,D.Lcz):null;
  D.tors=torsionHSS(p,Ltot*12);
  D.torOpen=(typeof openTorsionFor==='function')?openTorsionFor(A):null;
  if(typeof compositeFor==='function'){try{A.comp=compositeFor(A);}catch(e){A.comp={blocked:'Composite engine error: '+e.message};}}
  if(A.comp&&!A.comp.blocked&&typeof constructionStage==='function'){
    try{A.constr=constructionStage(A.sect,A.comp);}catch(e){A.constr={blocked:'Construction stage error: '+e.message};}
  }else A.constr=null;
  /* J10 locations (I & C only) */
  D.j10=null;
  if(p._kind==='I'||p._kind==='C'){
    const locs=[];
    const nX=nodeXs();
    S.geom.nodes.forEach((nd2,j)=>{if(nd2.t!=='free')locs.push({kind:'support',label:'support '+NN[j],x:nX[j],node:j,lb:dsn.lbSup});});
    S.loads.forEach(ld=>{
      if(ld.off||ld.type!=='point')return;
      const si=Math.min(ld.si||0,S.geom.spans.length-1);
      locs.push({kind:'load',label:'point load '+(ld.nm||''),x:nX[si]+Math.max(0,Math.min(S.geom.spans[si].L,ld.pos||0)),load:ld,lb:dsn.lbPt});
    });
    locs.forEach(lo=>{lo.endDist=Math.min(lo.x,Ltot-lo.x)*12;
      if(lo.lb!=null&&lo.lb>0){lo.wly=j10WLY(p,lo.lb,lo.endDist);lo.wlc=j10WLC(p,lo.lb,lo.endDist);}});
    D.j10={locs,lbSup:dsn.lbSup,lbPt:dsn.lbPt};
  }
  /* ---- per combination ---- */
  A.combos.forEach(cb=>{
    const man=manOf(cb.id);
    const C={id:cb.id,name:cb.name,man};
    C.regions=flexRegions(cb,A).map(r=>regionCheck(cb,r,A,p));
    C.flexGov=C.regions.reduce((m,r)=>r.dcr>(m?m.dcr:-1)?r:m,null);
    /* shear */
    if(p._kind==='P'){
      let Lv=A.L;cb.zV.forEach(z=>{Lv=Math.min(Lv,Math.abs(z-cb.Vabs.x));});
      C.shearX=shearMajor(p,Lv*12,S.design.stiff);
    }else C.shearX=D.shearX;
    C.Vu=Math.abs(cb.Vabs.v);C.VuX=cb.Vabs.x;
    C.dcrVx=C.Vu/(C.shearX.phi*C.shearX.Vn);
    if(man.Vuy&&D.shearY)C.dcrVy=Math.abs(man.Vuy)/(D.shearY.phi*D.shearY.Vn);
    /* minor flexure */
    if(man.Muy&&D.flexY){
      C.phiMny=D.flexY.blocked?0:D.flexY.phiMn/12;
      C.dcrMy=Math.abs(man.Muy)/(C.phiMny||1e-9);
    }
    /* axial */
    if(man.Pu>0){
      if(D.comp&&!D.comp.blocked){C.phiPn=D.comp.phiPn;C.dcrP=man.Pu/C.phiPn;}
      else C.compBlocked=(D.comp&&D.comp.blocked)||'no compression capacity';
    }
    /* torsion */
    if(D.torOpen&&!D.torOpen.blocked)
      C.h33=h33Check(p,D.torOpen,{Pu:man.Pu||0,Mux:C.flexGov?C.flexGov.Mu:0,Muy:man.Muy||0,
        Vux:C.Vu||0,Vuy:man.Vuy||0});
    if(man.Tu&&D.tors){
      if(D.tors.blocked)C.torsBlocked=D.tors.blocked;
      else{C.phiTn=D.tors.phiTn/12;C.dcrT=Math.abs(man.Tu)/C.phiTn;C.torsNeglect=C.dcrT<=0.20;}
    }
    /* interaction */
    const rx=C.flexGov?C.flexGov.dcr:0;
    const ry=C.dcrMy||0,rp=C.dcrP||0;
    if(C.dcrT!=null&&!C.torsNeglect){
      const vr=(C.dcrVx||0)+(C.dcrVy||0);
      C.inter={eq:'H3-6',value:(rp+rx+ry)+Math.pow(vr+C.dcrT,2),
        terms:{P:rp,Mx:rx,My:ry,V:vr,T:C.dcrT}};
    }else if(rp>=0.2){
      C.inter={eq:'H1-1a',value:rp+8/9*(rx+ry),terms:{P:rp,Mx:rx,My:ry}};
    }else{
      C.inter={eq:'H1-1b',value:rp/2+(rx+ry),terms:{P:rp,Mx:rx,My:ry}};
    }
    /* J10 demands */
    if(D.j10){
      C.j10=D.j10.locs.map(lo=>{
        let dem=null;
        if(lo.kind==='support'){const R=cb.R[lo.node].v;dem=R>0?R:null;}
        else{const fk=cb.f[lo.load.lc]||0;const P=lo.load.mag*fk;dem=P>0?P:null;}
        const r={label:lo.label,x:lo.x,dem,lb:lo.lb,endDist:lo.endDist};
        if(dem!=null&&lo.wly){r.dcrWLY=dem/(lo.wly.phi*lo.wly.Rn);r.dcrWLC=dem/(lo.wlc.phi*lo.wlc.Rn);
          r.wly=lo.wly;r.wlc=lo.wlc;}
        return r;
      });
    }
    D.perCombo.push(C);
  });
  if(typeof applyCompositeToRegions==='function')applyCompositeToRegions(A,D);
  if(typeof applyCompositeDeflection==='function')applyCompositeDeflection(A);
  buildDesignChecks(D,A);
  A.design=D;DZ=D;
}

function buildDesignChecks(D,A){
  const gv=(fn)=>D.perCombo.reduce((m,c)=>{const v=fn(c);return(v!=null&&(m==null||v.d>m.d))?v:m;},null);
  const fGov=gv(c=>c.flexGov?{d:c.flexGov.dcr,c}:null);
  if(fGov)D.checks.push({label:'Flexure M\u2093',ref:D.perCombo[0].regions[0].cap.route,dcr:fGov.d,
    dem:fGov.c.flexGov.Mu,cap:fGov.c.flexGov.phiMn,unit:'kip\u00B7ft',capSym:'\u03C6M\u2099',
    combo:fGov.c.name,na:false,tab:'tabMx',
    detail:D.member?('L_b = '+fmt(fGov.c.flexGov.LbFt,1)+' ft, C_b = '+fmt(fGov.c.flexGov.Cb,2)):
      ('region '+fmt(fGov.c.flexGov.x1,1)+'\u2013'+fmt(fGov.c.flexGov.x2,1)+' ft, '+fGov.c.flexGov.flange+' flange')});
  const vGov=gv(c=>({d:c.dcrVx,c}));
  if(vGov)D.checks.push({label:'Shear V\u2093',ref:vGov.c.shearX.route,dcr:vGov.d,combo:vGov.c.name,tab:'tabVx',
    dem:vGov.c.Vu,cap:vGov.c.shearX.phi*vGov.c.shearX.Vn,unit:'kip',capSym:'\u03C6V\u2099'});
  const myGov=gv(c=>c.dcrMy!=null?{d:c.dcrMy,c}:null);
  D.checks.push(myGov?{label:'Flexure M\u1D67',ref:D.flexY?D.flexY.route:'F6',dcr:myGov.d,combo:myGov.c.name,tab:'tabMy',
    dem:Math.abs(myGov.c.man.Muy),cap:myGov.c.phiMny,unit:'kip\u00B7ft',capSym:'\u03C6M\u2099'}:
    {label:'Flexure M\u1D67',ref:'F6/F7',na:true,detail:'no M\u1D64\u1D67 entered',tab:'tabMy'});
  const vyGov=gv(c=>c.dcrVy!=null?{d:c.dcrVy,c}:null);
  D.checks.push(vyGov?{label:'Shear V\u1D67',ref:D.shearY.route,dcr:vyGov.d,combo:vyGov.c.name,tab:'tabVy',
    dem:Math.abs(vyGov.c.man.Vuy),cap:D.shearY.phi*D.shearY.Vn,unit:'kip',capSym:'\u03C6V\u2099'}:
    {label:'Shear V\u1D67',ref:'G6/G4',na:true,detail:'no V\u1D64\u1D67 entered',tab:'tabVy'});
  const pGov=gv(c=>c.dcrP!=null?{d:c.dcrP,c}:null);
  if(pGov)D.checks.push({label:'Compression',ref:'E3/E4/E7',dcr:pGov.d,combo:pGov.c.name,tab:'tabComp',
    dem:pGov.c.man.Pu,cap:pGov.c.phiPn,unit:'kip',capSym:'\u03C6P\u2099'});
  else if(D.perCombo.some(c=>c.compBlocked))D.checks.push({label:'Compression',ref:'E4',fail:true,dcr:Infinity,detail:'blocked \u2014 see Axial tab',tab:'tabComp'});
  else D.checks.push({label:'Compression',ref:'Ch. E',na:true,detail:'no P\u1D64 entered',tab:'tabComp'});
  const hGov=gv(c=>c.h33?{d:c.h33.dcr,c}:null);
  const tGov=gv(c=>c.dcrT!=null?{d:c.dcrT,c}:null);
  if(hGov)D.checks.push({label:'Torsion (open section)',ref:'H3.3 / DG 9',dcr:hGov.d,combo:hGov.c.name,tab:'tabTors',
    dem:hGov.c.h33.dcrN>=hGov.c.h33.dcrV?hGov.c.h33.fn:hGov.c.h33.fv,
    cap:hGov.c.h33.dcrN>=hGov.c.h33.dcrV?hGov.c.h33.phiFy:hGov.c.h33.phiFv,
    unit:'ksi',capSym:hGov.c.h33.dcrN>=hGov.c.h33.dcrV?'\u03C6F\u1D67':'\u03C6(0.6F\u1D67)',
    detail:(hGov.c.h33.dcrN>=hGov.c.h33.dcrV?'normal':'shear')+' stress at z = '+fmt(hGov.c.h33.z,1)+' in'});
  else if(tGov)D.checks.push({label:'Torsion',ref:'H3',dcr:tGov.d,combo:tGov.c.name,tab:'tabTors',
    dem:Math.abs(tGov.c.man.Tu),cap:tGov.c.phiTn,unit:'kip\u00B7ft',capSym:'\u03C6T\u2099'});
  else D.checks.push({label:'Torsion',ref:(D.p._kind==='I'||D.p._kind==='C')?'H3.3 / DG 9':'H3.1',na:true,
    detail:D.perCombo.some(c=>c.man.Tu)?'T\u1D64 entered but no torsional case defined \u2014 enable open-section torsion':'no T\u1D64 entered',
    tab:'tabTors'});
  const iGov=gv(c=>({d:c.inter.value,c}));
  if(iGov)D.checks.push({label:'Interaction',ref:iGov.c.inter.eq,dcr:iGov.d,combo:iGov.c.name,tab:'tabInter',
    dem:iGov.c.inter.value,cap:1.0,unit:'\u2014',capSym:'limit'});
  if(D.j10){
    const wGov=gv(c=>{let m=null;(c.j10||[]).forEach(r=>{if(r.dcrWLY!=null&&(!m||r.dcrWLY>m.d))m={d:r.dcrWLY,c,r};});return m;});
    D.checks.push(wGov?{label:'Web local yielding',ref:'J10.2',dcr:wGov.d,combo:wGov.c.name,detail:wGov.r.label,tab:'tabJ10',
      dem:wGov.r.dem,cap:wGov.r.wly.phi*wGov.r.wly.Rn,unit:'kip',capSym:'\u03C6R\u2099'}:
      {label:'Web local yielding',ref:'J10.2',na:true,detail:'bearing length not entered',tab:'tabJ10'});
    const cGov=gv(c=>{let m=null;(c.j10||[]).forEach(r=>{if(r.dcrWLC!=null&&(!m||r.dcrWLC>m.d))m={d:r.dcrWLC,c,r};});return m;});
    D.checks.push(cGov?{label:'Web local crippling',ref:'J10.3',dcr:cGov.d,combo:cGov.c.name,detail:cGov.r.label,tab:'tabJ10',
      dem:cGov.r.dem,cap:0.75*cGov.r.wlc.Rn,unit:'kip',capSym:'\u03C6R\u2099'}:
      {label:'Web local crippling',ref:'J10.3',na:true,detail:'bearing length not entered',tab:'tabJ10'});
  }else D.checks.push({label:'Concentrated forces',ref:'J10',na:true,
    detail:(D.p._kind==='I'||D.p._kind==='C')?'bearing length / concentrated force not entered':'HSS \u2014 J10 web provisions do not apply; verify locally loaded faces separately',
    tab:'tabComp'});
  if(!D.member&&A&&A.svc&&A.svc.length){
    let w=null;
    A.svc.forEach(sc=>sc.perSpan.forEach(ps=>{
      if(ps.ratio!=null&&(!w||ps.ratio>w.ratio))w={ratio:ps.ratio,ps,sc};}));
    if(w)D.checks.push({label:'Deflection',ref:'L/'+w.sc.den,dcr:w.ratio,combo:w.sc.name,tab:'tabService',
      detail:'span '+(w.ps.span+1),dem:Math.abs(w.ps.dmax)*12,cap:w.ps.lim*12,unit:'in',capSym:'\u03B4_allow'});
    else D.checks.push({label:'Deflection',ref:'serviceability',na:true,
      detail:'no service combination carries a limit',tab:'tabService'});
  }
  if(A&&A.comp&&!A.comp.blocked&&A.constr&&!A.constr.blocked){
    const cs=A.constr;
    if(!cs.shored){
      D.checks.push({label:'Pre-composite flexure',ref:'bare steel',dcr:cs.dcrM,combo:'1.2D+1.6L construction',
        dem:cs.Mu,cap:cs.phiMn,unit:'kip\u00B7ft',capSym:'\u03C6M\u2099',tab:'tabMx'});
      D.checks.push({label:'Pre-composite deflection',ref:'DG 3',dcr:cs.dcrPre,combo:'concrete + self wt',
        dem:cs.dPreNet,cap:cs.limPre,unit:'in',capSym:'\u0394_allow',tab:'tabService',
        detail:cs.camber>0?('net of '+fmt(cs.camber,2)+' in camber'):'no camber'});
    }
    D.checks.push({label:'Composite live-load deflection',ref:'L/'+constrCfg().denLL,dcr:cs.dcrLL,combo:'service',
      dem:cs.dLL,cap:cs.limLL,unit:'in',capSym:'\u0394_allow',tab:'tabService'});
    D.checks.push({label:'Composite total deflection',ref:'L/'+constrCfg().denTot,dcr:cs.dcrTot,combo:'service',
      dem:cs.dTot,cap:cs.limTot,unit:'in',capSym:'\u0394_allow',tab:'tabService'});
  }
  const blockedRegions=D.perCombo.some(c=>c.regions.some(r=>r.blocked));
  if(blockedRegions)D.warns.push('One or more flexural routes are blocked \u2014 see the Flexure tab.');
}
