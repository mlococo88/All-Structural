function torCfg(){
  const t=S.design&&S.design.tor;
  return t&&t.on?t:null;
}
function openTorsionFor(A){
  const p=A.sect,cfg=torCfg();
  if(!cfg)return null;
  const L=cfg.L!=null?cfg.L:(isMember()?(S.member.Lb||0):totalL());
  return torsionOpen(p,{L,caseId:cfg.caseId,T:cfg.T||0,pos:cfg.pos});
}
function torsionInputs(body){
  if(!S.design.tor)S.design.tor={on:false,caseId:'conc_pp',L:null,T:null,pos:null};
  const t=S.design.tor;
  const p=AN&&AN.sect;
  const open=p&&(p._kind==='I'||p._kind==='C');
  const r=el('div','fRow');r.appendChild(el('label',null,'Open-section torsion (DG 9)'));
  const c=document.createElement('input');c.type='checkbox';c.checked=!!t.on;
  c.addEventListener('change',()=>{t.on=c.checked;rebuildInputs();schedule(false);});
  r.appendChild(c);body.appendChild(r);
  if(!t.on){
    body.appendChild(el('div','hint','For I-shapes and channels a torque magnitude alone is not enough: warping stresses depend on <b>how</b> the torque is applied and <b>how the ends are restrained against warping</b>. Enable this to state those and run the \u00A7H3.3 check.'));
    return;
  }
  if(!open){body.appendChild(el('div','warnBox','The current section is an HSS \u2014 use the closed-form \u00A7H3.1 check instead; this module is for open sections.'));return;}
  fRow(body,'Torsional case',selInput(Object.keys(TOR_CASES),()=>t.caseId,v=>{t.caseId=v;rebuildInputs();schedule(false);},
    o=>TOR_CASES[o].lab,null,'torCase'),'');
  fRow(body,'Torsional span  L',numInput(()=>t.L,v=>{t.L=v;},1,'torL'),'ft',spanHint(t.L));
  const conc=TOR_CASES[t.caseId].load==='conc';
  fRow(body,conc?'Applied torque  T':'Total applied torque  \u03A3T',numInput(()=>t.T,v=>{t.T=v;},1,'torT'),'kip\u00B7ft',
    conc?'concentrated':'distributed uniformly over L');
  if(conc&&TOR_CASES[t.caseId].ends[1]!=='free')
    fRow(body,'Torque location from left end',numInput(()=>t.pos,v=>{t.pos=v;},1,'torPos'),'ft','blank \u2192 midspan');
  body.appendChild(el('div','hint','Warping-free ("fork") supports resist twist but let the flanges warp; warping-fixed ends prevent flange warping (e.g. a heavy end plate or a boxed-in end). The difference is large \u2014 compare the cases.'));
}
function buildTorsTab(pg){
  const D=dOrNull(pg),p=AN.sect;if(!D)return;
  const isOpen=(p._kind==='I'||p._kind==='C');
  const any=D.perCombo.some(C=>C.man.Tu);
  /* ---- HSS: closed-form H3.1 (unchanged) ---- */
  if(!isOpen){
    if(!any){naBox(pg,'Torsion','No T\u1D64 was entered on any '+(isMember()?'load case':'combination')+'.');return;}
    if(D.tors&&D.tors.blocked){pg.appendChild(el('div','errBox',D.tors.blocked));return;}
    mkSection('toCap','Torsional Strength (\u00A7H3.1)',body=>{
      body.appendChild(eqBlock({title:'Critical stress and nominal torsional strength',ref:'\u00A7H3.1 ('+D.tors.clause+')',
        lines:['F_{cr}=\\mathbf{'+fmt(D.tors.Fcr,1)+'\\ \\text{ksi}}',
          'T_n=F_{cr}C='+fmt(D.tors.Fcr,1)+'\\times '+fmt(p.Cc,1)+'=\\mathbf{'+fmt(D.tors.Tn,0)+'\\ \\text{kip\u00B7in}}',
          '\\phi_TT_n=0.90\\times '+fmt(D.tors.Tn,0)+'=\\mathbf{'+fmt(D.tors.phiTn/12,1)+'\\ \\text{kip\u00B7ft}}'],
        vars:[['C',fmt(p.Cc,1)+' in\u00B3','HSS torsional constant']]}));
      body.appendChild(el('div','note','<b>Interaction threshold:</b> where T\u1D64 \u2264 0.2\u03C6T\u2099 = '+fmt(0.2*D.tors.phiTn/12,2)+
        ' kip\u00B7ft, torsion may be neglected and H1 governs; above it, Eq. H3-6 replaces H1.'));
    },pg);
    demandEcho(pg,[['Tu','T\u1D64 (kip\u00B7ft)',true]]);
    perComboSections(pg,'to_',isMember()?'Case ':'Combination ',(body,C)=>{
      if(!C.man.Tu){body.appendChild(el('div','note','No T\u1D64 entered for this '+(isMember()?'case':'combination')+'.'));return;}
      dcrLine(body,'Torsion DCR','\u00A7H3.1',' T',Math.abs(C.man.Tu),C.phiTn,C.dcrT);
      body.appendChild(el('div',C.torsNeglect?'okBox':'warnBox',C.torsNeglect?
        'T\u1D64/\u03C6T\u2099 = '+fmt(C.dcrT,3)+' \u2264 0.20 \u2192 torsion neglected in interaction (\u00A7H3.2).':
        'T\u1D64/\u03C6T\u2099 = '+fmt(C.dcrT,3)+' > 0.20 \u2192 Eq. H3-6 governs the combined check.'));
    },C=>String(C.man.Tu));
    return;
  }
  /* ---- open sections: DG 9 + §H3.3 ---- */
  const tor=D.torOpen;
  if(!tor){
    mkSection('toRef','Torsional Character of the Section',body=>{
      const a=Math.sqrt(EKSI*p.Cw/(GKSI*p.J));
      const Ls=(typeof spanFor==='function')?spanFor(null).v:null;
      body.appendChild(eqBlock({title:'Torsional characteristic length',ref:'DG 9 \u00A73',
        lines:['a=\\sqrt{\\tfrac{EC_w}{GJ}}=\\sqrt{\\tfrac{'+EKSI+'\\times '+fmt(p.Cw,0)+'}{'+GKSI+'\\times '+fmt(p.J,3)+'}}=\\mathbf{'+fmt(a,1)+'\\ \\text{in}}='+fmt(a/12,2)+'\\ \\text{ft}'],
        vars:[['C_w',fmt(p.Cw,0)+' in\u2076','warping constant'],['J',fmt(p.J,3)+' in\u2074','torsional constant'],
          ['G',GKSI+' ksi','shear modulus']]}));
      if(Ls>0){
        const r2=Ls*12/a;
        body.appendChild(el('div','note','With a span of '+fmt(Ls,2)+' ft, L/a = <b>'+fmt(r2,2)+'</b> \u2014 '+
          (r2<2?'<b>warping dominates</b>: end restraint against warping carries most of the torque, and warping normal stresses will be large.':
           r2>10?'<b>St-Venant shear dominates</b>: the member behaves close to a pure-torsion member and warping restraint buys little.':
           '<b>both mechanisms are significant</b>, which is the usual case for rolled beams.')));
      }
      const Jc=p.J,Cw=p.Cw;
      body.appendChild(el('div','warnBox','Open sections are extremely inefficient in torsion. For scale, this section\u2019s pure-torsional stiffness GJ = '+
        fmt(GKSI*Jc/1000,0)+'\u00D710\u00B3 kip\u00B7in\u00B2 is roughly '+
        fmt((GKSI*Jc)/(0.6*p.mat.Fy*(p.d*p.tw)*p.d)*100,1)+'% of what a closed section of the same depth would provide. If torque is unavoidable, an HSS is usually the answer.'));
      body.appendChild(el('div','hint','These are properties of the section alone. The stresses additionally depend on the loading pattern and the end warping restraint, which is why a torsion case must be stated before \u00A7H3.3 can be checked.'));
    },pg);
    pg.appendChild(el('div','warnBox','<b>Open-section torsion is not evaluated.</b> An I-shape or channel resists torque partly by pure (St-Venant) shear and partly by <b>warping</b>, and the split depends on the loading pattern and on how the ends are restrained against warping \u2014 a torque magnitude alone does not determine the stresses. Enable <i>Open-section torsion (DG 9)</i> in the <b>Torsion</b> section of the input panel and state the case, span and torque.'));
    if(any)pg.appendChild(el('div','errBox','T\u1D64 has been entered on at least one '+(isMember()?'case':'combination')+' but no torsional case is defined, so no torsion check is being made. This is reported N/A on the dashboard \u2014 it is not a pass.'));
    return;
  }
  if(tor.blocked){pg.appendChild(el('div','errBox',tor.blocked));return;}
  mkSection('toDG','Warping Torsion \u2014 AISC Design Guide 9',body=>{
    body.appendChild(el('div','note','<b>'+tor.caseLab+'</b><br>Applied torque '+fmt(tor.T/12,2)+' kip\u00B7ft over '+fmt(tor.L/12,2)+' ft.'));
    body.appendChild(eqBlock({title:'Governing differential equation and torsional constant',ref:'DG 9 \u00A73',
      lines:['EC_w\\,\\theta\'\'\'\'-GJ\\,\\theta\'\'=t(z),\\qquad a=\\sqrt{\\tfrac{EC_w}{GJ}}=\\sqrt{\\tfrac{'+EKSI+'\\times '+fmt(p.Cw,0)+'}{'+GKSI+'\\times '+fmt(p.J,2)+'}}=\\mathbf{'+fmt(tor.a,1)+'\\ \\text{in}}',
        '\\tfrac{L}{a}=\\tfrac{'+fmt(tor.L,1)+'}{'+fmt(tor.a,1)+'}='+fmt(tor.L/tor.a,2)+
        '\\quad\\Rightarrow\\quad\\text{'+(tor.L/tor.a<2?'warping dominates':tor.L/tor.a>10?'St-Venant dominates':'both mechanisms significant')+'}'],
      vars:[['C_w',fmt(p.Cw,0)+' in\u2076','warping constant'],['J',fmt(p.J,2)+' in\u2074','torsional constant'],
        ['a','in','torsional characteristic length'],['G',GKSI+' ksi','shear modulus']]}));
    body.appendChild(el('div','hint','The equation is solved in closed form on each segment for the stated end conditions; the Validation tab re-solves it independently by finite difference and checks two limiting cases and torsional equilibrium.'));
    const t2=el('table','tbl');
    const h2=el('tr');['Quantity','Value','at z (in)','Formula'].forEach(x=>h2.appendChild(el('th',null,x)));t2.appendChild(h2);
    [['Rotation \u03B8 (max)',fmt(tor.thMax,5)+' rad = '+fmt(tor.thMax*180/Math.PI,2)+'\u00B0','\u2014','solution of the ODE'],
     ['Pure torsional shear \u03C4\u209C',fmt(Math.abs(tor.tauTmax),2)+' ksi',fmt(tor.tauTat,1),'G\u00B7t\u00B7\u03B8\u2032  (t = '+fmt(tor.tmax,3)+' in)'],
     ['Warping normal stress \u03C3\u1D65',fmt(Math.abs(tor.sigWmax),2)+' ksi',fmt(tor.sigWat,1),'E\u00B7W\u2099\u2092\u00B7\u03B8\u2033  (W\u2099\u2092 = '+fmt(p.Wno,1)+' in\u00B2)'],
     ['Warping shear stress \u03C4\u1D65',fmt(Math.abs(tor.tauWmax),3)+' ksi',fmt(tor.tauWat,1),'\u2212E\u00B7S\u1D65\u2081\u00B7\u03B8\u2034/t\u1DA0  (S\u1D65\u2081 = '+fmt(p.Sw1,1)+' in\u2074)']]
      .forEach(r=>{const tr=el('tr');r.forEach((v,i)=>tr.appendChild(el('td',(i===0||i===3)?'lft':null,v)));t2.appendChild(tr);});
    body.appendChild(t2);
    body.appendChild(el('div','warnBox','Open sections are extremely inefficient in torsion. A modest torque produces large warping normal stresses that add directly to the flexural stresses \u2014 if this check governs, the usual remedy is an HSS, a torsion-resisting end detail, or removing the eccentricity that causes the torque.'));
  },pg);
  demandEcho(pg,[['Tu','T\u1D64 entered (kip\u00B7ft)',true]]);
  perComboSections(pg,'to_',isMember()?'Case ':'Combination ',(body,C)=>{
    const h=C.h33;
    if(!h){body.appendChild(el('div','note','No \u00A7H3.3 combination available for this '+(isMember()?'case':'combination')+'.'));return;}
    body.appendChild(el('div','note','\u00A7H3.3 requires the torsional stresses to be added to the axial, flexural and shear stresses at the same point and checked against yielding \u2014 there is no separate \u201C\u03C6T\u2099\u201D for an open section.'));
    body.appendChild(eqBlock({title:'Normal stresses at the critical station (z = '+fmt(h.z,1)+' in)',ref:'\u00A7H3.3(a)',
      lines:['f_n=\\tfrac{P_u}{A_g}+\\tfrac{M_{ux}}{S_x}+\\tfrac{M_{uy}}{S_y}+\\sigma_w='+
        fmt(h.fa,2)+'+'+fmt(h.fbx,2)+'+'+fmt(h.fby,2)+'+'+fmt(h.sigW,2)+'=\\mathbf{'+fmt(h.fn,2)+'\\ \\text{ksi}}',
        '\\text{DCR}=\\tfrac{f_n}{\\phi F_y}=\\tfrac{'+fmt(h.fn,2)+'}{0.90\\times '+p.mat.Fy+'}=\\mathbf{'+fmt(h.dcrN,3)+'}'+
        (h.dcrN>1?'\\ \\color{#B42318}{\\text{FAIL}}':'\\ \\checkmark')]}));
    body.appendChild(eqBlock({title:'Shear stresses at the same station',ref:'\u00A7H3.3(b)',
      lines:['f_v=\\tfrac{V_{ux}}{dt_w}+\\tfrac{V_{uy}}{2b_ft_f}+\\tau_t+\\tau_w='+
        fmt(h.fvx,2)+'+'+fmt(h.fvy,2)+'+'+fmt(h.tauT,2)+'+'+fmt(h.tauW,3)+'=\\mathbf{'+fmt(h.fv,2)+'\\ \\text{ksi}}',
        '\\text{DCR}=\\tfrac{f_v}{\\phi(0.6F_y)}=\\tfrac{'+fmt(h.fv,2)+'}{0.90\\times 0.6\\times '+p.mat.Fy+'}=\\mathbf{'+fmt(h.dcrV,3)+'}'+
        (h.dcrV>1?'\\ \\color{#B42318}{\\text{FAIL}}':'\\ \\checkmark')]}));
    body.appendChild(el('div',h.dcr>1?'errBox':'okBox','Governing \u00A7H3.3 DCR = <b>'+fmt(h.dcr,3)+'</b> ('+(h.dcrN>=h.dcrV?'normal':'shear')+' stress)'));
  },C=>C.h33?fmt(C.h33.dcr,4):'x');
  pg.appendChild(el('div','hint','Stresses are combined conservatively by direct summation of magnitudes at the critical station, which is the practice DG 9 recommends for design. The critical station is chosen as the worst combination of warping normal and shear stress along the member.'));
}

/* ---------- 1. bracing & Cb (both modes) ---------- */
function secBracing(P){
  mkSection('inBrace2','Lateral Bracing &amp; C\u1D47',body=>{
    if(isMember()){
      fRow(body,'Member span  L',numInput(()=>S.member.L,v=>{S.member.L=v;},1,'memSpanL'),'ft',
        'Centre to centre of supports. Feeds the self-weight, deflection, torsion and composite effective-width calculations \u2014 they no longer ask separately.');
      const cr=el('div','fRow');cr.appendChild(el('label',null,'Continuously braced'));
      const cc=document.createElement('input');cc.type='checkbox';cc.checked=!!S.member.cont;
      cc.addEventListener('change',()=>{S.member.cont=cc.checked;rebuildInputs();schedule(false);});
      cr.appendChild(cc);body.appendChild(cr);
      if(!S.member.cont)fRow(body,'Unbraced length  L\u1D47',numInput(()=>S.member.Lb,v=>{S.member.Lb=v;},1,'memLb'),'ft',
        'compression flange, for lateral-torsional buckling');
      fRow(body,'C\u1D47',numInput(()=>S.member.Cb,v=>{S.member.Cb=v||1;},0.05,'memCb'),'\u2014',
        '1.0 is conservative; Manual Table 3-1 or Eq. F1-1');
      body.appendChild(el('div','hint','With no moment diagram there are no quarter-point moments, so C\u1D47 is stated rather than calculated. To check the other flange, run it as a separate case with the relevant L\u1D47.'));
      return;
    }
    fRow(body,'Top flange continuously braced',chkInput(()=>S.bracing.topCont,v=>{S.bracing.topCont=v;rebuildInputs();},'brTop'),'',
      'Deck or slab attached to the top flange');
    if(!S.bracing.topCont)
      fRow(body,'Top-flange L\u1D47',numInput(()=>S.bracing.LbTop,v=>{S.bracing.LbTop=v;},0.5,'brLbT'),'ft',
        'Where the TOP flange is in compression (positive moment)');
    fRow(body,'Bottom-flange L\u1D47',numInput(()=>S.bracing.LbBot,v=>{S.bracing.LbBot=v;},0.5,'brLbB'),'ft',
      'Where the BOTTOM flange is in compression. Blank = support-to-support.');
    hr(body);
    fRow(body,'C\u1D47 basis',selInput(['unity','calc'],()=>S.design.CbMode,v=>{S.design.CbMode=v;},
      o=>o==='unity'?'C\u1D47 = 1.0 (conservative)':'Calculated (worst window, Eq. F1-1)',null,'cbMode'),'');
    body.appendChild(el('div','hint','The engine picks the compression flange from the sign of M in each region. An inflection point is not a brace point. Calculated C\u1D47 slides a window of length L\u1D47 through each region and keeps the worst-DCR window.'));
  },P,secOpts());
}

/* ---------- 3. manual demands per combination (beam mode) ---------- */
function secManualDemands(P){
  mkSection('inMan','Manual Member Demands per Combination',body=>{
    body.appendChild(el('div','hint','The model is planar, so axial force, minor-axis moment and shear, and torque cannot be generated from it \u2014 enter them here. They carry the imported-value styling wherever they appear. Second-order effects must already be included.'));

/* ---------- dispatcher ---------- */
function extraInputSections(P,phase){
  if(typeof isBatch==='function'&&isBatch()){
    if(phase==='A')secBatch(P);
    return;
  }
  if(phase==='A'){
    secBracing(P);
    if(isMember()){secMemberCases(P);secMemberSW(P);}
    return;
  }
  mkSection('inComp2','Composite Action (Chapter I)',body=>{compositeInputs(body);},P,secOpts());
  if(!isMember())secManualDemands(P);
  secCompLengths(P);
  secStiffeners(P);
  secTorsion(P);
  secJ10(P);
  if(isMember())secMemberDefl(P);
}
/* =====================================================================
   DETAILED EXCEL CALCULATION SHEET
   Layout mirrors the reference WF calc: a running narrative of
   description | symbol | value | unit | clause, with the symbolic and
   substituted form written out beneath each result.
   Columns: A pad · B–G description · H symbol · I value · J unit · K clause
   ===================================================================== */
function XB(ws){this.ws=ws;this.r=1;this.REF={};}
XB.prototype.resolveF=function(f){
  const names=Object.keys(this.REF).sort((a,b)=>b.length-a.length);
  let out=f;names.forEach(n=>{out=out.split('\u00AB'+n+'\u00BB').join(this.REF[n]);});
  if(out.indexOf('\u00AB')>=0)throw new Error('unresolved ref: '+out);
  return out;
};
XB.prototype.cell=function(r,c,v,st){
  const cl=this.ws.getCell(r,c);
  if(v&&v.formula!==undefined)cl.value={formula:this.resolveF(v.formula),result:v.result};
  else cl.value=(v===undefined?null:v);
  const f={name:'Calibri',size:10};
  st=st||{};
  if(st.b)f.bold=true;
  if(st.i)f.italic=true;
  if(st.sz)f.size=st.sz;
  if(st.color)f.color={argb:st.color};
  cl.font=f;
  if(st.fill)cl.fill={type:'pattern',pattern:'solid',fgColor:{argb:st.fill}};
  if(st.border)cl.border=xlBorder();
  if(st.dp!=null)cl.numFmt='0.'+'0'.repeat(st.dp);
  if(st.align)cl.alignment={horizontal:st.align,wrapText:!!st.wrap,vertical:st.wrap?'top':undefined};
  else if(st.wrap)cl.alignment={wrapText:true,vertical:'top'};
  return cl;
};
/* section banner */
XB.prototype.band=function(title,clause){
  const r=this.r++;
  this.ws.mergeCells(r,1,r,10);
  this.cell(r,1,'  '+title,{b:true,color:'FFFFFFFF',fill:XL.BLUE,sz:11});
  if(clause)this.cell(r,11,clause,{b:true,color:'FFFFFFFF',fill:XL.BLUE,align:'center'});
  this.ws.getRow(r).height=17;
  return r;
};
XB.prototype.title=function(t){
  const r=this.r++;
  this.ws.mergeCells(r,1,r,11);
  this.cell(r,1,'  '+t,{b:true,color:'FFFFFFFF',fill:XL.NAVY,sz:12});
  this.ws.getRow(r).height=20;
};
XB.prototype.sub=function(t){
  const r=this.r++;
  this.ws.mergeCells(r,1,r,11);
  this.cell(r,1,t,{b:true,color:XL.NAVY,sz:10.5});
};
/* description | symbol | value | unit | clause */
XB.prototype.line=function(desc,sym,val,unit,clause,st,st2){
  /* tolerate an extra positional argument between clause and the style object */
  if(typeof st!=='object'||st===null)st=st2;
  const r=this.r++;
  this.ws.mergeCells(r,1,r,7);
  this.cell(r,1,desc,{wrap:true});
  this.cell(r,8,sym||'',{b:true,align:'right'});
  st=st||{};
  const kind=st.kind||'out';
  const cs={dp:st.dp!=null?st.dp:2,border:true,align:'center'};
  if(kind==='in'){cs.color=XL.INFONT;cs.fill=XL.INFILL;}
  else if(kind==='imp'){cs.color=XL.IMPF;cs.fill=XL.IMPFILL;}
  else if(kind==='ok'){cs.color=XL.GREEN;cs.fill=XL.GFILL;cs.b=true;}
  else if(kind==='bad'){cs.color=XL.RED;cs.fill=XL.RFILL;cs.b=true;}
  else if(kind==='txt'){cs.fill=XL.OUTFILL;delete cs.dp;}
  else cs.fill=XL.OUTFILL;
  if(st.ref)this.REF[st.ref]=this.ws.getCell(r,9).address;
  this.cell(r,9,val,cs);
  this.cell(r,10,unit||'',{sz:9,align:'left'});
  this.cell(r,11,clause||'',{sz:9,i:true,color:'FF5A6B80',align:'right'});
  return r;
};
/* formula narrative row (symbolic then substituted) */
XB.prototype.eq=function(txt){
  const r=this.r++;
  this.ws.mergeCells(r,2,r,11);
  this.cell(r,2,txt,{i:true,sz:9.5,color:'FF3A4A5E',wrap:true});
  this.ws.getRow(r).height=Math.max(13,12*Math.ceil(txt.length/120));
};
XB.prototype.note=function(txt){
  const r=this.r++;
  this.ws.mergeCells(r,1,r,11);
  this.cell(r,1,txt,{i:true,sz:9,color:'FF5A6B80',wrap:true});
  this.ws.getRow(r).height=Math.max(12,11*Math.ceil(txt.length/135));
};
XB.prototype.gap=function(n){this.r+=(n||1);};
/* generic table */
XB.prototype.table=function(heads,rows,widthsFrom){
  const c0=widthsFrom||2;
  let r=this.r++;
  heads.forEach((h,i)=>this.cell(r,c0+i,h,{b:true,color:'FFFFFFFF',fill:XL.BLUE,align:'center',wrap:true}));
  rows.forEach(row=>{
    r=this.r++;
    row.forEach((v,i)=>{
      const st={border:true,sz:9.5};
      if(typeof v==='object'&&v!==null&&!Array.isArray(v)){
        if(v.kind==='ok'){st.color=XL.GREEN;st.fill=XL.GFILL;st.b=true;}
        else if(v.kind==='bad'){st.color=XL.RED;st.fill=XL.RFILL;st.b=true;}
        else if(v.kind==='imp'){st.color=XL.IMPF;st.fill=XL.IMPFILL;}
        else st.fill=XL.OUTFILL;
        if(v.dp!=null)st.dp=v.dp;
        if(i===0)st.align='left';else st.align='center';
        this.cell(r,c0+i,v.v,st);
      }else{
        st.fill=XL.OUTFILL;st.align=(i===0?'left':'center');
        this.cell(r,c0+i,v,st);
      }
    });
  });
};
const N2=(x,d)=>(x==null||!isFinite(x))?null:Math.round(x*Math.pow(10,d==null?2:d))/Math.pow(10,d==null?2:d);
const S2=(x,d)=>fmt(x,d==null?2:d);

    X.eq('\u0394Vux = \u03B3 \u00B7 c \u00B7 (W/1000) \u00B7 L = '+S2(D.sw.gam,2)+' \u00B7 '+S2(D.sw.c,2)+' \u00B7 ('+S2(p.Wt,1)+'/1000) \u00B7 '+S2(D.sw.L,2));

  /* ---------- design summary ---------- */
  X.band('3.  DESIGN SUMMARY','');

    D.checks.map(ch=>{
      const ok=!ch.na&&ch.dem!=null&&isFinite(ch.dem)&&ch.cap!=null&&isFinite(ch.cap);
      return[ch.label+'  ['+ch.ref+']',ch.combo||'\u2014',
        ok?{v:N2(ch.dem,3),dp:3}:'\u2014',
        ok?{v:N2(ch.cap,3),dp:3}:'\u2014',
        ok?ch.unit:'\u2014',
        ch.na?'\u2014':{v:N2(ch.dcr,3),dp:3,kind:ch.dcr>1?'bad':'ok'},
        ch.na?'N/A':{v:ch.dcr>1?'FAIL':'OK',kind:ch.dcr>1?'bad':'ok'}];
    }));
  D.checks.filter(c=>c.na&&c.detail).forEach(c=>X.note('   N/A \u2014 '+c.label+': '+c.detail));
  X.gap();
  /* ---------- section properties ---------- */
  X.band('4.  SECTION PROPERTIES','Manual Table 1-1');
  const PL=(typeof PROP_LABELS!=='undefined')?PROP_LABELS:{};

    X.line(PL[k][0],k,N2(p[k],4),PL[k][1],p._src[k]==='ovr'?'user override':'',

  });

  if(D.shearX)X.line('Shear strength, major axis','\u03C6v',N2(D.shearX.phi,2),'\u2014',
    D.shearX.route==='G2.1(a)'?'\u00A7G2.1(a)':'\u00A7G1',{kind:'in'});
  if(D.shearY)X.line('Shear strength, minor axis','\u03C6v',N2(D.shearY.phi,2),'\u2014','\u00A7G1',{kind:'in'});
  X.line('Compressive strength','\u03C6c',0.90,'\u2014','\u00A7E1',{kind:'in'});
  X.line('Torsional strength','\u03C6T',0.90,'\u2014','\u00A7H3',{kind:'in'});
  if(D.j10){X.line('Web local yielding','\u03C6',1.00,'\u2014','\u00A7J10.2',{kind:'in'});
    X.line('Web local crippling','\u03C6',0.75,'\u2014','\u00A7J10.3',{kind:'in'});}
  if(D.shearX&&D.shearX.route==='G2.1(a)')
    X.note('\u03C6v = 1.00 applies only to webs of rolled I-shaped members meeting h/tw \u2264 2.24\u221A(E/Fy) (\u00A7G2.1(a)); it does not extend to \u00A7G6 weak-axis shear.');
  X.gap();
  await xlChecks(X,p,D,mem,Fy,E);
  /* ---------- write ---------- */
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=((f.name||'SteelMember').replace(/[^\w\-]+/g,'_'))+'_Calc.xlsx';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  toast('Workbook exported \u2014 '+(X.r-1)+' rows');
  return buf;
}
/* =====================================================================
   PER-CHECK CALCULATION SECTIONS
   ===================================================================== */
async function xlChecks(X,p,D,mem,Fy,E){
  const rt=Math.sqrt(E/Fy);
  const gov=(()=>{let b=-1,c=null;D.perCombo.forEach(C=>{if(C.flexGov&&C.flexGov.dcr>b){b=C.flexGov.dcr;c=C;}});return c||D.perCombo[0];})();
  /* ---------- B4 classification ---------- */
  X.band('6.  SECTION CLASSIFICATION \u2014 FLEXURE','Table B4.1b');
  const cf=D.clsF;
  const clsRows=[];
  const addCls=(nm,c,cs)=>clsRows.push([nm,{v:N2(c.lam,2),dp:2},{v:N2(c.lp,2),dp:2},{v:N2(c.lr,2),dp:2},'Case '+cs,
    {v:c.cls,kind:c.cls==='compact'?'ok':(c.cls==='noncompact'?'out':'bad')}]);
  if(p._kind==='I'||p._kind==='C'){addCls('Flange',cf.flange,cf.flange.case);addCls('Web',cf.web,cf.web.case);}
  else if(p._kind==='R'){addCls('Flange (major)',cf.x.flange,cf.x.flange.case);addCls('Web (major)',cf.x.web,cf.x.web.case);}
  else addCls('Wall',cf.wall,cf.wall.case);
  X.table(['Element','\u03BB','\u03BBp','\u03BBr','Table B4.1b','Classification'],clsRows);
  if(p._kind==='I'||p._kind==='C'){
    X.eq('\u03BB flange = bf/2tf = '+S2(p.bf,2)+' / (2 \u00D7 '+S2(p.tf,3)+') = '+S2(cf.flange.lam,2));
    X.eq('\u03BBp = 0.38\u221A(E/Fy) = 0.38\u221A('+E+'/'+Fy+') = '+S2(cf.flange.lp,2)+'      \u03BBr = 1.0\u221A(E/Fy) = '+S2(cf.flange.lr,2));
    X.eq('\u03BB web = h/tw = '+S2(cf.web.lam,2)+'      \u03BBp = 3.76\u221A(E/Fy) = '+S2(cf.web.lp,2)+'      \u03BBr = 5.70\u221A(E/Fy) = '+S2(cf.web.lr,2));
  }
  X.gap();
  /* ---------- major flexure ---------- */
  const cap=D.capTop;
  X.band('7.  FLEXURE ABOUT THE MAJOR AXIS','\u00A7'+cap.route);
  if(cap.blocked){X.note('BLOCKED: '+cap.blocked);}
  else{
    X.line('Plastic section modulus','Zx',N2(p.Zx,1),'in\u00B3','',{kind:'in',dp:1,ref:'Zx'});
    X.eq('Mp = Fy \u00B7 Zx / 12 = '+Fy+' \u00B7 '+S2(p.Zx,1)+' / 12');
    X.line('Plastic moment','Mp',{formula:'\u00ABFy\u00BB*\u00ABZx\u00BB/12',result:N2(cap.Mp/12,2)},'k\u00B7ft','Eq. F2-1',{ref:'Mp'});
    const ltb=cap.ls.find(l=>l.name.indexOf('Lateral')>=0);
    if(ltb&&ltb.d&&ltb.d.Lp!=null){
      X.sub('Lateral-torsional buckling  (\u00A7F2.2)');
      X.line('Unbraced length','Lb',N2(cap.Lb/12,2),'ft','',{kind:'in',ref:'LbF'});
      X.eq('Lp = 1.76 \u00B7 ry \u00B7 \u221A(E/Fy) / 12 = 1.76 \u00B7 '+S2(p.ry,2)+' \u00B7 \u221A('+E+'/'+Fy+') / 12');
      X.line('Limiting length for yielding','Lp',{formula:'1.76*\u00ABry\u00BB*SQRT(\u00ABE\u00BB/\u00ABFy\u00BB)/12',result:N2(ltb.d.Lp/12,3)},'ft','Eq. F2-5',{dp:3,ref:'Lp'});
      X.line('LTB coefficient (1.0 doubly symmetric)','c',N2(cap.c,3),'\u2014','\u00A7F2.2',{kind:'in',dp:3,ref:'cF2'});
      X.eq('Lr = 1.95 \u00B7 rts \u00B7 E/(0.7Fy) \u00B7 \u221A[ Jc/(Sx\u00B7ho) + \u221A( (Jc/(Sx\u00B7ho))\u00B2 + 6.76(0.7Fy/E)\u00B2 ) ] / 12');
      X.line('Limiting length for inelastic LTB','Lr',
        {formula:'1.95*\u00ABrts\u00BB*\u00ABE\u00BB/(0.7*\u00ABFy\u00BB)*SQRT(\u00ABJ\u00BB*\u00ABcF2\u00BB/(\u00ABSx\u00BB*\u00ABho\u00BB)+SQRT((\u00ABJ\u00BB*\u00ABcF2\u00BB/(\u00ABSx\u00BB*\u00ABho\u00BB))^2+6.76*(0.7*\u00ABFy\u00BB/\u00ABE\u00BB)^2))/12',
         result:N2(ltb.d.Lr/12,3)},'ft','Eq. F2-6',{dp:3,ref:'Lr'});
      X.line('Bracing classification','Region',
        cap.Lb/12<=ltb.d.Lp/12?'Lb \u2264 Lp':(cap.Lb/12<=ltb.d.Lr/12?'Lp < Lb \u2264 Lr':'Lb > Lr'),'','\u00A7F2.2',{kind:'txt'});
      X.line('Modification factor','Cb',N2(cap.Cb||1,3),'\u2014','Eq. F1-1',{kind:'in',dp:3,ref:'CbF'});
      if(ltb.d.reg&&ltb.d.reg.indexOf('F2-2')>=0){
        X.eq('Mn = Cb[ Mp \u2212 (Mp \u2212 0.7\u00B7Fy\u00B7Sx/12)(Lb\u2212Lp)/(Lr\u2212Lp) ] \u2264 Mp');
        X.eq('   = '+S2(cap.Cb,3)+'[ '+S2(cap.Mp/12,2)+' \u2212 ('+S2(cap.Mp/12,2)+' \u2212 0.7\u00B7'+Fy+'\u00B7'+S2(p.Sx,1)+'/12)('+
          S2(cap.Lb/12,2)+'\u2212'+S2(ltb.d.Lp/12,2)+')/('+S2(ltb.d.Lr/12,2)+'\u2212'+S2(ltb.d.Lp/12,2)+') ]');
        X.line('Nominal LTB strength','Mn,LTB',
          {formula:'MIN(\u00ABMp\u00BB,\u00ABCbF\u00BB*(\u00ABMp\u00BB-(\u00ABMp\u00BB-0.7*\u00ABFy\u00BB*\u00ABSx\u00BB/12)*(\u00ABLbF\u00BB-\u00ABLp\u00BB)/(\u00ABLr\u00BB-\u00ABLp\u00BB)))',
           result:N2(ltb.Mn/12,2)},'k\u00B7ft','Eq. F2-2',{ref:'MnLTB'});
      }else if(ltb.d.Fcr!=null){
        X.eq('Fcr = Cb\u03C0\u00B2E/(Lb/rts)\u00B2 \u00B7 \u221A[1 + 0.078\u00B7Jc/(Sx\u00B7ho)\u00B7(Lb/rts)\u00B2] = '+S2(ltb.d.Fcr,2)+' ksi');
        X.line('Elastic LTB stress','Fcr',N2(ltb.d.Fcr,2),'ksi','Eq. F2-4',{ref:'FcrL'});
        X.line('Nominal LTB strength','Mn,LTB',{formula:'MIN(\u00ABMp\u00BB,\u00ABFcrL\u00BB*\u00ABSx\u00BB/12)',result:N2(ltb.Mn/12,2)},'k\u00B7ft','Eq. F2-3',{ref:'MnLTB'});
      }else X.line('Lateral-torsional buckling','Mn,LTB','N/A \u2014 continuously braced','','\u00A7F2.2',{kind:'txt'});
    }
    cap.ls.filter(l=>l.applies&&l.name.indexOf('Lateral')<0&&l.name.indexOf('Yielding')<0).forEach(l=>{
      X.line(l.name,'Mn',N2(l.Mn/12,2),'k\u00B7ft',l.clause,{});
      if(l.note)X.note('   '+l.note);
    });
    X.line('Governing limit state','\u2014',cap.gov?cap.gov.name:'Yielding','',cap.gov?cap.gov.clause:'',{kind:'txt'});
    X.line('Nominal flexural strength','Mn',N2(cap.Mn/12,2),'k\u00B7ft','',{ref:'MnX'});
    X.eq('\u03C6bMn = 0.90 \u00B7 '+S2(cap.Mn/12,2));
    X.line('Design flexural strength','\u03C6bMn',{formula:'0.9*\u00ABMnX\u00BB',result:N2(cap.phiMn/12,2)},'k\u00B7ft','\u00A7F1',{ref:'phiMnX'});
    X.sub('Demand / capacity \u2014 per '+(mem?'case':'combination'));
    X.table(['Case',mem?'Lb (ft)':'Region (ft)','Cb','Mu (k\u00B7ft)','\u03C6Mn (k\u00B7ft)','DCR','Status'],
      D.perCombo.map(C=>{const g=C.flexGov;return[C.name,
        mem?{v:N2(g.LbFt,2),dp:2}:(S2(g.x1,1)+'\u2013'+S2(g.x2,1)),
        {v:N2(g.Cb,3),dp:3},{v:N2(g.Mu,2),dp:2},{v:N2(g.phiMn,2),dp:2},
        {v:N2(g.dcr,3),dp:3,kind:g.dcr>1?'bad':'ok'},
        {v:g.dcr>1?'FAIL':'OK',kind:g.dcr>1?'bad':'ok'}];}));
  }
  X.gap();

  X.eq('HSS with Tr > 0.2Tc :  (Pr/Pc + Mr/Mc) + (Vr/Vc + Tr/Tc)\u00B2 \u2264 1.0   (Eq. H3-6)');
  X.table(['Case','Equation','Pr/Pc','Mrx/Mcx','Mry/Mcy','(V+T)','Value','Status'],
    D.perCombo.map(C=>{const t=C.inter.terms;return[C.name,C.inter.eq,
      {v:N2(t.P||0,3),dp:3},{v:N2(t.Mx||0,3),dp:3},{v:N2(t.My||0,3),dp:3},
      t.V!=null?{v:N2(t.V+t.T,3),dp:3}:'\u2014',
      {v:N2(C.inter.value,3),dp:3,kind:C.inter.value>1?'bad':'ok'},
      {v:C.inter.value>1?'FAIL':'OK',kind:C.inter.value>1?'bad':'ok'}];}));
  X.gap();
  /* ---------- deflection ---------- */
  X.band('15.  SERVICEABILITY','IBC Table 1604.3');
  if(mem&&D.defl&&!D.defl.err){
    X.line('Configuration','\u2014',D.defl.cfgLab,'',{kind:'txt'});
    X.line('Service load','w',N2(D.defl.w,3),D.defl.pt?'kip':'k/ft','',{kind:'in',dp:3,ref:'dw'});
    X.line('Span','L',N2(D.defl.L,2),'ft','',{kind:'in',ref:'dL'});
    X.line('Coefficient','c',N2(D.defl.c,5),'\u2014','',{kind:'in',dp:5,ref:'dc'});
    X.line('Moment of inertia','I',N2(D.defl.I,1),'in\u2074','',{kind:'in',dp:1,ref:'dI'});
    X.eq(D.defl.pt?'\u0394 = c\u00B7P\u00B7(L\u00B712)\u00B3/(E\u00B7I)':'\u0394 = c\u00B7w\u00B71728\u00B7L\u2074/(E\u00B7I)');
    X.line('Deflection','\u0394',{formula:D.defl.pt?'\u00ABdc\u00BB*\u00ABdw\u00BB*(\u00ABdL\u00BB*12)^3/(\u00ABE\u00BB*\u00ABdI\u00BB)':'\u00ABdc\u00BB*\u00ABdw\u00BB*1728*\u00ABdL\u00BB^4/(\u00ABE\u00BB*\u00ABdI\u00BB)',
      result:N2(D.defl.d,4)},'in','',{dp:4,ref:'dD'});
    if(D.defl.lim!=null){
      X.line('Limit denominator','n',N2(D.defl.den,0),'\u2014','',{kind:'in',dp:0,ref:'dN'});
      X.line('Allowable deflection','\u0394allow',{formula:'\u00ABdL\u00BB*12/\u00ABdN\u00BB',result:N2(D.defl.lim,4)},'in','',{dp:4,ref:'dLim'});
      X.line('Demand / capacity ratio','DCR',{formula:'\u00ABdD\u00BB/\u00ABdLim\u00BB',result:N2(D.defl.dcr,3)},'\u2014','',
        {dp:3,kind:D.defl.dcr>1?'bad':'ok'});
    }
  }else if(!mem&&AN.svc&&AN.svc.length){
    const rows=[];
    AN.svc.forEach(function(sc){sc.perSpan.forEach(function(ps){
      rows.push([sc.name+' \u2014 span '+(ps.span+1),
        {v:N2(Math.abs(ps.dmax)*12,4),dp:4},
        ps.lim!=null?{v:N2(ps.lim*12,4),dp:4}:'\u2014',
        sc.den?('L/'+sc.den):'\u2014',
        ps.ratio!=null?{v:N2(ps.ratio,3),dp:3,kind:ps.ratio>1?'bad':'ok'}:'\u2014',
        ps.pass==null?'report only':{v:(ps.pass?'OK':'FAIL'),kind:(ps.pass?'ok':'bad')}]);
    });});
    X.table(['Service combination / span','\u0394 (in)','\u0394allow (in)','Limit','DCR','Status'],rows);
  }else X.note('Deflection is not evaluated \u2014 reported N/A, not passing.');
  X.gap();
  X.band('ENGINEERING ASSUMPTIONS','');
  X.note((S.assume&&S.assume.trim())?S.assume:'None entered.');
  X.note('This calculation is an engineering aid. The user is responsible for the design, the entered demands, the load factors, and independent review by a licensed engineer.');
}

const BATCH_TOR_CODES={NONE:'none',CONC_PP:'conc_pp',CONC_FF:'conc_ff',CONC_PF:'conc_pf',
  UNIF_PP:'unif_pp',UNIF_FF:'unif_ff',CANT_CONC:'cant_conc',CANT_UNIF:'cant_unif'};
function normHdr(s){return String(s==null?'':s).toLowerCase().replace(/[\s_.\-()]/g,'').replace(/kip|ft|in|k\*/g,'');}
function normLabel(s){
  return String(s==null?'':s).trim().toUpperCase()
    .replace(/\u00D7/g,'X').replace(/\s+/g,'')
    .replace(/^PIPE/,'Pipe');
}
function findShape(label){
  const L=normLabel(label);
  const fams=Object.keys(DB);
  for(const f of fams){
    const row=DB[f].find(r=>normLabel(r[0])===L);
    if(row)return{fam:f,lbl:row[0]};
  }
  const alt=L.replace(/^PIPE/i,'Pipe');
  for(const f of fams){
    const row=DB[f].find(r=>String(r[0]).toUpperCase().replace(/\s+/g,'')===alt.toUpperCase());
    if(row)return{fam:f,lbl:row[0]};
  }
  return null;
}
function gradesForFam(fam){
  return MATS.filter(m=>!m.fams||m.fams.indexOf(fam)>=0);
}
function defGradeFor(fam){
  const fm=FAMS.find(f=>f.id===fam);
  return fm?fm.defMat:(gradesForFam(fam)[0]||{}).id;
}
function pickGrade(fam,txt){
  const g=(txt||'').toString().trim().toUpperCase().replace(/[\s\-]/g,'');
  const list=gradesForFam(fam);
  if(g){
    let m=list.find(x=>x.id.toUpperCase().replace(/[\s\-_]/g,'')===g);
    if(m)return m.id;
    m=list.find(x=>x.name.toUpperCase().replace(/[\s\-]/g,'').indexOf(g)>=0);
    if(m)return m.id;
  }
  return defGradeFor(fam)||(list.length?list[0].id:null);
}
/* ---------------- per-row check ---------------- */
function batchCheckRow(row){
  const R={row,blockers:[],warns:[],notes:[]};
  const fs=findShape(row.size);
  if(!fs){R.blockers.push('Shape "'+(row.size||'')+'" not found in '+DBVER+'.');return R;}
  const gid=pickGrade(fs.fam,row.grade);
  if(!gid){R.blockers.push('No material grade available for family '+fs.fam+'.');return R;}
  const p=sectionFor(fs.fam,fs.lbl,gid);
  if(!p){R.blockers.push('Could not resolve section properties.');return R;}
  R.p=p;R.fam=fs.fam;R.lbl=fs.lbl;R.grade=gid;R.Fy=p.mat.Fy;
  const num=v=>(v==null||v===''||!isFinite(v))?null:+v;
  const Lbx=num(row.Lbx),Lby=num(row.Lby)!=null?num(row.Lby):Lbx,
        Lbz=num(row.Lbz)!=null?num(row.Lbz):Lby,
        Lx=num(row.Lx)!=null?num(row.Lx):Lbx;
  const kx=num(row.kx)||1,ky=num(row.ky)||1,kz=num(row.kz)||1;
  const Cb=num(row.Cb)||(S.batch&&S.batch.Cb)||1;
  if(Lbx==null){R.blockers.push('Lbx (unbraced length) is required.');return R;}
  R.Lbx=Lbx;R.Lby=Lby;R.Lbz=Lbz;R.Lx=Lx;R.kx=kx;R.ky=ky;R.kz=kz;R.Cb=Cb;
  const Pu0=num(row.Pu)||0;
  const Pu=Pu0>0?Pu0:0;
  if(Pu0<0)R.notes.push('P\u1D64 = '+fmt(Pu0,3)+' is tension; taken as zero for the compression check. Tensile yielding and rupture (Chapter D) are not implemented in this tool.');
  const Mux=Math.abs(num(row.Mux)||0),Muy=Math.abs(num(row.Muy)||0);
  const Vux=Math.abs(num(row.Vux)||0),Vuy=Math.abs(num(row.Vuy)||0);
  const Tu=Math.abs(num(row.Tu)||0);
  R.dem={Pu,Pu0,Mux,Muy,Vux,Vuy,Tu};
  /* --- classification --- */
  R.clsF=classifyFlex(p);
  R.compact=(function(){
    const c=R.clsF;
    const say=o=>o.cls;
    if(p._kind==='I'||p._kind==='C'){
      if(c.flange.cls==='compact'&&c.web.cls==='compact')return'Compact';
      return'Fl: '+say(c.flange)+' / Web: '+say(c.web);
    }
    if(p._kind==='R'){
      if(c.x.flange.cls==='compact'&&c.x.web.cls==='compact')return'Compact';
      return'Fl: '+say(c.x.flange)+' / Web: '+say(c.x.web);
    }
    return c.wall.cls.charAt(0).toUpperCase()+c.wall.cls.slice(1);
  })();
  /* --- major flexure --- */
  const capX=flexFor(p,'x',Lbx*12,Cb);
  if(capX.blocked)R.blockers.push('Flexure: '+capX.blocked);
  else{R.capX=capX;R.phiMnx=capX.phiMn/12;R.dcrMx=Mux/(R.phiMnx||1e-9);R.govX=capX.gov?capX.gov.name:'';}
  /* --- minor flexure --- */
  const capY=flexFor(p,'y',0,1);
  if(!capY.blocked){R.phiMny=capY.phiMn/12;R.dcrMy=Muy?Muy/(R.phiMny||1e-9):(Muy===0?0:null);}
  /* --- shear --- */
  const stf=(num(row.stfA)>0)?{on:true,a:num(row.stfA)}:null;
  let Lv=Lx;
  const shX=(p._kind==='P')?shearMajor(p,Lv*12,null):shearMajor(p,null,stf);
  R.shX=shX;R.phiVnx=shX.phi*shX.Vn;R.dcrVx=Vux/(R.phiVnx||1e-9);R.kv=shX.kv;
  const shY=shearMinor(p);
  R.shY=shY;R.phiVny=shY.phi*shY.Vn;R.dcrVy=Vuy/(R.phiVny||1e-9);
  /* --- compression --- */
  if(p._kind==='C'&&Pu>0){R.blockers.push('Axial compression on channels (\u00A7E4 flexural-torsional) is outside this tool.');}
  else{
    const cp=compStrength(p,Lbx*kx*12,Lby*ky*12,Lbz*kz*12);
    if(cp.blocked){if(Pu>0)R.blockers.push('Compression: '+cp.blocked);}
    else{R.comp=cp;R.phiPn=cp.phiPn;R.dcrP=Pu/(R.phiPn||1e-9);
      if(cp.slMax>200)R.warns.push('L\u1D9C/r = '+fmt(cp.slMax,0)+' exceeds the recommended limit of 200.');}
  }
  /* --- torsion --- */
  const tcRaw=(row.torC||'').toString().trim().toLowerCase().replace(/[\s\-]/g,'_');
  const tc=(tcRaw&&tcRaw!=='none'&&tcRaw!=='n/a')?(TOR_CASES[tcRaw]?tcRaw:null):null;
  if(tcRaw&&tcRaw!=='none'&&tcRaw!=='n/a'&&!tc)
    R.warns.push('Torsion case "'+row.torC+'" not recognised \u2014 torsion not evaluated.');
  const isOpen=(p._kind==='I'||p._kind==='C');
  if(Tu>0){
    if(isOpen){
      if(tc){
        const tr=torsionOpen(p,{L:num(row.torL)||Lx,caseId:tc,T:Tu,pos:null});
        if(tr.blocked)R.blockers.push('Torsion: '+tr.blocked);
        else{
          R.tor=tr;
          R.h33=h33Check(p,tr,{Pu,Mux,Muy,Vux,Vuy});
          R.dcrT=R.h33.dcr;R.torMode='H3.3';
        }
      }else R.torNA='T\u1D64 entered on an open section but no torsion case given \u2014 torsion NOT evaluated (\u00A7H3.3 needs the loading case and end warping restraint).';
    }else{
      const th=torsionHSS(p,Lx*12);
      if(th.blocked)R.blockers.push('Torsion: '+th.blocked);
      else{R.phiTn=th.phiTn/12;R.dcrT=Tu/(R.phiTn||1e-9);R.torNeglect=R.dcrT<=0.20;R.torMode='H3.1';}
    }
  }
  if(typeof batchExtras==='function'&&!R.blockers.length){
    /* composite may replace the positive-moment capacity before interaction is formed */
    try{batchExtras(R);}catch(e){R.warns.push('Extra checks failed: '+e.message);}
  }
  /* --- interaction --- */
  const rx=R.dcrMx||0,ry=R.dcrMy||0,rp=R.dcrP||0;
  if(R.torMode==='H3.1'&&!R.torNeglect){
    const vr=(R.dcrVx||0)+(R.dcrVy||0);
    R.inter={eq:'H3-6',value:(rp+rx+ry)+Math.pow(vr+R.dcrT,2)};
  }else if(rp>=0.2)R.inter={eq:'H1-1a',value:rp+8/9*(rx+ry)};
  else R.inter={eq:'H1-1b',value:rp/2+(rx+ry)};
  /* --- governing --- */
  const cand=[['M\u2093',R.dcrMx],['M\u1D67',R.dcrMy],['V\u2093',R.dcrVx],['V\u1D67',R.dcrVy],
    ['P',R.dcrP],['Torsion',R.torMode?R.dcrT:null],['WLY',R.dcrWLY],['WLC',R.dcrWLC],
    ['Deflection',R.defl?R.defl.dcr:null],
    ['Interaction',R.inter?R.inter.value:null]].filter(c=>c[1]!=null&&isFinite(c[1]));
  const g=cand.reduce((m,c)=>c[1]>(m?m[1]:-1)?c:m,null);
  R.gov=g?g[0]:null;R.govDCR=g?g[1]:null;
  R.status=R.blockers.length?'BLOCKED':(R.govDCR!=null&&R.govDCR>1.0001?'FAIL':'PASS');
  return R;
}
function runBatch(){
  if(!S.batch||!S.batch.rows||!S.batch.rows.length)return[];
  const keep={f:S.section.family,l:S.section.label,g:S.section.grade,o:S.section.ovr,b:S.section.builtUp};
  const out=S.batch.rows.map(r=>{
    let R;
    try{R=batchCheckRow(r);}catch(e){R={row:r,blockers:['Engine error: '+e.message]};}
    if(!R.status)R.status=(R.blockers&&R.blockers.length)?'BLOCKED':
      ((R.govDCR!=null&&R.govDCR>1.0001)?'FAIL':'PASS');
    return R;
  });
  S.section={family:keep.f,label:keep.l,grade:keep.g,ovr:keep.o,builtUp:keep.b};
  return out;
}

async function importBatchFile(file){
  try{await loadExcelJS();}catch(e){toast('ExcelJS CDN unavailable \u2014 needs internet');return;}
  const buf=await file.arrayBuffer();
  const wb=new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  let ws=wb.getWorksheet('Members');
  if(!ws)ws=wb.worksheets[0];
  if(!ws){toast('No worksheet found');return;}
  /* locate the header row: the row matching the most known headers */
  let bestRow=0,bestMap=null,bestN=0;
  const maxScan=Math.min(ws.rowCount,20);
  for(let r=1;r<=maxScan;r++){
    const map={},seen={};let n=0;
    ws.getRow(r).eachCell({includeEmpty:false},(cell,col)=>{
      const h=normHdr(cell.value);
      if(!h)return;
      const def=BATCH_COLS.find(c=>normHdr(c.h)===h||c.syn.some(s=>normHdr(s)===h));
      if(def&&!seen[def.k]){map[def.k]=col;seen[def.k]=1;n++;}
    });
    if(n>bestN){bestN=n;bestRow=r;bestMap=map;}
  }
  if(bestN<3){toast('Could not find a recognisable header row');return;}
  const rows=[],unmapped=[],headless=[];
  ws.getRow(bestRow).eachCell({includeEmpty:false},(cell,col)=>{
    const h=String(cell.value==null?'':cell.value).trim();
    if(!h)return;
    const hit=Object.keys(bestMap).some(k=>bestMap[k]===col);
    if(!hit)unmapped.push(h);
  });
  /* a column carrying data but no header is silently ignored \u2014 say so */
  const lastCol=Math.max(ws.columnCount||0,BATCH_COLS.length);
  for(let col=1;col<=lastCol;col++){
    const hv=ws.getRow(bestRow).getCell(col).value;
    if(hv!=null&&String(hv).trim()!=='')continue;
    let hasData=false;
    for(let r=bestRow+1;r<=Math.min(ws.rowCount,bestRow+400);r++){
      const v=ws.getRow(r).getCell(col).value;
      if(v!=null&&String(v).trim()!==''){hasData=true;break;}
    }
    if(hasData){
      let L='',n=col;while(n>0){const q=(n-1)%26;L=String.fromCharCode(65+q)+L;n=Math.floor((n-1)/26);}
      headless.push(L);
    }
  }
  for(let r=bestRow+1;r<=ws.rowCount;r++){
    const row={};let any=false;
    BATCH_COLS.forEach(c=>{
      const col=bestMap[c.k];if(!col)return;
      let v=ws.getRow(r).getCell(col).value;
      if(v&&typeof v==='object'){v=(v.result!=null?v.result:(v.text!=null?v.text:(v.richText?v.richText.map(t=>t.text).join(''):null)));}
      if(v==null||v==='')return;
      if(c.t==='n'){const n=parseFloat(String(v).replace(/,/g,''));if(isFinite(n)){row[c.k]=n;any=true;}}
      else{row[c.k]=String(v).trim();any=true;}
    });
    if(any&&(row.size||row.desc||row.mid!=null))rows.push(row);
  }
  if(!rows.length){toast('No data rows found');return;}
  if(!S.batch)S.batch={rows:[],Cb:1};
  S.batch.rows=rows;
  S.batch.src=file.name;
  S.batch.headerRow=bestRow;
  S.batch.mapped=Object.keys(bestMap);
  S.batch.unmapped=unmapped;
  S.batch.headless=headless;
  S.batch.filterFail=false;
  S.mode='batch';
  fullRebuild();
  toast('Imported '+rows.length+' member'+(rows.length===1?'':'s'));
}

  const names={tabSummary:'Summary',tabMx:'M\u2093 \u2014 Major Flexure',tabMy:'M\u1D67 \u2014 Minor Flexure',
    tabVx:'V\u2093 \u2014 Major Shear',tabVy:'V\u1D67 \u2014 Minor Shear',tabComp:'Compression',
    tabTors:'Torsion',tabJ10:'Concentrated Forces',tabInter:'Interaction',tabService:'Serviceability',tabSection:'Section Properties'};
  const F={tabSummary:buildSummaryTab,tabMx:buildMxTab,tabMy:buildMyTab,tabVx:buildVxTab,
    tabVy:buildVyTab,tabComp:buildCompTab,tabTors:buildTorsTab,tabJ10:buildJ10Tab,
    tabInter:buildInterTab,tabSection:buildSectionTab};
  let firstDone=!!(opts.front&&(P.summary||P.scope));
  try{
    for(const r of rows){
      const sec=el('div','prSec'+(firstDone?'':' first'));firstDone=true;
      const hdr='#'+(r.row.mid!=null?r.row.mid:'?')+(r.row.desc?('  \u2014  '+r.row.desc):'');
      sec.appendChild(prRunHdr(hdr+'  \u00B7  '+(r.lbl||'')));
      sec.appendChild(el('h1',null,hdr));
      if(r.blockers&&r.blockers.length){
        r.blockers.forEach(m=>sec.appendChild(el('div','errBox','<b>Not checked:</b> '+m)));
        pr.appendChild(sec);continue;
      }
      sec.appendChild(el('div','note','<b>'+r.lbl+'</b> \u00B7 '+r.p.mat.name+' \u00B7 F\u1D67 = '+fmt(r.Fy,0)+
        ' ksi \u00B7 L\u1D47 = '+fmt(r.Lbx,2)+' ft \u00B7 C\u1D47 = '+fmt(r.Cb,2)+
        ' \u00B7 L\u1D9C\u2093 = '+fmt(r.Lbx*r.kx,2)+' ft \u00B7 L\u1D9C\u1D67 = '+fmt(r.Lby*r.ky,2)+' ft'));
      sec.appendChild(el('div',r.status==='PASS'?'okBox':'errBox',
        'Governing: <b>'+(r.gov||'\u2014')+'</b> \u2014 DCR = '+(r.govDCR!=null?fmt(r.govDCR,3):'\u2014')+
        '   \u2192   <b>'+r.status+'</b>'));
      applyRowToState(r);
      computeAll();
      order.forEach(id=>{
        if(!P.secs[id])return;
        const h=el('div');
        h.appendChild(el('h2','manH',names[id]));
        resetSecNum();
        try{F[id](h);}catch(e){h.appendChild(el('div','errBox','Section failed: '+e.message));}
        sec.appendChild(h);
      });
      pr.appendChild(sec);
    }
  }finally{
    S=JSON.parse(saved);
    computeAll();
  }
  pr.querySelectorAll('.secBody').forEach(b=>{b.style.display='block';});
  await rasterisePlots(pr,null);
  markShortSections(pr);
  pr.appendChild(el('div','prFoot','<span>'+(S.proj.name||'')+' \u2014 Batch member check</span>'+
    '<span>Steel Beam Designer \u00B7 by '+(S.proj.by||'Mario Lococo')+' \u00B7 '+new Date().toISOString().slice(0,10)+'</span>'));
  const cleanup=()=>{const n=document.getElementById('printReport');if(n)n.remove();
    buildTabs();window.removeEventListener('afterprint',cleanup);};
  window.addEventListener('afterprint',cleanup);
  setTimeout(()=>{window.print();setTimeout(()=>{if(document.getElementById('printReport'))cleanup();},1500);},60);
  return pr;
}
/* =====================================================================
   GRAPHICS — Plotly, to scale
   A small registry lets the print path convert every live plot to a
   static image without each tab having to know about printing.
   ===================================================================== */
let PLOTREG={};
const PLOTCFG={responsive:true,displaylogo:false,
  modeBarButtonsToRemove:['select2d','lasso2d','autoScale2d'],
  toImageButtonOptions:{format:'png',scale:2}};
function plotHolder(parent,id,h){
  const d=el('div','plotHold');d.id=id;
  if(h)d.style.height=h+'px';
  parent.appendChild(d);return d;
}
function regPlot(id,fig,tries){
  PLOTREG[id]=fig;
  const n=tries||0;
  /* the holder is only in the document once mkSection has appended its
     section, and Plotly arrives from a deferred script — retry for both */
  const node=document.getElementById(id);
  if(typeof Plotly==='undefined'||!node){
    if(n>60)return;
    setTimeout(()=>regPlot(id,fig,n+1),typeof Plotly==='undefined'?300:30);
    return;
  }
  try{Plotly.react(id,fig.data,fig.layout,fig.config||PLOTCFG);}catch(e){}
}
/* ---------------------------------------------------------------------
   CROSS SECTION
   opts: {overlay:'none'|'e7'|'f7', title, compFlange:'top'|'bottom'|null}
   --------------------------------------------------------------------- */
function xsecGeom(p){
  const k=p._kind;
  if(k==='I'){
    const d=p.d,bf=p.bf,tf=p.tf,tw=p.tw;
    const x1=bf/2,y1=d/2,y2=d/2-tf,xw=tw/2;
    const P=[[-x1,y1],[x1,y1],[x1,y2],[xw,y2],[xw,-y2],[x1,-y2],[x1,-y1],[-x1,-y1],
             [-x1,-y2],[-xw,-y2],[-xw,y2],[-x1,y2]];
    return{paths:[P],W:bf,H:d,kind:k};
  }
  if(k==='C'){
    const d=p.d,bf=p.bf,tf=p.tf,tw=p.tw,xb=p.xbar||0;
    const P=[[0,d/2],[bf,d/2],[bf,d/2-tf],[tw,d/2-tf],[tw,-d/2+tf],[bf,-d/2+tf],
             [bf,-d/2],[0,-d/2]].map(q=>[q[0]-xb,q[1]]);
    return{paths:[P],W:bf,H:d,kind:k,xbar:xb};
  }
  if(k==='R'){
    const H=p.Ht,B=p.B,t=p.tdes;
    const ro=Math.min(2*t,Math.min(B,H)/2-1e-6),ri=Math.max(0,ro-t);
    const rr=(w,h,r)=>{
      const pts=[],n=8,x0=w/2-r,y0=h/2-r;
      const arc=(cx,cy,a0,a1)=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}};
      arc(x0,y0,0,Math.PI/2);arc(-x0,y0,Math.PI/2,Math.PI);
      arc(-x0,-y0,Math.PI,1.5*Math.PI);arc(x0,-y0,1.5*Math.PI,2*Math.PI);
      return pts;
    };
    return{paths:[rr(B,H,ro),rr(B-2*t,H-2*t,ri)],W:B,H,kind:k,hole:true};
  }
  const D=p.OD,t=p.tdes,n=72,o=[],i2=[];
  for(let i=0;i<=n;i++){const a=2*Math.PI*i/n;
    o.push([D/2*Math.cos(a),D/2*Math.sin(a)]);
    i2.push([(D/2-t)*Math.cos(a),(D/2-t)*Math.sin(a)]);}
  return{paths:[o,i2],W:D,H:D,kind:'P',hole:true};
}
function pathStr(pts){return 'M '+pts.map(q=>fmt(q[0],4)+','+fmt(q[1],4)).join(' L ')+' Z';}
function xsecFig(p,opts){
  opts=opts||{};
  const g=xsecGeom(p);
  const shapes=[],anns=[],data=[];
  const STEEL='#5B7290',EDGE='#16304F';
  shapes.push({type:'path',path:g.paths.map(pathStr).join(' '),
    fillcolor:STEEL,opacity:0.55,fillrule:'evenodd',
    line:{color:EDGE,width:1.6},layer:'below'});
  const pad=Math.max(g.W,g.H)*0.26;
  const xr=[-g.W/2-pad,g.W/2+pad],yr=[-g.H/2-pad*0.55,g.H/2+pad*0.55];
  /* ---- dimension helper ---- */
  const dimH=(x0,x1,y,txt)=>{
    shapes.push({type:'line',x0,x1,y0:y,y1:y,line:{color:'#64748B',width:1}});
    [x0,x1].forEach(x=>shapes.push({type:'line',x0:x,x1:x,y0:y-g.H*0.012,y1:y+g.H*0.012,line:{color:'#64748B',width:1}}));
    anns.push({x:(x0+x1)/2,y,text:txt,showarrow:false,yshift:9,font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.85)'});
  };
  const dimV=(y0,y1,x,txt)=>{
    shapes.push({type:'line',x0:x,x1:x,y0,y1,line:{color:'#64748B',width:1}});
    [y0,y1].forEach(y=>shapes.push({type:'line',x0:x-g.W*0.012,x1:x+g.W*0.012,y0:y,y1:y,line:{color:'#64748B',width:1}}));
    anns.push({x,y:(y0+y1)/2,text:txt,showarrow:false,textangle:-90,xshift:-10,
      font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.85)'});
  };
  const hov=[];
  const addHov=(x,y,t)=>hov.push({x,y,t});
  if(g.kind==='I'||g.kind==='C'){
    const d=p.d,bf=p.bf,tf=p.tf,tw=p.tw;
    const xL=(g.kind==='C')?-(g.xbar||0):-bf/2, xR=xL+bf;
    dimH(xL,xR,-d/2-pad*0.42,'b<sub>f</sub> = '+fmt(bf,2)+'"');
    dimV(-d/2,d/2,xR+pad*0.46,'d = '+fmt(d,2)+'"');
    anns.push({x:xR+bf*0.02,y:d/2-tf/2,ax:34,ay:-22,text:'t<sub>f</sub> = '+fmt(tf,3)+'"',
      showarrow:true,arrowhead:2,arrowsize:0.8,arrowcolor:'#64748B',font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.85)'});
    anns.push({x:(g.kind==='C'?(tw/2-(g.xbar||0)):0),y:0,ax:44,ay:0,text:'t<sub>w</sub> = '+fmt(tw,3)+'"',
      showarrow:true,arrowhead:2,arrowsize:0.8,arrowcolor:'#64748B',font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.85)'});
    if(p.kdes>0){
      [1,-1].forEach(s=>shapes.push({type:'line',x0:xL,x1:xR,y0:s*(d/2-p.kdes),y1:s*(d/2-p.kdes),
        line:{color:'#B45309',width:1,dash:'dot'}}));
      anns.push({x:xL+bf*0.06,y:d/2-p.kdes,text:'k = '+fmt(p.kdes,3)+'"',showarrow:false,
        yshift:-8,xanchor:'left',font:{size:8.5,color:'#B45309'},bgcolor:'rgba(255,255,255,.85)'});
      if(p.hClear)anns.push({x:xL+bf*0.06,y:0,text:'h = '+fmt(p.hClear,2)+'"',showarrow:false,
        xanchor:'left',font:{size:8.5,color:'#B45309'},bgcolor:'rgba(255,255,255,.85)'});
    }
    addHov(0,d/2-tf/2,'Top flange<br>b<sub>f</sub>/2t<sub>f</sub> = '+fmt(p.bf/(2*p.tf),2));
    addHov(0,0,'Web<br>h/t<sub>w</sub> = '+fmt(p.htw,2));
    if(g.kind==='C')addHov(0,-d/2+tf/2,'x\u0304 = '+fmt(p.xbar,3)+'"  (centroid at x = 0)');
  }else if(g.kind==='R'){
    dimH(-p.B/2,p.B/2,-p.Ht/2-pad*0.42,'B = '+fmt(p.B,2)+'"');
    dimV(-p.Ht/2,p.Ht/2,p.B/2+pad*0.46,'H = '+fmt(p.Ht,2)+'"');
    anns.push({x:p.B/2-p.tdes/2,y:0,ax:44,ay:0,text:'t = '+fmt(p.tdes,3)+'"',
      showarrow:true,arrowhead:2,arrowsize:0.8,arrowcolor:'#64748B',font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.85)'});
    dimH(-p.bFlat/2,p.bFlat/2,p.Ht/2-p.tdes*1.9,'b = B \u2212 3t = '+fmt(p.bFlat,2)+'"');
    addHov(0,p.Ht/2-p.tdes/2,'Flange (major)<br>b/t = '+fmt(p.btdes,2));
    addHov(p.B/2-p.tdes/2,0,'Web (major)<br>h/t = '+fmt(p.htdes,2));
  }else{
    dimH(-p.OD/2,p.OD/2,-p.OD/2-pad*0.42,'D = '+fmt(p.OD,3)+'"');
    anns.push({x:p.OD/2-p.tdes/2,y:0,ax:46,ay:-14,text:'t = '+fmt(p.tdes,3)+'"',
      showarrow:true,arrowhead:2,arrowsize:0.8,arrowcolor:'#64748B',font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.85)'});
    addHov(0,p.OD/2-p.tdes/2,'Wall<br>D/t = '+fmt(p.Dt,2));
  }
  /* ---- compression flange marker ---- */
  if(opts.compFlange&&(g.kind==='I'||g.kind==='C')){
    const s=opts.compFlange==='bottom'?-1:1;
    const xL=(g.kind==='C')?-(g.xbar||0):-p.bf/2;
    shapes.push({type:'rect',x0:xL,x1:xL+p.bf,y0:s*(p.d/2-p.tf),y1:s*p.d/2,
      fillcolor:'#B42318',opacity:0.30,line:{width:0}});
    anns.push({x:xL+p.bf/2,y:s*(p.d/2-p.tf/2),text:'compression flange',showarrow:false,
      font:{size:8.5,color:'#7A1710'},bgcolor:'rgba(255,255,255,.8)'});
  }
  /* ---- ineffective areas (E7 compression / F7 flexure) ---- */
  const inef=[];
  if(opts.overlay==='e7'&&opts.eff){
    opts.eff.forEach(e2=>{
      if(!(e2.red>0)||e2.b==null||e2.be==null)return;
      const gap=e2.b-e2.be;
      if(g.kind==='I'){
        if(/flange/i.test(e2.el)){
          [1,-1].forEach(sy=>[1,-1].forEach(sx=>{
            inef.push([sx*p.bf/2-sx*gap,sx*p.bf/2,sy*(p.d/2-p.tf),sy*p.d/2]);
          }));
        }else{
          inef.push([-p.tw/2,p.tw/2,-gap/2,gap/2]);
        }
      }else if(g.kind==='R'){
        if(/walls b/i.test(e2.el))[1,-1].forEach(sy=>inef.push([-gap/2,gap/2,sy*(p.Ht/2-p.tdes),sy*p.Ht/2]));
        else [1,-1].forEach(sx=>inef.push([sx*(p.B/2-p.tdes),sx*p.B/2,-gap/2,gap/2]));
      }
    });
  }
  if(opts.overlay==='f7'&&opts.f7&&opts.f7.be!=null&&g.kind==='R'){
    const gap=Math.max(0,p.bFlat-opts.f7.be);
    if(gap>0)inef.push([-gap/2,gap/2,p.Ht/2-p.tdes,p.Ht/2]);
  }
  inef.forEach(([x0,x1,y0,y1])=>{
    shapes.push({type:'rect',x0,x1,y0,y1,fillcolor:'#B42318',opacity:0.55,
      line:{color:'#7A1710',width:0.8}});
  });
  if(inef.length)anns.push({x:xr[0],y:yr[1],xanchor:'left',yanchor:'top',
    text:'\u25a0 ineffective (removed from A<sub>e</sub>)',showarrow:false,
    font:{size:8.5,color:'#7A1710'},bgcolor:'rgba(255,255,255,.85)'});
  data.push({x:hov.map(h=>h.x),y:hov.map(h=>h.y),mode:'markers',
    marker:{size:14,color:'rgba(0,0,0,0)'},hoverinfo:'text',
    text:hov.map(h=>h.t),showlegend:false});
  const layout={
    title:opts.title?{text:opts.title,font:{size:11,family:'Arial'},x:0}:undefined,
    margin:{l:26,r:26,t:opts.title?28:14,b:26},
    height:opts.height||330,
    xaxis:{range:xr,visible:false,fixedrange:false},
    yaxis:{range:yr,visible:false,scaleanchor:'x',scaleratio:1},
    shapes,annotations:anns,showlegend:false,
    paper_bgcolor:'#fff',plot_bgcolor:'#fff',hovermode:'closest'
  };
  return{data,layout};
}
function xsecBlock(body,p,opts){

/* ---------------------------------------------------------------------
   phi-Mn  vs  Lb   CAPACITY CURVE
   --------------------------------------------------------------------- */
function mnLbFig(p,opts){
  opts=opts||{};
  if(p._kind==='P')return null;
  const Cb=opts.Cb||1;
  const probe=flexFor(p,'x',12,1);
  if(probe.blocked)return null;
  const ltb=probe.ls.find(l=>l.name.indexOf('Lateral')>=0);
  const Lp=(ltb&&ltb.d&&ltb.d.Lp!=null)?ltb.d.Lp/12:null;
  const Lr=(ltb&&ltb.d&&ltb.d.Lr!=null)?ltb.d.Lr/12:null;
  const marks=(opts.marks||[]).filter(m=>m.L!=null&&isFinite(m.L));
  const maxMark=marks.length?Math.max.apply(null,marks.map(m=>m.L)):0;
  const Lmax=Math.max(Lr?Lr*1.6:20,maxMark*1.25,5);
  const N=140,xs=[],y1=[],y2=[];
  for(let i=0;i<=N;i++){
    const L=Lmax*i/N;
    const c1=flexFor(p,'x',L*12,1);
    y1.push(c1.blocked?null:c1.phiMn/12);
    if(Cb!==1){const c2=flexFor(p,'x',L*12,Cb);y2.push(c2.blocked?null:c2.phiMn/12);}
    xs.push(L);
  }
  const phiMp=0.9*probe.Mp/12;
  const data=[];
  if(Cb!==1)data.push({x:xs,y:y2,name:'\u03C6M<sub>n</sub> at C<sub>b</sub> = '+fmt(Cb,2),
    line:{color:'#046C4E',width:2.4},hovertemplate:'L<sub>b</sub> = %{x:.2f} ft<br>\u03C6M<sub>n</sub> = %{y:.1f} kip\u00B7ft<extra></extra>'});
  data.push({x:xs,y:y1,name:'\u03C6M<sub>n</sub> at C<sub>b</sub> = 1.0',
    line:{color:Cb!==1?'#9AA7B8':'#046C4E',width:Cb!==1?1.6:2.4,dash:Cb!==1?'dot':'solid'},
    hovertemplate:'L<sub>b</sub> = %{x:.2f} ft<br>\u03C6M<sub>n</sub> = %{y:.1f} kip\u00B7ft<extra></extra>'});
  const shapes=[],anns=[];
  const ymax=Math.max(phiMp,opts.Mu||0)*1.18;
  if(Lp!=null&&Lr!=null){
    shapes.push({type:'rect',x0:0,x1:Lp,y0:0,y1:ymax,fillcolor:'#E7F3EC',opacity:.55,line:{width:0},layer:'below'},
      {type:'rect',x0:Lp,x1:Math.min(Lr,Lmax),y0:0,y1:ymax,fillcolor:'#FDF3E3',opacity:.55,line:{width:0},layer:'below'},
      {type:'rect',x0:Math.min(Lr,Lmax),x1:Lmax,y0:0,y1:ymax,fillcolor:'#FBECEC',opacity:.55,line:{width:0},layer:'below'});
    [[Lp,'L<sub>p</sub> = '+fmt(Lp,2)+' ft'],[Lr,'L<sub>r</sub> = '+fmt(Lr,2)+' ft']].forEach(([L,t])=>{
      if(L>Lmax)return;
      shapes.push({type:'line',x0:L,x1:L,y0:0,y1:ymax,line:{color:'#64748B',width:1,dash:'dash'}});
      anns.push({x:L,y:ymax,text:t,showarrow:false,yanchor:'top',yshift:-2,
        font:{size:9,color:'#334155'},bgcolor:'rgba(255,255,255,.85)'});
    });
    anns.push({x:Lp/2,y:ymax*0.06,text:'yielding',showarrow:false,font:{size:8.5,color:'#046C4E'}},
      {x:(Lp+Math.min(Lr,Lmax))/2,y:ymax*0.06,text:'inelastic LTB',showarrow:false,font:{size:8.5,color:'#B45309'}});
    if(Lr<Lmax)anns.push({x:(Lr+Lmax)/2,y:ymax*0.06,text:'elastic LTB',showarrow:false,font:{size:8.5,color:'#B42318'}});
  }
  shapes.push({type:'line',x0:0,x1:Lmax,y0:phiMp,y1:phiMp,line:{color:'#9AA7B8',width:1,dash:'dot'}});
  anns.push({x:Lmax,y:phiMp,text:'\u03C6M<sub>p</sub> = '+fmt(phiMp,1),showarrow:false,
    xanchor:'right',yshift:9,font:{size:9,color:'#5A6B80'},bgcolor:'rgba(255,255,255,.85)'});
  if(opts.Mu>0){
    shapes.push({type:'line',x0:0,x1:Lmax,y0:opts.Mu,y1:opts.Mu,line:{color:'#B42318',width:1.6,dash:'dash'}});
    anns.push({x:0,y:opts.Mu,text:'M<sub>u</sub> = '+fmt(opts.Mu,1),showarrow:false,xanchor:'left',
      yshift:9,font:{size:9,color:'#B42318'},bgcolor:'rgba(255,255,255,.85)'});
  }
  const PAL=['#1D4ED8','#7C3AED','#B45309'];
  marks.forEach((m,i)=>{
    const c=flexFor(p,'x',m.L*12,m.Cb!=null?m.Cb:Cb);
    if(c.blocked)return;
    const v=c.phiMn/12;
    data.push({x:[m.L],y:[v],mode:'markers+text',name:m.name,
      marker:{size:11,color:PAL[i%PAL.length],symbol:'diamond',line:{color:'#fff',width:1.5}},
      text:[' '+fmt(v,1)],textposition:'middle right',textfont:{size:9,color:PAL[i%PAL.length]},
      hovertemplate:m.name+'<br>L<sub>b</sub> = %{x:.2f} ft<br>\u03C6M<sub>n</sub> = %{y:.1f} kip\u00B7ft<extra></extra>'});
  });
  return{data,layout:{
    title:{text:opts.title||'Design flexural strength vs unbraced length',font:{size:11,family:'Arial'},x:0},
    margin:{l:58,r:16,t:30,b:40},height:opts.height||320,
    xaxis:{title:{text:'L<sub>b</sub> (ft)',font:{size:9.5}},range:[0,Lmax],gridcolor:'#EEF1F5',zeroline:false},
    yaxis:{title:{text:'\u03C6M<sub>n</sub> (kip\u00B7ft)',font:{size:9.5}},range:[0,ymax],gridcolor:'#EEF1F5'},
    shapes,annotations:anns,
    legend:{font:{size:8.5},orientation:'h',y:1.16,x:1,xanchor:'right'},
    paper_bgcolor:'#fff',plot_bgcolor:'#fff',hovermode:'closest'}};
}
function mnLbBlock(body,p,opts){
  const fig=mnLbFig(p,opts);
  if(!fig){
    body.appendChild(el('div','hint',p._kind==='P'?
      'Round sections are not subject to lateral-torsional buckling (\u00A7F8), so \u03C6M\u2099 does not vary with L\u1D47.':
      'Capacity curve unavailable for this section.'));
    return;
  }
  const id=(opts&&opts.id)||('mnlb_'+Math.random().toString(36).slice(2,8));
  plotHolder(body,id,(opts&&opts.height)||320);
  regPlot(id,fig);
  body.appendChild(el('div','hint','Every point on this curve is produced by the same \u00A7F2\u2013F7 code that generates the numbers above \u2014 it is the capacity re-evaluated at each L\u1D47, not a sketch. Diamonds mark the bracing actually used.'));
}
/* =====================================================================
   COMPOSITE BEAMS — AISC 360-16 Chapter I  (positive moment, LRFD)
   Plastic stress distribution per §I3.2a and Commentary Fig. C-I3.3,
   steel headed stud anchors per §I8.2a, lower-bound I per Manual Part 3.
   ===================================================================== */
const DECK_ORIENT={perp:'Deck ribs perpendicular to the beam',
  para:'Deck ribs parallel to the beam',none:'No deck \u2014 solid slab'};
const STUD_POS={weak:'Weak position (e_mid-ht < 2 in.)',strong:'Strong position (e_mid-ht \u2265 2 in.)'};
/* ---- §I8.2a shear stud strength ---- */
function studQn(cfg,p){
  const D=cfg.dia||0.75,Asa=Math.PI*D*D/4;
  const Fu=cfg.Fu||65,fc=cfg.fc||4,wc=cfg.wc||145;
  /* §I2.1b:  Ec = wc^1.5 * sqrt(f'c)  with wc in lb/ft3 and f'c in ksi -> ksi */
  const EcKsi=Math.pow(wc,1.5)*Math.sqrt(fc);
  let Rg=1.0,Rp=0.75,note='';
  if(cfg.orient==='none'){Rg=1.0;Rp=0.75;note='no decking';}
  else if(cfg.orient==='para'){
    const r=(cfg.hr>0)?(cfg.wr/cfg.hr):2;
    Rg=(r>=1.5)?1.0:0.85;Rp=0.75;
    note='deck parallel, w\u1D63/h\u1D63 = '+fmt(r,2)+(r>=1.5?' \u2265 1.5':' < 1.5');
  }else{
    const n=Math.max(1,Math.round(cfg.nRib||1));
    Rg=(n===1)?1.0:(n===2?0.85:0.70);
    const e=(cfg.emid!=null)?cfg.emid:((cfg.pos==='strong')?2.5:1.0);
    Rp=(e>=2.0)?0.75:0.60;
    note='deck perpendicular, '+n+' stud'+(n===1?'':'s')+' per rib, e_mid-ht = '+fmt(e,2)+
      ' in '+(e>=2?'\u2265':'<')+' 2 in \u2192 '+(e>=2?'strong':'weak')+' position';
  }
  const q1=0.5*Asa*Math.sqrt(fc*EcKsi);
  const q2=Rg*Rp*Asa*Fu;
  return{Asa,Ec:EcKsi,Rg,Rp,note,q1,q2,Qn:Math.min(q1,q2),governs:q1<=q2?'0.5A\u209B\u2090\u221A(f\u2032\u1D9CE\u1D9C)':'R\u1D4DR\u209aA\u209b\u2090F\u1d64'};
}
/* ---- §I3.1a effective width ---- */
function effWidth(cfg){
  const L=cfg.L||0,sL=cfg.sLeft,sR=cfg.sRight,eL=cfg.edgeLeft,eR=cfg.edgeRight;
  const side=(spacing,edge)=>{
    const cand=[{v:L/8,src:'L/8'}];
    if(spacing!=null&&spacing>0)cand.push({v:spacing/2,src:'half beam spacing'});
    if(edge!=null&&edge>0)cand.push({v:edge,src:'distance to slab edge'});
    return cand.reduce((m,c)=>c.v<m.v?c:m,cand[0]);
  };
  const a=side(sL,eL),b=side(sR,eR);
  return{left:a,right:b,beff:(a.v+b.v)*12,beffFt:a.v+b.v};
}
/* ---- concrete area within the effective width ---- */
function slabGeom(cfg){
  const hr=(cfg.orient==='none')?0:(cfg.hr||0);
  const tSolid=(cfg.tSolid!=null)?cfg.tSolid:((cfg.tSlab||0)-hr); /* migrate old Ycon-style input */
  const haunch=cfg.haunch||0;
  return{tSolid,hr,haunch,Ycon:tSolid+hr+haunch};
}
function slabArea(cfg,beff){
  const g=slabGeom(cfg);
  const tAbove=g.tSolid;
  const fill=(cfg.orient==='perp')?(cfg.ribFill!=null?cfg.ribFill:0.5):
             (cfg.orient==='para')?(cfg.ribFill!=null?cfg.ribFill:1.0):0;
  const hr=g.hr;
  return{tAbove,hr,fill,haunch:g.haunch,Ycon:g.Ycon,Ac:beff*(tAbove+hr*fill),
    note:hr>0?('slab above deck '+fmt(tAbove,2)+' in plus '+fmt(100*fill,0)+'% of the '+fmt(hr,2)+' in ribs'):'solid slab'};
}
/* ---- §I3.2a plastic flexural strength ---- */
function compositeMn(p,cfg){
  const out={warns:[],blocked:null};
  if(p._kind!=='I'){out.blocked='Composite design here covers I-shaped steel beams (\u00A7I3.2). Other section types are outside this module.';return out;}
  const Fy=p.mat.Fy,E=EKSI;
  const lim=3.76*Math.sqrt(E/Fy);
  out.htw=p.htw;out.htwLim=lim;
  if(p.htw>lim){out.blocked='h/t\u1D65 = '+fmt(p.htw,1)+' > 3.76\u221A(E/F\u1D67) = '+fmt(lim,1)+
    ' \u2014 the plastic stress distribution of \u00A7I3.2a(1) does not apply; \u00A7I3.2a(2) (elastic distribution) is not implemented.';return out;}
  const ew=effWidth(cfg);out.ew=ew;
  /* user-stated effective width overrides §I3.1a, but never silently */
  if(cfg.beffOvr>0){
    ew.override=cfg.beffOvr;
    ew.codeFt=ew.beffFt;
    if(cfg.beffOvr>ew.beffFt+1e-6)
      out.warns.push('The stated effective width of '+fmt(cfg.beffOvr,2)+
        ' ft exceeds the \u00A7I3.1a limit of '+fmt(ew.beffFt,2)+
        ' ft (governed by '+ew.left.src+' each side). The larger value is being used because you entered it \u2014 justify it or clear the override.');
    ew.beffFt=cfg.beffOvr;ew.beff=cfg.beffOvr*12;
  }
  const beff=ew.beff;
  const sa=slabArea(cfg,beff);out.sa=sa;
  const fc=cfg.fc||4;
  out.Cconc=0.85*fc*sa.Ac;
  out.Py=p.A*Fy;out.Csteel=out.Py;
  const Cmax=Math.min(out.Cconc,out.Csteel);
  out.Cmax=Cmax;
  /* horizontal shear transferred */
  let C;
  if(cfg.mode==='pct'){C=Cmax*Math.max(0,Math.min(1,(cfg.pct!=null?cfg.pct:100)/100));out.pctSet=cfg.pct;}
  else{
    const st=studQn(cfg,p);out.stud=st;
    const n=Math.max(0,Math.round(cfg.nStuds||0));
    out.nStudsHalf=n;out.SQn=n*st.Qn;
    C=Math.min(out.SQn,Cmax);
  }
  out.C=C;
  out.pct=Cmax>0?100*C/Cmax:0;
  out.full=(C>=Cmax-1e-6);
  if(out.pct<25&&!out.full)out.warns.push('Composite action is '+fmt(out.pct,0)+
    '% \u2014 below the 25% commonly taken as the practical lower limit for partial composite action (\u00A7I3.2d Commentary); slip and deflection may govern.');
  /* compression block */
  const a=C/(0.85*fc*beff);
  out.a=a;
  if(a>sa.tAbove+1e-9)out.warns.push('The compression block a = '+fmt(a,2)+
    ' in extends below the top of the deck (solid slab depth '+fmt(sa.tAbove,2)+
    ' in). The rectangular-block assumption is no longer exact; verify by hand.');
  out.Ycon=sa.Ycon;
  out.d1=out.Ycon-a/2;
  /* steel in compression */
  const Cs=Math.max(0,(out.Py-C)/2);
  out.Cs=Cs;
  const Aflg=p.bf*p.tf;
  let x,d2,where;
  if(Cs<=1e-9){x=0;d2=0;where='in the slab \u2014 whole steel section in tension';}
  else if(Cs<=Aflg*Fy+1e-9){
    x=Cs/(p.bf*Fy);d2=x/2;where='in the top flange (x = '+fmt(x,3)+' in \u2264 t\u1DA0 = '+fmt(p.tf,3)+' in)';
  }else{
    const Aw=(Cs-Aflg*Fy)/Fy;const xw=Aw/p.tw;
    x=p.tf+xw;
    d2=(Aflg*(p.tf/2)+p.tw*xw*(p.tf+xw/2))/(Aflg+p.tw*xw);
    where='in the web (x = '+fmt(x,3)+' in > t\u1DA0 = '+fmt(p.tf,3)+' in)';
    out.warns.push('The plastic neutral axis falls in the web \u2014 permitted, but check that the composite percentage is intentional.');
  }
  out.x=x;out.d2=d2;out.pnaWhere=where;
  out.d3=p.d/2;
  out.Mn=C*(out.d1+d2)+out.Py*(out.d3-d2);   /* kip·in, Comm. Eq. C-I3-10 */
  out.phiMn=0.90*out.Mn;
  /* lower-bound moment of inertia (Manual Part 3) */
  const lb=ilbCalc(p,C,out.d1,Fy);
  out.QF=lb.QF;out.YENA=lb.YENA;out.ILB=lb.ILB;
  return out;
}
/* ---- lower-bound moment of inertia, Manual Part 3 ---- */
function ilbCalc(p,C,d1,Fy){
  const QF=C/Fy,d3=p.d/2;
  const YENA=(p.A*d3+QF*(2*d3+d1))/(p.A+QF);
  return{QF,YENA,d3,ILB:p.Ix+p.A*Math.pow(YENA-d3,2)+QF*Math.pow(2*d3+d1-YENA,2)};
}
/* ---- §I1.3, §I3.2c and §I8 deck and anchor requirements ---- */
function compositeDetailing(p,cfg,r){
  const g=slabGeom(cfg),out=[];
  const add=(item,req,val,ok,clause)=>out.push({item,req,val,ok,clause});
  const fc=cfg.fc||4;
  add('Concrete strength','3 ksi \u2264 f\u2032\u1D9C \u2264 10 ksi',fmt(fc,2)+' ksi',fc>=3&&fc<=10,'\u00A7I1.3');
  if(g.hr>0){
    add('Deck rib height','h\u1D63 \u2264 3 in',fmt(g.hr,2)+' in',g.hr<=3.0,'\u00A7I3.2c');
    add('Average rib width','w\u1D63 \u2265 2 in',fmt(cfg.wr||0,2)+' in',(cfg.wr||0)>=2.0,'\u00A7I3.2c');
  }
  add('Solid slab above deck','t \u2265 2 in',fmt(g.tSolid,2)+' in',g.tSolid>=2.0,'\u00A7I3.2c');
  {
    const d=cfg.dia||0.75;
    add('Stud diameter','d\u209b\u2090 \u2264 \u00BE in',fmt(d,3)+' in',d<=0.75+1e-9,'\u00A7I3.2c');
    if(!cfg.overWeb)add('Stud diameter vs flange','d\u209b\u2090 \u2264 2.5t\u1DA0 = '+fmt(2.5*p.tf,3)+' in',fmt(d,3)+' in',
      d<=2.5*p.tf+1e-9,'\u00A7I8.1 (not welded over the web)');
    const Ls=cfg.studLen;
    if(Ls>0){
      add('Stud length above deck','\u2265 h\u1D63 + 1\u00BD in = '+fmt(g.hr+1.5,2)+' in',fmt(Ls,2)+' in',Ls>=g.hr+1.5-1e-9,'\u00A7I3.2c');
      add('Stud length','L \u2265 4d\u209b\u2090 = '+fmt(4*d,2)+' in',fmt(Ls,2)+' in',Ls>=4*d-1e-9,'\u00A7I8.1');
      const cov=g.Ycon-g.haunch-Ls;
      add('Cover above stud','\u2265 \u00BD in',fmt(cov,2)+' in',cov>=0.5-1e-9,'\u00A7I3.2c');
    }
    const s=cfg.pitch;
    if(s>0){
      add('Stud spacing, minimum','\u2265 6d\u209b\u2090 = '+fmt(6*d,2)+' in',fmt(s,2)+' in',s>=6*d-1e-9,'\u00A7I8.2d');
      const smax=Math.min(8*g.Ycon,36);
      add('Stud spacing, maximum','\u2264 min(8\u00D7slab, 36 in) = '+fmt(smax,2)+' in',fmt(s,2)+' in',s<=smax+1e-9,'\u00A7I8.2d');
    }
  }
  return out;
}

/* =====================================================================
   COMPOSITE — state, inputs, design pass, tab
   ===================================================================== */
function compCfg(){
  if(!S.composite)S.composite={};
  const c=S.composite;
  const d={on:false,L:null,sLeft:10,sRight:10,edgeLeft:null,edgeRight:null,
    tSolid:4.5,hr:3.0,haunch:0,orient:'perp',ribFill:null,fc:4,wc:145,beffOvr:null,
    mode:'pct',pct:100,nStuds:null,dia:0.75,Fu:65,nRib:1,emid:2.0,wr:6,
    studLen:null,pitch:null,overWeb:false};
  Object.keys(d).forEach(k=>{if(c[k]===undefined)c[k]=d[k];});
  if(c.tSlab!=null&&c.tSolid==null)c.tSolid=c.tSlab-((c.orient==='none')?0:(c.hr||0));
  return c;
}
function isComposite(){const c=compCfg();return !!c.on;}

  }
  fRow(body,'Solid concrete ABOVE the deck',numInput(()=>c.tSolid,v=>{c.tSolid=v;},0.5,'cpTs'),'in','not the total slab depth');
  {

      ' = <b>'+fmt(g.Ycon,2)+' in</b>'));
  }
  if(c.orient!=='none')
    fRow(body,'Rib concrete included in A\u1D9C',numInput(()=>c.ribFill,v=>{c.ribFill=v;},0.05,'cpFill'),'\u2014',
      'fraction of the rib depth counted; blank \u2192 '+(c.orient==='perp'?'0.50':'1.00')+'. Enter 0 to neglect the ribs entirely.');
  fRow(body,'Concrete strength  f\u2032\u1D9C',numInput(()=>c.fc,v=>{c.fc=v;},0.5,'cpFc'),'ksi');
  fRow(body,'Concrete unit weight  w\u1D9C',numInput(()=>c.wc,v=>{c.wc=v;},5,'cpWc'),'lb/ft\u00B3','145 normal weight, 110\u2013115 lightweight');
  body.appendChild(el('div','hint','<b>Horizontal shear transfer</b>'));
  fRow(body,'Basis',selInput(['pct','studs'],()=>c.mode,v=>{c.mode=v;rebuildInputs();schedule(false);},
    o=>o==='pct'?'Composite percentage':'Stud count and \u00A7I8.2a strength',null,'cpMode'),'');
  if(c.mode==='pct')fRow(body,'Composite action',numInput(()=>c.pct,v=>{c.pct=v;},5,'cpPct'),'%','100% = full composite');
  else fRow(body,'Studs each side of max moment',numInput(()=>c.nStuds,v=>{c.nStuds=v;},1,'cpN'),'\u2014');
  {
    body.appendChild(el('div','hint','<b>Stud details</b> \u2014 used for Q\u2099 in stud mode, and for the \u00A7I3.2c / \u00A7I8 detailing checks in either mode.'));
    fRow(body,'Stud diameter',numInput(()=>c.dia,v=>{c.dia=v;},0.125,'cpD'),'in');
    fRow(body,'Stud F\u1D64',numInput(()=>c.Fu,v=>{c.Fu=v;},5,'cpFu'),'ksi','65 ksi typical');
    if(c.orient==='perp'){
      fRow(body,'Studs per rib',numInput(()=>c.nRib,v=>{c.nRib=v;},1,'cpNR'),'\u2014','1 \u2192 R\u1D4D = 1.0, 2 \u2192 0.85, \u22653 \u2192 0.70');
      fRow(body,'e_mid-ht',numInput(()=>c.emid,v=>{c.emid=v;},0.25,'cpEm'),'in',
        'stud shank to the deck web at mid-rib height, in the load-bearing direction. \u2265 2 in \u2192 R\u209a = 0.75 (strong), otherwise 0.60 (weak).');
    }
    fRow(body,'Stud length after welding',numInput(()=>c.studLen,v=>{c.studLen=v;},0.5,'cpLs'),'in','for the \u00A7I3.2c / \u00A7I8.1 detailing checks');
    fRow(body,'Stud pitch along the beam',numInput(()=>c.pitch,v=>{c.pitch=v;},1,'cpPitch'),'in','for the \u00A7I8.2d spacing limits');
    fRow(body,'Studs welded over the web',chkInput(()=>c.overWeb,v=>{c.overWeb=v;},'cpOW'),'','waives the d\u209b\u2090 \u2264 2.5t\u1DA0 limit of \u00A7I8.1');
  }
  if(typeof postCompInputs==='function')postCompInputs(body);
  if(typeof constrInputs==='function')constrInputs(body);
  body.appendChild(el('div','hint','Composite action is used for <b>positive moment only</b>; the negative-moment capacity is always the bare steel section.'));
}
