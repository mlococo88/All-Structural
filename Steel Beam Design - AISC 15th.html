MANUAL.p0.blocks=[
{h:'0.1 What this program does'},
{p:'This program models a single-line, multi-span continuous steel beam, solves it by the direct stiffness method for user-defined load cases and LRFD combinations, generates line loads from tributary areas, computes service deflections against per-span limits, and performs <b>AISC 360-16 LRFD strength checks</b>: element classification (Table B4.1), major-axis flexure with top/bottom-flange bracing logic and C\u1D47 (F2\u2013F5, F7, F8), minor-axis flexure (F6/F7), shear (G2, G4, G5, G6), axial compression from manually entered P\u1D64 (E3, E4, E7), combined-force interaction (H1), HSS torsion (H3), and web local yielding/crippling at concentrated forces (J10.2/J10.3). Sections: W, M, S, HP, C, MC, rectangular and round HSS, and pipe from the embedded '+DBVER+'.'},
{key:'Analysis demands (M\u2093, V\u2093, reactions) come from the beam model. Axial force, minor-axis moment/shear, and torsion are <b>manual per-combination inputs</b> \u2014 the model is planar and cannot generate them. They are flagged with imported-value styling everywhere they appear.'},
{h:'0.2 What this app does NOT do'},
{ul:[
'<b>No axial/lateral analysis.</b> P\u1D64, M\u1D64\u1D67, V\u1D64\u1D67, T\u1D64 are user-entered per combination, and second-order amplification (B2) must already be included in them. The app performs no P-\u0394/P-\u03B4 amplification.',
'<b>No axial checks on channels.</b> Singly symmetric flexural-torsional buckling (E4 for C/MC) is out of scope; entering P\u1D64 on a channel raises an explicit block, never a silent pass.',
'<b>No torsion on open sections.</b> I- and C-shape torsion requires AISC Design Guide 9 and is refused with a message; HSS torsion is checked per H3.',
'<b>No sidesway web buckling check (J10.4).</b> It depends on flange rotational restraint conditions not modeled here \u2014 verify separately where the compression flange is not restrained against rotation.',
'<b>No tension checks</b> (member is a beam/beam-column in compression by scope).',
'<b>No composite action, moving/pattern load automation, unbalanced snow generation, support settlement, springs, haunches, vibration, ponding, fatigue, or fire checks.</b> Pattern live load on continuous beams remains the user\u2019s responsibility (\u00A70.3).',
'<b>No noncompact/slender-element channels, slender-web HSS in flexure, or round sections beyond D/t = 0.45E/F\u1D67</b> \u2014 each raises an explicit block.'
]},
{h:'0.3 Known limitations and assumptions'},
{h3:'Bracing model'},
{p:'Bracing is entered as unbraced lengths, not brace coordinates. The engine splits each combination\u2019s moment diagram into sign regions, assigns the compression flange (top for M > 0, bottom for M < 0), and applies the corresponding L\u1D47. Inflection points are never treated as brace points; the default bottom-flange L\u1D47 is the longest span (support-to-support). In calculated-C\u1D47 mode, a window of length L\u1D47 slides through each region and the worst-DCR window governs \u2014 valid for any physical brace layout at that spacing, and never less conservative than a stated brace layout would allow. Regions touching a free (cantilever) end force C\u1D47 = 1.'},
{h3:'One-way tributary model'},
{p:'The load generator treats the deck as simply supported strips delivering p\u00D7TW. Deck continuity over the beam (which can raise the delivered reaction up to ~25%) is neglected \u2014 the standard office convention, disclosed here.'},
{h3:'Pattern live load'},
{p:'Uniform live load on all spans under-predicts both peak positive moments (alternate-span pattern) and support moments (adjacent-span pattern) in continuous beams. Build additional live cases and combinations when pattern effects matter.'},
{h3:'Euler-Bernoulli bending; deflection integration'},
{p:'Shear deformation neglected (error < ~3% at span/depth \u2265 10). Deflections integrate M/EI numerically (600 stations); interior-support residuals are reported on the Validation tab.'},
{h3:'Section resolution'},
{p:'Slenderness ratios are always recomputed from resolved geometry, so overrides propagate consistently; HSS flats use b = B \u2212 3t; A500 design wall = 0.93t\u2099\u2092\u2098, A1085 uses t\u2099\u2092\u2098.'},
{warn:'<b>This application is an engineering aid, not a substitute for engineering judgment.</b> The user is responsible for the design, for the manually entered demands, for load factors versus the governing code edition, and for independent review by a licensed engineer.'}
];
MANUAL.p5.blocks=[
{p:'Two live test families run through the production code on every view of the Validation tab:'},
{ul:[
'<b>Analysis benchmarks</b> \u2014 six closed-form models (simple, fixed-fixed, propped, two-span, cantilever) checked for R, V, M and \u03B4 with 0.5\u20131.5% tolerances, plus a \u03A3R = \u03A3F equilibrium check on every combination.',
'<b>AISC Design Example checks</b> \u2014 the capacity engine is compared against published results: F.1-1B/2B/3B (W18\u00D750: \u03C6M\u2099 = 379 kip\u00B7ft; M\u2099 = 4,060 kip\u00B7in at L\u1D47 = 11.7 ft; F\u1D9C\u02B3 = 43.2 ksi and M\u2099 = 3,840 kip\u00B7in at 17.5 ft), F.2-2B (C15\u00D733.9 channel c factor: M\u2099 = 1,740 kip\u00B7in), F.7B (HSS10\u00D76\u00D7\u2075\u2044\u2081\u2086 noncompact flange: \u03C6M\u2099 = 57.0 kip\u00B7ft), F.9B (Pipe 8 X-Strong: M\u2099 = 1,090 kip\u00B7in), G.1A (W24\u00D762: \u03C6V\u2099 = 306 kip at \u03C6 = 1.00), H.5 (HSS6\u00D74\u00D7\u00BC: \u03C6V\u2099 = 61.4 kip, \u03C6M\u2099 = 353 kip\u00B7in, \u03C6T\u2099 = 251 kip\u00B7in), and E.1C (W14\u00D7132: \u03C6P\u2099 = 892 kip at L\u1D9C = 30 ft). The published examples are v14.0 (AISC 360-10); the governing equations are unchanged in 360-16 for every case used.'
]},
{note:'Routes without an embedded published anchor \u2014 F3\u2013F5, F6, G5/G6, E4/E7, J10, H1 composition \u2014 are direct transcriptions of the Specification equations, exercised in code but flagged on the Validation tab for independent hand-checking before production reliance.'}
];
manPart('pS','V-b. Strength Methodology',[
{h:'Flexure (Chapter F)'},
{p:'Route selection follows classification: compact web + compact flange \u2192 F2; noncompact/slender flange \u2192 F3; noncompact web \u2192 F4; slender web \u2192 F5 (doubly symmetric only). Channels use F2 with c = (h\u2092/2)\u221A(I\u1D67/C\u1D65) in L\u1D63 and F\u1D9C\u02B3. Rectangular HSS use F7 (yielding, flange/web local buckling incl. effective-width S\u2091 for slender flanges, and LTB per F7.4); round sections use F8. Minor axis: F6 (I/C, with the 1.6F\u1D67S\u1D67 cap) or F7 about the weak axis.'},
{eqn:['M_n=C_b\\left[M_p-(M_p-0.7F_yS_x)\\tfrac{L_b-L_p}{L_r-L_p}\\right]\\le M_p','Inelastic LTB (F2-2); elastic LTB per F2-3/F2-4 with r_{ts}, J, h_o from the database. C\u1D47 from Eq. F1-1 quarter-point moments of the governing window (calculated mode) or 1.0 (default).']},
{h:'Shear (Chapter G)'},
{p:'Rolled I-shapes with h/t\u1D65 \u2264 2.24\u221A(E/F\u1D67) take \u03C6\u1D65 = 1.00 with C\u1D65\u2081 = 1 (G2.1(a)); otherwise G2.1(b) with k\u1D65 = 5.34. Channels always use G2.1(b) at \u03C6 = 0.90. Rectangular HSS: G4 with A\u1D65 = 2ht and k\u1D65 = 5. Round: G5 with L\u1D65 taken per combination as the distance from the maximum-shear station to the nearest V = 0 station. Weak axis: G6 over both flanges with k\u1D65 = 1.2 (I/C) or G4 with A\u1D65 = 2bt (HSS).'},
{h3:'Transverse stiffeners'},
{p:'Where a stiffener spacing <i>a</i> is entered, k\u1D65 = 5 + 5/(a/h)\u00B2 per Eq. G2-5, reverting to 5.34 when a/h > 3.0 (\u00A7G2.1(b)(2), AISC 360-16 \u2014 note this differs from 360-10, where the exception value was 5 and an additional [260/(h/t\u1D65)]\u00B2 limit applied). A single spacing is applied along the whole member; for panels of differing spacing, enter the largest <i>a</i> occurring where shear is critical, or check panels separately. <b>Tension field action (\u00A7G2.2) is never used</b> \u2014 the result is therefore conservative for interior panels of stiffened girders. The \u00A7G2.3 stiffener proportioning requirements (minimum I\u209B\u209C and the b/t limit) are reported for reference; the tool does not design or check the stiffener plate itself. Where a rolled I-shape already satisfies \u00A7G2.1(a), stiffeners cannot increase \u03C6V\u2099 and the output says so rather than implying a benefit.'},
{h:'Compression (Chapter E)'},
{p:'Flexural buckling about both axes (E3) with user L\u1D9C and K; torsional buckling (E4) added for doubly symmetric I-shapes using L\u1D9C\u1DBB. F\u1D9C\u02B3 = 0.658^(F\u1D67/F\u2091)F\u1D67 for F\u1D67/F\u2091 \u2264 2.25, else 0.877F\u2091.'},
{h3:'Slender compression elements \u2014 area, not stress'},
{p:'<b>AISC 360-16 eliminated the Q-factor.</b> Slenderness is taken on the <b>area</b>: P\u2099 = F\u1D9C\u02B3A\u2091 (Eq. E7-1), where A\u2091 is assembled from reduced effective widths b\u2091 (Eqs. E7-2 to E7-4, with c\u2081/c\u2082 = 0.22/1.49 for most elements and 0.20/1.38 for square and rectangular HSS walls; round sections use the closed-form effective area of \u00A7E7.2). F\u1D9C\u02B3 is computed from the <b>full</b> F\u1D67 and is not reduced.'},
{p:'This differs from AISC 360-10 and earlier, where F\u1D9C\u02B3 was reduced by Q = Q\u209B\u00B7Q\u2090 and applied to the gross area A\u1D4D. The AISC Design Examples v14.0 use the Q method, so compression results in this tool will not match those examples for slender-element sections \u2014 the difference is the Specification edition, not an error. It also removes the iteration the old method needed (f = P\u2099/A\u2091).'},
{p:'A slender classification does not automatically cost capacity: Eq. E7-2 gives b\u2091 = b whenever \u03BB \u2264 \u03BB\u1D63\u221A(F\u1D67/F\u1D9C\u02B3). Because the Table B4.1a limits are written at F\u1D67 while the element only ever reaches F\u1D9C\u02B3, the effective threshold is relaxed. The Compression tab reports the threshold alongside \u03BB and states plainly when a slender element yields no reduction.'},
{h:'Interaction (Chapter H)'},
{p:'H1-1a/H1-1b with M\u1D63\u2093/M\u1D9C\u2093 taken as the governing flexural DCR across regions (a safe composition since each region\u2019s DCR uses its own capacity). If T\u1D64 > 0.2\u03C6T\u2099 on an HSS, Eq. H3-6 replaces H1 with the shear ratio included; below the threshold, torsion is neglected per H3.2 and this is stated in the output.'},
{h:'Concentrated forces (J10)'},
{p:'Web local yielding (J10-2/3, \u03C6 = 1.00) and web local crippling (J10-4/5a/5b, \u03C6 = 0.75) are checked at every support and point load for I/C members when bearing lengths are provided; the end-region branch is selected from the geometry (distance \u2264 d, or \u2264 d/2 with the l\u1D47/d \u2264 0.2 split). Blank bearing lengths give an explicit N/A. Sidesway web buckling (J10.4) is not checked \u2014 see \u00A70.2.'},
{h3:'Rolled versus built-up I-shapes'},
{p:'The \u00A7G2.1(a) allowance of \u03C6\u1D65 = 1.00 with C\u1D651 = 1.0 is written for <b>rolled</b> I-shaped members only. Tick <i>Built-up (welded) section</i> in Section &amp; Material when overriding properties to model a plate girder; the shear check then falls to \u00A7G2.1(b) at \u03C6\u1D65 = 0.90 and states why. Leaving the flag off on a genuinely built-up member overstates the shear strength by about 11%.'},
{h3:'Torsion on open sections'},
{p:'An I-shape or channel carries torque by two mechanisms at once: pure (St-Venant) shear and <b>warping</b>. The split, and therefore the stresses, depend on the loading pattern and on how the ends are restrained against warping \u2014 so a torque magnitude alone is not sufficient input, and there is no closed-form \u03C6T\u2099 as there is for an HSS.'},
{p:'The tool solves EC\u1D65\u03B8\u2032\u2032\u2032\u2032 \u2212 GJ\u03B8\u2033 = t(z) exactly, segment by segment, for the case and end conditions stated (concentrated or uniformly distributed torque; warping-free \u201Cfork\u201D supports, warping-fixed ends, or a cantilever). It then forms the DG 9 stresses \u2014 \u03C4\u209C = Gt\u03B8\u2032, \u03C3\u1D65 = EW\u2099\u2092\u03B8\u2033, \u03C4\u1D65 = \u2212ES\u1D65\u2081\u03B8\u2034/t\u1DA0 \u2014 from the database warping properties W\u2099\u2092 and S\u1D65\u2081, and adds them to the axial, flexural and shear stresses at the critical station for the \u00A7H3.3 yielding check (f\u2099 \u2264 \u03C6F\u1D67 and f\u1D65 \u2264 \u03C6\u00B70.6F\u1D67, \u03C6 = 0.90). The characteristic length a = \u221A(EC\u1D65/GJ) sets which mechanism dominates: L/a below about 2 means warping controls, above about 10 means St-Venant controls.'},
{warn:'<b>No published worked example is embedded for this check.</b> Design Guide 9 is a separate document, so the Validation tab verifies the solver against an independent finite-difference solution of the same equation, two analytical limiting cases (C\u1D65\u21920 and J\u21920) and torsional equilibrium \u2014 all self-consistency checks rather than a published comparison. Verify against DG 9 by hand before relying on open-section torsion in production. Stresses are summed conservatively by magnitude at the critical station.'},
{h3:'Graphics'},
{p:'The cross section is drawn <b>to scale</b> from the resolved dimensions (Plotly with equal x and y scales), inline on the Section Properties, M\u2093 and Compression tabs. Rolled fillets are not drawn, so the outline encloses about 1\u20132% less area than the tabulated A\u1D4D for I-shapes and channels; HSS and pipe agree to better than 0.1%. Calculations always use the database properties, never the drawing.'},
{p:'Where the code removes material, the drawing shows it: the \u00A7E7 ineffective strips on the Compression tab and the \u00A7F7.2 effective-width strip on the M\u2093 tab are hatched, with the removed area stated. The Specification fixes the removed <i>area</i> but not its location, so the placement shown follows the usual convention (free edge for unstiffened elements, centred for stiffened ones) and is annotated as such.'},
{p:'The <b>\u03C6M\u2099 vs L\u1D47</b> curve on the M\u2093 tab is generated by calling the same \u00A7F2\u2013F7 routine at each unbraced length, so it is the capacity itself rather than a sketch of it. L\u209A and L\u1D63 are marked, the three regions shaded, \u03C6M\u209A and the governing M\u1D64 drawn as reference lines, and the bracing actually used marked with diamonds \u2014 which shows directly how much an added brace point would buy. Round sections are exempt from lateral-torsional buckling (\u00A7F8) and show a note instead of a curve.'},
{p:'All plots are converted to print-quality images in the printed report, including the per-member pages of a batch report.'},
{h:'Composite beams (Chapter I)'},
{p:'Ticking <i>Composite beam (Ch. I)</i> designs the section compositely for <b>positive moment</b>. The effective slab width follows \u00A7I3.1a (least of L/8, half the beam spacing, and the distance to the slab edge, taken each side); the concrete area within that width counts the solid slab above the deck plus a stated fraction of the ribs (0.50 perpendicular, 1.00 parallel by default, both editable).'},
{p:'The compressive force is the least of concrete crushing (0.85f\u2032\u1D9CA\u1D9C), steel yielding (A\u209bF\u1D67), and the horizontal shear transferred by the studs \u2014 entered either as a composite percentage or as a stud count with Q\u2099 computed from Eq. I8-1 with the R\u1D4D and R\u209a factors of \u00A7I8.2a. Flexural strength uses the plastic stress distribution of \u00A7I3.2a(1) (Commentary Eq. C-I3-10), with the plastic neutral axis located in the slab, the flange or the web as the force balance requires. The lower-bound moment of inertia I\u1D38\u1D2E for post-composite deflection follows Manual Part 3.'},
{p:'\u00A7I3.2a(1) is available only where h/t\u1D65 \u2264 3.76\u221A(E/F\u1D67); a section that fails that limit is blocked rather than switched silently to the elastic distribution of \u00A7I3.2a(2), which is not implemented.'},
{warn:'<b>Not checked in the composite module:</b> construction-stage strength and deflection on the bare steel section (unshored erection \u2014 switch composite off to check it), camber, stud detailing and spacing limits (\u00A7I8.2d), deck attachment (\u00A7I3.2c), negative-moment composite action with slab reinforcement (\u00A7I3.2b), concrete breakout, and ponding. Shear is always carried by the steel section alone and is checked on the V\u2093 tab.'},
{h3:'Slab geometry'},
{p:'The three depths are entered separately and stack from the top of the steel beam: haunch, deck rib height h\u1D63, and the solid concrete <b>above</b> the deck. Y\u1D9C\u2092\u2099 is their sum and is displayed as you type, so \u201Cslab thickness\u201D can never be confused with \u201Ctop of steel to top of slab\u201D. The fraction of rib concrete counted in A\u1D9C is an input: 0.50 and 1.00 are offered as defaults for perpendicular and parallel ribs, and 0 neglects the ribs entirely, which is the common conservative office practice. It only changes the answer when concrete crushing governs.'},
{h3:'R\u209a and e_mid-ht'},
{p:'For perpendicular ribs the position factor is taken from the code rule rather than a judgement call: R\u209a = 0.75 when e_mid-ht \u2265 2 in. and 0.60 below it, where e_mid-ht is the distance from the stud shank to the deck web at mid-rib height in the load-bearing direction. Intermediate values such as 0.70 do not appear in \u00A7I8.2a.'},
{h3:'Deck and anchor requirements'},
{p:'The \u00A7I1.3, \u00A7I3.2c and \u00A7I8 requirements are tabulated with the limit, the value provided and the clause: concrete strength range, rib height \u2264 3 in, average rib width \u2265 2 in, solid slab \u2265 2 in, stud diameter \u2264 \u00BE in and \u2264 2.5t\u1DA0 (waived when welded over the web), stud projection \u2265 h\u1D63 + 1\u00BD in, length \u2265 4d\u209b\u2090, cover \u2265 \u00BD in, and the \u00A7I8.2d spacing limits. Items whose input is blank are omitted rather than assumed to pass.'},
{h3:'Where composite output lives'},
{p:'Composite action does not get its own tab. The positive-moment capacity it produces is a major-axis flexural capacity, so the whole derivation \u2014 cross section, effective width, horizontal shear and stud strength, the plastic stress distribution, the deck and anchor requirements, and the pre-composite (construction) strength check \u2014 sits on the <b>M\u2093</b> tab immediately above the checks that consume it. The region table gains a <b>Basis</b> column naming Chapter I where the slab is in compression and Chapter F where it is in tension.'},
{p:'The stiffness consequences go where deflection lives: I\u1D38\u1D2E and the construction-stage deflection table are on the <b>Serviceability</b> tab, which member check mode now shows whenever composite action or a deflection check is enabled. Splitting it this way keeps every flexural quantity in one place and every deflection quantity in another, instead of splitting the derivation from the check.'},
{h3:'Construction stage'},
{p:'For <b>unshored</b> erection the bare steel section carries the wet concrete, and this frequently sizes the beam rather than the composite check. The stage loads are derived from the tributary width and the slab geometry (solid concrete plus the counted rib fraction plus haunch, at the stated unit weight), the deck weight and the beam self weight, with a construction live load defaulting to 25 psf per ASCE/SEI 37. The bare steel section is then checked for 1.2D + 1.6L flexure and shear at a stated construction unbraced length, and for deflection against the Design Guide 3 recommendation of the lesser of L/360 and 1 in, net of camber.'},
{p:'A <b>simple span</b> is assumed for the construction-stage moments, shears and deflections, and this is stated in the output. The construction unbraced length defaults to the full span, which is conservative: attached deck normally braces the compression flange, and a shorter L\u1D47 must be stated deliberately rather than assumed. Ticking <i>shored</i> omits the pre-composite strength rows and says why, since the shores carry the wet concrete and the whole dead load then acts on the composite section.'},
{p:'Loads applied after the concrete cures deflect on the lower-bound I\u1D38\u1D2E, not the bare I\u2093. The total-deflection row adds the residual pre-composite deflection net of camber, because that residual is locked into the finished floor; the composite rows are shown separately for limits intended to cover only post-pour loads.'},
{h3:'Composite stiffness in the deflection solver'},
{p:'In beam analysis mode the service deflection is solved twice and the curves summed: loads acting before the concrete cures deflect the <b>bare steel</b> section on I\u2093, and loads applied afterwards deflect the <b>composite</b> section on I\u1D38\u1D2E. Tick the loads that act after the pour in the composite input panel. The default is bare steel for <b>every</b> load, so the stiffness benefit is opted into deliberately rather than assumed \u2014 leave the slab, deck and self weight unticked. The Serviceability tab states which stiffness was used and lists the post-composite loads.'},
{h3:'One span, one bracing length'},
{p:'L\u1D47 is the unbraced length of the compression flange; the <b>span</b> is a different quantity, and every other calculation wants the span rather than L\u1D47. Member check mode therefore has a single <b>Member span L</b> field feeding the self-weight moment, the deflection check, the torsional span and the \u00A7I3.1a effective width \u2014 none of them ask separately. Beam analysis mode takes the span from the geometry. If no span is entered the tool falls back to L\u1D47 and says so, because on a beam braced at intervals that fallback is wrong: a 30 ft span braced at 6 ft centres would otherwise give an effective width of 1.5 ft instead of 7.5 ft.'},
{h3:'Tabs with no demand entered'},
{p:'A check with no demand still shows the available strength. The minor-shear, compression and HSS-torsion tabs display \u03C6V\u2099, \u03C6P\u2099 and \u03C6T\u2099 at the stated lengths even when nothing has been entered, so the capacity is there when you need it \u2014 while the check itself is still reported N/A on the dashboard. Where a route is genuinely unavailable the tab explains what applies instead: open-section torsion shows the characteristic length a = \u221A(EC\u1D65/GJ) and whether warping or St-Venant would dominate, \u00A7J10 with no bearing length tabulates \u03C6R\u2099 against a range of l\u1D47, an HSS points to Chapter K for the loaded face, and a channel with axial load explains why \u00A7E4 is out of scope.'},
{h3:'Schematic tab'},
{p:'The Schematic &amp; Inputs tab shows the member as well as the loading: the beam elevation to scale, the cross section to scale with its key dimensions, a section and material summary, and the bracing and design parameters actually in force \u2014 including whether the section is being treated as rolled or built-up, and what each unbraced length was defaulted from. It is the page to print when someone asks what was assumed.'},
{h3:'Sensitivity'},
{p:'The Summary tab perturbs each driving input by \u00B110% on its own and <b>re-solves the whole model</b> through the same engine that produced the results, so the reported change is an actual recomputed ratio rather than a derivative of a simplified expression. A tornado chart ranks the inputs by how far they move the governing demand/capacity ratio, with a dashed line at DCR = 1.00, and the table beneath gives the recomputed ratio each way.'},
{p:'Two things it flags explicitly: an input whose \u00B110% band <b>crosses DCR = 1.00</b>, which is where checking effort belongs; and one where the <b>governing limit state changes</b>, which is why a row can move further than the input did. Inputs that are insensitive at \u00B110% are listed separately so their absence from the chart is not mistaken for an omission.'},
{p:'Limitations, stated on the section: inputs are varied one at a time so interactions are not captured, section properties are not varied because changing a shape changes all of them at once, and \u00B110% is a probe rather than anything the Specification requires.'},
{h3:'Charts'},
{p:'<b>Capacity envelope</b> (M\u2093 tab, beam mode): \u03C6M\u2099 drawn as a step over each moment region on top of |M\u1D64| along the beam, with the demand/capacity ratio at every station on a second axis. The step changes where the compression flange changes, where the unbraced length changes, and \u2014 with composite action \u2014 where the slab goes into tension and the capacity drops to the bare steel section.'},
{p:'<b>Interaction envelope</b> (Interaction tab): each combination plotted against the \u00A7H1 boundary, which is Eq. H1-1a above P\u1D63/P\u1D9C = 0.2 and Eq. H1-1b below it. The horizontal axis carries the sum of both flexural ratios because \u00A7H1 adds them.'},
{p:'<b>Column curve</b> (Compression tab): \u03C6P\u2099 re-solved at every effective length with each axis made to govern in turn, the L\u1D9C at which 4.71\u221A(E/F\u1D67) is reached, the lengths actually used, and the governing value.'},
{p:'<b>Governing DCR by member</b> (Batch): every member sorted worst first, coloured pass, fail or blocked, with a line at 1.00. Clicking a bar loads that member into Member Check mode.'},
{h3:'Reading the interface'},
{p:'Each output tab carries a small status dot \u2014 green where every check on that tab passes, red where one fails, grey where they report N/A \u2014 so a failure is visible without opening the Summary first. A strip under the title block always shows the governing check, its demand/capacity ratio, the governing combination and the section; clicking it opens the tab that produced it.'},
{h3:'Moment capacity versus stud count'},
{p:'The M\u2093 tab plots \u03C6M\u2099 against the number of studs each side of the point of maximum moment, with the \u00A7I3.2a plastic distribution re-solved at every count. The regions are marked \u2014 below 25% composite action, partial composite, and full composite where the concrete or the steel governs and further studs add nothing \u2014 together with the stud count that first meets M\u1D64, the count provided, and the bare-steel plastic moment as a floor. It turns the stud layout into a reading rather than a trial-and-error loop.'},
{h3:'Composite cross section drawing'},
{p:'The Composite tab draws the section to scale in Plotly: steel shape, haunch, deck ribs at the fraction of rib concrete counted in A\u1D9C, solid slab, the plastic neutral axis, and the plastic stress blocks \u2014 the 0.85f\u2032\u1D9C compression block of depth a, any steel in compression, and the yielded tension zone. The rib pitch drawn is indicative rather than a deck profile.'},
{h3:'Inherited inputs'},
{p:'The composite panel does not ask again for anything the model already knows. Left blank, the span comes from the geometry (the longest span in beam mode, the unbraced length in member check mode), the beam spacings come from the tributary widths, and the tributary width and the post-composite dead and live pressures come from the tributary generator. Every inherited value is listed in a box at the top of the panel and repeated beside the field it fills, so nothing is assumed silently; typing a value overrides it.'},
{p:'Two things are deliberately <b>not</b> inherited. The construction unbraced length is not taken from the final bracing, because a slab that braces the beam once cured does not brace it during the pour. And where the superimposed dead pressure is inherited, the output warns that it must exclude the slab and deck, which the module derives from the slab geometry \u2014 otherwise the slab is counted twice.'},
{p:'\u00A7I3.1a is written per span, so the effective width uses the <b>span</b> length, not the overall member length. On a two-span beam the difference is large: a 30 + 28 ft beam gives L/8 = 3.75 ft per side from the 30 ft span, where the 58 ft total would have given 7.25 ft and let the beam spacing govern instead.'},
{h3:'Effective width override'},
{p:'b\u2091\u2093\u2093 is computed from \u00A7I3.1a by default. It can be overridden where the width comes from elsewhere \u2014 an edge condition, an opening, or another program \u2014 and if the stated value exceeds the \u00A7I3.1a limit the output says so and names the governing criterion rather than accepting it silently.'},
{p:'Verified against AISC Design Examples I.1 and I.2 (direct calculation), the Part III beam design, Manual Table 3-21 stud strengths, and an independent external composite calculation (W6\u00D725) \u2014 25 checks, shown live on the Validation tab.'},
{h3:'Independent reference checks'},
{p:'Beyond the AISC Design Examples, the Validation tab compares the engine against a second commercial AISC 360-16 implementation on five cases: an unbraced W8\u00D710 at F\u1D67 = 36 (elastic LTB, Eq. F2-4, and \u00A7G2.1(a)), an unbraced HSS8\u00D74\u00D7\u215C (\u00A7F7-1 with \u00A7F7.4 not governing, and \u00A7G4), a W10\u00D726 column governed by y-axis buckling with its minor-axis flexural strength, an HSS4\u00D74\u00D7\u00BD column, and a partial-composite W12\u00D719 on lightweight concrete with the plastic neutral axis in the web. These anchor routes the published examples do not reach.'},
{warn:'An agreement check against another program is <b>not</b> the same as a check against a published code answer \u2014 two implementations can share a misreading. They complement the Design Example anchors rather than replacing them. Where the reference and this tool disagree, the disagreement is stated rather than reconciled by adjusting the tool.'},
{h3:'Batch coverage'},
{p:'A batch row can now carry a composite slab, a bearing length with its concentrated force, and a service load for deflection. Supplying a slab depth switches the row to a \u00A7I3.2a composite positive-moment capacity and moves the deflection onto I\u1D38\u1D2E, with the bare-steel value kept alongside it; supplying a bearing length and force runs \u00A7J10.2 and \u00A7J10.3; supplying a service load runs a simple-span deflection over Lx. Blank columns behave exactly as before, so an existing template still imports. What batch still does <b>not</b> cover is stated on the exported Scope sheet: construction-stage strength and deflection, camber, and negative-moment composite action \u2014 use Member Check mode for those.'},
{h3:'Every intermediate is worked'},
{p:'A quantity that feeds a result is never reported as a bare value. Each one is shown as <b>symbol = expression = substituted numbers = result</b>, so any step can be repeated with a calculator without knowing how the program is built. A\u1D65 shows d\u00B7t\u1D65 with the two dimensions substituted rather than just its area; the slenderness ratios show b\u1DA0/2t\u1DA0 and h/t\u1D65 with the numerator and denominator; C\u1D65 shows the 1.10\u221A(k\u1D65E/F\u1D67) threshold against \u03BB and which branch was taken; L\u1D9C/r shows K\u00B7L\u00B712/r; the \u00A7E7 effective width shows F\u2091\u2097 and the full b\u2091 expression element by element; and web crippling shows l\u1D47/d, (t\u1D65/t\u1DA0)^1.5 and \u221A(EF\u1D67t\u1DA0/t\u1D65) before the bracket is assembled.'},
{p:'Where a database value is used directly it is named as such, and where the same quantity can be derived independently the derivation is shown alongside for comparison \u2014 r\u209C\u209B, for instance, is printed both as the tabulated value and as \u221A(\u221A(I\u1D67C\u1D65)/S\u2093) so the two can be checked against each other.'},
{h:'\u03C6 factors used'},
{tbl:{head:['Check','\u03C6','Clause'],rows:[
['Flexure','0.90','F1'],['Shear \u2014 rolled I meeting G2.1(a)','1.00','G1/G2.1(a)'],['Shear \u2014 all other, including \u00A7G6 minor axis','0.90','G1'],
['Compression','0.90','E1'],['Web local yielding','1.00','J10.2'],['Web local crippling','0.75','J10.3'],['HSS torsion','0.90','H3.1']]}}
]);

function ensurePrintState(){
  if(!S.print)S.print={};
  const d={secs:{tabBatch:true,tabSummary:true,tabSchem:true,tabDerive:true,tabAnalysis:true,
    tabMx:true,tabMy:true,tabVx:true,tabVy:true,tabComp:true,tabTors:true,tabJ10:true,tabInter:true,
    tabService:true,tabSection:true,tabValid:true,tabManual:false}};
  S.print.secs=Object.assign({},d.secs,S.print.secs||{});
  return S.print;
}

function markShortSections(pr){
  pr.querySelectorAll('.prSec').forEach(s=>{

async function rasterisePlots(pr,c){
  if(typeof Plotly==='undefined'){
    pr.querySelectorAll('.plotHold').forEach(h=>h.replaceWith(el('div','hint','[diagram requires the Plotly CDN \u2014 offline print]')));
    return;
  }
  const jobs=[];
  pr.querySelectorAll('.plotHold').forEach(h=>{
    let fig=null,w=900,ht=250;
    if(h.id==='plotV'&&c)fig=printFig('V',c);
    else if(h.id==='plotM'&&c)fig=printFig('M',c);
    else if(h.id==='plotD')fig=printFig('D',c);
    else if(PLOTREG[h.id]){
      fig=PLOTREG[h.id];
      ht=(fig.layout&&fig.layout.height)||320;
      w=Math.round(ht*2.3);
    }
    if(!fig){h.remove();return;}
    jobs.push(Plotly.toImage(fig,{format:'png',width:w,height:ht,scale:2}).then(url=>{
      const img=document.createElement('img');img.src=url;img.className='prPlotImg';
      if(w<700)img.style.maxWidth=(w/100).toFixed(2)+'in';
      h.replaceWith(img);
    }).catch(()=>{h.replaceWith(el('div','hint','[diagram unavailable]'));}));
  });
  try{await Promise.all(jobs);}catch(e2){}
}
function printFig(kind,c){
  const xs=AN.stations;
  const shapes=nodeXs().slice(1,-1).map(nx=>({type:'line',x0:nx,x1:nx,y0:0,y1:1,yref:'paper',line:{color:'#94A3B8',width:1,dash:'dot'}}));
  const lay=(title,yt)=>({title:{text:title,font:{size:12,family:'Times New Roman'},x:0},
    margin:{l:56,r:14,t:28,b:36},width:900,height:250,
    xaxis:{title:{text:'x (ft)',font:{size:10}},gridcolor:'#E5E9F0'},
    yaxis:{title:{text:yt,font:{size:10}},zerolinecolor:'#9AA7B8',gridcolor:'#E5E9F0'},
    shapes,showlegend:true,legend:{font:{size:9},orientation:'h',y:1.16,x:1,xanchor:'right'},
    paper_bgcolor:'#fff',plot_bgcolor:'#fff'});
  if(kind==='V')return{data:(AN.env?[{x:xs,y:AN.env.Vmx,name:'envelope',line:{color:'#CBD5E1',width:1}},
      {x:xs,y:AN.env.Vmn,name:'env min',line:{color:'#CBD5E1',width:1},fill:'tonexty',fillcolor:'rgba(203,213,225,.25)',showlegend:false}]:[])
      .concat([{x:xs,y:c.V,name:'V \u2014 '+c.name,line:{color:'#B42318',width:2}}]),layout:lay('Shear Force \u2014 '+c.name,'V (kip)')};
  if(kind==='M')return{data:(AN.env?[{x:xs,y:AN.env.Mmx,name:'envelope',line:{color:'#CBD5E1',width:1}},
      {x:xs,y:AN.env.Mmn,name:'env min',line:{color:'#CBD5E1',width:1},fill:'tonexty',fillcolor:'rgba(203,213,225,.25)',showlegend:false}]:[])
      .concat([{x:xs,y:c.M,name:'M \u2014 '+c.name,line:{color:'#046C4E',width:2}}]),layout:lay('Bending Moment (sagging +) \u2014 '+c.name,'M (kip\u00B7ft)')};
  const PAL=['#2563EB','#059669','#B45309','#7C3AED','#DC2626'];
  const tr=[];AN.svc.forEach((sc,i)=>{if(sc.defl)tr.push({x:sc.defl.xs,y:sc.defl.d.map(v=>v*12),name:sc.name,line:{color:PAL[i%PAL.length],width:1.8}});});
  const L2=lay('Service Deflection (positive down)','\u03B4 (in)');L2.yaxis.autorange='reversed';
  return{data:tr,layout:L2};
}
async function buildPrintReport(){
  ensurePrintState();
  toast('Building report\u2026');
  const old=document.getElementById('printReport');if(old)old.remove();
  const pr=el('div');pr.id='printReport';document.body.appendChild(pr);
  /* title block (§16) */
  const tb=el('div','prTitle');
  const f=S.proj;
  tb.appendChild(el('h1',null,(isMember()?'Steel Member Capacity Check':'Steel Beam Design')+' \u2014 AISC 360-16 (LRFD)'));
  const tt=el('table');
  const mk2=(a,b2,c2,d2)=>{const tr=el('tr');
    tr.appendChild(el('td',null,'<b>'+a+':</b> '+(b2||'\u2014')));
    tr.appendChild(el('td',null,c2?('<b>'+c2+':</b> '+(d2||'\u2014')):''));tt.appendChild(tr);};
  mk2('Project',f.name,'Project no.',f.num);
  mk2('Element',f.elem,'Designer',f.by||'Mario Lococo');
  mk2('Client',f.client,'Checker',f.chk);
  mk2('Date',f.date||new Date().toISOString().slice(0,10),'Section',AN&&AN.sect?(AN.sect.lbl+' \u2014 '+AN.sect.mat.name):'');
  tb.appendChild(tt);
  pr.appendChild(tb);
  if(isMember())pr.appendChild(el('div','warnBox','<b>MEMBER CHECK MODE \u2014 section capacity only.</b> Demands were entered directly; no structural model was solved. Equilibrium, reactions, moment distribution and deflection are not verified by this document.'));
  const govAll=(AN.design&&AN.design.checks||[]).filter(c=>!c.na);
  const worst=govAll.reduce((m,c)=>c.dcr>(m?m.dcr:-1)?c:m,null);
  if(worst)pr.appendChild(el('div',worst.dcr>1?'errBox':'okBox','<b>Governing: '+worst.label+' \u2014 DCR = '+fmt(worst.dcr,3)+(worst.combo?(' ('+worst.combo+')'):'')+'</b>'+(worst.dcr>1?' \u2014 DESIGN FAILS':' \u2014 all implemented checks pass')));
  /* clear app pages so print ids are unique */
  $('tabPages').innerHTML='';
  const names={};TABS().forEach(t=>names[t[0]]=t[1]);
  let first=true;
  const avail={};TABS().forEach(t=>avail[t[0]]=1);
  const order=['tabBatch','tabSummary','tabSchem','tabDerive','tabAnalysis','tabMx','tabMy','tabVx','tabVy',
    'tabComp','tabTors','tabJ10','tabInter','tabService','tabSection','tabValid','tabManual'];
  for(const id of order){
    if(!S.print.secs[id]||!avail[id])continue;
    const sec=el('div','prSec'+(first?' first':''));first=false;
    sec.appendChild(prRunHdr(names[id]||id));
    sec.appendChild(el('h1',null,names[id]||id));
    const holder=el('div');sec.appendChild(holder);
    resetSecNum();
    try{
      if(id==='tabManual'){
        MANUAL_ORDER.forEach(pid=>{
          holder.appendChild(el('h2','manH',MANUAL[pid].title));
          manRender(holder,MANUAL[pid].blocks);
        });
      }else{
        const fn={tabSummary:buildSummaryTab,tabSchem:buildSchemTab,tabDerive:buildDeriveTab,
          tabAnalysis:buildAnalysisTab,tabMx:buildMxTab,tabMy:buildMyTab,tabVx:buildVxTab,tabVy:buildVyTab,
          tabComp:buildCompTab,tabTors:buildTorsTab,tabJ10:buildJ10Tab,tabInter:buildInterTab,
          tabService:buildServiceTab,tabSection:buildSectionTab,tabValid:buildValidTab,tabBatch:buildBatchTab}[id];
        fn(holder);
      }
    }catch(e){holder.appendChild(el('div','errBox','Section failed to build: '+e.message));}
    pr.appendChild(sec);
  }
  /* force sections open */
  pr.querySelectorAll('.secBody').forEach(b=>{b.style.display='block';});
  /* replace plot holders with static images */
  await rasterisePlots(pr,isMember()?null:curCombo());
  markShortSections(pr);
  pr.appendChild(el('div','prFoot','<span>'+(f.name||'')+' \u2014 '+(f.elem||'')+'</span><span>Steel Beam Designer \u00B7 by Mario Lococo \u00B7 '+new Date().toISOString().slice(0,10)+'</span>'));
  const cleanup=()=>{pr.remove();buildTabs();window.removeEventListener('afterprint',cleanup);};
  window.addEventListener('afterprint',cleanup);
  setTimeout(()=>{window.print();setTimeout(()=>{if(document.getElementById('printReport'))cleanup();},1500);},60);
}

/* row writer: cells=[{v|f,ref,kind,dp,unit}] kinds: hdr,sub,lbl,in,imp,out,ok,bad,note */
function XSheet(ws){
  this.ws=ws;this.r=1;this.REF={};
}
XSheet.prototype.row=function(cells,opts){
  opts=opts||{};
  const ws=this.ws,r=this.r++;
  (cells||[]).forEach(c=>{
    if(!c)return;
    const cell=ws.getCell(r,c.col||1);
    if(c.f!==undefined){cell.value={formula:this.resolveF(c.f),result:c.res!==undefined?c.res:undefined};}
    else cell.value=c.v!==undefined?c.v:null;
    if(c.ref)this.REF[c.ref]=cell.address;
    const k=c.kind||'';
    const base={name:'Calibri',size:10};
    if(k==='hdr'){cell.font={...base,size:12,bold:true,color:{argb:'FFFFFFFF'}};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.NAVY}};}
    else if(k==='sub'){cell.font={...base,bold:true,color:{argb:'FFFFFFFF'}};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.BLUE}};}
    else if(k==='band'){cell.font={...base,bold:true,color:{argb:XL.NAVY}};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.BAND}};cell.border=xlBorder();}
    else if(k==='lbl'){cell.font={...base};}
    else if(k==='in'){cell.font={...base,color:{argb:XL.INFONT}};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.INFILL}};cell.border=xlBorder();}
    else if(k==='imp'){cell.font={...base,color:{argb:XL.IMPF}};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.IMPFILL}};cell.border=xlBorder();}
    else if(k==='out'){cell.font={...base,bold:!!c.b};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.OUTFILL}};cell.border=xlBorder();}
    else if(k==='ok'){cell.font={...base,bold:true,color:{argb:XL.GREEN}};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.GFILL}};cell.border=xlBorder();}
    else if(k==='bad'){cell.font={...base,bold:true,color:{argb:XL.RED}};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.RFILL}};cell.border=xlBorder();}
    else if(k==='note'){cell.font={...base,italic:true,size:9,color:{argb:'FF5A6B80'}};}
    if(c.dp!=null)cell.numFmt='0.'+'0'.repeat(c.dp);
    if(c.align)cell.alignment={horizontal:c.align};
    if(c.wrap)cell.alignment=Object.assign(cell.alignment||{},{wrapText:true,vertical:'top'});
  });
  if(opts.merge)ws.mergeCells(r,opts.merge[0],r,opts.merge[1]);
  if(opts.h)ws.getRow(r).height=opts.h;
  return r;
};
XSheet.prototype.gap=function(n){this.r+=(n||1);};
XSheet.prototype.resolveF=function(f){
  const names=Object.keys(this.REF).sort((a,b)=>b.length-a.length);
  let out=f;
  names.forEach(n=>{out=out.split('\u00AB'+n+'\u00BB').join(this.REF[n]);});
  if(out.indexOf('\u00AB')>=0)throw new Error('Unresolved ref in formula: '+out);
  return out;
};

function computeMember(){
  const sect=resolveSection();
  const res={member:true,stable:true,sect,warns:sectionWarnings(sect),blockers:[],notes:[],
    combos:[],svc:[],env:null,stations:[],bracingNotes:[],L:0};
  if(!S.member.cont&&!(S.member.Lb>0))
    res.blockers.push('Member check mode: enter an unbraced length L\u1D47, or tick \u201CContinuously braced\u201D. An unstated bracing condition cannot be assumed.');
  if(!S.member.rows.length)res.blockers.push('Add at least one load case.');
  if(S.member.sw&&S.member.sw.on&&
     !((typeof spanFor==='function'?spanFor(S.member.sw.L).v:S.member.sw.L)>0))
    res.blockers.push('Self-weight is enabled but no span is available \u2014 enter the member span L, or a span for the self-weight calculation.');
  if(res.blockers.length){AN=res;return res;}
  res.combos=S.member.rows.map(r=>({id:r.id,name:r.name||r.id,sig:'mem_'+r.id,member:true}));
  try{memberDesignAll(res);}catch(e){res.designError=''+(e&&e.message?e.message:e);}

function memberDesignAll(A){
  const p=A.sect;
  const D={p,warns:[],perCombo:[],checks:[],member:true};
  D.clsF=classifyFlex(p);D.clsC=classifyComp(p);
  const Lb=S.member.cont?0:(S.member.Lb||0);
  const Cb=S.member.Cb||1;
  D.LbTop=Lb;D.LbBot=Lb;D.CbUser=Cb;
  D.capTop=D.capBot=flexFor(p,'x',Lb*12,Cb);
  D.flexY=flexFor(p,'y',0,1);
  const rows=S.member.rows;
  D.sw=null;
  if(S.member.sw&&S.member.sw.on){
    const sw=S.member.sw,w=(p.Wt||0)/1000;
    const Lsw=(typeof spanFor==='function')?spanFor(sw.L).v:sw.L;
    if(Lsw>0)D.sw={w,L:Lsw,k:sw.k,c:sw.c,gam:sw.gam,
      dM:sw.gam*w*Lsw*Lsw/sw.k,dV:sw.gam*sw.c*w*Lsw};
  }
  const dM=D.sw?D.sw.dM:0,dV=D.sw?D.sw.dV:0;
  const anyPu=rows.some(r=>(r.Pu||0)>0),anyVuy=rows.some(r=>r.Vuy),anyTu=rows.some(r=>r.Tu);
  D.shearX=(p._kind==='P')?shearMajor(p,(S.member.Lv!=null?S.member.Lv:1e8)*12,null)
    :shearMajor(p,null,S.design.stiff);
  D.shearY=shearMinor(p);
  const dsn=S.design||{};
  D.Lcx=(dsn.Lcx!=null?dsn.Lcx:Lb)*(dsn.Kx||1)*12;
  D.Lcy=(dsn.Lcy!=null?dsn.Lcy:Lb)*(dsn.Ky||1)*12;
  D.Lcz=(dsn.Lcz!=null?dsn.Lcz:Lb)*(dsn.Kz||1)*12;
  if(anyPu&&!(D.Lcx>0&&D.Lcy>0))
    D.warns.push('P\u1D64 is entered but the compression effective lengths are zero \u2014 set L\u1D9C\u2093 and L\u1D9C\u1D67 in the <b>Compression Effective Lengths</b> section. Compression results are withheld until they are.');
  D.comp=(D.Lcx>0&&D.Lcy>0)?compStrength(p,D.Lcx,D.Lcy,D.Lcz):null;
  D.tors=torsionHSS(p,(S.member.Lv!=null?S.member.Lv:0)*12);
  D.torOpen=(typeof openTorsionFor==='function')?openTorsionFor(A):null;
  if(typeof compositeFor==='function'){try{A.comp=compositeFor(A);}catch(e){A.comp={blocked:'Composite engine error: '+e.message};}}
  if(A.comp&&!A.comp.blocked&&typeof constructionStage==='function'){
    try{A.constr=constructionStage(A.sect,A.comp);}catch(e){A.constr={blocked:'Construction stage error: '+e.message};}
  }else A.constr=null;

  D.j10=null;
  if((p._kind==='I'||p._kind==='C')&&S.member.j10.lb>0){
    const end=S.member.j10.loc==='end';
    const endDist=end?0:1e6;
    D.j10={locs:[{kind:'user',label:'concentrated force ('+S.member.j10.loc+')',x:null,lb:S.member.j10.lb,endDist,
      wly:j10WLY(p,S.member.j10.lb,end?0:1e6),wlc:j10WLC(p,S.member.j10.lb,end?0:1e6)}],
      lbSup:S.member.j10.lb,lbPt:S.member.j10.lb};
  }
  rows.forEach(r=>{
    const C={id:r.id,name:r.name||r.id,man:{Pu:r.Pu||0,Muy:r.Muy||0,Vuy:r.Vuy||0,Tu:r.Tu||0}};
    const cap=D.capTop;
    const reg={x1:null,x2:null,tag:C.name,sign:1,flange:'compression',LbFt:Lb,mode:'unity',Cb,
      Mu:Math.abs(r.Mux||0)+dM,cap,phiMn:cap.blocked?0:cap.phiMn/12,
      dcr:cap.blocked?Infinity:(Math.abs(r.Mux||0)+dM)/((cap.blocked?1e-9:cap.phiMn/12)||1e-9)};
    if(cap.blocked)reg.blocked=cap.blocked;
    C.regions=[reg];C.flexGov=reg;
    C.shearX=D.shearX;
    C.Vu=Math.abs(r.Vux||0)+dV;
    C.dcrVx=C.Vu/(C.shearX.phi*C.shearX.Vn);
    if(r.Vuy&&D.shearY)C.dcrVy=Math.abs(r.Vuy)/(D.shearY.phi*D.shearY.Vn);
    if(r.Muy&&D.flexY){C.phiMny=D.flexY.blocked?0:D.flexY.phiMn/12;
      C.dcrMy=Math.abs(r.Muy)/(C.phiMny||1e-9);}
    if((r.Pu||0)>0){
      if(D.comp&&!D.comp.blocked){C.phiPn=D.comp.phiPn;C.dcrP=r.Pu/C.phiPn;}
      else C.compBlocked=(D.comp&&D.comp.blocked)||'compression effective lengths not set (see Design Parameters)';
    }
    if(D.torOpen&&!D.torOpen.blocked)
      C.h33=h33Check(p,D.torOpen,{Pu:r.Pu||0,Mux:r.Mux||0,Muy:r.Muy||0,Vux:r.Vux||0,Vuy:r.Vuy||0});
    if(r.Tu&&D.tors){
      if(D.tors.blocked)C.torsBlocked=D.tors.blocked;
      else{C.phiTn=D.tors.phiTn/12;C.dcrT=Math.abs(r.Tu)/C.phiTn;C.torsNeglect=C.dcrT<=0.20;}
    }
    const rx=C.flexGov.dcr===Infinity?0:C.flexGov.dcr,ry=C.dcrMy||0,rp=C.dcrP||0;
    if(C.dcrT!=null&&!C.torsNeglect){

/* =====================================================================
   ONE TAB PER LIMIT STATE
   Splits the combined Flexure/Shear and Axial/Torsion/J10 tabs into
   dedicated tabs. Each tab is self-contained: capacity derivation first,
   then every combination worked (§7.1) with identical-action cross-refs
   (§7.2). A tab whose demand was never entered says so explicitly.

/* ---------- shared helpers ---------- */
function dOrNull(pg){
  const D=AN.design;
  if(!D)pg.appendChild(el('div','errBox','Design pass unavailable'+(AN.designError?': '+AN.designError:'.')));
  return D;
}
function naBox(pg,what,why){
  pg.appendChild(el('div','warnBox','<b>'+what+' \u2014 not evaluated.</b> '+why+
    ' This limit state is reported N/A on the Summary dashboard; it is never treated as passing.'));
}
function perComboSections(pg,idPfx,title,fn,sigExtra){
  const D=AN.design,seen={};
  AN.combos.forEach(cb=>{
    const C=D.perCombo.find(x=>x.id===cb.id);if(!C)return;
    mkSection(idPfx+cb.id,title+cb.name,body=>{
      const sig=cb.sig+(sigExtra?('|'+sigExtra(C)):'');
      if(seen[sig]&&seen[sig]!==cb.id){
        const ref=D.perCombo.find(x=>x.id===seen[sig]);
        body.appendChild(el('div','note','Identical actions to <b>'+ref.name+'</b> \u2014 see that section (\u00A77.2).'));
        return;
      }
      seen[sig]=cb.id;
      fn(body,C,cb);
    },pg);
  });
}
function demandEcho(pg,cols){
  const D=AN.design;
  mkSection('deEcho_'+cols.map(c=>c[0]).join(''),'Demands',body=>{
    body.appendChild(el('div','note',isMember()?
      'All demands are entered directly in Member Check mode.':
      'Values marked with the imported styling are entered manually; the model is planar and cannot generate them.'));
    const t=el('table','tbl');
    const hd=el('tr');[isMember()?'Case':'Combination'].concat(cols.map(c=>c[1])).forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    D.perCombo.forEach(C=>{
      const tr=el('tr');tr.appendChild(el('td','lft',C.name));
      cols.forEach(([k,lab,imp])=>{
        const v=typeof k==='function'?k(C):(C.man[k]||0);
        const td=el('td',null,fmt(v,2));
        if(imp&&v)td.style.cssText='color:#7A4A00;background:#FFF8EC';
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    body.appendChild(t);
  },pg);
}
function dcrLine(body,title,ref,sym,dem,cap,dcr,unit){
  body.appendChild(eqBlock({title,ref,
    lines:['\\text{DCR}=\\tfrac{'+sym+'_u}{\\phi '+sym+'_n}=\\tfrac{'+fmt(dem,2)+'}{'+fmt(cap,2)+'}=\\mathbf{'+fmt(dcr,3)+'}'+
      (dcr>1?'\\ \\color{#B42318}{>1.0\\ \\text{FAIL}}':'\\ \\le 1.0\\ \\checkmark')+
      (unit?'\\quad('+unit+')':'')]}));
}

      compFlange:D.member?'top':(D.perCombo.some(C=>C.flexGov&&C.flexGov.flange==='bottom')?null:'top'),
      overlay:f7?'f7':'none',f7,
      note:f7?'The hatched strip is the portion of the compression flange removed by the \u00A7F7.2 effective-width rule (S\u2091 = '+fmt(f7.Se,2)+' in\u00B3); its location is conventional \u2014 only the removed area affects the calculation.':''});

      if(D.member)body.appendChild(el('div','warnBox','In Member Check mode M\u1D64\u2093 is taken as <b>positive</b> (sagging, slab in compression). To check a negative-moment condition, switch composite off so the bare steel section governs.'));

    }

      body.appendChild(el('div','note','Capacity is evaluated at the unbraced length and C\u1D47 entered in Member Check mode; each case below applies its own demand.'));

    }else{
      body.appendChild(el('div','note','Capacities are evaluated at the bracing entered for each flange with C\u1D47 = 1. Per-combination sections then apply the demand \u2014 and, in calculated-C\u1D47 mode, re-evaluate LTB with the worst-window C\u1D47.'));
      flexCapBlock(body,p,D.capTop,'Top flange in compression (M > 0)'+(S.bracing.topCont?' \u2014 continuously braced':(D.LbTopDefaulted?' \u2014 L\u1D47 defaulted':'')));

    }
    const marks=D.member?[{L:D.LbTop,Cb:D.CbUser,name:'L\u1D47 used'}]:
      [{L:D.LbTop,Cb:1,name:'top flange'},{L:D.LbBot,Cb:1,name:'bottom flange'}];
    let Mu=0;
    D.perCombo.forEach(C=>{if(C.flexGov&&C.flexGov.Mu>Mu)Mu=C.flexGov.Mu;});
    mnLbBlock(body,p,{id:'mnlbMx',Cb:D.member?D.CbUser:1,Mu,marks:marks.filter(m=>m.L>0)});

    if(D.compActive)cols.splice(1,0,'Basis');
    const hd=el('tr');cols.forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    C.regions.forEach(r=>{

      if(D.compActive)cells.splice(1,0,r.basis==='composite'?'Composite (Ch. I)':'Bare steel (Ch. F)');

/* =====================================================================
   TRANSVERSE STIFFENERS — web plate buckling coefficient kv (G2.1(b))
   AISC 360-16:  kv = 5 + 5/(a/h)^2, except kv = 5.34 when a/h > 3.0
   Note: 360-16 differs from 360-10 here (the exception value changed
   from 5 to 5.34, the [260/(h/tw)]^2 limit was dropped, and Cv1 lost
   its third branch). This tool implements 360-16.
   ===================================================================== */
function webH(p){
  if(p._kind==='I'||p._kind==='C'){
    /* h = (h/t_w)*t_w by definition, so a/h always matches the ratio used for C_v1 */
    if(p.htw>0&&p.tw>0)return p.htw*p.tw;
    return p.hClear;
  }
  return null;
}
function stiffKv(p,stiff){
  const h=webH(p);
  if(!stiff||!stiff.on||!(stiff.a>0)||!h)
    return{kv:5.34,ah:null,stiffened:false,clause:'G2.1(b)(1)',
      note:'web without transverse stiffeners \u2192 k\u1D65 = 5.34'};
  const ah=stiff.a/h;
  if(ah>3.0)return{kv:5.34,ah,h,stiffened:true,capped:true,clause:'G2.1(b)(2)',
    note:'a/h = '+fmt(ah,2)+' > 3.0 \u2192 stiffeners are too widely spaced to raise k\u1D65; k\u1D65 = 5.34'};
  return{kv:5+5/(ah*ah),ah,h,stiffened:true,capped:false,clause:'G2.1(b)(2), Eq. G2-5',
    note:'a/h = '+fmt(ah,2)+' \u2264 3.0 \u2192 k\u1D65 = 5 + 5/(a/h)\u00B2'};
}
/* G2.3 stiffener proportioning (no tension field action) — informational */
function stiffenerReq(p,stiff){
  const h=webH(p);
  if(!stiff||!stiff.on||!(stiff.a>0)||!h)return null;
  const ah=stiff.a/h;
  const j=Math.max(0.5,2.5/(ah*ah)-2);
  const b=Math.min(stiff.a,h);
  return{j,b,ah,Ist:b*Math.pow(p.tw,3)*j,btLim:0.56*SQ(EKSI/p.mat.Fy)};
}
/* ---- shearMajor with stiffener-aware kv (overrides the base version) ---- */
function shearMajor(p,LvIn,stiff){
  const Fy=p.mat.Fy,E=EKSI;
  if(p._kind==='I'||p._kind==='C'){
    const Aw=p.d*p.tw,lim=2.24*SQ(E/Fy);
    const K=stiffKv(p,stiff);
    if(p._kind==='I'&&!p._built&&p.htw<=lim){
      return{Vn:0.6*Fy*Aw,phi:1.00,Cv:1,Aw,route:'G2.1(a)',kv:K.kv,ah:K.ah,kvNote:K.note,
        stiffIrrelevant:!!K.stiffened,
        note:'rolled I-shape, h/t\u1D65 = '+fmt(p.htw,1)+' \u2264 2.24\u221A(E/F\u1D67) = '+fmt(lim,1)+
          ' \u2192 C\u1D651 = 1.0 and \u03C6\u1D65 = 1.00'+
          (K.stiffened?'. Transverse stiffeners do not change this result \u2014 the web already develops full shear yielding.':'')};
    }
    const builtNote=(p._kind==='I'&&p._built&&p.htw<=lim)?
      ' The section is flagged built-up, so \u00A7G2.1(a) (\u03C6\u1D65 = 1.00) does not apply even though h/t\u1D65 = '+fmt(p.htw,1)+' \u2264 '+fmt(lim,1)+'.':'';
    const a1=1.10*SQ(K.kv*E/Fy);
    const Cv1=p.htw<=a1?1:a1/p.htw;
    return{Vn:0.6*Fy*Aw*Cv1,phi:0.90,Cv:Cv1,Aw,route:'G2.1(b)',kv:K.kv,ah:K.ah,kvNote:K.note,
      kvClause:K.clause,stiffened:K.stiffened,limCv:a1,
      note:(p._kind==='C'?'channel \u2014 \u03C6\u1D65 = 0.90 (the 1.00 factor is limited to rolled I-shapes). ':'')+
        'C\u1D651 per '+(p.htw<=a1?'Eq. G2-3':'Eq. G2-4')+' with k\u1D65 = '+fmt(K.kv,2)+
        '. Tension field action (\u00A7G2.2) is not used \u2014 conservative.'+builtNote};
  }
  if(p._kind==='R'){
    const Aw=2*p.hFlat*p.tdes,cv=cv2Of(p.htdes,5,Fy);
    return{Vn:0.6*Fy*Aw*cv.Cv2,phi:0.90,Cv:cv.Cv2,Aw,route:'G4',kv:5,
      note:'A\u1D65 = 2ht, h = H \u2212 3t, k\u1D65 = 5, C\u1D652 per '+cv.reg+'. Transverse stiffeners are not a design variable for HSS in \u00A7G4.'};
  }
  const Lv=LvIn||1e9,Dt=p.Dt;
  const F1=1.60*E/(SQ(Lv/p.OD)*Math.pow(Dt,1.25));
  const F2c=0.78*E/Math.pow(Dt,1.5);
  const Fcr=Math.min(0.6*Fy,Math.max(F1,F2c));
  return{Vn:Fcr*p.A/2,phi:0.90,Fcr,F1,F2c,Lv,route:'G5',
    note:'F\u1D9C\u02B3 = max(G5-2a, G5-2b) \u2264 0.6F\u1D67 = '+fmt(0.6*Fy,1)+' ksi; L\u1D65 = '+fmt(Lv/12,2)+
      ' ft. \u00A7G5 has no k\u1D65 term \u2014 stiffener spacing does not apply to round sections.'};
}
/* ---- Vx tab gets a stiffener derivation block ---- */
function stiffBlock(body,p,sh,D){
  const st=S.design.stiff||{};
  if(!(p._kind==='I'||p._kind==='C')){
    body.appendChild(el('div','note','<b>Transverse stiffeners:</b> not a design variable for this section type \u2014 '+
      (p._kind==='R'?'\u00A7G4 fixes k\u1D65 = 5 for rectangular HSS.':'\u00A7G5 for round sections has no k\u1D65 term.')));
    return;
  }
  if(!st.on||!(st.a>0)){
    body.appendChild(eqBlock({title:'Web plate buckling coefficient \u2014 unstiffened web',ref:'\u00A7G2.1(b)(1)',
      lines:['k_v=5.34\\quad\\text{(no transverse stiffeners)}'],
      vars:[['h',fmt(webH(p),2)+' in','clear distance between flanges'],['h/t_w',fmt(p.htw,1),'']]}));
    body.appendChild(el('div','hint','Enter a transverse stiffener spacing in the <b>Web Stiffeners</b> section of the input panel to raise k\u1D65 per Eq. G2-5.'));
    return;
  }
  const h=webH(p);
  body.appendChild(eqBlock({title:'Web plate buckling coefficient with transverse stiffeners',ref:'\u00A7G2.1(b)(2)'+(sh.ah<=3?', Eq. G2-5':''),
    lines:['\\tfrac{a}{h}=\\tfrac{'+fmt(st.a,2)+'}{'+fmt(h,2)+'}=\\mathbf{'+fmt(sh.ah,3)+'}',
      sh.ah>3.0?
        'a/h='+fmt(sh.ah,2)+'>3.0\\ \\Rightarrow\\ k_v=\\mathbf{5.34}\\quad\\text{(stiffeners too widely spaced to help)}':
        'k_v=5+\\tfrac{5}{(a/h)^2}=5+\\tfrac{5}{'+fmt(sh.ah,3)+'^2}=\\mathbf{'+fmt(sh.kv,3)+'}'],
    vars:[['a',fmt(st.a,2)+' in','clear spacing of transverse stiffeners'],
      ['h',fmt(h,2)+' in','clear distance between flanges'],
      ['h/t_w',fmt(p.htw,1),'web slenderness']]}));
  if(sh.stiffIrrelevant)
    body.appendChild(el('div','warnBox','<b>The stiffeners do not change the shear strength here.</b> This rolled I-shape satisfies \u00A7G2.1(a) (h/t\u1D65 \u2264 2.24\u221A(E/F\u1D67)), so C\u1D651 = 1.0 and \u03C6\u1D65 = 1.00 with or without them \u2014 the web develops full shear yielding either way. k\u1D65 is shown above for reference only.'));
  else{
    body.appendChild(eqBlock({title:'Web shear coefficient',ref:sh.limCv&&p.htw<=sh.limCv?'Eq. G2-3':'Eq. G2-4',
      lines:['1.10\\sqrt{\\tfrac{k_vE}{F_y}}=1.10\\sqrt{\\tfrac{'+fmt(sh.kv,3)+'\\times 29000}{'+p.mat.Fy+'}}='+fmt(sh.limCv,1)+
        '\\quad\\text{vs}\\quad \\tfrac{h}{t_w}='+fmt(p.htw,1),
        p.htw<=sh.limCv?'C_{v1}=\\mathbf{1.0}':
          'C_{v1}=\\tfrac{1.10\\sqrt{k_vE/F_y}}{h/t_w}=\\tfrac{'+fmt(sh.limCv,1)+'}{'+fmt(p.htw,1)+'}=\\mathbf{'+fmt(sh.Cv,3)+'}']}));
    const un=stiffKv(p,null);
    const a1u=1.10*SQ(un.kv*EKSI/p.mat.Fy);
    const Cvu=p.htw<=a1u?1:a1u/p.htw;
    if(Cvu<sh.Cv-1e-9)body.appendChild(el('div','okBox','Stiffeners raise C\u1D651 from '+fmt(Cvu,3)+
      ' (unstiffened, k\u1D65 = 5.34) to '+fmt(sh.Cv,3)+' \u2014 \u03C6V\u2099 increases from '+
      fmt(0.9*0.6*p.mat.Fy*sh.Aw*Cvu,1)+' to '+fmt(sh.phi*sh.Vn,1)+' kip.'));
  }
  const req=stiffenerReq(p,S.design.stiff);
  if(req)mkSection('vxStReq','Stiffener Proportioning (\u00A7G2.3, no tension field action)',body2=>{
    body2.appendChild(el('div','note','The tool does <b>not</b> design the stiffener plate. These are the \u00A7G2.3 requirements the plate you provide must satisfy; size it and verify against the Specification directly.'));
    body2.appendChild(eqBlock({title:'Minimum stiffener moment of inertia',ref:'\u00A7G2.3',
      lines:['j=\\tfrac{2.5}{(a/h)^2}-2\\ \\ge 0.5=\\max\\left(\\tfrac{2.5}{'+fmt(req.ah,3)+'^2}-2,\\ 0.5\\right)=\\mathbf{'+fmt(req.j,3)+'}',
        'I_{st}\\ \\ge\\ b\\,t_w^3\\,j='+fmt(req.b,2)+'\\times '+fmt(p.tw,3)+'^3\\times '+fmt(req.j,3)+'=\\mathbf{'+fmt(req.Ist,4)+'}\\ \\text{in}^4'],
      vars:[['b',fmt(req.b,2)+' in','smaller of a and h'],
        ['I_{st}','in\u2074','about the web centerline for a pair of stiffeners, or the web face for a single stiffener']]}));
    body2.appendChild(eqBlock({title:'Stiffener slenderness limit',ref:'\u00A7G2.3',
      lines:['\\left(\\tfrac{b}{t}\\right)_{st}\\le 0.56\\sqrt{\\tfrac{E}{F_{yst}}}=\\mathbf{'+fmt(req.btLim,1)+'}\\quad(\\text{at }F_{yst}=F_y='+p.mat.Fy+'\\ \\text{ksi})']}));
    body2.appendChild(el('div','warnBox','Verify these against your governing Specification edition before use \u2014 \u00A7G2.3 is stated here for the no-tension-field case only, and the tool does not check the plate you actually provide.'));
  },body);
}
/* =====================================================================
   MEMBER-MODE DEFLECTION + RESISTANCE-FACTOR SUMMARY
   Parity items identified by reviewing the reference WF spreadsheet.
   ===================================================================== */
const DEFL_CFG={
  simple:{c:5/384,lab:'Simple span, uniform load  (5wL\u2074/384EI)'},
  cant:  {c:1/8,  lab:'Cantilever, uniform load  (wL\u2074/8EI)'},
  fixfix:{c:1/384,lab:'Fixed\u2013fixed, uniform load  (wL\u2074/384EI)'},
  prop:  {c:1/185,lab:'Propped cantilever, uniform load  (wL\u2074/185EI)'},
  cantP: {c:1/3,  lab:'Cantilever, tip point load  (PL\u00B3/3EI \u2014 enter P as w)'},
  simpleP:{c:1/48,lab:'Simple span, midspan point load  (PL\u00B3/48EI \u2014 enter P as w)'},
  custom:{c:null, lab:'Custom coefficient'}
};
function memberDefl(p){
  const df=S.member&&S.member.defl;
  if(!df||!df.on)return null;
  if(!(df.L>0)||df.w==null)return{err:'Enter the service load and span for the deflection check.'};
  const cfg=DEFL_CFG[df.cfg]||DEFL_CFG.simple;
  const c=(df.cfg==='custom')?(df.c||5/384):cfg.c;
  const pt=(df.cfg==='cantP'||df.cfg==='simpleP');
  const I=(df.I!=null&&df.I>0)?df.I:p.Ix;
  /* w kip/ft, L ft, I in^4, E ksi  ->  delta in inches */
  const d=pt? c*df.w*Math.pow(df.L*12,3)/(EKSI*I)
            : c*df.w*1728*Math.pow(df.L,4)/(EKSI*I);
  const den=(df.den==null||df.den==='')?360:df.den;   /* blank defaults; 0 means report only */
  const lim=den>0?df.L*12/den:null;
  return{d,lim,den,c,I,pt,cfgLab:cfg.lab,L:df.L,w:df.w,
    dcr:lim!=null?d/lim:null,pass:lim!=null?d<=lim*1.0001:null};
}

    if(D.shearX)rows.push(['Shear, major axis','\u03C6\u1D65',fmt(D.shearX.phi,2),
      D.shearX.route==='G2.1(a)'?'\u00A7G1 / \u00A7G2.1(a) \u2014 rolled I-shape exception':'\u00A7G1']);
    if(D.shearY)rows.push(['Shear, minor axis','\u03C6\u1D65',fmt(D.shearY.phi,2),
      '\u00A7G1 \u2014 the 1.00 exception is limited to \u00A7G2.1(a) webs and does <b>not</b> extend to \u00A7G6']);
    if(D.comp&&!D.comp.blocked)rows.push(['Compression','\u03C6\u1D9C','0.90','\u00A7E1']);
    if(D.tors&&!D.tors.blocked)rows.push(['Torsion','\u03C6\u1D40','0.90','\u00A7H3.1']);
    if(D.j10)rows.push(['Web local yielding','\u03C6','1.00','\u00A7J10.2'],
                       ['Web local crippling','\u03C6','0.75','\u00A7J10.3']);
    const t=el('table','tbl');
    const hd=el('tr');['Limit state','Symbol','\u03C6','Clause'].forEach(h=>hd.appendChild(el('th',null,h)));t.appendChild(hd);
    rows.forEach(r=>{const tr=el('tr');
      r.forEach((v,i)=>tr.appendChild(el('td',(i===0||i===3)?'lft':null,v)));t.appendChild(tr);});
    body.appendChild(t);
    if(p._kind==='I')body.appendChild(el('div','hint','The section is treated as '+(p._built?'<b>built-up</b> \u2014 \u00A7G2.1(a) is not available':'<b>rolled</b>')+'. Change this with the built-up checkbox in Section &amp; Material.'));
  },pg);
}

/* =====================================================================
   OPEN-SECTION TORSION — AISC Design Guide 9 / Spec §H3.3
   Solves the warping-torsion differential equation
        E C_w θ'''' − G J θ'' = t(z)
   exactly, segment by segment, for the stated loading and end
   conditions, then forms the DG9 stresses and the §H3.3 combination.
   A single T_u is NOT sufficient input: warping stresses depend on how
   the torque is applied and how the ends are restrained against warping.
   ===================================================================== */
const TOR_CASES={
  conc_pp:{lab:'Concentrated torque, both ends torsionally fixed / warping free (fork supports)',ends:['pin','pin'],load:'conc'},
  conc_ff:{lab:'Concentrated torque, both ends torsionally and warping fixed',ends:['fix','fix'],load:'conc'},
  conc_pf:{lab:'Concentrated torque, one end warping fixed, other warping free',ends:['fix','pin'],load:'conc'},
  unif_pp:{lab:'Uniformly distributed torque, both ends warping free (fork supports)',ends:['pin','pin'],load:'unif'},
  unif_ff:{lab:'Uniformly distributed torque, both ends warping fixed',ends:['fix','fix'],load:'unif'},
  cant_conc:{lab:'Cantilever, torque at free end (fixed base, warping fixed)',ends:['fix','free'],load:'conc'},
  cant_unif:{lab:'Cantilever, uniformly distributed torque (fixed base)',ends:['fix','free'],load:'unif'}
};
/* ---- dense linear solve (partial pivoting) ---- */
function solveLin(A,b){
  const n=b.length,M=A.map((r,i)=>r.concat([b[i]]));
  for(let c=0;c<n;c++){
    let piv=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[piv][c]))piv=r;
    if(Math.abs(M[piv][c])<1e-300)throw new Error('singular torsion system');
    const tmp=M[c];M[c]=M[piv];M[piv]=tmp;
    for(let r=0;r<n;r++){
      if(r===c)continue;
      const f=M[r][c]/M[c][c];
      if(!f)continue;
      for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];
    }
  }
  return M.map((r,i)=>r[n]/M[i][i]);
}
/* ---- exact segment solution ----
   θ(z) = C1 + C2 z + C3 cosh(z/a) + C4 sinh(z/a) + θp(z)
   θp for a uniformly distributed torque t0:  θp = −t0 z²/(2GJ)
   (check: ECwθp'''' − GJθp'' = 0 + t0 = t0 ✓)                        */
function torsionOpen(p,cfg){
  const E=EKSI,G=GKSI;
  const out={blocked:null};
  if(!(p._kind==='I'||p._kind==='C'))
    {out.blocked='This module covers open sections (I-shapes and channels). HSS torsion uses \u00A7H3.1.';return out;}
  if(!(p.Cw>0&&p.J>0&&p.Wno>0&&p.Sw1>0))
    {out.blocked='Warping properties (C\u1D65, J, W\u2099\u2092, S\u1D65\u2081) are not available for this shape.';return out;}
  const L=cfg.L*12;
  if(!(L>0))return{blocked:'Enter the torsional span length.'};
  const a=Math.sqrt(E*p.Cw/(G*p.J));
  const cs=TOR_CASES[cfg.caseId]||TOR_CASES.conc_pp;
  const conc=cs.load==='conc';
  const T=conc?(cfg.T*12):0;                 /* kip·in */
  const t0=conc?0:(cfg.T*12/L);              /* kip·in per in */
  /* node positions: 0, (load point), L */
  const zc=conc?Math.min(Math.max(cfg.pos!=null?cfg.pos*12:L/2,1e-6),L-1e-6):null;
  const nodes=conc?[0,zc,L]:[0,L];
  const NS=nodes.length-1;                    /* segments */
  const n=4*NS;
  const A=[],b=[];
  const row=()=>{const r=new Array(n).fill(0);A.push(r);b.push(0);return r;};
  /* Basis for  E C_w θ'''' − G J θ'' = 0  :  {1, x, f3, f4}.
     Two numerically stable forms are used so that both the warping-dominant
     limit (a >> L) and the St-Venant limit (a << L) are well conditioned:
       a << L : f3 = e^(−x/a),  f4 = e^(−(Ls−x)/a)      (both bounded by 1)
       a >> L : f3 = a²(cosh u − 1) → x²/2,  f4 = a³(sinh u − u) → x³/6
     computed by series to avoid cancellation.                              */
  const cm1=u=>{ /* cosh(u) − 1 */
    if(Math.abs(u)>0.5)return Math.cosh(u)-1;
    const u2=u*u;return u2/2*(1+u2/12*(1+u2/30*(1+u2/56)));
  };
  const sm1=u=>{ /* sinh(u) − u */
    if(Math.abs(u)>0.5)return Math.sinh(u)-u;
    const u2=u*u;return u*u2/6*(1+u2/20*(1+u2/42*(1+u2/72)));
  };
  const segLen=s=>nodes[s+1]-nodes[s];
  const EXPO=s=>segLen(s)/a>0.05;
  const B=(s,x,d)=>{
    const Ls=segLen(s);
    const lin=[d===0?1:0, d===0?x:(d===1?1:0)];
    if(EXPO(s)){
      const e1=Math.exp(-x/a),e2=Math.exp(-(Ls-x)/a);
      return[lin[0],lin[1],Math.pow(-1/a,d)*e1,Math.pow(1/a,d)*e2];
    }
    const u=x/a;
    let f3,f4;
    if(d===0){f3=a*a*cm1(u);f4=a*a*a*sm1(u);}
    else if(d===1){f3=a*Math.sinh(u);f4=a*a*cm1(u);}
    else if(d===2){f3=Math.cosh(u);f4=a*Math.sinh(u);}
    else{f3=Math.sinh(u)/a;f4=Math.cosh(u);}
    return[lin[0],lin[1],f3,f4];
  };
  /* particular solution for a uniformly distributed torque t0 */
  const P=(x,d)=>{
    if(conc)return 0;
    if(d===0)return -t0*x*x/(2*G*p.J);
    if(d===1)return -t0*x/(G*p.J);
    if(d===2)return -t0/(G*p.J);
    return 0;
  };
  const put=(r,s,x,d,f)=>{const v=B(s,x,d);for(let k=0;k<4;k++)r[4*s+k]+=f*v[k];};
  const rhsP=(s,x,d)=>P(x,d);
  /* internal torque T(z) = GJθ' − ECwθ''' */
  const putT=(r,s,x,f)=>{put(r,s,x,1,f*G*p.J);put(r,s,x,3,-f*E*p.Cw);};
  const rhsT=(s,x)=>G*p.J*P(x,1);
  /* --- boundary conditions --- */
  const bcAt=(which,s,x,sign)=>{
    const kind=cs.ends[which];
    if(kind==='pin'){                       /* θ = 0, θ'' = 0 */
      let r=row();put(r,s,x,0,1);b[b.length-1]=-rhsP(s,x,0);
      r=row();put(r,s,x,2,1);b[b.length-1]=-rhsP(s,x,2);
    }else if(kind==='fix'){                 /* θ = 0, θ' = 0 */
      let r=row();put(r,s,x,0,1);b[b.length-1]=-rhsP(s,x,0);
      r=row();put(r,s,x,1,1);b[b.length-1]=-rhsP(s,x,1);
    }else{                                  /* free end: θ'' = 0, T = applied */
      let r=row();put(r,s,x,2,1);b[b.length-1]=-rhsP(s,x,2);
      r=row();putT(r,s,x,1);
      b[b.length-1]=(conc?T:0)-rhsT(s,x);
    }
  };
  bcAt(0,0,0);
  bcAt(1,NS-1,segLen(NS-1));
  /* --- interior continuity --- */
  for(let s=0;s<NS-1;s++){
    const xe=segLen(s);
    [0,1,2].forEach(d=>{
      const r=row();put(r,s,xe,d,1);put(r,s+1,0,d,-1);
      b[b.length-1]=-rhsP(s,xe,d)+rhsP(s+1,0,d);
    });
    /* torque jump: T(right) − T(left) = −T_applied  */
    const r=row();putT(r,s+1,0,1);putT(r,s,xe,-1);
    b[b.length-1]=-T-(rhsT(s+1,0)-rhsT(s,xe));
  }
  const C=solveLin(A,b);
  /* --- evaluate --- */
  const NP=201,zs=[],th=[],th1=[],th2=[],th3=[];
  for(let i=0;i<NP;i++){
    const z=L*i/(NP-1);
    let s=0;while(s<NS-1&&z>nodes[s+1])s++;
    const x=z-nodes[s];
    const g=d=>{const v=B(s,x,d);let r=P(x,d);for(let k=0;k<4;k++)r+=C[4*s+k]*v[k];return r;};
    zs.push(z);th.push(g(0));th1.push(g(1));th2.push(g(2));th3.push(g(3));
  }
  /* --- DG9 stresses --- */
  const tmax=Math.max(p.tf,p.tw);
  const st=zs.map((z,i)=>({
    z,
    tauT:G*tmax*th1[i],                 /* pure (St. Venant) torsional shear, DG9 Eq. 4.1 */
    sigW:E*p.Wno*th2[i],                /* warping normal stress,            DG9 Eq. 4.3a */
    tauW:-E*p.Sw1*th3[i]/p.tf           /* warping shear stress in flange,   DG9 Eq. 4.3b */
  }));
  const pick=k=>st.reduce((m,s2)=>Math.abs(s2[k])>Math.abs(m[k])?s2:m,st[0]);
  out.a=a;out.L=L;out.zs=zs;out.th=th;out.th1=th1;out.th2=th2;out.th3=th3;out.st=st;
  out.caseLab=cs.lab;out.conc=conc;out.T=conc?T:t0*L;out.zc=zc;out.tmax=tmax;
  out.thMax=th.reduce((m,v)=>Math.abs(v)>Math.abs(m)?v:m,0);
  out.tauTmax=pick('tauT').tauT;out.tauTat=pick('tauT').z;
  out.sigWmax=pick('sigW').sigW;out.sigWat=pick('sigW').z;
  out.tauWmax=pick('tauW').tauW;out.tauWat=pick('tauW').z;
  /* worst combined station (normal + shear separately, at the same z) */
  let wi=0,wv=-1;
  st.forEach((s2,i)=>{const v=Math.abs(s2.sigW)/p.mat.Fy+ (Math.abs(s2.tauT)+Math.abs(s2.tauW))/(0.6*p.mat.Fy);
    if(v>wv){wv=v;wi=i;}});
  out.crit=st[wi];
  return out;
}
/* ---- §H3.3 combination with the other member demands ---- */
function h33Check(p,tor,dem){
  const Fy=p.mat.Fy,phi=0.90;
  const fa=(dem.Pu||0)/p.A;
  const fbx=(Math.abs(dem.Mux||0)*12)/p.Sx;
  const fby=(Math.abs(dem.Muy||0)*12)/p.Sy;
  const fvx=(Math.abs(dem.Vux||0))/(p.d*p.tw);
  const fvy=(Math.abs(dem.Vuy||0))/(2*p.bf*p.tf);
  const s=tor.crit;
  const fn=fa+fbx+fby+Math.abs(s.sigW);
  const fv=fvx+fvy+Math.abs(s.tauT)+Math.abs(s.tauW);
  return{fa,fbx,fby,fvx,fvy,sigW:Math.abs(s.sigW),tauT:Math.abs(s.tauT),tauW:Math.abs(s.tauW),
    z:s.z,fn,fv,phiFy:phi*Fy,phiFv:phi*0.6*Fy,
    dcrN:fn/(phi*Fy),dcrV:fv/(phi*0.6*Fy),
    dcr:Math.max(fn/(phi*Fy),fv/(phi*0.6*Fy))};
}
/* ---- independent verification (finite difference + limiting cases) ---- */
function torsionSelfTest(){
  const out=[];
  const p=sectionFor('W','W18X60','A992');
  const cfg={L:20,caseId:'conc_pp',T:10,pos:10};
  const r=torsionOpen(p,cfg);
  /* (1) finite-difference solve of ECw θ'''' − GJ θ'' = 0 with the same BCs */
  const E=EKSI,G=GKSI,L=cfg.L*12,N=120,h=L/N;
  const idx=i=>i+2;                 /* two ghost nodes each side */
  const M=[],rhs=[];
  const nn=N+5;
  for(let k=0;k<nn;k++){M.push(new Array(nn).fill(0));rhs.push(0);}
  const add=(r2,c,v)=>{M[r2][c]+=v;};
  for(let i=1;i<N;i++){            /* interior */
    const r2=idx(i);
    const c4=E*p.Cw/Math.pow(h,4),c2=G*p.J/(h*h);
    add(r2,idx(i-2),c4);add(r2,idx(i-1),-4*c4);add(r2,idx(i),6*c4);add(r2,idx(i+1),-4*c4);add(r2,idx(i+2),c4);
    add(r2,idx(i-1),-c2);add(r2,idx(i),2*c2);add(r2,idx(i+1),-c2);
    rhs[r2]=0;
  }
  const mid=N/2;
  rhs[idx(mid)]=cfg.T*12/h;        /* concentrated torque smeared over one cell */
  [0,N].forEach(i=>{const r2=idx(i);M[r2]=new Array(nn).fill(0);add(r2,idx(i),1);rhs[r2]=0;});
  /* Warping-free ends: θ'' = 0 with θ = 0 ⇒ ODD reflection, θ(−i) = −θ(i).
     (An EVEN reflection would impose θ' = 0, i.e. a warping-FIXED end.) */
  [[-1,1],[-2,2],[N+1,N-1],[N+2,N-2]].forEach(([gi,mi])=>{
    const r2=idx(gi);M[r2]=new Array(nn).fill(0);
    add(r2,idx(gi),1);add(r2,idx(mi),1);rhs[r2]=0;
  });
  let fd=null;
  try{const sol=solveLin(M,rhs);fd=sol[idx(mid)];}catch(e){}
  if(fd!=null)out.push({name:'Warping ODE \u2014 exact vs finite difference (\u03B8 at midspan)',
    got:r.thMax,exp:fd,ok:Math.abs(r.thMax-fd)<=0.02*Math.abs(fd)});
  /* (2) St-Venant limit: huge J, negligible warping → θ = TL/(4GJ) */
  const p2=Object.assign({},p,{J:1e6,Cw:1});
  const r2=torsionOpen(p2,cfg);
  const exp2=(cfg.T*12)*L/(4*GKSI*p2.J);
  out.push({name:'St-Venant limit (C\u1D65\u21920): \u03B8 = TL/4GJ',got:r2.thMax,exp:exp2,
    ok:Math.abs(r2.thMax-exp2)<=0.01*Math.abs(exp2)});
  /* (3) warping-dominant limit: J→0 → analogous to beam, θ = TL³/(48ECw) */
  const p3=Object.assign({},p,{J:1e-8,Cw:3850});
  const r3=torsionOpen(p3,cfg);
  const exp3=(cfg.T*12)*Math.pow(L,3)/(48*EKSI*p3.Cw);
  out.push({name:'Warping-dominant limit (J\u21920): \u03B8 = TL\u00B3/48EC\u1D65',got:r3.thMax,exp:exp3,
    ok:Math.abs(r3.thMax-exp3)<=0.01*Math.abs(exp3)});
  /* (4) equilibrium: end torques must sum to the applied torque */
  const Tend0=GKSI*p.J*r.th1[0]-EKSI*p.Cw*r.th3[0];
  const TendL=GKSI*p.J*r.th1[r.th1.length-1]-EKSI*p.Cw*r.th3[r.th3.length-1];
  out.push({name:'Torsional equilibrium: T(0) \u2212 T(L) = T applied',got:Tend0-TendL,exp:cfg.T*12,
    ok:Math.abs((Tend0-TendL)-cfg.T*12)<=0.01*cfg.T*12});
  return out;
}
/* =====================================================================
   WIRING — inputs, design pass, tab, validation
