/* ================= SVG: CROSS SECTION ================= */
function strandXY(R,view){ // returns [{x,y,h,ri,db,slot}] in girder coords (in)
  const pts=[];
  const g=R.g;
  if(g.isNext&&g.next){
    const sCL=g.next.stemCC/2, B=g.next.B;
    const perStemCols=Math.max(1,Math.floor((B-4)/2)+1); // 2in grid, 2in edge cover
    R.ss.rows.forEach((r,ri)=>{
      const half=Math.round(r.n/2);            // strands per stem (this row)
      const nd=r.dbnd>0?Math.min(r.nd||0,r.n):0, ndHalf=Math.round(nd/2);
      [-sCL,sCL].forEach(stemX=>{
        // outermost columns debonded first
        const order=[...Array(half).keys()].map(i=>({i,col:i%perStemCols,
          x:stemX+(i%perStemCols-(Math.min(half,perStemCols)-1)/2)*2}))
          .sort((a,b)=>Math.abs(b.x-stemX)-Math.abs(a.x-stemX));
        const dbSet=new Set(order.slice(0,ndHalf).map(o=>o.i));
        for(let i=0;i<half;i++){const col=i%perStemCols;
          pts.push({x:stemX+(col-(Math.min(half,perStemCols)-1)/2)*2, y:r.y, h:false, ri, db:dbSet.has(i)});}
      });
    });
    if(R.ss.nh>0){const cg=view==='mid'?+R.ss.hp.yMid:+R.ss.hp.yEnd;
      const half=Math.round(R.ss.nh/2);
      [-sCL,sCL].forEach(stemX=>{for(let i=0;i<half;i++)
        pts.push({x:stemX+(i-(half-1)/2)*2,y:cg,h:true});});}
    return pts;
  }
  R.ss.rows.forEach((r,ri)=>{const n=r.n;
    const xs=[...Array(n)].map((_,i)=>(i-(n-1)/2)*2);
    const nd=r.dbnd>0?Math.min(r.nd||0,r.n):0;
    // outermost strands debonded first
    const order=xs.map((x,i)=>({x,i})).sort((a,b)=>Math.abs(b.x)-Math.abs(a.x));
    const dbSet=new Set(order.slice(0,nd).map(o=>o.i));
    xs.forEach((x,i)=>pts.push({x,y:r.y,h:false,ri,db:dbSet.has(i),slot:i}));});
  if(R.ss.nh>0){const n=R.ss.nh, cg=view==='mid'?+R.ss.hp.yMid:+R.ss.hp.yEnd;
    const rows=Math.ceil(n/2);
    for(let i=0;i<n;i++){const row=Math.floor(i/2),col=i%2;
      pts.push({x:(col-0.5)*2,y:cg+(row-(rows-1)/2)*2,h:true});}}
  return pts;
}
function CrossSection({inp,R,set,selRow,setSelRow,flashRow,logEdit,revertStrands,strandsDirty,onPickStrand}){
  const [view,setView]=useState('mid');
  const [addMode,setAddMode]=useState(false);
  const editable=!!set && !R.error;
  const [selSlot,setSelSlot]=useState(null);
  if(R.error)return null;
  const g=R.g,cp=R.cp;
  const setSel=(v)=>{ if(setSelRow) setSelRow(v?v.ri:null); setSelSlot(v?(v.slot!==undefined?v.slot:null):null); };
  const sel = (selRow!=null)? {ri:selRow, slot:selSlot} : null;
  const W=360,Htot=g.h+inp.th+inp.ts;
  const sc=Math.min((W-50)/Math.max(cp.beff,g.bbf+10),250/Htot);
  const cx=W/2, y0=18+Htot*sc;
  const X=x=>cx+x*sc, Y=y=>y0-y*sc;
  const half=halfPolygon(g);
  const path=half.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ')+' '+
             half.slice().reverse().map(p=>`${X(-p[0])},${Y(p[1])}`).join(' ');
  const strands=strandXY(R,view);
  const ybLbl=view==='mid'?R.ss.cgsMid:R.ss.at(0.001).cgs;
  const rad=Math.max(2.4,1.4*sc*0.3);

  /* ---- row mutation helpers (row model stays source of truth) ---- */
  const [toast,setToast]=useState('');
  const toastTimer=useRef();
  const flash=(msg)=>{ setToast(msg); clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(''),1500); };
  const commit=(rows,msg)=>{ set({...inp, rows: rows.filter(r=>+r.n>0)}); if(msg){flash(msg); if(logEdit)logEdit(msg);} };
  const rowsCopy=()=>inp.rows.map(r=>({...r}));
  const fl=ri=>{ if(flashRow)flashRow(ri); };
  const addStrandAt=(yIn)=>{ // add to existing row at this y, or create a new row
    const rows=rowsCopy(); const yr=Math.round(yIn/1)*1;
    const idx=rows.findIndex(r=>Math.abs(+r.y-yr)<1.0);
    if(idx>=0){ rows[idx].n=+rows[idx].n+ (g.isNext?2:1); fl(idx); }   // NEXT adds in pairs
    else { rows.push({n:g.isNext?2:1,y:yr,dbnd:0,nd:0}); rows.sort((a,b)=>a.y-b.y);
      fl(rows.findIndex(r=>Math.abs(+r.y-yr)<1.0)); }
    commit(rows,`Added ${g.isNext?'2 strands':'1 strand'} at y = ${yr}″`);
  };
  const removeStrand=(ri)=>{ const rows=rowsCopy(); if(!rows[ri])return;
    const y=rows[ri].y; rows[ri].n=Math.max(0,+rows[ri].n-(g.isNext?2:1)); fl(ri);
    commit(rows,`Removed ${g.isNext?'2 strands':'1 strand'} from y = ${y}″`); setSel(null); };
  const toggleDebond=(ri)=>{ const rows=rowsCopy(); const r=rows[ri]; if(!r)return;
    if(!r.dbnd||+r.dbnd<=0) r.dbnd=Math.max(+r.dbnd||0, Math.round(R.L*0.1)); // default debond length 10%L
    const inc=g.isNext?2:1, cur=Math.min(+r.nd||0,+r.n);
    r.nd = cur+inc<=+r.n ? cur+inc : 0;        // cycle: add debond, wrap to 0 when full
    if(r.nd===0) r.dbnd=0;
    fl(ri); commit(rows,r.nd>0?`Debonded ${r.nd} in row at y = ${r.y}″`:`Cleared debond at y = ${r.y}″`); };
  const nudgeRow=(ri,dy)=>{ const rows=rowsCopy(); if(!rows[ri])return;
    const ny=Math.max(1,Math.round((+rows[ri].y+dy))); rows[ri].y=ny; rows.sort((a,b)=>a.y-b.y);
    commit(rows,`Moved row to y = ${ny}″`); setSel(null); };

  // clickable empty grid slots (add mode): show 2in grid positions in the bottom flange not yet filled
  const gridSlots=[];
  if(editable&&addMode&&!g.isNext){
    const bw=g.bbf, maxCols=Math.floor((bw-4)/2)+1;
    const occ=new Set(strands.filter(s=>!s.h).map(s=>`${s.x.toFixed(1)},${s.y.toFixed(1)}`));
    for(let yy=2; yy<=Math.min(g.h*0.4,16); yy+=2){
      for(let c=0;c<maxCols;c++){ const xx=(c-(maxCols-1)/2)*2;
        if(!occ.has(`${xx.toFixed(1)},${yy.toFixed(1)}`)) gridSlots.push({x:xx,y:yy}); }
    }
  }
  const selRowData = (selRow!=null)? inp.rows[selRow] : null;

  return (<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4,gap:8}}>
      {editable&&<div className="btnrow" style={{margin:0,flexWrap:'wrap'}}>
        <button className={'btn sm'+(addMode?' pri':' ghost')} onClick={()=>{setAddMode(a=>!a);setSel(null);}}>{addMode?'● adding — click grid':'+ add strands'}</button>
        {revertStrands&&<button className="btn sm ghost" disabled={!strandsDirty}
          style={!strandsDirty?{opacity:0.4,cursor:'default'}:{}}
          title="Revert all strand edits made this session back to the starting layout"
          onClick={()=>{if(strandsDirty&&window.confirm('Revert all strand edits back to the starting layout?')){revertStrands();setAddMode(false);}}}>↺ revert strand edits</button>}
      </div>}
      <Seg opts={[{v:'mid',l:'AT MIDSPAN'},{v:'end',l:'AT END'}]} v={view} set={setView}/></div>
    <svg viewBox={`0 0 ${W} ${y0+30}`} style={{width:'100%'}} onClick={()=>{if(sel)setSel(null);}}>
      {g.isNext?
        <React.Fragment>
          {inp.ts>0&&<rect x={X(-g.btf/2)} y={Y(Htot)} width={g.btf*sc} height={inp.ts*sc} fill="#DCE6F2" stroke="#16212E" strokeWidth="1.2"/>}
          {inp.th>0&&<rect x={X(-g.btf/2)} y={Y(g.h+inp.th)} width={g.btf*sc} height={inp.th*sc} fill="#EBF1F8" stroke="#16212E" strokeWidth="1"/>}
        </React.Fragment>
        :<React.Fragment>
          <rect x={X(-cp.beff/2)} y={Y(Htot)} width={cp.beff*sc} height={inp.ts*sc} fill="#DCE6F2" stroke="#16212E" strokeWidth="1.2"/>
          <rect x={X(-g.btf/2)} y={Y(g.h+inp.th)} width={g.btf*sc} height={inp.th*sc} fill="#EBF1F8" stroke="#16212E" strokeWidth="1"/>
        </React.Fragment>}
      <polygon points={path} fill="#F2F5F8" stroke="#16212E" strokeWidth="1.6"/>
      {g.isBox&&g.box&&g.box.voidW>0&&(()=>{
        const vw=g.box.voidW, vh=g.box.voidH, bot=(g.h-vh)/2;  // void centered vertically
        return <rect x={X(-vw/2)} y={Y(bot+vh)} width={vw*sc} height={vh*sc} fill="#FFFFFF" stroke="#16212E" strokeWidth="1" strokeDasharray="4 2"/>;
      })()}
      {g.isDeck&&g.box&&g.box.voids>0&&(()=>{
        const d=g.box.voidD, n=g.box.voids, cy=g.h/2, gap=g.w/(n+1);
        return <React.Fragment>{Array.from({length:n}).map((_,i)=>
          <circle key={i} cx={X(-g.w/2+gap*(i+1))} cy={Y(cy)} r={d/2*sc} fill="#FFFFFF" stroke="#16212E" strokeWidth="1" strokeDasharray="4 2"/>)}
        </React.Fragment>;
      })()}
      <line x1={X(-g.bbf/2)-16} x2={X(g.bbf/2)+16} y1={Y(g.yb)} y2={Y(g.yb)} stroke="#46586B" strokeDasharray="7 3 2 3" strokeWidth="1"/>
      <text x={X(g.bbf/2)+18} y={Y(g.yb)+3} fontSize="9" fontFamily="var(--mono)" fill="#46586B">CG girder</text>
      <line x1={X(-cp.beff/2)-4} x2={X(cp.beff/2)+4} y1={Y(cp.ybc)} y2={Y(cp.ybc)} stroke="#0E7490" strokeDasharray="7 3 2 3" strokeWidth="1"/>
      <text x={X(-cp.beff/2)} y={Y(cp.ybc)-4} fontSize="9" fontFamily="var(--mono)" fill="#0E7490">CG comp.</text>
      {/* empty grid slots (add mode) */}
      {gridSlots.map((s,i)=><circle key={'g'+i} cx={X(s.x)} cy={Y(s.y)} r={rad*0.85}
        fill="rgba(28,79,196,.08)" stroke="#1C4FC4" strokeDasharray="2 2" strokeWidth="0.8"
        style={{cursor:'pointer'}} onClick={e=>{e.stopPropagation();addStrandAt(s.y);}}/>)}
      {/* strands */}
      {strands.map((s,i)=>{const inSelRow=selRow!=null&&s.ri===selRow&&!s.h;
        const isSel=inSelRow&&(selSlot==null||s.slot===selSlot);
        return <circle key={i} cx={X(s.x)} cy={Y(s.y)} r={isSel?rad+1.5:rad}
          fill={s.h?'var(--harp)':(s.db?'#9CA3AF':'var(--strand)')}
          stroke={isSel?'#16212E':(inSelRow?'#1C4FC4':'#fff')} strokeWidth={isSel?1.8:(inSelRow?1.3:0.6)}
          style={editable&&!s.h?{cursor:'pointer'}:{}}
          onClick={editable&&!s.h?(e=>{e.stopPropagation();
            if(addMode){return;} const off=selRow===s.ri&&selSlot===s.slot; setSel(off?null:{ri:s.ri,slot:s.slot});
            if(!off&&onPickStrand) onPickStrand(s.ri);}):undefined}/>;})}
      <line x1={X(-g.bbf/2)-6} x2={X(g.bbf/2)+6} y1={Y(ybLbl)} y2={Y(ybLbl)} stroke="var(--strand)" strokeDasharray="3 3" strokeWidth="1"/>
      <text x={cx} y={Y(Htot)-12} fontSize="9.5" textAnchor="middle" fontFamily="var(--mono)">b_eff = {fmt(cp.beff,0)}″</text>
      <text x={X(-Math.max(cp.beff,g.bbf)/2)-6} y={(Y(0)+Y(g.h))/2} fontSize="9.5" fontFamily="var(--mono)" textAnchor="middle" transform={`rotate(-90 ${X(-Math.max(cp.beff,g.bbf)/2)-6} ${(Y(0)+Y(g.h))/2})`}>h = {g.h}″</text>
    </svg>
    {toast&&<div style={{margin:'2px 0 8px',padding:'5px 10px',background:'#F0FBF3',border:'1px solid #15803D',
      borderRadius:4,fontSize:11.5,color:'#15803D',fontFamily:'var(--mono)'}}>✓ {toast} — table updated</div>}
    {/* selected-strand editor popover */}
    {selRowData&&<div className="callout" style={{marginTop:0,marginBottom:8,borderColor:'var(--blue)',background:'#F7FAFF'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
        <b>Strand row at y = {fmt(selRowData.y,1)}″</b>
        <span style={{fontSize:11,color:'var(--ink2)',fontFamily:'var(--mono)'}}>{selRowData.n} strands{(+selRowData.nd>0)?` · ${selRowData.nd} debonded ${selRowData.dbnd}′`:''}</span>
      </div>
      <div className="btnrow" style={{flexWrap:'wrap'}}>
        <button className="btn sm" onClick={()=>toggleDebond(selRow)}>{(+selRowData.nd>0)?'↻ cycle debond':'⌁ debond '+(g.isNext?'pair':'strand')}</button>
        <button className="btn sm ghost" onClick={()=>nudgeRow(selRow,1)}>↑ row +1″</button>
        <button className="btn sm ghost" onClick={()=>nudgeRow(selRow,-1)}>↓ row −1″</button>
        <button className="btn sm ghost" onClick={()=>removeStrand(selRow)}>✕ remove {g.isNext?'pair':'one'}</button>
        <button className="btn sm ghost" onClick={()=>setSel(null)}>done</button>
      </div>
      <div style={{fontSize:10.5,color:'var(--ink2)',marginTop:5}}>Debonding adds/cycles the outermost strands in this row (length defaults to 10% of span — fine-tune in the strand table). Grey = debonded.</div>
    </div>}
    <div className="strandlegend">
      <span><span className="dot" style={{background:'var(--strand)'}}></span>straight ({R.ss.Ntot-R.ss.nh})</span>
      {R.ss.Ndebond>0&&<span><span className="dot" style={{background:'#9CA3AF'}}></span>debonded ({R.ss.Ndebond})</span>}
      {R.ss.nh>0&&<span><span className="dot" style={{background:'var(--harp)'}}></span>harped ({R.ss.nh})</span>}
      <span>cgs = {fmt(ybLbl,2)}″</span></div>
    {editable&&<div style={{fontSize:10.5,color:'var(--ink2)',marginTop:3}}>Click a strand to debond, move, or remove it · “+ add strands” to place new ones on the 2″ grid.</div>}
    <div className="viewlabel">SECTION A–A · {inp.girder.toUpperCase()}</div>
  </div>);
}

      <line x1={X(0)} x2={X(L)} y1={Yb+34} y2={Yb+34} stroke="#16212E" strokeWidth=".8"/>
      <line x1={X(0)} x2={X(0)} y1={Yb+30} y2={Yb+38} stroke="#16212E" strokeWidth=".8"/>
      <line x1={X(L)} x2={X(L)} y1={Yb+30} y2={Yb+38} stroke="#16212E" strokeWidth=".8"/>
      <text x={X(L/2)} y={Yb+31} fontSize="9.5" fontFamily="var(--mono)" textAnchor="middle">L = {fmt(L,1)} ft</text>
      <text x={X(0)+4} y={ytop-6} fontSize="9" fontFamily="var(--mono)" fill="#46586B">e_end = {fmt(R.ss.eEnd,1)}″</text>
      <text x={X(L)-4} y={ytop-6} fontSize="9" fontFamily="var(--mono)" fill="#46586B" textAnchor="end">e_mid = {fmt(R.ss.eMid,1)}″</text>
    </svg>
    <div className="viewlabel">ELEVATION · STRAND PROFILE</div>
  </div>);
}

const snapStore={png:null,meta:''};
function setSnap(png,meta){ snapStore.png=png; snapStore.meta=meta;

/* Ear-clipping triangulation of a simple polygon (CCW or CW). pts: [{x,y}]. Returns index triples. */
function earClip(pts){
  const n=pts.length; if(n<3) return [];
  const area2=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
  // signed area to determine orientation
  let A=0; for(let i=0;i<n;i++){const j=(i+1)%n;A+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}
  const ccw=A>0;
  const V=[...Array(n).keys()];
  if(!ccw) V.reverse();
  const inTri=(p,a,b,c)=>{
    const d1=area2(p,a,b),d2=area2(p,b,c),d3=area2(p,c,a);
    const hasNeg=(d1<0)||(d2<0)||(d3<0), hasPos=(d1>0)||(d2>0)||(d3>0);
    return !(hasNeg&&hasPos);
  };
  const tris=[]; let guard=0;
  while(V.length>3 && guard++<n*n){
    let clipped=false;
    for(let i=0;i<V.length;i++){
      const i0=V[(i-1+V.length)%V.length], i1=V[i], i2=V[(i+1)%V.length];
      const a=pts[i0],b=pts[i1],c=pts[i2];
      if(area2(a,b,c)<=0) continue;            // reflex or degenerate (CCW convex needs >0)
      let ear=true;
      for(const vi of V){ if(vi===i0||vi===i1||vi===i2) continue;
        if(inTri(pts[vi],a,b,c)){ear=false;break;} }
      if(ear){ tris.push([i0,i1,i2]); V.splice(i,1); clipped=true; break; }
    }
    if(!clipped) break;                        // avoid infinite loop on degenerate input
  }
  if(V.length===3) tris.push([V[0],V[1],V[2]]);
  return tris;
}

function Rebar3D({inp,R}){
  const ref=useRef();
  const [show,setShow]=useState({straight:true,debond:true,harp:true,stirrup:true,longi:true,split:true,girder:true,solid:true,deform:false,stresscolor:false,opacity:0.45});
  const tog=k=>setShow(s=>({...s,[k]:!s[k]}));
  useEffect(()=>{
    if(R.error||!ref.current||typeof Plotly==='undefined')return;
    const g=R.g, L=R.L, Lin=L*12, ss=R.ss, hp=ss.hp, nh=ss.nh;
    const half=halfPolygon(g);                       // [[xHalf,y]..] bottom->top (in)
    const traces=[];
    // deformed-shape vertical offset (camber, exaggerated) as f(x along length)
    const camScale= show.deform? (Math.abs(R.cam.final)>1e-3? 1: 1) : 0;
    const camExag= 12;                                // visual exaggeration factor
    const dz=xin=>{ if(!show.deform)return 0; const xf=xin/12; const par=4*xf*(L-xf)/(L*L);
      return R.cam.final*par*camExag; };
    // full closed section outline (left side bottom->top, then right side top->bottom).
    // Drop duplicated centerline endpoints so the polygon has no repeated vertices
    // (required for clean ear-clipping of the end caps).
    const rawOutline=[...half.map(p=>[-p[0],p[1]]), ...half.slice().reverse().map(p=>[p[0],p[1]])];
    const outline=rawOutline.filter((p,i)=>{const q=rawOutline[(i-1+rawOutline.length)%rawOutline.length];
      return !(Math.abs(p[0]-q[0])<1e-6 && Math.abs(p[1]-q[1])<1e-6);});
    const np=outline.length;
    // ---- girder shell ----
    if(show.girder){
      if(show.solid){
        // Swept solid: rings of section outline points along the length, side quads + end caps.
        // The outline is built as left-side points (bottom->top) then right-side (top->bottom),
        // so left point i pairs with right point (np-1-i) at the same height — we cap by tiling
        // those horizontal pairs into quads, which works for concave sections (I-girder notch,
        // NEXT two-stem gap) without the spurious cross-notch triangles a vertex-fan produces.
        const NS=Math.max(2,Math.round(L/5));
        const xv=[],yv=[],zv=[], ii=[],jj=[],kk=[];
        for(let s=0;s<=NS;s++){ const xx=s*Lin/NS;
          outline.forEach(p=>{ xv.push(xx); yv.push(p[0]); zv.push(p[1]+dz(xx)); });
        }
        const ring=np;
        // side walls: each quad (a,b,d,c) -> two triangles (a,b,d) and (a,d,c)
        for(let s=0;s<NS;s++){
          for(let p=0;p<np;p++){ const a=s*ring+p, b=s*ring+(p+1)%np, c=(s+1)*ring+p, d=(s+1)*ring+(p+1)%np;
            ii.push(a,a); jj.push(b,d); kk.push(d,c); }
        }
        // end caps via ear-clipping triangulation of the (possibly concave) section polygon.
        // poly2d = outline in the section plane (y=width, z=depth). Returns index triples into outline.
        const tris=earClip(outline.map(p=>({x:p[0],y:p[1]})));
        const addCap=(base,flip)=>tris.forEach(t=>{
          if(!flip){ ii.push(base+t[0]); jj.push(base+t[1]); kk.push(base+t[2]); }
          else     { ii.push(base+t[0]); jj.push(base+t[2]); kk.push(base+t[1]); }
        });
        addCap(0,false); addCap(NS*ring,true);
        traces.push({type:'mesh3d',x:xv,y:yv,z:zv,i:ii,j:jj,k:kk,
          color:'#C9D6E3',opacity:show.opacity,flatshading:true,hoverinfo:'skip',name:'girder',
          lighting:{ambient:0.7,diffuse:0.45,specular:0.05},lightposition:{x:-Lin,y:-200,z:300}});
      }else{
        [0,Lin].forEach(xx=>traces.push({type:'scatter3d',mode:'lines',
          x:outline.map(()=>xx).concat([outline[0][0]!==undefined?xx:xx]),
          y:outline.map(p=>p[0]).concat([outline[0][0]]),
          z:outline.map(p=>p[1]+dz(xx)).concat([outline[0][1]+dz(xx)]),
          line:{color:'#8AA0B6',width:2},hoverinfo:'skip',showlegend:false}));
        [-1,1].forEach(sgn=>half.forEach(p=>traces.push({type:'scatter3d',mode:'lines',
          x:[0,Lin],y:[sgn*p[0],sgn*p[0]],z:[p[1]+dz(0),p[1]+dz(Lin)],
          line:{color:'rgba(138,160,182,.35)',width:1},hoverinfo:'skip',showlegend:false})));
      }
    }
    // ---- strand horizontal layout within a row (2in grid); NEXT splits across two stems ----
    const rowXs=n=>{
      if(g.isNext){ const sCL=g.next.stemCC/2, B=g.next.B;
        const perStem=Math.max(1,Math.floor((B-4)/2)+1), half=Math.round(n/2), out=[];
        [-sCL,sCL].forEach(sc=>{ const k=Math.min(half,perStem);
          for(let i=0;i<half;i++) out.push(sc+(i%perStem-(k-1)/2)*2); });
        return out;
      }
      return [...Array(n)].map((_,i)=>(i-(n-1)/2)*2);
    };
    // ---- straight & debonded bottom strands ----
    const stx=[],sty=[],stz=[], dbx=[],dby=[],dbz=[];
    const NSEG=show.deform?24:1;                      // subdivide for curve/color
    const fpsFull=R.fMid.fps||R.fpe;
    const csx=[],csy=[],csz=[],csc=[];
    ss.rows.forEach(r=>{
      const xs=rowXs(r.n);                            // all strand x-positions in the row
      const nd=r.dbnd>0? Math.min(r.nd||0,r.n):0;
      // pick which positions are debonded: outermost first (sort by |x| descending)
      const order=xs.map((x,idx)=>({x,idx})).sort((a,b)=>Math.abs(b.x)-Math.abs(a.x));
      const debondSet=new Set(order.slice(0,nd).map(o=>o.idx));
      xs.forEach((xc,idx)=>{
        const isDb=debondSet.has(idx), dbnd=isDb? r.dbnd:0, x0=dbnd*12, x1=Lin-dbnd*12;
        if(isDb){
          dbx.push(0,x0,null, x1,Lin,null);
          dby.push(xc,xc,null, xc,xc,null);
          dbz.push(r.y+dz(0),r.y+dz(x0),null, r.y+dz(x1),r.y+dz(Lin),null);
        }
        for(let s=0;s<NSEG;s++){ const xa=x0+(x1-x0)*s/NSEG, xb=x0+(x1-x0)*(s+1)/NSEG;
          stx.push(xa,xb,null); sty.push(xc,xc,null); stz.push(r.y+dz(xa),r.y+dz(xb),null);
          if(show.stresscolor){ const fr=ss.devStress((xa/12),fpsFull,R.fpe,dbnd)/fpsFull;
            csx.push(xa,xb,null); csy.push(xc,xc,null); csz.push(r.y+dz(xa),r.y+dz(xb),null);
            csc.push(fr,fr,fr); }
        }
      });
    });
    if(show.straight&&!show.stresscolor) traces.push({type:'scatter3d',mode:'lines',x:stx,y:sty,z:stz,
      line:{color:'#C2271D',width:3},name:`straight strand (${ss.Nbond})`,
      hovertemplate:'straight strand<br>y=%{z:.0f} in<extra></extra>'});
    if(show.straight&&show.stresscolor) traces.push({type:'scatter3d',mode:'lines',x:csx,y:csy,z:csz,
      line:{color:csc,colorscale:[[0,'#CBD5E1'],[0.5,'#F59E0B'],[1,'#C2271D']],width:4,cmin:0,cmax:1,
        colorbar:{title:{text:'f_ps / f_ps,full',side:'right'},thickness:10,len:0.6,x:1.0}},
      name:'strand (developed-stress)',hovertemplate:'f_ps fraction %{line.color:.2f}<extra></extra>'});
    if(show.debond&&dbx.length) traces.push({type:'scatter3d',mode:'lines',x:dbx,y:dby,z:dbz,
      line:{color:'#9CA3AF',width:3,dash:'dot'},name:'debonded (sheathed)',
      hovertemplate:'debonded length<extra></extra>'});
    // ---- harped strands ----
    if(show.harp&&nh>0){
      const a=hp.frac*Lin;
      const cols=Math.min(2,nh), perCol=Math.ceil(nh/cols);
      const hx=[],hy=[],hz=[];
      const seg=(x0,z0,x1,z1)=>{ for(let s=0;s<NSEG;s++){const t0=s/NSEG,t1=(s+1)/NSEG;
        hx.push(x0+(x1-x0)*t0,x0+(x1-x0)*t1,null);
        hy.push(yc,yc,null);
        hz.push(z0+(z1-z0)*t0+dz(x0+(x1-x0)*t0), z0+(z1-z0)*t1+dz(x0+(x1-x0)*t1),null);} };
      var yc;
      for(let ci=0;ci<cols;ci++){
        yc=(ci-(cols-1)/2)*2;
        for(let ri=0;ri<perCol;ri++){
          const yoff=(ri-(perCol-1)/2)*2;
          const ye=+hp.yEnd+yoff, ym=+hp.yMid+yoff;
          seg(0,ye,a,ym); seg(a,ym,Lin-a,ym); seg(Lin-a,ym,Lin,ye);
        }
      }
      traces.push({type:'scatter3d',mode:'lines',x:hx,y:hy,z:hz,
        line:{color:'#7C3AED',width:3},name:`harped strand (${nh})`,
        hovertemplate:'harped strand<extra></extra>'});
      traces.push({type:'scatter3d',mode:'markers',x:[a,Lin-a],y:[0,0],z:[+hp.yMid+dz(a),+hp.yMid+dz(Lin-a)],
        marker:{size:4,color:'#7C3AED',symbol:'diamond'},name:'hold-down',
        hovertemplate:'hold-down @ %{x:.0f} in<extra></extra>'});
    }
    // ---- stirrups (vertical U bars) at actual spacing ----
    if(show.stirrup){
      const endLen=inp.opt.endZoneLen*L, sEnd=+inp.opt.sEnd, sInt=+inp.opt.sInt;
      const yb0=2, yt0=g.h-2, cov=1.5;
      // stirrup legs sit just inside the web (or inside each stem for NEXT), not at the flange tips
      // returns array of {yL,yR} leg pairs to draw at each station
      const legPairs = g.isNext
        ? [-g.next.stemCC/2, g.next.stemCC/2].map(sc=>({yL:sc-g.next.B/2+cov, yR:sc+g.next.B/2-cov}))
        : [{yL:-g.bw/2+cov*0, yR:g.bw/2-cov*0}];   // I-girder: single tie spanning the web width
      const iWeb = g.isNext? null : Math.max(g.bw/2-0.4, 1.0); // half web width minus a hair
      const sx=[],sy=[],sz=[];
      let x=3;
      while(x<=Lin-3){
        const xf=x/12, off=dz(x);
        if(g.isNext){
          legPairs.forEach(lp=>{ // U in each stem
            sx.push(x,x,x,x,null); sy.push(lp.yL,lp.yL,lp.yR,lp.yR,null);
            sz.push(yb0+off,yt0+off,yt0+off,yb0+off,null); });
        }else{
          // single U tie hugging the web, with the top hook spreading into the top flange
          const wWeb=iWeb, wTopHook=Math.min(g.btf/2-1.5, wWeb+6);
          sx.push(x,x,x,x,x,x,null);
          sy.push(-wWeb,-wWeb,-wTopHook,wTopHook,wWeb,wWeb,null);
          sz.push(yb0+off, g.h-8+off, yt0+off, yt0+off, g.h-8+off, yb0+off, null);
        }
        const inEnd=(xf<=endLen)||(xf>=L-endLen);
        x+= (inEnd? sEnd : sInt);
      }
      traces.push({type:'scatter3d',mode:'lines',x:sx,y:sy,z:sz,
        line:{color:'#0E7490',width:2},name:`stirrups (${inp.opt.sEnd}″ end / ${inp.opt.sInt}″ int)`,
        hovertemplate:'stirrup<extra></extra>'});
    }
    // ---- longitudinal top bars ----
    if(show.longi){
      const wTop=(g.isNext? g.btf/2 : half[half.length-2][0])*0.8;
      const lz0=g.h-2;
      const mk=(yy)=>{const xa=[],ya=[],za=[];for(let s=0;s<=NSEG;s++){const xx=s*Lin/NSEG;xa.push(xx);ya.push(yy);za.push(lz0+dz(xx));}xa.push(null);ya.push(null);za.push(null);return[xa,ya,za];};
      const A=mk(-wTop),B=mk(wTop);
      traces.push({type:'scatter3d',mode:'lines',x:[...A[0],...B[0]],y:[...A[1],...B[1]],z:[...A[2],...B[2]],
        line:{color:'#15803D',width:2},name:'longitudinal bars',hovertemplate:'longitudinal bar<extra></extra>'});
    }
    // ---- splitting/confinement reinforcement at ends (5.9.4.4) ----
    if(show.split){
      const hh=g.h/4, ex=[],ey=[],ez=[];
      // vertical bars within the web / stems near each end
      const stemXs = g.isNext? [-g.next.stemCC/2, g.next.stemCC/2] : [0];
      const wB = g.isNext? g.next.B/2-1.5 : Math.max(g.bw/2-0.4,1.0);
      [0,Lin].forEach(end=>{ const dir=end===0?1:-1;
        for(let d=2; d<=hh; d+=4){ const xx=end+dir*d, off=dz(xx);
          stemXs.forEach(sc=>{ ex.push(xx,xx,xx,xx,null);
            ey.push(sc-wB,sc-wB,sc+wB,sc+wB,null); ez.push(2+off,hh+off,hh+off,2+off,null); });
        }
      });
      traces.push({type:'scatter3d',mode:'lines',x:ex,y:ey,z:ez,
        line:{color:'#B45309',width:2},name:'splitting/confinement (h/4)',hovertemplate:'anchorage zone bar<extra></extra>'});
    }
    // aspect ratio: length compressed for visibility, but width:depth kept true-to-scale
    // so the section shape and proportions visibly change with the selected girder.
    const wFull=(g.isNext? g.btf : Math.max(g.bbf,g.btf));   // full section width (in)
    const hFull=g.h;
    const yzRatio = wFull/hFull;                              // true width-to-depth
    const layout={margin:{l:0,r:0,t:0,b:0},paper_bgcolor:'rgba(0,0,0,0)',
      scene:{aspectmode:'manual',aspectratio:{x:3.6, y:Math.max(0.4,Math.min(2.2,1.0*yzRatio)), z:1.0},
        xaxis:{title:'length (in)',backgroundcolor:'rgba(0,0,0,0)',gridcolor:'#E2E8EE',zerolinecolor:'#C7D1DB'},
        yaxis:{title:'width (in)',backgroundcolor:'rgba(0,0,0,0)',gridcolor:'#E2E8EE',zerolinecolor:'#C7D1DB'},
        zaxis:{title:'depth (in)',backgroundcolor:'rgba(0,0,0,0)',gridcolor:'#E2E8EE',zerolinecolor:'#16212E'},
        camera:{eye:{x:-1.6,y:-2.2,z:1.1}}},
      showlegend:true,legend:{orientation:'h',y:0,font:{size:9,family:'var(--mono)'}},
      font:{family:'IBM Plex Mono',size:10,color:'#46586B'}};
    Plotly.react(ref.current,traces,layout,{displayModeBar:true,responsive:true,
      modeBarButtonsToRemove:['toImage'],displaylogo:false});
  },[inp,R,show]);

  if(R.error)return null;
  const LAYERS=[['straight','Straight strands'],['debond','Debonded'],['harp','Harped'],
    ['stirrup','Stirrups'],['longi','Longitudinal'],['split','Anchorage zone'],['girder','Girder shell']];
  const MODES=[['solid','Solid girder'],['deform','Deformed (camber)'],['stresscolor','Strand stress color']];
  return(<Card title="3D Reinforcement Cage" refTag="strands · harping · debonding · stirrups · anchorage"
    right={null}>
    <div className="btnrow" style={{marginBottom:4,flexWrap:'wrap'}}>{LAYERS.map(([k,l])=>
      <button key={k} className={'btn sm'+(show[k]?'':' ghost')} onClick={()=>tog(k)}>{show[k]?'☑':'☐'} {l}</button>)}</div>
    <div className="btnrow" style={{marginBottom:6,flexWrap:'wrap',alignItems:'center'}}>{MODES.map(([k,l])=>
      <button key={k} className={'btn sm'+(show[k]?' pri':' ghost')} onClick={()=>tog(k)}>{show[k]?'●':'○'} {l}</button>)}
      {show.solid&&<span style={{display:'inline-flex',alignItems:'center',gap:6,marginLeft:6,fontSize:11,color:'var(--ink2)',fontFamily:'var(--mono)'}}>
        girder opacity
        <input type="range" min={0.05} max={0.9} step={0.05} value={show.opacity}
          onChange={e=>setShow(s=>({...s,opacity:+e.target.value}))} style={{width:90,accentColor:'var(--blue)'}}/>
        {Math.round(show.opacity*100)}%
      </span>}
      <button className="btn sm" style={{marginLeft:6}} onClick={()=>{
        if(ref.current&&typeof Plotly!=='undefined'&&Plotly.toImage){
          Plotly.toImage(ref.current,{format:'png',width:1100,height:620,scale:2})
            .then(url=>setSnap(url, `${inp.girder} · L = ${R.L} ft · ${R.ss.Ntot}-${inp.str.size}`));
        }
      }}>📷 Capture for report</button>
    </div>
    <div ref={ref} style={{height:440,width:'100%'}}/>
    <div className="callout">Full-length reinforcement model: straight strands (red, or graded by developed-stress fraction when that mode is on) with bonded length only, debonded/sheathed ends (grey dotted) per the row debond lengths, harped strands (purple) following the drape with hold-down diamonds, stirrups (teal) hugging the web (or each stem for NEXT) at the actual end/interior spacing, longitudinal top bars (green), and the splitting/confinement steel in the end anchorage zone within h/4 (amber, 5.9.4.4). The solid-girder mode renders a shaded shell; the deformed mode applies the after-deck camber profile (visually exaggerated ×12). The section width-to-depth proportions are drawn true-to-scale (length axis compressed for visibility), so the shape changes with the selected girder. Drag to orbit, scroll to zoom.</div>
  </Card>);
}

/* ================= MIDAS IMPORT HELP MODAL ================= */
function MidasHelp({onClose}){
  useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);return ()=>window.removeEventListener('keydown',h);},[]);
  const H=({children})=><div style={{fontFamily:'var(--sans)',fontWeight:800,fontSize:13,letterSpacing:'.4px',
    textTransform:'uppercase',color:'var(--ink)',margin:'16px 0 6px',borderBottom:'1.5px solid var(--line2)',paddingBottom:3}}>{children}</div>;
  const Row=({c,label,children})=><div style={{display:'flex',gap:10,marginBottom:5,fontSize:12.5,lineHeight:1.5}}>
    <span style={{flex:'0 0 130px',fontFamily:'var(--mono)',color:c||'var(--ink2)',fontWeight:600}}>{label}</span>
    <span style={{flex:1}}>{children}</span></div>;
  const C=({children})=><code style={{fontFamily:'var(--mono)',fontSize:11.5,background:'#EEF2F6',padding:'1px 5px',borderRadius:3}}>{children}</code>;
  return (<div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(22,33,46,.55)',
    zIndex:1000,display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'40px 16px',overflowY:'auto'}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'#fff',maxWidth:760,width:'100%',
      border:'2px solid var(--ink)',boxShadow:'0 12px 48px rgba(0,0,0,.3)',padding:'22px 26px 28px',position:'relative'}}>
      <button onClick={onClose} className="btn sm ghost" style={{position:'absolute',top:14,right:14}}>✕ close</button>
      <div style={{fontFamily:'var(--sans)',fontStretch:'75%',fontWeight:800,fontSize:18,letterSpacing:'.8px',
        textTransform:'uppercase'}}>Importing MIDAS Demands</div>
      <div style={{fontSize:12,color:'var(--ink2)',marginTop:3}}>How to prepare the external force-effect file so PS-Beam consumes it correctly.</div>

      <H>The idea</H>
      <div style={{fontSize:12.5,lineHeight:1.6}}>
        MIDAS runs the rigorous continuous-structure analysis on the <b>composite</b> section (real influence surfaces, skew, staging). Your MCT Generator organizes that output into a JSON file by component and station. PS-Beam imports the <b>composite-stage</b> demands and applies the LRFD load factors and limit-state combinations itself. The <b>non-composite</b> loads (girder self-weight and DC1) act on the bare girder before the deck cures, so PS-Beam computes those on the non-composite section rather than taking them from MIDAS.
      </div>

      <H>Who computes what</H>
      <Row label="Girder self-wt" c="#15803D"><b>PS-Beam computes this</b> on the non-composite section, from the girder section and concrete unit weight.</Row>
      <Row label="DC1 (deck+haunch)" c="#15803D"><b>PS-Beam computes this too</b>, on the non-composite section, from your deck thickness, haunch height, spacing, and unit weight. DC1 is the wet-deck + haunch (and any non-composite superimposed) carried by the bare girder. <b>Do not</b> put DC1 in the MIDAS file — it would land on the composite section, which is wrong.</Row>
      <Row label="DC2 / SIDL" c="#B3261E"><b>You provide this in DC2</b> — composite superimposed dead load (barriers, parapets, sidewalks, railing) acting on the composite section.</Row>
      <Row label="Wearing surface" c="#B3261E"><b>You provide this in DW.</b></Row>
      <Row label="Live load" c="#B3261E"><b>You provide the LL envelope</b> (positive &amp; negative branches, moment and shear) with the <b>dynamic load allowance (impact) already included</b>. The file does not record whether distribution factor or multiple presence are applied, so confirm against your MIDAS run and apply any that are missing using the DF (per effect) and MPF factors in the Loads panel (each defaults to 1.0). A refined grillage usually has DF and MPF built in; a single line-girder model typically needs the DF applied.</Row>

      <H>The components to export (per girder, per station)</H>
      <div style={{fontSize:12.5,lineHeight:1.7}}>
        <C>M_DC2, V_DC2</C> — composite superimposed dead load: barriers/parapets, sidewalks, railing.<br/>
        <C>M_DW, V_DW</C> — future wearing surface and utilities.<br/>
        <C>M_LLpos / M_LLneg</C> and <C>V_LLpos / V_LLneg</C> — the live-load envelope, both branches, with DF and IM baked in.<br/>
        <span style={{color:'var(--ink2)'}}>DC1 may be present in the file but PS-Beam ignores it — it computes DC1 on the non-composite section. Girder self-weight should be excluded (<C>selfWeightExcluded: true</C>).</span>
      </div>

      <H>Conventions PS-Beam expects</H>
      <Row label="Units"><C>kip</C>, <C>ft</C>, <C>ft-kip</C> (declared in the file's <C>units</C> block).</Row>
      <Row label="Sign">Moment sagging-positive; shear signed (not magnitude). DC shear should pass through zero along the span, not be reported as an absolute value.</Row>
      <Row label="Factoring"><C>factored: false</C> — components are unfactored. PS-Beam builds Strength I (1.25 DC + 1.50 DW + 1.75 LL), Service I / III, and Fatigue.</Row>
      <Row label="Stations">Any spacing; PS-Beam interpolates its grid from them. Include the supports.</Row>
      <Row label="Spans">Provide <C>member.supports</C> (or <C>spans</C>) so PS-Beam can offer the span picker and slice a single span, re-zeroed to its left bearing. Pier negative moments at the span ends feed the continuity check.</Row>

      <H>What PS-Beam does on import</H>
      <div style={{fontSize:12.5,lineHeight:1.6}}>
        Detects the schema, reads the spans, lets you pick one, re-zeros the stationing, and switches the <b>composite-stage</b> moment/shear functions to read your DC2, DW, and the LL envelope. It computes girder self-weight and DC1 (deck + haunch) on the non-composite section itself. The composite-section stiffness uses the haunch toggle in the geometry inputs.
      </div>

      <div style={{marginTop:16,padding:'8px 12px',background:'#EEF4FF',border:'1px solid var(--blue)',borderRadius:4,fontSize:12,lineHeight:1.55}}>
        <b>Quick checklist:</b> self-weight excluded · <b>DC1 NOT included</b> (PS-Beam computes it) · barrier in DC2 · wearing surface in DW · LL envelope both branches with DF &amp; IM applied · signed shear · supports/spans listed · units kip/ft/ft-kip.
      </div>
      <div style={{marginTop:12,fontSize:11,color:'var(--ink2)'}}>Schema id <C>psbeam-external-demands</C>, produced by the MCT Generator's “Organize for PS-Beam tool” action. Design aid — independent PE verification of the imported demands and the resulting design is required.</div>
    </div>
  </div>);
}

/* Shows whether the INTERIOR/EXTERIOR position is being driven by the shared design
   beam or has been overridden by hand here. Clicking the override tag hands control
   back to the design beam. */
function PosTag({inp,set}){
  const {sel}=useDesignBeam();
  if(!sel||!sel.type) return null;
  const want=(sel.type==='ext')?'exterior':'interior';
  if(inp.loads.posAuto!==false)
    return <span style={{fontSize:10.5,fontFamily:'var(--mono)',color:'var(--ink2)',whiteSpace:'nowrap'}}
      title={'Following the shared design beam '+sel.label+(sel.clsLabel?' — '+sel.clsLabel:'')+'.'}>↳ {sel.label}</span>;
  return <span style={{fontSize:10.5,fontFamily:'var(--mono)',color:'#B45309',whiteSpace:'nowrap',cursor:'pointer',textDecoration:'underline dotted'}}
    title={'Overridden here. The shared design beam '+sel.label+(sel.clsLabel?' ('+sel.clsLabel+')':'')+' is an '+want+' girder — click to follow it again.'}
    onClick={()=>set({...inp,loads:{...inp.loads,pos:want,posAuto:true}})}>⚑ overridden · follow {sel.label}</span>;
}

/* ===== Shared-channel resolvers, hoisted to module scope =====
   These used to live inside InputsTab. React unmounts InputsTab the moment you
   switch to any other tab, which took the locked-channel auto-sync effects down
   with it: a lock looked "live" but quietly stopped following its publisher
   until you navigated back to Inputs. The resolve/apply logic now sits here so
   one implementation serves both the Inputs-tab UI and the always-mounted
   <LockAutoSync/> at the app root. */
function extActiveOf(inp){ const e=inp&&inp.external; return !!(e&&e._schema==='psbeam-external-demands'); }
function lldfResolveFor(inp){
    let raw=null; try{raw=localStorage.getItem('bridgeSuite.v1.lldf');}catch(e){}
    if(!raw) return {why:'No distribution-factor results found.\n\nOpen the LL & DL Distribution app, compute the factors, and click "Send DFs to Design Apps" — then pull here.'};
    let d; try{ d=JSON.parse(raw); }catch(e){ return {why:'Could not read LLDF data: '+(e&&e.message||e)}; }
    if((d.schemaVersion||1)>1) return {why:'LL & DL Distribution data is v'+d.schemaVersion+'; this app supports v1. Update PS-Beam.'};
    // Prefer the specific beam selected in the shared design-beam channel: its own DFs,
    // not the interior/exterior envelope. Fall back to the envelope when no beam is
    // selected, or when the published results predate the per-beam breakdown.
    const want=(inp.loads.pos==='exterior')?'exterior':'interior';
    const BB=window.BridgeBeam, dbeam=BB?BB.get():null;
    const bkey=dbeam?String(dbeam.index):null;
    const byB=d.governing&&d.governing.byBeam, byBn=d.governingNeg&&d.governingNeg.byBeam;
    const perBeam=!!(bkey&&byB&&byB[bkey]&&byB[bkey].gM!=null);
    const src=perBeam?(dbeam.label+' — '+(dbeam.clsLabel||want)):('governing '+want+' girder');
    const gov=perBeam?byB[bkey]:(d.governing&&d.governing[want]);
    if(!gov||gov.gM==null) return {why:'The published LLDF results have no '+want+'-girder values.'};
    const govN=perBeam?(byBn&&byBn[bkey]):(d.governingNeg&&d.governingNeg[want]);
    const gMpos=+(+gov.gM).toFixed(4);
    const gMneg=(govN&&govN.gM!=null)?+(+govN.gM).toFixed(4):gMpos;   // −M region DF (½-span L); falls back to +M
    const gV=+(+gov.gV).toFixed(4);
    const fatM=(gov.fatM!=null)?+(+gov.fatM).toFixed(4):0;            // single-lane fatigue DF (no MPF)
    return {d,src,gMpos,gMneg,gV,fatM,hasNeg:!!govN,at:d.producedAt||'',project:d.project||''};
}

const LLDF_LABELS={extDFpos:'DF +M',extDFneg:'DF −M',extDFv:'DF V',extLLmpf:'MPF',fatM:'fatigue DF',dfm:'DFm',dfv:'DFv'};
const LLDF_DIG={extDFpos:3,extDFneg:3,extDFv:3,extLLmpf:2,fatM:3,dfm:3,dfv:3};
function lldfMineFor(inp){ return extActiveOf(inp)
  ? {extDFpos:+inp.loads.extDFpos, extDFneg:+inp.loads.extDFneg, extDFv:+inp.loads.extDFv, extLLmpf:+inp.loads.extLLmpf, fatM:+inp.loads.fatM}
  : {dfm:+inp.loads.dfm, dfv:+inp.loads.dfv, fatM:+inp.loads.fatM}; }
/* The imported-LL DF / multiple-presence boxes: computeAll (fac1) takes a blank
   box as 1.0, not 0. The pre-lock snapshot and the unlock "restore" prompt must
   therefore keep a blank box blank instead of turning it into 0 via +''. */
const LLDF_BLANK1={extDFpos:1,extDFneg:1,extDFv:1,extLLmpf:1};
function isBlank1(v){ return v===''||v===null||v===undefined; }
function extFac1(v){ if(isBlank1(v)) return 1; const n=+v; return isFinite(n)? n : 1; }   // same rule as fac1 in computeAll
function lldfSnapFor(inp){ const m=lldfMineFor(inp);
  if(extActiveOf(inp)) Object.keys(LLDF_BLANK1).forEach(k=>{ if(isBlank1(inp.loads[k])) m[k]=''; });
  return m; }
function lldfBackDeltas(mine,snap){ const B='blank (1.0 used)', out=[];
  Object.keys(snap).forEach(k=>{ const a=mine[k], b=snap[k];
    if(LLDF_BLANK1[k]&&(isBlank1(a)||isBlank1(b))){ if(isBlank1(a)&&isBlank1(b)) return;
      const d=LLDF_DIG[k]; out.push({key:k, label:LLDF_LABELS[k], from:isBlank1(a)?B:(+a).toFixed(d), to:isBlank1(b)?B:(+b).toFixed(d)}); }
    else out.push(...BL.deltas({[k]:a},{[k]:b},LLDF_LABELS,LLDF_DIG)); });
  return out; }
function lldfTheirsFor(inp,r){ return extActiveOf(inp)
  ? {extDFpos:r.gMpos, extDFneg:r.gMneg, extDFv:r.gV, extLLmpf:1.0, fatM:r.fatM}
  : {dfm:r.gMpos, dfv:r.gV, fatM:r.fatM}; }
function applyLLDFTo(set,inp,r){
  const t=lldfTheirsFor(inp,r);
  if(extActiveOf(inp)) set(p=>({...p, loads:{...p.loads, extDFpos:t.extDFpos, extDFneg:t.extDFneg, extDFv:t.extDFv, extLLmpf:t.extLLmpf, fatM:t.fatM}}));
  else set(p=>({...p, loads:{...p.loads, llAuto:true, dfAuto:false, dfm:t.dfm, dfv:t.dfv, fatM:t.fatM}}));
}
function dlResolveFor(inp){
    let raw=null; try{raw=localStorage.getItem('bridgeSuite.v1.dlLoads');}catch(e){}
    if(!raw) return {why:'No dead-load distribution found.\n\nOpen the LL & DL Distribution app, run the dead-load distribution, and click "Send DL to MCT Loads" — then pull here.'};
    let d; try{ d=JSON.parse(raw); }catch(e){ return {why:'Could not read dead-load data: '+(e&&e.message||e)}; }
    if((d.schemaVersion||1)>1) return {why:'LL & DL dead-load data is v'+d.schemaVersion+'; this app supports v1. Update PS-Beam.'};
    const by={}; (d.cases||[]).forEach(function(c){ by[c.key]=+c.udl||0; });
    // publishDL drops zero cases, so an absent DC2/DW means "the LL & DL app has
    // nothing for it" — which is NOT the same as "it is zero". Only the cases
    // actually published are driven; anything missing stays under manual control
    // rather than being silently zeroed out.
    if(by.DC2==null&&by.DW==null) return {why:'The published dead-load cases contain no DC2 or DW.'};
    const b=d.beam||{};
    const src=b.label?(b.label+(b.clsLabel?(' — '+b.clsLabel):'')):'LL & DL Distribution';
    return {d, src:src, hasBar:by.DC2!=null, hasDW:by.DW!=null,
      cases:(d.cases||[]), Nb:+d.Nb||0, method:d.method||'', selfWeightNote:d.selfWeightNote||'',
      wBar:+(+(by.DC2||0)).toFixed(4), wDW:+(+(by.DW||0)).toFixed(4),
      dc1:+(+(by.DC1||0)).toFixed(4), pl:+(+(by.PL||0)).toFixed(4),
      selfWt:+d.selfWt||0, trib:+b.trib||0, at:d.producedAt||'', project:d.project||''};
}

const DL_LABELS={wBar:'DC2 barrier / SIDL',wDW:'DW wearing surface'};
const DL_DIG={wBar:3,wDW:3};
function dlMineFor(inp){ return {wBar:+inp.loads.wBar, wDW:+inp.loads.wDW}; }
function dlTheirsFor(r){ const o={}; if(r.hasBar) o.wBar=r.wBar; if(r.hasDW) o.wDW=r.wDW; return o; }
function applyDLTo(set,r){ set(p=>({...p, loads:{...p.loads, ...dlTheirsFor(r)}})); }

/* Signatures of the last publish each channel adopted. Module scope rather than a
   ref, so the Inputs tab can clear one on unlock without owning the sync itself. */
const LOCK_SIG={lldf:'',dlLoads:''};

/* Always-mounted auto-sync for every value-carrying lock this app holds.
   Rendered at the app root, so a locked channel keeps adopting each republish
   no matter which tab is on screen. Renders nothing. */
function LockAutoSync({inp,set}){
  const ref=useRef(null);
  ref.current=()=>{
    if(!BL) return;
    if(BL.isLocked('lldf')){
      const r=lldfResolveFor(inp);
      if(!r.why){
        const after=lldfTheirsFor(inp,r);
        const sig=(r.at||'')+'|'+r.src+'|'+JSON.stringify(after);
        if(LOCK_SIG.lldf!==sig){ LOCK_SIG.lldf=sig;
          BL.adopt({app:LOCK_APP, channel:'lldf', before:lldfMineFor(inp), after:after,
            labels:LLDF_LABELS, digits:LLDF_DIG, source:r.src, apply:()=>applyLLDFTo(set,inp,r)}); }
      }
    }
    if(BL.isLocked('dlLoads')){
      const r=dlResolveFor(inp);
      if(!r.why){
        const after=dlTheirsFor(r);
        const sig=(r.at||'')+'|'+r.src+'|'+JSON.stringify(after);
        if(LOCK_SIG.dlLoads!==sig){ LOCK_SIG.dlLoads=sig;
          BL.adopt({app:LOCK_APP, channel:'dlLoads', before:dlMineFor(inp), after:after,
            labels:DL_LABELS, digits:DL_DIG, source:r.src, apply:()=>applyDLTo(set,r)}); }
      }
    }
  };
  useEffect(()=>{
    if(!BL) return;
    const run=()=>{ if(ref.current) ref.current(); };
    run();
    const off=BL.onChange(run);
    const onS=(e)=>{ if(!e.key||e.key==='bridgeSuite.v1.lldf'||e.key==='bridgeSuite.v1.dlLoads'||e.key==='bridgeSuite.v1.designBeam') run(); };
    window.addEventListener('storage',onS);
    return ()=>{ off(); window.removeEventListener('storage',onS); };
  },[]);
  // Interior/exterior and the MIDAS-import mode change WHICH published DF applies.
  useEffect(()=>{ if(ref.current) ref.current(); },[inp.loads.pos, extActiveOf(inp)]);
  return null;
}

/* ================= INPUT TAB ================= */
/* ---------- Inputs page sub-tabs (UI only) ----------
   Every input card is still rendered exactly as before; each group of cards is
   wrapped in one pane and the inactive panes are only hidden (the `hidden`
   attribute), never unmounted, so card state, handlers and bound values are
   untouched and print still shows every card. The active sub-tab is remembered
   per browser in localStorage key psbeam.inputTab.v1 (never in inp, so the
   autosave, the project library and the JSON export are unchanged). */
const PSB_IN_TABS=[['geom','Geometry'],['mat','Materials'],['strands','Strands'],['loads','Loads'],
  ['hd','Handling & Deck'],['opts','Analysis Options'],['reinf','Reinforcement']];
const PSB_IN_KEY='psbeam.inputTab.v1';
let psbInTabMem=null;   // in-memory fallback when storage is blocked
function psbInTabLoad(){ let v=psbInTabMem; try{ const s=localStorage.getItem(PSB_IN_KEY); if(s) v=s; }catch(e){}
  return PSB_IN_TABS.some(t=>t[0]===v)?v:'geom'; }
function psbInTabSave(v){ psbInTabMem=v; try{ localStorage.setItem(PSB_IN_KEY,v); }catch(e){} }
/* Red dot: a pane holds an editable number box that is empty, holds text the
   browser cannot parse, or is outside its own min/max. A box with a placeholder
   (the section-property overrides) is meant to be left blank, so blank is fine there.
   A blank box marked data-blank1 (the imported-LL DF / multiple-presence boxes,
   which computeAll takes as 1.0 when blank) still gets the dot, but its tooltip
   says 1.0 is used. Returns '' (fine), 'bad', 'blank1' or 'both'. */
function psbInPaneState(el){ if(!el) return '';
  let bad=false, b1=false;
  const ins=el.querySelectorAll('input[type="number"]');
  for(let i=0;i<ins.length;i++){ const x=ins[i]; if(x.disabled||x.readOnly) continue; const vy=x.validity||{};
    if(vy.badInput||vy.rangeUnderflow||vy.rangeOverflow) bad=true;
    else if(x.value===''&&!x.placeholder){ if(x.getAttribute('data-blank1')==='1') b1=true; else bad=true; } }
  return bad&&b1?'both':bad?'bad':b1?'blank1':''; }
const PSB_IN_DOT_TIP={bad:'A number in this group is empty or not valid',
  blank1:'A DF / multiple-presence box is blank — 1.0 used',
  both:'A number in this group is empty or not valid; a blank DF / multiple-presence box uses 1.0'};
function PsbInTabs({tab,setTab,marks}){
  const ref=useRef(null);
  const onKey=e=>{ const n=PSB_IN_TABS.length, i=PSB_IN_TABS.findIndex(t=>t[0]===tab); let j=-1;
    if(e.key==='ArrowRight') j=(i+1)%n; else if(e.key==='ArrowLeft') j=(i-1+n)%n;
    else if(e.key==='Home') j=0; else if(e.key==='End') j=n-1;
    if(j<0) return; e.preventDefault(); const k=PSB_IN_TABS[j][0]; setTab(k);
    const b=ref.current&&ref.current.querySelector('#psbInTab-'+k); if(b) b.focus(); };
  return <div ref={ref} className="psbInTabs noprint" role="tablist" aria-label="Input groups" onKeyDown={onKey}>
    {PSB_IN_TABS.map(([k,l])=>{ const bad=!!marks[k];
      return <button key={k} type="button" role="tab" id={'psbInTab-'+k} aria-controls={'psbInPane-'+k}
        aria-selected={tab===k} tabIndex={tab===k?0:-1} className={'psbInTab'+(bad?' has-err':'')}
        title={bad?PSB_IN_DOT_TIP[marks[k]]:undefined}
        onClick={()=>setTab(k)}>{l}<span className="psbInDot" aria-hidden="true"></span></button>; })}
  </div>;
}
function InputsTab({inp,set,R,selRow,setSelRow,editedRows,flashRow,editLog,clearLog,strandPick}){
  const [showHelp,setShowHelp]=useState(false);
  // Inputs page sub-tabs (UI only; see PsbInTabs)
  const [inTab,setInTabS]=useState(psbInTabLoad);
  const setInTab=k=>{ setInTabS(k); psbInTabSave(k); };
  const inPane=k=>({className:'psbInPane',role:'tabpanel',id:'psbInPane-'+k,'aria-labelledby':'psbInTab-'+k,hidden:inTab!==k});
  const [inMarks,setInMarks]=useState({});   // {sub-tab key: 'bad'|'blank1'|'both'}
  useEffect(()=>{ const m={}; PSB_IN_TABS.forEach(t=>{ const st=psbInPaneState(document.getElementById('psbInPane-'+t[0])); if(st) m[t[0]]=st; });
    if(JSON.stringify(m)!==JSON.stringify(inMarks)) setInMarks(m); });
  // A strand clicked in the Live Geometry drawing selects its row: show the
  // Strands sub-tab and bring that row into view (the card itself if it is folded).
  // Only picks made while this page is open count (not an old one on re-mount).
  const pickAtMount=useRef(strandPick);
  useEffect(()=>{ if(!strandPick||strandPick===pickAtMount.current) return; setInTab('strands');
    const t=setTimeout(()=>{ const pane=document.getElementById('psbInPane-strands'); if(!pane) return;
      const tr=pane.querySelector('tr[data-psb-row="'+strandPick.ri+'"]');
      const el=(tr&&tr.offsetParent!==null)?tr:pane;
      try{ el.scrollIntoView({block:tr&&el===tr?'center':'start'}); }catch(e){} },0);
    return ()=>clearTimeout(t); },[strandPick]);
  const u=(path,v)=>{ const o=JSON.parse(JSON.stringify(inp));
    const ks=path.split('.'); let t=o; ks.slice(0,-1).forEach(k=>t=t[k]); t[ks.at(-1)]=v; set(o); };
  const rowU=(i,k,v)=>{const o={...inp,rows:inp.rows.map((r,j)=>j===i?{...r,[k]:v}:r)};set(o); if(flashRow)flashRow(i);};
  const clearDebond=(i)=>{const o={...inp,rows:inp.rows.map((r,j)=>j===i?{...r,nd:0,dbnd:0}:r)};set(o); if(flashRow)flashRow(i);};
  const g=R.error?null:R.g;
  // external MIDAS demands: span picker + banner
  const ext=inp.external;
  const extActive=ext&&ext._schema==='psbeam-external-demands';
  const spans=extActive?externalSpans(ext):[];
  const selSpan=extActive?(ext._selSpan||spans[0]):null;
  const pickSpan=(sp)=>set({...inp,external:{...ext,_selSpan:sp},L:sp.len});
  const clearExt=()=>{const o={...inp};delete o.external;set(o);};
  // ── LL & DL Distribution app two-way link (shared storage; see lldf.html) ──
  // Resolve whatever the LL & DL app last published down to the four numbers
  // this app actually applies. Returns {why:'...'} when there is nothing usable
  // so both the manual pull and the locked auto-sync can share one code path.
  const lldfResolve=()=>lldfResolveFor(inp);
  // The fields the LLDF lock takes over, in this app's own terms. Two shapes,
  // because a MIDAS-driven run applies the factors to the imported envelope
  // instead of to the built-in HL-93 analysis.
  const lldfMine=()=>lldfMineFor(inp);
  const lldfTheirs=(r)=>lldfTheirsFor(inp,r);
  const applyLLDF=(r)=>applyLLDFTo(set,inp,r);
  const pullLLDF=()=>{
    const r=lldfResolve();
    if(r.why){ alert(r.why); return; }
    const when=(r.at||'').slice(0,16).replace('T',' ');
    const msg='Pull from LL & DL Distribution ('+when+')\nProject: '+(r.project||'—')+' · '+r.src+'\n\n'
      +'  g_M +M (moment DF)   = '+r.gMpos.toFixed(3)+'\n'
      +'  g_M −M (pier region) = '+r.gMneg.toFixed(3)+(r.hasNeg?'':'  (no continuity region → = +M)')+'\n'
      +'  g_V (shear DF)       = '+r.gV.toFixed(3)+'\n'
      +(r.fatM>0?'  fatigue DF (1 lane)  = '+r.fatM.toFixed(3)+'\n':'')+'\n'
      +(extActive
        ?'Applies to the imported-LL DF fields: +M DF = g_M(+M), −M DF = g_M(−M), shear DF = g_V, multiple presence = 1.0 (already in the factors)'+(r.fatM>0?', fatigue DF = fatigue-truck single-lane value.':'.')
        :'Applies as manual distribution factors (DF auto off): DFm = g_M(+M), DFv = g_V'+(r.fatM>0?', fatigue DF = single-lane value.':'.'))
      +'\n\nApply?';
    if(!window.confirm(msg)) return;
    applyLLDF(r);
  };
  /* ---- LLDF channel lock ----
     Locked = this app follows the LL & DL app. Every republish is adopted the
     moment it lands, the DF fields go read-only, and each change is logged and
     toasted. Unlocking offers back the values held at the moment of locking. */
  const lockTick=BLU.useLocks?BLU.useLocks():0;
  const lldfLocked=!!(BL&&BL.isLocked('lldf'));
  const lldfSrc=lldfLocked?(lldfResolve().src||'LL & DL Distribution'):'';
  // The auto-sync itself lives in <LockAutoSync/> at the app root — see the note
  // there. This tab only owns the lock toggle, the manual pull, and the display.
  const toggleLLDFLock=(on)=>{
    if(!BL) return;
    if(on){
      const r=lldfResolve();
      if(r.why){ alert(r.why+'\n\nPublish the factors first, then lock.'); return; }
      BL.saveSnap(LOCK_APP,'lldf',lldfSnapFor(inp));   // blank DF/MPF box stays blank (1.0), not 0
      BL.lock('lldf',LOCK_APP);
      const ds=BL.adopt({app:LOCK_APP, channel:'lldf', before:lldfMine(), after:lldfTheirs(r),
        labels:LLDF_LABELS, digits:LLDF_DIG, source:r.src, apply:()=>applyLLDF(r)});
      if(!ds.length) BL.toast('Distribution factors locked','Already matching '+r.src+'. These fields now follow the LL & DL app automatically.');
    }else{
      BL.unlock('lldf',LOCK_APP);
      LOCK_SIG.lldf='';
      const s=BL.takeSnap(LOCK_APP,'lldf');
      if(s&&s.data){
        const back=lldfBackDeltas(lldfSnapFor(inp),s.data);
        if(back.length&&window.confirm('Distribution factors unlocked.\n\nRestore the values you had before locking?\n\n  '+back.map(function(d){return d.label+'  '+d.from+' → '+d.to;}).join('\n  ')))
          set(p=>({...p, loads:{...p.loads, ...s.data}}));
        else BL.toast('Distribution factors unlocked','Manual control — the current values were kept.');
      }else BL.toast('Distribution factors unlocked','Manual control restored.');
    }
  };
  /* ---- Dead-load channel (DC2 / DW) lock ----
     The LL & DL app distributes the superimposed dead load across the girder
     line (MassDOT pile-cap analogy or the per-load rule set); the per-girder
     results are exactly what this app wants for the barrier/SIDL and wearing
     surface. DC1 is deliberately NOT driven — this app computes deck + haunch
     from its own section geometry, so adopting the LLDF tributary DC1 as well
     would count the slab twice. It is shown as a cross-check instead. */
  const dlResolve=()=>dlResolveFor(inp);
  const dlMine=()=>dlMineFor(inp);
  const dlTheirs=(r)=>dlTheirsFor(r);
  const applyDL=(r)=>applyDLTo(set,r);
  const pullDL=()=>{
    const r=dlResolve();
    if(r.why){ alert(r.why); return; }
    const when=(r.at||'').slice(0,16).replace('T',' ');
    const msg='Pull dead loads from LL & DL Distribution ('+when+')\nProject: '+(r.project||'—')+' · '+r.src+(r.trib?('  ·  tributary '+r.trib.toFixed(2)+' ft'):'')+'\n\n'
      +(r.hasBar?'  DC2  barrier / SIDL   = '+r.wBar.toFixed(3)+' klf\n':'  DC2  barrier / SIDL   — not published; your value is kept\n')
      +(r.hasDW ?'  DW   wearing surface  = '+r.wDW.toFixed(3)+' klf\n':'  DW   wearing surface  — not published; your value is kept\n')
      +(r.dc1>0?'  (DC1 deck = '+r.dc1.toFixed(3)+' klf — NOT applied; this app computes deck + haunch itself)\n':'')
      +(r.pl>0?'  (PL pedestrian = '+r.pl.toFixed(3)+' klf — a live load; enter it on the LL group if it governs)\n':'')
      +'\nApply the DC2 and DW values?';
    if(!window.confirm(msg)) return;
    applyDL(r);
  };
  const dlPeek=dlResolve();
  const dlLocked=!!(BL&&BL.isLocked('dlLoads'));
  const dlSrc=dlLocked?((dlPeek&&dlPeek.src)||'LL & DL Distribution'):'';
  // Which of the two fields the current publish actually covers.
  const dlHasBar=!!(dlPeek&&!dlPeek.why&&dlPeek.hasBar), dlHasDW=!!(dlPeek&&!dlPeek.why&&dlPeek.hasDW);
  const dlNote=dlLocked?((dlHasBar&&dlHasDW?'':(' · '+(dlHasBar?'DW':'DC2')+' is not in the publish and stays under your control'))
    +' · drives DC2 / DW only — every DC1 field below stays yours and is added on top'):'';
  const toggleDLLock=(on)=>{
    if(!BL) return;
    if(on){
      const r=dlResolve();
      if(r.why){ alert(r.why+'\n\nPublish the dead loads first, then lock.'); return; }
      BL.saveSnap(LOCK_APP,'dlLoads',dlMine());
      BL.lock('dlLoads',LOCK_APP);
      const ds=BL.adopt({app:LOCK_APP, channel:'dlLoads', before:dlMine(), after:dlTheirs(r),
        labels:DL_LABELS, digits:DL_DIG, source:r.src, apply:()=>applyDL(r)});
      if(!ds.length) BL.toast('Dead loads locked','Already matching '+r.src+'. DC2 and DW now follow the LL & DL app automatically.');
    }else{
      BL.unlock('dlLoads',LOCK_APP);
      LOCK_SIG.dlLoads='';
      const s=BL.takeSnap(LOCK_APP,'dlLoads');
      if(s&&s.data){
        const back=BL.deltas(dlMine(),s.data,DL_LABELS,DL_DIG);
        if(back.length&&window.confirm('Dead loads unlocked.\n\nRestore the values you had before locking?\n\n  '+back.map(function(d){return d.label+'  '+d.from+' → '+d.to;}).join('\n  ')))
          set(p=>({...p, loads:{...p.loads, ...s.data}}));
        else BL.toast('Dead loads unlocked','Manual control — the current values were kept.');
      }else BL.toast('Dead loads unlocked','Manual control restored.');
    }
  };
  const sendLLDF=(silent)=>{
    try{
      const gg=g||girderGross(inp);
      const Ecg=Ec(inp.mat.fc,inp.mat.wc), Ecd=Ec(inp.mat.fcd,inp.mat.wcd);
      const nEI=Ecg/Math.max(Ecd,1e-6);
      const egv=(gg.h+(+inp.th)+(+inp.ts)/2)-gg.yb;
      const Nb=Math.max(2,Math.round(+inp.nGirders||4));
      const spansOut=(ext&&ext.member&&Array.isArray(ext.member.spans)&&ext.member.spans.length)?ext.member.spans.map(Number):[+inp.L];
      const rawG=(typeof GIRDERS!=='undefined'&&GIRDERS[inp.girder])||{};
      const typ=rawG.box?'g':rawG.next?'e':rawG.deck?'g':'k';   // adjacent box→(g); NEXT tee→(e); else precast I→(k)
      // For an adjacent box / slab beam LL & DL uses the type-(g) formula, which needs the
      // beam width b, a moment of inertia I, and the St. Venant torsion J. Send all three so
      // that side does not have to be re-entered by hand. Two deliberate choices:
      //   * I is the COMPOSITE Ix (girder + transformed topping), not the bare-girder I --
      //     this is what the engineer asked to follow, so it is labelled as composite on the
      //     LL & DL side rather than quietly substituted for the bare value AASHTO tabulates.
      //   * J is the same St. Venant constant the MCT export uses (weakAxisAndJ), closed
      //     single-cell for a voided box, so the two apps agree on it.
      const isBoxLike=!!(rawG.box||rawG.deck);
      const IcComp=(R&&R.cp&&isFinite(R.cp.Ic)&&R.cp.Ic>0)? Math.round(R.cp.Ic) : Math.round(gg.I);
      const wj=(typeof weakAxisAndJ==='function')? weakAxisAndJ(gg) : null;
      const boxW=Math.round(+gg.w||+gg.btf||0);
      const boxProps=isBoxLike ? {
        boxB: boxW>0? boxW : undefined,
        boxI: IcComp,
        boxJ: (wj&&isFinite(wj.J)&&wj.J>0)? Math.round(wj.J) : undefined,
        boxIsComposite: true
      } : {};
      const payload={_schema:'bridge-lldf-geometry',schemaVersion:1,producer:'PS-Beam',
        producedAt:new Date().toISOString(),project:inp.proj.name||'',
        position:inp.loads.pos||'interior',memberLabel:inp.proj.girderId||'',
        Nb, de:(inp.loads.de!=null?+inp.loads.de:null),
        inputs:{type:typ, spans:spansOut, spacings:Array(Math.max(1,Nb-1)).fill(+inp.S),
          ts:+inp.ts, skew:+inp.loads.skew||0, depth:+gg.h||undefined,
          I:Math.round(gg.I), A:Math.round(gg.A), eg:+egv.toFixed(2), n:+nEI.toFixed(3),
          ...boxProps}};
      const rawGeom=JSON.stringify(payload);
      // NOTE: section properties for LL & DL ride the standing psSection publisher below
      // (the same channel the MCT auto-fill uses). It republishes on every recompute, so it,
      // not this send, is the single writer of bridgeSuite.v1.psSection -- two writers with
      // different field sets on one key was exactly how the composite I kept getting lost.
      if(silent){
        // A locked republish carrying the same layout is not news. Strip the
        // timestamp and compare, so LL & DL only hears about real movement.
        try{ const prev=localStorage.getItem('bridgeSuite.v1.lldfGeom');
          if(prev){ const a=JSON.parse(prev), b=JSON.parse(rawGeom);
            delete a.producedAt; delete b.producedAt;
            if(JSON.stringify(a)===JSON.stringify(b)) return false; } }catch(e){}
      }
      try{ localStorage.setItem('bridgeSuite.v1.lldfGeom',rawGeom); }
      catch(e){ if(!silent) alert('Could not write to shared storage: '+e.message); return false; }
      // Locked republishes must not yank the engineer out of this app.
      if(!silent) bridgeNav('lldf');
      return true;
    }catch(e){ if(!silent) alert('Could not send geometry: '+(e&&e.message||e)); return false; }
  };
  /* ---- Geometry channel lock ----
     Same channel MCT publishes; drives() picks whichever app owns the lock, so
     having this tab and MCT open at once does not start a republish war.
     Debounced because the span / spacing fields are typed a digit at a time. */
  const geomLocked=!!(BL&&BL.isLocked('geometry'));
  const geomTimer=useRef(null);
  useEffect(()=>{
    if(!BL||!BL.drives('geometry',LOCK_APP,'PS-Beam')) return;
    clearTimeout(geomTimer.current);
    geomTimer.current=setTimeout(()=>{
      if(sendLLDF(true)){
        BL.log({channel:'geometry', app:LOCK_APP, source:'this app',
          text:'republished the bridge layout'});
      }
    },800);
    return ()=>clearTimeout(geomTimer.current);
  },[inp,R,geomLocked]);
  const toggleGeomLock=(on)=>{
    if(!BL) return;
    if(on){
      const wrote=sendLLDF(true);
      BL.lock('geometry',LOCK_APP);
      BL.log({channel:'geometry', app:LOCK_APP, source:'this app',
        text:'auto-send ON \u2014 LL & DL now follows this girder\u2019s layout'
          +(wrote?'':' (layout already current)')});
      BL.toast('Geometry locked','The LL & DL Distribution app will follow this girder\u2019s spans, spacing and skew until you unlock it.');
    } else {
      BL.unlock('geometry',LOCK_APP);
      BL.log({channel:'geometry', app:LOCK_APP, source:'this app', text:'auto-send OFF'});
    }
  };

  return (<div>
    {showHelp&&<MidasHelp onClose={()=>setShowHelp(false)}/>}
    <PsbInTabs tab={inTab} setTab={setInTab} marks={inMarks}/>
    {extActive&&<div className="callout" style={{marginTop:0,marginBottom:14,borderColor:'var(--blue)',background:'#EEF4FF'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8}}>
        <b>Running on MIDAS demands</b>
        <div className="btnrow" style={{margin:0}}>
          <button className="btn sm ghost" onClick={()=>setShowHelp(true)}>? import help</button>
          <button className="btn sm ghost" onClick={clearExt}>✕ use built-in analysis</button>
        </div>
      </div>
      <div style={{fontSize:11.5,marginTop:4,lineHeight:1.6}}>
        Source: {ext.source} · {ext.generatedBy||'export'} · project {ext.project||'—'} · {ext.stations.length} stations · LL type: <b>{ext.liveLoadType||'—'}</b><br/>
        {ext.distributionFactor!==undefined||ext.impactFactor!==undefined
          ? <React.Fragment>Distribution factor ({fmt(+ext.distributionFactor||0,3)}) and impact ({fmt(+ext.impactFactor||1,3)}) are <b>already applied</b> in the LL envelope</React.Fragment>
          : <React.Fragment>Distribution factor and impact are <b>already applied</b> in the LL envelope (per the export contract)</React.Fragment>
        } — PS-Beam does not re-apply them. PS-Beam computes the non-composite loads itself (girder self-weight + DC1 deck/haunch on the non-composite section); MIDAS supplies DC2, DW, and LL.
      </div>
      {spans.length>1&&<div style={{marginTop:8}}>
        <div style={{fontSize:11,color:'var(--ink2)',marginBottom:4}}>Select span to investigate ({spans.length}-span continuous member):</div>
        <div className="btnrow" style={{flexWrap:'wrap'}}>{spans.map(sp=>
          <button key={sp.idx} className={'btn sm'+(selSpan&&selSpan.idx===sp.idx?' pri':' ghost')}
            onClick={()=>pickSpan(sp)}>Span {sp.idx}: {fmt(sp.x0,0)}–{fmt(sp.x1,0)} ft ({fmt(sp.len,0)}′)</button>)}</div>
      </div>}
      {selSpan&&<div style={{fontSize:11.5,marginTop:6}}>Active: <b>Span {selSpan.idx}</b>, length <b>{fmt(selSpan.len,1)} ft</b> — PS-Beam span L is set to this. Pier negative moments at the span ends feed the continuity check.</div>}
      {selSpan&&Math.abs(selSpan.len-inp.L)>0.5&&<div style={{fontSize:11,color:'var(--fail)',marginTop:4}}>Note: input span L ({fmt(inp.L,1)} ft) differs from the selected span; using {fmt(selSpan.len,1)} ft.</div>}
    </div>}
    {!extActive&&<div style={{marginTop:0,marginBottom:12,fontSize:11.5,color:'var(--ink2)'}}>
      Importing analysis results from MIDAS? <a onClick={()=>setShowHelp(true)} style={{color:'var(--blue)',cursor:'pointer',textDecoration:'underline'}}>Read the import guide</a> before exporting from the MCT Generator.
    </div>}
    {!R.error&&R.warns&&R.warns.length>0&&
      <div className="callout warn" style={{marginTop:0,marginBottom:14}}>
        <b>Detailing warnings ({R.warns.length})</b>
        <ul className="warnlist">{R.warns.map((w,i)=><li key={i}>{w}</li>)}</ul>
      </div>}
    <div {...inPane('geom')}>
    <Card title="Girder & Bridge Geometry" refTag="LRFD 4.6.2.6" fold>
      <SubH t="Span &amp; framing"/>
      <div className="frow rows">
        <Sel l="Girder section" v={inp.girder} set={v=>u('girder',v)} opts={Object.keys(GIRDERS)}/>
        <Num l="Span, center to center of bearings" u="ft" v={inp.L} set={v=>u('L',v)} step={1}/>
        <Num l="Girder spacing" u="ft" v={inp.S} set={v=>u('S',v)} step={0.25}/>
        <Num l="Number of girders in the cross-section" v={inp.nGirders} set={v=>u('nGirders',v)} step={1} min={2}/>
      </div>
      <SubH t="Deck &amp; haunch" r="composite section"/>
      <div className="frow rows">
        <Num l="Deck thickness — structural" u="in" v={inp.ts} set={v=>u('ts',v)} step={0.25}/>
        <Num l="Haunch / build-up height" u="in" v={inp.th} set={v=>u('th',v)} step={0.25}/>
        <Fld l="Effective flange width b_eff">
          <Seg opts={[{v:true,l:'AUTO (=S)'},{v:false,l:'MANUAL'}]} v={inp.beffAuto} set={v=>u('beffAuto',v)}/></Fld>
        {!inp.beffAuto&&<Num l="b_eff (entered)" u="in" v={inp.beff} set={v=>u('beff',v)} step={1} min={0}/>}
        {g&&<Fld l="Haunch in composite properties">
          <Seg opts={[{v:false,l:'EXCLUDE'},{v:true,l:'INCLUDE'}]} v={!!inp.haunchInProps} set={v=>u('haunchInProps',v)}/></Fld>}
        <Chk l="Separate deck thickness for dead-load weight"
             sub="e.g. a sacrificial or integral wearing course"
             v={!!inp.tsSeparate} set={v=>u('tsSeparate',v)}/>
        {inp.tsSeparate&&<Num l="Deck thickness — dead load" u="in" v={inp.tsDL} set={v=>u('tsDL',v)} step={0.25}/>}
      </div>
      {inp.tsSeparate&&<div className="hint">Section and capacity use <b>{fmt(inp.ts,2)}″</b>; DC1 deck weight uses <b>{fmt(+inp.tsDL||+inp.ts,2)}″</b>{R&&R.cp&&R.cp.wdkDeck!=null?<span> → deck weight <b>{fmt(R.cp.wdkDeck,3)} klf</b>, {fmt(R.cp.wdkDeck-(R.cp.wdkW*(+inp.ts)/144)*(+inp.mat.wcdLoad||+inp.mat.wcd),3)} klf more than the structural thickness would give. It is carried in DC1 — see the DC1 build-up on the Loads card.</span>:null}</div>}
      {g&&<div className="hint">Haunch weight is always carried in DC; the toggle only controls whether the {fmt(inp.th,2)}″ haunch is counted in the composite section stiffness. Typical practice <b>excludes</b> it (deck/topping modeled bearing on the {g.isNext?'flange':'top flange'}). The haunch takes up camber and holds deck grade.</div>}
      {inp.girder==='Custom'&&<React.Fragment>
        <SubH t="Custom section dimensions" r="girder section = Custom"/>
        <div className="frow rows">
          <Num l="Overall depth h" u="in" v={inp.cust.h} set={v=>u('cust.h',v)}/>
          <Num l="Gross area A" u="in²" v={inp.cust.A} set={v=>u('cust.A',v)}/>
          <Num l="Moment of inertia I" u="in⁴" v={inp.cust.I} set={v=>u('cust.I',v)} step={100}/>
          <Num l="Centroid from bottom y_b" u="in" v={inp.cust.yb} set={v=>u('cust.yb',v)}/>
          <Num l="Web width b_w" u="in" v={inp.cust.bw} set={v=>u('cust.bw',v)}/>
          <Num l="Top flange width" u="in" v={inp.cust.btf} set={v=>u('cust.btf',v)}/>
          <Num l="Bottom flange width" u="in" v={inp.cust.bbf} set={v=>u('cust.bbf',v)}/>
        </div></React.Fragment>}
      {g&&g.isNext&&<div className="callout" style={{marginTop:8}}>
        <b>NEXT F double-tee.</b> The flange (deck) width is set by the beam width — entered here as girder spacing × 12 = <b>{fmt(inp.S*12,0)}″</b>, used at <b>{fmt(g.btf,1)}″</b> (clamped to the {fmt(g.next.wMin,0)}–{fmt(g.next.wMax,0)}″ range). Section properties interpolate linearly between the tabulated minimum- and maximum-width values. Two stems at {fmt(g.next.stemCC,0)}″ c/c, each {fmt(g.next.B,1)}″ wide; the {fmt(g.next.ft,1)}″ flange is integral. Set deck thickness for a composite topping, or 0 for a non-composite (bare-flange) riding surface.
      </div>}
      {g&&(()=>{ const gB=(typeof girderGrossBase==='function')?girderGrossBase(inp):g;
        const PROPS=[['Area A','A','in²',0,1],['Moment of inertia I_x','I','in⁴',0,100],
          ['y_b (centroid, from bottom)','yb','in',2,0.1],['S_b (bottom)','Sb','in³',0,10],
          ['S_t (top)','St','in³',0,10],['Self-weight','wsw','klf',3,0.001]];
        const on=!!inp.ovr.on, anyOvr=!!(g.ovr&&g.ovr.any);
        return <React.Fragment>
          <SubH t="Gross section properties"
                r={g.isNext?('interpolated @ '+fmt(g.btf,0)+'″ width'):(on?'shape value · override · used':'from the '+inp.girder+' shape')}/>
          <table className="eng">
            <thead><tr><th style={{textAlign:'left'}}>Property</th><th>{inp.girder}</th>
              {on&&<th>Override</th>}<th>Used</th><th style={{textAlign:'left'}}>Unit</th></tr></thead>
            <tbody>{PROPS.map(([lab,k,uu,dig,step])=>{
              const ovrd=!!(g.ovr&&g.ovr[k]);
              return <tr key={k}>
                <td style={{textAlign:'left'}}>{lab}</td>
                <td style={{color:'var(--ink2)'}}>{fmt(gB[k],dig)}</td>
                {on&&<td style={{padding:'2px 4px'}}><input type="number" step={step} value={inp.ovr[k]}
                  placeholder={fmt(gB[k],dig)} onChange={e=>u('ovr.'+k,e.target.value===''?'':+e.target.value)}
                  style={{width:86,border:'1.3px solid var(--line)',background:'var(--sheet)',fontFamily:'var(--mono)',fontSize:12,padding:'2px 5px',textAlign:'right'}}/></td>}
                <td style={{fontWeight:600,color:ovrd?'#B45309':'var(--ink)'}}>{fmt(g[k],dig)}{ovrd?' ✎':''}</td>
                <td style={{textAlign:'left',color:'var(--ink2)'}}>{uu}</td></tr>;})}</tbody>
          </table>
          <div className="frow rows" style={{marginTop:6}}>
            <Chk l="Override section properties"
                 sub={'use my own A, I, S or self-weight instead of the '+inp.girder+' shape values'}
                 v={on} set={v=>u('ovr.on',v)}/>
          </div>
          {on&&<div className="hint">Leave an override blank to keep the shape value. S_b and S_t recompute from I and y_b unless you enter them directly; self-weight recomputes from A unless entered. Every downstream check — stresses, losses, camber, flexure, shear and rating — uses the section in the <b>Used</b> column.{anyOvr?<span style={{color:'#B45309',fontWeight:600}}> Overrides active (✎).</span>:<span> Nothing overridden yet.</span>}</div>}
        </React.Fragment>; })()}
    </Card>

    </div>
    <div {...inPane('mat')}>
    <Card title="Materials & Time" refTag="LRFD 5.4.2" fold>
      <SubH t="Concrete strengths" r="LRFD 5.4.2.1"/>
      <div className="frow rows">
        <Num l="f′ci — girder at release" u="ksi" v={inp.mat.fci} set={v=>u('mat.fci',v)}/>
        <Num l="f′c — girder at 28 days" u="ksi" v={inp.mat.fc} set={v=>u('mat.fc',v)}/>
        <Num l="f′c — deck" u="ksi" v={inp.mat.fcd} set={v=>u('mat.fcd',v)}/>
      </div>
      <SubH t="Unit weights" r="LRFD 5.4.2.4 · C5.4.2.4"/>
      <div className="frow rows">
        <Num l="Unit wt girder — modulus" u="kcf" v={inp.mat.wc} set={v=>u('mat.wc',v)} step={0.005}
             sub="feeds E_c only — plain concrete density"/>
        <Num l="Unit wt girder — dead load" u="kcf" v={inp.mat.wcLoad} set={v=>u('mat.wcLoad',v)} step={0.005}
             sub="drives self-weight — usually higher, for reinforcement"/>
        <Num l="Unit wt deck — modulus" u="kcf" v={inp.mat.wcd} set={v=>u('mat.wcd',v)} step={0.005}/>
        <Num l="Unit wt deck — dead load" u="kcf" v={inp.mat.wcdLoad} set={v=>u('mat.wcdLoad',v)} step={0.005}/>
      </div>
      <SubH t="Environment" r="creep &amp; shrinkage"/>
      <div className="frow rows">
        <Num l="Relative humidity H" u="%" v={inp.mat.H} set={v=>u('mat.H',v)} step={5}/>
        <Num l="Volume / surface ratio V/S" u="in" v={inp.mat.VS} set={v=>u('mat.VS',v)}/>
      </div>
      <SubH t="Concrete age at each stage" r="days after casting"/>
      <div className="frow rows">
        <Num l="t — strand transfer (release)" u="days" v={inp.mat.ti} set={v=>u('mat.ti',v)} step={0.25}/>
        <Num l="t — deck placed" u="days" v={inp.mat.td} set={v=>u('mat.td',v)} step={10}/>
        <Num l="t — final (end of service)" u="days" v={inp.mat.tfin} set={v=>u('mat.tfin',v)} step={1000}/>
      </div>
      <div className="hint" style={{marginTop:2}}>Two unit weights per material: the <b>modulus</b> value feeds E<sub>c</sub> (LRFD 5.4.2.4, typically the plain-concrete density, e.g. 0.145 kcf) while the <b>dead-load</b> value drives self-weight and deck weight (typically higher to account for reinforcement, e.g. 0.155 kcf). Per C5.4.2.4 the two need not be equal.</div>
      {!R.error&&<div className="hint">E_ci = <b>{fmt(R.lo.Eci,0)} ksi</b> · E_c = <b>{fmt(R.cp.Ecg,0)} ksi</b> · E_deck = <b>{fmt(R.cp.Ecd,0)} ksi</b> · n = E_d/E_g = <b>{fmt(R.cp.n,3)}</b></div>}
    </Card>

    </div>
    <div {...inPane('strands')}>
    <Card title="Prestressing Strands" refTag="LRFD 5.4.4 / 5.9" fold
      right={<span className="ref" style={{fontWeight:600}}>{R.error?'':`${R.ss.Ntot} strands · Aps = ${fmt(R.ss.Aps,3)} in²`}</span>}>
      <SubH t="Strand type &amp; jacking" r="LRFD 5.4.4"/>
      <div className="frow rows">
        <Sel l="Strand size (270 ksi low relaxation)" v={inp.str.size} set={v=>u('str.size',v)} opts={Object.keys(STRANDS)}/>
        <Num l="Jacking stress (× f_pu)" u="" v={inp.str.jack} set={v=>u('str.jack',v)} step={0.01}
             sub="0.75 f_pu is the 5.9.2.2 limit for low-relaxation strand"/>
        <Num l="Strand modulus E_p" u="ksi" v={inp.str.Ep} set={v=>u('str.Ep',v)} step={100}/>
      </div>
      <SubH t="Straight strand rows" r="y measured from the bottom · click a row to highlight it"/>
      <table className="eng" style={{marginTop:4}}>
        <thead><tr><th>Row</th><th>No.</th><th>y (in)</th><th>No. debonded</th><th>Debond length ea. end (ft)</th><th></th></tr></thead>
        <tbody>{inp.rows.map((r,i)=>{
          const isSel=selRow===i, isEdited=editedRows&&editedRows[i];
          return <tr key={i} data-psb-row={i} onClick={()=>setSelRow&&setSelRow(isSel?null:i)}
            style={{cursor:setSelRow?'pointer':'default',
              boxShadow:isSel?'inset 3px 0 0 var(--blue)':(isEdited?'inset 3px 0 0 #15803D':'none'),
              background:isSel?'#F2F7FF':(isEdited?'#F0FBF3':'transparent'),
              transition:'background .5s'}}>
          <td>{i+1}</td>
          {['n','y','nd','dbnd'].map(k=><td key={k}><input type="number"
            step={k==='n'?2:k==='nd'?1:0.5} min={k==='nd'?0:undefined}
            value={r[k]!==undefined?r[k]:0}
            onClick={e=>e.stopPropagation()}
            onChange={e=>rowU(i,k,+e.target.value)} style={{width:70,border:'1px solid var(--line)',fontFamily:'var(--mono)',fontSize:12,padding:'2px 5px',textAlign:'right'}}/></td>)}
          <td style={{whiteSpace:'nowrap'}}>
            {(+r.nd>0||+r.dbnd>0)&&<button className="btn sm ghost" title="Clear debonding on this row"
              onClick={e=>{e.stopPropagation();clearDebond(i);}} style={{marginRight:3,padding:'1px 5px'}}>⌁✕</button>}
            <button className="btn sm ghost" title="Delete row"
              onClick={e=>{e.stopPropagation();set({...inp,rows:inp.rows.filter((_,j)=>j!==i)});if(setSelRow)setSelRow(null);}}>✕</button>
          </td>
        </tr>;})}</tbody></table>
      <div className="btnrow" style={{marginTop:8}}>
        <button className="btn sm" onClick={()=>set({...inp,rows:[...inp.rows,{n:2,y:(inp.rows.at(-1)?.y||0)+2,dbnd:0,nd:0}]})}>+ Add row</button>
      </div>
      {!R.error&&(()=>{ // live debond summary vs LRFD 5.9.4.3.3
        const pct=100*R.ss.Ndebond/Math.max(R.ss.Nbond,1);
        const overTot=pct>25.01;
        const overRow=inp.rows.some(r=>+r.dbnd>0&&+r.n>0&&100*Math.min(+r.nd||0,+r.n)/+r.n>40.01);
        if(R.ss.Ndebond===0) return null;
        return <div className="hint" style={{marginTop:6}}>
          Debonded: <b>{R.ss.Ndebond}</b> of {R.ss.Nbond} straight strands (<b style={{color:overTot?'var(--fail)':'inherit'}}>{fmt(pct,0)}%</b>{overTot?' — exceeds 25% total':''}).
          {overRow&&<b style={{color:'var(--fail)'}}> One or more rows exceed 40% debonded.</b>} LRFD 5.9.4.3.3 caps total debonding at 25% and 40% per row; verify termination staggering.
        </div>;})()}
      {editLog&&editLog.length>0&&<div style={{marginTop:10,border:'1px solid var(--line2)',borderRadius:5,overflow:'hidden'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#F0FBF3',
          padding:'5px 9px',borderBottom:'1px solid var(--line2)'}}>
          <span style={{fontSize:10.5,letterSpacing:'.6px',textTransform:'uppercase',color:'#15803D',fontWeight:700}}>✓ Strand edits from graphic ({editLog.length})</span>
          <button className="btn sm ghost" onClick={clearLog} style={{padding:'1px 7px'}}>clear log</button>
        </div>
        <div style={{maxHeight:120,overflowY:'auto'}}>
          {editLog.map((e,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',gap:8,
            padding:'3px 9px',fontSize:11,fontFamily:'var(--mono)',borderBottom:i<editLog.length-1?'1px solid #EEF2F6':'none',
            color:i===0?'#15803D':'var(--ink2)',fontWeight:i===0?600:400}}>
            <span>{e.msg}</span>
            <span style={{color:'var(--ink3,#9aa)',whiteSpace:'nowrap'}}>{new Date(e.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>
          </div>)}
        </div>
      </div>}
      <SubH t="Harped group" r="two-point harp"/>
      <div className="frow rows">
        <Num l="Number of harped strands" v={inp.harp.n} set={v=>u('harp.n',v)} step={2}/>
        <Num l="Harped CG at the girder end" u="in" v={inp.harp.yEnd} set={v=>u('harp.yEnd',v)}/>
        <Num l="Harped CG at midspan" u="in" v={inp.harp.yMid} set={v=>u('harp.yMid',v)}/>
