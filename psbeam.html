/* Compact print-friendly SVG line diagram (moment or shear) from the diagrams[] data. */
function MiniDiagram({data,series,L,ylabel,title,zeroLine=true}){
  const W=640,H=220,padL=58,padR=14,padT=14,padB=34;
  const xs=data.map(r=>r.x);
  const allY=[].concat(...series.map(s=>data.map(r=>r[s.key])));
  let ymin=Math.min(0,...allY), ymax=Math.max(0,...allY);
  if(ymin===ymax){ymin-=1;ymax+=1;}
  const pad=(ymax-ymin)*0.08; ymin-=pad; ymax+=pad;
  const X=x=>padL+(x/L)*(W-padL-padR);
  const Y=y=>padT+(1-(y-ymin)/(ymax-ymin))*(H-padT-padB);
  const path=s=>data.map((r,i)=>`${i?'L':'M'}${X(r.x).toFixed(1)},${Y(r[s.key]).toFixed(1)}`).join(' ');
  // y gridlines (nice round)
  const span=ymax-ymin, step=Math.pow(10,Math.floor(Math.log10(span/4)));
  const niceStep=[1,2,2.5,5,10].map(m=>m*step).reduce((b,s)=>Math.abs(span/s-4)<Math.abs(span/b-4)?s:b,step);
  const ticks=[]; for(let v=Math.ceil(ymin/niceStep)*niceStep; v<=ymax; v+=niceStep) ticks.push(v);
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',background:'#fff',border:'1px solid var(--line2)'}}>
    <text x={padL} y={11} fontSize="10" fontFamily="var(--sans)" fontWeight="700" fill="#16212E" style={{letterSpacing:'.5px'}}>{title}</text>
    {ticks.map((v,i)=><g key={i}>
      <line x1={padL} x2={W-padR} y1={Y(v)} y2={Y(v)} stroke={Math.abs(v)<1e-9?'#16212E':'#E2E8EE'} strokeWidth={Math.abs(v)<1e-9?1:0.6}/>
      <text x={padL-5} y={Y(v)+3} fontSize="8.5" fontFamily="var(--mono)" fill="#46586B" textAnchor="end">{fmt(v,0)}</text>
    </g>)}
    {[0,0.25,0.5,0.75,1].map((f,i)=><g key={'x'+i}>
      <line x1={X(f*L)} x2={X(f*L)} y1={padT} y2={H-padB} stroke="#EEF2F6" strokeWidth="0.6"/>
      <text x={X(f*L)} y={H-padB+13} fontSize="8.5" fontFamily="var(--mono)" fill="#46586B" textAnchor="middle">{fmt(f*L,0)}</text>
    </g>)}
    <text x={(W)/2} y={H-4} fontSize="8.5" fontFamily="var(--mono)" fill="#46586B" textAnchor="middle">x (ft)</text>
    <text x={12} y={H/2} fontSize="8.5" fontFamily="var(--mono)" fill="#46586B" textAnchor="middle" transform={`rotate(-90 12 ${H/2})`}>{ylabel}</text>
    {series.map((s,i)=><path key={i} d={path(s)} fill="none" stroke={s.color} strokeWidth={s.w||1.6} strokeDasharray={s.dash||''}/>)}
    {/* legend */}
    {series.map((s,i)=><g key={'l'+i} transform={`translate(${padL+8+i*128},${padT+4})`}>
      <line x1={0} x2={16} y1={0} y2={0} stroke={s.color} strokeWidth={s.w||1.6} strokeDasharray={s.dash||''}/>
      <text x={20} y={3} fontSize="8.5" fontFamily="var(--mono)" fill="#46586B">{s.label}</text>
    </g>)}
  </svg>);
}

function ReportGraphics({inp,R}){
  const d=R.diagrams,L=R.L;
  const Mser=[
    {key:'M_StrI_pos',label:'Strength I',color:'#B3261E',w:2},
    {key:'M_DC',label:'ΣDC',color:'#15803D',w:1.4,dash:'4 2'},
    {key:'M_LLpos',label:'LL+ (env)',color:'#1C4FC4',w:1.4},
  ];
  if(d.some(r=>r.M_LLneg<-1)) Mser.push({key:'M_LLneg',label:'LL− (env)',color:'#7C3AED',w:1.4});
  const Vser=[
    {key:'V_StrI_pos',label:'Strength I',color:'#B3261E',w:2},
    {key:'V_DC',label:'ΣDC',color:'#15803D',w:1.4,dash:'4 2'},
    {key:'V_LLpos',label:'LL+ (env)',color:'#1C4FC4',w:1.4},
  ];
  if(d.some(r=>r.V_LLneg<-1)) Vser.push({key:'V_LLneg',label:'LL− (env)',color:'#7C3AED',w:1.4});
  return(<Card title="Force-Effect Diagrams" refTag="Strength I envelope with components">
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      <MiniDiagram data={d} series={Mser} L={L} ylabel="moment (k-ft)" title="FACTORED MOMENT"/>
      <MiniDiagram data={d} series={Vser} L={L} ylabel="shear (kip)" title="FACTORED SHEAR"/>
    </div>
    <div className="callout">Strength I = 1.25 DC + 1.50 DW + 1.75 (LL+IM){R.useExt?', from the imported MIDAS envelope (DF & IM applied)':', built-in HL-93 envelope'}. Full component and limit-state plots are on the Diagrams tab.</div>
  </Card>);
}

function ReportTab({inp,R}){
  const [,snapBump]=useState(0);
  useEffect(()=>{const h=()=>snapBump(t=>t+1);window.addEventListener('psbeam-snap',h);return ()=>window.removeEventListener('psbeam-snap',h);},[]);
  const g=R.g,cp=R.cp,ss=R.ss,m=inp.mat,lo=R.lo,rf=lo.ref,fin=R.refFin,f=R.fMid,c=R.cam,hl=R.hl,df=R.df;
  const refined=inp.opt.lossMethod==='refined';
  const L=R.L, Lin=L*12, ck=R.checks, sh0=R.shear.find(s=>!s.isBearing)||R.shear[0], phiV=R.phiV;
  const cf=n=>ck.find(c=>c.n===n)||{loc:0,pass:true};
  const ts=+inp.ts, th=+inp.th, Ep=+inp.str.Ep, fpu=+inp.str.fpu;
  const row=loc=>R.grid.reduce((b,r)=>Math.abs(r.x-loc)<Math.abs(b.x-loc)?r:b,R.grid[0]);
  const rMid=row(L/2);

  /* --- recomputed intermediates for display (mirror the engine) --- */
  const Ad=cp.beff*cp.n*ts, yd=g.h+th+ts/2, Ah=g.btf*cp.n*th, yh=g.h+th/2;
  const Ic2=g.A*(cp.ybc-g.yb)**2, Ic3=cp.beff*cp.n*ts**3/12, Ic4=Ad*(yd-cp.ybc)**2,
        Ic5=g.btf*cp.n*th**3/12, Ic6=Ah*(yh-cp.ybc)**2;
  const cgsNum=[...ss.rows.map(r=>`${r.n}\\cdot ${r.y}`),...(ss.nh>0?[`${ss.nh}\\cdot ${ss.hp.yMid}`]:[])].join('+');
  const em=ss.eMid, X1=g.I+em*em*g.A, MgM=R.wG*L*L/8*12;
  const ktdID=ktdAASHTO(m.td-m.ti,m.fci), ktdIF=ktdAASHTO(m.tfin-m.ti,m.fci),
        ktdDF=ktdAASHTO(m.tfin-m.td,m.fci), ktdK=12*(100-4*m.fci)/(m.fci+20);
  const gh=1.7-0.01*m.H, gst=5/(1+m.fci);
  const Mbar=inp.loads.wBar*L*L/8*12, Mdw=inp.loads.wDW*L*L/8*12, MLLm=R.MLL*12;
  const PeMid=rMid.Aps*R.fpe;
  /* shear components at critical section */
  const shx=sh0.x, V_=w=>w*(L/2-shx), Vg=V_(R.wG), Vdk=V_(R.wDk), Vbar=V_(R.wBar), Vdw=V_(R.wDW),
        Vll=R.VLL*(1-shx/L), apsX=ss.at(shx).Aps, fpo=0.7*fpu,
        rN=row(shx), MuU=Math.max(rN.Mu,Math.abs(sh0.Vu-sh0.Vp)*sh0.dv),
        cotT=1/Math.tan(sh0.theta*Math.PI/180),
        fgN=R.flexGrid.reduce((b,r)=>Math.abs(r.x-shx)<Math.abs(b.x-shx)?r:b,R.flexGrid[0]);
  /* camber components */
  const Ps=ss.AsStraight*R.fpi, Ph=ss.AsHarp*R.fpi, eS=g.yb-ss.cgsStraight,
        eHm=g.yb-(+ss.hp.yMid), eHe=g.yb-(+ss.hp.yEnd), aH=ss.hp.frac*Lin,
        d1=Ps*eS*Lin*Lin/(8*lo.Eci*g.I),
        d2=ss.nh>0? Ph*(eHm*Lin*Lin/8-(eHm-eHe)*aH*aH/6)/(lo.Eci*g.I):0;
  const mu_=inp.opt.mult;
  /* limits */
  const lim=R.lim;
  /* transformed-release display helper */
  const niT=Ep/lo.Eci;
  const transAt=r=>{ const cgs=g.yb-r.e, At=g.A+(niT-1)*r.Aps,
    ybt=(g.A*g.yb+(niT-1)*r.Aps*cgs)/At,
    It=g.I+g.A*(ybt-g.yb)**2+(niT-1)*r.Aps*(ybt-cgs)**2;
    return {At,ybt,It,eT:ybt-cgs,Sbt:It/ybt,Stt:It/(g.h-ybt),P0:r.Aps*R.fpbt}; };
  const rRc=row(cf('Release comp').loc), rRt=row(cf('Release tens').loc), rS1=row(cf('Srv comp (perm)').loc), rS2=row(cf('Srv comp (full)').loc),
        rS3=row(cf('Srv III tens').loc), rDk=row(cf('Deck comp').loc);
  /* tenth-point output rows */
  const tenth=R.grid.filter(r=>Math.abs(r.x*10/L-Math.round(r.x*10/L))<1e-6);
  const flex20=R.flexGrid.filter(r=>Math.abs(r.x*20/L-Math.round(r.x*20/L))<1e-6);
  const ckLL=ck.find(x=>x.n==='LL deflection');

  return(<div>
    <div className="btnrow noprint" style={{marginBottom:12}}>
      <button className="btn pri" onClick={()=>window.print()}>Print / Save PDF</button>
    </div>
    <Card title="Design Check Summary" refTag={`${inp.girder} · L = ${inp.L} ft · ${R.ss.Ntot}-${inp.str.size} strands`}>
      <Tbl head={['Check','Location (ft)','Demand','Capacity / Limit','Ratio','Status']}
        rows={R.checks.map(c=>({c:[c.n,fmt(c.loc,1),fmt(Math.abs(c.v),2)+' '+c.u,fmt(Math.abs(c.lim),2)+' '+c.u,fmt(c.r,2),PF(c.pass)]}))}/>
    </Card>
    {R.warns&&R.warns.length>0&&<div className="callout warn" style={{marginBottom:14}}>
      <b>Detailing warnings:</b><ul className="warnlist">{R.warns.map((w,i)=><li key={i}>{w}</li>)}</ul></div>}
    <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
      <Card title="Key Quantities">
        <KV rows={[['Girder',inp.girder,''],['Span',fmt(R.L,1),'ft'],['Strands',`${R.ss.Ntot} — ${inp.str.size}`,''],
          ['e mid / end',`${fmt(R.ss.eMid,1)} / ${fmt(R.ss.eEnd,1)}`,'in'],
          ['f′ci / f′c / f′c,deck',`${inp.mat.fci} / ${inp.mat.fc} / ${inp.mat.fcd}`,'ksi'],
          ['Total loss',fmt(R.totalLoss,1)+' ksi ('+fmt(R.pctLoss,1)+'%)',''],
          ['P_e',fmt(R.ss.Aps*R.fpe,0),'kip'],
          ['DF_m / DF_v ('+(df.ext?'ext':'int')+(df.th>0?`, skew ${fmt(df.th,0)}°`:'')+')',`${fmt(R.dfm,3)} / ${fmt(R.dfv,3)}`,''],
          ['M_LL+IM / V_LL+IM',`${fmt(R.MLL,0)} k-ft / ${fmt(R.VLL,0)} k`,''],
          ['φMn / Mu @ mid',`${fmt(R.fMid.phiMn/12,0)} / ${fmt(R.MuMid/12,0)}`,'k-ft'],
          ['Camber: release / final',`${fmt(R.cam.rel,2)} / ${fmt(R.cam.final,2)}`,'in']]}/>
      </Card>
      <Card title="Assumptions & Basis">
        <div style={{fontSize:12,lineHeight:1.65,color:'var(--ink2)'}}>
        AASHTO LRFD BDS (9th Ed. article numbering) · {R.useExt?<React.Fragment><b>composite-stage demands imported from MIDAS</b> (span {R.ext.sel.idx}, {fmt(R.ext.spanLen,0)} ft; DC2, DW and the LL+IM envelope by station, DF &amp; IM already applied; girder self-weight and DC1 deck/haunch computed by PS-Beam on the non-composite section) · </React.Fragment>:'simple span, '}unshored construction · {R.useT?'transformed section at release (P @ fpbt), gross/composite thereafter':'gross section properties (transformed-section elastic gains not itemized)'} · losses computed at midspan, applied uniformly · {R.useExt?'LL force effects interpolated from the imported station envelope':'LL moment shaped parabolically and shear linearly from envelope values'} · approximate fps method (5.6.3.1.1), deck f′c for the compression block · MCFT general procedure assuming ≥ minimum transverse reinforcement{R.cont?(R.cont.extPier?' · continuity: pier negative moment taken from the MIDAS envelope at the span ends':' · continuity for LL+SIDL: equal adjacent spans, pier negative moment only (positive-moment connection & restraint moments per 5.12.3.3 not computed)'):''} · time-dependent coefficients per 5.4.2.3 · units: kip, in, ksi (ft for span). Verify against jurisdiction-specific requirements (e.g., RIDOT LRFD supplements) before issue.
        </div>
      </Card>
    </div>

    {/* ============ GRAPHICS ============ */}
    <ReportGraphics inp={inp} R={R}/>
    <StressHeatmap inp={inp} R={R}/>
    <Card title="3D Reinforcement Cage" refTag={snapStore.png?snapStore.meta:'capture from Section Props tab'}>
      {snapStore.png
        ? <img src={snapStore.png} alt="3D reinforcement cage" style={{width:'100%',border:'1px solid var(--line2)',display:'block'}}/>
        : <div className="callout">No 3D snapshot captured yet. Open the <b>Section Props</b> tab, orient the 3D reinforcement cage how you like, and click <b>“📷 Capture for report”</b>. The image will appear here and in the printed report.</div>}
    </Card>

    <div style={{fontFamily:'var(--sans)',fontStretch:'75%',fontWeight:800,fontSize:17,letterSpacing:1,
      textTransform:'uppercase',borderBottom:'2px solid var(--ink)',margin:'8px 0 12px',paddingBottom:5}}>
      Calculation Package — {inp.proj.name||'—'} · {inp.proj.girderId||'—'}</div>

    {/* ============ 1 — ELASTIC MODULI ============ */}
    <CalcSec n="1" title="Materials — Elastic Moduli">
      <Step d="Girder modulus at release" r="LRFD 5.4.2.4">
        <ML s={Tx`E_{ci}=120{,}000\,K_1\,w_c^{2.0}\,(f'_{ci})^{0.33}=120{,}000(1.0)(${nx(m.wc,3)})^{2}(${nx(m.fci,2)})^{0.33}=${nx(lo.Eci,0)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Girder modulus at 28 days">
        <ML s={Tx`E_{c}=120{,}000(${nx(m.wc,3)})^{2}(${nx(m.fc,2)})^{0.33}=${nx(cp.Ecg,0)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Deck modulus & modular ratio" r="LRFD 4.6.2.6">
        <ML s={Tx`E_{cd}=120{,}000(${nx(m.wcd,3)})^{2}(${nx(m.fcd,2)})^{0.33}=${nx(cp.Ecd,0)}\;\mathrm{ksi}\qquad n=\frac{E_{cd}}{E_{c}}=\frac{${nx(cp.Ecd,0)}}{${nx(cp.Ecg,0)}}=${nx(cp.n,4)}`}/>
      </Step>
    </CalcSec>

    {/* ============ 2 — SECTION PROPERTIES ============ */}
    <CalcSec n="2" title="Section Properties">
      <Step d="Gross girder (library values)" r={inp.girder}>
        <ML s={Tx`A_g=${nx(g.A,0)}\;\mathrm{in^2}\qquad I_g=${nx(g.I,0)}\;\mathrm{in^4}\qquad y_b=${nx(g.yb,2)}\;\mathrm{in}\qquad y_t=h-y_b=${nx(g.h,0)}-${nx(g.yb,2)}=${nx(g.yt,2)}\;\mathrm{in}`}/>
        <ML s={Tx`S_b=\frac{I_g}{y_b}=\frac{${nx(g.I,0)}}{${nx(g.yb,2)}}=${nx(g.Sb,0)}\;\mathrm{in^3}\qquad S_t=\frac{I_g}{y_t}=\frac{${nx(g.I,0)}}{${nx(g.yt,2)}}=${nx(g.St,0)}\;\mathrm{in^3}`}/>
        <ML s={Tx`w_{sw}=\frac{A_g}{144}\,w_{c,load}=\frac{${nx(g.A,0)}}{144}(${nx(+m.wcLoad||+m.wc,3)})=${nx(g.wsw,3)}\;\mathrm{klf}`}/>
      </Step>
      <Step d="Effective flange width" r="LRFD 4.6.2.6.1">
        <ML s={inp.beffAuto?Tx`b_{eff}=S=${nx(inp.S,2)}\;\mathrm{ft}\times 12=${nx(cp.beff,0)}\;\mathrm{in}`:Tx`b_{eff}=${nx(cp.beff,0)}\;\mathrm{in}\;(\text{manual})`}/>
      </Step>
      <Step d="Transformed deck & haunch areas">
        <ML s={Tx`A_d=n\,b_{eff}\,t_s=${nx(cp.n,4)}(${nx(cp.beff,0)})(${nx(ts,2)})=${nx(Ad,1)}\;\mathrm{in^2}\quad\text{at}\;y_d=h+t_h+\tfrac{t_s}{2}=${nx(yd,2)}\;\mathrm{in}`}/>
        <ML s={Tx`A_h=n\,b_{tf}\,t_h=${nx(cp.n,4)}(${nx(g.btf,0)})(${nx(th,2)})=${nx(Ah,1)}\;\mathrm{in^2}\quad\text{at}\;y_h=h+\tfrac{t_h}{2}=${nx(yh,2)}\;\mathrm{in}`}/>
      </Step>
      <Step d="Composite centroid">
        <ML s={Tx`A_c=A_g+A_d+A_h=${nx(g.A,0)}+${nx(Ad,1)}+${nx(Ah,1)}=${nx(cp.Ac,0)}\;\mathrm{in^2}`}/>
        <ML s={Tx`y_{bc}=\frac{\sum A\,y}{A_c}=\frac{${nx(g.A,0)}(${nx(g.yb,2)})+${nx(Ad,1)}(${nx(yd,2)})+${nx(Ah,1)}(${nx(yh,2)})}{${nx(cp.Ac,0)}}=${nx(cp.ybc,2)}\;\mathrm{in}`}/>
      </Step>
      <Step d="Composite moment of inertia (parallel-axis sum)">
        <ML s={Tx`I_c=I_g+A_g(y_{bc}-y_b)^2+\tfrac{n\,b_{eff}t_s^3}{12}+A_d(y_d-y_{bc})^2+\tfrac{n\,b_{tf}t_h^3}{12}+A_h(y_h-y_{bc})^2`}/>
        <ML s={Tx`I_c=${nx(g.I,0)}+${nx(Ic2,0)}+${nx(Ic3,0)}+${nx(Ic4,0)}+${nx(Ic5,0)}+${nx(Ic6,0)}=${nx(cp.Ic,0)}\;\mathrm{in^4}`}/>
      </Step>
      <Step d="Composite section moduli">
        <ML s={Tx`S_{bc}=\frac{I_c}{y_{bc}}=\frac{${nx(cp.Ic,0)}}{${nx(cp.ybc,2)}}=${nx(cp.Sbc,0)}\quad S_{tg}=\frac{I_c}{h-y_{bc}}=\frac{${nx(cp.Ic,0)}}{${nx(g.h-cp.ybc,2)}}=${nx(cp.Stg,0)}\quad S_{td}=\frac{I_c}{n(h_c-y_{bc})}=${nx(cp.Std,0)}\;\mathrm{in^3}`}/>
      </Step>
      <Step d="Deck + haunch dead load (tributary)">
        <ML s={Tx`w_{dk}=\frac{S\cdot 12\,t_{s,DL}}{144}w_{cd,load}+\frac{b_{tf}t_h}{144}w_{cd,load}=\frac{${nx(inp.S*12,0)}(${nx(cp.tsLoad,2)})}{144}(${nx(+m.wcdLoad||+m.wcd,3)})+\frac{${nx(g.btf,0)}(${nx(th,2)})}{144}(${nx(+m.wcdLoad||+m.wcd,3)})=${nx(cp.wdk,3)}\;\mathrm{klf}`}/>
        {inp.tsSeparate&&<div className="hint" style={{marginTop:2}}>t_<sub>s,DL</sub> = <b>{fmt(cp.tsLoad,2)}″</b> (dead-load thickness), not the {fmt(+inp.ts,2)}″ structural thickness used for the section properties.</div>}
      </Step>
    </CalcSec>

    {/* ============ 3 — STRAND GEOMETRY ============ */}
    <CalcSec n="3" title="Strand Geometry">
      <Step d="Total strand area">
        <ML s={Tx`A_{ps}=N\cdot A_b=${nx(ss.Ntot,0)}(${nx(ss.st.Ab,3)})=${nx(ss.Aps,3)}\;\mathrm{in^2}`}/>
      </Step>
      <Step d="Strand c.g. at midspan (rows + harped group)">
        <ML s={Tx`\bar{y}_{ps}=\frac{\sum n_i\,y_i}{N}=\frac{${cgsNum}}{${nx(ss.Ntot,0)}}=${nx(ss.cgsMid,3)}\;\mathrm{in}`}/>
        <ML s={Tx`e_{mid}=y_b-\bar{y}_{ps}=${nx(g.yb,2)}-${nx(ss.cgsMid,3)}=${nx(ss.eMid,2)}\;\mathrm{in}\qquad e_{end}=${nx(ss.eEnd,2)}\;\mathrm{in}`}/>
      </Step>
      <Step d="Transfer length" r="LRFD 5.9.4.3.1">
        <ML s={Tx`\ell_t=60\,d_b=60(${nx(ss.st.db,1)})=${nx(ss.lt,1)}\;\mathrm{in}=${nx(ss.lt/12,2)}\;\mathrm{ft}`}/>
      </Step>
      {ss.nh>0&&<Step d="Harp geometry">
        <ML s={Tx`\text{slope}=\frac{y_{end}-y_{mid}}{a}=\frac{${nx(+ss.hp.yEnd,1)}-${nx(+ss.hp.yMid,1)}}{${nx(ss.hp.frac*L*12,0)}}=${nx(ss.slope,4)}\qquad P_{harp}\cdot\text{slope}=V_p\;\text{component}`}/>
      </Step>}
    </CalcSec>

    {/* ============ 4 — PRESTRESS & ELASTIC SHORTENING ============ */}
    <CalcSec n="4" title="Prestress Force & Elastic Shortening">
      <Step d="Stress immediately before transfer" r="LRFD T.5.9.2.2-1">
        <ML s={Tx`f_{pbt}=${nx(+inp.str.jack,2)}\,f_{pu}=${nx(+inp.str.jack,2)}(${nx(fpu,0)})=${nx(R.fpbt,2)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Midspan self-weight moment">
        <ML s={Tx`M_g=\frac{w_{sw}L^2}{8}=\frac{${nx(R.wG,3)}(${nx(L,0)})^2}{8}=${nx(MgM/12,0)}\;\mathrm{k\text{-}ft}=${nx(MgM,0)}\;\mathrm{k\text{-}in}`}/>
      </Step>
      <Step d="Elastic shortening — closed form" r="LRFD C5.9.3.2.3a-1">
        <ML s={Tx`\Delta f_{pES}=\frac{A_{ps}f_{pbt}\left(I_g+e_m^2A_g\right)-e_m M_g A_g}{A_{ps}\left(I_g+e_m^2A_g\right)+\dfrac{A_g I_g E_{ci}}{E_p}}`}/>
        <ML s={Tx`I_g+e_m^2A_g=${nx(g.I,0)}+(${nx(em,2)})^2(${nx(g.A,0)})=${nx(X1,0)}\;\mathrm{in^4}`}/>
        <ML s={Tx`\Delta f_{pES}=\frac{${nx(ss.Aps,3)}(${nx(R.fpbt,2)})(${nx(X1,0)})-${nx(em,2)}(${nx(MgM,0)})(${nx(g.A,0)})}{${nx(ss.Aps,3)}(${nx(X1,0)})+\dfrac{${nx(g.A,0)}(${nx(g.I,0)})(${nx(lo.Eci,0)})}{${nx(Ep,0)}}}=${nx(lo.dfES,2)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Force & concrete stress at strand c.g. after transfer">
        <ML s={Tx`f_{pt}=f_{pbt}-\Delta f_{pES}=${nx(R.fpbt,2)}-${nx(lo.dfES,2)}=${nx(lo.fpt,2)}\;\mathrm{ksi}\qquad P_i=A_{ps}f_{pt}=${nx(ss.Aps,3)}(${nx(lo.fpt,2)})=${nx(lo.Pi,0)}\;\mathrm{kip}`}/>
        <ML s={Tx`f_{cgp}=\frac{P_i}{A_g}+\frac{P_i e_m^2}{I_g}-\frac{M_g e_m}{I_g}=${nx(lo.Pi/g.A,3)}+${nx(lo.Pi*em*em/g.I,3)}-${nx(MgM*em/g.I,3)}=${nx(lo.fcgp,3)}\;\mathrm{ksi}`}/>
      </Step>
    </CalcSec>

    {/* ============ 5 — LONG-TERM LOSSES ============ */}
    {refined?
    <CalcSec n="5" title="Long-Term Losses — Refined Method (LRFD 5.9.3.4)">
      <Step d="Time-development & humidity factors" r="LRFD 5.4.2.3">
        <ML s={Tx`k_s=\max(1.45-0.13\,V\!/\!S,\;1.0)=\max(1.45-0.13(${nx(m.VS,2)}),1.0)=${nx(rf.ks,3)}`}/>
        <ML s={Tx`k_{hs}=2.00-0.014H=2.00-0.014(${nx(m.H,0)})=${nx(rf.khs,3)}\qquad k_{hc}=1.56-0.008H=${nx(rf.khc,3)}\qquad k_f=\frac{5}{1+f'_{ci}}=\frac{5}{1+${nx(m.fci,1)}}=${nx(rf.kf,3)}`}/>
        <ML s={Tx`k_{td}(t)=\frac{t}{12\left(\frac{100-4f'_{ci}}{f'_{ci}+20}\right)+t}:\quad k_{td}(t_d-t_i)=\frac{${nx(m.td-m.ti,0)}}{${nx(ktdK,1)}+${nx(m.td-m.ti,0)}}=${nx(ktdID,3)}\qquad k_{td}(t_f-t_i)=${nx(ktdIF,3)}`}/>
      </Step>
      <Step d="Shrinkage strains" r="LRFD 5.4.2.3.3">
        <ML s={Tx`\varepsilon_{bid}=k_s k_{hs} k_f\,k_{td}(t_d-t_i)\,(0.48\times10^{-3})=${nx(rf.ks,3)}(${nx(rf.khs,3)})(${nx(rf.kf,3)})(${nx(ktdID,3)})(0.48\times10^{-3})=${nx(rf.eShID*1e6,1)}\times10^{-6}`}/>
        <ML s={Tx`\varepsilon_{bif}=${nx(rf.eShIF*1e6,1)}\times10^{-6}\qquad \varepsilon_{bdf}=\varepsilon_{bif}-\varepsilon_{bid}=${nx((rf.eShIF-rf.eShID)*1e6,1)}\times10^{-6}`}/>
      </Step>
      <Step d="Creep coefficients" r="LRFD 5.4.2.3.2">
        <ML s={Tx`\psi(t,t_i)=1.9\,k_s k_{hc} k_f\,k_{td}\,t_i^{-0.118}:\quad\psi_{bid}=1.9(${nx(rf.ks,3)})(${nx(rf.khc,3)})(${nx(rf.kf,3)})(${nx(ktdID,3)})(${nx(m.ti,2)})^{-0.118}=${nx(rf.psiBID,3)}`}/>
        <ML s={Tx`\psi_{bif}=${nx(rf.psiBIF,3)}\qquad \psi_{bdf}=1.9\,k_s k_{hc} k_f\,k_{td}(t_f-t_d)\,t_d^{-0.118}=${nx(rf.psiBDF,3)}`}/>
      </Step>
      <Step d="Transformed-section coefficients" r="LRFD 5.9.3.4.2/3">
        <ML s={Tx`K_{id}=\left[1+\frac{E_p}{E_{ci}}\frac{A_{ps}}{A_g}\left(1+\frac{A_g e_{pg}^2}{I_g}\right)\left(1+0.7\,\psi_{bif}\right)\right]^{-1}=\left[1+\tfrac{${nx(Ep,0)}}{${nx(lo.Eci,0)}}\tfrac{${nx(ss.Aps,3)}}{${nx(g.A,0)}}\left(1+\tfrac{${nx(g.A,0)}(${nx(em,2)})^2}{${nx(g.I,0)}}\right)(1+0.7\cdot${nx(rf.psiBIF,3)})\right]^{-1}=${nx(rf.Kid,3)}`}/>
        <ML s={Tx`e_{pc}=y_{bc}-\bar{y}_{ps}=${nx(cp.ybc,2)}-${nx(ss.cgsMid,3)}=${nx(rf.epc,2)}\;\mathrm{in}\qquad K_{df}=${nx(rf.Kdf,3)}\;(\text{same form, composite } A_c,\,I_c,\,e_{pc})`}/>
      </Step>
      <Step d="Transfer → deck placement" r="LRFD 5.9.3.4.2">
        <ML s={Tx`\Delta f_{pSR}=\varepsilon_{bid}E_p K_{id}=(${nx(rf.eShID*1e6,1)}\times10^{-6})(${nx(Ep,0)})(${nx(rf.Kid,3)})=${nx(rf.dfSR,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pCR}=\frac{E_p}{E_{ci}}f_{cgp}\,\psi_{bid}K_{id}=\frac{${nx(Ep,0)}}{${nx(lo.Eci,0)}}(${nx(lo.fcgp,3)})(${nx(rf.psiBID,3)})(${nx(rf.Kid,3)})=${nx(rf.dfCR,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pR1}=\frac{f_{pt}}{K_L}\left(\frac{f_{pt}}{f_{py}}-0.55\right)=\frac{${nx(lo.fpt,2)}}{30}\left(\frac{${nx(lo.fpt,2)}}{${nx(lo.fpy,1)}}-0.55\right)=${nx(rf.dfR1,3)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Deck placement → final" r="LRFD 5.9.3.4.3">
        <ML s={Tx`\Delta f_{pSD}=\varepsilon_{bdf}E_p K_{df}=(${nx((rf.eShIF-rf.eShID)*1e6,1)}\times10^{-6})(${nx(Ep,0)})(${nx(rf.Kdf,3)})=${nx(rf.dfSD,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{cd}=-\left[\frac{M_{dk}\,e_m}{I_g}+\frac{(M_{bar}+M_{dw})\,e_{pc}}{I_c}\right]=-\left[\frac{${nx(rMid.Mdk,0)}(${nx(em,2)})}{${nx(g.I,0)}}+\frac{${nx(Mbar+Mdw,0)}(${nx(rf.epc,2)})}{${nx(cp.Ic,0)}}\right]=${nx(R.dfcd,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pCD}=\frac{E_p}{E_{ci}}f_{cgp}(\psi_{bif}-\psi_{bid})K_{df}+\frac{E_p}{E_c}\Delta f_{cd}\,\psi_{bdf}K_{df}=${nx(fin.dfCD,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pR2}=\Delta f_{pR1}=${nx(fin.dfR2,3)}\;\mathrm{ksi}\qquad \Delta f_{pSS}=${nx(fin.dfSS,2)}\;\mathrm{ksi}\;(\text{deck shrinkage, 5.9.3.4.3d})`}/>
      </Step>
      <Step d="Loss totals & effective prestress">
        <ML s={Tx`\Delta f_{pLT}=${nx(rf.dfSR,2)}+${nx(rf.dfCR,2)}+${nx(rf.dfR1,2)}+${nx(rf.dfSD,2)}+${nx(fin.dfCD,2)}+${nx(fin.dfR2,2)}-${nx(fin.dfSS,2)}=${nx(fin.total,2)}\;\mathrm{ksi}`}/>
        <ML s={Tx`f_{pe}=f_{pbt}-\Delta f_{pES}-\Delta f_{pLT}=${nx(R.fpbt,2)}-${nx(lo.dfES,2)}-${nx(R.LT,2)}=${nx(R.fpe,2)}\;\mathrm{ksi}\;(${nx(R.pctLoss,1)}\%\text{ total loss})`}/>
        <ML s={Tx`P_e=A_{ps}f_{pe}=${nx(ss.Aps,3)}(${nx(R.fpe,2)})=${nx(ss.Aps*R.fpe,0)}\;\mathrm{kip}`}/>
      </Step>
    </CalcSec>
    :
    <CalcSec n="5" title="Long-Term Losses — Approximate Method (LRFD 5.9.3.3)">
      <Step d="Correction factors">
        <ML s={Tx`\gamma_h=1.7-0.01H=1.7-0.01(${nx(m.H,0)})=${nx(gh,3)}\qquad \gamma_{st}=\frac{5}{1+f'_{ci}}=\frac{5}{1+${nx(m.fci,1)}}=${nx(gst,3)}`}/>
      </Step>
      <Step d="Lump-sum long-term loss" r="LRFD 5.9.3.3-1">
        <ML s={Tx`\Delta f_{pLT}=10\frac{f_{pi}A_{ps}}{A_g}\gamma_h\gamma_{st}+12\gamma_h\gamma_{st}+\Delta f_{pR}=10\frac{${nx(R.fpbt,1)}(${nx(ss.Aps,3)})}{${nx(g.A,0)}}(${nx(gh,3)})(${nx(gst,3)})+12(${nx(gh,3)})(${nx(gst,3)})+${nx(lo.apx.R,1)}=${nx(lo.apx.total,2)}\;\mathrm{ksi}`}/>
        <ML s={Tx`f_{pe}=${nx(R.fpbt,2)}-${nx(lo.dfES,2)}-${nx(R.LT,2)}=${nx(R.fpe,2)}\;\mathrm{ksi}\qquad P_e=${nx(ss.Aps*R.fpe,0)}\;\mathrm{kip}`}/>
      </Step>
    </CalcSec>}

    {/* ============ 5b — ELASTIC GAINS ============ */}
    <CalcSec n="5b" title="Elastic Gains (LRFD C5.9.3.4.3)">
      <Step d="Loads applied after transfer increase strand stress: Δf_p = (E_p/E_c)(M·e/I)">
        <ML s={Tx`\Delta f_{p,precast}=\frac{E_p}{E_c}\frac{M_{DC1}e_m}{I_g}=+${nx(R.gains.precast,2)}\;\mathrm{ksi}\quad \Delta f_{p,comp}=\frac{E_p}{E_c}\frac{(M_{DC2}+M_{DW})e_{pc}}{I_c}=+${nx(R.gains.composite,2)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{p,LL}=\frac{E_p}{E_c}\frac{M_{LL}e_{pc}}{I_c}=+${nx(R.gains.live,2)}\;\mathrm{ksi}\;(\text{transient})\qquad f_{pe}+\Delta f_{p,perm}=${nx(R.fpe,2)}+${nx(R.gains.permanent+(+inp.opt.dfpSS),2)}=${nx(R.fpeGain+(+inp.opt.dfpSS),2)}\;\mathrm{ksi}`}/>
      </Step>
    </CalcSec>

    {/* ============ 5c — STRAND FORCE/STRESS BY ROW & STAGE ============ */}
    <CalcSec n="5c" title="Strand Force & Stress by Row and Stage">
      <table className="eng" style={{width:'100%',fontSize:11}}>
        <thead>
          <tr><th>Row y (in)</th><th>e (in)</th><th>n</th><th>f_pt (ksi)</th><th>P_rel (kip)</th><th>f_pD (ksi)</th><th>f_pe (ksi)</th><th>P_e (kip)</th></tr>
        </thead>
        <tbody>
          {R.strandStages.rows.map((r,i)=><tr key={i}>
            <td>{fmt(r.y,1)}{r.harped?' (H)':''}</td><td style={{textAlign:'right'}}>{fmt(r.e,1)}</td><td style={{textAlign:'right'}}>{r.n}</td>
            <td style={{textAlign:'right'}}>{fmt(r.fpt,1)}</td><td style={{textAlign:'right'}}>{fmt(r.Ppt,0)}</td>
            <td style={{textAlign:'right'}}>{fmt(r.fpDeck,1)}</td>
            <td style={{textAlign:'right'}}>{fmt(r.fpe,1)}</td><td style={{textAlign:'right'}}>{fmt(r.Ppe,0)}</td>
          </tr>)}
          <tr style={{fontWeight:700}}><td>Total</td><td></td><td style={{textAlign:'right'}}>{R.strandStages.tot.n}</td>
            <td></td><td style={{textAlign:'right'}}>{fmt(R.strandStages.tot.Ppt,0)}</td><td></td><td></td>
            <td style={{textAlign:'right'}}>{fmt(R.strandStages.tot.Ppe,0)}</td></tr>
        </tbody>
      </table>
      <div style={{fontSize:11,color:'var(--ink2)',marginTop:5}}>Stages: f_pt at release (after elastic shortening); f_pD after transfer→deck-placement time-dependent losses (5.9.3.4.2); f_pe permanent after all long-term losses. Each row at its own eccentricity — elastic shortening and creep scale with the concrete stress at that level. “(H)” = harped group. See the Losses tab for the worked single-row derivation.</div>
    </CalcSec>

    {/* ============ 6 — DEAD & LIVE LOADS ============ */}
    <CalcSec n="6" title="Loads — Dead, HL-93 & Distribution">
      <Step d="Midspan dead-load moments (simple span)">
        <ML s={Tx`M=\frac{wL^2}{8}:\quad M_g=\frac{${nx(R.wG,3)}(${nx(L,0)})^2}{8}=${nx(rMid.Mg/12,0)}\quad M_{dk}=\frac{${nx(R.wDk,3)}(${nx(L,0)})^2}{8}=${nx(rMid.Mdk/12,0)}\quad M_{bar}=${nx(Mbar/12,0)}\quad M_{dw}=${nx(Mdw/12,0)}\;\mathrm{k\text{-}ft}`}/>
      </Step>
      <Step d="HL-93 design truck — midspan moment" r="LRFD 3.6.1.2.2" note="Enumerated moving-load envelope at midspan; for L ≥ 28 ft this equals the closed form shown.">
        <ML s={L>=28?Tx`M_{tr}=18L-280=18(${nx(L,0)})-280=${nx(hl.Mtr,0)}\;\mathrm{k\text{-}ft}`:Tx`M_{tr}=${nx(hl.Mtr,0)}\;\mathrm{k\text{-}ft}\;(\text{enumerated})`}/>
      </Step>
      <Step d="HL-93 tandem & lane" r="LRFD 3.6.1.2.3/4">
        <ML s={Tx`M_{td}=\left[\frac{25(L/2)}{L}+\frac{25(L/2-4)}{L}\right]\frac{L}{2}=\left[12.5+\frac{25(${nx(L/2-4,0)})}{${nx(L,0)}}\right](${nx(L/2,0)})=${nx(hl.Mtd,0)}\;\mathrm{k\text{-}ft}`}/>
        <ML s={Tx`M_{ln}=\frac{0.64L^2}{8}=\frac{0.64(${nx(L,0)})^2}{8}=${nx(hl.Mln,0)}\;\mathrm{k\text{-}ft}`}/>
      </Step>
      <Step d="Governing lane moment & shear (IM = 33% on truck/tandem)" r="LRFD 3.6.2">
        <ML s={Tx`M_{LL/lane}=1.33\max(M_{tr},M_{td})+M_{ln}=1.33(${nx(Math.max(hl.Mtr,hl.Mtd),0)})+${nx(hl.Mln,0)}=${nx(hl.M,0)}\;\mathrm{k\text{-}ft}`}/>
        <ML s={Tx`V_{tr}=32+\frac{32(L-14)}{L}+\frac{8(L-28)}{L}=${nx(hl.Vtr,1)}\quad V_{td}=25+\frac{25(L-4)}{L}=${nx(hl.Vtd,1)}\quad V_{ln}=0.32L=${nx(hl.Vln,1)}\;\mathrm{kip}`}/>
        <ML s={Tx`V_{LL/lane}=1.33(${nx(Math.max(hl.Vtr,hl.Vtd),1)})+${nx(hl.Vln,1)}=${nx(hl.V,1)}\;\mathrm{kip}`}/>
      </Step>
      <Step d="Longitudinal stiffness parameter" r="LRFD 4.6.2.2.1-1">
        <ML s={Tx`e_g=\left(h+t_h+\tfrac{t_s}{2}\right)-y_b=${nx(g.h+th+ts/2,2)}-${nx(g.yb,2)}=${nx(df.eg,2)}\;\mathrm{in}`}/>
        <ML s={Tx`K_g=n\left(I_g+A_g e_g^2\right)=\frac{E_c}{E_{cd}}\left[${nx(g.I,0)}+${nx(g.A,0)}(${nx(df.eg,2)})^2\right]=${nx(df.Kg,0)}\;\mathrm{in^4}`}/>
      </Step>
      <Step d="Interior moment distribution factor — Type (k)" r="LRFD T.4.6.2.2.2b-1">
        <ML s={Tx`g_{m1}=0.06+\left(\tfrac{S}{14}\right)^{0.4}\left(\tfrac{S}{L}\right)^{0.3}\left(\tfrac{K_g}{12Lt_s^3}\right)^{0.1}=0.06+\left(\tfrac{${nx(inp.S,2)}}{14}\right)^{0.4}\left(\tfrac{${nx(inp.S,2)}}{${nx(L,0)}}\right)^{0.3}\left(\tfrac{${nx(df.Kg,0)}}{12(${nx(L,0)})(${nx(ts,1)})^3}\right)^{0.1}=${nx(df.m1,4)}`}/>
        <ML s={Tx`g_{m2}=0.075+\left(\tfrac{S}{9.5}\right)^{0.6}\left(\tfrac{S}{L}\right)^{0.2}\left(\tfrac{K_g}{12Lt_s^3}\right)^{0.1}=${nx(df.m2,4)}\qquad g_{m,int}=\max=${nx(Math.max(df.m1,df.m2),4)}`}/>
      </Step>
      <Step d="Interior shear distribution factor" r="LRFD T.4.6.2.2.3a-1">
        <ML s={Tx`g_{v1}=0.36+\frac{S}{25}=${nx(df.v1,4)}\qquad g_{v2}=0.2+\frac{S}{12}-\left(\frac{S}{35}\right)^2=${nx(df.v2,4)}\qquad g_{v,int}=\max=${nx(Math.max(df.v1,df.v2),4)}`}/>
      </Step>
      {df.ext&&<Step d="Exterior girder — lever rule (1 lane, m = 1.2)" r="LRFD T.4.6.2.2.2d-1">
        <ML s={Tx`g_{lever}=1.2\sum_{wheels}\frac{0.5(S+x_w)}{S},\;x_w=d_e-2,\,d_e-8=${nx(+inp.loads.de-2,2)},\,${nx(+inp.loads.de-8,2)}\;\mathrm{ft}\;\Rightarrow\;g_{lever}=${nx(df.lever,4)}`}/>
      </Step>}
      {df.ext&&<Step d="Exterior girder — e-factor (2+ lanes) & rigid cross-section" r="LRFD 4.6.2.2.2d / C4.6.2.2.2d">
        <ML s={Tx`e_m=0.77+\frac{d_e}{9.1}=0.77+\frac{${nx(+inp.loads.de,2)}}{9.1}=${nx(df.eM,4)}\;\Rightarrow\;e_m\,g_{m2}=${nx(df.eM*df.m2,4)}\qquad e_v=0.6+\frac{d_e}{10}=${nx(df.eV,4)}`}/>
        <ML s={Tx`R=\frac{N_L}{N_b}+\frac{X_{ext}\sum e}{\sum x^2}\;(\text{governing }N_L=${nx(df.rigidNL,0)},\,m=${nx([1.2,1.0,0.85,0.65][df.rigidNL-1],2)})\;\Rightarrow\;g_{rigid}=${nx(df.rigid,4)}`}/>
        <ML s={Tx`g_{m,ext}=\max(g_{lever},\,e_m g_{m2},\,g_{rigid})=${nx(df.dfmRaw,4)}\qquad g_{v,ext}=\max(g_{lever},\,e_v g_{v2},\,g_{rigid})=${nx(df.dfvRaw,4)}`}/>
      </Step>}
      {df.th>0&&<Step d={`Skew corrections — θ = ${fmt(df.th,0)}°`} r="LRFD 4.6.2.2.2e / 4.6.2.2.3c">
        <ML s={Tx`c_1=0.25\left(\frac{K_g}{12Lt_s^3}\right)^{0.25}\left(\frac{S}{L}\right)^{0.5}\;(\theta<30°\Rightarrow c_1=0)\qquad \text{moment}\times\left[1-c_1\tan^{1.5}\theta\right]=${nx(df.skM,4)}`}/>
        <ML s={Tx`\text{shear}\times\left[1+0.20\left(\frac{12Lt_s^3}{K_g}\right)^{0.3}\tan\theta\right]=1+0.20\left(\frac{12(${nx(L,0)})(${nx(ts,1)})^3}{${nx(df.Kg,0)}}\right)^{0.3}\tan ${nx(df.th,0)}°=${nx(df.skV,4)}`}/>
      </Step>}
      <Step d="Design live load per girder">
        <ML s={Tx`DF_m=${nx(R.dfm,4)}\quad DF_v=${nx(R.dfv,4)}\qquad M_{LL+IM}=${nx(hl.M,0)}(${nx(R.dfm,4)})=${nx(R.MLL,0)}\;\mathrm{k\text{-}ft}\qquad V_{LL+IM}=${nx(hl.V,1)}(${nx(R.dfv,4)})=${nx(R.VLL,1)}\;\mathrm{kip}`}/>
      </Step>
    </CalcSec>

    {/* ============ 7 — STRESS LIMITS ============ */}
    <CalcSec n="7" title="Stress Limits">
      <Step d="At transfer" r="LRFD 5.9.2.3.1">
        <ML s={Tx`f_{c,rel}=0.65f'_{ci}=0.65(${nx(m.fci,2)})=${nx(lim.relC,3)}\;\mathrm{ksi}\qquad f_{t,rel}=${inp.opt.relBondedReinf?Tx`0.24\sqrt{f'_{ci}}=0.24\sqrt{${nx(m.fci,2)}}=${nx(lim.relT,3)}`:Tx`\min(0.0948\sqrt{f'_{ci}},0.2)=${nx(lim.relT,3)}`}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="At service" r="LRFD 5.9.2.3.2">
        <ML s={Tx`f_{c1}=0.45f'_c=${nx(lim.srvC1,3)}\qquad f_{c2}=0.60f'_c=${nx(lim.srvC2,3)}\qquad f_t=${inp.opt.corrosion==='severe'?Tx`0.0948\sqrt{f'_c}`:Tx`0.19\sqrt{f'_c}\le 0.6`}=${nx(lim.srvT,3)}\;\mathrm{ksi}\qquad f_{c,deck}=0.60f'_{cd}=${nx(lim.dkC2,3)}\;\mathrm{ksi}`}/>
      </Step>
    </CalcSec>

    {/* ============ 8 — GOVERNING SERVICE STRESSES ============ */}
    <CalcSec n="8" title="Governing Service Stresses (+ compression, − tension)">
      {R.useT?
      <Step d={`Release — transformed section at x = ${fmt(cf('Release comp').loc,1)} ft`} r="P at f_pbt — ES implicit">
        {(()=>{const t=transAt(rRc);return <React.Fragment>
          <ML s={Tx`n_i=\frac{E_p}{E_{ci}}=${nx(niT,3)}\quad A_t=A_g+(n_i-1)A_{ps}=${nx(g.A,0)}+(${nx(niT-1,3)})(${nx(rRc.Aps,3)})=${nx(t.At,0)}\;\mathrm{in^2}`}/>
          <ML s={Tx`y_{bt}=${nx(t.ybt,2)}\;\mathrm{in}\quad I_t=${nx(t.It,0)}\;\mathrm{in^4}\quad e_t=${nx(t.eT,2)}\;\mathrm{in}\quad P_0=A_{ps}f_{pbt}=${nx(t.P0,0)}\;\mathrm{kip}`}/>
          <ML s={Tx`f_{bot}=\frac{P_0}{A_t}+\frac{P_0 e_t}{S_{bt}}-\frac{M_g}{S_{bt}}=${nx(t.P0/t.At,3)}+${nx(t.P0*t.eT/t.Sbt,3)}-${nx(rRc.Mg/t.Sbt,3)}=${nx(rRc.relBot,3)}\le ${nx(lim.relC,3)}\;\mathrm{ksi}\;${cf('Release comp').pass?'\\checkmark':'\\;\\text{N.G.}'}`}/>
          <ML s={Tx`f_{top}@${nx(cf('Release tens').loc,1)}\,\mathrm{ft}=\frac{P_0}{A_t}-\frac{P_0 e_t}{S_{tt}}+\frac{M_g}{S_{tt}}=${nx(rRt.relTop,3)}\ge ${nx(-lim.relT,3)}\;\mathrm{ksi}\;${cf('Release tens').pass?'\\checkmark':'\\;\\text{N.G.}'}`}/>
        </React.Fragment>;})()}
      </Step>
      :
      <Step d={`Release stresses — gross section, x = ${fmt(cf('Release comp').loc,1)} / ${fmt(cf('Release tens').loc,1)} ft`} r="LRFD 5.9.2.3.1">
        <ML s={Tx`P_i=A_{ps}(x)\,f_{pi}=${nx(rRc.Aps,3)}(${nx(R.fpi,2)})=${nx(rRc.Aps*R.fpi,0)}\;\mathrm{kip}\quad e=${nx(rRc.e,2)}\;\mathrm{in}\quad M_g=${nx(rRc.Mg,0)}\;\mathrm{k\text{-}in}`}/>
        <ML s={Tx`f_{bot}=\frac{P_i}{A_g}+\frac{P_i e}{S_b}-\frac{M_g}{S_b}=\frac{${nx(rRc.Aps*R.fpi,0)}}{${nx(g.A,0)}}+\frac{${nx(rRc.Aps*R.fpi,0)}(${nx(rRc.e,2)})}{${nx(g.Sb,0)}}-\frac{${nx(rRc.Mg,0)}}{${nx(g.Sb,0)}}=${nx(rRc.Aps*R.fpi/g.A,3)}+${nx(rRc.Aps*R.fpi*rRc.e/g.Sb,3)}-${nx(rRc.Mg/g.Sb,3)}=${nx(rRc.relBot,3)}\le ${nx(lim.relC,3)}\;${cf('Release comp').pass?'\\checkmark':'\\text{N.G.}'}`}/>
        <ML s={Tx`f_{top}@${nx(cf('Release tens').loc,1)}\,\mathrm{ft}=\frac{P_i}{A_g}-\frac{P_i e}{S_t}+\frac{M_g}{S_t}=${nx(rRt.Aps*R.fpi/g.A,3)}-${nx(rRt.Aps*R.fpi*rRt.e/g.St,3)}+${nx(rRt.Mg/g.St,3)}=${nx(rRt.relTop,3)}\ge ${nx(-lim.relT,3)}\;${cf('Release tens').pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>}
      <Step d={`Service I — top fiber, permanent loads, x = ${fmt(cf('Srv comp (perm)').loc,1)} ft`} r="LRFD 5.9.2.3.2a">
        <ML s={Tx`P_e=${nx(rS1.Aps*R.fpe,0)}\;\mathrm{kip}\quad M_g=${nx(rS1.Mg,0)}\quad M_{dk}=${nx(rS1.Mdk,0)}\quad M_{sd}=${nx(rS1.Msd,0)}\;\mathrm{k\text{-}in}`}/>
        <ML s={Tx`f=\frac{P_e}{A_g}-\frac{P_e e}{S_t}+\frac{M_g+M_{dk}}{S_t}+\frac{M_{sd}}{S_{tg}}=${nx(rS1.Aps*R.fpe/g.A,3)}-${nx(rS1.Aps*R.fpe*rS1.e/g.St,3)}+${nx((rS1.Mg+rS1.Mdk)/g.St,3)}+${nx(rS1.Msd/cp.Stg,3)}=${nx(rS1.s1Top,3)}\le 0.45f'_c=${nx(lim.srvC1,3)}\;${cf('Srv comp (perm)').pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
      <Step d={`Service I — top fiber, full load, x = ${fmt(cf('Srv comp (full)').loc,1)} ft`}>
        <ML s={Tx`f=f_{perm}+\frac{M_{LL}}{S_{tg}}=${nx(rS2.s1Top,3)}+\frac{${nx(rS2.Mll,0)}}{${nx(cp.Stg,0)}}=${nx(rS2.s2Top,3)}\le 0.60f'_c=${nx(lim.srvC2,3)}\;\mathrm{ksi}\;${cf('Srv comp (full)').pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
      <Step d={`Service III — bottom fiber, x = ${fmt(cf('Srv III tens').loc,1)} ft (γLL = ${inp.opt.gLLs3})`} r="LRFD T.3.4.1-4">
        <ML s={Tx`f=\frac{P_e}{A_g}+\frac{P_e e}{S_b}-\frac{M_g+M_{dk}}{S_b}-\frac{M_{sd}+\gamma_{LL}M_{LL}}{S_{bc}}`}/>
        <ML s={Tx`f=${nx(rS3.Aps*R.fpe/g.A,3)}+${nx(rS3.Aps*R.fpe*rS3.e/g.Sb,3)}-${nx((rS3.Mg+rS3.Mdk)/g.Sb,3)}-${nx((rS3.Msd+inp.opt.gLLs3*rS3.Mll)/cp.Sbc,3)}=${nx(rS3.s3Bot,3)}\ge ${nx(-lim.srvT,3)}\;\mathrm{ksi}\;${cf('Srv III tens').pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
      <Step d={`Deck compression, x = ${fmt(cf('Deck comp').loc,1)} ft`}>
        <ML s={Tx`f=\frac{M_{sd}+M_{LL}}{S_{td}}=\frac{${nx(rDk.Msd,0)}+${nx(rDk.Mll,0)}}{${nx(cp.Std,0)}}=${nx(rDk.dkC,3)}\le 0.60f'_{cd}=${nx(lim.dkC2,3)}\;\mathrm{ksi}\;${cf('Deck comp').pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
    </CalcSec>

    {/* ============ 9 — STRENGTH FLEXURE ============ */}
    <CalcSec n="9" title="Strength I Flexure @ Midspan">
      <Step d="Factored moment" r="LRFD T.3.4.1-1">
        <ML s={Tx`M_u=1.25(M_g+M_{dk}+M_{bar})+1.50\,M_{dw}+1.75\,M_{LL}=1.25(${nx(rMid.Mg/12,0)}+${nx(rMid.Mdk/12,0)}+${nx(Mbar/12,0)})+1.50(${nx(Mdw/12,0)})+1.75(${nx(R.MLL,0)})=${nx(R.MuMid/12,0)}\;\mathrm{k\text{-}ft}`}/>
      </Step>
      <Step d="Stress-block & neutral axis" r="LRFD 5.6.3.1.1 / 5.6.2.2">
        <ML s={Tx`\beta_1=0.85-0.05(f'_{cd}-4)=0.85-0.05(${nx(m.fcd,1)}-4)=${nx(f.b1,3)}\qquad k=0.28\;(\text{low-relax})\qquad d_p=h_c-\bar{y}_{ps}=${nx(cp.hc,1)}-${nx(ss.cgsMid,2)}=${nx(f.dp,2)}\;\mathrm{in}`}/>
        {f.rect?
        <ML s={Tx`c=\frac{A_{ps}f_{pu}}{0.85f'_{cd}\beta_1 b_{eff}+k\,A_{ps}f_{pu}/d_p}=\frac{${nx(rMid.Aps,3)}(${nx(fpu,0)})}{0.85(${nx(m.fcd,1)})(${nx(f.b1,3)})(${nx(cp.beff,0)})+0.28\frac{${nx(rMid.Aps,3)}(${nx(fpu,0)})}{${nx(f.dp,2)}}}=${nx(f.c,2)}\;\mathrm{in}\;(\text{rectangular: }\beta_1c=${nx(f.b1*f.c,2)}\le t_s+t_h=${nx(ts+th,1)})`}/>
        :
        <ML s={Tx`\beta_1c>t_s+t_h\Rightarrow\text{T-section: }c=\frac{A_{ps}f_{pu}-0.85f'_{cd}(b_{eff}-b_{tf})h_f}{0.85f'_{cd}\beta_1 b_{tf}+k\,A_{ps}f_{pu}/d_p}=${nx(f.c,2)}\;\mathrm{in}`}/>}
        <ML s={Tx`a=\beta_1 c=${nx(f.b1,3)}(${nx(f.c,2)})=${nx(f.a,2)}\;\mathrm{in}\qquad f_{ps}=f_{pu}\left(1-k\frac{c}{d_p}\right)=${nx(fpu,0)}\left(1-0.28\frac{${nx(f.c,2)}}{${nx(f.dp,2)}}\right)=${nx(f.fps,1)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Nominal resistance & φ" r="LRFD 5.6.3.2 / 5.5.4.2">
        <ML s={f.rect?
          Tx`M_n=A_{ps}f_{ps}\left(d_p-\frac{a}{2}\right)=${nx(rMid.Aps,3)}(${nx(f.fps,1)})\left(${nx(f.dp,2)}-\frac{${nx(f.a,2)}}{2}\right)=${nx(f.Mn,0)}\;\mathrm{k\text{-}in}=${nx(f.Mn/12,0)}\;\mathrm{k\text{-}ft}`
          :Tx`M_n=A_{ps}f_{ps}\left(d_p-\tfrac{a}{2}\right)+0.85f'_{cd}(b_{eff}-b_{tf})h_f\left(\tfrac{a}{2}-\tfrac{h_f}{2}\right)=${nx(f.Mn/12,0)}\;\mathrm{k\text{-}ft}`}/>
        <ML s={Tx`\varepsilon_t=0.003\left(\frac{d_t}{c}-1\right)=0.003\left(\frac{${nx(f.dt,2)}}{${nx(f.c,2)}}-1\right)=${nx(f.et*1000,2)}\times10^{-3}\quad\Rightarrow\quad\phi=0.75+0.25\frac{\varepsilon_t-0.002}{0.003}\le 1.0=${nx(f.phi,3)}`}/>
        <ML s={Tx`\phi M_n=${nx(f.phi,3)}(${nx(f.Mn/12,0)})=${nx(f.phiMn/12,0)}\;\mathrm{k\text{-}ft}\ge M_u=${nx(R.MuMid/12,0)}\;\mathrm{k\text{-}ft}\quad\frac{M_u}{\phi M_n}=${nx(R.MuMid/f.phiMn,3)}\;${(R.MuMid<=f.phiMn*1.0001)?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
      <Step d="Minimum reinforcement" r="LRFD 5.6.3.3">
        <ML s={Tx`f_r=0.24\sqrt{f'_c}=0.24\sqrt{${nx(m.fc,1)}}=${nx(R.fr,3)}\;\mathrm{ksi}\qquad f_{cpe}=\frac{P_e}{A_g}+\frac{P_e e_m}{S_b}=${nx(PeMid/g.A,3)}+${nx(PeMid*ss.eMid/g.Sb,3)}=${nx(R.fcpe,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`M_{cr}=\gamma_3\left[(\gamma_1 f_r+\gamma_2 f_{cpe})S_{bc}-M_{dnc}\left(\frac{S_{bc}}{S_b}-1\right)\right]=1.0\left[(1.6\cdot${nx(R.fr,3)}+1.1\cdot${nx(R.fcpe,3)})${nx(cp.Sbc,0)}-${nx(rMid.Mg+rMid.Mdk,0)}\left(\frac{${nx(cp.Sbc,0)}}{${nx(g.Sb,0)}}-1\right)\right]=${nx(R.Mcr/12,0)}\;\mathrm{k\text{-}ft}`}/>
        <ML s={Tx`\phi M_n\ge\min(M_{cr},\,1.33M_u)=\min(${nx(R.Mcr/12,0)},\,${nx(1.33*R.MuMid/12,0)})=${nx(R.minMr/12,0)}\;\mathrm{k\text{-}ft}\;${(R.minMr<=f.phiMn*1.0001)?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
    </CalcSec>

    {/* ============ 10 — SHEAR ============ */}
    <CalcSec n="10" title={`Shear — Critical Section @ x = ${fmt(shx,1)} ft (MCFT General Procedure)`}>
      <Step d="Effective shear depth" r="LRFD 5.7.2.8">
        <ML s={Tx`d_v=\max\left(d_p-\tfrac{a}{2},\;0.9d_p,\;0.72h_c\right)=\max(${nx(fgN.dp-fgN.a/2,1)},\;${nx(0.9*fgN.dp,1)},\;${nx(0.72*cp.hc,1)})=${nx(sh0.dv,1)}\;\mathrm{in}`}/>
      </Step>
      <Step d="Factored shear" r="Strength I">
        <ML s={Tx`V_u=1.25(V_g+V_{dk}+V_{bar})+1.50V_{dw}+1.75V_{LL}=1.25(${nx(Vg,1)}+${nx(Vdk,1)}+${nx(Vbar,1)})+1.50(${nx(Vdw,1)})+1.75(${nx(Vll,1)})=${nx(sh0.Vu,1)}\;\mathrm{kip}`}/>
        <ML s={Tx`V_p=P_{harp}\cdot\text{slope}=${nx(sh0.Vp,1)}\;\mathrm{kip}`}/>
      </Step>
      <Step d="Longitudinal strain" r="LRFD Eq. 5.7.3.4.2-4">
        <ML s={Tx`\varepsilon_s=\frac{\dfrac{|M_u|}{d_v}+|V_u-V_p|-A_{ps}f_{po}}{E_p A_{ps}}=\frac{\dfrac{${nx(MuU,0)}}{${nx(sh0.dv,1)}}+${nx(Math.abs(sh0.Vu-sh0.Vp),1)}-${nx(apsX,3)}(${nx(fpo,0)})}{${nx(Ep,0)}(${nx(apsX,3)})}=${nx(sh0.es*1000,3)}\times10^{-3}`}
        /><div className="mnote">M_u taken ≥ |V_u−V_p|·d_v per 5.7.3.4.2; f_po = 0.7f_pu = {fmt(fpo,0)} ksi; ε_s floor −0.40×10⁻³ with ≥ minimum stirrups.</div>
      </Step>
      <Step d="β, θ and concrete contribution" r="LRFD 5.7.3.4.2 / 5.7.3.3">
        <ML s={Tx`\beta=\frac{4.8}{1+750\varepsilon_s}=\frac{4.8}{1+750(${nx(sh0.es*1000,3)}\times10^{-3})}=${nx(sh0.beta,3)}\qquad\theta=29+3500\varepsilon_s=${nx(sh0.theta,2)}°`}/>
        <ML s={Tx`V_c=0.0316\,\beta\sqrt{f'_c}\,b_v d_v=0.0316(${nx(sh0.beta,3)})\sqrt{${nx(m.fc,1)}}(${nx(g.bw,0)})(${nx(sh0.dv,1)})=${nx(sh0.Vc,1)}\;\mathrm{kip}`}/>
      </Step>
      <Step d={`Steel contribution — trial s = ${sh0.sProv}″`}>
        <ML s={Tx`V_s=\frac{A_v f_y d_v\cot\theta}{s}=\frac{${nx(+inp.opt.stirAv,2)}(${nx(+inp.opt.fy,0)})(${nx(sh0.dv,1)})\cot ${nx(sh0.theta,2)}°}{${nx(sh0.sProv,0)}}=\frac{${nx(+inp.opt.stirAv,2)}(${nx(+inp.opt.fy,0)})(${nx(sh0.dv,1)})(${nx(cotT,3)})}{${nx(sh0.sProv,0)}}=${nx(sh0.Vs,1)}\;\mathrm{kip}`}/>
      </Step>
      <Step d="Nominal resistance & check" r="LRFD 5.7.3.3">
        <ML s={Tx`V_n=\min\left(V_c+V_s+V_p,\;0.25f'_c b_v d_v+V_p\right)=\min(${nx(sh0.Vc+sh0.Vs+sh0.Vp,1)},\;${nx(0.25*m.fc*g.bw*sh0.dv+sh0.Vp,1)})=${nx(sh0.Vn,1)}\;\mathrm{kip}`}/>
        <ML s={Tx`\frac{V_u}{\phi V_n}=\frac{${nx(sh0.Vu,1)}}{0.9(${nx(sh0.Vn,1)})}=${nx(sh0.dc,3)}\;${sh0.dc<=1.0001?'\\checkmark':'\\text{N.G.}'}\qquad(\text{worst station: }x=${nx(R.wShear.x,1)}\,\mathrm{ft},\;D/C=${nx(R.wShear.dc,3)})`}/>
      </Step>
      <Step d="Interface shear (girder/deck) at critical section" r="LRFD 5.7.4 — c = 0.28 ksi, μ = 1.0">
        <ML s={Tx`v_{ui}=\frac{V_u}{b_{vi}d_{vi}}=\frac{${nx(sh0.Vu,1)}}{${nx(g.btf,0)}(${nx(sh0.dv,1)})}=${nx(R.iface[0].vui,3)}\;\mathrm{ksi}\qquad A_{vf,req}=${nx(R.iface[0].AvfReq,3)}\;\;A_{vf,min}=${nx(R.iface[0].AvfMin,3)}\;\;A_{vf,prov}=\frac{A_v\cdot12}{s}=${nx(R.iface[0].AvfProv,3)}\;\mathrm{in^2/ft}\;${R.iface[0].ok?'\\checkmark':'\\text{N.G.}'}`}/>
        <ML s={Tx`V_{ni}\le\min(K_1 f'_c A_{cv},\,K_2 A_{cv})=${nx(R.iface[0].VniCap,0)}\;\mathrm{kip/ft}\ge \frac{V_{ui}}{\phi_v}=${nx(R.iface[0].Vui/R.phiV,0)}\;${R.iface[0].capOK?'\\checkmark':'\\text{N.G.}'}\quad(K_1=0.3,\;K_2=1.8\;\mathrm{ksi},\;5.7.4.3)`}/>
      </Step>
      <Step d="Pretensioned anchorage zone (splitting / bursting)" r="LRFD 5.9.4.4">
        <ML s={Tx`P_r\ge 0.04P_i=0.04(${nx(ss.Aps*R.fpi,0)})=${nx(0.04*ss.Aps*R.fpi,1)}\;\mathrm{kip}\quad\Rightarrow\quad A_{s,req}=\frac{0.04P_i}{f_s}=\frac{${nx(0.04*ss.Aps*R.fpi,1)}}{20}=${nx(R.AsSplit,2)}\;\mathrm{in^2}\;\text{within}\;h/4=${nx(g.h/4,1)}\;\mathrm{in}`}/>
        <ML s={Tx`A_{s,prov}=${nx(+inp.opt.splitN,0)}\times${nx(+inp.opt.splitAv,2)}=${nx(R.AsSplitProv,2)}\;\mathrm{in^2}\quad\Rightarrow\quad P_{r,prov}=A_{s,prov}(20)=${nx(R.splitPr,1)}\;\mathrm{kip}\;\ge\;0.04P_i=${nx(R.splitDem,1)}\;\mathrm{kip}\quad\frac{D}{C}=${nx(R.splitDC,2)}\;${(R.checks.find(c=>c.n==='Splitting steel (5.9.4.4)')||{}).pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
      <Step d="Confinement reinforcement in the bottom flange" r="LRFD 5.9.4.4.2 — prescriptive detailing rule">
        {R.conf.exempt
          ? <div className="callout">Not required — {R.conf.why}. No check is reported.</div>
          : <div>
            <ML s={Tx`\text{extent}\ \ge\ 1.5d=1.5(${nx(g.h,1)})=${nx(R.conf.reqExt,1)}\;\mathrm{in}\qquad\text{provided}=(n-1)s=(${nx(R.conf.n,0)}-1)(${nx(R.conf.s,1)})=${nx(R.conf.provExt,1)}\;\mathrm{in}\;${R.conf.extOK?'\\checkmark':'\\text{N.G.}'}`}/>
            <ML s={Tx`d_b=${nx(R.conf.db,3)}\;\mathrm{in}\ \ge\ 0.375\ (\mathrm{No.}\,3)\;${R.conf.sizeOK?'\\checkmark':'\\text{N.G.}'}\qquad s=${nx(R.conf.s,1)}\ \le\ 6.0\;\mathrm{in}\;${R.conf.spOK?'\\checkmark':'\\text{N.G.}'}`}/>
            <div className="callout">There is no demand to compute here — 5.9.4.4.2 sets a minimum bar size, a maximum spacing and a minimum extent, nothing more. The governing item is <b>{R.conf.gov.lbl}</b> at D/C {fmt(R.conf.dc,2)}. That the bars are <b>shaped to enclose the strands</b> cannot be verified from the input; confirm it on the detail.</div>
          </div>}
      </Step>
    </CalcSec>

    {/* ============ 11 — CONTINUITY ============ */}
    {R.cont&&<CalcSec n="11" title="Continuity for LL + SIDL — Negative Moment @ Pier">
      <Step d="Pier-moment influence line — two equal spans" note="Unit load at ξ in either span; enumerated at 0.5-ft steps for trucks/tandem, both orientations; two-truck case with ≥ 50 ft between trucks per 3.6.1.3.1.">
        <ML s={Tx`\eta(\xi)=-\frac{\xi\,(L^2-\xi^2)}{4L^2}\;\;(0\le\xi\le L,\;\text{mirrored})\qquad M_{pier}=\sum P_i\,\eta(\xi_i)`}/>
      </Step>
      <Step d="Continuous dead loads (composite stage)">
        <ML s={Tx`M_{DC2}=\frac{w_{bar}L^2}{8}=\frac{${nx(R.wBar,2)}(${nx(L,0)})^2}{8}=${nx(R.cont.MDC2n,0)}\qquad M_{DW}=\frac{${nx(R.wDW,2)}(${nx(L,0)})^2}{8}=${nx(R.cont.MDWn,0)}\;\mathrm{k\text{-}ft}`}/>
      </Step>
      <Step d="HL-93 negative moment per lane" r="LRFD 3.6.1.3.1">
        <ML s={Tx`M_{ln}=\frac{0.64L^2}{8}=${nx(R.cont.negLL.Mln,0)}\qquad M_{1tr}=${nx(R.cont.negLL.M1,0)}\qquad M_{td}=${nx(R.cont.negLL.Mtd,0)}\qquad M_{2tr}=${nx(R.cont.negLL.M2,0)}\;\mathrm{k\text{-}ft}\;(\text{enumerated})`}/>
        <ML s={Tx`\text{Case 1: }1.33\max(M_{1tr},M_{td})+M_{ln}=1.33(${nx(Math.max(R.cont.negLL.M1,R.cont.negLL.Mtd),0)})+${nx(R.cont.negLL.Mln,0)}=${nx(1.33*Math.max(R.cont.negLL.M1,R.cont.negLL.Mtd)+R.cont.negLL.Mln,0)}`}/>
        <ML s={Tx`\text{Case 2: }0.9\left[1.33M_{2tr}+M_{ln}\right]=0.9\left[1.33(${nx(R.cont.negLL.M2,0)})+${nx(R.cont.negLL.Mln,0)}\right]=${nx(0.9*(1.33*R.cont.negLL.M2+R.cont.negLL.Mln),0)}\quad\Rightarrow\;M_{LL/lane}=${nx(R.cont.negLL.MLL,0)}\;(\text{${R.cont.negLL.gov}})`}/>
      </Step>
      <Step d="Factored pier moment per girder">
        <ML s={Tx`M_{LL}=${nx(R.cont.negLL.MLL,0)}\,DF_m=${nx(R.cont.negLL.MLL,0)}(${nx(R.dfm,4)})=${nx(R.cont.MLLn,0)}\;\mathrm{k\text{-}ft}`}/>
        <ML s={Tx`M_u=1.25(${nx(R.cont.MDC2n,0)})+1.50(${nx(R.cont.MDWn,0)})+1.75(${nx(R.cont.MLLn,0)})=${nx(R.cont.MuN/12,0)}\;\mathrm{k\text{-}ft}`}/>
      </Step>
      <Step d="Negative-moment capacity (deck steel in tension, bottom flange in compression)" r="LRFD 5.12.3.3">
        <ML s={Tx`d=h_c-d_{top}=${nx(cp.hc,1)}-${nx(+inp.cont.dTop,2)}=${nx(R.cont.dN,1)}\;\mathrm{in}\qquad a=\frac{A_s f_y}{0.85f'_c b_{bf}}=\frac{${nx(R.cont.As,2)}(${nx(R.cont.fyr,0)})}{0.85(${nx(m.fc,1)})(${nx(g.bbf,0)})}=${nx(R.cont.aN,2)}\;\mathrm{in}\;${R.cont.aOK?Tx`\le t_{bf}=${nx(R.cont.tbf,1)}\;\checkmark`:Tx`>t_{bf}=${nx(R.cont.tbf,1)}\;\text{N.G.}`}`}/>
        <ML s={Tx`c=\frac{a}{\beta_1}=\frac{${nx(R.cont.aN,2)}}{${nx(R.cont.b1g,3)}}=${nx(R.cont.cN,2)}\;\mathrm{in}\qquad\varepsilon_t=0.003\left(\frac{d}{c}-1\right)=${nx(R.cont.etN*1000,1)}\times10^{-3}\;\Rightarrow\;\phi=${nx(R.cont.phiN,3)}`}/>
        <ML s={Tx`\phi M_n=\phi A_s f_y\left(d-\frac{a}{2}\right)=${nx(R.cont.phiN,3)}(${nx(R.cont.As,2)})(${nx(R.cont.fyr,0)})\left(${nx(R.cont.dN,1)}-\frac{${nx(R.cont.aN,2)}}{2}\right)\frac{1}{12}=${nx(R.cont.phiMnN/12,0)}\;\mathrm{k\text{-}ft}`}/>
        <ML s={Tx`\frac{M_u}{\phi M_n}=\frac{${nx(R.cont.MuN/12,0)}}{${nx(R.cont.phiMnN/12,0)}}=${nx(R.cont.dc,3)}\;${ck.at(-1).pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
    </CalcSec>}

    {/* ============ 12 — CAMBER ============ */}
    <CalcSec n={R.cont?'12':'11'} title="Camber & Deflection (midspan, + = up)">
      <Step d="Prestress camber — straight strands" r="P·e·L²/8EI">
        <ML s={Tx`\Delta_{ps,s}=\frac{P_s e_s L^2}{8E_{ci}I_g}=\frac{${nx(Ps,0)}(${nx(eS,2)})(${nx(Lin,0)})^2}{8(${nx(lo.Eci,0)})(${nx(g.I,0)})}=${nx(d1,3)}\;\mathrm{in}\;\uparrow`}/>
      </Step>
      {ss.nh>0&&<Step d="Prestress camber — harped strands">
        <ML s={Tx`\Delta_{ps,h}=\frac{P_h}{E_{ci}I_g}\left[\frac{e_{hm}L^2}{8}-\frac{(e_{hm}-e_{he})a^2}{6}\right]=\frac{${nx(Ph,0)}}{${nx(lo.Eci,0)}(${nx(g.I,0)})}\left[\frac{${nx(eHm,2)}(${nx(Lin,0)})^2}{8}-\frac{(${nx(eHm,2)}-(${nx(eHe,2)}))(${nx(aH,0)})^2}{6}\right]=${nx(d2,3)}\;\mathrm{in}\;\uparrow`}/>
      </Step>}
      <Step d="Self-weight, deck, SIDL deflections" r="5wL⁴/384EI">
        <ML s={Tx`\Delta_{sw}=\frac{5w_{sw}L^4}{384E_{ci}I_g}=\frac{5(${nx(R.wG/12,4)})(${nx(Lin,0)})^4}{384(${nx(lo.Eci,0)})(${nx(g.I,0)})}=${nx(c.dSW,3)}\;\mathrm{in}\;\downarrow`}/>
        <ML s={Tx`\Delta_{dk}=\frac{5(${nx(R.wDk/12,4)})(${nx(Lin,0)})^4}{384(${nx(cp.Ecg,0)})(${nx(g.I,0)})}=${nx(c.dDK,3)}\;\downarrow\qquad\Delta_{sd}=\frac{5(${nx((R.wBar+R.wDW)/12,4)})(${nx(Lin,0)})^4}{384(${nx(cp.Ecg,0)})(${nx(cp.Ic,0)})}=${nx(c.dSD,3)}\;\mathrm{in}\;\downarrow`}/>
      </Step>
      <Step d="Stage history — PCI multipliers" r="PCI Design Handbook">
        <ML s={Tx`\Delta_{rel}=\Delta_{ps}-\Delta_{sw}=${nx(c.dPS,3)}-${nx(c.dSW,3)}=${nx(c.rel,2)}\;\mathrm{in}`}/>
        <ML s={Tx`\Delta_{erect}=${nx(mu_.psE,2)}\Delta_{ps}-${nx(mu_.swE,2)}\Delta_{sw}=${nx(mu_.psE,2)}(${nx(c.dPS,3)})-${nx(mu_.swE,2)}(${nx(c.dSW,3)})=${nx(c.erect,2)}\;\mathrm{in}`}/>
        <ML s={Tx`\Delta_{deck}=\Delta_{erect}-\Delta_{dk}=${nx(c.erect,2)}-${nx(c.dDK,3)}=${nx(c.afterDeck,2)}\;\mathrm{in}`}/>
        <ML s={Tx`\Delta_{final}=${nx(mu_.psF,2)}\Delta_{ps}-${nx(mu_.swF,2)}\Delta_{sw}-${nx(mu_.dkF,2)}\Delta_{dk}-${nx(mu_.sdF,2)}\Delta_{sd}=${nx(c.final,2)}\;\mathrm{in}`}/>
      </Step>
      <Step d="Live-load deflection (equivalent-UDL approximation)" r="LRFD 2.5.2.6.2">
        <ML s={Tx`\Delta_{LL}\approx\frac{5M_{LL}L^2}{48E_cI_c}=\frac{5(${nx(R.MLL*12,0)})(${nx(Lin,0)})^2}{48(${nx(cp.Ecg,0)})(${nx(cp.Ic,0)})}=${nx(c.dLL,2)}\;\mathrm{in}\le\frac{L}{800}=\frac{${nx(Lin,0)}}{800}=${nx(c.llLim,2)}\;\mathrm{in}\;${ckLL.pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
    </CalcSec>

    {/* ============ OUTPUT TABLES ============ */}
    <CalcSec n={R.cont?'13':'12'} title="Output — Stresses at Tenth Points (ksi, + compression)">
      <div style={{padding:'8px 0 2px'}}>

/* ================= PERSISTENCE (localStorage) ================= */
// Works when the app is served as a real web page (e.g. GitHub Pages). In sandboxed
// preview environments where storage is blocked, every call safely no-ops.
const LS_KEY='psbeam.inputs.v1';
const UI_KEY='psbeam.ui.v1';
/* Persistent UI-preference store, kept apart from the design inputs. View state
   that a tab holds locally -- the Diagrams series filters, the span view -- lives
   here so it survives both leaving the tab (the tab unmounts, taking its useState
   with it) and a full reload. It is preferences, never engineering data, so it is
   merged over the code's defaults on read: a series the file no longer defines is
   dropped, and a series added since the pref was saved falls to its default. */
function loadUI(){ try{ const r=window.localStorage.getItem(UI_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveUI(patch){ try{ const cur=loadUI(); window.localStorage.setItem(UI_KEY,JSON.stringify({...cur,...patch})); }catch(e){} }
function lsAvailable(){
  try{const k='__psbeam_test__';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true;}
  catch(e){return false;}
}
function loadSaved(){
  try{const raw=window.localStorage.getItem(LS_KEY); if(!raw)return null; return JSON.parse(raw);}
  catch(e){return null;}
}
function saveInputs(inp){
  try{window.localStorage.setItem(LS_KEY,JSON.stringify(inp));return true;}catch(e){return false;}
}
function clearSaved(){ try{window.localStorage.removeItem(LS_KEY);}catch(e){} }

/* ---- Named project library (multiple saved projects in localStorage) ----
   Stored under one key as { id: {name, savedAt, inp} }. Independent of the single-slot
   autosave above (which restores the last working state on reload). */
const LS_PROJECTS='psbeam.projects.v1', PS_APP='psbeam';
const BP=()=>window.BridgeProjects;
function legacyLoadProjects(){ try{const raw=window.localStorage.getItem(LS_PROJECTS); return raw?JSON.parse(raw):{};}catch(e){return {};} }
// One-time migration of the legacy PS-Beam library into the shared registry (merged by name; legacy kept).
try{ if(BP()) BP().migrate(PS_APP, legacyLoadProjects(), le=>le&&le.inp); }catch(e){}
// The named-project library now lives in the shared Bridge Suite registry — one project spans all apps.
// loadProjects() projects that registry into PS-Beam's { id:{name,savedAt,inp} } shape (inp = this app's slice; null if the project has no PS-Beam design yet).
function loadProjects(){
  if(!BP()) return legacyLoadProjects();
  const reg=BP().raw(), out={};
  for(const id in reg){ const e=reg[id];
    out[id]={name:e.name, savedAt:e.savedAt, inp:(e.slices&&e.slices[PS_APP]!=null)?e.slices[PS_APP]:null,
      _apps:Object.keys(e.slices||{}), _hasDemands:!!e.demands}; }
  return out;
}
function writeProjects(obj){ return true; }   // legacy no-op; all writes go through the registry ops below
function saveProjectAs(name,inp){ return BP()?BP().saveSlice(null,name||'Untitled',PS_APP,JSON.parse(JSON.stringify(inp))):null; }
function overwriteProject(id,inp,name){ return BP()?!!BP().saveSlice(id,name||undefined,PS_APP,JSON.parse(JSON.stringify(inp))):false; }
function deleteProject(id){ return BP()?BP().del(id):false; }
function renameProject(id,name){ return BP()?BP().rename(id,name):false; }

/* Shared active-project pointer (all apps reopen to the same project). */
function loadLastProjId(){ return BP()?BP().current():null; }
function saveLastProjId(id){ if(BP()) BP().setCurrent(id); }

// Deep-merge a saved input object onto DEFAULTS so newly-added fields in future versions
// are filled in and never come back undefined.
function mergeInputs(p){
  if(!p||typeof p!=='object') return DEFAULTS;
  return {...DEFAULTS,...p,
    proj:{...DEFAULTS.proj,...(p.proj||{})}, cust:{...DEFAULTS.cust,...(p.cust||{})},
    ovr:{...DEFAULTS.ovr,...(p.ovr||{})},
    mat:{...DEFAULTS.mat,...(p.mat||{})}, str:{...DEFAULTS.str,...(p.str||{})},
    harp:{...DEFAULTS.harp,...(p.harp||{})}, loads:{...DEFAULTS.loads,...(p.loads||{})},
    cont:{...DEFAULTS.cont,...(p.cont||{})}, handling:{...DEFAULTS.handling,...(p.handling||{})},
    rateVeh:Array.isArray(p.rateVeh)?p.rateVeh:DEFAULTS.rateVeh,
    deck:{...DEFAULTS.deck,...(p.deck||{})},
    rows:Array.isArray(p.rows)&&p.rows.length?p.rows:DEFAULTS.rows,
    external:p.external||null,
    opt:(()=>{const o={...DEFAULTS.opt,...(p.opt||{}),mult:{...DEFAULTS.opt.mult,...((p.opt||{}).mult||{})}};
      if((p.opt||{}).longAs!=null && (p.opt||{}).longAsBot==null){ o.longAsBot=+p.opt.longAs; }
      return o;})()};
}

/* ═══ Shared design-beam chip ═══════════════════════════════════════════════
   Backed by BridgeBeam (the block in this file's <head>). The beam picked here
   is the beam the whole suite uses: the live-load distribution factors and the
   dead-load distribution in the LL & DL app, the DFs pulled into this design,
   and the UDLs pushed to the MCT Loads tab. Changing it in any app — or in
   another browser tab — moves every app to the same beam.
   The roster comes from the LL & DL Distribution app, which is the only one
   that knows the full cross-section, so this chip degrades to a read-only
   label until that app has been run once.
   ═══════════════════════════════════════════════════════════════════════════ */
function useDesignBeam(){
  const BB=(typeof window!=='undefined'&&window.BridgeBeam)||null;
  const [,setTick]=useState(0);
  useEffect(()=>{ if(!BB) return undefined; return BB.onChange(()=>setTick(t=>t+1)); },[BB]);
  return {BB, sel:BB?BB.get():null, roster:BB?BB.roster():null};
}
function BeamChip({nb,setBy}){
  const {BB,sel,roster}=useDesignBeam();
  if(!BB) return null;
  const beams=(roster&&roster.beams)||[];
  const mm=BB.mismatch?BB.mismatch(nb):null;
  return (
    <span className="beamchip" title={'Design beam — shared by every app in the suite. '
      +'Set the beam layout and the MassDOT classification in the LL & DL Distribution app; '
      +'the distribution factors, the dead load and the MCT beam loads all follow this beam.'}>
      <span className="bc-k">Design beam</span>
      {beams.length
        ? <select value={sel?sel.index:''} onChange={e=>BB.set(+e.target.value,null,setBy||'')}>
            {beams.map(b=><option key={b.i} value={b.i}>{b.label} · {b.ab||b.clsLabel||''}</option>)}
          </select>
        : <span className="bc-v" title="No beam roster published yet — open the LL & DL Distribution app and recalculate.">
            {sel?sel.label:'—'} <span className="bc-warn">no roster</span></span>}
      {mm&&<span className="bc-warn" title={'This app is set up for '+mm.mine+' girders but the published roster has '
        +mm.roster+'. Re-run the LL & DL Distribution app on the current layout.'}>⚠ {mm.mine}≠{mm.roster}</span>}
    </span>);
}

function App(){
  const canSave=useMemo(()=>lsAvailable(),[]);
  const [inp,setInpRaw]=useState(()=> canSave? (mergeInputs(loadSaved())||DEFAULTS) : DEFAULTS);
  const [tab,setTab]=useState('inputs');
  const [savedTick,setSavedTick]=useState(0);
  // undo/redo history (snapshots of inp). Capped to avoid unbounded growth.
  const undoStack=useRef([]); const redoStack=useRef([]);
  const [histTick,setHistTick]=useState(0);  // forces toolbar re-render when stacks change
  const HMAX=50;
  // wrapped setter: pushes the current state onto the undo stack before applying the new one.
  const setInp=useMemo(()=>(next,opts)=>{
    setInpRaw(prev=>{
      const nv=typeof next==='function'?next(prev):next;
      if(JSON.stringify(nv)===JSON.stringify(prev)) return prev;  // no-op, don't record
      if(!(opts&&opts.noHistory)){
        undoStack.current.push(prev);
        if(undoStack.current.length>HMAX) undoStack.current.shift();
        redoStack.current=[];           // a fresh edit clears the redo branch
      }
      return nv;
    });
    setHistTick(t=>t+1);
  },[]);
  const undo=()=>{ if(!undoStack.current.length)return;
    setInpRaw(prev=>{ redoStack.current.push(prev); return undoStack.current.pop(); });
    setHistTick(t=>t+1); };
  const redo=()=>{ if(!redoStack.current.length)return;
    setInpRaw(prev=>{ undoStack.current.push(prev); return redoStack.current.pop(); });
    setHistTick(t=>t+1); };
  const R=useMemo(()=>computeAll(inp),[inp]);
  if(!R.error)R._set=setInp;
  // ── Follow the suite-wide design beam ──────────────────────────────────────
  //    While loads.posAuto is on, the interior/exterior position is taken from the
  //    beam selected in the header chip (its MassDOT classification decides which),
  //    so PS-Beam designs the same beam the LL & DL app is distributing load to.
  //    Flipping the INTERIOR/EXTERIOR toggle by hand turns posAuto off and tags the
  //    field as overridden until you switch it back.
  const dbSel=useDesignBeam().sel;
  useEffect(()=>{
    if(!dbSel||inp.loads.posAuto===false) return;
    const want=(dbSel.type==='ext')?'exterior':'interior';
    if(!dbSel.type||inp.loads.pos===want) return;
    setInp(prev=>({...prev,loads:{...prev.loads,pos:want}}),{noHistory:true});
  },[dbSel&&dbSel.index,dbSel&&dbSel.type,inp.loads.posAuto,inp.loads.pos]);
  // ── Publish composite section properties so the MCT app can auto-fill a PSC "Value" member ──
  //    Channel: bridgeSuite.v1.psSection  (composite section transformed to girder concrete; Ecg pairs with Ic)
  const psSecRef=useRef('');
  useEffect(()=>{
    try{
      if(R.error||!R.cp||!R.g) return;
      const cp=R.cp, g=R.g;
      const wj=weakAxisAndJ(g);   // weak-axis I (Izz) & torsion J (Ixx) — bare girder (always < strong-axis Ic)
      const core={ project:(inp.proj&&inp.proj.name)||'', memberKey:(inp.proj&&inp.proj.girderId)||'',
        fc:+inp.mat.fc, Ecg:+cp.Ecg,                        // girder f'c (ksi) & modulus (ksi) — pairs with transformed Ic
        Ag:+g.A, Ig:+g.I, ybg:+g.yb, hg:+g.h,               // non-composite girder (in², in⁴, in)
        Ac:+cp.Ac, Ic:+cp.Ic, ybc:+cp.ybc, ytc:+cp.ytc, hc:+cp.hc,   // composite: strong-axis Ix=Ic (in², in⁴, in)
        Iweak:+wj.Iweak, J:+wj.J,                           // weak-axis I & torsion J (in⁴) — approximate, overridable
        wsw:+g.wsw, wdk:+cp.wdk,                                       // girder self-wt & deck+haunch (klf) for DL1
        // LL & DL prefill terms: eg (girder centroid -> deck centroid) and n = E_girder/E_deck
        // for the Kg formula, plus the beam width -- so the LL & DL app can follow this section
        // directly. Ic above is the COMPOSITE strong-axis Ix, which is what it adopts as I.
        eg:+((+g.h+(+inp.th)+(+inp.ts)/2)-g.yb).toFixed(2),

        Geometry has been updated in MCT – click to review what changed
      </div>
    )}
    {geomModalOpen&&geomChanges&&(
      <div className="geom-modal-overlay" onClick={()=>setGeomModalOpen(false)}>
        <div className="geom-modal" onClick={e=>e.stopPropagation()}>
          <h2>Geometry Changes from MCT</h2>
          <div className="geom-select-all" style={{display:'block',fontSize:12,lineHeight:1.65,color:'#57534e'}}>
            A record of what moved in the analysis model. The numbers themselves travel with the
            demands hand-off, not from here — re-send the demands from the MCT Generator, or lock
            the channel below and let every later change arrive on its own.
          </div>
          <div className="geom-modal-changes">
            {(geomChanges.changes||[]).map((change,i)=>(
              <div key={i} className="geom-change-item">
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:13}}>{change.field}</div>
                    {change.detail&&<div style={{fontSize:12,color:'#666',marginTop:2}}>{change.detail}</div>}
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  <div>
                    <div style={{fontSize:11,color:'#666',marginBottom:3}}>Current</div>
                    <div className="geom-old-val">{String(change.oldVal||'—')}</div>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:'#666',marginBottom:3}}>New</div>
                    <div className="geom-new-val">{String(change.newVal||'—')}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="geom-modal-buttons">
            <button className="geom-modal-btn cancel" onClick={skipGeometryChanges}>Dismiss</button>
            <button className="geom-modal-btn load" style={{background:'#ea580c',borderColor:'#ea580c'}}
              onClick={()=>{ skipGeometryChanges(); toggleDemandsLock(true); }}>
              🔒 Auto-update from the analysis model</button>
          </div>
        </div>
      </div>
    )}
    <div className="tblock">
      <div><h1>PS-Girder <span>/ AASHTO LRFD</span></h1>
        <div className="sub">PRESTRESSED CONCRETE GIRDER DESIGN · SERVICE · STRENGTH · LOSSES · CAMBER</div></div>
      <div>
        <div className="tb-grid">
          {[['name','Project'],['girderId','Girder'],['by','By'],['date','Date'],['job','Job No.']].map(([k,l])=>
            <div className="tb-cell" key={k}><div className="lab">{l}</div>
            <input value={inp.proj[k]} onChange={e=>uP(k,e.target.value)}/></div>)}
          <div className="tb-cell"><div className="lab">Checks</div>
            <div style={{fontFamily:'var(--mono)',fontSize:12.5,fontWeight:600,
              color:R.error?'var(--fail)':(nPass===R.checks.length?'var(--pass)':'var(--fail)')}}>
              {R.error?'ERR':`${nPass}/${R.checks?R.checks.length:0} PASS`}</div></div>
        </div>
        <div className="btnrow noprint" style={{marginTop:6,justifyContent:'flex-end',alignItems:'center'}}>
          <a className="bx-alltools" href="tools.html" target="_top" title="Open the list of all tools"
            style={{fontSize:10.5,fontFamily:'var(--mono)',color:'var(--ink2)',textDecoration:'none',marginRight:'auto'}}>← All tools</a>
          <button className="btn sm ghost" onClick={bxUseProject} title="Fill Project, By, Date and Job No. from the project info shared by another tool (asks first; never blanks a field)">Use shared project info</button>
          <button className="btn sm ghost" onClick={bxShareProject} title="Share this title block with the other tools">Share project info</button>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          <BeamChip nb={Math.max(2,Math.round(+inp.nGirders||0))||null} setBy="PS-Beam"/>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          {canSave
            ? <span style={{fontSize:10.5,color:'var(--ink2)',fontFamily:'var(--mono)',marginRight:2}} title="Inputs are saved on this device and restored when you reopen the app.">✓ auto-saved</span>
            : <span style={{fontSize:10.5,color:'var(--ink2)',fontFamily:'var(--mono)',marginRight:2}} title="Browser storage is unavailable in this preview. Deploy the page (e.g. GitHub Pages) or use Export/Import to persist.">⚠ session not saved here</span>}
          <button className="btn sm ghost" onClick={undo} disabled={!undoStack.current.length}
            style={!undoStack.current.length?{opacity:0.4,cursor:'default'}:{}} title="Undo (Ctrl/⌘+Z)">↶ Undo</button>
          <button className="btn sm ghost" onClick={redo} disabled={!redoStack.current.length}
            style={!redoStack.current.length?{opacity:0.4,cursor:'default'}:{}} title="Redo (Ctrl/⌘+Shift+Z)">↷ Redo</button>
          {canSave&&<React.Fragment>
            <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
            <span style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--ink2)',whiteSpace:'nowrap'}}
              title="The whole bridge is saved as one project, created and managed in the MCT app. PS-Beam autosaves its part into the active project — there is no separate PS-Beam save.">
              {activeName
                ? <span>◆ Project: <b style={{color:'var(--ink)'}}>{activeName}</b></span>
                : <span>◇ No active project — session autosaved</span>}
            </span>
            <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          </React.Fragment>}
          <button className="btn sm ghost" onClick={()=>bridgeNav(null)} title="Back to the MIDAS/MCT analysis app">↩ MCT Analysis</button>
          <button className="btn sm ghost" onClick={()=>bridgeNav('stgirder')} title="Open the composite steel design app">ST-Girder ↗</button>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          <button className="btn sm ghost" onClick={bxSendRx} title="Send the unfactored DC1, DC2 and DW end reactions of this girder line (kip) to Bridge Substructure Loading">Send reactions to Substructure Loading</button>
          <button className="btn sm ghost" onClick={bxExportRx} title="Save the same reactions hand-off as a JSON file (for Import hand-off in Substructure Loading, or a calc package)">Export hand-off (JSON)</button>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          <button className="btn sm" onClick={exportJSON}>Export JSON</button>
          <button className="btn sm" onClick={()=>fileRef.current.click()}>Import</button>
          <button className="btn sm ghost" onClick={resetAll}>Reset</button>
          <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={importJSON}/>
        </div>
      </div>
    </div>
    <LockAutoSync inp={inp} set={setInp}/>
    {R.error?
      <div className="callout warn" style={{marginTop:14}}><b>Input error:</b> {R.error}. Check geometry and strand entries.</div>
    :<React.Fragment>
      <div className="statusband noprint"><span className="chip head">Design status</span>
        {R.checks.map((c,i)=><span key={i} className={'chip '+(c.pass?'p':'f')} title={`${fmt(Math.abs(c.v),2)} vs ${fmt(Math.abs(c.lim),2)} ${c.u} @ ${fmt(c.loc,1)} ft`}>{c.n} {fmt(c.r,2)}</span>)}
      </div>
      <div className="tabs noprint">{TABS.map(([k,l])=>
        <button key={k} className={'tab'+(tab===k?' on':'')} onClick={()=>setTab(k)}>{l}</button>)}</div>
      {tab==='inputs'?
        <div className="cols">
          <div><InputsTab inp={inp} set={setInp} R={R} selRow={selRow} setSelRow={setSelRow} editedRows={editedRows} flashRow={flashRow} editLog={editLog} clearLog={clearLog} strandPick={strandPick}/></div>
          <div className="gfx"><Card title="Live Geometry" refTag="auto-updates">
            <CrossSection inp={inp} R={R} set={setInp} selRow={selRow} setSelRow={setSelRow} flashRow={flashRow} logEdit={logEdit}
              onPickStrand={ri=>setStrandPick({ri})}
              revertStrands={revertStrands} strandsDirty={JSON.stringify(strandBaseline.current)!==JSON.stringify(inp.rows)}/><Elevation inp={inp} R={R}/></Card></div>
        </div>
      :<div className="cols-full">
        {tab==='section'&&<SectionTab inp={inp} R={R}/>}
        {tab==='losses'&&<LossesTab inp={inp} R={R}/>}
        {tab==='stresses'&&<StressTab inp={inp} R={R}/>}
        {tab==='flexure'&&<FlexTab inp={inp} R={R}/>}
        {tab==='shear'&&<ShearTab inp={inp} R={R}/>}
        {tab==='anchorage'&&<AnchorageTab inp={inp} R={R}/>}
        {tab==='diagrams'&&<DiagramsTab inp={inp} R={R} set={setInp}/>}
        {tab==='camber'&&<CamberTab inp={inp} R={R}/>}
        {tab==='handling'&&<HandlingTab inp={inp} R={R}/>}
        {tab==='deck'&&<DeckTab inp={inp} R={R}/>}
        {tab==='rating'&&<RatingTab inp={inp} R={R} set={setInp} onSendCapacity={publishCapacity} capLocked={capLocked} onToggleCapLock={toggleCapLock}/>}
        {tab==='optimize'&&<OptimizeTab inp={inp} set={setInp} R={R}/>}
        {tab==='compare'&&<CompareTab inp={inp} R={R}/>}
        {tab==='nomen'&&<NomenclatureTab inp={inp} R={R}/>}
        {tab==='report'&&<ReportTab inp={inp} R={R}/>}
      </div>}
    </React.Fragment>}
    <div className="footer">
      <span>PS-GIRDER v2.65 · AASHTO LRFD BDS · UNITS: KIP·IN·KSI</span>
      <span>DESIGN AID — INDEPENDENT VERIFICATION BY A LICENSED ENGINEER REQUIRED</span>
    </div>
  </div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
/* Floating cross-app sync drawer — shows every shared channel, which of them
   this browser is following, and the running log of automatic updates. It is
   deliberately outside the app's own layout because the state it reports is
   the suite's, not this page's. */
try{ if(window.BridgeLocks&&BridgeLocks.ok()) BridgeLocks.drawer({app:'psbeam'}); }catch(e){}
</script>
</body>
</html>
