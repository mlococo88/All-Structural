function AnchDiagram({R,inp}){
  const hQ=R.splitZone;                                    // longitudinal h/4 placement zone (in)
  const endOh=+((inp.opt&&inp.opt.endOh)||0), Lpad=+((inp.opt&&inp.opt.Lpad)||0);
  const sInt=Math.max(+((inp.opt&&inp.opt.sInt)||6),1);
  const bearCL=Math.max(endOh, Lpad/2, hQ*0.15);           // bearing CL from member end (display-safe)
  const gLen=Math.max(hQ*1.9, bearCL+Lpad/2+sInt*2.5, hQ+sInt*3.5, 24);   // longitudinal length drawn (in)
  const PW=760, PH=300, ox=44, oy=66, depthPx=132;
  const plotW=PW-ox-30, sc=plotW/gLen, X=v=>ox+v*sc, xb=ox+gLen*sc, cov=depthPx*0.11;
  // provided splitting bars in the zone; interior stirrups beyond it as context
  const nSpl=Math.max(1,Math.round(+inp.opt.splitN||0)), nSplD=Math.min(nSpl,10);
  const splX=Array.from({length:nSplD},(_,i)=>hQ*(i+0.5)/nSplD);
  const intX=[]; for(let x=hQ+sInt; x<gLen-0.5; x+=sInt) intX.push(x);
  const bar=(key,x,color,w)=>(<g key={key}>
    <line x1={X(x)} y1={oy+cov} x2={X(x)} y2={oy+depthPx-cov} stroke={color} strokeWidth={w}/>
    <circle cx={X(x)} cy={oy+cov} r="2.3" fill={color}/><circle cx={X(x)} cy={oy+depthPx-cov} r="2.3" fill={color}/></g>);
  const arw=(x,y,d)=><polygon points={`${x},${y} ${x+d*6.5},${y-3.3} ${x+d*6.5},${y+3.3}`} fill="#1C4FC4"/>;
  const padW=Math.max(Lpad*sc,22);
  return (<svg viewBox={`0 0 ${PW} ${PH}`} style={{width:'100%',maxWidth:PW,height:'auto'}}>
    {/* splitting zone tint */}
    <rect x={ox} y={oy} width={hQ*sc} height={depthPx} fill="rgba(28,79,196,0.07)"/>
    {/* girder body drawn as a side elevation with a broken (continues) right end */}
    <path d={`M ${ox} ${oy} L ${xb-12} ${oy} L ${xb-18} ${oy+depthPx*0.42} L ${xb-4} ${oy+depthPx*0.58} L ${xb-12} ${oy+depthPx} L ${ox} ${oy+depthPx} Z`}
      fill="none" stroke="#334" strokeWidth="1.6"/>
    {/* emphasize the member-end face */}
    <line x1={ox} y1={oy-6} x2={ox} y2={oy+depthPx+6} stroke="#334" strokeWidth="2.2"/>
    <text x={ox+2} y={oy-30} fontSize="10.5" textAnchor="start" fill="#334">member end</text>
    {/* interior stirrups (context) then the splitting bars on top */}
    {intX.map((x,i)=>bar('i'+i,x,'#9aa3b2',1.3))}
    {splX.map((x,i)=>bar('s'+i,x,'#1C4FC4',1.8))}
    {/* h/4 dimension above, arrowheads + extension lines, per the standard detail */}
    <line x1={X(0)} y1={oy-14} x2={X(0)} y2={oy+depthPx} stroke="#1C4FC4" strokeWidth="0.7" strokeDasharray="2 2" opacity="0.55"/>
    <line x1={X(hQ)} y1={oy-14} x2={X(hQ)} y2={oy+depthPx} stroke="#1C4FC4" strokeWidth="0.7" strokeDasharray="2 2" opacity="0.55"/>
    <line x1={X(0)} y1={oy-14} x2={X(hQ)} y2={oy-14} stroke="#1C4FC4" strokeWidth="1"/>
    {arw(X(0),oy-14,1)}{arw(X(hQ),oy-14,-1)}
    <text x={(X(0)+X(hQ))/2} y={oy-19} fontSize="12.5" textAnchor="middle" fill="#1C4FC4">h/4 = {fmt(hQ,1)}″</text>
    {/* bearing pad + centerline of bearing */}
    <rect x={X(bearCL)-padW/2} y={oy+depthPx} width={padW} height="11" fill="#e7e9ef" stroke="#334" strokeWidth="1"/>
    <line x1={X(bearCL)} y1={oy+8} x2={X(bearCL)} y2={oy+depthPx+42} stroke="#B3261E" strokeWidth="1" strokeDasharray="9 3 2 3"/>
    <text x={X(bearCL)} y={oy+depthPx+56} fontSize="10.5" textAnchor="middle" fill="#B3261E">CENTERLINE OF BEARING</text>
    {/* legend */}
    <g transform={`translate(${PW-176},${oy-44})`}>
      <line x1="0" y1="5" x2="0" y2="15" stroke="#1C4FC4" strokeWidth="1.8"/><circle cx="0" cy="5" r="2.3" fill="#1C4FC4"/><circle cx="0" cy="15" r="2.3" fill="#1C4FC4"/>
      <text x="9" y="14" fontSize="10.5" fill="#334">splitting bars (within h/4)</text>
      <line x1="2" y1="24" x2="2" y2="33" stroke="#9aa3b2" strokeWidth="1.4"/>
      <text x="9" y="32" fontSize="10.5" fill="#334">stirrups beyond (context)</text>
    </g>
  </svg>);
}

function AnchorageTab({inp,R}){
  const g=R.g, Pi=R.ss.Aps*R.fpi, relOn=!!inp.opt.relBondedReinf;
  const splitPass=(R.checks.find(c=>c.n==='Splitting steel (5.9.4.4)')||{}).pass;
  return(<div>
    <div className="bigres">
      <div className={'br '+(splitPass?'p':'f')}><div className="l">Splitting / bursting (5.9.4.4)</div><div className="n">{fmt(R.splitDC,2)}</div><div className="u">req {fmt(R.AsSplit,2)} / prov {fmt(R.AsSplitProv,2)} in² within h/4 = {fmt(R.splitZone,1)}″</div></div>
      <div className={'br '+(R.conf.pass?'p':'f')}><div className="l">Confinement (5.9.4.4.2)</div><div className="n">{R.conf.exempt?'—':fmt(R.conf.dc,2)}</div><div className="u">{R.conf.exempt?'not required':('governs: '+R.conf.gov.lbl)}</div></div>
      {relOn
        ? <div className={'br '+(R.relSteel.ok?'p':'f')}><div className="l">Release tens. steel (5.9.2.3.1b)</div><div className="n">{fmt(R.relSteel.dc,2)}</div><div className="u">req {fmt(R.relSteel.AsReq,2)} / prov {fmt(R.relSteel.AsProv,2)} in²</div></div>
        : <div className="br"><div className="l">Release tension limit</div><div className="n">lower</div><div className="u">min(0.0948√f′ci, 0.2 ksi) — no bonded steel claimed</div></div>}
    </div>

    <Card title="Splitting Reinforcement — Girder-End Elevation" refTag="LRFD 5.9.4.4.1 — within h/4 of the member end">
      <AnchDiagram R={R} inp={inp}/>
      <div className="callout">Side elevation of the girder end. The <b style={{color:'#1C4FC4'}}>splitting / bursting</b> steel is placed within <b>h/4 = {fmt(R.splitZone,1)}″</b> of the member end (5.9.4.4.1), where for this section <b>h = the overall {R.splitDir} = {fmt(R.splitH,1)}″</b> and the reinforcement is {R.splitDir==='width'?'horizontal':'vertical'} {R.splitDir==='width'?'(solid / voided slab)':'(I-girder, bulb tee or box/tub)'}. The h/4 zone is dimensioned from the member end; the centerline of bearing is set in by the overhang{(+((inp.opt&&inp.opt.endOh)||0))>0?` (${fmt(+inp.opt.endOh,1)}″)`:''}. Bar spacing is to scale in the longitudinal direction; the section depth is schematic. {R.conf.exempt
        ? <span>Confinement reinforcement (5.9.4.4.2) is <b>not required</b> for this section type.</span>
        : <span><b>Confinement</b> ties (5.9.4.4.2) extend <b>1.5d = {fmt(R.conf.reqExt,1)}″</b> from the end — detailed in the Confinement card below.</span>}</div>
    </Card>

    {(g.isDeck||g.isBox)&&
    <Card title="Splitting Reinforcement Orientation — Slabs &amp; Box Beams" refTag="AASHTO Fig. C5.9.4.4.1-2">
      <img src={SLAB_SPLIT_IMG} alt="Precast voided slab — primary splitting reinforcement is horizontal in slabs" style={{width:'100%',maxWidth:620,display:'block',margin:'6px auto',border:'1px solid var(--line)',borderRadius:6}}/>
      <div className="callout">For <b>solid slabs, voided slabs and box beams</b>, the primary splitting reinforcement is <b>horizontal</b>, placed within h/4 of the member end where <b>h is the overall width</b> (5.9.4.4.1). The elevation above shows the bars schematically; in a slab they run transversely (horizontal), as in AASHTO Figure C5.9.4.4.1-2.</div>
    </Card>}

    <Card title="Pretensioned Anchorage Zone — Splitting / Bursting" refTag="LRFD 5.9.4.4.1">
      <KV rows={[['P_i at transfer',fmt(Pi,0),'kip'],
        ['Bursting resistance P_r ≥ 4% P_i',fmt(R.splitDem,1),'kip'],
        ['Req. A_s (f_s = 20 ksi)',fmt(R.AsSplit,2),'in²'],
        ['Provided A_s (within h/4)',fmt(R.AsSplitProv,2),'in²'],
        ['Provided resistance (A_s · 20)',fmt(R.splitPr,1),'kip'],
        ['h = overall '+R.splitDir+' (5.9.4.4.1)',fmt(R.splitH,1),'in'],
        ['Place within h/4 from end',fmt(R.splitZone,1),'in'],
        ['D/C (4%P_i / provided)',fmt(R.splitDC,2),splitPass?'OK':'N.G.']]}/>
      <Deriv title="Derivation — Splitting / Bursting Steel" refTag="LRFD 5.9.4.4.1">
        <Step d="Bursting resistance ≥ 4% of the prestress at transfer" r="5.9.4.4.1">
          <ML s={Tx`P_r=f_s A_s\ge 0.04P_i=0.04(${nx(Pi,0)})=${nx(R.splitDem,1)}\;\mathrm{kip}\qquad(f_s\le 20\;\mathrm{ksi})`}/>
          <ML s={Tx`A_{s,req}=\frac{0.04P_i}{20}=\frac{${nx(R.splitDem,1)}}{20}=${nx(R.AsSplit,2)}\;\mathrm{in^2}\;\text{within}\;h/4=${nx(R.splitZone,1)}\;\mathrm{in}\;(h=\text{overall ${R.splitDir}}=${nx(R.splitH,1)}\;\mathrm{in})`}/>
          <ML s={Tx`A_{s,prov}=${nx(+inp.opt.splitN,0)}\times${nx(+inp.opt.splitAv,2)}=${nx(R.AsSplitProv,2)}\;\mathrm{in^2}\;\Rightarrow\;P_{r,prov}=${nx(R.splitPr,1)}\;\mathrm{kip}\ge ${nx(R.splitDem,1)}\;\mathrm{kip}\quad\frac{D}{C}=${nx(R.splitDC,2)}\;${splitPass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
      </Deriv>
      <div className="callout">The 4% rule (5.9.4.4.1) limits the bursting steel to a stress of 20 ksi so the reinforcement stays well below yield at the service condition right after release. It must be within h/4 of the member end, where the transverse tension from the diverging strand force peaks.</div>
    </Card>

    <Card title="Confinement Reinforcement" refTag="LRFD 5.9.4.4.2">
      {R.conf.exempt
        ? <div className="callout">Not required for this section — {R.conf.why}. No check is reported.</div>
        : <div>
          <Tbl head={['Requirement','Value','Limit','Ratio','Status']}
            rows={R.conf.parts.map(q=>({c:[q.lbl,fmt(q.v,3)+' '+q.u,fmt(q.lim,3)+' '+q.u,fmt(q.r,2),PF(q.ok)]}))}/>
          <KV rows={[['Bar provided','No. '+fmt(R.conf.barNo,0)+' @ '+fmt(R.conf.s,1)+'″',''],
            ['A_b per bar',fmt(R.conf.Ab,2),'in²'],
            ['Required extent 1.5d',fmt(R.conf.reqExt,1),'in'],
            ['Provided extent (n−1)s',fmt(R.conf.provExt,1),'in'],
            ['Bars to cover 1.5d at this spacing',fmt(R.conf.nNeed,0),'bars'],
            ['Governing',R.conf.gov.lbl,R.conf.pass?'OK':'N.G.']]}/>
          <div className="callout">Prescriptive detailing rule, not a force check — 5.9.4.4.2 sets a minimum bar size, a maximum spacing and a minimum extent, with no demand to compute. The remaining requirement, that the bars be <b>shaped to enclose the strands</b>, is a geometric detail the app cannot verify; confirm it on the reinforcement detail.</div>
        </div>}
    </Card>

    <Card title="Release-Tension Bonded Steel" refTag="LRFD 5.9.2.3.1b">
      {relOn
        ? <div>
          <KV rows={[['Governing concrete tensile force T',fmt(R.relSteel.T,1),'kip'],
            ['Location',R.relSteel.where+' @ x = '+fmt(R.relSteel.x,1)+' ft',''],
            ['Steel stress 0.5f_y ≤ 30 ksi',fmt(R.relSteel.fs,1),'ksi'],
            ['Required A_s = T / (0.5f_y)',fmt(R.relSteel.AsReq,2),'in²'],
            ['Provided A_s',fmt(R.relSteel.AsProv,2),'in²'],
            ['D/C',fmt(R.relSteel.dc,2),R.relSteel.ok?'OK':'N.G.']]}/>
          <Deriv title="Derivation — Release-Tension Bonded Steel" refTag="LRFD 5.9.2.3.1b">
            <Step d="Steel to carry the concrete tensile force at release" r="5.9.2.3.1b">
              <ML s={Tx`f_s=\min(0.5f_y,\,30)=\min(0.5(${nx(+inp.opt.relFy||60,0)}),30)=${nx(R.relSteel.fs,1)}\;\mathrm{ksi}`}/>
              <ML s={Tx`A_{s,req}=\frac{T}{f_s}=\frac{${nx(R.relSteel.T,1)}}{${nx(R.relSteel.fs,1)}}=${nx(R.relSteel.AsReq,2)}\;\mathrm{in^2}\le A_{s,prov}=${nx(R.relSteel.AsProv,2)}\;\mathrm{in^2}\;${R.relSteel.ok?'\\checkmark':'\\text{N.G.}'}`}/>
            </Step>
          </Deriv>
          <div className="callout">The higher 0.24√f′ci release-tension limit (5.9.2.3.1b) applies only where bonded steel carries the full concrete tensile force T, proportioned at 0.5f_y not more than 30 ksi. T is integrated over the uncracked section at the worst tension station — the top near the ends and the bottom at midspan — and the larger governs. {R.relSteel.ok
            ? <span style={{color:'#15803D',fontWeight:600}}>Provided ≥ required — the higher limit is justified.</span>
            : <span style={{color:'#B3261E',fontWeight:600}}>Provided is less than required — add steel, or switch off the bonded-reinforcement option and take the lower min(0.0948√f′ci, 0.2 ksi) limit.</span>} Voids are ignored in the integration, so the required steel is if anything conservative.</div>
        </div>
        : <div className="callout">The bonded-reinforcement option is off, so the release-tension limit is the lower min(0.0948√f′ci, 0.2 ksi) (5.9.2.3.1b) and no end-region tension steel is required for it. Turn the option on (Inputs tab) to claim the higher 0.24√f′ci limit and enter/verify the bonded steel here.</div>}
    </Card>
  </div>);
}

function CamberTab({inp,R}){
  const c=R.cam,m=inp.opt.mult;
  const stages=[['Transfer (1.0/1.0)',c.rel],['Erection ('+m.psE+'/'+m.swE+')',c.erect],
    ['At deck placement',c.afterDeck],['Beam seat (all DL)',c.seat],['Final long-term',c.final]];
  return(<div>
    <div className="bigres">
      <div className="br"><div className="l">At erection</div><div className="n">{fmt(c.erect,2)}</div><div className="u">in ↑ · girder set</div></div>
      <div className="br" style={{outline:'2px solid var(--blue)',outlineOffset:-2}}><div className="l">At deck placement</div><div className="n">{fmt(c.afterDeck,2)}</div><div className="u">in {c.afterDeck>=0?'↑':'↓'} · haunch/screed</div></div>
      <div className="br" style={{outline:'2px solid #15803D',outlineOffset:-2}}><div className="l">Beam-seat camber</div><div className="n">{fmt(c.seat,2)}</div><div className="u">in {c.seat>=0?'↑':'↓'} · seat elev. (all DL, 1.0)</div></div>
      <div className="br"><div className="l">Final (net)</div><div className="n">{fmt(c.final,2)}</div><div className="u">in {c.final>=0?'↑':'↓'}</div></div>
      <div className={'br '+(R.checks.find(c=>c.n==='LL deflection').pass?'p':'f')}><div className="l">LL deflection (est.)</div><div className="n">{fmt(c.dLL,2)}</div><div className="u">in vs L/800 = {fmt(c.llLim,2)} in</div></div>
    </div>
    <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
      <Card title="Elastic Components (Midspan)" refTag="E_ci for release · E_c thereafter">
        <Tbl head={['Component','Δ (in)','Direction','Section / E']}
          rows={[{c:['Prestress',fmt(c.dPS,3),'↑ up','I_g · E_ci']},
                 {c:['Girder self-weight',fmt(c.dSW,3),'↓ down','I_g · E_ci']},
                 {c:['Deck + haunch + NC',fmt(c.dDK,3),'↓ down','I_g · E_c']},
                 ...(c.dDia>1e-4?[{c:['Diaphragms (point)',fmt(c.dDia,3),'↓ down','I_g · E_c']}]:[]),
                 {c:['Barrier + DW',fmt(c.dSD,3),'↓ down','I_c · E_c']},
                 {c:['Live load (approx.)',fmt(c.dLL,3),'↓ down','I_c · E_c']}]}/>
        <div style={{marginTop:12,fontSize:11,letterSpacing:'.8px',textTransform:'uppercase',color:'var(--ink2)'}}>PCI multipliers (editable)</div>
        <div className="frow" style={{marginTop:4}}>
          {[['psE','PS @ erect'],['swE','SW @ erect'],['psF','PS final'],['swF','SW final'],['dkF','Deck final'],['sdF','SIDL final']].map(([k,l])=>
            <Num key={k} l={l} v={m[k]} step={0.05} set={v=>{const o=JSON.parse(JSON.stringify(inp));o.opt.mult[k]=v;R._set(o);}}/>)}
        </div>
      </Card>
      <Card title="Camber History" refTag="PCI Design Handbook method">
        <Fig h={290} data={[{type:'bar',x:stages.map(s=>s[0]),y:stages.map(s=>s[1]),
          marker:{color:stages.map(s=>s[1]>=0?'#1C4FC4':'#B45309')}}]}
          layout={{yaxis:{title:'net camber (in, + up)'},xaxis:{tickfont:{size:9.5}}}}/>
        <div className="callout"><b>Which value for which task:</b> <b>beam-seat elevations</b> → the <b>Δ_seat</b> camber (erection multipliers on PS & self-weight, all dead load incl. SIDL subtracted at 1.0 "locked-in" per MassDOT); <b>haunch & screed</b> → the <b>Δ_deck</b> camber (at deck placement, before SIDL); <b>final</b> → long-term net camber for serviceability/appearance (with long-term multipliers). LL deflection uses an equivalent-uniform-load approximation on the composite section.</div>
      </Card>
    </div>

    {(()=>{const g=R.g,cp=R.cp,ss=R.ss,L=R.L,Lin=L*12;
      const Ps=ss.AsStraight*R.fpi, Ph=ss.AsHarp*R.fpi, eS=g.yb-ss.cgsStraight,
            eHm=g.yb-(+ss.hp.yMid), eHe=g.yb-(+ss.hp.yEnd), aH=ss.hp.frac*Lin,
            d1=Ps*eS*Lin*Lin/(8*R.lo.Eci*g.I),
            d2=ss.nh>0? Ph*(eHm*Lin*Lin/8-(eHm-eHe)*aH*aH/6)/(R.lo.Eci*g.I):0;
      const ckLL=R.checks.find(x=>x.n==='LL deflection');
      return <Deriv title="Derivation — Camber & Deflection (midspan, + up)" refTag="PCI / LRFD 2.5.2.6.2">
        <VarTable rows={[
          ['L','Span length',R.L,'ft'],
          ['E_ci','Girder modulus at release',R.lo.Eci,'ksi'],
          ['E_c','Girder modulus, final',cp.Ecg,'ksi'],
          ['I_g','Gross girder inertia',g.I,'in⁴'],
          ['I_c','Composite inertia',cp.Ic,'in⁴'],
          ['Δ_ps','Prestress camber',c.dPS,'in'],
          ['Δ_sw','Self-weight deflection',c.dSW,'in'],
          ['Δ_dk','Deck+haunch deflection',c.dDK,'in'],
          ['Δ_sd','Barrier+DW deflection',c.dSD,'in'],
          ['Δ_erect','Camber at erection',c.erect,'in'],
          ['Δ_deck','Camber at deck placement (haunch)',c.afterDeck,'in'],
          ['Δ_seat','Beam-seat camber (all DL)',c.seat,'in'],
          ['Δ_final','Final long-term camber',c.final,'in'],
        ]}/>
        <Step d="Δ_ps,s — Upward camber from the straight (bottom) strands"
              r="P·e·L²/8EI"
              note="The straight strands pull below the centroid, bowing the girder up. Computed on the bare girder at release: gross section I_g and the release-age concrete modulus E_ci. P_s = straight-strand force after elastic shortening, e_s = their eccentricity below the centroid.">
          <ML s={Tx`\Delta_{ps,s}=\frac{P_s e_s L^2}{8E_{ci}I_g}=\frac{${nx(Ps,0)}(${nx(eS,2)})(${nx(Lin,0)})^2}{8(${nx(R.lo.Eci,0)})(${nx(g.I,0)})}=${nx(d1,3)}\;\mathrm{in}\;\uparrow`}/>
        </Step>
        {ss.nh>0&&<Step d="Δ_ps,h — Upward camber from the harped (draped) strands"
              r="double-harp profile"
              note="The harped strands rise toward the ends, so their upward push is computed from the draped profile (eccentricity e_hm at midspan, e_he at the harp point a from each end). Also on the bare girder: I_g, E_ci.">
          <ML s={Tx`\Delta_{ps,h}=\frac{P_h}{E_{ci}I_g}\left[\frac{e_{hm}L^2}{8}-\frac{(e_{hm}-e_{he})a^2}{6}\right]=\frac{${nx(Ph,0)}}{${nx(R.lo.Eci,0)}(${nx(g.I,0)})}\left[\frac{${nx(eHm,2)}(${nx(Lin,0)})^2}{8}-\frac{(${nx(eHm,2)}-(${nx(eHe,2)}))(${nx(aH,0)})^2}{6}\right]=${nx(d2,3)}\;\mathrm{in}\;\uparrow`}/>
        </Step>}
        <Step d="Δ_sw — Downward deflection from the girder's own self-weight"
              r="5wL⁴/384EI"
              note="The bare girder sags under its own weight w_sw the moment it is lifted off the bed. Gross section I_g, release-age modulus E_ci. Acts opposite to (reduces) the prestress camber.">
          <ML s={Tx`\Delta_{sw}=\frac{5w_{sw}L^4}{384E_{ci}I_g}=\frac{5(${nx(R.wG/12,4)})(${nx(Lin,0)})^4}{384(${nx(R.lo.Eci,0)})(${nx(g.I,0)})}=${nx(c.dSW,3)}\;\mathrm{in}\;\downarrow`}/>
        </Step>
        <Step d="Δ_dk — Downward deflection when the wet deck + haunch is poured (DC1)"
              r="5wL⁴/384EI"
              note="This is the deflection caused by the weight of the fresh deck slab and haunch (load w_Dk), carried by the BARE girder before the concrete cures — so it uses the girder gross section I_g (not composite) with the matured-girder modulus E_c. This is the load that drops the beam at deck-pour time.">
          <ML s={Tx`\Delta_{dk}=\frac{5\,w_{Dk}L^4}{384E_{c}I_g}=\frac{5(${nx(R.wDk/12,4)})(${nx(Lin,0)})^4}{384(${nx(cp.Ecg,0)})(${nx(g.I,0)})}=${nx(c.dDK,3)}\;\mathrm{in}\;\downarrow`}/>
        </Step>
        <Step d="Δ_sd — Downward deflection from barrier + wearing surface (DC2 + DW)"
              r="5wL⁴/384EI"
              note="Superimposed dead load (parapets, future wearing surface) applied AFTER the deck has cured, so it is carried by the COMPOSITE section: composite inertia I_c with the final modulus E_c. Occurs after deck placement, so it does not affect the haunch/screed camber.">
          <ML s={Tx`\Delta_{sd}=\frac{5\,(w_{bar}+w_{DW})L^4}{384E_{c}I_c}=\frac{5(${nx((R.wBar+R.wDW)/12,4)})(${nx(Lin,0)})^4}{384(${nx(cp.Ecg,0)})(${nx(cp.Ic,0)})}=${nx(c.dSD,3)}\;\mathrm{in}\;\downarrow`}/>
        </Step>
        {c.dDia>1e-4&&<Step d="Δ_diaph — Downward deflection from diaphragm point loads (DC1)"
              r="P·a(3L²−4a²)/48EI"
              note="Discrete diaphragm/intermediate point loads deflect the bare girder. Each load P at distance a from the bearing; bare-girder section I_g. Included with the deck loads in the haunch and beam-seat camber.">
          <ML s={Tx`\Delta_{dia}=\sum\frac{P\,a\,(3L^2-4a^2)}{48E_c I_g}=${nx(c.dDia,3)}\;\mathrm{in}\;\downarrow`}/>
        </Step>}
        <Step d="Δ_rel — Net camber at release (transfer), no aging"
              r="1.0 / 1.0 multipliers"
              note="Immediately after the strands are cut, only prestress and self-weight act, both at their instantaneous (1.0) values. Δ_ps = Δ_ps,s + Δ_ps,h.">
          <ML s={Tx`\Delta_{rel}=\Delta_{ps}-\Delta_{sw}=${nx(c.dPS,3)}-${nx(c.dSW,3)}=${nx(c.rel,2)}\;\mathrm{in}\;\uparrow`}/>
        </Step>
        <Step d="Δ_erect — Net camber at erection (used for BEAM-SEAT elevations)"
              r={`PCI mult. ${m.psE} / ${m.swE}`}
              note={`The girder has aged from casting to erection, so prestress and self-weight are amplified by their PCI erection multipliers (${m.psE} and ${m.swE}). This is the shape of the beam when it is set on the bearings, before any deck — set seat elevations from this value.`}>
          <ML s={Tx`\Delta_{erect}=${nx(m.psE,2)}\,\Delta_{ps}-${nx(m.swE,2)}\,\Delta_{sw}=${nx(m.psE,2)}(${nx(c.dPS,3)})-${nx(m.swE,2)}(${nx(c.dSW,3)})=${nx(c.erect,2)}\;\mathrm{in}\;\uparrow`}/>
        </Step>
        <Step d="Δ_deck — Net camber at the instant of deck placement (used for HAUNCH & SCREED)"
              r={`PCI ${m.psE}/${m.swE} on PS & SW · 1.0 on deck`}
              note="The critical value for haunch and screed detailing. Prestress and self-weight are at their aged erection values, but the wet deck weight (Δ_dk) deflects the beam at a 1.0 factor because that concrete has not yet aged. The deck is screeded to final grade on top of the girder sitting at this camber, so the haunch build-up makes up the difference.">
          <ML s={Tx`\Delta_{deck}=\underbrace{${nx(m.psE,2)}\Delta_{ps}-${nx(m.swE,2)}\Delta_{sw}}_{\Delta_{erect}\;=\;${nx(c.erect,2)}}-\underbrace{(1.0)(\Delta_{dk}${c.dDia>1e-4?'+\\Delta_{dia}':''})}_{${nx(c.dDK+c.dDia,3)}}=${nx(c.afterDeck,2)}\;\mathrm{in}\;${c.afterDeck>=0?'\\uparrow':'\\downarrow'}`}/>
        </Step>
        <Step d="Δ_seat — Net camber for BEAM-SEAT elevations (all dead load, locked-in 1.0)"
              r="MassDOT 3.5.6.3 / seat note"
              note="Per the MassDOT bridge-seat method: erection multipliers on prestress and self-weight, then ALL dead load applied after the girder is set — wet deck + haunch, diaphragms, AND superimposed dead load (barrier + wearing surface) — subtracted at a 1.0 'locked-in' elastic factor. Long-term creep, shrinkage, and live load are ignored for seat calculations. This is the camber that sets the bearing-seat elevation; it differs from Δ_deck by also removing the SIDL deflection.">
          <ML s={Tx`\Delta_{seat}=\Delta_{deck}-(1.0)\Delta_{sd}=${nx(c.afterDeck,2)}-(1.0)(${nx(c.dSD,3)})=${nx(c.seat,2)}\;\mathrm{in}\;${c.seat>=0?'\\uparrow':'\\downarrow'}`}/>
        </Step>
        <Step d="Δ_final — Net long-term camber (used for serviceability & appearance)"
              r={`PCI final mult. ${m.psF}/${m.swF}/${m.dkF}/${m.sdF}`}
              note="The end-of-life shape, with each component at its final PCI multiplier and the superimposed dead load (Δ_sd) now included. This is the residual camber the finished bridge settles to — not used for haunch/seat detailing, but for ride/appearance and clearance.">
          <ML s={Tx`\Delta_{final}=${nx(m.psF,2)}\Delta_{ps}-${nx(m.swF,2)}\Delta_{sw}-${nx(m.dkF,2)}\Delta_{dk}-${nx(m.sdF,2)}\Delta_{sd}=${nx(c.final,2)}\;\mathrm{in}\;${c.final>=0?'\\uparrow':'\\downarrow'}`}/>
        </Step>
        <Step d="Δ_LL — Live-load deflection check (serviceability)"
              r="LRFD 2.5.2.6.2"
              note="Optional deflection limit: the live load (with impact and distribution) on the composite section, compared against the L/800 span limit. Uses an equivalent-uniform-load approximation.">
          <ML s={Tx`\Delta_{LL}\approx\frac{5M_{LL}L^2}{48E_c I_c}=\frac{5(${nx(R.MLL*12,0)})(${nx(Lin,0)})^2}{48(${nx(cp.Ecg,0)})(${nx(cp.Ic,0)})}=${nx(c.dLL,2)}\le\frac{L}{800}=${nx(c.llLim,2)}\;\mathrm{in}\;${ckLL.pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
      </Deriv>;})()}
    <Card title="Haunch / Screed & Beam-Seat Camber — Tenth Points" refTag="Δ_deck for haunch · Δ_seat for seats">
      <Tbl head={['x (ft)','Shape factor','Erection camber (in)','Δ_deck — haunch (in)','Δ_seat — beam seat (in)','Haunch build-up (in)']}
        rows={R.haunch.map(h=>({c:[fmt(h.x,1),fmt(h.par,3),fmt(h.camErect,3),fmt(h.camDeck,3),fmt(h.camSeat,3),fmt(h.buildup,2)]}))}/>
      <div className="callout">Haunch build-up = nominal haunch + residual <b>Δ_deck</b> camber (deck screeded to grade before SIDL). <b>Beam-seat</b> elevations use the <b>Δ_seat</b> column (all dead load locked-in at 1.0). Both shaped parabolically (factor 4x(L−x)/L², zero at supports, unity at midspan). Verify the minimum haunch at midspan and maximum at supports against fabricator tolerance.</div>
    </Card>
  </div>);
}

function HandlingTab({inp,R}){
  if(!R.handling)return <div className="callout">Enable the Handling module on the Inputs tab.</div>;
  const H=R.handling, g=R.g, m=inp.mat, ck=R.checks;
  const liftCk=ck.find(c=>c.n==='Lifting stress'), fsL=ck.find(c=>c.n==='Lifting FS (crack)'),
        fsH=ck.find(c=>c.n==='Hauling FS (crack)');
  const stTbl=(s,title)=>(<Card title={title} refTag={`pick @ ${fmt(s.a,1)} ft · clear span ${fmt(s.Ls,1)} ft`}>
    <KV rows={[
      ['M at support (hog)',fmt(s.Msup,0),'k-ft'],['M at midspan (sag)',fmt(s.Mmid,0),'k-ft'],
      ['Midspan top / bottom',`${fmt(s.fMidTop,3)} / ${fmt(s.fMidBot,3)}`,'ksi'],
      ['Support top / bottom',`${fmt(s.fSupTop,3)} / ${fmt(s.fSupBot,3)}`,'ksi'],
      ['Limit comp / tension',`${fmt(H.limC,2)} / −${fmt(H.limT,3)}`,'ksi']]}/>
  </Card>);
  return(<div>
    <div className="bigres">
      <div className={'br '+(liftCk.pass?'p':'f')}><div className="l">Lift tension</div><div className="n">{fmt(liftCk.v,3)}</div><div className="u">vs {fmt(H.limT,3)} ksi</div></div>
      <div className={'br '+(fsL.pass?'p':'f')}><div className="l">FS crack — lifting</div><div className="n">{fmt(H.FScrLift,2)}</div><div className="u">≥ 1.0 req</div></div>
      <div className={'br '+(fsH.pass?'p':'f')}><div className="l">FS crack — hauling</div><div className="n">{fmt(H.FScrHaul,2)}</div><div className="u">≥ 1.0 req</div></div>
      <div className="br"><div className="l">Weak-axis I_y (approx)</div><div className="n">{fmt(H.Iy,0)}</div><div className="u">in⁴</div></div>
    </div>
    <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
      {stTbl(H.lift,'Lifting — Overhang Stresses')}
      {stTbl(H.haul,'Hauling — Overhang Stresses')}
    </div>
    <Deriv title="Derivation — Lateral Stability (Mast)" refTag="PCI Bridge Design Manual">
      <VarTable rows={[
        ['a_lift','Lifting-point distance from end',H.aLift,'ft'],
        ['a_haul','Hauling-support distance from end',H.aHaul,'ft'],
        ['I_y','Weak-axis moment of inertia',H.Iy,'in⁴'],
        ['z_o','Theoretical lateral CG deflection',H.zo,'in'],
        ['e_i','Initial lateral eccentricity (sweep)',H.ei,'in'],
        ['y_r','Height of roll axis above CG',g.yt,'in'],
        ['FS_cr,lift','Cracking FS — lifting',H.FScrLift,'—'],
        ['FS_cr,haul','Cracking FS — hauling',H.FScrHaul,'—'],
        ['θ_max','Max tilt angle (hauling)',H.thetaMax!=null?H.thetaMax:'—','rad'],
      ]}/>
      <Step d="Theoretical lateral deflection of CG (lifting)">
        <ML s={Tx`z_o=\frac{w}{E_{ci}I_y}\left[\frac{l^5}{120}-\frac{a^2l^3}{12}+\frac{a^4l}{4}+\frac{3a^5}{20}\right]\frac{1}{l+2a}=${nx(H.zo,3)}\;\mathrm{in}\quad(I_y=${nx(H.Iy,0)}\;\mathrm{in^4})`}/>
      </Step>
      <Step d="Factor of safety against cracking" r="lift above CG, sweep e_i">
        <ML s={Tx`FS_{crack}=\frac{y_{r}}{z_o+e_i}=\frac{${nx(g.yt,1)}}{${nx(H.zo,3)}+${nx(H.ei,2)}}=${nx(H.FScrLift,2)}\;${fsL.pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
      <Step d="Hauling — superelevation θ_i, roll-center height">
        <ML s={Tx`z_{o,h}=${nx(H.zoH,3)}\;\mathrm{in}\qquad FS_{crack,haul}=\frac{y_{r,h}}{z_{o,h}+e_i+y_{r,h}\theta_i}=${nx(H.FScrHaul,2)}\;${fsH.pass?'\\checkmark':'\\text{N.G.}'}`}/>
      </Step>
    </Deriv>
    <div className="callout">Simplified Mast formulation: factors of safety against cracking only (not the separate FS against rollover/failure). Weak-axis inertia is approximated from the section outline. For long-span or unusually slender girders, confirm with the full PCI stability procedure and the hauler's specific roll stiffness and bunk geometry.</div>
  </div>);
}

function DeckTab({inp,R}){
  if(!R.deck)return <div className="callout">Enable the Deck Design module on the Inputs tab.</div>;
  const D=R.deck, m=inp.mat, ck=R.checks;
  const pos=ck.find(c=>c.n==='Deck +M'), neg=ck.find(c=>c.n==='Deck −M'), oh=ck.find(c=>c.n==='Deck overhang');
  const capRow=(c,Mu,title,ref)=>(<Card title={title} refTag={ref}>
    <KV rows={[
      ['A_s provided',fmt(c.As,3),'in²/ft'],['Effective depth d',fmt(c.dEff,2),'in'],
      ['a / c',`${fmt(c.a,2)} / ${fmt(c.c,2)}`,'in'],['φ',fmt(c.phi,2),''],
      ['M_u',fmt(Mu,2),'k-ft/ft'],['φM_n',fmt(c.phiMn,2),'k-ft/ft'],
      ['M_u / φM_n',fmt(c.dc,2),c.ok?'PASS':'FAIL']]}/>
  </Card>);
  return(<div>
    <div className="bigres">
      <div className={'br '+(pos.pass?'p':'f')}><div className="l">Deck +M (bottom)</div><div className="n">{fmt(pos.r,2)}</div><div className="u">{fmt(D.Mu_pos,2)} / {fmt(D.pos.phiMn,2)}</div></div>
      <div className={'br '+(neg.pass?'p':'f')}><div className="l">Deck −M (top)</div><div className="n">{fmt(neg.r,2)}</div><div className="u">{fmt(D.Mu_neg,2)} / {fmt(D.neg.phiMn,2)}</div></div>
      <div className={'br '+(oh.pass?'p':'f')}><div className="l">Overhang</div><div className="n">{fmt(oh.r,2)}</div><div className="u">{fmt(D.Mu_oh,2)} / {fmt(D.ohCap.phiMn,2)}</div></div>
      <div className="br"><div className="l">Distribution reinf.</div><div className="n">{fmt(D.distPct,0)}%</div><div className="u">of +A_s (9.7.3.2)</div></div>
    </div>
    <Deriv title="Derivation — Transverse Deck Moments (Equivalent Strip)" refTag="LRFD 4.6.2.1">
      <VarTable rows={[
        ['S','Girder spacing',+inp.S,'ft'],
        ['t_s','Deck thickness',+inp.ts,'in'],
        ['oh','Overhang length',+inp.deck.oh,'ft'],
        ['x','−M design section from girder CL',D.xneg,'in'],
        ['M_DC,+','Slab dead-load positive moment',D.MDC_pos,'k-ft/ft'],
        ['M_DW,+','Wearing-surface positive moment',D.MDW_pos,'k-ft/ft'],
        ['M_LL,+','Table A4-1 positive moment (incl. MPF + IM)',D.MLL_pos,'k-ft/ft'],
        ['M_LL,−','Table A4-1 negative moment at x (incl. MPF + IM)',D.MLL_neg,'k-ft/ft'],
        ['M_u,+','Factored positive moment',D.Mu_pos,'k-ft/ft'],
        ['M_u,−','Factored negative moment',D.Mu_neg,'k-ft/ft'],
        ['φM_n,+','Positive-moment capacity',D.pos.phiMn,'k-ft/ft'],
        ['φM_n,−','Negative-moment capacity',D.neg.phiMn,'k-ft/ft'],
      ]}/>
      <Step d="Dead-load moments (continuous slab ~ wS²/10–11), DC and DW kept separate">
        <ML s={Tx`M_{DC,+}=\frac{w_{slab}S^2}{11}=\frac{(${nx(D.wDLslab,3)})(${nx(inp.S,2)})^2}{11}=${nx(D.MDC_pos,2)}\qquad M_{DW,+}=${nx(D.MDW_pos,2)}\;\mathrm{k\text{-}ft/ft}`}/>
        <ML s={Tx`M_{DC,-}=${nx(D.MDC_neg,2)}\qquad M_{DW,-}=${nx(D.MDW_neg,2)}\;\mathrm{k\text{-}ft/ft}\quad(w_{slab}=${nx(D.wDLslab,3)},\,w_{ws}=${nx(D.wDLws,3)}\;\mathrm{ksf})`}/>
      </Step>
      <Step d={'Negative-moment design section \u2014 '+D.dsRule} r="4.6.2.1.6">
        <ML s={Tx`x=${nx(D.xneg,2)}\;\mathrm{in}\quad\text{from the girder CL}\quad(${D.xnegAuto===false?'entered':'auto'})`}/>
      </Step>
      <Step d="Live load from Table A4-1, interpolated on S and on x" r="LRFD Table A4-1">
        <ML s={Tx`M_{LL+IM,+}=${nx(D.MLL_pos,2)}\qquad M_{LL+IM,-}=${nx(D.MLL_neg,2)}\;\mathrm{k\text{-}ft/ft}\quad(S=${nx(D.A4.Sused,2)}\;\mathrm{ft},\;x=${nx(D.A4.xUsed,1)}\;\mathrm{in})`}/>
        <div className="hint">Table A4-1 is tabulated with the multiple presence factors and the 33% dynamic load allowance already included — no further impact factor is applied here.
          {D.A4.below?' Girder spacing is below the 4 ft lower bound of the table; the 4 ft row is used.':''}
          {D.A4.above?' Girder spacing exceeds the 15 ft upper bound of the table; the 15 ft row is used and a refined analysis is required.':''}</div>
      </Step>
      <Step d="Factored (Strength I: DC 1.25, DW 1.50, LL+IM 1.75)">
        <ML s={Tx`M_{u,+}=1.25(${nx(D.MDC_pos,2)})+1.50(${nx(D.MDW_pos,2)})+1.75(${nx(D.MLL_pos,2)})=${nx(D.Mu_pos,2)}\;\mathrm{k\text{-}ft/ft}`}/>
        <ML s={Tx`M_{u,-}=1.25(${nx(D.MDC_neg,2)})+1.50(${nx(D.MDW_neg,2)})+1.75(${nx(D.MLL_neg,2)})=${nx(D.Mu_neg,2)}\;\mathrm{k\text{-}ft/ft}`}/>
      </Step>
      <Step d="Overhang — wheel 1 ft clear of the railing face, on the 45+10X strip" r="T.4.6.2.1.3-1 / LRFD 13">
        <ML s={Tx`X=oh-\frac{b_{bar}}{12}-1.0=${nx(D.oh,2)}-${nx(D.bBar/12,2)}-1.0=${nx(D.Xoh,2)}\;\mathrm{ft}\qquad SW_{oh}=45.0+10.0X=${nx(D.SWoh,1)}\;\mathrm{in}`}/>
        <ML s={Tx`M_{LL+IM,oh}=\frac{(1.33)(1.20)(16)(${nx(D.Xoh,2)})}{${nx(D.SWoh,1)}/12}=${nx(D.MohLL,2)}\;\mathrm{k\text{-}ft/ft}`}/>
        <ML s={Tx`M_{u,oh}=1.25(${nx(D.MohDC,2)})+1.50(${nx(D.MohDW,2)})+1.75(${nx(Math.max(D.MohLL,0),2)})=${nx(D.Mu_oh,2)}\;\mathrm{k\text{-}ft/ft}`}/>
      </Step>
    </Deriv>
    <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
      {capRow(D.pos,D.Mu_pos,'Positive Moment (Bottom Bars)','LRFD 5.6.3')}
      {capRow(D.neg,D.Mu_neg,'Negative Moment (Top Bars)','LRFD 5.6.3')}
    </div>
    {capRow(D.ohCap,D.Mu_oh,'Overhang (Top Bars)','LRFD 13 / 5.6.3')}
    <div className="callout">Interior-bay live load is taken from <b>AASHTO Table A4-1</b>, interpolated on girder spacing and on the negative-moment design section; the tabulated values already include the multiple presence factors and the 33% dynamic load allowance. Dead load uses simplified continuous-beam moments (wS²/10 and /11) with the slab as DC at 1.25 and the future wearing surface as DW at 1.50. The overhang covers the gravity + barrier case on the 45+10X strip only — the Extreme Event II vehicular-collision design cases (A13.4) still require a barrier-specific analysis. Distribution steel per 9.7.3.2.</div>
  </div>);
}

function RatingTab({inp,R,set,onSendCapacity,capLocked,onToggleCapLock}){
  const rt=R.rating, sv=R.svcRating, shr=R.shrRating;
  const veh=inp.rateVeh||[];
  const setVeh=(arr)=>set(p=>({...p, rateVeh:arr}));
  const addVeh=()=>setVeh([...veh,{name:'',M:0,V:0,W:0}]);
  const editVeh=(i,k,val)=>setVeh(veh.map((r,j)=>j===i?{...r,[k]:val}:r));
  const delVeh=(i)=>setVeh(veh.filter((_,j)=>j!==i));
  return(<div>
    {onSendCapacity&&<div className="callout" style={{marginTop:0,marginBottom:12,borderLeftColor:capLocked?'#ea580c':'var(--blue)',background:capLocked?'#fff7ed':'#EEF4FF',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
      <div style={{flex:'1 1 340px'}}><b>Feed this capacity to the MCT rating.</b> Publishes φM<sub>n</sub>⁺ (with strand development), the pier −φM<sub>n</sub>, and φV<sub>n</sub> (MCFT, trial stirrups) at <b>every station across all spans</b> of the member, so the MCT app can rate any vehicle against the real section-by-section resistance.</div>
      {BLU.LockBtn
        ? <BLU.LockBtn ch="capacity" always
            label={capLocked?'Auto-sending capacity to MCT':'Send capacity to MCT Rating \u21c4'}
            onClick={(st,locked)=>{ if(locked) onToggleCapLock(false); else onSendCapacity(); }}/>
        : <button className="btn pri" onClick={onSendCapacity}>Send capacity to MCT Rating ⇄</button>}
      {BLU.LockToggle&&<BLU.LockToggle ch="capacity" onToggle={onToggleCapLock}/>}
      {capLocked&&<div style={{flexBasis:'100%',fontSize:'11.5px',color:'#9a3412',lineHeight:1.5}}>
        Every recompute republishes this envelope and the MCT rating adopts it automatically. Unlock to go back to one-shot sends.</div>}
    </div>}
    <div className="bigres">
      <div className={'br '+(rt.okInv?'p':'f')}><div className="l">Flexure Inv RF</div><div className="n">{fmt(rt.RFinv,2)}</div><div className="u">≈ {fmt(rt.RTinv,0)} tons · opr {fmt(rt.RFopr,2)}</div></div>
      <div className={'br '+(shr.okInv?'p':'f')}><div className="l">Shear Inv RF</div><div className="n">{fmt(shr.RFinv,2)}</div><div className="u">≈ {fmt(shr.RTinv,0)} tons · opr {fmt(shr.RFopr,2)}</div></div>
      <div className={'br '+(sv.ok?'p':'f')}><div className="l">Service III RF</div><div className="n">{sv.RF>=99?'—':fmt(sv.RF,2)}</div><div className="u">{sv.RF>=99?'no LL tension':'≈ '+fmt(sv.RT,0)+' tons'}</div></div>
      <div className="br"><div className="l">Governing RF</div><div className="n">{fmt(Math.min(rt.RFinv,shr.RFinv,sv.RF>=99?99:sv.RF),2)}</div><div className="u">min of all limit states</div></div>
    </div>
    <Deriv title="Load Rating — Flexure at Midspan (LRFR)" refTag="MBE 6A.4 · Strength I">
      <VarTable rows={[
        ['φM_n','Factored flexural resistance',rt.Rn,'k-ft'],
        ['M_DC','Dead-load moment (DC)',rt.MDC,'k-ft'],
        ['M_DW','Wearing-surface moment (DW)',rt.MDW,'k-ft'],
        ['M_LL+IM','Live-load moment (HL-93 + impact)',rt.MLL,'k-ft'],
        ['γ_DC','DC load factor',rt.gDC!=null?rt.gDC:1.25,'—'],
        ['γ_DW','DW load factor',rt.gDW!=null?rt.gDW:1.50,'—'],
        ['RF_inv','Inventory rating factor',rt.RFinv,'—'],
        ['RF_opr','Operating rating factor',rt.RFopr,'—'],
      ]}/>
      <Step d="General rating equation">
        <ML s={Tx`RF=\frac{\phi_c\phi_s\phi\,R_n-\gamma_{DC}M_{DC}-\gamma_{DW}M_{DW}}{\gamma_{LL}\,M_{LL+IM}}`}/>
      </Step>
      <Step d="Demands (midspan, per girder)">
        <ML s={Tx`M_{DC}=${nx(rt.MDC,0)}\quad M_{DW}=${nx(rt.MDW,0)}\quad M_{LL+IM}=${nx(rt.MLL,0)}\;\mathrm{k\text{-}ft}\quad \phi M_n=${nx(rt.Rn,0)}\;\mathrm{k\text{-}ft}`}/>
      </Step>
      <Step d="Inventory (γ_LL = 1.75)">
        <ML s={Tx`RF_{inv}=\frac{${nx(rt.Rn,0)}-1.25(${nx(rt.MDC,0)})-1.50(${nx(rt.MDW,0)})}{1.75(${nx(rt.MLL,0)})}=${nx(rt.RFinv,2)}\;${rt.okInv?'\\checkmark':'\\text{< 1.0}'}`}/>
      </Step>
      <Step d="Operating (γ_LL = 1.35)">
        <ML s={Tx`RF_{opr}=\frac{${nx(rt.Rn,0)}-1.25(${nx(rt.MDC,0)})-1.50(${nx(rt.MDW,0)})}{1.35(${nx(rt.MLL,0)})}=${nx(rt.RFopr,2)}\;${rt.okOpr?'\\checkmark':'\\text{< 1.0}'}`}/>
      </Step>
    </Deriv>
    <div className="callout">LRFR flexural rating at midspan for the HL-93 design load (MBE 6A.4), using the same φM_n the strength check produces and condition/system factors taken as 1.0. Tonnage assumes the 36-ton HL-93 reference. This rates the controlling positive-moment section only; a full rating also covers shear, the negative-moment region (if continuous), and legal/permit vehicles. Use it for preliminary capacity screening, not as a substitute for a complete load-rating report.</div>

    <Deriv title="Load Rating — Shear at Governing Section (LRFR)" refTag="MBE 6A.5.6 · Strength I">
      <VarTable rows={[
        ['x','Governing shear section',shr.x,'ft'],
        ['φV_n','Factored shear resistance (MCFT)',shr.phiVn,'kip'],
        ['V_DC','Dead-load shear (DC)',shr.VDC,'kip'],
        ['V_DW','Wearing-surface shear (DW)',shr.VDW,'kip'],
        ['V_LL+IM','Live-load shear (HL-93 + impact)',shr.VLL,'kip'],
        ['RF_inv','Inventory rating factor',shr.RFinv,'—'],
        ['RF_opr','Operating rating factor',shr.RFopr,'—'],
      ]}/>
      <Step d="Rating equation" note="Shear rating at the section where V_u/φV_n is greatest (excluding the bearing face). φV_n is the same general-procedure (MCFT) capacity the shear design uses. Condition/system factors taken as 1.0.">
        <ML s={Tx`RF=\frac{\phi V_n-\gamma_{DC}V_{DC}-\gamma_{DW}V_{DW}}{\gamma_{LL}\,V_{LL+IM}}`}/>
      </Step>
      <Step d={`Component shears @ x = ${fmt(shr.x,1)} ft (per girder)`}>
        <ML s={Tx`\phi V_n=${nx(shr.phiVn,0)}\quad V_{DC}=${nx(shr.VDC,0)}\quad V_{DW}=${nx(shr.VDW,0)}\quad V_{LL+IM}=${nx(shr.VLL,0)}\;\mathrm{kip}`}/>
      </Step>
      <Step d="Inventory (γ_LL = 1.75) & Operating (γ_LL = 1.35)">
        <ML s={Tx`RF_{inv}=\frac{${nx(shr.phiVn,0)}-1.25(${nx(shr.VDC,0)})-1.50(${nx(shr.VDW,0)})}{1.75(${nx(shr.VLL,0)})}=${nx(shr.RFinv,2)}\;${shr.okInv?'\\checkmark':'\\text{< 1.0}'}\qquad RF_{opr}=${nx(shr.RFopr,2)}`}/>
      </Step>
    </Deriv>
    <div className="callout">Shear rating (MBE 6A.5.6) at the governing shear section. For prestressed girders shear can control the operating rating even when flexure is comfortable, so it is reported alongside flexure. Uses the same MCFT φV_n as the design check; a complete rating also covers the negative-moment/pier region and legal/permit vehicles.</div>

    <Deriv title="Load Rating — Service III Tension (Prestressed Concrete)" refTag="MBE 6A.5.4.1">
      <VarTable rows={[
        ['x','Governing bottom-tension section',sv.x,'ft'],
        ['f_ps','Prestress compression @ bottom fiber',sv.fPS,'ksi'],
        ['f_DC','Bottom tension from DC loads',sv.fDC,'ksi'],
        ['f_DW','Bottom tension from DW (wearing)',sv.fDW,'ksi'],
        ['f_LL','Bottom tension from LL+IM (unfactored)',sv.fLL,'ksi'],
        ['f_r','Allowable Service III tension',sv.fr,'ksi'],
        ['γ_LL','Service III live-load factor',sv.gLL,'—'],
        ['RF','Service III rating factor',sv.RF>=99?0:sv.RF,'—'],
      ]}/>
      <Step d="Rating equation (tension limit state)"
            note="For prestressed concrete the MBE requires a Service III rating: the bottom-fiber tension under (permanent + γLL·live) must not exceed the allowable f_r. Rearranged into RF form, the prestress compression and permanent-load tensions form the available capacity for live-load tension. γDC = γDW = 1.0, γLL = 0.8 (MBE Table 6A.4.2.2-1).">
        <ML s={Tx`RF=\frac{f_r+f_{ps}-\gamma_{DC}f_{DC}-\gamma_{DW}f_{DW}}{\gamma_{LL}\,f_{LL}}`}/>
      </Step>
      <Step d={`Bottom-fiber stress components @ x = ${fmt(sv.x,1)} ft (+ = compression)`}>
        <ML s={Tx`f_{ps}=\frac{P_e}{A_g}+\frac{P_e e}{S_b}=${nx(sv.fPS,3)}\quad f_{DC}=${nx(sv.fDC,3)}\quad f_{DW}=${nx(sv.fDW,3)}\quad f_{LL}=${nx(sv.fLL,3)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Allowable tension & rating">
        <ML s={Tx`f_r=${nx(sv.fr,3)}\;\mathrm{ksi}\qquad RF=\frac{${nx(sv.fr,3)}+${nx(sv.fPS,3)}-${nx(sv.fDC,3)}-${nx(sv.fDW,3)}}{0.8(${nx(sv.fLL,3)})}=${sv.RF>=99?'\\infty':nx(sv.RF,2)}\;${sv.ok?'\\checkmark':'\\text{< 1.0}'}`}/>
        <div style={{fontSize:11.5,color:'var(--ink2)',marginTop:2}}>Allowable tension f_r = {inp.opt.corrosion==='severe'?'0.0948√f′c (severe corrosion)':'0.19√f′c ≤ 0.6 ksi (moderate corrosion)'}.</div>
      </Step>
    </Deriv>
    <div className="callout">Service III load rating (MBE 6A.5.4.1) at the governing bottom-tension section — <b>mandatory for prestressed members</b>, and frequently the controlling rating for pretensioned girders even when the strength rating is high. The prestress compression and permanent-load tensions set the capacity available to resist live-load-induced tension; the RF is how many times the HL-93 live-load tension the section can carry before reaching the allowable {inp.opt.corrosion==='severe'?'0.0948√f′c':'0.19√f′c ≤ 0.6 ksi'} limit. {sv.RF>=99?'The section is in net compression under full Service III load, so live load never governs tension here (RF not applicable).':''} Uses f_pe without elastic gains (consistent with γLL = 0.8). Screening tool — not a substitute for a complete rating report.</div>

    <Card title="Legal / Permit Vehicle Rating — User-Entered Forces" refTag="MBE 6A.4.4 / 6A.4.5 · Strength I">
      <div className="callout">Enter the <b>fully-factored</b> live-load moment and shear per vehicle — i.e. with the distribution factor, dynamic load allowance (impact), multiple-presence factor, <b>and</b> the LRFR live-load factor already applied (from your own analysis). The app supplies the resistance side (φM_n at midspan, φV_n at the governing shear section) and the factored dead loads, and reports RF = (φR − 1.25 DC − 1.50 DW) / (your factored LL) for flexure and shear, governed by the lower. Gross weight (tons) is optional and only used to convert RF to a rated tonnage.</div>
      <div className="scrollx"><table className="eng" style={{width:'100%'}}>
        <thead><tr><th style={{textAlign:'left'}}>Vehicle</th><th>Factored M (k-ft)</th><th>Factored V (kip)</th><th>Weight (ton)</th><th>RF flex</th><th>RF shear</th><th>RF gov</th><th>Rated (ton)</th><th>Status</th><th></th></tr></thead>
        <tbody>
          {veh.length===0 && <tr><td colSpan={10} style={{textAlign:'center',color:'var(--ink2)',padding:'10px'}}>No vehicles entered. Add a legal truck (Type 3, 3S2, 3-3) or a permit vehicle below.</td></tr>}
          {veh.map((v,i)=>{ const rr=R.vehRatings[i]||{}; return <tr key={i}>
            <td style={{textAlign:'left'}}><input value={v.name} placeholder="e.g. Type 3S2" onChange={e=>editVeh(i,'name',e.target.value)} style={{width:110,font:'inherit',border:'1px solid var(--line)',borderRadius:3,padding:'2px 5px'}}/></td>
            <td><input type="number" value={v.M} onChange={e=>editVeh(i,'M',e.target.value===''?'':+e.target.value)} style={{width:80,font:'inherit',textAlign:'right',border:'1px solid var(--line)',borderRadius:3,padding:'2px 4px'}}/></td>
            <td><input type="number" value={v.V} onChange={e=>editVeh(i,'V',e.target.value===''?'':+e.target.value)} style={{width:70,font:'inherit',textAlign:'right',border:'1px solid var(--line)',borderRadius:3,padding:'2px 4px'}}/></td>
            <td><input type="number" value={v.W} onChange={e=>editVeh(i,'W',e.target.value===''?'':+e.target.value)} style={{width:60,font:'inherit',textAlign:'right',border:'1px solid var(--line)',borderRadius:3,padding:'2px 4px'}}/></td>
            <td>{rr.RFm>=99?'—':fmt(rr.RFm,2)}</td>
            <td>{rr.RFv>=99?'—':fmt(rr.RFv,2)}</td>
            <td className={rr.ok?'ok':'no'} style={{fontWeight:700}}>{rr.RF>=99?'—':fmt(rr.RF,2)}</td>
            <td>{rr.RT!=null&&rr.RF<99?fmt(rr.RT,1):'—'}</td>
            <td className={rr.ok?'ok':'no'} style={{fontWeight:600}}>{rr.RF>=99?'—':(rr.ok?'PASS':'< 1.0')} {rr.RF<99&&<span style={{fontWeight:400,color:'var(--ink2)'}}>({rr.gov})</span>}</td>
            <td><button className="btn sm ghost" onClick={()=>delVeh(i)} style={{color:'var(--fail)',padding:'2px 6px'}}>✕</button></td>
          </tr>; })}
        </tbody>
      </table></div>
      <button className="btn sm" onClick={addVeh} style={{marginTop:8}}>+ Add vehicle</button>
      <div className="callout" style={{marginTop:8}}>Capacity used: φM_n = <b>{fmt(rt.Rn,0)} k-ft</b> (midspan), φV_n = <b>{fmt(shr.phiVn,0)} kip</b> (@ x = {fmt(shr.x,1)} ft). Factored dead load: M_DC = {fmt(rt.MDC,0)}, M_DW = {fmt(rt.MDW,0)} k-ft · V_DC = {fmt(shr.VDC,0)}, V_DW = {fmt(shr.VDW,0)} kip. Because you supply the factored LL, the live-load factor is <b>yours</b> — set it per the MBE for the legal load level and ADTT (e.g. 1.45–1.80 for legal loads) or the permit type. This rates the controlling positive-moment and shear sections only.</div>
    </Card>
  </div>);
}

function DiagramsTab({inp,R,set}){
  const d=R.diagrams,L=R.L;
  const xs=d.map(r=>r.x);
  // ── Span selector for imported (multi-span) demands: view any span or the whole beam ──
  const ext=inp.external;
  const extActive=ext&&ext._schema==='psbeam-external-demands'&&Array.isArray(ext.stations)&&ext.stations.length>0;
  const allSpans=extActive?externalSpans(ext):[];
  const memberLen=extActive?((ext.member&&ext.member.totalLength)||Math.max(...ext.stations.map(s=>+s.x||0))):L;
  const multiSpan=allSpans.length>1;
  const savedUI=(typeof loadUI==='function')?loadUI():{};
  const [spanView,setSpanView]=useState(()=>savedUI.diagSpanView||'design');
  useEffect(()=>{ saveUI({diagSpanView:spanView}); },[spanView]);
  const vr=spanView==='all'?{x0:0,x1:memberLen,label:'Entire beam'}

  const designThisSpan=sp=>{ if(set){ set({...inp, external:{...ext,_selSpan:sp}, L:sp.len}); } setSpanView('design'); };
  const viewRows=(x0,x1)=>ext.stations.filter(s=>(+s.x)>=x0-1e-6&&(+s.x)<=x1+1e-6).sort((a,b)=>a.x-b.x).map(s=>{
    const a=k=>+s[k]||0; const mDC1=a('M_DC1'),mDC2=a('M_DC2'),mDW=a('M_DW'),mLp=a('M_LLpos'),mLn=a('M_LLneg');
    const vDC1=a('V_DC1'),vDC2=a('V_DC2'),vDW=a('V_DW'),vLp=a('V_LLpos'),vLn=a('V_LLneg');
    return {x:+s.x,M_DC1:mDC1,M_DC2:mDC2,M_DW:mDW,M_LLpos:mLp,M_LLneg:mLn,
      M_StrI_pos:1.25*(mDC1+mDC2)+1.5*mDW+1.75*mLp,M_StrI_neg:1.25*(mDC1+mDC2)+1.5*mDW+1.75*mLn,
      V_DC1:vDC1,V_DC2:vDC2,V_DW:vDW,V_LLpos:vLp,V_LLneg:vLn,
      V_StrI_pos:1.25*(vDC1+vDC2)+1.5*vDW+1.75*vLp,V_StrI_neg:1.25*(vDC1+vDC2)+1.5*vDW+1.75*vLn};});
  const Mk=[['M_DC1','DC1 (non-comp)','#0E7490'],['M_DC2','DC2 (SIDL)','#0891B2','dot'],['M_DW','DW','#B45309','dot'],['M_LLpos','LL+ env','#1C4FC4'],['M_LLneg','LL− env','#7C3AED'],['M_StrI_pos','Strength I (+)','#B3261E'],['M_StrI_neg','Strength I (−)','#DC2626','dash']];
  const Vk=[['V_DC1','DC1','#0E7490'],['V_DC2','DC2','#0891B2','dot'],['V_DW','DW','#B45309','dot'],['V_LLpos','LL+ env','#1C4FC4'],['V_LLneg','LL− env','#7C3AED'],['V_StrI_pos','Strength I (+)','#B3261E'],['V_StrI_neg','Strength I (−)','#DC2626','dash']];
  const viewData=(rows,keys)=>keys.map(([k,l,c,dash])=>({x:rows.map(r=>r.x),y:rows.map(r=>r[k]||0),name:l,line:{color:c,width:dash?1.6:2.2,...(dash?{dash}:{})}}));
  // series catalogs: key -> {label, color, dash, group}
  const Mseries=[
    ['M_g',        'Girder self-wt',  '#9CA3AF',null],
    ['M_DC1',      'DC1 (non-comp)',  '#0E7490',null],
    ['M_DC2',      'DC2 (comp SIDL)', '#0891B2','dot'],
    ['M_DW',       'DW (wearing)',    '#B45309','dot'],
    ['M_DC',       'ΣDC',             '#15803D','dash'],
    ['M_LLpos',    'LL+ (×DF×IM, env)',  '#1C4FC4',null],
    ['M_LLneg',    'LL− (×DF×IM, env)',  '#7C3AED',null],
    ['M_StrI_pos', 'Strength I (+)',  '#B3261E',null],
    ['M_StrI_neg', 'Strength I (−)',  '#DC2626','dash'],
    ['M_SrvI_pos', 'Service I (+)',   '#16212E',null],
    ['M_SrvIII_pos','Service III (+)','#0F766E','dash'],
  ];
  const Vseries=[
    ['V_g',        'Girder self-wt',  '#9CA3AF',null],
    ['V_DC1',      'DC1 (non-comp)',  '#0E7490',null],
    ['V_DC2',      'DC2 (comp SIDL)', '#0891B2','dot'],
    ['V_DW',       'DW (wearing)',    '#B45309','dot'],
    ['V_DC',       'ΣDC',             '#15803D','dash'],
    ['V_LLpos',    'LL+ (×DF×IM, env)',  '#1C4FC4',null],
    ['V_LLneg',    'LL− (×DF×IM, env)',  '#7C3AED',null],
    ['V_StrI_pos', 'Strength I (+)',  '#B3261E',null],
    ['V_StrI_neg', 'Strength I (−)',  '#DC2626','dash'],
    ['V_SrvI_pos', 'Service I (+)',   '#16212E',null],
  ];
  const dflt=k=>['M_DC','M_LLpos','M_LLneg','M_StrI_pos','V_DC','V_LLpos','V_LLneg','V_StrI_pos'].includes(k);
  // Merge any saved choices over the defaults so unknown/removed series can't poison

  const togM=k=>setOnM(s=>({...s,[k]:!s[k]}));

        <option value="design">Design span — Span {R.ext.sel.idx} ({fmt(R.ext.spanLen,0)} ft)</option>
        {allSpans.map(sp=><option key={sp.idx} value={'s'+sp.idx}>Span {sp.idx} ({fmt(sp.x0,0)}–{fmt(sp.x1,0)} ft){R.ext.sel.idx===sp.idx?' • current':''}</option>)}

      </select>
      {vr&&vr.sp&&R.ext.sel.idx!==vr.sp.idx&&<button className="btn sm" onClick={()=>designThisSpan(vr.sp)}>Design Span {vr.sp.idx} →</button>}

    {spanView!=='design'&&vr? (()=>{ const rows=viewRows(vr.x0,vr.x1);
      return <React.Fragment>
        <Card title={'Moment Diagram — '+vr.label} refTag="imported demands · k-ft (excl. computed girder self-wt)">
          <Fig data={viewData(rows,Mk)} layout={{xaxis:{title:'x (ft, member)'},yaxis:{title:'moment (k-ft)'},height:420}} h={420}/></Card>
        <Card title={'Shear Diagram — '+vr.label} refTag="imported demands · kip">
          <Fig data={viewData(rows,Vk)} layout={{xaxis:{title:'x (ft, member)'},yaxis:{title:'shear (kip)'},height:420}} h={420}/></Card>
        <div className="callout">Strength I = 1.25(DC1+DC2)+1.50 DW+1.75 LL from the imported per-station envelope over {vr.label.toLowerCase()} (member coordinates). The app-computed girder self-weight is added only on the design span, so it is omitted from this view. Switch back to <b>Design span</b> for the full design diagrams, or use <b>Design Span n</b> to move the analysis there.</div>
      </React.Fragment>; })()
    :<React.Fragment>
    {R.useExt&&<div className="callout" style={{marginTop:0,marginBottom:12,borderColor:'var(--blue)',background:'#EEF4FF'}}>
      Diagrams reflect the imported MIDAS force effects over Span {R.ext.sel.idx} ({fmt(R.ext.spanLen,0)} ft). DC1/DC2/DW are the unfactored components; LL± are the envelope branches with DF &amp; IM already applied. Girder self-weight is computed and shown separately.</div>}
    <Card title="Moment Diagram" refTag="components & limit-state combinations · k-ft, sagging +">
      <Toggles series={Mseries} on={onM} tog={togM}/>
      <Fig data={mkData(Mseries,onM)} layout={{xaxis:{title:'x (ft)'},yaxis:{title:'moment (k-ft)'},height:420}} h={420}/>
    </Card>
    <Card title="Shear Diagram" refTag="components & limit-state combinations · kip, signed">
      <Toggles series={Vseries} on={onV} tog={togV}/>
      <Fig data={mkData(Vseries,onV)} layout={{xaxis:{title:'x (ft)'},yaxis:{title:'shear (kip)'},height:420}} h={420}/>
    </Card>
    <Card title="Tabulated Force Effects — Tenth Points" refTag="k-ft / kip">
      <Tbl head={['x (ft)','M ΣDC','M DW','M LL+','M LL−','M StrI+','M StrI−','V ΣDC','V LL+','V LL−','V StrI+']}
        rows={d.filter((r,i)=>i% Math.max(1,Math.round(d.length/12))===0 || i===d.length-1).map(r=>({c:[
          fmt(r.x,1),fmt(r.M_DC,0),fmt(r.M_DW,0),fmt(r.M_LLpos,0),fmt(r.M_LLneg,0),fmt(r.M_StrI_pos,0),fmt(r.M_StrI_neg,0),
          fmt(r.V_DC,0),fmt(r.V_LLpos,0),fmt(r.V_LLneg,0),fmt(r.V_StrI_pos,0)]}))}/>
      <div className="callout">Strength I = 1.25 DC + 1.50 DW + 1.75 (LL+IM); Service I = DC + DW + (LL+IM); Service III = DC + DW + {fmt(+inp.opt.gLLs3,2)}(LL+IM). DC includes the computed girder self-weight. The (+)/(−) suffixes pair each combination with the positive- or negative-moment live-load branch. {R.useExt?'Live load already includes DF and impact.':'Built-in live load uses the parabolic moment / linear shear shape from the HL-93 envelope value; for true envelopes import MIDAS demands.'}</div>
    </Card>
    </React.Fragment>}
  </div>);
