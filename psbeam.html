    <div className="callout">Section heat map of the elastic fiber stress for the {st.label.toLowerCase()} stage, blue (tension) through white (zero) to red (compression), with the linear profile drawn alongside. The green dashed line is the neutral axis where σ = 0; strand positions are overlaid (purple = harped). The dashed marker on the profile is the governing limit. Governing station for this stage is x = {fmt(govX[stage],1)} ft ({govStr} ksi).</div>
  </Card>);
}

function StressTab({inp,R}){

  const X=gr.map(r=>r.x);
  const hline=(v,name,color)=>({x:[0,L],y:[v,v],name,line:{color,width:1.4,dash:'dash'},hoverinfo:'name+y'});

      {R.useT&&<div className="callout">Release stresses use the <b>per-section transformed area</b> (n = E_p/E_ci, varying with debond/transfer) with the strand force at f_pbt — elastic shortening is captured implicitly by the transformed section, per common practice. Service stages remain on gross/composite properties with f_pe.</div>}
    </Card>
    <Card title="Service Stresses (Final, After All Losses)" refTag="LRFD 5.9.2.3.2 — Service I / Service III (γLL = {inp.opt.gLLs3})">
      <Fig data={[
        {x:X,y:gr.map(r=>r.s3Bot),name:'bottom · Service III',line:{color:'#C2271D',width:2}},
        {x:X,y:gr.map(r=>r.s1Top),name:'top · perm. loads',line:{color:'#0E7490',width:2}},
        {x:X,y:gr.map(r=>r.s2Top),name:'top · perm.+LL',line:{color:'#1C4FC4',width:2}},
        hline(lim.srvC1,'0.45 f′c','#0E7490'),hline(lim.srvC2,'0.60 f′c','#B3261E'),

        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'stress (ksi, + = compression)'}}}/>
      <div className="callout">Girder fiber stresses. Deck compression (SIDL + LL on composite section): max <b>{fmt((R.checks.find(c=>c.n==='Deck comp')||{}).v,3)} ksi</b> vs 0.60f′c_deck = <b>{fmt(lim.dkC2,3)} ksi</b>. Service III bottom tension uses γLL = {inp.opt.gLLs3} per LRFD Table 3.4.1-4 (0.8 with refined losses, 1.0 legacy).</div>
    </Card>
    <Card title="All Stages — Overlay" refTag="toggle curves">
      <div className="btnrow" style={{marginBottom:6}}>{OVS.map(([k,l])=>
        <button key={k} className={'btn sm'+(ov[k]?'':' ghost')} onClick={()=>setOv({...ov,[k]:!ov[k]})}>{ov[k]?'☑':'☐'} {l}</button>)}</div>
      <Fig h={380} data={[
        ...(ov.rel?[{x:X,y:gr.map(r=>r.relBot),name:'release · bot',line:{color:'#B45309',width:1.8}},
                    {x:X,y:gr.map(r=>r.relTop),name:'release · top',line:{color:'#D97706',width:1.8,dash:'dot'}}]:[]),
        ...(ov.s1?[{x:X,y:gr.map(r=>r.s1Top),name:'srv top · perm',line:{color:'#0E7490',width:1.8}}]:[]),
        ...(ov.s2?[{x:X,y:gr.map(r=>r.s2Top),name:'srv top · +LL',line:{color:'#1C4FC4',width:1.8}}]:[]),
        ...(ov.s3?[{x:X,y:gr.map(r=>r.s3Bot),name:'Service III · bot',line:{color:'#C2271D',width:2.2}}]:[]),
        ...(ov.lims?[hline(lim.relC,'0.65 f′ci','#B3261E'),hline(lim.srvC2,'0.60 f′c','#7F1D1D'),
                     hline(-lim.srvT,'srv tension lim','#B45309'),hline(-lim.relT,'rel tension lim','#D97706')]:[])]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'stress (ksi, + = compression)'}}}/>
    </Card>
    <Card title="Governing Stress Summary">
      <Tbl head={['Check','x (ft)','Actual (ksi)','Limit (ksi)','Ratio','Status']}
        rows={sChecks.map(c=>({c:[c.n,fmt(c.loc,1),fmt(c.v,3),fmt(c.lim,3),fmt(c.r,2),PF(c.pass)]}))}/>
    </Card>
    <StressHeatmap inp={inp} R={R}/>
    {(()=>{const g=R.g,cp=R.cp,m=inp.mat,ck=R.checks;
      const cf=n=>ck.find(c=>c.n===n)||{loc:0,pass:true};
      const row=loc=>gr.reduce((b,r)=>Math.abs(r.x-loc)<Math.abs(b.x-loc)?r:b,gr[0]);
      const rRc=row(cf('Release comp').loc),rRt=row(cf('Release tens').loc),rS1=row(cf('Srv comp (perm)').loc),rS2=row(cf('Srv comp (full)').loc),rS3=row(cf('Srv III tens').loc),rDk=row(cf('Deck comp').loc);
      const relReinf=inp.opt.relBondedReinf, sev=inp.opt.corrosion==='severe';
      return <Deriv title="Derivation — Fiber Stresses at Governing Sections" refTag="LRFD 5.9.2.3">
        <VarTable rows={[
          ['A_g','Gross girder area',g.A,'in²'],
          ['S_b','Girder modulus, bottom',g.Sb,'in³'],
          ['S_t','Girder modulus, top',g.St,'in³'],
          ['S_bc','Composite modulus, girder bottom',cp.Sbc,'in³'],
          ['S_tg','Composite modulus, girder top',cp.Stg,'in³'],
          ['S_td','Composite modulus, deck top',cp.Std,'in³'],
          ['f_pi','Prestress after transfer',R.fpi,'ksi'],
          ['f_pe','Effective prestress',R.fpe,'ksi'],
          ['P_i','Initial prestress force',R.ss.Aps*R.fpi,'kip'],
          ['P_e','Effective prestress force',R.ss.Aps*R.fpe,'kip'],
          ['0.65f′ci','Release compression limit',lim.relC,'ksi'],
          ['f_t,rel','Release tension limit',-lim.relT,'ksi'],
          ['0.45f′c','Service comp. (perm) limit',lim.srvC1,'ksi'],
          ['0.60f′c','Service comp. (full) limit',lim.srvC2,'ksi'],
          ['f_t,srv','Service III tension limit',-lim.srvT,'ksi'],
          ['γ_LL','Service III live-load factor',+inp.opt.gLLs3,'—'],
        ]}/>
        <Step d="Allowable stress limits (LRFD 5.9.2.3)"
              note="The girder is checked at two stages — at transfer (release), on the bare girder with f′ci, and in service, on the composite section with f′c. Compression is limited to a fraction of strength; tension is limited to a fraction of the modulus of rupture (or to zero/√f′c thresholds) to control cracking. Sign convention below: compression +, tension −.">
          <ML s={Tx`\textbf{Release compression: }0.65f'_{ci}=0.65(${nx(m.fci,2)})=${nx(lim.relC,3)}\;\mathrm{ksi}`}/>
          <div style={{fontSize:11.5,color:'var(--ink2)',margin:'-2px 0 6px',lineHeight:1.5}}>Limits the extreme-fiber compression on the bare girder right after the strands are cut, before the concrete has reached full strength (5.9.2.3.1a).</div>
          <ML s={relReinf
            ? Tx`\textbf{Release tension: }0.24\sqrt{f'_{ci}}=0.24\sqrt{${nx(m.fci,2)}}=${nx(lim.relT,3)}\;\mathrm{ksi}\;(\text{tension})`
            : Tx`\textbf{Release tension: }\min(0.0948\sqrt{f'_{ci}},\,0.2)=${nx(lim.relT,3)}\;\mathrm{ksi}\;(\text{tension})`}/>
          <div style={{fontSize:11.5,color:'var(--ink2)',margin:'-2px 0 6px',lineHeight:1.5}}>Extreme-fiber tension at release (5.9.2.3.1b). {relReinf?'With bonded auxiliary reinforcement sufficient to carry the tensile force, the higher limit 0.24√f′ci applies.':'Without bonded reinforcement, the lower limit min(0.0948√f′ci, 0.2 ksi) applies.'} Governs the top fiber near the ends and the bottom fiber at midspan where self-weight relieves precompression.</div>
          <ML s={Tx`\textbf{Service compression (permanent): }0.45f'_c=0.45(${nx(m.fc,2)})=${nx(lim.srvC1,3)}\;\mathrm{ksi}`}/>
          <div style={{fontSize:11.5,color:'var(--ink2)',margin:'-2px 0 6px',lineHeight:1.5}}>Compression under effective prestress + permanent loads only (5.9.2.3.2a). The lower 0.45 factor guards against excessive creep under sustained load.</div>
          <ML s={Tx`\textbf{Service compression (perm. + transient): }0.60\,\phi_w f'_c=0.60(${nx(m.fc,2)})=${nx(lim.srvC2,3)}\;\mathrm{ksi}`}/>
          <div style={{fontSize:11.5,color:'var(--ink2)',margin:'-2px 0 6px',lineHeight:1.5}}>Compression under prestress + all permanent + transient (live) loads (5.9.2.3.2a). The higher 0.60 factor applies because live load is short-duration (φw = 1.0 for solid sections).</div>
          <ML s={sev
            ? Tx`\textbf{Service III tension: }0.0948\sqrt{f'_c}=0.0948\sqrt{${nx(m.fc,2)}}=${nx(lim.srvT,3)}\;\mathrm{ksi}\;(\text{tension})`
            : Tx`\textbf{Service III tension: }\min(0.19\sqrt{f'_c},\,0.6)=\min(0.19\sqrt{${nx(m.fc,2)}},0.6)=${nx(lim.srvT,3)}\;\mathrm{ksi}\;(\text{tension})`}/>
          <div style={{fontSize:11.5,color:'var(--ink2)',margin:'0 0 2px',lineHeight:1.5}}>Bottom-fiber tension under Service III (5.9.2.3.2b). {sev?'For severe corrosion exposure the tighter 0.0948√f′c limit applies.':'For moderate corrosion the limit is min(0.19√f′c, 0.6 ksi).'} This is the limit that typically sizes the prestressing for positive moment.</div>
        </Step>
        <Step d={`Release compression (bottom) @ x = ${fmt(cf('Release comp').loc,1)} ft`} r={R.useT?'transformed':'gross'}>
          <ML s={Tx`f_{bot}=\frac{P_i}{A_g}+\frac{P_i e}{S_b}-\frac{M_g}{S_b}=${nx(rRc.Aps*R.fpi/g.A,3)}+${nx(rRc.Aps*R.fpi*rRc.e/g.Sb,3)}-${nx(rRc.Mg/g.Sb,3)}=${nx(rRc.relBot,3)}\le ${nx(lim.relC,3)}\;${cf('Release comp').pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d={`Release tension (top) @ x = ${fmt(cf('Release tens').loc,1)} ft`}>
          <ML s={Tx`f_{top}=\frac{P_i}{A_g}-\frac{P_i e}{S_t}+\frac{M_g}{S_t}=${nx(rRt.Aps*R.fpi/g.A,3)}-${nx(rRt.Aps*R.fpi*rRt.e/g.St,3)}+${nx(rRt.Mg/g.St,3)}=${nx(rRt.relTop,3)}\ge ${nx(-lim.relT,3)}\;${cf('Release tens').pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d={`Service I top, permanent loads @ x = ${fmt(cf('Srv comp (perm)').loc,1)} ft`}>
          <ML s={Tx`f=\frac{P_e}{A_g}-\frac{P_e e}{S_t}+\frac{M_g+M_{dk}}{S_t}+\frac{M_{sd}}{S_{tg}}=${nx(rS1.Aps*R.fpe/g.A,3)}-${nx(rS1.Aps*R.fpe*rS1.e/g.St,3)}+${nx((rS1.Mg+rS1.Mdk)/g.St,3)}+${nx(rS1.Msd/cp.Stg,3)}=${nx(rS1.s1Top,3)}\le ${nx(lim.srvC1,3)}\;${cf('Srv comp (perm)').pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d={`Service I top, full load @ x = ${fmt(cf('Srv comp (full)').loc,1)} ft`}>
          <ML s={Tx`f=f_{perm}+\frac{M_{LL}}{S_{tg}}=${nx(rS2.s1Top,3)}+${nx(rS2.Mll/cp.Stg,3)}=${nx(rS2.s2Top,3)}\le ${nx(lim.srvC2,3)}\;${cf('Srv comp (full)').pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d={`Service III bottom @ x = ${fmt(cf('Srv III tens').loc,1)} ft (γLL = ${inp.opt.gLLs3})`} r="T.3.4.1-4">
          <ML s={Tx`f=\frac{P_e}{A_g}+\frac{P_e e}{S_b}-\frac{M_g+M_{dk}}{S_b}-\frac{M_{sd}+\gamma_{LL}M_{LL}}{S_{bc}}=${nx(rS3.Aps*R.fpe/g.A,3)}+${nx(rS3.Aps*R.fpe*rS3.e/g.Sb,3)}-${nx((rS3.Mg+rS3.Mdk)/g.Sb,3)}-${nx((rS3.Msd+inp.opt.gLLs3*rS3.Mll)/cp.Sbc,3)}=${nx(rS3.s3Bot,3)}\ge ${nx(-lim.srvT,3)}\;${cf('Srv III tens').pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d={`Deck compression @ x = ${fmt(cf('Deck comp').loc,1)} ft`}>
          <ML s={Tx`f=\frac{M_{sd}+M_{LL}}{S_{td}}=\frac{${nx(rDk.Msd,0)}+${nx(rDk.Mll,0)}}{${nx(cp.Std,0)}}=${nx(rDk.dkC,3)}\le ${nx(lim.dkC2,3)}\;${cf('Deck comp').pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
      </Deriv>;})()}
    <Card title="Fatigue I — Strand Stress Range" refTag="LRFD 5.5.3">
      <div className="calcb" style={{padding:'2px 0 0'}}>
        <Step d="Fatigue truck moment (single lane, IM = 15%, no lane load)" r="5.6.1.4">
          <ML s={Tx`M_{fat}=${nx(R.fat.Mfat,0)}\;\mathrm{k\text{-}ft/lane}\quad DF_{fat}=\frac{g_{m1}}{1.2}=${nx(R.fat.dfFat,4)}\quad M_{fat,girder}=M_{fat}(1.15)(DF_{fat})=${nx(R.fat.Mfat1,0)}\;\mathrm{k\text{-}ft}`}/>
        </Step>
        <Step d="Cracking trigger — bottom fiber under permanent + Fatigue I" r="5.5.3.1">
          <ML s={Tx`f_{b,perm}=\frac{P_e}{A_g}+\frac{P_e e}{S_b}-\frac{M_{g}+M_{dk}}{S_b}-\frac{M_{sd}}{S_{bc}}=${nx(R.fat.fbPerm,3)}\;\mathrm{ksi}\quad\Delta f_b=\frac{1.75M_{fat}}{S_{bc}}=${nx(R.fat.dfbFat,3)}\;\mathrm{ksi}`}/>
          <ML s={Tx`f_{b,min}=f_{b,perm}-\Delta f_b=${nx(R.fat.fbMinFat,3)}\;${R.fat.cracksFat?'<':'\\ge'}\;-0.095\sqrt{f'_c}=${nx(-R.fat.frFat,3)}\;\mathrm{ksi}\;\Rightarrow\;\text{${R.fat.cracksFat?'cracked — strand fatigue governs':'uncracked — fatigue not critical'}}`}/>
        </Step>
        <Step d="Strand stress range vs limit" r="5.5.3.3">
          <ML s={Tx`\Delta f_{strand}\approx n\,\Delta f_b${R.fat.cracksFat?'\\,(\\text{cracked amplification})':''}=${nx(R.fat.dfStrand,2)}\;\mathrm{ksi}\le ${nx(R.fat.fatLimit,1)}\;\mathrm{ksi}\;${R.fat.ok?'\\checkmark':'\\text{N.G.}'}\quad(D/C=${nx(R.fat.dc,2)})`}/>
        </Step>
      </div>
      <div className="callout">Per 5.5.3.1, if the section remains uncracked under permanent load plus the Fatigue I combination, the strand stress range stays far below the limit and fatigue does not control. The 18 ksi limit applies to a strand radius of curvature ≥ 30 ft (straight/large-radius); reduce to 10 ksi where strands are sharply harped (5.5.3.3). Stress range is taken at midspan, the governing flexural location.</div>
    </Card>
    <Card title="Crack Control — Reinforcement Spacing" refTag="LRFD 5.6.7">
      {R.crack.cracked?
        <div className="calcb" style={{padding:'2px 0 0'}}>
          <Step d="Service III bottom in tension — spacing limit applies" r="5.6.7-1">
            <ML s={Tx`\beta_s=1+\frac{d_c}{0.7(h-d_c)}=1+\frac{${nx(2.0,1)}}{0.7(${nx(R.g.h,0)}-${nx(2.0,1)})}=${nx(R.crack.betaCr,3)}`}/>
            <ML s={Tx`s\le\frac{700\gamma_e}{\beta_s f_{ss}}-2d_c=\frac{700(${nx(R.crack.gammaE,2)})}{${nx(R.crack.betaCr,3)}(${nx(R.crack.fssBot,2)})}-2(${nx(2.0,1)})=${nx(R.crack.sMaxCrack,1)}\;\mathrm{in}`}/>
          </Step>
        </div>
      :<div className="callout">{R.crack.note}. The Service III bottom fiber remains in compression, so the 5.6.7 distribution-of-reinforcement spacing limit is not triggered. Provide nominal bonded reinforcement per detailing practice.</div>}
    </Card>
    <CalcSec n="—" title="Output — Stresses at Tenth Points (ksi, + compression)">
      <div style={{padding:'8px 0 2px'}}>
      <Tbl head={['x (ft)','e (in)','Aps (in²)','Mg','Mdk','Msd','MLL','Rel top','Rel bot','Srv top perm','Srv top +LL','Srv III bot']}
        rows={gr.filter(r=>Math.abs(r.x*10/L-Math.round(r.x*10/L))<1e-6).map(r=>({c:[fmt(r.x,1),fmt(r.e,2),fmt(r.Aps,2),
          fmt(r.Mg/12,0),fmt(r.Mdk/12,0),fmt(r.Msd/12,0),fmt(r.Mll/12,0),
          fmt(r.relTop,3),fmt(r.relBot,3),fmt(r.s1Top,3),fmt(r.s2Top,3),fmt(r.s3Bot,3)]}))}/>
      <div className="mnote" style={{marginTop:6}}>Moments in k-ft. Governing search runs over the full 61-point grid including transfer-length stations.</div>
      </div>
    </CalcSec>
  </div>);
}

function FlexTab({inp,R}){
  const f=R.fMid,fg=R.flexFull,L=R.L;
  const xs=fg.map(r=>r.x);
  const cap=fg.map(r=>r.phiMn/12);
  const dem=fg.map(r=>r.Mu/12);
  const ok9=(R.checks.find(c=>c.n==='Flexure')||{}).pass, okMin=(R.checks.find(c=>c.n==='Min reinf')||{}).pass;
  // ---- moment-breakdown plot state ----
  const [factored,setFactored]=useState(false);
  const allLines=['SW','DC1','DC2','DW','LLpos','LLneg','Mu','phiMn','phiMnNeg','MuNeg'];
  const [vis,setVis]=useState({SW:true,DC1:true,DC2:true,DW:true,LLpos:true,LLneg:true,Mu:true,phiMn:true,phiMnNeg:true,MuNeg:true});
  const tog=k=>setVis(v=>({...v,[k]:!v[k]}));
  const hasNeg = fg.some(r=>Math.abs(r.mLLneg)>0.5);
  // Strength I factors when "factored" is on (else 1.0 = unfactored service component)
  const kSW=factored?1.25:1, kDC1=factored?1.25:1, kDC2=factored?1.25:1, kDW=factored?1.5:1, kLL=factored?1.75:1;
  const col={SW:'#0F766E',DC1:'#7C3AED',DC2:'#B45309',DW:'#A16207',LLpos:'#B3261E',LLneg:'#DC2626',
             Mu:'#1C4FC4',phiMn:'#15803D',phiMnNeg:'#B45309',MuNeg:'#B3261E'};
  const lbl={SW:'Self-weight',DC1:'DC1 (deck+haunch)',DC2:'DC2 (barrier)',DW:'DW (wearing surf.)',
             LLpos:'LL +M (×DF×IM, env.)',LLneg:'LL −M (×DF×IM, env.)',Mu:'±Mu (Strength I)',
             phiMn:'+φMn',phiMnNeg:'−φMn (pier)',MuNeg:'Mu −M (pier)'};
  const traces=[];
  const addLine=(key,y,opt={})=>{ if(vis[key]) traces.push({x:xs,y,name:lbl[key],line:{color:col[key],width:opt.w||1.8,dash:opt.dash},...opt.extra}); };
  addLine('SW', fg.map(r=>r.mSW*kSW));
  addLine('DC1', fg.map(r=>r.mDC1*kDC1));
  addLine('DC2', fg.map(r=>r.mDC2*kDC2));
  addLine('DW', fg.map(r=>r.mDW*kDW));
  addLine('LLpos', fg.map(r=>r.mLLpos*kLL));
  if(R.cont) addLine('LLneg', fg.map(r=>r.mLLneg*kLL));
  // Factored Strength I demand — shown as SEPARATE positive and negative envelopes (not one
  // enveloped line that risers across zero). Each is continuous; they coexist in the mid-region.
  // +Mu uses the positive LL branch; −Mu uses the negative LL branch (only meaningful w/ continuity).
  const dcF=(r)=>1.25*(r.mSW+r.mDC1+r.mDC2)+1.5*r.mDW;     // factored permanent (k-ft)
  if(vis.Mu){
    traces.push({x:xs,y:fg.map(r=>dcF(r)+1.75*r.mLLpos),name:'+Mu (Strength I)',
      line:{color:col.Mu,width:2.4},fill:'tozeroy',fillcolor:'rgba(28,79,196,.06)'});
    if(R.cont) traces.push({x:xs,y:fg.map(r=>dcF(r)+1.75*r.mLLneg),name:'−Mu (Strength I)',
      line:{color:'#1C4FC4',width:2.4,dash:'dash'}});
  }
  // capacity lines
  addLine('phiMn', cap, {w:2.4});
  if(R.cont){
    if(vis.phiMnNeg) traces.push({x:[0,L*0.15,L*0.85,L],y:[-R.cont.phiMnN/12,-R.cont.phiMnN/12,-R.cont.phiMnN/12,-R.cont.phiMnN/12],name:lbl.phiMnNeg,line:{color:col.phiMnNeg,width:2.4,dash:'dot'}});
  }
  const togKeys=['SW','DC1','DC2','DW','LLpos',...(R.cont?['LLneg']:[]),'Mu','phiMn',...(R.cont?['phiMnNeg']:[])];
  return(<div>
    <div className="bigres">
      <div className={'br '+(ok9?'p':'f')}><div className="l">Mu / φMn (governing)</div><div className="n">{fmt(R.flexGov.r,3)}</div><div className="u">{fmt(R.flexGov.Mu/12,0)} / {fmt(R.flexGov.phiMn/12,0)} k-ft @ x = {fmt(R.flexGov.x,1)} ft{Math.abs(R.flexGov.x-L/2)>0.01?' · midspan '+fmt(R.MuMid/f.phiMn,3):''}</div></div>
      <div className="br"><div className="l">f_ps</div><div className="n">{fmt(f.fps,1)}</div><div className="u">ksi · c = {fmt(f.c,2)}″ ({f.rect?'rectangular':'T-section'})</div></div>
      <div className="br"><div className="l">φ (ε_t = {fmt(f.et*1000,1)}‰)</div><div className="n">{fmt(f.phi,2)}</div><div className="u">5.5.4.2 · {f.et>=0.005?'tension-controlled':'transition'}</div></div>
      <div className={'br '+(okMin?'p':'f')}><div className="l">Min reinf (5.6.3.3)</div><div className="n">{fmt(R.minGov.r,2)}</div><div className="u">min(Mcr, 1.33Mu)/φMn @ x = {fmt(R.minGov.x,1)} ft</div></div>
      {R.cont&&<div className={'br '+(R.checks.at(-1).pass?'p':'f')}><div className="l">−Mu / −φMn @ pier</div><div className="n">{fmt(R.cont.dc,3)}</div><div className="u">{fmt(R.cont.MuN/12,0)} / {fmt(R.cont.phiMnN/12,0)} k-ft</div></div>}
    </div>
    <Card title="Moment Breakdown vs Capacity" refTag={factored?'factored (Strength I)':'unfactored service components'}>
      <div style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap',marginBottom:8}}>
        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer'}}>
          <input type="checkbox" checked={factored} onChange={e=>setFactored(e.target.checked)}/>
          Apply Strength I load factors (1.25 DC · 1.50 DW · 1.75 LL)
        </label>
        <span style={{fontSize:11,color:'var(--ink2)'}}>click a legend chip to toggle a line</span>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
        {togKeys.map(k=><button key={k} onClick={()=>tog(k)}
          style={{display:'flex',alignItems:'center',gap:5,padding:'3px 8px',borderRadius:12,fontSize:11,
            border:'1px solid '+(vis[k]?col[k]:'var(--line)'),background:vis[k]?col[k]+'18':'transparent',
            color:vis[k]?col[k]:'var(--ink2)',cursor:'pointer',opacity:vis[k]?1:0.5}}>
          <span style={{width:9,height:9,borderRadius:2,background:vis[k]?col[k]:'var(--ink2)'}}></span>{lbl[k]}
        </button>)}
      </div>
      <Fig data={traces}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'moment (k-ft)',zeroline:true,zerolinecolor:'#16212E',zerolinewidth:1.2},showlegend:false}}/>
      {!R.cont&&hasNeg&&<div className="callout" style={{borderColor:'#B45309'}}>Negative live-load moment is present in the imported demands but <b>continuity is off</b>, so the negative-moment lines and pier check are not shown. Turn on <b>continuity for live load</b> (Inputs → continuity) to include negative moment.</div>}
      {R.cont
        ? <div className="callout">Above the axis: positive-moment components and capacity. Below the axis: the negative-moment demand (−Mu envelope, dashed) and the deck-reinforced −φMn capacity at the pier. Pier check: Mu(−M) = <b>{fmt(R.cont.MuN/12,0)} k-ft</b> vs −φMn = <b>{fmt(R.cont.phiMnN/12,0)} k-ft</b> (D/C = <b>{fmt(R.cont.dc,2)}</b>, {R.checks.at(-1).pass?'OK':'N.G.'}) — the demand matches the −Mu envelope at the support. The factored demand is drawn as <b>two separate envelopes</b>, +Mu (solid) and −Mu (dashed), so neither risers across zero. The LL ±M lines include the distribution factor and impact, i.e. (LL+IM)×DF. {factored?'Component lines are factored (Strength I).':'Component lines are unfactored service moments.'} {R.useExt?'LL from the imported MIDAS envelope.':''}</div>
        : <div className="callout">{factored?'Components shown factored (Strength I): 1.25 DC, 1.50 DW, 1.75 LL.':'Components shown as unfactored service moments; +Mu is the factored Strength I envelope regardless of the checkbox.'} The live-load lines (LL ±M) already include the distribution factor and dynamic load allowance (impact) — i.e. (LL+IM)×DF. {R.useExt?'LL from the imported MIDAS envelope.':'Self-weight and DC1 are computed; DC2/DW from inputs; LL is the HL-93 envelope.'}</div>}
    </Card>
    <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
      <Card title="Midspan Flexure Detail" refTag="LRFD 5.6.3.1.1 / 5.6.3.2">
        <KV rows={[['k (low-relaxation)','0.28',''],['β₁ (deck f′c)',fmt(f.b1,3),''],
          ['d_p',fmt(f.dp,2),'in'],['c / a',`${fmt(f.c,2)} / ${fmt(f.a,2)}`,'in'],
          ['f_ps = fpu(1−k·c/dp)',fmt(f.fps,1),'ksi'],
          ['M_n',fmt(f.Mn/12,0),'k-ft'],['φM_n',fmt(f.phiMn/12,0),'k-ft'],['M_u',fmt(R.MuMid/12,0),'k-ft']]}/>
      </Card>
      <Card title="Minimum Reinforcement" refTag="LRFD 5.6.3.3">
        <KV rows={[['f_r = 0.24√f′c',fmt(R.fr,3),'ksi'],['f_cpe (bottom)',fmt(R.fcpe,3),'ksi'],
          ['M_cr (γ₁=1.6, γ₂=1.1, γ₃=1.0)',fmt(R.Mcr/12,0),'k-ft'],
          ['1.33 M_u',fmt(1.33*R.MuMid/12,0),'k-ft'],
          ['Required φMn ≥',fmt(R.minMr/12,0),'k-ft'],
          ['Status',okMin?'PASS':'FAIL','']]}/>
        <div className="callout" style={{marginTop:10}}>Compression block uses deck f′c with b_eff; if a exceeds the slab + haunch, a flanged analysis with the girder top-flange width is used. Strain compatibility refinement can be added where the approximate method is not applicable.</div>
      </Card>
    </div>

    {(()=>{const g=R.g,cp=R.cp,m=inp.mat,fpu=+inp.str.fpu,ss=R.ss,ck=R.checks;
      const rMid=R.grid.reduce((b,r)=>Math.abs(r.x-L/2)<Math.abs(b.x-L/2)?r:b,R.grid[0]);
      const Mbar=inp.loads.wBar*L*L/8*12, Mdw=inp.loads.wDW*L*L/8*12, PeMid=rMid.Aps*R.fpe;
      return <Deriv title="Derivation — Strength I Flexure @ Midspan" refTag="LRFD 5.6.3">
        <VarTable rows={[
          ["f'_c","Girder concrete strength",+m.fc,'ksi'],
          ["f'_cd","Deck concrete strength",+m.fcd,'ksi'],
          ['f_pu','Strand ultimate strength',fpu,'ksi'],
          ['A_ps','Total strand area',ss.Aps,'in²'],
          ['f_pe','Effective prestress',R.fpe,'ksi'],
          ['h_c','Composite depth',cp.hc,'in'],
          ['b_eff','Effective deck width',cp.beff,'in'],
          ['d_p','Strand depth to extreme comp. fiber',f.dp,'in'],
          ['β₁','Stress-block factor',f.b1,'—'],
          ['c','Neutral-axis depth',f.c,'in'],
          ['a','Stress-block depth (β₁c)',f.a,'in'],
          ['f_ps','Strand stress at nominal strength',f.fps,'ksi'],
          ['ε_t','Net tensile strain',f.et,'—'],
          ['φ','Resistance factor',f.phi,'—'],
          ['M_u','Factored moment (Strength I)',R.MuMid/12,'k-ft'],
          ['φM_n','Factored resistance',f.phiMn/12,'k-ft'],
          ['M_cr','Cracking moment',R.Mcr/12,'k-ft'],
        ]}/>
        <Step d="Factored moment" r="T.3.4.1-1">
          <ML s={Tx`M_u=1.25(M_g+M_{dk}+M_{bar})+1.50M_{dw}+1.75M_{LL}=1.25(${nx(rMid.Mg/12,0)}+${nx(rMid.Mdk/12,0)}+${nx(Mbar/12,0)})+1.50(${nx(Mdw/12,0)})+1.75(${nx(R.MLL,0)})=${nx(R.MuMid/12,0)}\;\mathrm{k\text{-}ft}`}/>
        </Step>
        <Step d="Stress-block factor, depth & neutral axis" r="5.6.3.1.1 / 5.6.2.2">
          <ML s={Tx`\beta_1=0.85-0.05(f'_{cd}-4)=0.85-0.05(${nx(m.fcd,1)}-4)=${nx(f.b1,3)}\quad k=0.28\quad d_p=h_c-\bar y_{ps}=${nx(cp.hc,1)}-${nx(ss.cgsMid,2)}=${nx(f.dp,2)}\;\mathrm{in}`}/>
          {f.rect?
          <ML s={Tx`c=\frac{A_{ps}f_{pu}}{0.85f'_{cd}\beta_1 b_{eff}+k A_{ps}f_{pu}/d_p}=\frac{${nx(rMid.Aps,3)}(${nx(fpu,0)})}{0.85(${nx(m.fcd,1)})(${nx(f.b1,3)})(${nx(cp.beff,0)})+0.28\frac{${nx(rMid.Aps,3)}(${nx(fpu,0)})}{${nx(f.dp,2)}}}=${nx(f.c,2)}\;\mathrm{in}`}/>
          :<ML s={Tx`\beta_1 c>t_s+t_h\Rightarrow\text{flanged: }c=\frac{A_{ps}f_{pu}-0.85f'_{cd}(b_{eff}-b_{tf})h_f}{0.85f'_{cd}\beta_1 b_{tf}+kA_{ps}f_{pu}/d_p}=${nx(f.c,2)}\;\mathrm{in}`}/>}
          <ML s={Tx`a=\beta_1 c=${nx(f.a,2)}\;\mathrm{in}\;${f.rect?Tx`(\le t_s+t_h=${nx(+inp.ts+ +inp.th,1)},\text{ rectangular})`:''}\qquad f_{ps}=f_{pu}\left(1-k\frac{c}{d_p}\right)=${nx(fpu,0)}\left(1-0.28\frac{${nx(f.c,2)}}{${nx(f.dp,2)}}\right)=${nx(f.fps,1)}\;\mathrm{ksi}`}/>
        </Step>
        <Step d="Nominal resistance, strain & φ" r="5.6.3.2 / 5.5.4.2">
          <ML s={f.rect?Tx`M_n=A_{ps}f_{ps}\left(d_p-\frac{a}{2}\right)=${nx(rMid.Aps,3)}(${nx(f.fps,1)})\left(${nx(f.dp,2)}-\frac{${nx(f.a,2)}}{2}\right)=${nx(f.Mn,0)}\;\mathrm{k\text{-}in}=${nx(f.Mn/12,0)}\;\mathrm{k\text{-}ft}`
            :Tx`M_n=A_{ps}f_{ps}(d_p-\tfrac a2)+0.85f'_{cd}(b_{eff}-b_{tf})h_f(\tfrac a2-\tfrac{h_f}2)=${nx(f.Mn/12,0)}\;\mathrm{k\text{-}ft}`}/>
          <ML s={Tx`\varepsilon_t=0.003\left(\frac{d_t}{c}-1\right)=0.003\left(\frac{${nx(f.dt,2)}}{${nx(f.c,2)}}-1\right)=${nx(f.et*1000,2)}\times10^{-3}\Rightarrow\phi=0.75+0.25\frac{\varepsilon_t-0.002}{0.003}\le1.0=${nx(f.phi,3)}`}/>
          <ML s={Tx`\phi M_n=${nx(f.phi,3)}(${nx(f.Mn/12,0)})=${nx(f.phiMn/12,0)}\ge M_u=${nx(R.MuMid/12,0)}\;\mathrm{k\text{-}ft}\quad\frac{M_u}{\phi M_n}=${nx(R.MuMid/f.phiMn,3)}\;${(R.MuMid<=f.phiMn*1.0001)?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d="Minimum reinforcement" r="5.6.3.3">
          <ML s={Tx`f_r=0.24\sqrt{f'_c}=${nx(R.fr,3)}\;\mathrm{ksi}\qquad f_{cpe}=\frac{P_e}{A_g}+\frac{P_e e_m}{S_b}=${nx(PeMid/g.A,3)}+${nx(PeMid*ss.eMid/g.Sb,3)}=${nx(R.fcpe,3)}\;\mathrm{ksi}`}/>
          <ML s={Tx`M_{cr}=\gamma_3\left[(\gamma_1 f_r+\gamma_2 f_{cpe})S_{bc}-M_{dnc}\left(\tfrac{S_{bc}}{S_b}-1\right)\right]=1.0\left[(1.6\cdot${nx(R.fr,3)}+1.1\cdot${nx(R.fcpe,3)})${nx(cp.Sbc,0)}-${nx(rMid.Mg+rMid.Mdk,0)}\left(\tfrac{${nx(cp.Sbc,0)}}{${nx(g.Sb,0)}}-1\right)\right]=${nx(R.Mcr/12,0)}\;\mathrm{k\text{-}ft}`}/>
          <ML s={Tx`\phi M_n\ge\min(M_{cr},1.33M_u)=\min(${nx(R.Mcr/12,0)},${nx(1.33*R.MuMid/12,0)})=${nx(R.minMr/12,0)}\;\mathrm{k\text{-}ft}\;${(R.minMr<=f.phiMn*1.0001)?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
      </Deriv>;})()}

    <CalcSec n="—" title="Output — Flexure Stations (to midspan)">
      <div style={{padding:'8px 0 2px'}}>
      <Tbl head={['x (ft)','Mu (k-ft)','c (in)','a (in)','fps (ksi)','εt ×10³','φ','φMn (k-ft)','Mu/φMn']}
        rows={fg.filter(r=>Math.abs(r.x*20/L-Math.round(r.x*20/L))<1e-6).map(r=>({c:[fmt(r.x,1),fmt(r.Mu/12,0),fmt(r.c,2),fmt(r.a,2),fmt(r.fps,1)+(r.devGov?' †':''),fmt(r.et*1000,2),fmt(r.phi,3),fmt(r.phiMn/12,0),fmt(r.Mu/r.phiMn,3)]}))}/>
      <div className="hint" style={{marginTop:'4px'}}>† strand is not yet fully developed at this station (LRFD 5.9.4.3.2), so f<sub>ps</sub> is the section-average <b>developed</b> stress and φM<sub>n</sub> is solved from that tension rather than from f<sub>pu</sub>(1−kc/d<sub>p</sub>). Debonded strands push the shortfall further in; midspan is unaffected.</div>
      </div>
    </CalcSec>

    {R.cont&&<Card title="Negative Moment at Pier — Continuity for LL + SIDL" refTag="LRFD 5.12.3.3 · two equal spans">
      <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
        <div>
          <KV rows={[
            ['M DC2 (barrier) = wL²/8',fmt(R.cont.MDC2n,0),'k-ft'],
            ['M DW = wL²/8',fmt(R.cont.MDWn,0),'k-ft'],
            ['LL/lane: 1 truck / tandem',`${fmt(R.cont.negLL.M1,0)} / ${fmt(R.cont.negLL.Mtd,0)}`,'k-ft'],
            ['LL/lane: 2 trucks (×0.9 w/ lane)',fmt(R.cont.negLL.M2,0),'k-ft'],
            ['LL/lane: lane load',fmt(R.cont.negLL.Mln,0),'k-ft'],
            ['Governing LL+IM (× DF_m = '+fmt(R.dfm,3)+')',fmt(R.cont.MLLn,0),'k-ft'],
            ['M_u = 1.25DC + 1.5DW + 1.75LL',fmt(R.cont.MuN/12,0),'k-ft']]}/>
        </div>
        <div>
          <KV rows={[
            ['Deck A_s in b_eff / f_y',`${fmt(R.cont.As,2)} in² / ${fmt(R.cont.fyr,0)} ksi`,''],
            ['d (top bars to bot. flange)',fmt(R.cont.dN,1),'in'],
            ['a / c (girder f′c, b = b_bf)',`${fmt(R.cont.aN,2)} / ${fmt(R.cont.cN,2)}`,'in'],
            ['a vs bottom-flange thickness',`${fmt(R.cont.aN,2)} vs ${fmt(R.cont.tbf,1)}`,R.cont.aOK?'in · OK':'in · EXCEEDS'],
            ['ε_t / φ',`${fmt(R.cont.etN*1000,1)}‰ / ${fmt(R.cont.phiN,2)}`,''],
            ['φM_n',fmt(R.cont.phiMnN/12,0),'k-ft'],
            ['M_u / φM_n',fmt(R.cont.dc,2),R.checks.at(-1).pass?'PASS':'FAIL']]}/>
        </div>
      </div>
      <div className="callout">Section: deck reinforcement in tension at d = h_c − {fmt(+inp.cont.dTop,1)}″, rectangular compression block in the girder bottom flange (girder f′c). Equal adjacent spans assumed; strand contribution near the pier (debonded/ineffective for negative bending) neglected. Positive-moment connection at the diaphragm and time-dependent restraint moments per 5.12.3.3 are not computed here.</div>
      <div className="calcb" style={{padding:'8px 0 0'}}>
        <Step d="Pier influence line & negative live-load enumeration" r="3.6.1.3.1">
          <ML s={Tx`\eta(\xi)=-\frac{\xi(L^2-\xi^2)}{4L^2}\;\;\Rightarrow\;\;M_{1tr}=${nx(R.cont.negLL.M1,0)},\;M_{td}=${nx(R.cont.negLL.Mtd,0)},\;M_{2tr}=${nx(R.cont.negLL.M2,0)},\;M_{ln}=${nx(R.cont.negLL.Mln,0)}\;\mathrm{k\text{-}ft/lane}`}/>
          <ML s={Tx`M_{LL/lane}=\min\big[1.33\max(M_{1tr},M_{td})+M_{ln},\;0.9(1.33M_{2tr}+M_{ln})\big]=${nx(R.cont.negLL.MLL,0)}\;(\text{${R.cont.negLL.gov}})`}/>
        </Step>
        <Step d="Factored pier demand">
          <ML s={Tx`M_u=1.25\frac{w_{bar}L^2}{8}+1.50\frac{w_{dw}L^2}{8}+1.75\,M_{LL/lane}\,DF_m=1.25(${nx(R.cont.MDC2n,0)})+1.50(${nx(R.cont.MDWn,0)})+1.75(${nx(R.cont.MLLn,0)})=${nx(R.cont.MuN/12,0)}\;\mathrm{k\text{-}ft}`}/>
        </Step>
        <Step d="Capacity — deck steel tension, bottom-flange compression" r="5.12.3.3">
          <ML s={Tx`a=\frac{A_s f_y}{0.85f'_c b_{bf}}=\frac{${nx(R.cont.As,2)}(${nx(R.cont.fyr,0)})}{0.85(${nx(inp.mat.fc,1)})(${nx(R.g.bbf,0)})}=${nx(R.cont.aN,2)}\;\mathrm{in}\;${R.cont.aOK?Tx`\le t_{bf}=${nx(R.cont.tbf,1)}\;\checkmark`:Tx`>t_{bf}\;\text{N.G.}`}\qquad c=\frac{a}{\beta_1}=${nx(R.cont.cN,2)}\;\mathrm{in}`}/>
          <ML s={Tx`\phi=0.75+0.15\frac{\varepsilon_t-0.002}{0.003}\le0.9=${nx(R.cont.phiN,3)}\qquad \phi M_n=\phi A_s f_y\left(d-\frac a2\right)=${nx(R.cont.phiMnN/12,0)}\;\mathrm{k\text{-}ft}\qquad\frac{M_u}{\phi M_n}=${nx(R.cont.dc,3)}\;${R.checks.at(-1).pass?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
      </div>
    </Card>}
  </div>);
}

function ShearTab({inp,R}){
  const sh=R.shear,L=R.L;
  return(<div>
    <div className="bigres">
      <div className={'br '+(R.checks.find(c=>c.n==='Shear').pass?'p':'f')}><div className="l">Worst Vu/φVn</div><div className="n">{fmt(R.wShear.dc,2)}</div><div className="u">@ x = {fmt(R.wShear.x,1)} ft</div></div>
      <div className={'br '+((R.wLong.Tcap>0?R.wLong.Tdem/R.wLong.Tcap:0)<=1.0001?'p':'f')}><div className="l">Long. tie (5.7.3.5)</div><div className="n">{fmt(R.wLong.Tcap>0?R.wLong.Tdem/R.wLong.Tcap:0,2)}</div><div className="u">worst @ x = {fmt(R.wLong.x,1)} ft</div></div>
      <div className="br"><div className="l">Trial stirrups</div><div className="n">{fmt(inp.opt.stirAv,2)} in²</div><div className="u">@ {inp.opt.sEnd}″ end-zone / {inp.opt.sInt}″ interior</div></div>
    </div>
    <Card title="Shear Demand vs Capacity" refTag="LRFD 5.7.3 — General Procedure (MCFT)">
      <Fig data={[
        {x:R.shearDiag.map(r=>r.x),y:R.shearDiag.map(r=>r.phiVn),name:'φVn (trial stirrups)',line:{color:'#15803D',width:2.4}},
        {x:R.shearDiag.map(r=>r.x),y:R.shearDiag.map(r=>r.Vu),name:'Vu (Strength I, LL×DF×IM)',fill:'tozeroy',fillcolor:'rgba(28,79,196,.06)',line:{color:'#1C4FC4',width:2}},
        {x:R.shearDiag.map(r=>r.x),y:R.shearDiag.map(r=>r.phiVcp),name:'φ(Vc+Vp)',line:{color:'#0E7490',width:1.6,dash:'dot'}}]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'shear (kip)'}}}/>
      <div className="callout">V<sub>u</sub> = 1.25 V<sub>DC</sub> + 1.50 V<sub>DW</sub> + 1.75 V<sub>LL</sub>, where the live-load shear already includes the shear distribution factor (DF<sub>v</sub>{R.useExt?'':' = '+fmt(R.dfv,3)}) and dynamic load allowance (impact). {R.useExt?'Demand is |Vu| over the full span from the imported MIDAS shear envelope. ':''}The design table below evaluates the critical region near the support where shear governs.</div>
    </Card>
    <Card title="Section-by-Section Design" refTag="β = 4.8/(1+750εs) · θ = 29+3500εs · φ = 0.90">
      <Tbl head={['x (ft)','dv (in)','Vu (k)','Vp (k)','εs ×10³','β','θ (°)','Vc (k)','φVn (k)','Vs req (k)','s req (in)','s max (in)','s prov (in)','Vu/φVn','Status']}
        rows={sh.map(r=>({c:[fmt(r.x,1),fmt(r.dv,1),fmt(r.Vu,0),fmt(r.Vp,1),fmt(r.es*1000,3),fmt(r.beta,2),fmt(r.theta,1),
          fmt(r.Vc,0),fmt(r.phiVn,0),fmt(r.VsReq,0),isFinite(r.sReq)?fmt(Math.min(r.sReq,99),1):'—',
          <span style={{color:(r.stirReq&&r.sProv>r.sMaxGov+1e-3)?'#B3261E':'inherit',fontWeight:(r.stirReq&&r.sProv>r.sMaxGov+1e-3)?700:400}}>{fmt(r.sMaxGov,1)}</span>,
          <span style={{color:(r.stirReq&&r.sProv>r.sMaxGov+1e-3)?'#B3261E':'inherit',fontWeight:(r.stirReq&&r.sProv>r.sMaxGov+1e-3)?700:400}}>{fmt(r.sProv,0)}</span>,
          fmt(r.dc,2),PF(r.dc<=1.0001&&r.vuMaxOK&&r.spOK)]}))}/>
      <div className="callout">φV<sub>n</sub> = φ(V<sub>c</sub> + V<sub>s</sub> + V<sub>p</sub>), φ = 0.90, capped at 0.25f′c·bv·dv + Vp (5.7.3.3). <b>Status fails if the provided spacing exceeds the maximum</b> (the smaller of 5.7.2.6 and the A_v,min spacing of 5.7.2.5) wherever transverse reinforcement is required (V<sub>u</sub> {'>'} 0.5φ(V<sub>c</sub>+V<sub>p</sub>), 5.7.2.3) — a spacing violation fails the section even when φV<sub>n</sub> {'>'} V<sub>u</sub>. ε_s per Eq. 5.7.3.4.2-4 with f_po = 0.7f_pu; negative strains permitted to −0.40×10⁻³ where at least minimum transverse reinforcement is present. The <b>s max</b> and <b>s prov</b> cells turn red where the provided spacing is over the maximum.</div>
    </Card>

    <Card title="Longitudinal Reinforcement (Shear–Flexure Tie)" refTag="LRFD 5.7.3.5">
      <Tbl head={['x (ft)','T demand (k)','T strands (k)','T mild (k)','T capacity (k)','T/Tcap','Status']}
        rows={sh.map(r=>({c:[(r.isBearing?'brg '+fmt(r.x,1):fmt(r.x,1)),fmt(r.Tdem,0),fmt(r.Tcap-r.TsMild,0),fmt(r.TsMild,0),fmt(r.Tcap,0),fmt(r.Tcap>0?r.Tdem/r.Tcap:0,2),PF(r.longOK)]}))}/>
      <div className="callout">Tension tie demand T = |M_u|/(φ_f·d_v) + (|V_u|/φ_v − 0.5V_s − |V_p|)·cot θ. At the <b>inside edge of the bearing</b> (the "brg" row) 5.7.3.5 drops the flexural term, so T = (|V_u|/φ_v − 0.5V_s − |V_p|)·cot θ only. Strand capacity uses the <b>developed</b> stress f_ps,avail ramped over the transfer/development length — so right at the bearing the strands supply very little and the tie relies on <b>bottom mild steel</b> (A_s,bot·f_y = <b>{fmt(sh[0].TsMild,0)} kip</b>), which is why end-region bottom bars are provided. This is the positive-moment/bearing tie; top steel serves the pier region.</div>
    </Card>

    <Card title="Strand Development Length" refTag="LRFD 5.9.4.3.2">
      <KV rows={[
        ['Transfer length ℓ_t = 60 d_b',fmt(R.ss.lt,1),'in'],
        ['ℓ_d bonded = 1.6(f_ps − ⅔f_pe)d_b',fmt(R.ldBonded,1),'in ('+fmt(R.ldBonded/12,1)+' ft)'],
        ['ℓ_d debonded = 2.0(f_ps − ⅔f_pe)d_b',fmt(R.ldDebond,1),'in ('+fmt(R.ldDebond/12,1)+' ft)'],
        ['f_ps (midspan flexure)',fmt(R.fMid.fps,1),'ksi'],
        ['f_pe (effective)',fmt(R.fpe,1),'ksi']]}/>
      <div className="callout">Strand stress available for flexure and the longitudinal tie is reduced inside ℓ_d. Debonded strands restart their transfer/development ramp at the end of the debonded length, per 5.9.4.3.3.</div>
    </Card>

    {(()=>{const g=R.g,cp=R.cp,m=inp.mat,sh0=R.shear.find(s=>!s.isBearing)||R.shear[0],shx=sh0.x,fpu=+inp.str.fpu,Ep=+inp.str.Ep;
      const V_=w=>w*(L/2-shx), apsX=R.ss.at(shx).Aps, fpo=0.7*fpu, cotT=1/Math.tan(sh0.theta*Math.PI/180);
      const rN=R.grid.reduce((b,r)=>Math.abs(r.x-shx)<Math.abs(b.x-shx)?r:b,R.grid[0]);
      const fgN=R.flexGrid.reduce((b,r)=>Math.abs(r.x-shx)<Math.abs(b.x-shx)?r:b,R.flexGrid[0]);
      const MuU=Math.max(rN.Mu,Math.abs(sh0.Vu-sh0.Vp)*sh0.dv);
      const VsCap=Math.min(sh0.Vs,sh0.Vu/R.phiV);
      const vlim=0.125*m.fc, lowShear=sh0.vu<vlim;
      return <Deriv title={`Derivation — Shear @ Critical Section (x = ${fmt(shx,1)} ft)`} refTag="LRFD 5.7.3 — MCFT">
        <VarTable rows={[
          ['x','Critical section location',shx,'ft'],
          ['b_v','Web width (shear)',g.bw,'in'],
          ['d_v','Effective shear depth',sh0.dv,'in'],
          ['V_u','Factored shear demand',sh0.Vu,'kip'],
          ['V_p','Vertical prestress component',sh0.Vp,'kip'],
          ['ε_s','Longitudinal strain',sh0.es,'—'],
          ['β','Tension/aggregate factor',sh0.beta,'—'],
          ['θ','Diagonal compression angle',sh0.theta,'deg'],
          ['V_c','Concrete shear resistance',sh0.Vc,'kip'],
          ['V_s','Stirrup shear resistance',sh0.Vs,'kip'],
          ['A_v','Stirrup area per set',+inp.opt.stirAv,'in²'],
          ['s','Stirrup spacing (this section)',sh0.sProv,'in'],
          ['φV_n','Factored shear resistance',R.phiV*sh0.Vn,'kip'],
        ]}/>
        <Step d="Effective shear depth" r="5.7.2.8">
          <ML s={Tx`d_v=\max\left(d_p-\tfrac a2,\,0.9d_p,\,0.72h_c\right)=\max(${nx(fgN.dp-fgN.a/2,1)},\,${nx(0.9*fgN.dp,1)},\,${nx(0.72*cp.hc,1)})=${nx(sh0.dv,1)}\;\mathrm{in}`}/>
        </Step>
        <Step d="Factored shear & vertical prestress component">
          <ML s={Tx`V_u=1.25(V_g+V_{dk}+V_{bar})+1.50V_{dw}+1.75V_{LL}=1.25(${nx(V_(R.wG),1)}+${nx(V_(R.wDk),1)}+${nx(V_(R.wBar),1)})+1.50(${nx(V_(R.wDW),1)})+1.75(${nx(R.VLL*(1-shx/L),1)})=${nx(sh0.Vu,1)}\;\mathrm{kip}`}/>
          <ML s={Tx`V_p=P_{harp}\,\text{slope}=${nx(sh0.Vp,1)}\;\mathrm{kip}`}/>
        </Step>
        <Step d="Longitudinal strain" r="Eq. 5.7.3.4.2-4" note={`M_u taken ≥ |V_u−V_p|·d_v; f_po = 0.7f_pu = ${fmt(fpo,0)} ksi`}>
          <ML s={Tx`\varepsilon_s=\frac{|M_u|/d_v+|V_u-V_p|-A_{ps}f_{po}}{E_p A_{ps}}=\frac{${nx(MuU,0)}/${nx(sh0.dv,1)}+${nx(Math.abs(sh0.Vu-sh0.Vp),1)}-${nx(apsX,3)}(${nx(fpo,0)})}{${nx(Ep,0)}(${nx(apsX,3)})}=${nx(sh0.esRaw*1000,3)}\times10^{-3}`}/>
          {sh0.esRecomp&&<>
            <ML s={Tx`\varepsilon_s<0\Rightarrow\text{recompute with }E_cA_{ct}:\quad\varepsilon_s=\frac{\text{same numerator}}{E_pA_{ps}+E_cA_{ct}}=\frac{${nx(sh0.esRaw*Ep*apsX,0)}}{${nx(Ep,0)}(${nx(apsX,3)})+${nx(R.cp.Ecg,0)}(${nx(sh0.Act,0)})}=${nx(sh0.es*1000,3)}\times10^{-3}`}/>
            <div className="mnote">A negative ε<sub>s</sub> may only be used when it is recomputed with the concrete on the flexural tension side participating (Eq. 5.7.3.4.2-4); otherwise ε<sub>s</sub> is taken as zero. A<sub>ct</sub> = {fmt(sh0.Act,0)} in² is the girder concrete below mid-depth — the deck is on the compression side and is excluded. The −0.40×10⁻³ floor is applied to this recomputed value, not to the raw one.</div>
          </>}
        </Step>
        <Step d="β, θ, concrete & steel" r="5.7.3.4.2 / 5.7.3.3">
          <ML s={Tx`\beta=\frac{4.8}{1+750\varepsilon_s}=${nx(sh0.beta,3)}\qquad\theta=29+3500\varepsilon_s=${nx(sh0.theta,2)}°`}/>
          <ML s={Tx`V_c=0.0316\beta\sqrt{f'_c}b_v d_v=0.0316(${nx(sh0.beta,3)})\sqrt{${nx(m.fc,1)}}(${nx(g.bw,0)})(${nx(sh0.dv,1)})=${nx(sh0.Vc,1)}\;\mathrm{kip}`}/>
          <ML s={Tx`V_s=\frac{A_v f_y d_v\cot\theta}{s}=\frac{${nx(+inp.opt.stirAv,2)}(${nx(+inp.opt.fy,0)})(${nx(sh0.dv,1)})(${nx(cotT,3)})}{${nx(sh0.sProv,0)}}=${nx(sh0.Vs,1)}\;\mathrm{kip}`}/>
        </Step>
        <Step d="Nominal resistance & demand-capacity">
          <ML s={Tx`V_n=\min(V_c+V_s+V_p,\,0.25f'_c b_v d_v+V_p)=\min(${nx(sh0.Vc+sh0.Vs+sh0.Vp,1)},${nx(0.25*m.fc*g.bw*sh0.dv+sh0.Vp,1)})=${nx(sh0.Vn,1)}\;\mathrm{kip}`}/>
          <ML s={Tx`\frac{V_u}{\phi V_n}=\frac{${nx(sh0.Vu,1)}}{0.9(${nx(sh0.Vn,1)})}=${nx(sh0.dc,3)}\;${sh0.dc<=1.0001?'\\checkmark':'\\text{N.G.}'}\quad(\text{worst: }x=${nx(R.wShear.x,1)}\,\mathrm{ft},D/C=${nx(R.wShear.dc,3)})`}/>
        </Step>
        <Step d="Maximum stirrup spacing" r="5.7.2.6 / 5.7.2.5" note={sh0.stirReq?`Stirrups are required here — V_u=${fmt(sh0.Vu,1)} kip > 0.5φ(V_c+V_p)=${fmt(0.5*R.phiV*(sh0.Vc+sh0.Vp),1)} kip (5.7.2.3) — so the spacing maximum governs the detailing.`:`V_u ≤ 0.5φ(V_c+V_p): transverse steel is not required by 5.7.2.3, so this spacing maximum is informational here.`}>
          <ML s={Tx`v_u=\frac{|V_u-\phi V_p|}{\phi\,b_v d_v}=\frac{|${nx(sh0.Vu,1)}-0.9(${nx(sh0.Vp,1)})|}{0.9(${nx(g.bw,0)})(${nx(sh0.dv,1)})}=${nx(sh0.vu,3)}\;\mathrm{ksi}\;${lowShear?'<':'\\ge'}\;0.125f'_c=${nx(vlim,3)}\;\mathrm{ksi}`}/>
          <ML s={Tx`s_{max}=${lowShear?`\\min(0.8d_v,\\,24)=\\min(0.8(${nx(sh0.dv,1)}),24)`:`\\min(0.4d_v,\\,12)=\\min(0.4(${nx(sh0.dv,1)}),12)`}=${nx(sh0.sMax,1)}\;\mathrm{in}`}/>
          <ML s={Tx`s_{A_v,min}=\frac{A_v f_y}{0.0316\sqrt{f'_c}\,b_v}=\frac{${nx(+inp.opt.stirAv,2)}(${nx(+inp.opt.fy,0)})}{0.0316\sqrt{${nx(m.fc,1)}}\,(${nx(g.bw,0)})}=${nx(sh0.sMinR,1)}\;\mathrm{in}`}/>
          <ML s={Tx`s_{max,gov}=\min(s_{max},\,s_{A_v,min})=${nx(sh0.sMaxGov,1)}\;\mathrm{in}\;${sh0.spOK?'\\ge':'<'}\;s_{prov}=${nx(sh0.sProv,1)}\;\mathrm{in}\;${sh0.spOK?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d="Interface shear (girder/deck horizontal shear)" r="5.7.4">
          <ML s={Tx`v_{ui}=\frac{V_u}{b_{vi}d_{vi}}=\frac{${nx(sh0.Vu,1)}}{${nx(g.btf,0)}(${nx(sh0.dv,1)})}=${nx(R.iface[0].vui,3)}\;\mathrm{ksi}\quad A_{vf,prov}=${nx(R.iface[0].AvfProv,3)}\ge\max(A_{vf,req},A_{vf,min})=${nx(Math.max(R.iface[0].AvfReq,R.iface[0].AvfMin),3)}\;${R.iface[0].ok?'\\checkmark':'\\text{N.G.}'}`}/>
        </Step>
        <Step d="Longitudinal reinforcement (tension tie)" r="5.7.3.5">
          <ML s={Tx`T=\frac{|M_u|}{\phi_f d_v}+\left(\frac{|V_u|}{\phi_v}-0.5V_s-|V_p|\right)\cot\theta=\frac{${nx(MuU,0)}}{0.9(${nx(sh0.dv,1)})}+\left(\frac{${nx(sh0.Vu,1)}}{0.9}-0.5(${nx(VsCap,1)})-${nx(sh0.Vp,1)}\right)(${nx(cotT,3)})=${nx(sh0.Tdem,0)}\;\mathrm{kip}`}/>
          <ML s={Tx`T_{cap}=A_{ps}\,f_{ps,avail}+A_s f_y=${nx(apsX,3)}(${nx(sh0.fpsAvail,1)})${sh0.TsMild>0?`+${nx(sh0.TsMild,0)}`:''}=${nx(sh0.Tcap,0)}\;\mathrm{kip}\ge T\;${sh0.longOK?'\\checkmark':'\\text{N.G.}'}\quad(\text{worst tie: }x=${nx(R.wLong.x,1)}\,\mathrm{ft})`}/>
        </Step>
      </Deriv>;})()}
    <Card title="Interface Shear (Girder/Deck)" refTag="LRFD 5.7.4 — roughened, c=0.28 ksi, μ=1.0">
      <Tbl head={['x (ft)','vui (ksi)','Avf req (in²/ft)','Avf min','Avf prov','Status']}
        rows={R.iface.map(r=>({c:[fmt(r.x,1),fmt(r.vui,3),fmt(r.AvfReq,3),r.minWaived?'waived':fmt(r.AvfMin,3),fmt(r.AvfProv,3),PF(r.ok)]}))}/>
      <div className="hint">Checked at every shear station over the full span, including the station just past each change in stirrup spacing. The minimum A<sub>vf</sub> (0.05A<sub>cv</sub>/f<sub>y</sub>) is waived only where v<sub>ui</sub> {'<'} 0.210 ksi (5.7.4.2: roughened 0.25-in. amplitude girder/slab interface, all vertical shear reinforcement extended into the deck). Governing: x = {fmt(R.wIface.x,1)} ft, D/C = {fmt(R.wIface.r,2)}.</div>
    </Card>
    <div className="callout">End-region / transfer checks — anchorage-zone <b>splitting &amp; bursting</b> (5.9.4.4), <b>confinement</b> (5.9.4.4.2) and the <b>release-tension bonded steel</b> (5.9.2.3.1b), with an end-region reinforcement diagram — are on the dedicated <b>Anchorage Zone</b> tab.</div>
  </div>);
