    const w=+g.w||+g.btf||+g.bw, h=+g.h;
    const vw=+g.voidW||0, vh=+g.voidH||0, nv=+g.voids||(vw>0?1:0);
    Iy = h*Math.pow(w,3)/12 - (nv&&vw>0? nv*vh*Math.pow(vw,3)/12 : 0);     // outer minus voids, about vertical CL
    if(vw>0&&vh>0){ const t=+g.wall||5, we=w-t, he=h-t; J = 4*Math.pow(we*he,2)/((2*we+2*he)/t); } // closed single cell
    else J = rectTorsionJ(w,h);
  } else if(g.isNext){
    const B=(g.next&&+g.next.B)||10, cc=(g.next&&+g.next.stemCC)||60, w=+g.btf||+g.w, h=+g.h;
    const hs=Math.max(1,h-8), As=B*hs;                                     // stems (flange ~8"); parallel-axis dominates
    Iy = 2*(B*Math.pow(hs,3)/12 + As*Math.pow(cc/2,2)) + 8*Math.pow(w,3)/12;
    J  = 2*rectTorsionJ(B,hs) + rectTorsionJ(w,8);
  } else {                                                                 // I-shape (AASHTO / bulb-tee)
    Iy = approxIy(g);                                                      // existing bare-girder weak-axis inertia
    const d=g.d||[6,3,6,6], ttf=(+d[0]||0)+(+d[1]||0), tbf=(+d[2]||0)+(+d[3]||0), hw=Math.max(1,g.h-ttf-tbf);
    J  = rectTorsionJ(g.btf,ttf)+rectTorsionJ(g.bbf,tbf)+rectTorsionJ(hw,g.bw);
  }
  const bMax=Math.max(+g.btf||0,+g.bbf||0,+g.w||0);                        // widest fiber for Sy
  return { Iweak:Iy, J:J, Sy: bMax>0? Iy/(bMax/2):0, bMax };
}

function compositeProps(inp,g){
  const Ecg=Ec(inp.mat.fc,inp.mat.wc), Ecd=Ec(inp.mat.fcd,inp.mat.wcd);
  const n=Ecd/Ecg;
  const ts=+inp.ts, th=+inp.th;
  // Dead-load deck thickness may differ from the structural (capacity) thickness — e.g. a
  // sacrificial/integral wearing course or overpour that adds weight but isn't part of the
  // composite section. Section props/capacity use ts; the deck-weight term wdk uses tsLoad.
  const tsLoad = inp.tsSeparate ? (+inp.tsDL||ts) : ts;
  if(g.isNext){
    // NEXT F: composite topping over the full flange width. A haunch/build-up of th between the
    // flange top and the topping soffit takes up camber and holds deck grade. Its weight is always
    // carried; it is included in section stiffness only when haunchInProps is set (typical: excluded).
    const beff=g.btf;                          // full flange acts; topping matches flange width
    const incHaunch=!!inp.haunchInProps;
    const hcGap=incHaunch?th:0;                // structural gap flange-top -> topping soffit
    const Ad=ts>0? beff*n*ts:0, yd=g.h+hcGap+ts/2;
    const Ah=(incHaunch&&ts>0)? beff*n*th:0, yh=g.h+th/2;   // haunch full flange width
    const Ac=g.A+Ad+Ah;
    const ybc=(ts>0||Ah>0)? (g.A*g.yb+Ad*yd+Ah*yh)/Ac : g.yb;
    const Ic=g.I+g.A*(ybc-g.yb)**2 + (ts>0? beff*n*ts**3/12+Ad*(yd-ybc)**2:0) + (Ah>0? beff*n*th**3/12+Ah*(yh-ybc)**2:0);
    const hc=g.h+hcGap+ts;
    return {n,beff,Ecg,Ecd,Ac,Ic,ybc,ytc:g.h-ybc,hc,incHaunch,
            Sbc:Ic/ybc, Stg:Ic/(g.h-ybc), Std:ts>0? Ic/(hc-ybc)/n : Ic/(g.h-ybc),
            tsLoad, wdkW:beff, wdkHW:beff,
            wdkDeck:(beff*tsLoad/144)*(+inp.mat.wcdLoad||+inp.mat.wcd), wdkHaunch:(beff*th/144)*(+inp.mat.wcdLoad||+inp.mat.wcd),
            wdk:(beff*tsLoad/144)*(+inp.mat.wcdLoad||+inp.mat.wcd) + (beff*th/144)*(+inp.mat.wcdLoad||+inp.mat.wcd), isNext:true};
  }
  if(g.isBox||g.isDeck){
    // Adjacent box / deck beam: composite topping (if any) over the beam width.
    // AUTO uses the beam's own width (adjacent beams sit edge-to-edge, each carrying its own
    // strip of topping); MANUAL respects the entered effective width (e.g. partial topping or
    // a shear-lag reduction). With no topping (ts=0) the beam is non-composite.
    const beff=inp.beffAuto? g.w : (+inp.beff||g.w);
    const incHaunch=false;                     // adjacent beams: topping bears directly, no haunch
    const Ad=ts>0? beff*n*ts:0, yd=g.h+ts/2;
    const Ac=g.A+Ad;
    const ybc=ts>0? (g.A*g.yb+Ad*yd)/Ac : g.yb;
    const Ic=g.I+g.A*(ybc-g.yb)**2 + (ts>0? beff*n*ts**3/12+Ad*(yd-ybc)**2:0);
    const hc=g.h+ts;
    return {n,beff,Ecg,Ecd,Ac,Ic,ybc,ytc:g.h-ybc,hc,incHaunch,
            Sbc:Ic/ybc, Stg:Ic/(g.h-ybc), Std:ts>0? Ic/(hc-ybc)/n : Ic/(g.h-ybc),
            tsLoad, wdkW:beff, wdkHW:0,
            wdkDeck:ts>0? (beff*tsLoad/144)*(+inp.mat.wcdLoad||+inp.mat.wcd) : 0, wdkHaunch:0,
            wdk:ts>0? (beff*tsLoad/144)*(+inp.mat.wcdLoad||+inp.mat.wcd) : 0, isNext:false, isBox:!!g.isBox, isDeck:!!g.isDeck};
  }
  const beff=inp.beffAuto? inp.S*12 : +inp.beff;
  // Haunch in composite SECTION PROPERTIES is optional (typical practice excludes it). When
  // excluded, the deck is modeled as bearing directly on the top flange (deck centroid drops by th)
  // and the haunch contributes no transformed area/inertia. Its WEIGHT is always carried (wdk).
  const incHaunch=!!inp.haunchInProps;
  const hcGap=incHaunch?th:0;                       // structural gap between flange top and deck soffit
  const Ad=beff*n*ts, yd=g.h+hcGap+ts/2;            // deck centroid
  const Ah=incHaunch? g.btf*n*th : 0, yh=g.h+th/2;
  const Ac=g.A+Ad+Ah;
  const ybc=(g.A*g.yb+Ad*yd+Ah*yh)/Ac;
  const Ic=g.I+g.A*(ybc-g.yb)**2 + beff*n*ts**3/12+Ad*(yd-ybc)**2 + (incHaunch? g.btf*n*th**3/12+Ah*(yh-ybc)**2 : 0);
  const hc=g.h+hcGap+ts;                            // composite depth used for section moduli
  return {n,beff,Ecg,Ecd,Ac,Ic,ybc,ytc:g.h-ybc,hc,incHaunch,
          Sbc:Ic/ybc, Stg:Ic/(g.h-ybc), Std:Ic/(hc-ybc)/n,
          tsLoad, wdkW:inp.S*12, wdkHW:g.btf,
          wdkDeck:(inp.S*12*tsLoad/144)*(+inp.mat.wcdLoad||+inp.mat.wcd), wdkHaunch:(g.btf*th/144)*(+inp.mat.wcdLoad||+inp.mat.wcd),
          wdk:(inp.S*12*tsLoad/144)*(+inp.mat.wcdLoad||+inp.mat.wcd) + (g.btf*th/144)*(+inp.mat.wcdLoad||+inp.mat.wcd), isNext:false};
}

/* ================= STRAND GEOMETRY ================= */
function strandSys(inp,g){
  const st=STRANDS[inp.str.size];
  // Each row: n total strands, nd of them debonded (sheathed) for length dbnd from each end.
  // Expand into bond-groups: {n, y, dbnd} where dbnd=0 for the bonded remainder.
  const rows=inp.rows.filter(r=>+r.n>0).map(r=>({n:+r.n,y:+r.y,dbnd:+r.dbnd||0,nd:Math.min(+r.nd||0,+r.n)}));
  const groups=[];
  rows.forEach(r=>{
    const nd=r.dbnd>0? r.nd : 0;          // debonding only meaningful with a length
    if(nd>0) groups.push({n:nd, y:r.y, dbnd:r.dbnd});
    if(r.n-nd>0) groups.push({n:r.n-nd, y:r.y, dbnd:0});
  });
  const hp=inp.harp, nh=+hp.n||0;
  const lt=60*st.db; // transfer length, in
  const Lf=inp.L;
  const eff=(xft,dbnd)=>clamp(((Math.min(xft,Lf-xft)-dbnd)*12)/lt,0,1);
  const yHarp=(xft)=>{
    const a=hp.frac*Lf, xm=Math.min(xft,Lf-xft);
    return xm>=a? +hp.yMid : (+hp.yEnd)+((+hp.yMid)-(+hp.yEnd))*(xm/a);
  };
  function at(xft){
    let N=0,Ny=0,Neff=0;
    groups.forEach(gp=>{const e=eff(xft,gp.dbnd);Neff+=gp.n*e;Ny+=gp.n*e*gp.y;N+=gp.n;});
    if(nh>0){const e=eff(xft,0);Neff+=nh*e;Ny+=nh*e*yHarp(xft);N+=nh;}
    const cgs=Neff>0?Ny/Neff:0;
    return {Aps:Neff*st.Ab, cgs, e:g.yb-cgs, Neff, Ntot:N};
  }
  const Nbond=rows.reduce((s,r)=>s+r.n,0);   // total straight (bonded + debonded) strands
  const Ntot=Nbond+nh;
  const Aps=Ntot*st.Ab;
  const Ndebond=rows.reduce((s,r)=>s+(r.dbnd>0?r.nd:0),0);
  const slope=nh>0? ((+hp.yEnd)-(+hp.yMid))/(hp.frac*Lf*12):0; // for Vp
  const yLow=Math.min(...rows.map(r=>r.y),nh>0?+hp.yMid:1e9);
  // Development length (LRFD 5.9.4.3.2): ld = K(fps - 2/3 fpe) db, K = 1.6 (bonded), 2.0 (debonded)
  // Developed strand stress fps_avail(x) ramps: = fpe over transfer length, then linear to fps over ld.
  // Girder overhang beyond the bearing (ft). The strand free end is this far outside the bearing,
  // so it adds to the bonded length available for development at every section (5.9.4.3.2 / practice).
  const endOh=(+((inp.opt&&inp.opt.endOh)||0))/12;
  const devStress=(xft,fps,fpe,dbnd)=>{
    const K=dbnd>0?2.0:1.6;
    const ld=K*(fps-(2/3)*fpe)*st.db;     // in
    const xb=(Math.min(xft,Lf-xft)+endOh-dbnd)*12; // bonded length from the girder end (incl. overhang), in
    if(xb<=0)return 0;
    if(xb<=lt)return fpe*(xb/lt);          // within transfer length: linear 0 -> fpe
    if(xb>=ld)return fps;                   // fully developed
    return fpe+(fps-fpe)*(xb-lt)/Math.max(ld-lt,1e-6); // linear fpe -> fps
  };
  // Section-average developed stress weighting each bond-group + harped
  const devAvg=(xft,fps,fpe)=>{
    let num=0,den=0;
    groups.forEach(gp=>{num+=gp.n*devStress(xft,fps,fpe,gp.dbnd);den+=gp.n;});
    if(nh>0){num+=nh*devStress(xft,fps,fpe,0);den+=nh;}
    return den>0?num/den:0;
  };
  // Developed strand TENSION at x (kip) and the centroid of that tension, per the
  // same 5.9.4.3.2 ramp. This already carries the transfer-length ramp, so it is
  // used INSTEAD of the eff-ramped Aps that at() returns, never on top of it --
  // multiplying both would square the ramp and count the end regions down twice.
  const devForce=(xft,fps,fpe)=>{
    let T=0,Ty=0;
    groups.forEach(gp=>{const A=gp.n*st.Ab, f=devStress(xft,fps,fpe,gp.dbnd); T+=A*f; Ty+=A*f*gp.y;});
    if(nh>0){const A=nh*st.Ab, f=devStress(xft,fps,fpe,0); T+=A*f; Ty+=A*f*yHarp(xft);}
    return {T, cgs:T>0?Ty/T:0};
  };
  return {st,rows,groups,hp,nh,lt,at,Ntot,Nbond,Ndebond,Aps,slope,yLow,devStress,devAvg,devForce,
          cgsMid:at(Lf/2).cgs, eMid:at(Lf/2).e, eEnd:at(0.001).e,
          AsStraight:Nbond*st.Ab, AsHarp:nh*st.Ab,
          cgsStraight:rows.reduce((s,r)=>s+r.n*r.y,0)/Math.max(1,Nbond)};
}

/* Area of concrete on the flexural tension side of the member -- Act in LRFD
   5.7.3.4.2, the concrete below mid-depth. Only the girder counts: the deck sits
   on the compression side, which is why it is not in here. Computed by clipping
   the half-outline at mid-depth (Sutherland-Hodgman), taking the shoelace area,
   doubling it for the mirrored half, and removing whatever part of each interior
   void falls below the cut. */
function tensionSideArea(g){
  const yc=g.h/2, P=halfPolygon(g), out=[];
  for(let i=0;i<P.length;i++){
    const a=P[i], b=P[(i+1)%P.length], ain=a[1]<=yc, bin=b[1]<=yc;
    if(ain) out.push(a);
    if(ain!==bin){ const t=(yc-a[1])/(b[1]-a[1]); out.push([a[0]+t*(b[0]-a[0]), yc]); }
  }
  if(out.length<3) return 0;
  let sh=0;
  for(let i=0;i<out.length;i++){ const a=out[i], b=out[(i+1)%out.length]; sh+=a[0]*b[1]-b[0]*a[1]; }
  let A=Math.abs(sh/2)*2;
  sectionVoids(g).forEach(v=>{
    if(v.type==='rect'){ const y0=v.y-v.h/2, y1=v.y+v.h/2;
      A-=v.w*Math.max(0,Math.min(y1,yc)-y0);
    } else {                                   // circular segment below the cut
      const r=v.d/2, dy=clamp(yc-v.y,-r,r);
      A-=r*r*Math.acos(-dy/r)+dy*Math.sqrt(Math.max(r*r-dy*dy,0));
    }
  });
  return Math.max(A,0);
}

/* ================= PRESTRESS LOSSES (LRFD 5.9.3) ================= */
function losses(inp,g,cp,ss,Mg_mid){ // Mg_mid kip-in
  const m=inp.mat, s=inp.str;
  const fpu=+s.fpu, fpy=s.lowlax?0.9*fpu:0.85*fpu;
  const fpbt=s.jack*fpu;
  const Eci=Ec(m.fci,m.wc), Ecf=cp.Ecg, Ep=+s.Ep;
  const Aps=ss.Aps, em=ss.eMid, Ag=g.A, Ig=g.I;
  // Elastic shortening — closed form C5.9.3.2.3a-1
  const dfES=(Aps*fpbt*(Ig+em*em*Ag)-em*Mg_mid*Ag)/(Aps*(Ig+em*em*Ag)+Ag*Ig*Eci/Ep);
  const Pi=Aps*(fpbt-dfES);
  const fcgp=Pi/Ag+Pi*em*em/Ig-Mg_mid*em/Ig;
  const fpt=fpbt-dfES;
  // ---- Approximate method 5.9.3.3 ----
  const gh=1.7-0.01*m.H, gst=5/(1+m.fci);
  const dfR_apx=s.lowlax?2.4:10.0;
  const apx={SH_CR:10*(fpbt*Aps/Ag)*gh*gst+12*gh*gst, R:dfR_apx};
  apx.total=apx.SH_CR+apx.R;
  // ---- Refined method 5.9.3.4 ----
  const ks=Math.max(1.45-0.13*m.VS,1.0);
  const khs=2.00-0.014*m.H, khc=1.56-0.008*m.H, kf=5/(1+m.fci);
  const ktd=t=>ktdAASHTO(t,m.fci);                  // Eq. 5.4.2.3.2-5
  const eShID=ks*khs*kf*ktd(m.td-m.ti)*0.48e-3;
  const eShIF=ks*khs*kf*ktd(m.tfin-m.ti)*0.48e-3;
  const psi=(t,ti)=>1.9*ks*khc*kf*ktd(t-ti)*Math.pow(ti,-0.118);
  const psiBID=psi(m.td,m.ti), psiBIF=psi(m.tfin,m.ti), psiBDF=1.9*ks*khc*kf*ktd(m.tfin-m.td)*Math.pow(m.td,-0.118);
  const epg=em;
  const Kid=1/(1+(Ep/Eci)*(Aps/Ag)*(1+Ag*epg*epg/Ig)*(1+0.7*psiBIF));
  const dfSR=eShID*Ep*Kid;
  const dfCR=(Ep/Eci)*fcgp*psiBID*Kid;
  const dfR1=s.lowlax? Math.max((fpt/30)*(fpt/fpy-0.55),0) : Math.max((fpt/7)*(fpt/fpy-0.55),0);
  const epc=cp.ybc-ss.cgsMid;
  const Kdf=1/(1+(Ep/Eci)*(Aps/cp.Ac)*(1+cp.Ac*epc*epc/cp.Ic)*(1+0.7*psiBIF));
  const eShDF=eShIF-eShID;
  const dfSD=eShDF*Ep*Kdf;
  return {fpbt,fpy,fpt,Eci,Ecf,Ep,dfES,Pi,fcgp,apx,
          ref:{ks,khs,khc,kf,eShID,eShIF,psiBID,psiBIF,psiBDF,Kid,Kdf,dfSR,dfCR,dfR1,dfSD,epc},
          finishRefined(dfcd,dfSSval){ // dfcd: change in conc stress at cgs due to deck+SIDL (negative)
            const dfCD=(Ep/Eci)*fcgp*(psiBIF-psiBID)*Kdf+(Ep/Ecf)*dfcd*psiBDF*Kdf;
            const dfR2=dfR1, dfSS=(dfSSval!==undefined?+dfSSval:+inp.opt.dfpSS)||0;
            const total=dfSR+dfCR+dfR1+dfSD+dfCD+dfR2-dfSS;
            return {dfCD,dfR2,dfSS,total};
          }};
}

/* ================= HL-93 & DISTRIBUTION FACTORS ================= */
function hl93(L){
  const mAtMid=(ax)=>{ // ax=[[x,P],...]
    let R=0; ax.forEach(([x,P])=>{if(x>=0&&x<=L)R+=P*(L-x)/L;});
    let M=R*L/2; ax.forEach(([x,P])=>{if(x>=0&&x<L/2)M-=P*(L/2-x);});
    return M;
  };
  let Mtr=0;
  for(let xm=0;xm<=L;xm+=0.1){
    Mtr=Math.max(Mtr,
      mAtMid([[xm-14,8],[xm,32],[xm+14,32]]),
      mAtMid([[xm-14,32],[xm,32],[xm+14,8]]));
  }
  const Mtd=mAtMid([[L/2,25],[L/2+4,25]]);
  const Mln=0.64*L*L/8;
  const Vtr=Math.max(32+32*(L-14)/L+8*(L-28)/L, 32+32*(L-14)/L); // truck at support
  const Vtd=25+25*(L-4)/L;
  const Vln=0.64*L/2;
  // Fatigue truck (5.6.1.4.1): design truck with constant 30-ft rear axle spacing, single lane, no lane load
  let Mfat=0;
  for(let xm=-30;xm<=L+30;xm+=0.25){
    Mfat=Math.max(Mfat,
      mAtMid([[xm,8],[xm+14,32],[xm+44,32]]),
      mAtMid([[xm,32],[xm+30,32],[xm+44,8]]));          // reversed: 32 –30 ft– 32 –14 ft– 8
  }
  return {Mtr,Mtd,Mln,Vtr,Vtd,Vln,Mfat,
          M:1.33*Math.max(Mtr,Mtd)+Mln, V:1.33*Math.max(Vtr,Vtd)+Vln};
}
function negMomentHL93(L){
  // Two equal continuous spans; influence of pier moment: eta(x) = -x(L^2-x^2)/(4L^2), mirrored
  const eta=x=>{const xi=x<=L?x:2*L-x; return -(xi*(L*L-xi*xi))/(4*L*L);};
  const Mof=ax=>ax.reduce((s,[x,P])=>(x>=0&&x<=2*L)?s+P*eta(x):s,0);
  const trk=(x,rev)=>rev?[[x,32],[x+14,32],[x+28,8]]:[[x,8],[x+14,32],[x+28,32]];
  let M1=0,Mtd=0;
  for(let x=0;x<=2*L;x+=0.5){
    M1=Math.min(M1,Mof(trk(x,false)),Mof(trk(x,true)));
    Mtd=Math.min(Mtd,Mof([[x,25],[x+4,25]]));
  }
  let M2=0; // two trucks, >=50 ft clear between trucks (3.6.1.3.1)
  for(let x1=0;x1<=2*L-106;x1+=1)
    for(let x2=x1+78;x2<=2*L-28;x2+=2)
      for(const o1 of [false,true]) for(const o2 of [false,true])
        M2=Math.min(M2,Mof(trk(x1,o1))+Mof(trk(x2,o2)));
  const Mln=-0.64*L*L/8;                       // lane on both spans
  const case1=1.33*Math.min(M1,Mtd)+Mln;
  const case2=0.9*(1.33*M2+Mln);
  return {M1:-M1,Mtd:-Mtd,M2:-M2,Mln:-Mln,
          MLL:-Math.min(case1,case2), gov:case2<case1?'2 trucks, 0.9 factor':'single truck/tandem'};
}

/* ===== HANDLING: lifting & hauling stability (PCI / Mast) ===== */
function handlingCalc(inp,g,cp,ss,fpe,fpi,Eci){
  const H=inp.handling, L=inp.L, Lin=L*12, m=inp.mat;
  const w=g.wsw;                              // klf girder self-weight
  // ---- overhang stress check at lift/support points ----
  // simple beam with two symmetric overhangs of length a: moments at support (-) and midspan (+)
  const stressAt=(aft)=>{
    const a=aft, Ls=L-2*a;                    // span between pick points (ft)
    const Msup=-w*a*a/2*12;                    // k-in (cantilever at pick)
    const Mmid=(w*Ls*Ls/8 - w*a*a/2)*12;       // k-in midspan
    const Pe=ss.at(L/2).Aps*fpi, e=ss.eMid;    // at release use fpi
    const PeE=ss.at(aft).Aps*fpi, eE=ss.at(aft).e;
    // top/bottom fiber at midspan (sagging) and at pick (hogging)
    const fMidTop=Pe/g.A-Pe*e/g.St+Mmid/g.St;
    const fMidBot=Pe/g.A+Pe*e/g.Sb-Mmid/g.Sb;
    const fSupTop=PeE/g.A-PeE*eE/g.St+Msup/g.St;
    const fSupBot=PeE/g.A+PeE*eE/g.Sb-Msup/g.Sb;
    return {a,Ls,Msup:Msup/12,Mmid:Mmid/12,fMidTop,fMidBot,fSupTop,fSupBot};
  };
  const limC=0.65*m.fci, limT=0.24*Math.sqrt(m.fci); // release-stage limits, bonded reinf
  // ---- lateral stability (Mast) ----
  const Ec=Eci, Iy=approxIy(g);
  const a=H.aLift*12, l1=Lin-2*a;               // pick spacing (in)
  const zo=computeZo(w/12,l1,a,Ec,Iy);          // lateral CG deflection, in
  const ei=H.ei;                                // initial CG eccentricity (sweep), in
  const yLift=g.yt;                             // roll axis above CG (lift loops near top)
  const FScrLift=yLift/(zo+ei);                 // simplified FS against cracking
  // hauling: roll center below, superelevation/road slope
  const ah=H.aHaul*12, l2=Lin-2*ah;
  const zoH=computeZo(w/12,l2,ah,Ec,Iy);
  const yrH=H.hr+g.yb;                           // CG height above roll center, in
  const alpha=H.theta_i;                         // road cross slope, rad
  const FScrHaul=yrH/(zoH+ei+yrH*alpha);
  return {w,limC,limT,Iy,
          lift:stressAt(H.aLift), haul:stressAt(H.aHaul),
          zo,zoH,ei,FScrLift,FScrHaul,
          aLift:H.aLift,aHaul:H.aHaul};
}
function approxIy(g){
  // weak-axis inertia of I-shape: sum of flange & web rectangles about vertical centroid
  const [ttf,ttf2,tbf,tbf2]=g.d;
  const tf=ttf+ttf2, bf=tbf+tbf2, web=g.h-tf-bf;
  const Itf=tf*Math.pow(g.btf,3)/12, Ibf=bf*Math.pow(g.bbf,3)/12, Iw=web*Math.pow(g.bw,3)/12;
  return Itf+Ibf+Iw;
}
function computeZo(w_in,l,a,E,Iy){
  // Mast lateral deflection of CG for beam with overhangs a, span l (all in inches, w in kip/in)
  // zo = w/(E*Iy) * [ l^5/120 - a^2 l^3/12 + a^4 l/4 + 3a^5/20 ] / (l + 2a)  (PCI/Mast form)
  const Lt=l+2*a;
  const num = Math.pow(l,5)/120 - a*a*Math.pow(l,3)/12 + Math.pow(a,4)*l/4 + 3*Math.pow(a,5)/20;
  return w_in/(E*Iy) * num / Lt;
}

/* Interpolated Table A4-1 lookup. S in ft, x = design-section distance from girder CL in in.
   Returns the unfactored LL+IM strip moments, plus flags when S falls outside the table. */
function deckTableA4(S,x){
  const Sn=+S||0, Sc=clamp(Sn,4,15), below=Sn<4, above=Sn>15;
  const t=(Sc-4)/0.25;
  const i0=clamp(Math.floor(t),0,A4_1.length-1), i1=Math.min(i0+1,A4_1.length-1), f=t-i0;
  const row=A4_1[i0].map((v,k)=>v+(A4_1[i1][k]-v)*f);
  const xn=+x||0, xc=clamp(xn,0,24);
  let j=0; while(j<A4_1_X.length-2 && xc>A4_1_X[j+1]) j++;
  const gf=(xc-A4_1_X[j])/(A4_1_X[j+1]-A4_1_X[j]);
  const Mneg=row[2+j]+(row[3+j]-row[2+j])*gf;
  return {Mpos:row[1], Mneg, S:Sn, Sused:Sc, x:xn, xUsed:xc,
          below, above, outOfRange:below||above, xClamped:xn>24};
}
/* Location of the design section for negative moment — LRFD 4.6.2.1.6.
   Precast I-shaped / open box with a top flange: b_tf/3 from the CL of the support,
   but not more than 15 in. Closed box (adjacent box / deck beams): face of the support. */
function deckDesignSection(inp,g){
  const b=+((g&&g.btf)||0);
  if(g&&(g.isBox||g.isDeck)) return {x:clamp(b/2,0,24), rule:'closed box → face of support (b/2)'};
  return {x:clamp(Math.min(b/3,15),0,24), rule:'precast I / open box → b_tf/3 ≤ 15 in'};
}

/* ===== DECK DESIGN: transverse (strip method, LRFD 4.6.2.1 / 9.7) ===== */
function deckCalc(inp,g,cp){
  const D=inp.deck, S=inp.S, ts=inp.ts, m=inp.mat;
  const fcd=m.fcd, fy=+D.fyd, wcd=m.wcd, wcdLd=(+m.wcdLoad||+m.wcd);
  const tsLoad = inp.tsSeparate ? (+inp.tsDL||ts) : ts;   // DL-only deck thickness (capacity still uses ts)
  // dead loads on deck (per ft width)
  const wDLslab=tsLoad/12*wcdLd;                  // DC, ksf -> klf per ft strip
  const wDLws=+D.wsFut;                          // DW, future wearing surface, ksf
  // ---- interior-bay dead-load strip moments (continuous slab over the girder line) ----
  const Ls=S;                                    // c/c girder spacing, ft
  const MDC_neg=wDLslab*Ls*Ls/10, MDC_pos=wDLslab*Ls*Ls/11;   // k-ft/ft
  const MDW_neg=wDLws  *Ls*Ls/10, MDW_pos=wDLws  *Ls*Ls/11;
  const MDL_neg=MDC_neg+MDW_neg,  MDL_pos=MDC_pos+MDW_pos;    // combined, for reporting
  // ---- design section for negative moment (4.6.2.1.6) ----
  const dsAuto=deckDesignSection(inp,g);
  const xnegAuto=dsAuto.x;
  const xneg = (D.xnegAuto===false) ? clamp(+D.xneg||0,0,24) : xnegAuto;
  // ---- live load: AASHTO Table A4-1 (already carries the MPFs and the 33% IM) ----
  const A4=deckTableA4(S,xneg);
  const MLL_pos=A4.Mpos, MLL_neg=A4.Mneg;
  // Equivalent-strip widths (T.4.6.2.1.3-1) retained for reference only — the interior-bay
  // live-load demand now comes straight from Table A4-1, not from a wheel on a strip.
  const SWpos=26+6.6*S, SWneg=48+3.0*S;          // in
  // ---- Strength I: DC 1.25, DW 1.50, LL+IM 1.75 ----
  const Mu_pos=1.25*MDC_pos+1.50*MDW_pos+1.75*MLL_pos;
  const Mu_neg=1.25*MDC_neg+1.50*MDW_neg+1.75*MLL_neg;
  // capacity: bottom bars (positive), top bars (negative)
  const cap=(barA,sp,cover,Mu)=>{
    const As=(+sp>0)? barA*12/sp : 0;            // in^2/ft — spacing ≤ 0 is an input error: no steel credited (was ∞)
    const dbar=Math.sqrt(barA*4/Math.PI);        // equivalent bar diameter, in
    const dEff=ts-cover-dbar/2;                  // to bar centroid
    const a=As*fy/(0.85*fcd*12);
    const b1=clamp(0.85-0.05*(fcd-4),0.65,0.85);
    const c=a/b1, et=0.003*(dEff/c-1);
    // resistance factor per 5.5.4.2 (nonprestressed): 0.75 compression-controlled (εt ≤ 0.002)
    // to 0.90 tension-controlled (εt ≥ 0.005) — not assumed tension-controlled.
    const phi=clamp(0.75+0.15*(et-0.002)/0.003, 0.75, 0.9);
    const Mn=As*fy*(dEff-a/2)/12;                // k-ft/ft
    return {As,dbar,dEff,a,c,et,phi,Mn,phiMn:phi*Mn,Mu,dc:Mu/(phi*Mn),ok:Mu<=phi*Mn};
  };
  const pos=cap(+D.barBot,+D.sBot,+D.coverB,Mu_pos);
  const neg=cap(+D.barTop,+D.sTop,+D.coverT,Mu_neg);
  // ---- overhang (LRFD 13 / A13 design case approximations, gravity only here) ----
  const oh=+D.oh;                                 // overhang, girder CL (or web) to slab edge, ft
  const bBar=Math.max(+D.bBar||0,0), bBarF=bBar/12;   // barrier base width, in -> ft
  const Pbar=Math.max(+D.wBar||0,0);              // barrier weight, klf of edge
  // Wheel sits 1.0 ft from the face of the railing (LRFD 3.6.1.3.1 / A13.4);
  // X is its distance to the point of support, and the overhang strip is 45.0 + 10.0X in.
  const Xoh=Math.max(oh-bBarF-1.0,0);             // ft
  const SWoh=45.0+10.0*Xoh;                       // in — T.4.6.2.1.3-1 overhang strip
  const MohDC=wDLslab*oh*oh/2 + Pbar*Math.max(oh-bBarF/2,0);
  const MohDW=wDLws*Math.pow(Math.max(oh-bBarF,0),2)/2;
  const MohDL=MohDC+MohDW;                        // combined, for reporting
  const MohLL=1.33*1.2*16*Xoh/(SWoh/12);          // IM 1.33, MPF 1.20, 16-kip wheel
  const Mu_oh=1.25*MohDC+1.50*MohDW+1.75*Math.max(MohLL,0);
  const ohCap=cap(+D.barTop,+D.sTop,+D.coverT,Mu_oh);
  // distribution reinforcement (9.7.3.2): % of bottom = 220/sqrt(S) <= 67%
  const distPct=Math.min(220/Math.sqrt(S*12)*0+ 220/Math.sqrt(S),67); // S in ft per legacy; clamp
  return {wDLslab,wDLws,Ls,SWpos,SWneg,MDL_pos,MDL_neg,MLL_pos,MLL_neg,Mu_pos,Mu_neg,
          MDC_pos,MDC_neg,MDW_pos,MDW_neg,A4,xneg,xnegAuto,dsRule:dsAuto.rule,
          pos,neg,oh,bBar,Pbar,Xoh,SWoh,MohDC,MohDW,MohDL,MohLL,Mu_oh,ohCap,distPct,fcd,fy,ts};
}
function distFactors(inp,g,cp){ // Type (k) I-girder, or NEXT double-tee; LRFD 4.6.2.2
  const S=inp.S, L=inp.L, ts=inp.ts, ld=inp.loads;
  // --- NEXT F double-tee: cross-section type (i)/(j) per LRFD T.4.6.2.2.1-1 (open multi-stem) ---
  if(g.isNext){
    const Wd=g.btf;                                  // deck/beam width, in
    const Nb=Math.max(2,Math.round(+inp.nGirders||4));// number of beams in the bridge
    // For multi-beam decks, distribution may be taken on a per-beam basis using beam width.
    // Use AASHTO type (i) double-tee moment DF (interior), in units of lanes per beam:
    // 1 lane: 0.06+(S/14)^0.4 ... but for spread/adjacent tees the deck-width formula is used.
    const Sf=Wd/12;                                  // beam width, ft (acts as 'S' for tees)
    const th=clamp(+ld.skew||0,0,60), tanT=Math.tan(th*Math.PI/180);
    // Kg term (Table 4.6.2.2.2b-1, types a/e/k and i/j acting as a unit): with a composite CIP
    // topping (ts > 0) Kg = n(I + A·eg²) of the basic beam is available, so the full expression is
    // used, together with the matching skew factors (4.6.2.2.2e c1, 4.6.2.2.3c). With no topping
    // (ts = 0) the "slab" is the integral flange and Kg is not defined here, so the simplified
    // (Kg term = 1) form is kept as before.
    const hasKg=(+ts>0);
    const nEIx=cp.Ecg/Math.max(cp.Ecd,1e-6);
    const egN=hasKg? (g.h+(+inp.th||0)+ts/2)-g.yb : 0;
    const KgN=hasKg? nEIx*(g.I+g.A*egN*egN) : 0;
    const ts3N=hasKg? ts**3 : 1;
    const kgtN=hasKg? Math.pow(KgN/(12*L*ts3N),0.1) : 1;
    const m1=0.06+Math.pow(Sf/14,0.4)*Math.pow(Sf/L,0.3)*kgtN;
    const m2=0.075+Math.pow(Sf/9.5,0.6)*Math.pow(Sf/L,0.2)*kgtN;
    const v1=0.36+Sf/25, v2=0.2+Sf/12-Math.pow(Sf/35,2);
    let skM, skV;
    if(hasKg){
      const c1N=th<30?0:0.25*Math.pow(KgN/(12*L*ts3N),0.25)*Math.pow(Sf/L,0.5);
      skM=1-c1N*Math.pow(tanT,1.5);
      skV=1+0.20*Math.pow(12*L*ts3N/KgN,0.3)*tanT;
    } else {
      skM=th<30?1:1-0.25*Math.pow(tanT,1.5);
      skV=1+0.20*tanT;
    }
    const dfmRaw=Math.max(m1,m2), dfvRaw=Math.max(v1,v2);
    return {Kg:KgN,eg:egN,kgt:kgtN,kgOmitted:!hasKg,m1,m2,v1,v2,skM,skV,th,ext:false,lever:0,eM:0,eV:0,rigid:0,rigidNL:0,
            dfmRaw,dfvRaw,dfm:dfmRaw*skM,dfv:dfvRaw*skV,isNext:true,Sf};
  }
  const nEI=cp.Ecg/cp.Ecd;
  const eg=(g.h+inp.th+ts/2)-g.yb;
  const Kg=nEI*(g.I+g.A*eg*eg);
  const ts3=Math.max(ts**3,1e-6);                    // guard ts=0
  const kgt=Math.pow(Kg/(12*L*ts3),0.1);
  const m1=0.06+Math.pow(S/14,0.4)*Math.pow(S/L,0.3)*kgt;
  const m2=0.075+Math.pow(S/9.5,0.6)*Math.pow(S/L,0.2)*kgt;
  const v1=0.36+S/25;
  const v2=0.2+S/12-Math.pow(S/35,2);
  // skew corrections (4.6.2.2.2e / 4.6.2.2.3c)
  const th=clamp(+ld.skew||0,0,60), tanT=Math.tan(th*Math.PI/180);
  const c1=th<30?0:0.25*Math.pow(Kg/(12*L*ts3),0.25)*Math.pow(S/L,0.5);
  const skM=1-c1*Math.pow(tanT,1.5);
  const skV=1+0.20*Math.pow(12*L*ts3/Kg,0.3)*tanT;
  const ext=ld.pos==='exterior';
  let lever=0,eM=0,eV=0,rigid=0,rigidNL=0;
  let dfmRaw=Math.max(m1,m2), dfvRaw=Math.max(v1,v2);
  if(ext){
    const de=+ld.de||0;
    // one loaded lane — lever rule, wheels 2 ft & 8 ft inboard of barrier face, m = 1.2
    let R=0; [de-2,de-8].forEach(x=>{ if(x>-S) R+=0.5*(S+x)/S; });
    lever=1.2*R;
    eM=0.77+de/9.1; eV=0.6+de/10;             // 2+ lanes: e × interior DF
    // rigid cross-section special analysis (C4.6.2.2.2d)
    const Nb=Math.max(2,Math.round(+inp.nGirders||2));
    const NLmax=clamp(Math.round(+ld.NL||1),1,4);
    const Xext=(Nb-1)*S/2;
    let sumX2=0; for(let i=0;i<Nb;i++){const xi=-Xext+i*S; sumX2+=xi*xi;}
    const mpf=[1.2,1.0,0.85,0.65];
    for(let NL=1;NL<=NLmax;NL++){
      let sumE=0; for(let j=0;j<NL;j++) sumE+=Xext+de-5-12*j;
      const rr=mpf[NL-1]*(NL/Nb+Xext*sumE/sumX2);
      if(rr>rigid){rigid=rr;rigidNL=NL;}
    }
    dfmRaw=Math.max(eM*m2, lever, rigid);
    dfvRaw=Math.max(eV*v2, lever, rigid);
  }
  return {Kg,eg,m1,m2,v1,v2,skM,skV,th,ext,lever,eM,eV,rigid,rigidNL,dfmRaw,dfvRaw,
          dfm:dfmRaw*skM, dfv:dfvRaw*skV};
}

/* ================= FLEXURE (LRFD 5.6.3) ================= */
function flexure(inp,g,cp,ss,x,Pe_fpe){
  const a_=ss.at(x);
  const Aps=a_.Aps;
  // No effective strand at this section (none defined, or all still inside transfer/debond): zero
  // capacity, but return every field so dv, the MCFT shear and the tables stay finite (was
  // {phiMn:0,phi:1} only → dv = NaN → NaN everywhere downstream).
  if(Aps<=0){ const fcd0=(+inp.ts)>0? inp.mat.fcd : inp.mat.fc;
    return {c:0,a:0,fps:0,fpsFull:0,devGov:false,dp:cp.hc,dpFull:cp.hc,dt:cp.hc,et:0.005,phi:1,rect:true,
            Mn:0,phiMn:0,b1:clamp(0.85-0.05*(fcd0-4),0.65,0.85)}; }
  const fpu=+inp.str.fpu, k=inp.str.lowlax?0.28:0.38;
  // compression material & flange: composite topping if present, else the girder's own top flange
  const hasTop=(+inp.ts)>0;
  const fcd = hasTop? inp.mat.fcd : inp.mat.fc;     // topping f'c, or girder f'c if no topping
  const b1=clamp(0.85-0.05*(fcd-4),0.65,0.85);
  const dp=cp.hc-a_.cgs;
  // flange thickness available in compression: topping + (haunch for I-girders); for NEXT no-topping use the integral flange thickness
  const hf = hasTop? (+inp.ts + (g.isNext?0:+inp.th)) : (g.isNext? g.next.ft : g.d[0]);
  const b=cp.beff, bwT=g.isNext? g.bw : g.btf;       // flange width (b) vs web/stem width below flange
  let c=Aps*fpu/(0.85*fcd*b1*b+k*Aps*fpu/dp), rect=true, Mn;
  if(b1*c>hf){ rect=false;
    c=(Aps*fpu-0.85*fcd*(b-bwT)*hf)/(0.85*fcd*b1*bwT+k*Aps*fpu/dp);
  }
  let a=b1*c, fpsFull=fpu*(1-k*c/dp), dpU=dp;
  if(rect) Mn=Aps*fpsFull*(dp-a/2);
  else Mn=Aps*fpsFull*(dp-a/2)+0.85*fcd*(b-bwT)*hf*(a/2-hf/2);
  /* Strand development, LRFD 5.9.4.3.2. Everything above assumes the strand can
     actually reach fps, which is only true once enough bonded length lies behind
     the section -- ld runs to roughly 13 ft on a 0.6" strand, so at the tenth
     point of a short span the full-development answer is fiction. ss.devForce
     sums A*f_dev over the bond groups and the harped strands; it already carries
     the transfer-length ramp, so it REPLACES the eff-ramped Aps rather than
     multiplying it. Where the available tension falls short the section is
     simply under-reinforced: hold T at what the strand can deliver and re-solve
     the compression block from T = C. At midspan devForce returns exactly
     Aps*fps and nothing below this line changes the answer. */
  const fpeUse=+Pe_fpe||0;
  const dev=(fpeUse>0&&ss.devForce)? ss.devForce(x,fpsFull,fpeUse) : null;
  let devGov=false, fps=fpsFull;
  if(dev && dev.T < Aps*fpsFull-1e-6){
    devGov=true;
    const T=Math.max(dev.T,0);
    fps = Aps>0? T/Aps : 0;                    // section-average developed stress
    dpU = cp.hc-(T>0? dev.cgs : a_.cgs);
    rect=true; a=T/(0.85*fcd*b);
    if(a>hf){ rect=false; a=Math.max((T-0.85*fcd*(b-bwT)*hf)/(0.85*fcd*bwT),0); }
    c=a/b1;
    Mn=Math.max(rect? T*(dpU-a/2) : T*(dpU-a/2)+0.85*fcd*(b-bwT)*hf*(a/2-hf/2), 0);
  }
  const dt=cp.hc-ss.yLow;
  const et=0.003*(dt/Math.max(c,1e-6)-1);
  const phi=clamp(0.75+0.25*(et-0.002)/0.003,0.75,1.0);
  return {c,a,fps,fpsFull,devGov,dp:dpU,dpFull:dp,dt,et,phi,rect,Mn,phiMn:phi*Mn,b1};
}
