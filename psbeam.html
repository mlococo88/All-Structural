        <Num l="Harp point (× L from each end)" v={inp.harp.frac} set={v=>u('harp.frac',v)} step={0.05}/>
      </div>
      {!R.error&&<div className="hint">e_mid = <b>{fmt(R.ss.eMid,2)} in</b> · e_end = <b>{fmt(R.ss.eEnd,2)} in</b> · transfer length ℓ_t = 60 d_b = <b>{fmt(R.ss.lt,1)} in</b> · P_jack = <b>{fmt(R.ss.Aps*inp.str.jack*inp.str.fpu,0)} kip</b></div>}
    </Card>

    </div>
    <div {...inPane('loads')}>
    <Card title="Loads" refTag="LRFD 3.6 / 4.6.2.2" fold>
      {(()=>{const LG=({tag,title,note,color})=><div style={{display:'flex',alignItems:'baseline',gap:8,
        margin:'2px 0 6px',paddingBottom:3,borderBottom:'1px solid var(--line2)'}}>
        <span style={{fontFamily:'var(--mono)',fontWeight:700,fontSize:12,color:color||'var(--ink)'}}>{tag}</span>
        <span style={{fontSize:11,letterSpacing:'.5px',textTransform:'uppercase',color:'var(--ink2)'}}>{title}</span>
        {note&&<span style={{fontSize:10.5,color:'var(--ink3,#9aa)',marginLeft:'auto'}}>{note}</span>}
      </div>;
      const ext=R.useExt;
      return <React.Fragment>

      {/* ---- shared dead-load channel (DC2 / DW from the LL & DL app) ---- */}
      <div className="btnrow" style={{margin:'0 0 8px',alignItems:'center'}}>
        {BLU.LockBtn
          ? <BLU.LockBtn ch="dlLoads" always
              label={dlLocked?'Following LL & DL':'⇩ Pull DC2 / DW from LL & DL'}
              onClick={(st,locked)=>{ if(locked) toggleDLLock(false); else pullDL(); }}/>
          : <button className="btn sm" onClick={pullDL}>⇩ Pull DC2 / DW from LL &amp; DL</button>}
        {BLU.LockToggle&&<BLU.LockToggle ch="dlLoads" onToggle={toggleDLLock}/>}
      </div>
      {dlLocked&&BLU.DrivenStrip&&<BLU.DrivenStrip ch="dlLoads" detail={dlSrc+dlNote} onUnlock={()=>toggleDLLock(false)}/>}
      {dlLocked&&ext&&<div className="hint" style={{margin:'0 0 10px',color:'#B45309',fontWeight:600}}>A MIDAS demand import is active, so DC2 and DW are taken from the imported envelope and the values this lock adopts are not used. The lock is still worth keeping on — it keeps them current for when the import is cleared — but the numbers driving this run are the MIDAS ones shown below.</div>}
      {(()=>{ const r=dlPeek; if(!r||r.why||!(r.cases||[]).length) return null;
        // How each published case is used HERE. Two of the four are deliberately not
        // adopted, and saying so on the row is the whole point of the table: a case that
        // simply does not appear reads as an app that missed it.
        const use=(k)=>{
          if(k==='DC1') return {t:'cross-check only — the deck is computed below from this app\'s own section',c:'var(--ink2)'};
          if(k==='PL')  return {t:'pedestrian LIVE load — not a DC/DW case; enter it on the LL group if it governs',c:'var(--ink2)'};
          if(ext)       return {t:'superseded by the MIDAS envelope — the imported demands are used instead',c:'#B45309'};
          const have=(k==='DC2')?dlHasBar:dlHasDW;
          return have&&dlLocked ? {t:'adopted → '+k+' below, following this publish',c:'#15803D'}
               : have           ? {t:'available — pull or lock to adopt it',c:'#B45309'}
                                : {t:'not published — your value below is kept',c:'var(--ink2)'};
        };
        const adopted=(r.cases||[]).filter(c=>(c.key==='DC2'||c.key==='DW')&&!ext).reduce((a,c)=>a+(+c.udl||0),0);
        return <div style={{margin:'0 0 12px',border:'1px solid var(--line2)',borderRadius:6,padding:'8px 10px',background:'var(--bg2,rgba(0,0,0,.015))'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap',marginBottom:5}}>
            <span style={{fontSize:11,letterSpacing:'.5px',textTransform:'uppercase',color:'var(--ink2)',fontWeight:600}}>Published by LL &amp; DL Distribution</span>
            <span style={{fontSize:10.5,color:'var(--ink3,#9aa)',marginLeft:'auto'}}>{r.src}{r.trib>0?' · tributary '+fmt(r.trib,2)+' ft':''}{r.Nb>0?' · '+r.Nb+' beams':''}{r.at?' · '+String(r.at).slice(0,16).replace('T',' '):''}</span>
          </div>
          <table className="eng" style={{width:'100%'}}>
            <thead><tr><th style={{textAlign:'left'}}>Case</th><th style={{textAlign:'left'}}>What it is</th><th>klf</th><th style={{textAlign:'left'}}>How this app uses it</th></tr></thead>
            <tbody>{(r.cases||[]).map((c,i)=>{const w=use(c.key); return <tr key={i}>
              <td style={{fontFamily:'var(--mono)',fontWeight:700}}>{c.key}</td>
              <td style={{color:'var(--ink2)'}}>{String(c.name||'').replace(/^[A-Z0-9]+\s*\u2014\s*/,'')}</td>
              <td style={{textAlign:'right',fontFamily:'var(--mono)'}}>{fmt(+c.udl||0,3)}</td>
              <td style={{color:w.c}}>{w.t}</td></tr>; })}
              <tr><td colSpan={2} style={{fontWeight:600}}>Adopted here as superimposed dead load</td>
                <td style={{textAlign:'right',fontFamily:'var(--mono)',fontWeight:700}}>{ext?'—':fmt(adopted,3)}</td>
                <td style={{color:'var(--ink2)'}}>{ext?'MIDAS envelope is driving DC2 and DW':'DC2 + DW, on the composite section'}</td></tr>
            </tbody>
          </table>
          {r.selfWt>0&&<div className="hint" style={{marginTop:5}}>The publish also carries the girder self-weight it assumed, <b>{fmt(r.selfWt,3)} klf</b>, but does not send it as a case &mdash; this app computes <b>{fmt(R.g.wsw,3)} klf</b> from the section{Math.abs(r.selfWt-R.g.wsw)/Math.max(R.g.wsw,1e-6)>0.05?<span style={{color:'#B45309',fontWeight:600}}> ({fmt(Math.abs(r.selfWt-R.g.wsw)/Math.max(R.g.wsw,1e-6)*100,0)}% apart — the two apps do not agree on the section)</span>:<span> ✓ consistent</span>}.</div>}
          {r.dc1>0&&(()=>{ const mine=R.cp.wdkDeck+R.cp.wdkHaunch, off=Math.abs(mine-r.dc1)/Math.max(r.dc1,1e-6);
            return <div className="hint" style={{marginTop:4}}><b>DC1 cross-check.</b> LL &amp; DL puts <b>{fmt(r.dc1,3)} klf</b> of deck on {r.trib>0?<b>{fmt(r.trib,2)} ft</b>:'the'} tributary width; this app computes deck + haunch = <b>{fmt(mine,3)} klf</b> from its own geometry{off>0.10?<span style={{color:'#B3261E',fontWeight:600}}> — {fmt(off*100,0)}% apart; check that deck thickness, haunch and girder spacing agree in both apps{inp.tsSeparate?<span>, and note this app is weighing a {fmt(R.cp.tsLoad,2)}″ dead-load deck against its {fmt(+inp.ts,2)}″ structural thickness</span>:null}</span>:<span> ✓ consistent</span>}. The lock never drives DC1, so the slab cannot be counted twice.</div>; })()}
        </div>; })()}

      {/* ---- DC1 — non-composite dead load (always app-computed) ---- */}
      <div style={{marginBottom:14}}>
        <LG tag="DC1" title="Non-composite dead load" color="#15803D"
           note={`on non-composite section · ${ext?'computed by app':'app'}`}/>
        <div className="frow rows">
          <Num l="Add'l non-comp distributed (forms)" u="klf" v={inp.loads.wNC} set={v=>u('loads.wNC',v)} step={0.01}/>
        </div>
        <div className="hint">
            {(+inp.loads.wNC)>0
              ? <span><b style={{color:'#15803D'}}>Included.</b> Your {fmt(+inp.loads.wNC,3)} klf is added to the computed self-weight and deck + haunch below — it is <b>not</b> touched by the LL &amp; DL lock, which drives DC2 and DW only.</span>
              : <span>Stay-in-place forms, utilities carried before the deck cures, or anything else on the bare girder. Whatever you enter here is added on top of the computed self-weight and deck + haunch, and is never overwritten by the LL &amp; DL lock.</span>}
        </div>
        {(()=>{ const wsw=R.g.wsw, wdD=R.cp.wdkDeck||0, wdH=R.cp.wdkHaunch||0, wnc=+inp.loads.wNC||0;
          const tot=wsw+wdD+wdH+wnc, wl=(+inp.mat.wcdLoad||+inp.mat.wcd);
          const SRC={app:{t:'computed here',c:'var(--ink2)'},you:{t:'YOUR INPUT',c:'#15803D'}};
          const row=(lbl,how,v,src,extra)=><tr style={src==='you'?{background:'rgba(21,128,61,.07)'}:null}>
            <td>{lbl}{extra?<div style={{fontSize:10.5,color:'#B45309'}}>{extra}</div>:null}</td>
            <td style={{color:'var(--ink2)',fontFamily:'var(--mono)',fontSize:11}}>{how}</td>
            <td style={{textAlign:'right',fontFamily:'var(--mono)'}}>{fmt(v,3)}</td>
            <td style={{color:SRC[src].c,fontSize:10.5,letterSpacing:'.4px',fontWeight:src==='you'?700:400}}>{SRC[src].t}</td></tr>;
          return <table className="eng" style={{width:'100%',marginTop:8}}>
            <thead><tr><th style={{textAlign:'left'}}>DC1 component</th><th style={{textAlign:'left'}}>How it is obtained</th><th>klf</th><th style={{textAlign:'left'}}>Source</th></tr></thead>
            <tbody>
              {row('Girder self-weight','A = '+fmt(R.g.A,0)+' in² × '+fmt(+inp.mat.wcLoad||+inp.mat.wc,3)+' kcf',wsw,'app')}
              {wdD>0&&row('Deck slab',fmt(R.cp.wdkW||0,1)+'″ × '+fmt(R.cp.tsLoad,2)+'″ × '+fmt(wl,3)+' kcf',wdD,'app',
                inp.tsSeparate?('weighed at the '+fmt(R.cp.tsLoad,2)+'″ dead-load thickness, not the '+fmt(+inp.ts,2)+'″ structural one'):null)}
              {wdH>0&&row('Haunch / build-up',fmt(R.cp.wdkHW||0,1)+'″ × '+fmt(+inp.th,2)+'″ × '+fmt(wl,3)+' kcf',wdH,'app')}
              {row("Add'l non-composite (forms)",wnc>0?'entered above':'entered above — currently zero',wnc,'you')}
              <tr style={{borderTop:'2px solid var(--line)',fontWeight:700}}>
                <td>Total distributed DC1</td>
                <td style={{color:'var(--ink2)',fontWeight:400,fontSize:11}}>on the bare non-composite girder</td>
                <td style={{textAlign:'right',fontFamily:'var(--mono)'}}>{fmt(tot,3)}</td><td></td></tr>
              {R.Pdia>0&&<tr><td>Diaphragm point loads</td>
                <td style={{color:'var(--ink2)',fontFamily:'var(--mono)',fontSize:11}}>{R.nDiaph} load{R.nDiaph!==1?'s':''}, listed below</td>
                <td style={{textAlign:'right',fontFamily:'var(--mono)'}}>{fmt(R.Pdia,2)} kip</td>
                <td style={{color:'#15803D',fontSize:10.5,letterSpacing:'.4px',fontWeight:700}}>YOUR INPUT</td></tr>}
            </tbody></table>; })()}
        <div style={{marginTop:8}}>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:4}}>
            <span style={{fontSize:11,letterSpacing:'.5px',textTransform:'uppercase',color:'var(--ink2)'}}>Diaphragm point loads (DC1)</span>
            <button className="btn sm" onClick={()=>u('loads.diaph',[...(inp.loads.diaph||[]),{P:0.66,a:0}])}>+ add</button>
          </div>
          {(inp.loads.diaph||[]).length===0
            ? <div className="hint" style={{marginTop:0}}>None. Add discrete diaphragm/intermediate point loads (kips at a distance from the left bearing) instead of, or in addition to, the distributed term above. Applied to the non-composite simple span.</div>
            : <table className="eng"><thead><tr><th>#</th><th>P (kip)</th><th>a from left brg (ft)</th><th></th></tr></thead>
              <tbody>{inp.loads.diaph.map((d,i)=><tr key={i}>
                <td>{i+1}</td>
                <td><input type="number" step="0.05" value={d.P} onChange={e=>{const a=[...inp.loads.diaph];a[i]={...a[i],P:+e.target.value};u('loads.diaph',a);}} style={{width:80,border:'1px solid var(--line)',fontFamily:'var(--mono)',fontSize:12,padding:'2px 5px',textAlign:'right'}}/></td>
                <td><input type="number" step="0.5" value={d.a} onChange={e=>{const a=[...inp.loads.diaph];a[i]={...a[i],a:+e.target.value};u('loads.diaph',a);}} style={{width:90,border:'1px solid var(--line)',fontFamily:'var(--mono)',fontSize:12,padding:'2px 5px',textAlign:'right'}}/></td>
                <td><button className="btn sm ghost" onClick={()=>u('loads.diaph',inp.loads.diaph.filter((_,j)=>j!==i))}>✕</button></td>
              </tr>)}</tbody></table>}
          {(inp.loads.diaph||[]).length>0&&<div className="hint" style={{marginTop:4}}>{R.nDiaph} diaphragm load{R.nDiaph!==1?'s':''}, ΣP = <b>{fmt(R.Pdia,2)} kip</b> on the span. Symmetric pairs (e.g. both ends, or thirds) are typical; place at the actual diaphragm locations for the correct moment/shear distribution.</div>}
        </div>
        <div className="hint" style={{marginTop:6}}>Every DC1 line above acts on the <b>bare, non-composite</b> girder, before the deck cures — which is why DC1 is computed here from this girder's own section rather than adopted from the LL &amp; DL app or the MIDAS envelope, both of which model the composite bridge. <b>The lock does not reach DC1</b>: the forms term and any diaphragm loads you enter are always carried in addition to the computed self-weight and deck + haunch.</div>
      </div>

      {/* ---- DC2 — composite superimposed dead load ---- */}
      <div style={{marginBottom:14}}>
        <LG tag="DC2" title="Composite superimposed dead load" color={ext?'#1C4FC4':'#15803D'}
           note={ext?'from MIDAS envelope':'on composite section · app'}/>
        {ext
          ? <div className="hint">Imported from MIDAS (barriers, parapets, sidewalks) acting on the composite section. Midspan M_DC2 ≈ <b>{fmt(Math.abs(R.diagrams.reduce((b,r)=>Math.abs(r.M_DC2)>Math.abs(b.M_DC2)?r:b).M_DC2),0)} k-ft</b>.</div>
          : <div className="frow rows"><Num l="Barrier / SIDL (per girder)" u="klf" v={inp.loads.wBar} set={v=>u('loads.wBar',v)} step={0.01} driven={dlLocked&&dlHasBar} src={dlSrc}/></div>}
      </div>

      {/* ---- DW — wearing surface & utilities ---- */}
      <div style={{marginBottom:14}}>
        <LG tag="DW" title="Wearing surface & utilities" color={ext?'#1C4FC4':'#B45309'}
           note={ext?'from MIDAS envelope':'on composite section · app'}/>
        {ext
          ? <div className="hint">Imported from MIDAS (future wearing surface, utilities). Midspan M_DW ≈ <b>{fmt(Math.abs(R.diagrams.reduce((b,r)=>Math.abs(r.M_DW)>Math.abs(b.M_DW)?r:b).M_DW),0)} k-ft</b>.</div>
          : <div className="frow rows"><Num l="Wearing surface (per girder)" u="klf" v={inp.loads.wDW} set={v=>u('loads.wDW',v)} step={0.01} driven={dlLocked&&dlHasDW} src={dlSrc}/></div>}
      </div>

      {/* ---- LL — live load ---- */}
      <div>
        <LG tag="LL" title="Live load + impact (per girder)" color={ext?'#1C4FC4':'#B3261E'}
           note={ext?'from MIDAS envelope · adjust below':'HL-93'}/>
        <div className="btnrow" style={{margin:'2px 0 6px',alignItems:'center'}}>
          {BLU.LockBtn
            ? <BLU.LockBtn ch="lldf" always
                label={lldfLocked?'Following LL & DL':'⇩ Pull from LL & DL'}
                onClick={(st,locked)=>{ if(locked) toggleLLDFLock(false); else pullLLDF(); }}/>
            : <button className="btn sm" onClick={pullLLDF}>⇩ Pull from LL &amp; DL</button>}
          {BLU.LockToggle&&<BLU.LockToggle ch="lldf" onToggle={toggleLLDFLock}/>}
          {BLU.LockBtn
            ? <BLU.LockBtn ch="geometry" always
                label={geomLocked?'Auto-sending geometry':'Send geometry to LL & DL \u2197'}
                onClick={(st,locked)=>{ if(locked) toggleGeomLock(false); else sendLLDF(); }}/>
            : <button className="btn sm ghost" onClick={sendLLDF} title="Send this girder's geometry (spans, spacing, deck, section properties) to the LL &amp; DL Distribution app and open it prefilled.">Send geometry to LL &amp; DL ↗</button>}
          {BLU.LockToggle&&<BLU.LockToggle ch="geometry" onToggle={toggleGeomLock}/>}
        </div>
        {lldfLocked&&BLU.DrivenStrip&&<BLU.DrivenStrip ch="lldf" detail={lldfSrc} onUnlock={()=>toggleLLDFLock(false)}/>}
        {(+inp.loads.fatM>0)&&<div className="hint" style={{marginTop:0,marginBottom:10}}>Fatigue DF override from LL &amp; DL: <b>{fmt(+inp.loads.fatM,3)}</b> (single-lane, no MPF) — used on the Fatigue tab in place of the DF÷1.2 estimate. <button className="btn sm ghost" style={{padding:'1px 8px',marginLeft:4}} onClick={()=>u('loads.fatM',0)}>clear → auto</button></div>}
        {ext
          ? <React.Fragment>
            <div className="hint" style={{marginBottom:8}}>Imported {inp.external.liveLoadType||'HL-93'} envelope from MIDAS, with the <b>dynamic load allowance (impact) already included</b>. Apply the distribution factor (per effect) and multiple-presence below if they are <i>not</i> already in the envelope (each defaults to 1.0 = no adjustment). Distribution factors are entered separately for positive moment, negative moment, and shear (AASHTO 4.6.2.2 gives different DFs for each).</div>
            <SubH t="Distribution factors" r="per effect · LRFD 4.6.2.2"/>
            <div className="frow rows">
              <Num l="DF — positive moment" v={inp.loads.extDFpos} set={v=>u('loads.extDFpos',v)} step={0.05} min={0} driven={lldfLocked} src={lldfSrc} blank1/>
              <Num l="DF — negative moment" v={inp.loads.extDFneg} set={v=>u('loads.extDFneg',v)} step={0.05} min={0} driven={lldfLocked} src={lldfSrc} blank1/>
              <Num l="DF — shear" v={inp.loads.extDFv} set={v=>u('loads.extDFv',v)} step={0.05} min={0} driven={lldfLocked} src={lldfSrc} blank1/>
            </div>
            <SubH t="Multiple presence" r="LRFD 3.6.1.1.2"/>
            <div className="frow rows">
              <Num l="Multiple presence (m)" v={inp.loads.extLLmpf} set={v=>u('loads.extLLmpf',v)} step={0.05} min={0} driven={lldfLocked} src={lldfSrc} blank1/>
            </div>
            <div className="hint" style={{marginTop:6}}>Combined factors (DF×MPF): +M = <b>{fmt(extFac1(inp.loads.extDFpos)*extFac1(inp.loads.extLLmpf),3)}</b>, −M = <b>{fmt(extFac1(inp.loads.extDFneg)*extFac1(inp.loads.extLLmpf),3)}</b>, V = <b>{fmt(extFac1(inp.loads.extDFv)*extFac1(inp.loads.extLLmpf),3)}</b>. Impact is already in the imported LL, so it is not applied here. Resulting governing M_LL ≈ <b>{fmt(R.MLL,0)} k-ft</b>, V_LL ≈ <b>{fmt(R.VLL,0)} kip</b> (see Diagrams).</div>
          </React.Fragment>
          : <React.Fragment>
            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <Seg opts={[{v:true,l:'AUTO HL-93 × DF'},{v:false,l:'MANUAL'}]} v={inp.loads.llAuto} set={v=>u('loads.llAuto',v)}/>
            </div>
            {!inp.loads.llAuto&&<div className="frow rows" style={{marginTop:8}}>
              <Num l="M (LL+IM) @ midspan" u="k-ft" v={inp.loads.MLL} set={v=>u('loads.MLL',v)} step={50}/>
              <Num l="V (LL+IM) @ support" u="kip" v={inp.loads.VLL} set={v=>u('loads.VLL',v)} step={5}/>
            </div>}
            {inp.loads.llAuto&&<div style={{marginTop:8}}>
              <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                <span style={{fontSize:11,color:'var(--ink2)'}}>Distribution factors:</span>
                {lldfLocked
                  ? <span className="xlink live" title="Distribution factors are locked to the LL & DL Distribution app — the AUTO/MANUAL choice is not available while locked."><span className="xlk">🔒</span><span>FROM LL &amp; DL</span></span>
                  : <Seg opts={[{v:true,l:'AUTO TYPE (k)'},{v:false,l:'MANUAL'}]} v={inp.loads.dfAuto} set={v=>u('loads.dfAuto',v)}/>}
                {inp.loads.dfAuto&&<Seg opts={[{v:'interior',l:'INTERIOR'},{v:'exterior',l:'EXTERIOR'}]} v={inp.loads.pos}
                  set={v=>set({...inp,loads:{...inp.loads,pos:v,posAuto:false}})}/>}
                {inp.loads.dfAuto&&<PosTag inp={inp} set={set}/>}
                {!inp.loads.dfAuto&&<><div className="fwrap" style={{width:90}}><input type="number" step="0.01" value={inp.loads.dfm} readOnly={lldfLocked} className={lldfLocked?'bl-driven':undefined} title={lldfLocked?('Driven by '+lldfSrc+' — unlock to edit.'):undefined} onChange={e=>{ if(lldfLocked) return; u('loads.dfm',+e.target.value); }}/><span className="unit">DFm</span></div>
                <div className="fwrap" style={{width:90}}><input type="number" step="0.01" value={inp.loads.dfv} readOnly={lldfLocked} className={lldfLocked?'bl-driven':undefined} title={lldfLocked?('Driven by '+lldfSrc+' — unlock to edit.'):undefined} onChange={e=>{ if(lldfLocked) return; u('loads.dfv',+e.target.value); }}/><span className="unit">DFv</span></div>
                {lldfLocked&&<span className="bl-src" style={{alignSelf:'center'}}>{lldfSrc}</span>}</>}
              </div>
              {inp.loads.dfAuto&&<div className="frow rows" style={{marginTop:8}}>
                {inp.loads.pos==='exterior'&&<Num l="d_e — ext. web to barrier face" u="ft" v={inp.loads.de} set={v=>u('loads.de',v)} step={0.25}/>}
                {inp.loads.pos==='exterior'&&<Num l="Design lanes N_L" v={inp.loads.NL} set={v=>u('loads.NL',v)} step={1} min={1}/>}
                <Num l="Skew angle" u="°" v={inp.loads.skew} set={v=>u('loads.skew',v)} step={5} min={0}/>
              </div>}
              {!R.error&&<div className="hint">HL-93: M_truck = <b>{fmt(R.hl.Mtr,0)}</b>, M_tandem = <b>{fmt(R.hl.Mtd,0)}</b>, M_lane = <b>{fmt(R.hl.Mln,0)} k-ft</b> → 1.33·truck + lane = <b>{fmt(R.hl.M,0)} k-ft/lane</b><br/>
              {R.df.ext?<React.Fragment>Exterior: lever rule (1 ln, m=1.2) = <b>{fmt(R.df.lever,3)}</b> · e·DF_int = <b>{fmt(R.df.eM*R.df.m2,3)}</b> (e = {fmt(R.df.eM,3)}) · rigid section ({R.df.rigidNL} ln) = <b>{fmt(R.df.rigid,3)}</b><br/></React.Fragment>
              :<React.Fragment>Interior: DF_m = max({fmt(R.df.m1,3)}, {fmt(R.df.m2,3)}) (eq. 4.6.2.2.2b-1, K_g = {fmt(R.df.Kg,0)} in⁴){R.df.isNext?(R.df.kgOmitted?' · NEXT, no topping: K_g term omitted (taken as 1.0)':' · NEXT: S = beam width '+fmt(R.df.Sf,2)+' ft, (K_g/12Lt_s³)^0.1 = '+fmt(R.df.kgt,3)):''}<br/></React.Fragment>}
              {R.df.th>0&&<React.Fragment>Skew {fmt(R.df.th,0)}°: moment × <b>{fmt(R.df.skM,3)}</b> (4.6.2.2.2e) · shear × <b>{fmt(R.df.skV,3)}</b> (4.6.2.2.3c)<br/></React.Fragment>}
              DF_m = <b>{fmt(R.dfm,3)}</b> · DF_v = <b>{fmt(R.dfv,3)}</b> → <b>M_LL+IM = {fmt(R.MLL,0)} k-ft</b> · <b>V_LL+IM = {fmt(R.VLL,0)} kip</b></div>}
              {!R.error&&(R.g.isBox||R.g.isDeck)&&inp.loads.dfAuto&&<div className="callout warn">⚠ <b>Adjacent box / deck beams use different distribution-factor equations</b> (LRFD 4.6.2.2.2b type f/g with the I/J torsion term), which this app does not auto-compute. The auto DF above uses the I-girder (type k) formula and may be significantly off for adjacent-beam bridges. Compute DF_m and DF_v per Table 4.6.2.2.2b-1 / 4.6.2.2.3a-1 and enter them with the MANUAL toggle.</div>}
            </div>}
          </React.Fragment>}
      </div>
      </React.Fragment>;})()}
    </Card>

    <Card title="Continuity for LL + SIDL" refTag="LRFD 5.12.3.3 / 3.6.1.3.1" fold
      right={<Seg opts={[{v:false,l:'OFF — SIMPLE SPAN'},{v:true,l:'ON'}]} v={inp.cont.on} set={v=>u('cont.on',v)}/>}>
      {inp.cont.on?<React.Fragment>
        <SubH t="Negative-moment deck reinforcement" r="over the pier"/>
        <div className="frow rows">
          <Num l="Deck rebar A_s in b_eff" u="in²" v={inp.cont.As} set={v=>u('cont.As',v)} step={0.5}/>
          <Num l="Top of deck → bar CG" u="in" v={inp.cont.dTop} set={v=>u('cont.dTop',v)} step={0.25}/>
          <Num l="Rebar f_y" u="ksi" v={inp.cont.fy} set={v=>u('cont.fy',v)} step={5}/>
        </div>
        {!R.error&&R.cont&&<div className="hint">Pier M_u = <b>{fmt(R.cont.MuN/12,0)} k-ft</b> vs φM_n = <b>{fmt(R.cont.phiMnN/12,0)} k-ft</b> (D/C = <b>{fmt(R.cont.dc,2)}</b>) · LL gov: {R.cont.negLL.gov} · details on the Flexure tab.</div>}
        <div className="callout" style={{marginTop:8}}>Two <b>equal adjacent spans</b> assumed for the continuous pier moment (DC2 + DW: wL²/8; HL-93 by influence-line enumeration incl. the 3.6.1.3.1 two-truck case). Positive-moment design and shear remain on the simple-span basis (conservative for positive moment; check pier-region shear separately).</div>

        <SubH t="Restraint moments — creep &amp; shrinkage" r="PCA method"/>
        <div className="frow rows">
          <Fld l="Compute restraint moments">
            <Seg opts={[{v:false,l:'OFF'},{v:true,l:'ON'}]} v={!!inp.cont.restraint} set={v=>u('cont.restraint',v)}/></Fld>
        </div>
        {inp.cont.restraint&&R.cont.restr&&(()=>{const rr=R.cont.restr; return <React.Fragment>
          <table className="eng" style={{marginTop:6}}>
            <thead><tr><th>Component</th><th>Base M (k-ft)</th><th>Restraint M (k-ft)</th><th>Sense</th></tr></thead>
            <tbody>
              <tr><td>Prestress creep</td><td style={{textAlign:'right'}}>{fmt(rr.Mps_cont/12,0)}</td><td style={{textAlign:'right'}}>+{fmt(rr.Mps_cr/12,0)}</td><td>sagging (+)</td></tr>
              <tr><td>Dead-load creep</td><td style={{textAlign:'right'}}>{fmt(rr.Mdl_cont/12,0)}</td><td style={{textAlign:'right'}}>{fmt(rr.Mdl_cr/12,0)}</td><td>hogging (−)</td></tr>
              <tr><td>Differential shrinkage</td><td style={{textAlign:'right'}}>—</td><td style={{textAlign:'right'}}>{fmt(rr.Msh/12,0)}</td><td>hogging (−)</td></tr>
              <tr style={{fontWeight:700,borderTop:'1.5px solid var(--line2)'}}><td>Net restraint moment</td><td></td><td style={{textAlign:'right'}}>{rr.net_kft>=0?'+':''}{fmt(rr.net_kft,0)}</td><td>{rr.net_kft>=0?'positive':'negative'}</td></tr>
            </tbody>
          </table>
          <div className="hint" style={{marginTop:4}}>Φ (creep coeff.) = <b>{fmt(rr.Phi,3)}</b> · development (1−e<sup>−Φ</sup>) = <b>{fmt(rr.develBefore,3)}</b> · continuity factor (1−e<sup>−Φ</sup>)/Φ = <b>{fmt(rr.cfBefore,3)}</b> · M<sub>cr</sub> (girder bottom, +M) = <b>{fmt(rr.Mcr_kft,0)} k-ft</b>. {rr.net_kft>0? <React.Fragment>Net is <b>positive</b> ({fmt(rr.net_kft,0)} {'>'} 0) → a positive-moment connection is required at the diaphragm{rr.net_kft>rr.Mcr_kft?' and the restraint exceeds M_cr, so the connection will crack — design positive-moment reinforcement per 5.12.3.3':''}.</React.Fragment> : <React.Fragment>Net is <b>negative</b> → adds to the deck negative-moment demand at the pier; no positive-moment connection demand.</React.Fragment>}</div>
          <div className="callout" style={{marginTop:8}}>PCA method (PCI Journal, 1969): restraint moments from time-dependent prestress camber, dead-load, and differential shrinkage after the girder is made continuous. Base continuity moments use the equal-adjacent-span idealization with PCA coefficients (prestress 0.68·Pe, DL 0.38·wL²/8); each develops through creep by (1−e<sup>−Φ</sup>). <b>Approximate and model-sensitive</b> — magnitudes depend strongly on the creep/shrinkage model and the connection age; verify against a time-step analysis for final design.</div>
        </React.Fragment>;})()}
      </React.Fragment>
      :<div className="hint">Girder treated as a simple span for all loads. Turn on to check the deck-reinforced negative-moment section over the pier when the span is made continuous for live load.</div>}
    </Card>

    </div>
    <div {...inPane('hd')}>
    <Card title="Handling — Lifting & Hauling" refTag="PCI / Mast · release stage" fold
      right={<Seg opts={[{v:false,l:'OFF'},{v:true,l:'ON'}]} v={inp.handling.on} set={v=>u('handling.on',v)}/>}>
      {inp.handling.on?<React.Fragment>
        <SubH t="Support points" r="measured from the girder end"/>
        <div className="frow rows">
          <Num l="Lift point from end" u="ft" v={inp.handling.aLift} set={v=>u('handling.aLift',v)} step={0.5}/>
          <Num l="Bunk (haul support) from end" u="ft" v={inp.handling.aHaul} set={v=>u('handling.aHaul',v)} step={0.5}/>
        </div>
        <SubH t="Lateral stability" r="Mast method"/>
        <div className="frow rows">
          <Num l="Initial CG sweep e_i" u="in" v={inp.handling.ei} set={v=>u('handling.ei',v)} step={0.05}
               sub="fabrication tolerance on lateral straightness"/>
          <Num l="Roll center ht (haul)" u="in" v={inp.handling.hr} set={v=>u('handling.hr',v)} step={2}/>
          <Num l="Road cross slope θ_i" u="rad" v={inp.handling.theta_i} set={v=>u('handling.theta_i',v)} step={0.005}/>
        </div>
        {!R.error&&R.handling&&<div className="hint">Lift stress (most tensile) = <b>{fmt(Math.min(R.handling.lift.fMidTop,R.handling.lift.fMidBot,R.handling.lift.fSupTop,R.handling.lift.fSupBot),3)} ksi</b> vs −{fmt(R.handling.limT,3)} · FS_crack lift = <b>{fmt(R.handling.FScrLift,2)}</b> · haul = <b>{fmt(R.handling.FScrHaul,2)}</b> · details on the Handling tab.</div>}
        <div className="callout" style={{marginTop:8}}>Release-stage overhang stresses at the pick/bunk points plus simplified Mast lateral-stability factors of safety against cracking. Approximate weak-axis inertia from the section outline. Verify against the fabricator's rigging and the PCI stability spreadsheet for long or slender members before relying on it.</div>
      </React.Fragment>
      :<div className="hint">Turn on to check stresses at the lifting/hauling support points and lateral roll stability (Mast method).</div>}
    </Card>

    <Card title="Deck Design (Transverse)" refTag="LRFD 4.6.2.1 / 9.7.3" fold
      right={<Seg opts={[{v:false,l:'OFF'},{v:true,l:'ON'}]} v={inp.deck.on} set={v=>u('deck.on',v)}/>}>
      {inp.deck.on?<React.Fragment>
        <SubH t="Geometry &amp; loading"/>
        <div className="frow rows">
          <Num l="Overhang (web→edge)" u="ft" v={inp.deck.oh} set={v=>u('deck.oh',v)} step={0.25}/>
          <Num l="Future wearing surf." u="ksf" v={inp.deck.wsFut} set={v=>u('deck.wsFut',v)} step={0.005} sub="DW — factored at 1.50, separately from the DC slab"/>
          <Num l="Barrier base width" u="in" v={inp.deck.bBar} set={v=>u('deck.bBar',v)} step={1} sub="sets where the design wheel lands: 1 ft clear of the railing face"/>
          <Num l="Barrier weight" u="klf" v={inp.deck.wBar} set={v=>u('deck.wBar',v)} step={0.05}/>
        </div>
        <SubH t="Negative-moment design section" r="LRFD 4.6.2.1.6"/>
        <div className="frow rows">
          <Fld l="Design section from girder CL" sub={R.deck?R.deck.dsRule:'b_tf/3 ≤ 15 in for a precast I or open box'}>
            <Seg opts={[{v:true,l:'AUTO'},{v:false,l:'MANUAL'}]} v={inp.deck.xnegAuto!==false} set={v=>u('deck.xnegAuto',v)}/></Fld>
          {inp.deck.xnegAuto===false
            ? <Num l="Design section x" u="in" v={inp.deck.xneg} set={v=>u('deck.xneg',v)} step={1} sub="Table A4-1 tabulates 0 to 24 in; values between are interpolated"/>
            : (!R.error&&R.deck?<Fld l="Design section x" sub="computed from the top-flange width"><b>{fmt(R.deck.xneg,1)}</b> in</Fld>:null)}
        </div>
        <SubH t="Transverse reinforcement" r="per foot of deck"/>
        <div className="frow rows">
          <Num l="Rebar f_y" u="ksi" v={inp.deck.fyd} set={v=>u('deck.fyd',v)} step={5}/>
          <Num l="Top bar area" u="in²" v={inp.deck.barTop} set={v=>u('deck.barTop',v)} step={0.01}/>
          <Num l="Top bar spacing" u="in" v={inp.deck.sTop} set={v=>u('deck.sTop',v)} step={0.5}/>
          <Num l="Bottom bar area" u="in²" v={inp.deck.barBot} set={v=>u('deck.barBot',v)} step={0.01}/>
          <Num l="Bottom bar spacing" u="in" v={inp.deck.sBot} set={v=>u('deck.sBot',v)} step={0.5}/>
        </div>
        <SubH t="Cover" r="LRFD 5.10.1"/>
        <div className="frow rows">
          <Num l="Top cover" u="in" v={inp.deck.coverT} set={v=>u('deck.coverT',v)} step={0.25}/>
          <Num l="Bottom cover" u="in" v={inp.deck.coverB} set={v=>u('deck.coverB',v)} step={0.25}/>
        </div>
        {!R.error&&R.deck&&<div className="hint">+M: M_u = <b>{fmt(R.deck.Mu_pos,2)}</b> vs φM_n = <b>{fmt(R.deck.pos.phiMn,2)}</b> · −M: <b>{fmt(R.deck.Mu_neg,2)}</b> vs <b>{fmt(R.deck.neg.phiMn,2)} k-ft/ft</b> · details on the Deck tab.</div>}
        <div className="callout" style={{marginTop:8}}>Interior-bay live load comes from <b>AASHTO Table A4-1</b>, interpolated on girder spacing and on the design-section distance; those tabulated moments already carry the multiple presence factors and the 33% impact, so no further IM is applied. Dead load uses simplified continuous-beam factors (wS²/10 and /11) with DC at 1.25 and the wearing surface as DW at 1.50. The overhang is the gravity + barrier case on the 45+10X strip; the A13 collision (Extreme Event II) design cases are not included.</div>
      </React.Fragment>
      :<div className="hint">Turn on to design the transverse deck reinforcement (interior bays + overhang) by the equivalent-strip method.</div>}
    </Card>

    </div>
    <div {...inPane('opts')}>
    <Card title="Analysis Options" refTag="5.9.3 losses · 5.9.2.3 stresses" fold>
      <SubH t="Prestress losses" r="LRFD 5.9.3"/>
      <div className="frow rows">
        <Fld l="Loss method" sub="refined time-step vs. the lump-sum approximate estimate">
          <Seg opts={[{v:'refined',l:'REFINED 5.9.3.4'},{v:'approx',l:'APPROX 5.9.3.3'}]} v={inp.opt.lossMethod} set={v=>u('opt.lossMethod',v)}/></Fld>
        <Fld l="Deck shrinkage gain ΔfpSS" sub="5.9.3.4.3d — the deck shrinking against the composite section">
          <Seg opts={[{v:true,l:'AUTO 5.9.3.4.3d'},{v:false,l:'MANUAL'}]} v={!!inp.opt.dfpSSauto} set={v=>u('opt.dfpSSauto',v)}/></Fld>
        {!inp.opt.dfpSSauto&&<Num l="ΔfpSS (entered)" u="ksi" v={inp.opt.dfpSS} set={v=>u('opt.dfpSS',v)} step={0.1}/>}
      </div>
      <SubH t="Service stresses" r="LRFD 5.9.2.3"/>
      <div className="frow rows">
        <Fld l="Release stress section" sub="gross girder, or transformed for the strands">
          <Seg opts={[{v:false,l:'GROSS'},{v:true,l:'TRANSFORMED'}]} v={inp.opt.useTrans} set={v=>u('opt.useTrans',v)}/></Fld>
        <Num l="γLL Service III" v={inp.opt.gLLs3} set={v=>u('opt.gLLs3',v)} step={0.1}
             sub="0.8 for components with bonded strand, 1.0 otherwise (Table 3.4.1-1)"/>
        <Fld l="Corrosion exposure" sub="sets the Service III tension limit: 0.19√f′c vs. zero tension">
          <Seg opts={[{v:'normal',l:'MODERATE'},{v:'severe',l:'SEVERE'}]} v={inp.opt.corrosion} set={v=>u('opt.corrosion',v)}/></Fld>
      </div>
      {!R.error&&inp.opt.dfpSSauto&&+inp.ts>0&&<div className="hint" style={{marginTop:2}}>Deck-shrinkage gain computed per 5.9.3.4.3d = <b>{fmt(R.gains.deckShrAuto,2)} ksi</b> (deck shrinks against the composite section, relieving strand stress). Switch to MANUAL to override.</div>}
    </Card>

    </div>
    <div {...inPane('reinf')}>
    <Card title="Shear &amp; Longitudinal Reinforcement (Trial)" refTag="LRFD 5.7" fold>
      <SubH t="Transverse reinforcement — stirrups" r="LRFD 5.7.2"/>
      <div className="frow rows">
        <Num l="A_v per set (2 legs)" u="in²" v={inp.opt.stirAv} set={v=>u('opt.stirAv',v)} step={0.02}/>
        <Num l="f_y stirrups" u="ksi" v={inp.opt.fy} set={v=>u('opt.fy',v)} step={5}/>
        <Num l="End-zone spacing" u="in" v={inp.opt.sEnd} set={v=>u('opt.sEnd',v)} step={1}/>
        <Num l="End zone length (× L)" v={inp.opt.endZoneLen} set={v=>u('opt.endZoneLen',v)} step={0.05}
             sub="fraction of the span over which the tighter end spacing runs"/>
        <Num l="Interior spacing" u="in" v={inp.opt.sInt} set={v=>u('opt.sInt',v)} step={1}/>
      </div>
      <SubH t="Longitudinal mild steel — shear/flexure tie" r="LRFD 5.7.3.5"/>
      <div className="frow rows">
        <Num l="A_s bottom (end region)" u="in²" v={inp.opt.longAsBot} set={v=>u('opt.longAsBot',v)} step={0.1}/>
        <Num l="f_y" u="ksi" v={inp.opt.longFy} set={v=>u('opt.longFy',v)} step={5}/>
        <Num l="Girder end past bearing" u="in" v={inp.opt.endOh} set={v=>u('opt.endOh',v)} step={1}
             sub="overhang beyond the bearing centerline — strand development starts here"/>
        <Num l="Bearing pad length" u="in" v={inp.opt.Lpad} set={v=>u('opt.Lpad',v)} step={1}/>
      </div>
      <div className="hint">Bottom longitudinal bars in the end region — the flexural-tension face for simple-span shear — add A_s·f_y = <b>{fmt((+inp.opt.longAsBot||0)*(+inp.opt.longFy||0),0)} kip</b> to the strand tie capacity (5.7.3.5), where fully developed. This matters most <b>at the bearing</b>, where the strands are barely developed and the tie relies on these bars. Count only bars anchored past the section. Negative-moment (pier) reinforcement is entered separately under continuity (checked by flexural resistance, not this tie).</div>
      <div className="hint" style={{marginTop:4}}>The <b>5.7.3.5 tie</b> is checked with the shear-only demand (Eq 5.7.3.5-2) at the <b>inside edge of the bearing pad</b>, taken at <b>{fmt((+inp.opt.Lpad||0)/2,1)}″</b> = ½ × {fmt(+inp.opt.Lpad||0,0)}″ pad from the bearing centerline, and with the full flexure + shear demand (Eq 5.7.3.5-1) at every section inboard. The strands develop from the girder <b>end</b>, so the <b>development length available at that bearing edge is the overhang + ½ the pad = {fmt((+inp.opt.endOh||0)+(+inp.opt.Lpad||0)/2,1)}″</b> from the girder end. This overhang credit is intentionally kept out of the release/service prestress ramp, which stays conservative. {!R.error&&R.wLong?<span>Governing tie section x = {fmt(R.wLong.x,1)} ft: strand tie force <b>{fmt(R.wLong.Tcap-((+inp.opt.longAsBot||0)*(+inp.opt.longFy||0)),0)} kip</b>, plus mild-bar A_s·f_y.</span>:''}</div>
    </Card>

    <Card title="End-Region / Anchorage Zone" refTag="LRFD 5.9.4.4 · 5.9.2.3.1b" fold>
      <SubH t="Bonded reinforcement at release tension" r="LRFD 5.9.2.3.1b"/>
      <div className="frow rows">
        <Fld l="Bonded reinf. @ release tens." sub="YES claims the higher 0.24√f′ci tension limit">
          <Seg opts={[{v:true,l:'YES (0.24√f′ci)'},{v:false,l:'NO'}]} v={inp.opt.relBondedReinf} set={v=>u('opt.relBondedReinf',v)}/></Fld>
        {inp.opt.relBondedReinf&&<Num l="Provided A_s (tension zone)" u="in²" v={inp.opt.relAs} set={v=>u('opt.relAs',v)} step={0.1}/>}
        {inp.opt.relBondedReinf&&<Num l="f_y of that steel" u="ksi" v={inp.opt.relFy} set={v=>u('opt.relFy',v)} step={5}/>}
        {inp.opt.relBondedReinf&&<div className="fld"><label>Required A_s (computed)</label>
          <div className="fwrap"><input value={fmt(R.relSteel.AsReq,2)} disabled style={{color:R.relSteel.ok?'#15803D':'#B3261E',fontWeight:600}}/></div><span className="unit">in²</span></div>}
      </div>
      {!R.error&&inp.opt.relBondedReinf&&<div className="hint" style={{marginTop:4}}>The higher 0.24√f′ci release-tension limit applies only where bonded steel carries the concrete tensile force, at a stress of 0.5f_y ≤ 30 ksi (here <b>{fmt(R.relSteel.fs,1)} ksi</b>). Governing tensile force <b>T = {fmt(R.relSteel.T,1)} kip</b> at the {R.relSteel.where} at x = {fmt(R.relSteel.x,1)} ft → required A_s = T/{fmt(R.relSteel.fs,1)} = <b>{fmt(R.relSteel.AsReq,2)} in²</b>. {R.relSteel.ok
        ? <span style={{color:'#15803D',fontWeight:600}}>Provided {fmt(R.relSteel.AsProv,2)} in² ≥ required — the 0.24√f′ci limit is justified.</span>
        : <span style={{color:'#B3261E',fontWeight:600}}>Provided {fmt(R.relSteel.AsProv,2)} in² is LESS than required — add steel, or switch to NO (the code then requires the lower min(0.0948√f′ci, 0.2 ksi) limit).</span>} Voids are ignored in the tensile-force integration, so the required steel is if anything conservative.</div>}
      {!inp.opt.relBondedReinf&&<div className="hint" style={{marginTop:4}}>NO: the lower release-tension limit min(0.0948√f′ci, 0.2 ksi) is used and no bonded auxiliary steel is required. Switch to YES to claim the higher 0.24√f′ci limit and enter/verify the steel.</div>}

      <SubH t="Anchorage-zone splitting steel" r="LRFD 5.9.4.4 — within h/4 of the end"/>
      <div className="frow rows">
        <Num l="Area per leg" u="in²" v={inp.opt.splitAv} set={v=>u('opt.splitAv',v)} step={0.01}/>
        <Num l="No. of legs (within h/4)" v={inp.opt.splitN} set={v=>u('opt.splitN',v)} step={1}/>
      </div>
      <div className="hint">{R.splitDir==='width'?'Horizontal':'Vertical'} reinforcement resisting bursting must develop ≥ 4% of the prestress force at a stress ≤ 20 ksi, placed within h/4 = {fmt(R.splitZone,1)}″ of the member end (h = overall {R.splitDir} = {fmt(R.splitH,1)}″). Provided = (legs)×(area/leg) = <b>{fmt(R.AsSplitProv,2)} in²</b> vs required <b>{fmt(R.AsSplit,2)} in²</b>{R.splitN_need>0&&<span> (≈ {R.splitN_need} legs of this bar)</span>}.</div>

      <SubH t="Confinement reinforcement" r="LRFD 5.9.4.4.2 — within 1.5d of the end"/>
      {R.conf.exempt
        ? <div className="hint" style={{marginTop:4}}>Not required for this section — {R.conf.why}.</div>
        : <div><div className="frow rows">
            <Num l="Bar no. (≥ 3)" v={inp.opt.confBar} set={v=>u('opt.confBar',v)} step={1}/>
            <Num l="Spacing (≤ 6″)" u="in" v={inp.opt.confS} set={v=>u('opt.confS',v)} step={0.5}/>
            <Num l="No. of bars from end" v={inp.opt.confN} set={v=>u('opt.confN',v)} step={1}/>
          </div>
          <div className="hint">Bars shaped to <b>enclose the strands in the bottom flange</b>, not less than No. 3, spaced no more than 6″, over 1.5d = <b>{fmt(R.conf.reqExt,1)}″</b> from each end. Provided extent = (n−1)s = <b>{fmt(R.conf.provExt,1)}″</b>{R.conf.nNeed>0&&<span> — {R.conf.nNeed} bars at this spacing cover 1.5d</span>}. This is a prescriptive detailing rule, so there is no demand to compute: the app checks bar size, spacing and extent only, and <b>cannot confirm the bars are shaped to enclose the strands</b> — verify that on the detail.</div>
        </div>}
    </Card>
    </div>
  </div>);
}

/* ================= RESULT TABS ================= */
function SectionTab({inp,R}){
  const g=R.g,cp=R.cp,m=inp.mat,ss=R.ss;
  const wj=weakAxisAndJ(g);   // bare-girder weak-axis (lateral) inertia I_y, torsion J, weak modulus S_y
  // plate breakdown for the weak-axis derivation
  const wkD=(()=>{
    if(g.isBox||g.isDeck){ const w=+g.w||+g.btf||+g.bw, h=+g.h, vw=+g.voidW||0, vh=+g.voidH||0, nv=+g.voids||(vw>0?1:0);
      const outer=h*Math.pow(w,3)/12, voids=(nv&&vw>0)?nv*vh*Math.pow(vw,3)/12:0;
      return {type:'box', w,h,vw,vh,nv, outer, voids, Iy:outer-voids, closed:(vw>0&&vh>0), J:wj.J}; }
    if(g.isNext){ const B=(g.next&&+g.next.B)||10, cc=(g.next&&+g.next.stemCC)||60, w=+g.btf||+g.w, h=+g.h, hs=Math.max(1,h-8);
      return {type:'next', B,cc,w,h,hs, Iy:wj.Iweak, J:wj.J}; }
    const d=g.d||[6,3,6,6], ttf=(+d[0]||0)+(+d[1]||0), tbf=(+d[2]||0)+(+d[3]||0), hw=Math.max(1,g.h-ttf-tbf);
    const Itf=ttf*Math.pow(g.btf,3)/12, Ibf=tbf*Math.pow(g.bbf,3)/12, Iw=hw*Math.pow(g.bw,3)/12;
    return {type:'igirder', ttf,tbf,hw,btf:g.btf,bbf:g.bbf,bw:g.bw, Itf,Ibf,Iw, Iy:Itf+Ibf+Iw, J:wj.J};
  })();
  const ts=+inp.ts, th=+inp.th, incH=cp.incHaunch, hcGap=incH?th:0;
  const Ad=cp.beff*cp.n*ts, yd=g.h+hcGap+ts/2, Ah=incH?g.btf*cp.n*th:0, yh=g.h+th/2;
  const Ic2=g.A*(cp.ybc-g.yb)**2, Ic3=cp.beff*cp.n*ts**3/12, Ic4=Ad*(yd-cp.ybc)**2,
        Ic5=incH?g.btf*cp.n*th**3/12:0, Ic6=incH?Ah*(yh-cp.ybc)**2:0;
  return(<div>
    <Rebar3D inp={inp} R={R}/>
    <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
      <Card title="Non-Composite (Gross Girder)" refTag={inp.girder}>
        <KV rows={[['A — area',fmt(g.A,0),'in²'],['I_x — strong-axis moment of inertia',fmt(g.I,0),'in⁴'],
          ['y_b / y_t',`${fmt(g.yb,2)} / ${fmt(g.yt,2)}`,'in'],
          ['S_b — bottom modulus',fmt(g.Sb,0),'in³'],['S_t — top modulus',fmt(g.St,0),'in³'],
          ['I_y — weak (lateral) axis',fmt(wj.Iweak,0),'in⁴'],
          ['S_y — weak-axis modulus',fmt(wj.Sy,0),'in³'],
          ['J — St-Venant torsion',fmt(wj.J,0),'in⁴'],
          ['Self-weight',fmt(g.wsw,3),'klf'],['E_ci / E_c',`${fmt(R.lo.Eci,0)} / ${fmt(cp.Ecg,0)}`,'ksi']]}/>
        <div className="hint" style={{marginTop:6}}>Weak-axis <b>I_y</b> and torsion <b>J</b> are the <b>bare girder</b> (the deck is not a full-width composite flange for one girder's lateral bending, so I_y &lt; strong-axis composite I_c). <b>These are the values exported to the MCT app</b> as the MIDAS section's I_zz (weak) and I_xx (torsion); strong-axis composite I_c goes to I_yy.</div>
      </Card>
      <Card title="Composite (Transformed Deck)" refTag="LRFD 4.6.2.6">
        <KV rows={[['n = E_deck / E_girder',fmt(cp.n,3),''],['b_eff (trans. = '+fmt(cp.beff*cp.n,1)+'″)',fmt(cp.beff,0),'in'],
          ['A_c',fmt(cp.Ac,0),'in²'],['I_c',fmt(cp.Ic,0),'in⁴'],
          ['y_bc / h_c',`${fmt(cp.ybc,2)} / ${fmt(cp.hc,1)}`,'in'],
          ['S_bc — bottom of girder',fmt(cp.Sbc,0),'in³'],
          ['S_tg — top of girder',fmt(cp.Stg,0),'in³'],
          ['S_td — top of deck (÷n)',fmt(cp.Std,0),'in³'],
          ['Deck + haunch DL',fmt(cp.wdk,3),'klf']]}/>
      </Card>
    </div>

    <Deriv title="Derivation — Elastic Moduli" refTag="LRFD 5.4.2.4">
      <VarTable rows={[
        ['w_c','Girder unit weight (modulus)',+m.wc,'kcf'],
        ['w_c,load','Girder unit weight (dead load)',+m.wcLoad||+m.wc,'kcf'],
        ['w_cd','Deck unit weight (modulus)',+m.wcd,'kcf'],
        ['w_cd,load','Deck unit weight (dead load)',+m.wcdLoad||+m.wcd,'kcf'],
        ["f'_ci","Girder strength at release",+m.fci,'ksi'],
        ["f'_c","Girder 28-day strength",+m.fc,'ksi'],
        ["f'_cd","Deck strength",+m.fcd,'ksi'],
        ['E_ci','Girder modulus at release',R.lo.Eci,'ksi'],
        ['E_c','Girder modulus, 28-day',cp.Ecg,'ksi'],
        ['E_cd','Deck modulus',cp.Ecd,'ksi'],
        ['n','Modular ratio E_cd/E_c',cp.n,'—'],
      ]}/>
      <Step d="Release / 28-day girder modulus">
        <ML s={Tx`E_{ci}=120{,}000\,K_1 w_c^{2}(f'_{ci})^{0.33}=120{,}000(1.0)(${nx(m.wc,3)})^{2}(${nx(m.fci,2)})^{0.33}=${nx(R.lo.Eci,0)}\;\mathrm{ksi}`}/>
        <ML s={Tx`E_{c}=120{,}000(${nx(m.wc,3)})^{2}(${nx(m.fc,2)})^{0.33}=${nx(cp.Ecg,0)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Deck modulus & modular ratio" r="LRFD 4.6.2.6">
        <ML s={Tx`E_{cd}=120{,}000(${nx(m.wcd,3)})^{2}(${nx(m.fcd,2)})^{0.33}=${nx(cp.Ecd,0)}\;\mathrm{ksi}\qquad n=\frac{E_{cd}}{E_c}=\frac{${nx(cp.Ecd,0)}}{${nx(cp.Ecg,0)}}=${nx(cp.n,4)}`}/>
      </Step>
    </Deriv>

    <Deriv title="Derivation — Composite Section by Transformed Areas" refTag="LRFD 4.6.2.6.1">
      <VarTable rows={[
        ['A_g','Gross girder area',R.g.A,'in²'],
        ['I_g','Gross girder inertia',R.g.I,'in⁴'],
        ['y_b','Girder centroid to bottom',R.g.yb,'in'],
        ['h','Girder depth',R.g.h,'in'],
        ['t_s','Structural deck thickness',+inp.ts,'in'],
        ['b_eff','Effective deck width',cp.beff,'in'],
        ['n','Modular ratio',cp.n,'—'],
        ['A_c','Composite area',cp.Ac,'in²'],
        ['I_c','Composite inertia',cp.Ic,'in⁴'],
        ['y_bc','Composite centroid to bottom',cp.ybc,'in'],
        ['S_bc','Composite modulus, girder bottom',cp.Sbc,'in³'],
        ['S_tg','Composite modulus, girder top',cp.Stg,'in³'],
        ['S_td','Composite modulus, deck top (÷n)',cp.Std,'in³'],
      ]}/>
      <Step d={incH?"Transformed deck & haunch (multiply concrete width by n)":"Transformed deck (haunch excluded from properties; deck bears on top flange)"}>
        <ML s={Tx`A_d=n\,b_{eff}\,t_s=${nx(cp.n,4)}(${nx(cp.beff,0)})(${nx(ts,2)})=${nx(Ad,1)}\;\mathrm{in^2}\;\text{ at }\;y_d=h${incH?'+t_h':''}+\tfrac{t_s}{2}=${nx(yd,2)}\;\mathrm{in}`}/>
        {incH&&<ML s={Tx`A_h=n\,b_{tf}\,t_h=${nx(cp.n,4)}(${nx(g.btf,0)})(${nx(th,2)})=${nx(Ah,1)}\;\mathrm{in^2}\;\text{ at }\;y_h=h+\tfrac{t_h}{2}=${nx(yh,2)}\;\mathrm{in}`}/>}
        {!incH&&<div style={{fontSize:11.5,color:'var(--ink2)'}}>Haunch neglected in section properties (typical practice); its self-weight is still carried in DC.</div>}
      </Step>
      <Step d="Composite area & centroid (measured from girder soffit)">
        <ML s={Tx`A_c=A_g+A_d${incH?'+A_h':''}=${nx(g.A,0)}+${nx(Ad,1)}${incH?`+${nx(Ah,1)}`:''}=${nx(cp.Ac,0)}\;\mathrm{in^2}`}/>
        <ML s={Tx`y_{bc}=\frac{A_g y_b+A_d y_d${incH?'+A_h y_h':''}}{A_c}=\frac{${nx(g.A,0)}(${nx(g.yb,2)})+${nx(Ad,1)}(${nx(yd,2)})${incH?`+${nx(Ah,1)}(${nx(yh,2)})`:''}}{${nx(cp.Ac,0)}}=${nx(cp.ybc,2)}\;\mathrm{in}`}/>
      </Step>
      <Step d="Composite inertia — parallel-axis theorem">
        <ML s={incH?Tx`I_c=\underbrace{I_g+A_g(y_{bc}-y_b)^2}_{\text{girder}}+\underbrace{\tfrac{n b_{eff}t_s^3}{12}+A_d(y_d-y_{bc})^2}_{\text{deck}}+\underbrace{\tfrac{n b_{tf}t_h^3}{12}+A_h(y_h-y_{bc})^2}_{\text{haunch}}`:Tx`I_c=\underbrace{I_g+A_g(y_{bc}-y_b)^2}_{\text{girder}}+\underbrace{\tfrac{n b_{eff}t_s^3}{12}+A_d(y_d-y_{bc})^2}_{\text{deck}}`}/>
        <ML s={Tx`I_c=${nx(g.I,0)}+${nx(Ic2,0)}+${nx(Ic3,0)}+${nx(Ic4,0)}${incH?`+${nx(Ic5,0)}+${nx(Ic6,0)}`:''}=${nx(cp.Ic,0)}\;\mathrm{in^4}`}/>
      </Step>
      <Step d="Section moduli (deck divided by n returns to deck-concrete stress)">
        <ML s={Tx`S_{bc}=\frac{I_c}{y_{bc}}=\frac{${nx(cp.Ic,0)}}{${nx(cp.ybc,2)}}=${nx(cp.Sbc,0)}\;\mathrm{in^3}\qquad S_{tg}=\frac{I_c}{h-y_{bc}}=\frac{${nx(cp.Ic,0)}}{${nx(g.h-cp.ybc,2)}}=${nx(cp.Stg,0)}\;\mathrm{in^3}`}/>
        <ML s={Tx`S_{td}=\frac{I_c}{n\,(h_c-y_{bc})}=\frac{${nx(cp.Ic,0)}}{${nx(cp.n,4)}(${nx(cp.hc-cp.ybc,2)})}=${nx(cp.Std,0)}\;\mathrm{in^3}\qquad h_c=h+t_h+t_s=${nx(cp.hc,1)}\;\mathrm{in}`}/>
      </Step>
      <Step d="Tributary deck + haunch dead load">
        <ML s={Tx`w_{dk}=\frac{S\cdot12\,t_{s,DL}}{144}w_{cd,load}+\frac{b_{tf}t_h}{144}w_{cd,load}=\frac{${nx(inp.S*12,0)}(${nx(cp.tsLoad,2)})}{144}(${nx(+m.wcdLoad||+m.wcd,3)})+\frac{${nx(g.btf,0)}(${nx(th,2)})}{144}(${nx(+m.wcdLoad||+m.wcd,3)})=${nx(cp.wdk,3)}\;\mathrm{klf}`}/>
        {inp.tsSeparate&&<div className="hint" style={{marginTop:2}}>t_<sub>s,DL</sub> = <b>{fmt(cp.tsLoad,2)}″</b> is the <b>dead-load</b> deck thickness, not the {fmt(+inp.ts,2)}″ structural thickness used for the section properties above — the separate-thickness toggle is on.</div>}
      </Step>
    </Deriv>

    <Deriv title="Derivation — Weak-Axis (Lateral) Inertia I_y & Torsion J" refTag="bare girder · about vertical CL">
      <div style={{fontSize:11.5,color:'var(--ink2)',marginBottom:6}}>
        The weak (lateral) axis bends the girder about its <b>vertical centroidal axis</b>, using the <b>bare girder only</b> — the deck spans transversely between girders and is not a full-width composite flange for one girder's lateral bending. For a <b>wide, shallow</b> section (deck / box beam) I_y can exceed the shallow gravity-axis I_x, because the section is much wider than deep — that is correct geometry, not an error.
      </div>
      {wkD.type==='igirder' && <React.Fragment>
        <VarTable rows={[
          ['b_tf / t_tf','Top flange width / thk',`${fmt(wkD.btf,1)} / ${fmt(wkD.ttf,2)}`,'in'],
          ['b_bf / t_bf','Bottom flange width / thk',`${fmt(wkD.bbf,1)} / ${fmt(wkD.tbf,2)}`,'in'],
          ['b_w / h_w','Web width / clear height',`${fmt(wkD.bw,1)} / ${fmt(wkD.hw,1)}`,'in']]}/>
        <Step d="Sum each plate's own weak-axis inertia about the vertical CL (plates are centered on it → no parallel-axis term)">
          <ML s={Tx`I_y=\frac{t_{tf}b_{tf}^3}{12}+\frac{t_{bf}b_{bf}^3}{12}+\frac{h_w b_w^3}{12}=\frac{${nx(wkD.ttf,2)}(${nx(wkD.btf,1)})^3}{12}+\frac{${nx(wkD.tbf,2)}(${nx(wkD.bbf,1)})^3}{12}+\frac{${nx(wkD.hw,1)}(${nx(wkD.bw,1)})^3}{12}`}/>
          <ML s={Tx`I_y=${nx(wkD.Itf,0)}+${nx(wkD.Ibf,0)}+${nx(wkD.Iw,0)}=${nx(wkD.Iy,0)}\;\mathrm{in^4}`}/>
        </Step>
      </React.Fragment>}
      {wkD.type==='box' && <React.Fragment>
        <VarTable rows={[['w','Section width',wkD.w,'in'],['h','Section depth',wkD.h,'in'],
          ...(wkD.nv?[['void','Void w × h × count',`${fmt(wkD.vw,1)} × ${fmt(wkD.vh,1)} × ${wkD.nv}`,'in']]:[])]}/>
        <Step d="Solid rectangle about the vertical CL, minus voids (a 48-wide plank is far stiffer bending sideways than the shallow gravity direction)">
          <ML s={Tx`I_y=\frac{h\,w^3}{12}${wkD.nv?`-${wkD.nv}\\cdot\\frac{h_v w_v^3}{12}`:''}=\frac{${nx(wkD.h,1)}(${nx(wkD.w,1)})^3}{12}${wkD.nv?`-${wkD.nv}\\frac{${nx(wkD.vh,1)}(${nx(wkD.vw,1)})^3}{12}`:''}=${nx(wkD.Iy,0)}\;\mathrm{in^4}`}/>
        </Step>
      </React.Fragment>}
      {wkD.type==='next' && <Step d="Two stems about the vertical CL — parallel-axis term dominates (stems spread ±c/c/2) — plus flange">
        <ML s={Tx`I_y\approx 2\!\left[\frac{B\,h_s^3}{12}+B h_s\!\left(\tfrac{c/c}{2}\right)^2\right]+\frac{8\,w^3}{12}=${nx(wkD.Iy,0)}\;\mathrm{in^4}`}/>
      </Step>}
      <Step d="St-Venant torsion J (open thin-walled plates; closed single-cell for box beams)">
        <ML s={Tx`J\approx ${wkD.type==='box'&&wkD.closed?'\\frac{4A_e^2}{\\oint ds/t}':'\\textstyle\\sum \\tfrac{1}{3}\\,b\\,t^3'}=${nx(wkD.J,0)}\;\mathrm{in^4}`}/>
      </Step>
      <div className="hint" style={{marginTop:6}}>These bare-girder values export to the MCT / MIDAS section as <b>I_zz</b> (weak) and <b>I_xx</b> (torsion); the composite <b>I_c</b> = <b>{fmt(cp.Ic,0)} in⁴</b> goes to <b>I_yy</b> (strong / gravity bending). For a straight, simply-supported line-girder model, I_zz and J don't affect the moments and shears — override them in the MCT app if you prefer.</div>
    </Deriv>

    <Card title="Eccentricity & Effective Strands Along Span">
      <Fig h={300} data={[
        {x:R.grid.map(r=>r.x),y:R.grid.map(r=>r.e),name:'e(x) in',line:{color:'#C2271D',width:2}},
        {x:R.grid.map(r=>r.x),y:R.grid.map(r=>r.Aps),name:'Aps eff (in²)',yaxis:'y2',line:{color:'#1C4FC4',width:2,dash:'dot'}}]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'e (in)'},
          yaxis2:{overlaying:'y',side:'right',title:'Aps (in²)',gridcolor:'rgba(0,0,0,0)'}}}/>
      <div className="callout">Eccentricity reflects harping and debonding; effective area ramps over the transfer length ℓ_t = 60d_b from each bond point (LRFD 5.9.4.3).</div>
    </Card>
  </div>);
}

function LossesTab({inp,R}){
  const lo=R.lo, rf=lo.ref, fin=R.refFin, useRef_=inp.opt.lossMethod==='refined';
  const g=R.g,cp=R.cp,ss=R.ss,m=inp.mat,Ep=+inp.str.Ep,em=ss.eMid;
  const X1=g.I+em*em*g.A, MgM=R.wG*R.L*R.L/8*12;
  const ktdID=ktdAASHTO(m.td-m.ti,m.fci), ktdIF=ktdAASHTO(m.tfin-m.ti,m.fci),
        ktdDF=ktdAASHTO(m.tfin-m.td,m.fci), ktdK=12*(100-4*m.fci)/(m.fci+20);
  const gh=1.7-0.01*m.H, gst=5/(1+m.fci);
  const Mbar=inp.loads.wBar*R.L*R.L/8*12, Mdw=inp.loads.wDW*R.L*R.L/8*12;
  const rMid=R.grid.reduce((b,r)=>Math.abs(r.x-R.L/2)<Math.abs(b.x-R.L/2)?r:b,R.grid[0]);
  return(<div>
    <div className="bigres">
      <div className="br"><div className="l">Elastic shortening</div><div className="n">{fmt(lo.dfES,2)}</div><div className="u">ksi · 5.9.3.2.3a</div></div>
      <div className="br"><div className="l">Long-term ({useRef_?'refined':'approx.'})</div><div className="n">{fmt(R.LT,2)}</div><div className="u">ksi</div></div>
      <div className="br"><div className="l">Total loss</div><div className="n">{fmt(R.totalLoss,2)}</div><div className="u">ksi = {fmt(R.pctLoss,1)}% of f_pj</div></div>
      <div className="br"><div className="l">Effective f_pe</div><div className="n">{fmt(R.fpe,2)}</div><div className="u">ksi · P_e = {fmt(R.ss.Aps*R.fpe,0)} kip</div></div>
    </div>

    <Card title="Elastic Gains" refTag="LRFD C5.9.3.4.3">
      <div className="hint" style={{marginBottom:8}}>Loads applied <i>after</i> transfer bend the girder and reduce concrete compression at the strand level, which <b>increases</b> strand stress — an elastic gain that partly offsets the time-dependent losses. Computed as Δf_p = (E_p/E_c)·(M·e / I) on the section resisting each load. Sign convention: + = stress increase (gain).</div>
      <table className="eng">
        <thead><tr><th>Source</th><th>Section</th><th>Δf_p (ksi)</th><th>ΔP_e (kip)</th><th>Type</th></tr></thead>
        <tbody>
          <tr><td>Precast loads (deck + haunch)</td><td>non-composite</td><td style={{textAlign:'right'}}>+{fmt(R.gains.precast,2)}</td><td style={{textAlign:'right'}}>+{fmt(R.gains.precast*ss.Aps,0)}</td><td>permanent</td></tr>
          <tr><td>Composite loads (DC2 + DW)</td><td>composite</td><td style={{textAlign:'right'}}>+{fmt(R.gains.composite,2)}</td><td style={{textAlign:'right'}}>+{fmt(R.gains.composite*ss.Aps,0)}</td><td>permanent</td></tr>
          <tr><td>Live load (LL + IM)</td><td>composite</td><td style={{textAlign:'right'}}>+{fmt(R.gains.live,2)}</td><td style={{textAlign:'right'}}>+{fmt(R.gains.live*ss.Aps,0)}</td><td>transient</td></tr>
          {(Math.abs(R.gains.deckShr)>0.005)&&<tr><td>Deck shrinkage {inp.opt.dfpSSauto?'(auto)':'(input)'}</td><td>composite</td><td style={{textAlign:'right'}}>+{fmt(R.gains.deckShr,2)}</td><td style={{textAlign:'right'}}>+{fmt(R.gains.deckShr*ss.Aps,0)}</td><td>permanent</td></tr>}
          <tr style={{fontWeight:700,borderTop:'1.5px solid var(--line2)'}}><td>Permanent gains (precast + composite{(Math.abs(R.gains.deckShr)>0.005)?' + deck shr.':''})</td><td></td><td style={{textAlign:'right'}}>+{fmt(R.gains.permanent+R.gains.deckShr,2)}</td><td style={{textAlign:'right'}}>+{fmt((R.gains.permanent+R.gains.deckShr)*ss.Aps,0)}</td><td></td></tr>
        </tbody>
      </table>
      <div className="hint" style={{marginTop:8}}>f_pe with permanent gains credited = f_pe + Δf_p,perm = {fmt(R.fpe,2)} + {fmt(R.gains.permanent+R.gains.deckShr,2)} = <b>{fmt(R.fpeGain+R.gains.deckShr,2)} ksi</b> (P_e = {fmt((R.fpeGain+R.gains.deckShr)*ss.Aps,0)} kip). The transient live-load gain ({fmt(R.gains.live,2)} ksi) applies only in limit states containing live load. The headline service checks use the conservative f_pe (losses only); these gains quantify the available margin.</div>
    </Card>

    <Card title="Strand Force & Stress by Row and Stage" refTag="per-row eccentricity (5.9.3)">
      {(()=>{const S=R.strandStages, rows=S.rows; return <React.Fragment>
      <div className="hint" style={{marginBottom:8}}>Each row evaluated at its own eccentricity — the elastic-shortening, creep, and elastic-gain components scale with the concrete stress at that strand level, so lower (more eccentric) rows lose slightly more. Shrinkage and relaxation are position-independent. Stresses in ksi, forces in kip (force = stress × strands × {fmt(S.Ab,3)} in²/strand).</div>
      <table className="eng">
        <thead>
          <tr><th rowSpan="2">Row<br/>y (in)</th><th rowSpan="2">e<br/>(in)</th><th rowSpan="2">n</th><th colSpan="2">At release</th><th colSpan="2">After transfer→deck</th><th colSpan="2">Permanent (final)</th></tr>
          <tr><th>f_pt (ksi)</th><th>P (kip)</th><th>f_pD (ksi)</th><th>P (kip)</th><th>f_pe (ksi)</th><th>P (kip)</th></tr>
        </thead>
        <tbody>
          {rows.map((r,i)=><tr key={i}>
            <td style={{whiteSpace:'nowrap'}}>{fmt(r.y,1)}{r.harped?<span style={{color:'var(--harp)',fontWeight:700}}> H</span>:''}</td>
            <td style={{textAlign:'right'}}>{fmt(r.e,1)}</td>
            <td style={{textAlign:'right'}}>{r.n}</td>
            <td style={{textAlign:'right'}}>{fmt(r.fpt,1)}</td><td style={{textAlign:'right'}}>{fmt(r.Ppt,0)}</td>
            <td style={{textAlign:'right'}}>{fmt(r.fpDeck,1)}</td><td style={{textAlign:'right'}}>{fmt(r.PpDeck,0)}</td>
            <td style={{textAlign:'right'}}>{fmt(r.fpe,1)}</td><td style={{textAlign:'right'}}>{fmt(r.Ppe,0)}</td>
          </tr>)}
          <tr style={{fontWeight:700,borderTop:'1.5px solid var(--line2)'}}>
            <td>Total</td><td></td><td style={{textAlign:'right'}}>{S.tot.n}</td>
            <td></td><td style={{textAlign:'right'}}>{fmt(S.tot.Ppt,0)}</td>
            <td></td><td style={{textAlign:'right'}}>{fmt(S.tot.PpDeck,0)}</td>
            <td></td><td style={{textAlign:'right'}}>{fmt(S.tot.Ppe,0)}</td>
          </tr>
        </tbody>
      </table>
      <div className="hint" style={{marginTop:4}}>“H” = harped group (at its midspan CG). Permanent stage shown without elastic gains; with permanent gains credited, add ≈ {fmt(R.gains.permanent+R.gains.deckShr,2)} ksi (see Elastic Gains). Total P_e = <b>{fmt(S.tot.Ppe,0)} kip</b> = A_ps·f_pe (group).</div>

      {rows.length>0&&<Deriv title={`Worked example — row at y = ${fmt(rows[0].y,1)}″ (e = ${fmt(rows[0].e,1)}″)`} refTag="one row; table covers all">
        <Step d="Eccentricity stress factor (this row vs the strand-group centroid)">
          <ML s={Tx`r_i=\dfrac{1/A_g+e_i\,e_{cg}/I_g}{1/A_g+e_{cg}^2/I_g}=\dfrac{1/${nx(S.ref.Ag,0)}+(${nx(rows[0].e,1)})(${nx(S.ref.ecg,1)})/${nx(S.ref.Ig,0)}}{1/${nx(S.ref.Ag,0)}+(${nx(S.ref.ecg,1)})^2/${nx(S.ref.Ig,0)}}=${nx(rows[0].fac,3)}`}/>
        </Step>
        <Step d="At release — subtract elastic shortening (scaled to this row)">
          <ML s={Tx`f_{pt}=f_{pbt}-r_i\,\Delta f_{pES}=${nx(S.fpbt,1)}-(${nx(rows[0].fac,3)})(${nx(S.ref.dfES,2)})=${nx(rows[0].fpt,1)}\;\mathrm{ksi}`}/>
          <ML s={Tx`P=f_{pt}\,n\,A_b=${nx(rows[0].fpt,1)}(${rows[0].n})(${nx(S.Ab,3)})=${nx(rows[0].Ppt,0)}\;\mathrm{kip}`}/>
        </Step>
        <Step d="After transfer → deck placement — less the interval time-dependent losses (5.9.3.4.2)">
          <ML s={Tx`\Delta f_{TD}=\Delta f_{pSR}+r_i\,\Delta f_{pCR}+\Delta f_{pR1}=${nx(S.ref.dfSR,2)}+(${nx(rows[0].fac,3)})(${nx(S.ref.dfCR,2)})+${nx(S.ref.dfR1,2)}=${nx(rows[0].dTDdeck,2)}\;\mathrm{ksi}`}/>
          <ML s={Tx`f_{pD}=f_{pt}-\Delta f_{TD}=${nx(rows[0].fpt,1)}-${nx(rows[0].dTDdeck,2)}=${nx(rows[0].fpDeck,1)}\;\mathrm{ksi}\qquad P=${nx(rows[0].PpDeck,0)}\;\mathrm{kip}`}/>
        </Step>
        <Step d="Permanent (final) — less all long-term losses (eccentricity-dependent share scaled)">
          <ML s={Tx`f_{pe}=f_{pbt}-r_i\,\Delta f_{pES}-\Delta f_{pLT,i}=${nx(rows[0].fpe,1)}\;\mathrm{ksi}\qquad P=${nx(rows[0].Ppe,0)}\;\mathrm{kip}`}/>
        </Step>
      </Deriv>}
      </React.Fragment>;})()}
    </Card>

    <Deriv title="Derivation — Elastic Shortening" refTag="LRFD C5.9.3.2.3a-1">
      <VarTable rows={[
        ['f_pbt','Stress immediately before transfer',R.fpbt,'ksi'],
        ['A_ps','Total strand area',ss.Aps,'in²'],
        ['e_m','Strand eccentricity at midspan',em,'in'],
        ['A_g','Gross girder area',g.A,'in²'],
        ['I_g','Gross girder inertia',g.I,'in⁴'],
        ['E_ci','Girder modulus at release',lo.Eci,'ksi'],
        ['E_p','Strand modulus',Ep,'ksi'],
        ['M_g','Self-weight moment at midspan',MgM/12,'k-ft'],
        ['Δf_pES','Elastic shortening loss',lo.dfES,'ksi'],
        ['f_cgp','Concrete stress at strand CG',lo.fcgp,'ksi'],
      ]}/>
      <Step d="Stress before transfer & midspan self-weight moment">
        <ML s={Tx`f_{pbt}=${nx(+inp.str.jack,2)}f_{pu}=${nx(R.fpbt,2)}\;\mathrm{ksi}\qquad M_g=\frac{w_{sw}L^2}{8}=\frac{${nx(R.wG,3)}(${nx(R.L,0)})^2}{8}=${nx(MgM,0)}\;\mathrm{k\text{-}in}`}/>
      </Step>
      <Step d="Closed-form solution (avoids iteration on Pi)">
        <ML s={Tx`\Delta f_{pES}=\frac{A_{ps}f_{pbt}(I_g+e_m^2A_g)-e_m M_g A_g}{A_{ps}(I_g+e_m^2A_g)+\dfrac{A_g I_g E_{ci}}{E_p}}`}/>
        <ML s={Tx`I_g+e_m^2A_g=${nx(g.I,0)}+(${nx(em,2)})^2(${nx(g.A,0)})=${nx(X1,0)}\;\mathrm{in^4}`}/>
        <ML s={Tx`\Delta f_{pES}=\frac{${nx(ss.Aps,3)}(${nx(R.fpbt,2)})(${nx(X1,0)})-${nx(em,2)}(${nx(MgM,0)})(${nx(g.A,0)})}{${nx(ss.Aps,3)}(${nx(X1,0)})+\dfrac{${nx(g.A,0)}(${nx(g.I,0)})(${nx(lo.Eci,0)})}{${nx(Ep,0)}}}=${nx(lo.dfES,2)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Resulting force and concrete stress at strand c.g.">
        <ML s={Tx`f_{pt}=f_{pbt}-\Delta f_{pES}=${nx(lo.fpt,2)}\;\mathrm{ksi}\qquad P_i=A_{ps}f_{pt}=${nx(lo.Pi,0)}\;\mathrm{kip}`}/>
        <ML s={Tx`f_{cgp}=\frac{P_i}{A_g}+\frac{P_i e_m^2}{I_g}-\frac{M_g e_m}{I_g}=${nx(lo.Pi/g.A,3)}+${nx(lo.Pi*em*em/g.I,3)}-${nx(MgM*em/g.I,3)}=${nx(lo.fcgp,3)}\;\mathrm{ksi}`}/>
      </Step>
    </Deriv>

    {useRef_?
    <Deriv title="Derivation — Refined Long-Term Losses" refTag="LRFD 5.9.3.4">
      <VarTable rows={[
        ['H','Ambient relative humidity',+inp.mat.H,'%'],
        ['V/S','Volume-to-surface ratio',+inp.mat.VS,'in'],
        ['k_s','Size factor',rf.ks,'—'],
        ['k_hs','Humidity factor (shrinkage)',rf.khs,'—'],
        ['k_hc','Humidity factor (creep)',rf.khc,'—'],
        ['k_f','Strength factor',rf.kf,'—'],
        ['ψ_b(t_f,t_i)','Girder creep coeff. (ultimate)',rf.psiBIF,'—'],
        ['K_id','Transient-section gain factor',rf.Kid,'—'],
        ['K_df','Composite-section gain factor',rf.Kdf,'—'],
        ['Δf_pSR','Shrinkage loss (transfer→deck)',rf.dfSR,'ksi'],
        ['Δf_pCR','Creep loss (transfer→deck)',rf.dfCR,'ksi'],
        ['Δf_pR1','Relaxation loss (transfer→deck)',rf.dfR1,'ksi'],
        ['Δf_pSD','Shrinkage loss (deck→final)',rf.dfSD,'ksi'],
        ['Δf_pLT','Total long-term loss',R.LT,'ksi'],
      ]}/>
      <Step d="Section & material factors" r="5.4.2.3">
        <ML s={Tx`k_s=\max(1.45-0.13\tfrac{V}{S},1.0)=${nx(rf.ks,3)}\quad k_{hs}=2.00-0.014H=${nx(rf.khs,3)}\quad k_{hc}=1.56-0.008H=${nx(rf.khc,3)}\quad k_f=\frac{5}{1+f'_{ci}}=${nx(rf.kf,3)}`}/>
        <ML s={Tx`k_{td}(t)=\frac{t}{12\left(\frac{100-4f'_{ci}}{f'_{ci}+20}\right)+t}:\;\;k_{td}^{id}=\frac{${nx(m.td-m.ti,0)}}{${nx(ktdK,1)}+${nx(m.td-m.ti,0)}}=${nx(ktdID,3)}\quad k_{td}^{if}=${nx(ktdIF,3)}\quad k_{td}^{df}=${nx(ktdDF,3)}`}/>
      </Step>
      <Step d="Shrinkage strains & creep coefficients" r="5.4.2.3.2/3">
        <ML s={Tx`\varepsilon_{bid}=k_s k_{hs} k_f k_{td}^{id}(0.48\times10^{-3})=${nx(rf.eShID*1e6,1)}\times10^{-6}\quad \varepsilon_{bif}=${nx(rf.eShIF*1e6,1)}\times10^{-6}`}/>
        <ML s={Tx`\psi(t,t_i)=1.9k_s k_{hc}k_f k_{td}t_i^{-0.118}:\;\;\psi_{bid}=${nx(rf.psiBID,3)}\quad \psi_{bif}=${nx(rf.psiBIF,3)}\quad \psi_{bdf}=${nx(rf.psiBDF,3)}`}/>
      </Step>
      <Step d="Age-adjusted transformed factors">
        <ML s={Tx`K_{id}=\left[1+\frac{E_p}{E_{ci}}\frac{A_{ps}}{A_g}\left(1+\frac{A_g e_m^2}{I_g}\right)(1+0.7\psi_{bif})\right]^{-1}=${nx(rf.Kid,3)}`}/>
        <ML s={Tx`e_{pc}=y_{bc}-\bar y_{ps}=${nx(cp.ybc,2)}-${nx(ss.cgsMid,3)}=${nx(rf.epc,2)}\;\mathrm{in}\qquad K_{df}=${nx(rf.Kdf,3)}\;(\text{composite }A_c,I_c,e_{pc})`}/>
      </Step>
      <Step d="Transfer → deck placement">
        <ML s={Tx`\Delta f_{pSR}=\varepsilon_{bid}E_p K_{id}=(${nx(rf.eShID*1e6,1)}\times10^{-6})(${nx(Ep,0)})(${nx(rf.Kid,3)})=${nx(rf.dfSR,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pCR}=\frac{E_p}{E_{ci}}f_{cgp}\psi_{bid}K_{id}=\frac{${nx(Ep,0)}}{${nx(lo.Eci,0)}}(${nx(lo.fcgp,3)})(${nx(rf.psiBID,3)})(${nx(rf.Kid,3)})=${nx(rf.dfCR,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pR1}=\frac{f_{pt}}{K_L}\left(\frac{f_{pt}}{f_{py}}-0.55\right)=\frac{${nx(lo.fpt,2)}}{30}\left(\frac{${nx(lo.fpt,2)}}{${nx(lo.fpy,1)}}-0.55\right)=${nx(rf.dfR1,3)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Deck placement → final">
        <ML s={Tx`\Delta f_{pSD}=\varepsilon_{bdf}E_p K_{df}=${nx(rf.dfSD,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{cd}=-\left[\frac{M_{dk}e_m}{I_g}+\frac{(M_{bar}+M_{dw})e_{pc}}{I_c}\right]=-\left[\frac{${nx(rMid.Mdk,0)}(${nx(em,2)})}{${nx(g.I,0)}}+\frac{${nx(Mbar+Mdw,0)}(${nx(rf.epc,2)})}{${nx(cp.Ic,0)}}\right]=${nx(R.dfcd,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pCD}=\frac{E_p}{E_{ci}}f_{cgp}(\psi_{bif}-\psi_{bid})K_{df}+\frac{E_p}{E_c}\Delta f_{cd}\psi_{bdf}K_{df}=${nx(fin.dfCD,3)}\;\mathrm{ksi}`}/>
        <ML s={Tx`\Delta f_{pR2}=\Delta f_{pR1}=${nx(fin.dfR2,3)}\qquad \Delta f_{pSS}=${nx(fin.dfSS,2)}\;\mathrm{ksi}`}/>
      </Step>
      <Step d="Total & effective prestress">
        <ML s={Tx`\Delta f_{pLT}=${nx(rf.dfSR,2)}+${nx(rf.dfCR,2)}+${nx(rf.dfR1,2)}+${nx(rf.dfSD,2)}+${nx(fin.dfCD,2)}+${nx(fin.dfR2,2)}-${nx(fin.dfSS,2)}=${nx(fin.total,2)}\;\mathrm{ksi}`}/>
        <ML s={Tx`f_{pe}=f_{pbt}-\Delta f_{pES}-\Delta f_{pLT}=${nx(R.fpbt,2)}-${nx(lo.dfES,2)}-${nx(R.LT,2)}=${nx(R.fpe,2)}\;\mathrm{ksi}\;(${nx(R.pctLoss,1)}\%)`}/>
      </Step>
    </Deriv>
    :
    <Deriv title="Derivation — Approximate Long-Term Losses" refTag="LRFD 5.9.3.3">
      <Step d="Correction factors & lump-sum">
        <ML s={Tx`\gamma_h=1.7-0.01H=${nx(gh,3)}\qquad \gamma_{st}=\frac{5}{1+f'_{ci}}=${nx(gst,3)}`}/>
        <ML s={Tx`\Delta f_{pLT}=10\frac{f_{pi}A_{ps}}{A_g}\gamma_h\gamma_{st}+12\gamma_h\gamma_{st}+\Delta f_{pR}=10\frac{${nx(R.fpbt,1)}(${nx(ss.Aps,3)})}{${nx(g.A,0)}}(${nx(gh,3)})(${nx(gst,3)})+12(${nx(gh,3)})(${nx(gst,3)})+${nx(lo.apx.R,1)}=${nx(lo.apx.total,2)}\;\mathrm{ksi}`}/>
        <ML s={Tx`f_{pe}=${nx(R.fpbt,2)}-${nx(lo.dfES,2)}-${nx(R.LT,2)}=${nx(R.fpe,2)}\;\mathrm{ksi}`}/>
      </Step>
    </Deriv>}
    <div className="cols" style={{paddingTop:0,gridTemplateColumns:'1fr 1fr'}}>
      <Card title="Refined Estimate" refTag="LRFD 5.9.3.4">
        <Tbl head={['Component','Stage','Δf_p (ksi)']} rows={[
          {c:['Shrinkage ΔfpSR','transfer→deck',fmt(rf.dfSR,3)]},
          {c:['Creep ΔfpCR','transfer→deck',fmt(rf.dfCR,3)]},
          {c:['Relaxation ΔfpR1','transfer→deck',fmt(rf.dfR1,3)]},
          {c:['Shrinkage ΔfpSD','deck→final',fmt(rf.dfSD,3)]},
          {c:['Creep ΔfpCD','deck→final',fmt(fin.dfCD,3)]},
          {c:['Relaxation ΔfpR2','deck→final',fmt(fin.dfR2,3)]},
          {c:['Deck shrinkage gain −ΔfpSS','deck→final',fmt(-fin.dfSS,3)]},
          {_cls:'tot',c:['Σ long-term','',fmt(fin.total,3)]}]}/>
        <div className="hint" style={{marginTop:8}}>k_s={fmt(rf.ks,3)} · k_hs={fmt(rf.khs,3)} · k_hc={fmt(rf.khc,3)} · k_f={fmt(rf.kf,3)} · ψ_bif={fmt(rf.psiBIF,3)} · K_id={fmt(rf.Kid,3)} · K_df={fmt(rf.Kdf,3)} · Δf_cd={fmt(R.dfcd,3)} ksi · f_cgp={fmt(lo.fcgp,3)} ksi</div>
      </Card>
      <Card title="Approximate Estimate" refTag="LRFD 5.9.3.3">
        <Tbl head={['Component','Δf_p (ksi)']} rows={[
          {c:['Shrinkage + creep (10·fpiAps/Ag·γhγst + 12γhγst)',fmt(lo.apx.SH_CR,3)]},
          {c:['Relaxation ΔfpR',fmt(lo.apx.R,3)]},
          {_cls:'tot',c:['Σ long-term',fmt(lo.apx.total,3)]}]}/>
        <div className="callout" style={{marginTop:10}}>The <b>{useRef_?'refined':'approximate'}</b> method is applied to all downstream checks (toggle under Design Options). Losses are computed at midspan and applied uniformly, consistent with common practice.</div>
        <div style={{marginTop:10}}>
        <Fig h={210} data={[{type:'bar',orientation:'h',
          y:['ES','SR','CR','R1','SD','CD','R2'],
          x:[lo.dfES,rf.dfSR,rf.dfCR,rf.dfR1,rf.dfSD,fin.dfCD,fin.dfR2],
          marker:{color:['#16212E','#1C4FC4','#1C4FC4','#0E7490','#1C4FC4','#1C4FC4','#0E7490']}}]}
          layout={{xaxis:{title:'Δf_p (ksi)'},margin:{l:40,r:10,t:6,b:36}}}/>
        </div>
      </Card>
    </div>
  </div>);
}

function StressHeatmap({inp,R}){
  const g=R.g, cp=R.cp, gr=R.grid, L=R.L;
  const STAGES={
    rel:{label:'Release (transfer)',lim:[{v:R.lim.relC,t:'+0.65 f′ci (comp)'},{v:-R.lim.relT,t:'tension limit'}],comp:true},
    s1:{label:'Service I — permanent',lim:[{v:R.lim.srvC1,t:'0.45 f′c'}],comp:false},
    s2:{label:'Service I — full (perm + LL)',lim:[{v:R.lim.srvC2,t:'0.60 f′c'}],comp:false},
    s3:{label:'Service III — bottom tension',lim:[{v:-R.lim.srvT,t:'tension limit'}],comp:false}
  };
  const [stage,setStage]=useState('rel');
  const ckBy=n=>R.checks.find(c=>c.n===n)||{loc:0,v:0,pass:true};
  const govX={rel:ckBy('Release comp').loc,s1:ckBy('Srv comp (perm)').loc,s2:ckBy('Srv comp (full)').loc,s3:ckBy('Srv III tens').loc};
  const [xft,setXft]=useState(govX.rel);
  const [xDraft,setXDraft]=useState(String(govX.rel.toFixed(2)));
  useEffect(()=>{setXft(govX[stage]); setXDraft(String(govX[stage].toFixed(2)));},[stage]);
  // keep the text field in sync when xft changes from the slider or the governing button
  const setStation=(v)=>{const c=clamp(v,0,L); setXft(c); setXDraft(String(c.toFixed(2)));};
  if(R.error)return null;
  // Compute the fiber stresses at the EXACT station the user selected (typed or slider),
  // not the nearest grid point. Falls back to nearest grid row only if the engine fn is absent.
  const rowAt=x=>gr.reduce((b,r)=>Math.abs(r.x-x)<Math.abs(b.x-x)?r:b,gr[0]);
  const r = R.stationStress? R.stationStress(clamp(xft,0,L)) : rowAt(xft);
  const h=g.h;
  // top & bottom fiber for the chosen stage (girder section; composite stages still drawn on girder depth)
  let fTop,fBot;
  if(stage==='rel'){fTop=r.relTop; fBot=r.relBot;}
  else if(stage==='s3'){fBot=r.s3Bot; fTop=r.s1Top;}
  else {fTop=(stage==='s2'?r.s2Top:r.s1Top); fBot=r.s3Bot;}
  const fAtY=y=>fBot+(fTop-fBot)*(y/h);          // + = compression
  // diverging color map centered at 0, scaled by the larger magnitude on view
  const fmax=Math.max(Math.abs(fTop),Math.abs(fBot),0.05);
  const col=s=>{ const t=Math.max(-1,Math.min(1,s/fmax));
    // blue (tension, -) -> light (0) -> red (compression, +)
    const lerp=(a,b,u)=>Math.round(a+(b-a)*u);
    if(t>=0){const u=t;return `rgb(${lerp(238,194,u)},${lerp(242,39,u)},${lerp(246,29,u)})`;}
    const u=-t;return `rgb(${lerp(238,28,u)},${lerp(242,79,u)},${lerp(246,196,u)})`;};
  // geometry: SVG with section silhouette, gradient fill via stacked horizontal bands
  const half=halfPolygon(g);
  const W=300, padL=46, padR=150, Htot=h;
  const sc=Math.min(170/Math.max(g.bbf,g.btf), 300/h);
  const cx=padL+ (g.btf*sc)/2 + 20;
  const X=xx=>cx+xx*sc, Y=yy=>20+(h-yy)*sc;
  const wAtY=y=>{ for(let i=0;i<half.length-1;i++){const [x1,y1]=half[i],[x2,y2]=half[i+1];
    if(y>=Math.min(y1,y2)-1e-6&&y<=Math.max(y1,y2)+1e-6){
      if(Math.abs(y2-y1)<1e-6)return Math.max(x1,x2);
      const t=(y-y1)/(y2-y1);return x1+(x2-x1)*t;}}
    return half[half.length-1][0];};
  // horizontal stress bands span the full section bounding width; the clipPath carves the
  // true outline (including the NEXT two-stem gap), so this works for any section shape.
  const wBound=Math.max(g.bbf,g.btf)/2;
  const NB=80, bands=[];
  for(let i=0;i<NB;i++){const y0=i*h/NB, y1=(i+1)*h/NB, ym=(y0+y1)/2;
    const s=fAtY(ym);
    bands.push(<rect key={i} x={X(-wBound)} y={Y(y1)} width={2*wBound*sc} height={(y1-y0)*sc+0.6} fill={col(s)}/>);}
  // section outline path
  const path=half.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ')+' '+
             half.slice().reverse().map(p=>`${X(-p[0])},${Y(p[1])}`).join(' ');
  const clipId='secclip_'+stage;
  // neutral axis
  const cross=(fTop>0)!==(fBot>0);
  const yNA=cross? h*(0-fBot)/(fTop-fBot):null;
  // strands at this station
  const strands=strandXY(R, xft<L*0.25||xft>L*0.75?'end':'mid');
  // side profile plot dims
  const pX0=X(Math.max(g.bbf,g.btf)/2)+34, pW=96, pZero=pX0+pW*(fmax)/(2*fmax);
  const sx=s=>pX0+pW*(s+fmax)/(2*fmax);
  const govStr={rel:`${fmt(r.relBot,3)} bot / ${fmt(r.relTop,3)} top`,
    s1:`${fmt(r.s1Top,3)} top`,s2:`${fmt(r.s2Top,3)} top`,s3:`${fmt(r.s3Bot,3)} bot`}[stage];
  const st=STAGES[stage];
  // legend gradient stops
  return(<Card title="Stress Distribution on Cross-Section" refTag="linear elastic · plane sections (Navier)"
    right={<span className="seg">{Object.keys(STAGES).map(k=>
      <button key={k} className={stage===k?'on':''} onClick={()=>setStage(k)}>{k.toUpperCase()}</button>)}</span>}>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:6}}>
      <span style={{fontSize:11,color:'var(--ink2)'}}>{st.label}</span>
      <span style={{fontSize:11,color:'var(--ink2)'}}>· station x =</span>
      <input type="range" min={0} max={L} step={Math.max(L/600,0.05)} value={clamp(xft,0,L)}
        onChange={e=>setStation(+e.target.value)} style={{flex:1,minWidth:140,accentColor:'var(--blue)'}}/>
      <div className="fwrap" style={{width:96}}>
        <input type="number" min={0} max={L} step={0.5} value={xDraft}
          onChange={e=>{const s=e.target.value; setXDraft(s); const v=parseFloat(s); if(isFinite(v)) setXft(clamp(v,0,L));}}
          onBlur={e=>{const v=parseFloat(e.target.value); setStation(isFinite(v)?v:xft);}}
          style={{width:'100%',border:'1px solid var(--line)',fontFamily:'var(--mono)',fontSize:12,padding:'2px 5px',textAlign:'right'}}/>
        <span className="unit">ft</span>
      </div>
      <button className="btn sm ghost" onClick={()=>setStation(govX[stage])}>↺ governing</button>
    </div>
    <svg viewBox={`0 0 ${pX0+pW+58} ${Y(0)+38}`} style={{width:'100%',maxHeight:440}}>
      <defs><clipPath id={clipId}><polygon points={path}/></clipPath></defs>
      {/* heat bands clipped to section */}
      <g clipPath={`url(#${clipId})`}>{bands}</g>
      {/* outline */}
      <polygon points={path} fill="none" stroke="#16212E" strokeWidth="0.5"/>
      {/* neutral axis (label nudged vertically away from the nearest depth tick to avoid overlap) */}
      {yNA!==null&&(()=>{const nearTop=Math.abs(yNA-h)<h*0.12, nearBot=Math.abs(yNA)<h*0.12;
        const dy=nearTop?7:(nearBot?-3:2.5);
        return <g>
        <line x1={X(-wAtY(yNA))-6} x2={X(wAtY(yNA))+6} y1={Y(yNA)} y2={Y(yNA)} stroke="#15803D" strokeWidth="0.55" strokeDasharray="3 2"/>
        <text x={X(wAtY(yNA))+9} y={Y(yNA)+dy} fontSize="4" fontFamily="var(--mono)" fill="#15803D" textAnchor="start">N.A. {fmt(yNA,1)}″</text>
      </g>;})()}
      {/* strands — radius tied to the 2" grid spacing (≈0.4·spacing) so dots never overlap,
          and to the actual strand diameter, whichever is smaller; capped for tiny scales */}
      {(()=>{const rStr=Math.min(0.40*2*sc, 0.5*(+(STRANDS[inp.str.dia]||{db:0.6}).db)*sc, 2.1);
        return strands.map((s,i)=><circle key={i} cx={X(s.x)} cy={Y(s.y)} r={Math.max(rStr,0.7)}
          fill={s.h?'#7C3AED':'#16212E'} stroke="#fff" strokeWidth="0.35"/>);})()}
      {/* depth axis ticks */}
      {[0,h/4,h/2,3*h/4,h].map((yy,i)=><g key={i}>
        <line x1={X(-Math.max(g.bbf,g.btf)/2)-4} x2={X(-Math.max(g.bbf,g.btf)/2)} y1={Y(yy)} y2={Y(yy)} stroke="#46586B" strokeWidth=".7"/>
        <text x={X(-Math.max(g.bbf,g.btf)/2)-7} y={Y(yy)+3} fontSize="4" fontFamily="var(--mono)" fill="#46586B" textAnchor="end">{fmt(yy,0)}</text></g>)}
      {/* ---- side stress profile (straight line) ---- */}
      <line x1={sx(0)} x2={sx(0)} y1={Y(0)} y2={Y(h)} stroke="#C7D1DB" strokeWidth="0.5"/>
      {/* profile polygon */}
      <polygon points={`${sx(0)},${Y(0)} ${sx(fBot)},${Y(0)} ${sx(fTop)},${Y(h)} ${sx(0)},${Y(h)}`}
        fill="rgba(28,79,196,.10)" stroke="#1C4FC4" strokeWidth="0.55"/>
      {/* fiber labels — placed beyond the marker, away from the zero axis; min 6-unit clearance */}
      {(()=>{const eps=4; // min horizontal clearance from the zero axis (viewBox units)
        const xT=Math.abs(sx(fTop)-sx(0))<eps? sx(0)+(fTop>=0?eps:-eps) : sx(fTop);
        const xB=Math.abs(sx(fBot)-sx(0))<eps? sx(0)+(fBot>=0?eps:-eps) : sx(fBot);
        return <g>
        <circle cx={sx(fBot)} cy={Y(0)} r="1.5" fill="#C2271D"/>
        <text x={xB} y={Y(0)+9} fontSize="4.5" fontFamily="var(--mono)" fill="#C2271D" textAnchor={fBot>=0?'start':'end'}>{fmt(fBot,2)}</text>
        <circle cx={sx(fTop)} cy={Y(h)} r="1.5" fill="#1C4FC4"/>
        <text x={xT} y={Y(h)-4} fontSize="4.5" fontFamily="var(--mono)" fill="#1C4FC4" textAnchor={fTop>=0?'start':'end'}>{fmt(fTop,2)}</text>
      </g>;})()}
      {/* limit markers on the profile */}
      {st.lim.map((lm,i)=>Math.abs(lm.v)<=fmax&&<g key={i}>
        <line x1={sx(lm.v)} x2={sx(lm.v)} y1={Y(0)+4} y2={Y(h)-4} stroke={lm.v<0?'#B45309':'#B3261E'} strokeWidth="0.55" strokeDasharray="2.5 1.5"/>
        <text x={sx(lm.v)} y={Y(h)-16-i*11} fontSize="3.6" fontFamily="var(--mono)" fill={lm.v<0?'#B45309':'#B3261E'} textAnchor="middle">{lm.t}</text></g>)}
      <text x={(sx(0))} y={Y(0)+26} fontSize="4.2" fontFamily="var(--mono)" fill="#46586B" textAnchor="middle">σ (ksi) · + comp</text>
      {/* color legend bar */}
      <defs><linearGradient id={'leg_'+stage} x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stopColor={col(-fmax)}/><stop offset="50%" stopColor={col(0)}/><stop offset="100%" stopColor={col(fmax)}/>
      </linearGradient></defs>
      <rect x={X(-Math.max(g.bbf,g.btf)/2)} y={Y(0)+14} width={Math.max(g.bbf,g.btf)*sc} height="6" fill={`url(#leg_${stage})`} stroke="#16212E" strokeWidth="0.3"/>
      <text x={X(-Math.max(g.bbf,g.btf)/4)} y={Y(0)+28} fontSize="3.8" fontFamily="var(--mono)" fill="#1C4FC4" textAnchor="middle">−{fmt(fmax,2)} tens.</text>
      <text x={X(Math.max(g.bbf,g.btf)/4)} y={Y(0)+28} fontSize="3.8" fontFamily="var(--mono)" fill="#C2271D" textAnchor="middle">+{fmt(fmax,2)} comp.</text>
    </svg>
