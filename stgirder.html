      right={<span className="chip head" style={{background:f.fatInf?'#E8F5EC':'#FCF3E3',borderColor:f.fatInf?'var(--pass)':'var(--warn)',color:f.fatInf?'var(--pass)':'var(--warn)'}}>{lsName}</span>}>
      <ML s={Tx`(\text{ADTT})_{SL,\,cross}=\dfrac{A}{\left[\tfrac{0.80}{1.75}(\Delta F)_{TH}\right]^{3}(365)(Y)(n)}=\dfrac{${nx(f.Acat,0)}}{(${nx(f.fatGRatio,4)}\cdot${nx(f.TH,1)})^{3}\cdot365\cdot${nx(f.lifeYr,0)}\cdot${nx(f.nCyc,2)}}=${nx(f.adttSLcross,0)}\;\text{trucks/day}`}/>
      <ML s={Tx`(\text{ADTT})_{SL}=${nx(f.adttSL,0)}\;${f.recFatI?'\\ge':'<'}\;${nx(f.adttSLcross,0)}\;\Rightarrow\;\text{${recName} recommended}`}/>
      <div className="kv" style={{marginTop:6}}>
        <span className="k">Limit-state mode</span><span className="dots"></span><span className="v">{f.lsMode==='auto'?'AUTO (from crossover)':'MANUAL override'}</span>
        <span className="k">Governing limit state</span><span className="dots"></span><span className="v">{lsName} · γ = {fmt(f.gammaFat,2)}</span>
      </div>
      {overridden && <div className="callout" style={{background:'#FCF3E3',borderColor:'var(--warn)',color:'var(--warn)'}}>You have manually selected <b>{lsName}</b>, but the (ADTT)ₛₗ crossover recommends <b>{recName}</b>. Switch the Limit-state control on the Inputs tab to AUTO to follow the code check.</div>}
      <div className="mnote">Fatigue&nbsp;I (γ = 1.75) is the infinite-life check used when traffic is heavy enough that the Fatigue&nbsp;I check governs over Fatigue&nbsp;II, i.e. when (A/N)<sup>⅓</sup>/0.80 ≥ (ΔF)<sub>TH</sub>/1.75 — the basis of Table 6.6.1.2.3-2 (e.g. category C, 75 yr: 1,680 trucks/day); the section is then designed for unlimited cycles. Fatigue&nbsp;II (γ = 0.80) is the finite-life check for lighter traffic, where resistance depends on the actual cycle count N.</div>
    </Card>
  );
  const s3=(
    <Card title="Step 3 — Detail category & nominal fatigue resistance (ΔF)ₙ" refTag="6.6.1.2.5 · category constants">
      <KV rows={[
        ['Detail category', f.cat, 'set on Inputs tab'],
        ['Detail constant A', fmt(f.Acat/1e8,2)+'×10⁸', 'ksi³ (Table 6.6.1.2.5-1)'],
        ['CAF threshold (ΔF)ᴛʜ', fmt(f.TH,1), 'ksi (Table 6.6.1.2.5-3)'],
      ]}/>
      {f.fatInf
        ? <React.Fragment>
            <ML s={Tx`\text{Fatigue I:}\quad(\Delta F)_n=(\Delta F)_{TH}=${nx(f.TH,1)}\;\text{ksi}`}/>
            <div className="mnote">Infinite-life resistance is the constant-amplitude fatigue threshold — independent of N.</div>
          </React.Fragment>
        : <React.Fragment>
            <ML s={Tx`\text{Fatigue II:}\quad(\Delta F)_n=\left(\frac{A}{N}\right)^{1/3}=\left(\frac{${nx(f.Acat,0)}}{${nx(f.Nfat,0)}}\right)^{1/3}=${nx(f.FnFat,2)}\;\text{ksi}`}/>
            <div className="mnote">Finite-life resistance falls with cycle count (Eq. 6.6.1.2.5-2). There is no ½(ΔF)<sub>TH</sub> floor in the Fatigue&nbsp;I/II format.</div>
          </React.Fragment>}
    </Card>
  );
  const s4=sel?(
    <Card title="Step 4 — Fatigue live load & bottom-flange stress range Δf"
      refTag="fatigue truck · IM = 1.15 · single-lane"
      right={right}>
      {f.fatImp
      ? <React.Fragment>
      <div className="callout" style={{marginTop:0,marginBottom:10}}>
        Imported fatigue envelopes: fatigue-truck moments of the continuous analysis, per girder, with IM and the single-lane fatigue distribution factor already included, unfactored. The range is the positive minus the negative moment; both act on the short-term composite section (6.6.1.2.1).
      </div>
      <KV rows={[
        ['Location x', fmt(sel.x,1), 'ft'],
        ['Fatigue moment +M / −M', fmt(sel.fP,0)+' / '+fmt(sel.fN,0), 'k-ft (unfactored, IM and DF included)'],
        ['Short-term composite Sₓ (bottom)', fmt(sel.Sb,0), 'in³'],
      ]}/>
      <ML s={Tx`M_{f}=M_{fat}^{+}-M_{fat}^{-}=${nx(Math.max(sel.fP,0),0)}-(${nx(Math.min(sel.fN,0),0)})=${nx(sel.Mf,0)}\;\text{k-ft}`}/>
      </React.Fragment>
      : <React.Fragment>
      <div className="callout" style={{marginTop:0,marginBottom:10}}>
        Fatigue truck (LRFD 3.6.1.4.1): one design truck, axles <b>8 – 32 – 32 kip</b> with a <b>constant 30-ft</b> spacing between the two 32-kip axles, a single lane, no multiple-presence factor. Dynamic allowance IM = <b>15%</b> (Table 3.6.2.1-1). Distribution factor from {f.fatDfSource} = <b>{fmt(f.dfFat,3)}</b>.
      </div>
      <KV rows={[
        ['Location x', fmt(sel.x,1), 'ft'],
        ['Fatigue-truck moment range', fmt(sel.Mrange,0), 'k-ft/lane (unfactored, no IM)'],
        ['Short-term composite Sₓ (bottom)', fmt(sel.Sb,0), 'in³'],
      ]}/>
      <ML s={Tx`M_{f}=M_{range}\,(1+IM)\,g_{fat}=${nx(sel.Mrange,0)}\cdot1.15\cdot${nx(f.dfFat,3)}=${nx(sel.Mf,0)}\;\text{k-ft}`}/>
      </React.Fragment>}
      <ML s={Tx`\Delta f=\frac{M_{f}\cdot12}{S_{x}}=\frac{${nx(sel.Mf,0)}\cdot12}{${nx(sel.Sb,0)}}=${nx(sel.rng,2)}\;\text{ksi}`}/>
      <DLinks items={[{to:'trans',seg:sgI(R,sel.si),what:'S_x (short-term n)'}]}/>
      <ML s={Tx`\gamma(\Delta f)=${nx(f.gammaFat,2)}\cdot${nx(sel.rng,2)}=${nx(sel.gRng,2)}\;\text{ksi}\qquad\frac{\gamma(\Delta f)}{(\Delta F)_n}=\frac{${nx(sel.gRng,2)}}{${nx(f.FnFat,2)}}=${nx(sel.dcFlex,3)}\;${sel.dcFlex<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">The stress range is computed on the <b>short-term composite</b> section (modular ratio n) at the bottom flange — the fatigue range is a service-level effect, so the uncracked composite section is used along the whole span. The load factor γ is the {lsName} value.</div>
    </Card>
  ):null;
  const s5=(
    <Card title="Step 5 — Load-induced fatigue check (governing station)" refTag="6.6.1.2.2 · γ(Δf) ≤ (ΔF)ₙ">
      <ML s={Tx`\text{Governing }\Delta f=${nx(f.dfRange,2)}\;\text{ksi at }x=${nx(f.xGov,1)}'\quad\Rightarrow\quad\gamma(\Delta f)=${nx(f.gammaFat,2)}\cdot${nx(f.dfRange,2)}=${nx(f.gammaFat*f.dfRange,2)}\;\text{ksi}`}/>
      <ML s={Tx`\gamma(\Delta f)=${nx(f.gammaFat*f.dfRange,2)}\;\le\;(\Delta F)_n=${nx(f.FnFat,2)}\;\text{ksi}\;\Rightarrow\;\frac{D}{C}=${nx(f.fatDC,3)}\;${pass?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="hint">If this fails: raise the detail category (e.g. a CJP butt splice is category B rather than C), move the transition away from the peak-range region, or increase the bottom-flange section modulus. The governing location is usually near a flange transition or the point of maximum live-load moment range.</div>
    </Card>
  );
  const web=(
    <Card title="Special fatigue requirement for webs" refTag="6.10.5.3 · Vu(fatigue) ≤ Vcr">
      {(()=>{ const w=f.webFatGov;
        return <React.Fragment>
        {f.fatImpV
          ? <div className="mnote" style={{marginTop:0}}>Fatigue shear V<sub>f,LL</sub> = the larger of |V<sub>fat</sub><sup>+</sup>| and |V<sub>fat</sub><sup>−</sup>| from the imported fatigue envelopes (per girder, IM and the single-lane fatigue DF included).</div>
          : <div className="mnote" style={{marginTop:0}}>Fatigue-truck shear uses the single-lane <b>shear</b> distribution factor {f.fatDfVSource} = <b>{fmt(f.dfFatV,3)}</b>, IM = 15%.</div>}
        <ML s={Tx`V_{u}=V_{perm}+1.75\,V_{f,LL}=${nx(w.Vperm||0,0)}+1.75\cdot${nx(w.Vll||0,0)}=${nx(w.Vf||0,0)}\;\text{kip}`}/>
        <ML s={Tx`\frac{V_{u}}{V_{cr}}=\frac{${nx(w.Vf||0,0)}}{${nx(f.Vcr,0)}}=${nx(w.r,3)}\;${webPass?'\\checkmark':'\\text{N.G.}'}\qquad(\text{at }x=${nx(w.x||0,1)}')`}/>
        </React.Fragment>; })()}
      <Fig h={280} data={[
        {x:fx,y:cf.map(p=>p.Vf),name:'V (perm. + Fatigue I LL)',fill:'tozeroy',fillcolor:'rgba(14,116,144,.06)',line:{color:'#0E7490',width:2.2}},
        hl(f.Vcr,'Vcr shear-buckling resistance','#B3261E')]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'shear (kip)',rangemode:'tozero'}}}/>
      <div className="hint">Where the elastically-computed factored shear range under the Fatigue I load could otherwise buckle the web, the sum of the unfactored permanent shear and the Fatigue&nbsp;I (γ=1.75) fatigue-truck shear is limited to the shear-buckling resistance V<sub>cr</sub> = C·V<sub>p</sub> = {fmt(f.Vcr,0)} kip. This keeps the web elastic under repeated load so tension-field action isn't relied on cyclically.</div>
    </Card>
  );
  return {s1,s2,s3,s4,s5,web};
}
function FatigueTab({R}){
  if(!R.ok) return null;
  const f=R.fatigue, pass=f.fatDC<=1.0001;
  const cf=R.chartFat||[], fx=cf.map(p=>p.x);
  const x0=fx[0]||0, x1=fx[fx.length-1]||R.geom.L;
  const hl=(y,name,color,dash)=>({x:[x0,x1],y:[y,y],name,mode:'lines',line:{color,width:2,dash:dash||'dash'}});
  const webPass=f.webFatGov.r<=1.0001;
  // per-station location picker for the stress-range calc
  const fcAll=f.fatCalc||[], Lspan=R.geom.L;
  const defIdx=fcAll.length? fcAll.reduce((bi,p,i,a)=>Math.abs(p.x-f.xGov)<Math.abs(a[bi].x-f.xGov)?i:bi,0):0;
  const [selIdx,setSelIdx]=useState(defIdx);
  const sel=fcAll.length? fcAll[Math.min(selIdx,fcAll.length-1)] : null;
  const stnLabel=(p,i,a)=>{ const x=p.x; const t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    if(Math.abs(x-f.xGov)<0.06) t.push('peak Δf');
    return 'x = '+x.toFixed(1)+' ft'+(t.length?'  ·  '+t.join(', '):''); };
  const AN13=Math.pow(f.Acat/Math.max(f.Nfat,1),1/3);        // (A/N)^⅓
  const lsName=f.fatInf?'Fatigue I':'Fatigue II';
  const recName=f.recFatI?'Fatigue I':'Fatigue II';
  const overridden=f.lsMode!=='auto' && ((f.lsMode==='I')!==f.recFatI);
  const stepHdr=(t)=>(<div style={{fontStretch:'75%',fontWeight:800,fontSize:12.5,letterSpacing:'.6px',
    textTransform:'uppercase',color:'var(--blue)',margin:'2px 0 8px'}}>{t}</div>);
  const FC=fatCards(R,sel,<select value={selIdx} onChange={e=>setSelIdx(+e.target.value)}
        style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',
          borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:240}}>
        {fcAll.map((p,i,a)=><option key={i} value={i}>{stnLabel(p,i,a)}</option>)}
      </select>);   // step cards shared with the calculation-sheet report (display only)
  return (<div>
    <StgWarn R={R} kind="fat"/>
    <div className="bigres">
      <div className={'br '+(pass?'p':'f')}><div className="l">γ(Δf) / (ΔF)n</div><div className="n">{fmt(f.fatDC,2)}</div><div className="u">cat {f.cat} · {lsName}</div></div>
      <div className="br"><div className="l">Governing Δf</div><div className="n">{fmt(f.dfRange,2)}</div><div className="u">ksi · btm flange @ {fmt(f.xGov,1)} ft</div></div>
      <div className={'br '+(webPass?'p':'f')}><div className="l">Web special fatigue</div><div className="n">{fmt(f.webFatGov.r,2)}</div><div className="u">{fmt(f.webFatGov.Vf||0,0)} / {fmt(f.Vcr,0)} kip</div></div>
    </div>

    {FC.s1}

    {FC.s2}

    {FC.s3}

    {sel&&FC.s4}

    {FC.s5}

    <Card title="Fatigue stress range along the span" refTag={'category '+f.cat+' · '+lsName+(f.fatInf?' (γ=1.75) vs (ΔF)ᴛʜ':' (γ=0.80) vs (A/N)^⅓')}>
      <Fig h={320} data={[
        {x:fx,y:cf.map(p=>f.gammaFat*p.rng),name:'γ(Δf) — factored range',fill:'tozeroy',fillcolor:'rgba(28,79,196,.06)',line:{color:'#1C4FC4',width:2.2}},
        {x:fx,y:cf.map(p=>p.rng),name:'Δf — unfactored range',line:{color:'#0E7490',width:1.6,dash:'dot'}},
        hl(f.FnFat,'(ΔF)n resistance','#B3261E')]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'stress range (ksi)',rangemode:'tozero'}}}/>
      <div className="callout">γ(Δf) (filled) and the unfactored Δf (dotted) versus the constant (ΔF)<sub>n</sub> resistance line. Peak γ(Δf) = <b>{fmt(f.gammaFat*f.dfRange,2)} ksi</b> at <b>{fmt(f.xGov,1)} ft</b>.</div>
    </Card>

    {FC.web}
  </div>);
}

/* Stiffener derivations, shared by the Stiffeners tab and the calculation-sheet report (display only; moved out of StiffTab unchanged). */
function stiffTransDeriv(R){ const ts=R.tStiff;
  return (    <Deriv title="Transverse intermediate stiffener" refTag="AASHTO 6.10.11.1">
      <VarTable title="Variables — transverse stiffener" rows={[
        ['D','Web depth',R.sec.D,'in'],['t_w','Web thickness',R.sec.tw,'in'],
        ['d_o','Stiffener spacing (panel length)',ts.do_,'in'],
        ['b_t','Projecting width provided',ts.bt,'in'],['t_p','Stiffener plate thickness',ts.tp,'in'],
        ['J','Stiffness parameter 2.5(D/d_o)²−2 ≥ 0.5',ts.J,'—'],
        ['b','Smaller of d_o and D (6.10.11.1.3)',ts.bIt,'in'],
        ['I_t1','Baseline requirement b·t_w³·J',ts.It1,'in⁴'],
        ['F_crs','Local buckling stress 0.31E/(b_t/t_p)² ≤ F_ys',ts.Fcrs,'ksi'],
        ['ρ_t','Larger of F_yw/F_crs and 1.0',ts.rhoT,'—'],
        ['I_t2','Tension-field requirement D⁴ρ_t^1.3(F_yw/E)^1.5/40',ts.It2,'in⁴'],
        ['ρ_w','Fraction of the tension-field capacity used',ts.rhoW,'—'],
        ['I_t,req','Required I_t1 + (I_t2 − I_t1)ρ_w',ts.ItReq,'in⁴'],
        ['I_t,prov','Provided t_p·b_t³/3',ts.ItProv,'in⁴'],
      ]}/>
      <SG n="1">Projecting-width limits</SG>
      <ML s={Tx`b_t\ge2.0+\frac{D}{30}=${nx(ts.btMinD,2)}\;\text{in}\qquad b_t\ge\frac{b_f}{4}=\frac{${nx(ts.bfComp,2)}}{4}=${nx(ts.btMinF,2)}\;\text{in}\qquad b_t\le16.0\,t_p=${nx(ts.btMax,2)}\;\text{in}`}/>
      <ML s={Tx`b_t=${nx(ts.bt,2)}\;\text{in}\;\Rightarrow\;${ts.widthOK?'\\text{within limits}\\;\\checkmark':(ts.minOK?'\\text{exceeds }16t_p\\;\\text{N.G.}':'\\text{below the minimum}\\;\\text{N.G.}')}`}/>
      <div className="mnote">Both b_f/4 and 2.0 + D/30 are <b>lower</b> bounds on the projecting width; only 16.0 t_p is an upper bound. b_f is the full width of the widest compression flange in the panel ({R.hasNeg?'the larger of the two flanges, since this girder has negative-moment regions':'the top flange'} = {fmt(ts.bfComp,2)} in). The 0.48 t_p √(E/F_ys) limit belongs to bearing stiffeners (6.10.11.2.2), not to transverse intermediate stiffeners.</div>
      <SG n="2">Moment-of-inertia requirement</SG>
      <ML s={Tx`J=2.5\!\left(\frac{D}{d_o}\right)^{2}-2=${nx(ts.J,2)}\;(\ge0.5)\qquad b=\min(d_o,D)=${nx(ts.bIt,1)}\;\text{in}\qquad I_{t1}=b\,t_w^{3}\,J=${nx(ts.It1,1)}\;\text{in}^4`}/>
      <ML s={Tx`F_{crs}=\frac{0.31E}{(b_t/t_p)^2}=${nx(ts.Fcrs,1)}\;\text{ksi}\quad\rho_t=\max\!\left(\frac{F_{yw}}{F_{crs}},1.0\right)=${nx(ts.rhoT,3)}\quad I_{t2}=\frac{D^{4}\rho_t^{1.3}}{40}\left(\frac{F_{yw}}{E}\right)^{1.5}=${nx(ts.It2,1)}\;\text{in}^4`}/>
      <ML s={Tx`\rho_w=\frac{V_u-\phi_vC V_p}{\phi_v V_{n,int}-\phi_v C V_p}=${nx(ts.rhoW,3)}\qquad I_{t,req}=I_{t1}+(I_{t2}-I_{t1})\rho_w=${nx(ts.ItReq,1)}\;\text{in}^4`}/>
      <ML s={Tx`I_{t,prov}=\frac{t_p\,b_t^{3}}{3}=${nx(ts.ItProv,1)}\;\text{in}^4\;${ts.ItOK?'\\ge':'<'}\;I_{t,req}\;${ts.ItOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Two requirements, blended. <b>I_t1</b> is the baseline stiffness that keeps the stiffener from buckling as a simple web stiffener; <b>I_t2</b> is the much stiffer requirement that applies when the panel is actually being asked to anchor a tension field. ρ_w measures how much of the tension-field capacity the design consumes above the C·V_p value — {ts.tfaUsed?'here ρ_w = '+fmt(ts.rhoW,3)+', so the requirement is interpolated toward I_t2 and the tension field is being leaned on':'here V_u sits at or below φ_v C·V_p, so ρ_w = 0 and only the baseline I_t1 is required — no tension field is being credited'}. Note b is the <b>smaller</b> of d_o and D, not D itself. Spacing d_o also sets the shear buckling coefficient k on the Shear tab.</div>
    </Deriv>);
}
function stiffBearDeriv(R){ const br=R.bearing;
  return (    <Deriv title="Bearing stiffener (at support)" refTag="AASHTO 6.10.11.2 · bearing + axial column">
      <VarTable title="Variables — bearing stiffener" rows={[
        ['n_b','Plates each side',br.nb,'—'],['b_b','Plate width',br.bb,'in'],['t_b','Plate thickness',br.tb,'in'],
        ['A_pn','Net bearing area (less corner clip)',br.Apn,'in²'],
        ['F_ys','Stiffener yield',br.Fys,'ksi'],
        ['b_b,max','Projecting-width limit 0.48·t_p·√(E/F_ys)',br.bbMax,'in'],
        ['R_sb','Bearing resistance 1.4·A_pn·F_ys',br.RsbN,'kip'],
        ['KL/r','Effective column slenderness',br.KLr,'—'],
        ['φP_n','Axial column resistance',br.Pr,'kip'],
        ['R_u','Support reaction (Strength I V_u)',br.Rreact,'kip'],
      ]}/>
      <SG n="1">Projecting width</SG>
      <ML s={Tx`b_b=${nx(br.bb,2)}\;\text{in}\;\le\;0.48\,t_p\sqrt{E/F_{ys}}=0.48(${nx(br.tb,3)})\sqrt{${(+R.matR.Es).toFixed(0)}/${(+br.Fys).toFixed(0)}}=${nx(br.bbMax,2)}\;\text{in}\;${br.widthOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <SG n="2">Bearing resistance</SG>
      <ML s={Tx`R_{sb}=1.4\,A_{pn}F_{ys}=1.4\cdot${nx(br.Apn,1)}\cdot${nx(br.Fys,0)}=${nx(br.RsbN,0)}\;\text{kip}\qquad\frac{R_u}{R_{sb}}=${nx(br.Rreact/br.RsbN,3)}\;${br.bearingOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <SG n="3">Axial column check (effective section: stiffener plates + 9t_w web each side)</SG>
      <ML s={Tx`\frac{KL}{r}=\frac{0.75D}{r}=${nx(br.KLr,1)}\qquad\phi_cP_n=${nx(br.Pr,0)}\;\text{kip}\qquad\frac{R_u}{\phi_cP_n}=${nx(br.Rreact/br.Pr,3)}\;${br.axialOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">The bearing stiffener transmits the support reaction R_u = {fmt(br.Rreact,0)} kip into the web. It is checked two ways: local bearing on the milled contact area (net of the corner clip that clears the web-to-flange weld), and as an axial column — the stiffener plates plus a strip of web 9t_w wide on each side, with an effective length 0.75D.</div>
    </Deriv>);
}
function StiffTab({R}){
  if(!R.ok) return null;
  const ts=R.tStiff, br=R.bearing;
  return (<div>
    <div className="bigres">
      <div className={'br '+(br.bearingOK&&br.axialOK?'p':'f')}><div className="l">Bearing stiffener</div><div className="n">{fmt(br.Rreact/Math.min(br.RsbN,br.Pr),2)}</div><div className="u">R / min(Rsb, Pr)</div></div>
      {ts&&<div className={'br '+(ts.ItOK&&ts.widthOK?'p':'f')}><div className="l">Transverse stiffener</div><div className="n">{fmt(ts.ItReq/ts.ItProv,2)}</div><div className="u">It req / prov{ts.widthOK?'':(ts.minOK?' · b_t > 16t_p':' · b_t < min')}</div></div>}
    </div>
    {ts&&stiffTransDeriv(R)}

    {stiffBearDeriv(R)}
  </div>);
}

/* Shear-connector derivations, shared by the Connectors tab and the calculation-sheet report (display only; moved out of ConnTab unchanged). */
function connStrDeriv(R){ const c=R.conn;
  return (    <Deriv title="Stud resistance & strength requirement" refTag="6.10.10.4">
      <VarTable title="Variables — shear studs" rows={[
        ['A_sc','Area of one stud',c.Asc,'in²'],
        ['Q_n','Nominal shear resistance of one stud',c.Qn,'kip'],
        ['Q_r','Factored resistance φ_sc·Q_n (φ_sc=0.85)',c.Qr,'kip'],
        ['P','Governing horizontal force min(slab, steel)',c.Pshear,'kip'],
        ['n_req','Required studs, max-M to support',c.nReq,'—'],
        ['n_prov','Provided studs over the half-span',c.nProv,'—'],
        ['pitch','Longitudinal stud pitch',c.pitch,'in'],
      ]}/>
      <SG n="1">Nominal & factored stud resistance</SG>
      <ML s={Tx`Q_n=\min\!\left(0.5A_{sc}\sqrt{f'_cE_c},\;A_{sc}F_u\right)=${nx(c.Qn,1)}\;\text{kip}\qquad Q_r=\phi_{sc}Q_n=0.85\cdot${nx(c.Qn,1)}=${nx(c.Qr,1)}\;\text{kip}`}/>
      <SG n="2">Number of studs required (strength)</SG>
      <ML s={Tx`n=\frac{P}{Q_r}=\frac{${nx(c.Pshear,0)}}{${nx(c.Qr,1)}}=${nx(c.nReq,1)}\;\text{studs}\quad\text{(max-M}\to\text{support)}`}/>
      <ML s={Tx`n_{prov}=${nx(c.nProv,0)}\;${c.strOK?'\\ge':'<'}\;n_{req}=${nx(c.nReq,1)}\;${c.strOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">P is the smaller of the slab force 0.85f′_c·b_eff·t_s and the steel force F_y·A_steel — the total horizontal shear that must be transferred between the point of maximum moment and the support.{c.contStud?' In this continuous span the governing requirement is the one below (6.10.10.4.2).':''}</div>
      {c.contStud&&<React.Fragment>
        <SG n="3">Continuous span — max +M to the interior support (6.10.10.4.2)</SG>
        <ML s={Tx`P_p=\min\!\left(0.85f'_cb_st_s,\;F_{yw}Dt_w+F_{yt}b_{ft}t_{ft}+F_{yc}b_{fc}t_{fc}\right)=\min(${nx(c.contStud.Pslab,0)},\;${nx(c.contStud.PpS,0)})=${nx(c.contStud.Pp,0)}\;\text{kip}\quad(x_{+M}=${nx(c.contStud.xP,1)}\;\text{ft})`}/>
        <Tbl head={['End','Interior support?','Length max +M → end (ft)','P_n = min(steel, 0.45f′c·b_s·t_s) (kip)','P = P_p + P_n (kip)','n req','n prov','Ratio']}
          rows={c.contStud.sides.map(sd=>({_cls:sd===c.contStud.gov?'tot':'',c:[sd.end,sd.pier?'yes':'no (P = P_p)',fmt(sd.len,1),sd.pier?fmt(sd.PnS,0)+' / '+fmt(sd.PnC,0)+' → '+fmt(sd.Pn,0):'—',fmt(sd.P,0),fmt(sd.nReq,1),fmt(sd.nProv,0),{v:fmt(sd.r,2),cls:sd.r<=1.0001?'ok':'no'}]}))}/>
        <div className="mnote">The span is continuous (the imported demands have factored negative moment). Between the point of maximum positive moment and the centerline of an adjacent interior support the studs must develop P = P<sub>p</sub> + P<sub>n</sub> (6.10.10.4.2; straight girder, radial force F<sub>p</sub> = 0 — verify equation numbers against the 10th Ed.). An end is taken as an interior support when the factored −M there is below −1 k-ft. Provided studs are counted at the uniform pitch from the max +M station to that end.</div>
      </React.Fragment>}
    </Deriv>);
}
function connFatDeriv(R){ const c=R.conn;
  return (    <Deriv title="Fatigue pitch requirement" refTag="6.10.10.1.2 / 6.10.10.2">
      <VarTable title="Variables — fatigue" rows={[
        ['\u03b3','Fatigue load factor ('+(c.fatInf?'Fatigue I, infinite life':'Fatigue II, finite life')+')',c.gammaFat,'—'],
        ['Z_r','Fatigue shear resistance of one stud',c.Zr,'kip'],
        ['x','Governing station (closest required pitch)',c.fatStud.x,'ft'],
        ['V_+ / V_−',c.fatImpV?'Imported fatigue shear at x, per girder, IM and DF included (max +, max −)':'Fatigue-truck shear at x, per lane, no IM (max +, max −)',c.fatStud.Vpos.toFixed(2)+' / '+c.fatStud.Vneg.toFixed(2),'kip'],
        ['V_sr','Fatigue horizontal shear range per unit length',c.Vsr,'kip/in'],
        ['n','Studs per row (transverse)',c.nRow,'—'],
        ['p_req','Maximum permitted pitch n·Z_r/V_sr',c.pReq,'in'],
        ['pitch','Provided pitch',c.pitch,'in'],
      ]}/>
      <ML s={c.fatInf
        ? Tx`Z_r=5.5\,d^{2}=${nx(c.Zr,2)}\;\tfrac{\text{kip}}{\text{stud}}\quad(\text{Fatigue I, infinite life, Eq. 6.10.10.2-1})`
        : Tx`Z_r=\alpha d^{2}=(${nx(c.alphaF,2)})d^{2}=${nx(c.Zr,2)}\;\tfrac{\text{kip}}{\text{stud}}\quad(\text{Fatigue II, finite life})`}/>
      <ML s={c.fatImpV? Tx`V_f=\gamma\,(V_{+}-V_{-})=${nx(c.gammaFat,2)}\cdot${nx(c.VfatU,2)}=${nx(c.Vfat,2)}\;\text{kip}\qquad V_{sr}=\frac{V_f\,Q}{I}=\frac{${nx(c.Vfat,2)}\cdot${nx(c.Qslab,0)}}{${nx(c.Icomp,0)}}=${nx(c.Vsr,3)}\;\tfrac{\text{kip}}{\text{in}}` : Tx`V_f=\gamma\,(V_{+}-V_{-})(1.15)\,g_{V,1}=${nx(c.gammaFat,2)}\cdot${nx(c.fatStud.range,2)}\cdot1.15\cdot${nx(c.dfFatV,3)}=${nx(c.gammaFat,2)}\cdot${nx(c.VfatU,2)}=${nx(c.Vfat,2)}\;\text{kip}\qquad V_{sr}=\frac{V_f\,Q}{I}=\frac{${nx(c.Vfat,2)}\cdot${nx(c.Qslab,0)}}{${nx(c.Icomp,0)}}=${nx(c.Vsr,3)}\;\tfrac{\text{kip}}{\text{in}}`}/>
      <div className="mnote">The load factor and the Z<sub>r</sub> branch are a pair (6.10.10.2 with Table 3.4.1-1): Fatigue&nbsp;I applies γ&nbsp;=&nbsp;1.75 against the infinite-life resistance 5.5d², Fatigue&nbsp;II applies γ&nbsp;=&nbsp;0.80 against αd². Which one is in force is decided on the Fatigue tab and follows the same (ADTT)<sub>SL</sub> crossover as the flange check.</div>
      <ML s={Tx`p\le\frac{n\,Z_r}{V_{sr}}=\frac{${nx(c.nRow,0)}\cdot${nx(c.Zr,2)}}{${nx(c.Vsr,3)}}=${nx(c.pReq,1)}\;\text{in}\qquad p_{prov}=${nx(c.pitch,1)}\;${c.pitchOK?'\\le':'>'}\;p_{req}\;${c.pitchOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <DLinks items={[{to:'trans',seg:sgI(R,c.fatStud&&c.fatStud.si),what:'I (short-term n)'}]}/>
      <div className="mnote">Z_r is the fatigue shear resistance of one stud (Fatigue&nbsp;II: α = 34.5 − 4.28·log N; Fatigue&nbsp;I: 5.5d²). V_sr = V_f·Q/I is the horizontal shear range per unit length on the short-term composite section, with V_f the shear range V<sub>+</sub> − V<sub>−</sub> of the fatigue truck (3.6.1.4.1, 30-ft rear axle spacing, one lane, IM 1.15) at each station; the station needing the closest pitch governs (x = {fmt(c.fatStud.x,1)} ft). Radial fatigue shear F<sub>fat</sub> (curved or skewed girders) is not included. The required pitch is the closest fatigue-controlled spacing; the provided pitch must not exceed it.</div>
    </Deriv>);
}

function OptimizeTab({R,inp}){
  if(!R.ok) return null;
  const base=+inp.sec.tfb, vals=[];
  for(let t=Math.max(0.5,base-0.75); t<=base+0.75+1e-6; t+=0.125) vals.push(+t.toFixed(3));
  const rows=vals.map(t=>{ const e=JSON.parse(JSON.stringify(inp)); e.sec.tfb=t;
    if(e.sec.useSegs&&Array.isArray(e.sec.segs))
      e.sec.segs=e.sec.segs.map(s=>({...s, tfb:+(Math.max(0.25,(+s.tfb||t)+(t-base))).toFixed(4)}));
    const Rr=computeAll(e);
    // a swept size can make computeAll fail ({ok:false}, no checks) — show it as a gap, not a crash
    if(!Rr.ok||!Array.isArray(Rr.checks)) return {t,flex:NaN,shear:NaN,serv:NaN,pass:false,err:Rr.error||'compute failed'};
    const g=k=>{const c=Rr.checks.find(x=>x.t===k); return c?c.r:0;};
    return {t,flex:Math.max(g('Flexure'),g('Neg flex')),shear:g('Shear'),serv:g('SrvII'),pass:Rr.ok&&Rr.checks.every(c=>c.pass)}; });
  return (<div>
    <Card title="Optimize — bottom-flange thickness" refTag="governing D/C vs plate size">
      <Fig h={300} data={[
        {x:vals,y:rows.map(r=>isFinite(r.flex)?r.flex:null),name:'Flexure',mode:'lines+markers',line:{color:'#1C4FC4'}},
        {x:vals,y:rows.map(r=>isFinite(r.shear)?r.shear:null),name:'Shear',mode:'lines+markers',line:{color:'#B3261E'}},
        {x:vals,y:rows.map(r=>isFinite(r.serv)?r.serv:null),name:'Service II',mode:'lines+markers',line:{color:'#15803D'}},
        {x:[vals[0],vals[vals.length-1]],y:[1,1],name:'D/C = 1',mode:'lines',line:{color:'#888',dash:'dot'}}]}
        layout={{yaxis:{title:'D/C'},xaxis:{title:'bottom flange tfb (in)'}}}/>
      <Tbl head={['tfb (in)','Flexure','Shear','Service II','All pass']}
        rows={rows.map(r=>({_cls:Math.abs(r.t-base)<1e-6?'tot':'',c:[fmt(r.t,3),fmt(r.flex,2),fmt(r.shear,2),fmt(r.serv,2),PF(r.pass)]}))}/>
      <div className="hint">Sweeps the bottom-flange thickness around the current {fmt(base,3)} in (bold row), recomputing the full model at each size. Use it to find the lightest flange keeping every D/C ≤ 1.0. The same pattern extends to web and top-flange sweeps.</div>
    </Card>
  </div>);
}

// Description of the girder line used on the cover, the header and the objectives.
function crGirderText(R,inp){
  const sp=R.useExt&&R.ext&&R.ext.sel&&R.ext.sel.idx? (()=>{ const all=externalSpans(inp.external), sel=R.ext.sel;
      return 'span '+sel.idx+(all.length>1?' of a '+all.length+'-span continuous member':'')+' ('+fmt(sel.x0,1)+'–'+fmt(sel.x1,1)+' ft), L = '+fmt(R.geom.L,1)+' ft'; })()
    : 'simple span, L = '+fmt(R.geom.L,1)+' ft';
  return {sp, girder:(inp.proj&&inp.proj.girderId)||'Girder', pos:inp.loads.pos==='exterior'?'exterior':'interior'};
}
function crDesc(R,inp){ const p=inp.proj||{}; if(p.desc) return p.desc; const g=crGirderText(R,inp);
  const n=R.useExt&&R.ext&&R.ext.sel&&R.ext.sel.idx? externalSpans(inp.external).length : 0;
  return g.girder+', '+(n?'span '+R.ext.sel.idx+(n>1?' of '+n:'')+', ':'')+'L = '+fmt(R.geom.L,1)+' ft'; }

const crShort=(t,n)=>{ t=String(t==null?'':t); return t.length>n? t.slice(0,n-1).replace(/\s+\S*$/,'')+'…' : t; };

      <div className="mnote">C = φ_cφ_sφ_v V_cr (end-panel basis, kip); DC, DW and LL+IM are |V| at x = {fmt(r.shearX,1)} ft.</div></div>);
    if(r.servInv!==undefined) sub(s,'Service II (x = '+fmt(r.serv.x,1)+' ft, '+r.serv.tag+')','MBE 6A.6.4.2.2',<div className="cr-tab">

        <div className={'cr-r'+(r.target.pass?'':' cr-st-fail')}><b>{r.target.pass?'meets the target':'below the target'}</b></div></div>}</React.Fragment>);

  if(o.camber){ const s=S('camber','Camber (dead-load deflection)',{ref:'stage sections · double integration'});

  // 16. Drawings
  if(o.drawing){ S('drawing','Drawings',{brk:true,body:<div className="cr-fig">
    <div className="cr-figbox"><CrossSection R={R}/></div><p className="cap">Cross-section at midspan (midspan flange segment), deck and haunch to scale.</p>
    <div className="cr-figbox"><Elevation R={R}/></div><p className="cap">Elevation: span, cross-frame (brace) points{R.segP.length>1?' and flange transitions':''}.</p></div>}); }
  // 17. Appendix
  if(o.method){ S('method','Appendix: method and notation',{brk:true,body:<div className="cr-man">
    <h3>Method</h3><ul className="cr-ul">
      <li>Stresses accumulate by construction stage on the section active at each stage: DC1 (self-weight, wet deck, added DC1) on the bare steel; DC2 and DW on the long-term composite (3n); live load on the short-term composite (n); in −M regions the cracked steel + longitudinal rebar section (concrete neglected; 6.10.1.1.1c).</li>
      <li>Stations: the span tenth-and-twentieth points plus both sides of every flange transition; each check is evaluated at every station with that station’s plates and demands, and the worst ratio is reported with its location.</li>
      <li>Strength I = {lfP(lfS(R).gDC,'1.25')} DC + {lfP(lfS(R).gDW,'1.50')} DW + {lfP(lfS(R).gLL,'1.75')} (LL+IM); Service II = DC + DW + {lfP(lfS(R).gS2,'1.30')} (LL+IM){lfS(R).on?' (owner load rules from GirderDetail, see 2. Input parameters)':''}; constructibility = 1.25 DC + 1.50 construction live load; maximum load factors only. φ_f = φ_v = 1.0, φ_sc = 0.85.</li>
      <li>Positive flexure: compact composite sections on the plastic moment (6.10.7.1, with the ductility reduction and, in continuous spans, 1.3R_hM_y); noncompact or noncomposite sections on the flange stresses (6.10.7.2, 6.10.8). Negative flexure: bottom flange F_nc = min(FLB, LTB) over L_b with C_b = 1.0 (6.10.8.2). Shear: end-panel C·V_p everywhere (conservative), tension field shown for interior panels.</li>
      <li>Camber: double integration of M/(E·I) on a fine station set on the stage sections (DC1 bare, DC2 and DW 3n).</li>
      <li>Sign convention: moments sagging +; stresses f_B + = bottom tension, f_T + = top compression; deflections + down.</li>
      <li>Units: kip, in, ksi; moments k-ft; lengths along the span in ft.</li></ul>
    <h3>Notation</h3><CrT head={['Symbol','Description']} rows={NOMEN_ROWS}/></div>}); }
  return secs;
}
// The document itself (viewer and print). idp prefixes the ids so the viewer and the print copy never share an id.
function CalcDoc({R,inp,o,idp,model}){
  const p=inp.proj||{}, gt=crGirderText(R,inp);
  const refMap={}; model.forEach((s,i)=>s.subs.forEach((q,k)=>{ if(q.key&&!refMap[q.key]) refMap[q.key]={n:(i+1)+'.'+(k+1),id:'s'+(i+1)+'-'+(k+1)}; }));
  const refCtx={map:refMap,idp,midSeg:spMidIdx(R)};   // derivation links in the report read "see §n.k"
  let n=0; const toc=[];
  const body=model.map(s=>{ n++; const id=idp+'s'+n, t={n,t:s.t,id,subs:[]}; toc.push(t);
    return <section key={s.key} className={'cr-sec'+(s.brk?' cr-break':'')}>
      <h2 className="cr-h1" id={id} onClick={crToggle}>{n}. {s.t}:</h2>

          <div className="cr-body">{q.body}</div>
          {q.res.map((c,j)=><CrRes key={j} c={c}/>)}</div>; })}
    </section>; });
  return <CrRefCtx.Provider value={refCtx}>
    <section className="cr-cover"><div className="cr-cover-t"><h1>ST-Girder</h1><p>Steel plate girder design, AASHTO LRFD</p><p>{gt.girder}</p>
      <p className="cr-cover-p">{p.name||''}{p.job?', Job '+p.job:''}</p><p className="cr-cover-p">{gt.pos} girder, {gt.sp}</p></div></section>
    <section className="cr-front"><h2 className="cr-h1 cr-nonum">References:</h2>
      <table className="cr-refs"><tbody>{CR_REFS.map(([a,b])=><tr key={a}><td>{a}</td><td>{b}</td></tr>)}</tbody></table>
      <h2 className="cr-h1 cr-nonum">Table of contents:</h2>
      <ol className="cr-toc">{toc.map(s=><li key={s.id}><a href={'#'+s.id} onClick={crJump}>{s.n}. {s.t}</a>
        {s.subs.length?<ol>{s.subs.map((q,i)=><li key={q.id}><a href={'#'+q.id} onClick={crJump}>{s.n}.{i+1}. {q.t}</a></li>)}</ol>:null}</li>)}</ol>
      <p className="cr-p cr-small">Prepared with ST-Girder (AASHTO LRFD BDS 10th Ed.). Equations are shown symbolically, then with values substituted, then with the result. Units: kip, in, ksi, k-ft unless noted. Detail: {o.detail==='all'?'governing locations worked, every checked station tabulated':'governing locations worked'}.</p></section>
    {body}
  </CrRefCtx.Provider>;
}
// Clicking a heading collapses / expands its section in the viewer (display state only, not stored).
function crToggle(e){ if(!e.currentTarget.closest('.crv-doc')) return; const h=e.currentTarget, box=h.classList.contains('cr-h1')? h.closest('.cr-sec') : h.closest('.cr-sub'); if(box) box.classList.toggle('cr-closed'); }
function crJump(e){ const a=e.currentTarget, id=(a.getAttribute('href')||'').slice(1), el=document.getElementById(id);
  if(!el) return; e.preventDefault();
  let q=el.closest('.cr-closed'); while(q){ q.classList.remove('cr-closed'); q=q.parentElement&&q.parentElement.closest('.cr-closed'); }
  el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('crv-flash'); setTimeout(()=>el.classList.remove('crv-flash'),1400); }

      <span className="crv-sp"></span>
      <button type="button" className="btn sm ghost" onClick={()=>docRef.current&&docRef.current.querySelectorAll('.cr-closed').forEach(x=>x.classList.remove('cr-closed'))}>Expand all</button>
      <button type="button" className="btn sm ghost" onClick={()=>docRef.current&&docRef.current.querySelectorAll('.cr-sec').forEach(x=>x.classList.add('cr-closed'))}>Collapse all</button>
      <button type="button" className="btn sm pri" onClick={()=>setPrinting(true)}>Print this report</button>
      <div className="crv-flds">{fld('desc','Description',crDesc(R,{...inp,proj:{...inp.proj,desc:''}}))}{fld('checkedBy','Checked by','')}{fld('chkDate','Check date','')}
        <span className="crv-fnote">Report title block. Project, Girder, By, Date and Job No. are the fields at the top of the page.</span></div>

const LS_KEY='stgirder.session', LS_PROJ='stgirder.projects', LS_LAST='stgirder.lastproj';
const UI_KEY='stgirder.ui.v1';
/* Persistent UI-preference store, kept apart from the session/design data. View
   state a tab holds locally -- e.g. the Diagrams span view -- lives here so it
   survives leaving the tab (which unmounts it) and a full reload. Preferences
   only, never engineering data. */
function loadUI(){ try{ const r=window.localStorage.getItem(UI_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveUI(patch){ try{ const cur=loadUI(); window.localStorage.setItem(UI_KEY,JSON.stringify({...cur,...patch})); }catch(e){} }
function lsAvailable(){ try{const k='__t';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true;}catch(e){return false;} }
function loadSaved(){ try{const s=window.localStorage.getItem(LS_KEY);return s?JSON.parse(s):null;}catch(e){return null;} }
function saveInputs(inp){ try{window.localStorage.setItem(LS_KEY,JSON.stringify(inp));return true;}catch(e){return false;} }
function clearSaved(){ try{window.localStorage.removeItem(LS_KEY);}catch(e){} }
const ST_APP='stgirder', BP=()=>window.BridgeProjects;
function legacyLoadProjects(){ try{const s=window.localStorage.getItem(LS_PROJ);return s?JSON.parse(s):{};}catch(e){return {};} }
try{ if(BP()) BP().migrate(ST_APP, legacyLoadProjects(), le=>le&&le.inp); }catch(e){}
// Named projects live in the shared Bridge Suite registry — one project spans all apps.
function loadProjects(){
  if(!BP()) return legacyLoadProjects();
  const reg=BP().raw(), out={};
  for(const id in reg){ const e=reg[id];
    out[id]={name:e.name, savedAt:e.savedAt, inp:(e.slices&&e.slices[ST_APP]!=null)?e.slices[ST_APP]:null,
      _apps:Object.keys(e.slices||{}), _hasDemands:!!e.demands}; }
  return out;
}
function writeProjects(o){ return true; }
function saveProjectAs(name,inp){ return BP()?BP().saveSlice(null,name||'Untitled',ST_APP,JSON.parse(JSON.stringify(inp))):null; }
function overwriteProject(id,inp){ return BP()?!!BP().saveSlice(id,undefined,ST_APP,JSON.parse(JSON.stringify(inp))):false; }
function deleteProject(id){ return BP()?BP().del(id):false; }
function renameProject(id,name){ return BP()?BP().rename(id,name):false; }
function loadLastProjId(){ return BP()?BP().current():null; }
function saveLastProjId(id){ if(BP()) BP().setCurrent(id); }
function mergeInputs(p){ if(!p) return null;
  const deep=(d,s)=>{ const o={...d}; for(const k in s){ o[k]=(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k]))?deep(d[k]||{},s[k]):s[k]; } return o; };
  return deep(DEFAULTS,p); }

/* ═══ Shared design-beam chip ═══════════════════════════════════════════════
   Backed by BridgeBeam (the block in this file's <head>). The beam picked here
   is the beam the whole suite uses: the live-load distribution factors and the
   dead-load distribution in the LL & DL app, the DFs pulled into this design,
   and the UDLs pushed to the MCT Loads tab. Changing it in any app — or in
   another browser tab — moves every app to the same beam.
   The roster comes from the LL & DL Distribution app, which is the only one
   that knows the full cross-section, so this chip degrades to a read-only
   label until that app has been run once.
   ═══════════════════════════════════════════════════════════════════════════ */
function useDesignBeam(){
  const BB=(typeof window!=='undefined'&&window.BridgeBeam)||null;
  const [,setTick]=useState(0);
  useEffect(()=>{ if(!BB) return undefined; return BB.onChange(()=>setTick(t=>t+1)); },[BB]);
  return {BB, sel:BB?BB.get():null, roster:BB?BB.roster():null};
}
function BeamChip({nb,setBy}){
  const {BB,sel,roster}=useDesignBeam();
  if(!BB) return null;
  const beams=(roster&&roster.beams)||[];
  const mm=BB.mismatch?BB.mismatch(nb):null;
  return (
    <span className="beamchip" title={'Design beam — shared by every app in the suite. '
      +'Set the beam layout and the MassDOT classification in the LL & DL Distribution app; '
      +'the distribution factors, the dead load and the MCT beam loads all follow this beam.'}>
      <span className="bc-k">Design beam</span>
      {beams.length
        ? <select value={sel?sel.index:''} onChange={e=>BB.set(+e.target.value,null,setBy||'')}>
            {beams.map(b=><option key={b.i} value={b.i}>{b.label} · {b.ab||b.clsLabel||''}</option>)}
          </select>
        : <span className="bc-v" title="No beam roster published yet — open the LL & DL Distribution app and recalculate.">
            {sel?sel.label:'—'} <span className="bc-warn">no roster</span></span>}
      {mm&&<span className="bc-warn" title={'This app is set up for '+mm.mine+' girders but the published roster has '
        +mm.roster+'. Re-run the LL & DL Distribution app on the current layout.'}>⚠ {mm.mine}≠{mm.roster}</span>}
    </span>);
}

function App(){
  const canSave=useMemo(()=>lsAvailable(),[]);
  const [saveFail,setSaveFail]=useState('');   // '' | 'session' | 'project' — last autosave write failed (STG-S8)
  const [inp,setInpRaw]=useState(()=>canSave?(mergeInputs(loadSaved())||DEFAULTS):DEFAULTS);
  const [tab,setTab]=useState('inputs');

        {tab==='section'&&<SectionTab R={R} inp={inp} go={go}/>}
        {tab==='construct'&&<ConstructTab R={R}/>}
        {tab==='stresses'&&<StressTab R={R}/>}
        {tab==='flexure'&&<FlexTab R={R}/>}
        {tab==='shear'&&<ShearTab R={R}/>}
        {tab==='diagrams'&&<DiagramsTab R={R} inp={inp} set={setInp}/>}
        {tab==='camber'&&<CamberTab R={R}/>}
        {tab==='deck'&&<DeckTab R={R} go={setTab}/>}
        {tab==='fatigue'&&<FatigueTab R={R}/>}
        {tab==='stiff'&&<StiffTab R={R}/>}
        {tab==='conn'&&<ConnTab R={R}/>}
        {tab==='rating'&&<RatingTab R={R} inp={inp} set={setInp} onSendCapacity={publishCapacity} capLocked={capLocked} onToggleCapLock={toggleCapLock}/>}
        {tab==='optimize'&&<OptimizeTab R={R} inp={inp}/>}
        {tab==='nomen'&&<NomenclatureTab/>}
        {tab==='report'&&<ReportTab R={R} inp={inp} set={setInp}/>}
      </div>}
    </React.Fragment>}

    <div className="footer">
      <span>ST-GIRDER v1.2 (steelbeam schema · zones auto-import) · AASHTO LRFD BDS 10th Ed. · UNITS: KIP·IN·KSI</span>
      <span>DESIGN AID — INDEPENDENT VERIFICATION BY A LICENSED ENGINEER REQUIRED</span>
    </div>
  </div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
