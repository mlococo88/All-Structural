            v={+inp.fatigue.lanes||2} set={v=>S('fatigue.lanes',v)}/></div>}
      </div>
      <div className="frow">
        <div className="fld"><label>Cycles per passage n (Table 6.6.1.2.5-2)</label>
          <div className="fwrap"><select value={+inp.fatigue.ncyc||1.0} onChange={e=>S('fatigue.ncyc',+e.target.value)}>
            <option value={1.0}>1.0 — simple span &gt; 40 ft; continuous away from support</option>
            <option value={1.5}>1.5 — continuous, near interior support &gt; 40 ft</option>
            <option value={2.0}>2.0 — any span ≤ 40 ft</option>
            <option value={5.0}>5.0 — cantilever girder</option>
          </select></div></div>
        <Num l="Fatigue design life (yr)" v={inp.fatigue.designLife||75} set={v=>S('fatigue.designLife',v)} step={5}/>
      </div>
      <div className="hint" style={{margin:'2px 0 0'}}>{(+inp.loads.fatM>0)?<span>A single-lane fatigue distribution factor <b>{fmt(+inp.loads.fatM,3)}</b> is pulled from the LL &amp; DL Distribution app and will be used for the stress range. Clear it on the Loads card to fall back to the DF÷1.2 estimate.</span>:<span>The single-lane fatigue distribution factor is estimated as (1-lane moment DF)÷1.2 (removes multiple presence){inp.loads.pos==='exterior'?'; for an exterior girder the one-lane DF is the larger of the lever rule and the rigid-section value':''}. Pull an exact value from the LL &amp; DL Distribution app if desired.</span>}</div>
    </Card>
    </div>
  </div>);
}

/* Section properties by flange segment and at any location x (display only, 2026-10-14). Every value shown is a
   segP entry built by computeAll: elasticProps (bare, n, 3n), crackedSection (steel + deck rebar) and plasticMoment,
   i.e. the same objects the checks read station by station. Nothing here changes which section a check uses. */
const spMidIdx=R=>{ const i=R.segP.findIndex(g=>R.geom.L/2<=g.x1+1e-9); return i<0?0:i; };   // same pick as segMid
const spSegAt=(segP,x)=>{ for(let i=0;i<segP.length;i++) if(x<=segP[i].x1+1e-9) return i; return segP.length-1; };   // = computeAll segIdxAt
const spX0=R=>(R.useExt&&R.ext&&R.ext.sel&&isFinite(+R.ext.sel.x0))? +R.ext.sel.x0 : 0;   // span start along the member
const spRange=(R,g)=>fmt(g.x0,1)+'–'+fmt(g.x1,1)+' ft'+(R.useExt&&spX0(R)?' (member '+fmt(spX0(R)+g.x0,1)+'–'+fmt(spX0(R)+g.x1,1)+')':'');
const spPlates=g=>'top '+fmt(g.dims.bft,2)+'×'+fmt(g.dims.tft,3)+' · bot '+fmt(g.dims.bfb,2)+'×'+fmt(g.dims.tfb,3)+' in';
// Which segment each check's governing station lies in (station.si is the segment the check used there).
function spGovTags(R){
  const t=R.segP.map(()=>[]), add=(si,s)=>{ if(si!=null&&t[si]) t[si].push(s); };
  const siX=x=>{ const st=(R.stations||[]).find(s=>s.x===x); return st? st.si : spSegAt(R.segP,x); };
  add(spMidIdx(R),'midspan: summary cards, drawings, derivations');
  const s2=R.stress&&R.stress.s2Gov; if(s2&&s2.r>0) add(s2.si,'Service II gov. @ '+fmt(s2.x,1)+' ft');
  const c=R.constr; if(c&&c.xGov!=null&&c.fbuTopC) add(siX(c.xGov),'constructibility gov. @ '+fmt(c.xGov,1)+' ft');
  const fg=R.flex&&R.flex.gov; if(fg&&fg.r>0&&!R.flex.oos) add(fg.si,'Strength +M gov. @ '+fmt(fg.x,1)+' ft');
  const ng=R.hasNeg&&R.neg&&R.neg.negBGov; if(ng&&ng.r>0) add(ng.si,'Strength −M gov. @ '+fmt(ng.x,1)+' ft (cracked)');
  const fa=R.fatigue; if(fa&&fa.xGov!=null) add(siX(fa.xGov),'fatigue gov. @ '+fmt(fa.xGov,1)+' ft');
  return t;
}
// Deck rebar in the cracked section of a segment (0 when none is included: no A_s, or deck not composite),
// and its depth below the top of the slab, read back from crackedSection's own result.
const spAs=g=>{ const a=g.cr.A-g.bare.A; return a>1e-9? a : 0; };
const spDtop=(R,g)=>g.bare.hs+(+R.deck.haunch)+(+R.deck.ts)-g.cr.yr;
// The four property sets of one segment, as display strings (shared by the segment table, the x picker and the report).
function spRows(R,g){
  const n=R.n, cr=g.cr;
  const row=(lab,use,p,St,Sx)=>({lab,use,c:[fmt(p.A,1),fmt(p.ybar,2),fmt(p.I,0),fmt(p.Sb,0),fmt(St,0),Sx==null?'—':fmt(Sx,0)]});
  return [
    row('Bare steel','DC1 (noncomposite)',g.bare,g.bare.StSteel,null),
    row('Long-term composite, 3n = '+(3*n),'DC2 + DW',g.c3N,g.c3N.StSteel,g.c3N.StDeckTr),
    row('Short-term composite, n = '+n,'LL + IM',g.cN,g.cN.StSteel,g.cN.StDeckTr),
    row('Cracked: steel + rebar (6.10.1.1.1c)','−M (DC2, DW, −LL) · '+(spAs(g)>0?'A_s = '+fmt(spAs(g),2)+' in² @ y = '+fmt(cr.yr,2)+' in':'no rebar included'),
      cr,cr.St,spAs(g)>0?cr.Srb:null)];
}
const SP_HEAD=['A (in²)','ȳ from bot (in)','I (in⁴)','S_bot (in³)','S_top,steel (in³)','S_slab top (tr) / S_rebar (in³)'];
const spNote=R=>'ȳ from the bottom of the bottom flange. S_slab top is I/(distance to the top of the slab) on the transformed section (concrete stress = M/(n·S)); S_rebar is I/(distance to the deck rebar) on the cracked section. Cracked section: steel + longitudinal deck reinforcement'+(spAs(R.segP[0])>0?' A_s = '+fmt(spAs(R.segP[0]),2)+' in² at '+fmt(spDtop(R,R.segP[0]),2)+' in below the top of the slab (y = its height above the bottom of the steel)':' (none included)')+', concrete neglected (6.10.1.1.1c; crackedSection). '+(R.hasNeg?'The −M checks use it where the moment is negative.':'This span has no negative moment: the cracked rows are for information only.')+(R.deck.deckOn?'':' Deck not composite: the composite and cracked rows equal the bare steel.');
// Per-segment table (Section Props tab). Rows grouped by segment; the governing-segment tags are on the left.
function SegPropsTable({R}){
  const tags=spGovTags(R);
  return <div className="scrollx"><table className="eng sp-tbl">
    <thead><tr><th>Segment</th><th>Section</th>{SP_HEAD.map(h=><th key={h}>{h}</th>)}<th>Mp (k-ft)</th><th>Dp (in)</th></tr></thead>
    <tbody>{R.segP.map(g=>spRows(R,g).map((r,k)=><tr key={g.i+'-'+k} className={k===0?'sp-first':''}>
      {k===0&&<td rowSpan={4} className="sp-seg"><b>Segment {g.i+1}</b><div>x = {spRange(R,g)}</div><div>{spPlates(g)}</div>
        <div>web {fmt(g.dims.D,2)}×{fmt(g.dims.tw,4)} in · {g.oos?<b style={{color:'var(--fail)'}}>{OOS_TXT}: PNA below the web</b>:g.compact?'compact':'noncompact'}</div>
        {tags[g.i].map((s,j)=><span key={j} className="sp-tag">{s}</span>)}</td>}
      <td style={{textAlign:'left'}}>{r.lab}<div className="sp-use">{r.use}</div></td>
      {r.c.map((v,j)=><td key={j}>{v}</td>)}
      {k===0&&<td rowSpan={4}>{g.oos?OOS_TXT:fmt(g.pl.Mp/12,0)}</td>}{k===0&&<td rowSpan={4}>{g.oos?OOS_TXT:fmt(g.pl.Dp,2)}</td>}
    </tr>))}</tbody></table></div>;
}
// Properties at any x along the span (and any span of a multi-span import). The position is a UI preference
// (stgirder.ui.v1, key propsAt = {span, x}); nothing goes into the session data.
function PropsAtX({R,inp}){
  const ext=inp&&inp.external;
  const spans=(R.useExt&&R.ext&&ext)? externalSpans(ext) : [];
  const curIdx=(R.useExt&&R.ext&&R.ext.sel)? R.ext.sel.idx : null;
  const ui0=(()=>{ try{ return loadUI().propsAt||{}; }catch(e){ return {}; } })();
  const [spIdx,setSpIdx]=useState(()=>spans.some(s=>s.idx===ui0.span)? ui0.span : curIdx);
  const [xIn,setXIn]=useState(()=>(ui0.x!=null&&isFinite(+ui0.x))? +ui0.x : null);
  const sp=spans.find(s=>s.idx===spIdx);
  const other=!!(sp&&spIdx!==curIdx);
  const Rx=useMemo(()=>{ if(!other) return R;
    try{ const secNew=zonesToSec(ext,sp,inp.sec);
      return computeAll({...inp, external:{...ext,_selSpan:sp}, geom:{...inp.geom,L:sp.len}, ...(secNew?{sec:secNew}:{})}); }
    catch(e){ return {ok:false,error:e.message}; } },[R,inp,spIdx,other]);
  const L=Rx.ok? +Rx.geom.L : +R.geom.L;
  const x=Math.min(Math.max(xIn==null? L/2 : xIn,0),L);
  const save=(s,xv)=>{ try{ saveUI({propsAt:{span:s,x:xv}}); }catch(e){} };
  const setX=v=>{ const xv=Math.min(Math.max(+v||0,0),L); setXIn(xv); save(spIdx,xv); };
  const pickSpan=v=>{ const s=+v; setSpIdx(s); setXIn(null); save(s,null); };
  const ctl={fontFamily:'var(--sans)',fontSize:13,height:28,border:'1px solid var(--border-hi)',borderRadius:'var(--r)',padding:'0 8px',background:'var(--sheet)',color:'var(--text)'};
  if(!Rx.ok) return <Card title="Section properties at a location" refTag="pick x along the span">
    <div className="callout" style={{marginTop:0}}>Span {spIdx} could not be evaluated: {Rx.error}</div></Card>;
  const si=spSegAt(Rx.segP,x), g=Rx.segP[si], rows=spRows(Rx,g), x0=other? +sp.x0 : spX0(Rx);
  return <Card title="Section properties at a location" refTag="pick x along the span · all four sets">
    <div className="sp-ctl">
      {spans.length>1&&<label>Span <select value={spIdx==null?'':spIdx} onChange={e=>pickSpan(e.target.value)} style={ctl}>
        {spans.map(s=><option key={s.idx} value={s.idx}>Span {s.idx} ({fmt(s.x0,0)}–{fmt(s.x1,0)} ft){s.idx===curIdx?' · design span':''}</option>)}</select></label>}
      <label className="sp-range">x <input type="range" min={0} max={L} step={L/1000} value={x} onChange={e=>setX(e.target.value)} aria-label="x along the span (ft)"/></label>
      <label><input type="number" min={0} max={L} step={0.5} value={+x.toFixed(3)} onChange={e=>setX(e.target.value)} style={{...ctl,width:96}}/> ft</label>
      <button className="btn sm" onClick={()=>setX(L/2)}>Midspan</button>
    </div>
    <div className="kv sp-kv">
      {[['Location','x = '+fmt(x,2)+' ft of L = '+fmt(L,2)+' ft'+(spans.length?' · member x = '+fmt(x0+x,2)+' ft (span '+(other?spIdx:curIdx)+')':'')],
        ['Segment',(si+1)+' of '+Rx.segP.length+' · x = '+fmt(g.x0,1)+'–'+fmt(g.x1,1)+' ft'+(Rx.segP.length>1&&Math.abs(x-g.x1)<1e-9&&si<Rx.segP.length-1?' (at the splice: left segment, as the checks)':'')],
        ['Plates',spPlates(g)+' · web '+fmt(g.dims.D,2)+'×'+fmt(g.dims.tw,4)+' in'],
        ['Effective flange width b_eff',fmt(Rx.beff,1)+' in (constant along the span)'],
        ['Modular ratio',(Rx.deck.deckOn?'n = '+Rx.n+' (E_s/E_c = '+fmt(Rx.nRaw,2)+'), 3n = '+(3*Rx.n):'— (deck not composite)')],
        ['Plastic moment',g.oos? OOS_TXT+' (plastic neutral axis below the web, Table D6.1-1 / D6.3.2 do not cover it)' : fmt(g.pl.Mp/12,0)+' k-ft · D_p = '+fmt(g.pl.Dp,2)+' in · '+(g.compact?'compact':'noncompact')]]
        .map((r,i)=><React.Fragment key={i}><span className="k">{r[0]}</span><span className="dots"></span><span className="v">{r[1]}</span></React.Fragment>)}
    </div>
    <div className="scrollx" style={{marginTop:10}}><table className="eng sp-at">
      <thead><tr><th>Section at x = {fmt(x,2)} ft</th>{SP_HEAD.map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{rows.map((r,k)=><tr key={k}><td>{r.lab}<div className="sp-use">{r.use}</div></td>{r.c.map((v,j)=><td key={j}>{v}</td>)}</tr>)}</tbody></table></div>
    <div className="hint">{other?<span>Span {spIdx} is not the design span: its plates are the imported section zones, as ST-Girder would take them if this span were designed (the checks stay on span {curIdx}). </span>:null}
      These are the properties of segment {si+1}, the same values as its rows in the table above; the checks at a station in this segment use them.</div>
  </Card>;
}

/* Section Props derivations, shared by the Section Props tab and the calculation-sheet report (display only;
   moved out of SectionTab unchanged so both show the same worked steps). si = flange segment to work (default: the
   midspan segment, as before); right = the segment picker shown on the tab. */
function secDerivs(R,si0,right){
  const {sec,matR,deck,n,nRaw,EcDeck,beff,compactMat,compactDtw,lambdaPw}=R;
  const si=(si0!=null&&R.segP[si0])? si0 : spMidIdx(R), sg=R.segP[si];
  const {cN,c3N,cr,pl,compact,compactWeb,Rh,Rb}=sg, IycIyt=sg.Iyc/sg.Iyt;
  const msDims=sg.dims;   // flange plates of the worked segment
  const segTxt='segment '+(si+1)+(si===spMidIdx(R)?' (midspan)':'')+', x = '+fmt(sg.x0,1)+'–'+fmt(sg.x1,1)+' ft';
  const As=spAs(sg), bA=sg.bare;
  const trans=(
    <Deriv id="stg-d-trans" title={'Derivation — transformed sections (n, 3n, cracked) · '+segTxt} refTag="LRFD 4.6.2.6 · 6.10.1.1.1b · 6.10.1.1.1c" right={right}>
      <VarTable title={'Variables — section & materials ('+segTxt+')'} rows={[
        ['D','Web depth',sec.D,'in'],['t_w','Web thickness',sec.tw,'in'],
        ['b_ft','Top (compression) flange width',msDims.bft,'in'],['t_ft','Top flange thickness',msDims.tft,'in'],
        ['b_fb','Bottom (tension) flange width',msDims.bfb,'in'],['t_fb','Bottom flange thickness',msDims.tfb,'in'],
        ['F_y','Steel yield (flange/web)',matR.Fyf,'ksi'],
        ['t_s','Structural deck thickness',deck.ts,'in'],["f'_c",'Deck concrete strength',deck.fc,'ksi'],
        ['E_s','Steel modulus',matR.Es,'ksi'],['E_c','Deck concrete modulus',EcDeck,'ksi'],
        ['b_eff','Effective deck width',beff,'in'],
        ['n','Modular ratio E_s/E_c (rounded, min 6)',n,'—'],
      ]}/>
      <Step d="Modular ratio" r="6.10.1.1.1b">
        <ML s={Tx`n=\frac{E_s}{E_c}=\frac{${nx(matR.Es,0)}}{${nx(EcDeck,0)}}=${nx(nRaw,2)}\;\rightarrow\;${n}\;(\text{rounded, }\ge 6)`}/>
      </Step>
      <Step d="Transformed deck & section properties" r="transformed-area method">
        <ML s={Tx`b_{tr}=\frac{b_{eff}}{n}=\frac{${nx(beff,1)}}{${n}}=${nx(beff/n,1)}\;\text{in}\qquad A_{deck,tr}=\frac{b_{eff}\,t_s}{n}=${nx(beff*deck.ts/n,1)}\;\text{in}^2`}/>
        <ML s={Tx`\bar y=${nx(cN.ybar,2)}\;\text{in (from bottom)}\qquad I=${nx(cN.I,0)}\;\text{in}^4\qquad D_c=${nx(cN.Dc,1)}\;\text{in (web in comp.)}`}/>
        <ML s={Tx`S_{bot}=\frac{I}{\bar y}=${nx(cN.Sb,0)}\quad S_{top,st}=\frac{I}{h-\bar y}=${nx(cN.StSteel,0)}\;\text{in}^3`}/>
        <div className="mnote">The long-term (3n) section uses 3n in place of n to account for concrete creep under sustained SIDL; DC1 acts on the bare steel section before the deck cures.</div>
      </Step>
      <Step d="Long-term transformed section (3n)" r="transformed-area method">
        <ML s={Tx`b_{tr}=\frac{b_{eff}}{3n}=\frac{${nx(beff,1)}}{${3*n}}=${nx(beff/(3*n),1)}\;\text{in}\qquad A_{deck,tr}=\frac{b_{eff}\,t_s}{3n}=${nx(beff*deck.ts/(3*n),1)}\;\text{in}^2`}/>
        <ML s={Tx`\bar y=${nx(c3N.ybar,2)}\;\text{in}\qquad I=${nx(c3N.I,0)}\;\text{in}^4\qquad S_{bot}=${nx(c3N.Sb,0)}\quad S_{top,st}=${nx(c3N.StSteel,0)}\;\text{in}^3`}/>
      </Step>
      <Step d="Cracked section (steel + longitudinal deck reinforcement, concrete neglected)" r="parallel-axis theorem · AASHTO LRFD 6.10.1.1.1c">
        {As>0? <React.Fragment>
          <ML s={Tx`y_r=h_s+t_h+t_s-d_{top}=${nx(bA.hs,3)}+${nx(+deck.haunch,2)}+${nx(+deck.ts,2)}-${nx(spDtop(R,sg),2)}=${nx(cr.yr,2)}\;\text{in}\qquad A_s=${nx(As,2)}\;\text{in}^2`}/>
          <ML s={Tx`\bar y=\frac{A_{st}\bar y_{st}+A_s y_r}{A_{st}+A_s}=\frac{${nx(bA.A,2)}\cdot${nx(bA.ybar,3)}+${nx(As,2)}\cdot${nx(cr.yr,2)}}{${nx(bA.A,2)}+${nx(As,2)}}=${nx(cr.ybar,2)}\;\text{in}`}/>
          <ML s={Tx`I=I_{st}+A_{st}(\bar y-\bar y_{st})^2+A_s(y_r-\bar y)^2=${nx(bA.I,0)}+${nx(bA.A,2)}(${nx(cr.ybar-bA.ybar,3)})^2+${nx(As,2)}(${nx(cr.yr-cr.ybar,3)})^2=${nx(cr.I,0)}\;\text{in}^4`}/>
          <ML s={Tx`S_{bot}=${nx(cr.Sb,0)}\quad S_{top,st}=${nx(cr.St,0)}\quad S_{rebar}=${nx(cr.Srb,0)}\;\text{in}^3\qquad D_{c}(-M)=${nx(cr.DcNeg,1)}\;\text{in}`}/>
        </React.Fragment>
        : <div className="mnote">{deck.deckOn?'No deck reinforcement entered (A_s = 0):':'Deck not composite:'} the cracked section is the bare steel section (I = {fmt(cr.I,0)} in⁴).</div>}
        <div className="mnote">Used for DC2, DW and −LL stresses where the moment is negative; DC1 always acts on the bare steel. h_s = steel depth, t_h = haunch, d_top = rebar depth below the top of the slab.</div>
      </Step>
    </Deriv>
  );
  // Plastic moment worked per Table D6.1-1 (positive flexure) with the quantities plasticMoment returns (display only).
  const plastic=(()=>{ const d=msDims, Fy=matR.Fyf, Fw=matR.Fyw, on=!!deck.deckOn, ts=+deck.ts, th=+deck.haunch, fc=+deck.fc;
    const cs=pl.region==='Web'?1:pl.region==='Top flange'?2:3, a=pl.arm||{}, off=pl.off||0, Dp=pl.Dp, Y=pl.Ybar;
    const yS=ts/2, yC=off+d.tft/2, yW=off+d.tft+d.D/2, yT=off+d.tft+d.D+d.tfb/2;
    const ge=(l,r)=>l>=r?'\\ge':'<', ok=v=>v?'\\checkmark':'\\text{N.G.}';
    const offV=on? nx(ts,2)+'+'+nx(th,2)+'+' : '';
    const arm=(sym,tx,y,v)=>v==null?null:<ML key={sym} s={Tx`${sym}=\left|D_p-${tx}\right|=\left|${nx(Dp,3)}-${nx(y,3)}\right|=${nx(v,3)}\;\text{in}`}/>;
    const caseName=cs===1?'I':cs===2?'II':'III–VII', oosP=!!pl.belowWeb;   // PNA-OOS: PNA below the web
    return <Deriv id="stg-d-plastic" title={'Derivation — plastic moment Mₚ & PNA · '+segTxt} refTag="AASHTO Appendix D6.1 · Table D6.1-1 (positive flexure)">
      <VarTable title="Plastic forces (positive flexure, deck reinforcement neglected)" rows={[
        ['P_s','Deck slab compression 0.85f′_c·b_eff·t_s',pl.Ps,'kip'],
        ['P_c','Top-flange force F_yc·b_ft·t_ft',pl.Pc,'kip'],
        ['P_w','Web force F_yw·D·t_w',pl.Pw,'kip'],
        ['P_t','Bottom-flange force F_yt·b_fb·t_fb',pl.Pt,'kip'],
        ['D_p','Depth of PNA below top of slab',oosP?OOS_TXT:pl.Dp,'in'],
        ['D_t','Total depth (slab top to bottom flange)',pl.Dt,'in'],
      ]}/>
      <Step d="Plastic forces" r="D6.1">
        {on? <ML s={Tx`P_s=0.85f'_c\,b_{eff}\,t_s=0.85\cdot${nx(fc,2)}\cdot${nx(beff,2)}\cdot${nx(ts,2)}=${nx(pl.Ps,0)}\;\text{kip}`}/>
          : <div className="mnote">Deck not composite: the deck terms are dropped (D6.1, noncomposite section), P_s = 0, and depths are measured from the top of the steel.</div>}
        <ML s={Tx`P_c=F_{yc}\,b_{ft}\,t_{ft}=${nx(Fy,1)}\cdot${nx(d.bft,3)}\cdot${nx(d.tft,3)}=${nx(pl.Pc,0)}\;\text{kip}`}/>
        <ML s={Tx`P_w=F_{yw}\,D\,t_w=${nx(Fw,1)}\cdot${nx(d.D,3)}\cdot${nx(d.tw,4)}=${nx(pl.Pw,0)}\;\text{kip}`}/>
        <ML s={Tx`P_t=F_{yt}\,b_{fb}\,t_{fb}=${nx(Fy,1)}\cdot${nx(d.bfb,3)}\cdot${nx(d.tfb,3)}=${nx(pl.Pt,0)}\;\text{kip}`}/>
        <div className="mnote">The longitudinal deck reinforcement is neglected (P_rb = P_rt = 0), which D6.1 permits as conservative. Element forces act at mid-thickness of the deck and flanges and at mid-depth of the web.</div>
      </Step>
      <Step d="Which case applies — conditions checked in the order of Table D6.1-1" r="Table D6.1-1">
        <ML s={Tx`\text{I (web): }P_t+P_w=${nx(pl.Pt,0)}+${nx(pl.Pw,0)}=${nx(pl.Pt+pl.Pw,0)}\;${ge(pl.Pt+pl.Pw,pl.Pc+pl.Ps)}\;P_c+P_s=${nx(pl.Pc,0)}+${nx(pl.Ps,0)}=${nx(pl.Pc+pl.Ps,0)}\;\Rightarrow\;\text{${oosP?'condition met':cs===1?'Case I applies':'no'}}`}/>
        {oosP&&<ML s={Tx`P_t=${nx(pl.Pt,0)}\;>\;P_s+P_c+P_w=${nx(pl.Ps,0)}+${nx(pl.Pc,0)}+${nx(pl.Pw,0)}=${nx(pl.Ps+pl.Pc+pl.Pw,0)}\;\text{kip}\;\Rightarrow\;\bar Y>D\text{: PNA below the web, not covered by Table D6.1-1 or D6.3.2}`}/>}
        {cs>=2&&<ML s={Tx`\text{II (top flange): }P_t+P_w+P_c=${nx(pl.Pt+pl.Pw+pl.Pc,0)}\;${ge(pl.Pt+pl.Pw+pl.Pc,pl.Ps)}\;P_s=${nx(pl.Ps,0)}\;\Rightarrow\;\text{${cs===2?'Case II applies':'no'}}`}/>}
        {cs===3&&<div className="mnote">Cases III–VII (PNA in the concrete deck): with P_rb = P_rt = 0 their conditions and equations reduce to the same Ȳ = t_s(P_c + P_w + P_t)/P_s and the same M_p, so the PNA is in the deck.</div>}
      </Step>
      {oosP? <div className="callout oos" style={{marginTop:6}}><b>{OOS_TXT}.</b> {PNA_OOS_HEAD} M_p, D_p and D_cp of this segment are not reported, and the Strength I positive-flexure, ductility and compactness results that use them are not reported.</div> : <React.Fragment>
      <Step d={'Case '+caseName+': location of the PNA, Ȳ and D_p'} r="Table D6.1-1">
        {cs===1&&<ML s={Tx`\bar Y=\frac{D}{2}\left[\frac{P_t-P_c-P_s}{P_w}+1\right]=\frac{${nx(d.D,3)}}{2}\left[\frac{${nx(pl.Pt,1)}-${nx(pl.Pc,1)}-${nx(pl.Ps,1)}}{${nx(pl.Pw,1)}}+1\right]=${nx(Y,3)}\;\text{in}`}/>}
        {cs===2&&<ML s={Tx`\bar Y=\frac{t_{ft}}{2}\left[\frac{P_w+P_t-P_s}{P_c}+1\right]=\frac{${nx(d.tft,3)}}{2}\left[\frac{${nx(pl.Pw,1)}+${nx(pl.Pt,1)}-${nx(pl.Ps,1)}}{${nx(pl.Pc,1)}}+1\right]=${nx(Y,3)}\;\text{in}`}/>}
        {cs===3&&<ML s={Tx`\bar Y=t_s\,\frac{P_c+P_w+P_t}{P_s}=${nx(ts,2)}\cdot\frac{${nx(pl.Pc,1)}+${nx(pl.Pw,1)}+${nx(pl.Pt,1)}}{${nx(pl.Ps,1)}}=${nx(Y,3)}\;\text{in}`}/>}
        {cs===1&&<ML s={Tx`D_p=${on?'t_s+t_h+':''}t_{ft}+\bar Y=${offV}${nx(d.tft,3)}+${nx(Y,3)}=${nx(Dp,3)}\;\text{in}`}/>}
        {cs===2&&<ML s={Tx`D_p=${on?'t_s+t_h+':''}\bar Y=${offV}${nx(Y,3)}=${nx(Dp,3)}\;\text{in}`}/>}
        {cs===3&&<ML s={Tx`D_p=\bar Y=${nx(Dp,3)}\;\text{in}`}/>}
        <div className="mnote">Ȳ is measured from the top of the {cs===1?'web':cs===2?'top flange':'deck'}; D_p = depth of the PNA below the {on?'top of the concrete deck (t_h = haunch)':'top of the steel'}.</div>
      </Step>
      <Step d="Moment arms d_i from each element force to the PNA" r="D6.1">
        {on&&arm('d_s',Tx`\tfrac{t_s}{2}`,yS,a.ds)}
        {arm('d_c',on?Tx`\left(t_s+t_h+\tfrac{t_{ft}}{2}\right)`:Tx`\tfrac{t_{ft}}{2}`,yC,a.dc)}
        {arm('d_w',on?Tx`\left(t_s+t_h+t_{ft}+\tfrac{D}{2}\right)`:Tx`\left(t_{ft}+\tfrac{D}{2}\right)`,yW,a.dw)}
        {arm('d_t',on?Tx`\left(t_s+t_h+t_{ft}+D+\tfrac{t_{fb}}{2}\right)`:Tx`\left(t_{ft}+D+\tfrac{t_{fb}}{2}\right)`,yT,a.dt)}
        <div className="mnote">The element containing the PNA ({cs===1?'web':cs===2?'top flange':'deck'}) is split at the PNA; its two parts are the first term of M_p below.</div>
      </Step>
      <Step d="Plastic moment M_p (moment of the plastic forces about the PNA)" r="Table D6.1-1">
        {cs===1&&<React.Fragment>
          <ML s={Tx`M_p=\frac{P_w}{2D}\left[\bar Y^2+(D-\bar Y)^2\right]+\left[${on?'P_sd_s+':''}P_cd_c+P_td_t\right]`}/>
          <ML s={Tx`=\frac{${nx(pl.Pw,1)}}{2\cdot${nx(d.D,3)}}\left[(${nx(Y,3)})^2+(${nx(d.D,3)}-${nx(Y,3)})^2\right]+\left[${on?nx(pl.Ps,1)+'\\cdot '+nx(a.ds,3)+'+':''}${nx(pl.Pc,1)}\cdot${nx(a.dc,3)}+${nx(pl.Pt,1)}\cdot${nx(a.dt,3)}\right]`}/></React.Fragment>}
        {cs===2&&<React.Fragment>
          <ML s={Tx`M_p=\frac{P_c}{2t_{ft}}\left[\bar Y^2+(t_{ft}-\bar Y)^2\right]+\left[${on?'P_sd_s+':''}P_wd_w+P_td_t\right]`}/>
          <ML s={Tx`=\frac{${nx(pl.Pc,1)}}{2\cdot${nx(d.tft,3)}}\left[(${nx(Y,3)})^2+(${nx(d.tft,3)}-${nx(Y,3)})^2\right]+\left[${on?nx(pl.Ps,1)+'\\cdot '+nx(a.ds,3)+'+':''}${nx(pl.Pw,1)}\cdot${nx(a.dw,3)}+${nx(pl.Pt,1)}\cdot${nx(a.dt,3)}\right]`}/></React.Fragment>}
        {cs===3&&<React.Fragment>
          <ML s={Tx`M_p=\frac{\bar Y^2P_s}{2t_s}+\left[P_cd_c+P_wd_w+P_td_t\right]`}/>
          <ML s={Tx`=\frac{(${nx(Y,3)})^2\cdot${nx(pl.Ps,1)}}{2\cdot${nx(ts,2)}}+\left[${nx(pl.Pc,1)}\cdot${nx(a.dc,3)}+${nx(pl.Pw,1)}\cdot${nx(a.dw,3)}+${nx(pl.Pt,1)}\cdot${nx(a.dt,3)}\right]`}/></React.Fragment>}
        <ML s={Tx`M_p=${nx(pl.Mp,0)}\;\text{kip-in}=\frac{${nx(pl.Mp,0)}}{12}=${nx(pl.Mp/12,0)}\;\text{k-ft}`}/>
      </Step>
      <Step d="Depths D_t, D_p/D_t and D_cp" r="6.10.7.1.2 · D6.3.2">
        <ML s={Tx`D_t=${on?'t_s+t_h+':''}t_{ft}+D+t_{fb}=${offV}${nx(d.tft,3)}+${nx(d.D,3)}+${nx(d.tfb,3)}=${nx(pl.Dt,3)}\;\text{in}`}/>
        <ML s={Tx`\frac{D_p}{D_t}=\frac{${nx(Dp,3)}}{${nx(pl.Dt,3)}}=${nx(Dp/pl.Dt,3)}`}/>
        {cs===1
          ? (on? <ML s={Tx`D_{cp}=\frac{D}{2}\left[\frac{F_{yt}A_t-F_{yc}A_c-0.85f'_cA_s}{F_{yw}A_w}+1\right]=${Math.abs(pl.Dcp-Y)<1e-9?'\\bar Y=':''}${nx(pl.Dcp,3)}\;\text{in}\quad(\text{D6.3.2-1},\;A_{rs}=0)`}/>
             : null)
          : (on? <ML s={Tx`D_{cp}=0\quad(\text{PNA not in the web, D6.3.2})`}/> : null)}
        {!on&&<React.Fragment>
          <ML s={Tx`F_{yw}A_w=P_w=${nx(pl.Pw,1)}\;${pl.Pw>=Math.abs(pl.Pc-pl.Pt)?'\\ge':'<'}\;\left|F_{yc}A_c-F_{yt}A_t\right|=\left|${nx(pl.Pc,1)}-${nx(pl.Pt,1)}\right|=${nx(Math.abs(pl.Pc-pl.Pt),1)}\quad(\text{D6.3.2-3})`}/>
          {pl.Pw>=Math.abs(pl.Pc-pl.Pt)
            ? <ML s={Tx`D_{cp}=\frac{D}{2A_wF_{yw}}\left(F_{yt}A_t+F_{yw}A_w-F_{yc}A_c\right)=\frac{${nx(d.D,3)}}{2\cdot${nx(pl.Pw,1)}}\left(${nx(pl.Pt,1)}+${nx(pl.Pw,1)}-${nx(pl.Pc,1)}\right)=${nx(pl.Dcp,3)}\;\text{in}\quad(\text{D6.3.2-4})`}/>
            : <ML s={Tx`\text{D6.3.2-3 not satisfied}\;\Rightarrow\;D_{cp}=D=${nx(pl.Dcp,3)}\;\text{in}\quad(\text{D6.3.2, all other noncomposite sections})`}/>}
        </React.Fragment>}
        <div className="mnote">D_cp feeds the web compactness check (Classification card); D_p/D_t feeds the ductility term of M_n.</div>
      </Step>
      {on&&<Step d="Nominal flexural resistance M_n and ductility of this segment" r="6.10.7.1.2 · 6.10.7.3">
        {sg.compact&&sg.Mn_kft!=null
          ? (Dp<=0.1*pl.Dt
            ? <ML s={Tx`D_p=${nx(Dp,2)}\le0.1D_t=${nx(0.1*pl.Dt,2)}\;\Rightarrow\;M_n=M_p=${nx(sg.Mn_kft,0)}\;\text{k-ft}\quad(6.10.7.1.2\text{-}1)`}/>
            : <React.Fragment><ML s={Tx`D_p=${nx(Dp,2)}>0.1D_t=${nx(0.1*pl.Dt,2)}\;\Rightarrow\;M_n=M_p\left(1.07-0.7\frac{D_p}{D_t}\right)\quad(6.10.7.1.2\text{-}2)`}/><ML s={Tx`M_n=${nx(pl.Mp/12,0)}\left(1.07-0.7\cdot${nx(Dp/pl.Dt,4)}\right)=${nx(sg.Mn_kft,0)}\;\text{k-ft}`}/></React.Fragment>)
          : <div className="mnote">This segment is noncompact (Classification card): M_n is not taken from M_p; the flexure check uses the flange stresses (6.10.7.2).</div>}
        <ML s={Tx`D_p=${nx(Dp,2)}\;${Dp<=0.42*pl.Dt?'\\le':'>'}\;0.42D_t=${nx(0.42*pl.Dt,2)}\;\text{in}\;${ok(Dp<=0.42*pl.Dt)}\quad(6.10.7.3\text{-}1)`}/>
        <div className="mnote">In a continuous span M_n is further limited to 1.3R_hM_y at each station (6.10.7.1.2-3), worked in the Flexure tab. The ductility result in the checks is that of the segment at the governing +M station.</div>
        <DLinks lead="Used in:" items={[{to:'flexpos',what:'M_n in the flexure check'}]}/>
      </Step>}
      </React.Fragment>}
    </Deriv>; })();
  const cls=(
    <Deriv id="stg-d-cls" title={'Classification & stability factors · '+segTxt} refTag="6.10.1.10 · 6.10.6.2.2">
      <VarTable title="Web classification & stability" rows={[
        ['D/t_w','Web slenderness',sec.D/sec.tw,'≤ 150'],
        ['2D_cp/t_w','Web slenderness in plastic compression',pl.belowWeb?OOS_TXT:2*pl.Dcp/sec.tw,'vs λ_pw'],
        ['λ_pw','Compact-web limit 3.76√(E/F_yc)',lambdaPw,'—'],
        ['F_yf','Flange yield (compact needs ≤ 70)',matR.Fyf,'ksi'],
        ['R_h','Hybrid factor (6.10.1.10.1)',Rh,'—'],
        ['R_b','Load-shedding factor (6.10.1.10.2)',pl.belowWeb?OOS_TXT:Rb,'—'],
        ['I_yc/I_yt','Flange inertia ratio (0.1–10)',IycIyt,'—'],
        ['D_c','Web depth in compression (elastic, n)',cN.Dc,'in'],
      ]}/>
      <Step d="Web compactness" r="6.10.6.2.2">
        {pl.belowWeb? <div className="callout oos" style={{marginTop:0}}><b>{OOS_TXT}.</b> The plastic neutral axis of this segment falls below the web: D_cp (D6.3.2), the web compactness, the compact-section classification and R_b (which uses it) are not determined. {PNA_OOS_HEAD}</div>
        : <ML s={Tx`\frac{2D_{cp}}{t_w}=${nx(2*pl.Dcp/sec.tw,1)}\;${compactWeb?'\\le':'>'}\;\lambda_{pw}=3.76\sqrt{E/F_{yc}}=${nx(lambdaPw,1)}\;\Rightarrow\;\text{${compactWeb?'compact':'noncompact'} web}`}/>}
        <ML s={Tx`\frac{D}{t_w}=${nx(sec.D/sec.tw,1)}\;${compactDtw?'\\le':'>'}\;150\qquad F_{yf}=${nx(matR.Fyf,0)}\;${compactMat?'\\le':'>'}\;70\;\text{ksi}`}/>
        <DLinks items={[{to:'plastic',seg:sgI(R,si),what:'D_cp'}]}/>
        <div className="mnote">A section is <b>compact</b> (Mp-based positive-flexure capacity) only if the web is compact, F_yf ≤ 70 ksi, D/t_w ≤ 150, and the deck is composite — otherwise the noncompact stress-based check governs (see Flexure tab). Overall: <b>{pl.belowWeb?OOS_TXT:compact?'COMPACT':'NONCOMPACT'}</b>.</div>
      </Step>
      <Step d="Hybrid & load-shedding factors" r="6.10.1.10">
        {pl.belowWeb? <ML s={Tx`R_h=${nx(Rh,3)}\;(\text{${Rh>=0.999?'non-hybrid':'hybrid'}})\qquad R_b\text{: out of scope (uses the web compactness)}`}/>
        : <ML s={Tx`R_h=${nx(Rh,3)}\;(\text{${Rh>=0.999?'non-hybrid':'hybrid'}})\qquad R_b=${nx(Rb,3)}\;(\text{${Rb>=0.999?'no web load-shedding':'web load-shedding active'}})`}/>}
        <DLinks items={[{to:'trans',seg:sgI(R,si),what:'D_c (short-term n section) used in R_b'}]}/>
        <div className="mnote">R_h reduces flange resistance when the web yields before the flange (hybrid girders). R_b sheds load from a slender web in compression to the flanges. Both = 1.0 here when the web is compact and non-hybrid.</div>
      </Step>
    </Deriv>
  );
  return {trans,plastic,cls,si,segTxt};
}
function SectionTab({R,inp,go}){
  const [dSi,setDSi]=useState(()=>(go&&go.tab==='section'&&go.seg!=null)? go.seg : null);   // segment worked in the derivations (null = midspan segment, as before)
  useEffect(()=>{ if(go&&go.tab==='section'&&go.seg!=null&&R.ok&&R.segP[go.seg]) setDSi(go.seg); },[go&&go.n]);   // a derivation link picks the segment
  if(!R.ok) return null;
  const {sec,matR,deck,bare,cN,c3N,pl,n,nRaw,EcDeck,beff,compact,compactWeb,
    compactMat,compactDtw,lambdaPw,Rh,Rb,ductOK,Iyc,Iyt,IycIyt}=R;
  const mi=spMidIdx(R), gm=R.segP[mi], nSeg=R.segP.length;
  const segPick=nSeg>1? <select value={dSi!=null&&R.segP[dSi]?dSi:mi} onChange={e=>setDSi(+e.target.value)} aria-label="Segment for the worked derivations"
      style={{fontFamily:'var(--sans)',fontSize:12.5,height:26,padding:'0 6px',border:'1px solid var(--border-hi)',borderRadius:'var(--r)',background:'var(--sheet)',color:'var(--text)',maxWidth:280}}>
      {R.segP.map(g=><option key={g.i} value={g.i}>Segment {g.i+1} · x = {fmt(g.x0,1)}–{fmt(g.x1,1)} ft{g.i===mi?' · midspan':''}</option>)}</select> : null;
  const SD=secDerivs(R,dSi,segPick);   // derivations shared with the calculation-sheet report (display only)
  const midTxt='segment '+(mi+1)+(nSeg>1?' of '+nSeg:'')+', x = '+fmt(gm.x0,1)+'–'+fmt(gm.x1,1)+' ft';
  const propRow=(lab,p,tr)=>({c:[lab,fmt(p.A,1),fmt(p.ybar,2),fmt(p.I,0),fmt(p.Sb,0),fmt(p.StSteel,0), tr||'—']});
  const oosM=!!pl.belowWeb;   // PNA-OOS: midspan segment's PNA below the web
  return (<div>
    <PnaOos R={R}/>
    {oosM? <div className="bigres">
      <div className="br f"><div className="l">Plastic moment Mp</div><div className="n" style={{fontSize:16}}>{OOS_TXT}</div><div className="u">PNA below the web</div></div>
      <div className="br f"><div className="l">Web classification</div><div className="n" style={{fontSize:16}}>{OOS_TXT}</div><div className="u">D_cp: D6.3.2 does not cover it</div></div>
      <div className="br f"><div className="l">Ductility Dp ≤ 0.42Dt</div><div className="n" style={{fontSize:16}}>{OOS_TXT}</div><div className="u">Table D6.1-1 does not cover it</div></div>
    </div> :
    <div className="bigres">
      <div className="br"><div className="l">Plastic moment Mp</div><div className="n">{fmt(pl.Mp/12,0)}</div><div className="u">kip-ft · PNA in {pl.region}</div></div>
      <div className={'br '+(compact?'p':'')}><div className="l">Web classification</div><div className="n" style={{fontSize:16}}>{compact?'COMPACT':'NONCOMPACT'}</div><div className="u">2Dcp/tw vs {fmt(lambdaPw,1)}</div></div>
      <div className={'br '+(ductOK?'p':'f')}><div className="l">Ductility Dp ≤ 0.42Dt</div><div className="n">{fmt(pl.Dp/pl.Dt,3)}</div><div className="u">{fmt(pl.Dp,1)} / {fmt(0.42*pl.Dt,1)} in</div></div>
    </div>}

    <Card title={'Elastic section properties at midspan — '+midTxt} refTag="bare · short-term n · long-term 3n">
      <Tbl head={['Section','A (in²)','ȳ from bot (in)','I (in⁴)','S_bot (in³)','S_top,st (in³)','Deck S_tr']}
        rows={[
          propRow('Bare steel (noncomposite)',bare),
          propRow(`Short-term composite (n=${n})`,cN, cN.StDeckTr?fmt(cN.StDeckTr,0):'—'),
          propRow(`Long-term composite (3n=${3*n})`,c3N, c3N.StDeckTr?fmt(c3N.StDeckTr,0):'—'),
        ]}/>
      <div className="hint">Bare-steel props resist noncomposite dead load (DC1: self-weight + wet deck).
        Long-term composite (3n) carries permanent SIDL (DC2 + DW); short-term composite (n) carries live load.
        b_eff = <b>{fmt(beff,1)} in</b>. n = Es/Ec = {fmt(nRaw,2)} → <b>{n}</b> (rounded, 6.10.1.1.1b); Ec = {fmt(EcDeck,0)} ksi.
        These are the midspan segment's properties (also the Mp, classification and ductility cards above); every check uses the segment at its own station: see the table below.</div>
    </Card>

    <Card id="stg-d-segs" title="Section properties by flange segment" refTag="bare · 3n · n · cracked (steel + rebar, 6.10.1.1.1c) · where each check governs">
      <SegPropsTable R={R}/>
      <div className="hint">{spNote(R)} Web {fmt(R.sec.D,2)}×{fmt(R.sec.tw,4)} in constant. Each check runs station by station on the segment at that station; the tags show the segment of each governing station.</div>
    </Card>

    <PropsAtX R={R} inp={inp}/>

    {SD.trans}

    {SD.plastic}

    {SD.cls}

    {R.hasNeg&&R.neg&&<Card title={'Cracked negative-moment section (pier) — governing −M segment '+((R.neg.negBGov.si||0)+1)+(R.neg.negBGov.r>0?', x = '+fmt(R.neg.negBGov.x,1)+' ft':'')} refTag="6.10.1.1.1c · steel + deck rebar · concrete neglected">
      <KV rows={[['Rebar As (in beff)',fmt(R.neg.AsProv,2),'in²'],
        ['I cracked',fmt(R.neg.cr.I,0),'in⁴'],['ȳ from bottom',fmt(R.neg.cr.ybar,2),'in'],
        ['S bot (comp. flange)',fmt(R.neg.cr.Sb,0),'in³'],['S top steel',fmt(R.neg.cr.St,0),'in³'],
        ['Dc web compression (−M)',fmt(R.neg.cr.DcNeg,1),'in'],
        ['Min 1% deck reinf',fmt(R.neg.AsMin1pct,2),'in² '+(R.neg.rebarOK?'✓ provided':'✗ short')]]}/>
    </Card>}
    <Card title="Section proportion limits" refTag="AASHTO 6.10.2 · worst segment governs">
      <Tbl head={['Check','Value','Limit','D/C','Status']}
        rows={R.checks.filter(c=>c.ref&&c.ref.indexOf('6.10.2')===0).map(c=>({c:[c.n,fmt(c.v,2),fmt(c.lim,2),fmt(c.r,2),PF(c.pass)]}))}/>
    </Card>
  </div>);
}

/* PNA-OOS (2026-10-14): the positive-flexure PNA of a composite segment falls below the web (P_t > P_s + P_c + P_w),
   outside AASHTO Table D6.1-1 / D6.3.2 and so outside the scope of this app. Warning text and callout (display only). */
const PNA_OOS_HEAD='Outside the scope of this app: the plastic neutral axis falls below the web (bottom flange plastic force P_t exceeds P_s + P_c + P_w), which AASHTO LRFD 10th Ed. Table D6.1-1 and Art. D6.3.2 do not cover. Revise the section (e.g. reduce the bottom flange or increase the deck/top flange).';
const PNA_OOS_NOT='Not reported (OUT OF SCOPE): Strength I positive flexure, ductility D_p \u2264 0.42D_t, the web compactness / compact-section classification and M_p, D_p, D_cp of the segment(s) named, and the positive-moment and governing load ratings. The overall verdict is "Not all checks pass". Sending capacity to the MCT rating is blocked; the other checks and hand-offs are unaffected.';
const pnaOosSegs=R=>(R.pnaOOS||[]).map(g=>'Segment '+(g.i+1)+' (x = '+spRange(R,g)+'): P_t = '+fmt(g.Pt,0)+' kip > P_s + P_c + P_w = '+fmt(g.Ps,0)+' + '+fmt(g.Pc,0)+' + '+fmt(g.Pw,0)+' = '+fmt(g.Ps+g.Pc+g.Pw,0)+' kip.');
const pnaOosText=R=>[PNA_OOS_HEAD,...pnaOosSegs(R)].join(' ');
function PnaOos({R,style}){
  if(!R||!R.ok||!R.pnaOOS) return null;
  return <div className="callout oos" style={{marginTop:0,marginBottom:12,...(style||{})}}>
    <div><b>OUT OF SCOPE.</b> {PNA_OOS_HEAD}</div>
    {pnaOosSegs(R).map((t,i)=><div key={i} style={{marginTop:4}}><b>{t}</b></div>)}
    <div style={{marginTop:4}}>{PNA_OOS_NOT}</div></div>;
}
const OOS_TXT='OUT OF SCOPE';
/* Warnings for effects this app does not compute (STG-O1 flange lateral bending, STG-O8 fatigue with
   imported continuous demands). Display only. */
function StgWarn({R,kind}){
  if(!R||!R.ok||!R.warnings) return null;
  const w=R.warnings, items=kind==='fl'? w.fl : kind==='fat'? w.fat : [...w.fl,...w.fat];
  if(!items.length) return null;
  return <div className="callout warn" style={{marginTop:0,marginBottom:12}}>
    {items.map((t,i)=><div key={i} style={{marginTop:i?6:0}}>{t}</div>)}</div>;
}
/* Service II stage buildup at one station, shared by the Stresses tab (picked station) and the calculation-sheet
   report (governing station). Display only; moved out of StressTab unchanged. */
function s2Deriv(R,psel,right){
  const st=R.stress;
  return <Deriv id="stg-d-s2" title="Service II stress buildup at a selected location"
      refTag="stage-by-stage · bottom (tension) flange"
      right={right}>
      <VarTable title="Stage moments & section moduli at this station" rows={[
        ['x','Location',psel.x,'ft'],
        ['M_DC1','Self-weight + wet deck (bare)',psel.M1,'k-ft'],
        ['M_DC2','Superimposed DL — barrier (3n)',psel.M2,'k-ft'],
        ['M_DW','Wearing surface (3n)',psel.Mw,'k-ft'],
        ['M_LL','+LL+IM envelope (n)',psel.Ml,'k-ft'],
        ['S_b(bare)','Bottom modulus, bare steel',psel.SbBare,'in³'],
        ['S_b(3n)','Bottom modulus, long-term composite',psel.Sb3n,'in³'],
        ['S_b(n)','Bottom modulus, short-term composite',psel.Sbn,'in³'],
        [st.s2CoefLabel,'Service II stress limit',psel.lim,'ksi'],
      ]}/>
      <SG n="1">Stage stresses at the bottom flange (each on its stage-correct section)</SG>
      <ML s={Tx`f_{DC1}=\frac{M_{DC1}\cdot12}{S_{b,bare}}=\frac{${nx(psel.M1,0)}\cdot12}{${nx(psel.SbBare,0)}}=${nx(psel.dc1Bp,2)}\;\text{ksi}`}/>
      <ML s={Tx`f_{DC2}=\frac{M_{DC2}\cdot12}{S_{b,3n}}=${nx(psel.d2Bp,2)}\;\text{ksi}\qquad f_{DW}=\frac{M_{DW}\cdot12}{S_{b,3n}}=${nx(psel.dwBp,2)}\;\text{ksi}`}/>
      <ML s={Tx`f_{LL}=${lfP(lfS(R).gS2,'1.30')}\cdot\frac{M_{LL}\cdot12}{S_{b,n}}=${nx(psel.llBp,2)}\;\text{ksi}`}/>
      {lfS(R).on&&<div className="mnote">Service II γ_LL = 1.30m = {lfP(lfS(R).gS2,'1.30')} (owner rule, see the owner load rules banner){lfS(R).plOn?'; M_LL = (LL+IM+PL) − PL + PL/m = '+fmt(psel.MlD,1)+' k-ft at this station':''}.</div>}
      <DLinks items={[{to:'segs',seg:sgI(R,psel.si),what:'S_b (bare)'},{to:'trans',seg:sgI(R,psel.si),what:'S_b (3n, n)'},{to:'menv',what:'stage moments'}]}/>
      <SG n="2">Service II combination & check</SG>
      <ML s={Tx`f_{ServII}=f_{DC1}+f_{DC2}+f_{DW}+f_{LL}=${nx(psel.dc1Bp,2)}+${nx(psel.d2Bp,2)}+${nx(psel.dwBp,2)}+${nx(psel.llBp,2)}=${nx(psel.bP,2)}\;\text{ksi}`}/>
      <ML s={Tx`\frac{f_{ServII}}{0.95R_hF_yf}=\frac{${nx(Math.abs(psel.bP),2)}}{${nx(psel.lim,2)}}=${nx(Math.abs(psel.bP)/psel.lim,3)}\;${Math.abs(psel.bP)<=psel.lim*1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Top-flange Service II Σ at this station = {fmt(psel.tP,2)} ksi (compression). Sign convention: f_B + = bottom tension, f_T + = top compression. R_h = {fmt(psel.Rh,3)}. Flange lateral bending f_ℓ = 0 (straight girder).{R.hasNeg?' In −M regions the bottom-flange stress uses the cracked steel+rebar section (S_b,cr = '+fmt(psel.SbCr,0)+' in³).':''}</div>
      <DLinks items={[{to:'cls',seg:sgI(R,psel.si),what:'R_h'},...(R.hasNeg?[{to:'trans',seg:sgI(R,psel.si),what:'S_b,cr'}]:[])]}/>
    </Deriv>;
}
function StressTab({R}){
  if(!R.ok) return null;
  const st=R.stress;
  const row=(lab,f)=>({c:[lab,fmt(f.dc1,2),fmt(f.sid,2),fmt(f.ll,2),{v:fmt(f.serv2,2),cls:f.serv2<=st.fServLim?'ok':'no'}]});
  const topPass=st.fTop.serv2<=st.fServLim, botPass=st.fBot.serv2<=st.fServLim, defPass=st.dLL<=st.dLim;
  // ── along-span chart data (captured per station in computeAll) ──
  const ch=R.chartS2||[], cx=ch.map(p=>p.x);
  const [ov,setOv]=useState({bot:true,top:true,neg:!!R.hasNeg,lims:true});
  const OVS=[['bot','Bottom flange'],['top','Top flange'],...(R.hasNeg?[['neg','−LL branch']]:[]),['lims','Limits']];
  // ── stage-buildup location picker ──
  const Lspan=R.geom.L, govX=st.s2Gov?st.s2Gov.x:Lspan/2;
  const defIdx=ch.length? ch.reduce((bi,p,i,a)=>Math.abs(p.x-govX)<Math.abs(a[bi].x-govX)?i:bi,0):0;
  const [selIdx,setSelIdx]=useState(defIdx);
  const psel=ch.length? ch[Math.min(selIdx,ch.length-1)] : null;
  const stnLabel=(p,i)=>{ const x=p.x, t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    if(Math.abs(x-govX)<0.06) t.push('governing');
    return 'x = '+x.toFixed(1)+' ft'+(t.length?'  ·  '+t.join(', '):''); };
  return (<div>
    <StgWarn R={R} kind="fl"/>
    <div className="bigres">
      <div className={'br '+(botPass?'p':'f')}><div className="l">Service II — bottom flange</div><div className="n">{fmt(st.fBot.serv2,1)}</div><div className="u">ksi vs {fmt(st.fServLim,1)} · {fmt(st.s2Coef,2)}RhFyf</div></div>
      <div className={'br '+(topPass?'p':'f')}><div className="l">Service II — top flange</div><div className="n">{fmt(st.fTop.serv2,1)}</div><div className="u">ksi vs {fmt(st.fServLim,1)}</div></div>
      <div className={'br '+(defPass?'p':'f')}><div className="l">LL deflection</div><div className="n">{fmt(st.dLL,2)}</div><div className="u">in vs L/800 = {fmt(st.dLim,2)}</div></div>
    </div>

    <Card title="What Service II checks" refTag="AASHTO 6.10.4.2.2 · permanent-deformation control">
      <div className="hint">Service II limits the flexural stress under <b>DC + DW + {lfP(lfS(R).gS2,'1.30')}(LL+IM)</b> to <b>{fmt(st.s2Coef,2)} R_h F_yf</b> to prevent objectionable permanent deflection from occasional heavy overloads. The coefficient is <b>0.95</b> for the flanges of a composite section and <b>0.80</b> for both flanges of a noncomposite one. Stresses <b>accumulate by construction stage</b> on the section active at each stage: DC1 (self-weight + wet deck) on the bare steel, DC2 + DW on the long-term (3n) composite, and live load on the short-term (n) composite. The picker below shows the full stage buildup at any station.</div>
    </Card>

    {psel&&s2Deriv(R,psel,<select value={selIdx} onChange={e=>setSelIdx(+e.target.value)}
        style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:250}}>
        {ch.map((p,i)=><option key={i} value={i}>{stnLabel(p,i)}</option>)}
      </select>)}
    <Card title="Service II Flange Stresses Along the Span" refTag={'6.10.4.2.2 · limit '+fmt(st.s2Coef,2)+'RhFyf (steps at splices)'}>
      <Fig h={360} data={[
        {x:cx,y:ch.map(p=>p.bP),name:'bottom flange (+LL)',line:{color:'#C2271D',width:2.2}},
        {x:cx,y:ch.map(p=>p.tP),name:'top flange (+LL)',line:{color:'#1C4FC4',width:2.2}},
        ...(R.hasNeg?[
          {x:cx,y:ch.map(p=>p.bN),name:'bottom flange (−LL)',line:{color:'#C2271D',width:1.6,dash:'dash'}},
          {x:cx,y:ch.map(p=>p.tN),name:'top flange (−LL)',line:{color:'#1C4FC4',width:1.6,dash:'dash'}}]:[]),
        {x:cx,y:ch.map(p=>p.lim),name:'+'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}},
        {x:cx,y:ch.map(p=>-p.lim),name:'−'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}}]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'stress (ksi · fB + = bottom tension, fT + = top compression)'}}}/>
      <div className="callout">Service II = DC + DW + {lfP(lfS(R).gS2,'1.30')}(LL+IM), accumulated on the stage-correct sections (DC1 on bare steel, DC2+DW on 3n, LL on n{R.hasNeg?'; −M regions on the cracked steel+rebar section':''}). Both flanges are limited to ±{fmt(st.s2Coef,2)}R<sub>h</sub>F<sub>yf</sub>{st.s2Composite?' (composite section)':' — the 0.80 coefficient applies because the deck is not acting compositely with the steel'}; the limit line steps where R<sub>h</sub> changes at a flange splice. Governing: <b>{fmt(Math.abs(st.s2Gov.f||0),1)} ksi</b> ({st.s2Gov.tag}) at <b>{fmt(st.s2Gov.x||0,1)} ft</b>.</div>
    </Card>
    <Card title="Stage Buildup — Overlay" refTag="toggle curves · cumulative by construction stage">
      <div className="btnrow" style={{marginBottom:6}}>{OVS.map(([k,l])=>
        <button key={k} className={'btn sm'+(ov[k]?'':' ghost')} onClick={()=>setOv({...ov,[k]:!ov[k]})}>{ov[k]?'☑':'☐'} {l}</button>)}</div>
      <Fig h={380} data={[
        ...(ov.bot?[
          {x:cx,y:ch.map(p=>p.dc1B),name:'bot · DC1 (bare)',line:{color:'#B45309',width:1.8}},
          {x:cx,y:ch.map(p=>p.dc1B+p.sidlB),name:'bot · +DC2+DW (3n)',line:{color:'#0E7490',width:1.8}},
          {x:cx,y:ch.map(p=>p.bP),name:'bot · Service II Σ',line:{color:'#C2271D',width:2.4}}]:[]),
        ...(ov.top?[
          {x:cx,y:ch.map(p=>p.dc1T),name:'top · DC1 (bare)',line:{color:'#D97706',width:1.6,dash:'dot'}},
          {x:cx,y:ch.map(p=>p.dc1T+p.sidlT),name:'top · +DC2+DW (3n)',line:{color:'#0891B2',width:1.6,dash:'dot'}},
          {x:cx,y:ch.map(p=>p.tP),name:'top · Service II Σ',line:{color:'#1C4FC4',width:2.2,dash:'dot'}}]:[]),
        ...(ov.neg&&R.hasNeg?[
          {x:cx,y:ch.map(p=>p.bN),name:'bot · Service II (−LL)',line:{color:'#7C3AED',width:1.8,dash:'dash'}},
          {x:cx,y:ch.map(p=>p.tN),name:'top · Service II (−LL)',line:{color:'#9333EA',width:1.6,dash:'dashdot'}}]:[]),
        ...(ov.lims?[
          {x:cx,y:ch.map(p=>p.lim),name:'+'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}},
          {x:cx,y:ch.map(p=>-p.lim),name:'−'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}}]:[])]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'stress (ksi)'}}}/>
      <div className="hint">Each curve adds one stage: DC1 locked into the bare girder before the deck cures, then superimposed dead load on the long-term composite, then {lfP(lfS(R).gS2,'1.30')}(LL+IM) on the short-term composite. The gap between the Σ curve and the limit is the Service II reserve at every station.</div>
    </Card>
    <Card title="Flange stresses by construction stage" refTag="6.10.4.2.2 · Service II @ midspan">
      <Tbl head={['Steel flange','DC1 (bare)','DC2+DW (3n)','LL+IM (n)','Service II Σ']}
        rows={[row('Top flange (comp.)',st.fTop),row('Bottom flange (tens.)',st.fBot)]}/>
      <div className="hint">Stress accumulates on the section active at each stage: <b>DC1</b> (self-weight + wet deck) on bare steel, <b>DC2 + DW</b> on the long-term (3n) composite, <b>LL+IM</b> on the short-term (n) composite. Service II factors live load by <b>{lfP(lfS(R).gS2,'1.30')}</b> (Table 3.4.1-1{lfS(R).m!==1?'; 1.30 × the owner multiplier m':''}). Both flanges are limited to <b>{fmt(st.s2Coef,2)} R_h F_yf = {fmt(st.fServLim,1)} ksi</b> — 0.95 for a composite section, 0.80 for both flanges of a noncomposite one (6.10.4.2.2){st.s2Composite?'':', which is the case here because the deck is switched off'}. The bottom (tension) flange, farthest from the high composite neutral axis, typically governs. Flange lateral bending f_ℓ is taken as 0 for this straight girder (the check adds f_ℓ/2 to the bottom flange when present).</div>
    </Card>
    <Card title="Live-load deflection" refTag="2.5.2.6.2 (optional)">
      <div className="hint">Δ_truck(incl. IM) = <b>{fmt(st.dTruck,3)} in</b> · Δ_lane = <b>{fmt(st.dLane,3)} in</b> · deflection DF (all lanes ÷ girders) = <b>{fmt(st.dfDefl,3)}</b> → Δ_LL = <b>{fmt(st.dLL,3)} in</b> vs L/800 = <b>{fmt(st.dLim,3)} in</b> ({defPass?'OK':'N.G.'}). Optional criterion; taken as the larger of the design truck alone or 25% truck + lane, on the short-term composite I = {fmt(R.cN.I,0)} in⁴.</div>
      <DLinks items={[{to:'trans',seg:sgI(R,spMidIdx(R)),what:'I (short-term n, midspan segment)'}]}/>
    </Card>
  </div>);

function DiagramsTab({R,inp,set}){
  if(!R.ok) return null;
  const d=R.diag, xs=d.map(p=>p.x);
  // ── Span selector for imported (multi-span) demands: view any span or the whole beam ──
  const ext=inp&&inp.external;
  const extActive=ext&&(ext._schema==='psbeam-external-demands'||ext._schema==='stgirder-external-demands'||ext._schema==='steelbeam-external-demands')&&Array.isArray(ext.stations)&&ext.stations.length>0;
  const allSpans=extActive?externalSpans(ext):[];
  const memberLen=extActive?((ext.member&&ext.member.totalLength)||Math.max(...ext.stations.map(s=>+s.x||0))):R.geom.L;
  const multiSpan=allSpans.length>1;
  const [spanView,setSpanView]=useState(()=>{ try{ return loadUI().diagSpanView||'design'; }catch(e){ return 'design'; } });
  useEffect(()=>{ try{ saveUI({diagSpanView:spanView}); }catch(e){} },[spanView]);
  const vr=spanView==='all'?{x0:0,x1:memberLen,label:'Entire beam'}
    :(spanView!=='design'?(()=>{const sp=allSpans.find(s=>('s'+s.idx)===spanView);return sp?{x0:sp.x0,x1:sp.x1,label:'Span '+sp.idx,sp}:null;})():null);
  const designThisSpan=sp=>{ if(set){ const secNew=zonesToSec(ext,sp,inp.sec); set({...inp, external:{...ext,_selSpan:sp}, geom:{...inp.geom,L:sp.len}, ...(secNew?{sec:secNew}:{})}); } setSpanView('design'); };
  const F=lfS(R);   // GD49: the owner factors (1.25, 1.50, 1.75 without owner rules); the pedestrian part without m (GD45)
  const vrows=(x0,x1)=>ext.stations.filter(s=>(+s.x)>=x0-1e-6&&(+s.x)<=x1+1e-6).sort((a,b)=>a.x-b.x).map(s=>{
    const a=k=>+s[k]||0; const m1=a('M_DC1'),m2=a('M_DC2'),mw=a('M_DW'),mlp=a('M_LLpos'),mln=a('M_LLneg');
    const v1=a('V_DC1'),v2=a('V_DC2'),vw=a('V_DW'),vlp=a('V_LLpos'),vln=a('V_LLneg');
    const d=(v,k)=>F.plOn? llD(v,a(k),F.m) : v;
    return {x:+s.x,M1:m1,M2:m2,Mw:mw,Mlp:mlp,Mln:mln,
      Mup:F.gDC*(m1+m2)+F.gDW*mw+F.gLL*d(mlp,'M_PLpos'),Mun:F.gDC*(m1+m2)+F.gDW*mw+F.gLL*d(mln,'M_PLneg'),
      V1:v1,V2:v2,Vw:vw,Vlp:vlp,Vln:vln,
      Vup:F.gDC*(v1+v2)+F.gDW*vw+F.gLL*d(vlp,'V_PLpos')};});
  const lnR=(rows,k,name,color,dash)=>({x:rows.map(r=>r.x),y:rows.map(r=>r[k]||0),name,mode:'lines',line:{color,width:2,dash:dash||'solid'}});
  const ln=(k,name,color,dash)=>({x:xs,y:d.map(p=>p[k]),name,mode:'lines',line:{color,width:2,dash:dash||'solid'}});
  const mData=[ln('M1','DC1','#15803D'),ln('M2','DC2','#0E7490'),ln('Mw','DW','#B45309'),
    ln('Ml','+LL+IM','#B3261E'),ln('Mu','Strength I +Mu','#1C4FC4','dot')];
  if(R.hasNeg){ mData.push(ln('Mln','−LL+IM','#B3261E','dash')); mData.push(ln('Mun','Strength I −Mu','#1C4FC4','dashdot')); }
  return (<div>
    {extActive&&multiSpan&&<div className="callout" style={{marginTop:0,marginBottom:12,borderColor:'var(--blue)',background:'#EEF4FF',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <b>View span:</b>
      <select value={spanView} onChange={e=>setSpanView(e.target.value)} style={{fontSize:12,fontFamily:'inherit',border:'1px solid var(--line)',borderRadius:4,padding:'3px 6px'}}>
        <option value="design">Design span — Span {R.ext.sel.idx} ({fmt(R.ext.spanLen,0)} ft)</option>
        {allSpans.map(sp=><option key={sp.idx} value={'s'+sp.idx}>Span {sp.idx} ({fmt(sp.x0,0)}–{fmt(sp.x1,0)} ft){R.ext.sel.idx===sp.idx?' • current':''}</option>)}
        <option value="all">Entire beam (0–{fmt(memberLen,0)} ft)</option>
      </select>
      {vr&&vr.sp&&R.ext.sel.idx!==vr.sp.idx&&<button className="btn sm" onClick={()=>designThisSpan(vr.sp)}>Design Span {vr.sp.idx} →</button>}
      <span style={{fontSize:11,color:'var(--ink2)'}}>Design &amp; checks stay on Span {R.ext.sel.idx}.</span>
    </div>}
    {spanView!=='design'&&vr? (()=>{ const rows=vrows(vr.x0,vr.x1);
      const md=[lnR(rows,'M1','DC1','#15803D'),lnR(rows,'M2','DC2','#0E7490'),lnR(rows,'Mw','DW','#B45309'),lnR(rows,'Mlp','+LL env','#B3261E'),lnR(rows,'Mln','−LL env','#7C3AED'),lnR(rows,'Mup','Strength I +','#1C4FC4','dot'),lnR(rows,'Mun','Strength I −','#1C4FC4','dashdot')];
      const vd=[lnR(rows,'V1','DC1','#15803D'),lnR(rows,'V2','DC2','#0E7490'),lnR(rows,'Vw','DW','#B45309'),lnR(rows,'Vlp','+LL env','#B3261E'),lnR(rows,'Vln','−LL env','#7C3AED'),lnR(rows,'Vup','Strength I','#1C4FC4','dot')];
      return <React.Fragment>
        <Card title={'Moment envelope — '+vr.label} refTag="imported demands · k-ft">
          <Fig h={360} data={md} layout={{yaxis:{title:'M (k-ft)'},xaxis:{title:'x (ft, member)'}}}/></Card>
        <Card title={'Shear envelope — '+vr.label} refTag="imported demands · kip">
          <Fig h={340} data={vd} layout={{yaxis:{title:'V (kip)'},xaxis:{title:'x (ft, member)'}}}/></Card>
        <div className="callout">Strength I = {lfP(F.gDC,'1.25')}(DC1+DC2)+{lfP(F.gDW,'1.50')} DW+{lfP(F.gLL,'1.75')} LL{F.on?' (owner load rules)':''} from the imported per-station envelope over {vr.label.toLowerCase()} (member coordinates). Switch back to <b>Design span</b> for the full design envelopes, or use <b>Design Span n</b> to move the analysis there.</div>
      </React.Fragment>; })()
    :<React.Fragment>
    <Card id="stg-d-menv" title="Moment envelope" refTag={'per girder · k-ft'+(R.useExt?' · imported demands':'')}>
      <Fig h={340} data={mData} layout={{yaxis:{title:'M (k-ft)'},xaxis:{title:'x (ft)'}}}/>
    </Card>
    <Card id="stg-d-venv" title="Shear envelope" refTag="per girder · kip">
      <Fig h={320} data={[ln('V1','DC1','#15803D'),ln('V2','DC2','#0E7490'),ln('Vw','DW','#B45309'),
        ln('Vl','LL+IM','#B3261E'),ln('Vu','Strength I Vu','#1C4FC4','dot')]}
        layout={{yaxis:{title:'V (kip)'},xaxis:{title:'x (ft)'}}}/>
    </Card>

          : <ML s={Tx`M_n=M_p\!\left(1.07-0.7\tfrac{D_p}{D_t}\right)=${nx(f.Mp_kft,0)}\!\left(1.07-0.7\tfrac{${nx(pl.Dp,1)}}{${nx(pl.Dt,1)}}\right)=${nx(f.Mn_kft,0)}\;\text{k-ft}`}/>}
        {f.my13&&<ML s={Tx`M_y=M_{D1}+M_{D2}+M_{AD}=${nx(f.my13.MD1,0)}+${nx(f.my13.MD2,0)}+\min(${nx(f.my13.MADb,0)},${nx(f.my13.MADt,0)})=${nx(f.my13.My,0)}\;\text{k-ft}\qquad1.3R_hM_y=${nx(f.my13.lim13,0)}\;\text{k-ft}\;\Rightarrow\;M_n=${nx(f.MnGov,0)}\;\text{k-ft}`}/>}
        <ML s={Tx`\frac{M_u}{\phi_f M_n}=\frac{${nx(f.gov&&f.gov.Mu||f.MuPeak,0)}}{${nx(f.phif*f.MnGov,0)}}=${nx(f.flexDC,3)}\;${pass?'\\checkmark':'\\text{N.G.}'}`}/>
        <DLinks items={[{to:'plastic',seg:sgI(R,f.gov&&f.gov.si!=null?f.gov.si:null),what:'M_p, D_p, D_t'},{to:'menv',what:'M_u'}]}/>
        <div className="hint">Compact composite section in positive flexure (6.10.6.2.2 satisfied) — capacity is the plastic moment M_p, reduced by the ductility term when D_p {'>'} 0.1D_t. {f.contSpan?'Continuous span (imported demands with negative moment): M_n is also limited to 1.3 R_h M_y (6.10.7.1.2-3), with M_y from the staged factored permanent stresses per D6.2.2 (DC1 on the steel, DC2/DW on the 3n section, M_AD on the n section, lesser flange). The B6.2 exemption is not evaluated.':'Simple span, so no 1.3 R_h M_y continuity cap.'} φ_f = 1.0; flange lateral bending f_ℓ = 0 (straight girder).</div>

        {x:fx,y:stns.map(p=>p.Mu),name:'+Mu (Strength I)',fill:'tozeroy',fillcolor:'rgba(28,79,196,.05)',line:{color:'#1C4FC4',width:2.2}},

      <div className="callout">Above the axis: positive-moment components, the factored +M<sub>u</sub> envelope, and the +φM<sub>n</sub> capacity (steps at flange splices{cf.some(p=>!p.compact)?'; noncompact segments use the stress-basis equivalent moment min(Fnc·St, Fnt·Sb) — the same basis as the Rating tab':''}).{R.hasNeg?' Below the axis: the −Mu envelope against the cracked-section −φMn over the pier.':''} The LL curves already include DF and impact. {f.oos?<span>Governing +M D/C: <b>{OOS_TXT}</b> (plastic neutral axis below the web in segment {R.pnaOOS.map(g=>g.i+1).join(', ')}; no +φM<sub>n</sub> is drawn there)</span>:<span>Governing +M D/C = <b>{fmt(f.flexDC,2)}</b> at <b>{fmt(f.gov&&f.gov.x||0,1)} ft</b></span>}{R.hasNeg&&R.neg?'; −M D/C = '+fmt(R.neg.negBGov.r,2)+' at '+fmt(R.neg.negBGov.x||0,1)+' ft':''}.</div>

/* Shear-tab worked calculations, shared by the Shear tab and the calculation-sheet report (display only;
   moved out of ShearTab unchanged). */
function shearResCard(R){ const s=R.shearR, dc=s.VuPeak/(s.phiv*s.Vcr), pass=dc<=1.0001;
  return (    <Card id="stg-d-shear" title="Shear resistance" refTag="AASHTO 6.10.9">
      <ML s={Tx`V_p=0.58F_{yw}Dt_w=${nx(s.Vp,0)}\;\text{kip}\qquad k=${s.stiffened?Tx`5+\frac{5}{(d_o/D)^2}=${nx(s.kShear,2)}`:'5'}`}/>
      <ML s={Tx`\frac{D}{t_w}=${nx(s.dtw,1)}\;\;\text{vs}\;\;1.12\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim1,1)},\;\;1.40\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim2,1)}\;\Rightarrow\;C=${nx(s.Cv,3)}`}/>
      <ML s={Tx`V_n=CV_p=${nx(s.Vcr,0)}\;\text{kip (end panel)}${s.stiffened?Tx`\qquad V_{n,int}=${nx(s.VnInt,0)}\;\text{kip (tension field)}`:''}`}/>
      <ML s={Tx`\frac{V_u}{\phi_v V_n}=\frac{${nx(s.VuPeak,0)}}{${nx(s.phiv*s.Vcr,0)}}=${nx(dc,3)}\;${pass?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="hint">The support panel is checked <b>without</b> tension-field action (end-panel rule 6.10.9.3.3, V_n = C·V_p), since the anchor panel cannot develop a tension field. Interior stiffened panels develop tension-field action (6.10.9.3.2), giving the higher V_n,int shown{s.stiffened?' — valid because 2Dt_w/(A_fc+A_ft) = '+fmt(s.propTF,2)+(s.propTF<=2.5?' ≤ 2.5':' > 2.5 (alt. form used)'):''}. φ_v = 1.0. Add or tighten transverse stiffeners (Stiffeners tab) to raise capacity.</div>
      <div className="mnote">Two spacing limits gate all of this. <b>6.10.9.1</b>: if d<sub>o</sub> &gt; 3D = {fmt(s.doMax3D,0)} in the web counts as unstiffened — k = 5 and no tension field anywhere. <b>6.10.9.3.3</b>: the end panel itself is limited to d<sub>o</sub> ≤ 1.5D = {fmt(s.doEndMax,0)} in. Current d<sub>o</sub> = {s.stiffTrans?fmt(s.doRaw,0)+' in':'— (unstiffened web)'}{s.stiffTrans?(s.doOver3D?' → over 3D':(s.endSpcOK?' → both limits satisfied ✓':' → over the 1.5D end-panel limit')):''}.</div>
    </Card>);
}
function shearWorkedCard(R,scSel,right){ const s=R.shearR, Fyw=R.matR.Fyw, pass2=scSel.dc<=1.0001;
      return <Card title="Worked shear calculation at a selected location"
        refTag="pick any station — end-panel vs tension-field"
        right={right}>
        <div className="callout" style={{marginTop:0,marginBottom:12}}>
          Station <b>x = {fmt(scSel.x,1)} ft</b> — {scSel.isEnd? 'end panel adjacent to a support: no tension field, Vₙ = C·Vₚ (6.10.9.3.3)':(s.stiffened?'interior stiffened panel: tension-field action allowed (6.10.9.3.2)':'unstiffened web: Vₙ = C·Vₚ')}. The web (D, t_w) is prismatic, so V_p and C are constant along the span; the panel classification and the demand V_u vary with location.
        </div>
        <div className="bigres" style={{marginBottom:10}}>
          <div className={'br '+(pass2?'p':'f')}><div className="l">V_u / φV_n</div><div className="n">{fmt(scSel.dc,2)}</div><div className="u">{fmt(scSel.Vu,0)} / {fmt(scSel.phiVn,0)} kip</div></div>
          <div className="br"><div className="l">Panel type</div><div className="n" style={{fontSize:15}}>{scSel.isEnd?'End':'Interior'}</div><div className="u">{scSel.tensionField?'tension field':'C·Vp'}</div></div>
        </div>
        <ML s={Tx`V_p=0.58F_{yw}Dt_w=0.58\cdot${nx(Fyw,0)}\cdot${nx(s.D,1)}\cdot${nx(s.tw,3)}=${nx(s.Vp,0)}\;\text{kip}`}/>
        <ML s={Tx`\frac{D}{t_w}=${nx(s.dtw,1)}\;\;\text{vs}\;\;1.12\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim1,1)},\;1.40\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim2,1)}\;\Rightarrow\;C=${nx(s.Cv,3)}\quad(k=${nx(s.kShear,2)})`}/>
        {scSel.isEnd
          ? <ML s={Tx`V_n=CV_p=${nx(s.Cv,3)}\cdot${nx(s.Vp,0)}=${nx(s.Vcr,0)}\;\text{kip (end panel)}`}/>
          : <ML s={Tx`V_n=V_p\!\left(C+\dfrac{0.87(1-C)}{\sqrt{1+(d_o/D)^2}}\right)=${nx(s.VnInt,0)}\;\text{kip (tension field)}`}/>}
        <ML s={Tx`\frac{V_u}{\phi_vV_n}=\frac{${nx(scSel.Vu,0)}}{${nx(scSel.phiVn,0)}}=${nx(scSel.dc,3)}\;${pass2?'\\checkmark':'\\text{N.G.}'}`}/>
        <DLinks items={[{to:'venv',what:'V_u'}]}/>
      <div className="mnote">V_u is the Strength I factored shear envelope at this station: |{lfP(lfS(R).gDC,'1.25')}(V_DC1+V_DC2)+{lfP(lfS(R).gDW,'1.50')} V_DW| + {lfP(lfS(R).gLL,'1.75')}|V_LL| (LL with DF and impact{lfS(R).on?'; owner load rules'+(lfS(R).plOn?', LL+IM = (LL+IM+PL) − PL + PL/m':''):''}). φ_v = 1.0.{s.stiffened?' End-panel length taken as the first stiffener spacing d_o = '+fmt(s.doSpc,0)+' in from each support.':''}</div>
      </Card>;
}
function ShearTab({R}){
  if(!R.ok) return null;
  const s=R.shearR, dc=s.VuPeak/(s.phiv*s.Vcr), pass=dc<=1.0001;
  const stns=R.stations, sx=stns.map(p=>p.x);
  const x0=sx[0]||0, x1=sx[sx.length-1]||R.geom.L;
  const hl=(y,name,color,dash)=>({x:[x0,x1],y:[y,y],name,mode:'lines',line:{color,width:2,dash:dash||'dash'}});
  // ── location picker: per-station shear check ──
  const scAll=R.shearCalc||[], Lspan=R.geom.L, Fyw=R.matR.Fyw;
  const govXV=s.xGov||0;
  const defIdxV=scAll.length? scAll.reduce((bi,sc,i,a)=>Math.abs(sc.x-govXV)<Math.abs(a[bi].x-govXV)?i:bi,0):0;
  const [selV,setSelV]=useState(defIdxV);
  const scSel=scAll.length? scAll[Math.min(selV,scAll.length-1)] : null;
  const stnLabelV=(sc,i)=>{ const x=sc.x; const t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    t.push(sc.isEnd?'end panel':'interior panel');
    return 'x = '+x.toFixed(1)+' ft  ·  '+t.join(', '); };
  return (<div>
    <div className="bigres">
      <div className={'br '+(pass?'p':'f')}><div className="l">Vu / φVn (support)</div><div className="n">{fmt(dc,2)}</div><div className="u">{fmt(s.VuPeak,0)} / {fmt(s.phiv*s.Vcr,0)} kip</div></div>
      <div className="br"><div className="l">Vp = 0.58FywDtw</div><div className="n">{fmt(s.Vp,0)}</div><div className="u">kip · C = {fmt(s.Cv,3)}</div></div>
      <div className={'br '+(s.doOver3D||!s.endSpcOK?'f':'')}><div className="l">Web D/tw</div><div className="n">{fmt(s.dtw,0)}</div><div className="u">{s.stiffened?'stiffened @ '+fmt(s.doSpc,0)+'″':(s.doOver3D?'d_o > 3D → treated unstiffened':'unstiffened')}</div></div>
    </div>
    {s.doOver3D&&<div className="callout warn"><b>Stiffener spacing exceeds 3D.</b> d<sub>o</sub> = {fmt(s.doRaw,0)} in &gt; 3D = {fmt(s.doMax3D,0)} in, so LRFD 6.10.9.1 requires the web to be treated as <b>unstiffened</b> for shear: k reverts to 5.0 and <b>no panel may be credited with tension-field action</b>. Everything below is computed on that basis. Reduce d<sub>o</sub> to {fmt(s.doMax3D,0)} in or less to get the stiffened k and the interior-panel tension field back.</div>}
    {s.stiffened&&!s.endSpcOK&&<div className="callout warn"><b>End-panel spacing exceeds 1.5D.</b> LRFD 6.10.9.3.3 limits the transverse-stiffener spacing inside the end (anchor) panel to 1.5D = {fmt(s.doEndMax,0)} in; this model uses one uniform d<sub>o</sub> = {fmt(s.doRaw,0)} in. Tighten the first stiffener in from each support to {fmt(s.doEndMax,0)} in or less so the anchor panel can develop the reaction that anchors the adjacent interior panels' tension fields.</div>}
    <Card title="Shear Demand vs Capacity" refTag="AASHTO 6.10.9 · Vu envelope vs φVn">
      <Fig h={360} data={[
        {x:sx,y:stns.map(p=>p.Vu),name:'Vu (Strength I, |envelope|)',fill:'tozeroy',fillcolor:'rgba(28,79,196,.06)',line:{color:'#1C4FC4',width:2.2}},
        {x:sx,y:stns.map(p=>Math.abs(1.25*(p.V1+p.V2)+1.5*p.Vw)),name:'factored dead load |V|',line:{color:'#15803D',width:1.6,dash:'dot'}},
        hl(s.phiv*s.Vcr,'φVn end panel (C·Vp)','#B3261E'),
        ...(s.stiffened?[hl(s.phiv*s.VnInt,'φVn interior (tension field)','#0E7490','dot')]:[])]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'shear (kip)',rangemode:'tozero'}}}/>
      <div className="callout">The V<sub>u</sub> envelope (factored, LL with DF and impact) is checked against the end-panel resistance C·V<sub>p</sub> everywhere — conservative, since interior stiffened panels may use the tension-field value shown dotted. Governing V<sub>u</sub> = <b>{fmt(s.VuPeak,0)} kip</b> at <b>{fmt(s.xGov,1)} ft</b> (D/C = <b>{fmt(dc,2)}</b>). If the end panel governs your design, tighten the first stiffener spacing d<sub>o</sub> to raise C.</div>
    </Card>
    {shearResCard(R)}
    {scSel&&shearWorkedCard(R,scSel,<select value={selV} onChange={e=>setSelV(+e.target.value)}
          style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',
            borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:260}}>
          {scAll.map((sc,i)=><option key={i} value={i}>{stnLabelV(sc,i)}</option>)}
        </select>)}
  </div>);
}

/* Deck design cases and the worked case, shared by the Deck tab and the calculation-sheet report (display only;
   moved out of DeckTab unchanged). */
function deckCases(d){
  return [
    {k:'pos',l:'Interior +M (bottom bars)',c:d.pos,Mu:d.Mu_pos,MDC:d.MDC_pos,MDW:d.MDW_pos,MLL:d.MLL_pos,SW:d.SWpos,strip:'+M',src:'Table A4-1'},
    {k:'neg',l:'Interior −M (top bars)',c:d.neg,Mu:d.Mu_neg,MDC:d.MDC_neg,MDW:d.MDW_neg,MLL:d.MLL_neg,SW:d.SWneg,strip:'−M',src:'Table A4-1 at x = '+fmt(d.xneg,1)+' in'},
    {k:'oh',l:'Overhang (top bars)',c:d.ohCap,Mu:d.Mu_oh,MDC:d.MohDC,MDW:d.MohDW,MLL:d.MohLL,SW:d.SWoh,strip:'overhang',src:'wheel on the 45+10X strip'}];
}
function deckWorkedDeriv(R,CS,right,goOwn){ const d=R.deckD, cc=CS.c;
  // GD49 deck: the Strength I factors used (text exactly '1.25', '1.50', '1.75' without owner load rules)
  const L=lfS(R), own=!!L.on, fD=lfP(d.gDC,'1.25'), fW=lfP(d.gDW,'1.50'), fL=lfP(d.gLL,'1.75');
  return (    <Deriv title="Worked deck design at a selected case"
      refTag="equivalent strip · flexure"
      right={right}>
      <VarTable title={'Variables — '+CS.l} rows={[
        ['S','Girder spacing (c/c)',d.Ls,'ft'],
        ['SW','Equivalent strip width ('+CS.strip+')',CS.SW,'in'],
        ['t_s','Slab thickness',d.ts,'in'],
        ['A_s','Reinforcement area (per ft)',cc.As,'in²/ft'],
        ['d','Effective depth to bar centroid',cc.dEff,'in'],
        ["f'_c",'Deck concrete strength',d.fcd,'ksi'],
        ['f_y','Reinforcement yield',d.fy,'ksi'],
        ['M_DC','Slab dead-load moment',CS.MDC,'k-ft/ft'],
        ['M_DW','Wearing-surface moment',CS.MDW,'k-ft/ft'],
        ['M_LL+IM','Live-load moment incl. MPF and impact ('+CS.src+')',CS.MLL,'k-ft/ft'],
      ]}/>
      <SG n="1">Factored design moment — Strength I (DC {fD}, DW {fW}, LL+IM {fL})</SG>
      {own&&<ML s={Tx`\gamma_{DC}=1.25\eta=1.25(${nx(L.eta,3)})=${fD},\quad\gamma_{DW}=1.50\eta=${fW},\quad\gamma_{LL}=1.75\eta m=1.75(${nx(L.eta,3)})(${nx(L.m,2)})=${fL}`}/>}
      <ML s={Tx`M_u=${fD}M_{DC}+${fW}M_{DW}+${fL}M_{LL+IM}=${fD}(${nx(CS.MDC,2)})+${fW}(${nx(CS.MDW,2)})+${fL}(${nx(CS.MLL,2)})=${nx(CS.Mu,2)}\;\text{k-ft/ft}`}/>
      {own&&<div className="mnote">Owner load rules from GirderDetail ({L.o||'—'}): η = {fmt(L.eta,3)} on the Strength I factors (AASHTO LRFD 1.3.2.1) and the design load multiplier m = {fmt(L.m,2)} on the HL-93 LL+IM{L.cite.m?' ('+L.cite.m+')':''}; M_LL+IM above is the value without m ({CS.src}). See the calculation report, 2. Input parameters — Owner load rules{goOwn?<span> (<a href="#" onClick={e=>{e.preventDefault();goOwn('report');}}>Report</a> · <a href="#" onClick={e=>{e.preventDefault();goOwn('inputs');}}>Inputs</a>)</span>:null}.</div>}
      <SG n="2">Flexural resistance of the deck section</SG>
      <ML s={Tx`a=\frac{A_sf_y}{0.85f'_c\,b}=\frac{${nx(cc.As,3)}\cdot${nx(d.fy,0)}}{0.85\cdot${nx(d.fcd,2)}\cdot12}=${nx(cc.a,3)}\;\text{in}\qquad c=\frac{a}{\beta_1}=${nx(cc.c,3)}\;\text{in}`}/>
      <ML s={Tx`\varepsilon_t=0.003\!\left(\frac{d}{c}-1\right)=${nx(cc.et,4)}\;\Rightarrow\;\phi=${nx(cc.phi,3)}\;(\text{${cc.et>=0.005?'tension-controlled':'transition'}})`}/>
      <ML s={Tx`M_n=A_sf_y\!\left(d-\frac{a}{2}\right)=${nx(cc.Mn,2)}\;\text{k-ft/ft}\qquad \phi M_n=${nx(cc.phiMn,2)}\;\text{k-ft/ft}`}/>
      <SG n="3">Check</SG>
      <ML s={Tx`\frac{M_u}{\phi M_n}=\frac{${nx(CS.Mu,2)}}{${nx(cc.phiMn,2)}}=${nx(cc.dc,3)}\;${cc.ok?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Singly-reinforced rectangular section, 12-in design width, Whitney stress block. β₁ per 5.6.2.2; φ transitions from 0.75 to 0.90 with net tensile strain (5.5.4.2).</div>
    </Deriv>);
}
function DeckTab({R,go}){
  if(!R.ok) return null;
  const d=R.deckD;
  if(!d) return <div className="soonbox"><div className="ph">Deck design is off</div>
    <div className="ds">Enable the composite deck and its transverse design on the Inputs tab (Deck &amp; Composite → “Design transverse deck reinforcement”) to run the equivalent-strip deck checks.</div></div>;
  const capRow=(lab,c)=>({c:[lab,fmt(c.Mu,2),fmt(c.phiMn,2),fmt(c.dc,2),{v:c.ok?'PASS':'FAIL',cls:c.ok?'ok':'no'}]});
  const CASES=deckCases(d);
  const [ck,setCk]=useState('pos');
  const CS=CASES.find(x=>x.k===ck)||CASES[0], cc=CS.c;
  return (<div>
    <div className="bigres">
      <div className={'br '+(d.pos.ok?'p':'f')}><div className="l">Deck +M (bottom)</div><div className="n">{fmt(d.pos.dc,2)}</div><div className="u">{fmt(d.Mu_pos,2)} / {fmt(d.pos.phiMn,2)} k-ft/ft</div></div>
      <div className={'br '+(d.neg.ok?'p':'f')}><div className="l">Deck −M (top)</div><div className="n">{fmt(d.neg.dc,2)}</div><div className="u">{fmt(d.Mu_neg,2)} / {fmt(d.neg.phiMn,2)} k-ft/ft</div></div>
      <div className={'br '+(d.ohCap.ok?'p':'f')}><div className="l">Overhang</div><div className="n">{fmt(d.ohCap.dc,2)}</div><div className="u">{fmt(d.Mu_oh,2)} / {fmt(d.ohCap.phiMn,2)} k-ft/ft</div></div>
    </div>

    <Card title="What this check is" refTag="LRFD 4.6.2.1 · equivalent-strip method">

  const stnLabel=(p,i,a)=>{ const x=p.x, t=[];

      <div className={'br '+(vPass?'p':'f')}><div className="l">Construction shear</div><div className="n">{fmt(c.VcU/c.VcrC,2)}</div><div className="u">{fmt(c.VcU,0)} / {fmt(c.VcrC,0)} kip</div></div>
    </div>

    <Card title="What this check is" refTag="AASHTO 6.10.3 · noncomposite bare steel">
      <div className="hint">Before the deck concrete cures it provides no composite action, so the <b>bare steel girder alone</b> carries its own self-weight plus the wet-deck dead load and any construction live load. The top (compression) flange is braced only at the cross-frames (L_b = {fmt(c.Lb,0)} ft), so lateral-torsional and flange-local buckling frequently govern — this stage often sets the required brace spacing. Load factors are 1.25 DC + 1.50 construction live (Table 3.4.1-1); shear uses V_cr with no tension-field action (6.10.3.3).</div>

    <Card title="Governing constructibility checks (all stations scanned)" refTag="worst location each">
      <Tbl head={['Check','Demand fbu','Resistance','D/C','Status']} rows={[
        {c:['Comp flange FLB/LTB (Fnc)',fmt(c.fbuTopC,2),fmt(c.FncC.Fnc,2),fmt(c.fbuTopC/c.FncC.Fnc,2),PF(fPass)]},
        {c:['Comp flange yield (RhFyc)',fmt(c.fbuTopC,2),fmt(c.RhFyc,2),fmt(c.fbuTopC/c.RhFyc,2),PF(yPass)]},
        {c:['Web bend-buckling (Fcrw)',fmt(c.fbuTopC,2),fmt(c.FcrwC,2),fmt(c.fbuTopC/c.FcrwC,2),PF(wPass)]},
        {c:['Tension flange (RhFyt)',fmt(c.fbuBotC,2),fmt(c.RhFyt,2),fmt(c.fbuBotC/c.RhFyt,2),PF(tPass)]},
        {c:['Construction shear (Vcr)',fmt(c.VcU,2),fmt(c.VcrC,2),fmt(c.VcU/c.VcrC,2),PF(vPass)]},
      ]}/>
      <div className="hint">The governing top-flange stress is <b>{fmt(c.fbuTopC,1)} ksi</b> at <b>{fmt(c.xGov,1)} ft</b>. Use the location picker above to see the full derivation at any station; this table reports the worst D/C found across all stations for each limit.</div>

// Camber breakdown by load: curve definitions, tenth-point / flange-transition table (display only).
// Values in the table are downward deflection (in, + down) = the camber (upward offset) to fabricate.
function camberSeries(R){
  const sh=R.camber.shape;
  const swL = sh.dc1Split==='swExcl' ? 'Steel self-weight (added by ST-Girder)' : sh.dc1Split==='import' ? 'Steel (imported: girder + details)' : 'Steel self-weight'+(sh.hasDia?' + diaphragms':'');
  const wetL= sh.dc1Split==='swExcl' ? 'Imported DC1 excl. self-weight' : sh.dc1Split==='import' ? 'Wet concrete (imported: deck, haunch, SIP, other DC1)' : 'Wet concrete (deck, haunch, add’l DC1)';
  const out=[];
  if(sh.dc1Split==='none') out.push({k:'dc1',l:'DC1 (imported, not split)',short:'DC1 (imported)',c:'#15803D',v:sh.dc1});
  else { out.push({k:'sw',l:swL,short:sh.dc1Split==='swExcl'?'Self-weight (app)':sh.dc1Split==='import'?'Steel':'Steel self-wt'+(sh.hasDia?' + diaph.':''),c:'#6B7280',v:sh.sw});
         out.push({k:'wet',l:wetL,short:sh.dc1Split==='swExcl'?'Imported DC1 − SW':'Wet concrete',c:'#15803D',v:sh.wet}); }
  out.push({k:'dc2',l:'DC2 (3n composite)',short:'DC2',c:'#0E7490',v:sh.dc2});
  out.push({k:'dw',l:'DW (3n composite)',short:'DW',c:'#B45309',v:sh.dw});
  out.push({k:'tot',l:'Total (sum)',short:'Total',c:'#16212E',v:sh.tot});
  return out;
}
function camberTable(R){
  const sh=R.camber.shape, L=R.geom.L, ser=camberSeries(R), X=sh.x;
  const at=(arr,x)=>{ if(x<=X[0]) return arr[0]; for(let i=1;i<X.length;i++) if(x<=X[i]+1e-9){
      const t=(x-X[i-1])/Math.max(X[i]-X[i-1],1e-9); return arr[i-1]+(arr[i]-arr[i-1])*t; } return arr[arr.length-1]; };
  const pts=[]; for(let i=0;i<=10;i++) pts.push({x:L*i/10,lab:(i/10).toFixed(1)+'L'});
  sh.splices.forEach(x=>{ if(!pts.some(p=>Math.abs(p.x-x)<0.05)) pts.push({x,lab:'flange transition'}); });
  pts.sort((a,b)=>a.x-b.x);
  const head=['Location','x (ft)',...ser.map(c=>c.short+' (in)')];
  const dn=v=>Math.abs(v)<5e-4?0:-v;                 // downward +, no "-0.000" at the supports
  const rows=pts.map(p=>({c:[p.lab,fmt(p.x,2),...ser.map(c=>fmt(dn(at(c.v,p.x)),3))]}));
  const mx=ser.map(c=>{ let j=0; c.v.forEach((v,i)=>{ if(Math.abs(v)>Math.abs(c.v[j])) j=i; }); return {v:-c.v[j],x:X[j]}; });
  rows.push({_cls:'tot',c:[{v:<b>Maximum</b>},'',...mx.map(m=>({v:<span><b>{fmt(m.v,3)}</b> <span style={{color:'var(--ink2)'}}>@ {fmt(m.x,1)} ft</span></span>}))]});
  return {head,rows,ser,mx};
}
function CamberBreakdown({R,fig}){
  const sh=R.camber.shape, cm=R.camber, T=camberTable(R);
  const d=Math.abs(cm.camTotMax-cm.camTot);
  return (<React.Fragment>
    {fig&&<Fig h={300} data={T.ser.map(c=>({x:sh.x,y:c.v,name:c.l,mode:'lines',
        line:{color:c.c,width:c.k==='tot'?2.6:1.8,dash:c.k==='tot'?'solid':(c.k==='sw'?'dot':'solid')}}))}
      layout={{yaxis:{title:'Δ (in), downward −'},xaxis:{title:'x (ft)'},legend:{orientation:'h',y:1.22,font:{size:10}},margin:{l:52,r:14,t:34,b:38}}}/>}
    {fig&&<div className="hint" style={{marginTop:4}}>Dead-load deflected shapes from the double integration, drawn downward. <b>Camber = upward offset</b> equal and opposite to these curves.</div>}
    <Tbl head={T.head} rows={T.rows}/>
    <div className="hint" style={{marginTop:6}}>Downward dead-load deflection, in (+ = down) = camber (upward offset) to fabricate, at tenth points{sh.splices.length?' and flange transitions':''}. DC1 (steel self-weight and wet concrete) acts on the bare steel; DC2 and DW on the long-term (3n) composite section. Total = sum of the columns at each station.
      {sh.dc1Split==='app'&&<span> Steel self-weight = girder steel at 0.490 kcf ({fmt(R.loads.wsw,3)} klf){sh.hasDia?' + the diaphragm point loads':''}; wet concrete = deck slab + haunch ({fmt(R.loads.wdk,3)} klf) + Add'l DC1 (forms, details: {fmt(+R.loads.wDC1-R.loads.wsw-R.loads.wdk,3)} klf).</span>}
      {sh.dc1Split==='swExcl'&&<span> The imported DC1 excludes self-weight; ST-Girder adds the girder self-weight. The imported remainder is not split further.<SwContNote R={R}/></span>}
      {sh.dc1Split==='import'&&<span> DC1 is imported ({(R.ext&&R.ext.sel&&'span '+(R.ext.sel.idx||1))||'import'}) with its split: steel = the payload's M_DC1steel (girder plates + the details allowance, on the steel section), wet concrete = M_DC1 − M_DC1steel (deck, haunch, SIP forms and other noncomposite DC1).</span>}
      {sh.dc1Split==='none'&&<span> <b>DC1 is imported</b> ({(R.ext&&R.ext.sel&&'span '+(R.ext.sel.idx||1))||'import'}) as one total; the import does not separate steel self-weight from wet concrete, so DC1 is shown as one column.</span>}
      {d>0.0005&&<span> The largest total ({fmt(cm.camTotMax,3)} in, the headline value) is {fmt(d,3)} in less than Δ_total = Δ_DC1 + Δ_DC2 + Δ_DW ({fmt(cm.camTot,3)} in, the sum of the stage maxima) because the stage maxima occur at different stations.</span>}
    </div>
  </React.Fragment>);
}

/* Camber derivation, shared by the Camber tab and the calculation-sheet report (display only; moved out of CamberTab unchanged). */
function camberDeriv(R){ const cm=R.camber;
  return (    <Deriv title="Dead-load deflection & camber" refTag="stage-correct sections · double integration">
      <VarTable title="Variables — camber" rows={[
        ['L','Span length',R.geom.L,'ft'],['E_s','Steel modulus',R.matR.Es,'ksi'],
        ['I_bare','Bare-steel inertia (midspan)',R.bare.I,'in⁴'],
        ['I_3n','Long-term composite inertia (midspan)',R.c3N.I,'in⁴'],
        ['Δ_DC1','Deflection from DC1 (bare)',cm.camDC1,'in'],
        ['Δ_DC2','Deflection from DC2 (3n)',cm.camDC2,'in'],
        ['Δ_DW','Deflection from DW (3n)',cm.camDW,'in'],
        ['Δ_total','Total dead-load camber',cm.camTot,'in'],
      ]}/>
      <SG n="1">Stage deflections (each on its stage-correct section)</SG>
      <ML s={Tx`\Delta_{DC1}=${nx(cm.camDC1,3)}\;\text{in (bare steel, }I=${nx(R.bare.I,0)}\;\text{in}^4)`}/>
      <ML s={Tx`\Delta_{DC2}=${nx(cm.camDC2,3)}\;\text{in}\qquad\Delta_{DW}=${nx(cm.camDW,3)}\;\text{in}\quad(\text{long-term }3n,\;I=${nx(R.c3N.I,0)}\;\text{in}^4)`}/>
      <DLinks items={[{to:'segs',what:'I (bare, 3n) of each segment'},{to:'menv',what:'DC1, DC2, DW moments'}]}/>
      <SG n="2">Total camber</SG>
      <ML s={Tx`\Delta_{total}=\Delta_{DC1}+\Delta_{DC2}+\Delta_{DW}=${nx(cm.camDC1,3)}+${nx(cm.camDC2,3)}+${nx(cm.camDW,3)}=${nx(cm.camTot,3)}\;\text{in}\;\uparrow`}/>
      <SG n="3">Deflection by load along the span</SG>
      <CamberBreakdown R={R} fig={true}/>
      <div className="mnote">Deflections are found by numerically double-integrating M/(E·I) along the span on a camber-only station set about 0.5 ft apart, plus the supports, both sides of each flange transition and any imported stations (handling flange segments and any imported continuous-moment diagram), which is exact for variable sections — not the closed-form 5wL⁴/384EI that assumes a prismatic simple span. There is no prestress term (unlike the PS-Beam app). Add fabrication/residual camber per the fabricator's practice.</div>
    </Deriv>);
}
function CamberTab({R}){
  if(!R.ok) return null;
  const cm=R.camber;
  return (<div>
    <div className="bigres">
      <div className="br"><div className="l">Total DL camber (max)</div><div className="n">{fmt(cm.camTotMax,2)}</div><div className="u">in ↑ offset · at x = {fmt(cm.xTot,1)} ft</div></div>
      <div className="br"><div className="l">Δ DC1 (bare steel)</div><div className="n">{fmt(cm.camDC1,2)}</div><div className="u">in · at x = {fmt(cm.xDC1,1)} ft</div></div>
    </div>
    <Card title="What camber is" refTag="dead-load deflection offset">
      <div className="hint">Steel girders are fabricated with a built-in upward curvature (<b>camber</b>) equal and opposite to the dead-load deflection, so the finished bridge sits on the intended profile grade. The deflection is computed stage-by-stage on the section active at each stage — DC1 (self-weight + wet deck) on the bare steel, DC2 (barrier) and DW (wearing surface) on the long-term (3n) composite — because the concrete has not cured when DC1 is applied.</div>
    </Card>

    {camberDeriv(R)}
  </div>);
}

  const s1=(
    <Card title="Step 1 — Fatigue traffic & number of stress cycles" refTag="LRFD 3.6.1.4 · 6.6.1.2.5">
