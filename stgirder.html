      <Fig h={280} data={[
        {x:fx,y:cf.map(p=>p.Vf),name:'V (perm. + Fatigue I LL)',fill:'tozeroy',fillcolor:'rgba(14,116,144,.06)',line:{color:'#0E7490',width:2.2}},
        hl(f.Vcr,'Vcr shear-buckling resistance','#B3261E')]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'shear (kip)',rangemode:'tozero'}}}/>
      <div className="hint">Where the elastically-computed factored shear range under the Fatigue I load could otherwise buckle the web, the sum of the unfactored permanent shear and the Fatigue&nbsp;I (γ=1.75) fatigue-truck shear is limited to the shear-buckling resistance V<sub>cr</sub> = C·V<sub>p</sub> = {fmt(f.Vcr,0)} kip. This keeps the web elastic under repeated load so tension-field action isn't relied on cyclically.</div>
    </Card>
  </div>);
}

function StiffTab({R}){
  if(!R.ok) return null;
  const ts=R.tStiff, br=R.bearing;
  return (<div>
    <div className="bigres">
      <div className={'br '+(br.bearingOK&&br.axialOK?'p':'f')}><div className="l">Bearing stiffener</div><div className="n">{fmt(br.Rreact/Math.min(br.RsbN,br.Pr),2)}</div><div className="u">R / min(Rsb, Pr)</div></div>
      {ts&&<div className={'br '+(ts.ItOK&&ts.widthOK?'p':'f')}><div className="l">Transverse stiffener</div><div className="n">{fmt(ts.ItReq/ts.ItProv,2)}</div><div className="u">It req / prov{ts.widthOK?'':(ts.minOK?' · b_t > 16t_p':' · b_t < min')}</div></div>}
    </div>
    {ts&&<Deriv title="Transverse intermediate stiffener" refTag="AASHTO 6.10.11.1">
      <VarTable title="Variables — transverse stiffener" rows={[
        ['D','Web depth',R.sec.D,'in'],['t_w','Web thickness',R.sec.tw,'in'],
        ['d_o','Stiffener spacing (panel length)',ts.do_,'in'],
        ['b_t','Projecting width provided',ts.bt,'in'],['t_p','Stiffener plate thickness',ts.tp,'in'],
        ['J','Stiffness parameter 2.5(D/d_o)²−2 ≥ 0.5',ts.J,'—'],
        ['b','Smaller of d_o and D (6.10.11.1.3)',ts.bIt,'in'],
        ['I_t1','Baseline requirement b·t_w³·J',ts.It1,'in⁴'],
        ['F_crs','Local buckling stress 0.31E/(b_t/t_p)² ≤ F_ys',ts.Fcrs,'ksi'],
        ['ρ_t','Larger of F_yw/F_crs and 1.0',ts.rhoT,'—'],
        ['I_t2','Tension-field requirement D⁴ρ_t^1.3(F_yw/E)^1.5/40',ts.It2,'in⁴'],
        ['ρ_w','Fraction of the tension-field capacity used',ts.rhoW,'—'],
        ['I_t,req','Required I_t1 + (I_t2 − I_t1)ρ_w',ts.ItReq,'in⁴'],
        ['I_t,prov','Provided t_p·b_t³/3',ts.ItProv,'in⁴'],
      ]}/>
      <SG n="1">Projecting-width limits</SG>
      <ML s={Tx`b_t\ge2.0+\frac{D}{30}=${nx(ts.btMinD,2)}\;\text{in}\qquad b_t\ge\frac{b_f}{4}=\frac{${nx(ts.bfComp,2)}}{4}=${nx(ts.btMinF,2)}\;\text{in}\qquad b_t\le16.0\,t_p=${nx(ts.btMax,2)}\;\text{in}`}/>
      <ML s={Tx`b_t=${nx(ts.bt,2)}\;\text{in}\;\Rightarrow\;${ts.widthOK?'\\text{within limits}\\;\\checkmark':(ts.minOK?'\\text{exceeds }16t_p\\;\\text{N.G.}':'\\text{below the minimum}\\;\\text{N.G.}')}`}/>
      <div className="mnote">Both b_f/4 and 2.0 + D/30 are <b>lower</b> bounds on the projecting width; only 16.0 t_p is an upper bound. b_f is the full width of the widest compression flange in the panel ({R.hasNeg?'the larger of the two flanges, since this girder has negative-moment regions':'the top flange'} = {fmt(ts.bfComp,2)} in). The 0.48 t_p √(E/F_ys) limit belongs to bearing stiffeners (6.10.11.2.2), not to transverse intermediate stiffeners.</div>
      <SG n="2">Moment-of-inertia requirement</SG>
      <ML s={Tx`J=2.5\!\left(\frac{D}{d_o}\right)^{2}-2=${nx(ts.J,2)}\;(\ge0.5)\qquad b=\min(d_o,D)=${nx(ts.bIt,1)}\;\text{in}\qquad I_{t1}=b\,t_w^{3}\,J=${nx(ts.It1,1)}\;\text{in}^4`}/>
      <ML s={Tx`F_{crs}=\frac{0.31E}{(b_t/t_p)^2}=${nx(ts.Fcrs,1)}\;\text{ksi}\quad\rho_t=\max\!\left(\frac{F_{yw}}{F_{crs}},1.0\right)=${nx(ts.rhoT,3)}\quad I_{t2}=\frac{D^{4}\rho_t^{1.3}}{40}\left(\frac{F_{yw}}{E}\right)^{1.5}=${nx(ts.It2,1)}\;\text{in}^4`}/>
      <ML s={Tx`\rho_w=\frac{V_u-\phi_vC V_p}{\phi_v V_{n,int}-\phi_v C V_p}=${nx(ts.rhoW,3)}\qquad I_{t,req}=I_{t1}+(I_{t2}-I_{t1})\rho_w=${nx(ts.ItReq,1)}\;\text{in}^4`}/>
      <ML s={Tx`I_{t,prov}=\frac{t_p\,b_t^{3}}{3}=${nx(ts.ItProv,1)}\;\text{in}^4\;${ts.ItOK?'\\ge':'<'}\;I_{t,req}\;${ts.ItOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Two requirements, blended. <b>I_t1</b> is the baseline stiffness that keeps the stiffener from buckling as a simple web stiffener; <b>I_t2</b> is the much stiffer requirement that applies when the panel is actually being asked to anchor a tension field. ρ_w measures how much of the tension-field capacity the design consumes above the C·V_p value — {ts.tfaUsed?'here ρ_w = '+fmt(ts.rhoW,3)+', so the requirement is interpolated toward I_t2 and the tension field is being leaned on':'here V_u sits at or below φ_v C·V_p, so ρ_w = 0 and only the baseline I_t1 is required — no tension field is being credited'}. Note b is the <b>smaller</b> of d_o and D, not D itself. Spacing d_o also sets the shear buckling coefficient k on the Shear tab.</div>
    </Deriv>}

    <Deriv title="Bearing stiffener (at support)" refTag="AASHTO 6.10.11.2 · bearing + axial column">
      <VarTable title="Variables — bearing stiffener" rows={[
        ['n_b','Plates each side',br.nb,'—'],['b_b','Plate width',br.bb,'in'],['t_b','Plate thickness',br.tb,'in'],
        ['A_pn','Net bearing area (less corner clip)',br.Apn,'in²'],
        ['F_ys','Stiffener yield',50,'ksi'],
        ['b_b,max','Projecting-width limit 0.48·t_p·√(E/F_ys)',br.bbMax,'in'],
        ['R_sb','Bearing resistance 1.4·A_pn·F_ys',br.RsbN,'kip'],
        ['KL/r','Effective column slenderness',br.KLr,'—'],
        ['φP_n','Axial column resistance',br.Pr,'kip'],
        ['R_u','Support reaction (Strength I V_u)',br.Rreact,'kip'],
      ]}/>
      <SG n="1">Projecting width</SG>
      <ML s={Tx`b_b=${nx(br.bb,2)}\;\text{in}\;\le\;0.48\,t_p\sqrt{E/F_{ys}}=0.48(${nx(br.tb,3)})\sqrt{29000/50}=${nx(br.bbMax,2)}\;\text{in}\;${br.widthOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <SG n="2">Bearing resistance</SG>
      <ML s={Tx`R_{sb}=1.4\,A_{pn}F_{ys}=1.4\cdot${nx(br.Apn,1)}\cdot50=${nx(br.RsbN,0)}\;\text{kip}\qquad\frac{R_u}{R_{sb}}=${nx(br.Rreact/br.RsbN,3)}\;${br.bearingOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <SG n="3">Axial column check (effective section: stiffener plates + 9t_w web each side)</SG>
      <ML s={Tx`\frac{KL}{r}=\frac{0.75D}{r}=${nx(br.KLr,1)}\qquad\phi_cP_n=${nx(br.Pr,0)}\;\text{kip}\qquad\frac{R_u}{\phi_cP_n}=${nx(br.Rreact/br.Pr,3)}\;${br.axialOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">The bearing stiffener transmits the support reaction R_u = {fmt(br.Rreact,0)} kip into the web. It is checked two ways: local bearing on the milled contact area (net of the corner clip that clears the web-to-flange weld), and as an axial column — the stiffener plates plus a strip of web 9t_w wide on each side, with an effective length 0.75D.</div>
    </Deriv>
  </div>);
}

function ConnTab({R}){
  if(!R.ok) return null;
  const c=R.conn;
  return (<div>
    <div className="bigres">
      <div className={'br '+(c.strOK?'p':'f')}><div className="l">Studs — strength</div><div className="n">{fmt(c.nReq/Math.max(c.nProv,1),2)}</div><div className="u">{Math.ceil(c.nReq)} req / {c.nProv} prov</div></div>
      <div className={'br '+(c.pitchOK?'p':'f')}><div className="l">Studs — fatigue pitch</div><div className="n">{fmt(c.pitch/c.pReq,2)}</div><div className="u">{fmt(c.pitch,1)} / {fmt(c.pReq,1)} in</div></div>
    </div>

    <Card title="What this check is" refTag="AASHTO 6.10.10 · composite action">
      <div className="hint">Welded stud shear connectors transfer the horizontal shear between the steel girder and the concrete deck so they act compositely. Two independent requirements: a <b>strength</b> requirement (6.10.10.4) — enough studs between the maximum-moment section and the support to develop the smaller of the slab or steel plastic force — and a <b>fatigue</b> requirement (6.10.10.1.2/2) that limits the stud pitch based on the cyclic shear range from the fatigue truck. {c.nRow} studs per row assumed.</div>
    </Card>

    <Deriv title="Stud resistance & strength requirement" refTag="6.10.10.4">
      <VarTable title="Variables — shear studs" rows={[
        ['A_sc','Area of one stud',c.Asc,'in²'],
        ['Q_n','Nominal shear resistance of one stud',c.Qn,'kip'],
        ['Q_r','Factored resistance φ_sc·Q_n (φ_sc=0.85)',c.Qr,'kip'],
        ['P','Governing horizontal force min(slab, steel)',c.Pshear,'kip'],
        ['n_req','Required studs, max-M to support',c.nReq,'—'],
        ['n_prov','Provided studs over the half-span',c.nProv,'—'],
        ['pitch','Longitudinal stud pitch',c.pitch,'in'],
      ]}/>
      <SG n="1">Nominal & factored stud resistance</SG>
      <ML s={Tx`Q_n=\min\!\left(0.5A_{sc}\sqrt{f'_cE_c},\;A_{sc}F_u\right)=${nx(c.Qn,1)}\;\text{kip}\qquad Q_r=\phi_{sc}Q_n=0.85\cdot${nx(c.Qn,1)}=${nx(c.Qr,1)}\;\text{kip}`}/>
      <SG n="2">Number of studs required (strength)</SG>
      <ML s={Tx`n=\frac{P}{Q_r}=\frac{${nx(c.Pshear,0)}}{${nx(c.Qr,1)}}=${nx(c.nReq,1)}\;\text{studs}\quad\text{(max-M}\to\text{support)}`}/>
      <ML s={Tx`n_{prov}=${nx(c.nProv,0)}\;${c.strOK?'\\ge':'<'}\;n_{req}=${nx(c.nReq,1)}\;${c.strOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">P is the smaller of the slab force 0.85f′_c·b_eff·t_s and the steel force F_y·A_steel — the total horizontal shear that must be transferred between the point of maximum moment and the support.</div>
    </Deriv>

    <Deriv title="Fatigue pitch requirement" refTag="6.10.10.1.2 / 6.10.10.2">
      <VarTable title="Variables — fatigue" rows={[
        ['\u03b3','Fatigue load factor ('+(c.fatInf?'Fatigue I, infinite life':'Fatigue II, finite life')+')',c.gammaFat,'—'],
        ['Z_r','Fatigue shear resistance of one stud',c.Zr,'kip'],
        ['V_sr','Fatigue horizontal shear range per unit length',c.Vsr,'kip/in'],
        ['n','Studs per row (transverse)',c.nRow,'—'],
        ['p_req','Maximum permitted pitch n·Z_r/V_sr',c.pReq,'in'],
        ['pitch','Provided pitch',c.pitch,'in'],
      ]}/>
      <ML s={c.fatInf
        ? Tx`Z_r=5.5\,d^{2}=${nx(c.Zr,2)}\;\tfrac{\text{kip}}{\text{stud}}\quad(\text{Fatigue I, infinite life, Eq. 6.10.10.2-1})`
        : Tx`Z_r=\alpha d^{2}=(${nx(c.alphaF,2)})d^{2}=${nx(c.Zr,2)}\;\tfrac{\text{kip}}{\text{stud}}\quad(\text{Fatigue II, finite life})`}/>
      <ML s={Tx`V_f=\gamma\,V_{tr}(1.15)\,g_{V,1}=${nx(c.gammaFat,2)}\cdot${nx(c.Vtr,2)}\cdot1.15\cdot${nx(c.dfFatV,3)}=${nx(c.gammaFat,2)}\cdot${nx(c.VfatU,2)}=${nx(c.Vfat,2)}\;\text{kip}\qquad V_{sr}=\frac{V_f\,Q}{I}=\frac{${nx(c.Vfat,2)}\cdot${nx(c.Qslab,0)}}{${nx(c.Icomp,0)}}=${nx(c.Vsr,3)}\;\tfrac{\text{kip}}{\text{in}}`}/>
      <div className="mnote">The load factor and the Z<sub>r</sub> branch are a pair (6.10.10.2 with Table 3.4.1-1): Fatigue&nbsp;I applies γ&nbsp;=&nbsp;1.75 against the infinite-life resistance 5.5d², Fatigue&nbsp;II applies γ&nbsp;=&nbsp;0.80 against αd². Which one is in force is decided on the Fatigue tab and follows the same (ADTT)<sub>SL</sub> crossover as the flange check.</div>
      <ML s={Tx`p\le\frac{n\,Z_r}{V_{sr}}=\frac{${nx(c.nRow,0)}\cdot${nx(c.Zr,2)}}{${nx(c.Vsr,3)}}=${nx(c.pReq,1)}\;\text{in}\qquad p_{prov}=${nx(c.pitch,1)}\;${c.pitchOK?'\\le':'>'}\;p_{req}\;${c.pitchOK?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Z_r is the fatigue shear resistance of one stud (Fatigue&nbsp;II: α = 34.5 − 4.28·log N; Fatigue&nbsp;I: 5.5d²). V_sr = V_f·Q/I is the horizontal shear range per unit length from the fatigue truck on the short-term composite section. The required pitch is the closest fatigue-controlled spacing; the provided pitch must not exceed it.</div>
    </Deriv>
  </div>);
}

function OptimizeTab({R,inp}){
  if(!R.ok) return null;
  const base=+inp.sec.tfb, vals=[];
  for(let t=Math.max(0.5,base-0.75); t<=base+0.75+1e-6; t+=0.125) vals.push(+t.toFixed(3));
  const rows=vals.map(t=>{ const e=JSON.parse(JSON.stringify(inp)); e.sec.tfb=t;
    if(e.sec.useSegs&&Array.isArray(e.sec.segs))
      e.sec.segs=e.sec.segs.map(s=>({...s, tfb:+(Math.max(0.25,(+s.tfb||t)+(t-base))).toFixed(4)}));
    const Rr=computeAll(e);
    // a swept size can make computeAll fail ({ok:false}, no checks) — show it as a gap, not a crash
    if(!Rr.ok||!Array.isArray(Rr.checks)) return {t,flex:NaN,shear:NaN,serv:NaN,pass:false,err:Rr.error||'compute failed'};
    const g=k=>{const c=Rr.checks.find(x=>x.t===k); return c?c.r:0;};
    return {t,flex:Math.max(g('Flexure'),g('Neg flex')),shear:g('Shear'),serv:g('SrvII'),pass:Rr.ok&&Rr.checks.every(c=>c.pass)}; });
  return (<div>
    <Card title="Optimize — bottom-flange thickness" refTag="governing D/C vs plate size">
      <Fig h={300} data={[
        {x:vals,y:rows.map(r=>isFinite(r.flex)?r.flex:null),name:'Flexure',mode:'lines+markers',line:{color:'#1C4FC4'}},
        {x:vals,y:rows.map(r=>isFinite(r.shear)?r.shear:null),name:'Shear',mode:'lines+markers',line:{color:'#B3261E'}},
        {x:vals,y:rows.map(r=>isFinite(r.serv)?r.serv:null),name:'Service II',mode:'lines+markers',line:{color:'#15803D'}},
        {x:[vals[0],vals[vals.length-1]],y:[1,1],name:'D/C = 1',mode:'lines',line:{color:'#888',dash:'dot'}}]}
        layout={{yaxis:{title:'D/C'},xaxis:{title:'bottom flange tfb (in)'}}}/>
      <Tbl head={['tfb (in)','Flexure','Shear','Service II','All pass']}
        rows={rows.map(r=>({_cls:Math.abs(r.t-base)<1e-6?'tot':'',c:[fmt(r.t,3),fmt(r.flex,2),fmt(r.shear,2),fmt(r.serv,2),PF(r.pass)]}))}/>
      <div className="hint">Sweeps the bottom-flange thickness around the current {fmt(base,3)} in (bold row), recomputing the full model at each size. Use it to find the lightest flange keeping every D/C ≤ 1.0. The same pattern extends to web and top-flange sweeps.</div>
    </Card>
  </div>);
}

const LS_KEY='stgirder.session', LS_PROJ='stgirder.projects', LS_LAST='stgirder.lastproj';
const UI_KEY='stgirder.ui.v1';
/* Persistent UI-preference store, kept apart from the session/design data. View
   state a tab holds locally -- e.g. the Diagrams span view -- lives here so it
   survives leaving the tab (which unmounts it) and a full reload. Preferences
   only, never engineering data. */
function loadUI(){ try{ const r=window.localStorage.getItem(UI_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveUI(patch){ try{ const cur=loadUI(); window.localStorage.setItem(UI_KEY,JSON.stringify({...cur,...patch})); }catch(e){} }
function lsAvailable(){ try{const k='__t';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true;}catch(e){return false;} }
function loadSaved(){ try{const s=window.localStorage.getItem(LS_KEY);return s?JSON.parse(s):null;}catch(e){return null;} }
function saveInputs(inp){ try{window.localStorage.setItem(LS_KEY,JSON.stringify(inp));return true;}catch(e){return false;} }
function clearSaved(){ try{window.localStorage.removeItem(LS_KEY);}catch(e){} }
const ST_APP='stgirder', BP=()=>window.BridgeProjects;
function legacyLoadProjects(){ try{const s=window.localStorage.getItem(LS_PROJ);return s?JSON.parse(s):{};}catch(e){return {};} }
try{ if(BP()) BP().migrate(ST_APP, legacyLoadProjects(), le=>le&&le.inp); }catch(e){}
// Named projects live in the shared Bridge Suite registry — one project spans all apps.
function loadProjects(){
  if(!BP()) return legacyLoadProjects();
  const reg=BP().raw(), out={};
  for(const id in reg){ const e=reg[id];
    out[id]={name:e.name, savedAt:e.savedAt, inp:(e.slices&&e.slices[ST_APP]!=null)?e.slices[ST_APP]:null,
      _apps:Object.keys(e.slices||{}), _hasDemands:!!e.demands}; }
  return out;
}
function writeProjects(o){ return true; }
function saveProjectAs(name,inp){ return BP()?BP().saveSlice(null,name||'Untitled',ST_APP,JSON.parse(JSON.stringify(inp))):null; }
function overwriteProject(id,inp){ return BP()?!!BP().saveSlice(id,undefined,ST_APP,JSON.parse(JSON.stringify(inp))):false; }
function deleteProject(id){ return BP()?BP().del(id):false; }
function renameProject(id,name){ return BP()?BP().rename(id,name):false; }
function loadLastProjId(){ return BP()?BP().current():null; }
function saveLastProjId(id){ if(BP()) BP().setCurrent(id); }
function mergeInputs(p){ if(!p) return null;
  const deep=(d,s)=>{ const o={...d}; for(const k in s){ o[k]=(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k]))?deep(d[k]||{},s[k]):s[k]; } return o; };
  return deep(DEFAULTS,p); }

/* ================= APP ================= */
/* ═══ Shared design-beam chip ═══════════════════════════════════════════════
   Backed by BridgeBeam (the block in this file's <head>). The beam picked here
   is the beam the whole suite uses: the live-load distribution factors and the
   dead-load distribution in the LL & DL app, the DFs pulled into this design,
   and the UDLs pushed to the MCT Loads tab. Changing it in any app — or in
   another browser tab — moves every app to the same beam.
   The roster comes from the LL & DL Distribution app, which is the only one
   that knows the full cross-section, so this chip degrades to a read-only
   label until that app has been run once.
   ═══════════════════════════════════════════════════════════════════════════ */
function useDesignBeam(){
  const BB=(typeof window!=='undefined'&&window.BridgeBeam)||null;
  const [,setTick]=useState(0);
  useEffect(()=>{ if(!BB) return undefined; return BB.onChange(()=>setTick(t=>t+1)); },[BB]);
  return {BB, sel:BB?BB.get():null, roster:BB?BB.roster():null};
}
function BeamChip({nb,setBy}){
  const {BB,sel,roster}=useDesignBeam();
  if(!BB) return null;
  const beams=(roster&&roster.beams)||[];
  const mm=BB.mismatch?BB.mismatch(nb):null;
  return (
    <span className="beamchip" title={'Design beam — shared by every app in the suite. '
      +'Set the beam layout and the MassDOT classification in the LL & DL Distribution app; '
      +'the distribution factors, the dead load and the MCT beam loads all follow this beam.'}>
      <span className="bc-k">Design beam</span>
      {beams.length
        ? <select value={sel?sel.index:''} onChange={e=>BB.set(+e.target.value,null,setBy||'')}>
            {beams.map(b=><option key={b.i} value={b.i}>{b.label} · {b.ab||b.clsLabel||''}</option>)}
          </select>
        : <span className="bc-v" title="No beam roster published yet — open the LL & DL Distribution app and recalculate.">
            {sel?sel.label:'—'} <span className="bc-warn">no roster</span></span>}
      {mm&&<span className="bc-warn" title={'This app is set up for '+mm.mine+' girders but the published roster has '
        +mm.roster+'. Re-run the LL & DL Distribution app on the current layout.'}>⚠ {mm.mine}≠{mm.roster}</span>}
    </span>);
}

function App(){
  const canSave=useMemo(()=>lsAvailable(),[]);
  const [inp,setInpRaw]=useState(()=>canSave?(mergeInputs(loadSaved())||DEFAULTS):DEFAULTS);
  const [tab,setTab]=useState('inputs');
  const undoStack=useRef([]), redoStack=useRef([]);
  const [,setHist]=useState(0); const HMAX=50;
  const setInp=(next)=>{ setInpRaw(prev=>{ const nv=typeof next==='function'?next(prev):next;
    if(JSON.stringify(nv)===JSON.stringify(prev))return prev;
    undoStack.current.push(prev); if(undoStack.current.length>HMAX)undoStack.current.shift();
    redoStack.current=[]; return nv; }); setHist(t=>t+1); };
  const undo=()=>{ if(!undoStack.current.length)return; setInpRaw(prev=>{redoStack.current.push(prev);return undoStack.current.pop();}); setHist(t=>t+1); };
  const redo=()=>{ if(!redoStack.current.length)return; setInpRaw(prev=>{undoStack.current.push(prev);return redoStack.current.pop();}); setHist(t=>t+1); };
  const R=useMemo(()=>computeAll(inp),[inp]);
  // ── Follow the suite-wide design beam ──────────────────────────────────────
  //    While loads.posAuto is on, the interior/exterior position comes from the beam
  //    selected in the header chip — its MassDOT classification decides which — so
  //    ST-Girder designs the same beam the LL & DL app is distributing load to.
  //    Flipping the INTERIOR/EXTERIOR toggle by hand turns posAuto off and tags the
  //    field as overridden until you click the tag to follow the beam again.
  //    setInpRaw, not setInp: following the shared beam is not an edit worth undoing.
  const dbSel=useDesignBeam().sel;
  useEffect(()=>{
    if(!dbSel||!dbSel.type||inp.loads.posAuto===false) return;
    const want=(dbSel.type==='ext')?'exterior':'interior';
    if(inp.loads.pos===want) return;
    setInpRaw(prev=>({...prev,loads:{...prev.loads,pos:want}}));
  },[dbSel&&dbSel.index,dbSel&&dbSel.type,inp.loads.posAuto,inp.loads.pos]);
  // ── Shared-storage hand-off from the analysis app (banner-prompted; never clobbers inputs) ──
  const APP_ID='stgirder', HANDOFF_SUPPORTED_VERSION=1;
  const [handoff,setHandoff]=useState(null);
  // Always the current inputs, for the code paths that run from a [] effect
  // and would otherwise close over the first render's `inp`.
  const inpRef=useRef(inp); inpRef.current=inp;
  const checkHandoff=()=>{ const BH=window.BridgeHandoff; if(!BH){ return; }
    const id=BH.latestId(); if(!id){ setHandoff(null); return; }
    const r=BH.readOne(id); if(!r){ setHandoff(null); return; }
    if(BH.adoptedId(APP_ID)===r.token){ setHandoff(null); return; }  // re-flags when the same girder is re-published (token = id@producedAt)
    // Locked = standing consent: adopt now, never raise the banner. The
    // version guard below still applies -- a payload this build cannot read
    // is reported rather than silently swallowed.
    if(BL&&BL.ok()&&BL.isLocked('demands')&&r.version<=HANDOFF_SUPPORTED_VERSION){
      adoptHandoff(r.payload,true); return;
    }
    setHandoff(r); };
  useEffect(()=>{ checkHandoff();
    const onStorage=e=>{ const BH=window.BridgeHandoff; if(!BH) return;
      if(!e.key || e.key===BH.K_LATEST || e.key===BH.K_UPDATED) checkHandoff(); };
    window.addEventListener('storage',onStorage);
    return ()=>window.removeEventListener('storage',onStorage);
  },[]);
  const adoptHandoff=(payload,silent)=>{
    // Background adopts arrive from a stale effect closure; take the live
    // inputs from the ref so nothing typed since page load is lost.
    const inp=inpRef.current;
    if(silent){
      // Re-stamped copy of the envelope we already hold? Mark it seen and stop:
      // no state churn and no toast for something that did not move.
      try{
        const cur=inp.external;
        if(cur){
          const strip=o=>{ const c=Object.assign({},o);
            delete c._selSpan; delete c.producedAt; delete c.generatedAt; delete c.handoffId;
            return JSON.stringify(c); };
          if(strip(cur)===strip(payload)){
            if(window.BridgeHandoff) window.BridgeHandoff.markAdopted(APP_ID, window.BridgeHandoff.tokenOf(payload));
            setHandoff(null); return false;
          }
        }
      }catch(e){}
    }
    const spans=externalSpans(payload);
    // A background adopt must not move the engineer to a different span.
    // Keep the one they are on if the new payload still has it.
    const curIdx=silent&&inp.external&&inp.external._selSpan?inp.external._selSpan.idx:null;
    const keep=curIdx!=null?spans.find(x=>x.idx===curIdx):null;
    const sel=keep||spans[0]||{idx:1,x0:0,x1:(payload.member&&payload.member.totalLength)||inp.geom.L,len:inp.geom.L};
    const secNew=zonesToSec(payload,sel,inp.sec);
    setInp({...inp, external:{...payload,_selSpan:sel}, geom:{...inp.geom,L:sel.len}, ...(secNew?{sec:secNew}:{})});
    if(window.BridgeHandoff) window.BridgeHandoff.markAdopted(APP_ID, window.BridgeHandoff.tokenOf(payload));
    setHandoff(null);
    if(silent&&BL&&BL.ok()){
      const n=(payload.stations&&payload.stations.length)||0;
      // Recomputed here rather than reused: only PS-Beam keeps a `continuous`
      // local, and this block is byte-identical in both design apps.
      const multi=spans.length>1||!!(payload.member&&Array.isArray(payload.member.spans)&&payload.member.spans.length>1);
      const what=n+' station'+(n===1?'':'s')+', span '+sel.idx+' \u2014 '
        +(payload.liveLoadType||'HL-93')+(multi?', continuous':'');
      BL.log({channel:'demands', app:LOCK_APP, source:payload.producer||'MCT Generator', text:what});
      BL.toast('Demands updated \u2014 '+(payload.producer||'MCT Generator'),what);
    }
    return true;
  };
  const dismissHandoff=()=>{ if(handoff&&window.BridgeHandoff) window.BridgeHandoff.markAdopted(APP_ID, handoff.token); setHandoff(null); };

  /* ---- Demands channel lock ----
     Standing consent to the analysis hand-off. While locked, checkHandoff
     adopts instead of raising the banner, and the change log plus a toast are
     the record -- an update that lands while this tab is in the background is
     still auditable afterwards. */
  const demandsLocked=!!(BL&&BL.isLocked('demands'));
  const toggleDemandsLock=(on)=>{
    if(!BL) return;
    if(on){
      BL.lock('demands',LOCK_APP);
      BL.log({channel:'demands', app:LOCK_APP, source:'MCT Generator',
        text:'auto-adopt ON \u2014 following the analysis model'});
      BL.toast('Demands locked','New MIDAS demands from the MCT Generator will load here automatically until you unlock.');
    } else {
      BL.unlock('demands',LOCK_APP);
      BL.log({channel:'demands', app:LOCK_APP, source:'MCT Generator', text:'auto-adopt OFF'});
    }
  };
  // Re-check when the lock flips in another tab, so locking from the suite
  // panel adopts whatever is already waiting rather than waiting for the next
  // publish.
  useEffect(()=>{ if(!BL) return; return BL.onChange((ch)=>{ if(ch==='demands') checkHandoff(); }); },[]);
  // ── Geometry change detection from MCT (banner-prompted; user selects which changes to adopt) ──
  const [geomChanges,setGeomChanges]=useState(null);
  const [geomModalOpen,setGeomModalOpen]=useState(false);
  const checkGeometryChanges=()=>{ const BGC=window.BridgeGeometryChanges; if(!BGC){ return; }
    const changes=BGC.readGeometryChanges(); if(!changes){ setGeomChanges(null); return; }
    const adoptedAt=BGC.adoptedGeometryAt(APP_ID);
    if(adoptedAt===changes.producedAt){ setGeomChanges(null); return; }  // already adopted
    // Locked, the geometry arrives inside the demands envelope itself, so
    // this notice would only say the same thing twice. Read the lock from
    // storage rather than a captured `demandsLocked`: this runs from a []
    // effect and from a storage handler, both of which hold stale closures.
    if(BL&&BL.ok()&&BL.isLocked('demands')){
      BGC.markGeometryAdopted(APP_ID,changes.producedAt); setGeomChanges(null); return; }
    setGeomChanges(changes);
  };
  useEffect(()=>{ checkGeometryChanges();
    const onStorage=e=>{ const BGC=window.BridgeGeometryChanges; if(!BGC) return;
      if(!e.key || e.key===BGC.K_GEOM_AT) checkGeometryChanges(); };
    window.addEventListener('storage',onStorage);
    return ()=>window.removeEventListener('storage',onStorage);
  },[]);
  const skipGeometryChanges=()=>{
    if(!geomChanges) return;
    if(window.BridgeGeometryChanges){ window.BridgeGeometryChanges.markGeometryAdopted(APP_ID, geomChanges.producedAt); }
    setGeomChanges(null);
    setGeomModalOpen(false);
  };
  // A demands lock makes this notice redundant; re-evaluate the moment it flips
  // in any tab, so locking from the suite panel clears a banner already up.
  useEffect(()=>{ if(!BL) return; return BL.onChange((ch)=>{ if(ch==='demands') checkGeometryChanges(); }); },[]);
  // ── Capacity feedback: publish per-node φMn±/φVn over the FULL member to the MCT rating ──
  // Re-render on any lock change so the capacity control reflects the shared
  // state; InputsTab subscribes separately for its own driven fields.
  const appLockTick=BLU.useLocks?BLU.useLocks():0;
  const publishCapacity=(silent)=>{
    const say=(m)=>{ if(!silent) alert(m); };
    try{
      if(!R.ok){ say('Fix the section inputs first — the section engine reported an error.'); return false; }
      const ext=inp.external;
      const extOk=!!(ext&&Array.isArray(ext.stations)&&ext.stations.length);
      const spansAll=extOk? externalSpans(ext) : [{idx:1,x0:0,x1:+inp.geom.L,len:+inp.geom.L}];
      const stationsOut=[], warns=[];
      spansAll.forEach(sp=>{
        let R2;
        if(extOk){
          const secNew=zonesToSec(ext,sp,inp.sec);
          R2=computeAll({...inp, external:{...ext,_selSpan:sp}, geom:{...inp.geom,L:sp.len}, ...(secNew?{sec:secNew}:{})});
        } else R2=R;
        if(!R2.ok){ warns.push('Span '+sp.idx+' could not be evaluated: '+R2.error); return; }
        const phiVn=R2.shearR.phiv*R2.shearR.Vcr;                 // end-panel basis (conservative)
        (R2.chartFlex||[]).forEach(c=>{
          stationsOut.push({x:+(sp.x0+c.x).toFixed(3), span:sp.idx,
            phiMn_pos:+c.capPos.toFixed(1), phiMn_neg:+c.capNeg.toFixed(1),   // k-ft; neg ≤ 0
            phiVn:+phiVn.toFixed(1),
            Sx_pos:+c.SxPos.toFixed(0), Sx_neg:+c.SxNeg.toFixed(0),           // in³ (short-term comp. / cracked top)
            fServLim:+c.fServLim.toFixed(2),                                  // ksi · (0.95 composite / 0.80 noncomposite)RhFyf
            basis:c.compact?'Mp':'stress'});
        });
      });
      if(!stationsOut.length){ say('No capacity stations could be computed.'); return false; }
      const supports=extOk&&ext.member?ext.member.supports:[0,+inp.geom.L];
      const payload={_schema:'bridge-design-capacity',schemaVersion:1,
        producer:'ST-Girder',producedAt:new Date().toISOString(),
        project:inp.proj.name||'',memberKey:inp.proj.girderId||'',
        units:{force:'kip',length:'ft',moment:'ft-kip',modulus:'in3'},
        phiIncluded:true, phiFlex:1.0, phiShear:1.0, Fy:R.matR.Fyf,
        member:{supports, spans:spansAll.map(s=>s.len), totalLength:supports[supports.length-1]},
        designSpanIdx:(R.ext&&R.ext.sel)?R.ext.sel.idx:1,
        basis:'AASHTO LRFD 6.10 — φMn+ per 6.10.7 (Mp basis where compact, else stress-basis equivalent min(Fnc·St, Fnt·Sb)); φMn− per 6.10.8 cracked steel+rebar section; φVn = C·Vp end-panel (interior tension-field capacity not taken). φf = φv = 1.0 included.',
        service:{note:'fServLim per station = '+(R.stress.s2Coef.toFixed(2))+'RhFyf (ksi) — 0.95 for a composite section, 0.80 for both flanges of a noncomposite section per 6.10.4.2.2; Sx_pos = short-term composite Sb, Sx_neg = cracked-section St for stress-based Service II / fatigue rating.'},
        fatigue:{category:inp.fatigue.category, FnFat:+R.fatigue.FnFat.toFixed(2), life:inp.fatigue.life},
        stationCount:stationsOut.length, stations:stationsOut, warnings:warns};
      const raw=JSON.stringify(payload);
      if(silent){
        // A locked republish that carries the same numbers is not news. Strip the
        // timestamp and compare, so the consumers only ever see real movement.
        try{ const prev=localStorage.getItem('bridgeSuite.v1.capacity');
          if(prev){ const a=JSON.parse(prev), b=JSON.parse(raw);
            delete a.producedAt; delete b.producedAt;
            if(JSON.stringify(a)===JSON.stringify(b)) return false; } }catch(e){}
      }
      try{ localStorage.setItem('bridgeSuite.v1.capacity',raw);
           localStorage.setItem('bridgeSuite.v1.capacity.updatedAt',payload.producedAt); }
      catch(e){ say('Could not write to shared storage: '+e.message); return false; }
      say('Capacity published — '+stationsOut.length+' stations over '+spansAll.length+' span(s).\n\nOpen the MCT app → AASHTO Rating and apply the "Design capacity received" banner.'+(warns.length?'\n\nWarnings:\n• '+warns.join('\n• '):''));
      return true;
    }catch(e){ say('Capacity publish failed: '+(e&&e.message||e)); return false; }
  };
  /* ---- Capacity channel lock ----
     One-shot publish is still there (click the button while unlocked). Locking
     turns it into a standing subscription: every recompute republishes, and the
     MCT rating tab applies the new envelope without prompting. The debounce
     matters — R recomputes on every keystroke and the payload is a few hundred
     stations, so an undebounced publish would thrash localStorage and fire a
     storage event per character typed. */
  const capLocked=!!(BL&&BL.isLocked('capacity'));
  const capTimer=useRef(null);
  useEffect(()=>{
    // Only one app republishes capacity, even with PS-Beam and ST-Girder
    // both open on the same locked channel.
    if(!BL||!BL.drives('capacity',LOCK_APP,'ST-Girder')) return;
    clearTimeout(capTimer.current);
    capTimer.current=setTimeout(()=>{
      // publishCapacity(true) returns false when the payload is unchanged, so a
      // recompute that does not move the capacity raises no toast anywhere.
      if(publishCapacity(true)){
        BL.log({channel:'capacity', app:LOCK_APP, source:'this app',
          text:'republished the \u03c6Mn / \u03c6Vn envelope'});
      }
    },700);
    return ()=>clearTimeout(capTimer.current);
  },[R,inp,capLocked]);
  const toggleCapLock=(on)=>{
    if(!BL) return;
    if(on){
      const wrote=publishCapacity(true);
      BL.lock('capacity',LOCK_APP);
      BL.log({channel:'capacity', app:LOCK_APP, source:'this app',
        text:'auto-publish ON \u2014 the MCT rating now follows this capacity'
          +(wrote?'':' (envelope already current)')});
      BL.toast('Capacity locked','The MCT rating will follow this girder\u2019s \u03c6Mn / \u03c6Vn envelope until you unlock it.');
    } else {
      BL.unlock('capacity',LOCK_APP);
      BL.log({channel:'capacity', app:LOCK_APP, source:'this app', text:'auto-publish OFF'});
    }
  };

  const fileRef=useRef(), saveTimer=useRef();
  // ── Auto-participate in the shared Bridge Project (created & managed only in MCT) ──
  // ST-Girder has no Save / New / Delete / project-dropdown of its own. It autosaves its
  // slice into whatever project is active, follows external project switches live, and
  // keeps Export/Import JSON for portable single-design files + the per-session autosave.
  const [curProjId,setCurProjIdRaw]=useState(()=>canSave&&BP()?BP().current():null);
  const [activeName,setActiveName]=useState(()=>{ const id=canSave&&BP()?BP().current():null; const p=id&&BP().get(id); return p?p.name:''; });
  const adoptProject=id=>{
    if(!id||!BP()){ setCurProjIdRaw(null); setActiveName(''); return; }
    const e=BP().get(id), slice=BP().getSlice(id,ST_APP);
    setCurProjIdRaw(id); setActiveName(e?e.name:'');
    if(slice){ const merged=mergeInputs(slice); setInp(merged);
      try{ const dem=BP().getDemands(id); if(dem&&!merged.external&&window.BridgeHandoff) window.BridgeHandoff.publish(dem); }catch(e){}
    } };
  // Follow the active project when it's switched from another app (e.g. MCT loads a project).
  useEffect(()=>{ if(!canSave||!BP())return;
    const onStorage=e=>{ if(!e.key||e.key===BP().K_CUR||e.key===BP().K_PROJ){
      const cur=BP().current();
      if(cur!==curProjId){ adoptProject(cur); }
      else { const p=cur&&BP().get(cur); setActiveName(p?p.name:''); } } };
    window.addEventListener('storage',onStorage);
    return ()=>window.removeEventListener('storage',onStorage);
  },[curProjId]);
  useEffect(()=>{ if(!canSave)return; clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{ saveInputs(inp);          // per-session autosave (always)
      // Contribute to the ACTIVE shared project only — never create or rename one (that's MCT's job).
      try{ if(BP()){ const cur=BP().current(); if(cur&&BP().get(cur)) BP().saveSlice(cur,undefined,ST_APP,JSON.parse(JSON.stringify(inp))); } }catch(e){}
    },400); return ()=>clearTimeout(saveTimer.current); },[inp,canSave]);
  useEffect(()=>{ const h=e=>{ const mod=e.ctrlKey||e.metaKey; if(!mod)return; const k=e.key.toLowerCase();
    if(k==='z'&&!e.shiftKey){e.preventDefault();undo();} else if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();redo();} };
    window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h); },[]);
  const resetAll=()=>{ if(window.confirm('Reset all inputs to defaults?')){ clearSaved(); undoStack.current=[]; redoStack.current=[]; setInpRaw(DEFAULTS); setHist(t=>t+1); } };
  const exportJSON=()=>{ const blob=new Blob([JSON.stringify({...inp,_schema:'stgirder'},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(inp.proj.name||'stgirder').replace(/\W+/g,'_')+'.json'; a.click(); };
  const importJSON=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{ try{ const p=JSON.parse(rd.result);
      // external analysis envelope (MIDAS-style; PS-Girder or steel-beam schema)? attach, don't replace inputs.
      if(p._schema==='psbeam-external-demands'||p._schema==='stgirder-external-demands'||p._schema==='steelbeam-external-demands'){
        const spans=externalSpans(p);
        const sel=spans[0]||{idx:1,x0:0,x1:(p.member&&p.member.totalLength)||inp.geom.L,len:inp.geom.L};
        const secNew=zonesToSec(p,sel,inp.sec);          // auto-populate plates from section.zones if present
        setInp({...inp, external:{...p,_selSpan:sel}, geom:{...inp.geom, L:sel.len}, ...(secNew?{sec:secNew}:{})});
        return;
      }
      setInp(mergeInputs(p)); }catch(err){alert('Invalid file: '+err.message);} }; rd.readAsText(f); };
  const uP=(k,v)=>setInp({...inp,proj:{...inp.proj,[k]:v}});
  /* Shared project info (HANDOFF.md §4.1): title block <-> shared fields. Girder ID is not a bridge ID, so it is not mapped. */
  const BX_MAP={projectName:'name',preparedBy:'by',date:'date',jobNo:'job'};
  const bxOwn=()=>{const o={};Object.keys(BX_MAP).forEach(k=>{o[k]=(inp.proj&&inp.proj[BX_MAP[k]])||'';});return o;};
  const bxShareProject=()=>{ if(window.BXProject) window.BXProject.share(bxOwn()); };
  const bxUseProject=()=>{ if(window.BXProject) window.BXProject.use(bxOwn(),upd=>{
    const pp={}; Object.keys(upd).forEach(k=>{pp[BX_MAP[k]]=upd[k];});
    setInp(p=>({...p,proj:{...p.proj,...pp}})); }); };
  /* superReactions hand-off (HANDOFF.md §4.4): send / export the unfactored end reactions of this girder line. */
  const bxSendRx=()=>{ if(window.BXSuperRx) window.BXSuperRx.send(()=>bxSuperRxPayload(inp,R),'ST-Girder','stgirder.html','stgirder'); else alert('The hand-off helper is not available in this browser.'); };
  const bxExportRx=()=>{ if(window.BXSuperRx) window.BXSuperRx.exportJSON(()=>bxSuperRxPayload(inp,R),'ST-Girder','stgirder.html'); else alert('The hand-off helper is not available in this browser.'); };

  const TABS=[['inputs','Inputs'],['section','Section Props'],['construct','Constructibility'],
    ['stresses','Stresses'],['flexure','Flexure'],['shear','Shear'],['diagrams','Diagrams'],
    ['camber','Camber'],['deck','Deck'],['fatigue','Fatigue'],['stiff','Stiffeners'],
    ['conn','Connectors'],['rating','Rating'],['optimize','Optimize'],['nomen','Nomenclature'],['report','Report']];
  const LIVE={inputs:1,section:1,construct:1,stresses:1,flexure:1,shear:1,diagrams:1,
    camber:1,deck:1,fatigue:1,stiff:1,conn:1,rating:1,optimize:1,nomen:1,report:1};
  const nPass=R.ok?R.checks.filter(c=>c.pass).length:0;

  return(<div className="sheet"><div className="sheet-inner">
    {handoff&&(handoff.version>HANDOFF_SUPPORTED_VERSION
      ? <div className="callout warn" style={{marginTop:14,marginBottom:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8}}>
            <b>⚠ Analysis output is newer than this app</b>
            <button className="btn sm ghost" onClick={dismissHandoff}>✕ dismiss</button></div>
          <div style={{fontSize:11.5,marginTop:4,lineHeight:1.6}}>The MCT Generator published schema <b>v{handoff.version}</b>; this ST-Girder build understands <b>v{HANDOFF_SUPPORTED_VERSION}</b>. Update ST-Girder to load it, or use JSON Import with a matching file.</div>
        </div>
      : <div className="callout" style={{marginTop:14,marginBottom:0,borderLeftColor:'#ea580c',background:'#fff7ed'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8}}>
            <b>New analysis data available</b>
            <button className="btn sm ghost" onClick={dismissHandoff}>✕ dismiss</button></div>
          <div style={{fontSize:11.5,marginTop:4,lineHeight:1.6}}>
            From <b>{handoff.payload.producer||'MCT Generator'}</b>{handoff.payload.project?' · '+handoff.payload.project:''}
            {handoff.payload.member&&handoff.payload.member.key?' · '+handoff.payload.member.key:''} · {handoff.payload.stations?handoff.payload.stations.length:0} stations · LL: <b>{handoff.payload.liveLoadType||'HL-93'}</b>
            {handoff.payload.section&&handoff.payload.section.zones&&handoff.payload.section.zones.length?' · plate geometry included':''}.
            Loading replaces the <b>imported demands</b> (and seeds plate geometry) — your materials and design settings stay.
            <div className="btnrow" style={{marginTop:8}}>
              <button className="btn sm pri" onClick={()=>adoptHandoff(handoff.payload)}>Load these demands</button>
              {BLU.LockToggle&&<BLU.LockToggle ch="demands" onToggle={()=>{
                // One click: take these demands and keep taking them.
                adoptHandoff(handoff.payload); toggleDemandsLock(true); }}/>}
              <button className="btn sm ghost" onClick={dismissHandoff}>Not now</button>
            </div>
          </div>
        </div>)}
    {geomChanges&&!demandsLocked&&(
      <div className="geom-change-banner" onClick={()=>setGeomModalOpen(true)}>
        Geometry has been updated in MCT – click to review what changed
      </div>
    )}
    {geomModalOpen&&geomChanges&&(
      <div className="geom-modal-overlay" onClick={()=>setGeomModalOpen(false)}>
        <div className="geom-modal" onClick={e=>e.stopPropagation()}>
          <h2>Geometry Changes from MCT</h2>
          <div className="geom-select-all" style={{display:'block',fontSize:12,lineHeight:1.65,color:'#57534e'}}>
            A record of what moved in the analysis model. The numbers themselves travel with the
            demands hand-off, not from here — re-send the demands from the MCT Generator, or lock
            the channel below and let every later change arrive on its own.
          </div>
          <div className="geom-modal-changes">
            {(geomChanges.changes||[]).map((change,i)=>(
              <div key={i} className="geom-change-item">
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:13}}>{change.field}</div>
                    {change.detail&&<div style={{fontSize:12,color:'#666',marginTop:2}}>{change.detail}</div>}
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  <div>
                    <div style={{fontSize:11,color:'#666',marginBottom:3}}>Current</div>
                    <div className="geom-old-val">{String(change.oldVal||'—')}</div>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:'#666',marginBottom:3}}>New</div>
                    <div className="geom-new-val">{String(change.newVal||'—')}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="geom-modal-buttons">
            <button className="geom-modal-btn cancel" onClick={skipGeometryChanges}>Dismiss</button>
            <button className="geom-modal-btn load" style={{background:'#ea580c',borderColor:'#ea580c'}}
              onClick={()=>{ skipGeometryChanges(); toggleDemandsLock(true); }}>
              🔒 Auto-update from the analysis model</button>
          </div>
        </div>
      </div>
    )}
    <div className="tblock">
      <div><h1>ST-Girder <span>/ AASHTO LRFD</span></h1>
        <div className="sub">BUILT-UP STEEL PLATE GIRDER DESIGN · STRENGTH · SERVICE II · CONSTRUCTIBILITY · FATIGUE</div></div>
      <div>
        <div className="tb-grid">
          {[['name','Project'],['girderId','Girder'],['by','By'],['date','Date'],['job','Job No.']].map(([k,l])=>
            <div className="tb-cell" key={k}><div className="lab">{l}</div>
            <input value={inp.proj[k]} onChange={e=>uP(k,e.target.value)}/></div>)}
          <div className="tb-cell"><div className="lab">Checks</div>
            <div style={{fontFamily:'var(--mono)',fontSize:12.5,fontWeight:600,
              color:R.ok?(nPass===R.checks.length?'var(--pass)':'var(--fail)'):'var(--fail)'}}>
              {R.ok?`${nPass}/${R.checks.length} PASS`:'ERR'}</div></div>
        </div>
        <div className="btnrow noprint" style={{marginTop:6,justifyContent:'flex-end',alignItems:'center'}}>
          <a className="bx-alltools" href="tools.html" target="_top" title="Open the list of all tools"
            style={{fontSize:10.5,fontFamily:'var(--mono)',color:'var(--ink2)',textDecoration:'none',marginRight:'auto'}}>← All tools</a>
          <button className="btn sm ghost" onClick={bxUseProject} title="Fill Project, By, Date and Job No. from the project info shared by another tool (asks first; never blanks a field)">Use shared project info</button>
          <button className="btn sm ghost" onClick={bxShareProject} title="Share this title block with the other tools">Share project info</button>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          <BeamChip nb={Math.max(2,Math.round(+(inp.geom&&inp.geom.nGirders)||0))||null} setBy="ST-Girder"/>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          {canSave
            ? <span style={{fontSize:10.5,color:'var(--ink2)',fontFamily:'var(--mono)',marginRight:2}}>✓ auto-saved</span>
            : <span style={{fontSize:10.5,color:'var(--ink2)',fontFamily:'var(--mono)',marginRight:2}}>⚠ session not saved here</span>}
          <button className="btn sm ghost" onClick={undo} disabled={!undoStack.current.length} style={!undoStack.current.length?{opacity:.4}:{}}>↶ Undo</button>
          <button className="btn sm ghost" onClick={redo} disabled={!redoStack.current.length} style={!redoStack.current.length?{opacity:.4}:{}}>↷ Redo</button>
          {canSave&&<React.Fragment>
            <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
            <span style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--ink2)',whiteSpace:'nowrap'}}
              title="The whole bridge is saved as one project, created and managed in the MCT app. ST-Girder autosaves its part into the active project — there is no separate ST-Girder save.">
              {activeName
                ? <span>◆ Project: <b style={{color:'var(--ink)'}}>{activeName}</b></span>
                : <span>◇ No active project — session autosaved</span>}
            </span>
            <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          </React.Fragment>}
          <button className="btn sm ghost" onClick={()=>bridgeNav(null)} title="Back to the MIDAS/MCT analysis app">↩ MCT Analysis</button>
          <button className="btn sm ghost" onClick={()=>bridgeNav('psbeam')} title="Open the prestressed concrete design app">PS-Beam ↗</button>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          <button className="btn sm ghost" onClick={bxSendRx} title="Send the unfactored DC1, DC2 and DW end reactions of this girder line (kip) to Bridge Substructure Loading">Send reactions to Substructure Loading</button>
          <button className="btn sm ghost" onClick={bxExportRx} title="Save the same reactions hand-off as a JSON file (for Import hand-off in Substructure Loading, or a calc package)">Export hand-off (JSON)</button>
          <span style={{width:1,height:20,background:'var(--line)',margin:'0 3px'}}></span>
          <button className="btn sm" onClick={exportJSON}>Export JSON</button>
          <button className="btn sm" onClick={()=>fileRef.current.click()}>Import</button>
          <button className="btn sm ghost" onClick={resetAll}>Reset</button>
          <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={importJSON}/>
        </div>
      </div>
    </div>

    <LockAutoSync inp={inp} set={setInp}/>
    {!R.ok?
      <div className="callout warn" style={{marginTop:14}}><b>Input error:</b> {R.error}. Check the plate dimensions.</div>
    :<React.Fragment>
      <div className="statusband noprint"><span className="chip head">Design status</span>
        {R.checks.map((c,i)=><span key={i} className={'chip '+(c.pass?'p':'f')} title={`${c.n}: ${fmt(c.v,2)} vs ${fmt(c.lim,2)} ${c.u} · ${c.ref}`}>{c.t||c.n} {fmt(c.r,2)}</span>)}
      </div>
      <div className="tabs noprint">{TABS.map(([k,l])=>
        <button key={k} className={'tab'+(tab===k?' on':'')+(LIVE[k]?'':' soon')} onClick={()=>setTab(k)}>{l}</button>)}</div>

      {tab==='inputs'?
        <div className="cols">
          <div><InputsTab inp={inp} set={setInp} R={R}/></div>
          <div className="gfx"><Card title="Live Geometry" refTag="auto-updates">
            <CrossSection R={R}/><Elevation R={R}/></Card></div>
        </div>
      :<div className="cols-full">
        {tab==='section'&&<SectionTab R={R}/>}
        {tab==='construct'&&<ConstructTab R={R}/>}
        {tab==='stresses'&&<StressTab R={R}/>}
        {tab==='flexure'&&<FlexTab R={R}/>}
        {tab==='shear'&&<ShearTab R={R}/>}
        {tab==='diagrams'&&<DiagramsTab R={R} inp={inp} set={setInp}/>}
        {tab==='camber'&&<CamberTab R={R}/>}
        {tab==='deck'&&<DeckTab R={R}/>}
        {tab==='fatigue'&&<FatigueTab R={R}/>}
        {tab==='stiff'&&<StiffTab R={R}/>}
        {tab==='conn'&&<ConnTab R={R}/>}
        {tab==='rating'&&<RatingTab R={R} onSendCapacity={publishCapacity} capLocked={capLocked} onToggleCapLock={toggleCapLock}/>}
        {tab==='optimize'&&<OptimizeTab R={R} inp={inp}/>}
        {tab==='nomen'&&<NomenclatureTab/>}
        {tab==='report'&&<ReportTab R={R}/>}
      </div>}
    </React.Fragment>}

    <div className="footer">
      <span>ST-GIRDER v1.2 (steelbeam schema · zones auto-import) · AASHTO LRFD BDS 10th Ed. · UNITS: KIP·IN·KSI</span>
      <span>DESIGN AID — INDEPENDENT VERIFICATION BY A LICENSED ENGINEER REQUIRED</span>
    </div>
  </div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
/* Floating cross-app sync drawer — shows every shared channel, which of them
   this browser is following, and the running log of automatic updates. It is
   deliberately outside the app's own layout because the state it reports is
   the suite's, not this page's. */
try{ if(window.BridgeLocks&&BridgeLocks.ok()) BridgeLocks.drawer({app:'stgirder'}); }catch(e){}
</script>
</body>
</html>
