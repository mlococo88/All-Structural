            v={inp.fatigue.lsMode||'auto'} set={v=>S('fatigue.lsMode',v)}/></div>
      </div>
      <div className="hint" style={{margin:'2px 0 8px'}}>AUTO picks Fatigue&nbsp;I (infinite life, γ=1.75) when (ADTT)<sub>SL</sub> is at or above the category crossover, else Fatigue&nbsp;II (finite life, γ=0.80). See the Fatigue tab for the full determination.</div>
      <div className="grouplabel">Fatigue — traffic &amp; cycles</div>
      <div className="frow">
        <Num l="ADTT (trucks/day)" v={inp.fatigue.ADTT} set={v=>S('fatigue.ADTT',v)} step={100}/>
        <div className="fld"><label>ADTT entered as</label>
          <Seg opts={[{v:true,l:'SINGLE-LANE'},{v:false,l:'GROSS (all lanes)'}]}
            v={inp.fatigue.adttIsSingleLane!==false} set={v=>S('fatigue.adttIsSingleLane',v)}/></div>
        {inp.fatigue.adttIsSingleLane===false && <div className="fld"><label>Lanes available to trucks → p</label>
          <Seg opts={[{v:1,l:'1  (p=1.00)'},{v:2,l:'2  (p=0.85)'},{v:3,l:'3+  (p=0.80)'}]}
            v={+inp.fatigue.lanes||2} set={v=>S('fatigue.lanes',v)}/></div>}
      </div>
      <div className="frow">
        <div className="fld"><label>Cycles per passage n (Table 6.6.1.2.5-2)</label>
          <div className="fwrap"><select value={+inp.fatigue.ncyc||1.0} onChange={e=>S('fatigue.ncyc',+e.target.value)}>
            <option value={1.0}>1.0 — simple span &gt; 40 ft; continuous away from support</option>
            <option value={1.5}>1.5 — continuous, near interior support &gt; 40 ft</option>
            <option value={2.0}>2.0 — any span ≤ 40 ft</option>
            <option value={5.0}>5.0 — cantilever girder</option>
          </select></div></div>
        <Num l="Fatigue design life (yr)" v={inp.fatigue.designLife||75} set={v=>S('fatigue.designLife',v)} step={5}/>
      </div>
      <div className="hint" style={{margin:'2px 0 0'}}>{(+inp.loads.fatM>0)?<span>A single-lane fatigue distribution factor <b>{fmt(+inp.loads.fatM,3)}</b> is pulled from the LL &amp; DL Distribution app and will be used for the stress range. Clear it on the Loads card to fall back to the DF÷1.2 estimate.</span>:<span>The single-lane fatigue distribution factor is estimated as (1-lane moment DF)÷1.2 (removes multiple presence). Pull an exact value from the LL &amp; DL Distribution app if desired.</span>}</div>
    </Card>
  </div>);
}

function SectionTab({R}){
  if(!R.ok) return null;
  const {sec,matR,deck,bare,cN,c3N,pl,n,nRaw,EcDeck,beff,compact,compactWeb,
    compactMat,compactDtw,lambdaPw,Rh,Rb,ductOK,Iyc,Iyt,IycIyt}=R;
  const msDims=(R.segP.find(g=>R.geom.L/2<=g.x1+1e-9)||R.segP[0]).dims;   // midspan-segment flange plates
  const propRow=(lab,p,tr)=>({c:[lab,fmt(p.A,1),fmt(p.ybar,2),fmt(p.I,0),fmt(p.Sb,0),fmt(p.StSteel,0), tr||'—']});
  return (<div>
    <div className="bigres">
      <div className="br"><div className="l">Plastic moment Mp</div><div className="n">{fmt(pl.Mp/12,0)}</div><div className="u">kip-ft · PNA in {pl.region}</div></div>
      <div className={'br '+(compact?'p':'')}><div className="l">Web classification</div><div className="n" style={{fontSize:16}}>{compact?'COMPACT':'NONCOMPACT'}</div><div className="u">2Dcp/tw vs {fmt(lambdaPw,1)}</div></div>
      <div className={'br '+(ductOK?'p':'f')}><div className="l">Ductility Dp ≤ 0.42Dt</div><div className="n">{fmt(pl.Dp/pl.Dt,3)}</div><div className="u">{fmt(pl.Dp,1)} / {fmt(0.42*pl.Dt,1)} in</div></div>
    </div>

    <Card title="Elastic section properties" refTag="bare · short-term n · long-term 3n">
      <Tbl head={['Section','A (in²)','ȳ from bot (in)','I (in⁴)','S_bot (in³)','S_top,st (in³)','Deck S_tr']}
        rows={[
          propRow('Bare steel (noncomposite)',bare),
          propRow(`Short-term composite (n=${n})`,cN, cN.StDeckTr?fmt(cN.StDeckTr,0):'—'),
          propRow(`Long-term composite (3n=${3*n})`,c3N, c3N.StDeckTr?fmt(c3N.StDeckTr,0):'—'),
        ]}/>
      <div className="hint">Bare-steel props resist noncomposite dead load (DC1: self-weight + wet deck).
        Long-term composite (3n) carries permanent SIDL (DC2 + DW); short-term composite (n) carries live load.
        b_eff = <b>{fmt(beff,1)} in</b>. n = Es/Ec = {fmt(nRaw,2)} → <b>{n}</b> (rounded, 6.10.1.1.1b); Ec = {fmt(EcDeck,0)} ksi.</div>
    </Card>

    <Deriv title="Derivation — composite transformed section (short-term, n)" refTag="LRFD 4.6.2.6 · 6.10.1.1.1b">
      <VarTable title="Variables — section & materials (midspan segment)" rows={[
        ['D','Web depth',sec.D,'in'],['t_w','Web thickness',sec.tw,'in'],
        ['b_ft','Top (compression) flange width',msDims.bft,'in'],['t_ft','Top flange thickness',msDims.tft,'in'],
        ['b_fb','Bottom (tension) flange width',msDims.bfb,'in'],['t_fb','Bottom flange thickness',msDims.tfb,'in'],
        ['F_y','Steel yield (flange/web)',matR.Fyf,'ksi'],
        ['t_s','Structural deck thickness',deck.ts,'in'],["f'_c",'Deck concrete strength',deck.fc,'ksi'],
        ['E_s','Steel modulus',matR.Es,'ksi'],['E_c','Deck concrete modulus',EcDeck,'ksi'],
        ['b_eff','Effective deck width',beff,'in'],
        ['n','Modular ratio E_s/E_c (rounded, min 6)',n,'—'],
      ]}/>
      <Step d="Modular ratio" r="6.10.1.1.1b">
        <ML s={Tx`n=\frac{E_s}{E_c}=\frac{${nx(matR.Es,0)}}{${nx(EcDeck,0)}}=${nx(nRaw,2)}\;\rightarrow\;${n}\;(\text{rounded, }\ge 6)`}/>
      </Step>
      <Step d="Transformed deck & section properties" r="transformed-area method">
        <ML s={Tx`b_{tr}=\frac{b_{eff}}{n}=\frac{${nx(beff,1)}}{${n}}=${nx(beff/n,1)}\;\text{in}\qquad A_{deck,tr}=\frac{b_{eff}\,t_s}{n}=${nx(beff*deck.ts/n,1)}\;\text{in}^2`}/>
        <ML s={Tx`\bar y=${nx(cN.ybar,2)}\;\text{in (from bottom)}\qquad I=${nx(cN.I,0)}\;\text{in}^4\qquad D_c=${nx(cN.Dc,1)}\;\text{in (web in comp.)}`}/>
        <ML s={Tx`S_{bot}=\frac{I}{\bar y}=${nx(cN.Sb,0)}\quad S_{top,st}=\frac{I}{h-\bar y}=${nx(cN.StSteel,0)}\;\text{in}^3`}/>
        <div className="mnote">The long-term (3n) section uses 3n in place of n to account for concrete creep under sustained SIDL; DC1 acts on the bare steel section before the deck cures.</div>
      </Step>
    </Deriv>

    <Deriv title="Derivation — plastic moment Mₚ & PNA" refTag="AASHTO Appendix D6.1 (positive flexure)">
      <VarTable title="Plastic forces (positive flexure, deck reinforcement neglected)" rows={[
        ['P_s','Deck slab compression 0.85f′_c·b_eff·t_s',pl.Ps,'kip'],
        ['P_c','Top-flange force F_yc·b_ft·t_ft',pl.Pc,'kip'],
        ['P_w','Web force F_yw·D·t_w',pl.Pw,'kip'],
        ['P_t','Bottom-flange force F_yt·b_fb·t_fb',pl.Pt,'kip'],
        ['D_p','Depth of PNA below top of slab',pl.Dp,'in'],
        ['D_t','Total depth (slab top to bottom flange)',pl.Dt,'in'],
      ]}/>
      <Step d="Plastic forces">
        <ML s={Tx`P_s=0.85f'_c\,b_{eff}\,t_s=${nx(pl.Ps,0)}\;\text{kip}\qquad P_c=F_{yc}b_{ft}t_{ft}=${nx(pl.Pc,0)}\;\text{kip}`}/>
        <ML s={Tx`P_w=F_{yw}D\,t_w=${nx(pl.Pw,0)}\;\text{kip}\qquad P_t=F_{yt}b_{fb}t_{fb}=${nx(pl.Pt,0)}\;\text{kip}`}/>
      </Step>
      <Step d="Locate PNA by plastic force balance" r="D6.1">
        <ML s={Tx`\text{PNA lies in the }\textbf{${pl.region}}\;\Rightarrow\;\bar y_{PNA}=${nx(pl.PNA,2)}\;\text{in below top of slab}`}/>
        <ML s={Tx`M_p=\sum P_i\,d_i=${nx(pl.Mp/12,0)}\;\text{kip-ft}\qquad D_p/D_t=${nx(pl.Dp/pl.Dt,3)}`}/>
        <div className="mnote">The PNA is where the plastic compression above equals the plastic tension below. M_p is the sum of each plastic force times its distance to the PNA. Deck reinforcement is neglected in the positive-flexure M_p (conservative). D_p/D_t drives the ductility term in the Flexure tab.</div>
      </Step>
    </Deriv>

    <Deriv title="Classification & stability factors" refTag="6.10.1.10 · 6.10.6.2.2">
      <VarTable title="Web classification & stability" rows={[
        ['D/t_w','Web slenderness',sec.D/sec.tw,'≤ 150'],
        ['2D_cp/t_w','Web slenderness in plastic compression',2*pl.Dcp/sec.tw,'vs λ_pw'],
        ['λ_pw','Compact-web limit 3.76√(E/F_yc)',lambdaPw,'—'],
        ['F_yf','Flange yield (compact needs ≤ 70)',matR.Fyf,'ksi'],
        ['R_h','Hybrid factor (6.10.1.10.1)',Rh,'—'],
        ['R_b','Load-shedding factor (6.10.1.10.2)',Rb,'—'],
        ['I_yc/I_yt','Flange inertia ratio (0.1–10)',IycIyt,'—'],
        ['D_c','Web depth in compression (elastic, n)',cN.Dc,'in'],
      ]}/>
      <Step d="Web compactness" r="6.10.6.2.2">
        <ML s={Tx`\frac{2D_{cp}}{t_w}=${nx(2*pl.Dcp/sec.tw,1)}\;${compactWeb?'\\le':'>'}\;\lambda_{pw}=3.76\sqrt{E/F_{yc}}=${nx(lambdaPw,1)}\;\Rightarrow\;\text{${compactWeb?'compact':'noncompact'} web}`}/>
        <ML s={Tx`\frac{D}{t_w}=${nx(sec.D/sec.tw,1)}\;${compactDtw?'\\le':'>'}\;150\qquad F_{yf}=${nx(matR.Fyf,0)}\;${compactMat?'\\le':'>'}\;70\;\text{ksi}`}/>
        <div className="mnote">A section is <b>compact</b> (Mp-based positive-flexure capacity) only if the web is compact, F_yf ≤ 70 ksi, D/t_w ≤ 150, and the deck is composite — otherwise the noncompact stress-based check governs (see Flexure tab). Overall: <b>{compact?'COMPACT':'NONCOMPACT'}</b>.</div>
      </Step>
      <Step d="Hybrid & load-shedding factors" r="6.10.1.10">
        <ML s={Tx`R_h=${nx(Rh,3)}\;(\text{${Rh>=0.999?'non-hybrid':'hybrid'}})\qquad R_b=${nx(Rb,3)}\;(\text{${Rb>=0.999?'no web load-shedding':'web load-shedding active'}})`}/>
        <div className="mnote">R_h reduces flange resistance when the web yields before the flange (hybrid girders). R_b sheds load from a slender web in compression to the flanges. Both = 1.0 here when the web is compact and non-hybrid.</div>
      </Step>
    </Deriv>

    {R.segP.length>1&&<Card title="Flange segments" refTag="plate transitions · per-segment properties">
      <Tbl head={['Seg','x (ft)','Top flange','Bot flange','I bare (in⁴)','I comp n (in⁴)','Mp (k-ft)','Class']}
        rows={R.segP.map(g=>({c:[g.i+1, fmt(g.x0,0)+'–'+fmt(g.x1,0),
          fmt(g.dims.bft,1)+'×'+fmt(g.dims.tft,3), fmt(g.dims.bfb,1)+'×'+fmt(g.dims.tfb,3),
          fmt(g.bare.I,0), fmt(g.cN.I,0), fmt(g.pl.Mp/12,0), g.compact?'compact':'noncompact']}))}/>
      <div className="hint">Web {fmt(R.sec.D,0)}×{fmt(R.sec.tw,3)} constant. All checks run station-by-station across the segments; the drawings and the summary cards above show the <b>midspan</b> segment.</div>
    </Card>}
    {R.hasNeg&&R.neg&&<Card title="Cracked negative-moment section (pier)" refTag="steel + deck rebar · concrete neglected">
      <KV rows={[['Rebar As (in beff)',fmt(R.neg.AsProv,2),'in²'],
        ['I cracked',fmt(R.neg.cr.I,0),'in⁴'],['ȳ from bottom',fmt(R.neg.cr.ybar,2),'in'],
        ['S bot (comp. flange)',fmt(R.neg.cr.Sb,0),'in³'],['S top steel',fmt(R.neg.cr.St,0),'in³'],
        ['Dc web compression (−M)',fmt(R.neg.cr.DcNeg,1),'in'],
        ['Min 1% deck reinf',fmt(R.neg.AsMin1pct,2),'in² '+(R.neg.rebarOK?'✓ provided':'✗ short')]]}/>
    </Card>}
    <Card title="Section proportion limits" refTag="AASHTO 6.10.2 · worst segment governs">
      <Tbl head={['Check','Value','Limit','D/C','Status']}
        rows={R.checks.filter(c=>c.ref&&c.ref.indexOf('6.10.2')===0).map(c=>({c:[c.n,fmt(c.v,2),fmt(c.lim,2),fmt(c.r,2),PF(c.pass)]}))}/>
    </Card>
  </div>);
}

function StressTab({R}){
  if(!R.ok) return null;
  const st=R.stress;
  const row=(lab,f)=>({c:[lab,fmt(f.dc1,2),fmt(f.sid,2),fmt(f.ll,2),{v:fmt(f.serv2,2),cls:f.serv2<=st.fServLim?'ok':'no'}]});
  const topPass=st.fTop.serv2<=st.fServLim, botPass=st.fBot.serv2<=st.fServLim, defPass=st.dLL<=st.dLim;
  // ── along-span chart data (captured per station in computeAll) ──
  const ch=R.chartS2||[], cx=ch.map(p=>p.x);
  const [ov,setOv]=useState({bot:true,top:true,neg:!!R.hasNeg,lims:true});
  const OVS=[['bot','Bottom flange'],['top','Top flange'],...(R.hasNeg?[['neg','−LL branch']]:[]),['lims','Limits']];
  // ── stage-buildup location picker ──
  const Lspan=R.geom.L, govX=st.s2Gov?st.s2Gov.x:Lspan/2;
  const defIdx=ch.length? ch.reduce((bi,p,i,a)=>Math.abs(p.x-govX)<Math.abs(a[bi].x-govX)?i:bi,0):0;
  const [selIdx,setSelIdx]=useState(defIdx);
  const psel=ch.length? ch[Math.min(selIdx,ch.length-1)] : null;
  const stnLabel=(p,i)=>{ const x=p.x, t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    if(Math.abs(x-govX)<0.06) t.push('governing');
    return 'x = '+x.toFixed(1)+' ft'+(t.length?'  ·  '+t.join(', '):''); };
  return (<div>
    <div className="bigres">
      <div className={'br '+(botPass?'p':'f')}><div className="l">Service II — bottom flange</div><div className="n">{fmt(st.fBot.serv2,1)}</div><div className="u">ksi vs {fmt(st.fServLim,1)} · {fmt(st.s2Coef,2)}RhFyf</div></div>
      <div className={'br '+(topPass?'p':'f')}><div className="l">Service II — top flange</div><div className="n">{fmt(st.fTop.serv2,1)}</div><div className="u">ksi vs {fmt(st.fServLim,1)}</div></div>
      <div className={'br '+(defPass?'p':'f')}><div className="l">LL deflection</div><div className="n">{fmt(st.dLL,2)}</div><div className="u">in vs L/800 = {fmt(st.dLim,2)}</div></div>
    </div>

    <Card title="What Service II checks" refTag="AASHTO 6.10.4.2.2 · permanent-deformation control">
      <div className="hint">Service II limits the flexural stress under <b>DC + DW + 1.30(LL+IM)</b> to <b>{fmt(st.s2Coef,2)} R_h F_yf</b> to prevent objectionable permanent deflection from occasional heavy overloads. The coefficient is <b>0.95</b> for the flanges of a composite section and <b>0.80</b> for both flanges of a noncomposite one. Stresses <b>accumulate by construction stage</b> on the section active at each stage: DC1 (self-weight + wet deck) on the bare steel, DC2 + DW on the long-term (3n) composite, and live load on the short-term (n) composite. The picker below shows the full stage buildup at any station.</div>
    </Card>

    {psel&&<Deriv title="Service II stress buildup at a selected location"
      refTag="stage-by-stage · bottom (tension) flange"
      right={<select value={selIdx} onChange={e=>setSelIdx(+e.target.value)}
        style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:250}}>
        {ch.map((p,i)=><option key={i} value={i}>{stnLabel(p,i)}</option>)}
      </select>}>
      <VarTable title="Stage moments & section moduli at this station" rows={[
        ['x','Location',psel.x,'ft'],
        ['M_DC1','Self-weight + wet deck (bare)',psel.M1,'k-ft'],
        ['M_DC2','Superimposed DL — barrier (3n)',psel.M2,'k-ft'],
        ['M_DW','Wearing surface (3n)',psel.Mw,'k-ft'],
        ['M_LL','+LL+IM envelope (n)',psel.Ml,'k-ft'],
        ['S_b(bare)','Bottom modulus, bare steel',psel.SbBare,'in³'],
        ['S_b(3n)','Bottom modulus, long-term composite',psel.Sb3n,'in³'],
        ['S_b(n)','Bottom modulus, short-term composite',psel.Sbn,'in³'],
        [st.s2CoefLabel,'Service II stress limit',psel.lim,'ksi'],
      ]}/>
      <SG n="1">Stage stresses at the bottom flange (each on its stage-correct section)</SG>
      <ML s={Tx`f_{DC1}=\frac{M_{DC1}\cdot12}{S_{b,bare}}=\frac{${nx(psel.M1,0)}\cdot12}{${nx(psel.SbBare,0)}}=${nx(psel.dc1Bp,2)}\;\text{ksi}`}/>
      <ML s={Tx`f_{DC2}=\frac{M_{DC2}\cdot12}{S_{b,3n}}=${nx(psel.d2Bp,2)}\;\text{ksi}\qquad f_{DW}=\frac{M_{DW}\cdot12}{S_{b,3n}}=${nx(psel.dwBp,2)}\;\text{ksi}`}/>
      <ML s={Tx`f_{LL}=1.30\cdot\frac{M_{LL}\cdot12}{S_{b,n}}=${nx(psel.llBp,2)}\;\text{ksi}`}/>
      <SG n="2">Service II combination & check</SG>
      <ML s={Tx`f_{ServII}=f_{DC1}+f_{DC2}+f_{DW}+f_{LL}=${nx(psel.dc1Bp,2)}+${nx(psel.d2Bp,2)}+${nx(psel.dwBp,2)}+${nx(psel.llBp,2)}=${nx(psel.bP,2)}\;\text{ksi}`}/>
      <ML s={Tx`\frac{f_{ServII}}{0.95R_hF_yf}=\frac{${nx(Math.abs(psel.bP),2)}}{${nx(psel.lim,2)}}=${nx(Math.abs(psel.bP)/psel.lim,3)}\;${Math.abs(psel.bP)<=psel.lim*1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Top-flange Service II Σ at this station = {fmt(psel.tP,2)} ksi (compression). Sign convention: f_B + = bottom tension, f_T + = top compression. R_h = {fmt(psel.Rh,3)}. Flange lateral bending f_ℓ = 0 (straight girder).{R.hasNeg?' In −M regions the bottom-flange stress uses the cracked steel+rebar section (S_b,cr = '+fmt(psel.SbCr,0)+' in³).':''}</div>
    </Deriv>}
    <Card title="Service II Flange Stresses Along the Span" refTag={'6.10.4.2.2 · limit '+fmt(st.s2Coef,2)+'RhFyf (steps at splices)'}>
      <Fig h={360} data={[
        {x:cx,y:ch.map(p=>p.bP),name:'bottom flange (+LL)',line:{color:'#C2271D',width:2.2}},
        {x:cx,y:ch.map(p=>p.tP),name:'top flange (+LL)',line:{color:'#1C4FC4',width:2.2}},
        ...(R.hasNeg?[
          {x:cx,y:ch.map(p=>p.bN),name:'bottom flange (−LL)',line:{color:'#C2271D',width:1.6,dash:'dash'}},
          {x:cx,y:ch.map(p=>p.tN),name:'top flange (−LL)',line:{color:'#1C4FC4',width:1.6,dash:'dash'}}]:[]),
        {x:cx,y:ch.map(p=>p.lim),name:'+'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}},
        {x:cx,y:ch.map(p=>-p.lim),name:'−'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}}]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'stress (ksi · fB + = bottom tension, fT + = top compression)'}}}/>
      <div className="callout">Service II = DC + DW + 1.30(LL+IM), accumulated on the stage-correct sections (DC1 on bare steel, DC2+DW on 3n, LL on n{R.hasNeg?'; −M regions on the cracked steel+rebar section':''}). Both flanges are limited to ±{fmt(st.s2Coef,2)}R<sub>h</sub>F<sub>yf</sub>{st.s2Composite?' (composite section)':' — the 0.80 coefficient applies because the deck is not acting compositely with the steel'}; the limit line steps where R<sub>h</sub> changes at a flange splice. Governing: <b>{fmt(Math.abs(st.s2Gov.f||0),1)} ksi</b> ({st.s2Gov.tag}) at <b>{fmt(st.s2Gov.x||0,1)} ft</b>.</div>
    </Card>
    <Card title="Stage Buildup — Overlay" refTag="toggle curves · cumulative by construction stage">
      <div className="btnrow" style={{marginBottom:6}}>{OVS.map(([k,l])=>
        <button key={k} className={'btn sm'+(ov[k]?'':' ghost')} onClick={()=>setOv({...ov,[k]:!ov[k]})}>{ov[k]?'☑':'☐'} {l}</button>)}</div>
      <Fig h={380} data={[
        ...(ov.bot?[
          {x:cx,y:ch.map(p=>p.dc1B),name:'bot · DC1 (bare)',line:{color:'#B45309',width:1.8}},
          {x:cx,y:ch.map(p=>p.dc1B+p.sidlB),name:'bot · +DC2+DW (3n)',line:{color:'#0E7490',width:1.8}},
          {x:cx,y:ch.map(p=>p.bP),name:'bot · Service II Σ',line:{color:'#C2271D',width:2.4}}]:[]),
        ...(ov.top?[
          {x:cx,y:ch.map(p=>p.dc1T),name:'top · DC1 (bare)',line:{color:'#D97706',width:1.6,dash:'dot'}},
          {x:cx,y:ch.map(p=>p.dc1T+p.sidlT),name:'top · +DC2+DW (3n)',line:{color:'#0891B2',width:1.6,dash:'dot'}},
          {x:cx,y:ch.map(p=>p.tP),name:'top · Service II Σ',line:{color:'#1C4FC4',width:2.2,dash:'dot'}}]:[]),
        ...(ov.neg&&R.hasNeg?[
          {x:cx,y:ch.map(p=>p.bN),name:'bot · Service II (−LL)',line:{color:'#7C3AED',width:1.8,dash:'dash'}},
          {x:cx,y:ch.map(p=>p.tN),name:'top · Service II (−LL)',line:{color:'#9333EA',width:1.6,dash:'dashdot'}}]:[]),
        ...(ov.lims?[
          {x:cx,y:ch.map(p=>p.lim),name:'+'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}},
          {x:cx,y:ch.map(p=>-p.lim),name:'−'+fmt(st.s2Coef,2)+'RhFyf',line:{color:'#B3261E',width:1.4,dash:'dot'}}]:[])]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'stress (ksi)'}}}/>
      <div className="hint">Each curve adds one stage: DC1 locked into the bare girder before the deck cures, then superimposed dead load on the long-term composite, then 1.30(LL+IM) on the short-term composite. The gap between the Σ curve and the limit is the Service II reserve at every station.</div>
    </Card>
    <Card title="Flange stresses by construction stage" refTag="6.10.4.2.2 · Service II @ midspan">
      <Tbl head={['Steel flange','DC1 (bare)','DC2+DW (3n)','LL+IM (n)','Service II Σ']}
        rows={[row('Top flange (comp.)',st.fTop),row('Bottom flange (tens.)',st.fBot)]}/>
      <div className="hint">Stress accumulates on the section active at each stage: <b>DC1</b> (self-weight + wet deck) on bare steel, <b>DC2 + DW</b> on the long-term (3n) composite, <b>LL+IM</b> on the short-term (n) composite. Service II factors live load by <b>1.30</b> (Table 3.4.1-1). Both flanges are limited to <b>{fmt(st.s2Coef,2)} R_h F_yf = {fmt(st.fServLim,1)} ksi</b> — 0.95 for a composite section, 0.80 for both flanges of a noncomposite one (6.10.4.2.2){st.s2Composite?'':', which is the case here because the deck is switched off'}. The bottom (tension) flange, farthest from the high composite neutral axis, typically governs. Flange lateral bending f_ℓ is taken as 0 for this straight girder (the check adds f_ℓ/2 to the bottom flange when present).</div>
    </Card>
    <Card title="Live-load deflection" refTag="2.5.2.6.2 (optional)">
      <div className="hint">Δ_truck(incl. IM) = <b>{fmt(st.dTruck,3)} in</b> · Δ_lane = <b>{fmt(st.dLane,3)} in</b> · deflection DF (all lanes ÷ girders) = <b>{fmt(st.dfDefl,3)}</b> → Δ_LL = <b>{fmt(st.dLL,3)} in</b> vs L/800 = <b>{fmt(st.dLim,3)} in</b> ({defPass?'OK':'N.G.'}). Optional criterion; taken as the larger of the design truck alone or 25% truck + lane, on the short-term composite I = {fmt(R.cN.I,0)} in⁴.</div>
    </Card>
  </div>);
}

function DiagramsTab({R,inp,set}){
  if(!R.ok) return null;
  const d=R.diag, xs=d.map(p=>p.x);
  // ── Span selector for imported (multi-span) demands: view any span or the whole beam ──
  const ext=inp&&inp.external;
  const extActive=ext&&(ext._schema==='psbeam-external-demands'||ext._schema==='stgirder-external-demands'||ext._schema==='steelbeam-external-demands')&&Array.isArray(ext.stations)&&ext.stations.length>0;
  const allSpans=extActive?externalSpans(ext):[];
  const memberLen=extActive?((ext.member&&ext.member.totalLength)||Math.max(...ext.stations.map(s=>+s.x||0))):R.geom.L;
  const multiSpan=allSpans.length>1;
  const [spanView,setSpanView]=useState(()=>{ try{ return loadUI().diagSpanView||'design'; }catch(e){ return 'design'; } });
  useEffect(()=>{ try{ saveUI({diagSpanView:spanView}); }catch(e){} },[spanView]);
  const vr=spanView==='all'?{x0:0,x1:memberLen,label:'Entire beam'}
    :(spanView!=='design'?(()=>{const sp=allSpans.find(s=>('s'+s.idx)===spanView);return sp?{x0:sp.x0,x1:sp.x1,label:'Span '+sp.idx,sp}:null;})():null);
  const designThisSpan=sp=>{ if(set){ const secNew=zonesToSec(ext,sp,inp.sec); set({...inp, external:{...ext,_selSpan:sp}, geom:{...inp.geom,L:sp.len}, ...(secNew?{sec:secNew}:{})}); } setSpanView('design'); };
  const vrows=(x0,x1)=>ext.stations.filter(s=>(+s.x)>=x0-1e-6&&(+s.x)<=x1+1e-6).sort((a,b)=>a.x-b.x).map(s=>{
    const a=k=>+s[k]||0; const m1=a('M_DC1'),m2=a('M_DC2'),mw=a('M_DW'),mlp=a('M_LLpos'),mln=a('M_LLneg');
    const v1=a('V_DC1'),v2=a('V_DC2'),vw=a('V_DW'),vlp=a('V_LLpos'),vln=a('V_LLneg');
    return {x:+s.x,M1:m1,M2:m2,Mw:mw,Mlp:mlp,Mln:mln,
      Mup:1.25*(m1+m2)+1.5*mw+1.75*mlp,Mun:1.25*(m1+m2)+1.5*mw+1.75*mln,
      V1:v1,V2:v2,Vw:vw,Vlp:vlp,Vln:vln,
      Vup:1.25*(v1+v2)+1.5*vw+1.75*vlp};});
  const lnR=(rows,k,name,color,dash)=>({x:rows.map(r=>r.x),y:rows.map(r=>r[k]||0),name,mode:'lines',line:{color,width:2,dash:dash||'solid'}});
  const ln=(k,name,color,dash)=>({x:xs,y:d.map(p=>p[k]),name,mode:'lines',line:{color,width:2,dash:dash||'solid'}});
  const mData=[ln('M1','DC1','#15803D'),ln('M2','DC2','#0E7490'),ln('Mw','DW','#B45309'),
    ln('Ml','+LL+IM','#B3261E'),ln('Mu','Strength I +Mu','#1C4FC4','dot')];
  if(R.hasNeg){ mData.push(ln('Mln','−LL+IM','#B3261E','dash')); mData.push(ln('Mun','Strength I −Mu','#1C4FC4','dashdot')); }
  return (<div>
    {extActive&&multiSpan&&<div className="callout" style={{marginTop:0,marginBottom:12,borderColor:'var(--blue)',background:'#EEF4FF',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <b>View span:</b>
      <select value={spanView} onChange={e=>setSpanView(e.target.value)} style={{fontSize:12,fontFamily:'inherit',border:'1px solid var(--line)',borderRadius:4,padding:'3px 6px'}}>
        <option value="design">Design span — Span {R.ext.sel.idx} ({fmt(R.ext.spanLen,0)} ft)</option>
        {allSpans.map(sp=><option key={sp.idx} value={'s'+sp.idx}>Span {sp.idx} ({fmt(sp.x0,0)}–{fmt(sp.x1,0)} ft){R.ext.sel.idx===sp.idx?' • current':''}</option>)}
        <option value="all">Entire beam (0–{fmt(memberLen,0)} ft)</option>
      </select>
      {vr&&vr.sp&&R.ext.sel.idx!==vr.sp.idx&&<button className="btn sm" onClick={()=>designThisSpan(vr.sp)}>Design Span {vr.sp.idx} →</button>}
      <span style={{fontSize:11,color:'var(--ink2)'}}>Design &amp; checks stay on Span {R.ext.sel.idx}.</span>
    </div>}
    {spanView!=='design'&&vr? (()=>{ const rows=vrows(vr.x0,vr.x1);
      const md=[lnR(rows,'M1','DC1','#15803D'),lnR(rows,'M2','DC2','#0E7490'),lnR(rows,'Mw','DW','#B45309'),lnR(rows,'Mlp','+LL env','#B3261E'),lnR(rows,'Mln','−LL env','#7C3AED'),lnR(rows,'Mup','Strength I +','#1C4FC4','dot'),lnR(rows,'Mun','Strength I −','#1C4FC4','dashdot')];
      const vd=[lnR(rows,'V1','DC1','#15803D'),lnR(rows,'V2','DC2','#0E7490'),lnR(rows,'Vw','DW','#B45309'),lnR(rows,'Vlp','+LL env','#B3261E'),lnR(rows,'Vln','−LL env','#7C3AED'),lnR(rows,'Vup','Strength I','#1C4FC4','dot')];
      return <React.Fragment>
        <Card title={'Moment envelope — '+vr.label} refTag="imported demands · k-ft">
          <Fig h={360} data={md} layout={{yaxis:{title:'M (k-ft)'},xaxis:{title:'x (ft, member)'}}}/></Card>
        <Card title={'Shear envelope — '+vr.label} refTag="imported demands · kip">
          <Fig h={340} data={vd} layout={{yaxis:{title:'V (kip)'},xaxis:{title:'x (ft, member)'}}}/></Card>
        <div className="callout">Strength I = 1.25(DC1+DC2)+1.50 DW+1.75 LL from the imported per-station envelope over {vr.label.toLowerCase()} (member coordinates). Switch back to <b>Design span</b> for the full design envelopes, or use <b>Design Span n</b> to move the analysis there.</div>
      </React.Fragment>; })()
    :<React.Fragment>
    <Card title="Moment envelope" refTag={'per girder · k-ft'+(R.useExt?' · imported demands':'')}>
      <Fig h={340} data={mData} layout={{yaxis:{title:'M (k-ft)'},xaxis:{title:'x (ft)'}}}/>
    </Card>
    <Card title="Shear envelope" refTag="per girder · kip">
      <Fig h={320} data={[ln('V1','DC1','#15803D'),ln('V2','DC2','#0E7490'),ln('Vw','DW','#B45309'),
        ln('Vl','LL+IM','#B3261E'),ln('Vu','Strength I Vu','#1C4FC4','dot')]}
        layout={{yaxis:{title:'V (kip)'},xaxis:{title:'x (ft)'}}}/>
    </Card>
    <div className="callout">Strength I = 1.25 DC + 1.50 DW + 1.75 (LL+IM). Peak +M_u = <b>{fmt(Math.max(...d.map(p=>p.Mu)),0)} k-ft</b>{R.hasNeg&&<span> · peak −M_u = <b>{fmt(Math.min(...d.map(p=>p.Mun)),0)} k-ft</b></span>} · peak V_u = <b>{fmt(Math.max(...d.map(p=>p.Vu)),0)} kip</b>. {R.useExt?'Demands from the imported continuous envelope (impact included; per-effect DF × m applied).':'Live-load envelopes are HL-93 (1.33× truck/tandem + lane) × distribution factor.'} Station spacing includes every flange-transition point, so the governing section is always sampled.</div>
    </React.Fragment>}
  </div>);
}

function FlexTab({R}){
  if(!R.ok) return null;
  const f=R.flex, pl=R.pl, pass=f.flexDC<=1.0001, dPass=f.ductOK;
  // ── moment breakdown vs capacity (per-station capacity from computeAll) ──
  const stns=R.stations, cf=R.chartFlex||[], fx=stns.map(p=>p.x);
  const [fac,setFac]=useState(false);
  const k1=fac?1.25:1, kw=fac?1.5:1, kl=fac?1.75:1;
  // ── location picker: per-station worked capacity calculation ──
  const fcAll=R.flexCalc||[], nSeg=(R.segP||[]).length, Lspan=R.geom.L;
  const govX=(f.gov&&f.gov.x)||0;
  const defIdx=fcAll.length? fcAll.reduce((bi,fc,i,a)=>Math.abs(fc.x-govX)<Math.abs(a[bi].x-govX)?i:bi,0):0;
  const [selIdx,setSelIdx]=useState(defIdx);
  const fcSel=fcAll.length? fcAll[Math.min(selIdx,fcAll.length-1)] : null;
  const stnLabel=(fc,i,a)=>{ const x=fc.x; const t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    if(i>0 && a[i-1].si!==fc.si) t.push('flange transition');
    return 'x = '+x.toFixed(1)+' ft'+(t.length?'  ·  '+t.join(', '):''); };
  const Fyc=R.matR.Fyc, Fyf=R.matR.Fyf;
  const renderPos=(p)=>{
    if(p.compact) return <React.Fragment>
      <ML s={Tx`M_p=${nx(p.Mp,0)}\;\text{k-ft}\quad(\text{PNA in the ${p.region}})`}/>
      {p.ductRed
        ? <ML s={Tx`M_n=M_p\!\left(1.07-0.7\tfrac{D_p}{D_t}\right)=${nx(p.Mp,0)}\!\left(1.07-0.7\tfrac{${nx(p.Dp,1)}}{${nx(p.Dt,1)}}\right)=${nx(p.Mn,0)}\;\text{k-ft}`}/>
        : <ML s={Tx`D_p=${nx(p.Dp,2)}\le 0.1D_t=${nx(0.1*p.Dt,2)}\;\Rightarrow\;M_n=M_p=${nx(p.Mn,0)}\;\text{k-ft}`}/>}
      {p.my13&&<ML s={Tx`M_y=${nx(p.my13.MD1,0)}+${nx(p.my13.MD2,0)}+\min(${nx(p.my13.MADb,0)},${nx(p.my13.MADt,0)})=${nx(p.my13.My,0)}\;\text{k-ft}\qquad M_n=\min(${nx(p.MnMp,0)},\;1.3R_hM_y=${nx(p.my13.lim13,0)})=${nx(p.Mn,0)}\;\text{k-ft}\;(6.10.7.1.2\text{-}3)`}/>}
      <ML s={Tx`\frac{M_u}{\phi_fM_n}=\frac{${nx(p.Mu,0)}}{${nx(p.phiMn,0)}}=${nx(p.dc,3)}\;${p.dc<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Compact composite section (6.10.7.1): capacity is the plastic moment M_p, reduced by the ductility term when D_p {'>'} 0.1D_t. Top (compression) flange is continuously braced by the deck, so LTB does not apply. φ_f = 1.0.</div>
    </React.Fragment>;
    return <React.Fragment>
      {p.FncNC
        ? <ML s={Tx`F_{nc}=\min(F_{nc,FLB},F_{nc,LTB})=\min(${nx(p.FncNC.FncFLB,1)},${nx(p.FncNC.FncLTB,1)})=${nx(p.Fnc,1)}\;\text{ksi}\;(6.10.8.2,\;\text{noncomposite})\qquad F_{nt}=R_hF_{yt}=${nx(p.Fnt,1)}\;\text{ksi}`}/>
        : <ML s={Tx`F_{nc}=R_bR_hF_{yc}=${nx(p.Rb,3)}\cdot${nx(p.Rh,3)}\cdot${nx(Fyc,0)}=${nx(p.Fnc,1)}\;\text{ksi}\qquad F_{nt}=R_hF_{yt}=${nx(p.Fnt,1)}\;\text{ksi}`}/>}
      <ML s={Tx`f_{bu,top}=${nx(p.fbuTop,1)}\;/\;\phi_fF_{nc}=${nx(p.Fnc,1)}\qquad f_{bu,bot}=${nx(p.fbuBot,1)}\;/\;\phi_fF_{nt}=${nx(p.Fnt,1)}\;\text{ksi}`}/>
      <ML s={Tx`\frac{D}{C}=\max\!\left(\tfrac{${nx(p.fbuTop,1)}}{${nx(p.Fnc,1)}},\;\tfrac{${nx(p.fbuBot,1)}}{${nx(p.Fnt,1)}}\right)=${nx(p.dc,3)}\;${p.dc<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Noncompact composite section (6.10.7.2): Strength I factored flange stresses f_bu (accumulated by construction stage) vs F_nc (compression, with load-shedding R_b and hybrid R_h) and F_nt (tension). D_c(comp web) = {fmt(p.DcPos,1)} in.</div>
    </React.Fragment>;
  };
  const renderNeg=(g,hasDem)=>{ const F=g.Fnc;
    return <React.Fragment>
      <ML s={Tx`F_{nc}=\min(F_{nc,FLB},F_{nc,LTB})=\min(${nx(F.FncFLB,1)},${nx(F.FncLTB,1)})=${nx(F.Fnc,1)}\;\text{ksi}`}/>
      <ML s={Tx`L_b=${nx(g.Lb,0)}'\;,\;\;L_p=${nx(F.Lp,1)}'\;,\;\;L_r=${nx(F.Lr,1)}'\;,\;\;r_t=${nx(F.rt,2)}\text{ in}`}/>
      <ML s={Tx`R_b=${nx(g.Rb,3)}\;,\;\;R_h=${nx(g.Rh,3)}\;,\;\;D_{c}=${nx(g.DcNeg,1)}\text{ in}\;,\;\;S_{bot}=${nx(g.Sb,0)}\text{ in}^3`}/>
      {hasDem? <React.Fragment>
        <ML s={Tx`f_{bu,bot}(\text{comp})=${nx(Math.abs(g.fbuBot),1)}\le\phi_fF_{nc}=${nx(F.Fnc,1)}\;\Rightarrow\;\frac{D}{C}=${nx(g.dcBot,3)}\;${g.dcBot<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
        <ML s={Tx`f_{bu,top}(\text{tens})=${nx(Math.abs(g.fbuTop),1)}\le\phi_fR_hF_{yf}=${nx(g.Rh*Fyf,1)}\;\Rightarrow\;\frac{D}{C}=${nx(g.dcTop,3)}\;${g.dcTop<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      </React.Fragment> : <div className="mnote">No net negative moment at this station (M_u,neg = {fmt(g.Mun,0)} k-ft) — the −M capacity above is shown for reference. The bottom-flange compression check governs only where the deck is in tension (pier regions).</div>}
      <ML s={Tx`-\phi_fM_n\approx${nx(g.capNeg,0)}\;\text{k-ft}\qquad M_{u,neg}=${nx(g.Mun,0)}\;\text{k-ft}`}/>
      <div className="mnote">Over the pier the deck is in tension: the section is <b>steel + longitudinal reinforcement</b> (concrete neglected). The <b>bottom</b> flange is in compression, braced only at the cross-frames (L_b), so F_nc is the smaller of flange local buckling (FLB) and lateral-torsional buckling (LTB). C_b taken as 1.0 (conservative).</div>
    </React.Fragment>;
  };
  return (<div>
    <div className="bigres">
      <div className={'br '+(pass?'p':'f')}><div className="l">{f.compact?'Mu / φMn':'Strength flexure D/C'}</div><div className="n">{fmt(f.flexDC,2)}</div><div className="u">{f.compact?fmt(f.MuPeak,0)+' / '+fmt(f.phif*f.MnGov,0)+' k-ft':'stress basis'}</div></div>
      <div className="br"><div className="l">Plastic moment Mp</div><div className="n">{fmt(f.Mp_kft,0)}</div><div className="u">k-ft · PNA {pl.region}</div></div>
      {f.composite&&<div className={'br '+(dPass?'p':'f')}><div className="l">Ductility Dp / 0.42Dt</div><div className="n">{fmt(pl.Dp/(0.42*pl.Dt),2)}</div><div className="u">{fmt(pl.Dp,1)} / {fmt(0.42*pl.Dt,1)} in</div></div>}
    </div>
    <Card title="Moment Breakdown vs Capacity" refTag={fac?'factored components (Strength I)':'unfactored service components'}>
      <div style={{marginBottom:6}}>
        <label style={{fontSize:11,color:'var(--ink2)',display:'flex',gap:7,alignItems:'center'}}>
          <input type="checkbox" checked={fac} onChange={e=>setFac(e.target.checked)}/>
          Show components factored (1.25 DC · 1.50 DW · 1.75 LL) — the M<sub>u</sub> envelopes are always factored</label>
      </div>
      <Fig h={400} data={[
        {x:fx,y:stns.map(p=>k1*p.M1),name:'DC1'+(fac?' ×1.25':''),line:{color:'#15803D',width:1.8}},
        {x:fx,y:stns.map(p=>k1*p.M2),name:'DC2'+(fac?' ×1.25':''),line:{color:'#0E7490',width:1.6,dash:'dot'}},
        {x:fx,y:stns.map(p=>kw*p.Mw),name:'DW'+(fac?' ×1.50':''),line:{color:'#B45309',width:1.6,dash:'dot'}},
        {x:fx,y:stns.map(p=>kl*p.Ml),name:'+LL+IM'+(fac?' ×1.75':''),line:{color:'#B3261E',width:1.8}},
        ...(R.hasNeg?[{x:fx,y:stns.map(p=>kl*p.Mln),name:'−LL+IM'+(fac?' ×1.75':''),line:{color:'#7C3AED',width:1.8,dash:'dash'}}]:[]),
        {x:fx,y:stns.map(p=>p.Mu),name:'+Mu (Strength I)',fill:'tozeroy',fillcolor:'rgba(28,79,196,.05)',line:{color:'#1C4FC4',width:2.2}},
        ...(R.hasNeg?[{x:fx,y:stns.map(p=>p.Mun),name:'−Mu (Strength I)',line:{color:'#1C4FC4',width:1.8,dash:'dashdot'}}]:[]),
        {x:cf.map(p=>p.x),y:cf.map(p=>p.capPos),name:'+φMn capacity',line:{color:'#B3261E',width:2.6}},
        ...(R.hasNeg?[{x:cf.map(p=>p.x),y:cf.map(p=>p.capNeg),name:'−φMn capacity',line:{color:'#B3261E',width:2,dash:'dash'}}]:[])]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'moment (k-ft)',zeroline:true,zerolinecolor:'#16212E',zerolinewidth:1.2}}}/>
      <div className="callout">Above the axis: positive-moment components, the factored +M<sub>u</sub> envelope, and the +φM<sub>n</sub> capacity (steps at flange splices{cf.some(p=>!p.compact)?'; noncompact segments use the stress-basis equivalent moment min(Fnc·St, Fnt·Sb) — the same basis as the Rating tab':''}).{R.hasNeg?' Below the axis: the −Mu envelope against the cracked-section −φMn over the pier.':''} The LL curves already include DF and impact. Governing +M D/C = <b>{fmt(f.flexDC,2)}</b> at <b>{fmt(f.gov&&f.gov.x||0,1)} ft</b>{R.hasNeg&&R.neg?'; −M D/C = '+fmt(R.neg.negBGov.r,2)+' at '+fmt(R.neg.negBGov.x||0,1)+' ft':''}.</div>
    </Card>
    {fcSel&&(()=>{ const p=fcSel.pos, g=fcSel.neg, hasDem=fcSel.hasNegDemand;
      const posPass=(p.dc||0)<=1.0001, negPass=Math.max(g.dcBot||0,g.dcTop||0)<=1.0001;
      return <Card title="Worked capacity calculation at a selected location"
        refTag="pick any station — +M and −M derived in full"
        right={<select value={selIdx} onChange={e=>setSelIdx(+e.target.value)}
          style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',
            borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:260}}>
          {fcAll.map((fc,i,a)=><option key={i} value={i}>{stnLabel(fc,i,a)}</option>)}
        </select>}>
        <div className="callout" style={{marginTop:0,marginBottom:12}}>
          Station <b>x = {fmt(fcSel.x,1)} ft</b> · segment <b>{fcSel.si+1} of {nSeg}</b> ·
          top flange <b>{fmt(fcSel.dims.bft,1)}×{fmt(fcSel.dims.tft,2)}</b> in,
          bottom flange <b>{fmt(fcSel.dims.bfb,1)}×{fmt(fcSel.dims.tfb,2)}</b> in,
          web <b>{fmt(R.sec.D,1)}×{fmt(R.sec.tw,3)}</b> in.
          The plates (and therefore the capacity) step only at flange transitions; the demand varies station to station.
        </div>
        <div className="bigres" style={{marginBottom:10}}>
          <div className={'br '+(posPass?'p':'f')}><div className="l">+M  D/C</div><div className="n">{fmt(p.dc,2)}</div><div className="u">{p.compact?'M_p basis':'stress basis'}</div></div>
          <div className={'br '+((hasDem?negPass:true)?'p':'f')}><div className="l">−M  D/C</div><div className="n">{hasDem?fmt(Math.max(g.dcBot,g.dcTop),2):'—'}</div><div className="u">{hasDem?'cracked section':'no −M here'}</div></div>
        </div>
        <div style={{fontStretch:'75%',fontWeight:700,fontSize:12,letterSpacing:'.5px',textTransform:'uppercase',color:'var(--blue)',margin:'6px 0 2px'}}>Positive moment — {p.compact?'compact composite (Mp basis, 6.10.7.1)':'noncompact composite (stress basis, 6.10.7.2)'}</div>
        {renderPos(p)}
        <div style={{fontStretch:'75%',fontWeight:700,fontSize:12,letterSpacing:'.5px',textTransform:'uppercase',color:'var(--blue)',margin:'14px 0 2px',borderTop:'1px solid var(--line2)',paddingTop:10}}>Negative moment — cracked section (6.10.8), bottom flange in compression</div>
        {renderNeg(g,hasDem)}
      </Card>;})()}
    <Card title="Positive-flexure resistance" refTag={f.flexMode}>
      {f.compact? <React.Fragment>
        <ML s={Tx`M_p=${nx(f.Mp_kft,0)}\;\text{k-ft}\quad(\text{PNA in ${pl.region}})`}/>
        {pl.Dp<=0.1*pl.Dt
          ? <ML s={Tx`D_p=${nx(pl.Dp,2)}\le 0.1D_t=${nx(0.1*pl.Dt,2)}\;\Rightarrow\; M_n=M_p=${nx(f.Mn_kft,0)}\;\text{k-ft}`}/>
          : <ML s={Tx`M_n=M_p\!\left(1.07-0.7\tfrac{D_p}{D_t}\right)=${nx(f.Mp_kft,0)}\!\left(1.07-0.7\tfrac{${nx(pl.Dp,1)}}{${nx(pl.Dt,1)}}\right)=${nx(f.Mn_kft,0)}\;\text{k-ft}`}/>}
        {f.my13&&<ML s={Tx`M_y=M_{D1}+M_{D2}+M_{AD}=${nx(f.my13.MD1,0)}+${nx(f.my13.MD2,0)}+\min(${nx(f.my13.MADb,0)},${nx(f.my13.MADt,0)})=${nx(f.my13.My,0)}\;\text{k-ft}\qquad1.3R_hM_y=${nx(f.my13.lim13,0)}\;\text{k-ft}\;\Rightarrow\;M_n=${nx(f.MnGov,0)}\;\text{k-ft}`}/>}
        <ML s={Tx`\frac{M_u}{\phi_f M_n}=\frac{${nx(f.gov&&f.gov.Mu||f.MuPeak,0)}}{${nx(f.phif*f.MnGov,0)}}=${nx(f.flexDC,3)}\;${pass?'\\checkmark':'\\text{N.G.}'}`}/>
        <div className="hint">Compact composite section in positive flexure (6.10.6.2.2 satisfied) — capacity is the plastic moment M_p, reduced by the ductility term when D_p {'>'} 0.1D_t. {f.contSpan?'Continuous span (imported demands with negative moment): M_n is also limited to 1.3 R_h M_y (6.10.7.1.2-3), with M_y from the staged factored permanent stresses per D6.2.2 (DC1 on the steel, DC2/DW on the 3n section, M_AD on the n section, lesser flange). The B6.2 exemption is not evaluated.':'Simple span, so no 1.3 R_h M_y continuity cap.'} φ_f = 1.0; flange lateral bending f_ℓ = 0 (straight girder).</div>
      </React.Fragment> : <React.Fragment>
        {f.FncPosNC
          ? <ML s={Tx`F_{nc}=\min(F_{nc,FLB},F_{nc,LTB})=\min(${nx(f.FncPosNC.FncFLB,1)},${nx(f.FncPosNC.FncLTB,1)})=${nx(f.Fnc,1)}\;\text{ksi}\;(L_b=${nx(R.geom.Lb,0)}',\;L_p=${nx(f.FncPosNC.Lp,1)}',\;L_r=${nx(f.FncPosNC.Lr,1)}')\qquad F_{nt}=R_hF_{yt}=${nx(f.Fnt,1)}\;\text{ksi}`}/>
          : <ML s={Tx`F_{nc}=R_bR_hF_{yc}=${nx(f.Fnc,1)}\;\text{ksi}\qquad F_{nt}=R_hF_{yt}=${nx(f.Fnt,1)}\;\text{ksi}`}/>}
        <ML s={Tx`f_{bu,top}=${nx(f.fbuTop,1)}\le\phi_fF_{nc}\quad f_{bu,bot}=${nx(f.fbuBot,1)}\le\phi_fF_{nt}\;\Rightarrow\;\frac{D}{C}=${nx(f.flexDC,3)}\;${pass?'\\checkmark':'\\text{N.G.}'}`}/>
        <div className="hint">{f.composite?'Noncompact composite section (6.10.7.2): stress-based check on the Strength I factored flange stresses f_bu (accumulated by stage) against F_nc (compression, with load-shedding R_b and hybrid R_h) and F_nt (tension).':'Noncomposite section (deck off): the top flange is the compression flange, braced only at the cross-frames, so F_nc is the 6.10.8.2 value — the smaller of flange local buckling and lateral-torsional buckling over L_b (C_b = 1.0) — checked against the Strength I factored f_bu; F_nt = R_hF_yt for the tension flange (6.10.8.3).'}</div>
      </React.Fragment>}
    </Card>
    <Card title="Strength I flange stresses" refTag="staged · 1.25DC + 1.50DW + 1.75LL">
      <KV rows={[['Peak +M_u',fmt(f.MuPeak,0),'k-ft'],['Governing station',fmt(f.gov&&f.gov.x||0,1),'ft'],
        ['f_bu top flange',fmt(f.fbuTop,1),'ksi'],['f_bu bottom flange',fmt(f.fbuBot,1),'ksi']]}/>
    </Card>
    {R.hasNeg&&(()=>{ const ng=R.neg, b=ng.negBGov, sg=R.segP[b.si||0];
      const bPass=b.r<=1.0001, tPass=(ng.negTGov.r||0)<=1.0001;
      return <Card title="Negative flexure — pier region" refTag="AASHTO 6.10.8 · cracked section (steel + rebar)">
      <div className="bigres">
        <div className={'br '+(bPass?'p':'f')}><div className="l">Bot flange (comp.) fbu/φFnc</div><div className="n">{fmt(b.r,2)}</div><div className="u">{fmt(b.fbu,1)} / {fmt(b.Fnc?b.Fnc.Fnc:0,1)} ksi @ {fmt(b.x,1)} ft</div></div>
        {ng.negTGov.r>0&&<div className={'br '+(tPass?'p':'f')}><div className="l">Top flange (tension)</div><div className="n">{fmt(ng.negTGov.r,2)}</div><div className="u">{fmt(ng.negTGov.fbu,1)} / {fmt(ng.negTGov.lim,1)} ksi</div></div>}
        <div className={'br '+(ng.rebarOK?'p':'f')}><div className="l">Deck rebar ≥ 1%</div><div className="n">{fmt(ng.AsProv,1)}</div><div className="u">vs {fmt(ng.AsMin1pct,1)} in² · 6.10.1.7</div></div>
      </div>
      {b.Fnc&&<React.Fragment>
        <ML s={Tx`F_{nc}=\min(F_{nc,FLB},F_{nc,LTB})=\min(${nx(b.Fnc.FncFLB,1)},${nx(b.Fnc.FncLTB,1)})=${nx(b.Fnc.Fnc,1)}\;\text{ksi}\quad(L_b=${nx(R.geom.Lb,0)}',\;L_p=${nx(b.Fnc.Lp,1)}',\;L_r=${nx(b.Fnc.Lr,1)}')`}/>
        <ML s={Tx`f_{bu}=${nx(b.fbu,1)}\le\phi_fF_{nc}=${nx(b.Fnc.Fnc,1)}\;\text{ksi}\;\Rightarrow\;\frac{D}{C}=${nx(b.r,3)}\;${bPass?'\\checkmark':'\\text{N.G.}'}`}/>
      </React.Fragment>}
      <div className="hint">Over the pier the deck is in tension: the section is <b>steel + longitudinal reinforcement</b> (concrete neglected), the <b>bottom</b> flange is in compression braced only at the cross-frames (L_b = {fmt(R.geom.Lb,0)} ft), and F_nc is the smaller of flange local buckling and lateral-torsional buckling with R_b from the cracked-section web depth in compression (D_c = {fmt(sg.cr.DcNeg,1)} in). DC1 acts on the bare steel section; DC2, DW, and −LL on the cracked section. Peak −M_u = <b>{fmt(ng.MunPeak,0)} k-ft</b>. Moment-gradient factor C_b taken as 1.0 (conservative).</div>
    </Card>;})()}
  </div>);
}

function ShearTab({R}){
  if(!R.ok) return null;
  const s=R.shearR, dc=s.VuPeak/(s.phiv*s.Vcr), pass=dc<=1.0001;
  const stns=R.stations, sx=stns.map(p=>p.x);
  const x0=sx[0]||0, x1=sx[sx.length-1]||R.geom.L;
  const hl=(y,name,color,dash)=>({x:[x0,x1],y:[y,y],name,mode:'lines',line:{color,width:2,dash:dash||'dash'}});
  // ── location picker: per-station shear check ──
  const scAll=R.shearCalc||[], Lspan=R.geom.L, Fyw=R.matR.Fyw;
  const govXV=s.xGov||0;
  const defIdxV=scAll.length? scAll.reduce((bi,sc,i,a)=>Math.abs(sc.x-govXV)<Math.abs(a[bi].x-govXV)?i:bi,0):0;
  const [selV,setSelV]=useState(defIdxV);
  const scSel=scAll.length? scAll[Math.min(selV,scAll.length-1)] : null;
  const stnLabelV=(sc,i)=>{ const x=sc.x; const t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    t.push(sc.isEnd?'end panel':'interior panel');
    return 'x = '+x.toFixed(1)+' ft  ·  '+t.join(', '); };
  return (<div>
    <div className="bigres">
      <div className={'br '+(pass?'p':'f')}><div className="l">Vu / φVn (support)</div><div className="n">{fmt(dc,2)}</div><div className="u">{fmt(s.VuPeak,0)} / {fmt(s.phiv*s.Vcr,0)} kip</div></div>
      <div className="br"><div className="l">Vp = 0.58FywDtw</div><div className="n">{fmt(s.Vp,0)}</div><div className="u">kip · C = {fmt(s.Cv,3)}</div></div>
      <div className={'br '+(s.doOver3D||!s.endSpcOK?'f':'')}><div className="l">Web D/tw</div><div className="n">{fmt(s.dtw,0)}</div><div className="u">{s.stiffened?'stiffened @ '+fmt(s.doSpc,0)+'″':(s.doOver3D?'d_o > 3D → treated unstiffened':'unstiffened')}</div></div>
    </div>
    {s.doOver3D&&<div className="callout warn"><b>Stiffener spacing exceeds 3D.</b> d<sub>o</sub> = {fmt(s.doRaw,0)} in &gt; 3D = {fmt(s.doMax3D,0)} in, so LRFD 6.10.9.1 requires the web to be treated as <b>unstiffened</b> for shear: k reverts to 5.0 and <b>no panel may be credited with tension-field action</b>. Everything below is computed on that basis. Reduce d<sub>o</sub> to {fmt(s.doMax3D,0)} in or less to get the stiffened k and the interior-panel tension field back.</div>}
    {s.stiffened&&!s.endSpcOK&&<div className="callout warn"><b>End-panel spacing exceeds 1.5D.</b> LRFD 6.10.9.3.3 limits the transverse-stiffener spacing inside the end (anchor) panel to 1.5D = {fmt(s.doEndMax,0)} in; this model uses one uniform d<sub>o</sub> = {fmt(s.doRaw,0)} in. Tighten the first stiffener in from each support to {fmt(s.doEndMax,0)} in or less so the anchor panel can develop the reaction that anchors the adjacent interior panels' tension fields.</div>}
    <Card title="Shear Demand vs Capacity" refTag="AASHTO 6.10.9 · Vu envelope vs φVn">
      <Fig h={360} data={[
        {x:sx,y:stns.map(p=>p.Vu),name:'Vu (Strength I, |envelope|)',fill:'tozeroy',fillcolor:'rgba(28,79,196,.06)',line:{color:'#1C4FC4',width:2.2}},
        {x:sx,y:stns.map(p=>Math.abs(1.25*(p.V1+p.V2)+1.5*p.Vw)),name:'factored dead load |V|',line:{color:'#15803D',width:1.6,dash:'dot'}},
        hl(s.phiv*s.Vcr,'φVn end panel (C·Vp)','#B3261E'),
        ...(s.stiffened?[hl(s.phiv*s.VnInt,'φVn interior (tension field)','#0E7490','dot')]:[])]}
        layout={{xaxis:{title:'x (ft)'},yaxis:{title:'shear (kip)',rangemode:'tozero'}}}/>
      <div className="callout">The V<sub>u</sub> envelope (factored, LL with DF and impact) is checked against the end-panel resistance C·V<sub>p</sub> everywhere — conservative, since interior stiffened panels may use the tension-field value shown dotted. Governing V<sub>u</sub> = <b>{fmt(s.VuPeak,0)} kip</b> at <b>{fmt(s.xGov,1)} ft</b> (D/C = <b>{fmt(dc,2)}</b>). If the end panel governs your design, tighten the first stiffener spacing d<sub>o</sub> to raise C.</div>
    </Card>
    <Card title="Shear resistance" refTag="AASHTO 6.10.9">
      <ML s={Tx`V_p=0.58F_{yw}Dt_w=${nx(s.Vp,0)}\;\text{kip}\qquad k=${s.stiffened?Tx`5+\frac{5}{(d_o/D)^2}=${nx(s.kShear,2)}`:'5'}`}/>
      <ML s={Tx`\frac{D}{t_w}=${nx(s.dtw,1)}\;\;\text{vs}\;\;1.12\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim1,1)},\;\;1.40\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim2,1)}\;\Rightarrow\;C=${nx(s.Cv,3)}`}/>
      <ML s={Tx`V_n=CV_p=${nx(s.Vcr,0)}\;\text{kip (end panel)}${s.stiffened?Tx`\qquad V_{n,int}=${nx(s.VnInt,0)}\;\text{kip (tension field)}`:''}`}/>
      <ML s={Tx`\frac{V_u}{\phi_v V_n}=\frac{${nx(s.VuPeak,0)}}{${nx(s.phiv*s.Vcr,0)}}=${nx(dc,3)}\;${pass?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="hint">The support panel is checked <b>without</b> tension-field action (end-panel rule 6.10.9.3.3, V_n = C·V_p), since the anchor panel cannot develop a tension field. Interior stiffened panels develop tension-field action (6.10.9.3.2), giving the higher V_n,int shown{s.stiffened?' — valid because 2Dt_w/(A_fc+A_ft) = '+fmt(s.propTF,2)+(s.propTF<=2.5?' ≤ 2.5':' > 2.5 (alt. form used)'):''}. φ_v = 1.0. Add or tighten transverse stiffeners (Stiffeners tab) to raise capacity.</div>
      <div className="mnote">Two spacing limits gate all of this. <b>6.10.9.1</b>: if d<sub>o</sub> &gt; 3D = {fmt(s.doMax3D,0)} in the web counts as unstiffened — k = 5 and no tension field anywhere. <b>6.10.9.3.3</b>: the end panel itself is limited to d<sub>o</sub> ≤ 1.5D = {fmt(s.doEndMax,0)} in. Current d<sub>o</sub> = {s.stiffTrans?fmt(s.doRaw,0)+' in':'— (unstiffened web)'}{s.stiffTrans?(s.doOver3D?' → over 3D':(s.endSpcOK?' → both limits satisfied ✓':' → over the 1.5D end-panel limit')):''}.</div>
    </Card>
    {scSel&&(()=>{ const pass2=scSel.dc<=1.0001;
      return <Card title="Worked shear calculation at a selected location"
        refTag="pick any station — end-panel vs tension-field"
        right={<select value={selV} onChange={e=>setSelV(+e.target.value)}
          style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',
            borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:260}}>
          {scAll.map((sc,i)=><option key={i} value={i}>{stnLabelV(sc,i)}</option>)}
        </select>}>
        <div className="callout" style={{marginTop:0,marginBottom:12}}>
          Station <b>x = {fmt(scSel.x,1)} ft</b> — {scSel.isEnd? 'end panel adjacent to a support: no tension field, Vₙ = C·Vₚ (6.10.9.3.3)':(s.stiffened?'interior stiffened panel: tension-field action allowed (6.10.9.3.2)':'unstiffened web: Vₙ = C·Vₚ')}. The web (D, t_w) is prismatic, so V_p and C are constant along the span; the panel classification and the demand V_u vary with location.
        </div>
        <div className="bigres" style={{marginBottom:10}}>
          <div className={'br '+(pass2?'p':'f')}><div className="l">V_u / φV_n</div><div className="n">{fmt(scSel.dc,2)}</div><div className="u">{fmt(scSel.Vu,0)} / {fmt(scSel.phiVn,0)} kip</div></div>
          <div className="br"><div className="l">Panel type</div><div className="n" style={{fontSize:15}}>{scSel.isEnd?'End':'Interior'}</div><div className="u">{scSel.tensionField?'tension field':'C·Vp'}</div></div>
        </div>
        <ML s={Tx`V_p=0.58F_{yw}Dt_w=0.58\cdot${nx(Fyw,0)}\cdot${nx(s.D,1)}\cdot${nx(s.tw,3)}=${nx(s.Vp,0)}\;\text{kip}`}/>
        <ML s={Tx`\frac{D}{t_w}=${nx(s.dtw,1)}\;\;\text{vs}\;\;1.12\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim1,1)},\;1.40\sqrt{\tfrac{Ek}{F_{yw}}}=${nx(s.slim2,1)}\;\Rightarrow\;C=${nx(s.Cv,3)}\quad(k=${nx(s.kShear,2)})`}/>
        {scSel.isEnd
          ? <ML s={Tx`V_n=CV_p=${nx(s.Cv,3)}\cdot${nx(s.Vp,0)}=${nx(s.Vcr,0)}\;\text{kip (end panel)}`}/>
          : <ML s={Tx`V_n=V_p\!\left(C+\dfrac{0.87(1-C)}{\sqrt{1+(d_o/D)^2}}\right)=${nx(s.VnInt,0)}\;\text{kip (tension field)}`}/>}
        <ML s={Tx`\frac{V_u}{\phi_vV_n}=\frac{${nx(scSel.Vu,0)}}{${nx(scSel.phiVn,0)}}=${nx(scSel.dc,3)}\;${pass2?'\\checkmark':'\\text{N.G.}'}`}/>
        <div className="mnote">V_u is the Strength I factored shear envelope at this station: |1.25(V_DC1+V_DC2)+1.50 V_DW| + 1.75|V_LL| (LL with DF and impact). φ_v = 1.0.{s.stiffened?' End-panel length taken as the first stiffener spacing d_o = '+fmt(s.doSpc,0)+' in from each support.':''}</div>
      </Card>;})()}
  </div>);
}

function DeckTab({R}){
  if(!R.ok) return null;
  const d=R.deckD;
  if(!d) return <div className="soonbox"><div className="ph">Deck design is off</div>
    <div className="ds">Enable the composite deck and its transverse design on the Inputs tab (Deck &amp; Composite → “Design transverse deck reinforcement”) to run the equivalent-strip deck checks.</div></div>;
  const capRow=(lab,c)=>({c:[lab,fmt(c.Mu,2),fmt(c.phiMn,2),fmt(c.dc,2),{v:c.ok?'PASS':'FAIL',cls:c.ok?'ok':'no'}]});
  const CASES=[
    {k:'pos',l:'Interior +M (bottom bars)',c:d.pos,Mu:d.Mu_pos,MDC:d.MDC_pos,MDW:d.MDW_pos,MLL:d.MLL_pos,SW:d.SWpos,strip:'+M',src:'Table A4-1'},
    {k:'neg',l:'Interior −M (top bars)',c:d.neg,Mu:d.Mu_neg,MDC:d.MDC_neg,MDW:d.MDW_neg,MLL:d.MLL_neg,SW:d.SWneg,strip:'−M',src:'Table A4-1 at x = '+fmt(d.xneg,1)+' in'},
    {k:'oh',l:'Overhang (top bars)',c:d.ohCap,Mu:d.Mu_oh,MDC:d.MohDC,MDW:d.MohDW,MLL:d.MohLL,SW:d.SWoh,strip:'overhang',src:'wheel on the 45+10X strip'}];
  const [ck,setCk]=useState('pos');
  const CS=CASES.find(x=>x.k===ck)||CASES[0], cc=CS.c;
  return (<div>
    <div className="bigres">
      <div className={'br '+(d.pos.ok?'p':'f')}><div className="l">Deck +M (bottom)</div><div className="n">{fmt(d.pos.dc,2)}</div><div className="u">{fmt(d.Mu_pos,2)} / {fmt(d.pos.phiMn,2)} k-ft/ft</div></div>
      <div className={'br '+(d.neg.ok?'p':'f')}><div className="l">Deck −M (top)</div><div className="n">{fmt(d.neg.dc,2)}</div><div className="u">{fmt(d.Mu_neg,2)} / {fmt(d.neg.phiMn,2)} k-ft/ft</div></div>
      <div className={'br '+(d.ohCap.ok?'p':'f')}><div className="l">Overhang</div><div className="n">{fmt(d.ohCap.dc,2)}</div><div className="u">{fmt(d.Mu_oh,2)} / {fmt(d.ohCap.phiMn,2)} k-ft/ft</div></div>
    </div>

    <Card title="What this check is" refTag="LRFD 4.6.2.1 · equivalent-strip method">
      <div className="hint">The deck spans transversely between girders and is designed per foot of width. For the <b>interior bays</b> the live-load moments come straight from <b>AASHTO Table A4-1</b>, interpolated on the girder spacing S = {fmt(d.Ls,2)} ft and on the negative-moment design section x = {fmt(d.xneg,1)} in ({d.dsRule}); those tabulated values already include the multiple presence factors and the 33% dynamic load allowance, so no further impact is applied. The <b>overhang</b> is not covered by A4-1, so a 16-kip wheel placed 1 ft clear of the railing face is spread over the 45.0 + 10.0X strip (X = {fmt(d.Xoh,2)} ft, SW = {fmt(d.SWoh,1)} in) with IM and the one-lane multiple presence factor applied by hand. Dead load is the slab as DC and the future wearing surface as DW, factored 1.25 and 1.50 respectively. Distribution reinforcement (9.7.3.2) = min(220/√S, 67%) = <b>{fmt(d.distPct,0)}%</b> of the bottom steel, placed parallel to traffic.</div>
    </Card>

    <Card title="Summary — all deck design cases" refTag="dead + HL-93 · per foot of strip">
      <Tbl head={['Location','Mu (k-ft/ft)','φMn (k-ft/ft)','D/C','Status']} rows={[
        capRow('Interior +M (bottom bars)',d.pos),
        capRow('Interior −M (top bars)',d.neg),
        capRow('Overhang (top bars)',d.ohCap),
      ]}/>
    </Card>

    <Deriv title="Worked deck design at a selected case"
      refTag="equivalent strip · flexure"
      right={<select value={ck} onChange={e=>setCk(e.target.value)}
        style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:250}}>
        {CASES.map(x=><option key={x.k} value={x.k}>{x.l}</option>)}
      </select>}>
      <VarTable title={'Variables — '+CS.l} rows={[
        ['S','Girder spacing (c/c)',d.Ls,'ft'],
        ['SW','Equivalent strip width ('+CS.strip+')',CS.SW,'in'],
        ['t_s','Slab thickness',d.ts,'in'],
        ['A_s','Reinforcement area (per ft)',cc.As,'in²/ft'],
        ['d','Effective depth to bar centroid',cc.dEff,'in'],
        ["f'_c",'Deck concrete strength',d.fcd,'ksi'],
        ['f_y','Reinforcement yield',d.fy,'ksi'],
        ['M_DC','Slab dead-load moment',CS.MDC,'k-ft/ft'],
        ['M_DW','Wearing-surface moment',CS.MDW,'k-ft/ft'],
        ['M_LL+IM','Live-load moment incl. MPF and impact ('+CS.src+')',CS.MLL,'k-ft/ft'],
      ]}/>
      <SG n="1">Factored design moment — Strength I (DC 1.25, DW 1.50, LL+IM 1.75)</SG>
      <ML s={Tx`M_u=1.25M_{DC}+1.50M_{DW}+1.75M_{LL+IM}=1.25(${nx(CS.MDC,2)})+1.50(${nx(CS.MDW,2)})+1.75(${nx(CS.MLL,2)})=${nx(CS.Mu,2)}\;\text{k-ft/ft}`}/>
      <SG n="2">Flexural resistance of the deck section</SG>
      <ML s={Tx`a=\frac{A_sf_y}{0.85f'_c\,b}=\frac{${nx(cc.As,3)}\cdot${nx(d.fy,0)}}{0.85\cdot${nx(d.fcd,2)}\cdot12}=${nx(cc.a,3)}\;\text{in}\qquad c=\frac{a}{\beta_1}=${nx(cc.c,3)}\;\text{in}`}/>
      <ML s={Tx`\varepsilon_t=0.003\!\left(\frac{d}{c}-1\right)=${nx(cc.et,4)}\;\Rightarrow\;\phi=${nx(cc.phi,3)}\;(\text{${cc.et>=0.005?'tension-controlled':'transition'}})`}/>
      <ML s={Tx`M_n=A_sf_y\!\left(d-\frac{a}{2}\right)=${nx(cc.Mn,2)}\;\text{k-ft/ft}\qquad \phi M_n=${nx(cc.phiMn,2)}\;\text{k-ft/ft}`}/>
      <SG n="3">Check</SG>
      <ML s={Tx`\frac{M_u}{\phi M_n}=\frac{${nx(CS.Mu,2)}}{${nx(cc.phiMn,2)}}=${nx(cc.dc,3)}\;${cc.ok?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">Singly-reinforced rectangular section, 12-in design width, Whitney stress block. β₁ per 5.6.2.2; φ transitions from 0.75 to 0.90 with net tensile strain (5.5.4.2).</div>
    </Deriv>

    <div className="callout">Interior-bay live load is taken from <b>AASHTO Table A4-1</b>, interpolated on girder spacing and on the negative-moment design section; dead load uses simplified continuous-beam moments (≈ wS²/10 and /11) with the slab as DC and the wearing surface as DW. The overhang case is gravity + barrier only — the A13 railing-collision (Extreme Event II) design cases are <b>not</b> included and still require a barrier-specific analysis.</div>
  </div>);
}

function ConstructTab({R}){
  if(!R.ok) return null;
  const c=R.constr;
  const fPass=c.fbuTopC<=c.FncC.Fnc, yPass=c.fbuTopC<=c.RhFyc, wPass=c.fbuTopC<=c.FcrwC, tPass=c.fbuBotC<=c.RhFyt, vPass=c.VcU<=c.VcrC;
  // per-station location picker
  const ccAll=c.constrCalc||[], Lspan=R.geom.L;
  const defIdx=ccAll.length? ccAll.reduce((bi,p,i,a)=>Math.abs(p.x-c.xGov)<Math.abs(a[bi].x-c.xGov)?i:bi,0):0;
  const [selIdx,setSelIdx]=useState(defIdx);
  const sel=ccAll.length? ccAll[Math.min(selIdx,ccAll.length-1)] : null;
  const stnLabel=(p,i,a)=>{ const x=p.x, t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    if(Math.abs(x-c.xGov)<0.06) t.push('governing');
    t.push(p.region==='neg'?'−M (uplift)':'+M');
    return 'x = '+x.toFixed(1)+' ft  ·  '+t.join(', '); };
  return (<div>
    <div className="bigres">
      <div className={'br '+(fPass&&yPass&&wPass?'p':'f')}><div className="l">Top flange (constr.)</div><div className="n">{fmt(c.fbuTopC,1)}</div><div className="u">ksi · Fnc = {fmt(c.FncC.Fnc,1)}</div></div>
      <div className={'br '+(vPass?'p':'f')}><div className="l">Construction shear</div><div className="n">{fmt(c.VcU/c.VcrC,2)}</div><div className="u">{fmt(c.VcU,0)} / {fmt(c.VcrC,0)} kip</div></div>
    </div>

    <Card title="What this check is" refTag="AASHTO 6.10.3 · noncomposite bare steel">
      <div className="hint">Before the deck concrete cures it provides no composite action, so the <b>bare steel girder alone</b> carries its own self-weight plus the wet-deck dead load and any construction live load. The top (compression) flange is braced only at the cross-frames (L_b = {fmt(c.Lb,0)} ft), so lateral-torsional and flange-local buckling frequently govern — this stage often sets the required brace spacing. Load factors are 1.25 DC + 1.50 construction live (Table 3.4.1-1); shear uses V_cr with no tension-field action (6.10.3.3).</div>
    </Card>

    {sel&&<Deriv title="Worked constructibility check at a selected location"
      refTag="bare steel · wet deck"
      right={<select value={selIdx} onChange={e=>setSelIdx(+e.target.value)}
        style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:250}}>
        {ccAll.map((p,i,a)=><option key={i} value={i}>{stnLabel(p,i,a)}</option>)}
      </select>}>
      <VarTable title="Variables at this station" rows={[
        ['x','Location along span',sel.x,'ft'],
        ['M_c','Factored construction moment (1.25DC+1.50CLL)',sel.Mc,'k-ft'],
        ['V_c','Factored construction shear',sel.Vc,'kip'],
        ['f_bu','Compression-flange stress = M_c·12/S (bare)',sel.region==='neg'?sel.fBot:sel.fTop,'ksi'],
        ['F_nc','Comp-flange FLB/LTB resistance',sel.Fnc.Fnc,'ksi'],
        ['R_h·F_yc','Comp-flange yield limit',sel.RhFyc,'ksi'],
        ['F_crw','Web bend-buckling resistance',sel.Fcrw,'ksi'],
        ['R_h·F_yt','Tension-flange yield limit',sel.RhFyt,'ksi'],
        ['V_cr','Shear-buckling resistance C·V_p',c.VcrC,'kip'],
        ['L_b','Unbraced length (cross-frame spacing)',c.Lb,'ft'],
      ]}/>
      <SG n="1">Compression-flange stress (bare section)</SG>
      <ML s={Tx`f_{bu}=\frac{M_c\cdot12}{S_{comp}}=${nx(sel.region==='neg'?sel.fBot:sel.fTop,2)}\;\text{ksi}\quad(\text{${sel.region==='neg'?'bottom flange in compression under uplift/-M':'top flange in compression'}})`}/>
      <SG n="2">Compression-flange resistance — buckling & yield</SG>
      <ML s={Tx`F_{nc}=\min(F_{nc,FLB},F_{nc,LTB})=\min(${nx(sel.Fnc.FncFLB,1)},${nx(sel.Fnc.FncLTB,1)})=${nx(sel.Fnc.Fnc,1)}\;\text{ksi}`}/>
      <ML s={Tx`L_b=${nx(c.Lb,0)}'\;,\;\;L_p=${nx(sel.Fnc.Lp,1)}'\;,\;\;L_r=${nx(sel.Fnc.Lr,1)}'\;,\;\;r_t=${nx(sel.Fnc.rt,2)}\text{ in}`}/>
      <ML s={Tx`\frac{f_{bu}}{F_{nc}}=${nx(sel.dcFLB,3)}\;${sel.dcFLB<=1.0001?'\\checkmark':'\\text{N.G.}'}\qquad\frac{f_{bu}}{R_hF_{yc}}=\frac{${nx(sel.region==='neg'?sel.fBot:sel.fTop,1)}}{${nx(sel.RhFyc,1)}}=${nx(sel.dcYield,3)}\;${sel.dcYield<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <SG n="3">Web bend-buckling & tension flange</SG>
      <ML s={Tx`\frac{f_{bu}}{F_{crw}}=\frac{${nx(sel.region==='neg'?sel.fBot:sel.fTop,1)}}{${nx(sel.Fcrw,1)}}=${nx(sel.dcWeb,3)}\;${sel.dcWeb<=1.0001?'\\checkmark':'\\text{N.G.}'}\qquad(D_c=${nx(sel.Dc,1)}\text{ in})`}/>
      <ML s={Tx`\text{tension flange: }\frac{f_{bu}}{R_hF_{yt}}=${nx(sel.dcTen,3)}\;${sel.dcTen<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <SG n="4">Construction shear</SG>
      <ML s={Tx`\frac{V_c}{V_{cr}}=\frac{${nx(sel.Vc,0)}}{${nx(c.VcrC,0)}}=${nx(sel.dcV,3)}\;${sel.dcV<=1.0001?'\\checkmark':'\\text{N.G.}'}\quad(\text{no tension field, 6.10.3.3})`}/>
    </Deriv>}

    <Card title="Governing constructibility checks (all stations scanned)" refTag="worst location each">
      <Tbl head={['Check','Demand fbu','Resistance','D/C','Status']} rows={[
        {c:['Comp flange FLB/LTB (Fnc)',fmt(c.fbuTopC,2),fmt(c.FncC.Fnc,2),fmt(c.fbuTopC/c.FncC.Fnc,2),PF(fPass)]},
        {c:['Comp flange yield (RhFyc)',fmt(c.fbuTopC,2),fmt(c.RhFyc,2),fmt(c.fbuTopC/c.RhFyc,2),PF(yPass)]},
        {c:['Web bend-buckling (Fcrw)',fmt(c.fbuTopC,2),fmt(c.FcrwC,2),fmt(c.fbuTopC/c.FcrwC,2),PF(wPass)]},
        {c:['Tension flange (RhFyt)',fmt(c.fbuBotC,2),fmt(c.RhFyt,2),fmt(c.fbuBotC/c.RhFyt,2),PF(tPass)]},
        {c:['Construction shear (Vcr)',fmt(c.VcU,2),fmt(c.VcrC,2),fmt(c.VcU/c.VcrC,2),PF(vPass)]},
      ]}/>
      <div className="hint">The governing top-flange stress is <b>{fmt(c.fbuTopC,1)} ksi</b> at <b>{fmt(c.xGov,1)} ft</b>. Use the location picker above to see the full derivation at any station; this table reports the worst D/C found across all stations for each limit.</div>
    </Card>
  </div>);
}

function CamberTab({R}){
  if(!R.ok) return null;
  const cm=R.camber, L=R.geom.L, xs=[], ys=[];
  for(let i=0;i<=20;i++){const x=L*i/20; const sh=(x*(L-x))/((L/2)*(L/2)); xs.push(x); ys.push(-cm.camTot*sh);}
  return (<div>
    <div className="bigres">
      <div className="br"><div className="l">Total DL camber (mid)</div><div className="n">{fmt(cm.camTot,2)}</div><div className="u">in ↑ offset</div></div>
      <div className="br"><div className="l">Δ DC1 (bare steel)</div><div className="n">{fmt(cm.camDC1,2)}</div><div className="u">in</div></div>
    </div>
    <Card title="What camber is" refTag="dead-load deflection offset">
      <div className="hint">Steel girders are fabricated with a built-in upward curvature (<b>camber</b>) equal and opposite to the dead-load deflection, so the finished bridge sits on the intended profile grade. The deflection is computed stage-by-stage on the section active at each stage — DC1 (self-weight + wet deck) on the bare steel, DC2 (barrier) and DW (wearing surface) on the long-term (3n) composite — because the concrete has not cured when DC1 is applied.</div>
    </Card>

    <Deriv title="Dead-load deflection & camber" refTag="stage-correct sections · double integration">
      <VarTable title="Variables — camber" rows={[
        ['L','Span length',R.geom.L,'ft'],['E_s','Steel modulus',R.matR.Es,'ksi'],
        ['I_bare','Bare-steel inertia (midspan)',R.bare.I,'in⁴'],
        ['I_3n','Long-term composite inertia (midspan)',R.c3N.I,'in⁴'],
        ['Δ_DC1','Deflection from DC1 (bare)',cm.camDC1,'in'],
        ['Δ_DC2','Deflection from DC2 (3n)',cm.camDC2,'in'],
        ['Δ_DW','Deflection from DW (3n)',cm.camDW,'in'],
        ['Δ_total','Total dead-load camber',cm.camTot,'in'],
      ]}/>
      <SG n="1">Stage deflections (each on its stage-correct section)</SG>
      <ML s={Tx`\Delta_{DC1}=${nx(cm.camDC1,3)}\;\text{in (bare steel, }I=${nx(R.bare.I,0)}\;\text{in}^4)`}/>
      <ML s={Tx`\Delta_{DC2}=${nx(cm.camDC2,3)}\;\text{in}\qquad\Delta_{DW}=${nx(cm.camDW,3)}\;\text{in}\quad(\text{long-term }3n,\;I=${nx(R.c3N.I,0)}\;\text{in}^4)`}/>
      <SG n="2">Total camber</SG>
      <ML s={Tx`\Delta_{total}=\Delta_{DC1}+\Delta_{DC2}+\Delta_{DW}=${nx(cm.camDC1,3)}+${nx(cm.camDC2,3)}+${nx(cm.camDW,3)}=${nx(cm.camTot,3)}\;\text{in}\;\uparrow`}/>
      <Fig h={260} data={[{x:xs,y:ys,name:'deflected shape',mode:'lines',fill:'tozeroy',line:{color:'#1C4FC4'}}]}
        layout={{yaxis:{title:'Δ (in)'},xaxis:{title:'x (ft)'}}}/>
      <div className="mnote">Deflections are found by numerically double-integrating M/(E·I) along the span (handling flange segments and any imported continuous-moment diagram), which is exact for variable sections — not the closed-form 5wL⁴/384EI that assumes a prismatic simple span. There is no prestress term (unlike the PS-Beam app). Add fabrication/residual camber per the fabricator's practice.</div>
    </Deriv>
  </div>);
}

function FatigueTab({R}){
  if(!R.ok) return null;
  const f=R.fatigue, pass=f.fatDC<=1.0001;
  const cf=R.chartFat||[], fx=cf.map(p=>p.x);
  const x0=fx[0]||0, x1=fx[fx.length-1]||R.geom.L;
  const hl=(y,name,color,dash)=>({x:[x0,x1],y:[y,y],name,mode:'lines',line:{color,width:2,dash:dash||'dash'}});
  const webPass=f.webFatGov.r<=1.0001;
  // per-station location picker for the stress-range calc
  const fcAll=f.fatCalc||[], Lspan=R.geom.L;
  const defIdx=fcAll.length? fcAll.reduce((bi,p,i,a)=>Math.abs(p.x-f.xGov)<Math.abs(a[bi].x-f.xGov)?i:bi,0):0;
  const [selIdx,setSelIdx]=useState(defIdx);
  const sel=fcAll.length? fcAll[Math.min(selIdx,fcAll.length-1)] : null;
  const stnLabel=(p,i,a)=>{ const x=p.x; const t=[];
    if(Math.abs(x)<0.06||Math.abs(x-Lspan)<0.06) t.push('support');
    else if(Math.abs(x-Lspan/2)<0.06) t.push('midspan');
    if(Math.abs(x-f.xGov)<0.06) t.push('peak Δf');
    return 'x = '+x.toFixed(1)+' ft'+(t.length?'  ·  '+t.join(', '):''); };
  const AN13=Math.pow(f.Acat/Math.max(f.Nfat,1),1/3);        // (A/N)^⅓
  const lsName=f.fatInf?'Fatigue I':'Fatigue II';
  const recName=f.recFatI?'Fatigue I':'Fatigue II';
  const overridden=f.lsMode!=='auto' && ((f.lsMode==='I')!==f.recFatI);
  const stepHdr=(t)=>(<div style={{fontStretch:'75%',fontWeight:800,fontSize:12.5,letterSpacing:'.6px',
    textTransform:'uppercase',color:'var(--blue)',margin:'2px 0 8px'}}>{t}</div>);
  return (<div>
    <div className="bigres">
      <div className={'br '+(pass?'p':'f')}><div className="l">γ(Δf) / (ΔF)n</div><div className="n">{fmt(f.fatDC,2)}</div><div className="u">cat {f.cat} · {lsName}</div></div>
      <div className="br"><div className="l">Governing Δf</div><div className="n">{fmt(f.dfRange,2)}</div><div className="u">ksi · btm flange @ {fmt(f.xGov,1)} ft</div></div>
      <div className={'br '+(webPass?'p':'f')}><div className="l">Web special fatigue</div><div className="n">{fmt(f.webFatGov.r,2)}</div><div className="u">{fmt(f.webFatGov.Vf||0,0)} / {fmt(f.Vcr,0)} kip</div></div>
    </div>

    <Card title="Step 1 — Fatigue traffic & number of stress cycles" refTag="LRFD 3.6.1.4 · 6.6.1.2.5">
      <KV rows={[
        ['ADTT entered', fmt(f.adttRaw,0), 'trucks/day · '+(f.adttIsSingleLane?'already single-lane':'gross, all lanes')],
        ...(!f.adttIsSingleLane?[['Lanes available to trucks', f.lanes>=3?'3+':(''+f.lanes), ''],
          ['Single-lane fraction p', fmt(f.pFrac,2), 'Table 3.6.1.4.2-1']]:[]),
        ['(ADTT)ₛₗ single-lane', fmt(f.adttSL,0), 'trucks/day'],
        ['Cycles per truck passage n', fmt(f.nCyc,2), 'Table 6.6.1.2.5-2'],
        ['Fatigue design life', fmt(f.lifeYr,0), 'yr'],
      ]}/>
      <ML s={Tx`N=(365)(Y)(n)(\text{ADTT})_{SL}=365\cdot${nx(f.lifeYr,0)}\cdot${nx(f.nCyc,2)}\cdot${nx(f.adttSL,0)}=${nx(f.Nfat,0)}\;\text{cycles}`}/>
      <div className="mnote">N is the total number of stress-range cycles over the design life (6.6.1.2.5-3). (ADTT)ₛₗ = p·ADTT is the single-lane average daily truck traffic; n accounts for cycles produced per truck passage (multiple cycles near interior supports and on short spans). Enter these on the Inputs tab → Fatigue.</div>
    </Card>

    <Card title="Step 2 — Which limit state: Fatigue I or Fatigue II?" refTag="6.6.1.2.3 · infinite vs finite life"
      right={<span className="chip head" style={{background:f.fatInf?'#E8F5EC':'#FCF3E3',borderColor:f.fatInf?'var(--pass)':'var(--warn)',color:f.fatInf?'var(--pass)':'var(--warn)'}}>{lsName}</span>}>
      <ML s={Tx`(\text{ADTT})_{SL,\,cross}=\dfrac{A}{\left[\tfrac{0.80}{1.75}(\Delta F)_{TH}\right]^{3}(365)(Y)(n)}=\dfrac{${nx(f.Acat,0)}}{(${nx(f.fatGRatio,4)}\cdot${nx(f.TH,1)})^{3}\cdot365\cdot${nx(f.lifeYr,0)}\cdot${nx(f.nCyc,2)}}=${nx(f.adttSLcross,0)}\;\text{trucks/day}`}/>
      <ML s={Tx`(\text{ADTT})_{SL}=${nx(f.adttSL,0)}\;${f.recFatI?'\\ge':'<'}\;${nx(f.adttSLcross,0)}\;\Rightarrow\;\text{${recName} recommended}`}/>
      <div className="kv" style={{marginTop:6}}>
        <span className="k">Limit-state mode</span><span className="dots"></span><span className="v">{f.lsMode==='auto'?'AUTO (from crossover)':'MANUAL override'}</span>
        <span className="k">Governing limit state</span><span className="dots"></span><span className="v">{lsName} · γ = {fmt(f.gammaFat,2)}</span>
      </div>
      {overridden && <div className="callout" style={{background:'#FCF3E3',borderColor:'var(--warn)',color:'var(--warn)'}}>You have manually selected <b>{lsName}</b>, but the (ADTT)ₛₗ crossover recommends <b>{recName}</b>. Switch the Limit-state control on the Inputs tab to AUTO to follow the code check.</div>}
      <div className="mnote">Fatigue&nbsp;I (γ = 1.75) is the infinite-life check used when traffic is heavy enough that the Fatigue&nbsp;I check governs over Fatigue&nbsp;II, i.e. when (A/N)<sup>⅓</sup>/0.80 ≥ (ΔF)<sub>TH</sub>/1.75 — the basis of Table 6.6.1.2.3-2 (e.g. category C, 75 yr: 1,680 trucks/day); the section is then designed for unlimited cycles. Fatigue&nbsp;II (γ = 0.80) is the finite-life check for lighter traffic, where resistance depends on the actual cycle count N.</div>
    </Card>

    <Card title="Step 3 — Detail category & nominal fatigue resistance (ΔF)ₙ" refTag="6.6.1.2.5 · category constants">
      <KV rows={[
        ['Detail category', f.cat, 'set on Inputs tab'],
        ['Detail constant A', fmt(f.Acat/1e8,2)+'×10⁸', 'ksi³ (Table 6.6.1.2.5-1)'],
        ['CAF threshold (ΔF)ᴛʜ', fmt(f.TH,1), 'ksi (Table 6.6.1.2.5-3)'],
      ]}/>
      {f.fatInf
        ? <React.Fragment>
            <ML s={Tx`\text{Fatigue I:}\quad(\Delta F)_n=(\Delta F)_{TH}=${nx(f.TH,1)}\;\text{ksi}`}/>
            <div className="mnote">Infinite-life resistance is the constant-amplitude fatigue threshold — independent of N.</div>
          </React.Fragment>
        : <React.Fragment>
            <ML s={Tx`\text{Fatigue II:}\quad(\Delta F)_n=\left(\frac{A}{N}\right)^{1/3}=\left(\frac{${nx(f.Acat,0)}}{${nx(f.Nfat,0)}}\right)^{1/3}=${nx(f.FnFat,2)}\;\text{ksi}`}/>
            <div className="mnote">Finite-life resistance falls with cycle count (Eq. 6.6.1.2.5-2). There is no ½(ΔF)<sub>TH</sub> floor in the Fatigue&nbsp;I/II format.</div>
          </React.Fragment>}
    </Card>

    {sel&&<Card title="Step 4 — Fatigue live load & bottom-flange stress range Δf"
      refTag="fatigue truck · IM = 1.15 · single-lane"
      right={<select value={selIdx} onChange={e=>setSelIdx(+e.target.value)}
        style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',border:'1.5px solid var(--blue)',
          borderRadius:4,background:'#fff',color:'var(--ink)',maxWidth:240}}>
        {fcAll.map((p,i,a)=><option key={i} value={i}>{stnLabel(p,i,a)}</option>)}
      </select>}>
      <div className="callout" style={{marginTop:0,marginBottom:10}}>
        Fatigue truck (LRFD 3.6.1.4.1): one design truck, axles <b>8 – 32 – 32 kip</b> with a <b>constant 30-ft</b> spacing between the two 32-kip axles, a single lane, no multiple-presence factor. Dynamic allowance IM = <b>15%</b> (Table 3.6.2.1-1). Distribution factor from {f.fatDfSource} = <b>{fmt(f.dfFat,3)}</b>.
      </div>
      <KV rows={[
        ['Location x', fmt(sel.x,1), 'ft'],
        ['Fatigue-truck moment range', fmt(sel.Mrange,0), 'k-ft/lane (unfactored, no IM)'],
        ['Short-term composite Sₓ (bottom)', fmt(sel.Sb,0), 'in³'],
      ]}/>
      <ML s={Tx`M_{f}=M_{range}\,(1+IM)\,g_{fat}=${nx(sel.Mrange,0)}\cdot1.15\cdot${nx(f.dfFat,3)}=${nx(sel.Mf,0)}\;\text{k-ft}`}/>
      <ML s={Tx`\Delta f=\frac{M_{f}\cdot12}{S_{x}}=\frac{${nx(sel.Mf,0)}\cdot12}{${nx(sel.Sb,0)}}=${nx(sel.rng,2)}\;\text{ksi}`}/>
      <ML s={Tx`\gamma(\Delta f)=${nx(f.gammaFat,2)}\cdot${nx(sel.rng,2)}=${nx(sel.gRng,2)}\;\text{ksi}\qquad\frac{\gamma(\Delta f)}{(\Delta F)_n}=\frac{${nx(sel.gRng,2)}}{${nx(f.FnFat,2)}}=${nx(sel.dcFlex,3)}\;${sel.dcFlex<=1.0001?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="mnote">The stress range is computed on the <b>short-term composite</b> section (modular ratio n) at the bottom flange — the fatigue range is a service-level effect, so the uncracked composite section is used along the whole span. The load factor γ is the {lsName} value.</div>
    </Card>}

    <Card title="Step 5 — Load-induced fatigue check (governing station)" refTag="6.6.1.2.2 · γ(Δf) ≤ (ΔF)ₙ">
      <ML s={Tx`\text{Governing }\Delta f=${nx(f.dfRange,2)}\;\text{ksi at }x=${nx(f.xGov,1)}'\quad\Rightarrow\quad\gamma(\Delta f)=${nx(f.gammaFat,2)}\cdot${nx(f.dfRange,2)}=${nx(f.gammaFat*f.dfRange,2)}\;\text{ksi}`}/>
      <ML s={Tx`\gamma(\Delta f)=${nx(f.gammaFat*f.dfRange,2)}\;\le\;(\Delta F)_n=${nx(f.FnFat,2)}\;\text{ksi}\;\Rightarrow\;\frac{D}{C}=${nx(f.fatDC,3)}\;${pass?'\\checkmark':'\\text{N.G.}'}`}/>
      <div className="hint">If this fails: raise the detail category (e.g. a CJP butt splice is category B rather than C), move the transition away from the peak-range region, or increase the bottom-flange section modulus. The governing location is usually near a flange transition or the point of maximum live-load moment range.</div>
    </Card>

    <Card title="Fatigue stress range along the span" refTag={'category '+f.cat+' · '+lsName+(f.fatInf?' (γ=1.75) vs (ΔF)ᴛʜ':' (γ=0.80) vs (A/N)^⅓')}>
      <Fig h={320} data={[

        <ML s={Tx`V_{u}=V_{perm}+1.75\,V_{f,LL}=${nx(w.Vperm||0,0)}+1.75\cdot${nx(w.Vll||0,0)}=${nx(w.Vf||0,0)}\;\text{kip}`}/>
        <ML s={Tx`\frac{V_{u}}{V_{cr}}=\frac{${nx(w.Vf||0,0)}}{${nx(f.Vcr,0)}}=${nx(w.r,3)}\;${webPass?'\\checkmark':'\\text{N.G.}'}\qquad(\text{at }x=${nx(w.x||0,1)}')`}/>
