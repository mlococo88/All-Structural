/* Interpolated Table A4-1 lookup. S in ft, x = design-section distance from girder CL in in. */
function deckTableA4(S,x){
  const Sn=+S||0, Sc=clamp(Sn,4,15), below=Sn<4, above=Sn>15;
  const t=(Sc-4)/0.25;
  const i0=clamp(Math.floor(t),0,A4_1.length-1), i1=Math.min(i0+1,A4_1.length-1), f=t-i0;
  const row=A4_1[i0].map((v,k)=>v+(A4_1[i1][k]-v)*f);
  const xn=+x||0, xc=clamp(xn,0,24);
  let j=0; while(j<A4_1_X.length-2 && xc>A4_1_X[j+1]) j++;
  const gf=(xc-A4_1_X[j])/(A4_1_X[j+1]-A4_1_X[j]);
  const Mneg=row[2+j]+(row[3+j]-row[2+j])*gf;
  return {Mpos:row[1], Mneg, S:Sn, Sused:Sc, x:xn, xUsed:xc,
          below, above, outOfRange:below||above, xClamped:xn>24};
}

// Transverse deck reinforcement — equivalent-strip method (LRFD 4.6.2.1 / 9.7.3).
// Ported from PS-Girder; the deck is reinforced concrete regardless of the girder material.
// F (GD49 deck, engineer decision 2026-10-15): the Strength I factors {gDC, gDW, gLL} of computeAll (lfFac): 1.25η, 1.50η, 1.75ηm under the owner
// load rules from GirderDetail; exactly 1.25, 1.50, 1.75 otherwise (or when F is not given).
function deckDesign(inp,F){
  const gDC=F?F.gDC:1.25, gDW=F?F.gDW:1.50, gLL=F?F.gLL:1.75;
  const D=inp.deck, S=inp.geom.S, ts=+D.ts, fcd=+D.fc, fy=+D.fyd, wcd=+D.wc;
  const tsLoad = D.tsSeparate ? (+D.tsDL||ts) : ts;    // DL-only deck thickness (capacity still uses ts)
  const wDLslab=tsLoad/12*wcd, wDLws=+D.wsFut;         // DC slab, DW wearing surface — ksf
  const Ls=S;                                           // c/c girder spacing, ft
  // ---- dead-load strip moments, DC and DW kept separate so DW can take its own 1.50 ----
  const MDC_neg=wDLslab*Ls*Ls/10, MDC_pos=wDLslab*Ls*Ls/11;   // ~wS²/10 and /11 continuous
  const MDW_neg=wDLws  *Ls*Ls/10, MDW_pos=wDLws  *Ls*Ls/11;
  const MDL_neg=MDC_neg+MDW_neg,  MDL_pos=MDC_pos+MDW_pos;    // combined, for reporting
  // ---- design section for negative moment: steel I-girder → b_ft/4 from the CL (4.6.2.1.6) ----
  const bft=+((inp.sec&&inp.sec.bft)||0);
  const xnegAuto=clamp(bft/4,0,24);
  const xneg = (D.xnegAuto===false) ? clamp(+D.xneg||0,0,24) : xnegAuto;
  const dsRule='steel I-girder → b_ft/4 from the girder CL';
  // ---- live load: AASHTO Table A4-1 (already carries the MPFs and the 33% IM) ----
  const A4=deckTableA4(S,xneg);
  const MLL_pos=A4.Mpos, MLL_neg=A4.Mneg;
  // Equivalent-strip widths (T.4.6.2.1.3-1) retained for reference only.
  const SWpos=26+6.6*S, SWneg=48+3.0*S;                 // in
  // ---- Strength I: DC 1.25, DW 1.50, LL+IM 1.75 (GD49: × η, LL+IM × ηm under the owner load rules) ----
  const Mu_pos=gDC*MDC_pos+gDW*MDW_pos+gLL*MLL_pos;
  const Mu_neg=gDC*MDC_neg+gDW*MDW_neg+gLL*MLL_neg;
  const cap=(barA,sp,cover,Mu)=>{
    const As=barA*12/Math.max(sp,0.1);                  // in²/ft
    const dbar=Math.sqrt(barA*4/Math.PI);
    const dEff=ts-cover-dbar/2;
    const a=As*fy/(0.85*fcd*12);
    const b1=clamp(0.85-0.05*(fcd-4),0.65,0.85);
    const c=a/b1, et=0.003*(dEff/Math.max(c,1e-6)-1);
    const phi=clamp(0.75+0.15*(et-0.002)/0.003,0.75,0.9);
    const Mn=As*fy*(dEff-a/2)/12;                       // k-ft/ft
    return {As,dbar,dEff,a,c,et,phi,Mn,phiMn:phi*Mn,Mu,dc:Mu/Math.max(phi*Mn,1e-6),ok:Mu<=phi*Mn};
  };
  const pos=cap(+D.barBot,+D.sBot,+D.coverB,Mu_pos);
  const neg=cap(+D.barTop,+D.sTop,+D.coverT,Mu_neg);
  // ---- overhang: wheel 1 ft clear of the railing face, on the 45.0 + 10.0X strip ----
  const oh=+D.oh;
  const bBar=Math.max(+D.bBar||0,0), bBarF=bBar/12;     // barrier base width, in -> ft
  const Pbar=Math.max(+D.wBar||0,0);                    // barrier weight, klf of edge
  const Xoh=Math.max(oh-bBarF-1.0,0);                   // load-to-support distance, ft
  const SWoh=45.0+10.0*Xoh;                             // in — T.4.6.2.1.3-1 overhang strip
  const MohDC=wDLslab*oh*oh/2+Pbar*Math.max(oh-bBarF/2,0);
  const MohDW=wDLws*Math.pow(Math.max(oh-bBarF,0),2)/2;
  const MohDL=MohDC+MohDW;                              // combined, for reporting
  const MohLL=1.33*1.2*16*Xoh/(SWoh/12);                // IM 1.33, MPF 1.20, 16-kip wheel
  const Mu_oh=gDC*MohDC+gDW*MohDW+gLL*Math.max(MohLL,0);
  const ohCap=cap(+D.barTop,+D.sTop,+D.coverT,Mu_oh);
  const distPct=Math.min(220/Math.sqrt(S),67);          // 9.7.3.2 distribution reinforcement
  return {wDLslab,wDLws,Ls,SWpos,SWneg,MDL_pos,MDL_neg,MLL_pos,MLL_neg,Mu_pos,Mu_neg,
          MDC_pos,MDC_neg,MDW_pos,MDW_neg,A4,xneg,xnegAuto,dsRule,bft,
          pos,neg,oh,bBar,Pbar,Xoh,SWoh,MohDC,MohDW,MohDL,MohLL,Mu_oh,ohCap,distPct,fcd,fy,ts,gDC,gDW,gLL};
}

/* ================= MASTER COMPUTE ================= */
/* ===== superReactions hand-off (HANDOFF.md §4.4) =====
   UNFACTORED end reactions of this one girder line, per load type, for Bridge Substructure
   Loading. Reads the load terms computeAll() already produced (R.loads = loadsCalc(), and R.ext
   for an active MIDAS import, with the same DC1 rule as the station loop). Changes no result. */
function bxSuperRxPayload(inp,R){
  if(!R||!R.ok) return {error:'the design has an input error'+(R&&R.error?' ('+R.error+')':'')};
  const L=+inp.geom.L, Ld=R.loads; if(!(L>0)) return {error:'the span length is not positive'};
  const half=w=>(+w)*L/2;                                                 // simple span: R = wL/2 at each end
  const dph=inp.loads.diaph||[];                                          // same list as diaM()/diaV() in computeAll
  const diaL=dph.reduce((s,d)=>s+(+d.P||0)*(L-(+d.a||0))/L,0), diaR=dph.reduce((s,d)=>s+(+d.P||0)*(+d.a||0)/L,0);
  // DC1 here = loadsCalc's wDC1 (steel self-weight + deck/haunch + extra DC) + diaphragm point loads
  let dc1=[half(Ld.wDC1)+diaL, half(Ld.wDC1)+diaR];
  let dc2=[half(Ld.wDC2),half(Ld.wDC2)], dw=[half(Ld.wDW),half(Ld.wDW)];
  let ids=['Support 1','Support 2'], xs=[0,L], span={index:null,length:+L.toFixed(3)}, live=null;
  const pos=inp.loads.pos==='exterior'?'exterior':'interior';
  const BB=window.BridgeBeam, db=(BB&&inp.loads.posAuto!==false)?BB.get():null;
  const label=(db&&db.label)?db.label:(String((inp.proj&&inp.proj.girderId)||'').trim()||(pos==='exterior'?'Exterior girder':'Interior girder'));
  const notes=['Single girder line: '+label+' ('+pos+') designed in ST-Girder. The values are for this one girder; Substructure Loading decides which girders they apply to.',
    'Unfactored. DC1 = steel self-weight '+Ld.wsw.toFixed(3)+' klf + deck/haunch '+Ld.wdk.toFixed(3)+' klf + other DC '+(+inp.loads.wDCextra||0).toFixed(3)+' klf'+(dph.length?' + '+dph.length+' diaphragm point load(s)':'')+', all on the non-composite girder. DC2 = barrier / SIDL. DW = wearing surface.'];
  if(R.useExt&&R.ext){
    const e=R.ext, sL=e.spanLen, sel=e.sel||{}, i=Math.max(1,+sel.idx||1), x0=+sel.x0||0;
    const swc=R.swCont;                                                   // SW-CONT: continuous self-weight → this span's end shears
    if(e.hasDC1) dc1=[e.V_DC1(0)+(e.swExcl?(swc?swc.Rspan[0]:half(Ld.wsw)):0), -e.V_DC1(L)+(e.swExcl?(swc?swc.Rspan[1]:half(Ld.wsw)):0)];
    dc2=[e.V_DC2(0),-e.V_DC2(L)]; dw=[e.V_DW(0),-e.V_DW(L)];             // V_ already sign-flipped to + up at the left end
    ids=['Support '+i,'Support '+(i+1)]; xs=[x0,x0+sL]; span={index:i,length:+sL.toFixed(3)};
    notes.push('MIDAS import active (span '+i+'): '+(e.hasDC1?'DC1, ':'')+'DC2 and DW are the imported shears at the two ends of this span, sign-corrected to reactions (+ up)'+(e.hasDC1&&e.swExcl?', with the steel self-weight added by ST-Girder'+(swc?' ('+swContLabel(swc)+')':''):'')+'. At an interior pier they are this span\'s share only; add the share of the adjacent span.'+(e.hasDC1?'':' DC1 is computed by ST-Girder on the simple span (L = '+L.toFixed(2)+' ft).'));
  } else {
    notes.push('Simple span L = '+L.toFixed(2)+' ft: R = wL/2 for each uniform load; diaphragm point loads by statics.');
    const hl=R.hl;
    if(hl&&isFinite(hl.Vtr)&&isFinite(hl.Vtd)&&isFinite(hl.Vln)){
      const Rmax=Math.max(hl.Vtr,hl.Vtd)+hl.Vln;
      live={basis:'per lane, no IM, no DF',vehicle:'HL-93: max(design truck, design tandem) + lane load, simple span',
        supports:ids.map(id=>({id,Rmax:+Rmax.toFixed(3),Rmin:0}))};
      notes.push('Live load is information only: one lane on the simple span, no IM, no DF, no multiple presence.');
    }
  }
  const r3=v=>+(+v).toFixed(3);
  return {payload:{_schema:'bridge-super-reactions',schemaVersion:1,
    project:(window.BridgeXfer&&BridgeXfer.sharedProject())||{name:(inp.proj&&inp.proj.name)||'',bridgeId:''},
    units:{force:'kip',length:'ft'},factored:false,imIncluded:false,dfIncluded:false,perGirder:true,
    girderLine:{label,position:pos,beamIndex:db?db.index:null,source:R.useExt?'MIDAS import (ST-Girder)':'ST-Girder simple span'},
    span,
    supports:ids.map((id,k)=>({id,x:r3(xs[k]),girders:[{label,position:pos,DC1:r3(dc1[k]),DC2:r3(dc2[k]),DW:r3(dw[k])}]})),
    liveLoad:live,notes}};
}

function computeAll(inp){
  try{
    const sec=inp.sec, mat=inp.mat, deck0=inp.deck, geom=inp.geom;
    // GD49: the owner load rules of a GirderDetail import (identity otherwise): Strength I maximum factors and Service II LL factor
    const OWN=ownLFOf(inp.external), LFc=lfFac(OWN), gDC=LFc.gDC, gDW=LFc.gDW, gLL=LFc.gLL, gS2=LFc.gS2;
    // resolve grades
    const Fyf=+mat.Fyf, Fyw=+mat.Fyw, Es=+mat.Es||29000, Fyc=Fyf, Fyt=Fyf;
    const matR={...mat,Fyf,Fyw,Es,Fyc,Fyt};
    // effective flange width (4.6.2.6.1 — tributary width; interior = S)
    // Exterior girder (STG-O4): tributary width = S/2 + overhang (deck.oh, girder CL → deck edge),
    // used for the auto b_eff and for the deck dead load. deck.extTribAuto === false keeps the old
    // "S for every girder" basis (option for saved projects that carried the overhang otherwise).
    const extTrib = inp.loads.pos==='exterior' && deck0.extTribAuto!==false;
    const tribFt = extTrib? (+geom.S)/2 + Math.max(+deck0.oh||0,0) : +geom.S;
    const beff = deck0.beffAuto? tribFt*12 : +deck0.beff;
    const deck={...deck0, beff, fc:+deck0.fc, ...(OWN.h0?{haunch:0}:{})};   // GD49: haunch 0 in every composite property under the owner rule (the dead loads keep inp.deck)
    // modular ratio
    const EcDeck=Ec(deck.fc, +deck0.wc);
    const nRaw=Es/EcDeck;
    const n=Math.max(6, Math.round(nRaw));               // rounded per 6.10.1.1.1b (min 6)
    /* ---------- flange segments (plate transitions along the span) ---------- */
    const Lft0=geom.L, Lb_in=geom.Lb*12;
    const lambdaPw=3.76*sqrt(Es/Fyc);
    const rawSegs = sec.useSegs && Array.isArray(sec.segs) && sec.segs.length
      ? sec.segs.map(s=>({xEnd:+s.xEnd||0, bft:+s.bft||sec.bft, tft:+s.tft||sec.tft,
                          bfb:+s.bfb||sec.bfb, tfb:+s.tfb||sec.tfb}))
           .sort((a,b)=>a.xEnd-b.xEnd)
      : [{xEnd:Lft0, bft:+sec.bft, tft:+sec.tft, bfb:+sec.bfb, tfb:+sec.tfb}];
    rawSegs[rawSegs.length-1].xEnd=Lft0;               // last segment always runs to the end
    const segP=rawSegs.map((s,i)=>{
      const dims={D:+sec.D, tw:+sec.tw, bft:s.bft, tft:s.tft, bfb:s.bfb, tfb:s.tfb};
      const bare_=elasticProps(dims,deck,null);
      const cN_  =elasticProps(dims,deck,n);
      const c3N_ =elasticProps(dims,deck,3*n);
      const pl_  =plasticMoment(dims,matR,deck);
      const cr_  =crackedSection(dims,inp.negM,deck);
      const compactWeb_ = pl_.Dcp===0 || (2*pl_.Dcp/dims.tw)<=lambdaPw;
      const compact_ = compactWeb_ && (Fyf<=70) && (dims.D/dims.tw)<=150 && deck.deckOn;
      const Rh_=hybridRh(dims,matR,cN_);
      const Rb_=loadShedRbG(dims.D,dims.tw,dims.bft,dims.tft,cN_.Dc,Fyc,Es,compactWeb_);
      const RbNeg_=loadShedRbG(dims.D,dims.tw,dims.bfb,dims.tfb,cr_.DcNeg,Fyc,Es,false);
      const Mn_ = compact_? ((pl_.Dp<=0.1*pl_.Dt)? pl_.Mp/12 : (pl_.Mp/12)*(1.07-0.7*pl_.Dp/pl_.Dt)) : null;
      const FncTop_=flangeFnc(dims.bft,dims.tft,dims.tw,dims.D,Lb_in,Fyc,Es,1.0,Rh_,1.0,bare_.Dc,Fyw);   // constructibility (bare)
      const FncNeg_=flangeFnc(dims.bfb,dims.tfb,dims.tw,dims.D,Lb_in,Fyc,Es,RbNeg_,Rh_,1.0,cr_.DcNeg,Fyw);// −M: bottom flange comp.
      const FncBotBare_=flangeFnc(dims.bfb,dims.tfb,dims.tw,dims.D,Lb_in,Fyc,Es,1.0,Rh_,1.0,clamp(bare_.ybar-dims.tfb,0,dims.D),Fyw);// −M during constr. (bare)
      // Positive flexure, NONCOMPOSITE (deck off): the top flange is the compression flange and is
      // braced only at the cross-frames, so 6.10.8.2 (FLB / LTB with Lb) governs, not Rb·Rh·Fyc
      // (which is the composite-section value of 6.10.7.2.2). Composite sections are unchanged.
      const FncPosNC_=deck.deckOn? null : flangeFnc(dims.bft,dims.tft,dims.tw,dims.D,Lb_in,Fyc,Es,Rb_,Rh_,1.0,cN_.Dc,Fyw);
      const Iyc_=dims.tft*Math.pow(dims.bft,3)/12, Iyt_=dims.tfb*Math.pow(dims.bfb,3)/12;
      return {i, x0:i?rawSegs[i-1].xEnd:0, x1:s.xEnd, dims,
        bare:bare_, cN:cN_, c3N:c3N_, pl:pl_, cr:cr_,
        compactWeb:compactWeb_, compact:compact_, Rh:Rh_, Rb:Rb_, RbNeg:RbNeg_,
        Mn_kft:Mn_, FncTop:FncTop_, FncNeg:FncNeg_, FncBotBare:FncBotBare_,
        FncPos:FncPosNC_? FncPosNC_.Fnc : Rb_*Rh_*Fyc, FncPosNC:FncPosNC_, Fnt:Rh_*Fyf, Iyc:Iyc_, Iyt:Iyt_,
        ductOK:pl_.Dp<=0.42*pl_.Dt, wsw:bare_.A*0.490/144, ...(pl_.belowWeb?{oos:true}:{})};
    });
    // PNA-OOS (2026-10-14): segments whose positive-flexure PNA falls below the web (plasticMoment belowWeb) are outside the
    // scope of this app. Their M_p, D_p and D_cp are not used for any reported result (see the overrides after the checks).
    const pnaOOS=segP.filter(g=>g.oos).map(g=>({i:g.i, x0:g.x0, x1:g.x1, Ps:g.pl.Ps, Pc:g.pl.Pc, Pw:g.pl.Pw, Pt:g.pl.Pt}));
    const oos=pnaOOS.length>0;
    const segIdxAt=x=>{ for(let i=0;i<segP.length;i++) if(x<=segP[i].x1+1e-9) return i; return segP.length-1; };
    const segMid=segP[segIdxAt(Lft0/2)];
    // midspan-segment aliases (drawings + Section Props tab display)
    const bare=segMid.bare, cN=segMid.cN, c3N=segMid.c3N, pl=segMid.pl;
    const compactWeb=segMid.compactWeb, compact=segMid.compact,
      compactMat=Fyf<=70, compactDtw=(sec.D/sec.tw)<=150;
    const Rh=segMid.Rh, Rb=segMid.Rb, ductOK=segMid.ductOK;
    const My_bareTop=Fyf*bare.StSteel, My_bareBot=Fyf*bare.Sb;
    // area-weighted self-weight over the segments
    const wswAvg=segP.reduce((s,g)=>s+g.wsw*(g.x1-g.x0),0)/Lft0;
    const Ld=loadsCalc(inp,{n,bare},wswAvg,tribFt);
    /* ---------- external demands (continuous spans from imported envelope) ---------- */
    const mpfExt=+inp.loads.extLLmpf||1;
    // GirderDetail export (HANDOFF.md §4.9): the LL+IM is already per girder (its own DFs applied), so the
    // imported-LL DF / multiple-presence multipliers are NOT applied (1.0), whatever the inputs hold.
    const extPerGirder=extPerGirderOf(inp.external);
    const ext=buildExternal(inp.external,Lft0, extPerGirder? {pos:1,neg:1,v:1} :
      {pos:(+inp.loads.extDFpos||1)*mpfExt, neg:(+inp.loads.extDFneg||1)*mpfExt, v:(+inp.loads.extDFv||1)*mpfExt});
    const useExt=!!ext;
    const plOn=OWN.m!==1&&useExt&&ext.hasPL&&inp.external.pedestrianInLL===true;   // GD45: the pedestrian load in LL+IM, taken without m
    // SW-CONT (2026-10-13): the self-weight ST-Girder adds to an import with selfWeightExcluded:true is analysed on the
    // continuous girder of the import (swContinuous); null = one span / no support layout → simple span w·x(L−x)/2 as before.
    // SW-ED (2026-10-13): the selected span uses ST-Girder's current plates when they differ from the imported zones of that span.
    const swSelPlates=(useExt&&ext.hasDC1&&ext.swExcl)? (()=>{
      const sel=ext.sel||{}, x0=+sel.x0||0, x1=+sel.x1, z=zonesToSec(inp.external, sel, sec);
      const same=(a,b)=>Math.abs((+a)-(+b))<=1e-9;
      const plateKeys=['D','tw','bft','tft','bfb','tfb'];
      const edited= z? !(plateKeys.every(k=>same(sec[k],z[k])) && !!sec.useSegs===!!z.useSegs &&
        (!z.useSegs || (Array.isArray(sec.segs)&&sec.segs.length===z.segs.length&&
          z.segs.every((g,i)=>['xEnd','bft','tft','bfb','tfb'].every(k=>same(sec.segs[i][k],g[k])))))) : null;
      return {edited, Iown:segMid.bare.I,
        pieces:segP.map(g=>({a:x0+g.x0, b:Math.min(x0+g.x1, isFinite(x1)?x1:x0+g.x1), w:g.wsw, I:g.bare.I}))};
    })() : null;
    const swCont=(useExt&&ext.hasDC1&&ext.swExcl)? swContinuous(inp.external, ext.sel, wswAvg, Es, swSelPlates) : null;

    /* ---------- CHECKS (Phase 1: section proportion limits 6.10.2) ---------- */
    const {D,tw}=sec;
    const {bft,tft,bfb,tfb}=segMid.dims;               // midspan flanges (display + stud/stiffener refs)
    const Iyc=segMid.Iyc, Iyt=segMid.Iyt;
    const IycIyt=Iyc/Iyt;
    const checks=[];
    // 6.10.2 proportion limits — worst segment governs each check
    const worstSeg=fn=>segP.reduce((w,g)=>{const c=fn(g); return c.r>w.r?{...c,seg:g.i}:w;},{r:-1});
    const pDtw={n:'Web D/tw ≤ 150', t:'D/tw', v:D/tw, lim:150, r:(D/tw)/150, u:'', ref:'6.10.2.1.1'};
    checks.push(pDtw);
    checks.push({...worstSeg(g=>{const s1=g.dims.bft/(2*g.dims.tft), s2=g.dims.bfb/(2*g.dims.tfb);
      return {v:Math.max(s1,s2), lim:12, r:Math.max(s1,s2)/12};}),
      n:'Flange bf/2tf ≤ 12', t:'bf/2tf', u:'', ref:'6.10.2.2'});
    checks.push({...worstSeg(g=>{const bfMin=Math.min(g.dims.bft,g.dims.bfb);
      return {v:bfMin, lim:D/6, r:(D/6)/bfMin};}),
      n:'Flange bf ≥ D/6', t:'bf≥D/6', u:'in', ref:'6.10.2.2'});
    checks.push({...worstSeg(g=>{const tfMin=Math.min(g.dims.tft,g.dims.tfb);
      return {v:tfMin, lim:1.1*tw, r:(1.1*tw)/tfMin};}),
      n:'Flange tf ≥ 1.1tw', t:'tf≥1.1tw', u:'in', ref:'6.10.2.2'});
    checks.push({...worstSeg(g=>{const ratio=g.Iyc/g.Iyt;
      return {v:ratio, lim:10, r:Math.max(ratio/10, 0.1/ratio)};}),
      n:'0.1 ≤ Iyc/Iyt ≤ 10', t:'Iyc/Iyt', u:'', ref:'6.10.2.2'});

    /* ---------- stations: demands along the span (built-in simple span, or imported envelope) ---------- */
    const Lft=geom.L, Lin=Lft*12;
    const dph=inp.loads.diaph||[];
    const diaM=x=>{let M=0,Rl=0; dph.forEach(d=>{Rl+=(+d.P||0)*(Lft-(+d.a||0))/Lft;});
      dph.forEach(d=>{const a=+d.a||0,P=+d.P||0; M+= a<=x? P*(Lft-x)*a/Lft : P*x*(Lft-a)/Lft;}); return M;};
    const diaV=x=>{let Rl=0; dph.forEach(d=>{Rl+=(+d.P||0)*(Lft-(+d.a||0))/Lft;});
      let V=Rl; dph.forEach(d=>{if((+d.a||0)<x)V-=(+d.P||0);}); return V;};
    const xsSet=new Set(); const Ndiv=20;
    for(let i=0;i<=Ndiv;i++) xsSet.add(+(Lft*i/Ndiv).toFixed(3));
    segP.forEach(g=>{ if(g.x1>0.05&&g.x1<Lft-0.05){ xsSet.add(+(g.x1-0.01).toFixed(3)); xsSet.add(+(g.x1+0.01).toFixed(3)); } });
    const xs=[...xsSet].sort((a,b)=>a-b);
    const simpleM=(w,x)=>w*x*(Lft-x)/2, simpleV=(w,x)=>w*(Lft/2-x);
    const swM=x=>swCont? swCont.M(x) : simpleM(wswAvg,x), swV=x=>swCont? swCont.V(x) : simpleV(wswAvg,x);   // SW-CONT
    const stations=xs.map(x=>{
      const si=segIdxAt(x);
      const M1= (useExt&&ext.hasDC1)? ext.M_DC1(x)+(ext.swExcl? swM(x):0) : simpleM(Ld.wDC1,x)+diaM(x);
      const V1= (useExt&&ext.hasDC1)? ext.V_DC1(x)+(ext.swExcl? swV(x):0) : simpleV(Ld.wDC1,x)+diaV(x);
      const M2= useExt? ext.M_DC2(x) : simpleM(Ld.wDC2,x);
      const V2= useExt? ext.V_DC2(x) : simpleV(Ld.wDC2,x);
      const Mw= useExt? ext.M_DW(x)  : simpleM(Ld.wDW,x);
      const Vw= useExt? ext.V_DW(x)  : simpleV(Ld.wDW,x);
      const Ml = useExt? Math.max(ext.M_LLpos(x),0) : llMomentAt(Lft,x)*Ld.dfm;   // +LL envelope
      const Mln= useExt? Math.min(ext.M_LLneg(x),0) : 0;                          // −LL envelope
      const Vl = useExt? ext.V_LL(x) : llShearAt(Lft,x)*Ld.dfv;
      // GD49: owner factors (1.25, 1.50, 1.75 without owner rules); MlD, MlnD, VlD: LL+IM with the pedestrian part taken without m (GD45; = Ml, Mln, Vl otherwise)
      const qM=plOn&&Ml>0? ext.M_PLpos(x):0, qMn=plOn&&Mln<0? ext.M_PLneg(x):0, qV=plOn? ext.V_PLq(x):0;
      const MlD=plOn? llD(Ml,qM,OWN.m):Ml, MlnD=plOn? llD(Mln,qMn,OWN.m):Mln, VlD=plOn? llD(Math.abs(Vl),qV,OWN.m):Vl;
      const Mu =gDC*(M1+M2)+gDW*Mw+gLL*MlD;            // factored, +LL case
      const Mun=gDC*(M1+M2)+gDW*Mw+gLL*MlnD;           // factored, −LL case
      const Vu=Math.abs(gDC*(V1+V2)+gDW*Vw)+gLL*Math.abs(VlD);
      return {x,si,M1,M2,Mw,Ml,Mln,V1,V2,Vw,Vl,Mu,Mun,Vu,MlD,MlnD,VlD,...(plOn?{qM,qMn,qV}:{})};
    });
    const diag=stations;
    const MuPeak=Math.max(...stations.map(d=>d.Mu)), VuPeak=Math.max(...stations.map(d=>d.Vu));
    const MunPeak=Math.min(...stations.map(d=>d.Mun));
    const hasNeg=MunPeak<-1;                            // any factored negative demand (k-ft)?

    // staged flange stresses at a station (kip-ft in → ksi). Sign: fB + = bottom tension; fT + = top compression.
    // Section per component: DC1 → bare; others → composite (3n / n) when M ≥ 0, cracked (steel+rebar) when M < 0.
    const stageF=(st,g1,g2,gw,gll,des)=>{   // des (GD49): the owner combinations' LL+IM (MlD, MlnD; = Ml, Mln without a pedestrian part)
      const sg=segP[st.si];
      const one=(M,kind)=>{ let Sb,St;
        if(kind==='dc1'){ Sb=sg.bare.Sb; St=sg.bare.StSteel; }
        else if(M>=0){ const s=kind==='ll'?sg.cN:sg.c3N; Sb=s.Sb; St=s.StSteel; }
        else { Sb=sg.cr.Sb; St=sg.cr.St; }
        return {fB:M*12/Sb, fT:M*12/St}; };
      const dc=one(g1*st.M1,'dc1'), d2=one(g2*st.M2,'lt'), dw=one(gw*st.Mw,'lt');
      const lp=one(gll*(des?st.MlD:st.Ml),'ll'), ln=one(gll*(des?st.MlnD:st.Mln),'ll');
      return { pos:{fB:dc.fB+d2.fB+dw.fB+lp.fB, fT:dc.fT+d2.fT+dw.fT+lp.fT},
               neg:{fB:dc.fB+d2.fB+dw.fB+ln.fB, fT:dc.fT+d2.fT+dw.fT+ln.fT},
               parts:{dc,d2,dw,lp,ln} };
    };

    /* ---------- Service II (6.10.4.2.2) — governing station, both flanges, both LL cases ---------- */
    let s2Gov={r:0}, s2WebGov={r:0};
    // 6.10.4.2.2: 0.95 R_h F_yf applies to the flanges of COMPOSITE sections. A noncomposite
    // section — no deck acting with the steel — is limited to 0.80 R_h F_yf on both flanges.
    const s2Composite=!!deck.deckOn;
    const s2Coef=s2Composite?0.95:0.80;
    const s2CoefLabel=s2Composite?'0.95R_hF_yf':'0.80R_hF_yf';
    const chartS2=[];                                  // per-station Service II stresses for the Stresses tab charts
    stations.forEach(st=>{ const sg=segP[st.si];
      const s=stageF(st,1,1,1,gS2,true), lim=s2Coef*sg.Rh*Fyf;   // GD49: Service II γ_LL = 1.30m
      chartS2.push({x:st.x, si:st.si, lim, Rh:sg.Rh,
        bP:s.pos.fB, tP:s.pos.fT, bN:s.neg.fB, tN:s.neg.fT,
        dc1B:s.parts.dc.fB, sidlB:s.parts.d2.fB+s.parts.dw.fB, llB:s.parts.lp.fB,
        dc1T:s.parts.dc.fT, sidlT:s.parts.d2.fT+s.parts.dw.fT, llT:s.parts.lp.fT,
        // moments (k-ft) and section moduli (in³) per stage, for the worked-calc picker
        M1:st.M1, M2:st.M2, Mw:st.Mw, Ml:st.Ml, Mln:st.Mln, MlD:st.MlD,
        SbBare:sg.bare.Sb, StBare:sg.bare.StSteel, Sb3n:sg.c3N.Sb, St3n:sg.c3N.StSteel,
        Sbn:sg.cN.Sb, Stn:sg.cN.StSteel, SbCr:sg.cr.Sb, StCr:sg.cr.St,
        dc1Bp:s.parts.dc.fB, d2Bp:s.parts.d2.fB, dwBp:s.parts.dw.fB, llBp:s.parts.lp.fB, lnBp:s.parts.ln.fB});
      [['top +LL',s.pos.fT],['bot +LL',s.pos.fB],['top −LL',s.neg.fT],['bot −LL',s.neg.fB]].forEach(([tag,f])=>{
        const r=Math.abs(f)/lim; if(r>s2Gov.r) s2Gov={r,x:st.x,si:st.si,tag,f,lim,st,s}; });
      if(s.neg.fB<0){                                   // −M region: web bend-buckling turns on
        const Fcrw=webFcrw(D,tw,sg.cr.DcNeg,Fyc,Fyw,Es,sg.Rh);
        const r=Math.abs(s.neg.fB)/Fcrw; if(r>s2WebGov.r) s2WebGov={r,x:st.x,f:Math.abs(s.neg.fB),Fcrw};
      }
    });
    // stress display object (kept shape: governing positive-flexure station)
    const stMaxPos=stations.reduce((b,st)=>st.Mu>b.Mu?st:b,stations[0]);
    const sDisp=stageF(stMaxPos,1,1,1,gS2,true);
    const sgDisp=segP[stMaxPos.si];
    const fTop={dc1:sDisp.parts.dc.fT, sid:sDisp.parts.d2.fT+sDisp.parts.dw.fT, ll:sDisp.parts.lp.fT/gS2, serv2:sDisp.pos.fT};
    const fBot={dc1:sDisp.parts.dc.fB, sid:sDisp.parts.d2.fB+sDisp.parts.dw.fB, ll:sDisp.parts.lp.fB/gS2, serv2:sDisp.pos.fB};
    const fServLim=s2Coef*sgDisp.Rh*Fyf;
    // optional LL deflection (2.5.2.6.2) — short-term composite at midspan segment
    const EI=Es*segMid.cN.I;
    const dMid=(P,xft)=>{const a=Math.min(xft,Lft-xft)*12; return P*a*(3*Lin*Lin-4*a*a)/(48*EI);};
    const dTruck=1.33*(dMid(8,Lft/2-14)+dMid(32,Lft/2)+dMid(32,Lft/2+14));
    const dLane=5*(0.64/12)*Math.pow(Lin,4)/(384*EI);
    const NLc=clamp(Math.round(+inp.loads.NL||1),1,4), mpf=[1.2,1.0,0.85,0.65][NLc-1];
    const dfDefl=mpf*NLc/Math.max(+geom.nGirders,1);
    const dLL=dfDefl*Math.max(dTruck,0.25*dTruck+dLane), dLim=Lin/800;
    const stress={fTop,fBot,fServLim,s2Coef,s2Composite,s2CoefLabel,dLL,dLim,dfDefl,dTruck,dLane,
      Mdc1:stMaxPos.M1, Msid:stMaxPos.M2+stMaxPos.Mw, Mll:stMaxPos.Ml, s2Gov, s2WebGov, xGov:stMaxPos.x};

    checks.push({n:'Service II flange ('+ (s2Gov.tag||'') +')', t:'SrvII', v:Math.abs(s2Gov.f||0), lim:s2Gov.lim||1, r:s2Gov.r, u:'ksi', ref:'6.10.4.2.2', loc:s2Gov.x||0});
    if(hasNeg&&s2WebGov.r>0) checks.push({n:'Service II web bend-buckle (−M)', t:'SrvII web', v:s2WebGov.f, lim:s2WebGov.Fcrw, r:s2WebGov.r, u:'ksi', ref:'6.10.4.2.2', loc:s2WebGov.x});
    checks.push({n:'LL deflection ≤ L/800', t:'LL defl', v:dLL, lim:dLim, r:dLL/dLim, u:'in', ref:'2.5.2.6.2', loc:Lft/2});

    /* ---------- Strength I flexure (6.10.7 positive · 6.10.8 negative) ---------- */
    const phif=1.0;
    let posGov={r:0}, negBGov={r:0}, negTGov={r:0};
    const chartFlex=[];                                // per-station flexural capacity for the Flexure tab chart
    const flexCalc=[];                                 // per-station worked-calc data (Flexure location picker)
    // 6.10.7.1.2 (Eq. 6.10.7.1.2-3): in a CONTINUOUS span a compact composite section in positive
    // flexure is also limited to Mn <= 1.3RhMy (the B6.2 exemption for the pier sections is not
    // evaluated by this app, so the cap is always applied). The span is treated as continuous when
    // imported demands produce factored negative moment in it (hasNeg). My per D6.2.2, built from
    // the same staged factored permanent stresses as stageF (DC1 on bare steel; DC2/DW on 3n):
    //   My = MD1 + MD2 + MAD,  MAD = S_n·(Fyf − f_D1 − f_D2) for each flange, lesser flange governs.
    const contSpan = useExt && hasNeg;
    const yieldMy=(st,sg)=>{
      const MD1=gDC*st.M1, MD2=gDC*st.M2+gDW*st.Mw;              // k-ft, factored permanent (GD49: × η under the owner rules)
      const fd=stageF(st,gDC,gDC,gDW,0).pos;                      // ksi, fB tension+, fT compression+
      const MADb=sg.cN.Sb*(Fyf-fd.fB)/12, MADt=sg.cN.StSteel*(Fyf-fd.fT)/12;
      const MyB=MD1+MD2+MADb, MyT=MD1+MD2+MADt;
      return {MD1,MD2,fDb:fd.fB,fDt:fd.fT,MADb,MADt,MyB,MyT,My:Math.min(MyB,MyT)};
    };
    stations.forEach(st=>{ const sg=segP[st.si];
      let MnSt=sg.Mn_kft, my13=null;
      if(sg.compact && contSpan && st.Mu>0){
        const y=yieldMy(st,sg), lim13=1.3*sg.Rh*y.My;
        my13={...y, Rh:sg.Rh, lim13, MnMp:sg.Mn_kft, governs:lim13<sg.Mn_kft};
        if(isFinite(lim13) && lim13<MnSt) MnSt=Math.max(lim13,0);
      }
      // capacity as an equivalent moment (same stress→moment basis as the Rating tab's capM)
      const capPos = sg.oos? null : sg.compact? phif*MnSt
        : phif*Math.min(sg.FncPos*sg.cN.StSteel, sg.Fnt*sg.cN.Sb)/12;
      // negative capacity always computed (rating/capacity export need it even when the
      // current demands have no −M); the Flexure chart only draws it when hasNeg.
      const capNeg = -phif*Math.min(sg.FncNeg.Fnc*sg.cr.Sb, sg.Rh*Fyf*sg.cr.St)/12;
      chartFlex.push({x:st.x, capPos, capNeg, compact:sg.compact,
        SxPos:sg.cN.Sb, SxNeg:sg.cr.St, fServLim:s2Coef*sg.Rh*Fyf});
      // staged factored flange stresses (Strength I) at this station — computed once, reused below
      const fStg=stageF(st,gDC,gDC,gDW,gLL,true);   // GD49
      // ── +M worked-calc record (compact → Mp basis · noncompact composite → stress basis) ──
      const posC = sg.oos? {oos:true, compact:false, Mu:st.Mu, capPos:null, dc:NaN}
        : sg.compact
        ? {compact:true, region:sg.pl.region, Mp:sg.pl.Mp/12, Dp:sg.pl.Dp, Dt:sg.pl.Dt,
           ductRed:sg.pl.Dp>0.1*sg.pl.Dt, Mn:MnSt, MnMp:sg.Mn_kft, my13, phiMn:phif*MnSt,
           capPos, Mu:st.Mu, dc: st.Mu>1e-6? st.Mu/(phif*MnSt):0}
        : {compact:false, Fnc:sg.FncPos, FncNC:sg.FncPosNC||null, Fnt:sg.Fnt, Rb:sg.Rb, Rh:sg.Rh,
           StSteel:sg.cN.StSteel, Sb:sg.cN.Sb, DcPos:sg.cN.Dc,
           fbuTop:fStg.pos.fT, fbuBot:fStg.pos.fB,
           capPos, Mu:st.Mu, dc: st.Mu>1e-6? Math.max(fStg.pos.fT/(phif*sg.FncPos), fStg.pos.fB/(phif*sg.Fnt)):0};
      // ── −M worked-calc record (cracked steel+rebar section · bottom flange in compression) ──
      const negC = {Fnc:sg.FncNeg, Rb:sg.RbNeg, Rh:sg.Rh, DcNeg:sg.cr.DcNeg,
        Sb:sg.cr.Sb, St:sg.cr.St, Lb:geom.Lb,
        fbuBot:fStg.neg.fB, fbuTop:fStg.neg.fT, capNeg, Mun:st.Mun,
        dcBot: fStg.neg.fB<0? Math.abs(fStg.neg.fB)/(phif*sg.FncNeg.Fnc):0,
        dcTop: fStg.neg.fT<0? Math.abs(fStg.neg.fT)/(phif*sg.Rh*Fyf):0};
      flexCalc.push({x:st.x, si:st.si, dims:sg.dims, Fyf, Fyc, Es, phif,
        Mu:st.Mu, Mun:st.Mun, hasNegDemand:st.Mun<-1, pos:posC, neg:negC});
      if(st.Mu>0&&!sg.oos){
        let r,mode;
        if(sg.compact){ r=st.Mu/(phif*MnSt); mode='Mp'; }
        else { r=Math.max(fStg.pos.fT/(phif*sg.FncPos), fStg.pos.fB/(phif*sg.Fnt)); mode='stress'; }
        // governing flange (stress basis) — so the check row shows the demand/limit that sets r
        const topGov=!sg.compact && fStg.pos.fT/(phif*sg.FncPos) >= fStg.pos.fB/(phif*sg.Fnt);
        if(r>posGov.r) posGov={r,x:st.x,si:st.si,mode,Mu:st.Mu,Mn:sg.compact?MnSt:null,my13,
          topGov, fGov:topGov?fStg.pos.fT:fStg.pos.fB, FGov:topGov?sg.FncPos:sg.Fnt};
      }
      if(hasNeg){
        if(fStg.neg.fB<0){ const r=Math.abs(fStg.neg.fB)/(phif*sg.FncNeg.Fnc);
          if(r>negBGov.r) negBGov={r,x:st.x,si:st.si,fbu:Math.abs(fStg.neg.fB),Fnc:sg.FncNeg,Mun:st.Mun}; }
        if(fStg.neg.fT<0){ const r=Math.abs(fStg.neg.fT)/(phif*sg.Rh*Fyf);
          if(r>negTGov.r) negTGov={r,x:st.x,si:st.si,fbu:Math.abs(fStg.neg.fT),lim:sg.Rh*Fyf}; }
      }
    });
    const sgPos=segP[posGov.si||0];
    const stPos=stations.reduce((b,st)=>st.Mu>b.Mu?st:b,stations[0]);
    const fStr=stageF(stPos,gDC,gDC,gDW,gLL,true);
    const Mp_kft=sgPos.pl.Mp/12, Mn_kft=sgPos.Mn_kft;
    const flexMode=sgPos.compact?'Compact composite — Mp basis (6.10.7.1)'
      :(deck.deckOn?'Noncompact composite — stress basis (6.10.7.2)':'Noncomposite — stress basis, Fnc per 6.10.8.2 (FLB/LTB)');
    // Governing Mn for a compact section: includes the 1.3RhMy continuous-span cap when it applies.
    const MnGov=(sgPos.compact&&posGov.Mn!=null)? posGov.Mn : Mn_kft;
    const flex={phif,Mp_kft,Mn_kft,MnGov,contSpan,my13:posGov.my13||null,MuPeak,flexMode,flexDC:posGov.r,Fnc:sgPos.FncPos,Fnt:sgPos.Fnt,
      FncPosNC:sgPos.FncPosNC||null,composite:!!deck.deckOn,
      fbuTop:fStr.pos.fT,fbuBot:fStr.pos.fB,compact:sgPos.compact,Dp:sgPos.pl.Dp,Dt:sgPos.pl.Dt,
      ductOK:sgPos.ductOK,gov:posGov,
      // report value (STG-O11): φMn for a compact section (incl. the 1.3RhMy cap); for a noncompact or
      // noncomposite section the stress-basis equivalent φf·min(Fnc·S_top, Fnt·S_bot) on the n section
      phiMnRep: sgPos.compact? phif*MnGov : phif*Math.min(sgPos.FncPos*sgPos.cN.StSteel, sgPos.Fnt*sgPos.cN.Sb)/12};
    // negative-region summary (1% deck reinforcement per 6.10.1.7)
    const AsMin1pct=0.01*beff*deck.ts;
    const neg=hasNeg? {negBGov,negTGov,MunPeak,AsProv:+inp.negM.As||0,AsMin1pct,
      rebarOK:(+inp.negM.As||0)>=AsMin1pct, cr:segP[negBGov.si||0]?.cr||segMid.cr} : null;

    /* ---------- Strength shear (6.10.9) — governing station ---------- */
    const phiv=1.0;
    // 6.10.9.1: transverse stiffeners spaced farther apart than 3D leave the web effectively
    // UNSTIFFENED for shear — k reverts to 5 and no panel may be credited with tension-field
    // action. The plates still exist, so the 6.10.11 stiffener checks are skipped only for the
    // shear model, not silently ignored: the flag below drives an explicit warning.
    const stiffTrans=!!inp.stiff.transverse;
    const doRaw = stiffTrans? Math.max(+inp.stiff.doSpc||D, 1) : Infinity;
    const doMax3D = 3*D;
    const doOver3D = stiffTrans && doRaw>doMax3D;
    const stiffened = stiffTrans && !doOver3D;
    const doSpc = stiffened? doRaw : Infinity;
    const kShear = stiffened? 5+5/Math.pow(doSpc/D,2) : 5;
    const Vp=0.58*Fyw*D*tw;
    const dtw=D/tw, slim1=1.12*sqrt(Es*kShear/Fyw), slim2=1.40*sqrt(Es*kShear/Fyw);
    let Cv;
    if(dtw<=slim1) Cv=1.0;
    else if(dtw<=slim2) Cv=(1.12/dtw)*sqrt(Es*kShear/Fyw);
    else Cv=(1.57/(dtw*dtw))*(Es*kShear/Fyw);
    const Vcr=Cv*Vp;                                    // end panel / unstiffened (6.10.9.2/.3.3)
    const propTF=2*D*tw/(bft*tft+bfb*tfb);
    let VnInt;                                          // interior panel (6.10.9.3.2)
    if(stiffened){ const r=Math.sqrt(1+Math.pow(doSpc/D,2));
      VnInt = propTF<=2.5? Vp*(Cv+0.87*(1-Cv)/r) : Vp*(Cv+0.87*(1-Cv)/(r+doSpc/D)); }
    else VnInt=Vcr;
    const stVGov=stations.reduce((b,st)=>st.Vu>b.Vu?st:b,stations[0]);
    const shearDC=VuPeak/(phiv*Vcr);
    // per-station shear worked-calc data (end panels adjacent to the supports cannot develop
    // a tension field → Vn = C·Vp; interior stiffened panels use the tension-field Vn,int).
    const endPanelLen = stiffened? doSpc/12 : Infinity;   // ft, first panel in from each support
    // 6.10.9.3.3 — the end (anchor) panel carries shear without a tension field, and the
    // stiffener spacing within it is limited to 1.5D so the panel can anchor the adjacent
    // interior panels' tension fields.
    const doEndMax = 1.5*D;
    const endSpcOK = !stiffened || doRaw<=doEndMax*1.0001;
    const shearCalc = stations.map(st=>{
      const isEnd = (st.x<=endPanelLen+1e-6) || (st.x>=Lft-endPanelLen-1e-6);
      const Vn = isEnd? Vcr : VnInt;
      return {x:st.x, Vu:st.Vu, V1:st.V1, V2:st.V2, Vw:st.Vw, Vl:st.Vl,
        isEnd, tensionField:(!isEnd&&stiffened), Vn, phiVn:phiv*Vn, dc:st.Vu/(phiv*Vn)};
    });
    const shearR={phiv,Vp,Cv,kShear,Vcr,VnInt,stiffened,doSpc,propTF,VuPeak,dtw,slim1,slim2,xGov:stVGov.x,
      endPanelLen,Es,Fyw,D,tw,
      stiffTrans,doRaw,doOver3D,doMax3D,doEndMax,endSpcOK};

    /* ---------- Constructibility (6.10.3) — bare steel, wet deck, per station ---------- */
    const wConstr=+inp.loads.wConstr||0;
    let cGov={r:0,fbuTopC:0}, cNegGov={r:0}, cWebGov={r:0}, cTenGov={r:0}, VcUmax=0;
    const constrCalc=[];                                // per-station worked-calc data (Constructibility location picker)
    stations.forEach(st=>{ const sg=segP[st.si];
      const M1c=(useExt&&ext.hasDC1)? ext.M_DC1(st.x)+(ext.swExcl? swM(st.x):0) : simpleM(Ld.wDC1,st.x)+diaM(st.x);
      const Mc=1.25*M1c + 1.5*simpleM(wConstr,st.x);    // construction live on the erected span
      const V1c=(useExt&&ext.hasDC1)? ext.V_DC1(st.x)+(ext.swExcl? swV(st.x):0) : simpleV(Ld.wDC1,st.x)+diaV(st.x);
      const Vc=Math.abs(1.25*V1c)+1.5*Math.abs(simpleV(wConstr,st.x));
      VcUmax=Math.max(VcUmax,Vc);
      let cc;
      if(Mc>=0){                                        // top flange compression (bare)
        const f=Mc*12/sg.bare.StSteel, fb=Mc*12/sg.bare.Sb;
        const Fcrw=webFcrw(D,tw,sg.bare.Dc,Fyc,Fyw,Es,sg.Rh);
        const r=Math.max(f/sg.FncTop.Fnc, f/(sg.Rh*Fyc), f/Fcrw);
        if(r>cGov.r) cGov={r,x:st.x,si:st.si,fbuTopC:f,fbuBotC:fb,FncC:sg.FncTop,FcrwC:Fcrw};
        if(fb/(sg.Rh*Fyf)>cTenGov.r) cTenGov={r:fb/(sg.Rh*Fyf),x:st.x,f:fb};
        cc={x:st.x,si:st.si,region:'pos',Mc,Vc,fTop:f,fBot:fb,Fnc:sg.FncTop,Fcrw,
          RhFyc:sg.Rh*Fyc,RhFyt:sg.Rh*Fyf,Dc:sg.bare.Dc,Rh:sg.Rh,
          dcFLB:f/sg.FncTop.Fnc,dcYield:f/(sg.Rh*Fyc),dcWeb:f/Fcrw,dcTen:fb/(sg.Rh*Fyf),dcV:Vc/Vcr};
      } else {                                          // −M during erection: bottom flange compression (bare)
        const fb=Math.abs(Mc)*12/sg.bare.Sb, ft=Math.abs(Mc)*12/sg.bare.StSteel;
        const DcN=clamp(sg.bare.ybar-sg.dims.tfb,0,D);
        const Fcrw=webFcrw(D,tw,DcN,Fyc,Fyw,Es,sg.Rh);
        const r=Math.max(fb/sg.FncBotBare.Fnc, fb/Fcrw);
        if(r>cNegGov.r) cNegGov={r,x:st.x,si:st.si,fbu:fb,Fnc:sg.FncBotBare,Fcrw};
        if(ft/(sg.Rh*Fyf)>cTenGov.r) cTenGov={r:ft/(sg.Rh*Fyf),x:st.x,f:ft};
        cc={x:st.x,si:st.si,region:'neg',Mc,Vc,fTop:ft,fBot:fb,Fnc:sg.FncBotBare,Fcrw,
          RhFyc:sg.Rh*Fyc,RhFyt:sg.Rh*Fyf,Dc:DcN,Rh:sg.Rh,
          dcFLB:fb/sg.FncBotBare.Fnc,dcYield:fb/(sg.Rh*Fyc),dcWeb:fb/Fcrw,dcTen:ft/(sg.Rh*Fyf),dcV:Vc/Vcr};
      }
      constrCalc.push(cc);
    });
    const sgC=segP[cGov.si||0];
    const constr={McU:0,VcU:VcUmax,fbuTopC:cGov.fbuTopC,fbuBotC:cGov.fbuBotC||0,
      FncC:cGov.FncC||sgC.FncTop,FcrwC:cGov.FcrwC||0,RhFyc:sgC.Rh*Fyc,RhFyt:sgC.Rh*Fyf,
      VcrC:Vcr,wConstr,DcBare:sgC.bare.Dc,xGov:cGov.x||0,cNegGov:cNegGov.r>0?cNegGov:null,cTenGov,
      Lb:geom.Lb,constrCalc};

    /* ---------- Camber — numeric double integration (handles segments & continuous M) ---------- */
    // CF1 (2026-10-13): camber-only fine station set (the checks keep `stations`): about 0.5 ft spacing (at least L/20),
    // plus every check station (supports, ±0.01 ft at flange transitions) and the imported payload's own stations in this span.
    // The moments are the same expressions as `stations` (M1, M2, Mw), evaluated at the fine stations.
    const camH=0.5, camN=Math.max(Ndiv,Math.ceil(Lft/camH));
    const camSet=new Set(xs);
    for(let i=0;i<=camN;i++) camSet.add(+(Lft*i/camN).toFixed(4));
    if(useExt) ext.slice.forEach(s=>{ if(s.xr>1e-6&&s.xr<Lft-1e-6) camSet.add(+s.xr.toFixed(4)); });
    const camSt=[...camSet].filter(x=>x>=0&&x<=Lft).sort((a,b)=>a-b).map(x=>({x, si:segIdxAt(x),
      M1: (useExt&&ext.hasDC1)? ext.M_DC1(x)+(ext.swExcl? swM(x):0) : simpleM(Ld.wDC1,x)+diaM(x),
      M2: useExt? ext.M_DC2(x) : simpleM(Ld.wDC2,x),
      Mw: useExt? ext.M_DW(x)  : simpleM(Ld.wDW,x)}));
    // deflShape: the deflected shape at every camber station (in, + up, so sagging gives negative values); deflOf = its largest magnitude.
    const deflShape=(Mkey,Ikey)=>{
      const nS=camSt.length, xin=camSt.map(s=>s.x*12);
      const k=camSt.map(s=>(Mkey(s)*12)/(Es*segP[s.si][Ikey].I));
      const th=[0]; for(let i=1;i<nS;i++) th.push(th[i-1]+0.5*(k[i]+k[i-1])*(xin[i]-xin[i-1]));
      const v=[0];  for(let i=1;i<nS;i++) v.push(v[i-1]+0.5*(th[i]+th[i-1])*(xin[i]-xin[i-1]));
      const vc=v.map((vi,i)=>vi - v[nS-1]*xin[i]/Math.max(xin[nS-1],1e-6));
      return vc;
    };
    const deflOf=(Mkey,Ikey)=>Math.max(...deflShape(Mkey,Ikey).map(Math.abs));
    const camDC1=deflOf(s=>s.M1,'bare'), camDC2=deflOf(s=>s.M2,'c3N'), camDW=deflOf(s=>s.Mw,'c3N');
    const camber={camDC1,camDC2,camDW,camTot:camDC1+camDC2+camDW};
    // Breakdown by load (display only). DC1 on the bare steel is split into steel self-weight (+ diaphragm point loads) and the
    // rest of DC1 (deck slab + haunch + Add'l DC1), taken as M1 − M_steel so the two parts sum to M1 exactly. Imported DC1 is split
    // by the payload's M_DC1steel when present (GirderDetail, CF4), or by the self-weight ST-Girder adds (selfWeightExcluded); else not split.
    const dc1Split = !(useExt&&ext.hasDC1) ? 'app' : ext.swExcl ? 'swExcl' : ext.hasDC1split ? 'import' : 'none';
    const Msteel = st => dc1Split==='app' ? simpleM(Ld.wsw,st.x)+diaM(st.x) : dc1Split==='swExcl' ? swM(st.x) : dc1Split==='import' ? ext.M_DC1steel(st.x) : 0;
    const shDC1=deflShape(s=>s.M1,'bare'), shDC2=deflShape(s=>s.M2,'c3N'), shDW=deflShape(s=>s.Mw,'c3N');
    const shSW = dc1Split==='none' ? null : deflShape(Msteel,'bare');
    const shWet= dc1Split==='none' ? null : deflShape(s=>s.M1-Msteel(s),'bare');
    const shTot=camSt.map((_,i)=>shDC1[i]+shDC2[i]+shDW[i]);
    const argMax=a=>{ let j=0; a.forEach((v,i)=>{ if(Math.abs(v)>Math.abs(a[j])) j=i; }); return j; };
    camber.shape={x:camSt.map(s=>s.x), dc1Split, hasDia:dc1Split==='app'&&dph.length>0,
      sw:shSW, wet:shWet, dc1:shDC1, dc2:shDC2, dw:shDW, tot:shTot,
      splices:segP.filter(g=>g.x1>0.05&&g.x1<Lft-0.05).map(g=>g.x1)};
    camber.xDC1=camSt[argMax(shDC1)].x; camber.xTot=camSt[argMax(shTot)].x;   // CF3: locations of the maxima (headline)
    camber.camTotMax=Math.max(...shTot.map(Math.abs));    // largest per-station total (vs camTot = sum of the stage maxima)

    /* ---------- Fatigue (load-induced, 6.6.1 / 6.10.5) — fully worked ---------- */
    // Detail-category constants A (ksi³) and constant-amplitude fatigue threshold (ΔF)TH (ksi),
    // AASHTO Table 6.6.1.2.5-1 / 6.6.1.2.5-3.
    const CAT={A:{A:250e8,TH:24},B:{A:120e8,TH:16},"B'":{A:61e8,TH:12},C:{A:44e8,TH:10},
      "C'":{A:44e8,TH:12},D:{A:22e8,TH:7},E:{A:11e8,TH:4.5},"E'":{A:3.9e8,TH:2.6}};
    const fq=inp.fatigue||{};
    const fcat=CAT[fq.category]||CAT.C;
    const Acat=fcat.A, THcat=fcat.TH;
    // Single-lane fatigue distribution factor: prefer the LLDF-pulled value (loads.fatM); else the
    // one-lane moment DF ÷ 1.2 (removes the multiple-presence factor, LRFD 3.6.1.4.3b).
    // Exterior girder (STG-O5): the one-lane DF is the lever rule (Tables 4.6.2.2.2d-1 / 4.6.2.2.3b-1),
    // not less than the one-lane rigid-section value (4.6.2.2.2d); both carry m = 1.2, removed here.
    const dfX=Ld.df||{}, extFat=!!dfX.ext, extFat1=extFat? Math.max(dfX.lever||0, dfX.rigid1||0) : 0;
    const dfFat=(+inp.loads.fatM>0)? +inp.loads.fatM : (extFat? extFat1 : (Ld.df? Ld.df.m1:Ld.dfm))/1.2;
    const fatDfSource=(+inp.loads.fatM>0)?'LL & DL Distribution (single-lane)'
      :(extFat?'auto: exterior, max(lever rule, rigid section) for one lane ÷1.2':'auto: (1-lane moment DF)÷1.2');
    // Shear effects (stud shear range 6.10.10.1.2, web special fatigue 6.10.5.3) use the one-lane
    // SHEAR distribution factor ÷ 1.2 (4.6.2.2.3a, MPF removed per 3.6.1.4.3b), not the moment DF.
    // A single-lane shear DF pulled from LL & DL (loads.fatV, optional) takes precedence.
    const dfFatV=(+inp.loads.fatV>0)? +inp.loads.fatV : (extFat? extFat1 : (Ld.df? Ld.df.v1:Ld.dfv))/1.2;
    const fatDfVSource=(+inp.loads.fatV>0)?'LL & DL Distribution (single-lane shear)'
      :(extFat?'auto: exterior, max(lever rule, rigid section) for one lane ÷1.2':'auto: (1-lane shear DF v₁)÷1.2');
    // Single-lane fraction p of truck traffic (Table 3.6.1.4.2-1) → (ADTT)SL = p·ADTT.
    const pFrac = fq.lanes>=3?0.80 : fq.lanes==2?0.85 : 1.00;
    const adttRaw=+fq.ADTT||1000;
    const adttSL = (fq.adttIsSingleLane===false)? pFrac*adttRaw : adttRaw;
    const nCyc = +fq.ncyc||1.0;                               // cycles per truck passage (Table 6.6.1.2.5-2)
    const lifeYr = +fq.designLife||75;                        // fatigue design life (yr)
    const Nfat = 365*lifeYr*nCyc*adttSL;                      // total stress-range cycles (6.6.1.2.5-3)
    // Infinite-life crossover (basis of Table 6.6.1.2.3-2): Fatigue I (γ=1.75 vs (ΔF)TH) governs
    // over Fatigue II (γ=0.80 vs (A/N)^⅓) when (A/N)^⅓ ≤ (0.80/1.75)(ΔF)TH, i.e. when
    // (ADTT)SL ≥ A / [((0.80/1.75)(ΔF)TH)³ · 365 · Y · n]  (Cat C, 75 yr, n=1 → 1,684/day).
    const fatGRatio = 0.80/1.75;
    const adttSLcross = Acat/(Math.pow(fatGRatio*THcat,3)*365*lifeYr*nCyc);
    const recFatI = adttSL >= adttSLcross;                    // recommended limit state
    const lsMode = fq.lsMode || (fq.life==='finite'?'II':fq.life==='infinite'?'I':'auto');
    const fatInf = lsMode==='auto'? recFatI : (lsMode==='I');
    const gammaFat = fatInf?1.75:0.80;                        // load factor (Table 3.4.1-1)
    // Nominal fatigue resistance (6.6.1.2.5-1/-2): Fatigue I → (ΔF)TH; Fatigue II → (A/N)^⅓.
    // (The old "≥ ½(ΔF)TH" floor belonged to the pre-2009 single-load-factor format; it is not
    //  part of Eq. 6.6.1.2.5-2 for Fatigue II.)
    const FnFatII = Math.pow(Acat/Nfat,1/3);
    const FnFat = fatInf? THcat : FnFatII;
    let fatGov={dfRange:0,si:0}, webFatGov={r:0};
    const chartFat=[];                                        // per-station fatigue demands for the Fatigue tab charts
    const fatCalc=[];                                         // per-station worked-calc data (Fatigue location picker)
    // Imported fatigue envelopes (GirderDetail, HANDOFF.md §4.9; engineer-approved 2026-10-13): per girder, IM and the
    // single-lane fatigue DF already in. Then M_f = M_FAT+ − M_FAT− (the range, both signs on the short-term composite
    // section, 6.6.1.2.1), the web shear is the larger of |V_FAT+|, |V_FAT−|, and the stud range is V_FAT+ − V_FAT−.
    // Without them (built-in span, MIDAS / MCT imports) the simple-span fatigue truck below is used, as before.
    const fatImp=!!(useExt&&ext.hasFat), fatImpV=!!(useExt&&ext.hasFatV);
    stations.forEach(st=>{ const sg=segP[st.si];
      const fP=fatImp? ext.M_FATpos(st.x) : 0, fN=fatImp? ext.M_FATneg(st.x) : 0;
      const Mrange=fatImp? null : fatMomentAt(Lft,st.x);     // k-ft/lane, unfactored, no IM (built-in truck only)
      const Mf=fatImp? Math.max(fP,0)-Math.min(fN,0) : Mrange*1.15*dfFat;   // k-ft (IM 1.15, single-lane DF)
      const rng=Mf*12/sg.cN.Sb;                               // Δf, bottom-flange stress range (short-term composite)
      if(rng>fatGov.dfRange) fatGov={dfRange:rng,MfatR:Mf,MrangeR:Mrange,SbR:sg.cN.Sb,x:st.x,si:st.si};
      // special fatigue for webs (6.10.5.3): unfactored permanent + Fatigue I LL shear ≤ Vcr
      const Vperm=Math.abs(st.V1+st.V2+st.Vw);
      const Vll=fatImpV? Math.max(Math.abs(ext.V_FATpos(st.x)),Math.abs(ext.V_FATneg(st.x)))
        : fatShearAt(Lft,st.x)*1.15*dfFatV;                  // fatigue-truck shear, single-lane SHEAR DF, IM 1.15
      const Vf=Vperm+1.75*Vll;                                // Fatigue I factored (γ=1.75) per 6.10.5.3
      if(Vf/Vcr>webFatGov.r) webFatGov={r:Vf/Vcr,Vf,Vperm,Vll,x:st.x};
      chartFat.push({x:st.x, rng, Vf});
      fatCalc.push({x:st.x, si:st.si, Mrange, Mf, Sb:sg.cN.Sb, rng, gRng:gammaFat*rng,
        Vperm, Vll, Vf, dcFlex:gammaFat*rng/FnFat, dcWeb:Vf/Vcr, ...(fatImp?{fP,fN}:{})});
    });
    const dfRange=fatGov.dfRange, MfatR=fatGov.MfatR;
    const fatigue={cat:fq.category||'C', Acat, TH:THcat,
      dfRange, MfatR, MrangeR:fatGov.MrangeR, SbR:fatGov.SbR, gammaFat, FnFat, FnFatII,
      fatDC:gammaFat*dfRange/FnFat, fatInf, lsMode, recFatI, dfFat, fatDfSource, dfFatV, fatDfVSource, fatGRatio,
      adttRaw, adttSL, pFrac, lanes:fq.lanes||2, adttIsSingleLane:fq.adttIsSingleLane!==false,
      nCyc, lifeYr, Nfat, adttSLcross, xGov:fatGov.x, webFatGov, Vcr, fatCalc, fatImp, fatImpV};

    /* ---------- Stiffeners (6.10.11) ---------- */
    // stiffener yield strength (STG-A1): input stiff.Fys, default 50 ksi (the old fixed value)
    const Fys=(+inp.stiff.Fys>0)? +inp.stiff.Fys : 50;
    let tStiff=null;
    if(stiffened){ const bt=+inp.stiff.bt, tp=+inp.stiff.tp, do_=doSpc;
      // 6.10.11.1.2 projecting width: b_t >= 2.0 + D/30, and 16.0 t_p >= b_t >= b_f/4,
      // where b_f is the full width of the widest COMPRESSION flange within the panel.
      // b_f/4 is a LOWER bound on b_t, not an upper one, and the upper bound is 16 t_p —
      // 0.48 t_p sqrt(E/F_ys) is the BEARING-stiffener limit (6.10.11.2.2), not this one.
      const bfComp=hasNeg?Math.max(bft,bfb):bft;
      const btMinD=2.0+D/30, btMinF=bfComp/4;
      const btMin=Math.max(btMinD,btMinF), btMax=16.0*tp;
      const J=Math.max(2.5*Math.pow(D/do_,2)-2,0.5);
      // 6.10.11.1.3 moment of inertia. I_t1 uses b = the SMALLER of d_o and D (not D itself).
      // I_t2 is the stiffer requirement that applies when the panel is actually leaning on
      // tension-field action; the code interpolates between the two on rho_w, the fraction of
      // the tension-field capacity the design consumes above the C*Vp value.
      const bIt=Math.min(do_,D);
      const It1=bIt*Math.pow(tw,3)*J;
      const Fcrs=Math.min(0.31*Es/Math.pow(bt/tp,2),Fys);
      const rhoT=Math.max(Fyw/Fcrs,1.0);
      const It2=Math.pow(D,4)*Math.pow(rhoT,1.3)/40*Math.pow(Fyw/Es,1.5);
      const dV=phiv*VnInt-phiv*Vcr;
      const rhoW=dV>1e-9? clamp((VuPeak-phiv*Vcr)/dV,0,1) : 0;
      const tfaUsed=rhoW>0;
      const ItReq=It1+(It2-It1)*rhoW, ItProv=tp*Math.pow(bt,3)/3;
      tStiff={bt,tp,do_,btMin,btMax,btMinD,btMinF,bfComp,J,ItReq,ItProv,
              bIt,It1,It2,Fcrs,rhoT,rhoW,tfaUsed,
              minOK:bt>=btMin*0.9999, maxOK:bt<=btMax*1.0001,
              widthOK:(bt>=btMin*0.9999&&bt<=btMax*1.0001), ItOK:ItProv>=ItReq}; }
    // bearing stiffener
    const bb=+inp.stiff.bearB, tb=+inp.stiff.bearT, nb=+inp.stiff.bearN, clip=1.5;
    // 6.10.11.2.2 — bearing-stiffener projecting width
    const bbMax=0.48*tb*sqrt(Es/Fys);
    const Apn=Math.max(bb-clip,0)*tb*nb, RsbN=1.4*Apn*Fys;
    const Acol=nb*bb*tb+18*tw*tw, Icol=tb*Math.pow(nb*bb+tw,3)/12, rcol=sqrt(Icol/Math.max(Acol,1e-6));
    const KLr=0.75*D/Math.max(rcol,1e-6), lamC=Math.pow(KLr/Math.PI,2)*(Fys/Es);
    const Pn=(lamC<=2.25? Math.pow(0.658,lamC):0.877/lamC)*Fys*Acol, phic=0.95;
    const bearing={Apn,RsbN,Rreact:VuPeak,bearingOK:RsbN>=VuPeak,Pr:phic*Pn,axialOK:phic*Pn>=VuPeak,
                   rcol,KLr,bb,tb,nb,bbMax,widthOK:bb<=bbMax*1.0001,Fys};

    /* ---------- Shear connectors (6.10.10) ---------- */
    const Asc=Math.PI*Math.pow(+inp.conn.studD,2)/4, Fustud=60;
    const Qn=Math.min(0.5*Asc*sqrt(deck.fc*EcDeck), Asc*Fustud), phisc=0.85, Qr=phisc*Qn;
    const Pslab=0.85*deck.fc*beff*deck.ts, Psteel=Fyf*(bft*tft+bfb*tfb)+Fyw*D*tw;
    const Pshear=Math.min(Pslab,Psteel), nReq=Pshear/Qr;
    const nRow=+inp.conn.nRow, pitch=+inp.conn.pitch;
    const nProv=nRow*Math.floor((Lft*12/2)/Math.max(pitch,1));
    /* 6.10.10.2 -- the stud resistance branch has to be the one that goes with the
       limit state the rest of the app already decided on (Step 2 of the Fatigue
       tab): Fatigue I is the infinite-life check, Zr = 5.5d^2 (Eq. 6.10.10.2-1)
       against a shear range factored by gamma = 1.75; Fatigue II is the finite-life
       check, Zr = alpha*d^2 (Eq. 6.10.10.2-2) with gamma = 0.80. The old
       "alpha*d^2 >= 5.5d^2/2" floor belonged to the pre-2009 single-load-factor
       (0.75) format and must not be paired with gamma = 1.75. */
    const alphaF=Math.max(34.5-4.28*(Math.log(Nfat)/Math.LN10),0);
    const dStud2=Math.pow(+inp.conn.studD,2);
    const Zr=fatInf? 5.5*dStud2 : alphaF*dStud2;
    // Fatigue shear range per station (STG-O6): the FATIGUE truck (3.6.1.4.1, 30-ft rear axle spacing)
    // shear range V+max − V−min at each station, IM 1.15, one-lane shear DF, on the short-term
    // composite section of that station (6.10.10.1.2). The governing station is the one needing the
    // closest pitch. (Before: the HL-93 design-truck shear at the support, midspan section.)
    let fatStud=null;
    stations.forEach(st=>{ const sg=segP[st.si], cc=sg.cN;
      const yNA=(sg.bare.hs+deck.haunch+deck.ts/2)-cc.ybar, Q=(beff*deck.ts/n)*yNA;
      const rg=fatImpV? (()=>{ const vp=ext.V_FATpos(st.x), vn=ext.V_FATneg(st.x); return {Vpos:vp, Vneg:vn, range:vp-vn}; })()
        : fatShearRangeAt(Lft,st.x);
      const VfU=fatImpV? rg.range : rg.range*1.15*dfFatV, Vf=gammaFat*VfU, vsr=Vf*Q/cc.I;   // imported: per girder, IM + DF in
      const p_=nRow*Zr/Math.max(vsr,1e-6);
      if(!fatStud||p_<fatStud.pReq) fatStud={x:st.x,si:st.si,Vpos:rg.Vpos,Vneg:rg.Vneg,range:rg.range,VfatU:VfU,Vfat:Vf,Qslab:Q,Icomp:cc.I,Vsr:vsr,pReq:p_}; });
    const yDeckNA=(bare.hs+deck.haunch+deck.ts/2)-cN.ybar;
    const Qslab=fatStud.Qslab, VfatU=fatStud.VfatU, Vfat=fatStud.Vfat, Vsr=fatStud.Vsr, pReq=fatStud.pReq;
    // 6.10.10.4.2 (STG-O7): in a CONTINUOUS span (imported demands with factored −M) the studs between
    // the point of maximum positive moment and the centerline of an adjacent interior support must
    // develop P = Pp + Pn (straight girder: radial force F_p = 0), with
    //   Pp = min(0.85f'c·b_s·t_s, Fyw·D·tw + Fyt·b_ft·t_ft + Fyc·b_fc·t_fc)  at the max +M section,
    //   Pn = min(Fyw·D·tw + Fyt·b_ft·t_ft + Fyc·b_fc·t_fc, 0.45f'c·b_s·t_s)  at the interior support.
    // A span end is an interior support when the factored −M demand there is < −1 k-ft.
    // Provided studs are counted from the max +M station to each end at the given pitch.
    let contStud=null;
    if(contSpan && deck.deckOn){
      const stEnds=[stations[0],stations[stations.length-1]], xP=stPos.x, dimsP=segP[stPos.si].dims;
      const PpS=Fyw*D*tw+Fyf*(dimsP.bft*dimsP.tft+dimsP.bfb*dimsP.tfb), Pp=Math.min(Pslab,PpS);
      const sides=stEnds.map((se,k)=>{ const dS=segP[se.si].dims, pier=se.Mun<-1;
        const PnS=Fyw*D*tw+Fyf*(dS.bft*dS.tft+dS.bfb*dS.tfb), PnC=0.45*deck.fc*beff*deck.ts, Pn=pier?Math.min(PnS,PnC):0;
        const len=k===0? xP : Lft-xP, P=Pp+Pn, req=P/Qr, prov=nRow*Math.floor((len*12)/Math.max(pitch,1));
        return {end:k===0?'left':'right', pier, len, Pp, PnS, PnC, Pn, P, nReq:req, nProv:prov, r:req/Math.max(prov,1)}; });
      const gov=sides[0].r>=sides[1].r? sides[0] : sides[1];
      contStud={xP, Pp, PpS, Pslab, sides, gov};
    }
    const conn={Asc,Qn,Qr,Pshear,nReq,nProv,strOK:nProv>=nReq,Zr,Vsr,pReq,pitch,pitchOK:pitch<=pReq,nRow,
                Vfat,VfatU,gammaFat,fatInf,alphaF,Qslab,Icomp:fatStud.Icomp,dfFatV,Vtr:Ld.hl.Vtr,fatStud,contStud,yDeckNA,fatImpV};
    if(contStud) conn.strOK=contStud.gov.nProv>=contStud.gov.nReq;

    /* ---------- Load rating (LRFR, MBE) — station-based ---------- */
    const rf=(C,dc,dw,ll,g)=>ll>1e-6? (C-1.25*dc-1.5*dw)/(g*ll) : 99;
    // MBE 6A.4.2.1: strength capacity C = φc·φs·φ·Rn with φc·φs ≥ 0.85 (STG-O3). Inputs rate.phiC
    // (condition, Table 6A.4.2.3-1) and rate.phiS (system, Table 6A.4.2.4-1); both default 1.0.
    const rq=inp.rate||{};
    const phiC=(+rq.phiC>0)? +rq.phiC : 1.0, phiS=(+rq.phiS>0)? +rq.phiS : 1.0;
    const phiCS=Math.max(phiC*phiS,0.85), phiCSfloor=phiC*phiS<0.85;
    // Flexure (+M): capacity and demand at the SAME station, governing = lowest RF over the stations
    // (STG-O3). Compact → moment basis with this station's Mn (incl. the 1.3RhMy cap). Noncompact /
    // noncomposite → stress basis per flange with the staged moduli of stageF (DC1 bare, DC2/DW 3n,
    // LL n): RF = (φcφsφf·F − γDC·f_DC − γDW·f_DW)/(γLL·f_LL).
    const rfStress=(F,fd,fl,g)=>fl>1e-6? (phiCS*phif*F-fd)/(g*fl) : 99;
    let flexRow=null;
    stations.forEach(st=>{ if(!(st.Ml>1e-6)||!(st.Mu>0)) return; const sg=segP[st.si];   // positive-flexure stations
      let inv,opr,cap=null,basis;
      if(sg.compact){
        const fc=flexCalc.find(f=>f.x===st.x), MnSt=(fc&&fc.pos&&fc.pos.Mn!=null)? fc.pos.Mn : sg.Mn_kft;
        cap=phiCS*phif*MnSt; basis='Mp';
        inv=rf(cap,st.M1+st.M2,st.Mw,st.Ml,1.75); opr=rf(cap,st.M1+st.M2,st.Mw,st.Ml,1.35);
      } else {
        const fd=stageF(st,1.25,1.25,1.5,0).pos, fl=stageF(st,0,0,0,1).pos; basis='stress';
        inv=Math.min(rfStress(sg.FncPos,fd.fT,fl.fT,1.75), rfStress(sg.Fnt,fd.fB,fl.fB,1.75));
        opr=Math.min(rfStress(sg.FncPos,fd.fT,fl.fT,1.35), rfStress(sg.Fnt,fd.fB,fl.fB,1.35));
      }
      if(!flexRow||inv<flexRow.inv) flexRow={inv,opr,cap,basis,x:st.x,MDC:st.M1+st.M2,MDW:st.Mw,MLL:st.Ml};
    });
    if(!flexRow) flexRow={inv:99,opr:99,cap:null,basis:sgPos.compact?'Mp':'stress',x:stPos.x,MDC:stPos.M1+stPos.M2,MDW:stPos.Mw,MLL:stPos.Ml};
    const capM=flexRow.cap;
    const MDC=flexRow.MDC, MDWr=flexRow.MDW, MLLr=flexRow.MLL;
    // Shear: φcφs·φv·Vcr (end-panel basis, unchanged) against the demand at each station; lowest RF.
    let shRow=null;
    stations.forEach(st=>{ const dc=Math.abs(st.V1+st.V2), dw=Math.abs(st.Vw), ll=Math.abs(st.Vl);
      const inv=rf(phiCS*phiv*Vcr,dc,dw,ll,1.75);
      if(!shRow||inv<shRow.inv) shRow={inv,opr:rf(phiCS*phiv*Vcr,dc,dw,ll,1.35),x:st.x,VDC:dc,VDW:dw,VLL:ll}; });
    const VDC=shRow.VDC, VDWr=shRow.VDW, VLLr=shRow.VLL;
    const rating={
      flexInv:flexRow.inv, flexOpr:flexRow.opr, flexX:flexRow.x, flexBasis:flexRow.basis,
      shearInv:shRow.inv, shearOpr:shRow.opr, shearX:shRow.x,
      capM,capV:phiCS*phiv*Vcr,MDC,MDWr,MLLr,VDC,VDWr,VLLr,phiC,phiS,phiCS,phiCSfloor};
    if(hasNeg&&negBGov.r>0){ const stN=stations.reduce((b,st)=>st.Mun<b.Mun?st:b,stations[0]);
      const sgN=segP[stN.si];
      const fPerm=stageF(stN,1.25,1.25,1.5,0).neg.fB;         // factored permanent, compression (−)
      const fLL1=Math.abs(stN.Mln*12/sgN.cr.Sb);              // LL stress per γ=1.0
      rating.negInv=fLL1>1e-6? (phiCS*phif*sgN.FncNeg.Fnc-Math.abs(Math.min(fPerm,0)))/(1.75*fLL1):99;
      rating.negOpr=fLL1>1e-6? (phiCS*phif*sgN.FncNeg.Fnc-Math.abs(Math.min(fPerm,0)))/(1.35*fLL1):99;
      rating.negX=stN.x;
    }
    // Service II rating (MBE 6A.6.4.2.2, STG-O2): RF = (f_R − f_D)/(γLL·f_LL), f_R = 0.95RhFyf
    // (composite; 0.80RhFyf noncomposite, as the design check), γD = 1.0, γLL = 1.30 Inventory /
    // 1.00 Operating. Both flanges, +LL and −LL, every station; f_D in the direction of f_LL.
    let s2Row=null;
    stations.forEach(st=>{ const sg=segP[st.si], fR=s2Coef*sg.Rh*Fyf, s=stageF(st,1,1,1,1);
      const fD={fB:s.parts.dc.fB+s.parts.d2.fB+s.parts.dw.fB, fT:s.parts.dc.fT+s.parts.d2.fT+s.parts.dw.fT};
      [['bot +LL',fD.fB,s.parts.lp.fB],['top +LL',fD.fT,s.parts.lp.fT],['bot −LL',fD.fB,s.parts.ln.fB],['top −LL',fD.fT,s.parts.ln.fT]].forEach(([tag,fd,fl])=>{
        if(!(Math.abs(fl)>1e-6)) return; const sgn=Math.sign(fl), base=(fR-sgn*fd)/Math.abs(fl);
        if(!s2Row||base/1.30<s2Row.inv) s2Row={inv:base/1.30,opr:base/1.00,x:st.x,tag,fR,fD:sgn*fd,fLL:Math.abs(fl)}; }); });
    if(s2Row){ rating.servInv=s2Row.inv; rating.servOpr=s2Row.opr; rating.serv=s2Row; }
    rating.govInv=Math.min(rating.flexInv,rating.shearInv,rating.negInv??99,rating.servInv??99);
    rating.govOpr=Math.min(rating.flexOpr,rating.shearOpr,rating.negOpr??99,rating.servOpr??99);

    /* ---------- push remaining checks ---------- */
    checks.push({n:'Constr. comp flange (FLB/LTB/web)', t:'Cnstr FLB', v:constr.fbuTopC, lim:constr.FncC.Fnc, r:cGov.r, u:'ksi', ref:'6.10.3.2.1', loc:constr.xGov});
    checks.push({n:'Constr. tension flange', t:'Cnstr yld', v:cTenGov.f||0, lim:sgC.Rh*Fyf, r:cTenGov.r, u:'ksi', ref:'6.10.3.2.2', loc:cTenGov.x||0});
    if(cNegGov.r>0) checks.push({n:'Constr. −M bot flange (FLB/LTB/web)', t:'Cnstr −M', v:cNegGov.fbu, lim:cNegGov.Fnc.Fnc, r:cNegGov.r, u:'ksi', ref:'6.10.3.2.1', loc:cNegGov.x});
    checks.push({n:'Constr. shear', t:'Cnstr V', v:VcUmax, lim:Vcr, r:VcUmax/Vcr, u:'kip', ref:'6.10.3.3', loc:0});
    checks.push({n:'Fatigue — '+inp.fatigue.category+' detail', t:'Fatigue', v:gammaFat*dfRange, lim:FnFat, r:gammaFat*dfRange/FnFat, u:'ksi', ref:'6.6.1', loc:fatGov.x||Lft/2});
    checks.push({n:'Special fatigue — web (Vu≤Vcr)', t:'Fat web', v:webFatGov.Vf||0, lim:Vcr, r:webFatGov.r, u:'kip', ref:'6.10.5.3', loc:webFatGov.x||0});
    if(hasNeg){
      checks.push({n:'Neg flexure — bot flange (FLB/LTB)', t:'Neg flex', v:negBGov.fbu||0, lim:negBGov.Fnc?negBGov.Fnc.Fnc:1, r:negBGov.r, u:'ksi', ref:'6.10.8.2', loc:negBGov.x||0});
      if(negTGov.r>0) checks.push({n:'Neg flexure — top flange (tension)', t:'Neg tens', v:negTGov.fbu, lim:negTGov.lim, r:negTGov.r, u:'ksi', ref:'6.10.8.3', loc:negTGov.x});
      checks.push({n:'Long. deck reinf ≥ 1% (−M)', t:'1% rebar', v:neg.AsMin1pct, lim:neg.AsProv, r:neg.AsProv>0?neg.AsMin1pct/neg.AsProv:9, u:'in²', ref:'6.10.1.7', loc:negBGov.x||0});
    }
    if(tStiff){ checks.push({n:'Transverse stiffener It', t:'Trns stiff', v:tStiff.ItReq, lim:tStiff.ItProv, r:tStiff.ItReq/tStiff.ItProv, u:'in⁴', ref:'6.10.11.1', loc:0});
      // 6.10.11.1.2 projecting width: lower bound max(2+D/30, bf/4), upper bound 16tp
      checks.push({n:'Transverse stiffener width b_t ≥ min', t:'Stiff bt min', v:tStiff.btMin, lim:tStiff.bt, r:tStiff.btMin/Math.max(tStiff.bt,1e-6), u:'in', ref:'6.10.11.1.2', loc:0});
      checks.push({n:'Transverse stiffener width b_t ≤ 16t_p', t:'Stiff bt max', v:tStiff.bt, lim:tStiff.btMax, r:tStiff.bt/Math.max(tStiff.btMax,1e-6), u:'in', ref:'6.10.11.1.2', loc:0}); }
    // 6.10.9.3.3 end-panel stiffener spacing d_o ≤ 1.5D (only when the web is treated as stiffened)
    if(stiffened) checks.push({n:'End-panel stiffener spacing d_o ≤ 1.5D', t:'End panel', v:doRaw, lim:doEndMax, r:doRaw/doEndMax, u:'in', ref:'6.10.9.3.3', loc:0});
    checks.push({n:'Bearing stiffener', t:'Brg stiff', v:VuPeak, lim:Math.min(RsbN,phic*Pn), r:VuPeak/Math.min(RsbN,phic*Pn), u:'kip', ref:'6.10.11.2', loc:0});
    checks.push({n:'Bearing stiffener width b_b ≤ 0.48t_b√(E/F_ys)', t:'Brg bb', v:bb, lim:bbMax, r:bb/Math.max(bbMax,1e-6), u:'in', ref:'6.10.11.2.2', loc:0});
    if(contStud) checks.push({n:'Shear studs — strength (continuous, P = Pp + Pn, '+contStud.gov.end+' side)', t:'Studs str', v:contStud.gov.nReq, lim:contStud.gov.nProv, r:contStud.gov.r, u:'#', ref:'6.10.10.4.2', loc:contStud.gov.end==='left'?0:Lft});
    else checks.push({n:'Shear studs — strength', t:'Studs str', v:nReq, lim:nProv, r:nReq/Math.max(nProv,1), u:'#', ref:'6.10.10.4', loc:0});
    checks.push({n:'Shear studs — fatigue pitch', t:'Studs fat', v:pitch, lim:pReq, r:pitch/pReq, u:'in', ref:'6.10.10.2', loc:fatStud.x||0});

    /* ---------- Deck design (transverse, LRFD 4.6.2.1 / 9.7.3) ---------- */
    let deckD=null;
    if(deck.deckOn && inp.deck.designOn){
      deckD=deckDesign(inp,LFc);   // GD49 deck: the owner Strength I factors (1.25, 1.50, 1.75 without owner rules)
      checks.push({n:'Deck +M (bottom bars)', t:'Deck +M', v:deckD.Mu_pos, lim:deckD.pos.phiMn, r:deckD.pos.dc, u:'k-ft/ft', ref:'9.7.3', loc:0});
      checks.push({n:'Deck −M (top bars)', t:'Deck −M', v:deckD.Mu_neg, lim:deckD.neg.phiMn, r:deckD.neg.dc, u:'k-ft/ft', ref:'9.7.3', loc:0});
      checks.push({n:'Deck overhang', t:'Deck OH', v:deckD.Mu_oh, lim:deckD.ohCap.phiMn, r:deckD.ohCap.dc, u:'k-ft/ft', ref:'13.4', loc:0});
    }

    checks.push({n:'Strength flexure (+M)', t:'Flexure', v:sgPos.compact?stations[stations.findIndex(s=>s.x===posGov.x)]?.Mu||MuPeak:(posGov.fGov??flex.fbuBot), lim:sgPos.compact?phif*MnGov:phif*(posGov.FGov??sgPos.Fnt), r:posGov.r, u:sgPos.compact?'k-ft':'ksi', ref:'6.10.7', loc:posGov.x||Lft/2});
    // 6.10.7.3 applies to every COMPOSITE section in positive flexure, compact or noncompact.
    if(deck.deckOn) checks.push({n:'Ductility Dp≤0.42Dt', t:'Ductility', v:sgPos.pl.Dp, lim:0.42*sgPos.pl.Dt, r:sgPos.pl.Dp/(0.42*sgPos.pl.Dt), u:'in', ref:'6.10.7.3', loc:posGov.x||Lft/2});
    checks.push({n:'Strength shear', t:'Shear', v:VuPeak, lim:phiv*Vcr, r:shearDC, u:'kip', ref:'6.10.9', loc:shearR.xGov});

    // PNA-OOS: no result for the checks that use M_p / D_p / D_cp — Strength I +M flexure (M_p, or R_b from D_cp on the
    // stress basis) and ductility (D_p) — nor for the +M and governing load ratings. They read OUT OF SCOPE (pass false).
    if(oos){
      checks.forEach(c=>{ if(c.t==='Flexure'||c.t==='Ductility'){ c.oos=true; c.v=NaN; c.lim=NaN; c.r=NaN; } });
      flex.oos=true; flex.flexDC=NaN; flex.phiMnRep=NaN; flex.ductOK=false;
      rating.oos=true; rating.flexInv=NaN; rating.flexOpr=NaN; rating.flexBasis='oos'; rating.capM=null;
      rating.govInv=NaN; rating.govOpr=NaN;
    }
    const checksF=checks.map(c=>({...c,loc:c.loc||0,pass:c.r<=1.0001}));
    // GD49: the owner's design rating target (inventory RF of the HL-93 design-load rating; reported, not a check of this list)
    rating.target= OWN.rt? {rf:OWN.rt, inv:rating.govInv, pass:isFinite(rating.govInv)&&rating.govInv>=OWN.rt-1e-9, cite:OWN.cite.rt, fat:OWN.rtFat} : null;

    /* ---------- warnings for effects not computed (display only) ---------- */
    const warnings={fl:[],fat:[]};
    const skewDeg=+inp.loads.skew||0;
    // STG-O1: f_l is taken as 0 in 6.10.3.2 (constructibility), 6.10.4.2.2 (Service II) and 6.10.7/6.10.8 (Strength).
    if(skewDeg>20) warnings.fl.push('Flange lateral bending f\u2113 not computed: skew = '+fmt(skewDeg,1)+'\u00b0 > 20\u00b0. Cross-frame forces in skewed bridges cause f\u2113 (C6.10.1, verify), which this app takes as 0 in the constructibility, Service II and Strength flange checks. Determine f\u2113 from a refined analysis or an approximate method and check the flanges by hand.');
    if(inp.loads.pos==='exterior') warnings.fl.push('Flange lateral bending f\u2113 not computed: exterior girder. The deck-overhang brackets load the top flange laterally during the deck pour (6.10.3.4 / C6.10.3.4), and wind on the fascia adds f\u2113 (4.6.2.7). This app takes f\u2113 = 0; check the constructibility and Strength flange stresses with f\u2113 separately.');
    if(warnings.fl.length) warnings.fl.push('The app assumes a straight girder; a horizontally curved girder needs f\u2113 from curvature (4.6.1.2.4) and is outside its scope.');
    // STG-O8: the imported envelopes carry no fatigue demands -- unless they do (GirderDetail export, HANDOFF.md §4.9).
    if(useExt&&fatImp) warnings.fat.push('Fatigue from the imported fatigue envelopes ('+((inp.external&&inp.external.producer)||'import')+': fatigue truck, IM and single-lane fatigue distribution factors included): bottom-flange stress range = (M_FAT+ \u2212 M_FAT\u2212)/S_b on the short-term composite section for both signs (6.6.1.2.1; requires shear connectors throughout and the 6.10.1.7 deck reinforcement)'+(fatImpV?', web special fatigue and stud fatigue pitch from the imported fatigue shears':'; no fatigue shears imported, so the web special fatigue and stud pitch still use the fatigue truck on a simple span of L = '+fmt(Lft,1)+' ft')+'. The top flange and its attachments and the deck reinforcement at interior piers are not checked here.');
    else if(useExt) warnings.fat.push('Imported MIDAS demands: the fatigue checks still use the fatigue truck on a SIMPLE span of L = '+fmt(Lft,1)+' ft (flange stress range, web special fatigue, stud pitch). Negative-moment fatigue at interior piers (top flange and its welded attachments, deck reinforcement) is not checked'+(hasNeg?', although this span has negative moment':'')+'. Check those details with a fatigue-truck range from the continuous analysis.');

    return {ok:true, sec, matR, deck, deckIn:deck0, lf:{...OWN,...LFc,plOn}, geom, beff, n, nRaw, EcDeck,
      bare, cN, c3N, pl, compact, compactWeb, compactMat, compactDtw, lambdaPw,
      Rh, Rb, ductOK, Iyc, Iyt, IycIyt, My_bareTop, My_bareBot,
      loads:Ld, hl:Ld.hl, df:Ld.df, dfm:Ld.dfm, dfv:Ld.dfv, MLL:Ld.MLL, VLL:Ld.VLL,
      segP, stations, useExt, ext, hasNeg, neg,
      stress, diag, flex, shearR, constr, camber, fatigue, tStiff, bearing, conn, rating, deckD,
      chartS2, chartFlex, chartFat, flexCalc, shearCalc, warnings,
      checks:checksF, ...(swCont?{swCont}:{}), ...(oos?{pnaOOS}:{})};
  }catch(e){ return {ok:false, error:e.message}; }
}

/* ================= UI PRIMITIVES (ported from PS-Girder) ================= */
const Card=({title,refTag,right,children,id})=>(
  <div className="card" id={id}><div className="card-h"><span className="t">{title}</span>
    <span style={{display:'flex',gap:8,alignItems:'center'}}>{right}{refTag&&<span className="ref">{refTag}</span>}</span></div>
  <div className="card-b">{children}</div></div>);
const Num=({l,u,v,set,step=0.1,min,driven,src})=>(
  <div className="fld"><label>{l}</label><div className="fwrap">
    <input type="number" step={step} min={min} value={v}
      readOnly={!!driven} title={driven?('Driven by '+(src||'a locked shared channel')+' — unlock to edit.'):undefined}
      className={driven?'bl-driven':undefined}
      onChange={e=>{ if(driven) return; set(e.target.value===''?'':+e.target.value); }}/>
    {u&&<span className="unit">{u}</span>}</div>

const Sel=({l,v,set,opts})=>(
  <div className="fld"><label>{l}</label><div className="fwrap">
    <select value={v} onChange={e=>set(e.target.value)}>{opts.map(o=><option key={o}>{o}</option>)}</select></div></div>);
const Seg=({opts,v,set})=>(
  <span className="seg">{opts.map(o=><button key={o.v} className={v===o.v?'on':''} onClick={()=>set(o.v)}>{o.l}</button>)}</span>);
const KV=({rows})=>(
  <div className="kv">{rows.map((r,i)=><React.Fragment key={i}>
    <span className="k">{r[0]}</span><span className="dots"></span><span className="v">{r[1]}{r[2]&&<span style={{color:'var(--ink2)',fontWeight:400}}> {r[2]}</span>}</span>
  </React.Fragment>)}</div>);
const Tbl=({head,rows,cls})=>(
  <div className="scrollx"><table className={'eng '+(cls||'')}>
    <thead><tr>{head.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
    <tbody>{rows.map((r,i)=><tr key={i} className={r._cls||''}>{r.c.map((c,j)=>
      <td key={j} className={c&&c.cls||''}>{c&&c.v!==undefined?((c.v==='PASS'||c.v==='FAIL')&&(c.cls==='ok'||c.cls==='no')?<span className={'badge '+(c.cls==='ok'?'pass':'fail')}>{c.v}</span>:c.v):c}</td>)}</tr>)}</tbody>
  </table></div>);
const PF=ok=>({v:ok?'PASS':'FAIL',cls:ok?'ok':'no'});
// Ratio bar (GirderDetail scorecard style): 0 to 1.25 scale, tick at 1.0; the printed ratio text is unchanged.
const RBar=({r,pass,t})=>(<span className={'rbar '+(pass?'p':'f')}><span className="rb-t"><i className={pass?'':'f'} style={{width:(isFinite(r)?Math.min(100,Math.max(0,r/1.25*100)):0)+'%'}}/></span><span className="rb-v">{t}</span></span>);
const Tx=String.raw;
const nx=(v,d=2)=>{ if(v===undefined||v===null||!isFinite(v))return '\\text{--}';
  const neg=v<0; let s=Math.abs(+v).toFixed(d);

const TeX=({s,d})=>{ let h=null;

const ML=({s})=><div className="mline"><TeX d s={s}/></div>;

// Collapsible variable table (symbol · description · value · unit) — ported from PS-Beam.
const VarTable=({title,rows})=>{
  const fmtV=v=>{ if(v==null) return '—'; if(typeof v!=='number') return v;
    if(!isFinite(v)) return '—';
    const a=Math.abs(v); const d=a>=1000?0:a>=100?1:a>=1?2:3;
    return v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); };
  return <details open className="vartable">
    <summary>{title||'Variables used in this section'}</summary>
    <table className="eng" style={{width:'100%',marginTop:6}}>
      <thead><tr><th style={{width:'16%'}}>Symbol</th><th style={{width:'50%',textAlign:'left'}}>Description</th><th style={{width:'18%',textAlign:'right'}}>Value</th><th style={{width:'16%'}}>Unit</th></tr></thead>

        <td className="wsym">{r[0]}</td>

        <td className="wunit">{r[3]||''}</td>
      </tr>)}</tbody>

};
// Derivation card: a titled Card whose body holds Step/ML worked calculations.
const Deriv=({title,refTag,right,children,id})=>{
  // Presentation only: children from each <SG> up to the next <SG> are wrapped in one block (GirderDetail eq-block look).
  const out=[]; let grp=null;
  React.Children.toArray(children).forEach(ch=>{
    if(ch&&ch.type===SG){ grp=[ch]; out.push(grp); }
    else if(grp) grp.push(ch); else out.push(ch); });
  return <Card id={id} title={title} refTag={refTag} right={right}><div style={{padding:'2px 0 0'}}>
    {out.map((o,i)=>Array.isArray(o)?<div key={'sg'+i} className="sg-block">{o}</div>:o)}</div></Card>; };
/* Links from a quoted value to the card where it is worked (CLAUDE.md §6; display only). On screen a link switches
   to that tab (and flange segment) and scrolls to the card; in the calculation report it reads "see §n.k" (the numbered
   subsection, an internal link that prints as text). Targets: tab, card id, report key, label. */
const DL_T={
  trans:{tab:'section',id:'stg-d-trans',cr:'props.trans',l:'Section Props · Transformed sections'},
  plastic:{tab:'section',id:'stg-d-plastic',cr:'props.plastic',l:'Section Props · Plastic moment'},
  cls:{tab:'section',id:'stg-d-cls',cr:'props.cls',l:'Section Props · Classification & stability factors'},
  segs:{tab:'section',id:'stg-d-segs',cr:'props.seg',l:'Section Props · Properties by flange segment'},
  menv:{tab:'diagrams',id:'stg-d-menv',cr:'dem.effects',l:'Diagrams · Moment envelope'},
  venv:{tab:'diagrams',id:'stg-d-venv',cr:'dem.effects',l:'Diagrams · Shear envelope'},
  flexpos:{tab:'flexure',id:'stg-d-flexpos',cr:'flex.pos',l:'Flexure · Positive-flexure resistance'},
  flexneg:{tab:'flexure',id:'stg-d-flexneg',cr:'flex.neg',l:'Flexure · Negative flexure'},
  shear:{tab:'shear',id:'stg-d-shear',cr:'shear.res',l:'Shear · Shear resistance'},
  s2:{tab:'stresses',id:'stg-d-s2',cr:'serv.s2',l:'Stresses · Service II buildup'},
};
const sgI=(R,si)=>(R&&R.segP&&R.segP.length>1&&si!=null)? si : null;   // name a segment only when there are several
const CrRefCtx=React.createContext(null);   // set by CalcDoc: {map: report key -> {n, id}, idp, midSeg}
function stgGoto(to,seg){ const T=DL_T[to]; if(!T) return;
  try{ window.dispatchEvent(new CustomEvent('stg-goto',{detail:{tab:T.tab,id:T.id,seg:seg==null?null:seg}})); }catch(e){} }
function DLinks({items,lead}){
  const rc=React.useContext(CrRefCtx);
  const its=(items||[]).filter(it=>it&&DL_T[it.to]);
  if(!its.length) return null;
  if(rc){ // report: "see §n.k"; a value of another segment than the worked one points to the per-segment table
    const parts=its.map(it=>{ const T=DL_T[it.to];
      const k=(it.seg!=null&&it.seg!==rc.midSeg&&/^props\.(trans|plastic|cls)$/.test(T.cr))? 'props.seg' : T.cr, num=rc.map[k];
      return {what:it.what, num, seg:k==='props.seg'&&it.seg!=null?it.seg:null, l:T.l}; });
    return <div className="dl-row">{parts.map((q,i)=><React.Fragment key={i}>{i?'; ':''}{q.what}: {q.num
      ? <a className="dl" href={'#'+rc.idp+q.num.id} onClick={crJump}>see §{q.num.n}{q.seg!=null?' (segment '+(q.seg+1)+')':''}</a>
      : <span>{q.l} tab</span>}</React.Fragment>)}.</div>; }
  return <div className="dl-row noprint">{lead||'Worked in:'} {its.map((it,i)=>{ const T=DL_T[it.to];
    return <React.Fragment key={i}>{i?' · ':''}<button type="button" className="dl" onClick={()=>stgGoto(it.to,it.seg)}
      title={'Open '+T.l}>{it.what} → {T.l}{it.seg!=null?', segment '+(it.seg+1):''}</button></React.Fragment>; })}</div>;
}
