/* ================= SVG DRAWINGS ================= */
function CrossSection({R}){
  const {sec,cN,pl}=R, deck=R.deckIn? {...R.deck, haunch:+R.deckIn.haunch} : R.deck;   // GD49: drawn with the haunch as entered (properties may use 0)
  const segMid=R.segP? (R.segP.find(g=>R.geom.L/2<=g.x1+1e-9)||R.segP[0]) : null;
  const {D,tw,bft,tft,bfb,tfb}=segMid? {D:sec.D,tw:sec.tw,...segMid.dims} : sec;
  const hs=tfb+D+tft;
  const deckOn=deck.deckOn;
  const totH=hs+(deckOn?deck.haunch+deck.ts:0);
  const maxW=Math.max(bft,bfb,deckOn?Math.min(deck.beff,3.2*Math.max(bft,bfb)):0);
  const pad=34, W=340, H=380;
  const sx=(W-2*pad)/maxW, sy=(H-2*pad)/totH, s=Math.min(sx,sy);
  const cx=W/2;
  const yTop=pad;                                   // pixel y of top of drawing (top of slab)
  // convert model y-from-bottom to pixel (invert)
  const pyB=b=>yTop+(totH-b)*s;                     // b = height from bottom fiber
  const rect=(xC,w,y0,y1,fill,stroke)=>(
    <rect x={cx-w*s/2} y={pyB(y1)} width={w*s} height={(y1-y0)*s} fill={fill} stroke={stroke||'var(--ink)'} strokeWidth={1}/>);
  const drawBeff=deckOn?Math.min(deck.beff,3.2*Math.max(bft,bfb)):0;
  // PNA line: pl.PNA is measured downward from top of slab
  const pnaFromBottom=totH-pl.PNA;
  return (<div>
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxHeight:400}}>
      {/* deck slab */}
      {deckOn && <g>
        <rect x={cx-drawBeff*s/2} y={pyB(hs+deck.haunch+deck.ts)} width={drawBeff*s}
          height={deck.ts*s} fill="var(--deck)" opacity="0.35" stroke="var(--ink2)" strokeWidth={1}/>
        {/* haunch */}
        <rect x={cx-Math.max(bft,6)*s/2} y={pyB(hs+deck.haunch)} width={Math.max(bft,6)*s}
          height={deck.haunch*s} fill="var(--deck)" opacity="0.25" stroke="var(--ink2)" strokeWidth={0.6}/>
      </g>}
      {/* steel */}
      {rect(cx,bft,hs-tft,hs,'var(--steel)')}
      {rect(cx,tw,tfb,tfb+D,'var(--steel)')}
      {rect(cx,bfb,0,tfb,'var(--steel)')}
      {/* elastic NA (composite short-term) */}
      <line x1={cx-maxW*s/2} y1={pyB(cN.ybar)} x2={cx+maxW*s/2} y2={pyB(cN.ybar)}
        stroke="var(--blue)" strokeWidth={1} strokeDasharray="5 3"/>
      <text x={cx+maxW*s/2-2} y={pyB(cN.ybar)-3} fontSize="8" textAnchor="end" fill="var(--blue)" fontFamily="var(--mono)">ENA (n)</text>
      {/* PNA (not drawn when it falls below the web: outside the scope of this app, PNA-OOS) */}
      {pl.belowWeb
        ? <text x={cx-maxW*s/2+2} y={pyB(0)+10} fontSize="8" fill="var(--fail)" fontFamily="var(--mono)">PNA below the web · out of scope</text>
        : <React.Fragment><line x1={cx-maxW*s/2} y1={pyB(pnaFromBottom)} x2={cx+maxW*s/2} y2={pyB(pnaFromBottom)}
        stroke="var(--fail)" strokeWidth={1} strokeDasharray="2 2"/>
      <text x={cx-maxW*s/2+2} y={pyB(pnaFromBottom)-3} fontSize="8" fill="var(--fail)" fontFamily="var(--mono)">PNA · {pl.region}</text></React.Fragment>}
    </svg>
    <div className="viewlabel">COMPOSITE CROSS-SECTION · looking upstation</div>
  </div>);
}
function Elevation({R}){
  const {geom,sec}=R;
  const L=geom.L, Lb=geom.Lb;
  const pad=26, W=360, H=120, yb=H-40;
  const sx=(W-2*pad)/L;
  const px=x=>pad+x*sx;
  const braces=[]; for(let x=0;x<=L+1e-6;x+=Lb){ braces.push(Math.min(x,L)); }
  return (<div>
    <svg viewBox={`0 0 ${W} ${H}`} width="100%">
      {/* girder */}
      <rect x={px(0)} y={yb-26} width={px(L)-px(0)} height={26} fill="var(--steel)" opacity="0.85" stroke="var(--ink)"/>
      {/* bearings */}
      <polygon points={`${px(0)},${yb} ${px(0)-6},${yb+9} ${px(0)+6},${yb+9}`} fill="var(--ink)"/>
      <polygon points={`${px(L)},${yb} ${px(L)-6},${yb+9} ${px(L)+6},${yb+9}`} fill="var(--ink)"/>
      {/* brace points */}
      {braces.map((x,i)=><line key={i} x1={px(x)} y1={yb-30} x2={px(x)} y2={yb-26}
        stroke="var(--blue)" strokeWidth={1.4}/>)}
      {/* flange transitions */}
      {R.segP&&R.segP.length>1&&R.segP.slice(0,-1).map((g,i)=><g key={'t'+i}>
        <line x1={px(g.x1)} y1={yb-26} x2={px(g.x1)} y2={yb} stroke="var(--fail)" strokeWidth={1.2} strokeDasharray="3 2"/>
        <text x={px(g.x1)} y={yb-32} fontSize="7.5" textAnchor="middle" fill="var(--fail)" fontFamily="var(--mono)">SPL</text></g>)}
      {R.useExt&&<text x={px(L)-4} y={yb-32} fontSize="8" textAnchor="end" fill="var(--cyan)" fontFamily="var(--mono)">→ continuous</text>}
      <line x1={px(0)} y1={yb+16} x2={px(L)} y2={yb+16} stroke="var(--ink2)" strokeWidth={0.6}/>
      <text x={(px(0)+px(L))/2} y={yb+27} fontSize="9" textAnchor="middle" fill="var(--ink2)" fontFamily="var(--mono)">L = {fmt(L,1)} ft · brace @ {fmt(Lb,1)} ft</text>
    </svg>
    <div className="viewlabel">ELEVATION · {R.useExt?'continuous member span':'simple span'} · ▲ braces {R.segP&&R.segP.length>1?'· ┊ flange splices':''}</div>
  </div>);
}

/* Shows whether the INTERIOR/EXTERIOR position is being driven by the shared design
   beam or has been overridden by hand here. Clicking the override tag hands control
   back to the design beam. */
function PosTag({inp,set}){
  const {sel}=useDesignBeam();
  if(!sel||!sel.type) return null;
  const want=(sel.type==='ext')?'exterior':'interior';
  if(inp.loads.posAuto!==false)
    return <span style={{fontSize:10.5,fontFamily:'var(--mono)',color:'var(--ink2)',whiteSpace:'nowrap'}}
      title={'Following the shared design beam '+sel.label+(sel.clsLabel?' — '+sel.clsLabel:'')+'.'}>↳ {sel.label}</span>;
  return <span style={{fontSize:10.5,fontFamily:'var(--mono)',color:'#B45309',whiteSpace:'nowrap',cursor:'pointer',textDecoration:'underline dotted'}}
    title={'Overridden here. The shared design beam '+sel.label+(sel.clsLabel?' ('+sel.clsLabel+')':'')+' is an '+want+' girder — click to follow it again.'}
    onClick={()=>set({...inp,loads:{...inp.loads,pos:want,posAuto:true}})}>⚑ overridden · follow {sel.label}</span>;
}

/* ================= TABS ================= */
/* ===== Shared-channel resolvers, hoisted to module scope =====
   These used to live inside InputsTab. React unmounts InputsTab the moment you
   switch to any other tab, which took the locked-channel auto-sync effects down
   with it: a lock looked "live" but quietly stopped following its publisher
   until you navigated back to Inputs. The resolve/apply logic now sits here so
   one implementation serves both the Inputs-tab UI and the always-mounted
   <LockAutoSync/> at the app root. */
function extActiveOf(inp){ const e=inp&&inp.external;
  return !!(e&&(e._schema==='psbeam-external-demands'||e._schema==='stgirder-external-demands'||e._schema==='steelbeam-external-demands')); }
function lldfResolveFor(inp){
  const loads=inp.loads;
    let raw=null; try{raw=localStorage.getItem('bridgeSuite.v1.lldf');}catch(e){}
    if(!raw) return {why:'No distribution-factor results found.\n\nOpen the LL & DL Distribution app, compute the factors, and click "Send DFs to Design Apps" — then pull here.'};
    let d; try{ d=JSON.parse(raw); }catch(e){ return {why:'Could not read LLDF data: '+(e&&e.message||e)}; }
    if((d.schemaVersion||1)>1) return {why:'LL & DL Distribution data is v'+d.schemaVersion+'; this app supports v1. Update ST-Girder.'};
    // CIP slab (lldf perFootStrip): factors per 1-ft strip of slab width, not per girder. Refused (HANDOFF.md §4.3).
    if(d.perFootStrip===true) return {why:'The published distribution factors are for a cast-in-place slab: they are per 1-ft strip of slab width (AASHTO LRFD 4.6.2.3), not per girder. ST-Girder needs girder factors, so nothing was applied.\n\nRecompute in LL & DL Distribution with the girder cross-section type, then send again.'};
    // Prefer the specific beam selected in the shared design-beam channel: its own DFs,
    // not the interior/exterior envelope. Fall back to the envelope when no beam is
    // selected, or when the published results predate the per-beam breakdown.
    const want=(loads.pos==='exterior')?'exterior':'interior';
    const BB=window.BridgeBeam, dbeam=BB?BB.get():null;
    const bkey=dbeam?String(dbeam.index):null;
    const byB=d.governing&&d.governing.byBeam, byBn=d.governingNeg&&d.governingNeg.byBeam;
    const perBeam=!!(bkey&&byB&&byB[bkey]&&byB[bkey].gM!=null);
    const src=perBeam?(dbeam.label+' — '+(dbeam.clsLabel||want)):('governing '+want+' girder');
    const gov=perBeam?byB[bkey]:(d.governing&&d.governing[want]);
    if(!gov||gov.gM==null) return {why:'The published LLDF results have no '+want+'-girder values.'};
    const govN=perBeam?(byBn&&byBn[bkey]):(d.governingNeg&&d.governingNeg[want]);
    const gMpos=+(+gov.gM).toFixed(4);
    const gMneg=(govN&&govN.gM!=null)?+(+govN.gM).toFixed(4):gMpos;   // −M region DF (½-span L); falls back to +M
    const gV=+(+gov.gV).toFixed(4);
    const fatM=(gov.fatM!=null)?+(+gov.fatM).toFixed(4):0;            // single-lane fatigue DF (no MPF)
    const fatV=(gov.fatV!=null)?+(+gov.fatV).toFixed(4):0;            // single-lane fatigue SHEAR DF (no MPF); 0 = not published
    return {d,src,gMpos,gMneg,gV,fatM,fatV,hasNeg:!!govN,at:d.producedAt||'',project:d.project||''};
}

const LLDF_LABELS={extDFpos:'DF +M',extDFneg:'DF −M',extDFv:'DF V',extLLmpf:'MPF',fatM:'fatigue DF',fatV:'fatigue shear DF',dfm:'DFm',dfv:'DFv'};
const LLDF_DIG={extDFpos:3,extDFneg:3,extDFv:3,extLLmpf:2,fatM:3,fatV:3,dfm:3,dfv:3};
function lldfMineFor(inp){ const loads=inp.loads; return extActiveOf(inp)
  ? {extDFpos:+loads.extDFpos, extDFneg:+loads.extDFneg, extDFv:+loads.extDFv, extLLmpf:+loads.extLLmpf, fatM:+loads.fatM, fatV:+loads.fatV||0}
  : {dfm:+loads.dfm, dfv:+loads.dfv, fatM:+loads.fatM, fatV:+loads.fatV||0}; }
function lldfTheirsFor(inp,r){ return extActiveOf(inp)
  ? {extDFpos:r.gMpos, extDFneg:r.gMneg, extDFv:r.gV, extLLmpf:1.0, fatM:r.fatM, fatV:r.fatV||0}
  : {dfm:r.gMpos, dfv:r.gV, fatM:r.fatM, fatV:r.fatV||0}; }
function applyLLDFTo(set,inp,r){
  const t=lldfTheirsFor(inp,r);
  if(extActiveOf(inp)) set(p=>({...p, loads:{...p.loads, extDFpos:t.extDFpos, extDFneg:t.extDFneg, extDFv:t.extDFv, extLLmpf:t.extLLmpf, fatM:t.fatM, fatV:t.fatV}}));
  else set(p=>({...p, loads:{...p.loads, llAuto:true, dfAuto:false, dfm:t.dfm, dfv:t.dfv, fatM:t.fatM, fatV:t.fatV}}));
}
function dlResolveFor(inp){
    let raw=null; try{raw=localStorage.getItem('bridgeSuite.v1.dlLoads');}catch(e){}
    if(!raw) return {why:'No dead-load distribution found.\n\nOpen the LL & DL Distribution app, run the dead-load distribution, and click "Send DL to MCT Loads" — then pull here.'};
    let d; try{ d=JSON.parse(raw); }catch(e){ return {why:'Could not read dead-load data: '+(e&&e.message||e)}; }
    if((d.schemaVersion||1)>1) return {why:'LL & DL dead-load data is v'+d.schemaVersion+'; this app supports v1. Update ST-Girder.'};
    const by={}; (d.cases||[]).forEach(function(c){ by[c.key]=+c.udl||0; });
    // publishDL drops zero cases, so an absent DC2/DW means "the LL & DL app has
    // nothing for it" — which is NOT the same as "it is zero". Only the cases
    // actually published are driven; anything missing stays under manual control
    // rather than being silently zeroed out.
    if(by.DC2==null&&by.DW==null) return {why:'The published dead-load cases contain no DC2 or DW.'};
    const b=d.beam||{};
    const src=b.label?(b.label+(b.clsLabel?(' — '+b.clsLabel):'')):'LL & DL Distribution';
    return {d, src:src, hasBar:by.DC2!=null, hasDW:by.DW!=null,
      wBar:+(+(by.DC2||0)).toFixed(4), wDW:+(+(by.DW||0)).toFixed(4),
      dc1:+(+(by.DC1||0)).toFixed(4), pl:+(+(by.PL||0)).toFixed(4),
      selfWt:+d.selfWt||0, trib:+b.trib||0, at:d.producedAt||'', project:d.project||''};
}

const DL_LABELS={wBar:'DC2 barrier / SIDL',wDW:'DW wearing surface'};
const DL_DIG={wBar:3,wDW:3};
function dlMineFor(inp){ return {wBar:+inp.loads.wBar, wDW:+inp.loads.wDW}; }
function dlTheirsFor(r){ const o={}; if(r.hasBar) o.wBar=r.wBar; if(r.hasDW) o.wDW=r.wDW; return o; }
function applyDLTo(set,r){ set(p=>({...p, loads:{...p.loads, ...dlTheirsFor(r)}})); }

/* Signatures of the last publish each channel adopted. Module scope rather than a
   ref, so the Inputs tab can clear one on unlock without owning the sync itself. */
const LOCK_SIG={lldf:'',dlLoads:''};

/* Always-mounted auto-sync for every value-carrying lock this app holds.
   Rendered at the app root, so a locked channel keeps adopting each republish
   no matter which tab is on screen. Renders nothing. */
function LockAutoSync({inp,set}){
  const ref=useRef(null);
  ref.current=()=>{
    if(!BL) return;
    if(BL.isLocked('lldf')){
      const r=lldfResolveFor(inp);
      if(!r.why){
        const after=lldfTheirsFor(inp,r);
        const sig=(r.at||'')+'|'+r.src+'|'+JSON.stringify(after);
        if(LOCK_SIG.lldf!==sig){ LOCK_SIG.lldf=sig;
          BL.adopt({app:LOCK_APP, channel:'lldf', before:lldfMineFor(inp), after:after,
            labels:LLDF_LABELS, digits:LLDF_DIG, source:r.src, apply:()=>applyLLDFTo(set,inp,r)}); }
      }
    }
    if(BL.isLocked('dlLoads')){
      const r=dlResolveFor(inp);
      if(!r.why){
        const after=dlTheirsFor(r);
        const sig=(r.at||'')+'|'+r.src+'|'+JSON.stringify(after);
        if(LOCK_SIG.dlLoads!==sig){ LOCK_SIG.dlLoads=sig;
          BL.adopt({app:LOCK_APP, channel:'dlLoads', before:dlMineFor(inp), after:after,
            labels:DL_LABELS, digits:DL_DIG, source:r.src, apply:()=>applyDLTo(set,r)}); }
      }
    }
  };
  useEffect(()=>{
    if(!BL) return;
    const run=()=>{ if(ref.current) ref.current(); };
    run();
    const off=BL.onChange(run);
    const onS=(e)=>{ if(!e.key||e.key==='bridgeSuite.v1.lldf'||e.key==='bridgeSuite.v1.dlLoads'||e.key==='bridgeSuite.v1.designBeam') run(); };
    window.addEventListener('storage',onS);
    return ()=>{ off(); window.removeEventListener('storage',onS); };
  },[]);
  // Interior/exterior and the imported-envelope mode change WHICH published DF applies.
  useEffect(()=>{ if(ref.current) ref.current(); },[inp.loads.pos, extActiveOf(inp)]);
  return null;
}

/* ---------- Inputs page sub-tabs (UI only) ----------
   Every input card is still rendered exactly as before; the cards of the
   inactive sub-tabs are only hidden with the `hidden` attribute, so nothing
   unmounts and no state, handler or value binding changes. The active sub-tab
   is remembered per browser in localStorage key stgirder.inputTab.v1 (never in
   the inputs object, so the session autosave and the project JSON are
   unchanged). Print shows every pane. */
const STG_IN_TABS=[
  ['section','Section'],['mat','Materials'],['deck','Deck'],
  ['span','Span & Framing'],['loads','Loads'],['details','Stiffeners / Studs / Fatigue']];
const STG_IN_KEY='stgirder.inputTab.v1';
let stgInTabCur=null;   /* in-memory copy: survives the Inputs page unmounting, even without storage */
function stgInTabGet(){ if(stgInTabCur) return stgInTabCur;
  let t=''; try{ t=window.localStorage.getItem(STG_IN_KEY)||''; }catch(e){}
  return STG_IN_TABS.some(([k])=>k===t)?t:'section'; }
function stgInTabSet(t){ stgInTabCur=t; try{ window.localStorage.setItem(STG_IN_KEY,t); }catch(e){} }
/* red dot: a number field in the pane the browser cannot parse, or one left
   blank (Num stores '' for an empty field) */
function stgInBadPanes(root){
  const bad={}; if(!root) return bad;
  root.querySelectorAll('.stgInPane').forEach(pn=>{
    const k=pn.getAttribute('data-pane');
    pn.querySelectorAll('input[type="number"]').forEach(i=>{
      if(i.disabled||i.readOnly) return;
      if((i.validity&&i.validity.badInput)||i.value==='') bad[k]=1; });
  });
  return bad;
}
function InputsTab({inp,set,R}){
  const [inTab,setInTabSt]=useState(stgInTabGet);
  const [inBad,setInBad]=useState({});
  const inRoot=useRef(null);
  const pickInTab=(t,focus)=>{ setInTabSt(t); stgInTabSet(t);
    if(focus){ const b=document.getElementById('stgInTab_'+t); if(b) b.focus(); } };
  const inTabKey=e=>{ const ks=STG_IN_TABS.map(([k])=>k), i=ks.indexOf(inTab); let j=-1;
    if(e.key==='ArrowRight'||e.key==='ArrowDown') j=(i+1)%ks.length;
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp') j=(i-1+ks.length)%ks.length;
    else if(e.key==='Home') j=0;
    else if(e.key==='End') j=ks.length-1;
    if(j<0) return; e.preventDefault(); pickInTab(ks[j],true); };
  const markIn=()=>{ const b=stgInBadPanes(inRoot.current);
    setInBad(prev=>{ const a=Object.keys(prev).sort().join(), c=Object.keys(b).sort().join(); return a===c?prev:b; }); };
  React.useLayoutEffect(markIn);
  /* an unparsable entry (e.g. a lone "-") fires no React change, so also re-check
     on native input events; deferred so React's controlled-input handling runs first */
  useEffect(()=>{ const el=inRoot.current; if(!el) return; let h=0;
    const onIn=()=>{ clearTimeout(h); h=setTimeout(markIn,0); };

  /* plain <div> wrappers (not a component defined here) so React never remounts the cards */
  const paneP=k=>({className:'stgInPane','data-pane':k,id:'stgInPane_'+k,role:'tabpanel',

  const S=(path,v)=>{ const nx={...inp}; let o=nx; const ks=path.split('.');
    for(let i=0;i<ks.length-1;i++){o[ks[i]]={...o[ks[i]]}; o=o[ks[i]];}
    o[ks.at(-1)]=v; set(nx); };
  const sec=inp.sec, mat=inp.mat, deck=inp.deck, geom=inp.geom, loads=inp.loads;
  const applyPreset=nm=>{ const p=PRESETS[nm];
    if(p&&!p.custom){ set({...inp, preset:nm, sec:{...sec, D:p.D,tw:p.tw,bft:p.bft,tft:p.tft,bfb:p.bfb,tfb:p.tfb}}); }
    else set({...inp, preset:nm}); };
  const applyGrade=nm=>{ const g=GRADES[nm];
    set({...inp, mat:{...mat, grade:nm, Fyf:g.Fy, Fyw:mat.hybrid?mat.Fyw:g.Fy, Fu:g.Fu}}); };
  // external demands (imported envelope) — banner + span picker
  const extRaw=inp.external;
  const extActive=extRaw&&(extRaw._schema==='psbeam-external-demands'||extRaw._schema==='stgirder-external-demands'||extRaw._schema==='steelbeam-external-demands');
  const spans=extActive?externalSpans(extRaw):[];
  const selSpan=extActive?(extRaw._selSpan||spans[0]):null;
  const pickSpan=sp=>{ const secNew=zonesToSec(extRaw,sp,sec);
    set({...inp, external:{...extRaw,_selSpan:sp}, geom:{...inp.geom,L:sp.len}, ...(secNew?{sec:secNew}:{})}); };
  const clearExt=()=>{ const o={...inp}; delete o.external; set({...o,external:null}); };
  // ── LL & DL Distribution app two-way link (shared storage; see lldf.html) ──
  // Resolve whatever the LL & DL app last published down to the numbers this app
  // actually applies. Returns {why:'...'} when there is nothing usable, so the
  // manual pull and the locked auto-sync share one code path.
  const lldfResolve=()=>lldfResolveFor(inp);
  // The fields the LLDF lock takes over, in this app's own terms. Two shapes,
  // because an imported-envelope run applies the factors to that envelope
  // instead of to the built-in HL-93 analysis.
  const lldfMine=()=>lldfMineFor(inp);
  const lldfTheirs=(r)=>lldfTheirsFor(inp,r);
  const applyLLDF=(r)=>applyLLDFTo(set,inp,r);
  const pullLLDF=()=>{
    const r=lldfResolve();
    if(r.why){ alert(r.why); return; }
    const when=(r.at||'').slice(0,16).replace('T',' ');
    const msg='Pull from LL & DL Distribution ('+when+')\nProject: '+(r.project||'—')+' · '+r.src+'\n\n'
      +'  g_M +M (moment DF)   = '+r.gMpos.toFixed(3)+'\n'
      +'  g_M −M (pier region) = '+r.gMneg.toFixed(3)+(r.hasNeg?'':'  (no continuity region → = +M)')+'\n'
      +'  g_V (shear DF)       = '+r.gV.toFixed(3)+'\n'
      +(r.fatM>0?'  fatigue DF (1 lane)  = '+r.fatM.toFixed(3)+'\n':'')
      +(r.fatV>0?'  fatigue shear DF (1 lane) = '+r.fatV.toFixed(3)+'\n':'')+'\n'
      +(extActive
        ?'Applies to the imported-LL DF fields: +M DF = g_M(+M), −M DF = g_M(−M), shear DF = g_V, multiple presence = 1.0 (already in the factors)'+(r.fatM>0?', fatigue DF = single-lane value.':'.')
        :'Applies as manual distribution factors (DF auto off): DFm = g_M(+M), DFv = g_V'+(r.fatM>0?', fatigue DF = single-lane value.':'.'))
      +'\n\nApply?';

  /* ---- LLDF channel lock ----
     Locked = this app follows the LL & DL app. Every republish is adopted the
     moment it lands, the DF fields go read-only, and each change is logged and
     toasted. Unlocking offers back the values held at the moment of locking. */
  const lockTick=BLU.useLocks?BLU.useLocks():0;
  const lldfLocked=!!(BL&&BL.isLocked('lldf'));

    }else{
      BL.unlock('lldf',LOCK_APP);
      LOCK_SIG.lldf='';

      if(s&&s.data){
        const back=BL.deltas(lldfMine(),s.data,LLDF_LABELS,LLDF_DIG);
        if(back.length&&window.confirm('Distribution factors unlocked.\n\nRestore the values you had before locking?\n\n  '+back.map(function(d){return d.label+'  '+d.from+' → '+d.to;}).join('\n  ')))
          set(p=>({...p, loads:{...p.loads, ...s.data}}));

      }else BL.toast('Distribution factors unlocked','Manual control restored.');
    }
  };
  /* ---- Dead-load channel (DC2 / DW) lock ----
     The LL & DL app distributes the superimposed dead load across the girder
     line (MassDOT pile-cap analogy or the per-load rule set); the per-girder
     results are exactly what this app wants for the barrier/SIDL and wearing
     surface. DC1 is deliberately NOT driven — this app computes deck + haunch
     from its own section geometry, so adopting the LLDF tributary DC1 as well
     would count the slab twice. It is shown as a cross-check instead. */
  const dlResolve=()=>dlResolveFor(inp);
  const dlMine=()=>dlMineFor(inp);
  const dlTheirs=(r)=>dlTheirsFor(r);
  const applyDL=(r)=>applyDLTo(set,r);
  const pullDL=()=>{
    const r=dlResolve();
    if(r.why){ alert(r.why); return; }
    const when=(r.at||'').slice(0,16).replace('T',' ');
    const msg='Pull dead loads from LL & DL Distribution ('+when+')\nProject: '+(r.project||'—')+' · '+r.src+(r.trib?('  ·  tributary '+r.trib.toFixed(2)+' ft'):'')+'\n\n'
      +(r.hasBar?'  DC2  barrier / SIDL   = '+r.wBar.toFixed(3)+' klf\n':'  DC2  barrier / SIDL   — not published; your value is kept\n')
      +(r.hasDW ?'  DW   wearing surface  = '+r.wDW.toFixed(3)+' klf\n':'  DW   wearing surface  — not published; your value is kept\n')
      +(r.dc1>0?'  (DC1 deck = '+r.dc1.toFixed(3)+' klf — NOT applied; this app computes deck + haunch itself)\n':'')
      +(r.pl>0?'  (PL pedestrian = '+r.pl.toFixed(3)+' klf — a live load; enter it on the LL group if it governs)\n':'')
      +'\nApply the DC2 and DW values?';
    if(!window.confirm(msg)) return;
    applyDL(r);
  };
  const dlPeek=dlResolve();
  const dlLocked=!!(BL&&BL.isLocked('dlLoads'));
  const dlSrc=dlLocked?((dlPeek&&dlPeek.src)||'LL & DL Distribution'):'';
  // Which of the two fields the current publish actually covers.
  const dlHasBar=!!(dlPeek&&!dlPeek.why&&dlPeek.hasBar), dlHasDW=!!(dlPeek&&!dlPeek.why&&dlPeek.hasDW);
  const dlNote=dlLocked?(dlHasBar&&dlHasDW?'':(' · '+(dlHasBar?'DW':'DC2')+' is not in the publish and stays under your control')):'';
  const toggleDLLock=(on)=>{
    if(!BL) return;
    if(on){
      const r=dlResolve();
      if(r.why){ alert(r.why+'\n\nPublish the dead loads first, then lock.'); return; }
      BL.saveSnap(LOCK_APP,'dlLoads',dlMine());
      BL.lock('dlLoads',LOCK_APP);
      const ds=BL.adopt({app:LOCK_APP, channel:'dlLoads', before:dlMine(), after:dlTheirs(r),
        labels:DL_LABELS, digits:DL_DIG, source:r.src, apply:()=>applyDL(r)});
      if(!ds.length) BL.toast('Dead loads locked','Already matching '+r.src+'. DC2 and DW now follow the LL & DL app automatically.');
    }else{
      BL.unlock('dlLoads',LOCK_APP);
      LOCK_SIG.dlLoads='';
      const s=BL.takeSnap(LOCK_APP,'dlLoads');
      if(s&&s.data){
        const back=BL.deltas(dlMine(),s.data,DL_LABELS,DL_DIG);
        if(back.length&&window.confirm('Dead loads unlocked.\n\nRestore the values you had before locking?\n\n  '+back.map(function(d){return d.label+'  '+d.from+' → '+d.to;}).join('\n  ')))
          set(p=>({...p, loads:{...p.loads, ...s.data}}));
        else BL.toast('Dead loads unlocked','Manual control — the current values were kept.');
      }else BL.toast('Dead loads unlocked','Manual control restored.');
    }
  };
  const sendLLDF=(silent)=>{
    try{
      if(!R||!R.ok){ if(!silent) alert('Fix the section inputs first — the section engine reported an error.'); return false; }
      const egv=(R.bare.hs+(+deck.haunch)+(+deck.ts)/2)-R.bare.ybar;
      const Nb=Math.max(2,Math.round(+geom.nGirders||4));
      const spansOut=(extRaw&&extRaw.member&&Array.isArray(extRaw.member.spans)&&extRaw.member.spans.length)?extRaw.member.spans.map(Number):[+geom.L];

  };

  const toggleGeomLock=(on)=>{

  // segment table helpers
  const segU=(i,k,v)=>set({...inp, sec:{...sec, segs:sec.segs.map((s,j)=>j===i?{...s,[k]:v}:s)}});
  const segAdd=()=>{ const last=sec.segs.at(-1)||{xEnd:geom.L,bft:sec.bft,tft:sec.tft,bfb:sec.bfb,tfb:sec.tfb};

  const segDel=i=>set({...inp, sec:{...sec, segs:sec.segs.filter((_,j)=>j!==i)}});
  return (<div ref={inRoot}>
    {extActive&&<div className="callout" style={{marginTop:0,marginBottom:14,borderColor:'var(--blue)',background:'#EEF4FF'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8}}>
        <b>Running on imported demands (continuous member)</b>
        <button className="btn sm ghost" onClick={clearExt}>✕ use built-in simple-span analysis</button>
      </div>
      <div style={{fontSize:11.5,marginTop:4,lineHeight:1.6}}>
        Source: {extRaw.source||'external analysis'}{extRaw.project?' · '+extRaw.project:''} · {extRaw.stations.length} stations · LL: <b>{extRaw.liveLoadType||'HL-93'}</b>
        {extRaw.units?' · units: '+(extRaw.units.moment||'ft-kip')+' / '+(extRaw.units.force||'kip'):''}.
        Impact is assumed already in the imported LL envelope{extPerGirderOf(extRaw)?<b>, and so are the distribution factors (per-girder LL+IM): the DF and multiple-presence multipliers below are not applied</b>:null}. DC2, DW, and ±LL come from the import;
        {R&&R.ok&&R.ext&&R.ext.hasDC1?' DC1 also from the import (continuous erection).':' DC1 (steel + wet deck) is computed by the app on the selected span — for girders erected continuous, include M_DC1/V_DC1 in the export so the pier picks up the DC1 negative moment.'}
        {R&&R.ok&&R.ext&&R.ext.swExcl&&<span> <b>Self-weight excluded from the import</b> — the app adds the girder self-weight to DC1 (all checks, reactions and camber).<SwContNote R={R}/></span>}
        {extRaw.section&&extRaw.section.zones&&<span> <b>Plate geometry imported</b> from section.zones → web + flange segment table populated automatically (editable below).</span>}
        {extRaw.factored===true&&<b style={{color:'var(--fail)'}}> ⚠ File is flagged FACTORED — this app applies its own load factors; export unfactored envelopes.</b>}
        {R&&R.ok&&R.fatigue&&R.fatigue.fatImp&&<span> <b>Fatigue moments{R.fatigue.fatImpV?' and shears':''} imported</b> — the Fatigue tab{R.fatigue.fatImpV?' and the stud fatigue pitch use them':' uses them'} instead of the simple-span fatigue truck.</span>}
      </div>
      <GdNote ext={extRaw} style={{marginTop:8,marginBottom:0}}/>
      {spans.length>1&&<div style={{marginTop:8}}>
        <div style={{fontSize:11,color:'var(--ink2)',marginBottom:4}}>Select span to investigate ({spans.length}-span continuous member):</div>
        <div className="btnrow" style={{flexWrap:'wrap'}}>{spans.map(sp=>
          <button key={sp.idx} className={'btn sm'+(selSpan&&selSpan.idx===sp.idx?' pri':' ghost')}
            onClick={()=>pickSpan(sp)}>Span {sp.idx}: {fmt(sp.x0,0)}–{fmt(sp.x1,0)} ft ({fmt(sp.len,0)}′)</button>)}</div>
      </div>}
      {selSpan&&<div style={{fontSize:11.5,marginTop:6}}>Active: <b>Span {selSpan.idx}</b> ({fmt(selSpan.len,1)} ft). Negative envelope values at the span ends drive the 6.10.8 pier checks.</div>}
    </div>}
    <div className="stgInTabs" role="tablist" aria-label="Input groups">{STG_IN_TABS.map(([k,l])=>

        {sec.useSegs&&<b> Flange transitions are ON — the base flange dims above are superseded by the segment table below.</b>}</div>

        <Num l="Top of slab → bar CG" u="in" v={inp.negM.dTop} set={v=>S('negM.dTop',v)} step={0.25}/>
      </div>
      {R&&R.ok&&<div className="hint">Used where the member sees negative moment (imported continuous envelopes): the deck concrete is neglected in tension and the section is <b>steel + this reinforcement</b>. Minimum 1% of the deck area (6.10.1.7) = <b>{fmt(0.01*R.beff*R.deck.ts,2)} in²</b>{R.hasNeg?<span> — provided {fmt(+inp.negM.As||0,2)} in² {(+inp.negM.As||0)>=0.01*R.beff*R.deck.ts?'✓':'✗'}</span>:<span> (no negative demand in the current model — simple span)</span>}.</div>}

    <Card title="Deck & Composite" refTag="6.10.1.1 · 4.6.2.6">
      <div style={{marginBottom:8}}>
        <label style={{fontSize:11,color:'var(--ink2)',display:'flex',gap:7,alignItems:'center'}}>
          <input type="checkbox" checked={deck.deckOn} onChange={e=>S('deck.deckOn',e.target.checked)}/>

        <label style={{fontSize:11,color:'var(--ink2)',display:'flex',gap:7,alignItems:'center'}}>
          <input type="checkbox" checked={deck.extTribAuto!==false} onChange={e=>S('deck.extTribAuto',e.target.checked)}/>

          : <span>Off: the girder spacing S = {fmt(+geom.S,2)} ft is used for the exterior girder as for an interior one (the basis before 2026-10-12).</span>}</div>
      </div>}
      <div style={{marginTop:10,marginBottom:2}}>
        <label style={{fontSize:11,color:'var(--ink2)',display:'flex',gap:7,alignItems:'center'}}>
          <input type="checkbox" checked={deck.designOn} onChange={e=>S('deck.designOn',e.target.checked)}/>

        <div className="grouplabel">Deck reinforcement</div>

          <Num l="Overhang (web→edge)" u="ft" v={deck.oh} set={v=>S('deck.oh',v)} step={0.25}/>

          <Num l="Top bar area" u="in²" v={deck.barTop} set={v=>S('deck.barTop',v)} step={0.01}/>
          <Num l="Top bar spacing" u="in" v={deck.sTop} set={v=>S('deck.sTop',v)} step={0.5}/>
          <Num l="Bottom bar area" u="in²" v={deck.barBot} set={v=>S('deck.barBot',v)} step={0.01}/>
          <Num l="Bottom bar spacing" u="in" v={deck.sBot} set={v=>S('deck.sBot',v)} step={0.5}/>
          <Num l="Top cover" u="in" v={deck.coverT} set={v=>S('deck.coverT',v)} step={0.25}/>
          <Num l="Bottom cover" u="in" v={deck.coverB} set={v=>S('deck.coverB',v)} step={0.25}/>
          <Num l="Future wearing surf." u="ksf" v={deck.wsFut} set={v=>S('deck.wsFut',v)} step={0.005}/>
          <Num l="Barrier base width" u="in" v={deck.bBar} set={v=>S('deck.bBar',v)} step={1}/>
          <Num l="Barrier weight" u="klf" v={deck.wBar} set={v=>S('deck.wBar',v)} step={0.05}/>
        </div>

        <div style={{margin:'2px 0 6px'}}>
          <label style={{fontSize:11,color:'var(--ink2)',display:'flex',gap:7,alignItems:'center'}}>

        </div>}

    <div {...paneP('span')}>

        {geom.shored&&<div className="hint" style={{color:'var(--warn)'}}>This project was saved with “shored” ticked. That option never affected the analysis; results are for unshored construction (conservative for flange stresses).</div>}</div>
    </Card>

    </div>

    <div {...paneP('loads')}>
    <Card title="Loads" refTag="LRFD 3.6 / 4.6.2.2">
      {(()=>{const LG=({tag,title,note,color})=><div style={{display:'flex',alignItems:'baseline',gap:8,
        margin:'2px 0 6px',paddingBottom:3,borderBottom:'1px solid var(--line2)'}}>
        <span style={{fontFamily:'var(--mono)',fontWeight:700,fontSize:12,color:color||'var(--ink)'}}>{tag}</span>
        <span style={{fontSize:11,letterSpacing:'.5px',textTransform:'uppercase',color:'var(--ink2)'}}>{title}</span>
        {note&&<span style={{fontSize:10.5,color:'#9aa',marginLeft:'auto'}}>{note}</span>}</div>;
      const Ld=R&&R.ok?R.loads:null;
      return <React.Fragment>

      {/* ---- shared dead-load channel (DC2 / DW from the LL & DL app) ---- */}
      <div className="btnrow" style={{margin:'0 0 8px',alignItems:'center'}}>
        {BLU.LockBtn
          ? <BLU.LockBtn ch="dlLoads" always
              label={dlLocked?'Following LL & DL':'⇩ Pull DC2 / DW from LL & DL'}
              onClick={(st,locked)=>{ if(locked) toggleDLLock(false); else pullDL(); }}/>
          : <button className="btn sm" onClick={pullDL}>⇩ Pull DC2 / DW from LL &amp; DL</button>}

      </div>
      {dlLocked&&BLU.DrivenStrip&&<BLU.DrivenStrip ch="dlLoads" detail={dlSrc+dlNote} onUnlock={()=>toggleDLLock(false)}/>}
      {(()=>{ const r=dlPeek; if(!r||r.why||!(r.dc1>0)||!Ld) return null;
        const mine=Ld.wdk+(+loads.wDCextra||0), off=Math.abs(mine-r.dc1)/Math.max(r.dc1,1e-6);
        return <div className="hint" style={{margin:'0 0 10px'}}>DC1 cross-check — LL &amp; DL puts <b>{fmt(r.dc1,3)} klf</b> of deck on {r.trib>0?<b>{fmt(r.trib,2)} ft</b>:'the'} tributary width; this app computes deck + haunch + extra = <b>{fmt(mine,3)} klf</b> from its own section geometry{off>0.10?<span style={{color:'#B3261E',fontWeight:600}}> — {fmt(off*100,0)}% apart; check that deck thickness, haunch and girder spacing agree in both apps</span>:<span> ✓ consistent</span>}. DC1 is never driven by the lock, so the slab cannot be counted twice.</div>; })()}

      {/* DC1 — noncomposite */}
      <div style={{marginBottom:14}}>
        <LG tag="DC1" title="Noncomposite dead load" color="#15803D" note="on bare steel section"/>
        <div className="frow">
          <div className="fld"><label>Steel self-weight</label><div className="fwrap">
            <input value={Ld?fmt(Ld.wsw,3):'—'} disabled style={{color:'var(--ink2)'}}/><span className="unit">klf</span></div></div>
          <div className="fld"><label>Deck + haunch</label><div className="fwrap">
            <input value={Ld?fmt(Ld.wdk,3):'—'} disabled style={{color:'var(--ink2)'}}/><span className="unit">klf</span></div></div>
          <Num l="Add'l DC1 (forms, details)" u="klf" v={loads.wDCextra} set={v=>S('loads.wDCextra',v)} step={0.005}/>
          <Num l="Construction live load" u="klf" v={loads.wConstr} set={v=>S('loads.wConstr',v)} step={0.005}/>

          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:4}}>
            <span style={{fontSize:11,letterSpacing:'.5px',textTransform:'uppercase',color:'var(--ink2)'}}>Cross-frame / diaphragm point loads (DC1)</span>
            <button className="btn sm" onClick={()=>S('loads.diaph',[...(loads.diaph||[]),{P:1.0,a:0}])}>+ add</button>
          </div>
          {(loads.diaph||[]).length===0
            ? <div className="hint" style={{marginTop:0}}>None. Add discrete cross-frame / diaphragm point loads (kips at a distance from the left bearing).</div>
            : <table className="eng"><thead><tr><th>#</th><th>P (kip)</th><th>a from left brg (ft)</th><th></th></tr></thead>
              <tbody>{loads.diaph.map((d,i)=><tr key={i}>
                <td>{i+1}</td>
                <td><input type="number" step="0.1" value={d.P} onChange={e=>{const a=[...loads.diaph];a[i]={...a[i],P:+e.target.value};S('loads.diaph',a);}} style={{width:80,border:'1px solid var(--line)',fontFamily:'var(--mono)',fontSize:12,padding:'2px 5px',textAlign:'right'}}/></td>
                <td><input type="number" step="0.5" value={d.a} onChange={e=>{const a=[...loads.diaph];a[i]={...a[i],a:+e.target.value};S('loads.diaph',a);}} style={{width:90,border:'1px solid var(--line)',fontFamily:'var(--mono)',fontSize:12,padding:'2px 5px',textAlign:'right'}}/></td>

              </tr>)}</tbody></table>}
        </div>
        {Ld&&<div className="hint" style={{marginTop:6}}>Distributed DC1 = <b>{fmt(Ld.wDC1,3)} klf</b>{Ld.Pdia>0?<React.Fragment> + {fmt(Ld.Pdia,2)} kip diaphragms</React.Fragment>:null} · M_DC1(mid) = <b>{fmt(Ld.Mdc1,0)} k-ft</b>. Steel self-weight uses 0.490 kcf on the bare section; put stiffener/connection allowance under "Add'l DC1".</div>}
      </div>

      {/* LL — live load */}

        {(+loads.fatV>0)&&<div className="hint" style={{marginTop:0,marginBottom:10}}>Fatigue shear DF override from LL &amp; DL: <b>{fmt(+loads.fatV,3)}</b> (single-lane, no MPF) — used for the stud shear range and the web special-fatigue check in place of the shear DF÷1.2 estimate. <button className="btn sm ghost" style={{padding:'1px 8px',marginLeft:4}} onClick={()=>S('loads.fatV',0)}>clear → auto</button></div>}
        {extActive&&extPerGirderOf(extRaw)&&<div className="hint" style={{marginBottom:8}}>Imported ±LL+IM is <b>per girder</b> ({extRaw.producer||'import'}: impact, distribution factors and multiple presence already included). The DF and multiple-presence multipliers are <b>not applied</b> to it{extRaw.girderDetail&&extRaw.girderDetail.df&&Array.isArray(extRaw.girderDetail.df.spans)?<span> — factors used by {extRaw.producer}: {extRaw.girderDetail.df.spans.map(d=>'span '+d.span+' g_M = '+fmt(d.gM,3)+', g_V = '+fmt(d.gV,3)).join('; ')}{(extRaw.girderDetail.df.piers||[]).length?'; '+extRaw.girderDetail.df.piers.map(d=>'pier '+d.pier+' g_M = '+fmt(d.gM,3)).join('; '):''}</span>:null}.</div>}
        {extActive&&!extPerGirderOf(extRaw)&&<React.Fragment>

            <Num l="DF — negative moment" v={loads.extDFneg} set={v=>S('loads.extDFneg',v)} step={0.05} min={0} driven={lldfLocked} src={lldfSrc}/>
            <Num l="DF — shear" v={loads.extDFv} set={v=>S('loads.extDFv',v)} step={0.05} min={0} driven={lldfLocked} src={lldfSrc}/>
            <Num l="Multiple presence m" v={loads.extLLmpf} set={v=>S('loads.extLLmpf',v)} step={0.05} min={0} driven={lldfLocked} src={lldfSrc}/>
          </div>
          <div className="hint" style={{marginTop:6}}>Combined DF×m: +M = <b>{fmt((+loads.extDFpos||1)*(+loads.extLLmpf||1),3)}</b> · −M = <b>{fmt((+loads.extDFneg||1)*(+loads.extLLmpf||1),3)}</b> · V = <b>{fmt((+loads.extDFv||1)*(+loads.extLLmpf||1),3)}</b>. AASHTO 4.6.2.2 gives different DFs for +M, −M, and shear.</div>
        </React.Fragment>}

        {!extActive&&!loads.llAuto&&<div className="frow" style={{marginTop:8}}>
          <Num l="M (LL+IM) @ midspan" u="k-ft" v={loads.MLL} set={v=>S('loads.MLL',v)} step={50}/>
          <Num l="V (LL+IM) @ support" u="kip" v={loads.VLL} set={v=>S('loads.VLL',v)} step={5}/>
        </div>}
        {!extActive&&loads.llAuto&&<div style={{marginTop:8}}>

            {!loads.dfAuto&&<React.Fragment>

              <div className="fwrap" style={{width:90}}><input type="number" step="0.01" value={loads.dfv} readOnly={lldfLocked} className={lldfLocked?'bl-driven':undefined} title={lldfLocked?('Driven by '+lldfSrc+' — unlock to edit.'):undefined} onChange={e=>{ if(lldfLocked) return; S('loads.dfv',+e.target.value); }}/><span className="unit">DFv</span></div>
              {lldfLocked&&<span className="bl-src" style={{alignSelf:'center'}}>{lldfSrc}</span>}
            </React.Fragment>}
          </div>
          {loads.dfAuto&&<div className="frow" style={{marginTop:8}}>
            {loads.pos==='exterior'&&<Num l="d_e — ext web to barrier face" u="ft" v={loads.de} set={v=>S('loads.de',v)} step={0.25}/>}
            {loads.pos==='exterior'&&<Num l="Design lanes N_L" v={loads.NL} set={v=>S('loads.NL',v)} step={1} min={1}/>}
            <Num l="Skew angle" u="deg" v={loads.skew} set={v=>S('loads.skew',v)} step={5} min={0}/>
          </div>}
          {Ld&&<div className="hint">HL-93: M_truck = <b>{fmt(Ld.hl.Mtr,0)}</b>, M_tandem = <b>{fmt(Ld.hl.Mtd,0)}</b>, M_lane = <b>{fmt(Ld.hl.Mln,0)} k-ft</b> → 1.33·truck + lane = <b>{fmt(Ld.hl.M,0)} k-ft/lane</b><br/>
          {R.df? <React.Fragment>{R.df.ext?'Exterior':'Interior'}: DF_m = <b>{fmt(Ld.dfm,3)}</b>, DF_v = <b>{fmt(Ld.dfv,3)}</b> (K_g = {fmt(R.df.Kg,0)} in⁴{R.df.th>0?`, skew ×${fmt(R.df.skM,3)}M / ×${fmt(R.df.skV,3)}V`:''})<br/></React.Fragment>:null}
          <b>M_LL+IM = {fmt(Ld.MLL,0)} k-ft</b> · <b>V_LL+IM = {fmt(Ld.VLL,0)} kip</b></div>}
        </div>}
      </div>

      {R&&R.ok&&<div className="callout" style={{marginTop:12}}><b>Factored envelope peaks (per girder):</b> Strength I +M_u = <b>{fmt(R.flex.MuPeak,0)} k-ft</b>{R.hasNeg&&<span> · −M_u = <b>{fmt(R.neg.MunPeak,0)} k-ft</b> (pier)</span>} · V_u = <b>{fmt(R.shearR.VuPeak,0)} kip</b>. These feed the Diagrams, Flexure, Shear, Constructibility, Fatigue, and Rating tabs.</div>}
      </React.Fragment>;})()}
    </Card>

    </div>

      <div className="grouplabel">Transverse & bearing stiffeners</div>
      <div style={{marginBottom:6}}><label style={{fontSize:11,color:'var(--ink2)',display:'flex',gap:7,alignItems:'center'}}>

        {inp.stiff.transverse&&<Num l="Stiff. thick tp" u="in" v={inp.stiff.tp} set={v=>S('stiff.tp',v)} step={0.0625}/>}
        <Num l="Bearing stiff. width" u="in" v={inp.stiff.bearB} set={v=>S('stiff.bearB',v)} step={0.5}/>
        <Num l="Bearing stiff. thick" u="in" v={inp.stiff.bearT} set={v=>S('stiff.bearT',v)} step={0.0625}/>
        <Num l="Bearing plates (ea. side)" v={inp.stiff.bearN} set={v=>S('stiff.bearN',v)} step={1}/>

      </div>

        <div className="fld"><label>Limit state</label>
          <Seg opts={[{v:'auto',l:'AUTO'},{v:'I',l:'FATIGUE I'},{v:'II',l:'FATIGUE II'}]}
            v={inp.fatigue.lsMode||'auto'} set={v=>S('fatigue.lsMode',v)}/></div>
      </div>
      <div className="hint" style={{margin:'2px 0 8px'}}>AUTO picks Fatigue&nbsp;I (infinite life, γ=1.75) when (ADTT)<sub>SL</sub> is at or above the category crossover, else Fatigue&nbsp;II (finite life, γ=0.80). See the Fatigue tab for the full determination.</div>
      <div className="grouplabel">Fatigue — traffic &amp; cycles</div>

          <Seg opts={[{v:true,l:'SINGLE-LANE'},{v:false,l:'GROSS (all lanes)'}]}
