<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timber Beam Check — NDS 2018 (ASD / LRFD)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js" charset="utf-8"></script>
<style>
:root{
  --navy-900:#16304F; --navy-800:#1E3A5F; --blue-600:#2563EB;
  --green-600:#059669; --red-600:#DC2626; --amber-700:#B45309;
  --slate-50:#F8FAFC; --slate-100:#F1F3F5; --slate-200:#E4E7EB;
  --slate-400:#94A3B8; --slate-900:#0F172A;
  --ink:var(--slate-900); --paper:#fff; --panel:var(--slate-50); --line:var(--slate-200);
  --accent:var(--navy-800); --pass:var(--green-600); --fail:var(--red-600); --warn:var(--amber-700);
  --font-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-doc:"Times New Roman",Times,serif;
  --mono:Consolas,"SFMono-Regular",Menlo,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--font-doc);font-size:10pt;color:var(--ink);background:#efede8}
#app{position:fixed;top:0;right:0;bottom:0;left:0;max-width:1500px;margin:0 auto;
  overflow:hidden;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 12px rgba(0,0,0,.12)}
#hdr{flex:0 0 auto;border-bottom:3px solid var(--navy-900);padding:8px 14px 7px;background:var(--accent);color:#fff;z-index:20}
#hdr .titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#hdr h1{font-size:14.5pt;margin:0;letter-spacing:.4px;font-family:var(--font-ui);font-weight:600;color:#fff}
#hdr .byline{font-size:9pt;color:#C7D4E4;margin-top:1px;font-family:var(--font-ui)}
#hdr .alltools{display:inline-block;margin-top:2px;font-family:var(--font-ui);font-size:8.5pt;color:#C7D4E4;text-decoration:none}
#hdr .alltools:hover{color:#fff;text-decoration:underline}
#hdr .hdrBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#hdr .hdrBtns button{font-family:var(--font-ui);font-size:9pt;padding:4px 11px;border:1px solid #ffffff55;border-radius:4px;background:#ffffff1c;color:#fff;cursor:pointer}
#hdr .hdrBtns button:hover{background:#ffffff33}
#hdr .hdrBtns button.primary{background:#fff;color:var(--navy-800);font-weight:600}
#projGrid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:4px 8px;margin-top:6px}
#projGrid label{display:block;font-family:var(--font-ui);font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#B9C8DB;margin-bottom:1px}
#projGrid input{width:100%;font-family:var(--font-ui);font-size:9pt;padding:3px 5px;border:1px solid #ffffff33;border-radius:3px;background:#ffffff14;color:#fff}
#projGrid input::placeholder{color:#8FA3BC}
#projShare{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
#projShare button{font-family:var(--font-ui);font-size:8pt;padding:2px 8px;border:1px solid #ffffff44;border-radius:3px;background:#ffffff14;color:#fff;cursor:pointer}
#projShare button:hover{background:#ffffff2a}
#main{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
#inputPanel{flex:0 0 33%;max-width:450px;min-width:330px;overflow-y:auto;border-right:2px solid var(--line);background:var(--panel);padding:9px 10px 40px}
#tbcInTabs{position:sticky;top:-9px;z-index:12;display:flex;flex-wrap:wrap;gap:2px;margin:-9px -10px 8px;padding:7px 10px 0;background:var(--panel);border-bottom:2px solid var(--accent)}
#tbcInTabs .tbcInTab{display:inline-flex;align-items:center;font-family:var(--font-ui);font-size:9pt;padding:5px 10px;border:1px solid var(--line);border-bottom:none;background:var(--slate-100);color:#41546E;cursor:pointer;border-radius:5px 5px 0 0}
#tbcInTabs .tbcInTab:hover{background:#EFF4FA}
#tbcInTabs .tbcInTab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
#tbcInTabs .tbcInTab:focus-visible{outline:2px solid #BFD3F2;outline-offset:1px}
.tbcInDot{display:none;width:7px;height:7px;border-radius:50%;background:var(--fail);margin-left:6px;box-shadow:0 0 0 1.5px #fff}
.tbcInTab.has-err .tbcInDot{display:inline-block}
.tbcInPane[hidden]{display:none!important}
#outputPanel{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;padding:0 14px 60px;background:var(--paper)}
#tabBar{position:sticky;top:0;z-index:15;background:var(--paper);border-bottom:2px solid var(--accent);padding:7px 0 0;display:flex;flex-wrap:wrap;gap:2px}
#tabBar button{display:inline-flex;align-items:center;font-family:var(--font-ui);font-size:9pt;padding:5px 11px;border:1px solid var(--line);border-bottom:none;background:var(--slate-100);color:#41546E;cursor:pointer;border-radius:5px 5px 0 0}
#tabBar button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.tabDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:0 0 8px}
.tabDot.pass{background:var(--pass)} .tabDot.fail{background:var(--fail)} .tabDot.na{background:#B8C2CE}
.govStrip{display:flex;align-items:center;gap:9px;padding:5px 14px;font-family:var(--font-ui);font-size:9.5pt;border-bottom:1px solid var(--line);background:var(--slate-100);color:var(--ink);flex-wrap:wrap}
.govStrip.pass{background:#EAF6EE;border-bottom-color:#9ED3B0}
.govStrip.fail{background:#FBEAEA;border-bottom-color:#E2A2A2}
.govTxt{font-weight:600}
.govSec{margin-left:auto;color:#5A6B80;font-size:9pt}
.govBadge{font-weight:700;letter-spacing:.4px;padding:1px 8px;border-radius:4px;background:rgba(0,0,0,.06)}
.govStrip.pass .govBadge{color:var(--pass)} .govStrip.fail .govBadge{color:var(--fail)}
.tabPage{padding:10px 2px}
.sec{border:1px solid var(--line);border-radius:6px;margin:9px 0;background:var(--paper);overflow:hidden}
.secHead{display:flex;align-items:center;gap:7px;padding:6px 10px;background:linear-gradient(#F6F8FA,#EDF1F5);cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.secHead .caret{width:0;height:0;border-left:6px solid var(--accent);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.sec:not(.collapsed) .caret{transform:rotate(90deg)}
.secTitle{font-family:var(--font-ui);font-size:10pt;font-weight:600;color:var(--accent);margin:0}
.secBody{padding:8px 11px}
.sec.collapsed .secBody{display:none}
.fRow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(90px,1.25fr) 36px;gap:6px;align-items:center;margin:3px 0}
.fRow label{font-size:10pt}
.fRow .unit{font-family:var(--font-ui);font-size:8pt;color:#64748B}
input[type=text],input[type=number],select,textarea{font-family:var(--font-ui);font-size:9.5pt;padding:3px 5px;border:1px solid #C6CFDA;border-radius:3px;background:#fff;color:var(--ink);width:100%}
input[type=number]{text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid #BFD3F2;border-color:var(--blue-600)}
input.bad,select.bad{border-color:var(--fail)!important;background:#FDECEC!important}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent)}
button{font-family:var(--font-ui)}
.btn{font-size:9pt;padding:4px 10px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:4px;cursor:pointer}
.btn:hover{background:#EFF4FA}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.btn.sm{font-size:8pt;padding:2px 7px}
.btnRow{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0;align-items:center}
.chkRow{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:10pt}
table.tbl{border-collapse:collapse;width:100%;margin:5px 0;font-size:9.5pt}
table.tbl th{background:#DCE6F1;color:var(--navy-900);font-family:var(--font-ui);font-size:8.5pt;font-weight:700;padding:3px 6px;border:1px solid #B9C8DB;text-align:center}
table.tbl td{padding:2.5px 6px;border:1px solid var(--line);text-align:center}
table.tbl td.lft,table.tbl th.lft{text-align:left}
table.tbl tr.gov td{background:#FEF6E7}
table.tbl td.b{font-weight:700}
table.tbl td.ng{color:var(--fail);font-weight:700}
table.tbl td.ok{color:var(--pass);font-weight:700}
.tscroll{overflow-x:auto;max-width:100%}
table.cfg{border-collapse:collapse;width:100%;font-size:9pt}
table.cfg th{font-family:var(--font-ui);font-size:8pt;color:#64748B;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line)}
table.cfg td{padding:2px 4px;vertical-align:middle}
table.cfg input,table.cfg select{font-size:8.8pt;padding:2px 4px}
.hint{font-family:var(--font-ui);font-size:8pt;color:#6B7A8F;margin:2px 0}
.small{font-size:8.5pt}
.note{font-size:9pt;color:#4A5568;background:#F6F8FA;border:1px solid var(--line);border-radius:4px;padding:5px 9px;margin:6px 0}
.warnBox{font-size:9.5pt;color:#7C4A03;background:#FEF6E7;border:1.5px solid #F0C36D;border-radius:5px;padding:7px 10px;margin:7px 0}
.errBox{font-size:9.5pt;color:#8C1D1D;background:#FDECEC;border:1.5px solid #F1A8A8;border-radius:5px;padding:7px 10px;margin:7px 0}
.okBox{font-size:9.5pt;color:#065F46;background:#E8F7F0;border:1.5px solid #7FD1B0;border-radius:5px;padding:7px 10px;margin:7px 0;font-weight:600}
.errBox ul,.warnBox ul{margin:3px 0 0 18px;padding:0}
/* dashboard */
.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);border-left:5px solid var(--pass);border-radius:6px;padding:10px 14px;margin:8px 0;background:#FBFDFC}
.hero.fail{border-left-color:var(--fail);background:#FFFBFB}
.hero .hL{font-family:var(--font-ui)}
.hero .hK{font-size:8pt;text-transform:uppercase;letter-spacing:.6px;color:#64748B}
.hero .hN{font-size:15pt;font-weight:700;color:var(--navy-900)}
.hero .hD{font-size:9pt;color:#4A5568}
.hero .hP{font-family:var(--font-ui);font-size:24pt;font-weight:700;color:var(--pass);text-align:right}
.hero.fail .hP{color:var(--fail)}
.hero .hPs{font-family:var(--font-ui);font-size:8pt;color:#64748B;text-align:right}
#dash{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:8.5pt;border:1.5px solid;border-radius:5px;padding:4px 9px;cursor:pointer;background:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.pass{border-color:#9CD6BC}.chip.pass .dot{background:var(--pass)}
.chip.fail{border-color:#F1A8A8;background:#FDF3F3}.chip.fail .dot{background:var(--fail)}
.chip.na{border-color:#CBD5E1;color:#64748B}.chip.na .dot{background:#94A3B8}
.chip .ratio{font-weight:700}
/* calc sheet blocks */
.eqb{border:1px solid var(--line);border-radius:6px;margin:9px 0;overflow:hidden;background:#fff;break-inside:avoid}
.eqb.ng{border-color:#E9A9A4}
.eqbT{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 11px;border-bottom:1px solid var(--line);font-family:var(--font-ui);font-size:9.5pt;font-weight:600;color:var(--navy-900);background:#FAFBFC}
.eqbT .ref{font-weight:400;color:#6B7A8F;font-size:8.5pt;text-align:right}
.eqbM{background:#F7F8FA;border-left:3px solid var(--blue-600);padding:4px 14px;margin:0;overflow-x:auto;overflow-y:hidden}
.eqb.ng .eqbM{border-left-color:var(--fail);background:#FDF7F6}
.eqbM .katex-display{margin:5px 0;text-align:left}
.eqbM .katex-display>.katex{text-align:left}
.eqbM .eqTxt{font-family:var(--mono);font-size:9.5pt;padding:4px 0}
.eqbW{padding:5px 11px 7px}
.eqbW .wh{font-family:var(--font-ui);font-size:8pt;font-weight:600;color:#6B7A8F;margin-bottom:2px}
.eqbW table{width:100%;border-collapse:collapse}
.eqbW td{padding:2px 0;vertical-align:baseline;font-size:9.5pt;border-bottom:1px dotted #E8ECF1}
.eqbW td.ws{width:76px;white-space:nowrap;padding-right:8px;color:var(--navy-800)}
.eqbW td.wd{color:#3C4A5E}
.eqbW td.wv{font-family:var(--mono);text-align:right;white-space:nowrap;padding-left:10px;font-size:9pt}
.eqbW td.wv .wu{color:#7C8CA3;font-family:var(--font-ui);font-size:8pt;margin-left:3px}
.eqbW td.wsrc{font-family:var(--font-ui);font-size:8pt;color:#6B7A8F;padding-left:12px;white-space:normal;width:34%}
.eqbR{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 11px;border-top:1px solid var(--line);font-family:var(--font-ui);font-size:9.5pt;flex-wrap:wrap}
.eqbR .res{font-weight:700}
.eqbR .st{font-weight:700;padding:1px 9px;border-radius:4px}
.eqbR .st.ok{color:var(--pass);background:#E8F7F0}
.eqbR .st.ng{color:var(--fail);background:#FDECEC}
.eqbR .st.na{color:#64748B;background:var(--slate-100)}
.badge{display:inline-block;font-family:var(--font-ui);font-size:7.5pt;font-weight:600;padding:0 5px;border-radius:3px;line-height:1.5;vertical-align:baseline;margin-left:3px;white-space:nowrap}
.badge.vfy{background:#FEF3C7;color:#92400E;border:1px solid #F0C36D}
.badge.ok{background:#E8F7F0;color:#065F46;border:1px solid #7FD1B0}
.badge.ng{background:#FDECEC;color:#8C1D1D;border:1px solid #F1A8A8}
.badge.na{background:var(--slate-100);color:#64748B;border:1px solid #CBD5E1}
.badge.use{background:#E0EAF6;color:var(--navy-800);border:1px solid #B9C8DB}
tr.inuse td{background:#EEF4FB}
/* schematic, plots */
.schemWrap{border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;margin:6px 0;overflow-x:auto}
svg text{font-family:var(--font-ui)}
.plotHold{width:100%;height:260px;margin:4px 0 10px}
/* manual */
.manH{font-size:12.5pt;color:var(--navy-900);border-bottom:1.5px solid var(--navy-900);padding-bottom:2px;margin:14px 0 6px;font-family:var(--font-ui)}
.manH3{font-size:10.5pt;color:var(--navy-800);margin:10px 0 4px;font-family:var(--font-ui)}
.manP{margin:5px 0;line-height:1.45}
.manList{margin:4px 0 6px;line-height:1.4}
textarea{min-height:64px;resize:vertical;font-family:var(--font-doc);font-size:10pt}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;font-family:var(--font-ui);font-size:9pt;padding:7px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:.94}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C4CDD8;border-radius:5px}
#printReport{display:none}
/* narrow screens: panels stack and the page scrolls */
@media (max-width:820px){
  html,body{overflow:auto;height:auto}
  #app{position:static;max-width:none;overflow:visible;display:block}
  #main{display:block;overflow:visible}
  #inputPanel{max-width:none;min-width:0;border-right:none;border-bottom:2px solid var(--line);overflow:visible;padding-bottom:12px}
  #tbcInTabs{position:static;margin-top:-9px}
  #outputPanel{overflow:visible;padding:0 8px 40px}
  #projGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tabBar{position:static}
  .fRow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px}
  .eqbW td.wsrc{display:block;width:auto;padding-left:0}
  .hero .hP{text-align:left}
  .plotHold{height:300px}
}
@media print{
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  #toast,#prOverlay{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="titleRow">
      <div>
        <h1>Timber Beam Check &mdash; NDS 2018 (ASD / LRFD)</h1>
        <div class="byline">Sawn lumber, glulam and SCL beams: simple span, continuous spans and cantilevers &middot; bending, shear, bearing, deflection</div>
        <a class="alltools" href="tools.html" target="_top" title="Open the list of all tools">&larr; All tools</a>
      </div>
      <div class="hdrBtns">
        <button type="button" id="btnOpenHdr" title="Open a project file (.json), including files saved by earlier versions of this tool">Open file&hellip;</button>
        <button type="button" id="btnSaveHdr" title="Save the project to a file (.json)">Save file</button>
        <button type="button" id="btnPrint" class="primary" title="Build a printable calculation report">Print report</button>
      </div>
    </div>
    <div id="projGrid"></div>
    <div id="projShare">
      <button type="button" id="btnUseShared" title="Fill the project fields from project info shared by another tool">Use shared project info</button>
      <button type="button" id="btnShare" title="Make these project fields available to the other tools">Share project info</button>
    </div>
  </div>
  <div id="govStrip" class="govStrip"></div>
  <div id="main">
    <div id="inputPanel"></div>
    <div id="outputPanel">
      <div id="tabBar" role="tablist" aria-label="Results"></div>
      <div id="tabPages"></div>
    </div>
  </div>
</div>
<input type="file" id="tbcFile" accept=".json,application/json" style="display:none">
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* BridgeXfer v1 — cross-tool hand-off helper. Spec: HANDOFF.md. Duplicated verbatim in each tool that sends or receives (CLAUDE.md §3). */
(function(){
  if(window.BridgeXfer) return;
  var NS='bridgeSuite.v1.';
  function lsOK(){ try{ var k='__bx_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
  function sharedProject(){
    try{ var m=JSON.parse(localStorage.getItem(NS+'projectMeta')||'null');
      if(m && m._schema==='bridge-project-meta' && m.fields) return { name:m.fields.projectName||'', bridgeId:m.fields.bridgeId||'' };
    }catch(e){}
    return null;
  }
  function stamp(channel, payload, producer, producerFile){
    var p={}; for(var k in payload) if(Object.prototype.hasOwnProperty.call(payload,k)) p[k]=payload[k];
    p.schemaVersion = p.schemaVersion || 1;
    p.producer = p.producer || producer || document.title;
    p.producerFile = p.producerFile || producerFile || decodeURIComponent((location.pathname.split('/').pop()||''));
    p.producedAt = new Date().toISOString();
    if(!p.project) p.project = sharedProject() || { name:'', bridgeId:'' };
    if(!p.notes) p.notes = [];
    return p;
  }
  function publish(channel, payload, producer, producerFile){
    if(!payload || !payload._schema) return { error:'payload has no _schema' };
    var p=stamp(channel, payload, producer, producerFile);
    if(!lsOK()) return { error:'Browser storage is not available. Use "Export hand-off (JSON)" instead.', payload:p };
    try{
      localStorage.setItem(NS+channel, JSON.stringify(p));
      localStorage.setItem(NS+channel+'.updatedAt', p.producedAt);
    }catch(e){ return { error:'Could not save hand-off (storage full?): '+e.message, payload:p }; }
    return { ok:true, payload:p };
  }
  function validate(p, schema, maxVersion){
    if(!p || typeof p!=='object') return 'not a hand-off object';
    if(p._schema!==schema) return 'wrong data type ('+(p._schema||'none')+'), expected '+schema;
    if(!(p.schemaVersion<= (maxVersion||1))) return 'newer format (v'+p.schemaVersion+') than this tool supports (v'+(maxVersion||1)+')';
    return null;
  }
  function read(channel, schema, maxVersion){
    var raw=null;
    try{ raw=localStorage.getItem(NS+channel); }catch(e){ return { error:'Browser storage is not available.' }; }
    if(!raw) return { error:'Nothing has been sent on this channel yet.' , empty:true };
    var p; try{ p=JSON.parse(raw); }catch(e){ return { error:'Stored hand-off is corrupt.' }; }
    var err=validate(p, schema, maxVersion); if(err) return { error:err };
    return { ok:true, payload:p };
  }
  function markAdopted(channel, receiverId, producedAt){
    try{ localStorage.setItem(NS+channel+'.adopted.'+receiverId, producedAt||''); }catch(e){}
  }
  function isNew(channel, receiverId){
    try{
      var at=localStorage.getItem(NS+channel+'.updatedAt'); if(!at) return false;
      return at!==localStorage.getItem(NS+channel+'.adopted.'+receiverId);
    }catch(e){ return false; }
  }
  function exportFile(channel, payload){
    var p=payload; if(!p){ try{ p=JSON.parse(localStorage.getItem(NS+channel)); }catch(e){} }
    if(!p) return { error:'Nothing to export.' };
    var blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(p._schema||channel)+'_'+(p.producedAt||'').slice(0,19).replace(/[:T]/g,'-')+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 60000);

/* Shared project info buttons (HANDOFF.md §4.1, channel bridgeSuite.v1.projectMeta). Uses window.BridgeXfer.
   map: [{shared:'<HANDOFF field>', key:'<this tool's field>', label:'<this tool's label>', accept:optional fn(v)->bool}]
   values: { <tool key>: <current value> } */
(function(){
  if(window.ProjMetaUI) return;
  var FIELDS=['projectName','bridgeId','jobNo','client','location','preparedBy','checkedBy','date'];
  function s(v){ return (v===undefined||v===null)?'':String(v); }
  function share(map, values, producer, producerFile){
    var fields={}; FIELDS.forEach(function(k){ fields[k]=''; });
    map.forEach(function(m){ fields[m.shared]=s(values[m.key]); });
    var r=window.BridgeXfer.publish('projectMeta', {_schema:'bridge-project-meta', project:{ name:fields.projectName, bridgeId:fields.bridgeId }, fields:fields}, producer, producerFile);
    if(r.error){ alert('Could not share project info: '+r.error); return r; }
    var lines=map.map(function(m){ return '  '+m.label+': '+(fields[m.shared]||'(blank)'); });
    alert('Project info shared with the other tools:\n\n'+lines.join('\n'));
    return r;
  }
  function use(map, values, receiverId){
    var r=window.BridgeXfer.read('projectMeta','bridge-project-meta',1);
    if(r.error){ alert('Shared project info: '+r.error+(r.empty?'\n\nOpen a tool that has project info and click "Share project info" first.':'')); return null; }
    var p=r.payload, f=(p.fields&&typeof p.fields==='object')?p.fields:{}, patch={}, lines=[], skipped=[];
    map.forEach(function(m){
      var v=s(f[m.shared]);
      if(v.trim()==='') return;                                   /* never blank a field */
      if(m.accept && !m.accept(v)){ skipped.push('  '+m.label+': "'+v+'" (not a valid value here)'); return; }
      if(v===s(values[m.key])) return;
      patch[m.key]=v; lines.push('  '+m.label+': "'+s(values[m.key])+'" → "'+v+'"');
    });
    if(!lines.length){ alert('Shared project info ('+window.BridgeXfer.describe(p)+') has nothing new for this tool.'+(skipped.length?'\n\nNot used:\n'+skipped.join('\n'):'')); return null; }
    if(!confirm('Use shared project info from '+window.BridgeXfer.describe(p)+'?\n\nThis will overwrite:\n'+lines.join('\n')+(skipped.length?'\n\nNot used:\n'+skipped.join('\n'):''))) return null;
    window.BridgeXfer.markAdopted('projectMeta', receiverId, p.producedAt);
    return patch;
  }
  window.ProjMetaUI={ share:share, use:use };
})();

  return `${spanLab(c.gbSpan)}, x = ${f2(c.xMgov)} ft, ${c.gbSign > 0 ? '+M (top edge in compression)' : '−M (bottom edge in compression)'}`;
}
function bendM(c) { return R.legacyBend ? c.Mmax : c.Mgov; }

function srcTag(builtIn) { return builtIn ? 'NDS Supplement 2018 ' + VFY : 'user-entered'; }

/* ---- Phase 2 helpers (fix log R3): design method (CD or lambda, KF, phi) and material type ---- */
const isLRFD = () => !!(R && R.lrfd);
const sawnOnly = () => !R.isGL && !R.isSCL;
function tfH(c) { return isLRFD() ? `λ = ${c.TF}` : `C<sub>D</sub> = ${c.CD}`; }   // HTML
function tfP(c) { return isLRFD() ? `λ = ${c.TF}` : `CD = ${c.CD}`; }               // plain text
function tfHead() { return isLRFD() ? 'λ' : 'C<sub>D</sub>'; }
function methTxt() { return isLRFD() ? 'LRFD' : 'ASD'; }
const PHI_SUB = { Fb: 'b', Fv: 'v', Fcp: 'c', Emin: 's' };
function tfFac(c) { return isLRFD() ? ['\\lambda', String(c.TF)] : ['C_D', String(c.CD)]; }
function lrfdFac(p) { return isLRFD() ? [['K_F', String(R.KF[p])], ['\\phi_' + PHI_SUB[p], String(R.PHI[p])]] : []; }
function tfWhere(c, what) { return isLRFD() ? ['\\lambda', 'time effect factor, ' + esc(c.name), String(c.TF), '', 'NDS App. N, Table N3 ' + VFY] : ['C_D', what || ('load duration, ' + esc(c.name)), String(c.CD), '', 'NDS Table 2.3.2 ' + VFY]; }
function lrfdWhere(p) { return isLRFD() ? [['K_F', 'format conversion factor (LRFD)', String(R.KF[p]), '', 'NDS App. N, Table N1 ' + VFY], ['\\phi_' + PHI_SUB[p], 'resistance factor (LRFD)', String(R.PHI[p]), '', 'NDS App. N, Table N2 ' + VFY]] : []; }
function fbBase(sign) { return R.isGL ? (sign > 0 ? ['F_{bx}^{+}', g4(R.ref.Fb)] : ['F_{bx}^{-}', g4(R.ref.Fbn)]) : ['F_b', g4(R.ref.Fb)]; }
function fbStarFacs(c) {

}
function fbFacs(c, CL, CV) {
  const f = [tfFac(c), ['C_M', g4(R.CM.Fb)], ['C_t', g4(R.Ct.Fb)]];
  if (sawnOnly()) f.push(['C_L', f3(CL)], ['C_F', f3(R.CF)], ['C_i', g4(R.Ci.Fb)], ['C_{fu}', g4(R.Cfu)], ['C_r', g4(R.Cr)]);
  else {
    if (CV > 1) f.push(['C_L', f3(CL)], ['C_V', f3(CV)]); else f.push(['\\min(C_L, C_V)', `\\min(${f3(CL)}, ${f3(CV)})`]);

}
function fvFacs(c) { const f = [tfFac(c), ['C_M', g4(R.CM.Fv)], ['C_t', g4(R.Ct.Fv)]]; if (sawnOnly()) f.push(['C_i', g4(R.Ci.Fv)]); return f.concat(lrfdFac('Fv')); }
function fcpFacs(j) { const f = [['C_M', g4(R.CM.Fcp)], ['C_t', g4(R.Ct.Fcp)]]; if (sawnOnly()) f.push(['C_i', g4(R.Ci.Fcp)]); f.push(['C_b', f3(R.Cbs[j])]); return f.concat(lrfdFac('Fcp')); }
function eFacs(min) { const f = [['C_M', g4(R.CM.E)], ['C_t', g4(R.Ct.E)]]; if (sawnOnly()) f.push(['C_i', g4(R.Ci.E)]); return min ? f.concat(lrfdFac('Emin')) : f; }
// one TeX line: symbols = values = result
function facEq1(lhs, base, facs, res) { const e = facEq(lhs, base, facs, res); return e[0] + ' = ' + e[1].slice(lhs.length + 3); }
// two TeX lines: symbols, then values = result
function facEq(lhs, base, facs, res) {
  return [`${lhs} = ${base[0]}\\,${facs.map(x => x[0]).join('\\,')}`, `${lhs} = ${base[1]} \\times ${facs.map(x => x[1]).join(' \\times ')} = ${res}`];
}
function whereFb(c, CL, CV, sign) {
  const b = fbBase(sign);
  const rows = [[b[0], R.isGL ? (sign > 0 ? 'reference bending value, tension zone stressed in tension (M > 0)' : 'reference bending value, compression zone stressed in tension (M < 0)') : 'reference bending design value', b[1], 'psi', R.userVals ? 'user-entered' : esc(R.src) + ' ' + VFY],
    tfWhere(c), ['C_M', 'wet service', g4(R.CM.Fb), '', 'Supplement footnotes ' + VFY], ['C_t', 'temperature', g4(R.Ct.Fb), '', 'NDS Table 2.3.3 ' + VFY], ['C_L', 'beam stability', f3(CL), '', 'above']];
  if (sawnOnly()) rows.push(['C_F', esc(R.CFnote), f3(R.CF), '', R.cat === 'dim' && !R.userVals ? 'NDS Supplement Table 4A/4B ' + VFY : 'NDS 4.3.6'], ['C_i', 'incising', g4(R.Ci.Fb), '', 'NDS Table 4.3.8 ' + VFY], ['C_{fu}', 'flat use', g4(R.Cfu), '', (R.cat === 'timber' ? 'Supplement Table 4D footnote ' : 'Supplement Table 4A/4B ') + VFY], ['C_r', 'repetitive member', g4(R.Cr), '', 'NDS 4.3.9 ' + VFY]);

function schematicSVG() {

  if (!(Lt > 0) || Ls.some(v => !(v > 0))) return el('div', 'hint', 'Schematic not drawn: enter positive span lengths.');
  const W = 920, H = 262, m = 60, sc = (W - 2 * m) / Lt, yb = 135, X = x => m + x * sc;
  const xN = nodeXs(); const parts = [];
  parts.push(`<rect x="${X(0)}" y="${yb - 5}" width="${Lt * sc}" height="10" fill="#C08A4E" stroke="#7A5126" stroke-width="1"/>`);
  const wu = R && R.ok ? R.wu : null;
  const wtxt = wu ? ['D', 'L', 'Lr', 'S', 'W'].filter(t => wu[t] !== 0).map(t => `${t} ${f1(wu[t])}`).join(', ') : '';
  if (wtxt) {
    parts.push(`<rect x="${X(0)}" y="${yb - 38}" width="${Lt * sc}" height="26" fill="#DBEAFE" opacity=".7"/>`);
    const n = Math.max(6, Math.round(Lt * sc / 34));
    for (let k = 0; k <= n; k++) { const x = X(Lt * k / n); parts.push(`<line x1="${x}" y1="${yb - 38}" x2="${x}" y2="${yb - 8}" stroke="#2563EB" stroke-width="1"/><path d="M${x - 3} ${yb - 12} L${x} ${yb - 7} L${x + 3} ${yb - 12}" fill="none" stroke="#2563EB"/>`); }
    parts.push(`<text x="${X(0)}" y="${H - 6}" font-size="11" fill="#1E3A8A">Uniform loads w (plf), all spans: ${esc(wtxt)}${R.w_self > 0 ? ' (D includes self-weight)' : ''}</text>`);
  }
  M.geom.supports.forEach((s, j) => {
    const x = X(xN[j]);
    if (s.t === 'pin') parts.push(`<path d="M${x} ${yb + 5} L${x - 9} ${yb + 21} L${x + 9} ${yb + 21} Z" fill="#E2E8F0" stroke="#334155"/><line x1="${x - 13}" y1="${yb + 24}" x2="${x + 13}" y2="${yb + 24}" stroke="#334155" stroke-width="1.5"/>`);
    else if (s.t === 'fixed') { const dir = j === 0 ? -1 : 1; parts.push(`<line x1="${x}" y1="${yb - 22}" x2="${x}" y2="${yb + 22}" stroke="#334155" stroke-width="3"/>`); for (let k = -20; k <= 16; k += 7) parts.push(`<line x1="${x}" y1="${yb + k}" x2="${x + dir * 8}" y2="${yb + k + 7}" stroke="#334155"/>`); }
    parts.push(`<text x="${x}" y="${yb + 42}" font-size="12" font-weight="700" text-anchor="middle" fill="#1E3A5F">${nodeN(j)}</text>`);
  });
  Ls.forEach((Li, i) => {
    const x1 = X(xN[i]), x2 = X(xN[i + 1]), y = yb + 66;
    parts.push(`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#64748B"/><line x1="${x1}" y1="${y - 5}" x2="${x1}" y2="${y + 5}" stroke="#64748B"/><line x1="${x2}" y1="${y - 5}" x2="${x2}" y2="${y + 5}" stroke="#64748B"/>`);
    parts.push(`<text x="${(x1 + x2) / 2}" y="${y - 4}" font-size="11" text-anchor="middle" fill="#334155">${g4(Li)} ft${(M.geom.supports[i].t === 'free' || M.geom.supports[i + 1].t === 'free') ? ' (cantilever)' : ''}</text>`);
  });
  (M.loads.points || []).forEach((p, i) => {
    if (!(p.loc >= 0 && p.loc <= Lt) || !isFinite(p.mag)) return;
    const x = X(p.loc), up = p.mag < 0, y0 = yb - 82, y1 = yb - 6;
    parts.push(`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="#DC2626" stroke-width="2"/>`);
    parts.push(up ? `<path d="M${x - 5} ${y0 + 9} L${x} ${y0} L${x + 5} ${y0 + 9} Z" fill="#DC2626"/>` : `<path d="M${x - 5} ${y1 - 9} L${x} ${y1} L${x + 5} ${y1 - 9} Z" fill="#DC2626"/>`);
    const right = x > W * 0.62;

  });

function discSet() { return new Set([...R.xN, ...(M.loads.points || []).map(p => p.loc)]); }
function vmData(c) {
  const disc = discSet(), xV = [], yV = [], xM = [], yM = [];
  R.xs.forEach(x => {
    const v0 = c.bm.V(x, false); xV.push(x); yV.push(v0);
    if (disc.has(x)) { const v1 = c.bm.V(x, true); if (v1 !== v0) { xV.push(x); yV.push(v1); } }
    const m0 = c.bm.M(x, false); xM.push(x); yM.push(m0);
    if (!R.simple && R.xN.includes(x)) { const m1 = c.bm.M(x, true); if (m1 !== m0) { xM.push(x); yM.push(m1); } }
  });
  return { xV, yV, xM, yM };
}
function envData() {
  const disc = discSet(), x2 = [], vmx = [], vmn = [], xm = [], mmx = [], mmn = [];
  R.xs.forEach(x => {
    const sides = disc.has(x) ? [false, true] : [false];
    sides.forEach(sd => { x2.push(x); const v = R.combos.map(c => c.bm.V(x, sd)); vmx.push(Math.max(...v)); vmn.push(Math.min(...v)); });

}

  const s = R.stab[i]; const same = R.latBot === 'same';

  return { s: sign > 0 ? s.top : s.bot, applies, edge: sign > 0 ? 'top' : 'bottom', setting: sign > 0 ? M.design.latTop : (same ? M.design.latTop + ' (same as top)' : M.design.latBot) };
}
function leTex(s) {
  if (/^2\.06/.test(s.leRule)) return T`l_e = 2.06\,l_u = 2.06 \times ${f1(s.lu)} = ${f1(s.le)}\ \text{in.}`;
  if (/^1\.84/.test(s.leRule)) return T`l_e = 1.84\,l_u = 1.84 \times ${f1(s.lu)} = ${f1(s.le)}\ \text{in.}`;
  return T`l_e = 1.63\,l_u + 3d = 1.63 \times ${f1(s.lu)} + 3 \times ${g4(R.dep)} = ${f1(s.le)}\ \text{in.}`;
}
function clBlock(body, c, i, sign) {
  const st = stabFor(i, sign); const s = st.s;
  const CL = sign > 0 ? c.bend[i].CLt : c.bend[i].CLb;
  if (!st.applies) {
    calc(body, { title: `Beam stability factor C<sub>L</sub> (${st.edge} edge)`, ref: 'NDS 3.3.3.1, 3.3.3.3',
      lines: [T`C_L = 1.0`], result: R.dep <= R.bw ? 'd ≤ b: C<sub>L</sub> = 1.0 (NDS 3.3.3.1)' : `The ${st.edge} (compression) edge is braced continuously: C<sub>L</sub> = 1.0 (NDS 3.3.3.3)` });
    return;
  }
  const Fbs = sign > 0 ? c.Fb_star : c.Fbn_star;   // Fb* of the region (glulam: Fbx+ or Fbx-)
  const r = s.FbE / Fbs;
  calc(body, { title: `Beam stability factor C<sub>L</sub> (${st.edge} edge in compression, ${spanLab(i)})`, ref: 'NDS 3.3.3, Table 3.3.3, Eq. 3.3-5, 3.3-6', status: s.RB > 50 ? 'ng' : undefined,
    lines: [
      T`\frac{l_u}{d} = \frac{${f1(s.lu)}}{${g4(R.dep)}} = ${f2(s.luD)}`,
      leTex(s),
      T`R_B = \sqrt{\frac{l_e\,d}{b^2}} = \sqrt{\frac{${f1(s.le)} \times ${g4(R.dep)}}{${g4(R.bw)}^2}} = ${f2(s.RB)}\ ${s.RB > 50 ? '> 50\\ \\text{(NG)}' : '\\le 50'}`,
      T`F_{bE} = \frac{1.20\,E'_{min}}{R_B^2} = \frac{1.20 \times ${f0(R.Emin_p)}}{${f2(s.RB)}^2} = ${f0(s.FbE)}\ \text{psi}`,
      sawnOnly() && !isLRFD() ? T`F_b^* = F_b\,C_D\,C_M\,C_t\,C_F\,C_i\,C_r = ${f0(c.Fb_star)}\ \text{psi}` : facEq1('F_b^*', fbBase(sign), fbStarFacs(c), `${f0(Fbs)}\\ \\text{psi}`),
      T`C_L = \frac{1 + F_{bE}/F_b^*}{1.9} - \sqrt{\left[\frac{1 + F_{bE}/F_b^*}{1.9}\right]^2 - \frac{F_{bE}/F_b^*}{0.95}} = ${f3(CL)}`],
    where: [['l_u', `unbraced length of the ${st.edge} edge (${(sign > 0 ? M.design.luTop : M.design.luBot) > 0 ? 'entered' : 'span length'})`, f1(s.lu), 'in.', 'input'],
      ['l_e', 'effective length: ' + esc(s.leRule), f1(s.le), 'in.', 'NDS Table 3.3.3' + (R.fn1 ? ' footnote 1' : '')],
      ['F_{bE}/F_b^*', '', f3(r), '', ''], ['E\'_{min}', 'adjusted E<sub>min</sub>' + (isLRFD() ? ' (incl. K<sub>F</sub> φ<sub>s</sub>, LRFD)' : ''), f0(R.Emin_p), 'psi', 'Design Values tab'],
      ...(sawnOnly() ? [] : [['F_b^*', 'all factors except C_L, C_V' + (R.isGL ? ' (and C_fu)' : ''), f0(Fbs), 'psi', 'NDS 3.3.3.8']])],
    result: `C<sub>L</sub> = ${f3(CL)}` + (s.RB > 50 ? ` \u2014 R<sub>B</sub> = ${f2(s.RB)} > 50: not permitted (NDS 3.3.3.7)` : '') });
}
// volume factor of glulam (NDS 5.3.6) / size factor of SCL (manufacturer, NDS 8.3.6)
function cvBlock(body, c, i, sign) {
  const be = c.bend[i], CV = sign > 0 ? be.CVt : be.CVb, CL = sign > 0 ? be.CLt : be.CLb;
  const gov = CV > 1 ? 'C<sub>V</sub> > 1.0: C<sub>L</sub> and C<sub>V</sub> both apply (NDS 8.3.6)' : (CL <= CV ? 'C<sub>L</sub>' : 'C<sub>V</sub>') + ' governs (C<sub>L</sub> and C<sub>V</sub> are not cumulative: the lesser applies)';

    const raw = Math.pow(21 / z.Lz, 1 / x) * Math.pow(12 / R.dep, 1 / x) * Math.pow(5.125 / R.bw, 1 / x);

        T`C_V = \left(\frac{21}{L}\right)^{1/x}\left(\frac{12}{d}\right)^{1/x}\left(\frac{5.125}{b}\right)^{1/x} = \left(\frac{21}{${f3(z.Lz)}}\right)^{1/${x}}\left(\frac{12}{${g4(R.dep)}}\right)^{1/${x}}\left(\frac{5.125}{${g4(R.bw)}}\right)^{1/${x}} = ${raw.toFixed(4)}` + (raw > 1 ? T`\ > 1.0 \Rightarrow C_V = 1.0` : '')],
      where: [['x_1, x_2', 'points of zero moment on either side of the governing moment (or the member end)', `${f3(z.xl)}, ${f3(z.xr)}`, 'ft', 'Analysis Results tab'], ['L', 'length between the points of zero moment', f3(z.Lz), 'ft', 'NDS 5.3.6'],
        ['d, b', 'depth and width (b of the widest piece for multiple-piece laminations)', `${g4(R.dep)}, ${g4(R.bw)}`, 'in.', ''], ['x', R.glX === 20 ? 'Southern Pine' : 'species other than Southern Pine', String(x), '', 'NDS 5.3.6 ' + VFY]],
      result: `C<sub>V</sub> = ${f3(CV)}, C<sub>L</sub> = ${f3(CL)}: ${gov}` });
  } else {
    const raw = Math.pow(R.sclRef / R.dep, R.sclN);
    calc(body, { title: 'Size factor C<sub>V</sub> (manufacturer)', ref: 'NDS 8.3.6; manufacturer’s literature',
      lines: [T`C_V = \left(\frac{d_{ref}}{d}\right)^{n} = \left(\frac{${g4(R.sclRef)}}{${g4(R.dep)}}\right)^{${g4(R.sclN)}} = ${raw.toFixed(4)}` + (raw > R.sclMax ? T`\ > ${g4(R.sclMax)} \Rightarrow C_V = ${g4(R.sclMax)}` : '')],
      where: [['n, d_{ref}', 'exponent and reference depth (manufacturer)', `${g4(R.sclN)}, ${g4(R.sclRef)}`, '', 'user-entered'], ['C_{V,max}', 'limit entered', g4(R.sclMax), '', 'user-entered']],
      result: `C<sub>V</sub> = ${f3(CV)}, C<sub>L</sub> = ${f3(CL)}: ${gov}` });
  }
}
function buildBend(pg) {
  const c = R.gov.b, i = c.gbSpan, sign = R.legacyBend ? (c.bend[0].Mp >= c.bend[0].Mn ? 1 : -1) : c.gbSign;

  mkSec(pg, 'bDemand', 'Bending stress (demand)', body => {
    calc(body, { title: 'Moment and bending stress', ref: 'NDS 3.3.2, Eq. 3.3-2',
      lines: [T`f_b = \frac{M}{S} = \frac{${f0(Mv)} \times 12}{${f3(R.S)}} = ${f0(c.fb)}\ \text{psi}`],
      where: [['M', `${R.legacyBend ? 'largest |M|' : (sign > 0 ? 'largest positive moment' : 'largest negative moment')} in ${spanLab(i)}, ${esc(c.name)}`, f0(Mv), 'ft-lb', 'Analysis Results tab'], ['S', 'section modulus', f3(R.S), 'in³', 'Design Values tab']],
      result: `f<sub>b</sub> = ${f0(c.fb)} psi` });
  });

  if (!sawnOnly()) mkSec(pg, 'bCV', R.isGL ? 'Volume factor C<sub>V</sub> (glulam)' : 'Size factor C<sub>V</sub> (SCL)', body => cvBlock(body, c, i, sign));

      lines: [facEq1("F'_b", fbBase(sign), fbFacs(c, CL, c.CV), `${f0(c.Fb_p)}\\ \\text{psi}`)],

    calc(body, { title: 'Bending check', ref: 'NDS 3.3.1', status: stCls(c.r_b),
      lines: [T`\frac{f_b}{F'_b} = \frac{${f0(c.fb)}}{${f0(c.Fb_p)}} = ${f3(c.r_b)}\ ${c.r_b <= 1 ? '\\le' : '>'}\ 1.0`], result: `Bending ratio ${f3(c.r_b)} (${pct(c.r_b)})` });
  });

    const srows = R.stab.map((s, k) => [spanLab(k), f1(s.top.lu), f1(s.top.le), f2(s.top.RB), f0(s.top.FbE), f1(s.bot.lu), f1(s.bot.le), f2(s.bot.RB), f0(s.bot.FbE)]);

      lines: [sawnOnly() && !isLRFD() ? T`F'_{c\perp} = F_{c\perp}\,C_M\,C_t\,C_i\,C_b = ${g4(r.Fcp)} \times ${g4(R.CM.Fcp)} \times ${g4(R.Ct.Fcp)} \times ${g4(R.Ci.Fcp)} \times ${f3(Cb)} = ${f1(c.Fcp_p)}\ \text{psi}` : facEq1("F'_{c\\perp}", [R.isGL ? 'F_{c\\perp x}' : 'F_{c\\perp}', g4(r.Fcp)], fcpFacs(j), `${f1(c.Fcp_p)}\\ \\text{psi}`)],

      where: [['R', `reaction at support ${nodeN(j)} (downward on the support; uplift taken as 0)`, f0(c.Rbear), 'lb', 'Analysis Results tab'], ['b', 'bearing width (bending width)', g4(R.bw), 'in.', ''], ['l_b', 'bearing length', g4(lb), 'in.', 'input']],
      result: `Bearing ratio ${f3(c.r_c)}` });
  });

   ===================================================================== */
function benchModel(spans, types, w, points, extra) {
  const m = tbcDefaultModel();
  m.geom.spacing = 12; m.geom.spans = spans.map(L => ({ L })); m.geom.supports = types.map(t => ({ t, lb: 3.5, cb: false }));
  m.loads = { D: w, L: 0, Lr: 0, S: 0, W: 0, selfWeight: false, points: points || [] };
  m.design.latTop = 'Continuous'; m.design.latBot = 'Continuous';
  if (extra) extra(m);
  return m;
}
function runBenchmarks() {
  const out = [];

    'Stations: 100 equal divisions per span, every point load and support, plus the analytical zero-shear points for the moment peaks. Shear is evaluated just left and right of each point load and support.',
    'ASD: all ten combinations of ASCE 7-16 Sec. 2.4.1 are evaluated; C<sub>D</sub> is that of the shortest-duration load present (NDS 2.3.2). LRFD: the ten strength combinations of ASCE 7-16 Sec. 2.3.1 for D, L, Lr, S and W, each with λ of NDS Table N3 (1.4D: 0.6; 1.2D + 1.6L + 0.5(Lr or S): 0.8 occupancy / 0.7 storage; 1.2D + 1.6(Lr or S) + (L or 0.5W): 0.8; with 1.0W: 1.0); adjusted values × K<sub>F</sub> × φ (Tables N1, N2), no C<sub>D</sub>. Wind acts on all spans with its sign (+ down, − uplift).',
    'Pattern (skip) live loading is <b>not</b> generated for continuous beams (as in Steel Beam Design); check it separately where it matters.']);
  H('Checks');
  UL(['<b>Bending (NDS 3.3):</b> per span, the largest positive moment is checked with the top-edge C<sub>L</sub> and the largest negative moment with the bottom-edge C<sub>L</sub>. l<sub>u</sub> = the entered unbraced length, else the span length (cantilever: its length). l<sub>e</sub> per Table 3.3.3: a simple span with uniform load only uses the uniform-load row; other loading, continuous beams and cantilevers use the footnote 1 general rule, which is not less than the cantilever rows. R<sub>B</sub> ≤ 50 is enforced (NG otherwise).',
    '<b>Shear (NDS 3.4):</b> V = largest |V| between d from each support face (or to a cantilever tip); f<sub>v</sub> = 3V/2A. Point loads within d are not reduced (O4). End notch (tension face, at end supports): f<sub>v,n</sub> = 3R/(2 b d<sub>n</sub>) with the full reaction, against F′<sub>v</sub>(d<sub>n</sub>/d)<sup>2</sup>; notch > d/4 is NG (NDS 4.4.3.2).',
    '<b>Bearing (NDS 3.10):</b> at every support, f<sub>c⊥</sub> = R/(b l<sub>b</sub>) with the downward reaction; C<sub>b</sub> only when the bearing is ≥ 3 in. from the member end. Net uplift is reported (provide a connection).',
    '<b>Deflection (NDS 3.5):</b> per span, Δ<sub>LL</sub> = max of L, Lr, S, 0.75L + 0.75Lr, 0.75L + 0.75S; Δ<sub>T</sub> = K<sub>cr</sub>Δ<sub>D</sub> + Δ<sub>LL</sub>. Limits L/n with L = span, or twice the cantilever length (IBC Table 1604.3 footnote h). Wind is excluded. Always at service loads (also with LRFD).',
    '<b>Glulam (NDS Ch. 5):</b> F<sub>bx</sub><sup>+</sup> for positive and F<sub>bx</sub><sup>−</sup> for negative moment; volume factor C<sub>V</sub> = (21/L)<sup>1/x</sup>(12/d)<sup>1/x</sup>(5.125/b)<sup>1/x</sup> ≤ 1.0 per bending region, with L = the distance between the points of zero moment around the governing moment (found on the moment diagram of the combination); the lesser of C<sub>L</sub> and C<sub>V</sub> applies (NDS 5.3.6). Wet service per Table 5A. End notch ≤ the lesser of d/10 and 3 in., with C<sub>vr</sub> = 0.72 in the notch shear check. Bearing with the tension-face F<sub>c⊥x</sub>.',
    '<b>SCL (NDS Ch. 8):</b> manufacturer’s values; C<sub>V</sub> = (d<sub>ref</sub>/d)<sup>n</sup> up to the limit entered; the lesser of C<sub>L</sub> and C<sub>V</sub> applies when C<sub>V</sub> ≤ 1.0, both when C<sub>V</sub> > 1.0 (NDS 8.3.6); repetitive member factor C<sub>r</sub> = 1.04 on F<sub>b</sub> (NDS 8.3.7). Wet service, flat use and notches: not covered.',
    '<b>Timbers (Table 4D):</b> C<sub>F</sub> = (12/d)<sup>1/9</sup> for d > 12 in.; no C<sub>r</sub>; flat use with the Table 4D factors (Beams and Stringers).']);
  H('Saved data');
  UL(['<b>Files:</b> Save file writes the project as JSON with <code>_schema: "timber-beam-check"</code> and <code>version: 2</code>, or <code>version: 3</code> when the project uses glulam, SCL or LRFD (so that the earlier version of the tool refuses it instead of reading it as sawn lumber / ASD). Open file reads versions 2 and 3 and every format of the earlier version (the original 11-field file, the full flat file of fix log F18, <code>temp: "High"</code>, custom species in the old <code>F_b</code> shape); those convert with identical results, except that the bottom (negative-moment) edge opens as braced at supports only (engineer\'s decision R1-a, fix log R2; that version took it as braced like the top edge, which can still be chosen as "Same as top edge"). Files of any version that use the 6x8 or 8x8 size open with the Table 1B dressed sizes (5.5 × 7.5 and 7.5 × 7.5 in.; fix log R4), so their results change.',
    `<b>This browser:</b> the last session is autosaved (<code>${LS_AUTO}</code>) and named projects are kept (<code>${LS_PROJ}</code>); the selected input tab is remembered (<code>${TBC_IN_KEY}</code>). All keys start with <code>tbc_</code>.`,
    '<b>Shared project info</b> (bridgeSuite.v1.projectMeta): Client, Job # and Designer are shared and received, as before.']);
  H('Limitations and open items');
  UL(['Built-in reference values and factors must be verified against the printed NDS Supplement (Reference Values tab).',
    'No axial load, no torsion, no lateral load on the weak axis; no interior or compression-face notches (O8); no x/d shear reduction (O4); no sustained live load in creep (O7).',
    'Glulam: straight prismatic members bending about x–x only (no flat use, curvature, taper or balanced-layup option for the stress classes; use custom values). SCL: no product values built in.',
    'Equation numbers are quoted from NDS 2018 as recalled; verify them against the printed standard.',
    'Continuous beams: one section for all spans; no pattern loading; no support settlement.']);
}

/* =====================================================================
   PRINT REPORT
   ===================================================================== */
const PRINT_CSS = `
@media screen{#printReport{display:none!important}}
@media print{
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  body>#app{display:none!important}
  #printReport{display:block!important;font-family:var(--font-doc);color:#111;font-size:10pt}
  @page{margin:0.6in 0.55in}
  .prTitle{border:1.6px solid #16304F;padding:8px 12px;margin-bottom:12px}
  .prTitle h1{font-size:15pt;margin:0 0 4px;color:#16304F}
  .prTitle table{width:100%;border-collapse:collapse;font-size:9pt}
  .prTitle td{padding:1.5px 8px 1.5px 0;vertical-align:top}
  .prSec{page-break-before:always}
  .prSec.first{page-break-before:auto}
  .prSec>h1{font-size:13pt;color:#16304F;border-bottom:1.4px solid #16304F;padding-bottom:2px;margin:0 0 8px}
  .prRunHdr{font-size:7.5pt;color:#5A6B80;border-bottom:.5px solid #B8C2CE;padding-bottom:2px;margin:0 0 6px;display:flex;justify-content:space-between}
  .sec{border:none;margin:6px 0 10px}
  .secHead{background:none!important;border-bottom:1px solid #999;padding:2px 0!important}
  .secHead .caret{display:none}
  .secBody{display:block!important;padding:4px 0!important}
  .tbl th{background:#EFEFEF!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl tr.gov td,.tbl tr.inuse td{background:#F3EEE3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .eqb,.tbl tr,.okBox,.errBox,.warnBox,.note,.hero{page-break-inside:avoid}
  .badge,.okBox,.errBox,.warnBox,.chip .dot,.eqbR .st{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .prPlotImg{width:100%;max-width:7in;display:block;margin:4px auto;page-break-inside:avoid}
  .prFoot{margin-top:10px;padding-top:4px;border-top:1px solid #999;font-size:8pt;color:#444;display:flex;justify-content:space-between}
  .tscroll{overflow:visible}
  #dash{display:block;column-count:2}
  #dash .chip{break-inside:avoid;margin-bottom:3px}
}`;
const PR_LABELS = { sum: 'Summary and governing results', sch: 'Schematic and inputs', ana: 'Analysis results (diagrams, reactions)', dv: 'Design values and adjustment factors', bend: 'Bending', shear: 'Shear', bear: 'Bearing', defl: 'Deflection', refv: 'Reference values (built-in tables)', val: 'Validation', man: 'Method and manual' };
const PR_DEFAULT = { sum: true, sch: true, ana: true, dv: true, bend: true, shear: true, bear: true, defl: true, refv: false, val: false, man: false };
function openPrintDialog() {
  if (!M.ui.print || typeof M.ui.print !== 'object') M.ui.print = {};
  const sel = Object.assign({}, PR_DEFAULT, M.ui.print);
  const ov = el('div'); ov.id = 'prOverlay'; ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:60;display:flex;align-items:center;justify-content:center';
  const box = el('div'); box.style.cssText = 'background:#fff;border-radius:8px;padding:16px 20px;width:min(420px,92vw);max-height:84vh;overflow:auto;font-family:var(--font-ui);box-shadow:0 12px 40px rgba(0,0,0,.3)';
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Print report');
  box.appendChild(el('div', null, '<b style="font-size:11pt">Print report — select contents</b>'));
  box.appendChild(el('div', 'hint', 'The report re-renders the result pages with every section expanded, a title block and the diagrams as images. Use the browser’s print dialog to print or save as PDF.'));
  if (!R.ok) box.appendChild(el('div', 'errBox', 'There are no results (input errors). The report will list the errors.'));
  Object.keys(PR_LABELS).forEach(id => {
    const r = el('label'); r.style.cssText = 'display:flex;gap:8px;align-items:center;padding:3px 0;font-size:9.5pt;cursor:pointer';
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!sel[id]; c.addEventListener('change', () => { M.ui.print[id] = c.checked; autosave(); });
    r.appendChild(c); r.appendChild(el('span', null, PR_LABELS[id])); box.appendChild(r);
  });
  const row = el('div', 'btnRow'); row.style.marginTop = '10px';
  const go = el('button', 'btn primary', 'Build and print'); go.type = 'button'; go.addEventListener('click', () => { ov.remove(); buildPrintReport(); });
  const ca = el('button', 'btn', 'Cancel'); ca.type = 'button'; ca.addEventListener('click', () => ov.remove());
  row.appendChild(go); row.appendChild(ca); box.appendChild(row); ov.appendChild(box);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov); go.focus();
}
async function buildPrintReport(opts) {
  opts = opts || {};
  const sel = Object.assign({}, PR_DEFAULT, M.ui.print || {});
  const old = $('printReport'); if (old) old.remove();
  const pr = el('div'); pr.id = 'printReport'; document.body.appendChild(pr);
  const p = M.project, today = new Date().toISOString().slice(0, 10);
  const tb = el('div', 'prTitle'); tb.appendChild(el('h1', null, 'Timber Beam Check — NDS 2018 (' + (M.design.method === 'LRFD' ? 'LRFD' : 'ASD') + ')'));
  const tt = el('table'); const mk = (a, b, c, d) => { const tr = el('tr'); tr.appendChild(el('td', null, '<b>' + a + ':</b> ' + esc(b || '—'))); tr.appendChild(el('td', null, c ? '<b>' + c + ':</b> ' + esc(d || '—') : '')); tt.appendChild(tr); };
  mk('Project', p.name, 'Job #', p.job); mk('Member', p.member, 'Client', p.client); mk('Designer', p.designer, 'Checked by', p.checker); mk('Date', p.date || today, 'Member', R.ok ? memberTxt() : '');
  tb.appendChild(tt); pr.appendChild(tb);
  if (R.ok) pr.appendChild(el('div', isNG() ? 'errBox' : 'okBox', `<b>Governing: ${esc(R.fails.length ? 'Code limit violated (NG)' : R.ctrlName)} — ${pct(R.dcrMax)}</b> (${esc(ctrlDetail())}) — ${isNG() ? 'DOES NOT PASS' : 'all checks pass'}`));
  else pr.appendChild(errPanel());
  if ((p.notes || '').trim()) pr.appendChild(el('div', 'note', '<b>Notes and assumptions:</b><br>' + esc(p.notes).replace(/\n/g, '<br>')));
  const names = {}; OUT_TABS.forEach(t => names[t[0]] = t[1]);
  $('tabPages').innerHTML = ''; PLOTQ = [];
  let first = true; const plots = [];
  for (const id of OUT_TABS.map(t => t[0])) {
    if (!sel[id]) continue;
    if (!R.ok && !['refv', 'val', 'man', 'sch'].includes(id)) continue;
    const sec = el('div', 'prSec' + (first ? ' first' : '')); first = false;
    sec.appendChild(el('div', 'prRunHdr', `<span>${esc(p.name || '')}${p.member ? ' — ' + esc(p.member) : ''}</span><span>${esc(names[id])}</span><span>${esc(p.designer || '')} · ${esc(p.date || today)}</span>`));
    sec.appendChild(el('h1', null, esc(names[id])));
    const holder = el('div'); sec.appendChild(holder); __secNum = 0;
    try { BUILDERS()[id](holder); } catch (e) { holder.appendChild(el('div', 'errBox', 'Section failed to build: ' + esc(e.message))); }
    pr.appendChild(sec);
  }
  // diagrams as images
  PLOTQ = [];
  const holds = Array.from(pr.querySelectorAll('.plotHold'));
  for (let k = 0; k < holds.length; k++) {
    const h = holds[k]; let fig = null;
    try { fig = h.id === 'plotV' ? figV(diagCombo()) : h.id === 'plotM' ? figM(diagCombo()) : h.id === 'plotD' ? figD() : null; } catch (e) { fig = null; }
    if (!fig || typeof Plotly === 'undefined') { h.replaceWith(el('div', 'hint', '[diagram unavailable offline; see the tables]')); continue; }
    const lay = Object.assign({}, fig.layout, { width: 900, height: 260 });
    plots.push(Plotly.toImage({ data: fig.data, layout: lay }, { format: 'png', width: 900, height: 260, scale: 2 }).then(url => { const img = document.createElement('img'); img.src = url; img.className = 'prPlotImg'; img.alt = 'diagram'; h.replaceWith(img); }).catch(() => h.replaceWith(el('div', 'hint', '[diagram unavailable]'))));
  }
  try { await Promise.all(plots); } catch (e) { }
  pr.querySelectorAll('.secBody').forEach(b => { b.style.display = 'block'; });
  pr.appendChild(el('div', 'prFoot', `<span>${esc(p.name || '')}${p.member ? ' — ' + esc(p.member) : ''}</span><span>Timber Beam Check.html · NDS 2018 ${M.design.method === 'LRFD' ? 'LRFD' : 'ASD'} · printed ${today}</span>`));
  const cleanup = () => { const n = $('printReport'); if (n) n.remove(); renderTab(); window.removeEventListener('afterprint', cleanup); };
  try { await document.fonts.ready; } catch (e) { }   // KaTeX glyph fonts used only in the report must be loaded before printing
  if (opts.noPrint) return pr;
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => { window.print(); setTimeout(() => { if ($('printReport')) cleanup(); }, 1500); }, 60);
  return pr;
}

/* =====================================================================
   START-UP
   ===================================================================== */
function tbcInit() {
  const st = document.createElement('style'); st.textContent = PRINT_CSS; document.head.appendChild(st);
  wireFile();
  const raw = lsGet(LS_AUTO);
  if (raw) { try { M = tbcMigrate(JSON.parse(raw)).model; } catch (e) { M = tbcDefaultModel(); } }
  fullRebuild();
  window.addEventListener('resize', () => { if (typeof Plotly !== 'undefined') document.querySelectorAll('.plotHold.js-plotly-plot').forEach(d => { try { Plotly.Plots.resize(d); } catch (e) { } }); });
}
// test / automation hook (read-only use; not part of the saved data)
window.TBC = { get model() { return M; }, get res() { return R; }, flush, fullRebuild, load: (d) => loadModel(d), buildPrintReport, run: tbcRun, migrate: tbcMigrate };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tbcInit); else tbcInit();
</script>
