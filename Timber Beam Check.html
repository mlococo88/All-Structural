<script>
/* BridgeXfer v1 — cross-tool hand-off helper. Spec: HANDOFF.md. Duplicated verbatim in each tool that sends or receives (CLAUDE.md §3). */
(function(){
  if(window.BridgeXfer) return;
  var NS='bridgeSuite.v1.';
  function lsOK(){ try{ var k='__bx_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
  function sharedProject(){
    try{ var m=JSON.parse(localStorage.getItem(NS+'projectMeta')||'null');
      if(m && m._schema==='bridge-project-meta' && m.fields) return { name:m.fields.projectName||'', bridgeId:m.fields.bridgeId||'' };
    }catch(e){}
    return null;
  }
  function stamp(channel, payload, producer, producerFile){
    var p={}; for(var k in payload) if(Object.prototype.hasOwnProperty.call(payload,k)) p[k]=payload[k];
    p.schemaVersion = p.schemaVersion || 1;
    p.producer = p.producer || producer || document.title;
    p.producerFile = p.producerFile || producerFile || decodeURIComponent((location.pathname.split('/').pop()||''));
    p.producedAt = new Date().toISOString();
    if(!p.project) p.project = sharedProject() || { name:'', bridgeId:'' };
    if(!p.notes) p.notes = [];
    return p;
  }
  function publish(channel, payload, producer, producerFile){
    if(!payload || !payload._schema) return { error:'payload has no _schema' };
    var p=stamp(channel, payload, producer, producerFile);
    if(!lsOK()) return { error:'Browser storage is not available. Use "Export hand-off (JSON)" instead.', payload:p };
    try{
      localStorage.setItem(NS+channel, JSON.stringify(p));
      localStorage.setItem(NS+channel+'.updatedAt', p.producedAt);
    }catch(e){ return { error:'Could not save hand-off (storage full?): '+e.message, payload:p }; }
    return { ok:true, payload:p };
  }
  function validate(p, schema, maxVersion){
    if(!p || typeof p!=='object') return 'not a hand-off object';
    if(p._schema!==schema) return 'wrong data type ('+(p._schema||'none')+'), expected '+schema;
    if(!(p.schemaVersion<= (maxVersion||1))) return 'newer format (v'+p.schemaVersion+') than this tool supports (v'+(maxVersion||1)+')';
    return null;
  }
  function read(channel, schema, maxVersion){
    var raw=null;
    try{ raw=localStorage.getItem(NS+channel); }catch(e){ return { error:'Browser storage is not available.' }; }
    if(!raw) return { error:'Nothing has been sent on this channel yet.' , empty:true };
    var p; try{ p=JSON.parse(raw); }catch(e){ return { error:'Stored hand-off is corrupt.' }; }
    var err=validate(p, schema, maxVersion); if(err) return { error:err };
    return { ok:true, payload:p };
  }
  function markAdopted(channel, receiverId, producedAt){
    try{ localStorage.setItem(NS+channel+'.adopted.'+receiverId, producedAt||''); }catch(e){}
  }
  function isNew(channel, receiverId){
    try{
      var at=localStorage.getItem(NS+channel+'.updatedAt'); if(!at) return false;
      return at!==localStorage.getItem(NS+channel+'.adopted.'+receiverId);
    }catch(e){ return false; }
  }
  function exportFile(channel, payload){
    var p=payload; if(!p){ try{ p=JSON.parse(localStorage.getItem(NS+channel)); }catch(e){} }
    if(!p) return { error:'Nothing to export.' };
    var blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(p._schema||channel)+'_'+(p.producedAt||'').slice(0,19).replace(/[:T]/g,'-')+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 60000);
    return { ok:true };
  }
  function importFile(file, schema, maxVersion, cb){
    var fr=new FileReader();
    fr.onload=function(){ var p; try{ p=JSON.parse(fr.result); }catch(e){ cb({ error:'File is not valid JSON.' }); return; }
      var err=validate(p, schema, maxVersion); cb(err? { error:err } : { ok:true, payload:p }); };
    fr.onerror=function(){ cb({ error:'Could not read file.' }); };
    fr.readAsText(file);
  }
  function describe(p){ return (p.producer||'?')+' — '+(p.producedAt? new Date(p.producedAt).toLocaleString():'?')+((p.project&&p.project.name)?' — '+p.project.name:''); }
  window.BridgeXfer={ NS:NS, publish:publish, read:read, validate:validate, markAdopted:markAdopted, isNew:isNew, exportFile:exportFile, importFile:importFile, describe:describe, sharedProject:sharedProject };
})();
</script>
<script>
/* Shared project info buttons (HANDOFF.md §4.1, channel bridgeSuite.v1.projectMeta). Uses window.BridgeXfer.
   map: [{shared:'<HANDOFF field>', key:'<this tool's field>', label:'<this tool's label>', accept:optional fn(v)->bool}]
   values: { <tool key>: <current value> } */
(function(){
  if(window.ProjMetaUI) return;
  var FIELDS=['projectName','bridgeId','jobNo','client','location','preparedBy','checkedBy','date'];
  function s(v){ return (v===undefined||v===null)?'':String(v); }
  function share(map, values, producer, producerFile){
    var fields={}; FIELDS.forEach(function(k){ fields[k]=''; });
    map.forEach(function(m){ fields[m.shared]=s(values[m.key]); });
    var r=window.BridgeXfer.publish('projectMeta', {_schema:'bridge-project-meta', project:{ name:fields.projectName, bridgeId:fields.bridgeId }, fields:fields}, producer, producerFile);
    if(r.error){ alert('Could not share project info: '+r.error); return r; }
    var lines=map.map(function(m){ return '  '+m.label+': '+(fields[m.shared]||'(blank)'); });
    alert('Project info shared with the other tools:\n\n'+lines.join('\n'));
    return r;
  }
  function use(map, values, receiverId){
    var r=window.BridgeXfer.read('projectMeta','bridge-project-meta',1);
    if(r.error){ alert('Shared project info: '+r.error+(r.empty?'\n\nOpen a tool that has project info and click "Share project info" first.':'')); return null; }
    var p=r.payload, f=(p.fields&&typeof p.fields==='object')?p.fields:{}, patch={}, lines=[], skipped=[];
    map.forEach(function(m){
      var v=s(f[m.shared]);
      if(v.trim()==='') return;                                   /* never blank a field */
      if(m.accept && !m.accept(v)){ skipped.push('  '+m.label+': "'+v+'" (not a valid value here)'); return; }
      if(v===s(values[m.key])) return;
      patch[m.key]=v; lines.push('  '+m.label+': "'+s(values[m.key])+'" → "'+v+'"');
    });
    if(!lines.length){ alert('Shared project info ('+window.BridgeXfer.describe(p)+') has nothing new for this tool.'+(skipped.length?'\n\nNot used:\n'+skipped.join('\n'):'')); return null; }
    if(!confirm('Use shared project info from '+window.BridgeXfer.describe(p)+'?\n\nThis will overwrite:\n'+lines.join('\n')+(skipped.length?'\n\nNot used:\n'+skipped.join('\n'):''))) return null;
    window.BridgeXfer.markAdopted('projectMeta', receiverId, p.producedAt);
    return patch;
  }
  window.ProjMetaUI={ share:share, use:use };
})();
/* Timber Beam Check: shared project info field map ("Project & Geometry" section). */
var TBC_PROJ_MAP=[{shared:'client',key:'client',label:'Client'},
                  {shared:'jobNo',key:'job',label:'Job #'},
                  {shared:'preparedBy',key:'designer',label:'Designer'}];
</script>
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Calculator, Printer, Info, AlertTriangle, CheckCircle, XCircle, 
            ChevronDown, ChevronRight, Settings, Maximize2, Minimize2,
            ArrowDown, Ruler, MoreHorizontal, Lock, Unlock, Eye, EyeOff,
            Moon, Sun, Zap, Save, Upload, FileDown, Plus, Trash2, Briefcase, 
            MousePointer2, LayoutTemplate, FileText, Menu, X, Check, DollarSign
        } from 'https://esm.sh/lucide-react@0.292.0';

        // --- DATABASE ---
        // Species: name, specific gravity G and density (pcf, used for self-weight only).
        // Strength/stiffness values come from the NDS tables below (REF_4A / REF_4B_SP), per grade.
        const DEFAULT_SPECIES = {
            'DF-L': { name: 'Douglas Fir-Larch', G: 0.50, dens: 34 },
            'SP': { name: 'Southern Pine', G: 0.55, dens: 36 },
            'HF': { name: 'Hem-Fir', G: 0.43, dens: 30 },
            'SPF': { name: 'Spruce-Pine-Fir', G: 0.42, dens: 29 },
        };

        const GRADES_DB = {
            'SS': { name: 'Select Structural' },
            'No.1': { name: 'No. 1' },
            'No.2': { name: 'No. 2' },
            'Stud': { name: 'Stud' },
        };

        // NDS 2018 Supplement reference design values (ASD), visually graded dimension lumber 2"-4" thick.
        // Array order: [Fb, Ft, Fv, Fc_perp, Fc, E, Emin] in psi. null = not built in (use Manual values).
        // Table 4A (DF-L, HF, SPF): CF, CM, Cfu per the Table 4A footnotes are applied by the engine.
        const REF_4A = {
            'DF-L': { 'SS': [1500, 1000, 180, 625, 1700, 1900000, 690000], 'No.1': [1000, 675, 180, 625, 1500, 1700000, 620000], 'No.2': [900, 575, 180, 625, 1350, 1600000, 580000], 'Stud': [700, 450, 180, 625, 850, 1400000, 510000] },
            'HF':   { 'SS': [1400, 925, 150, 405, 1500, 1600000, 580000], 'No.1': [975, 625, 150, 405, 1350, 1500000, 550000], 'No.2': [850, 525, 150, 405, 1300, 1300000, 470000], 'Stud': [675, 400, 150, 405, 800, 1200000, 440000] },
            'SPF':  { 'SS': [1250, 700, 135, 425, 1400, 1500000, 550000], 'No.1': [875, 450, 135, 425, 1150, 1400000, 510000], 'No.2': [875, 450, 135, 425, 1150, 1400000, 510000], 'Stud': [675, 350, 135, 425, 725, 1200000, 440000] },
        };
        // Table 4B Southern Pine: values are tabulated per nominal width and already include size effects (CF = 1.0 for Fb,
        // except 0.9 for widths over 12 in.). Only No.2 is built in; Ft and Fc are not entered (not used by this beam check).
        const REF_4B_SP = {
            'No.2': {
                '2-4': [1100, null, 175, 565, null, 1400000, 510000],
                '5-6': [1000, null, 175, 565, null, 1400000, 510000],
                '8':   [925,  null, 175, 565, null, 1400000, 510000],
                '10':  [800,  null, 175, 565, null, 1400000, 510000],
                '12':  [750,  null, 175, 565, null, 1400000, 510000],
            },
        };
        // Table 4A size factor CF for Fb, by nominal width (in.): [2" & 3" thick, 4" thick]. Grades SS, No.1, No.2, No.3.
        const T4A_CF_FB = { 3: [1.5, 1.5], 4: [1.5, 1.5], 5: [1.4, 1.4], 6: [1.3, 1.3], 8: [1.2, 1.3], 10: [1.1, 1.2], 12: [1.0, 1.1], 14: [0.9, 1.0] };
        // Table 4A size factor CF for Fb, Stud grade (8" and wider: Table 4A directs use of No.3 values, not built in).
        const T4A_CF_FB_STUD = { 3: 1.1, 4: 1.1, 5: 1.0, 6: 1.0 };
        // Table 4A / 4B flat use factor Cfu, by nominal width (in.): [2" & 3" thick, 4" thick].
        const T4A_CFU = { 3: [1.00, 1.00], 4: [1.10, 1.00], 5: [1.10, 1.05], 6: [1.15, 1.05], 8: [1.15, 1.05], 10: [1.20, 1.10], 12: [1.20, 1.10], 14: [1.20, 1.10] };
        // Load duration factors CD (NDS 2018 Table 2.3.2) by load type; a combination uses the shortest-duration load present.
        const LOAD_CD = { D: 0.9, L: 1.0, S: 1.15, Lr: 1.25, W: 1.6 };
        // ASD load combinations (ASCE 7-16 Sec. 2.4.1). Keys of the first six match the old loadCombo values (saved files).
        const COMBOS = [
            { key: 'D', name: 'D', f: { D: 1 } },
            { key: 'D+L', name: 'D + L', f: { D: 1, L: 1 } },
            { key: 'D+Lr', name: 'D + Lr', f: { D: 1, Lr: 1 } },
            { key: 'D+S', name: 'D + S', f: { D: 1, S: 1 } },
            { key: 'D+0.75(L+S)', name: 'D + 0.75L + 0.75S', f: { D: 1, L: 0.75, S: 0.75 } },
            { key: 'D+0.6W', name: 'D + 0.6W', f: { D: 1, W: 0.6 } },
            { key: 'D+0.75(L+Lr)', name: 'D + 0.75L + 0.75Lr', f: { D: 1, L: 0.75, Lr: 0.75 } },
            { key: 'D+0.75L+0.45W+0.75Lr', name: 'D + 0.75L + 0.75(0.6W) + 0.75Lr', f: { D: 1, L: 0.75, W: 0.45, Lr: 0.75 } },
            { key: 'D+0.75L+0.45W+0.75S', name: 'D + 0.75L + 0.75(0.6W) + 0.75S', f: { D: 1, L: 0.75, W: 0.45, S: 0.75 } },
            { key: '0.6D+0.6W', name: '0.6D + 0.6W', f: { D: 0.6, W: 0.6 } },
        ];
        // Transient (live/snow/roof live) load cases used for the live-load deflection check.
        const DEFL_TRANSIENT = [
            { name: 'L', f: { L: 1 } }, { name: 'Lr', f: { Lr: 1 } }, { name: 'S', f: { S: 1 } },
            { name: '0.75L + 0.75Lr', f: { L: 0.75, Lr: 0.75 } }, { name: '0.75L + 0.75S', f: { L: 0.75, S: 0.75 } },
        ];

        const SIZES_DB = [
            { label: '2x4', b: 1.5, d: 3.5 }, { label: '2x6', b: 1.5, d: 5.5 },
            { label: '2x8', b: 1.5, d: 7.25 }, { label: '2x10', b: 1.5, d: 9.25 },
            { label: '2x12', b: 1.5, d: 11.25 }, { label: '4x4', b: 3.5, d: 3.5 },
            { label: '4x6', b: 3.5, d: 5.5 }, { label: '6x6', b: 5.5, d: 5.5 },
            { label: '6x8', b: 5.5, d: 7.25 }, { label: '8x8', b: 7.25, d: 7.25 },
            { label: 'Custom', b: 0, d: 0 },
        ];

        // --- CALCULATION ENGINE (NDS 2018, ASD) ---
        // Nominal width group (in.) from actual dressed width d (in.). A non-standard width rounds UP to the next
        // group, which gives the smaller (conservative) CF and, for SP, the smaller tabulated Fb.
        const widthGroup = (d) => d <= 2.5 ? 3 : d <= 3.5 ? 4 : d <= 4.5 ? 5 : d <= 5.5 ? 6 : d <= 7.25 ? 8 : d <= 9.25 ? 10 : d <= 11.25 ? 12 : 14;
        // Temperature factor Ct, NDS 2018 Table 2.3.3. 'High' is the old saved value and maps to 125-150 F.
        const ctFactors = (temp, wet) => {
            if (temp === '100-125') return { E: 0.9, other: wet ? 0.7 : 0.8 };
            if (temp === '125-150' || temp === 'High') return { E: 0.9, other: wet ? 0.5 : 0.7 };
            return { E: 1.0, other: 1.0 };
        };

        function runTimberCheck(inp) {
            const errors = [];  // input/data problems: results are not valid
            const fails = [];   // code limits violated: member is NG regardless of stress ratios
            const notes = [];   // informational
            const num = (v) => (typeof v === 'number' && isFinite(v)) ? v : NaN;
            const L = num(inp.span);
            const spacing = num(inp.spacing);
            if (!(L > 0)) errors.push('Span must be greater than zero.');
            if (!(spacing > 0)) errors.push('Spacing must be greater than zero.');

            // Section and size class
            const sz = SIZES_DB.find(s => s.label === inp.sizeLabel);
            const isCustom = inp.sizeLabel === 'Custom' || !sz;
            const b = isCustom ? num(inp.customB) : sz.b;
            const d = isCustom ? num(inp.customD) : sz.d;
            let cat = null, wg = null, thick4 = false;
            if (!(b > 0) || !(d > 0)) errors.push('Section b and d must be greater than zero.');
            else if (b > d) errors.push('b must not exceed d. Enter the section edgewise (b = thickness, d = width) and use Flat Use for loading on the wide face.');
            else if (b >= 4.5) cat = 'timber';
            else if (b <= 3.5) { cat = 'dim'; wg = widthGroup(d); thick4 = b > 2.5; }
            else errors.push('Thickness between 3.5 in. and 4.5 in. is not a standard sawn-lumber size category.');

            // Reference design values
            const custom = (inp.customMaterials && !inp.isManual) ? inp.customMaterials[inp.species] : null;
            const userVals = !!(inp.isManual || custom);
            let ref = null, src = '', cfIncluded = false, G = NaN, dens = NaN;
            if (userVals) {
                const m = (inp.isManual ? inp.manualProps : custom) || {};
                ref = { Fb: num(m.Fb), Ft: null, Fv: num(m.Fv), Fcp: num(m.FcPerp), Fc: null, E: num(m.E), Emin: num(m.Emin) };
                G = num(m.G); dens = num(m.dens); cfIncluded = !!m.cfIncluded;
                src = inp.isManual ? 'Manual (user-entered reference values)' : `Custom species "${inp.species}" (user-entered reference values)`;
                if (![ref.Fb, ref.Fv, ref.Fcp, ref.E, ref.Emin].every(v => v > 0)) errors.push('Enter all reference design values (Fb, Fv, Fc⊥, E, Emin) greater than zero.');
                if (inp.selfWeight && !(dens >= 0)) errors.push('Enter the density (pcf) for self-weight, or turn self-weight off.');
            } else {
                const sp = DEFAULT_SPECIES[inp.species];
                const gName = GRADES_DB[inp.grade] ? GRADES_DB[inp.grade].name : String(inp.grade);
                if (!sp) errors.push(`Unknown species "${inp.species}".`);
                else if (!GRADES_DB[inp.grade]) errors.push(`Unknown grade "${inp.grade}".`);
                else {
                    G = sp.G; dens = sp.dens;
                    let arr = null;
                    if (cat === 'timber') errors.push('Timbers (5 in. x 5 in. and larger) use NDS Supplement Table 4D values, which are not built in. Use Manual values (Man).');
                    else if (cat === 'dim') {
                        if (inp.species === 'SP') {
                            const grp = wg <= 4 ? '2-4' : wg <= 6 ? '5-6' : wg >= 12 ? '12' : String(wg);
                            arr = REF_4B_SP[inp.grade] ? REF_4B_SP[inp.grade][grp] : null;
                            cfIncluded = true;
                            src = `NDS Supplement 2018 Table 4B, Southern Pine ${gName}, ${grp === '2-4' ? '2"-4"' : grp === '5-6' ? '5"-6"' : grp + '"'} wide`;
                            if (!arr) errors.push(`Southern Pine ${gName} values (Table 4B) are not built in. Use Manual values (Man).`);
                        } else if (inp.grade === 'Stud' && wg >= 8) {
                            errors.push('Stud grade 8 in. and wider: Table 4A directs use of No.3 values, which are not built in. Use Manual values (Man).');
                        } else {
                            arr = REF_4A[inp.species] ? REF_4A[inp.species][inp.grade] : null;
                            src = `NDS Supplement 2018 Table 4A, ${sp.name} ${gName}`;
                            if (!arr) errors.push(`${sp.name} ${gName} values are not built in. Use Manual values (Man).`);
                        }
                    }
                    if (arr) ref = { Fb: arr[0], Ft: arr[1], Fv: arr[2], Fcp: arr[3], Fc: arr[4], E: arr[5], Emin: arr[6] };
                }
            }

            const flat = !!inp.flatUse;
            if (flat && cat === 'timber') errors.push('Flat use of timbers is not supported (Table 4D flat-use factors are not built in).');

            // Bearing
            const lb = num(inp.bearingLen);
            if (!(lb > 0)) errors.push('Bearing length must be greater than zero.');

            // Point loads (positive = downward), validated against the span
            const pls = (inp.pointLoads || []).map(p => ({ mag: num(p && p.mag), loc: num(p && p.loc), type: (p && LOAD_CD[p.type] !== undefined) ? p.type : 'D' }));
            pls.forEach((p, i) => {
                if (!isFinite(p.mag)) errors.push(`Point load ${i + 1}: magnitude is not a number.`);
                if (!(p.loc >= 0 && p.loc <= L)) errors.push(`Point load ${i + 1}: location ${isFinite(p.loc) ? p.loc : '(blank)'} ft is outside the span (0 to ${L} ft).`);
            });

            const LLdiv = num(inp.deflLimitLL), TLdiv = num(inp.deflLimitTL);
            if (!(LLdiv > 0) || !(TLdiv > 0)) errors.push('Deflection limits (L/n) must be greater than zero.');

            const notch = isFinite(num(inp.notchDepth)) ? num(inp.notchDepth) : 0;

            const base = { ok: false, errors, fails, notes, b, d, cat, wg, ref, src, flat, G, dens, userVals };
            if (errors.length || !ref || !cat) return base;

            // Orientation: bending width bw and bending depth dep
            const bw = flat ? d : b;
            const dep = flat ? b : d;
            const A = b * d;
            const S = bw * dep * dep / 6;
            const I = bw * dep * dep * dep / 12;

            // --- Adjustment factors (NDS 2018 Table 4.3.1, sawn lumber, ASD) ---
            const wet = inp.moisture === 'Wet';
            const useStudCF = !userVals && inp.grade === 'Stud';
            let CF = 1.0, CFnote = '';
            if (cat === 'dim') {
                if (cfIncluded) { CF = (!userVals && inp.species === 'SP' && wg >= 14) ? 0.9 : 1.0; CFnote = !userVals ? 'Table 4B (size-specific values)' : 'included in entered Fb'; }
                else if (useStudCF) { CF = T4A_CF_FB_STUD[wg]; CFnote = `Table 4A Stud, ${wg}" wide`; }
                else { CF = T4A_CF_FB[wg][thick4 ? 1 : 0]; CFnote = `Table 4A, ${wg >= 14 ? '14"+' : wg + '"'} wide, ${thick4 ? '4"' : '2"-3"'} thick`; }
            } else {
                CF = (!cfIncluded && d > 12) ? Math.pow(12 / d, 1 / 9) : 1.0; CFnote = 'NDS 4.3.6.2, (12/d)^(1/9) for d > 12"';
            }
            // Wet service factor CM: Table 4A/4B footnotes (dimension lumber); Table 4D (timbers)
            const CM = { Fb: 1.0, Fv: 1.0, Fcp: 1.0, E: 1.0 };
            if (wet) {
                if (cat === 'timber') { CM.Fcp = 0.67; }
                else { CM.Fb = (ref.Fb * CF > 1150) ? 0.85 : 1.0; CM.Fv = 0.97; CM.Fcp = 0.67; CM.E = 0.9; }
            }
            const ct = ctFactors(inp.temp, wet);
            const Ct = { Fb: ct.other, Fv: ct.other, Fcp: ct.other, E: ct.E };
            const ciOn = !!inp.incising;
            const Ci = { Fb: ciOn ? 0.80 : 1.0, Fv: ciOn ? 0.80 : 1.0, Fcp: 1.0, E: ciOn ? 0.95 : 1.0 };
            const Cr = (inp.repetitive && cat === 'dim' && spacing <= 24) ? 1.15 : 1.0;
            if (inp.repetitive && cat !== 'dim') notes.push('Cr applies to dimension lumber only (NDS 4.3.9); Cr = 1.0 used.');
            if (inp.repetitive && cat === 'dim' && spacing > 24) notes.push('Cr requires spacing ≤ 24 in. (NDS 4.3.9); Cr = 1.0 used.');
            const Cfu = (flat && cat === 'dim') ? T4A_CFU[wg][thick4 ? 1 : 0] : 1.0;
            const Cb = (inp.bearingInterior && lb < 6) ? (lb + 0.375) / lb : 1.0;

            // --- Beam stability (NDS 3.3.3) ---
            const unb = num(inp.unbracedLen);
            const lu = ((unb > 0) ? unb : L) * 12;
            const luD = lu / dep;
            const hasPL = pls.some(p => p.mag !== 0);
            let le, leRule;
            if (luD < 7) { le = 2.06 * lu; leRule = '2.06 lu (lu/d < 7)'; }
            else if (hasPL && luD > 14.3) { le = 1.84 * lu; leRule = '1.84 lu (lu/d > 14.3; Table 3.3.3 footnote 1, loading not specified)'; }
            else { le = 1.63 * lu + 3 * dep; leRule = hasPL ? '1.63 lu + 3d (7 ≤ lu/d ≤ 14.3; Table 3.3.3 footnote 1)' : '1.63 lu + 3d (lu/d ≥ 7, uniformly distributed load)'; }
            const RB = Math.sqrt(le * dep / (bw * bw));
            const stabilityApplies = dep > bw && inp.latSupport !== 'Continuous';
            if (stabilityApplies && RB > 50) fails.push(`Slenderness RB = ${RB.toFixed(1)} exceeds 50 (NDS 3.3.3.7). Not permitted.`);
            const Emin_p = ref.Emin * CM.E * Ct.E * Ci.E;
            const E_p = ref.E * CM.E * Ct.E * Ci.E;
            const FbE = 1.20 * Emin_p / (RB * RB);

            // --- Notch (end notch on the tension face) ---
            const hasNotch = notch > 0;
            const dn = dep - notch;
            if (notch < 0) { errors.push('Notch depth cannot be negative.'); return base; }
            if (hasNotch && dn <= 0) { errors.push('Notch depth must be less than the member depth.'); return base; }
            if (hasNotch && notch > dep / 4) fails.push(`End notch ${notch} in. exceeds d/4 = ${(dep / 4).toFixed(2)} in. (NDS 4.4.3.2). Not permitted.`);
            const Cn = hasNotch ? Math.pow(dn / dep, 2) : 1.0;

            // --- Loads (plf for uniform, lb for point) ---
            const trib = spacing / 12;
            const w_self = inp.selfWeight ? dens * A / 144 : 0;
            const wu = { D: (inp.wDead || 0) * trib + w_self, L: (inp.wLive || 0) * trib, Lr: (inp.wRoofLive || 0) * trib, S: (inp.wSnow || 0) * trib, W: (inp.wWind || 0) * trib };

            // Simple-span statics for a uniform load w (plf) and point loads P [{mag, loc}]
            const beam = (w, P) => {
                const RL = w * L / 2 + P.reduce((s, p) => s + p.mag * (L - p.loc) / L, 0);
                const RR = w * L / 2 + P.reduce((s, p) => s + p.mag * p.loc / L, 0);
                const V = (x, right) => RL - w * x - P.reduce((s, p) => s + ((p.loc < x || (right && p.loc === x)) ? p.mag : 0), 0);
                const M = (x) => RL * x - w * x * x / 2 - P.reduce((s, p) => s + (p.loc < x ? p.mag * (x - p.loc) : 0), 0);
                return { RL, RR, V, M };
            };
            // Stations: 100 equal divisions plus every point-load position
            const xs = [...new Set([...Array.from({ length: 101 }, (_, i) => L * i / 100), ...pls.map(p => p.loc)])].sort((a, c) => a - c);
            const plLocs = new Set(pls.map(p => p.loc));
            const dft = dep / 12;
            const shearRegion = L > 2 * dft ? [...new Set([...xs.filter(x => x >= dft && x <= L - dft), dft, L - dft])] : xs;

            const combos = COMBOS.map(c => {
                const present = Object.keys(c.f).filter(t => c.f[t] !== 0 && (wu[t] !== 0 || pls.some(p => p.type === t && p.mag !== 0)));
                const CD = present.length ? Math.max(...present.map(t => LOAD_CD[t])) : LOAD_CD.D;
                const w = Object.keys(c.f).reduce((s, t) => s + c.f[t] * wu[t], 0);
                const P = pls.filter(p => c.f[p.type]).map(p => ({ mag: c.f[p.type] * p.mag, loc: p.loc }));
                const bm = beam(w, P);
                // Max moment: stations + zero-shear points inside each segment between point loads
                let Mmax = 0, xM = 0;
                const cand = [...xs];
                const brk = [...new Set([0, ...P.map(p => p.loc), L])].sort((a, e) => a - e);
                if (w !== 0) for (let k = 0; k < brk.length - 1; k++) { const x0 = brk[k] + bm.V(brk[k], true) / w; if (x0 > brk[k] && x0 < brk[k + 1]) cand.push(x0); }
                cand.forEach(x => { const m = Math.abs(bm.M(x)); if (m > Mmax) { Mmax = m; xM = x; } });
                // Design shear: max |V| between d from each support (NDS 3.4.3.1(a)); no x/d reduction of point loads
                let Vd = 0, xV = 0;
                shearRegion.forEach(x => { const v = Math.max(Math.abs(bm.V(x, false)), Math.abs(bm.V(x, true))); if (v > Vd) { Vd = v; xV = x; } });
                const Rmax = Math.max(Math.abs(bm.RL), Math.abs(bm.RR));
                const Rbear = Math.max(bm.RL, bm.RR, 0);
                // Adjusted design values
                const Fb_star = ref.Fb * CD * CM.Fb * Ct.Fb * CF * Ci.Fb * Cr;
                let CL = 1.0;
                if (stabilityApplies) {
                    const r = FbE / Fb_star;
                    CL = (1 + r) / 1.9 - Math.sqrt(Math.pow((1 + r) / 1.9, 2) - r / 0.95);
                    if (!(CL <= 1.0)) CL = 1.0;
                }
                const Fb_p = Fb_star * CL * Cfu;
                const Fv_p = ref.Fv * CD * CM.Fv * Ct.Fv * Ci.Fv;
                const Fcp_p = ref.Fcp * CM.Fcp * Ct.Fcp * Ci.Fcp * Cb;
                const fb = Mmax * 12 / S;
                const fv = 1.5 * Vd / A;
                const fvn = hasNotch ? 1.5 * Rmax / (bw * dn) : 0;
                const fcp = Rbear / (bw * lb);
                const r_b = fb / Fb_p, r_v1 = fv / Fv_p, r_vn = hasNotch ? fvn / (Fv_p * Cn) : 0, r_c = fcp / Fcp_p;
                return { key: c.key, name: c.name, f: c.f, CD, w, P, bm, RL: bm.RL, RR: bm.RR, Mmax, xM, Vd, xV, Rmax, Rbear, Fb_star, CL, Fb_p, Fv_p, Fcp_p, fb, fv, fvn, fcp, r_b, r_v1, r_vn, r_v: Math.max(r_v1, r_vn), r_c };
            });
            const govBy = (k) => combos.reduce((g, c) => (c[k] > g[k] ? c : g), combos[0]);
            const gov = { b: govBy('r_b'), v: govBy('r_v'), c: govBy('r_c') };
            if (combos.some(c => c.RL < 0 || c.RR < 0)) notes.push('Net uplift reaction in at least one combination: provide an uplift connection, and check lateral bracing of the bottom (compression) edge.');

            // --- Deflection (service loads; superposition of uniform and point loads) ---
            const Lin = L * 12;
            const defl = (w, P, x) => {
                const xi = x * 12, wi = w / 12;
                let y = wi * xi * (Lin * Lin * Lin - 2 * Lin * xi * xi + xi * xi * xi) / (24 * E_p * I);
                P.forEach(p => {
                    const a = p.loc * 12, bb = Lin - a;
                    y += xi <= a ? p.mag * bb * xi * (Lin * Lin - bb * bb - xi * xi) / (6 * Lin * E_p * I)
                                 : p.mag * a * (Lin - xi) * (2 * Lin * xi - xi * xi - a * a) / (6 * Lin * E_p * I);
                });
                return y;
            };
            const dType = {};
            ['D', 'L', 'Lr', 'S'].forEach(t => { const P = pls.filter(p => p.type === t); dType[t] = xs.map(x => defl(wu[t], P, x)); });
            const Kcr = num(inp.creepFactor) > 0 ? inp.creepFactor : 1.5;
            const maxAbs = (arr) => arr.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
            const dD = maxAbs(dType.D);
            let Dtr = 0, trName = 'L', Dtot = 0, totName = 'L';
            DEFL_TRANSIENT.forEach(tc => {
                const tr = xs.map((_, i) => Object.keys(tc.f).reduce((s, t) => s + tc.f[t] * dType[t][i], 0));
                const trMax = maxAbs(tr);
                const tot = maxAbs(tr.map((v, i) => Kcr * dType.D[i] + v));
                if (trMax > Dtr) { Dtr = trMax; trName = tc.name; }
                if (tot > Dtot) { Dtot = tot; totName = tc.name; }
            });
            const LLlim = Lin / LLdiv, TLlim = Lin / TLdiv;
            const r_dLL = Dtr / LLlim, r_dTL = Dtot / TLlim;

            // --- Diagrams for the selected (or governing) combination ---
            const dc = combos.find(c => c.key === inp.loadCombo) || gov.b;
            const shearData = [], momentData = [];
            let maxV = 0, maxM = 0;
            xs.forEach(x => {
                const vs = plLocs.has(x) ? [dc.bm.V(x, false), dc.bm.V(x, true)] : [dc.bm.V(x, false)];
                vs.forEach(v => { shearData.push({ x: (x / L) * 100, y: v }); if (Math.abs(v) > maxV) maxV = Math.abs(v); });
                const m = dc.bm.M(x); momentData.push({ x: (x / L) * 100, y: m }); if (Math.abs(m) > maxM) maxM = Math.abs(m);
            });

            const dcr = { b: gov.b.r_b, v: gov.v.r_v, c: gov.c.r_c, def: Math.max(r_dLL, r_dTL) };
            const ctrlList = [['Bending Moment', dcr.b], ['Shear', dcr.v], ['Bearing', dcr.c], ['Deflection', dcr.def]];
            const ctrl = ctrlList.reduce((g, e) => (e[1] > g[1] ? e : g), ctrlList[0]);

            return {
                ...base, ok: true, bw, dep, A, S, I, thick4, cfIncluded,
                CF, CFnote, CM, Ct, Ci, Cr, Cfu, Cb, lb, lu, luD, le, leRule, RB, stabilityApplies, Emin_p, E_p, FbE,
                notch, hasNotch, dn, Cn, trib, w_self, wu, combos, gov,
                defl: { dD, Dtr, trName, Dtot, totName, Kcr, LLlim, TLlim, LLdiv, TLdiv, r_dLL, r_dTL },
                diag: { key: dc.key, name: dc.name, shearData, momentData, maxV, maxM },
                dcr, ctrlName: ctrl[0], dcrMax: ctrl[1],
            };
        }

        // --- UI COMPONENTS ---

        const RadialProgress = ({ pct, label, sub, size = 80, stroke = 8, isDark }) => {
            const radius = (size - stroke) / 2;
            const circ = 2 * Math.PI * radius;
            const safePct = isNaN(pct) ? 0 : Math.max(0, pct); // Guard NaN
            const offset = circ - (Math.min(safePct, 100) / 100) * circ;
            
            let color = "text-emerald-500";
            if(safePct > 100) color = "text-red-500";
            else if(safePct > 90) color = "text-amber-500";

            return (
                <div className="flex flex-col items-center justify-center">
                    <div className="relative" style={{ width: size, height: size }}>
                        <svg className="transform -rotate-90 w-full h-full">
                            <circle cx={size/2} cy={size/2} r={radius} stroke="currentColor" strokeWidth={stroke} fill="transparent" className={`${isDark ? 'text-slate-700' : 'text-slate-200'}`} />
                            <circle cx={size/2} cy={size/2} r={radius} stroke="currentColor" strokeWidth={stroke} fill="transparent" 
                                strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" className={`${color} transition-all duration-1000 ease-out`} />
                        </svg>
                        <div className="absolute inset-0 flex items-center justify-center flex-col">
                            <span className={`text-sm font-bold ${color}`}>{Math.round(safePct)}%</span>
                        </div>
                    </div>
                    <span className="mt-2 text-xs font-bold uppercase text-slate-500 tracking-wide">{label}</span>
                    <span className="text-[10px] text-slate-400 font-mono">{sub}</span>
                </div>
            );
        };

        const InputControl = ({ label, value, onChange, min, max, step, unit, icon:Icon }) => (
            <div className="mb-4 group">
                <div className="flex justify-between items-center mb-1.5">
                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
                        {Icon && <Icon className="w-3 h-3 opacity-50" />} {label}
                    </label>
                    <span className="text-xs font-mono font-medium bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                        {value} {unit}
                    </span>
                </div>
                <div className="flex items-center gap-3">
                    <input type="range" min={min} max={max} step={step} value={value || 0} onChange={(e)=>onChange(parseFloat(e.target.value)||0)} 
                        className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer dark:bg-slate-700 accent-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all"
                    />
                </div>
            </div>
        );

        const NumberInput = ({ label, value, onChange, color="border-slate-200" }) => (
            <div className={`relative rounded-md border ${color} bg-white dark:bg-slate-800 dark:border-slate-700 p-2 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all`}>
                <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">{label}</label>
                <div className="flex items-center justify-between">
                    <input type="number" value={value} onChange={(e)=>onChange(parseFloat(e.target.value)||0)} className="w-full bg-transparent text-sm font-mono font-medium outline-none dark:text-white" />
                </div>
            </div>
        );

        // Editor for user-entered reference design values (Manual mode and custom species)
        const PropEditor = ({ title, vals, onChange }) => (
            <div className="p-2 border rounded space-y-1 dark:border-slate-600">
                <div className="text-[10px] font-bold uppercase opacity-60">{title}</div>
                <div className="grid grid-cols-2 gap-1">
                    {[['Fb','Fb (psi)'],['Fv','Fv (psi)'],['FcPerp','Fc⊥ (psi)'],['E','E (psi)'],['Emin','Emin (psi)'],['dens','Density (pcf)'],['G','G']].map(([k,l]) => (
                        <label key={k} className="text-[10px]">{l}
                            <input type="number" value={Number.isFinite(vals[k]) ? vals[k] : ''} onChange={e=>onChange({...vals, [k]: parseFloat(e.target.value)})} className="w-full p-1 text-xs border rounded dark:bg-slate-800 dark:border-slate-600"/>
                        </label>
                    ))}
                </div>
                <label className="flex items-center gap-2 text-[10px]"><input type="checkbox" checked={!!vals.cfIncluded} onChange={e=>onChange({...vals, cfIncluded: e.target.checked})}/> Fb already size-specific (CF = 1.0, e.g. SP Table 4B)</label>
            </div>
        );

        const Toast = ({ msg, show }) => (
            <div className={`fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 transform transition-all duration-300 z-50 ${show ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'}`}>
                <CheckCircle className="w-5 h-5 text-emerald-400" />
                <span className="text-sm font-medium">{msg}</span>
            </div>
        );

        const Accordion = ({ title, icon: Icon, children, isOpen, onToggle, isDark }) => (
            <div className={`border rounded-xl overflow-hidden mb-4 transition-all duration-300 ${isDark ? 'border-slate-700 bg-slate-800/50' : 'border-slate-200 bg-white'} shadow-sm hover:shadow-md`}>
                <button onClick={onToggle} className={`w-full flex items-center justify-between p-4 transition-colors ${isDark ? 'hover:bg-slate-700/50' : 'hover:bg-slate-50'}`}>
                <div className="flex items-center gap-3">
                    <div className={`p-2 rounded-lg ${isDark ? 'bg-slate-700 text-blue-400' : 'bg-blue-50 text-blue-600'}`}><Icon className="w-4 h-4" /></div>
                    <span className={`font-semibold text-sm tracking-tight ${isDark ? 'text-slate-200' : 'text-slate-700'}`}>{title}</span>
                </div>
                {isOpen ? <ChevronDown className="w-4 h-4 text-slate-400" /> : <ChevronRight className="w-4 h-4 text-slate-400" />}
                </button>
                {isOpen && <div className={`p-5 border-t text-sm animate-in slide-in-from-top-2 duration-200 ${isDark ? 'border-slate-700 text-slate-300' : 'border-slate-100 text-slate-600'}`}>{children}</div>}
            </div>
        );
        
        const FactorRow = ({ label, val, note, isDark }) => (
            <div className={`flex justify-between items-center text-xs p-2 rounded ${isDark ? 'bg-slate-700/50' : 'bg-slate-50'}`}>
                <span className="font-bold text-slate-500">{label}</span>
                <div className="flex items-center gap-2">
                    <span className="opacity-50 italic text-[10px]">{note}</span>
                    <span className={`font-mono font-bold ${val!==1.0 ? 'text-blue-500' : 'text-slate-400'}`}>{typeof val === 'number' && !isNaN(val) ? val.toFixed(2) : "1.00"}</span>
                </div>
            </div>
        );

        const EquationBlock = ({ title, equations, isDark, showTrace }) => (
            <div className={`mb-6 p-4 rounded-lg border ${isDark ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-200'} shadow-sm break-inside-avoid`}>
                <h4 className={`text-xs font-bold uppercase tracking-wider mb-3 border-b pb-2 flex items-center gap-2 ${isDark ? 'text-blue-400 border-blue-900' : 'text-slate-600 border-slate-100'}`}>
                    {title}
                </h4>
                <div className="space-y-2">
                {equations.map((eq, idx) => {
                    if (eq.traceOnly && !showTrace) return null;
                    return (
                    <div key={idx} className={`group flex flex-wrap items-baseline gap-x-2 gap-y-1 font-mono text-xs md:text-sm ${eq.traceOnly ? 'pl-4 border-l-2 border-slate-200 dark:border-slate-700' : ''}`}>
                        {eq.label && <span className="text-slate-400 w-24 shrink-0 font-sans text-[10px] uppercase font-bold">{eq.label}</span>}
                        <div className="flex items-baseline gap-2 flex-1">
                            <span className={`font-bold ${isDark ? 'text-slate-200' : 'text-slate-800'}`}>{eq.sym}</span>
                            <span className="text-slate-400">=</span>
                            <span className={`italic ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>{eq.formula}</span>
                            <span className="text-slate-400">=</span>
                            <span className={`${isDark ? 'text-slate-300' : 'text-slate-600'}`}>{eq.sub}</span>
                            <span className="text-slate-400">=</span>
                            <span className={`font-bold px-1.5 py-0.5 rounded ${isDark ? 'bg-slate-700 text-white' : 'bg-slate-100 text-slate-900 border border-slate-200'}`}>
                            {eq.res} <span className="text-[10px] opacity-60 font-normal ml-1">{eq.unit}</span>
                            </span>
                        </div>
                        {eq.ref && <span className="text-[10px] text-slate-400 ml-auto hidden sm:inline-block border border-slate-200 dark:border-slate-700 rounded px-1.5 py-0.5 bg-slate-50 dark:bg-slate-800">[{eq.ref}]</span>}
                    </div>
                )})} 
                </div>
            </div>
        );

        // --- INTERACTIVE DIAGRAMS ---
        const DiagramsPanel = ({ span, pointLoads, wTotal, shearData, momentData, maxV, maxM, isDark, hoverX, setHoverX }) => {
            const height = 80; 
            // Stations are not uniformly spaced (point-load positions are included), so look up by x.
            const getVal = (data, x_pct) => { let best = data[0]; for (const p of data) { if (p.x <= x_pct * 100) best = p; else break; } return best?.y || 0; };
            const valV = hoverX !== null ? getVal(shearData, hoverX/100) : 0;
            const valM = hoverX !== null ? getVal(momentData, hoverX/100) : 0;
            
            const genPath = (data, max, inv=false) => {
                if(!max || max===0 || isNaN(max)) return `M 0 ${height/2} L 100 ${height/2}`;
                const s = (height/2 - 10)/max;
                return data.map((p,i) => `${i===0?'M':'L'} ${p.x} ${height/2 - (p.y*s*(inv?-1:1))}`).join(" ");
            };

            const shearPath = genPath(shearData, maxV);
            const momentPath = genPath(momentData, maxM, true); 
            
            const Grid = () => (
                <g opacity="0.1">
                    {[0,25,50,75,100].map(x => <line key={x} x1={x} y1="0" x2={x} y2="100" stroke="currentColor" strokeWidth="0.5" strokeDasharray="2" />)}
                    <line x1="0" y1="40" x2="100" y2="40" stroke="currentColor" strokeWidth="1" />
                </g>
            );

            return (
                <div className="space-y-6 font-sans" onMouseMove={(e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    setHoverX(Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100)));
                }} onMouseLeave={() => setHoverX(null)}>
                    
                    {/* LOAD DIAGRAM */}
                    <div className={`relative h-32 rounded-xl border chart-container ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} overflow-hidden shadow-sm`}>
                         <div className="absolute top-3 left-4 flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                            <span className="text-[10px] font-bold uppercase text-slate-500 tracking-wider">Loading</span>
                         </div>
                         <svg viewBox="0 0 100 80" className="w-full h-full" preserveAspectRatio="none">
                            <rect x="0" y="40" width="100" height="6" fill="#92400e" rx="1" />
                            <polygon points="1,46 4,52 -2,52" fill="#64748b" />
                            <polygon points="99,46 102,52 96,52" fill="#64748b" />
                            <rect x="0" y="20" width="100" height="20" fill="url(#hatch)" opacity="0.1"/>
                            <line x1="0" y1="20" x2="100" y2="20" stroke="#3b82f6" strokeWidth="0.5" />
                            {pointLoads.map((pl,i) => (
                                <g key={i} transform={`translate(${((pl.loc||0)/(span||1))*100}, 0)`}>
                                    <line x1="0" y1="10" x2="0" y2="40" stroke="#ef4444" strokeWidth="1"/>
                                    <polygon points="0,40 -2,35 2,35" fill="#ef4444"/>
                                    <text x="2" y="15" fontSize="3" fill="#ef4444" fontWeight="bold">{pl.mag || 0}</text>
                                </g>
                            ))}
                            {hoverX !== null && <line x1={hoverX} y1="0" x2={hoverX} y2="100" stroke="currentColor" strokeDasharray="2" strokeWidth="0.5" className="text-slate-400" />}
                         </svg>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* SHEAR */}
                        <div className={`relative h-48 rounded-xl border chart-container ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} overflow-hidden shadow-sm group`}>
                            <div className="absolute top-3 left-4 flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span className="text-[10px] font-bold uppercase text-emerald-600 tracking-wider">Shear (V)</span>
                            </div>
                            <div className="absolute top-3 right-4 text-xs font-mono font-bold text-emerald-600 bg-emerald-50 dark:bg-emerald-900/30 px-2 py-1 rounded border border-emerald-100 dark:border-emerald-800">
                                {hoverX !== null ? valV.toFixed(0) : maxV.toFixed(0)} lb
                            </div>
                            <svg viewBox="0 0 100 80" className="w-full h-full" preserveAspectRatio="none">
                                <Grid />
                                <path d={`${shearPath} L 100 40 L 0 40 Z`} fill="rgba(16, 185, 129, 0.1)" stroke="none" />
                                <path d={shearPath} fill="none" stroke="#10b981" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                                {hoverX !== null && (
                                    <>
                                        <circle cx={hoverX} cy={40 - (valV * (30/(maxV||1)))} r="1.5" fill="#10b981" stroke="white" strokeWidth="0.5"/>
                                        <line x1={hoverX} y1="0" x2={hoverX} y2="100" stroke="currentColor" strokeDasharray="2" strokeWidth="0.5" className="text-emerald-400" />
                                    </>
                                )}
                            </svg>
                        </div>

                        {/* MOMENT */}
                        <div className={`relative h-48 rounded-xl border chart-container ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} overflow-hidden shadow-sm group`}>
                            <div className="absolute top-3 left-4 flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                                <span className="text-[10px] font-bold uppercase text-blue-600 tracking-wider">Moment (M)</span>
                            </div>
                            <div className="absolute top-3 right-4 text-xs font-mono font-bold text-blue-600 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded border border-blue-100 dark:border-blue-800">
                                {hoverX !== null ? valM.toFixed(0) : maxM.toFixed(0)} ft-lb
                            </div>
                            <svg viewBox="0 0 100 80" className="w-full h-full" preserveAspectRatio="none">
                                <Grid />
                                <path d={`${momentPath} L 100 40 L 0 40 Z`} fill="rgba(59, 130, 246, 0.1)" stroke="none" />
                                <path d={momentPath} fill="none" stroke="#3b82f6" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                                {hoverX !== null && (
                                    <>
                                        <circle cx={hoverX} cy={40 - (valM * (30/(maxM||1)))} r="1.5" fill="#3b82f6" stroke="white" strokeWidth="0.5" />
                                        <line x1={hoverX} y1="0" x2={hoverX} y2="100" stroke="currentColor" strokeDasharray="2" strokeWidth="0.5" className="text-blue-400" />
                                    </>
                                )}
                            </svg>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function UniversalTimberStudio() {
            // State
            const [isDark, setIsDark] = useState(false);
            const [activeTab, setActiveTab] = useState('analysis'); 
            const [traceMode, setTraceMode] = useState(true); // Default to True for transparency
            const [hoverX, setHoverX] = useState(null);
            const [toast, setToast] = useState({ show: false, msg: '' });
            const [openSections, setOpenSections] = useState({ project: true, loads: true, material: true, factors: true }); // Open by default

            // Data
            const [customMaterials, setCustomMaterials] = useState({});
            const [projectInfo, setProjectInfo] = useState({ client: '', job: '', designer: '', notes: '' });

            // Geometry
            const [span, setSpan] = useState(16);
            const [spacing, setSpacing] = useState(16);
            const [bearingLen, setBearingLen] = useState(3.5);
            const [bearingInterior, setBearingInterior] = useState(false); // true = bearing >= 3 in. from member end (Cb permitted)
            const [unbracedLen, setUnbracedLen] = useState(0); // 0 = span

            // Loads
            const [wDead, setWDead] = useState(15);
            const [wLive, setWLive] = useState(40);
            const [wSnow, setWSnow] = useState(0);
            const [wWind, setWWind] = useState(0);
            const [wRoofLive, setWRoofLive] = useState(0);
            const [pointLoads, setPointLoads] = useState([]); 
            const [loadCombo, setLoadCombo] = useState('GOV'); // combination shown in the V/M diagrams; all combinations are always checked
            const [selfWeight, setSelfWeight] = useState(true);

            // Material
            const [species, setSpecies] = useState('DF-L');
            const [grade, setGrade] = useState('No.2');
            const [sizeLabel, setSizeLabel] = useState('2x10');
            const [customB, setCustomB] = useState(1.5);
            const [customD, setCustomD] = useState(9.25);
            const [isManual, setIsManual] = useState(false);
            const [manualProps, setManualProps] = useState({ Fb: 900, Fv: 180, E: 1600000, Emin: 580000, FcPerp: 625, G: 0.50, dens: 35, cfIncluded: false });

            // Advanced Factors
            const [moisture, setMoisture] = useState('Dry');
            const [temp, setTemp] = useState('Normal');
            const [incising, setIncising] = useState(false);
            const [repetitive, setRepetitive] = useState(true);
            const [flatUse, setFlatUse] = useState(false);
            const [creepFactor, setCreepFactor] = useState(1.5);
            const [notchDepth, setNotchDepth] = useState(0);
            const [costPerBF, setCostPerBF] = useState(1.50);
            const [deflLimitLL, setDeflLimitLL] = useState(360);
            const [deflLimitTL, setDeflLimitTL] = useState(240);
            const [latSupport, setLatSupport] = useState('Continuous');

            // --- CALCULATION ENGINE (see runTimberCheck) ---
            const res = runTimberCheck({ span, spacing, bearingLen, bearingInterior, unbracedLen, wDead, wLive, wSnow, wWind, wRoofLive, pointLoads, loadCombo, selfWeight,
                species, grade, sizeLabel, customB, customD, isManual, manualProps, customMaterials, moisture, temp, incising, repetitive, flatUse,
                creepFactor, notchDepth, deflLimitLL, deflLimitTL, latSupport });
            const b = res.b, d = res.d;
            const BF = (b > 0 && d > 0) ? (b * d / 144) * (span || 0) : 0;
            const Cost = BF * (costPerBF || 0);
            const span_safe = span > 0 ? span : 0.1;
            const gb = res.ok ? res.gov.b : null, gv = res.ok ? res.gov.v : null, gc = res.ok ? res.gov.c : null;
            const f3 = (v) => (typeof v === 'number' && isFinite(v)) ? +v.toFixed(3) : v;
            const lOver = (delta) => delta > 0 ? `L/${((span * 12) / delta).toFixed(0)}` : '—';
            const ctrlDetail = !res.ok ? '' : res.ctrlName === 'Deflection'
                ? (res.defl.r_dLL >= res.defl.r_dTL ? `Live/snow deflection (${res.defl.trName}) vs L/${res.defl.LLdiv}` : `Total deflection (Kcr·D + ${res.defl.totName}) vs L/${res.defl.TLdiv}`)
                : (() => { const g = { 'Bending Moment': gb, 'Shear': gv, 'Bearing': gc }[res.ctrlName]; return `Governing combination: ${g.name} (CD = ${g.CD})`; })();

            // Helpers
            const showToast = (msg) => { setToast({show:true, msg}); setTimeout(()=>setToast({show:false, msg:''}), 3000); };
            const addPointLoad = () => setPointLoads([...pointLoads, { mag: 500, loc: span_safe/2, type: 'D' }]);
            const removePointLoad = (idx) => setPointLoads(pointLoads.filter((_,i)=>i!==idx));
            const updatePointLoad = (idx, field, val) => {
                const newLoads = pointLoads.map(p => ({ ...p }));
                newLoads[idx][field] = field === 'type' ? val : (parseFloat(val) || 0);
                setPointLoads(newLoads);
            };
            const addMaterial = () => {
                const name = prompt("Enter Custom Species Name:");
                if(!name) return;
                if(DEFAULT_SPECIES[name]) { alert(`"${name}" is a built-in species. Choose another name.`); return; }
                // Starts from the DF-L No.2 (Table 4A) reference values; edit them in the Material panel.
                setCustomMaterials({...customMaterials, [name]: { Fb: 900, Fv: 180, FcPerp: 625, E: 1600000, Emin: 580000, G: 0.50, dens: 34, cfIncluded: false }});
                setSpecies(name);
            };
            const saveProject = () => {
                const data = { span, spacing, wDead, wLive, wSnow, wWind, species, grade, sizeLabel, loadCombo, projectInfo,
                    wRoofLive, pointLoads, selfWeight, bearingLen, bearingInterior, unbracedLen, customB, customD, isManual, manualProps, customMaterials,
                    moisture, temp, incising, repetitive, flatUse, creepFactor, notchDepth, costPerBF, deflLimitLL, deflLimitTL, latSupport };
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = "timber_design.json"; a.click();
                showToast("Project saved successfully");
            };
            const loadProject = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    let d;
                    try {
                        d = JSON.parse(ev.target.result);
                        if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('file does not contain a project object');
                    } catch (err) { alert('Could not open project file: ' + err.message); return; }
                    try {
                        // Older files (span, spacing, wDead, wLive, wSnow, wWind, species, grade, sizeLabel, loadCombo, projectInfo only)
                        // still load; every missing field falls back to its default.
                        const n = (v, def) => (typeof v === 'number' && isFinite(v)) ? v : def;
                        const bo = (v, def) => typeof v === 'boolean' ? v : def;
                        const st = (v, def, allowed) => (typeof v === 'string' && (!allowed || allowed.includes(v))) ? v : def;
                        const cm = {};
                        if (d.customMaterials && typeof d.customMaterials === 'object') Object.entries(d.customMaterials).forEach(([k, v]) => {
                            if (!v || typeof v !== 'object' || DEFAULT_SPECIES[k]) return;
                            cm[k] = { Fb: n(v.Fb, n(v.F_b, NaN)), Fv: n(v.Fv, n(v.F_v, NaN)), FcPerp: n(v.FcPerp, n(v.F_c_perp, NaN)), E: n(v.E, NaN), Emin: n(v.Emin, NaN), G: n(v.G, NaN), dens: n(v.dens, NaN), cfIncluded: bo(v.cfIncluded, false) };
                        });
                        const mp = (d.manualProps && typeof d.manualProps === 'object') ? d.manualProps : {};
                        setSpan(n(d.span, 16)); setSpacing(n(d.spacing, 16)); setWDead(n(d.wDead, 15)); setWLive(n(d.wLive, 40)); setWSnow(n(d.wSnow, 0));
                        setWWind(n(d.wWind, 0)); setWRoofLive(n(d.wRoofLive, 0));
                        setCustomMaterials(cm);
                        setSpecies(st(d.species, 'DF-L', [...Object.keys(DEFAULT_SPECIES), ...Object.keys(cm)]));
                        setGrade(st(d.grade, 'No.2', Object.keys(GRADES_DB)));
                        setSizeLabel(st(d.sizeLabel, '2x10', SIZES_DB.map(s => s.label)));
                        setLoadCombo(st(d.loadCombo, 'GOV', ['GOV', ...COMBOS.map(c => c.key)]));
                        setPointLoads(Array.isArray(d.pointLoads) ? d.pointLoads.filter(p => p && typeof p === 'object').map(p => ({ mag: n(p.mag, 0), loc: n(p.loc, 0), type: st(p.type, 'D', Object.keys(LOAD_CD)) })) : []);
                        setSelfWeight(bo(d.selfWeight, true));
                        setBearingLen(n(d.bearingLen, 3.5)); setBearingInterior(bo(d.bearingInterior, false)); setUnbracedLen(n(d.unbracedLen, 0));
                        setCustomB(n(d.customB, 1.5)); setCustomD(n(d.customD, 9.25));
                        setIsManual(bo(d.isManual, false));
                        setManualProps({ Fb: n(mp.Fb, 900), Fv: n(mp.Fv, 180), E: n(mp.E, 1600000), Emin: n(mp.Emin, 580000), FcPerp: n(mp.FcPerp, 625), G: n(mp.G, 0.50), dens: n(mp.dens, 35), cfIncluded: bo(mp.cfIncluded, false) });
                        setMoisture(st(d.moisture, 'Dry', ['Dry', 'Wet']));
                        setTemp(d.temp === 'High' ? '125-150' : st(d.temp, 'Normal', ['Normal', '100-125', '125-150']));
                        setIncising(bo(d.incising, false)); setRepetitive(bo(d.repetitive, true)); setFlatUse(bo(d.flatUse, false));
                        setCreepFactor(n(d.creepFactor, 1.5)); setNotchDepth(n(d.notchDepth, 0)); setCostPerBF(n(d.costPerBF, 1.50));
                        setDeflLimitLL(n(d.deflLimitLL, 360)); setDeflLimitTL(n(d.deflLimitTL, 240));
                        setLatSupport(st(d.latSupport, 'Continuous', ['Continuous', 'Supports']));
                        const pi = (d.projectInfo && typeof d.projectInfo === 'object') ? d.projectInfo : {};
                        setProjectInfo({ client: st(pi.client, ''), job: st(pi.job, ''), designer: st(pi.designer, ''), notes: st(pi.notes, '') });
                        showToast("Project loaded");
                    } catch (err) { alert('Could not load project: ' + err.message); }
                };
                reader.onerror = () => alert('Could not read the file.');
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className={`min-h-screen transition-colors duration-500 ${isDark ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-900'} font-sans pb-20`}>
                    <svg width="0" height="0"><defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" style={{stroke:'#3b82f6', strokeWidth:1}} /></pattern></defs></svg>
                    <Toast msg={toast.msg} show={toast.show} />

                    {/* HEADER */}
                    <header className={`sticky top-0 z-50 border-b backdrop-blur-xl px-6 py-4 flex justify-between items-center ${isDark ? 'bg-slate-900/80 border-slate-700' : 'bg-white/80 border-slate-200'} hide-print`}>
                        <div className="flex items-center gap-4">
                            <a href="tools.html" target="_top" title="Open the list of all tools" className="text-xs text-slate-500 hover:text-indigo-500">&larr; All tools</a>
                            <div className="bg-indigo-600 p-2 rounded-lg"><Calculator className="text-white w-5 h-5"/></div>
                            <h1 className="font-bold text-lg">TimberStudio<span className="text-indigo-500">Complete</span></h1>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={()=>setTraceMode(!traceMode)} className={`px-3 py-1.5 text-xs rounded border ${traceMode ? 'bg-blue-100 text-blue-700 border-blue-200' : 'border-slate-200'}`}>{traceMode ? 'Trace ON' : 'Trace OFF'}</button>
                            <div className="h-6 w-px bg-slate-300 mx-2"></div>
                            <button onClick={saveProject} className="p-2 hover:bg-slate-100 rounded"><Save className="w-4 h-4"/></button>
                            <label className="p-2 hover:bg-slate-100 rounded cursor-pointer"><Upload className="w-4 h-4"/><input type="file" className="hidden" onChange={loadProject}/></label>
                            <button onClick={() => setIsDark(!isDark)} className="p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800">{isDark ? <Sun className="w-4 h-4"/> : <Moon className="w-4 h-4"/>}</button>
                        </div>
                    </header>

                    <main className="max-w-8xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* CONTROLS */}
                        <div className="lg:col-span-4 space-y-4 hide-print h-[calc(100vh-120px)] overflow-y-auto pr-2 custom-scrollbar">
                             
                             {/* 1. PROJECT */}
                             <Accordion title="Project & Geometry" icon={Briefcase} isOpen={openSections.project} onToggle={()=>setOpenSections({...openSections, project:!openSections.project})} isDark={isDark}>
                                <input className="w-full p-2 text-xs border rounded mb-2 dark:bg-slate-800 dark:border-slate-600" placeholder="Client" value={projectInfo.client} onChange={e=>setProjectInfo({...projectInfo, client:e.target.value})} />
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <input className="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-600" placeholder="Job #" value={projectInfo.job} onChange={e=>setProjectInfo({...projectInfo, job:e.target.value})} />
                                    <input className="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-600" placeholder="Designer" value={projectInfo.designer} onChange={e=>setProjectInfo({...projectInfo, designer:e.target.value})} />
                                </div>
                                <div className="flex gap-2 mb-2 hide-print">
                                    <button type="button" title="Fill the project fields from project info shared by another tool" onClick={()=>{ const patch = ProjMetaUI.use(TBC_PROJ_MAP, projectInfo, 'timberBeamCheck'); if (patch) setProjectInfo(pi => ({...pi, ...patch})); }} className="px-2 py-1 text-xs rounded border border-slate-200 hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-800">Use shared project info</button>
                                    <button type="button" title="Make these project fields available to the other tools" onClick={()=>ProjMetaUI.share(TBC_PROJ_MAP, projectInfo, 'Timber Beam Check', 'Timber Beam Check.html')} className="px-2 py-1 text-xs rounded border border-slate-200 hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-800">Share project info</button>
                                </div>
                                <div className="pt-4 border-t dark:border-slate-700">
                                    <InputControl label="Span (ft)" value={span} onChange={setSpan} min={4} max={40} step={0.5} unit="ft" icon={Ruler} />
                                    <InputControl label="Spacing (in)" value={spacing} onChange={setSpacing} min={6} max={48} step={2} unit="in" icon={ArrowDown} />
                                </div>
                             </Accordion>

                             {/* 2. LOADS */}
                             <Accordion title="Loads & Combinations" icon={ArrowDown} isOpen={openSections.loads} onToggle={()=>setOpenSections({...openSections, loads:!openSections.loads})} isDark={isDark}>
                                <div className="space-y-3">
                                    <div className={`p-3 rounded-xl border shadow-sm ${isDark ? 'bg-slate-900/50 border-slate-700' : 'bg-blue-50/50 border-blue-100'}`}>
                                        <label className="text-[10px] font-bold opacity-60 uppercase block mb-2">Diagram Combo (all combos are checked)</label>
                                        <select value={loadCombo} onChange={e=>setLoadCombo(e.target.value)} className={`w-full p-2 text-sm border rounded-lg font-medium outline-none focus:ring-2 focus:ring-blue-500 ${isDark ? 'bg-slate-800 border-slate-600' : 'bg-white border-blue-200'}`}>
                                            <option value="GOV">Governing for bending (auto)</option>
                                            {COMBOS.map(c => <option key={c.key} value={c.key}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <NumberInput label="Dead (D) psf" value={wDead} onChange={setWDead} />
                                        <NumberInput label="Live (L) psf" value={wLive} onChange={setWLive} />
                                        <NumberInput label="Roof Live (Lr) psf" value={wRoofLive} onChange={setWRoofLive} />
                                        <NumberInput label="Snow (S) psf" value={wSnow} onChange={setWSnow} />
                                        <NumberInput label="Wind (W) psf, + down" value={wWind} onChange={setWWind} />
                                    </div>
                                    <label className="flex justify-between items-center text-xs">
                                        <span className="opacity-70">Include self-weight (in D)</span>
                                        <input type="checkbox" checked={selfWeight} onChange={e=>setSelfWeight(e.target.checked)}/>
                                    </label>
                                    <div className="border-t pt-2 dark:border-slate-700">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="text-[10px] font-bold opacity-60">POINT LOADS</span>
                                            <button onClick={addPointLoad} className="text-[10px] text-blue-500 hover:underline">+ Add</button>
                                        </div>
                                        {pointLoads.map((pl, i) => (
                                            <div key={i} className="flex items-center gap-1 mb-1">
                                                <input type="number" value={pl.mag} onChange={e=>updatePointLoad(i,'mag',e.target.value)} className="w-16 p-1 text-xs border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="lb"/>
                                                <span className="text-[10px]">@</span>
                                                <input type="number" value={pl.loc} onChange={e=>updatePointLoad(i,'loc',e.target.value)} className={`w-12 p-1 text-xs border rounded dark:bg-slate-700 ${(pl.loc >= 0 && pl.loc <= span) ? 'dark:border-slate-600' : 'border-red-500 bg-red-50'}`} placeholder="ft"/>
                                                <select value={pl.type || 'D'} onChange={e=>updatePointLoad(i,'type',e.target.value)} className="p-1 text-xs border rounded dark:bg-slate-700 dark:border-slate-600">
                                                    {Object.keys(LOAD_CD).map(t => <option key={t} value={t}>{t}</option>)}
                                                </select>
                                                <button onClick={()=>removePointLoad(i)} className="text-red-400"><Trash2 className="w-3 h-3"/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                             </Accordion>

                             {/* 3. MATERIAL */}
                             <Accordion title="Material & Section" icon={Settings} isOpen={openSections.material} onToggle={()=>setOpenSections({...openSections, material:!openSections.material})} isDark={isDark}>
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center"><span className="text-xs font-bold text-slate-500">SPECIES</span> <button onClick={addMaterial} className="text-[10px] text-blue-500 hover:underline">+ Add Custom</button></div>
                                    <select value={species} onChange={e=>setSpecies(e.target.value)} className="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-600">
                                        {Object.keys({...DEFAULT_SPECIES, ...customMaterials}).map(k=><option key={k} value={k}>{k}</option>)}
                                    </select>
                                    {!customMaterials[species] && (
                                        <select value={grade} onChange={e=>setGrade(e.target.value)} className="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-600">
                                            {Object.keys(GRADES_DB).map(k=><option key={k} value={k}>{GRADES_DB[k].name}</option>)}
                                        </select>
                                    )}
                                    <div className="flex gap-2 items-center">
                                        <select value={sizeLabel} onChange={e=>setSizeLabel(e.target.value)} className="flex-1 p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-600 font-mono">{SIZES_DB.map(s=><option key={s.label} value={s.label}>{s.label}</option>)}</select>
                                        <button onClick={()=>setIsManual(!isManual)} className="text-[10px] underline opacity-60">{isManual?'Std':'Man'}</button>
                                    </div>
                                    {sizeLabel === 'Custom' && (
                                        <div className="flex gap-2"><input placeholder="b" type="number" value={customB} onChange={e=>setCustomB(parseFloat(e.target.value))} className="w-1/2 p-1 border rounded"/><input placeholder="d" type="number" value={customD} onChange={e=>setCustomD(parseFloat(e.target.value))} className="w-1/2 p-1 border rounded"/></div>
                                    )}
                                    {isManual && <PropEditor title="Manual reference values (NDS Supplement)" vals={manualProps} onChange={setManualProps} />}
                                    {!isManual && customMaterials[species] && <PropEditor title={`Custom species "${species}" reference values`} vals={customMaterials[species]} onChange={v => setCustomMaterials({...customMaterials, [species]: v})} />}
                                    {res.ref && <div className="text-[10px] font-mono opacity-70">{res.src}: Fb {res.ref.Fb}, Ft {res.ref.Ft ?? '—'}, Fv {res.ref.Fv}, Fc⊥ {res.ref.Fcp}, Fc {res.ref.Fc ?? '—'}, E {res.ref.E}, Emin {res.ref.Emin} psi</div>}
                                    <div className="flex gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
                                        <div className="w-1/2"><label className="text-[10px]">Notch Depth</label><input type="number" value={notchDepth} onChange={e=>setNotchDepth(parseFloat(e.target.value))} className="w-full p-1 text-xs border rounded"/></div>
                                        <div className="w-1/2"><label className="text-[10px]">Cost $/BF</label><input type="number" value={costPerBF} onChange={e=>setCostPerBF(parseFloat(e.target.value))} className="w-full p-1 text-xs border rounded"/></div>
                                    </div>
                                    <div className="text-[10px] text-emerald-600 font-mono text-right">Est. Cost: ${Cost.toFixed(2)}</div>
                                </div>
                             </Accordion>

                             {/* 4. FACTORS */}
                             <Accordion title="Advanced Factors" icon={MoreHorizontal} isOpen={openSections.factors} onToggle={()=>setOpenSections({...openSections, factors:!openSections.factors})} isDark={isDark}>
                                <div className="space-y-2 text-xs">
                                    <div className="flex items-center justify-between"><span className="opacity-70">Unbraced Len (ft)</span><input type="number" value={unbracedLen} onChange={e=>setUnbracedLen(parseFloat(e.target.value))} className="w-16 p-1 border rounded text-right" placeholder="Span"/></div>
                                    <div className="flex items-center justify-between"><span className="opacity-70">Bearing Len (in)</span><input type="number" value={bearingLen} onChange={e=>setBearingLen(parseFloat(e.target.value))} className="w-16 p-1 border rounded text-right"/></div>
                                    <label className="flex justify-between items-center">
                                        <span className="opacity-70">Bearing ≥ 3 in. from member end (Cb)</span>
                                        <input type="checkbox" checked={bearingInterior} onChange={e=>setBearingInterior(e.target.checked)}/>
                                    </label>
                                    <div className="flex items-center justify-between"><span className="opacity-70">Creep Factor</span><input type="number" value={creepFactor} onChange={e=>setCreepFactor(parseFloat(e.target.value))} className="w-16 p-1 border rounded text-right"/></div>
                                    <div className="flex items-center justify-between"><span className="opacity-70">Live/snow defl. limit L/</span><input type="number" value={deflLimitLL} onChange={e=>setDeflLimitLL(parseFloat(e.target.value))} className="w-16 p-1 border rounded text-right"/></div>
                                    <div className="flex items-center justify-between"><span className="opacity-70">Total defl. limit L/</span><input type="number" value={deflLimitTL} onChange={e=>setDeflLimitTL(parseFloat(e.target.value))} className="w-16 p-1 border rounded text-right"/></div>
                                    
                                    <label className="flex justify-between items-center pt-2 border-t dark:border-slate-700">
                                        <span className="opacity-70">Incised (Ci)</span>
                                        <input type="checkbox" checked={incising} onChange={e=>setIncising(e.target.checked)}/>
                                    </label>
                                    <label className="flex justify-between items-center">
                                        <span className="opacity-70">Repetitive (Cr)</span>
                                        <input type="checkbox" checked={repetitive} onChange={e=>setRepetitive(e.target.checked)}/>
                                    </label>
                                    
                                    <div className="pt-2 border-t dark:border-slate-700">
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="opacity-70">Temperature (Ct)</span>
                                            <select value={temp} onChange={e=>setTemp(e.target.value)} className="p-1 border rounded w-24">
                                                <option value="Normal">≤ 100°F</option>
                                                <option value="100-125">100–125°F</option>
                                                <option value="125-150">125–150°F</option>
                                            </select>
                                        </div>
                                        <label className="flex justify-between items-center">
                                            <span className="opacity-70">Flat Use (Cfu)</span>
                                            <input type="checkbox" checked={flatUse} onChange={e=>setFlatUse(e.target.checked)}/>
                                        </label>
                                        <label className="flex justify-between items-center mt-2">
                                            <span className="opacity-70">Wet Service (CM)</span>
                                            <input type="checkbox" checked={moisture==='Wet'} onChange={e=>setMoisture(e.target.checked?'Wet':'Dry')} />
                                        </label>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="opacity-70">Lateral Support</span>
                                            <select value={latSupport} onChange={e=>setLatSupport(e.target.value)} className="p-1 border rounded text-xs">
                                                <option value="Continuous">Continuous</option>
                                                <option value="Supports">Supports Only</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                             </Accordion>
                        </div>

                        {/* RIGHT: RESULTS */}
                        <div className="lg:col-span-8 flex flex-col h-full print:col-span-12 space-y-6">
                             
                             {/* TAB NAV */}
