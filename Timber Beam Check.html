                             <div className="flex p-1 bg-slate-200 dark:bg-slate-800 w-fit rounded-lg hide-print">
                                <button onClick={()=>setActiveTab('analysis')} className={`px-4 py-1.5 text-xs font-bold rounded ${activeTab==='analysis'?'bg-white shadow text-blue-600':'text-slate-500'}`}>Visual Analysis</button>
                                <button onClick={()=>setActiveTab('report')} className={`px-4 py-1.5 text-xs font-bold rounded ${activeTab==='report'?'bg-white shadow text-blue-600':'text-slate-500'}`}>Detailed Report</button>
                             </div>

                             {!res.ok && (
                                <div className="p-6 rounded-2xl border border-red-300 bg-red-50 text-red-800 dark:bg-red-900/20 dark:border-red-800 dark:text-red-200">
                                    <div className="flex items-center gap-2 font-bold mb-2"><AlertTriangle className="w-5 h-5"/> No results: input or design data required</div>
                                    <ul className="list-disc pl-5 text-sm space-y-1">{res.errors.map((m,i)=><li key={i}>{m}</li>)}</ul>
                                </div>
                             )}

                             {res.ok && activeTab === 'analysis' && (
                                <div className="space-y-6 animate-in fade-in">
                                    {/* HERO STAT */}
                                    <div className={`p-6 rounded-2xl border ${isDark ? 'bg-slate-800/50 border-slate-700' : 'bg-gradient-to-br from-blue-50 to-indigo-50 border-blue-100'} flex items-center justify-between`}>
                                        <div>
                                            <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Controlling Limit State</h4>
                                            <div className="text-xl font-bold text-slate-800 dark:text-slate-100">
                                                {res.fails.length ? 'Code limit violated (NG)' : res.ctrlName}
                                            </div>
                                            <div className="text-xs font-mono opacity-60">{ctrlDetail}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className={`text-3xl font-bold ${(res.dcrMax > 1 || res.fails.length) ? "text-red-500" : "text-emerald-500"}`}>
                                                {(res.dcrMax*100).toFixed(1)}%
                                            </div>
                                            <div className="text-xs font-mono opacity-50">Capacity Utilization (max of bending, shear, bearing, deflection)</div>
                                        </div>
                                    </div>

                                    {(res.fails.length > 0 || res.notes.length > 0) && (
                                        <div className="space-y-1 text-xs">
                                            {res.fails.map((m,i)=><div key={'f'+i} className="p-2 rounded border border-red-300 bg-red-50 text-red-700 flex gap-2"><XCircle className="w-4 h-4 shrink-0"/>{m}</div>)}
                                            {res.notes.map((m,i)=><div key={'n'+i} className="p-2 rounded border border-amber-300 bg-amber-50 text-amber-800 flex gap-2"><Info className="w-4 h-4 shrink-0"/>{m}</div>)}
                                        </div>
                                    )}

                                    {/* UNITY RINGS */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                        <div className={`rounded-2xl p-4 border shadow-sm flex flex-col items-center justify-center transition-all ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} hover:shadow-md`}>
                                            <RadialProgress pct={res.dcr.b*100} label="Bending" sub={`${gb.fb.toFixed(0)} psi · ${gb.name}`} isDark={isDark} />
                                        </div>
                                        <div className={`rounded-2xl p-4 border shadow-sm flex flex-col items-center justify-center transition-all ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} hover:shadow-md`}>
                                            <RadialProgress pct={res.dcr.v*100} label="Shear" sub={`${(gv.r_vn > gv.r_v1 ? gv.fvn : gv.fv).toFixed(0)} psi${gv.r_vn > gv.r_v1 ? ' (notch)' : ''} · ${gv.name}`} isDark={isDark} />
                                        </div>
                                        <div className={`rounded-2xl p-4 border shadow-sm flex flex-col items-center justify-center transition-all ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} hover:shadow-md`}>
                                            <RadialProgress pct={res.dcr.def*100} label="Deflection" sub={`LL ${lOver(res.defl.Dtr)} · TL ${lOver(res.defl.Dtot)}`} isDark={isDark} />
                                        </div>
                                        <div className={`rounded-2xl p-4 border shadow-sm flex flex-col items-center justify-center transition-all ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} hover:shadow-md`}>
                                            <RadialProgress pct={res.dcr.c*100} label="Bearing" sub={`${gc.fcp.toFixed(0)} psi · ${gc.name}`} isDark={isDark} />
                                        </div>
                                    </div>

                                    <div className="text-[10px] font-mono opacity-60">Diagrams shown for: {res.diag.name}</div>
                                    <DiagramsPanel span={span} pointLoads={pointLoads} shearData={res.diag.shearData} momentData={res.diag.momentData} maxV={res.diag.maxV} maxM={res.diag.maxM} isDark={isDark} hoverX={hoverX} setHoverX={setHoverX} />
                                </div>
                             )}

                             {res.ok && activeTab === 'report' && (
                                <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200 dark:bg-slate-900 dark:border-slate-700 print:border-none print:shadow-none">
                                    <div className="flex justify-between border-b pb-4 mb-6">
                                        <div>
                                            <h2 className="text-2xl font-bold">Structural Calculation Trace</h2>
                                            <p className="text-xs font-mono text-slate-400">{new Date().toLocaleString()}</p>
                                        </div>
                                        <div className="text-right text-xs font-mono opacity-60">
                                            <p>Ref: NDS 2018</p>
                                            <p>Method: ASD</p>
                                            <p>Combos: ASCE 7-16 2.4.1</p>
                                        </div>
                                    </div>

                                    {res.fails.length > 0 && <div className="mb-6 p-3 rounded border border-red-300 bg-red-50 text-red-700 text-xs space-y-1">{res.fails.map((m,i)=><div key={i}>NG: {m}</div>)}</div>}

                                    <EquationBlock title="1. Member & Geometric Properties" isDark={isDark} showTrace={true} equations={[
                                        { label:"Area", sym:"A", formula:"b * d", sub:`${b} * ${d}`, res:res.A.toFixed(2), unit:"in²", ref:"NDS 3.1" },
                                        { label:"Modulus", sym:"S", formula:res.flat ? "d * b² / 6 (flat)" : "b * d² / 6", sub:`${res.bw} * ${res.dep}² / 6`, res:res.S.toFixed(2), unit:"in³", ref:"NDS 3.1" },
                                        { label:"Inertia", sym:"I", formula:res.flat ? "d * b³ / 12 (flat)" : "b * d³ / 12", sub:`${res.bw} * ${res.dep}³ / 12`, res:res.I.toFixed(1), unit:"in⁴", ref:"NDS 3.1" },
                                        { label:"Self Weight", sym:"w_sw", formula:"ρ * A / 144", sub:`${res.dens} * ${res.A.toFixed(2)} / 144`, res:res.w_self.toFixed(1), unit:"plf", traceOnly:true },
                                    ]} />

                                    <div className={`mb-6 p-4 rounded-lg border ${isDark ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-200'} shadow-sm break-inside-avoid`}>
                                        <h4 className={`text-xs font-bold uppercase tracking-wider mb-3 border-b pb-2 ${isDark ? 'text-blue-400 border-blue-900' : 'text-slate-600 border-slate-100'}`}>2. Reference Values & Adjustment Factors Summary</h4>
                                        <div className="text-xs font-mono mb-2">{res.src}: Fb {res.ref.Fb}, Ft {res.ref.Ft ?? '—'}, Fv {res.ref.Fv}, Fc⊥ {res.ref.Fcp}, Fc {res.ref.Fc ?? '—'}, E {res.ref.E}, Emin {res.ref.Emin} psi (Ft, Fc not used: no axial load)</div>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs font-mono">
                                            <FactorRow label="CD (Duration)" val={gb.CD} note={gb.name} isDark={isDark} />
                                            <FactorRow label="CM Fb" val={res.CM.Fb} note={moisture} isDark={isDark} />
                                            <FactorRow label="CM Fv" val={res.CM.Fv} note={moisture} isDark={isDark} />
                                            <FactorRow label="CM Fc⊥" val={res.CM.Fcp} note={moisture} isDark={isDark} />
                                            <FactorRow label="CM E, Emin" val={res.CM.E} note={moisture} isDark={isDark} />
                                            <FactorRow label="Ct Fb, Fv, Fc⊥" val={res.Ct.Fb} note={temp} isDark={isDark} />
                                            <FactorRow label="Ct E, Emin" val={res.Ct.E} note={temp} isDark={isDark} />
                                            <FactorRow label="CL (Stability)" val={gb.CL} note={res.stabilityApplies ? "Unbraced" : "Braced"} isDark={isDark} />
                                            <FactorRow label="CF (Size, Fb)" val={res.CF} note={res.CFnote} isDark={isDark} />
                                            <FactorRow label="Ci Fb, Fv" val={res.Ci.Fb} note={incising?"Yes":"No"} isDark={isDark} />
                                            <FactorRow label="Ci E, Emin" val={res.Ci.E} note={incising?"Yes":"No"} isDark={isDark} />
                                            <FactorRow label="Cr (Repetitive)" val={res.Cr} note={repetitive?"Yes":"No"} isDark={isDark} />
                                            <FactorRow label="Cfu (Flat Use)" val={res.Cfu} note={flatUse?"Yes":"No"} isDark={isDark} />
                                            <FactorRow label="Cb (Bearing Area)" val={res.Cb} note={bearingInterior ? "≥ 3 in. from end" : "End bearing"} isDark={isDark} />
                                        </div>
                                    </div>

                                    <EquationBlock title="3. Beam Stability Factor (CL) Trace" isDark={isDark} showTrace={true} equations={res.stabilityApplies ? [
                                        { label:"Unbraced", sym:"lu/d", formula:"lu / d", sub:`${res.lu.toFixed(1)} / ${res.dep}`, res:res.luD.toFixed(2), unit:"", ref:"Table 3.3.3" },
                                        { label:"Eff Length", sym:"le", formula:res.leRule, sub:`lu = ${res.lu.toFixed(1)}, d = ${res.dep}`, res:res.le.toFixed(1), unit:"in", ref:"Table 3.3.3" },
                                        { label:"Slenderness", sym:"RB", formula:"√(le*d/b²) ≤ 50", sub:`√(${res.le.toFixed(0)}*${res.dep}/${res.bw}²)`, res:res.RB.toFixed(2), unit:"", ref:"3.3.3.6, 3.3.3.7" },
                                        { label:"Crit Buckling", sym:"FbE", formula:"1.20*Emin'/RB²", sub:`1.20*${res.Emin_p.toFixed(0)}/ ${res.RB.toFixed(2)}²`, res:res.FbE.toFixed(0), unit:"psi", ref:"3.3.3.8" },
                                        { label:"Fb*", sym:"Fb*", formula:"Fb·CD·CM·Ct·CF·Ci·Cr", sub:gb.name, res:gb.Fb_star.toFixed(0), unit:"psi", ref:"3.3.3.8" },
                                        { label:"Stability", sym:"CL", formula:"Eq 3.3-6", sub:`FbE/Fb* = ${(res.FbE/gb.Fb_star).toFixed(3)}`, res:gb.CL.toFixed(3), unit:"", ref:"3.3.3.8" },
                                    ] : [
                                        { label:"Stability", sym:"CL", formula:"compression edge braced, or d ≤ b", sub:"—", res:"1.000", unit:"", ref:"3.3.3" },
                                    ]} />

                                    <EquationBlock title="4. Design Values & Adjustment Factors" isDark={isDark} showTrace={traceMode} equations={[
                                        { label:"Adj Bending", sym:"Fb'", formula:"Fb·CD·CM·Ct·CL·CF·Ci·Cfu·Cr", sub:`${res.ref.Fb}·${gb.CD}·${res.CM.Fb}·${res.Ct.Fb}·${f3(gb.CL)}·${f3(res.CF)}·${res.Ci.Fb}·${res.Cfu}·${res.Cr}`, res:gb.Fb_p.toFixed(0), unit:"psi", ref:"Table 4.3.1" },
                                        { label:"Adj Shear", sym:"Fv'", formula:"Fv·CD·CM·Ct·Ci", sub:`${res.ref.Fv}·${gv.CD}·${res.CM.Fv}·${res.Ct.Fv}·${res.Ci.Fv}`, res:gv.Fv_p.toFixed(0), unit:"psi", ref:"Table 4.3.1" },
                                        { label:"Notch Factor", sym:"Cn", formula:"(dn/d)²", sub:`(${f3(res.dn)}/${res.dep})²`, res:res.Cn.toFixed(3), unit:"", ref:"3.4.3.2", traceOnly:true },
                                        { label:"Adj Bearing", sym:"Fc⊥'", formula:"Fc⊥·CM·Ct·Ci·Cb", sub:`${res.ref.Fcp}·${res.CM.Fcp}·${res.Ct.Fcp}·${res.Ci.Fcp}·${f3(res.Cb)}`, res:gc.Fcp_p.toFixed(0), unit:"psi", ref:"Table 4.3.1, 3.10.4" },
                                        { label:"Adj Modulus", sym:"E'", formula:"E·CM·Ct·Ci", sub:`${res.ref.E}·${res.CM.E}·${res.Ct.E}·${res.Ci.E}`, res:res.E_p.toFixed(0), unit:"psi", ref:"Table 4.3.1" },
                                        { label:"Adj Emin", sym:"Emin'", formula:"Emin·CM·Ct·Ci", sub:`${res.ref.Emin}·${res.CM.E}·${res.Ct.E}·${res.Ci.E}`, res:res.Emin_p.toFixed(0), unit:"psi", ref:"Table 4.3.1" },
                                    ]} />

                                    <EquationBlock title="5. Analysis & Stress Check (governing combinations)" isDark={isDark} showTrace={traceMode} equations={[
                                        { label:"Max Moment", sym:"Mmax", formula:"statics, uniform + point loads", sub:`${gb.name}, x = ${gb.xM.toFixed(2)} ft`, res:gb.Mmax.toFixed(0), unit:"ft-lb", ref:"Statics" },
                                        { label:"Act Bending", sym:"fb", formula:"M × 12 / S", sub:`${gb.Mmax.toFixed(0)} × 12 / ${res.S.toFixed(2)}`, res:gb.fb.toFixed(0), unit:"psi", ref:"3.3.2" },
                                        { label:"Bending", sym:"fb/Fb'", formula:"≤ 1.0", sub:`${gb.fb.toFixed(0)} / ${gb.Fb_p.toFixed(0)}`, res:gb.r_b.toFixed(3), unit:"", ref:gb.name },
                                        { label:"Design Shear", sym:"V", formula:"max |V| between d from each support", sub:`${gv.name}, x = ${gv.xV.toFixed(2)} ft, d = ${(res.dep/12).toFixed(3)} ft`, res:gv.Vd.toFixed(0), unit:"lb", ref:"3.4.3.1(a)" },
                                        { label:"Act Shear", sym:"fv", formula:"1.5 V / (b d)", sub:`1.5 × ${gv.Vd.toFixed(0)} / ${res.A.toFixed(2)}`, res:gv.fv.toFixed(1), unit:"psi", ref:"3.4.2" },
                                        ...(res.hasNotch ? [
                                            { label:"Notched End", sym:"fv,n", formula:"1.5 R / (b dn), R = full reaction", sub:`1.5 × ${gv.Rmax.toFixed(0)} / (${res.bw} × ${f3(res.dn)})`, res:gv.fvn.toFixed(1), unit:"psi", ref:"3.4.3.2(a)" },
                                            { label:"Notch Ratio", sym:"fv,n/(Fv'Cn)", formula:"≤ 1.0", sub:`${gv.fvn.toFixed(1)} / (${gv.Fv_p.toFixed(0)} × ${res.Cn.toFixed(3)})`, res:gv.r_vn.toFixed(3), unit:"", ref:gv.name },
                                        ] : []),
                                        { label:"Shear", sym:"fv/Fv'", formula:"≤ 1.0", sub:`${gv.fv.toFixed(1)} / ${gv.Fv_p.toFixed(0)}`, res:gv.r_v1.toFixed(3), unit:"", ref:gv.name },
                                        { label:"Reaction", sym:"R", formula:"max(R_left, R_right)", sub:`${gc.name}: ${gc.RL.toFixed(0)}, ${gc.RR.toFixed(0)}`, res:gc.Rbear.toFixed(0), unit:"lb", ref:"Statics" },
                                        { label:"Bearing", sym:"fc⊥", formula:"R / (b lb)", sub:`${gc.Rbear.toFixed(0)} / (${res.bw} × ${res.lb})`, res:gc.fcp.toFixed(0), unit:"psi", ref:"3.10.2" },
                                        { label:"Bearing", sym:"fc⊥/Fc⊥'", formula:"≤ 1.0", sub:`${gc.fcp.toFixed(0)} / ${gc.Fcp_p.toFixed(0)}`, res:gc.r_c.toFixed(3), unit:"", ref:gc.name },
                                    ]} />

                                    <EquationBlock title="6. Deflection (service loads)" isDark={isDark} showTrace={traceMode} equations={[
                                        { label:"Dead", sym:"ΔD", formula:"uniform + point loads", sub:`E' = ${res.E_p.toFixed(0)} psi, I = ${res.I.toFixed(1)} in⁴`, res:res.defl.dD.toFixed(3), unit:"in", ref:"3.5.1" },
                                        { label:"Live/Snow", sym:"ΔLL", formula:"max of L, Lr, S, 0.75L+0.75(Lr or S)", sub:`governs: ${res.defl.trName}`, res:res.defl.Dtr.toFixed(3), unit:"in", ref:"3.5.1" },
                                        { label:"LL Check", sym:"ΔLL/(L/n)", formula:`limit L/${res.defl.LLdiv}`, sub:`${res.defl.Dtr.toFixed(3)} / ${res.defl.LLlim.toFixed(3)}`, res:res.defl.r_dLL.toFixed(3), unit:"", ref:"IBC 1604.3" },
                                        { label:"Total", sym:"ΔT", formula:"Kcr·ΔD + ΔLL", sub:`${res.defl.Kcr} × ΔD + Δ(${res.defl.totName})`, res:res.defl.Dtot.toFixed(3), unit:"in", ref:"3.5.2" },
                                        { label:"TL Check", sym:"ΔT/(L/n)", formula:`limit L/${res.defl.TLdiv}`, sub:`${res.defl.Dtot.toFixed(3)} / ${res.defl.TLlim.toFixed(3)}`, res:res.defl.r_dTL.toFixed(3), unit:"", ref:"IBC 1604.3" },
                                    ]} />

                                    <div className={`mb-6 p-4 rounded-lg border ${isDark ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-200'} shadow-sm break-inside-avoid overflow-x-auto`}>
                                        <h4 className={`text-xs font-bold uppercase tracking-wider mb-3 border-b pb-2 ${isDark ? 'text-blue-400 border-blue-900' : 'text-slate-600 border-slate-100'}`}>7. All ASD Load Combinations</h4>
                                        <table className="w-full text-xs font-mono">
                                            <thead><tr className="text-left opacity-60"><th className="pr-2">Combination</th><th className="pr-2">CD</th><th className="pr-2">w (plf)</th><th className="pr-2">R_L / R_R (lb)</th><th className="pr-2">M (ft-lb)</th><th className="pr-2">fb/Fb'</th><th className="pr-2">fv/Fv'</th><th className="pr-2">fc⊥/Fc⊥'</th></tr></thead>
                                            <tbody>{res.combos.map(c => (
                                                <tr key={c.key} className="border-t border-slate-100 dark:border-slate-700">
                                                    <td className="pr-2">{c.name}</td><td className="pr-2">{c.CD}</td><td className="pr-2">{c.w.toFixed(1)}</td><td className="pr-2">{c.RL.toFixed(0)} / {c.RR.toFixed(0)}</td><td className="pr-2">{c.Mmax.toFixed(0)}</td>
                                                    <td className={`pr-2 ${c === gb ? 'font-bold text-blue-600' : ''}`}>{c.r_b.toFixed(3)}</td>
                                                    <td className={`pr-2 ${c === gv ? 'font-bold text-blue-600' : ''}`}>{c.r_v.toFixed(3)}</td>
                                                    <td className={`pr-2 ${c === gc ? 'font-bold text-blue-600' : ''}`}>{c.r_c.toFixed(3)}</td>
                                                </tr>
                                            ))}</tbody>
                                        </table>
                                        <div className="text-[10px] opacity-60 mt-2">Bold = governing. CD is that of the shortest-duration load present in the combination (NDS 2.3.2). Point loads are included per their load type.</div>
                                    </div>

                                    {res.notes.length > 0 && <div className="mb-6 p-3 rounded border border-amber-300 bg-amber-50 text-amber-800 text-xs space-y-1">{res.notes.map((m,i)=><div key={i}>Note: {m}</div>)}</div>}

                                    {projectInfo.notes && <div className="mt-6 p-4 bg-slate-50 border rounded text-xs font-mono whitespace-pre-wrap">{projectInfo.notes}</div>}
                                </div>
                             )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<UniversalTimberStudio />);
    </script>
</body>
</html>
