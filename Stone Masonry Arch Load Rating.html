    return `${label} max ${F(mx,2)}`;
  };
  const notes=[];
  if(on("mdiag")){
    const imp=LLdata?LLdata.imp:0;
    const v=M.DL.map((f,i)=>f.M+(LLdata?(1+imp)*LLdata.LL[i].M:0));
    const n=diag(v,"#8a3324","M (k·ft/ft)",46); if(n)notes.push(n);
  }
  if(on("pdiag")){
    const imp=LLdata?LLdata.imp:0;
    const v=M.DL.map((f,i)=>f.C+(LLdata?(1+imp)*LLdata.LL[i].C:0));
    const n=diag(v,"#6b21a8","P (k/ft)",40); if(n)notes.push(n);
  }
  /* ---- influence line for a chosen section ---- */
  if(on("il")&&opt.ilSec!=null){
    const sec=opt.ilSec, arr=M.ILM[sec];
    let mx=0; arr.forEach(v=>mx=Math.max(mx,Math.abs(v)));
    if(mx>0){
      const base=Y(ylo)-26, hgt=54;
      el("line",{x1:X(g.xmin),y1:base,x2:X(g.xmax),y2:base,stroke:"#8a857b"},svg);
      let d="";
      for(let j=0;j<M.nN;j++)
        d+=(j?"L":"M")+` ${X(g.nodes[j].x)} ${base-arr[j]/mx*hgt} `;
      el("path",{d,fill:"none",stroke:"#1f4e79","stroke-width":2},svg);
      el("circle",{cx:X(g.nodes[sec].x),cy:base,r:4,fill:"#1f4e79"},svg);
      txt(svg,X(g.xmin)-6,base+4,`η at ${CALC.secTag(M,sec)}`,{anchor:"end",size:11,fill:"#1f4e79"});
      txt(svg,X(g.xmax)+6,base+4,`max ${F(mx,3)} k·ft/kip`,{anchor:"start",size:11,fill:"#1f4e79"});
    }
  }
  /* ---- supports ---- */
  if(on("supports"))for(const idx of [0,M.nN-1]){
    const n=g.nodes[idx];
    if(p.support==="pinned")
      el("polygon",{points:`${X(n.x)},${Y(n.y)} ${X(n.x)-10},${Y(n.y)+16} ${X(n.x)+10},${Y(n.y)+16}`,
        fill:"#fff",stroke:"#1a1a1a","stroke-width":1.7},svg);
    else{
      el("rect",{x:X(n.x)-12,y:Y(n.y)-2,width:24,height:8,fill:"#1a1a1a"},svg);
      for(let k=-1;k<=1;k++)el("line",{x1:X(n.x)+k*8,y1:Y(n.y)+6,x2:X(n.x)+k*8-7,y2:Y(n.y)+15,
        stroke:"#1a1a1a","stroke-width":1.3},svg);
    }
  }
  /* ---- nodes / labels / element numbers ---- */
  if(on("elems"))for(let e=0;e<M.nEl;e++){
    const a=g.nodes[e],b=g.nodes[e+1];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const nx=(a.nx+b.nx)/2, ny=(a.ny+b.ny)/2;
    txt(svg,X(mx)-nx*17,Y(my)+ny*17,String(e+1),{size:10,fill:"#7a6a52",mono:1});
  }
  if(on("nodes"))for(let i=0;i<M.nN;i++){
    const n=g.nodes[i], nm=CALC.secTag(M,i), named=!nm.startsWith("N");
    el("circle",{cx:X(n.x),cy:Y(n.y),r:named?5.5:3.4,fill:"#fff",stroke:"#1f4e79","stroke-width":1.8},svg);
    if(named&&!on("nodeLbl"))
      txt(svg,X(n.x)+n.nx*15,Y(n.y)-n.ny*15,nm,{size:11,fill:"#4a4a4a"});
  }
  if(on("nodeLbl"))for(let i=0;i<M.nN;i++){
    const n=g.nodes[i];
    txt(svg,X(n.x)+n.nx*15,Y(n.y)-n.ny*15,String(i+1),{size:10,fill:"#1f4e79",mono:1});
  }
  /* ---- dimensions ---- */
  if(on("dims")){
    /* Two different spans, and they must not be conflated: the analysis model
       runs springing to springing along the ARCH AXIS, while the clear span is
       measured on the intrados and is inset by the d/2 offset at each end. */
    const dy=Y(gy)+38, dy2=dy+22;
    el("line",{x1:X(g.xmin),y1:dy,x2:X(g.xmax),y2:dy,stroke:"#1f4e79"},svg);
    [g.xmin,g.xmax].forEach(x=>el("line",{x1:X(x),y1:dy-6,x2:X(x),y2:dy+6,stroke:"#1f4e79"},svg));
    txt(svg,(X(g.xmin)+X(g.xmax))/2,dy-8,`arch axis span ${F(g.axisSpan,2)} ft`,{fill:"#1f4e79",size:13});
    if(g.xIntL!=null&&Math.abs(g.axisSpan-g.span)>0.02){
      el("line",{x1:X(g.xIntL),y1:dy2,x2:X(g.xIntR),y2:dy2,stroke:"#8a6d3b"},svg);
      [g.xIntL,g.xIntR].forEach(x=>el("line",{x1:X(x),y1:dy2-6,x2:X(x),y2:dy2+6,stroke:"#8a6d3b"},svg));
      txt(svg,(X(g.xIntL)+X(g.xIntR))/2,dy2+16,`clear span (intrados) ${F(g.span,2)} ft`,
        {fill:"#8a6d3b",size:13});
    }
    const yTopI=Math.max(...g.intrados.map(q=>q.y));
    const rx=X(g.xCrown)-Math.max(52,(X(g.xmax)-X(g.xmin))*0.13);
    el("line",{x1:rx,y1:Y(gy),x2:rx,y2:Y(yTopI),stroke:"#1f4e79"},svg);
    txt(svg,rx-6,(Y(gy)+Y(yTopI))/2,`rise ${F(g.rise,2)} ft`,{anchor:"end",fill:"#1f4e79",size:13});
    const exTop=Math.max(...g.extrados.map(q=>q.y));
    el("line",{x1:X(g.xCrown)+34,y1:Y(exTop),x2:X(g.xCrown)+34,y2:Y(g.bwsAt(g.xCrown)),stroke:"#1f4e79"},svg);
    txt(svg,X(g.xCrown)+40,(Y(exTop)+Y(g.bwsAt(g.xCrown)))/2+4,`cover ${F(g.coverCrown,2)} ft`,
      {anchor:"start",fill:"#1f4e79",size:12});
  }
  /* ---- title block ---- */
  el("rect",{x:W-430,y:H-34,width:422,height:26,fill:"#fff",stroke:"#1a1a1a"},svg);
  txt(svg,W-422,H-16,
    `SPAN ${F(g.span,2)}′  RISE ${F(g.rise,2)}′  d ${F(inOf(p.dC),1)}″/${F(inOf(p.dS),1)}″  `+
    `${M.nEl} EL  ${String(p.support).toUpperCase()}  ${notes.join("  ")}`,
    {anchor:"start",size:11,mono:1,fill:"#1a1a1a"});
  return svg;
}
return {draw,drawUmbrellas,LAYERS};
})();

</script>
<script>
/* ==================================================================
   LATERAL EARTH PRESSURE — dedicated output  (§7.2.7.5B)
   ================================================================== */
const LATERAL=(()=>{
"use strict";
const {step,eqLine,vars,dtab,msg,num,nfx,esc}=R;
const NS="http://www.w3.org/2000/svg";
const el=(t,at,par)=>{const e=document.createElementNS(NS,t);
  for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;};

/* per-element lateral load data, recomputed the same way the solver does */
function elementData(p,M){
  /* gws MUST be declared here. It was not, and the bare identifier resolved
     through named window access to the <input id="gws"> element instead of
     throwing, so gws*p.tws evaluated to NaN — even where t_ws = 0 — and every
     p_h, w_h and resultant on the Earth Pressure tab printed blank while the
     pressure diagram reported a peak of NaN. The solver was never affected;
     this function only feeds the display. */
  const gf=p.gf/1000, gws=p.gws/1000,
        xc=(M.g.xCrown!=null)?M.g.xCrown:(M.g.xmin+M.g.xmax)/2;
  const out=[];
  for(let e=0;e<M.nEl;e++){
    const a=M.g.nodes[e], b=M.g.nodes[e+1];
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
    const xm=(a.x+b.x)/2;
    const dir=(Math.abs(xm-xc)<1e-9)?0:(xm<xc?1:-1);
    const z=[a,b].map(n=>Math.max(M.g.bwsAt(n.x)-n.y,0));   // depth to the AXIS
    const ph=z.map(zz=>p.K*(gf*zz+gws*p.tws));
    /* The face the soil pushes on is the EXTRADOS, so the vertical projection
       that converts the pressure to a load along the element is the extrados
       one, not the arch axis beneath it. This table used the axis projection —
       dy on the axis, sin of the axis inclination — while the solver has always
       used the extrados. On a deep near-semicircular ring the extrados sweeps
       more vertical extent than the axis for the same element, so every w_h and
       every resultant printed here came out about 11% below the load actually
       applied, and the "total inward thrust" totals below with them. Same class
       of defect as the two gws sites: a display quietly contradicting the
       calculation beside it, on the load that supplies most of the springline
       moment. The pressures themselves were right; only the projection was not.

       s is kept as the ratio the solver uses — extrados vertical extent per unit
       axis length — so it can exceed 1.0 near the springings. That is correct
       and is not a sine. */
    const vproj=Math.abs(b.y-a.y);          // AXIS vertical projection
    const s=(L>1e-12)?(vproj/L):0;
    const w=ph.map(v=>v*s);
    const R=L*(w[0]+w[1])/2;                       // resultant on the element
    out.push({e,a,b,L,s,dir,z,ph,w,R:R*dir,vproj,
              thetaAx:Math.atan2(Math.abs(dy),Math.abs(dx))*180/Math.PI});
  }
  return out;
}

function pane(p,M,govVeh,govRes){
  const c=UI.counter();
  const gf=p.gf/1000;
  const ED=elementData(p,M);
  let h="";

  /* ---- 1. provision ---- */
  h+=UI.pnl("le_prov",c(),"Provision and basis",
    msg("key","§7.2.7.5B, verbatim requirement",
      "The horizontal earth pressure loads shall be calculated assuming a lateral earth pressure coefficient "+
      "of 0.25. The loads shall be computed along the vertical heights of each element and shall be applied as "+
      "linearly varying loads to each element.")+
    `<p>Three things follow from that sentence and are implemented literally. The coefficient is <b>fixed at
     0.25</b> by the clause, not derived from a friction angle or an at-rest condition. The pressure is computed
     on the <b>vertical height</b> of each element, so a near-horizontal element at the crown attracts almost
     none of it and a near-vertical element at the springing attracts nearly all. And it is applied as a
     <b>linearly varying element load</b>, not lumped to nodes.</p>`+
    step({label:"Lateral pressure at the arch axis",ref:"§7.2.7.5B",
      sym:"p_h=K\\left(\\gamma_f\\,z+\\gamma_{ws}\\,t_{ws}\\right)",
      sub:`${num(p.K,3)}\\left(${num(gf,4)}\\,z+${num(gws,4)}\\times${num(p.tws,3)}\\right)`,
      res:"",units:"ksf",
      note:"z is the depth from the bottom of the wearing surface down to the ARCH AXIS — the element the "+
        "load is applied to. The "+
        "wearing surface is a surcharge bearing on the fill, so its weight enters the vertical stress at its "+
        "own unit weight — its thickness is not part of h_f, but its weight is not omitted either."+
        (p.tws>0?"":" Here t_ws = 0, so that term vanishes and p_h = K·γ_f·h_f. Check the Roadway Grade & "+
          "Fill panel if a wearing surface was intended, or the Superimposed Dead Load panel if the pavement "+
          "weight was entered as a line item instead.")})+
    step({label:"Line load on the one-foot strip",
      sym:"w_h=p_h\\,b=p_h\\times1\\ \\text{ft}",sub:"",res:"",units:"k/ft",
      note:"The load per foot of vertical height is numerically the pressure. §7.2.7.5B computes the loads "+
        "along the vertical heights of the elements, and that is what is applied — nothing is converted."})+
    step({label:"Total horizontal force on an element",
      sym:"F=\\tfrac12\\left(p_{h,I}+p_{h,J}\\right)\\Delta y",sub:"",res:"",units:"k/ft width",
      note:"Δy is the vertical projection of the element on the arch axis. Near the crown Δy goes to zero "+
        "and the lateral load vanishes with it — the soil there is carried as vertical fill load instead, "+
        "not lost. The exported Midas model writes p_h with bPROJ = YES and forms this same product itself."})+
    vars([["K","Lateral earth pressure coefficient",p.K,"—",3],
          ["\\gamma_f","Fill unit weight",p.gf,"pcf",0],
          ["\\gamma_{ws}","Wearing surface unit weight",p.gws,"pcf",0],
          ["t_{ws}","Wearing surface thickness",p.tws,"ft (entered as "+nfx(inOf(p.tws),1)+" in)",3],
          ["z","Depth, bottom of wearing surface to the arch axis","varies","ft"]])+
    (Math.abs(p.K-0.25)>1e-9
      ? msg("wrn","K is not the prescribed value",
          `K = ${nfx(p.K,3)} is in use where §7.2.7.5B specifies 0.25. State the basis for the deviation in the `+
          "calculation package; the sensitivity below shows what it is worth.")
      : msg("inf","K is the prescribed 0.25","No deviation from §7.2.7.5B.")),"§7.2.7.5B");

  /* ---- 2. element table ---- */
  /* ang is the ELEMENT inclination, computed from the axis geometry — it
     describes the element, and asin(s) would no longer give it now that s is the
     extrados projection ratio rather than a sine. */
  const rows=ED.map(d=>({__i:d.e,el:"E"+(d.e+1),
    L:d.L, ang:d.thetaAx, vproj:d.vproj,
    z1:d.z[0], z2:d.z[1], p1:d.ph[0], p2:d.ph[1], w1:d.w[0], w2:d.w[1],
    R:d.R, side:d.dir>0?"→ inward (left haunch)":(d.dir<0?"← inward (right haunch)":"— none")}));
  h+=UI.pnl("le_elem",c(),"Lateral pressure on each element",
    dtab([{k:"el",h:"Element",txt:1},{k:"L",h:"L (ft)",dp:3},{k:"ang",h:"θ from horiz (°)",dp:1},
      {k:"vproj",h:"axis vertical projection (ft)",dp:3},
      {k:"z1",h:"z at I (ft)",dp:3},{k:"z2",h:"z at J (ft)",dp:3},
      {k:"p1",h:"p_h at I (ksf) = k/ft on the 1 ft strip",dp:4},
      {k:"p2",h:"p_h at J (ksf) = k/ft on the 1 ft strip",dp:4},
      {k:"R",h:"resultant (k/ft width)",dp:4},{k:"side",h:"Direction",txt:1}],rows)+
    `<div class="note">Pressure acts inward on both haunches — toward the barrel centerline — so the two sides
     largely balance and the net effect on the arch is a compressive squeeze plus, where the geometry or the
     grade is not symmetric, a net horizontal push. Resultant is positive to the right, per foot of barrel
     width. θ near 90° is a near-vertical element carrying nearly the full pressure; near 0° at the crown it
     carries almost none.
     <br><br><b>p_h is the load.</b> It acts along the global X axis and is distributed over the vertical
     extent of the element, so on the one-foot analysis strip the k/ft figure and the ksf figure are the same
     number — there is nothing else to convert. The total horizontal force on an element is mean p_h × its
     vertical projection, which is the resultant column.
     <br><br>The exported Midas model carries these same values: the DLEARTH beam loads are written with
     <span class="mono">bPROJ = YES</span>, so the number in the MCT file is p_h itself and Midas resolves it
     onto the vertical projection of each element. Nothing is folded into it, and the file can be read against
     this table line for line.
     <br><br><b>Everything here is on the arch axis.</b> The depth z is measured from the grade line down to
     the axis, and the pressure is applied over the axis vertical projection of the element. One datum, the
     structural centreline, for both — so the ratio above is |sin θ| and never exceeds one, and the load dies
     away at the crown where the element is horizontal.
     <br><br>The vertical fill load is a separate case and is <b>not</b> on this basis: it is computed on the
     extrados, where the fill physically bears on the ring. The two loads therefore reference different
     surfaces, deliberately. The fill is a weight resting on a face, so the face is what matters; the lateral
     pressure is applied to the element §7.2.7.5B tells us to apply it to, and referencing its depth anywhere
     other than that element would split one load across two surfaces and leave an eccentric couple this
     frame model has nowhere to put.</div>`,"§7.2.7.5B",true);

  /* ---- 3. totals and balance ---- */
  let RL=0,RR=0;
  ED.forEach(d=>{ if(d.dir>0)RL+=Math.abs(d.R); else if(d.dir<0)RR+=Math.abs(d.R); });
  const net=RL-RR;
  h+=UI.pnl("le_tot",c(),"Resultants and balance",
    step({label:"Total inward thrust, left haunch",sym:"\\Sigma R_{left}",sub:"",res:num(RL,4),units:"k/ft"})+
    step({label:"Total inward thrust, right haunch",sym:"\\Sigma R_{right}",sub:"",res:num(RR,4),units:"k/ft"})+
    step({label:"Net horizontal earth load on the barrel",
      sym:"\\Sigma R_{left}-\\Sigma R_{right}",sub:`${num(RL,4)}-${num(RR,4)}`,res:num(net,5),units:"k/ft",
      note:Math.abs(net)<1e-6
        ? "Zero, as it must be for a symmetric arch on a level grade: the two haunches push equally and "+
          "oppositely, so the lateral load produces no net horizontal force, only internal effects."
        : "Non-zero, because the geometry or the grade is not symmetric. This net push is carried by the "+
          "springings and shows up as unequal horizontal reactions."})+
    msg("inf","Why a self-balancing load still matters",
      "Even when the net force is zero, the lateral pressure is not a null load. It applies an inward squeeze "+
      "that raises the thrust and, more importantly, generates moment at the haunches and springings. On a "+
      "typical arch it supplies a large fraction of the springline dead load moment, and all of it rests on the "+
      "single assumed coefficient."),"§7.2.7.5B");

  /* ---- 4. force effects and share ---- */
  const fr=[];
  for(let i=0;i<M.nN;i++){
    const E=M.DLC.earth[i], T=M.DL[i];
    fr.push({__i:i,tag:CALC.secTag(M,i),
      P:E.C,V:E.V,M:E.M,
      Pt:T.C,Mt:T.M,
      shP:(Math.abs(T.C)>1e-9)?100*E.C/T.C:NaN,
      shM:(Math.abs(T.M)>1e-9)?100*E.M/T.M:NaN});
  }
  /* Rank the share only where the total moment is large enough for a ratio to
     mean anything. Near a moment reversal the total passes through zero and any
     component is an unbounded percentage of it, which would be reported as a
     spurious headline number. */
  let Mref=0; fr.forEach(r=>{Mref=Math.max(Mref,Math.abs(r.Mt));});
  const floorM=0.15*Mref;
  let wsh=0,wi=0,ranked=false;
  fr.forEach(r=>{
    if(!isFinite(r.shM)||Math.abs(r.Mt)<floorM)return;
    if(!ranked||Math.abs(r.shM)>Math.abs(wsh)){wsh=r.shM;wi=r.__i;ranked=true;}
  });
  fr.forEach(r=>{ if(Math.abs(r.Mt)<floorM)r.shM=NaN; });
  h+=UI.pnl("le_eff",c(),"Force effects from lateral earth pressure alone",
    dtab([{k:"tag",h:"Section",txt:1},
      {k:"P",h:"P earth (k/ft)",dp:4},{k:"V",h:"V earth (k/ft)",dp:4},{k:"M",h:"M earth (k·ft/ft)",dp:4},
      {k:"Pt",h:"P all DL",dp:3},{k:"Mt",h:"M all DL",dp:3},
      {k:"shP",h:"share of P (%)",dp:1},{k:"shM",h:"share of M (%)",dp:1}],fr)+
    msg(!ranked?"inf":(Math.abs(wsh)>25?"key":"inf"),"Share of the dead load moment",
      (!ranked?"No section carries enough dead load moment for a share to be meaningful here. ":
      `Lateral earth pressure supplies its largest share of the dead load moment at `+
      `<b>${esc(CALC.secTag(M,wi))}</b>, where it accounts for <b>${nfx(wsh,1)}%</b>. `)+
      (Math.abs(wsh)>25
        ? "That is a large share for a load defined by one assumed coefficient. Run the sensitivity below and "+
          "keep it with the calculation."
        : "Modest at this geometry, but still worth documenting."))+
    `<div class="note">This is a separate solve of the same frame with only the lateral pressure applied, so it
     superposes exactly with the other dead load components shown on the Dead Load and Nodal Results tabs.
     The share columns are left blank where the total dead load moment is below 15% of its peak, because close
     to a moment reversal the total passes through zero and a percentage of it is meaningless rather than
     large.</div>`,
    "§7.2.7.5B");

  /* ---- 5. pressure diagram ---- */
  h+=UI.pnl("le_fig",c(),"Pressure diagram",
    `<figure><svg id="figLat" viewBox="0 0 1000 620"></svg>
      <figcaption>Lateral earth pressure on the barrel. Arrows are drawn to scale from the extrados, pointing
      inward on both haunches, with the intensity trapezoid on each element. The pressure grows with depth and
      is resolved onto the vertical projection, so it dies away toward the crown.</figcaption></figure>`,
    "§7.2.7.5B");

  /* ---- 6. sensitivity to K ---- */
  if(govVeh){
    const Ks=[0,0.125,0.25,0.375,0.5];
    const srows=[];
    for(const kk of Ks){
      let Mk,rk=null;
      try{
        Mk=ARCH.buildModel(Object.assign({},p,{K:kk}));
        rk=ARCH.rateVehicle(Mk,govVeh,p.fa,p.impMode);
      }catch(e){continue;}
      srows.push({__i:srows.length,K:kk,
        slM:Mk.DL[0].M, crM:Mk.DL[Math.round((Mk.nN-1)/2)].M,
        rf:rk.rf, tons:rk.rf*govVeh.tons,
        sec:CALC.secTag(Mk,rk.sec),
        d:(govRes&&govRes.rf>0)?100*(rk.rf-govRes.rf)/govRes.rf:NaN});
    }
    h+=UI.pnl("le_sens",c(),"Sensitivity of the rating to K",
      msg("key","Why this is here",
        "§7.2.7.5B prescribes K = 0.25 without qualification, so the value is not the engineer's to choose — "+
        "but it is still an assumption, and it is the one input in the dead load that is not measurable. This "+
        "table shows what the rating would be at other coefficients, so the sensitivity is documented rather "+
        "than assumed away. The prescribed value is the one to report.")+
      dtab([{k:"K",h:"K",dp:3},{k:"slM",h:"DL M at springline",dp:3},{k:"crM",h:"DL M at crown",dp:3},
        {k:"rf",h:"RF",dp:3},{k:"tons",h:"Rating (tons)",dp:1},{k:"sec",h:"Governs at",txt:1},
        {k:"d",h:"Δ RF vs prescribed (%)",dp:1}],srows,{govIdx:srows.findIndex(r=>Math.abs(r.K-0.25)<1e-9)})+
      `<div class="note">Rated for ${esc(govVeh.name)}, the governing vehicle. K = 0 removes the lateral
       pressure entirely and is shown only to bound the effect — it is not a permissible assumption under
       §7.2.7.5B. The prescribed value is shaded.</div>`,"§7.2.7.5B",true);
  }
  return h;
}

/* pressure diagram */
function drawFig(svg,p,M){
  svg.innerHTML="";
  const g=M.g, W=1000,H=620,fr=16;
  const ED=elementData(p,M);
  let pmax=0; ED.forEach(d=>{pmax=Math.max(pmax,d.ph[0],d.ph[1]);});
  const pad=Math.max(1.5,0.16*(g.xmax-g.xmin));
  const xlo=g.xmin-pad, xhi=g.xmax+pad;
  const gy=Math.min(g.nodes[0].y,g.nodes[M.nN-1].y);
  const ylo=gy-Math.max(1,0.1*g.rise), yhi=g.surfAt(g.xCrown)+Math.max(1,0.1*g.rise);
  const s=Math.min((W-2*fr-40)/(xhi-xlo),(H-2*fr-40)/(yhi-ylo));
  const ox=(W-(xhi-xlo)*s)/2, oy=fr+22;
  const X=x=>ox+(x-xlo)*s, Y=y=>oy+(yhi-y)*s;
  el("rect",{x:2,y:2,width:W-4,height:H-4,fill:"#fff",stroke:"#1a1a1a","stroke-width":1.2},svg);
  // fill + ring
  el("polygon",{points:`${X(xlo)},${Y(g.bwsAt(xlo))} ${X(xhi)},${Y(g.bwsAt(xhi))} ${X(xhi)},${Y(ylo)} ${X(xlo)},${Y(ylo)}`,
    fill:"#e9e0cb"},svg);
  let d1="M ";
  g.extrados.forEach((e2,i)=>{d1+=`${i?"L":""} ${X(e2.x)} ${Y(e2.y)} `;});
  for(let i=g.intrados.length-1;i>=0;i--)d1+=`L ${X(g.intrados[i].x)} ${Y(g.intrados[i].y)} `;
  el("path",{d:d1+"Z",fill:"#cdc8bd",stroke:"#1a1a1a","stroke-width":1.4},svg);
  let o="M "+X(g.xmin)+" "+Y(gy)+" ";
  g.intrados.forEach(e2=>{o+=`L ${X(e2.x)} ${Y(e2.y)} `;});
  el("path",{d:o+`L ${X(g.xmax)} ${Y(gy)} Z`,fill:"#fff",stroke:"#1a1a1a","stroke-width":1},svg);
  // pressure trapezoids + arrows
  const scale=(pmax>0)?70/pmax:0;
  ED.forEach(d=>{
    if(d.dir===0||(d.ph[0]<1e-9&&d.ph[1]<1e-9))return;
    const a=d.a,b=d.b;
    const o1=d.ph[0]*scale*(-d.dir), o2=d.ph[1]*scale*(-d.dir);
    el("polygon",{points:`${X(a.extX)},${Y(a.extY)} ${X(b.extX)},${Y(b.extY)} `+
      `${X(b.extX)+o2},${Y(b.extY)} ${X(a.extX)+o1},${Y(a.extY)}`,
      fill:"rgba(31,107,50,.22)",stroke:"#1f6b32","stroke-width":1},svg);
    // arrow at the element mid-height
    const mx=(a.extX+b.extX)/2, my=(a.extY+b.extY)/2, om=(o1+o2)/2;
    if(Math.abs(om)>6){
      el("line",{x1:X(mx)+om,y1:Y(my),x2:X(mx)+d.dir*3,y2:Y(my),stroke:"#1f6b32","stroke-width":1.5},svg);
      el("path",{d:`M ${X(mx)+d.dir*10} ${Y(my)-4} L ${X(mx)+d.dir*2} ${Y(my)} L ${X(mx)+d.dir*10} ${Y(my)+4}`,
        fill:"none",stroke:"#1f6b32","stroke-width":1.5},svg);
    }
  });
  // scale note
  const t=document.createElementNS(NS,"text");
  t.setAttribute("x",W/2); t.setAttribute("y",H-14);
  t.setAttribute("text-anchor","middle"); t.setAttribute("font-size",13);
  t.setAttribute("fill","#1f6b32"); t.setAttribute("font-family","Times New Roman,serif");
  t.textContent=`peak p_h = K·γ_f·z = ${Number(pmax).toFixed(4)} ksf at the springings   ·   K = ${Number(p.K).toFixed(3)}`;
  svg.appendChild(t);
  return svg;
}
return {pane,drawFig,elementData};
})();

</script>
<script>
/* ==================================================================
   FORCE DIAGRAMS — moment, shear and thrust by load component
   ================================================================== */
const DIAG=(()=>{
"use strict";
const {msg,dtab,num,nfx,esc}=R;

const COMPS=[
  ["dl","Dead load (ring, WS, SDL)","#6b5b45"],
  ["ev","Earth pressure — vertical (fill)","#8a6d3b"],
  ["el","Earth pressure — lateral","#1f6b32"],
  /* The three dead load components were only ever drawn separately, and "Total"
     includes the live load, so there was no line showing the dead load as the
     structure actually carries it. That line is what tells you whether the live
     load ADDS to the dead load at a section or relieves it — and a live load
     that opposes the dead load can make the largest live load effect the least
     critical case, which is exactly the trap a rating should not walk into. */
  ["dlt","Dead load total, incl. earth","#3d3226"],
  ["ll","Live load","#9c1c1c"],
  ["tot","Total (dead + live)","#1f4e79"]
];

/* dead load grouped the way the filter presents it */
function dlGroups(M){
  const nN=M.nN, g={dl:[],ev:[],el:[]};
  for(let i=0;i<nN;i++){
    const s=(w,f)=>M.DLC[w]?M.DLC[w][i][f]:0;
    g.dl.push({C:s("self","C")+s("ws","C")+s("sdl","C"),
               V:s("self","V")+s("ws","V")+s("sdl","V"),
               M:s("self","M")+s("ws","M")+s("sdl","M")});
    g.ev.push({C:s("fill","C"),V:s("fill","V"),M:s("fill","M")});
    g.el.push({C:s("earth","C"),V:s("earth","V"),M:s("earth","M")});
  }
  return g;
}

/* live load effects at one position, with impact on the selected basis */
/* NOTE for the Diagrams tab. Adverse-influence-only loading produces a DIFFERENT
   load case for every section — the nodes dropped when checking the crown are not
   the nodes dropped when checking a springing — so there is no single diagram
   that represents it. These diagrams therefore always show the whole vehicle in
   place, and the tab says so when the option is on. */
function llAt(p,M,veh,pos,dir){
  const local=(p.impMode==="local");
  let q=ARCH.nodalLL(M,veh,pos,dir);
  if(local)q=ARCH.applyLocalImpact(M,q);
  const LL=ARCH.llEffects(M,q);
  const imp=local?0:ARCH.impactAt(p,M.g.coverCrown+p.tws);
  return LL.map(v=>({C:(1+imp)*v.C,V:(1+imp)*v.V,M:(1+imp)*v.M}));
}

/* rating factor at ONE section only — used by "go to governing" */
function rfAtNode(p,M,i,LL){
  const faKsf=p.fa*0.144, d=M.dn[i], DL=M.DL[i];
  const f=m=>ARCH.stressMax(DL.C+m*LL[i].C, DL.M+m*LL[i].M, d);
  if(f(0)===Infinity||f(0)>=faKsf)return 0;
  let lo=0,hi=1;
  while(hi<512&&f(hi)<faKsf)hi*=2;
  if(hi>=512&&f(hi)<faKsf)return 512;
  for(let k=0;k<38;k++){const mid=(lo+hi)/2;(f(mid)<faKsf)?lo=mid:hi=mid;}
  return (lo+hi)/2;
}

/* sweep for the position giving the LOWEST rating factor at a chosen node */
function governingAt(p,M,veh,node){
  const L=veh.axles[veh.axles.length-1].x;
  const x0=M.g.xmin-L-2, x1=M.g.xmax+2;
  const stp=Math.max(0.25,(x1-x0)/240);
  let best={rf:Infinity,pos:x0,dir:1};
  for(let x=x0;x<=x1;x+=stp)for(const dir of [1,-1]){
    const LL=llAt(p,M,veh,x,dir);
    const rf=rfAtNode(p,M,node,LL);
    if(rf<best.rf)best={rf,pos:x,dir};
  }
  return best;
}

/* max/min of every effect at every section, over all positions and both
   directions. Cached on the model, since it costs one pass per vehicle. */
function envelope(p,M,veh){
  M.__env=M.__env||{};
  const key=veh.id+"|"+p.impMode+"|"+p.fa;
  if(M.__env[key])return M.__env[key];
  const n=M.nN;
  const E={maxM:new Array(n).fill(-Infinity),minM:new Array(n).fill(Infinity),
           maxV:new Array(n).fill(-Infinity),minV:new Array(n).fill(Infinity),
           maxC:new Array(n).fill(-Infinity),minC:new Array(n).fill(Infinity),
           atMaxM:new Array(n).fill(NaN),atMinM:new Array(n).fill(NaN)};
  const L=veh.axles[veh.axles.length-1].x;
  const x0=M.g.xmin-L-2, x1=M.g.xmax+2;
  /* Same sweep the rating uses — quarter-foot steps in both directions — so the
     envelope and the reported rating factors come from the same set of vehicle
     positions rather than two different discretizations. */
  const stp=Math.max(0.25,(x1-x0)/240);
  for(let x=x0;x<=x1;x+=stp)for(const dir of [1,-1]){
    const LL=llAt(p,M,veh,x,dir);
    for(let i=0;i<n;i++){
      if(LL[i].M>E.maxM[i]){E.maxM[i]=LL[i].M;E.atMaxM[i]=x;}
      if(LL[i].M<E.minM[i]){E.minM[i]=LL[i].M;E.atMinM[i]=x;}
      if(LL[i].V>E.maxV[i])E.maxV[i]=LL[i].V;
      if(LL[i].V<E.minV[i])E.minV[i]=LL[i].V;
      if(LL[i].C>E.maxC[i])E.maxC[i]=LL[i].C;
      if(LL[i].C<E.minC[i])E.minC[i]=LL[i].C;
    }
  }
  M.__env[key]=E;
  return E;
}

/* trace data for one effect; the app renders it */
function series(p,M,st,eff){
  const veh=st.veh;
  const xs=M.g.nodes.map((n,i)=>st.xaxis==="s"?n.s:n.x);
  const G=dlGroups(M);
  const LL=veh?llAt(p,M,veh,st.pos,st.dir):null;
  const mul=(st.atRF&&st.rf>0&&st.rf<500)?st.rf:1;
  const key={M:"M",V:"V",P:"C"}[eff];
  const out=[];
  const add=(id,name,color,vals,o)=>{
    if(!st.show[id])return;
    out.push(Object.assign({id,name,color,x:xs,y:vals},o||{}));
  };
  add("dl","Dead load (ring, WS, SDL)","#6b5b45",G.dl.map(v=>v[key]));
  add("ev","Earth — vertical (fill)","#8a6d3b",G.ev.map(v=>v[key]));
  add("el","Earth — lateral","#1f6b32",G.el.map(v=>v[key]));
  if(LL)add("ll","Live load"+(mul!==1?` × RF ${nfx(mul,3)}`:""),"#9c1c1c",
    LL.map(v=>mul*v[key]),{width:2.4});
  if(st.show.dlt)
    out.push({id:"dlt",name:"Dead load total, incl. earth",color:"#3d3226",
      x:xs,y:M.DL.map(v=>v[key]),width:2.4,dash:"dash"});
  if(st.show.tot){
    const tot=M.DL.map((v,i)=>v[key]+(LL?mul*LL[i][key]:0));
    out.push({id:"tot",name:"Total (dead + live)",color:"#1f4e79",x:xs,y:tot,width:3});
  }
  let env=null;
  if(st.show.env&&veh){
    const E=envelope(p,M,veh);
    const hi=(eff==="M")?E.maxM:(eff==="V")?E.maxV:E.maxC;
    const lo=(eff==="M")?E.minM:(eff==="V")?E.minV:E.minC;
    const dlv=M.DL.map(v=>v[key]);
    env={x:xs,hi:hi.map((v,i)=>dlv[i]+mul*v),lo:lo.map((v,i)=>dlv[i]+mul*v)};
  }
  return {xs,traces:out,env,
    xlabel:st.xaxis==="s"?"arc length from left springing (ft)":"position along the span (ft)",
    ylabel:{M:"moment (kip·ft per ft of width)",V:"shear (kip per ft)",
            P:"thrust, compression positive (kip per ft)"}[eff]};
}

/* ---------- diagrams drawn ON the arch ----------
   The flat plot answers "what is the value here"; this one answers "where on
   the structure", which on a curved member is the harder question. Each ordinate
   is laid off along the section NORMAL at its node — the same direction the
   section is taken on — so the diagram stands off the arch the way Midas draws
   it, and a hogging moment at the springing visibly opens toward the extrados.

   Everything is returned in model feet. Scale: the largest ordinate in the set
   is drawn as a fixed fraction of the span, so the three effects are each
   readable on their own terms. They are NOT to a common scale with each other —
   moment and thrust do not share units — and the caption says so. */
function onArch(p,M,st,eff,frac){
  const S=series(p,M,st,eff);
  const nd=M.g.nodes;
  const span=Math.max(M.g.xmax-M.g.xmin,1e-6);
  let peak=0;
  const scan=(a)=>{for(const v of a)if(isFinite(v))peak=Math.max(peak,Math.abs(v));};
  S.traces.forEach(t=>scan(t.y));
  if(S.env){scan(S.env.hi);scan(S.env.lo);}
  const k=(peak>1e-12)?(span*(frac||0.22)/peak):0;
  /* Outward normal at each node. nx,ny already point toward the extrados. */
  const nx=nd.map(n=>n.nx), ny=nd.map(n=>n.ny);
  const off=(vals)=>{
    const X=[],Y=[];
    for(let i=0;i<nd.length;i++){
      const v=isFinite(vals[i])?vals[i]:0;
      X.push(nd[i].x+nx[i]*k*v); Y.push(nd[i].y+ny[i]*k*v);
    }
    return {x:X,y:Y};
  };
  const traces=S.traces.map(t=>Object.assign({},t,off(t.y),{vals:t.y}));
  const env=S.env?{hi:off(S.env.hi),lo:off(S.env.lo)}:null;
  /* Hatching: a spoke from the axis to the ordinate at every node, which is what
     makes a diagram read as a diagram rather than as a second curve. */
  const spokes=traces.length?(()=>{
    const t=traces[traces.length-1], X=[],Y=[];
    for(let i=0;i<nd.length;i++){X.push(nd[i].x,t.x[i],null);Y.push(nd[i].y,t.y[i],null);}
    return {x:X,y:Y};
  })():null;
  return {axis:{x:nd.map(n=>n.x),y:nd.map(n=>n.y)},
          intr:{x:nd.map(n=>n.intX!=null?n.intX:n.x-n.nx*n.d/2),
                y:nd.map(n=>n.intY!=null?n.intY:n.y-n.ny*n.d/2)},
          extr:{x:nd.map(n=>n.extX),y:nd.map(n=>n.extY)},
          traces,env,spokes,scale:k,peak,
          ylabel:S.ylabel};
}

/* Readout under the controls. It is laid out to mirror the chart legend one row
   per trace, because a single "ΣM" invites the reader to compare it against
   whichever curve happens to be visible — the combined value and the live load
   curve are very different numbers and nothing on screen said which was which. */
function readout(p,M,st){
  const LL=llAt(p,M,st.veh,st.pos,st.dir);
  const i=st.node, d=M.dn[i];
  const mul=(st.atRF&&st.rf>0&&st.rf<500)?st.rf:1;
  const G=dlGroups(M);
  const rows=[
    ["Dead load (ring, WS, SDL)","#6b5b45",G.dl[i].M,G.dl[i].C,G.dl[i].V],
    ["Earth — vertical (fill)","#8a6d3b",G.ev[i].M,G.ev[i].C,G.ev[i].V],
    ["Earth — lateral","#1f6b32",G.el[i].M,G.el[i].C,G.el[i].V],
    ["Live load"+(mul!==1?" × RF":""),"#9c1c1c",mul*LL[i].M,mul*LL[i].C,mul*LL[i].V]
  ];
  const tM=M.DL[i].M+mul*LL[i].M, tP=M.DL[i].C+mul*LL[i].C, tV=M.DL[i].V+mul*LL[i].V;
  const e=(tP>1e-9)?Math.abs(tM)/tP:Infinity;
  const f=ARCH.stressMax(tP,tM,d);
  const rf=rfAtNode(p,M,i,LL);
  const sw=c=>`<span style="display:inline-block;width:11px;height:11px;background:${c};
    border-radius:2px;margin-right:6px;vertical-align:-1px"></span>`;
  let h=`<div class="note" style="margin:2px 0 4px">At <b>${CALC.secTag(M,i)}</b>, x = ${nfx(M.g.nodes[i].x,2)} ft,
    with the vehicle at x = ${nfx(st.pos,2)} ft. Each row is one curve on the charts below.</div>`;
  h+=`<table class="dt"><thead><tr><th>Load group</th>
      <th class="num">moment (k·ft/ft)</th><th class="num">thrust (k/ft)</th>
      <th class="num">shear (k/ft)</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr><td>${sw(r[1])}${esc(r[0])}</td><td class="num">${nfx(r[2],3)}</td>
        <td class="num">${nfx(r[3],3)}</td><td class="num">${nfx(r[4],3)}</td></tr>`;
  });
  h+=`<tr class="gov"><td><b>${sw("#1f4e79")}Total — dead + live</b></td>
      <td class="num"><b>${nfx(tM,3)}</b></td><td class="num"><b>${nfx(tP,3)}</b></td>
      <td class="num"><b>${nfx(tV,3)}</b></td></tr>`;
  h+=`</tbody></table>`;
  h+=`<div class="readout" style="margin-top:6px">`+
    `<div class="rd"><span>eccentricity e = ΣM/ΣP</span><b>${isFinite(e)?nfx(e,4)+" ft":"∞"}</b></div>`+
    `<div class="rd"><span>kern limit d/6</span><b>${nfx(d/6,4)} ft</b></div>`+
    `<div class="rd"><span>peak stress</span><b>${(f===Infinity)?"∞":nfx(f/0.144,0)+" psi"} &nbsp; ${CALC.regimeOf(e,d)}</b></div>`+
    `<div class="rd"><span>RF at this node</span><b>${(rf>=500)?"&gt;500":nfx(rf,3)}</b></div>`+
    `</div>`;
  return h;
}
return {pane,series,onArch,readout,governingAt,envelope,rfAtNode,COMPS};
})();

/* ==================================================================
   KERN / PRESSURE WEDGE — section drawn edge-on  (§7.2.7.10B)
   ================================================================== */
const KERNFIG=(()=>{
"use strict";
const NS="http://www.w3.org/2000/svg";
const el=(t,at,par)=>{const e=document.createElementNS(NS,t);
  for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;};
const tx=(par,x,y,s,o)=>{o=o||{};
  const t=el("text",{x,y,"font-size":o.size||12,fill:o.fill||"#4a4a4a",
    "text-anchor":o.anchor||"middle","font-family":o.mono?"Courier New,monospace":"Times New Roman,serif",
    "font-weight":o.bold?"700":"400"},par);
  t.textContent=s;return t;};
const F=(v,n)=>Number(v).toFixed(n==null?2:n);

/* P (kip/ft, compression +), M (kip·ft/ft, sagging +), d (ft), fa (psi) */
function draw(svg,P,M,d,fa,label){
  svg.innerHTML="";
  const W=980,H=430;
  el("rect",{x:1,y:1,width:W-2,height:H-2,fill:"#fff",stroke:"#d8d2c4"},svg);
  const pr=ARCH.stressPair(P,M,d);
  const e=pr.e, ae=Math.abs(e), kern=d/6, half=d/2;
  const faKsf=fa*0.144;

  /* ---- geometry of the drawing ---- */
  const secX=118, secW=104;                 // the 1 ft strip, seen edge-on
  const top=64, bot=H-96, hgt=bot-top;      // full ring depth d maps to hgt
  const Y=z=>top+(0.5-z/d)*hgt;             // z measured from the centroid, +ve toward the extrados
  const secTop=Y(d/2), secBot=Y(-d/2);

  /* ---- the section ---- */
  el("rect",{x:secX,y:secTop,width:secW,height:secBot-secTop,
    fill:"#cdc8bd",stroke:"#1a1a1a","stroke-width":1.6},svg);
  tx(svg,secX+secW/2,secTop-26,"EXTRADOS",{size:11,fill:"#6b5b45",bold:1});
  tx(svg,secX+secW/2,secBot+34,"INTRADOS",{size:11,fill:"#6b5b45",bold:1});
  tx(svg,secX+secW/2,secTop-10,"↑ outward",{size:10,fill:"#8a857b"});
  // depth dimension
  el("line",{x1:secX-26,y1:secTop,x2:secX-26,y2:secBot,stroke:"#1f4e79"},svg);
  [secTop,secBot].forEach(y=>el("line",{x1:secX-31,y1:y,x2:secX-21,y2:y,stroke:"#1f4e79"},svg));
  tx(svg,secX-34,(secTop+secBot)/2,"d = "+F(inOf(d),2)+" in",{anchor:"end",fill:"#1f4e79",size:12});
  tx(svg,secX+secW/2,secBot+52,"1.00 ft strip",{size:11,fill:"#8a857b"});

  /* ---- kern band ---- */
  el("rect",{x:secX,y:Y(kern),width:secW,height:Y(-kern)-Y(kern),
    fill:"rgba(31,107,50,.20)",stroke:"none"},svg);
  [kern,-kern].forEach(z=>el("line",{x1:secX-8,y1:Y(z),x2:secX+secW+8,y2:Y(z),
    stroke:"#1f6b32","stroke-width":1.2,"stroke-dasharray":"5 3"},svg));
  tx(svg,secX+secW+14,Y(kern)+4,"+d/6 = "+F(kern,3),{anchor:"start",size:11,fill:"#1f6b32"});
  tx(svg,secX+secW+14,Y(-kern)+4,"−d/6",{anchor:"start",size:11,fill:"#1f6b32"});
  tx(svg,secX+secW/2,Y(0)+4,"kern (middle third)",{size:11,fill:"#1f6b32"});
  el("line",{x1:secX,y1:Y(0),x2:secX+secW,y2:Y(0),stroke:"#4a4a4a","stroke-dasharray":"2 3"},svg);

  /* ---- resultant ---- */
  const inSec=Math.abs(e)<=d/2*1.02;
  const ye=inSec?Y(Math.max(-d/2,Math.min(d/2,e))):Y(e>0?d/2:-d/2);
  el("line",{x1:secX-72,y1:ye,x2:secX,y2:ye,stroke:"#9c1c1c","stroke-width":2.4},svg);
  el("path",{d:`M ${secX-12} ${ye-5} L ${secX-2} ${ye} L ${secX-12} ${ye+5}`,
    fill:"none",stroke:"#9c1c1c","stroke-width":2.4},svg);
  el("circle",{cx:secX+secW/2,cy:ye,r:5,fill:"#9c1c1c"},svg);
  tx(svg,secX-76,ye-6,"ΣP = "+F(P,2)+" k/ft",{anchor:"end",fill:"#9c1c1c",size:12,bold:1});
  tx(svg,secX-76,ye+12,"e = "+F(e,4)+" ft",{anchor:"end",fill:"#9c1c1c",size:12});

  /* ---- stress block ---- */
  const bx=secX+secW+118, bw=300;
  const fmax=Math.max(pr.ext,pr.int,faKsf*1.05);
  const S=v=>(fmax>0?bw*v/fmax:0);
  el("line",{x1:bx,y1:secTop,x2:bx,y2:secBot,stroke:"#1a1a1a","stroke-width":1.4},svg);
  if(pr.regime==="OUT"){
    el("rect",{x:bx,y:secTop,width:bw,height:secBot-secTop,fill:"rgba(156,28,28,.10)"},svg);
    tx(svg,bx+bw/2,(secTop+secBot)/2,"no equilibrium stress block",{fill:"#9c1c1c",size:14,bold:1});
    tx(svg,bx+bw/2,(secTop+secBot)/2+20,"the resultant lies outside the section",{fill:"#9c1c1c",size:12});
  }else if(pr.regime==="KERN"){
    el("polygon",{points:`${bx},${secTop} ${bx+S(pr.ext)},${secTop} ${bx+S(pr.int)},${secBot} ${bx},${secBot}`,
      fill:"rgba(31,78,121,.30)",stroke:"#1f4e79","stroke-width":1.6},svg);
    tx(svg,bx+bw/2,secTop-26,"whole section in compression",{fill:"#1f4e79",size:12,bold:1});
  }else{
    // pressure wedge: triangular block of depth a from the face the resultant favors
    const a=3*(d/2-ae);
    const towardExt=(e>0);
    const zFace=towardExt?d/2:-d/2, zEnd=towardExt?(d/2-a):(-d/2+a);
    const yF=Y(zFace), yE=Y(zEnd);
    const fpk=Math.max(pr.ext,pr.int);
    el("polygon",{points:`${bx},${yF} ${bx+S(fpk)},${yF} ${bx},${yE}`,
      fill:"rgba(31,78,121,.30)",stroke:"#1f4e79","stroke-width":1.6},svg);
    // ignored tension zone
    const yI1=Math.min(yE,Y(towardExt?-d/2:d/2)), yI2=Math.max(yE,Y(towardExt?-d/2:d/2));
    el("rect",{x:bx-secW-118+secX-secX,y:0,width:0,height:0},svg);
    el("rect",{x:secX,y:yI1,width:secW,height:yI2-yI1,
      fill:"url(#hatchIgn)",stroke:"#9c1c1c","stroke-dasharray":"4 3"},svg);
    const defs=el("defs",{},svg);
    const pat=el("pattern",{id:"hatchIgn",width:7,height:7,patternUnits:"userSpaceOnUse",
      patternTransform:"rotate(45)"},defs);
    el("line",{x1:0,y1:0,x2:0,y2:7,stroke:"#9c1c1c","stroke-width":1.4,opacity:.55},pat);
    el("line",{x1:bx-10,y1:yE,x2:bx+S(fpk)+10,y2:yE,stroke:"#9c1c1c","stroke-dasharray":"4 3"},svg);
    tx(svg,bx+S(fpk)+16,yE+4,"end of block",{anchor:"start",size:11,fill:"#9c1c1c"});
    // bearing depth dimension
    el("line",{x1:bx-34,y1:yF,x2:bx-34,y2:yE,stroke:"#9c1c1c","stroke-width":1.6},svg);
    tx(svg,bx-38,(yF+yE)/2,"t_w = 3(d/2 − e) = "+F(inOf(a),2)+" in",{anchor:"end",size:11,fill:"#9c1c1c"});
    tx(svg,secX+secW/2,(yI1+yI2)/2,"ignored",{size:11,fill:"#9c1c1c",bold:1});
    tx(svg,secX+secW/2,(yI1+yI2)/2+15,"(tension)",{size:10,fill:"#9c1c1c"});
    tx(svg,bx+bw/2,secTop-26,"pressure wedge — tension zone redistributed",{fill:"#1f4e79",size:12,bold:1});
  }
  // allowable stress reference
  if(fmax>0&&faKsf<=fmax){
    el("line",{x1:bx+S(faKsf),y1:secTop-12,x2:bx+S(faKsf),y2:secBot+12,
      stroke:"#1f6b32","stroke-width":1.4,"stroke-dasharray":"6 4"},svg);
    tx(svg,bx+S(faKsf),secBot+28,"f_a = "+F(fa,0)+" psi",{size:11,fill:"#1f6b32"});
  }
  // face stresses
  const lab=(y,v,nm)=>{
    tx(svg,bx+S(v)+10,y+4,F(v/0.144,1)+" psi",{anchor:"start",size:12,fill:"#1f4e79",bold:1});
    tx(svg,bx-8,y+4,nm,{anchor:"end",size:11,fill:"#8a857b"});
  };
  if(pr.regime!=="OUT"){lab(secTop,pr.ext,"extrados");lab(secBot,pr.int,"intrados");}

  /* ---- eccentricity gauge ---- */
  const gx=60, gy=H-42, gw=W-120;
  el("line",{x1:gx,y1:gy,x2:gx+gw,y2:gy,stroke:"#8a857b","stroke-width":1.2},svg);
  const G=v=>gx+gw*Math.min(v/(d/2*1.35),1);
  [[0,"0"],[kern,"d/6"],[half,"d/2"]].forEach(([v,nm])=>{
    el("line",{x1:G(v),y1:gy-7,x2:G(v),y2:gy+7,stroke:"#8a857b"},svg);
    tx(svg,G(v),gy+21,nm+" = "+F(v,3),{size:10,fill:"#8a857b"});
  });
  el("rect",{x:G(0),y:gy-5,width:G(kern)-G(0),height:10,fill:"rgba(31,107,50,.30)"},svg);
  el("rect",{x:G(kern),y:gy-5,width:G(half)-G(kern),height:10,fill:"rgba(196,102,79,.30)"},svg);
  el("polygon",{points:`${G(ae)},${gy-12} ${G(ae)-6},${gy-24} ${G(ae)+6},${gy-24}`,fill:"#9c1c1c"},svg);
  tx(svg,G(ae),gy-28,"|e| = "+F(ae,4),{size:11,fill:"#9c1c1c",bold:1});
  tx(svg,gx,gy-28,"kern",{anchor:"start",size:10,fill:"#1f6b32"});
  tx(svg,G(half)+10,gy-28,"no block beyond d/2",{anchor:"start",size:10,fill:"#8a857b"});

  /* ---- caption strip ---- */
  el("rect",{x:W-292,y:12,width:284,height:44,fill:"#f7f5ef",stroke:"#d8d2c4"},svg);
  tx(svg,W-284,30,(label||"")+"   ΣM = "+F(M,3)+" k·ft/ft",{anchor:"start",size:12,mono:1,fill:"#1a1a1a"});
  const util=(pr.regime==="OUT")?Infinity:Math.max(pr.ext,pr.int)/faKsf;
  tx(svg,W-284,48,pr.regime+"   f/f_a = "+(isFinite(util)?F(util,3):"∞"),
    {anchor:"start",size:12,mono:1,fill:util>1?"#9c1c1c":"#1f6b32"});
  return svg;
}
return {draw};
})();

/* Plotly form of the same figure. Left panel is the section seen edge-on, right
   panel is the stress block against a stress axis in psi, both sharing one depth
   axis so a level in the section lines up with the stress at that level. A gauge
   strip underneath carries the eccentricity against its two limits. */
KERNFIG.plotly=function(P,M,d,fa,label){
  const pr=ARCH.stressPair(P,M,d);
  const e=pr.e, ae=Math.abs(e), kern=d/6, half=d/2, faKsf=fa*0.144;
  const psi=v=>v/0.144;
  const fpk=(pr.regime==="OUT")?0:Math.max(pr.ext,pr.int);
  const xmax=Math.max(psi(fpk),fa)*1.18||1;
  const tr=[];
  const SECX=[0.12,0.88];

  // --- section body ---
  tr.push({x:[SECX[0],SECX[1],SECX[1],SECX[0],SECX[0]],
    y:[half,half,-half,-half,half],
    name:"section",type:"scatter",mode:"lines",fill:"toself",
    fillcolor:"rgba(205,200,189,.85)",line:{color:"#1a1a1a",width:2},
    xaxis:"x",yaxis:"y",hoverinfo:"skip",showlegend:false});
  // --- kern band ---
  tr.push({x:[SECX[0],SECX[1],SECX[1],SECX[0],SECX[0]],
    y:[kern,kern,-kern,-kern,kern],
    name:"kern, middle third",type:"scatter",mode:"lines",fill:"toself",
    fillcolor:"rgba(31,107,50,.28)",line:{color:"#1f6b32",width:1.4,dash:"dash"},
    xaxis:"x",yaxis:"y",
    hovertemplate:"kern limit \u00b1d/6 = \u00b1"+kern.toFixed(4)+" ft<extra></extra>"});
  // --- ignored tension zone + stress block ---
  if(pr.regime==="WEDGE"){
    const a=3*(half-ae), towardExt=(e>0);
    const zF=towardExt?half:-half, zE=towardExt?(half-a):(-half+a);
    const zI1=Math.min(zE,towardExt?-half:half), zI2=Math.max(zE,towardExt?-half:half);
    tr.push({x:[SECX[0],SECX[1],SECX[1],SECX[0],SECX[0]],
      y:[zI2,zI2,zI1,zI1,zI2],
      name:"ignored — tension",type:"scatter",mode:"lines",fill:"toself",
      fillcolor:"rgba(156,28,28,.16)",
      fillpattern:{shape:"/",size:7,solidity:.22,fgcolor:"#9c1c1c"},
      line:{color:"#9c1c1c",width:1,dash:"dot"},xaxis:"x",yaxis:"y",
      hovertemplate:"ignored, assumed to carry no tension<br>depth "+
        Math.abs(zI2-zI1).toFixed(4)+" ft<extra></extra>"});
    tr.push({x:[0,psi(fpk),0,0],y:[zF,zF,zE,zF],
      name:"pressure wedge",type:"scatter",mode:"lines",fill:"toself",
      fillcolor:"rgba(31,78,121,.32)",line:{color:"#1f4e79",width:2},
      xaxis:"x2",yaxis:"y",
      hovertemplate:"%{x:.1f} psi at z = %{y:.4f} ft<extra></extra>"});
  }else if(pr.regime==="KERN"){
    tr.push({x:[0,psi(pr.ext),psi(pr.int),0,0],y:[half,half,-half,-half,half],
      name:"stress block",type:"scatter",mode:"lines",fill:"toself",
      fillcolor:"rgba(31,78,121,.32)",line:{color:"#1f4e79",width:2},
      xaxis:"x2",yaxis:"y",
      hovertemplate:"%{x:.1f} psi at z = %{y:.4f} ft<extra></extra>"});
  }
  // --- resultant ---
  tr.push({x:[(SECX[0]+SECX[1])/2],y:[Math.max(-half,Math.min(half,e))],
    name:"combined thrust",type:"scatter",mode:"markers",
    marker:{color:"#9c1c1c",size:14,symbol:"circle"},xaxis:"x",yaxis:"y",
    hovertemplate:"\u03a3P = "+P.toFixed(3)+" k/ft<br>\u03a3M = "+M.toFixed(3)+
      " k\u00b7ft/ft<br>e = "+e.toFixed(4)+" ft<extra></extra>"});
  // --- eccentricity gauge ---
  const gmax=half*1.35;
  tr.push({x:[0,kern],y:[0,0],name:"eccentricity gauge",type:"scatter",mode:"lines",
    line:{color:"#1f6b32",width:14},xaxis:"x3",yaxis:"y3",
    hovertemplate:"kern: |e| \u2264 "+inOf(kern).toFixed(3)+" in<extra></extra>"});
  tr.push({x:[kern,half],y:[0,0],name:"outside the kern",type:"scatter",mode:"lines",
    line:{color:"#c4664f",width:14},xaxis:"x3",yaxis:"y3",showlegend:false,
    hovertemplate:"wedge: "+kern.toFixed(4)+" < |e| < "+half.toFixed(4)+" ft<extra></extra>"});
  tr.push({x:[Math.min(ae,gmax)],y:[0],name:"|e| now",type:"scatter",mode:"markers",
    marker:{color:"#9c1c1c",size:16,symbol:"triangle-down"},xaxis:"x3",yaxis:"y3",
    hovertemplate:"|e| = "+ae.toFixed(4)+" ft<extra></extra>"});

  const shapes=[
    {type:"line",xref:"x2",yref:"y",x0:psi(faKsf),x1:psi(faKsf),y0:-half*1.12,y1:half*1.12,
     line:{color:"#1f6b32",width:1.6,dash:"dash"}},
    {type:"line",xref:"paper",yref:"y",x0:0,x1:1,y0:0,y1:0,
     line:{color:"#8a857b",width:1,dash:"dot"}}
  ];
  const ann=[
    {x:0.5,y:half,xref:"x",yref:"y",text:"<b>EXTRADOS</b>",showarrow:false,yshift:16,
     font:{size:11,color:"#6b5b45"}},
    {x:0.5,y:-half,xref:"x",yref:"y",text:"<b>INTRADOS</b>",showarrow:false,yshift:-16,
     font:{size:11,color:"#6b5b45"}},
    {x:psi(faKsf),y:half*1.12,xref:"x2",yref:"y",text:"f<sub>a</sub> = "+fa.toFixed(0)+" psi",
     showarrow:false,yshift:12,font:{size:11,color:"#1f6b32"}},
    {x:0.02,y:1.13,xref:"paper",yref:"paper",xanchor:"left",showarrow:false,
     text:"<b>"+(label||"")+"</b>  ·  d = "+d.toFixed(3)+" ft  ·  \u03a3P = "+P.toFixed(2)+
       " k/ft  ·  \u03a3M = "+M.toFixed(3)+" k\u00b7ft/ft  ·  e = "+e.toFixed(4)+
       " ft  ·  <b>"+pr.regime+"</b>",
     font:{size:12,color:"#1a1a1a"}}
  ];
  if(pr.regime!=="OUT"){
    ann.push({x:psi(pr.ext),y:half,xref:"x2",yref:"y",text:psi(pr.ext).toFixed(1)+" psi",
      showarrow:false,xshift:44,font:{size:12,color:"#1f4e79"}});
    ann.push({x:psi(pr.int),y:-half,xref:"x2",yref:"y",text:psi(pr.int).toFixed(1)+" psi",
      showarrow:false,xshift:44,font:{size:12,color:"#1f4e79"}});
  }else{
    ann.push({x:0.5,y:0,xref:"x2",yref:"y",xanchor:"center",
      text:"<b>no equilibrium stress block</b><br>the resultant lies outside the section",
      showarrow:false,font:{size:13,color:"#9c1c1c"}});
  }
  if(pr.regime==="WEDGE"){
    const a=3*(half-ae);
    ann.push({x:0.02,y:(e>0?half-a/2:-half+a/2),xref:"x2",yref:"y",xanchor:"left",
      text:"a = 3(d/2 \u2212 e) = "+a.toFixed(3)+" ft",showarrow:false,
      font:{size:11,color:"#9c1c1c"}});
  }
  const layout={height:470,showlegend:true,
    legend:{orientation:"h",y:-0.14,x:0},
    shapes:shapes,annotations:ann,
    xaxis:{domain:[0,0.26],range:[0,1],showticklabels:false,showgrid:false,zeroline:false,
           title:{text:"section, 1 ft strip",font:{size:11}}},
    xaxis2:{domain:[0.36,1],range:[0,xmax],anchor:"y",gridcolor:"#eee9dd",
            title:{text:"compressive stress (psi)",font:{color:"#1f4e79"}},
            tickfont:{color:"#1f4e79"}},
    yaxis:{domain:[0.26,1],range:[-half*1.3,half*1.3],gridcolor:"#eee9dd",
           title:{text:"distance from the centroid, z (ft)"},zeroline:false},
    xaxis3:{domain:[0,1],range:[0,gmax],anchor:"y3",gridcolor:"#eee9dd",
            title:{text:"eccentricity |e| against the kern limit d/6 and the section limit d/2 (ft)",
                   font:{size:11}},
            tickvals:[0,kern,half],ticktext:["0","d/6 = "+kern.toFixed(3),"d/2 = "+half.toFixed(3)]},
    yaxis3:{domain:[0,0.10],range:[-1,1],showticklabels:false,showgrid:false,zeroline:false,
            fixedrange:true}};
  return {traces:tr,layout:layout};
};

</script>
<script>
/* ==================================================================
   VEHICLES — configuration schematics and comparison table
   ================================================================== */
const VEHTAB=(()=>{
"use strict";
const {msg,dtab,nfx,esc}=R;
const NS="http://www.w3.org/2000/svg";
const el=(t,at,par)=>{const e=document.createElementNS(NS,t);
  for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;};
const txt=(par,x,y,s,o)=>{o=o||{};
  const t=el("text",{x,y,"font-size":o.size||11,fill:o.fill||"#4a4a4a",
    "text-anchor":o.anchor||"middle","font-family":o.mono?"Courier New,monospace":"Times New Roman,serif",
    "font-weight":o.bold?"700":"400"},par);
  t.textContent=s;return t;};

/* one vehicle drawn to scale */
function draw(svg,veh){
  svg.innerHTML="";
  const W=1000,H=170,mL=54,mR=54;
  const L=veh.axles[veh.axles.length-1].x||1;
  const s=(W-mL-mR)/Math.max(L,1);
  const X=x=>mL+x*s, base=104;
  el("rect",{x:1,y:1,width:W-2,height:H-2,fill:"#fff",stroke:"#d8d2c4"},svg);
  // ground
  el("line",{x1:8,y1:base,x2:W-8,y2:base,stroke:"#1a1a1a","stroke-width":1.4},svg);
  for(let x=8;x<W-8;x+=13)
    el("line",{x1:x,y1:base,x2:x-6,y2:base+7,stroke:"#9a948a","stroke-width":.8},svg);
  // body
  const bodyTop=base-52;
  el("rect",{x:X(0)-14,y:bodyTop,width:X(L)-X(0)+28,height:26,fill:"#1a1a1a",rx:3},svg);
  txt(svg,(X(0)+X(L))/2,bodyTop+18,veh.name,{fill:"#fff",size:13,bold:1});
  const maxP=Math.max(...veh.axles.map(a=>a.P));
  veh.axles.forEach((a,k)=>{
    const x=X(a.x);
    el("line",{x1:x,y1:bodyTop+26,x2:x,y2:base-11,stroke:"#1a1a1a","stroke-width":1.2},svg);
    const r=6+4*(a.P/maxP);
    el("circle",{cx:x,cy:base-r,r,fill:"#2b2b2b",stroke:"#fff","stroke-width":1.3},svg);
    txt(svg,x,bodyTop-5,nfx(a.P,a.P%1?1:0),{size:11,fill:"#9c1c1c",bold:1});
    txt(svg,x,base+22,"A"+(k+1),{size:9,fill:"#8a857b",mono:1});
  });
  txt(svg,(X(0)+X(L))/2,bodyTop-19,"axle loads, kip",{size:10,fill:"#9c1c1c"});
  // spacing dimensions
  const dy=base+40;
  for(let k=0;k<veh.axles.length-1;k++){
    const x1=X(veh.axles[k].x), x2=X(veh.axles[k+1].x);
    if(x2-x1<16)continue;
    el("line",{x1,y1:dy,x2,y2:dy,stroke:"#1f4e79","stroke-width":.9},svg);
    [x1,x2].forEach(x=>el("line",{x1:x,y1:dy-4,x2:x,y2:dy+4,stroke:"#1f4e79","stroke-width":.9},svg));
    txt(svg,(x1+x2)/2,dy-6,nfx(veh.axles[k+1].x-veh.axles[k].x,2),{size:10,fill:"#1f4e79"});
  }
  txt(svg,W/2,dy+18,"axle spacing, ft   ·   overall "+nfx(L,2)+" ft",{size:11,fill:"#1f4e79"});
  // trailing load
  if(veh.trail>0){
    const x0=X(L)+6;
    el("rect",{x:x0,y:bodyTop+8,width:W-8-x0,height:16,fill:"rgba(26,26,26,.28)",
      stroke:"#1a1a1a","stroke-dasharray":"4 3"},svg);
    txt(svg,(x0+W-8)/2,bodyTop+20,nfx(veh.trail,1)+" k/ft",{size:10,fill:"#1a1a1a"});
  }
  return svg;
}

function pane(p,M,list,results){
  const c=UI.counter();
  let h="";
  if(!list.length)return msg("inf","No vehicles selected","Select rating vehicles in the input panel.");

  /* ---- comparison table ---- */
  const rows=list.map((v,k)=>{
    const r=results.find(q=>q.id===v.id);
    const tot=v.axles.reduce((s,a)=>s+a.P,0);
    return {__i:k,id:v.id,name:v.name,
      nax:v.axles.length,len:v.axles[v.axles.length-1].x,
      tot:tot, ref:v.tons, trail:v.trail||0,
      rf:r?r.rf:NaN, tons:r?r.tons:NaN,
      eno:v.eRef&&r?r.rf*v.eRef:NaN,
      /* pos is the raw sweep variable, which under right-to-left travel locates
         the LAST axle in the list — this column was reporting it as the lead
         axle and so disagreed with every other readout by the length of the
         consist (-85.75 against 18.25 for the E-80). leadAxleX converts it. */
      sec:r?CALC.secTag(M,r.sec):"—",
      pos:r?ARCH.leadAxleX(v,r.pos,r.dir):NaN,
      dirTxt:r?(r.dir<0?"right → left":"left → right"):"—"};
  });
  const gov=rows.reduce((a,b)=>(isFinite(b.rf)&&(!isFinite(a.rf)||b.rf<a.rf))?b:a,rows[0]);
  h+=UI.pnl("vh_tab",c(),"Rating vehicles — comparison",
    dtab([{k:"name",h:"Vehicle",txt:1},{k:"nax",h:"Axles",dp:0},
      {k:"len",h:"Length (ft)",dp:2},{k:"tot",h:"Σ axle load (kip)",dp:1},
      {k:"ref",h:"Rating weight (tons)",dp:1},{k:"trail",h:"Trailing (k/ft)",dp:1},
      {k:"rf",h:"RF",dp:3},{k:"tons",h:"Rating (tons)",dp:1},{k:"eno",h:"E-rating",dp:0},
      {k:"sec",h:"Governs at",txt:1},{k:"pos",h:"Lead axle (ft)",dp:2},
      {k:"dirTxt",h:"Direction",txt:1}],
      rows,{govIdx:rows.indexOf(gov)})+
    `<div class="note"><b>Σ axle load</b> is the whole consist as it stands on the structure.
     <b>Rating weight</b> is what the rating factor is multiplied by to give tons — for a highway truck the two
     are the same, but for a railroad consist the axle train represents several identical units and the rating
     is expressed per vehicle, and for the Cooper series it is the 80 kip reference rather than a physical
     weight. The governing vehicle is shaded.</div>`+
    (()=>{
      const susp=list.filter(x=>x.mode==="rail"&&x.trail>0&&Math.abs(x.trail-2.0)<1e-9);
      return susp.length
        ? msg("wrn","Unverified trailing loads",
            susp.map(x=>esc(x.name)).join(", ")+(susp.length>1?" carry":" carries")+
            " a uniform trailing load of 2.0 k/ft. That figure is not traceable to an AREMA source and should "+
            "be treated as a placeholder: confirm it against the track owner's criteria, or set it to zero and "+
            "rate the consist alone, before issuing. The Cooper E-80 trailing load of 8.0 k/ft is the standard "+
            "value and is not in question.")
        : "";
    })()+
    msg("key","Check these against your own copy of the figures",
      "Axle loads and spacings were built from the standard definitions — MassDOT Bridge Manual Figures "+
      "7.5.2-1 onward for the highway vehicles, and the railroad consists from the reference application. "+
      "Provenance, vehicle by vehicle: <b>Cooper E-80</b> — 8-5-5-5-9-5-6-5-8 repeated, 1136 kip over 104 ft "+
      "with an 8.0 k/ft trailing load, which matches the standard diagram and has been checked. "+
      "<b>HSP-46</b> — 8 axles of 74 kip over 125.33 ft, two four-axle units of 296 kip each, internally "+
      "consistent but not checked against a controlled source. <b>All others</b> — built from standard "+
      "definitions and unchecked. "+
      "Verify the configuration below against your own source before issuing a rating; an error here moves "+
      "every result and would not be caught by any other check in this program."),"§7.2.4.1B");

  /* ---- one schematic per vehicle ---- */
  list.forEach((v,k)=>{
    const r=results.find(q=>q.id===v.id);
    const tot=v.axles.reduce((s,a)=>s+a.P,0);
    h+=UI.pnl("vh_"+v.id,c(),v.name+(r?`  —  RF ${nfx(r.rf,3)}`:""),
      `<figure><svg id="figVeh_${v.id}" viewBox="0 0 1000 170"></svg>
        <figcaption>${esc(v.name)} — ${v.axles.length} axles, ${nfx(v.axles[v.axles.length-1].x,2)} ft
        overall, ${nfx(tot,1)} kip total${v.trail>0?`, with a ${nfx(v.trail,1)} k/ft uniform trailing load
        behind the consist`:""}.${v.eRef?` Cooper reference ${nfx(v.eRef,0)} kip.`:""}</figcaption></figure>`+
      dtab([{k:"ax",h:"Axle",txt:1},{k:"x",h:"Distance from lead axle (ft)",dp:3},
        {k:"sp",h:"Spacing from previous (ft)",dp:3},{k:"P",h:"Axle load (kip)",dp:2},
        {k:"cum",h:"Cumulative load (kip)",dp:1}],
        v.axles.map((a,i)=>({__i:i,ax:"A"+(i+1),x:a.x,
          sp:i?a.x-v.axles[i-1].x:NaN,P:a.P,
          cum:v.axles.slice(0,i+1).reduce((s,q)=>s+q.P,0)})))+
      `<div class="note">Axle by axle, matching the schematic above. <b>Distance from lead axle</b> is
       cumulative, so the final row is the overall length; <b>spacing from previous</b> is the gap drawn between
       adjacent axles. <b>Cumulative load</b> runs to the total axle load of the consist${
         v.eRef?", which for the Cooper series is not the weight the rating is expressed against — that is the "
           +nfx(v.eRef,0)+" kip reference":(v.mode==="rail"
           ?", which may represent several identical units coupled together":"")}. Check these figures against
       your own copy of the source before issuing a rating.</div>`+
      (v.trailNote?`<div class="note">${esc(v.trailNote)}</div>`:""),
      v.mode==="rail"?"AREMA / owner":"§7.2.4.1B");
  });
  return h;
}
return {pane,draw};
})();

</script>
<script>
/* ==================================================================
   AXLE CONTRIBUTION MATRIX — nodes x axles, live load tab
   ================================================================== */
const AXLETAB=(()=>{
"use strict";
const {msg,nfx,esc}=R;
const F=(v,n)=>(v===0||v==null||!isFinite(v))?"":nfx(v,n==null?4:n);

function build(p,M,veh,pos,dir,sec){
  const br=ARCH.nodalLLByAxle(M,veh,pos,dir);
  const local=(p.impMode==="local");
  const impCrown=local?0:ARCH.impactAt(p,M.g.coverCrown+p.tws);
  const nA=br.nAxles, maxOff=veh.axles[veh.axles.length-1].x;
  const rows=[];
  let sM=0,sP=0,sV=0,sQ=0;
  /* ADVERSE-ONLY. When the option is on the solver drops nodes whose moment
     influence at this section opposes, so this table has to drop them too or it
     shows a decomposition of a calculation that was never performed — the defect
     this tab's own closure check exists to catch. Which half is adverse is
     decided the way the solver decides it: evaluate both and keep the one that
     stresses the section more, here at the unfactored vehicle. */
  const adverse=!!p.llAdverse;
  let keepSign=0;
  if(adverse){
    let mp=0,mn=0,pp=0,pn=0;
    for(let i=0;i<M.nN;i++){
      const I=local?ARCH.impactAt(p,M.coverAt(i)):impCrown;
      const qA=br.q[i]*(1+I), e=M.ILM[sec][i];
      if(e>0){mp+=qA*e;pp+=qA*M.ILC[sec][i];}
      else if(e<0){mn+=qA*e;pn+=qA*M.ILC[sec][i];}
    }
    const D0=M.DL[sec], d0=M.dn[sec];
    const fp=ARCH.stressMax(D0.C+pp,D0.M+mp,d0);
    const fn=ARCH.stressMax(D0.C+pn,D0.M+mn,d0);
    keepSign=(fn>fp)?-1:1;
  }
  for(let i=0;i<M.nN;i++){
    const I=local?ARCH.impactAt(p,M.coverAt(i)):impCrown;
    const eM=M.ILM[sec][i], eP=M.ILC[sec][i], eV=M.ILV[sec][i];
    const dropped=adverse&&!((keepSign>0&&eM>0)||(keepSign<0&&eM<0));
    const qA=dropped?0:br.q[i]*(1+I);
    const cM=qA*eM, cP=qA*eP, cV=qA*eV;
    sM+=cM; sP+=cP; sV+=cV; sQ+=qA;
    rows.push({i,tag:CALC.secTag(M,i),x:M.g.nodes[i].x,H:M.coverAt(i),trib:M.tribH[i],
      axQ:br.axQ.map(a=>dropped?0:a[i]),axP:br.axP.map(a=>dropped?0:a[i]),
      trQ:dropped?0:br.trQ[i],trP:dropped?0:br.trP[i],
      q0:dropped?0:br.q[i],I,f:1+I,q:qA,eM,eP,eV,cM,cP,cV,dropped});
  }
  const absM=rows.reduce((a,r)=>a+Math.abs(r.cM),0)||1;
  rows.forEach(r=>{r.share=100*Math.abs(r.cM)/absM;});
  return {rows,sM,sP,sV,sQ,nA,hasTrail:br.hasTrail,maxOff,local,impCrown,adverse,keepSign};
}

function render(p,M,veh,pos,dir,sec,opt){
  opt=opt||{};
  /* One quantity per cell. Stacking the nodal load over the pressure put two
     numbers in one column with nothing between them, and at these magnitudes
     they ran together — "0.0507" above "0.0846" reads as 0.05070.0846. The
     reader picks which quantity the axle columns carry instead. */
  const SHOW=(opt.show==="p")?"p":"q";
  const D=build(p,M,veh,pos,dir,sec);
  const nA=D.nA;
  const axX=veh.axles.map(a=>(dir>0)?pos+a.x:pos+D.maxOff-a.x);
  let h="";

  h+=msg("key","What this table is",
    `Every node of the model against every axle of <b>${esc(veh.name)}</b> standing at x = ${nfx(pos,2)} ft, travelling <b>${dir<0?"right to left":"left to right"}</b>. `+
    `Each axle cell gives the nodal load <b>q</b> that axle delivers to the one-foot strip, with the pressure `+
    `<b>p</b> it produces on the extrados underneath. Blank means that axle's footprint does not reach that `+
    `node. The influence ordinates and the three contribution columns are <b>for the section of interest, `+
    `${esc(CALC.secTag(M,sec))}</b> — a row's contribution is what that node's load does to that section, not `+
    `a force at the node itself. The sum row is the live load effect at ${esc(CALC.secTag(M,sec))}.`);
  if(!D.local)
    h+=msg("inf","Crown impact basis",
      `One factor of ${nfx(1+D.impCrown,3)} is applied at every node, from the minimum cover. On the local `+
      `basis each node would carry its own factor.`);

  /* header */
  h+=`<div class="scrollx"><table class="dt axm"><thead>
    <tr>
      <th rowspan="2">Node</th><th rowspan="2" class="num">x (ft)</th>
      <th rowspan="2" class="num">H (ft)</th><th rowspan="2" class="num">trib (ft)</th>
      <th colspan="${nA+(D.hasTrail?1:0)}" class="grp">${SHOW==="q"
        ? "Nodal load q delivered by each axle (k/ft on the one-foot strip)"
        : "Pressure p produced by each axle on the extrados (ksf)"}</th>
      <th rowspan="2" class="num">Σq before I</th><th rowspan="2" class="num">1 + I</th>
      <th rowspan="2" class="num">q applied</th>
      <th colspan="3" class="grp">influence ordinates at ${esc(CALC.secTag(M,sec))}</th>
      <th colspan="3" class="grp">contribution to ${esc(CALC.secTag(M,sec))}</th>
      <th rowspan="2" class="num">% of |M|</th>
    </tr><tr>`;
  for(let k=0;k<nA;k++)
    h+=`<th class="num ax">A${k+1}<span class="axs">${nfx(veh.axles[k].P,0)}k<br>x=${nfx(axX[k],1)}</span></th>`;
  if(D.hasTrail)h+=`<th class="num ax">trail<span class="axs">${nfx(veh.trail,1)} k/ft</span></th>`;
  h+=`<th class="num">η_M (ft)</th><th class="num">η_P</th><th class="num">η_V</th>
      <th class="num">q·η_M</th><th class="num">q·η_P</th><th class="num">q·η_V</th>
    </tr></thead><tbody>`;

  /* rows */
  D.rows.forEach(r=>{
    const zero=(r.q0===0);
    if(zero&&opt.hideZero)return;
    h+=`<tr class="${r.i===sec?"gov":""}${zero?" dim":""}${r.dropped?" drop":""}">
      <td>${esc(r.tag)}</td><td class="num">${nfx(r.x,2)}</td>
      <td class="num">${nfx(r.H,3)}</td><td class="num">${nfx(r.trib,3)}</td>`;
    for(let k=0;k<nA;k++){
      const val=(SHOW==="q")?r.axQ[k]:r.axP[k];
      h+=`<td class="num">${val?F(val,4):""}</td>`;
    }
    if(D.hasTrail)
      h+=`<td class="num">${(SHOW==="q"?r.trQ:r.trP)?F(SHOW==="q"?r.trQ:r.trP,4):""}</td>`;
    h+=`<td class="num">${F(r.q0,4)}</td><td class="num">${nfx(r.f,3)}</td>
        <td class="num"><b>${F(r.q,4)}</b></td>
        <td class="num">${nfx(r.eM,5)}</td><td class="num">${nfx(r.eP,5)}</td><td class="num">${nfx(r.eV,5)}</td>
        <td class="num">${F(r.cM,5)}</td><td class="num">${F(r.cP,5)}</td><td class="num">${F(r.cV,5)}</td>
        <td class="num">${r.share>0.05?nfx(r.share,1):""}</td></tr>`;
  });

  /* sum row */
  const span=4+nA+(D.hasTrail?1:0);
  h+=`<tr class="sumrow"><td colspan="${span}"><b>Σ over all nodes</b></td>
      <td class="num"></td><td class="num"></td><td class="num"><b>${nfx(D.sQ,4)}</b></td>
      <td class="num"></td><td class="num"></td><td class="num"></td>
      <td class="num"><b>${nfx(D.sM,5)}</b></td><td class="num"><b>${nfx(D.sP,5)}</b></td>
      <td class="num"><b>${nfx(D.sV,5)}</b></td><td class="num">100</td></tr>`;
  h+=`</tbody></table></div>`;
  if(D.adverse)
    h+=msg("wn","Adverse influence only — opposing nodes unloaded",
      `Live load placement is set to adverse influence only, so the live load is applied at this section `+
      `solely where the moment influence ordinate is <b>${D.keepSign>0?"positive":"negative"}</b>. The `+
      `${D.rows.filter(r=>r.dropped&&M.ILM[sec][r.i]!==0).length} nodes of opposing influence are shown `+
      `struck through and carry no load. Both signs were evaluated at this section and this one stresses it `+
      `more. Rigorous for the uniform trailing load, which ends where the train ends; an upper-bound `+
      `envelope for the axle set, which cannot be truncated between axles.`,"§7.2.7.8B");

  /* the sum must reproduce the solver */
  const q=D.rows.map(r=>r.q);
  /* q already carries the adverse filter, so the plain superposition of it is
     the right comparison in both modes. */
  const LL=ARCH.llEffects(M,q);
  const fI=D.local?1:(1+D.impCrown);
  const dM=Math.abs(D.sM-LL[sec].M), dP=Math.abs(D.sP-LL[sec].C);
  h+=msg(dM<1e-9&&dP<1e-9?"key":"wrn","Check — the column totals against the solver",
    `Summing the contribution column gives M<sub>LL</sub> = <b>${nfx(D.sM,6)}</b> k·ft/ft and `+
    `P<sub>LL</sub> = <b>${nfx(D.sP,6)}</b> k/ft at ${esc(CALC.secTag(M,sec))}. The solver's own superposition `+
    `gives ${nfx(LL[sec].M,6)} and ${nfx(LL[sec].C,6)}. `+
    (dM<1e-9&&dP<1e-9
      ? "They agree to machine precision, so the table is a decomposition of the calculation actually used and "+
        "not a parallel one that could drift from it."
      : `<b>They differ by ${dM.toExponential(2)} and ${dP.toExponential(2)}.</b> Do not rely on this run.`));
  return h;
}
return {render,build};
})();

</script>
<script>
/* ==================================================================
   CALCULATION CONTENT LAYER
   Every derived quantity rendered symbolic = substituted = result
   (the build guideline, §0.1). Solver output is marked IMPORTED (§12.4 role)
   with an explicit recalculation boundary.
   ================================================================== */
const CALC=(()=>{
"use strict";
const {step,eqLine,vars,dtab,msg,badge,num,nfx,esc}=R;

/* ---------- helpers ---------- */
const KSF_PSI=0.144;               // 1 psi = 0.144 ksf
function secTag(M,i){
  const n=M.nN-1;
  const named={0:"SL-L",[Math.round(n*0.25)]:"QP-L",[Math.round(n*0.5)]:"CR",
               [Math.round(n*0.75)]:"QP-R",[n]:"SL-R"};
  if(named[i])return named[i];
  // §7.2.7.7B: points where significant changes in section properties occur
  if(M.dChange&&M.dChange.indexOf(i)>=0)return "SC"+i;
  return "N"+i;
}
function regimeOf(e,d){return (e<=d/6)?"KERN":(e<d/2)?"WEDGE":"OUT";}

/* ============================================================
   1. VALIDATION / SELF-LIMITING  (§8)
   ============================================================ */
function validate(p,M,results){
  results=results||[];
  /* A blank track field is not the same as a track on the centerline. Left
     unstated it silently becomes single-track loading, which understates a
     multi-track structure and mislocates the load on an off-centre single
     track. */
  var __trackWarn=(p.loadMode==="rail"&&p.tracksGiven===false);
  const out=[];
  const add=(state,name,detail,ref)=>out.push({state,name,detail,ref});

  if(M){
    const specMin=Math.max(10,Math.ceil(M.g.span/4));
    /* This check used to quote a remembered figure — "about 5% below converged"
       — from a study on a different bridge that this program never ran and the
       reader cannot see. An unsupported number in a sealed package is worse
       than an absent one, because nothing on the page tells the reader it is
       unsupported. It now reports the mesh study for THIS model if one has been
       run on the Verification tab, and says plainly that it has not if it has
       not. The study is not run automatically: it is three extra position
       sweeps, which is free at 12 elements and slow at 120, and it has no place
       on the critical path of every report build. */
    const CV=(typeof MESHCONV!=="undefined")?MESHCONV.resultFor(M):null;
    const mult=nfx(M.nEl/specMin,1);
    if(CV){
      const drift=Math.abs(CV.rf4-CV.rf1)/Math.max(CV.rf1,1e-9)*100;
      const last=Math.abs(CV.rf4-CV.rf2)/Math.max(CV.rf2,1e-9)*100;
      add(drift>3?"wn":"ok","Element count — mesh study run",
        `${M.nEl} elements against a §7.2.7.2B minimum of ${specMin} (${mult}×). Rating this model for `+
        `<b>${esc(CV.veh)}</b> at ${CV.n1}, ${CV.n2} and ${CV.n4} elements gives RF = `+
        `<b>${nfx(CV.rf1,4)}</b>, ${nfx(CV.rf2,4)} and ${nfx(CV.rf4,4)}. The rating moves `+
        `<b>${nfx(drift,2)}%</b> between the mesh in use and the finest run, and ${nfx(last,2)}% over the `+
        `last doubling. `+
        (drift>3?`That is more than this program is willing to call converged — refine the model and rate `+
                 `on the refined mesh.`
                :`The rating on the mesh in use is within the tolerance this program treats as converged.`),
        "§7.2.7.2B");
    }else{
      /* Compliance and convergence are two questions and the check used to blur
         them, reading as though a code-minimum mesh were a deficiency. It is
         not: §7.2.7.2B FIXES the element count, and a rating meant to be
         reproducible by hand, or comparable against an independent calculation
         that followed the clause, has to use the count the clause gives. A
         different mesh is not a better answer to that question — it is an answer
         to a different one.

         So compliance is reported as satisfied when it is, and the mesh study is
         offered as sensitivity information the package may want to carry
         alongside the rating rather than as a correction to it. */
      const compliant=(M.nEl>=specMin);
      add(compliant?"ok":"bad","Element count",
        compliant
          ? `${M.nEl} elements against the §7.2.7.2B requirement of ${specMin} — the greater of 10 and one `+
            `per 4 ft of clear span. <b>Compliant.</b> `+
            (M.nEl<2*specMin
              ? `This is at or near the count the clause gives, which is the right choice for a rating that `+
                `must be reproducible by hand or comparable against an independent calculation following `+
                `the same clause. `
              : `${mult}× the count the clause gives. `)+
            `The clause fixes the count by span and says nothing about how far that count sits from a `+
            `converged answer on this particular geometry; the mesh study on the Verification tab measures `+
            `that separately, and is worth carrying with the package as sensitivity information. It does `+
            `not replace the rating computed here.`
          : `${M.nEl} elements against the §7.2.7.2B requirement of ${specMin}. <b>This is fewer than the `+
            `clause allows</b> — the requirement is the greater of 10 elements and one per 4 ft of clear `+
            `span. Raise the element count.`,
        "§7.2.7.2B");
    }

    {
      /* A model whose fill has vanished everywhere. Negative cover is now
         rejected at input, but a steep grade or a mis-entered rise can drive the
         road below the extrados over part or all of the barrel and reach the
         same place, and the clamps make it silent. */
      let hfHi=-Infinity,nZero=0;
      for(let i=0;i<M.nN;i++){
        const nd=M.g.nodes[i], hf=Math.max(M.g.bwsAt(nd.extX)-nd.extY,0);
        hfHi=Math.max(hfHi,hf); if(hf<=1e-9)nZero++;
      }
      if(hfHi<=1e-9)
        add("bad","No fill anywhere over the extrados",
          "Every node has a fill height of zero, so the fill dead load and the lateral earth pressure are "+
          "both absent and the ring is being rated as though it carried only its own weight and whatever is "+
          "in the superimposed dead load panel. The road surface is at or below the extrados across the "+
          "whole barrel. Check the cover, the rise and the grade before reading anything else in this report.",
          "§7.2.7.3B");
      else if(nZero>0)
        add("wn","Fill runs out over part of the barrel",
          `${nZero} of ${M.nN} nodes have zero fill above the extrados, so over that stretch the ring carries `+
          "no fill weight and no lateral earth pressure. That can be real on a crown with a thin cover and a "+
          "steep grade, but it is worth confirming against the section — it is also what a mis-entered rise "+
          "or cover looks like.","§7.2.7.3B");
      else if(p.tws<=0)
        add("wn","No wearing surface thickness entered",
          "t_ws = 0, so no wearing surface weight is in the model and the surcharge term in the lateral earth "+
          "pressure is zero. That is correct only if the deck genuinely has no pavement, or if its weight is "+
          "already entered as a line item in the superimposed dead load panel. It is also what an omitted "+
          "input looks like.","§7.2.7.4B");
    }

    if(p.loadMode!=="rail"){
      let covMinN=1e9;
      for(let i=0;i<M.nN;i++)covMinN=Math.min(covMinN,M.coverAt(i));
      const shallow=(covMinN<ARCH.SHALLOW_FILL);
      const rSh=ARCH.shallowRate(p);
      if(shallow&&rSh>0)
        add("wn","Fill spread credited below 2 ft — a judgment, state it",
          `The least cover on this barrel is ${nfx(covMinN,2)} ft, and a dispersion of ${nfx(rSh,2)}H is being `+
          `credited below the ${nfx(ARCH.SHALLOW_FILL,1)} ft threshold, in both directions. <b>No article `+
          `authorizes a spread at that depth.</b> Art. 6.4.2 applies at 2 ft and above; Art. 6.4.1 sends `+
          `anything shallower to Art. 3.24.3, which disperses the wheel through no fill at all. The credit is `+
          `defensible as engineering judgment about the fill — there is real material over the extrados and it `+
          `does spread load — but it is a judgment and it must appear in the assumptions. `+
          ((Math.abs(rSh-1.75)<1e-9)
            ?"At 1.75H the result is arithmetically identical to applying Art. 6.4.2 at every depth, which is "+
             "what a legacy rating built before this distinction was drawn would have produced."
            :`At ${nfx(rSh,2)}H the credit is conservative against the Art. 6.4.2 rate.`),
          "Std Spec 6.4.1");
      else if(shallow)
        add("ok","Shallow-cover distribution",
          `Least cover ${nfx(covMinN,2)} ft. Axles landing on less than ${nfx(ARCH.SHALLOW_FILL,1)} ft of `+
          ((ARCH.shallowRate(p)>0)
            ?`cover take a credited fill dispersion of ${nfx(ARCH.shallowRate(p),2)}H, applied in both `+
             `directions, rather than the ${nfx(1.75,2)}H of Art. 6.4.2`+
             ((Math.abs(ARCH.shallowRate(p)-1.75)<1e-9)
               ?" — at this rate the branch is identical to 6.4.2 and the load is continuous across 2 ft."
               :". A step remains at H = 2 ft.")
            :`cover are carried as concentrated loads, not by the 1.75H spread of 6.4.2, over a transverse `+
          `width of ${nfx(ARCH.shallowWidth(p),2)} ft `+
          ((p.shallowE==="slab")
            ?"— Art. 3.24.3.2, E = 4 + 0.06S. That article presumes the transverse flexural continuity of a "+
             "reinforced slab, which an unreinforced ring generally does not have; the basis must be stated "+
             "in the assumptions."
            :"— the tire contact width. No transverse distribution is taken over unreinforced masonry, since "+
             "the Art. 3.24.3.2 width presumes slab distribution reinforcement the ring does not have.")),
          "Std Spec 6.4.1");
      else
        add("ok","Wheel distribution branch",
          `Least cover ${nfx(covMinN,2)} ft, at or above the ${nfx(ARCH.SHALLOW_FILL,1)} ft threshold `+
          `everywhere, so the 1.75H spread of Std. Spec. 6.4.2 governs across the whole barrel.`,
          "Std Spec 6.4.2");
    }

    if(__trackWarn)
      add("wn","Track layout not entered",
        "No track offsets were given, so the rating assumes <b>a single track on the barrel centerline</b>. "+
        "On a multi-track structure that understates the load; on a single track set off centre it puts the "+
        "load in the wrong place. Enter one offset per track in feet from the centerline — a single entry of "+
        "0 is a positive statement that the track is central, whereas a blank field is an assumption.","AREMA");
    const rs=M.g.rise/M.g.span;
    if(rs<0.15)
      add("wn","Shallow arch (rise/span < 0.15)",
        `rise/span = ${nfx(rs,3)}. Elastic frame analysis of very flat arches is sensitive to support `+
        `stiffness and geometry error; verify against an independent method before relying on the rating.`,"—");
    else add("ok","Rise/span ratio",`rise/span = ${nfx(rs,3)}, within the range where the elastic frame model is reliable.`,"—");

    if(p.loadMode==="rail")
      add("na","Cover threshold for through-fill distribution",
        "Std. Spec. Art. 6.4 and the 2 ft slab-distribution threshold of Art. 3.24.3 are highway provisions and "+
        "do not apply to this railroad rating. Load is distributed from the bottom of the ties per the tie "+
        "distribution rule. Confirm that rule against AREMA or the track owner's criteria.","Std Spec 6.4");
    else if(M.g.coverCrown<2.0)
      add("wn","Cover at crown less than 2 ft",
        `Crown cover = ${nfx(M.g.coverCrown,2)} ft. AASHTO Std. Spec. 3.24.3 requires slab-type distribution `+
        `where fill is less than 2 ft; the through-fill spread of Std. Spec. 6.4 used here does not apply. `+
        `Perform the slab distribution check separately — this tool does not.`,"Std Spec 3.24.3");
    else if(p.loadMode!=="rail") add("ok","Fill cover for through-fill distribution",
      `Crown cover = ${nfx(M.g.coverCrown,2)} ft ≥ 2 ft; Std. Spec. 6.4 spread applies.`,"Std Spec 6.4");

    // dead load alone
    let dlWorst=-1,dlSec=-1;
    for(let i=0;i<M.nN;i++){
      const f=ARCH.stressMax(M.DL[i].C,M.DL[i].M,M.dn[i]);
      const u=(f===Infinity)?1e9:f/(p.fa*KSF_PSI);
      if(u>dlWorst){dlWorst=u;dlSec=i;}
    }
    if(dlWorst>=1)
      add("bad","Dead load alone exceeds allowable",
        `Peak dead-load stress at ${secTag(M,dlSec)} is ${(dlWorst*p.fa).toFixed(0)} psi against `+
        `f_a = ${p.fa} psi. All rating factors are zero. Re-examine geometry, unit weights, and the `+
        `allowable stress before proceeding.`,"§7.2.7.11B");
    else if(dlWorst>=0.5)
      /* Between "within allowable" and "fails" there is a band that decides the
         rating and was passing silently as OK. At 0.80 the section has a fifth
         of its capacity left for the vehicle, so every rating factor will be
         small however light the train, and the reason is the dead load, not the
         live load. That should be said where the reader looks first rather than
         inferred from a rating factor of 0.04. */
      add("wn","Dead load alone uses most of the allowable",
        `Peak dead-load utilization is <b>${nfx(dlWorst,2)}</b> at ${secTag(M,dlSec)} — `+
        `${(dlWorst*p.fa).toFixed(0)} psi against f_a = ${p.fa} psi, leaving `+
        `${nfx(100*(1-dlWorst),0)}% of the section for live load. Rating factors will be low for every `+
        `vehicle and the cause is the dead load and the section, not the train. `+
        (M.dn[dlSec]<ARCH.baseDepth(p,0.5)*0.95
          ? `That section carries an entered depth reduction, so check the reduction and its treatment first.`
          : `Check the fill depth, the unit weights and the superimposed dead load before reading the ratings.`),
        "§7.2.7.9B");
    else add("ok","Dead load alone within allowable",
      `Peak dead-load utilization ${nfx(dlWorst,2)} at ${secTag(M,dlSec)}.`,"§7.2.7.9B");

    if(M.g.covMin<0.5&&M.g.covMin>=0)
      add("wn","Very shallow cover somewhere over the barrel",
