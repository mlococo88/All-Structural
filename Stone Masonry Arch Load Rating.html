        `Minimum cover over the extrados is ${nfx(M.g.covMin,2)} ft. Wheel loads are nearly `+
        `direct-bearing; through-fill spread is not meaningful at this depth.`,"Std Spec 6.4");

    if(!p.sdl||!p.sdl.length)
      add("wn","No superimposed dead load entered",
        "§7.2.7.4B requires the dead load of sidewalks, wearing surfaces, railings, curbs and spandrel walls to "+
        "be computed and equally distributed across the width of the arch. Only the wearing surface is present "+
        "in this model. If the structure carries any of the others — a spandrel wall in particular, whose weight "+
        "must be included even though §7.2.7.4B directs that its structural capacity be neglected — the dead "+
        "load is understated and the rating is unconservative.","§7.2.7.4B");
    else{
      const psf=M.wSdl*1000;
      add("ok","Superimposed dead load included",
        `${p.sdl.length} line item${p.sdl.length>1?"s":""} totalling ${nfx(M.sdlLine*1000,0)} plf, distributed `+
        `across the ${nfx(p.barrelW,1)} ft barrel width as ${nfx(psf,1)} psf per §7.2.7.4B.`,"§7.2.7.4B");
      /* An SDL that is technically present but physically absurd used to pass
         with an OK badge — 1 plf across a 24 ft barrel, against sidewalks that
         weigh hundreds. Line items are entered in lb per foot of bridge length;
         a value this small is almost always kips entered where pounds belong,
         or a decimal slip. */
      {
        const tot=(p.sdl||[]).reduce((a,b)=>a+(b.w||0),0);
        if(tot>0&&tot<25)
          add("wn","Superimposed dead load implausibly small — check the units",
            `The ${p.sdl.length} line item${p.sdl.length>1?"s":""} total ${nfx(tot,1)} lb per foot of bridge `+
            `length. A single granite curb runs a few hundred; a sidewalk, several hundred. Values this small `+
            `usually mean kips were entered where the field takes pounds — ${nfx(tot,3)} klf would be `+
            `${nfx(tot*1000,0)} here. If the items really are this light, no change is needed; the check is `+
            `advisory.`,"§7.2.7.4B");
      }
      if(p.barrelW<8||p.barrelW>80)
        add("wn","Barrel width unusual",`Barrel width of ${nfx(p.barrelW,1)} ft is outside the range normally `+
          "seen on a stone arch; confirm it, since it divides every superimposed load.","§7.2.7.4B");
    }
    if(M.dChange&&M.dChange.length){
      /* Named sections (CR, QP, SL) keep their names even when they are also
         change points, so the count of nodes SHOWING an SC tag can be smaller
         than the count of flagged nodes. The old text quoted the internal count
         and told the reader to look for that many SC tags — off by one on any
         model whose worst depth change is at the crown, which is most of them. */
      const scShown=M.dChange.filter(i=>CALC.secTag(M,i).startsWith("SC")).length;
      const subsumed=M.dChange.length-scShown;
      add("ok","Section property change points",
        `${M.dChange.length} node${M.dChange.length>1?"s":""} flagged where the ring depth changes `+
        `significantly — ${scShown} tagged SC in the tables`+
        (subsumed>0?`, and ${subsumed} at named section${subsumed>1?"s":""} (${
          M.dChange.filter(i=>!CALC.secTag(M,i).startsWith("SC")).map(i=>CALC.secTag(M,i)).join(", ")
          }) which keep their names`:"")+
        `. §7.2.7.7B requires influence lines at such points; this model develops them at every node.`,
        "§7.2.7.7B");
    }

    if(p.geoMode==="measured"&&M.g.fits){
      const f=M.g.fits.find(q=>q.type===M.g.chosenFit&&q.ok);
      if(f&&f.rms>0.25)
        add("wn","Curve fit residual is large",
          `RMS residual of the selected ${f.label} fit is ${nfx(f.rms,3)} ft. A poor fit means the model `+
          `geometry does not represent the measured barrel; try another curve type or re-check the survey.`,"§7.2.7.2B");
      else if(f) add("ok","Curve fit residual",`${f.label} fit, RMS residual ${nfx(f.rms,3)} ft.`,"§7.2.7.2B");
    }else{
      add("wn","Idealized geometry in use",
        `§7.2.7.2B states that field measurement and confirmation of the arch geometry is critical and that `+
        `assuming an arbitrary geometry is not acceptable. Switch to measured points before issuing a rating.`,
        "§7.2.7.2B");
    }
  }

  if(M&&M.stiffCheck){
    const sc=M.stiffCheck;
    (()=>{
      let te=0,ta=0;
      for(let i=0;i<M.nN;i++){te+=M.tribH[i];ta+=(M.tribAxis?M.tribAxis[i]:M.tribH[i]);}
      const dpc=(ta>0)?100*(te-ta)/ta:0;
      add(dpc>2?"key":"ok","Load width measured on the extrados",
        "Pressure from the fill lands on the top of the ring, so the width each node is responsible for — and "+
        "the horizontal projection carrying the fill, wearing surface and superimposed dead load — is measured "+
        "on the <b>extrados</b>, not on the arch axis beneath it. Here the extrados spans <b>"+nfx(te,3)+
        " ft</b> against an axis span of "+nfx(ta,3)+" ft, so measuring on the axis would understate every "+
        "surface load by <b>"+nfx(dpc,1)+"%</b>. Ring self weight is unaffected: it is distributed along the "+
        "arc, not on a projection."+
        (dpc>2?" On a deep or near-semicircular ring this is worth several percent of the rating, which is why "+
          "the two spans are reported separately on the Model tab.":""),
        "§7.2.7.3B");
    })();
    /* Deep springing cover. On a near-semicircular ring the extrados at the
       springing sits far below the road, so the model applies a tall column of
       soil there. The vertical side is self-limiting — the extrados is close to
       vertical, so its horizontal projection is small and it delivers little
       weight — but the lateral side is the opposite: that same near-vertical
       face has a large vertical projection, so the deepest, highest-pressure
       part of the K·γ·z load acts right where the springline moment is formed.
       Nothing here is wrong, but it rests on treating that column as soil, and
       on a real arch much of it is spandrel and abutment masonry. */
    (()=>{
      /* This is a standing modeling assumption, not an exceptional condition:
         on every arch with meaningful cover the springing elements carry a
         fifth to a third of the inward earth thrust, simply because they are the
         deepest. The row is therefore always shown with the numbers filled in,
         and is raised to REVIEW only when the column over the springing is
         genuinely tall — more than twice the crown cover and over four feet — at
         which point the material is much more likely to be masonry than soil. */
      const hCr=M.coverAt(Math.round((M.nN-1)/2));
      const hSp=Math.max(M.coverAt(0),M.coverAt(M.nN-1));
      /* The ratio test is useless as a discriminator: springing cover is crown
         cover plus the rise, so it exceeds twice the crown cover on almost every
         arch. The flag is therefore on absolute depth, where the material stops
         being plausibly fill and starts being structure. */
      const flag=(hSp>10);
      /* gws was missing here too, so every F below came out NaN, latTot stayed
         NaN, and the share printed as 0% — the dashboard stated that the two
         springing elements carry none of the inward earth thrust, which is the
         opposite of true for near-vertical springing elements. */
      const gf=p.gf/1000, gws=p.gws/1000;
      let latTot=0,latSp=0;
      for(let i=0;i<M.nN-1;i++){
        const a=M.g.nodes[i],b=M.g.nodes[i+1];
        const ha=Math.max(M.g.bwsAt(a.x)-a.y,0), hb=Math.max(M.g.bwsAt(b.x)-b.y,0);
        /* Axis basis, matching the solver since v2026.08.10u. */
        const F=p.K*(gf*(ha+hb)/2+gws*p.tws)*Math.abs(b.y-a.y);
        latTot+=F; if(i===0||i===M.nN-2)latSp+=F;
      }
      const shr=(latTot>0)?100*latSp/latTot:0;
      const earthShare=(Math.abs(M.DL[0].M)>1e-9)?100*M.DLC.earth[0].M/M.DL[0].M:0;
      add(flag?"wn":"inf",flag?"Deep fill column over the springing"
        :"Fill column over the springing",
        `The extrados at the springing lies <b>${nfx(hSp,2)} ft</b> below the road against `+
        `${nfx(hCr,2)} ft at the crown, so the model applies <b>${nfx(gf*hSp,3)} ksf</b> of soil and a lateral `+
        `pressure of <b>${nfx(p.K*(gf*hSp+(p.gws/1000)*p.tws),3)} ksf</b> there. Only material above the extrados is counted, which `+
        `is the correct rule, but on a real arch much of that column is spandrel and abutment masonry bearing `+
        `more or less directly rather than fill arching over the ring. The vertical side is self-limiting — the `+
        `extrados is nearly vertical there, so it carries little weight — but the lateral side is not: the two `+
        `springing elements supply <b>${nfx(shr,0)}%</b> of the total inward earth thrust, and lateral pressure `+
        `accounts for <b>${nfx(earthShare,0)}%</b> of the springline dead load moment. Satisfy yourself that `+
        `treating that column as soil is appropriate, and see the K sensitivity on the Earth Pressure tab.`,
        "§7.2.7.5B");
    })();
    {
      /* AUTOMATED CONSISTENCY INVARIANT.

         Every distribution option in this program has to reach the solver AND
         every table AND every figure, and the failure mode when one is missed is
         silent: a table that decomposes a calculation nobody performed. This
         check makes that loud instead of leaving it to be spotted by eye.

         It compares, over a sweep of vehicle positions and both directions, the
         solver's own nodal load vector against the per-axle decomposition the
         tables and figures are built from. They come from the same function, so
         any divergence means a display path has started computing its own
         spread — which is exactly what happened when the lateral pressure tab
         and the earth pressure tab each drifted from the solver. */
      let worst=0, checked=0;
      const vlist=ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id));
      const x0=M.g.xmin-30, x1=M.g.xmax+5;
      for(const v of vlist.slice(0,3)){
        for(let x=x0;x<=x1;x+=(x1-x0)/17){
          for(const dr of [1,-1]){
            const qa=ARCH.nodalLL(M,v,x,dr);
            const db=ARCH.nodalLLByAxle(M,v,x,dr);
            for(let k=0;k<qa.length;k++){worst=Math.max(worst,Math.abs(qa[k]-db.q[k]));checked++;}
          }
        }
      }
      add(worst<1e-9?"ok":"bad","Distribution reaches every table",
        worst<1e-9
          ? `The solver's nodal live load and the per-axle decomposition that every contribution table is `+
            `built from agree to <b>${worst.toExponential(1)}</b> over ${checked} comparisons across the `+
            `position sweep. They come from one function, so the distribution options in force — dispersion `+
            `slope, longitudinal capping, adverse-influence filtering — reached the tables and not only the `+
            `analysis. <b>This checks load VALUES, not drawn geometry:</b> the figures take their pressure `+
            `from the solver's own nodal load and their footprint widths from the same axleLs(), but a `+
            `figure that drew the right number with the wrong outline would not be caught here.`
          : `<b>The solver and the per-axle decomposition disagree by ${worst.toExponential(2)}.</b> A `+
            `display path has started computing its own distribution and the tables no longer describe the `+
            `calculation that produced the rating. Do not issue this run.`,
        "§7.2.7.8B");
    }
    if(p.llAdverse){
      /* An envelope, not a train. It must be labelled as such wherever the
         rating is read, because nothing else on the page reveals that the live
         load was truncated. */
      add("wn","Live load applied over adverse influence only",
        "For each section, live load is applied only at nodes whose moment influence ordinate aggravates "+
        "that section; nodes of opposing influence carry none. <b>This is rigorous for a load that can "+
        "genuinely be withheld</b> — a uniform trailing load ends where the train ends, and loading only "+
        "the adverse region is the standard use of an influence line for it. <b>It is not a realizable "+
        "loading for the axle set:</b> axles are rigidly spaced, so a locomotive cannot have one axle "+
        "present and the next absent. Applied to the axles this is an upper-bound envelope no train can "+
        "produce. It is conservative on both counts — dropping the opposing nodes raises the moment and "+
        "removes the thrust those nodes contributed, and since e = ΣM/ΣP both drive the eccentricity up — "+
        "so it bounds the real answer from the safe side. State in the calculation package that the rating "+
        "was produced on this basis, because a reviewer reproducing it with the whole vehicle in place will "+
        "get a higher number.","§7.2.7.8B");
    }
    if(p.loadMode==="rail"){
      /* The spread rate is the single largest lever on a railroad rating and it
         changed default at v2026.08.11c. Anyone opening an older file needs to
         see which rule produced the numbers in front of them. */
      const r=ARCH.railRate(p);
      const H=M.g.coverCrown, h=Math.max(H-(p.tieDepth||0.583),0);
      const at=(rr)=>({Ls:3+2*rr*h, W:(p.tieLen||8.5)+2*rr*h});
      const a=at(r), b=at(r===0.5?1:0.5);
      add(Math.abs(r-0.5)<1e-9?"key":"wn",
        "Live load distribution through ballast and fill",
        `Spreading at <b>${Math.abs(r-0.5)<1e-9?"1H : 2V":(Math.abs(r-1)<1e-9?"1H : 1V":nfx(r,3)+" each side")}</b>`+
        ` — ${nfx(r,2)} horizontal each side per unit of depth. At the crown, ${nfx(h,2)} ft below the tie `+
        `soffit, that gives a longitudinal footprint of <b>${nfx(a.Ls,2)} ft</b> and a transverse width of `+
        `<b>${nfx(a.W,2)} ft</b>; the other rule would give ${nfx(b.Ls,2)} ft and ${nfx(b.W,2)} ft. `+
        (Math.abs(r-0.5)<1e-9
          ? `1H : 2V is the AREMA dispersion and the more conservative of the two — it concentrates the load `+
            `over roughly half the added width. <b>This is the default from v2026.08.11c; earlier builds of `+
            `this program used 1H : 1V</b>, so a rating carried over from one of them will fall.`
          : `1H : 1V is the 45&deg; assumption used by this program before v2026.08.11c and is the more `+
            `generous of the two. AREMA is generally applied at 1H : 2V; confirm which the owner requires `+
            `before issuing a rating on this basis.`),
        "AREMA Ch. 8");
      /* The spread cannot exceed the structure that carries it. Not enforced —
         it changes ratings — but it must not pass unremarked. */
      const wMax=(p.tieLen||8.5)+2*r*Math.max(M.g.covMax-(p.tieDepth||0.583),0);
      if(wMax>p.barrelW)
        add("wn","Transverse spread exceeds the barrel width",
          `At the deepest section the load spreads to <b>${nfx(wMax,2)} ft</b> across a barrel only `+
          `<b>${nfx(p.barrelW,2)} ft</b> wide. This program does not cap the spread, so the pressure at those `+
          `sections is lower than the structure can actually distribute over — the unconservative direction. `+
          `The effect is usually small because the deepest sections carry the least live load, but it is not `+
          `zero and it is not checked by anything else.`,"AREMA Ch. 8");
    }
    /* Deterioration is a change to the structure being rated, so it belongs on
       the dashboard whatever else is going on. It was absent entirely: a barrel
       with 54% of its crown depth removed reported no check at all. */
    (()=>{
      const Z=(M&&M.deterZones)?M.deterZones:[];
      if(!Z.length)return;
      const legacy=Z.filter(z=>z.fromNode);
      const loss=Z.filter(z=>z.d>0&&z.dSound>0);
      const worst=loss.reduce((a,b)=>(!a||b.d/b.dSound<a.d/a.dSound)?b:a,null);
      const hinged=Z.filter(z=>z.hinge).length;
      if(legacy.length){
        add("wn","Deterioration entered by node number",
          `${legacy.length} entr${legacy.length===1?"y is":"ies are"} keyed to a node number rather than `+
          `to a station. A node number is a position in the MESH, not a position on the arch: at `+
          `${M.nEl} elements ${legacy.map(z=>"node "+(z.node+1)+" is x = "+nfx(z.x1,2)+" ft").join(", ")}, `+
          `and changing the element count moves it. On this barrel node 7 is the crown at 12 elements and `+
          `the springing at 60, and the intermediate meshes put the reduced section on the haunch where the `+
          `arch will not carry its own weight. Re-enter as a station in feet — `+
          `<span class="mono">x ${nfx(legacy[0].x1,2)}, ${legacy[0].d>0?nfx(inOf(legacy[0].d),1):""}...</span> — `+
          `or as a zone <span class="mono">x ${nfx(legacy[0].x1-1,2)}-${nfx(legacy[0].x1+1,2)}, ...</span>, `+
          `and it will stay where you put it.`,"§7.2.7.2B");
      }
      /* The ring depth itself, which has no sound-section to compare against and
         so was not covered by the deterioration checks below. Since v2026.08.10k
         it is entered in INCHES, and a value carried over from feet habit — 1.42
         meaning 1.42 ft — produces a ring a twelfth of its true depth. The model
         still builds and still rates: the axis span shrinks toward the clear
         span, the kern collapses, and every number on every tab is confidently
         wrong. Span-to-depth is the test that catches it, because it is scale
         free. Real stone barrels run roughly 10 to 30; a rule of thumb for a
         sound ring is d ≈ 0.3√S ft, which at a 9.7 ft span is about 11 in. */
      {
        const sp=M.g.span, dMin=Math.min(p.dC,p.dS), ratio=(dMin>0)?sp/dMin:Infinity;
        const rule=0.3*Math.sqrt(Math.max(sp,0.1));
        if(ratio>50||inOf(dMin)<4)
          add("bad","Ring depth is implausibly thin — check the units",
            `The ring is <b>${nfx(inOf(p.dC),2)} in</b> at the crown and `+
            `<b>${nfx(inOf(p.dS),2)} in</b> at the springings, against a clear span of `+
            `${nfx(sp,2)} ft — a span-to-depth ratio of <b>${nfx(ratio,0)}</b>. Stone masonry barrels run `+
            `roughly 10 to 30; a common first estimate for this span is about ${nfx(12*rule,0)} in. `+
            `<b>Ring depth has been entered in INCHES since v2026.08.10k.</b> A value carried over from feet `+
            `— ${nfx(inOf(p.dC),2)} meaning ${nfx(inOf(p.dC),2)} ft — lands exactly here and would give `+
            `${nfx(inOf(p.dC)*12,1)} in. Nothing downstream can detect this: the model builds, the arch `+
            `stands, and every rating factor in this report is computed on a ring a twelfth of its real `+
            `depth. Check the Model tab — the arch axis span should exceed the clear span by roughly the `+
            `ring depth, and reads ${nfx(M.g.xmax-M.g.xmin,2)} ft against a clear span of ${nfx(sp,2)} ft.`,
            "§7.2.7.2B");
        else if(ratio>35)
          add("wn","Ring is thin relative to the span",
            `Span-to-depth is ${nfx(ratio,0)} — thinner than the 10 to 30 typical of stone masonry barrels. `+
            `Confirm the depth against the drawings or a field measurement; depths are entered in inches.`,
            "§7.2.7.2B");
      }
      /* Post-unit-change hazards. Depths are now entered in INCHES; a value
         typed from feet habit produces a section a twelfth of the intended
         size, and the program would rate it without complaint. Both directions
         are caught: a "reduced" depth larger than the sound section is not a
         loss at all, and one thinner than a tenth of the sound ring is far more
         likely a units slip than real geometry. */
      for(const z of loss){
        if(z.d>z.dSound+1e-9)
          add("bad","Deterioration entry deeper than the sound ring",
            `The entry at x = ${nfx(z.x1,2)} ft gives a remaining depth of ${nfx(inOf(z.d),2)} in against a `+
            `sound section of ${nfx(inOf(z.dSound),2)} in. A remaining depth cannot exceed the sound depth — `+
            `this entry would ADD material. If ${nfx(inOf(z.d),2)} in was meant as the amount REMOVED, enter `+
            `the remainder, ${nfx(inOf(z.dSound)-inOf(z.d),2)} in, instead.`,"§7.2.7.2B");
        else if(z.d<z.dSound/10)
          add("wn","Deterioration entry implausibly thin — check the units",
            `The entry at x = ${nfx(z.x1,2)} ft leaves ${nfx(inOf(z.d),2)} in of a ${nfx(inOf(z.dSound),2)} in `+
            `ring — ${nfx(100*z.d/z.dSound,1)}% of the section. Depths are entered in INCHES as of this build; `+
            `a value carried over from feet habit (for example 0.65 meaning 0.65 ft) would land here. If `+
            `${nfx(inOf(z.d)*12,1)} in was intended, re-enter it; if the section really is this thin, the `+
            `arch is unlikely to stand under dead load and the rating below will say so.`,"§7.2.7.2B");
      }
      if(worst){
        const pct=100*(1-worst.d/worst.dSound);
        const kern=worst.d/6;
        add(pct>25?"wn":"key","Section loss modelled",
          `${loss.length} zone${loss.length===1?"":"s"} of reduced depth. The worst is at x = `+
          `<b>${nfx(worst.x1,2)}${worst.x2>worst.x1?" to "+nfx(worst.x2,2):""} ft</b>, where `+
          `<b>${nfx(inOf(worst.d),2)} in</b> remains of a sound <b>${nfx(inOf(worst.dSound),2)} in</b> — `+
          `<b>${nfx(pct,0)}%</b> of the depth gone. Section modulus falls with the square, to `+
          `${nfx(100*Math.pow(worst.d/worst.dSound,2),0)}% of sound, and the kern collapses to `+
          `&plusmn;${nfx(inOf(kern),3)} in, so that section is far more likely to be in the pressure wedge. `+
          `Material is taken from the ${p.deterFace==="extrados"?"extrados, so the arch axis DROPS":
            (p.deterFace==="both"?"both faces, so the arch axis does not move":
             "intrados, so the arch axis RISES")} through the zone — that axis shift is a real change of `+
          `structure, not a drawing artifact, and it is usually the larger of the two effects.`,
          "§7.2.7.2B / 10B");
        add("inf","Why a thinner ring can rate HIGHER",
          "A reduced depth at or near the crown softens the arch there, so it sheds fixed-end moment and "+
          "behaves more like a three-hinged arch — the springline dead load moment falls, and because the "+
          "springing usually sits in the pressure wedge, where f = 2P/[3(d/2 - e)], a small change in moment "+
          "is amplified into a large change in stress. On this model removing 54% of the crown depth lowered "+
          "the springline dead load moment by about 10% and RAISED the rating by about half. That is the "+
          "elastic model behaving correctly and it is not a licence to leave the damage out: a real spalled "+
          "crown also loses the shear and bearing capacity this model does not check, and the softening "+
          "credit assumes the remaining material is sound. Rate it both ways and report the lower.",
          "§7.2.7.9B");
      }
      if(hinged)add("wn","Moment release in use",
        `${hinged} node${hinged===1?"":"s"} carr${hinged===1?"ies":"y"} a moment release. This is a `+
        `structurally different arch, not a damaged one: each hinge removes a redundancy, and a fixed arch `+
        `has three to give before it becomes a mechanism. State the field evidence for each release in the `+
        `calculation package.`,"§7.2.7.2B");
    })();
    /* B7 — the rating search has bounds, and hitting them is information the
       reader needs. An unbounded result means nothing controls; a governing
       position at the end of the sweep window means the true governing position
       may lie outside it, which on a long consist over a short span is a real
       possibility because the trailing load alone can control. */
    results.forEach(r=>{
      const v=ARCH.ALL_VEHICLES.find(x=>x.id===r.id); if(!v)return;
      if(r.rf>=500)
        add("wn","Rating not bounded — "+v.name,
          "The search reached its ceiling without the section stress reaching the allowable, so no rating "+
          "factor controls this vehicle. Check the allowable stress and the vehicle definition before "+
          "reporting the figure shown.","§7.2.7.12");
      if(r.sweepStep&&isFinite(r.pos)){
        const atLo=(r.pos-r.sweepLo)<=1.5*r.sweepStep, atHi=(r.sweepHi-r.pos)<=1.5*r.sweepStep;
        if(atLo||atHi)
          add("wn","Governing position at the edge of the sweep — "+v.name,
            `The controlling position sits at the ${atLo?"start":"end"} of the swept window `+
            `(${nfx(r.sweepLo,1)} to ${nfx(r.sweepHi,1)} ft), so the true governing position may lie beyond `+
            `it. With a long consist and a uniform trailing load this usually means the consist is clear of `+
            `the span and the trailing load alone controls — confirm that is the case being rated.`,
            "§7.2.7.8B");
      }
    });
    /* B6 — net tension is worth its own line */
    (()=>{
      const bad=[];
      for(let i=0;i<M.nN;i++)
        if(ARCH.stressPair(M.DL[i].C,M.DL[i].M,M.dn[i]).regime==="TENSION")bad.push(CALC.secTag(M,i));
      if(bad.length)
        add("bad","Net tension under dead load",
          `The combined thrust is tensile at ${bad.join(", ")}. That is not a stress problem to be rated — the `+
          `thrust line has left the ring entirely and the model is pulling the masonry apart there. Check the `+
          `geometry, the restraint and the fill before reading any rating from this run.`,"§7.2.7.9B");
    })();
    /* B9 — element count and slenderness */
    (()=>{
      const specMin=Math.max(10,Math.ceil(M.g.span/4));
      const dl=M.stiffCheck?M.stiffCheck.dOverL:null;
      if(dl&&dl>0.5)
        add("wn","Elements are deep relative to their length",
          `Depth to length ratio d/L = ${nfx(dl,2)}. Beam theory is an approximation at this proportion even `+
          `with shear deformation included, and §7.2.7.2B fixes the element count by span rather than by `+
          `slenderness. Treat springline moments from this model as indicative and check them against an `+
          `independent solve.`,"§7.2.7.2B");
    })();
    (()=>{
      const gv=results.length?results.reduce((x,y)=>x.rf<y.rf?x:y):null;
      if(!(p.fv>0)){
        add("na","Shear rating",
          "Not checked. §7.2.7 rates stone masonry arches on combined compressive stress only; shear is "+
          "computed and reported for information. Enter an allowable shear stress to add a shear check to the "+
          "governing rating factor — a supplement to the code procedure, not part of it.","§7.2.7.9B");
        return;
      }
      const governs=gv&&gv.mode==="shear";
      add(governs?"wn":"ok","Shear rating included in the governing rating factor",
        `An allowable shear stress of <b>${nfx(p.fv,1)} psi</b> is in use, so every section is checked in `+
        `shear as well as in combined compressive stress and the reported rating factor is the lower of the `+
        `two. Demand is the average shear on the section, V/A, resolved on the section normal. `+
        (governs
          ? "<b>Shear governs the reported rating.</b> §7.2.7 does not require this check, so the figure being "+
            "reported is no longer a pure §7.2.7 rating — say so explicitly wherever it is reported, including "+
            "Items 64 and 66."
          : "The compressive stress check still governs, so the reported rating is the one §7.2.7 requires.")+
        " Note also that a constant allowable takes no account of the normal thrust, which is what actually "+
        "resists sliding in a masonry bed joint; a springing carrying high thrust has far more sliding "+
        "resistance than a lightly loaded crown, and this model does not represent that.",
        "§7.2.7.9B");
    })();
    add(sc.ok?"ok":"bad","Element stiffness self-check",
      `Beam formulation in use: <b>${sc.theory==="timoshenko"?"Timoshenko, shear deformation included — matches Midas"
        :"Euler-Bernoulli, no shear deformation"}</b>. Section b·d³/12 = ${nfx(sc.sectionI,6)} ft⁴/ft, `+
      `element depth-to-length ratio d/L = ${nfx(sc.dOverL,3)}, shear parameter Φ = ${nfx(sc.phi,4)}. `+
      `The assembled flexural term is ${nfx(sc.got,1)} against ${nfx(sc.expected,1)} kip·ft expected for that `+
      `formulation. `+
      (sc.ok?"These agree, which confirms the element matrix was assembled and transformed as the selected "+
        "beam theory prescribes. It does not verify the section input — both figures derive from the same "+
        "entered depth, so a wrong depth would pass this check."
        :"<b>These do not agree.</b> The assembled stiffness does not match the section properties being "+
         "reported, so every result is suspect. Do not use this run."),"§7.2.7.2B");
  }
  if(M&&p.shearDef===false)
    add("wn","Shear deformation is switched off",
      `Elements are Euler-Bernoulli. The ring here is ${nfx(M.stiffCheck.dOverL,2)} times as deep as the `+
      "elements are long, so shear flexibility is not negligible: neglecting it overstates the springline "+
      "moment and lowers the rating by roughly 2%. <b>Midas Civil includes shear deformation by default</b>, so "+
      "a checker rebuilding this model in Midas will not reproduce these numbers. Switch back to Timoshenko "+
      "unless there is a stated reason not to.","§7.2.7.2B");
  if(p.fa<100||p.fa>800)
    add("wn","Allowable stress outside the usual range",
      `f_a = ${p.fa} psi. Values for stone masonry per MBE Art. 6B.5.2.6 with field judgment normally fall `+
      `between roughly 100 and 800 psi. Confirm the basis for this value.`,"MBE 6B.5.2.6");
  if(p.gm<120||p.gm>190)
    add("wn","Masonry unit weight unusual",`γ_m = ${p.gm} pcf is outside the typical 120–190 pcf range for stone masonry.`,"—");
  if(p.gf<90||p.gf>150)
    add("wn","Fill unit weight unusual",`γ_f = ${p.gf} pcf is outside the typical 90–150 pcf range.`,"—");
  if(Math.abs(p.K-0.25)>1e-9)
    add("wn","Lateral earth pressure coefficient overridden",
      `K = ${nfx(p.K,3)} is in use; §7.2.7.5B specifies K = 0.25. State the basis for the deviation.`,"§7.2.7.5B");

  // permanent N/A items — honest check states (§8, §4)
  add("na","Operating level rating",
    "AASHTO MBE Art. 6A.9.1 evaluates unreinforced masonry arches at the Inventory level only; no Operating "+
    "allowable stress is given for masonry. EV2/EV3 are rated at the Inventory stress level and reported at "+
    "both levels per §7.2.7.11B — that reporting convention is not an Operating capacity check.","MBE 6A.9.1");
  add("na","Shear / radial joint sliding",
    "§7.2.7 rates stone masonry arches on combined compressive stress only. Shear is computed and reported "+
    "for information but is not a rating check in this procedure.","§7.2.7.9B");
  add("na","Thermal effects","Not considered, per explicit direction in §7.2.7.6B.","§7.2.7.6B");
  add("na","Spandrel wall participation",
    "§7.2.7.4B permits a spandrel to act as an independent member but states the ability of a spandrel to "+
    "support itself and a portion of the arch is uncertain and shall be neglected. Spandrel weight must be "+
    "included by the user through the fill unit weight or cover.","§7.2.7.4B");
  add("na","Excel calculation export",
    "Not implemented. The build guideline requires the firm's reference workbook to extract exact fills, "+
    "fonts, borders, print setup and header field codes; no template was supplied, and approximating it "+
    "would produce a non-conforming deliverable.","—");
  add("na","3-D visualisation",
    "Not implemented. The arch barrel model is two-dimensional (unit-width strip) and contains no embedded "+
    "elements, so the 3-D requirement and its transparency slider have no subject matter here.","—");
  if(window.__impCmp){
    const c=window.__impCmp, tol=2.0;
    const ok=c.withinNoise||(c.worstM<=tol&&c.worstC<=tol);
    add(ok?"ok":"wn","Independent verification against Midas Civil",
      `${c.nCmp} influence ordinates compared across ${c.rows.length} unit load cases. Worst difference, `+
      `scaled to the largest ordinate in each case: moment ${nfx(c.worstM,2)}% at ${c.wmCase}, thrust `+
      `${nfx(c.worstC,2)}% at ${c.wcCase}; worst absolute ${nfx(c.absM,4)} kip·ft and ${nfx(c.absC,4)} kip `+
      `against a rounding precision of ±${c.noise} in the pasted data. `+
      (ok?"Agreement is within what the data precision can resolve — the internal solver and Midas agree."
         :"The difference is larger than rounding can explain, so the two models are not identical. The "+
          "Verification tab lists what to check; note that the sign and end conventions resolved cleanly, "+
          "so the import itself is reading the data correctly."),
      "Verification tab");
  }else{
    add("na","Independent verification against Midas Civil",
      "No Midas results have been imported. Export the MCT file from the Verification tab, run it, and paste "+
      "the beam force results back to populate this check. Until then, solver evidence rests on the "+
      "closed-form and equilibrium checks documented in Manual Part 7.","Verification tab");
  }
  return out;
}

/* ============================================================
   2. GEOMETRY & MODEL
   ============================================================ */
function geometrySection(p,M){
  let h="";
  h+=msg("inf","Model basis",
    "Two-dimensional plane frame of prismatic two-noded beam elements at the mid-depth of the ring, "+
    "analyzed on a one-foot-wide longitudinal strip. Element count is the greater of 10 or one per 4 ft "+
    "of clear span, per §7.2.7.2B.");

  const specMin=Math.max(10,Math.ceil(M.g.span/4));
  h+=step({label:"Required number of elements",ref:"§7.2.7.2B",
    sym:"n_{el,min}=\\max\\left(10,\\ \\dfrac{L_c}{4}\\right)",
    sub:`\\max\\left(10,\\ \\dfrac{${num(M.g.span)}}{4}\\right)`,res:num(specMin,0)});
  h+=step({label:"Elements used in this model",sym:"n_{el}",sub:"",res:num(M.nEl,0),
    note:(M.nEl>specMin
      ?`${nfx(M.nEl/specMin,1)}× the code minimum. `
      :`At the code minimum. `)+
      "The minimum is a compliance floor, not evidence of convergence — whether this count has settled is "+
      "answered by the mesh convergence study on the Verification tab, and the dashboard reports whether "+
      "that study has been run for this model."});

  const axSpan=Math.abs(M.g.nodes[M.nN-1].x-M.g.nodes[0].x);
  if(Math.abs(axSpan-M.g.span)/Math.max(M.g.span,1e-9)>0.03)
    h+=msg("key","The modeled span is not the clear span",
      `The arch axis is the intrados offset normally by d/2, so on a deep ring — and especially on a near-`+
      `semicircular arch where the normal at the springing is close to horizontal — the axis springs outside `+
      `the clear span. Here the clear span is <b>${nfx(M.g.span,2)} ft</b> but the modeled axis runs from `+
      `x = ${nfx(M.g.nodes[0].x,2)} to ${nfx(M.g.nodes[M.nN-1].x,2)} ft, an axis span of `+
      `<b>${nfx(axSpan,2)} ft</b>. That is the correct structural centerline, but it is the number to match `+
      `when rebuilding this arch in another program, and the element count still follows the clear span per `+
      `§7.2.7.2B.`);
  h+=vars([
    ["L_c","Clear span of the intrados",M.g.span,"ft"],
    ["L_{axis}","Span of the modeled arch axis",axSpan,"ft"],
    ["f","Rise of the intrados",M.g.rise,"ft"],
    ["d_{cr}","Ring depth at crown",inOf(p.dC),"in",2],
    ["d_{sp}","Ring depth at springings",inOf(p.dS),"in",2],
    ["n_{nd}","Number of nodes",M.nN,"—",0],
    ["E","Masonry modulus of elasticity",p.E,"ksi",0],
    ["b","Analysis strip width",1.0,"ft"]
  ]);

  // curve fit
  if(p.geoMode==="measured"&&M.g.fits){
    h+=`<h4>Best-fit of field-measured intrados</h4>`;
    h+=msg("key","Why this matters",
      "§7.2.7.2B: the arch geometry shall be determined using either a parabolic, circular, elliptical, or "+
      "fifth-order polynomial curve which fits the best with the actual arch, and states that assuming an "+
      "arbitrary geometry is not acceptable. Each candidate curve is fitted to the survey points by least "+
      "squares and ranked by RMS residual.");
    h+=eqLine("Residual measure",
      "\\mathrm{RMS}=\\sqrt{\\dfrac{1}{n}\\sum_{k=1}^{n}\\left(y_k-y_{fit}(x_k)\\right)^2}",null,
      "Vertical offset between each measured point and the fitted curve.");
    const rows=M.g.fits.map((f,i)=>({__i:i,name:f.label,
      rms:f.ok?nfx(f.rms,4):"not fitted",
      use:(f.type===M.g.chosenFit)?"◀ selected":(f.ok?"":"— "+f.why)}));
    h+=dtab([{k:"name",h:"Candidate curve",txt:1},{k:"rms",h:"RMS residual (ft)",txt:1},
             {k:"use",h:"Status",txt:1}],rows);
    h+=`<div class="note">All four candidate curves of §7.2.7.2B are attempted. A curve that cannot be fitted
        is reported with the reason rather than omitted, so the reviewer sees the full field of candidates.</div>`;
    const sel=M.g.fits.find(f=>f.type===M.g.chosenFit&&f.ok);
    if(sel)h+=step({label:"Selected curve",sym:"\\text{fit}",sub:"",res:"\\text{"+sel.label+"}",
      note:`RMS residual ${nfx(sel.rms,4)} ft over ${p.measPts.length} measured points. `+
        (p.fitSel==="auto"?"Chosen automatically as the lowest residual, with a parsimony tiebreak that "+
        "prefers the simpler curve when residuals are within 5%.":"Chosen explicitly by the user.")});
  }else{
    h+=msg("wrn","Idealized geometry",
      `A ${esc(p.shape)} intrados of span ${nfx(M.g.span,2)} ft and rise ${nfx(M.g.rise,2)} ft is assumed. `+
      "§7.2.7.2B states that field measurement and confirmation of the arch geometry is critical and that "+
      "assuming an arbitrary geometry is not acceptable — this configuration is suitable for study only, "+
      "not for an issued rating.");
  }

  // ring depth
  h+=`<h4>Ring depth</h4>`;
  h+=step({label:"Ring depth by linear variation along the arc",
    sym:"d(u)=d_{sp}+(d_{cr}-d_{sp})\\left(1-\\left|2u-1\\right|\\right)",
    sub:`${num(inOf(p.dS),2)}+(${num(inOf(p.dC),2)}-${num(inOf(p.dS),2)})\\left(1-\\left|2u-1\\right|\\right)`,res:"",
    note:"u = normalized arc length from the left springing; the bracket is 0 at the springings and 1 at the crown. "+
      "Elements are piecewise-prismatic using the mean depth over each element; stress checks use the depth at each node."});
  if(p.dOver&&p.dOver.length)
    h+=msg("wrn","Local ring depth overrides in effect",
      "Measured or deteriorated effective depths override the linear profile, interpolated by station: "+
      p.dOver.map(o=>`d = ${nfx(o.d,2)} ft at x = ${nfx(o.x,2)} ft`).join("; ")+
      ". A reduced effective depth models mortar loss or delaminated voussoirs and materially lowers the rating.");

  // shear deformation
  h+=`<h4>Shear deformation</h4>`;
  {
    let Lel=0;
    for(let i=1;i<M.nN;i++)Lel+=Math.hypot(M.g.nodes[i].x-M.g.nodes[i-1].x,M.g.nodes[i].y-M.g.nodes[i-1].y);
    Lel/=M.nEl;
    const dm=(p.dC+p.dS)/2, ratio=dm/Lel;
    const nu=0.2, PH=12*(dm*dm*dm/12)/(( 1/(2*(1+nu)))*(5/6)*dm*Lel*Lel);
    h+=step({label:"Element depth to length ratio",sym:"d/L_{el}",
      sub:`${num(dm,3)}/${num(Lel,3)}`,res:num(ratio,2),
      note:"§7.2.7.2B fixes the element count, so on a deep ring the elements are often as deep as they are "+
        "long. Slender-beam theory is not accurate at that proportion."});
    h+=step({label:"Shear flexibility parameter",
      sym:"\\Phi=\\dfrac{12EI}{G A_s L_{el}^2}",
      sub:`G=\\dfrac{E}{2(1+\\nu)},\\ \\nu=0.2,\\ A_s=\\tfrac{5}{6}A`,
      res:num(PH,3),
      note:p.shearDef
        ? "Included. The element stiffness terms are divided by (1+Φ) with the rotational terms taken as "+
          "(4+Φ) and (2−Φ), the standard Timoshenko form. Neglecting it overstates the springline moment."
        : "<b>Neglected.</b> The elements are treated as slender. Where Φ is not small this overstates the "+
          "springline moment and the rating will differ from a program that includes shear deformation."});
  }

  // restraint
  h+=`<h4>Springing restraint</h4>`;
  h+=msg(p.support==="fixed"?"inf":"wrn",
    p.support==="fixed"?"Fixed springings":"Pinned springings",
    p.support==="fixed"
      ? "Both translations and rotation are restrained at each springing. This is the usual idealization for a "+
        "barrel bearing on massive abutments and produces springline moment. It is the stiffer, and generally "+
        "the governing, assumption."
      : "Translations are restrained and rotation is released, so the springline moment is identically zero and "+
        "the critical section moves inboard. This is the lower-bound idealization, appropriate where the "+
        "springing bears on a slender pier or shows cracking or rotation. It generally produces a higher rating "+
        "than fixed — state and defend the choice in the calculation package.");

  // grade
  h+=`<h4>Roadway grade and cover</h4>`;
  const eL=M.g.extrados[0],eR=M.g.extrados[M.g.extrados.length-1];
  const cvL=M.g.bwsAt(eL.x)-eL.y, cvR=M.g.bwsAt(eR.x)-eR.y;
  h+=step({label:"Grade line, bottom of wearing surface",ref:"§7.2.7.3B",
    sym:"y_{bws}(x)=y_0+g\\,x",
    sub:`y_{bws}(x)=${num(M.g.bwsAt(0),3)}+${num(M.g.grade,5)}\\,x`,res:"",
    note:"Fill height at every element, lateral earth pressure depth, live load distribution depth and the "+
      "impact basis are all measured from this line."});
  h+=vars([
    ["g","Roadway grade",M.g.grade*100,"%"],
    ["h_{cr}","Fill cover at the crown",M.g.coverCrown,"ft"],
    ["h_L","Cover at left springing",cvL,"ft"],
    ["h_R","Cover at right springing",cvR,"ft"],
    ["t_{ws}","Wearing surface thickness",p.tws,"ft (entered as "+nfx(inOf(p.tws),1)+" in)"]
  ]);

  // node table
  h+=`<h4>Node coordinates and section properties</h4>`;
  const rows=[];
  for(let i=0;i<M.nN;i++){
    const n=M.g.nodes[i];
    rows.push({__i:i,tag:secTag(M,i),x:n.x,y:n.y,s:n.s,d:n.d,dIn:inOf(n.d),
      ex:n.extX,ey:n.extY,cov:M.coverAt(i)});
  }
  h+=dtab([{k:"tag",h:"Node",txt:1},{k:"x",h:"x (ft)",dp:3},{k:"y",h:"y axis (ft)",dp:3},
    {k:"s",h:"arc s (ft)",dp:3},{k:"dIn",h:"d (in)",dp:2},{k:"ey",h:"extrados y (ft)",dp:3},
    {k:"cov",h:"cover H (ft)",dp:3}],rows);
  h+=`<div class="note">Coordinates are on the arch axis (intrados offset normally by d/2). Cover H is measured
      from the roadway surface to the extrados directly above each node and drives the live load spread.</div>`;
  return h;
}

/* ============================================================
   3. DEAD LOAD
   ============================================================ */
function deadLoadSection(p,M){
  let h="";
  h+=msg("inf","Dead load components",
    "Fill over the extrados and the wearing surface act on the horizontal projection of the <b>extrados</b> "+
    "of each element — the surface they bear on, which on a deep ring is wider than the projection of the "+
    "axis beneath it;  ring "+
    "self-weight acts along the arc; lateral earth pressure acts on the vertical projection OF THE ARCH AXIS, "+
    "at a depth measured to that axis rather than to the extrados. All four are "+
    "applied as linearly-varying element loads through consistent fixed-end load vectors, per §7.2.7.3B and §7.2.7.5B.");

  {
    /* h_f varies node by node, so this line has to stay partly symbolic — but
       showing a numeric t_ws beside a symbolic h_f made a zero wearing surface
       look like an unexplained zero rather than an input. State the range of
       h_f actually in the model, and say outright when a term vanishes. */
    let hfLo=Infinity,hfHi=-Infinity;
    for(let i=0;i<M.nN;i++){
      const nd=M.g.nodes[i], hf=Math.max(M.g.bwsAt(nd.extX)-nd.extY,0);
      hfLo=Math.min(hfLo,hf); hfHi=Math.max(hfHi,hf);
    }
    const wsTerm=(p.gws/1000)*p.tws;
    h+=step({label:"Vertical dead load intensity at a node",ref:"§7.2.7.3B / 4B",
      sym:"w_v=\\gamma_f\\,h_f+\\gamma_{ws}\\,t_{ws}",
      sub:`${num(p.gf/1000,3)}\\,h_f+${num(p.gws/1000,3)}\\times${num(p.tws)}`,
      res:(p.tws>0)?"":`${num(p.gf/1000,3)}\\,h_f`,units:"ksf",
      note:`h_f is the fill height from the extrados up to the bottom of the wearing surface at that node, `+
        `and it varies along the barrel: <b>${nfx(hfLo,3)} ft</b> at the shallowest node to `+
        `<b>${nfx(hfHi,3)} ft</b> at the deepest, so this term runs from `+
        `${nfx((p.gf/1000)*hfLo,4)} to ${nfx((p.gf/1000)*hfHi,4)} k/ft². `+
        ((p.tws>0)
          ? `The wearing surface adds a constant ${nfx(wsTerm,4)} k/ft² on top of that.`
          : `<b>The second term is zero because the wearing surface thickness is entered as 0.</b> `+
            `t_ws is set in the Roadway Grade &amp; Fill panel; with no thickness there is no wearing `+
            `surface weight in the model at all. If the deck carries pavement, enter its thickness there, or `+
            `— if its weight is already included as a line item in the Superimposed Dead Load panel — leave `+
            `it at zero and it is not missing, only accounted for elsewhere.`)+
        ((hfHi<=0)
          ? ` <b>Every fill height in this model is zero</b>, so the fill term vanishes at every node too. `+
            `That is almost certainly a geometry or cover error rather than a real structure — check the `+
            `cover and the rise.`
          : "")});
  }
  h+=step({label:"Superimposed dead load distributed across the barrel",ref:"§7.2.7.4B",
    sym:"w_{sdl}=\\dfrac{\\sum W_i}{b_{arch}}",
    sub:(p.sdl&&p.sdl.length)
      ?`\\dfrac{${p.sdl.map(it=>num(it.w/1000,4)).join("+")}}{${num(p.barrelW,2)}}`
      :`\\dfrac{0}{${num(p.barrelW,2)}}`,
    res:num(M.wSdl,5),units:"ksf",
    note:"§7.2.7.4B: the dead load of sidewalks, wearing surfaces, railings, curbs and spandrel walls is "+
      "computed and equally distributed across the width of the arch. "+
      ((p.sdl&&p.sdl.length)?("Items: "+p.sdl.map(it=>esc(it.n)+" at "+nfx(it.w,0)+" plf").join("; ")+".")
        :"<b>No items entered.</b> If the structure carries sidewalks, railings, curbs or spandrel walls, "+
         "their weight is missing from this analysis — §7.2.7.4B directs that a spandrel wall's structural "+
         "capacity be neglected, not its weight.")});
  h+=step({label:"Ring self-weight per unit arc length",
    sym:"w_s=\\gamma_m\\,d",
    sub:`${num(p.gm/1000,3)}\\times d`,res:"",units:"k/ft",
    note:"Applied along the arc, so the sloping haunch elements carry their true weight."});
  h+=step({label:"Lateral earth pressure intensity",ref:"§7.2.7.5B",
    sym:"p_h=K\\left(\\gamma_f\\,z+\\gamma_{ws}\\,t_{ws}\\right)",
    sub:`${num(p.K)}\\left(${num(p.gf/1000,3)}\\,z+${num(p.gws/1000,3)}\\times${num(p.tws)}\\right)`,
    res:"",units:"ksf",
    note:`K = ${nfx(p.K,2)} per §7.2.7.5B, applied to the ARCH AXIS vertical projection of each element and `+
      "directed inward on both haunches. <b>z is the depth from the grade line down to the arch axis</b> — the "+
      "element the load is applied to — and not h_f, the fill height above the extrados used by the vertical "+
      "fill load above. The two loads reference different surfaces by design: a weight bears on a face, so "+
      "the face is what matters for the fill; §7.2.7.5B applies the lateral pressure to the element, so the "+
      "element is what matters for it. The wearing surface sits on the soil column as a surcharge carrying "+
      "its own unit weight rather than the soil's."+
      ((p.tws>0)?"":" <b>With t_ws = 0 the surcharge term is zero</b>, so the pressure here is from fill alone.")});
  h+=vars([
    ["\\gamma_m","Masonry unit weight",p.gm,"pcf",0],
    ["\\gamma_f","Fill unit weight",p.gf,"pcf",0],
    ["\\gamma_{ws}","Wearing surface unit weight",p.gws,"pcf",0],
    ["K","Lateral earth pressure coefficient",p.K,"—"],
    ["t_{ws}","Wearing surface thickness",p.tws,"ft (entered as "+nfx(inOf(p.tws),1)+" in)"]
  ]);

  h+=`<h4>Consistent element load vectors</h4>`;
  h+=msg("key","Why not lumped nodal loads",
    "§7.2.7.2B and §7.2.7.3B call for loads applied as linearly varying loads on each element. Lumping the "+
    "tributary load to nodes underestimates the fixed-end moments delivered to the springings. The element "+
    "loads are therefore converted to statically consistent end forces.");
  h+=eqLine("Fixed-end forces, trapezoidal transverse load q₁→q₂ over length L",
    "\\begin{aligned}"+
    "V_1&=\\dfrac{L(7q_1+3q_2)}{20}, & M_1&=\\dfrac{L^2(3q_1+2q_2)}{60}\\\\[2pt]"+
    "V_2&=\\dfrac{L(3q_1+7q_2)}{20}, & M_2&=-\\dfrac{L^2(2q_1+3q_2)}{60}"+
    "\\end{aligned}","Standard consistent load vector",
    "Axial components use N₁ = L(2p₁+p₂)/6 and N₂ = L(p₁+2p₂)/6. Loads are resolved into element-local axial "+
    "and transverse components before these expressions are applied.");

  h+=`<h4>Dead load section forces</h4>`;
  h+=msg("wrn","Computed by this program's internal frame solver — not reproduced as hand steps",
    "The section forces below are solved by this program; nothing is taken from an external analysis. They are "+
    "flagged because they are the one part of the calculation that cannot be presented as checkable hand "+
    `arithmetic: this model has ${M.nf} free degrees of freedom over ${M.nEl} elements, and the influence lines `+
    "require a separate solve for every loaded node. Everything downstream of these numbers is "+
    "worked in full. <b>What a reviewer should do:</b> reproduce these values with an independent frame analysis "+
    "rather than by hand. The closed-form and equilibrium evidence for the solver is in Manual Part 7.");

  const rows=[];
  for(let i=0;i<M.nN;i++){
    const e=(M.DL[i].C>1e-9)?Math.abs(M.DL[i].M)/M.DL[i].C:Infinity;
    const f=ARCH.stressMax(M.DL[i].C,M.DL[i].M,M.dn[i]);
    rows.push({__i:i,tag:secTag(M,i),C:M.DL[i].C,V:M.DL[i].V,M:M.DL[i].M,
      e:e,eIn:inOf(e),k:M.dn[i]/6,kIn:inOf(M.dn[i]/6),
      reg:regimeOf(e,M.dn[i]),f:(f===Infinity)?Infinity:f/KSF_PSI});
  }
  h+=dtab([{k:"tag",h:"Section",txt:1},{k:"C",h:"P_DL (k/ft)",dp:3},{k:"V",h:"V_DL (k/ft)",dp:3},
    {k:"M",h:"M_DL (k·ft/ft)",dp:3},{k:"eIn",h:"e (in)",dp:3},{k:"kIn",h:"kern d/6 (in)",dp:3},
    {k:"reg",h:"Regime",txt:1},{k:"f",h:"f_DL (psi)",dp:1}],rows);
  h+=`<div class="note">Thrust is compression-positive. Axial force and shear are resolved on the section
      normal to the arch axis and, at interior nodes, averaged across the two adjacent element ends so the
      result does not depend on which element is used.</div>`;
  return h;
}

/* ============================================================
   4. LIVE LOAD DISTRIBUTION  — fully worked at one node
   ============================================================ */
function liveLoadSectionRail(p,M,veh,pos,dir){
  let h="";
  h+=msg("inf","Railroad distribution",
    "Load passes from the rails into the ties and enters the fill at the bottom of the ties, over the tie "+
    "length transversely and over 3.0 ft longitudinally. Below that level it spreads at 1 horizontal to 1 "+
    "vertical. Where the transverse widths of adjacent tracks overlap, the outer limits are taken and the "+
    "combined load is distributed uniformly across that width.");
  h+=step({label:"Spread depth below the bottom of the ties",
    sym:"h=H-d_{tie}",sub:`H-${num(p.tieDepth,3)}`,res:"",units:"ft",
    note:"H is the cover from the extrados up to the running surface, which for a railroad is the base of "+
      "rail — the datum AREMA measures fill depth below for impact, and the datum the dead load column is "+
      "taken to. The live load enters the fill one tie depth lower, at the tie soffit, so the spread starts "+
      "from h rather than from H."});
  {
  const rr=ARCH.railRate(p), slope=(Math.abs(rr-0.5)<1e-9)?"1H : 2V":((Math.abs(rr-1)<1e-9)?"1H : 1V":nfx(rr,3)+" each side");
  h+=step({label:"Transverse width per track",
    sym:"W_{tr}=L_{tie}+2rh",sub:`${num(p.tieLen,3)}+2\\times${num(rr,2)}h`,res:"",units:"ft",
    note:`Dispersion is ${slope} from each tie end — r = ${nfx(rr,2)} horizontal per unit of depth.`});
  h+=step({label:"Longitudinal length",
    sym:"L_s=3.0+2rh",sub:`3.0+2\\times${num(rr,2)}h`,res:"",units:"ft",
    note:`3.0 ft bearing length at the bottom of the ties, then ${slope}.`+
      (p.railCapLong
        ? " <b>Capped per axle</b> at the track that axle owns — half the spacing to the axle behind plus "+
          "half the spacing ahead — so neighbouring footprints never overlap. Each axle therefore has its "+
          "own L_s and the pressures below are formed axle by axle."
        : " Neighbouring footprints are allowed to overlap and their pressures superpose.")});
  }
  h+=eqLine("Pressure on the extrados",
    "p=\\dfrac{n_{tr}\\sum P_{ax}}{W_{eff}\\,L_s}+\\dfrac{n_{tr}\\,w_{trail}}{W_{eff}}",null,
    "n_tr is the number of tracks sharing a merged width and W_eff is that width, or the single-track width "+
    "where the spreads do not overlap. The second term is the uniform trailing load, which is continuous "+
    "along the track and so is not divided by L_s.");
  h+=vars([
    ["L_{tie}","Tie length",p.tieLen,"ft"],
    ["d_{tie}","Surface to bottom of tie",p.tieDepth,"ft"],
    ["w_{trail}","Uniform trailing load",veh.trail||0,"k/ft"],
    ["n_{track}","Tracks",p.tracks.length,"—",0]
  ]);

  const q=ARCH.nodalLL(M,veh,pos,dir);
  let jm=1,qm=0;
  for(let i=1;i<M.nN-1;i++)if(q[i]>qm){qm=q[i];jm=i;}
  const nd=M.g.nodes[jm], H=M.coverAt(jm), S=ARCH.railSpread(p,H);
  const offs=veh.axles.map(a=>a.x), maxOff=offs[offs.length-1];
  const TB=ARCH.tribSpan(M,jm);
  let Pax=0,nAx=0,PaxOverL=0,LsMin=Infinity,LsMax=0,capped=false;
  veh.axles.forEach((ax,ki)=>{
    const xa=(dir>0)?pos+ax.x:pos+maxOff-ax.x;
    const Lk=ARCH.axleLs(p,veh,ki,H);
    const f=ARCH.coverFrac(TB,xa-Lk/2,xa+Lk/2);
    if(f>0){Pax+=ax.P*f;PaxOverL+=ax.P*f/Lk;nAx++;
      LsMin=Math.min(LsMin,Lk);LsMax=Math.max(LsMax,Lk);
      if(Lk<S.Ls-1e-9)capped=true;}
  });
  if(!isFinite(LsMin))LsMin=S.Ls;
  const gmax=S.groups.reduce((a,b)=>(b.width>=a.width?b:a));
  h+=`<h4>Worked example — node ${secTag(M,jm)}, the most heavily loaded node</h4>`;
  h+=step({label:"Spread depth below the ties",sym:"h=H-d_{tie}",
    sub:`${num(H,3)}-${num(p.tieDepth,3)}`,res:num(S.h,3),units:"ft"});
  h+=step({label:"Transverse width per track",sym:"W_{tr}=L_{tie}+2h",
    sub:`${num(p.tieLen,3)}+2\\times${num(S.h,3)}`,res:num(S.wTrack,3),units:"ft"});
  h+=step({label:"Longitudinal length",sym:"L_s=3.0+2h",
    sub:`3.0+2\\times${num(ARCH.railRate(p),2)}\\times${num(S.h,3)}`,res:num(S.Ls,3),units:"ft",
    note:capped?`Uncapped this is ${nfx(S.Ls,3)} ft, but the cap is in force and the axles reaching this `+
      `node are limited to ${nfx(LsMin,3)}${(LsMax>LsMin+1e-9)?" to "+nfx(LsMax,3):""} ft — each to the `+
      `track it owns.`:""});
  h+=step({label:"Track overlap",sym:"",sub:"",
    res:gmax.merged?`${gmax.n}\ \\text{tracks merged}`:"\\text{no overlap}",
    note:gmax.merged
      ?`The transverse widths of ${gmax.n} tracks overlap; the outer limits give W_eff = ${nfx(gmax.width,3)} ft `+
       `and the combined load of those tracks is distributed uniformly across it.`
      :`Track widths do not overlap, so each track is distributed over its own ${nfx(S.wTrack,3)} ft.`});
  h+=step({label:"Axle load reaching this node",
    sym:"\\sum P_{ax}\\,\\phi_{ax}",sub:`${nAx}\ \\text{axles}`,res:num(Pax,2),units:"kip",
    note:`Each axle spreads over its own L_s`+(capped?` — ${nfx(LsMin,3)}`+
      ((LsMax>LsMin+1e-9)?` to ${nfx(LsMax,3)}`:``)+` ft here, capped`:` = ${nfx(S.Ls,3)} ft`)+
      `, centred on itself, and this node owns the `+
      `${nfx(M.tribH[jm],3)} ft of extrados between the midpoints to its neighbours. φ is the fraction of `+
      `that tributary the axle's footprint covers, so an axle whose footprint ends part way across `+
      `contributes that part and no more. Summing φ over the nodes returns the footprint length exactly, `+
      `which is what keeps the load applied to the model equal to the load on the bridge.`});
  if(veh.trail>0){
    const tailX=(dir>0)?pos+maxOff:pos;
    const behind=((dir>0)?ARCH.coverFrac(TB,tailX,Math.max(TB[1],tailX))
                         :ARCH.coverFrac(TB,Math.min(TB[0],tailX),tailX))>0;
    h+=step({label:"Uniform trailing load at this node",sym:"w_{trail}",
      sub:"",res:behind?num(veh.trail,2):"0",units:"k/ft",
      note:behind?`This node lies behind the consist, so the ${nfx(veh.trail,1)} k/ft trailing load applies. `+
        esc(veh.trailNote||"")
        :`This node is under the consist, ahead of the trailing load, so only axle loads apply here.`});
  }
  h+=step({label:"Pressure on the extrados",
    sym:"p=\\dfrac{n_{tr}\\sum P_{ax}}{W_{eff}L_s}",
    sub:capped?`\\dfrac{${gmax.n}}{${num(gmax.width,3)}}\\sum\\dfrac{P_{ax}\\phi}{L_{s,k}}=\\dfrac{${gmax.n}\\times${num(PaxOverL,4)}}{${num(gmax.width,3)}}`
      :`\\dfrac{${gmax.n}\\times${num(Pax,2)}}{${num(gmax.width,3)}\\times${num(S.Ls,3)}}`,
    res:num(M.tribH[jm]>0?q[jm]/M.tribH[jm]:0,5),units:"ksf",
    note:"Includes the trailing load contribution where it applies."});
  h+=step({label:"Equivalent nodal load on the strip",ref:"§7.2.7.7B",
    sym:"q_j=p\\,b\\,t_j",
    sub:`${num(M.tribH[jm]>0?q[jm]/M.tribH[jm]:0,5)}\\times1.00\\times${num(M.tribH[jm],3)}`,
    res:num(q[jm],5),units:"k/ft"});
  return h;
}
function liveLoadSection(p,M,veh,pos,dir){
  if(veh.mode==="rail"){
    let hh=liveLoadSectionRail(p,M,veh,pos,dir);
    /* The method is explained here and worked once, on the spread only. Impact and
     the influence line superposition are worked at every node in their own
     panels below; repeating them here put the same arithmetic on the page twice
     and made the tab read as two competing accounts of one calculation. */
  hh+=msg("inf","What happens next",
    "The pressure above is only the first step. Impact is applied at every node in the panel that follows, the "+
    "nodal loads are assembled for every axle in the contribution matrix, and the influence line superposition "+
    "that turns them into a moment, thrust and shear at the section of interest is worked term by term further "+
    "down this tab.");
  return hh;
  }
  let h="";
  const ruleOn=ARCH.shallowRuleOn(p);
  const rateSh=ARCH.shallowRate(p);
  const tireBasis=(p.shallowE==="tire");
  const Eslab=ARCH.shallowWidth(p);
  const covMinH=Math.min.apply(null,M.g.nodes.map((n,i)=>M.coverAt(i)));
  h+=msg("inf","Distribution through fill",
    "Wheel loads spread through the fill both longitudinally and transversely per AASHTO Std. Spec. Art. 6.4. "+
    "The spread grows with depth, so the same axle delivers far less pressure to a deep haunch than to the crown. "+
    "Art. 6.4 has two branches, and which one applies is decided by the depth of fill: 6.4.2 gives the 1.75H "+
    "square for 2 ft or more, and 6.4.1 sends anything shallower to Art. 3.24.3 instead.");

  if(ruleOn&&covMinH<ARCH.SHALLOW_FILL){
    h+=msg("warn","Part of this barrel is under the 2 ft threshold",
      `The least cover on this arch is H = ${nfx(covMinH,3)} ft, below the ${nfx(ARCH.SHALLOW_FILL,1)} ft that `+
      "Art. 6.4.2 requires before the 1.75H spread may be used. Where an axle lands over cover shallower than "+
      "that, it is <b>not</b> dispersed longitudinally: Art. 6.4.1 carries it to the ring as a concentrated "+
      "load, distributed only across the width by Art. 3.24.3.2. The regime is decided axle by axle from the "+
      "cover where the wheel lands, so on a barrel like this one an axle over the crown can be concentrated "+
      "while an axle over a deep haunch in the same position is still dispersed. This is the conservative "+
      "reading and, on a shallow arch, usually the one that sets the rating — see the Assumptions note if a "+
      "prior rating used the 1.75H spread everywhere.");
    if(rateSh>0){
      h+=msg("inf","A fill spread credit is being taken below 2 ft, in both directions",
        `The wheel is not treated as arriving on its bare footprint. A dispersion of `+
        `${nfx(rateSh,2)}H is credited <b>symmetrically</b>, so at depth H the footprint grows to `+
        `L_s = ℓ_t + ${nfx(rateSh,2)}H along the span and w_t = b_t + ${nfx(rateSh,2)}H across it. `+
        "The credit is taken in both horizontal directions or in neither: fill does not know which direction "+
        "is which, a dispersion cone through soil is symmetric, and crediting lateral spread while denying "+
        "longitudinal spread through the same material has no basis. "+
        (Math.abs(rateSh-1.75)<1e-9
          ? "At this rate the shallow branch is arithmetically identical to Art. 6.4.2, so the load is "+
            "continuous across the 2 ft threshold and there is no step at H = 2 ft."
          : "This rate is below the Art. 6.4.2 rate of 1.75H, so a step remains at H = 2 ft — smaller than "+
            "with no credit at all, but present.")+
        " Note this is a different question from the transverse width E. E is a load-SHARING assumption — how "+
        "much of the wheel exists on the one-foot strip at all — and sharing needs a structural mechanism in "+
        "the ring, which is where the absence of distribution reinforcement bites. Fill dispersion needs no "+
        "mechanism in the ring, only material above it. The transverse width selector does not apply while a "+
        "spread credit is in force; the width grows from the tire patch at the credited rate.");
      h+=step({label:"Longitudinal spread length, shallow fill",ref:"credited dispersion",
        sym:"L_s=\\ell_t+"+nfx(rateSh,2)+"H",sub:"",res:"",units:"ft"});
      h+=step({label:"Transverse spread width, shallow fill",ref:"credited dispersion",
        sym:"w_t=b_t+"+nfx(rateSh,2)+"H",sub:"",res:"",units:"ft",
        note:"Wheel lines merge over (s_g + w_t) where the spreads overlap, as in Art. 6.4.2 — a fill spread "+
          "is exactly the mechanism that provision has in mind."});
    }else if(tireBasis){
      h+=step({label:"Transverse distribution width, shallow fill",ref:"tire contact width, Std Spec 3.30",
        sym:"E=b_t",sub:"",res:num(Eslab,3),units:"ft",
        note:"No transverse distribution beyond the tire footprint, and no longitudinal dispersion. The wheel "+
          "arrives on the ring as it leaves the tire."});
      h+=msg("inf","Why the footprint and not E = 4 + 0.06S",
        `Art. 6.4.1 sends shallow fill to Art. 3.24.3, whose distribution width E = 4 + 0.06S would be `+
        `${nfx(ARCH.slabWidthE(p.S),2)} ft here. That article is written for <b>reinforced concrete slabs</b>, `+
        "and the width exists because a slab has transverse flexural continuity — Art. 3.24.10 requires "+
        "distribution reinforcement for exactly this purpose — so the strip either side of the wheel is "+
        "dragged into action and shares the load. An unreinforced stone ring has no such mechanism: mortared "+
        "or dry voussoirs, longitudinal joints, and ring separation as a recognized failure mode. Adopting "+
        "the slab width over masonry would import a load path the structure does not possess. "+
        "The reasoning is consistent with the other branch of Art. 6.4: the 1.75H spread does not rely on the "+
        "ring's transverse stiffness either, it relies on the <b>fill</b> to spread the load, which is a soil "+
        "mechanism and works perfectly well over masonry. Below 2 ft there is neither enough fill to spread "+
        "through nor any reinforcement to distribute across, so neither mechanism is available.");
    }else{
      h+=step({label:"Transverse distribution width, shallow fill",ref:"Std Spec 3.24.3.2",
        sym:"E=4+0.06S\\le 7.0",sub:`4+0.06\\times${num(p.S,2)}`,res:num(Eslab,3),units:"ft",
        note:"S is the clear span. The wheel is treated as a concentrated load longitudinally — no fill "+
          "dispersion — and distributed only across the width."});
      h+=msg("warn","Slab distribution width selected over unreinforced masonry",
        "Art. 3.24.3.2 is written for reinforced concrete slabs, and its distribution width presumes the "+
        "transverse flexural continuity that Art. 3.24.10 distribution reinforcement provides. An unreinforced "+
        "stone ring generally does not have that continuity. This setting is appropriate for a ring with "+
        "demonstrated transverse continuity or a structural concrete saddle, and for bracketing a result — it "+
        "is not the program's default and the basis must be stated in the assumptions. On this structure it "+
        `takes the transverse width from ${nfx(ARCH.TIRE_W,3)} ft to ${nfx(ARCH.slabWidthE(p.S),2)} ft, so `+
        `every shallow-cover wheel delivers ${nfx(ARCH.slabWidthE(p.S)/ARCH.TIRE_W,2)} times less load to the strip.`);
    }
    if(rateSh<=0){
    h+=eqLine("Load delivered to the one-foot strip by a concentrated axle",
      "w=\\begin{cases}\\dfrac{P_{ax}/2}{E} & E\\le s_g\\quad\\text{(wheel lines do not reach each other)}\\\\[10pt]"+
      "\\dfrac{P_{ax}}{E} & E> s_g\\quad\\text{(widths overlap — superimposed, not merged)}\\end{cases}",
      "Std Spec 6.4.1 / 3.24.3.2");
    h+=`<div class="note">Note the difference from the 1.75H branch. Art. 6.4.2 states that where distribution
      areas overlap the total load is spread over the outside limits of the combined area, which is why that
      branch divides by (s_g + w_t). Art. 3.24.3.2 contains no such provision: each wheel line gets its own
      width E and a strip inside the overlap carries both by superposition. Overlap arises only once E exceeds
      the ${nfx(ARCH.GAGE,2)} ft gage, that is for a clear span beyond about 33 ft.
      ${(Eslab>ARCH.GAGE)?"<b>On this structure the widths do overlap.</b>":"On this structure they do not overlap."}
      The strip load w is placed at the axle station and shared between the two nodes that bracket it in
      proportion to distance, which is exact for a model whose influence coefficients are defined at nodes. A
      share landing on a springing is dropped — that load goes into the abutment.</div>`;
    }
  }else if(!ruleOn){
    h+=msg("warn","Shallow-cover rule switched off",
      "The 1.75H spread of Art. 6.4.2 is being applied at every depth, including where the cover is less than "+
      `${nfx(ARCH.SHALLOW_FILL,1)} ft. Art. 6.4.1 does not permit that. This setting exists to reproduce a `+
      "legacy rating; it should not be used for a submitted calculation without saying so in the assumptions.");
  }

  h+=step({label:"Longitudinal spread length at depth H",ref:"Std Spec 6.4",
    sym:"L_s=\\ell_t+1.75H",sub:`${num(ARCH.TIRE_L,3)}+1.75H`,res:"",units:"ft"});
  h+=step({label:"Transverse spread width at depth H",ref:"Std Spec 6.4",
    sym:"w_t=b_t+1.75H",sub:`${num(ARCH.TIRE_W,3)}+1.75H`,res:"",units:"ft"});
  h+=eqLine("Pressure on the extrados, wheel lines merged where the spreads overlap",
    "p=\\begin{cases}\\dfrac{P_{ax}}{(s_g+w_t)\\,L_s} & w_t\\ge s_g\\quad\\text{(spreads overlap, axle acts as one patch)}\\\\[10pt]"+
    "\\dfrac{P_{ax}/2}{w_t\\,L_s} & w_t< s_g\\quad\\text{(wheel lines independent)}\\end{cases}",
    "Std Spec 6.4");
  h+=vars([
    ["\\ell_t","Tire contact length",ARCH.TIRE_L,"ft",3],
    ["b_t","Tire contact width",ARCH.TIRE_W,"ft",3],
    ["s_g","Wheel gage",ARCH.GAGE,"ft"],
    ["H","Depth from roadway surface to extrados at the node","varies","ft"],
    ["P_{ax}","Axle load","varies","kip"]
  ]);

  /* ---- fully worked example at the node carrying the most load ---- */
  const q=ARCH.nodalLL(M,veh,pos,dir);
  let jm=1,qm=0;
  for(let i=1;i<M.nN-1;i++)if(q[i]>qm){qm=q[i];jm=i;}
  const nd=M.g.nodes[jm], H=M.coverAt(jm);
  const Ls=ARCH.TIRE_L+1.75*H, wt=ARCH.TIRE_W+1.75*H;
  const merged=(wt>=ARCH.GAGE);
  const offs=veh.axles.map(a=>a.x), maxOff=offs[offs.length-1];
  const contrib=[];
  let concHere=0;
  for(const ax of veh.axles){
    const xa=(dir>0)?pos+ax.x:pos+maxOff-ax.x;
    const reg=ARCH.llRegime(M,xa);
    if(reg.conc){
      /* concentrated axle — this node gets its interpolation share, if any */
      const one=new Array(M.nN).fill(0);
      const w=ARCH.stripLoadConc(ax.P,reg.E);
      const nds=M.g.nodes;
      for(let k=0;k<M.nN-1;k++){
        const a2=nds[k],b2=nds[k+1];
        if((xa>=a2.x&&xa<=b2.x)||(xa<=a2.x&&xa>=b2.x)){
          const den=b2.x-a2.x, t=(Math.abs(den)<1e-12)?0:(xa-a2.x)/den;
          if(k===jm)one[jm]=w*(1-t); else if(k+1===jm)one[jm]=w*t;
          break;
        }
      }
      if(one[jm]>0){concHere+=one[jm];
        contrib.push({ax,xa,conc:true,w,share:one[jm],
          p:(M.tribH[jm]>1e-9)?one[jm]/M.tribH[jm]:0,E:reg.E,Hax:reg.H});}
    }else if(Math.abs(nd.x-xa)<=Ls/2)contrib.push({ax,xa,
      p:merged?ax.P/((ARCH.GAGE+wt)*Ls):(ax.P/2)/(wt*Ls)});
  }
  const pTot=contrib.reduce((a,c)=>a+c.p,0);

  h+=`<h4>Worked example — node ${secTag(M,jm)}, the most heavily loaded node at this truck position</h4>`;
  h+=step({label:"Depth from roadway surface to extrados",
    sym:"H=y_{surf}(x)-y_{ext}",
    sub:`${num(M.g.surfAt(nd.extX),3)}-${num(nd.extY,3)}`,res:num(H,3),units:"ft"});
  h+=step({label:"Longitudinal spread length",ref:"Std Spec 6.4",
    sym:"L_s=\\ell_t+1.75H",sub:`${num(ARCH.TIRE_L,3)}+1.75\\times${num(H,3)}`,res:num(Ls,3),units:"ft"});
  h+=step({label:"Transverse spread width",ref:"Std Spec 6.4",
    sym:"w_t=b_t+1.75H",sub:`${num(ARCH.TIRE_W,3)}+1.75\\times${num(H,3)}`,res:num(wt,3),units:"ft"});
  h+=step({label:"Wheel line overlap check",
    sym:"w_t\\ \\text{vs}\\ s_g",sub:`${num(wt,3)}\\ \\text{vs}\\ ${num(ARCH.GAGE,2)}`,
    res:merged?"\\text{overlap}":"\\text{independent}",
    note:merged?"The transverse spreads of the two wheel lines overlap, so the full axle load is distributed over "+
      "the combined width (s_g + w_t)."
      :"The spreads do not reach each other; each wheel line is distributed over its own width w_t."});
  if(contrib.length===0){
    h+=msg("inf","No axle over this node","At this truck position no axle spread reaches the node.");
  }else{
    contrib.forEach((c,k)=>{
      if(c.conc){
        const mg=(c.E>ARCH.GAGE);
        h+=step({label:`Concentrated axle at x = ${nfx(c.xa,2)} ft (P = ${nfx(c.ax.P,1)} kip, cover there H = ${nfx(c.Hax,3)} ft < ${nfx(ARCH.SHALLOW_FILL,1)} ft)`,
          ref:"Std Spec 6.4.1 / 3.24.3.2",
          sym:mg?"w=\\dfrac{P_{ax}}{E}":"w=\\dfrac{P_{ax}/2}{E}",
          sub:mg?`\\dfrac{${num(c.ax.P,1)}}{${num(c.E,3)}}`
                :`\\dfrac{${num(c.ax.P,1)}/2}{${num(c.E,3)}}`,
          res:num(c.w,4),units:"kip on the strip",
          note:`This node's share of that strip load, by linear interpolation between the two bracketing nodes, `+
            `is ${nfx(c.share,4)} kip — equivalent to a pressure of ${nfx(c.p,4)} ksf over the node's `+
            `${nfx(M.tribH[jm],3)} ft tributary length.`});
      }else{
        h+=step({label:`Pressure from axle at x = ${nfx(c.xa,2)} ft (P = ${nfx(c.ax.P,1)} kip)`,ref:"Std Spec 6.4",
          sym:merged?"p_i=\\dfrac{P_{ax}}{(s_g+w_t)L_s}":"p_i=\\dfrac{P_{ax}/2}{w_t L_s}",
          sub:merged?`\\dfrac{${num(c.ax.P,1)}}{(${num(ARCH.GAGE,2)}+${num(wt,3)})\\times${num(Ls,3)}}`
                    :`\\dfrac{${num(c.ax.P,1)}/2}{${num(wt,3)}\\times${num(Ls,3)}}`,
          res:num(c.p,4),units:"ksf"});
      }
    });
    if(contrib.length>1)
      h+=step({label:"Total pressure at the node (overlapping axle spreads summed)",
        sym:"p=\\sum p_i",sub:contrib.map(c=>num(c.p,4)).join("+"),res:num(pTot,4),units:"ksf",
        note:"Summing overlapping axle pressures rather than redistributing them over a merged area is slightly conservative."});
    h+=step({label:"Equivalent nodal load on the one-foot strip",ref:"§7.2.7.7B",
      sym:"q_j=p\\cdot b\\cdot t_j",
      sub:`${num(pTot,4)}\\times 1.0\\times ${num(M.tribH[jm],3)}`,
      res:num(q[jm],4),units:"k/ft",
      note:`t_j = ${nfx(M.tribH[jm],3)} ft is the tributary horizontal length of node ${secTag(M,jm)}. `+
        "Unit loads are applied at nodes to generate the influence coefficients, per §7.2.7.7B, so the "+
        "distributed pressure is converted to statically equivalent nodal loads."});
  }

  /* The method is explained and worked once here, on the spread only. Impact
     and the influence line superposition are worked at every node in their own
     panels below; repeating them here put the same arithmetic on the page twice
     and made the tab read as two competing accounts of one calculation. */
  h+=msg("inf","What happens next",
    "The pressure above is only the first step. Impact is applied at every node in the panel that follows, "+
    "the nodal loads are assembled for every axle in the contribution matrix, and the influence line "+
    "superposition that turns them into a moment, thrust and shear at the section of interest is worked "+
    "term by term further down this tab.");
  return h;
}

/* ============================================================
   5. PER-VEHICLE RATING  (each vehicle = one fully worked case)
   ============================================================ */
function vehicleSection(p,M,veh,res,vopt){
  vopt=vopt||{};
  /* `res` may be the vehicle's governing result or a result restricted to one
     section. They have the same shape, so everything below works unchanged —
     only the wording has to say which, or the reader will take a section's local
     rating factor for the reported rating. */
  const atSec=!!vopt.atSec, govR=vopt.gov||res;
  const SEC=secTag(M,res.sec);
  let h="";
  if(atSec)
    h+=msg("warn","Worked at the selected section, not this vehicle's governing section",
      `Everything below is for <b>${esc(SEC)}</b>, the section chosen in the bar at the top of the page. `+
      `The rating factor shown is that section's own — the multiplier that would bring ${esc(SEC)} alone to `+
      `the allowable — and it is <b>not</b> the reported rating for this vehicle. `+
      `<b>${esc(veh.name)} rates ${nfx(govR.rf,3)}</b>, governed at <b>${esc(secTag(M,govR.sec))}</b> with the `+
      `lead axle at x = ${nfx(ARCH.leadAxleX(veh,govR.pos,govR.dir),2)} ft. Switch the basis above the vehicle `+
      `panels back to "its own governing section" to work the reported rating instead.`);
  const faKsf=p.fa*KSF_PSI;
  const local=(p.impMode==="local");
  const impU=local?0:ARCH.impactAt(p,M.g.coverCrown+p.tws);

  // axle configuration
  h+=`<h4>Vehicle configuration</h4>`;
  h+=dtab([{k:"n",h:"Axle",txt:1},{k:"x",h:"Spacing from lead axle (ft)",dp:2},{k:"P",h:"Axle load (kip)",dp:2}],
    veh.axles.map((a,i)=>({__i:i,n:"A"+(i+1),x:a.x,P:a.P})));
  h+=`<div class="note">The axle train as this program holds it, spacings cumulative from the lead axle so the
   last row is the overall length. The Vehicles tab draws the same configuration to scale. These were built
   from standard definitions and have not been checked against a controlled copy of the governing figures;
   an error here would move every result and no other check in this program would catch it.</div>`;
  if(veh.mode==="rail"&&veh.trail>0)
    h+=msg("inf","Uniform trailing load",
      `${esc(veh.trailNote||"")} The trailing load acts continuously behind the consist and is swept with it, `+
      "so positions where the consist is off the structure and only the trailing load bears are included in "+
      "the search.");
  const axSum=veh.axles.reduce((s,a)=>s+a.P,0);
  if(veh.mode==="rail"&&Math.abs(axSum/2-veh.tons)>0.5)
    h+=msg("key","Consist weight and rating reference weight are different quantities",
      `The axle train above totals <b>${nfx(axSum,1)} kip = ${nfx(axSum/2,1)} tons</b>, which is the whole `+
      `consist as it sits on the structure. The rating is expressed against `+
      (veh.eRef?`the <b>${nfx(veh.eRef,0)} kip Cooper reference</b>, so RF × ${nfx(veh.eRef,0)} is the E-number `+
        `and the tonnage figure below derives from that same reference rather than from a physical weight.`
        :`<b>one ${nfx(veh.gvw,0)} kip vehicle (${nfx(veh.tons,1)} tons)</b>, because the axle train represents `+
         `several identical units coupled together; the tonnage below is therefore the rated capacity for one `+
         `such vehicle, not for the whole consist.`));
  h+=step({label:veh.mode==="rail"?"Total axle load of the consist":"Gross vehicle weight",
    sym:"W=\\sum P_{ax}",
    sub:veh.axles.length>8?`\\text{sum of }${veh.axles.length}\\text{ axles}`
      :veh.axles.map(a=>num(a.P,1)).join("+"),
    res:num(axSum,1),units:"kip",
    note:`= ${nfx(axSum/2,1)} tons on the structure.`+
      (veh.mode==="rail"?` Rating reference weight: ${nfx(veh.tons,2)} tons`+
        (veh.eRef?` (from the ${nfx(veh.eRef,0)} kip Cooper reference).`:` per vehicle.`):"")});

  // critical position
  h+=`<h4>Critical position search</h4>`;
  h+=msg("inf","How the position is found",
    "The vehicle is swept across the structure in quarter-foot steps in both directions of travel. "+
    (atSec
      ? `At every position the rating factor is evaluated <b>at ${esc(SEC)} only</b>, and the position `+
        "producing the lowest value there is the one reported. The sweep is otherwise identical to the "+
        "governing search, so the two are directly comparable."
      : "At every position the rating factor is evaluated at every node, and the position and section "+
        "producing the lowest rating factor is reported as governing.")+
    " §7.2.7.8B requires live loads to be positioned so as to maximise the load effect at each node.");
  h+=step({label:atSec?`Critical position of the lead axle for ${SEC}`:"Governing position of the lead axle",
    sym:"x_{lead}",sub:"",res:num(ARCH.leadAxleX(veh,res.pos,res.dir),2),units:"ft",
    note:`Direction of travel: ${res.dir>0?"left to right":"right to left (reversed)"}. `+
      (atSec?`Section worked: ${SEC} (selected).`:`Governing section: ${SEC}.`)});

  h+=`<figure><div id="env_${veh.id}" class="plot" style="height:290px"></div>
    <figcaption>Rating factor envelope for ${esc(veh.name)} as the vehicle traverses the structure${
      atSec?", evaluated at "+esc(SEC)+" only":""}. The minimum of this curve is ${
      atSec?"that section's own rating factor":"the reported rating factor"}; the dashed line is
    RF = 1.0.</figcaption></figure>`;

  // rebuild the governing state
  let q=ARCH.nodalLL(M,veh,res.pos,res.dir);
  if(local)q=ARCH.applyLocalImpact(M,q);
  /* Honour adverse-only. The choice of which half is adverse is made PER
     SECTION, so this is an array — one entry per section, each already the
     governing half for that section. With the option off every entry is the
     plain superposition and nothing downstream changes. */
  const LL=[]; for(let k=0;k<M.nN;k++)LL.push(ARCH.llAtSection(M,q,k));

  /* ---- per-item results table: EVERY node (§0.1) ---- */
  h+=`<h4>Results at every section, ${atSec?"critical position for "+esc(SEC):"governing position"}</h4>`;
  const rows=[];
  for(let i=0;i<M.nN;i++){
    const PL=(1+impU)*LL[i].C, ML=(1+impU)*LL[i].M;
    const P=M.DL[i].C+res.rf*PL, Mm=M.DL[i].M+res.rf*ML;
    const e=(P>1e-9)?Math.abs(Mm)/P:Infinity;
    const f=ARCH.stressMax(P,Mm,M.dn[i]);
    const E=(M.DLC&&M.DLC.earth)?M.DLC.earth[i]:{C:0,V:0,M:0};
    rows.push({__i:i,tag:secTag(M,i),d:M.dn[i],dIn:inOf(M.dn[i]),
      PE:E.C,ME:E.M,
      PG:M.DL[i].C-E.C,MG:M.DL[i].M-E.M,
      shE:(Math.abs(M.DL[i].M)>1e-9)?100*E.M/M.DL[i].M:NaN,
