function liveReadout(veh){
  const host=$("liveRead"); if(!host)return;
  const local=(M.p.impMode==="local");
  let q=ARCH.nodalLL(M,veh,animPos,1);
  const qi=local?ARCH.applyLocalImpact(M,q):q;
  const LL=ARCH.llEffects(M,qi);
  const imp=local?0:ARCH.impactAt(M.p,M.g.coverCrown+M.p.tws);
  const faKsf=M.p.fa*0.144;
  let wu=-1,wi=-1;
  for(let i=0;i<M.nN;i++){
    const P=M.DL[i].C+(1+imp)*LL[i].C, Mm=M.DL[i].M+(1+imp)*LL[i].M;
    const f=ARCH.stressMax(P,Mm,M.dn[i]);
    const u=(f===Infinity)?1e9:f/faKsf;
    if(u>wu){wu=u;wi=i;}
  }
  if(wu>peakU){peakU=wu;peakPos=animPos;}
  const S=XSEC.stateAt(M.p,M,veh,animPos,1,xsNode);
  const P=M.DL[xsNode].C+(1+imp)*LL[xsNode].C, Mm=M.DL[xsNode].M+(1+imp)*LL[xsNode].M;
  const e=(P>1e-9)?Math.abs(Mm)/P:Infinity;
  const f=ARCH.stressMax(P,Mm,M.dn[xsNode]);
  const cell=(l,v)=>`<div class="rd"><span>${l}</span><b>${v}</b></div>`;
  host.innerHTML=`<div class="readout">`+
    cell("Worst section now",`${CALC.secTag(M,wi)} &nbsp; f/f<sub>a</sub> = ${nfx(wu,3)}`)+
    cell("Peak seen this run",peakPos==null?"—":`${nfx(peakU,3)} at x = ${nfx(peakPos,2)} ft`)+
    cell(`At cut ${CALC.secTag(M,xsNode)}`,`ΣP ${nfx(P,2)} k/ft &nbsp; ΣM ${nfx(Mm,2)} k·ft/ft`)+
    cell("e / regime",`${isFinite(e)?nfx(e,3):"∞"} ft &nbsp; ${CALC.regimeOf(e,M.dn[xsNode])}`)+
    cell("f at cut",`${(f===Infinity)?"∞":nfx(f/0.144,0)} psi`)+
    cell("Spread at cut",`w<sub>t</sub> ${nfx(S.wt,2)} ft &nbsp; ${S.merged?"merged":"separate"} &nbsp; p ${nfx(S.press,4)} ksf`)+
    `</div>`;
}

/* ---------------- deterioration editor ----------------
   The deteriorated nodes used to be typed as "node, depth, f_a, hinge" per
   line. That format is compact but it is not self-describing: nothing on screen
   says which column is which, an omitted field has to be typed as an empty
   comma, and a transposed pair is silently accepted as a valid but wrong input.
   This renders the same data as a labelled row per node. The canonical text is
   still what is stored, on a hidden field, so every existing path — readDeter,
   the session file, the report — is untouched. */
/* Editor rows carry a STATION, in feet, and optionally a second station making
   a zone. A node number is still accepted so old sessions open, but it is shown
   as a legacy field with the station it currently resolves to beside it, and
   converting is one button. */
function deterRowsFromText(txt){
  return String(txt||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const f=x.split(/[,;]/).map(q=>q.trim());
    const rest=f.slice(1).join(" ").toLowerCase();
    const pos=v=>{const q=parseFloat(v);return (isFinite(q)&&q>0)?String(q):"";};
    const head=f[0].toLowerCase().replace(/\s+/g,"").replace(/ft$/,"");
    let m,x1="",x2="",node="";
    if((m=head.match(/^(?:x=?)?([-+]?[\d.]+)(?:-|\.\.|to)([-+]?[\d.]+)$/))){x1=m[1];x2=m[2];}
    else if((m=head.match(/^(?:x=?|s=?)([-+]?[\d.]+)$/)))x1=m[1];
    else if((m=head.match(/^(?:n=?|node=?|#)(\d+)$/)))node=m[1];
    else if(/^\d+$/.test(head))node=head;
    else if(/^[-+]?[\d.]+$/.test(head))x1=head;
    const cap=/\bcap(acity)?\b/.test(rest);
    const prt=/\bpartial\b|\bprt\b/.test(rest);
    const rel=/\bhinge\b|\bhng\b|\brelease\b|\brls\b/.test(rest)&&!prt;
    return {node,x1,x2,d:pos(f[1]),fa:pos(f[2]),
            treat:(cap?"cap":"sec")+(prt?"+prt":(rel?"+rls":""))};
  });
}
function deterTextFromRows(rows){
  return rows.filter(r=>r.node||r.x1)
    .map(r=>{
      const where=r.node?("n"+r.node):("x "+r.x1+(r.x2?("-"+r.x2):""));
      const t={sec:"", "sec+prt":"partial", "sec+rls":"release",
               cap:"capacity", "cap+prt":"capacity partial",
               "cap+rls":"capacity release"}[r.treat||"sec"];
      return [where,r.d||"",r.fa||"",t].join(", ").replace(/(,\s*)+$/,"");
    }).join("\n");
}
let deterRows=null;
function deterSync(){
  const t=deterTextFromRows(deterRows||[]);
  const hid=$("deter"); if(!hid)return;
  hid.value=t;
  render(); autosave();
}
/* What a row resolved to, rebuilt from the CURRENT model rather than from a
   snapshot taken when the editor was drawn. The editor is only redrawn when its
   structure changes — redrawing it on every keystroke would steal focus mid
   typing — so these cells are refreshed separately at the end of render(), and
   they were previously left showing "x = ? ft at ? elements" because the model
   did not exist the one time the editor was built. */
function deterResolvedCell(r,k){
  const z=((M&&M.deterZones)?M.deterZones[k]:null)||{};
  /* Say back what the number means. "8" in a field labelled Depth is ambiguous
     between 8 in gone and 8 in left, and the two describe opposite structures —
     on a 17 in ring, 8 remaining is a 53% loss and 8 removed is a 9 in ring.
     The reading is stated in words against the sound section so the ambiguity
     cannot survive one glance at the panel. */
  let dep="";
  if(r.d!==""&&+r.d>0&&z.dSound>0){
    const rem=+r.d, snd=inOf(z.dSound), pct=100*(1-rem/snd);
    dep=(rem>snd)
      ? `<div class="h" style="color:var(--text-warning)"><b>${nfx(rem,1)} in remaining exceeds the `+
        `${nfx(snd,1)} in sound section</b> — this entry would add material. This field is what is LEFT, `+
        `not what is gone.`+
        /* Only offer the arithmetic when it produces a real section. A "loss"
           of 20 in on a 17 in ring leaves nothing, and suggesting -3 in is
           worse than saying so. */
        ((snd-rem>0)
          ? ` If ${nfx(rem,1)} in is the amount lost, enter the remainder, ${nfx(snd-rem,1)} in.`
          : ` If ${nfx(rem,1)} in is the amount lost, that is the whole ring and more — nothing would `+
            `remain to rate.`)+
        `</div>`
      : `<div class="h"><b>${nfx(rem,1)} in remaining</b> of ${nfx(snd,1)} in sound — `+
        `${nfx(pct,0)}% of the depth gone</div>`;
  }
  let rel="";
  if(r.treat&&r.treat.indexOf("rls")>=0)
    rel=`<div class="h"><b>This node is a HINGE.</b> The moment is released completely — all or nothing, and `+
      `not scaled by the depth entered. On the Influence Lines tab the moment row for this section reads `+
      `zero across every load position, which is what a hinge means. Choose a partial release if you want `+
      `the release derived from the section loss instead.</div>`;
  else if(r.treat&&r.treat.indexOf("prt")>=0){
    /* Show the spring and, more importantly, the zone length it came from —
       L_j drives the answer far harder than the depth does, and a point entry
       silently defaults it. */
    const Lel=(M&&M.nEl)?M.g.Ltot/M.nEl:1;
    const Ei=(M&&M.p?M.p.E:1500)*144;
    const Isnd=(z.dSound>0)?Math.pow(z.dSound,3)/12:0;
    const ratio=(z.kTheta&&Isnd>0)?z.kTheta/(4*Ei*Isnd/Lel):null;
    rel=`<div class="h"><b>Partial release, derived.</b> `+
      (z.kTheta
        ? `The loss over <b>${nfx(inOf(z.Lj),1)} in</b> of ring gives a joint spring of `+
          `${nfx(ratio,3)} &times; 4EI/L`+
          (z.x2>z.x1?"":" — no zone was entered, so the length was taken as the depth removed")+
          `. `
        : ``)+
      `k&theta; = E&middot;I&middot;I_c / [L_j(I &minus; I_c)], from the sound depth, the depth still `+
      `bearing and the length of the loss. <b>The zone length matters more than the depth:</b> a narrow `+
      `joint is stiff however deep the loss, so widen or narrow From/To x and watch this figure. Below `+
      `about 0.05 &times; 4EI/L the joint is nearly a hinge; above about 0.5 it is nearly rigid.</div>`;
  }
  if(r.node)
    return `<span class="mono">node ${r.node}</span><div class="h">legacy — x = ${
      z.x1!=null?nfx(z.x1,2):"?"} ft at ${M?M.nEl:"?"} elements, and it MOVES if that changes</div>`
      +dep+rel;
  if(z.node==null)return `<div class="h">—</div>`+dep+rel;
  return `<span class="mono">${(CALC&&CALC.secTag&&M)?CALC.secTag(M,z.node):"node "+(z.node+1)}</span>`+
    (z.snapFt>0.01?`<div class="h">${nfx(z.snapFt,2)} ft from the entered station</div>`:"")
    +dep+rel;
}

function deterRender(){
  const host=$("deterEditor"); if(!host)return;
  if(deterRows==null)deterRows=deterRowsFromText($("deter")?$("deter").value:"");
  const xLo=(M&&M.g)?M.g.xmin:0, xHi=(M&&M.g)?M.g.xmax:0;
  const anyLegacy=deterRows.some(r=>r.node);
  /* TWO LINES PER ENTRY, not a seven-column table. The input column is around
     360 px and a row carrying two stations, two magnitudes, a treatment dropdown
     and a delete button cannot fit across it — in v10w the last columns sat off
     the edge of the panel with no horizontal scrollbar to reveal them. Where and
     how much go on the first line; the treatment and what it resolved to on the
     second. Both lines wrap, so it survives a narrow window as well as a wide
     one. */
  let h=`<div class="dtRows">`;
  deterRows.forEach((r,k)=>{
    h+=`<div class="dtRow">
      <div class="dtLine1">

        <label>Remaining depth<span class="h">in — what is LEFT</span>
          <input class="dtD" data-k="${k}" type="number" min="0" step="0.5" value="${esc(r.d)}"></label>
        <label><span>f<sub>a</sub></span><span class="h">psi, blank = sound</span>
          <input class="dtFa" data-k="${k}" type="number" min="0" step="5" value="${esc(r.fa)}"></label>
        <button class="dtDel" data-k="${k}" title="remove this row">&#10005;</button>
      </div>
      <div class="dtLine2">
        <label class="dtTreat">Treatment
          <select class="dtT" data-k="${k}">${
            /* "End release" and "hinge" are the same thing and using both names
               invited exactly one question: why is there a hinge when I asked
               for a release. The word hinge is now in the label. */
            [["sec","Section loss — stone gone, no release"],
             ["sec+prt","Section loss + partial release (derived)"],
             ["sec+rls","Section loss + FULL HINGE"],
             ["cap","Capacity only — joint degraded, no release"],
             ["cap+prt","Capacity + partial release (derived)"],
             ["cap+rls","Capacity + FULL HINGE"]].map(o=>

  h+=`<div class="btnrow"><button id="dtAdd">Add deteriorated zone</button>${
      anyLegacy?`<button id="dtConv" class="pri">Convert node numbers to stations</button>`:""}${
      deterRows.length?`<button id="dtClear">Clear all</button>`:""}</div>`;

  h+=`<div class="h" style="margin-top:4px">Stations are in feet along the span, `+
     `${nfx(xLo,2)} to ${nfx(xHi,2)} ft on this arch; reduced depths are in inches. Give one station for a `+
     `point of loss or two for a `+
     `zone; the section feathers back to sound at 45&deg; outside it. A station stays where you put it when `+
     `the element count changes — a node number does not.</div>`;
  if(anyLegacy)h+=`<div class="h" style="margin-top:4px;color:var(--text-warning)">`+
     `Rows keyed to a node number are shown greyed. Convert them before refining the mesh.</div>`;
  if(!deterRows.length)
    h+=`<div class="h" style="margin-top:4px">No deterioration entered — the ring is being rated as sound.</div>`;
  host.innerHTML=h;
  const bind=(cls,fn)=>host.querySelectorAll(cls).forEach(e=>e.onchange=()=>{fn(deterRows[+e.dataset.k],e);deterSync();});
  bind(".dtX1",(r,e)=>{r.x1=e.value;});
  bind(".dtX2",(r,e)=>{r.x2=e.value;});
  bind(".dtD",(r,e)=>{r.d=e.value;});
  bind(".dtFa",(r,e)=>{r.fa=e.value;});
  bind(".dtT",(r,e)=>{r.treat=e.value;});
  host.querySelectorAll(".dtDel").forEach(e=>e.onclick=()=>{
    deterRows.splice(+e.dataset.k,1); deterSync(); deterRender();});
  if($("dtAdd"))$("dtAdd").onclick=()=>{
    deterRows.push({node:"",x1:"",x2:"",d:"",fa:"",treat:"sec"}); deterRender();};
  if($("dtConv"))$("dtConv").onclick=()=>{

      if(!r.node)return;

function restore(o){
  if(!o||!o.fields)throw new Error("This file is not a Stone Arch LR project file.");
  /* The vehicle list and the track panel are built for one loading mode, so the
     panel has to be rebuilt for the saved mode BEFORE values are written back.
     Restoring into a panel built for the other mode silently drops the whole
     vehicle selection, because none of the saved ids match a checkbox. */
  F.loadMode=(o.fields.loadMode==="rail")?"rail":"hwy";
  if(o.fields.vehicles!=null)F.vehicles=String(o.fields.vehicles);
  $("inPanel").innerHTML=inputPanel();
  UI.wire($("inPanel"));
  /* A session saved before v2026.08.10 may carry shallowRule = "spread", the
     old control that applied the 1.75H spread at every depth. That control is
     gone; the identical result is now a credited spread of 1.75H. Map it, so an
     old file reopens to the same numbers rather than silently to the default. */
  if(o.fields&&o.fields.shallowRule==="spread"&&o.fields.shallowRate==null)
    o.fields.shallowRate="1.75";
  /* UNIT MIGRATION — ring depth, wearing surface thickness and the depth half
     of every override and deterioration entry were stored in FEET up to and
     including v2026.08.10j, and are entered in INCHES from v2026.08.10k. A file
     written before the change would otherwise be read as a 1.42 INCH ring, and
     the program would rate it without complaint, so this is not optional.

     Build ids sort lexically in this scheme, which is why a string compare is
     sufficient and safe. A file with no build id predates all of this and is
     migrated too. */
  {
    /* Cleared on every restore. It is a statement about THIS file; leaving the
       previous file's flag standing put the conversion banner on files that
       were never converted, which teaches the reader to ignore it. */
    unitMigrated=null; tieReverted=null;
    const b=String((o&&o.build)||"");
    const legacyFeet=(!b)||(b<"v2026.08.10k");
    if(legacyFeet&&o.fields){
      const cv=(v)=>{const q=parseFloat(v);return isFinite(q)?String(+(q*IN_PER_FT).toFixed(4)):v;};
      for(const k of INCH_FIELDS)if(o.fields[k]!=null&&o.fields[k]!=="")o.fields[k]=cv(o.fields[k]);
      /* Overrides are "station, depth" pairs — the station stays in feet. */
      if(o.fields.dOver)o.fields.dOver=String(o.fields.dOver).split(/\n+/).map(L=>{
        const f=L.split(/[,;]/); if(f.length<2)return L;
        f[1]=" "+cv(f[1].trim()); return f.join(",");
      }).join("\n");
      /* Deterioration is "where, depth, f_a, hinge" — only field 2 is a depth. */
      if(o.fields.deter)o.fields.deter=String(o.fields.deter).split(/\n+/).map(L=>{
        const f=L.split(/[,;]/); if(f.length<2)return L;
        if(f[1].trim()!=="")f[1]=" "+cv(f[1].trim()); return f.join(",");

       data into a ballast depth in INCHES plus a separate tie height, and was
       withdrawn in favour of the single "surface to bottom of tie" in FEET that
       preceded it. A file written by that build carries tieDepth = 7 meaning
       seven inches; read as seven feet it exceeds the cover on most barrels, the
       spread depth clamps to zero, and the live load lands on the ring as a
       point load with no dispersion at all. The presence of a tieH field is the
       marker — no other build writes one — so it is a reliable test regardless
       of how the build string sorts. */
    if(o.fields&&o.fields.tieH!=null&&o.fields.tieDepth!=null&&o.fields.tieDepth!==""){
      const q=parseFloat(o.fields.tieDepth);
      if(isFinite(q))o.fields.tieDepth=String(+(q/IN_PER_FT).toFixed(4));
      delete o.fields.tieH;
      tieReverted=(b||"an unversioned file");
    }
  }
  for(const k in o.fields){const el2=$(k); if(el2&&k!=="vehicles")el2.value=o.fields[k];}
  if($("loadMode"))$("loadMode").value=F.loadMode;
  if(o.fields.vehicles!=null){
    const list=String(o.fields.vehicles).split(",").filter(Boolean);
    const boxes=[...document.querySelectorAll(".vchk")];
    boxes.forEach(c=>{c.checked=list.includes(c.value);});
    // a saved file from an older build, or one whose ids no longer exist,
    // must not silently leave every vehicle unselected
    if(boxes.length&&!boxes.some(c=>c.checked))boxes.forEach(c=>{c.checked=true;});
  }
  if(o.title)TB.forEach(t=>{if($(t)&&o.title[t]!=null)$(t).value=o.title[t];});
  /* Re-run the Midas comparison on restore. Previously the pasted text was
     restored but the comparison was not, so a session reopened with results in
     the box reported "no Midas results imported". */
  if(o.midas){impText=o.midas.text||"";mctOpt.includeDL=o.midas.dl!==false;
    if(impText&&impText.trim()){try{
      impParsed=MCT.parseResults(impText); impErr="";
    }catch(e){impErr=e.message;impParsed=null;}}

  if(o.collapse)UI.restore(o.collapse);
  if(o.tab)activeTab=o.tab;
  if(o.project!=null)curProj=o.project;
  if(o.chartEngine)chartEngine=o.chartEngine;
  if(o.focusNode!=null)focusNode=o.focusNode;
  if(o.focusVeh)focusVeh=o.focusVeh;
  if(o.focusPos!=null)focusPos=o.focusPos;
  if(o.focusDir)focusDir=o.focusDir;
  if(o.axHideZero!=null)axHideZero=!!o.axHideZero;
  if(o.axShow)axShow=o.axShow;
  if(o.rateBasis)rateBasis=o.rateBasis;
  if(o.diag){dgState=Object.assign({show:{dl:true,ev:true,el:true,dlt:true,ll:true,tot:true,env:true},

  if(o.fig){if(o.fig.layers)mfLayers=Object.assign({},o.fig.layers);

     imported JSON — and not every one of those paths called it. */
  if(typeof showAutoInfo==="function")showAutoInfo();
}
let storageOK=null;
function storageWorks(){
  if(storageOK!=null)return storageOK;
  try{localStorage.setItem("stoneArchLR.probe","1");
    storageOK=(localStorage.getItem("stoneArchLR.probe")==="1");
    localStorage.removeItem("stoneArchLR.probe");}
  catch(e){storageOK=false;}
  return storageOK;
}
function autosave(){
  if(!storageWorks())return;

}
function showAutoInfo(){
  const e=$("autoInfo"); if(!e)return;
  /* The unit notice comes FIRST and is independent of everything else. It used
     to sit at the end of the storage-available branch, so on a browser with no
     local storage — which is every copy opened straight off a disk in Chrome —
     the storage warning returned early and the reader was never told their
     depth fields had been multiplied by twelve. */
  const rMsg=tieReverted
    ? `<div class="warn" style="margin-bottom:4px"><b>Tie data restored to the earlier form.</b> This file was
       written by ${esc(tieReverted)}, a build that briefly split the tie data into a ballast depth in inches
       plus a separate tie height. That split has been withdrawn: the tie geometry is once again the single
       <b>depth from the running surface to the bottom of the tie, in feet</b>, and the value in this file has
       been converted back. Check it against your section before rating.</div>`
    : "";
  const uMsg=unitMigrated
    ? `<div class="warn" style="margin-bottom:4px"><b>Units converted on opening.</b> This file was written
       by ${esc(unitMigrated)}, which stored ring depth, wearing surface thickness and every override and
       deterioration depth in <b>feet</b>. This build enters them in <b>inches</b>, so those fields were
       multiplied by 12 as the file opened. Stations, spans, rises and covers are unchanged — they were and
       remain in feet. Check the depth fields against your drawings before rating; once saved by this build
       the file carries the new units and will not be converted again.</div>`
    : "";
  if(!storageWorks()){
    e.innerHTML=rMsg+uMsg+`<span class="warn">This browser is not allowing local storage, so nothing is being saved
      automatically and named projects will not persist.</span> Chrome treats each file opened from disk as its
      own origin; putting the app on a shared drive or a server, or using Export JSON after each session, keeps
      your work.`;
    return;
  }
  const when=restoredAt?new Date(restoredAt):null;
  e.innerHTML=`Work is saved automatically as you go`+
    (curProj?` under <b>${esc(curProj)}</b>`:` (unnamed — enter a name and press Save to keep a copy)`)+
    `. `+(when?`This session was restored from ${esc(when.toLocaleDateString())} `+
      `${esc(when.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}))}.`:"");

    if($("tbDate"))$("tbDate").value=new Date().toISOString().slice(0,10);
    bind(); wireProject(); refreshProjSel(); showAutoInfo(); syncCond(); render(); autosave();
    projMsg("New calculation started.");
  };
  $("bSave").onclick=()=>{
    const nm=($("projName").value||"").trim();
    if(!nm){projMsg("Enter a project name first.",true);$("projName").focus();return;}
    const ps=projects(), existed=!!ps[nm];
    curProj=nm; ps[nm]=snapshot(); setProjects(ps); refreshProjSel(nm);
    autosave(); showAutoInfo();
    projMsg(existed?`Updated "${nm}".`:`Saved "${nm}".`);
  };
  const doLoad=()=>{
    const nm=$("projSel").value; const ps=projects();
    if(!nm||!ps[nm]){projMsg("Select a saved project first.",true);return;}
    try{curProj=nm;restore(ps[nm]);curProj=nm;$("projName").value=nm;
      render();autosave();refreshProjSel(nm);showAutoInfo();
      projMsg(`Loaded "${nm}".`);}
    catch(e){projMsg(e.message,true);}
  };
  $("bLoad").onclick=doLoad;
  $("projSel").ondblclick=doLoad;
  $("projSel").onchange=()=>{                 // selecting fills the name box
    const nm=$("projSel").value;
    if(nm){$("projName").value=nm;syncSaveBtn();}
  };
  $("projName").oninput=syncSaveBtn;
  $("bDel").onclick=()=>{
    const nm=$("projSel").value; const ps=projects();
    if(!nm||!ps[nm]){projMsg("Select a saved project first.",true);return;}
    if(!confirm(`Delete the saved project "${nm}"? This cannot be undone.`))return;
    delete ps[nm]; setProjects(ps); refreshProjSel();
    if(($("projName").value||"").trim()===nm)$("projName").value="";
    if(curProj===nm){curProj="";autosave();showAutoInfo();}
    projMsg(`Deleted "${nm}".`);
  };
  $("bExp").onclick=()=>{
    const o=snapshot();
    const blob=new Blob([JSON.stringify(o,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(($("tbProject").value||"stone-arch-rating").replace(/[^\w.-]+/g,"_"))+".json";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  $("bImp").onclick=()=>$("fImp").click();
  $("fImp").onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{try{restore(JSON.parse(fr.result));render();autosave();}
      catch(err){alert("Could not read that file: "+err.message);}};
    fr.readAsText(f); e.target.value="";
  };
}
function projMsg(t,warn){
  const e=$("projMsg"); if(!e)return;
  e.innerHTML=warn?`<span class="warn">${esc(t)}</span>`:esc(t);
  if(t)setTimeout(()=>{if($("projMsg"))$("projMsg").innerHTML="";},4000);
}

let rptSel=null;
function reportModal(){
  const sel=rptSel||{};

  results.forEach(r=>{if(sel["rv_"+r.id]==null)sel["rv_"+r.id]=true;});
  let h=`<h3>Report contents</h3>
    <p style="font-size:.96rem">Select what the printed report contains. The title block and the disclaimer
    footer always print. Deselected sections are removed and the remainder renumber sequentially.</p>`;
  h+=`<div class="grp">`+RPT_SECTIONS.map(s=>
    `<label><input type="checkbox" data-r="${s[0]}"${sel[s[0]]?" checked":""}> ${esc(s[1])}</label>`).join("")+`</div>`;
  if(results.length)h+=`<div class="grp"><b style="font-size:.97rem">Per-vehicle detail</b>`+
    results.map(r=>{const v=ARCH.ALL_VEHICLES.find(x=>x.id===r.id);
      return `<label class="lvl2"><input type="checkbox" data-r="rv_${r.id}"${sel["rv_"+r.id]?" checked":""}> ${esc(v.name)} — RF ${nfx(r.rf,3)}</label>`;}).join("")+`</div>`;
  h+=`<div class="btnrow"><button class="pri" id="mkRpt">Build report &amp; print</button>
      <button id="mkCancel">Cancel</button></div>`;
  $("modal").innerHTML=h; $("modalBg").classList.add("on");
  $("modal").querySelectorAll("[data-r]").forEach(cb=>cb.onchange=()=>{sel[cb.getAttribute("data-r")]=cb.checked;});
  rptSel=sel;
  $("mkCancel").onclick=()=>$("modalBg").classList.remove("on");
  $("mkRpt").onclick=()=>{$("modalBg").classList.remove("on");
    /* The Rating Summary pane is lazy — it is skipped unless its tab is open,
       because it costs a position sweep per vehicle. A report must never be
       lazy, so the flag forces it to build whether or not the operator ever
       visited the tab. */
    window.__buildingReport=true;

/* Every figure container copied into the report is a fresh empty element, so it
   has to be drawn again. Only the vehicle schematics and the earth pressure
   figure were being redrawn, which left the force diagrams, the kern figure, the
   influence line charts and the rating envelopes printing as empty boxes with
   captions underneath. The static renderer is used throughout: the report must
   not depend on an async Plotly render resolving before window.print() fires,
   and the static output prints at full resolution. */
function drawReportFigures(rh,p){
  if(!rh||!M)return;
  const mkSvg=(host,vb)=>{
    host.innerHTML="";
    const sv=document.createElementNS("http://www.w3.org/2000/svg","svg");
    sv.setAttribute("viewBox",vb);
    sv.setAttribute("style","width:100%;height:auto");
    host.appendChild(sv);
    return sv;
  };
  const each=(selq,fn)=>{ rh.querySelectorAll(selq).forEach(el2=>{ try{fn(el2);}catch(e){} }); };
  each("[id^='figVeh_']",el2=>{
    const v=ARCH.ALL_VEHICLES.find(q=>q.id===el2.id.replace("figVeh_",""));
    if(v)VEHTAB.draw(el2,v);
  });
  each("[id='figLat']",el2=>LATERAL.drawFig(el2,p,M));
  if(dgState&&dgState.__veh){
    const st=Object.assign({},dgState,{veh:dgState.__veh,rf:dgState.__rf,
      node:focusNode,pos:focusPos,dir:focusDir});
    const hosts=[["figDgM","M",340],["figDgV","V",320],["figDgP","P",320]];
    hosts.forEach(spec=>{
      each("[id='"+spec[0]+"']",el2=>{
        const s=DIAG.series(p,M,st,spec[1]);
        let ser=[];
        if(s.env)ser=[{x:s.env.x,y:s.env.hi,name:"envelope",color:"#c98b8b",dash:"4 3",w:1.2},
                      {x:s.env.x,y:s.env.lo,name:"",color:"#c98b8b",dash:"4 3",w:1.2}];
        ser=ser.concat(s.traces.map(t=>({x:t.x,y:t.y,name:t.name,color:t.color,w:t.width||2})));
        svgChart(el2,ser,{zero:true,height:spec[2],xlabel:s.xlabel,ylabel:s.ylabel});
      });
    });
    each("[id='figKern']",el2=>{
      const i=focusNode;
      const q0=ARCH.nodalLL(M,st.veh,focusPos,focusDir);
      const loc=(p.impMode==="local");
      const qq=loc?ARCH.applyLocalImpact(M,q0):q0;
      const L2=ARCH.llEffects(M,qq);
      const im=loc?0:ARCH.impactAt(p,M.g.coverCrown+p.tws);
      const P=M.DL[i].C+(1+im)*L2[i].C;
      const Mm=M.DL[i].M+(1+im)*L2[i].M;
      KERNFIG.draw(mkSvg(el2,"0 0 980 430"),P,Mm,M.dn[i],
        (M.faN&&M.faN[i])||p.fa,CALC.secTag(M,i));
    });
  }
  const S=ilSecSel, xs=M.g.nodes.map(n=>n.x);
  each("[id='figIL'],[id='ilBigPlot'],[id='figILWalk']",el2=>{
    svgChart(el2,[
      {x:xs,y:M.ILM[S],name:"moment (left)",color:"#1f4e79",marker:true},
      {x:xs,y:M.ILC[S],name:"thrust (right)",color:"#9c1c1c",axis2:true,marker:true},
      {x:xs,y:M.ILV[S],name:"shear (right)",color:"#1f6b32",axis2:true,dash:"3 3",w:1.6}
    ],{zero:true,align:true,height:340,vmarks:[M.g.nodes[0].x,M.g.nodes[M.nN-1].x],
       xlabel:"position of the 1 kip load, along the arch axis (ft)",
       ylabel:"\u03b7M  (ft)  \u2014 left",ylabel2:"\u03b7P, \u03b7V  \u2014 right"});
  });
  each("[id^='env_']",el2=>{
    const r=results.find(q=>("env_"+q.id)===el2.id);
    if(!r||!r.rfByPos||!r.rfByPos.length)return;
    const xs=r.rfByPos.map(w=>w.pos), ys=r.rfByPos.map(w=>Math.min(w.rf,20));
    svgChart(el2,[
      {x:xs,y:ys,name:"rating factor",color:"#9c1c1c",w:2.2},
      {x:[xs[0],xs[xs.length-1]],y:[1,1],name:"RF = 1.0",color:"#1f6b32",dash:"5 3",w:1.4}
    ],{height:250,xlabel:"reference axle position (ft)",ylabel:"rating factor"});
  });
}
function buildReport(sel){
  const p=readP();
  const t=id=>$(id)?esc($(id).value||"—"):"—";
  let n=0; const N=()=>++n;
  let h=`<div class="rpt"><div id="rptHead">
    <div class="t">Stone Masonry Arch Load Rating</div>
    <div style="font-size:.97rem">Allowable Stress Method, Inventory Level &middot;
      MassDOT Bridge Manual Part I §7.2.7 &middot; AASHTO MBE Art. 6A.9.1</div>
    <table><tr><td><b>Project</b></td><td>${t("tbProject")}</td><td><b>Computed by</b></td><td>${t("tbBy")}</td><td><b>Date</b></td><td>${t("tbDate")}</td></tr>
    <tr><td><b>Subject</b></td><td>${t("tbSubject")}</td><td><b>Checked by</b></td><td>${t("tbChk")}</td><td><b>Date</b></td><td>${t("tbChkDate")}</td></tr>
    <tr><td><b>Task</b></td><td colspan="5">${t("tbTask")}</td></tr></table></div>`;

  const sec=(title,body)=>`<h2>${N()}. ${title}</h2>${body}`;

  if(sel.r_inputs){
    const rows=[];
    const add=(k,v,u)=>rows.push({__i:rows.length,k,v,u:u||""});
    /* Load mode leads the echo: it is the single most consequential switch in
       the file — it changes the vehicle library, the distribution rule and the
       impact provision — and it was not recorded at all. */
    add("Loading",p.loadMode==="rail"?"Railroad (AREMA distribution and impact)":"Highway (AASHTO Std. Spec.)");
    add("Geometry source",p.geoMode==="measured"?"Measured points, best fit":"Idealized "+p.shape);
    if(p.geoMode==="measured"){add("Survey points",p.measPts.length,"points");
      add("Fit selection",p.fitSel);}
    add("Clear span",nfx(M.g.span,3),"ft"); add("Rise",nfx(M.g.rise,3),"ft");
    add("Springing restraint",p.support);
    add("Elements",M.nEl,""); add("Ring depth at crown",nfx(inOf(p.dC),2),"in");
    add("Ring depth at springings",nfx(inOf(p.dS),2),"in");
    if(p.dOver.length)add("Ring depth overrides",p.dOver.map(o=>`${nfx(o.x,2)} ft → d = ${nfx(inOf(o.d),2)} in`).join("; "));
    add("Grade definition",p.gradeMode==="crown"?"Crown cover + slope":"Cover at each springing");
    if(p.gradeMode==="crown")
      add("Springing cover fields","not used — crown mode; the springing cover is computed from the geometry","");
    else add("Crown cover field","not used — springing-cover mode","");
    add("Grade",nfx(M.g.grade*100,3),"%"); add("Cover at crown",nfx(M.g.coverCrown,3),"ft");
    add("Wearing surface",nfx(inOf(p.tws),2),"in");
    add("Barrel width",nfx(p.barrelW,2),"ft");
    add("Beam theory",p.shearDef?"Timoshenko (shear deformation included)":"Bernoulli (no shear deformation)");
    if(p.sdl.length){p.sdl.forEach(it=>add("SDL — "+it.n,nfx(it.w,1),"plf"));
      add("SDL distributed",nfx(M.wSdl*1000,2),"psf");}
    else add("Superimposed dead load","none entered","");
    add("Masonry unit weight",nfx(p.gm,1),"pcf"); add("Fill unit weight",nfx(p.gf,1),"pcf");
    add("Wearing surface unit weight",nfx(p.gws,1),"pcf");
    add("Lateral earth pressure K",nfx(p.K,3),""); add("Modulus E",nfx(p.E,0),"ksi");
    add("Impact basis",p.impMode==="crown"?"Crown fill, uniform":"Local fill per node");
    add("Live load placement",p.llAdverse
      ? "ADVERSE INFLUENCE ONLY — live load applied only at nodes whose moment influence "+
        "aggravates the section being checked; nodes of opposing influence are unloaded"
      : "Whole vehicle as it sits, all nodes loaded");
    add("Impact rule",p.loadMode==="rail"
      ? "AREMA, IM = [1 − (H − 1.5)/8.5] × 0.60 below base of rail"
      : "AASHTO Std. Spec. 3.8.2.3, stepped by depth of fill");
    if(p.loadMode==="rail"){
      add("Tie length",nfx(p.tieLen,2),"ft");
      add("Surface to bottom of tie",nfx(p.tieDepth,3),"ft");
      add("Distribution through ballast and fill",
        (Math.abs(ARCH.railRate(p)-0.5)<1e-9)?"1H : 2V (AREMA) — 0.5 each side per unit depth"
        :((Math.abs(ARCH.railRate(p)-1)<1e-9)?"1H : 1V (45\u00b0) — 1.0 each side per unit depth"
          :nfx(ARCH.railRate(p),3)+" each side per unit depth"));
      add("Tracks loaded",(p.tracks&&p.tracks.length)?p.tracks.length:1,"");
      add("Track offsets from centerline",
        (p.tracks&&p.tracks.length)?p.tracks.map(x=>nfx(x,2)).join(", "):"0.00 (assumed single track on centerline)","ft");
    }
    add("Allowable stress f_a",nfx(p.fa,0),"psi");
    ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id)).forEach(v=>{
      add("Rating vehicle — "+v.name,
        v.axles.length+" axles, "+nfx(v.axles.reduce((s,q)=>s+q.P,0),1)+" kip total"+
        (v.trail>0?", trailing load "+nfx(v.trail,2)+" k/ft":""),"");
    });
    /* Deterioration must be echoed. A model carrying moment-release hinges is a
       structurally different model, and it was previously printing with no
       record that hinges had been used at all. */
    if(p.deter&&p.deter.length){
      /* The face only matters where the loss enters the GEOMETRY. On a model
         whose entries are all capacity-mode the axis never moves, and echoing a
         face implies a geometry change that did not happen. */
      const anySection=p.deter.some(e=>e.mode!=="capacity"&&e.d>0);
      add("Deterioration — material lost from",
        anySection
          ? (p.deterFace==="extrados"?"Extrados (axis drops)":
             (p.deterFace==="both"?"Both faces equally (axis unchanged)":"Intrados (axis rises)"))
          : "not applicable — every entry is capacity-only, so no depth reduction enters the "+
            "geometry and the arch axis is unmoved");
      /* Echo what the entry RESOLVED TO, not what was typed. An entry names a
         place on the arch; the reader has to be able to see which place, in
         feet, and which node ended up carrying it. */
      const Z=(M&&M.deterZones)?M.deterZones:[];
      p.deter.forEach((e,k)=>{
        const z=Z[k]||{};
        const bits=[];
        if(e.d>0)bits.push("remaining depth "+nfx(inOf(e.d),2)+" in");
        if(e.fa>0)bits.push(Math.abs(e.fa-p.fa)<1e-9
          ?"allowable stress "+nfx(e.fa,0)+" psi — same as the global value, so no reduction is applied"
          :"allowable stress reduced to "+nfx(e.fa,0)+" psi from the global "+nfx(p.fa,0));
        if(e.hinge)bits.push("FULL MOMENT RELEASE at this joint — this node is a hinge");
        bits.push(e.mode==="capacity"
          ? "treated as CAPACITY ONLY — the ring is analysed with its sound section and axis, "+
            "and this depth is used only in the stress check"
          : "treated as SECTION LOSS — the reduced depth enters the geometry, so it changes the "+
            "element stiffness and moves the arch axis");
        /* The derived spring was absent from the echo entirely: a model carrying
           a partial release printed identically to one carrying none. */
        if(e.partial){
          if(z.kTheta>0){
            const Lel=(M&&M.nEl)?M.g.Ltot/M.nEl:1, Ei=(p.E||1500)*144;
            const Isnd=(z.dSound>0)?Math.pow(z.dSound,3)/12:0;
            const ratio=(Isnd>0)?z.kTheta/(4*Ei*Isnd/Lel):0;
            bits.push("PARTIAL MOMENT RELEASE derived from the loss — joint spring k\u03b8 = "+
              nfx(ratio,3)+" \u00d7 4EI/L over a "+nfx(inOf(z.Lj),1)+" in length"+
              ((z.x2>z.x1)?"":", the length taken as the depth removed because no zone was entered")+
              ". k\u03b8 = E\u00b7I\u00b7I_c/[L_j(I \u2212 I_c)]");
          }else{
            bits.push("PARTIAL MOMENT RELEASE requested but not applied — it needs both a remaining "+
              "depth and a sound depth greater than it");
          }
        }
        if(z.dSound>0&&e.d>0)bits.push("sound section "+nfx(inOf(z.dSound),2)+
          " in, so "+nfx(inOf(z.dSound-e.d),2)+" in removed — "+
          nfx(100*(1-e.d/z.dSound),0)+"% of the depth");
        let where;
        if(e.node>0)where="node "+e.node+" — x = "+nfx(z.x1||0,3)+" ft on this mesh";
        else if(e.x2!=null)where="x = "+nfx(z.x1||0,3)+" to "+nfx(z.x2||0,3)+
          " ft, carried by node "+((z.node||0)+1);
        else where="x = "+nfx(z.x1||0,3)+" ft, nearest node "+((z.node||0)+1)+
          (z.snapFt>0.01?" ("+nfx(z.snapFt,2)+" ft away)":" (on the node)");
        add("Deterioration — "+where,bits.join("; ")||"no effect entered","");
      });
    }else add("Deterioration","none entered","");
    h+=sec("Input Echo",dtab([{k:"k",h:"Input",txt:1},{k:"v",h:"Value",txt:1},{k:"u",h:"Units",txt:1}],rows));
  }
  if(sel.r_dash)h+=sec("Summary Dashboard",dashboard(p));
  if(sel.r_assume&&p.assume&&p.assume.trim())
    h+=sec("Engineering Assumptions",`<div style="white-space:pre-wrap">${esc(p.assume)}</div>`);
  if(sel.r_basis)h+=sec("Design Basis and Sign Conventions",
    document.getElementById("o_basis")?document.getElementById("o_basis").querySelector(".bd").innerHTML:"");
  if(sel.r_geo)h+=sec("Geometry, Restraint and Model Definition",CALC.geometrySection(p,M));
  if(sel.r_fig)h+=sec("Longitudinal Section",
    `<figure><svg id="rptFig" viewBox="0 0 980 520"></svg>
     <figcaption>Longitudinal section, to scale, at the governing position of the controlling vehicle.</figcaption></figure>`);
  if(sel.r_dl)h+=sec("Dead Load",CALC.deadLoadSection(p,M));
  if(sel.r_ll){
    const v0=results.length?ARCH.ALL_VEHICLES.find(x=>x.id===results.reduce((a,b)=>a.rf<b.rf?a:b).id):ARCH.vehiclesFor(M.p.loadMode)[1]||ARCH.vehiclesFor(M.p.loadMode)[0];
    const r0=results.length?results.reduce((a,b)=>a.rf<b.rf?a:b):{pos:M.g.xmin,dir:1};
    h+=sec("Live Load Distribution Through Fill",CALC.liveLoadSection(p,M,v0,r0.pos,r0.dir));
  }
  if(sel.r_veh){
    const govId=results.length?results.reduce((a,b)=>a.rf<b.rf?a:b).id:null;
    let body="";
    let sub=0;
    for(const r of results){
      if(!sel["rv_"+r.id])continue;
      const v=ARCH.ALL_VEHICLES.find(x=>x.id===r.id);
      body+=`<h3>${n+1}.${++sub} ${esc(v.name)}${r.id===govId?" — GOVERNS":""} &nbsp;
        (RF = ${nfx(r.rf,3)}, ${nfx(r.tons,1)} tons)</h3>`+CALC.vehicleSection(p,M,v,r);
    }
    if(!sub)body=msg("inf","No vehicle detail selected","Per-vehicle sections were deselected in the report settings.");
    h+=sec("Rating — Vehicle by Vehicle",body);
  }
  if(sel.r_veh)h+=sec("Rating Vehicle Configurations",
    VEHTAB.pane(p,M,ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id)),results));
    if(sel.r_diag&&dgState&&dgState.__veh)
    h+=sec("Force Diagrams",DIAG.pane(p,M,Object.assign({},dgState,
      {veh:dgState.__veh,list:ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id)),
       rf:dgState.__rf})));
  if(sel.r_lat){
    const gv3=results.length?results.reduce((x,y)=>x.rf<y.rf?x:y):null;
    h+=sec("Lateral Earth Pressure",
      LATERAL.pane(p,M,gv3?ARCH.ALL_VEHICLES.find(v=>v.id===gv3.id):null,gv3));
  }
  if(sel.r_il)h+=sec("Influence Line Development",ILTAB.pane(p,M,ilEl,ilCase,ilSecSel));
  if(sel.r_nodes&&results.length){
    const gv2=results.reduce((a,b)=>a.rf<b.rf?a:b);
    const v2=ARCH.ALL_VEHICLES.find(x=>x.id===gv2.id);
    h+=sec("Nodal Results",NODAL.section(p,M,v2,gv2.pos,gv2.dir,gv2.sec).html+
      `<h3>Worked calculation — node ${CALC.secTag(M,gv2.sec)} (governing)</h3>`+
      NODAL.worked(p,M,v2,gv2.pos,gv2.dir,gv2.sec));
  }
  if(sel.r_ver)h+=sec("Independent Verification against Midas Civil",
    impCmp?comparisonBlock(p):msg("inf","No independent verification performed",
      "No Midas results were imported for this calculation. Solver evidence rests on the closed-form and "+
      "equilibrium checks documented in the manual."));
  /* The mesh study prints whether or not it was run. A package that is silent
     about discretisation error reads as though there were none. */
  if(sel.r_rsum)h+=sec("Rating Summary — every section, every vehicle",ratingSummary(p));
  if(sel.r_ver)h+=sec("Mesh Convergence",MESHCONV.block(M));
  if(sel.r_man)h+=sec("User Manual and Design Basis",MANUAL.html(true));

  h+=`<div id="rptFoot">This calculation was produced with Stone Arch LR by Mario Lococo. The program is an
    engineering aid, not a substitute for engineering judgment. The engineer of record is responsible for the
    inputs, the assumptions, the interpretation of the governing codes, and the design. Results are Inventory
    level only; AASHTO MBE Art. 6A.9.1 provides no Operating allowable stress for unreinforced masonry.
    Independent verification of the frame analysis is recommended before the rating is issued.</div></div>`;
  /* C3 — running header and footer. The sheet count is written after layout,
     since it cannot be known until the content exists. */
  {
    const t2=id=>{const e=$(id);return e&&e.value?esc(e.value):"—";};
    const stamp=BUILD_ID;
    if($("runHead"))$("runHead").innerHTML=
      `<span class="l"><b>${t2("tbProject")}</b> &nbsp;·&nbsp; ${t2("tbSubject")}</span>`+
      `<span class="r">${t2("tbTask")} &nbsp;·&nbsp; Stone Arch LR ${stamp}</span>`;
    if($("runFoot"))$("runFoot").innerHTML=
      `<span class="l">Computed ${t2("tbBy")} ${t2("tbDate")} &nbsp;·&nbsp; Checked ${t2("tbChk")} ${t2("tbChkDate")}</span>`+
      `<span class="r">Inventory level · Allowable Stress · MBE 6A.9.1</span>`;
  }
  $("rptHost").innerHTML=h;
  /* A panel collapsed on screen carries .clp, and .pnl.clp>.bd is display:none
     — a rule the print block never cleared. The printed package therefore
     inherited whatever the operator happened to have closed: in one session
     that silently dropped the equilibrium check, the degrees-of-freedom and
     element-stiffness worked examples, the thrust and shear influence tables,
     and all ten Nodal Results sub-tables, leaving headings with nothing under
     them. Panel state is a screen-reading convenience; it has no business
     deciding what a sealed calculation contains. Everything is expanded here,
     on the report clone only, so the operator's screen is left as it was. */
  $("rptHost").querySelectorAll(".clp").forEach(el=>el.classList.remove("clp"));
  /* The twisty glyph is written at build time from isClp(), so an expanded
     panel would still print "▸". It is a screen affordance with no meaning on
     paper, so it is emptied rather than flipped. */
  $("rptHost").querySelectorAll(".tw").forEach(el=>{el.textContent="";});
  $("rptHost").querySelectorAll("[id^='figVeh_']").forEach(sv=>{
    const v=ARCH.ALL_VEHICLES.find(q=>q.id===sv.id.replace("figVeh_",""));
    if(v){try{VEHTAB.draw(sv,v);}catch(e){}}
  });
  $("rptHost").querySelectorAll("#figLat,[id='figLat']").forEach(sv=>{
    try{LATERAL.drawFig(sv,p,M);}catch(e){}
  });
  drawReportFigures($("rptHost"),p);
  /* C4 — a place to sign. A calculation package that cannot be signed is not a
     deliverable, and the reader should be able to see at a glance whether it has
     been checked. */
  {
    const t2=id=>{const e=$(id);return e&&e.value?esc(e.value):"";};
    const unsigned=!t2("tbBy")||!t2("tbChk");
    const sig=`<h2>${N()}. Certification</h2>`+
      (unsigned?`<div class="msg m-wrn"><b>Not signed</b>This package has blank `+
        `${!t2("tbBy")?"<i>computed by</i>":""}${(!t2("tbBy")&&!t2("tbChk"))?" and ":""}`+
        `${!t2("tbChk")?"<i>checked by</i>":""} fields. Complete the title block before issuing.</div>`:"")+
      `<table class="dt" style="table-layout:fixed"><tbody>
        <tr><td style="width:22%">Computed by</td><td>${t2("tbBy")||"&nbsp;"}</td>
            <td style="width:14%">Date</td><td style="width:18%">${t2("tbDate")||"&nbsp;"}</td></tr>
        <tr><td>Signature</td><td style="height:46px">&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
        <tr><td>Checked by</td><td>${t2("tbChk")||"&nbsp;"}</td>
            <td>Date</td><td>${t2("tbChkDate")||"&nbsp;"}</td></tr>
        <tr><td>Signature</td><td style="height:46px">&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
        <tr><td>Seal</td><td colspan="3" style="height:150px">&nbsp;</td></tr>
      </tbody></table>`+
      `<div class="note">The engineer of record is responsible for the inputs, the assumptions, the
       interpretation of the governing codes and the resulting decision. This program is an engineering aid and
       its output must be reviewed before it is relied upon. Produced with Stone Arch LR ${BUILD_ID}.</div>`;
    $("rptHost").insertAdjacentHTML("beforeend",sig);
  }
  /* C5 — contents. Built from the rendered headings rather than from the section
     list, so it cannot fall out of step with what was actually included. */
  {
    const rh=$("rptHost");
    const items=[...rh.querySelectorAll("h2")].map((x,i)=>{
      const id="sec"+i; x.id=id;
      return `<tr><td style="width:8%">${x.textContent.trim().split(".")[0]}.</td>`+
        `<td>${esc(x.textContent.trim().replace(/^\d+\.\s*/,""))}</td></tr>`;
    }).join("");
    rh.insertAdjacentHTML("afterbegin",
      `<div class="rpt-toc"><h2 style="border-bottom:1.5px solid #000">Contents</h2>`+
      `<table class="dt" style="table-layout:fixed"><tbody>${items}</tbody></table>`+
      `<div class="note">Section numbers are document level. Headings numbered inside a section — the steps of
       a worked calculation, for example — are set in a lighter face and indented so they cannot be mistaken
       for document sections.</div></div>`);
  }
  if($("rptFig")&&M){
    const gv=results.length?results.reduce((a,b)=>a.rf<b.rf?a:b):null;
    schematic($("rptFig"),gv?gv.pos:null,{veh:gv?ARCH.ALL_VEHICLES.find(x=>x.id===gv.id):undefined,thrust:true});
  }
}

/* ---------------- conditional row visibility ---------------- */
function syncCond(){
  const meas=$("geoMode")&&$("geoMode").value==="measured";
  if($("rowsIdeal"))$("rowsIdeal").style.display=meas?"none":"";
  if($("rowsMeas"))$("rowsMeas").style.display=meas?"":"none";
  const ends=$("gradeMode")&&$("gradeMode").value==="ends";
  if($("rowsGcrown"))$("rowsGcrown").style.display=ends?"none":"";
  if($("rowsGends"))$("rowsGends").style.display=ends?"":"none";
}

/* ---------------- init ---------------- */
let bind=null;
function init(){
  $("inPanel").innerHTML=inputPanel();
  UI.wire($("inPanel"));
  const today=new Date().toISOString().slice(0,10);
  if($("tbDate")&&!$("tbDate").value)$("tbDate").value=today;

  // wire inputs → live recompute (§7: no recalculate button)
  bind=()=>{
    $("inPanel").querySelectorAll("input,select,textarea").forEach(e2=>{
      if(e2.type==="file")return;
      const ev=(e2.tagName==="TEXTAREA"||e2.type==="text")?"input":"change";
      e2.addEventListener(ev,()=>{
        if(e2.id==="loadMode"){
          F.loadMode=e2.value;
          const set=ARCH.vehiclesFor(e2.value).map(v=>v.id);
          F.vehicles=set.join(",");
          const keep={}; TB.forEach(t=>keep[t]=$(t)?$(t).value:"");
          const snap=snapshot();
          $("inPanel").innerHTML=inputPanel();
          UI.wire($("inPanel"));
          for(const k in snap.fields)if($(k)&&k!=="vehicles"&&k!=="loadMode")$(k).value=snap.fields[k];
          $("loadMode").value=e2.value;
          document.querySelectorAll(".vchk").forEach(cb=>{cb.checked=true;});
          deterRows=null; bind(); deterRender(); wireProject(); refreshProjSel();
          syncCond(); render(); autosave(); return;
        }
        /* Keep the shallow-cover setting on F. The input panel is rebuilt from F
           whenever the loading mode changes, and the rail panel has no such
           control, so without this a deliberate choice of the legacy spread
           would silently revert to the default on a rail→highway round trip. */
        if(e2.id==="shallowE")F.shallowE=e2.value;
        if(e2.id==="shallowRate")F.shallowRate=e2.value;
        syncCond();render();autosave();});
      if(e2.type==="number")e2.addEventListener("input",()=>{render();autosave();});
    });
    TB.forEach(t=>{if($(t))$(t).addEventListener("input",autosave);});
  };
  bind();
  deterRender();
  refreshProjSel();

  wireProject();
  let rzT=null;
  window.addEventListener("resize",()=>{
    clearTimeout(rzT);
    rzT=setTimeout(()=>{if(M)postRender(readPSafe());},220);
  });
  $("printBtn").onclick=reportModal;
  $("modalBg").onclick=e=>{if(e.target===$("modalBg"))$("modalBg").classList.remove("on");};

  // Restore the previous session. This runs on every page load, so refreshing
  // the page, or opening a newer copy of the file from the same browser, picks
  // up exactly where the last session left off.
  try{
    const saved=storageWorks()?localStorage.getItem(LSA):null;
    if(saved){
      const o=JSON.parse(saved);
      restoredAt=o.ts||null;
      restore(o);
      if(curProj){$("projName").value=curProj;refreshProjSel(curProj);}
    }
  }catch(e){projMsg("The previous session could not be restored: "+e.message,true);}
  showAutoInfo();
  syncCond();
  render();
}

/* KaTeX may still be loading; re-render once it lands so equations never show raw markup */
function boot(){
  R.setKatexReady();
  init();
  if(!window.katex){
    let tries=0;
    const iv=setInterval(()=>{
      if(window.katex){R.setKatexReady();render();clearInterval(iv);}
      else if(++tries>40)clearInterval(iv);
    },150);
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
})();

</script>
