const MANUAL=(()=>{
"use strict";
const {step,eqLine,vars,msg,esc}=R;

const PARTS=[
["m1","1. Read This First",()=>`
<div class="msg m-wrn"><b>This program is an engineering aid, not a substitute for engineering judgment.</b>
The engineer of record is responsible for the input values, the assumptions, the interpretation of the governing
codes, and the resulting design or posting decision. Every number this program produces must be reviewed by a
qualified engineer before it is relied upon. Nothing in this program relieves the user of that responsibility.</div>

<h3>1.1 What this app does</h3>
<p>Stone Arch LR performs a load rating of a single-span unreinforced stone masonry arch bridge by the
Allowable Stress method at the Inventory level. It implements:</p>
<ul>
<li><b>MassDOT Bridge Manual, Part I, Chapter 7, §7.2.7</b> — Special Instructions for Load Ratings of Stone
Masonry Arches, including the modeling requirements of §7.2.7.2B, the dead load provisions of §7.2.7.3B and
§7.2.7.4B, the lateral earth pressure of §7.2.7.5B, the influence line requirements of §7.2.7.7B, live load
positioning per §7.2.7.8B, the eccentricity and kern provisions of §7.2.7.9B and §7.2.7.10B, the allowable
stress direction of §7.2.7.11B, and the iterative rating procedure of §7.2.7.12 and Figure 7.2.7-1.</li>
<li><b>AASHTO Manual for Bridge Evaluation, Art. 6A.9.1</b> — unreinforced masonry arches evaluated by the
Allowable Stress method, and <b>Art. 6B.5.2.6</b> for allowable compressive stresses in masonry.</li>
<li><b>AASHTO Standard Specifications, Art. 6.4</b> — distribution of wheel loads through fill, and
<b>Art. 3.8.2.3</b> — impact as a function of fill depth.</li>
</ul>
<p>The barrel is analyzed as a two-dimensional plane frame on a one-foot-wide longitudinal strip, with an
internal direct-stiffness solver generating the influence coefficients and dead load section forces.</p>

<h3>1.2 What this app does NOT do</h3>
<p>This list is intended to be exhaustive, not illustrative. Each exclusion states what the user must do instead.</p>
<ul>
<li><b>No Operating level rating.</b> MBE Art. 6A.9.1 gives no Operating allowable stress for unreinforced
masonry, so none is computed. EV2 and EV3 are rated at the Inventory stress level and reported at both levels
per §7.2.7.11B, which is a reporting convention and not an Operating capacity check.</li>
<li><b>No posting analysis.</b> When a legal vehicle rates below 1.0 the program says so but does not compute a
safe posting load. Perform the posting determination separately per MBE Art. 6B.7.</li>
<li><b>No custom or permit vehicles.</b> Only the standard rating vehicles of the selected loading are
available. A permit review requires a different tool or a hand extension of this one.</li>
<li><b>Railroad impact follows one AREMA expression only.</b> In railroad mode the program applies
IM = [1 − (H − 1.5)/8.5] × 0.60, measured below the base of rail — 60% at 1.5 ft, falling linearly to zero at
10 ft, clamped at both ends. Track owners publish variations on this, and some require impact on a different
basis entirely; confirm the expression against the governing criteria before issuing a rating.</li>
<li><b>No railroad longitudinal, centrifugal or rocking effects.</b> Only vertical axle loads and the uniform
trailing load are applied.</li>
<li><b>No multi-span or multi-ring analysis.</b> A single barrel between two springings is modeled. Continuous
multi-span arcades, spandrel-pier interaction, and multi-ring (independent ring) barrels are outside scope; ring
separation in particular is a distress mechanism this elastic model cannot represent.</li>
<li><b>No skew.</b> The barrel is assumed square. A skewed arch requires three-dimensional treatment.</li>
<li><b>No spandrel wall structural participation.</b> Excluded deliberately per §7.2.7.4B, which states the ability of a spandrel to support itself and a portion of the arch is uncertain and shall be neglected. Its <i>weight</i> must still be included: enter it, with sidewalks, railings and curbs, in the Superimposed Dead Load panel, where it is distributed across the barrel width per §7.2.7.4B.</li>
<li><b>No slab-type live load distribution for shallow fill.</b> Where cover is less than 2 ft, Std. Spec.
Art. 3.24.3 requires slab distribution instead of the through-fill spread used here. The program warns but does
not perform that check; do it separately.</li>
<li><b>No abutment, foundation, or scour check.</b> Springing reactions are not carried into a stability or
bearing check of the abutment. Scour, undermining, and foundation movement are not modeled.</li>
<li><b>Shear rating is optional and outside the clause.</b> §7.2.7 rates on combined compressive stress only.
Leave the allowable shear stress at zero and shear is computed and reported for information, as the clause
intends. Enter a value and every section is additionally checked as τ = V/A against it, with the governing
rating factor becoming the lower of the two checks — a supplement to the code procedure, not part of it. If
shear governs, the reported figure is no longer a pure §7.2.7 rating and must be described as such wherever it
appears, including Items 64 and 66.</li>
<li><b>No thermal effects.</b> Excluded on the explicit direction of §7.2.7.6B.</li>
<li><b>No live load lateral surcharge, braking, centrifugal, wind, or pedestrian load.</b> Only dead load and
vertical live load with impact are combined.</li>
<li><b>No vertical curve in the roadway profile.</b> The grade is a straight line. Where a sag or crest curve
lies over the arch, bound the rating by running the steeper and the flatter equivalent tangent grades.</li>
<li><b>No material testing guidance.</b> The allowable compressive stress is a user input. The program does not
select it, and its default is a placeholder.</li>
<li><b>No Excel calculation export.</b> Not implemented; the build guideline requires the firm's reference
workbook to extract exact formatting and print setup, and none was supplied. Use the PDF report.</li>
<li><b>No three-dimensional visualisation.</b> The model is two-dimensional and contains no embedded elements,
so a 3-D view and transparency slider have no subject matter here.</li>

</ul>

<h3>1.3 Known limitations and assumptions</h3>

<h4>1.3.1 Linear elastic material, no cracking</h4>
<p>The frame solve is linear elastic with uncracked section properties throughout, using the full ring depth for
both axial area and moment of inertia. Where the thrust falls outside the kern the <i>stress check</i> accounts
for the cracked, effectively reduced bearing depth through the pressure wedge of §7.2.7.10B, but the
<i>stiffness</i> used to distribute the forces does not. In a real arch, cracking at the extrados or intrados
softens that region and sheds moment elsewhere. Neglecting this is the conventional treatment for this
procedure and is generally conservative at the cracked section, but it is an approximation, and a barrel showing
extensive cracking is outside the reliable range of an uncracked elastic model.</p>

<h4>1.3.1a Beam theory — and why the default matches Midas</h4>
<p>Elements are <b>Timoshenko beams by default</b>, including shear flexibility with Poisson's ratio 0.2 and a
shear area of five sixths of the gross area, which is the standard factor for a solid rectangle. Euler-Bernoulli
is available and is flagged on the dashboard when selected.</p>
<p>The reason for the default is agreement with the program a checker will use. §7.2.7.2B fixes the element count
by clear span, so on a masonry ring the elements are frequently as deep as they are long — d/L of one to two is
ordinary — and slender-beam theory is not accurate at that proportion. <b>Midas Civil includes shear deformation
in beam elements by default</b>, deriving the shear areas from the section. Against a Midas run of a model
exported from this program, the Timoshenko formulation agreed to <b>0.005</b> in both moment and thrust
influence ordinates, which was the rounding precision of the pasted results — that is, exactly. The
Euler-Bernoulli formulation differed from the same Midas run by up to <b>0.045</b>, roughly nine times the
precision of the data.</p>
<p>The two formulations differ by about 2% in springline moment and rating factor, Bernoulli being the
conservative one. If a calculation is issued on the Bernoulli basis, say so, and expect an independent Midas
check to disagree by that amount unless the checker also turns shear deformation off.</p>

<h4>1.3.2 Zero tensile strength</h4>
<p>No tensile strength is assigned to the masonry. This follows §7.2.7.10B, which assumes no tension at the face
opposite the thrust and redistributes pressure over a smaller depth. Published research suggests a small tensile
capacity, on the order of a few percent of the compressive strength, may be justifiable for sound masonry and
would raise ratings; that allowance is deliberately not taken here.</p>

<h4>1.3.3 Springing restraint is an idealization</h4>
<p>Real springings are neither perfectly fixed nor perfectly pinned. Fixed produces springline moment and is
usually the governing and the conventional assumption for a barrel on massive abutments. Pinned removes
springline moment entirely and moves the critical section inboard, generally raising the rating. On a
representative 40 ft span the difference was a rating factor of 1.30 fixed against 1.77 pinned — roughly 35%.
This choice is the single most influential modeling decision in the program and must be stated and defended.</p>

<h4>1.3.4 Uniform pressure over the spread rectangle</h4>
<p>Std. Spec. Art. 6.4 spreads a wheel load over a rectangle that grows with depth and treats the pressure as
uniform over that rectangle. Real pressure distributions are bell-shaped. Where the spreads of adjacent axles
overlap, this program sums the pressures rather than redistributing them over a merged area, which is slightly
conservative.</p>

<h4>1.3.5 Impact basis is a user choice</h4>
<p>§7.2.4.6B points to Std. Spec. 3.8.2.3 without stating which fill depth to use on a curved barrel where the
depth varies. The crown basis applies the percentage from the minimum cover uniformly and is conservative; the
local basis applies each node's own depth. The local basis can never rate lower than the crown basis. Legacy
ratings most likely used the crown value uniformly. Confirm the owner's preference before reporting the higher
numbers.</p>

<h4>1.3.6 Element count and convergence</h4>
<p>§7.2.7.2B sets a minimum of 10 elements or one per 4 ft of clear span. Convergence testing on a 40 ft span
found the springline moment at that minimum to be about 5% below the converged value — that is, the code minimum
is slightly <i>unconservative</i> for the springline. The program defaults to the code minimum for compliance
and flags it; refine to two to four times the minimum for production ratings.</p>

<h4>1.3.6a Modeling deterioration</h4>
<p>Deterioration is entered by <b>station</b>: <span class="mono">x 5.56, depth, f<sub>a</sub>, treatment</span>
for a point of loss, or <span class="mono">x 4.5-6.6, depth, f<sub>a</sub>, treatment</span> for a zone between two
stations, every field after the station optional. Three separate mechanisms can be applied, and they are
genuinely different things that should not be used as proxies for one another.</p>
<p><b>Why a station and not a node number.</b> Earlier builds keyed each entry to a node number, and a node
number is a position in the mesh rather than a position on the arch. On a 9.7 ft barrel at the code minimum of
12 elements, node 7 is the crown; at 16 elements the same entry lands at x = 3.7 ft, and by 60 elements it has
reached the springing. The intermediate meshes put the reduced section on the haunch, where the arch will not
carry its own weight, and the rating collapses to zero with no indication that the input has moved. Since this
manual tells you to refine the mesh until the rating settles, that was the expected workflow rather than an
unlikely one. A station resolves to whichever node is nearest at build time and stays where you put it. Node
numbers are still accepted so that saved sessions open unchanged, but they are flagged on the dashboard and
the editor offers to convert them.</p>
<p><b>What the depth reduction means — the treatment.</b> A reduced depth can describe two physically
different things, and the number alone cannot tell them apart. Choose <b>Section loss</b> when the stone is
gone — a spalled soffit, a missing voussoir. The reduced depth then enters the geometry: it softens the ring
and moves the arch axis to the mid-depth of what remains. Choose <b>Capacity only</b> when the stone is
present but the joint is degraded — lost or raked mortar. The ring is then analysed with its sound section
and its true axis, and the reduced depth is used solely in the stress check, as the depth still bearing at
that joint.</p>
<p>The distinction is not academic. On a 17 in ring with 8 in entered at the crown, section loss RAISES the
E-80 rating from 2.41 to 3.99 — most of that coming from the arch axis rising 4.5 in, which makes the model
a taller arch than the one on site. Capacity only, on the same entry, gives 0.00: the sound-ring analysis
leaves an eccentricity of 3.88 in at the crown against d/2 = 4.00 in, so the thrust line is all but off the
reduced section. Neither number is the answer on its own.</p>
<p><b>End release.</b> Either treatment can carry a moment release at that node. A joint that has lost enough
mortar to be unreliable in bending is capacity + release: the arch sheds the crown moment, redistributes it
to the springings, and the reduced section is checked against the thrust that remains. On the example above
that gives 1.90, governed at the springing — lower than the sound ring, which is the direction damage ought
to move a rating. A joint merely raked at the surface is capacity alone, with no release. Bear in mind a
fixed arch has three redundancies: the fourth release makes a mechanism and the program will refuse it.</p>
<p>Outside the entered station or zone the section feathers back to sound at 45 degrees — the taper runs the
depth removed, so a 0.77 ft loss in a 1.42 ft ring blends over 0.77 ft on each side. That is a physical length,
so it does not change with the mesh either. A point entry therefore has an extent of roughly twice the depth
lost, which is usually smaller than a real spall: if the damage covers three feet of soffit, enter it as a zone
rather than as a point, because the two are not the same structure.</p>
<p><b>Reduced depth</b> removes section. <b>Reduced allowable stress</b> leaves the section in place and lowers
its capacity, which is the honest model for weathered or soft masonry and deep mortar loss — faking it by
removing depth also removes stiffness and moves the axis, changing the force distribution when only the
capacity should change. <b>A hinge</b> releases moment at the node, which is what a crack through the depth
actually does; the release is applied by static condensation of that rotational freedom out of the element, and
it is verified by the fact that hinges at both springings of a fixed arch reproduce a pinned arch exactly.</p>
<p><b>Which face the material is lost from is not a bookkeeping detail.</b> The arch axis is the mid-depth line,
so the face decides where the axis goes and therefore the shape of the structure being analyzed. Losing the
soffit — the case an inspector can actually see — leaves the sound material on top and the axis <i>rises</i>;
losing backing from above drops it. On a 40 ft arch with 1.5 ft remaining over five nodes at the crown, the
same damage gives a rating factor of 0.97 for intrados loss, 0.98 for extrados loss and 1.20 if the loss is
symmetric, because only the symmetric case leaves the axis where it was. Note also that a measurement taken
from the soffit tells you the remaining sound depth but not whether the extrados has lost backing as well.</p>
<p><b>Refine the mesh for deterioration studies.</b> These results are sensitive to element count and to how
abruptly the zone is tapered — one case moved from 0.036 to 0.102 between 20 and 80 elements. Run the element
count up until the answer stops moving before relying on it.</p>

<h4>1.3.7 Ring depth overrides shift the arch axis</h4>
<p>The arch axis is generated by offsetting the intrados outward by half the local depth, so a local depth
reduction is taken from the <i>extrados</i> side and pulls the axis down in that zone. That is the right model
for extrados-side deterioration or loss of backing, and the wrong one for intrados-side loss such as spalled
voussoir soffits, where the axis should rise instead. It also means an abrupt depth change puts a kink in the
axis and generates a local moment that is an artefact of the geometry, not a real effect. Use gradual
transitions over at least two or three elements, and treat sharp steps with suspicion.</p>

<h4>1.3.8 One-foot strip idealization</h4>
<p>The analysis is a unit-width longitudinal strip beneath a wheel line. Transverse distribution within the
barrel, transverse arching, and edge effects near the spandrels are not modeled. For a barrel of ordinary
width carrying a single lane this is the standard idealization; for narrow barrels or loads near a free edge it
is optimistic.</p>

<h4>1.3.9 Solver output is not hand-checkable</h4>
<p>The program computes its own section forces and influence coefficients — nothing is taken from an external
analysis. Unit vertical loads are applied at each interior node and the plane frame is solved once per load
case, producing the influence coefficient tables for moment, shear and axial load that §7.2.7.7B requires.
What cannot be done is to present that linear algebra as checkable hand steps: the system has tens of degrees
of freedom and is solved dozens of times. Those results are therefore flagged in the output, in the spirit of, so a reviewer knows exactly which numbers are solver output and which are arithmetic they can
follow. Everything downstream of them is worked in full, and Part 7 documents how the solver was verified.</p>
`],

["m2","2. Using the Program",()=>`
<h3>2.1 Workflow</h3>
<ol>
<li><b>Fill in the title block</b> at the top of the screen. These fields print on the report and carry the
review trail.</li>
<li><b>Enter the arch geometry.</b> For an issued rating, choose <i>Measured points</i> and paste the survey
of the intrados; §7.2.7.2B does not accept assumed geometry. Review the fit residual table and either accept
the automatic selection or force a curve type.</li>
<li><b>Set the springing restraint.</b> This is a judgment call with a large effect — see Part 1.3.3.</li>
<li><b>Enter the ring depth</b>, including any local overrides for deteriorated zones.</li>
<li><b>Define the roadway grade</b>, either as crown cover plus a slope or as the cover at each springing.</li>
<li><b>Enter unit weights and the allowable stress.</b> The allowable stress is the dominant material input and
must be justified per MBE Art. 6B.5.2.6 and §7.2.7.11B.</li>
<li><b>Select the rating vehicles</b> and read the results.</li>
<li><b>Record your assumptions</b> in the Engineering Assumptions box; they print on the report.</li>
<li><b>Print the report</b> and choose its contents.</li>
</ol>
<p>There is no recalculate button. Every change recomputes the whole calculation immediately.</p>

<h3>2.2 Reading the output</h3>
<p>A single bar above the tabs fixes the whole load case: <b>section of interest, vehicle, direction and
position</b>. Everything in the output reads from it — the live load derivation and the axle contribution
matrix on the Live Load tab, the node-by-node calculation on Nodal Results, the kern and pressure wedge figure
and the three force diagrams, and the influence line walk-through. Each tab still has its own slider and
selectors, but they now write to the shared choice rather than keeping their own, so the worked examples cannot
end up describing different vehicles at different positions. <i>Governing</i> jumps section, vehicle position
and direction to the case that controls the rating. The older text below describes the section selector alone
and remains true of it.</p>
<p>A single <b>section of interest</b> selector sits above the tabs and drives every worked example in the
program — the live load derivation on the Live Load tab, the node-by-node calculation on Nodal Results, the
kern and pressure wedge figure on Diagrams, and the influence line walk-through. Changing it anywhere changes
it everywhere, so the worked examples can never end up describing different sections. The <i>Governing</i>
button jumps to the section that controls the rating.</p>
<p>The output panel is organised into tabs:</p>
<ul>
<li><b>Summary</b> — the dashboard of every check with pass, fail, review, or not-applicable status, each
linking to the supporting math; the controlling result; your assumptions; and the design basis.</li>
<li><b>Model</b> — geometry, curve fitting, ring depth, restraint, grade, node table, and the scaled section figure.</li>
<li><b>Dead Load</b> — load components, the consistent element load formulation, and dead load section forces.</li>
<li><b>Live Load</b> — carries the <b>axle contribution matrix</b>: every node of the model against every
axle of the vehicle, giving the nodal load each axle delivers with the pressure it produces beneath it, the
impact factor as its own column, the influence ordinates for the section of interest, and each node's
contribution to the moment, thrust and shear at that section with its share of the total. The sum row is
checked against the solver's own superposition on every render, so the table is a decomposition of the
calculation in use rather than a parallel one that could drift from it. Empty nodes can be hidden and the whole
table copied as CSV. It also carries the <b>complete worked live load calculation</b>: impact worked at every
node with the depth used, the band applied and the resulting factor; the pressure and equivalent nodal load at
every node; the influence line superposition shown term by term so the totals can be added by hand; and the
combination with dead load through to eccentricity, stress and utilization at the section of interest. On the
crown impact basis the table shows both each node's own cover and the crown depth actually used, because those
deliberately differ away from the crown.</li>
<li><b>Live Load</b> — the through-fill distribution worked at a real node, impact, the interactive load
position view, and influence lines.</li>
<li><b>Vehicles</b> — every selected rating vehicle drawn to scale with its axle loads and spacings dimensioned,
a table of axle load, spacing and share of the total, and a summary comparing all vehicles side by side. This
tab exists so the axle data built into the program can be checked against the source figures, which is a review
step that should be made and recorded once per project.</li>
<li><b>Vehicles</b> — the rating vehicles themselves: a comparison table of axle count, length, total axle
load, rating weight, trailing load, rating factor and governing section, followed by a scaled schematic of each
vehicle with axle loads, spacings and a full spacing table. This is the tab to check against your own copy of
the MassDOT figures before issuing a rating — an error in an axle configuration moves every result and no
other check in this program would catch it.</li>
<li><b>Earth Pressure</b> — the lateral earth pressure of §7.2.7.5B on its own: the clause quoted, the
pressure and its resolution onto each element's vertical projection, a table of intensity and resultant per
element, the inward thrust on each haunch and the net balance, the force effects from the lateral load alone
with its share of the dead load moment at every section, a scaled pressure diagram, and a sensitivity of the
rating to the coefficient K. Vertical earth pressure is not here — the weight of fill over the extrados is a
vertical dead load and appears on the Dead Load tab as the fill component.</li>
<li><b>Diagrams</b> — moment, shear and thrust plotted along the barrel, each filterable by load group: dead
load (ring self-weight, wearing surface and superimposed dead load), vertical earth pressure (the fill weight),
lateral earth pressure, live load, and the total. The readout above the charts is laid out one row per curve — dead load, vertical earth, lateral earth, live
load, then the total — so each number maps to a trace and the combined value is never mistaken for the live
load curve. A dotted vertical marker and a diamond on the total curve show the section the readout describes.
A slider positions the vehicle, the shared section selector chooses the section of interest, and <i>Go to governing</i> sweeps every position in both directions and places the vehicle
where the rating factor <b>at that node</b> is lowest. A shaded band shows the live load envelope — the maximum
and minimum of each effect at every section over the same quarter-foot sweep the rating uses. Live load is drawn
unfactored unless scaled to the converged rating factor.</li>
<li><b>Diagrams</b> also carries the <b>kern and pressure wedge</b> figure: the arch section at the selected
node drawn edge-on over the one-foot strip, with the middle-third kern band, the combined thrust at its true
eccentricity, and the stress block that equilibrates it — trapezoidal inside the kern, triangular over the
reduced bearing depth 3(d/2 − e) outside it with the tension zone hatched out and ignored. A gauge along the
bottom shows how close the eccentricity sits to both d/6 and d/2. This is the clearest presentation in the
program of why §7.2.7.12 requires the rating to be iterated: outside the kern the stress varies as
1/(d/2 − e), so it cannot be scaled.</li>
<li><b>Influence Lines</b> — the structural analysis behind the influence coefficients: the §7.2.7.7B
requirement quoted and how it is met, the degree-of-freedom count, a worked element stiffness matrix in both
local and global axes, one complete unit load case solved from load vector through displacements to element end
forces, the section force recovery worked at one section, an equilibrium check on the case, a <b>unit load walk-through</b> that steps the 1 kip load along the arch one
position at a time and reports the moment, thrust and shear at a chosen section together with the matching
Midas load case name, the full moment, thrust and shear coefficient tables, and a symmetry verification.</li>
<li><b>Rating</b> — every selected vehicle worked in full, with a per-section results table, one section worked
step by step, and the §7.2.7.12 iteration.</li>
<li><b>Nodal Results</b> — every quantity the rating depends on, node by node, for a selected vehicle and
position: section properties, the three depth measures, the live load spread, impact, dead and earth load
effects separated by component, influence line peaks, the combined check, thrust line coordinates, springing
reactions and arithmetic checks. Copy CSV puts the whole table on the clipboard for Excel. A node selector at
the foot of the tab produces the <b>full worked calculation for any single node</b> — every quantity derived
symbolically, substituted and resulting, from section properties through the spread of the wheel loads to the
stress check and that section's own rating factor — so any node can be audited by hand, not only the governing
one.</li>
<li><b>Verification</b> — MCT export and comparison against imported Midas results.</li>
<li><b>Manual</b> — this document.</li>
</ul>
<p>Panels collapse and expand, and the program remembers their state between sessions. In the Rating tab,
<i>Collapse all but governing</i> reduces the output to the controlling vehicle.</p>

<h3>2.2a Status vocabulary</h3>
<p>Every dashboard row carries one of four statuses, and they are not interchangeable.</p>
<table class="dt"><tbody>
<tr><td><b>PASS</b></td><td>A rating check performed and satisfied — a vehicle rating at or above 1.0. Only
  rating checks can pass.</td></tr>
<tr><td><b>OK</b></td><td>A modeling or arithmetic check performed and found sound. Not a statement about
  capacity.</td></tr>
<tr><td><b>REVIEW</b></td><td>Nothing is wrong, but a judgement is required that this program cannot make: an
  assumption whose basis must be confirmed, or a modeling choice that materially affects the answer. A package
  should not be issued with an unaddressed REVIEW.</td></tr>
<tr><td><b>N/A</b></td><td>Not applicable, with the reason stated. An N/A is never a silent pass.</td></tr>
</tbody></table>
<p>A failed rating is reported as <b>FAIL</b> and a defect in the calculation itself as <b>ERROR</b>; either
stops the package.</p>

<h3>2.3 Saving work</h3>
<p>Named projects are stored in this browser's local storage on this machine. That storage can be cleared by
the browser or by IT policy, so <b>export a JSON file</b> for anything you intend to keep or move to another
computer. The last session is autosaved and restored automatically, including which panels were collapsed.</p>
`],

["m5","5. Methodology I — Model, Dead Load and Distribution",()=>`
<h3>5.1 Geometry and the arch axis</h3>
<p>The intrados is defined by the selected curve. The arch axis is the intrados offset along its outward normal
by half the local ring depth, and the extrados by the full depth. Nodes are placed at equal arc length along
the axis, which satisfies the §7.2.7.2B requirement that each element be of equal arc length and that node
locations correspond to the mid-depth points of the arch segments.</p>
<p>Curve fitting is least squares on the vertical offset. The circle is fitted by the Kåsa linearisation
(x² + y² + Dx + Ey + F = 0), the ellipse as an axis-aligned conic, the parabola and the fifth-order polynomial
directly, the latter on a normalized abscissa for conditioning.</p>

<h3>5.2 Dead load as consistent element loads</h3>
<p>§7.2.7.3B and §7.2.7.5B call for loads applied as linearly varying loads along each element. Loads are
evaluated at both element ends, resolved into element-local axial and transverse components, and converted to
statically consistent fixed-end forces:</p>
${eqLine("",
"V_1=\\dfrac{L(7q_1+3q_2)}{20},\\quad M_1=\\dfrac{L^2(3q_1+2q_2)}{60},\\quad "+
"V_2=\\dfrac{L(3q_1+7q_2)}{20},\\quad M_2=-\\dfrac{L^2(2q_1+3q_2)}{60}")}
<p>These are assembled into the global load vector, and the fixed-end forces are subtracted from the element end
forces when recovering internal actions. Lumping the same load to nodes instead — a common shortcut — was found
to underestimate springline moment noticeably and is not used.</p>

<h3>5.3 Section force recovery, the basis, and the moment sign</h3>
<p><b>Basis.</b> At interior nodes the two adjacent element ends are projected onto the node normal and
averaged, which is the common basis needed to combine them and is reproducible from node coordinates by central
difference. At the two <b>end</b> nodes there is only one adjacent element and nothing to average, so the
element's own chord basis is used — the basis a checking program reports its end forces in. Projecting a single
end force onto the curve normal instead shifts the springline thrust by roughly one percent and makes the value
impossible to reproduce from an exported model, because the curve normal is not recoverable from node
coordinates. This was found by solving an exported MCT independently: every interior node agreed to 10⁻⁷ while
the two springings did not, which located the difference precisely.</p>
<p><b>Moment is reported sagging-positive</b>: a positive moment puts the intrados in tension and displaces the
thrust line toward the extrados. The raw end moments that come out of the stiffness formulation carry the
opposite sense, so the sign is inverted at recovery. This was verified against the closed form for a two-hinged
parabolic arch carrying a point load at the crown, where H = 25PL/128f and M at the crown is +7PL/128, sagging.
The program reproduces the thrust to 0.4%, the moment magnitude to 1.4%, and places the thrust line 0.171 ft
above the axis against 0.168 ft from the closed form. §7.2.7.7B warns that extreme care must be exercised over
sign convention, and this is the check that discharges that warning. Note that the rating uses the magnitude of
the moment, so the sign governs presentation, the thrust-line plot and the two-face stresses, not the rating
factor.</p>
<p>Axial force and shear are resolved on the section normal to the arch axis at each node, not on an element
chord. At interior nodes the values from the two adjacent element ends are averaged. This matters because
thrust is discontinuous across a node carrying a concentrated load, and live load is applied at exactly the
nodes being checked; taking one side arbitrarily makes the reported thrust depend on which element happens to
be used. Averaging is also the physically correct reading, since a nodal load represents pressure spread over
the tributary length and the section at the node sits at its middle. Before this treatment was adopted, the
influence lines of a perfectly symmetric arch were not mirror-symmetric — the defect that revealed the issue.</p>

<h3>5.2a Reading the influence coefficient tables</h3>
<p>The tables have sections down the side and load positions across the top. A <b>row</b> is one section
responding as the load moves — that row <i>is</i> the influence line for that section, and it is what the
superposition multiplies by the nodal loads. A <b>column</b> is one load position acting on the whole arch, and
it is the direct analogue of a single Midas load case. Mixing the two up is the commonest way to misread the
output.</p>
<p>Both springing columns are zero throughout. Those nodes are restrained in both translations and rotation, so
a load applied at one passes directly into the abutment and produces no internal force anywhere in the barrel.
The columns are printed rather than omitted, because an absent column reads as an oversight and invites the
reader to mistake the first free node for the springing.</p>

<h3>5.3a Load width is measured on the extrados</h3>
<p>Every surface load — the fill, the wearing surface, the superimposed dead load, and the live load pressure —
is delivered to the <b>top of the ring</b>. The horizontal width each node is responsible for is therefore
measured on the <b>extrados</b>, not on the arch axis beneath it, and the horizontal projection used for the
surface dead loads is the extrados projection. Ring self weight is the exception and correctly uses the axis:
it is the weight of the ring itself, distributed along the arc.</p>
<p>On a shallow ring the two widths differ by well under a percent. On a deep or near-semicircular ring they do
not: on a 14.25 ft clear span with a 1.83 ft ring the extrados spans 17.91 ft against an axis span of 16.08 ft,
so measuring on the axis understates every surface load by <b>10.2%</b>. That is unconservative, and it is the
reason the Model tab reports the axis span and the clear span separately and the dashboard states which width
the loads were measured on.</p>
<p><b>This changed in a revision.</b> Earlier builds measured on the axis. Ratings issued from those builds are
non-conservative on deep rings by roughly the percentage above and should be re-run — on a representative
near-semicircular barrel the Cooper rating moved from E92 to E86.</p>

<h3>5.4 Live load through fill</h3>
<p><b>The spread follows the arch, not a flat line under the axle.</b> The cone from a wheel or a tie keeps
widening with depth, so the depth it has to travel before reaching the ring is different at every point along
the barrel: shallow at the crown, much deeper at the haunches. An axle over the crown therefore also delivers
pressure some distance out along the extrados, because by the time the cone gets down to that lower elevation
it has spread further sideways. The pressure umbrella drawn on the section figure is bounded below by the
extrados profile for this reason. How far it reaches depends on the geometry — on a steep ring with shallow
fill the extrados drops away faster than the cone widens and the difference is a few percent, while on a flat
ring under deep fill it is substantially more.</p>
<p>Std. Spec. Art. 6.4 spreads each wheel over a rectangle growing at 1.75 horizontal to 1 vertical from the
tire contact area. Two wheel lines at 6 ft gage are treated as independent until their transverse spreads meet,
after which the axle is distributed over the combined width. The resulting pressure is multiplied by the
tributary horizontal length of the node to give the equivalent nodal load required by §7.2.7.7B. Depth is taken
locally at each node from the roadway grade to the extrados, so a deep haunch receives far less pressure than
the crown from the same axle.</p>
`],

["m6","6. Methodology II — Stress, Kern and the Rating Iteration",()=>`
<h3>6.1 Eccentricity and the kern</h3>
<p>§7.2.7.9B directs that the maximum eccentricity be calculated by dividing the combined dead and live load
moments by the combined dead and live load thrusts. §7.2.7.10B locates the kern points at r²/c from the neutral
axis, which for a rectangular section of depth d is d/6.</p>
${eqLine("","e=\\dfrac{\\Sigma M}{\\Sigma P},\\qquad e_k=\\dfrac{r^2}{c}=\\dfrac{d^2/12}{d/2}=\\dfrac{d}{6}")}

<h3>6.2 The three stress regimes</h3>
<p>Within the kern the section is fully in compression and the usual combined stress applies. Outside the kern
§7.2.7.10B requires a pressure wedge: the tension zone is ignored and the compressive pressure is redistributed
over a reduced depth, giving a triangular block whose resultant coincides with the thrust. Setting the block
length to 3(d/2 − e) places the centroid of the triangle at the thrust and yields a peak stress of twice the
average over that reduced area.</p>
${eqLine("","f=\\begin{cases}\\dfrac{\\Sigma P}{A}\\left(1+\\dfrac{6e}{d}\\right) & e\\le d/6\\\\[10pt]"+
"\\dfrac{2\\,\\Sigma P}{A_{eff}},\\quad A_{eff}=3\\left(\\dfrac{d}{2}-e\\right)b & d/6<e<d/2\\\\[10pt]"+
"\\text{no equilibrium block} & e\\ge d/2\\end{cases}","§7.2.7.10B")}
<p>Note the sense of the pressure wedge result: as e grows the effective depth shrinks and the peak stress rises
steeply, which is why an arch can be comfortable at the crown and critical at a springing carrying similar thrust.</p>

<h3>6.3 Why the rating must be iterated</h3>
<p>§7.2.7.12 is explicit that because the applied loading affects the section compression forces, an iterative
process must be used, and that it is <i>not permissible</i> to compute a first-pass rating factor and multiply
it by the vehicle tonnage. The reason is that the stress is not linear in the live load. Increasing the live
load raises both ΣP and ΣM, which changes e; if e crosses the kern boundary the governing equation itself
changes, and within the wedge regime the stress varies as 1/(d/2 − e) rather than linearly. A rating factor
computed at one load level therefore does not scale.</p>
<p>Following Figure 7.2.7-1, this program creates a live load effect multiplier specific to each vehicle,
applies it to the live load thrusts and moments only, leaves the dead load unmodified, and searches for the
multiplier that brings the governing section exactly to the allowable stress. That multiplier is the rating
factor. The search is a bisection carried to 48 iterations, and the maximum is taken over every section at each
step so the governing section may migrate as the multiplier changes — which it does, and which is the whole
reason the iteration is necessary.</p>

<h3>6.3a The optional shear check</h3>
<p>Demand is the <b>average</b> shear on the bed area, τ = V/A, with V resolved on the section normal and
averaged across the two adjacent element ends — the same basis as the thrust. A rectangular section under a
parabolic distribution peaks at 1.5V/A; if the allowable in hand refers to a peak fibre stress rather than a
mean, divide it by 1.5 before entering it.</p>
<p>Because demand is linear in the live load multiplier, the shear rating factor is solved directly rather than
by iteration: it is the largest m satisfying |V<sub>DL</sub> + m·V<sub>LL</sub>| ≤ f<sub>v</sub>A.</p>
<p><b>Two cautions before relying on it.</b> First, a constant allowable takes no account of the normal thrust,
and thrust is what actually resists sliding in a masonry bed joint — a springing carrying 25 k/ft has far more
sliding resistance than a crown carrying 3 k/ft, and this model does not represent that. A Mohr-Coulomb form,
c·A + μ·P, is the physically appropriate one for masonry. Second, springline shear is high and strongly
mesh-dependent: on a 40 ft example the dead-load shear stress at the springline runs 13.2 psi at ten elements
and 5.3 psi at eighty. A low allowable can therefore be exceeded by dead load alone, and the mesh will change
whether it is. Run the element count up before concluding that shear controls.</p>

<h3>6.4 Vehicle position</h3>
<p>§7.2.7.8B requires live loads to be positioned so as to maximise the load effect at each node, and suggests
superimposing a transparent wheel load pressure umbrella over a scaled longitudinal section to do so. The
program sweeps each vehicle across the structure in quarter-foot steps in both directions and evaluates the
rating at every position, and provides exactly that umbrella view on the Live Load tab.</p>
`],

["m7","7. Verification",()=>`
<h3>7.1 What has been verified, and how</h3>
<p>No independent commercial analysis has yet been run against this program. The following closed-form and
invariant checks were performed on the solver and are reproducible.</p>

<h4>7.1.1 Two-hinged parabolic arch under uniform load</h4>
<p>A parabolic arch with pinned springings carrying a uniform load over its horizontal projection is funicular:
the closed-form horizontal thrust is H = wL²/8R and the moment is zero everywhere. Modeling a 100 ft span of
20 ft rise with a thin ring and a uniform load of 1 k/ft:</p>
<ul>
<li>Numerical thrust 62.54 against the closed form 62.50 — <b>0.069% error</b>.</li>
<li>Maximum moment anywhere <b>0.0018% of H·R</b>, that is, zero to plotting accuracy.</li>
</ul>
<p>The small residuals are real physical effects, not numerical error: axial shortening of the rib, and the fact
that a parabolic intrados offset normally by d/2 is not itself exactly parabolic.</p>

<h4>7.1.2 Global equilibrium</h4>
<p>Under an arbitrary asymmetric nodal load pattern, the sum of the vertical reactions recovered from the
section forces matched the applied load to <b>0.000%</b>, and the two horizontal thrusts balanced to
<b>1×10⁻¹³</b>, for both fixed and pinned restraint.</p>

<h4>7.1.3 Symmetry</h4>
<p>On a geometrically symmetric arch, every influence ordinate must mirror. Maximum mirror asymmetry across all
sections and all load positions was <b>2×10⁻¹³</b> for moment, thrust and shear — machine precision. This test
originally failed with an error of 0.77 in thrust and is what exposed the section force recovery defect
described in Part 5.3.</p>

<h4>7.1.4 Mesh convergence</h4>
<p>Refining a 40 ft fixed arch from 10 to 80 elements, the springline moment under a unit crown load converged
monotonically at approximately second order:</p>
<table class="vartab"><thead><tr><th>Elements</th><th>M at springline</th><th>M at crown</th><th>Thrust</th></tr></thead>
<tbody>
<tr><td class="s">10</td><td>−1.29590</td><td>−2.31357</td><td>0.90219</td></tr>
<tr><td class="s">20</td><td>−1.35237</td><td>−2.36871</td><td>0.90232</td></tr>
<tr><td class="s">40</td><td>−1.36654</td><td>−2.38245</td><td>0.90236</td></tr>
<tr><td class="s">80</td><td>−1.37009</td><td>−2.38589</td><td>0.90237</td></tr>
</tbody></table>
<p>This is the source of the caution in Part 1.3.6: at the code minimum element count the springline moment is
about 5% below converged, in the unconservative direction.</p>

<h4>7.1.5 Closed-form stress checks</h4>
<p>The stress equations were verified against hand values at e = 0 (f = P/A), at e = d/6 (f = 2P/A, the kern
boundary, where both branches must and do agree), and in the wedge regime.</p>

<h3>7.2 Independent verification against Midas Civil</h3>
<p>The Verification tab exports a Midas Civil MCT file of the current model and compares imported beam force
results against the internal influence coefficients. The workflow is: export the MCT, import and run it in
Midas, display beam forces for all elements and all unit load cases with both member ends shown, and paste the
result table back into the program.</p>
<p>Two conventions must be reconciled before any comparison is meaningful, and the program determines both
from the data rather than assuming them. The <b>I/J end convention</b> — whether a program reports the internal
force diagram, which carries the same sign at both ends of a member, or the applied end forces, which are
opposite — is detected from continuity: at a node carrying no applied load the two adjacent element ends must
report the same section force, and the program counts the evidence and reports it. The <b>global sign
convention</b> for axial force and moment is then chosen as the combination giving closest agreement, and the
choice is displayed rather than applied silently. Imported element end forces are put through this program's
own section force recovery before comparison, so the test isolates the solve rather than the post-processing.</p>
<p>Agreement is reported per ordinate as a percentage of the largest ordinate in that load case, not of the local
ordinate, because load cases near a springing consist mostly of ordinates a few hundredths in size where half a
rounding unit is already tens of percent. Absolute differences are reported alongside, together with the
rounding precision implied by the number of decimals actually pasted, and agreement within that precision is
reported as a pass. Two solvers running the same geometry with the same restraint and section properties should agree far
more closely than that; differences of a few percent usually mean the two models are not in fact the same, and
the geometry, restraint, section depths and unit system should be checked before either result is trusted.</p>
<h4>7.2.1 Result of a Midas comparison</h4>
<p>A model exported from this program was run in Midas Civil and the beam force results imported back. With the
default Timoshenko formulation the <b>moment</b> ordinates agreed to <b>0.0049</b> against a rounding precision
of ±0.005 in the two-decimal Midas output — agreement to the limit of what the data can resolve. The same
comparison against Euler-Bernoulli differed by up to <b>0.045</b> in moment, about nine times the data
precision, and that is the evidence behind the beam-theory default described in Part 1.3.1a.</p>
<p><b>The thrust ordinates now agree as well, and the discrepancy is closed.</b> Earlier revisions reported a
thrust difference of 0.085, then 0.063, against the same file. Both were defects in the comparison rather than
in the solve, and both are fixed. The first was the sign-mapping search, which could not reach the correct
combination of global axial sense and moment sense, and whose continuity test was applied to thrust alone —
that test barely discriminates the shear signs on a barrel whose elements are close to radial. Continuity is
now tested on <b>both thrust and shear</b> at unloaded nodes, and the two genuinely free bits are resolved by
agreement and reported rather than assumed. The second was a basis mismatch on import, since corrected.
Re-running the same Midas file against the current build gives <b>0.0049 in moment and 0.0049 in thrust</b>,
both inside the ±0.005 rounding floor of two-decimal output.</p>
<p>One practical lesson from that episode, worth keeping. When a comparison shows a large difference, suspect
the geometry and the mapping before the solver. A second Midas file, run on a model whose dimensions were not
recorded, still shows a large difference here, and a sweep over plausible depths, spans and rises does not
bring it below 0.37 in moment — which is the signature of comparing against the wrong model, not of two
solvers disagreeing. Record the exact inputs alongside any Midas run kept as evidence.</p>
<h4>7.2.2 Checking the dead load, including lateral earth pressure</h4>
<p>The MCT exports the dead load as <b>five separate load cases</b> rather than one combined case, so each can
be checked on its own: <span class="mono">DLFILL</span> (fill weight over the extrados),
<span class="mono">DLWS</span> (wearing surface), <span class="mono">DLSDL</span> (superimposed dead load per
§7.2.7.4B), <span class="mono">DLSELF</span> (ring self weight) and <span class="mono">DLEARTH</span> (the
lateral earth pressure of §7.2.7.5B, written as a horizontal GX element load). Every case is written as a
linearly varying element load, matching the clauses. Each of the five was solved independently from the
exported file and reproduced this program's own component results to <b>6×10⁻⁶</b>, which is the rounding of
the coordinates and load intensities written into the MCT — that is, exactly. Running them separately in Midas
is the quickest way to isolate a dead load disagreement, and the lateral earth pressure is the case worth
checking first because it rests entirely on the assumed K.</p>
<p><b>Dead load is exported one case per component</b> — DLFILL, DLWS, DLSDL, DLSELF and DLEARTH — matching
the five the program solves separately, with a DL_ALL combination summing them. Each can therefore be checked
against its own column in the Dead Load and Nodal Results tables. The lateral earth pressure case is the one
most worth checking, since it rests entirely on the assumed coefficient of §7.2.7.5B and supplies a large share
of the springline moment. Solving all five independently from the exported file reproduces the program's own
component solve to within 2×10⁻⁶ at every node.</p>
<p>The <b>unit load walk-through</b> on the Influence Lines tab is built for this comparison. Each position of
the 1 kip load is one load case in the exported model, named UN2, UN3 and so on, and the panel reports that
name alongside the three ordinates at the section of interest and a table of section forces everywhere for that
single case. That is the direct analogue of one Midas beam force table, so the two can be reconciled a case at
a time rather than by trying to match a whole curve at once.</p>
<p><b>Read the absolute difference, not the percentage, when the pasted data is coarse.</b> Midas prints beam
forces to two decimal places by default. Printing an exact value at two decimals loses up to half a unit, so
two programs in perfect agreement still differ by up to 0.005 in every ordinate — this was confirmed by taking
this program's own exact results, rounding them to two decimals, and comparing them back, which reproduces a
worst error of exactly 0.00500 in both moment and thrust with no second solver involved. Because thrust
ordinates are of order one while moment ordinates near a springing are hundredths, the same rounding loss shows
up as a fraction of a percent in thrust and as tens of percent in moment. Neither is a model difference.
Increase the decimal places in the Midas results table before copying — five or six removes the limitation
entirely and makes every percentage meaningful.</p>
<p>Two cautions from that exercise. The arch axis is the intrados offset by d/2, so on a deep or
near-semicircular ring the modeled axis spans noticeably more than the clear span — the Model tab reports both
— and a Midas model built on the intrados will not match. And the comparison is only meaningful if the file
that was run is the file the current inputs would export; re-export before comparing.</p>
<p>Until results are imported for the structure at hand, the dashboard reports this check as N/A rather than as
a pass. The facility exists so that the engineer of record can perform and document the comparison for their
own bridge.</p>

<h3>7.3 What has NOT been verified</h3>
<ul>
<li>No comparison against LimitState:RING, Archie-M, or any other limit-analysis program. Those methods
generally show more reserve capacity than an elastic frame analysis, so agreement should not be expected.</li>
<li>No comparison against a load test. One comparison against an independent consultant's calculation of a
real MassDOT structure has been made and is recorded in §5.6 below; it is a cross-check between two models,
not a check against measured behavior, and the reference calculation is itself known to contain errors.</li>
<li>The rating vehicle axle configurations were built from standard definitions and should be checked against
the user's own copy of the MassDOT figures before an issued rating.</li>
</ul>

<h3>5.6 Cross-check against an independent rating — MassDOT Bridge K-01-001 (9JK)</h3>
<p>Main Street over Jones River, Kingston. A single-span granite segmental arch, 20 ft clear span, 4 ft rise,
ring 20 in at the crown to about 23.5 in at the springings, roughly 1.24 ft of fill over the crown plus 6 in of
bituminous pavement, 50 ft wide, f<sub>a</sub> = 640 psi. The reference is a consultant's calculation package
dated February 2021, built on a 26-element Midas Civil model with fixed springings, following the same §7.2.7
procedure. It is an independent implementation: different analyst, different solver, different geometry
take-off from the same field measurements.</p>

<p><b>Read this as a cross-check between two models, not as a check against truth.</b> The reference package
contains errors of its own, identified below. Where the two disagree it is not automatically this program that
is wrong, and it is not automatically the reference either.</p>

<p>Run on the reference package's own distribution assumption — tire footprint transversely, wheel concentrated
longitudinally, which is this program's default — the two agree as follows on governing rating factor:</p>

<table class="t">
<tr><th>Vehicle</th><th>Reference, 2021</th><th>This program</th><th>Difference</th></tr>
<tr><td>Type 3</td><td>1.270</td><td>1.243</td><td>−2.1%</td></tr>
<tr><td>Type 3S2</td><td>1.393</td><td>1.364</td><td>−2.1%</td></tr>
<tr><td>H20</td><td>0.805</td><td>0.656</td><td>−18.5%</td></tr>
<tr><td>HS20</td><td>0.807</td><td>0.656</td><td>−18.7%</td></tr>
<tr><td>SU4 – SU7</td><td>1.585 – 4.153</td><td>1.243 – 1.247</td><td>see below</td></tr>
</table>

<p>Type 3 and Type 3S2 agree to about 2%, which for two independently built models of the same masonry arch
exercises the geometry fit, the ring taper, the fill and superimposed dead loads, the lateral earth pressure,
the impact banding, the influence coefficients and the kern / pressure-wedge stress check all at once. The
strip load delivered to the crown by a 32 kip axle is 9.600 kip here against the reference's 9.58 kip.</p>

<p><b>The H20 and HS20 residual is the reference's iteration, not a modelling difference.</b> §7.2.7.12 and
Figure 7.2.7-1 require the live load effect multiplier to be iterated until the rating factor equals 1.0. The
reference ran iteration 1, obtained 0.205, ran iteration 2, obtained 0.805, and stopped. Carried to convergence
on the reference's own load effects the answer is about 0.65. This program solves the multiplier directly by
bisection on the actual stress state, so it lands on the converged value in one pass.</p>

<p><b>The SU4–SU7 residual is a position sweep.</b> All four vehicles share a 17 kip maximum axle, and on a 20 ft
span with a single governing axle they should rate within a fraction of a percent of one another, which is what
this program produces. A reference spread of 1.585 to 4.153 across those four is the signature of a sweep step
coarse enough to step over the governing placement. This program sweeps at a true quarter foot and reports the
step actually used.</p>

<p>Three further differences are worth recording because they are choices rather than errors on either side.
The reference placed its model axis on a best-fit curve that does not lie at mid-depth of the ring, which
§7.2.7.2B requires; its own geometry sheet is internally inconsistent, quoting radii that imply a 35 in ring
against a block schedule of 20 to 23.5 in. The reference applied a 10% section loss to the capacity check but
not to the model that generated the demands, so demand and capacity are computed on different sections. And the
reference distributed the wearing surface over the roadway width where this program distributes it over the
barrel width, which §7.2.7.4B directs; that difference is worth about 0.5 kip of springing thrust here and is
part of why this program's dead load runs 20 to 30% above the reference's.</p>

<p>The reference also omits EV2 and EV3, which §7.2.7.11B requires be rated at the Inventory level and reported
at both Inventory and Operating. On this structure EV2 governs.</p>

<div class="msg m-wrn"><b>Recommendation.</b> Before issuing a rating from this program, use the Verification
tab to rebuild the arch in Midas Civil and confirm the influence ordinates agree. The solver has been shown to
be self-consistent, to reproduce closed-form solutions, and to agree within about 2% with an independent
consultant's Midas-based rating of a real MassDOT arch (§5.6) — necessary, but not sufficient for a stamped
calculation. Include the comparison table in the calculation package.</div>
`],

["m8","8. Worked Example",()=>`
<h3>8.1 Problem</h3>
<p>A single-span circular stone arch, 40 ft clear span and 10 ft rise, prismatic ring 2.0 ft deep, level grade
with 2.0 ft of fill over the crown and a 4 in bituminous wearing surface. Masonry at 170 pcf, fill at 120 pcf,
wearing surface at 140 pcf, K = 0.25, E = 1500 ksi, fixed springings, allowable compressive stress 250 psi,
crown impact basis, 20 elements. Rate the HS20 vehicle.</p>

<h3>8.2 Inputs to enter</h3>
<p>Geometry source <i>Idealized curve</i>, circular, span 40, rise 10; restraint <i>Fixed</i>; elements 20;
ring depth 2.0 at both crown and springings; grade definition <i>Crown cover + slope</i>, cover 2.0, slope 0;
wearing surface 0.33; unit weights 170 / 120 / 140; K 0.25; E 1500; impact basis <i>Crown fill</i>;
f<sub>a</sub> 250; vehicle HS20.</p>

<h3>8.3 Expected results</h3>
<ul>
<li>Crown cover plus wearing surface = 2.33 ft, so impact <b>I = 10%</b> per Std. Spec. 3.8.2.3.</li>
<li>Dead load at the crown: thrust <b>17.64 k/ft</b>, moment <b>−0.03 k·ft/ft</b>, eccentricity <b>0.002 ft</b>
— essentially funicular under dead load alone, as expected for a well-proportioned arch under its own fill.</li>
<li>Dead load at the springline: moment <b>−7.30 k·ft/ft</b> — hogging, tension at the extrados, which is the
fixed-end restraint moment.</li>
<li>HS20 rating factor <b>RF ≈ 1.33</b>, giving <b>≈ 47.9 tons</b>, governing at a <b>springline</b>.</li>
</ul>

<h3>8.4 Confirming the behavior</h3>
<p>Two sensitivity checks worth running to confirm the program behaves as documented:</p>
<ul>
<li>Change the restraint to <b>pinned</b>. The springline moment must become exactly zero, the governing section
must move inboard, and the rating factor should rise to about <b>1.77</b>.</li>
<li>Add a ring depth override bracketing a deteriorated crown zone — three lines,
<span class="mono">15, 2.0</span> / <span class="mono">20, 1.2</span> / <span class="mono">25, 2.0</span>.
The rating factor should fall sharply, to roughly <b>0.24</b>, and the governing section should move to the
crown. This demonstrates how strongly effective ring depth controls the rating. Note that the override needs at
least two points; a single point is rejected because it would be a depth discontinuity at one node.</li>
<li>Switch <b>shear deformation</b> to <i>Neglect</i>. The springline dead load moment should rise from about
6.98 to 7.13 k·ft/ft and the rating factor fall to about 1.11 — the slender-beam idealization delivering more
moment to the supports.</li>
</ul>
`],

["m9","9. Notation and References",()=>`
<h3>9.1 Notation</h3>
<table class="vartab"><thead><tr><th>Symbol</th><th>Units</th><th>Meaning</th></tr></thead><tbody>
<tr><td class="s">A</td><td>ft²/ft</td><td>Bearing area of the section on the one-foot strip; the effective
(reduced) area in the pressure wedge regime</td></tr>
<tr><td class="s">b</td><td>ft</td><td>Analysis strip width, 1.0</td></tr>
<tr><td class="s">b<sub>t</sub>, ℓ<sub>t</sub></td><td>ft</td><td>Tire contact width and length, 20 in and 10 in</td></tr>
<tr><td class="s">d</td><td>ft</td><td>Ring depth at the section</td></tr>
<tr><td class="s">E</td><td>ksi</td><td>Masonry modulus of elasticity</td></tr>
<tr><td class="s">e, e<sub>k</sub></td><td>ft</td><td>Eccentricity of the combined thrust; kern limit d/6</td></tr>
<tr><td class="s">f, f<sub>a</sub></td><td>psi</td><td>Peak compressive stress; allowable compressive stress</td></tr>
<tr><td class="s">g</td><td>%</td><td>Roadway grade</td></tr>
<tr><td class="s">H</td><td>ft</td><td>Depth from roadway surface to extrados at a node</td></tr>
<tr><td class="s">h<sub>f</sub></td><td>ft</td><td>Fill height, extrados to bottom of wearing surface</td></tr>
<tr><td class="s">I</td><td>%</td><td>Impact percentage</td></tr>
<tr><td class="s">K</td><td>—</td><td>Lateral earth pressure coefficient, 0.25 per §7.2.7.5B</td></tr>
<tr><td class="s">L<sub>c</sub></td><td>ft</td><td>Clear span of the intrados</td></tr>
<tr><td class="s">L<sub>s</sub>, w<sub>t</sub></td><td>ft</td><td>Longitudinal and transverse spread dimensions at depth H</td></tr>
<tr><td class="s">m</td><td>—</td><td>Live load effect multiplier; equals RF at convergence</td></tr>
<tr><td class="s">M, P, V</td><td>k·ft/ft, k/ft</td><td>Section moment, thrust (compression positive), shear</td></tr>
<tr><td class="s">p</td><td>ksf</td><td>Pressure on the extrados from the spread wheel load</td></tr>
<tr><td class="s">q<sub>j</sub></td><td>k/ft</td><td>Equivalent nodal live load at node j</td></tr>
<tr><td class="s">RF</td><td>—</td><td>Rating factor, Inventory level</td></tr>
<tr><td class="s">r, c</td><td>ft</td><td>Radius of gyration; distance from neutral axis to extreme fiber</td></tr>
<tr><td class="s">s<sub>g</sub></td><td>ft</td><td>Wheel gage, 6.0</td></tr>
<tr><td class="s">t<sub>ws</sub></td><td>ft</td><td>Wearing surface thickness</td></tr>
<tr><td class="s">η</td><td>—</td><td>Influence ordinate</td></tr>
<tr><td class="s">γ<sub>m</sub>, γ<sub>f</sub>, γ<sub>ws</sub></td><td>pcf</td><td>Unit weight of masonry, fill, wearing surface</td></tr>
</tbody></table>

<h3>9.1a Railroad loading</h3>
<p><b>Impact.</b> Railroad impact uses the AREMA expression IM = [1 − (H − 1.5)/8.5] × 0.60, where H is the
depth from the base of rail to the top of the arch. That gives 60% at 1.5 ft of cover and falls linearly to
zero at 10 ft; outside that range it is clamped rather than extrapolated. The base of rail is the top of the
tie, which is the surface cover is measured from in this program, so the same depth drives both the load spread
and the impact. This differs sharply from the highway rule at depth — Std. Spec. 3.8.2.3 gives zero beyond 3 ft
where AREMA still requires about 28%. The crown and local bases apply as they do for highway loading.</p>
<p>Railroad rating vehicles are the Cooper E-80 consist, the F40PH, HSP-46 and ES44AC locomotives, the 286K and
315K CSX cars, and a transit set comprising the #3 Red Line 3-car train, the 80K ballast surge car 4-car train,
and the Harsco TS-30 and Mark IV maintenance cars. Axle loads, spacings and uniform trailing loads were taken
from the user's reference application; the Cooper E-80 set reproduces the standard
8-5-5-5-9-5-6-5-8-8-5-5-5-9-5-6-5 spacing totalling 1136 kip over 104 ft with an 8,000 lb/lf trailing load.</p>
<p>The trailing load acts continuously behind the consist and is swept with it, so positions where the consist
has largely left the structure and the trailing load alone bears on the span are included in the search. On
short spans that case can govern.</p>
<p><b>Distribution.</b> Load passes from the rails into the ties and enters the fill at the bottom of the ties,
over the tie length transversely and over 3.0 ft longitudinally. Below that level it spreads at 1 horizontal to
1 vertical, giving a transverse width of L<sub>tie</sub> + 2h and a longitudinal length of 3.0 + 2h at depth h
below the ties. Where the transverse widths of adjacent tracks overlap, the outer limits are taken and the
combined load of those tracks is distributed uniformly across that width, following the treatment AASHTO
applies to overlapping distribution widths. Every track entered is loaded simultaneously; enter a single track
to rate for one-track loading.</p>
<p><b>Reporting.</b> Cooper ratings are reported as an E-number, RF × 80. A tonnage figure is also shown, but
for Cooper it derives from the same 80 kip reference and is not a physical vehicle weight. For the locomotives
and cars the tonnage is the actual vehicle weight and is the meaningful figure.</p>

<h3>9.2 References</h3>
<ol>
<li>Massachusetts Department of Transportation, <i>LRFD Bridge Manual, Part I</i>, Chapter 7 — Load Rating,
§7.2.7 Special Instructions for Load Ratings of Stone Masonry Arches, including Figure 7.2.7-1.</li>
<li>AASHTO, <i>Manual for Bridge Evaluation</i>, Art. 6A.9.1 — evaluation of unreinforced masonry arches by the
Allowable Stress method.</li>
<li>AASHTO, <i>Manual for Bridge Evaluation</i>, Art. 6B.5.2.6 — allowable stresses in masonry; Art. 6B.7 — posting.</li>
<li>AASHTO, <i>Standard Specifications for Highway Bridges</i>, Art. 6.4 — distribution of wheel loads through
fill; Art. 3.8.2.3 — impact by depth of fill; Art. 3.24.3 — slab distribution for shallow fill.</li>
<li>Boothby, T. E., <i>Load Rating of Masonry Arch Bridges</i>, Journal of Bridge Engineering — elastic frame
analysis with zero tensile strength, the lineage of the §7.2.7 procedure.</li>
<li>Kåsa, I., <i>A Circle Fitting Procedure and Its Error Analysis</i>, IEEE Transactions on Instrumentation and
Measurement, 1976 — the circle fitting linearisation used for measured geometry.</li>
</ol>
`]
];

function html(forPrint){
  if(forPrint){
    return PARTS.map(p=>`<h3 style="margin-top:14px">${esc(p[1])}</h3>${p[2]()}`).join("");
  }
  let nav=`<div id="manNav" class="noprint">`+PARTS.map((p,i)=>
    `<button data-m="${p[0]}"${i===0?' class="on"':""}>${esc(p[1])}</button>`).join("")+`</div>`;
  let body=PARTS.map((p,i)=>
    `<div class="manpart${i===0?" on":""}" id="${p[0]}">${p[2]()}</div>`).join("");
  return nav+`<div class="pnl"><div class="bd">${body}</div></div>`;
}
function wireNav(){
  const nav=document.getElementById("manNav"); if(!nav)return;
  nav.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
    nav.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.querySelectorAll(".manpart").forEach(d=>d.classList.remove("on"));
    const t=document.getElementById(b.getAttribute("data-m"));
    if(t)t.classList.add("on");
    if(window.__manPart)window.__manPart(b.getAttribute("data-m"));
  });
}
return {html,wireNav,PARTS};
})();

<script>
/* ---------- mesh convergence study ----------
   Rates the model again at 2x and 4x the element count and reports the drift.
   Held against a FINGERPRINT of the model rather than against nothing: geometry,
   loading, deterioration and allowable stress all change the answer, so a result
   computed before any of them changed must not be quoted afterwards. That is the
   whole point of the exercise — it replaces a remembered figure from a different
   bridge with a measured one from this model, and a stale measured figure would
   be no better than what it replaced. */
const MESHCONV=(()=>{
  /* The render helpers live inside the R module, not on the global object, so
     every block that needs them destructures. Doing it inside this IIFE rather
     than at the top of the script block keeps it out of MCT's scope. */
  const {msg,dtab,nfx,esc}=R;
  let S=null;
  function fingerprint(p,M){
    if(!M)return "";
    return JSON.stringify([p.geoMode,p.shape,nfx(M.g.span,4),nfx(M.g.rise,4),p.support,
      p.dC,p.dS,(p.dOver||[]).map(o=>[o.x,o.d]),
      (p.deter||[]).map(e=>[e.node,e.x,e.x2,e.d,e.fa,e.hinge]),p.deterFace,
      p.gradeMode,p.gradePct,p.cover,p.covL,p.covR,p.tws,p.gm,p.gf,p.gws,p.K,p.E,
      p.shearDef,p.impMode,p.shallowE,p.shallowRate,p.fa,p.fv,p.barrelW,
      (p.sdl||[]).map(i=>i.w),p.loadMode,p.tieLen,p.tieDepth,(p.tracks||[]),
      (p.vehicles||[]).slice().sort()]);
  }
  function resultFor(M){
    if(!S||!M||S.err)return null;
    return (S.fp===fingerprint(M.p,M))?S:null;
  }
  function clear(){S=null;}
  function fail(why){S={err:why};}   // "msg" is the render helper, do not shadow it
  function run(p,M){
    if(!M)throw new Error("There is no model to study.");
    const ids=(p.vehicles&&p.vehicles.length)?p.vehicles:null;
    let veh=null;
    /* Study the vehicle that governs, since that is the number being reported.
       If nothing has been rated yet, take the heaviest of the selected set. */
    if(typeof results!=="undefined"&&results&&results.length){
      const w=results.reduce((a,b)=>a.rf<b.rf?a:b);
      veh=ARCH.ALL_VEHICLES.find(v=>v.id===w.id);
    }
    if(!veh){
      const pool=ARCH.vehiclesFor(p.loadMode).filter(v=>!ids||ids.includes(v.id));
      veh=pool.reduce((a,b)=>(!a||b.axles.reduce((x,y)=>x+y.P,0)>a.axles.reduce((x,y)=>x+y.P,0))?b:a,null);
    }
    if(!veh)throw new Error("No rating vehicle is selected, so there is nothing to converge.");
    const n1=M.nEl, n2=Math.min(2*n1,240), n4=Math.min(4*n1,240);
    const rate=(nEl)=>{
      const q=Object.assign({},p,{nEl});
      const Mm=ARCH.buildModel(q); Mm.p=q;
      return ARCH.rateVehicle(Mm,veh,q.fa,q.impMode);
    };
    const t0=Date.now();
    const r1=rate(n1), r2=rate(n2), r4=rate(n4);
    S={fp:fingerprint(p,M),veh:veh.name,vehId:veh.id,
       n1,n2,n4,rf1:r1.rf,rf2:r2.rf,rf4:r4.rf,
       sec1:CALC.secTag(M,r1.sec),ms:Date.now()-t0,
       when:new Date().toISOString().slice(0,10)};
    return S;
  }
  function block(M){
    if(S&&S.err)return msg("err","The mesh study did not complete",esc(S.err));
    const r=resultFor(M);
    if(!r){
      if(S)return msg("wn","The stored study no longer describes this model",
        "A mesh study was run, but the geometry, loading, deterioration or allowable stress has changed "+
        "since. It has been set aside rather than reported against a model it no longer describes. Run it "+
        "again.");
      return msg("inf","Not run",
        "No mesh study has been run for this model, so the size of the discretisation error is unknown. "+
        "The dashboard reports that rather than assuming the error is small.");
    }
    const drift=Math.abs(r.rf4-r.rf1)/Math.max(r.rf1,1e-9)*100;
    const last=Math.abs(r.rf4-r.rf2)/Math.max(r.rf2,1e-9)*100;
    const rows=[{__i:0,n:r.n1,rf:r.rf1,d:0,note:"the mesh in use"},
                {__i:1,n:r.n2,rf:r.rf2,d:100*(r.rf2-r.rf1)/Math.max(r.rf1,1e-9),note:"twice"},
                {__i:2,n:r.n4,rf:r.rf4,d:100*(r.rf4-r.rf1)/Math.max(r.rf1,1e-9),note:"four times"}];
    return dtab([{k:"n",h:"Elements",dp:0},{k:"rf",h:"Rating factor",dp:4},
                 {k:"d",h:"Change from the mesh in use (%)",dp:2},{k:"note",h:"",txt:1}],rows)+
      msg(drift>3?"wn":"key",
        drift>3?"The rating has not converged on the mesh in use":"Converged on the mesh in use",
        `Rated for <b>${esc(r.veh)}</b>. The rating moves <b>${nfx(drift,2)}%</b> between `+
        `${r.n1} elements and ${r.n4}, and <b>${nfx(last,2)}%</b> over the last doubling. `+
        (drift>3
          ? `Report the rating from the refined mesh, not from the mesh in use. A drift of this size means `+
            `the element count is still deciding part of the answer, and §7.2.7.2B's minimum is a compliance `+
            `floor rather than a statement that the model has settled.`
          : `The last doubling moves the answer less than the rounding this program reports to, so the `+
            `element count is no longer deciding the answer.`)+
        ` Study run ${esc(r.when)}, ${nfx(r.ms/1000,1)} s.`)+
      `<div class="note">Each row is a complete re-rate: the model is rebuilt at that element count and the
       vehicle is swept across it in both directions at the same quarter-foot step. Deterioration is located
       by station, so it stays where it was entered as the mesh changes — an entry still keyed to a node
       number would move, and the dashboard flags that separately.</div>`;
  }
  return {run,clear,fail,block,resultFor,fingerprint};
})();
const MCT=(()=>{
"use strict";

/* ---------- MCT generation ----------
   Target: Midas Civil, X-Z plane frame (structure type 1).
   Nodes carry X and Z; Y is zero. Vertical is global Z, so downward
   loads are -Z and bending is about the global Y axis.               */
function generate(M,p,opt){
  opt=opt||{};
  const nl=[];
  const W=s=>nl.push(s);
  const f=(v,dp)=>Number(v).toFixed(dp==null?6:dp);
  const E_ksf=p.E*144;
  const nN=M.nN, nEl=M.nEl;
  const stamp=new Date().toISOString().slice(0,19).replace("T"," ");

  W("; ==========================================================");
  W("; Stone Masonry Arch — Midas Civil MCT import file");
  W("; Generated by Stone Arch LR (Mario Lococo)   "+stamp);
  W(";");
  W("; Purpose: rebuild this arch independently in Midas Civil and");
  W(";          compare influence coefficients against the internal");
  W(";          solver, per MassDOT BM Pt.I §7.2.7.7B.");
  W(";");
  W("; Block formats follow a working Midas MCT export. A previous import of a");
  W("; file from this program parsed every block, so *NODE, *ELEMENT, *SECTION,");
  W("; *MATERIAL, *CONSTRAINT, *STLDCASE, *CONLOAD, *BEAMLOAD and *FRAME-RLS are");
  W(";   confirmed");
  W("; against Midas. If an import fails, the *LOADCOMB block at the end is the");
  W("; only convenience item and can be switched off in the export options.");
  W(";");
  W("; Model: 2-D plane frame, X-Z plane, one-foot-wide strip at the");
  W(";        mid-depth of the ring. Units KIPS / FT.");
  W("; Springings: "+(p.support==="pinned"?"PINNED (rotation released)":"FIXED (fully built in)"));
  W("; Elements: "+nEl+"   Nodes: "+nN);
  W("; Material density is set to ZERO so that Midas adds no self");
  W("; weight; all dead load is applied explicitly as element loads.");
  W("; ==========================================================");
  W("");
  W("*VERSION");
  W("   8.8.5");
  W("");
  W("*UNIT    ; Unit System");
  W("; FORCE, LENGTH, HEAT, TEMPER");
  W("   KIPS , FT, BTU, F");
  W("");
  W("*STRUCTYPE    ; Structure Type");
  W("     0, 1, 1, NO, NO, 32.1719, 0, NO, NO, NO");
  W("");
  W("*MATERIAL    ; Material");
  W("; iMAT, TYPE, MNAME, SPHEAT, HEATCO, PLAST, TUNIT, bMASS, DAMPRATIO, [DATA1]");
  W(";   [DATA1] : 2, ELAST, POISN, THERMAL, DEN, MASS");
  W("    1, USER , MASONRY            , 0, 0, , F, NO, 0.02, 2, "+f(E_ksf,1)+", 0.2, 0, 0, 0");
  W("");

  /* sections — one per element so a varying ring depth is carried exactly */
  W("*SECTION    ; Section  (SB = solid rectangle, H x B)");
  W("; iSEC, TYPE, SNAME, [OFFSET], bSD, bWE, SHAPE, [DATA1]");
  W(";   [DATA1] : H, B      H = ring depth at element mid-length, B = 1.00 ft strip");
  for(let e=0;e<nEl;e++){
    const d=(M.g.nodes[e].d+M.g.nodes[e+1].d)/2;
    /* NOTE: field counts here follow what the Midas IMPORT parser accepts, which
       is not the same as what Midas WRITES on export. Midas exports a 24-field
       DBUSER/SB line and a 9-field CONLOAD line; padding this file to match the
       export form causes "the number of parameters are too many" on import.
       These shorter forms are the ones confirmed to import. */
    W("    "+(e+1)+", DBUSER    , "+("RING"+(e+1)).padEnd(20)+", CC, 0, 0, 0, 0, 0, 0, YES, NO, SB , 2, "+
      f(d,6)+", 1.000000");
  }
  W("");

  W("*NODE    ; Nodes on the arch axis (intrados offset normally by d/2)");
  W("; iNO, X, Y, Z");
  for(let i=0;i<nN;i++){
    const n=M.g.nodes[i];
    W("   "+(i+1)+", "+f(n.x,6)+", 0.000000, "+f(n.y,6));
  }
  W("");

  W("*ELEMENT    ; Elements");
  W("; iEL, TYPE, iMAT, iPRO, iN1, iN2, ANGLE, iSUB");
  for(let e=0;e<nEl;e++)
    W("   "+(e+1)+", BEAM, 1, "+(e+1)+", "+(e+1)+", "+(e+2)+", 0, 0");
  W("");

  W("*CONSTRAINT    ; Supports at the springings");
  W("; NODE_LIST, CONST(Dx,Dy,Dz,Rx,Ry,Rz), GROUP");
  W(";   Model is in the X-Z plane; the active degrees of freedom are Dx, Dz and Ry.");
  const cs=(p.support==="pinned")?"111100":"111110";
  W(";   "+(p.support==="pinned"?"Pinned: Ry released.":"Fixed: all six restrained."));
  W("   1, "+cs+", ");
  W("   "+nN+", "+cs+", ");
  W("");

  /* Beam end releases. A moment release at a node is applied to ONE of the two
     element ends meeting there — releasing both would leave the node's rotation
     unrestrained and the model singular — and this mirrors the internal solver
     exactly: an interior release at node h goes on the J end of element h-1,
     and a release at the left springing goes on the I end of element 1. */
  {
    const hs=Object.keys(M.hinges||{}).map(Number).sort((a,b)=>a-b);
    const ks=M.p&&M.p.__ksN?M.p.__ksN:{};
    const kNodes=Object.keys(ks).map(Number).filter(n=>!M.hinges[n]).sort((a,b)=>a-b);
    /* Two things the exported model cannot carry, stated rather than omitted.

       A capacity-only depth reduction is not a structural property at all — the
       ring is analysed sound and the reduced depth is used only in the stress
       check here — so there is nothing to write and Midas is right not to see
       it. A reader comparing section depths between the two models needs to know
       that before concluding they disagree.

       A derived partial release IS structural, but Midas expresses partial
       fixity as a normalised value whose reference this program has not
       confirmed, and writing a number whose meaning is uncertain is worse than
       writing none. The required rotational spring stiffness is given instead,
       in the file's own units, so it can be entered by hand. */
    if(kNodes.length||(M.dCap&&Object.keys(M.dCap).length)){
      W("; ---------------------------------------------------------------------");
      W("; NOT REPRESENTED IN THIS MODEL");
      if(M.dCap&&Object.keys(M.dCap).length){
        W(";   Capacity-only depth reductions. These are not structural: the ring");
        W(";   is analysed with its sound section here too, and the reduced depth");
        W(";   is used only in the stress check. Section depths in this file are");
        W(";   therefore the SOUND depths and are correct as written:");
        for(const k of Object.keys(M.dCap).map(Number).sort((a,b)=>a-b))
          W(";     node "+(k+1)+" — checked on "+f(M.dCap[k]*12,2)+" in, analysed on "+
            f(M.g.nodes[k].d*12,2)+" in");
      }
      if(kNodes.length){
        W(";   Partial moment releases derived from the section loss. Midas can");
        W(";   carry these with bVALUE = YES and a partial-fixity value in the My");
        W(";   field, but the normalisation of that value is not confirmed here,");
        W(";   so it is not written. Enter a rotational spring of:");
        for(const k of kNodes)
          W(";     node "+(k+1)+" — k_theta = "+f(ks[k],1)+" kip-ft/rad per ft of barrel width");
        W(";   A full release is written below; these partial ones are not.");
      }
      W("; ---------------------------------------------------------------------");
      W("");
    }
    if(hs.length){
      /* Format confirmed against a release written by Midas itself. TWO lines
         per element: the i end on the first, the j end on the second. FLAG is a
