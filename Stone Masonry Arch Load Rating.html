     span. They coincide for a circular or parabolic fit but not for a
     fifth-order or measured fit whose crown sits off-centre — which is exactly
     the case the measured-geometry mode exists to serve. */
  const xc=(g.xCrown!=null)?g.xCrown:(g.xmin+g.xmax)/2;
  const COMPS=["fill","ws","sdl","self","earth"];
  /* §7.2.7.4B: sidewalks, wearing surfaces, railings, curbs and spandrel
     walls are computed and EQUALLY DISTRIBUTED ACROSS THE WIDTH of the
     arch. Line items are entered as weight per foot of bridge length and
     converted to an equivalent pressure on the one-foot strip. */
  const sdlLine=(p.sdl||[]).reduce((s,it)=>s+(+it.w||0),0)/1000;   // k/ft of span
  const wSdl=(p.barrelW>0)?sdlLine/p.barrelW:0;                    // k/ft² on the strip
  /* Surface loads — fill, wearing surface, superimposed dead load — are carried
     on the horizontal projection of the EXTRADOS, because that is the surface
     they bear on. The axis chord is shorter than the extrados chord wherever the
     ring is deep and curving, so projecting on the axis understates these loads
     in the same way and by the same proportion as an axis-based live load
     tributary would. Ring self weight still uses the axis, correctly: it is the
     weight of the ring itself, distributed along the arc.
     `cx` below is the extrados horizontal projection factor for the element. */
  function elemIntensity(el,which){
    const a2=g.nodes[el.a], b2=g.nodes[el.b];
    const exL=Math.hypot(b2.extX-a2.extX,b2.extY-a2.extY)||el.L;
    const cx=Math.abs((b2.extX-a2.extX)/exL)*(exL/el.L);   // extrados projection per unit axis length
    const ends=[a2,b2];
    return ends.map(n=>{
      const hf=Math.max(g.bwsAt(n.extX)-n.extY,0);
      let fx=0,fy=0;
      if(which==="fill") fy=-(gf*hf)*cx;
      else if(which==="ws") fy=-(gws*p.tws)*cx;
      else if(which==="sdl") fy=-wSdl*cx;
      else if(which==="self") fy=-(gm*n.d);
      else if(which==="earth"){
        const xm=(g.nodes[el.a].x+g.nodes[el.b].x)/2;
        const dirx=(Math.abs(xm-xc)<1e-9)?0:(xm<xc?1:-1);
        /* LATERAL EARTH PRESSURE IS TAKEN ENTIRELY ON THE ARCH AXIS.
           Depth is measured from the grade line down to the axis, and the
           pressure is applied to the axis element over the axis vertical
           projection — one datum, the structural centreline, for both.

           This is a deliberate simplification adopted at v2026.08.10u, not an
           oversight. The alternative is to reference the extrados: the soil does
           bear on that face, and the vertical fill load is computed there for
           exactly that reason. But doing so for the lateral load splits it
           across two surfaces — the pressure magnitude off one, the line of
           action off the element it is applied to, d/2 away along the normal —
           and carrying that offset honestly means adding an eccentric couple
           the frame model has no natural place for. §7.2.7.5B says the loads
           shall be computed along the vertical heights of each element and
           applied as linearly varying loads to each element; the element is the
           axis, so taking depth and projection there is the literal reading and
           is self-consistent.

           The two treatments are close. On BIN 74Q the axis basis lowers the
           E-80 rating about 1.3% and on K-01-001 it raises the highway ratings
           about 0.7%, in both cases because the axis sweeps less vertical extent
           than the extrados while sitting deeper. Note the vertical fill load is
           NOT affected and remains on the extrados, where the fill physically
           bears on the ring — the two loads reference different surfaces by
           design, and the Earth Pressure tab says so.

           The wearing surface is a SURCHARGE on the fill and belongs in the
           vertical stress at its own unit weight: the fill height stops at the
           bottom of the pavement and is weighed at gamma_f, and the pavement
           adds gamma_ws*t_ws on top of it. */
        const hAx=Math.max(g.bwsAt(n.x)-n.y,0);
        const axS=Math.abs((b2.y-a2.y)/el.L);
        fx=dirx*p.K*(gf*hAx+gws*p.tws)*axS;
      }
      return {fx,fy};
    });
  }
  function solveComponent(which){
    const fe=[], F=new Array(nf).fill(0);
    for(const el of els){
      const fg=elemIntensity(el,which);
      const qa=fg.map(f=>f.fx*el.c+f.fy*el.s);
      const qt=fg.map(f=>-f.fx*el.s+f.fy*el.c);
      let v=feTrap(el.L,qa[0],qa[1],qt[0],qt[1]);
      for(const r of (el.rels||[]))v=releaseFe(v,r);
      fe.push(v);
      const vG=new Array(6).fill(0);
      for(let r=0;r<6;r++){let s=0;for(let k=0;k<6;k++)s+=el.T[k][r]*v[k];vG[r]=s;}
      const dofs=[3*el.a,3*el.a+1,3*el.a+2,3*el.b,3*el.b+1,3*el.b+2].map(d=>map[d]);
      for(let r=0;r<6;r++)if(dofs[r]>=0)F[dofs[r]]+=vG[r];
    }
    return {forces:sectionForces(solveF(F),fe),fe};
  }
  const DLC={};
  for(const w of COMPS)DLC[w]=solveComponent(w).forces;
  const DL=new Array(nN);
  for(let i=0;i<nN;i++){
    let C=0,V=0,Mm=0;
    for(const w of COMPS){C+=DLC[w][i].C;V+=DLC[w][i].V;Mm+=DLC[w][i].M;}
    DL[i]={C,V,M:Mm};
  }

  /* ---- influence lines: unit nodal loads (§7.2.7.7B) ---- */
  const ILC=[],ILV=[],ILM=[];
  for(let i=0;i<nN;i++){ILC.push(new Array(nN).fill(0));ILV.push(new Array(nN).fill(0));ILM.push(new Array(nN).fill(0));}
  for(let j=1;j<nN-1;j++){
    const loads=new Array(nN).fill(null);loads[j]={fx:0,fy:-1};
    const F=sectionForces(solveNodal(loads),null);
    for(let i=0;i<nN;i++){ILC[i][j]=F[i].C;ILV[i][j]=F[i].V;ILM[i][j]=F[i].M;}
  }

  /* support reactions from the end section forces */
  function reactions(F){
    /* The end-node section forces are reported in the adjacent element's own
       chord basis, so they must be converted back on that same basis — using
       the curve normal here would not undo the projection and the reactions
       would not balance the applied load. */
    const e0=els[0], eL=els[nEl-1];
    const tA={x:e0.c,y:e0.s}, nA={x:-e0.s,y:e0.c};
    const tB={x:eL.c,y:eL.s}, nB={x:-eL.s,y:eL.c};
    const gL={x:F[0].C*tA.x+F[0].V*nA.x, y:F[0].C*tA.y+F[0].V*nA.y};
    const gR={x:-(F[nN-1].C*tB.x+F[nN-1].V*nB.x), y:-(F[nN-1].C*tB.y+F[nN-1].V*nB.y)};
    return {L:{Rx:gL.x,Ry:gL.y,Mz:F[0].M}, R:{Rx:gR.x,Ry:gR.y,Mz:-F[nN-1].M}};
  }

  /* influence line summary: peak ordinates and where they occur */
  const ILsum=new Array(nN);
  for(let i=0;i<nN;i++){
    let mx=-1e30,mn=1e30,jx=-1,jn=-1;
    for(let j=1;j<nN-1;j++){
      if(ILM[i][j]>mx){mx=ILM[i][j];jx=j;}
      if(ILM[i][j]<mn){mn=ILM[i][j];jn=j;}
    }
    ILsum[i]={maxM:mx,maxAtX:jx>=0?g.nodes[jx].x:NaN,
              minM:mn,minAtX:jn>=0?g.nodes[jn].x:NaN};
  }

  /* Self-check on the element stiffness. The flexural term of a Bernoulli
     element must be exactly 4EI/L with I = b·d³/12. Verifying the assembled
     matrix against the section it claims catches any silent change to the beam
     formulation, which would move every rating without being visible anywhere
     in the output. */
  const stiffCheck=(()=>{
    const el0=els[0], a0=g.nodes[0], b0=g.nodes[1];
    const dm0=(a0.d+b0.d)/2, I0=dm0*dm0*dm0/12, A0=dm0;
    const shear=(p.shearDef!==false);
    const nu0=0.2, G0=E/(2*(1+nu0)), As0=(5/6)*A0;
    const PH0=shear?12*E*I0/(G0*As0*el0.L*el0.L):0;
    const expect=(4+PH0)*E*I0/(el0.L*(1+PH0));      // 4EI/L when PH0 = 0
    const got=el0.kl[2][2];
    return {theory:shear?"timoshenko":"bernoulli",
            impliedI:got*el0.L/(4*E), sectionI:I0, phi:PH0, dOverL:dm0/el0.L,
            expected:expect, got,
            ok:Math.abs(got-expect)/Math.max(Math.abs(expect),1e-9)<1e-9};
  })();

  /* full detail of one unit load case, for presentation of the analysis */
  function unitLoadCase(j){
    const loads=new Array(nN).fill(null);loads[j]={fx:0,fy:-1};
    const b=new Array(nf).fill(0);
    for(let i=1;i<nN-1;i++){const ld=loads[i];if(!ld)continue;
      b[map[3*i]]+=ld.fx||0;b[map[3*i+1]]+=ld.fy||0;}
    const U=solveF(b);
    const ends=[];
    for(let e=0;e<nEl;e++){
      const el=els[e];
      const ug=[U[3*el.a],U[3*el.a+1],U[3*el.a+2],U[3*el.b],U[3*el.b+1],U[3*el.b+2]];
      const ul=new Array(6).fill(0);
      for(let r=0;r<6;r++){let s=0;for(let k=0;k<6;k++)s+=el.T[r][k]*ug[k];ul[r]=s;}
      const fl=new Array(6).fill(0);
      for(let r=0;r<6;r++){let s=0;for(let k=0;k<6;k++)s+=el.kl[r][k]*ul[k];fl[r]=s;}
      ends.push({ug,ul,fl});
    }
    return {j,F:b,U,ends,sec:sectionForces(U,null)};
  }
  const dofMap=map.slice();

  /* §7.2.7.7B requires influence lines at, among others, "points where
     significant changes in section properties occur". Every node is
     analyzed regardless; these are flagged so they are named and shown. */
  const dChange=[];
  for(let i=1;i<nN-1;i++){
    const a=g.nodes[i-1].d,b=g.nodes[i].d,cc=g.nodes[i+1].d;
    const slopeL=(b-a),slopeR=(cc-b);
    const ref=Math.max(Math.abs(b),0.01);
    if(Math.abs(slopeR-slopeL)/ref>0.02)dChange.push(i);
  }

  /* section local ŷ = node outward normal (thrust-line offset direction, #2) */
  const ySec=new Array(nN);
  for(let i=0;i<nN;i++)ySec[i]={x:g.nodes[i].nx,y:g.nodes[i].ny};

  return {p,g,nN,nEl,nf,els,dofMap,unitLoadCase,stiffCheck,
    tribH,tribAxis,DL,DLC,COMPS,wSdl,sdlLine,dChange,reactions,ILsum,ILC,ILV,ILM,ySec,
    /* dn feeds the STRESS CHECK only — stressMax, faAt and the shear check.
       Element stiffness comes from n.d in the geometry, so overriding dn here is
       exactly the capacity-only treatment: sound ring analysed, reduced section
       checked. Nothing else reads dn structurally. */
    dn:g.nodes.map((n,i)=>{
      const c=(p.__dCap||{})[i];
      return (c!=null&&c>0&&c<n.d)?c:n.d;
    }),
    dCap:p.__dCap||{},
    coverAt:(i)=>Math.max(g.surfAt(g.nodes[i].extX)-g.nodes[i].extY,0.1)};
}

/* ---------- railroad distribution ----------
   Load enters at the bottom of the ties over the tie length transversely and
   over 3 ft longitudinally, then spreads at the rate set in the Track and Tie
   panel — 1H:2V by default — through
   the fill below. Where the transverse spreads of adjacent tracks overlap, the
   outer limits are taken and the combined load is distributed uniformly across
   that width, following the treatment AASHTO applies to overlapping wheel
   distribution widths. */
const TIE_LONG=3.0;     // longitudinal bearing length at the bottom of the ties
function railTracks(p){
  const t=(p.tracks&&p.tracks.length)?p.tracks.slice():[0];
  return t.sort((a,b)=>a-b);
}
/* merged transverse groups at spread depth h; returns the governing group */
/* Spread rate through ballast and fill, as horizontal per unit of depth EACH
   SIDE. AREMA Ch. 8 (Art. 2.2.3c, and Fig. 16-1 in Part 16 for box culverts) is
   generally applied as a 1 horizontal to 2 vertical dispersion, which is 0.5 each
   side; a 45-degree 1:1 dispersion, which is 1.0 each side, is the older and more
   generous assumption and is what this program used before v2026.08.11c. The
   difference is not small — at 5 ft of depth under the ties the transverse spread
   is 8 + 5 = 13 ft at 1H:2V against 8 + 10 = 18 ft at 1H:1V — and 1H:2V is the
   conservative of the two because it concentrates the load. */
function railRate(p){
  const r=(p&&p.railSpread!=null)?+p.railSpread:0.5;
  return (isFinite(r)&&r>0)?r:0.5;
}
/* Per-track transverse extents before any merging: centre, and the half-extent
   each side. THE single source for this — railGroups builds its bands from it
   and the transverse figure draws from it, so a capped band and the cone drawn
   over it cannot disagree. They did: the bands abutted correctly at the
   centreline while the figure went on drawing both cones at their full symmetric
   half-width, so the picture showed an overlap the calculation did not have. */
function trackExtents(p,h){
  const Lt=Math.max(p.tieLen||8.5,0.5), half=railRate(p)*h, W=Lt+2*half;
  const tr=railTracks(p).slice().sort((a,b)=>a-b);
  const cap=!!p.railCapLong;
  return tr.map((c,k)=>{
    let hl=W/2, hr=W/2;
    if(cap){
      if(k>0)hl=Math.min(hl,(c-tr[k-1])/2);
      if(k<tr.length-1)hr=Math.min(hr,(tr[k+1]-c)/2);
    }
    /* Depth below the tie soffit at which the spreading cone reaches the cap and
       the boundary turns vertical. Beyond the cap the cone is cut off by the
       neighbouring cone, which is what "terminated where the pressure triangles
       intersect" means geometrically. */
    const zAt=(hh)=>(hh>=Lt/2+half-1e-9)?Infinity:Math.max((hh-Lt/2)/Math.max(railRate(p),1e-9),0);
    return {c,hl,hr,lo:c-hl,hi:c+hr,zl:zAt(hl),zr:zAt(hr),Lt,half};
  });
}
function railGroups(p,h){
  const Lt=Math.max(p.tieLen||8.5,0.5), W=Lt+2*railRate(p)*h;
  const tr=railTracks(p).slice().sort((a,b)=>a-b);
  /* Transverse capping follows the longitudinal choice. If the footprints are
     not permitted to overlap along the track, they should not be permitted to
     overlap across it either — the option means one thing, and having it hold
     in one direction and not the other is the sort of half-applied rule this
     program has been bitten by repeatedly.

     Same construction as the longitudinal cap and for the same reason: each
     track reaches half the gap to its neighbour on each side, asymmetrically, so
     the bands abut exactly whatever the spacing. A single track, or the outer
     side of an outermost track, has no neighbour and spreads freely. */
  const iv=trackExtents(p,h).map(e=>({lo:e.lo,hi:e.hi,n:1}));
  const out=[];
  for(const s of iv){
    const last=out[out.length-1];
    /* Strictly less, with a tolerance. Capped bands abut exactly, and `<=`
       merged them on that touch — so the transverse cap appeared to do nothing:
       two bands that had just been trimmed to meet were immediately recombined
       into one merged band wider than either. */
    if(last&&s.lo<last.hi-1e-9){last.hi=Math.max(last.hi,s.hi);last.n++;}
    else out.push({lo:s.lo,hi:s.hi,n:1});
  }
  return out.map(g=>({width:g.hi-g.lo,n:g.n,lo:g.lo,hi:g.hi,
    perTrack:W,merged:g.n>1}));
}
function railSpread(p,H){
  const h=Math.max(H-(p.tieDepth||0.583),0);
  const Lt=Math.max(p.tieLen||8.5,0.5), r=railRate(p);
  return {h,rate:r,wTrack:Lt+2*r*h,Ls:TIE_LONG+2*r*h,groups:railGroups(p,h)};
}
/* ---------- turning a spread footprint into nodal loads ----------
   A wheel or axle arrives at the ring as a rectangle of uniform pressure with a
   hard edge: full pressure inside, zero outside. The nodal load a node should
   carry is that pressure integrated over the stretch of extrados the node owns
   — its tributary — and the two are not the same thing.

   What this replaces sampled the pressure at the node's own station and
   multiplied by the whole tributary: a midpoint rule, which is fine for a
   smooth function and wrong for a cliff. A node just inside the footprint took
   its entire tributary at full pressure; a node just outside took nothing. Two
   consequences followed.

   The load was not conserved. The delivered total was the sum of tribH over
   whichever nodes happened to be covered, a quantity with no relationship to
   the length of footprint actually bearing on the barrel, and the error changed
   sign as axles crossed node boundaries during the position sweep.

   And the answer was hypersensitive to sub-foot questions about where a node
   is. On the MBTA barrel, axle A2 sat 10.079 ft from node N2 against a
   footprint half-length of 9.892 ft. Moving the test from the arch axis station
   to the extrados station — a 0.61 ft correction, and the correct one, since
   the load lands on the extrados and the tributary is already measured there —
   switched 80 kip off at that node and moved the rating 4.5%.

   Integrating the overlap fixes both. The sum telescopes to the footprint
   length exactly, so the load is conserved; and the station question becomes
   worth a fraction of a percent instead of a quarter of a node's live load. At
   the code minimum of 10 to 12 elements it lands about 1.3% from the converged
   rating where the sampled form was about 5% away with an arbitrary sign.

   Note this is what the 6.4.1 concentrated branch was already doing through
   addConc, which interpolates a strip load between the two bracketing nodes.
   The distributed branches now agree with it. */
function tribSpan(model,i){
  const nd=model.g.nodes, nN=nd.length, e=k=>nd[k].extX;
  const X1=(i>0)?(e(i-1)+e(i))/2:e(0);
  const X2=(i<nN-1)?(e(i)+e(i+1))/2:e(nN-1);
  return (X1<=X2)?[X1,X2]:[X2,X1];
}
/* Fraction of a node's tributary covered by [a,b]. */
function coverFrac(T,a,b){
  const L=T[1]-T[0];
  if(!(L>1e-12))return 0;
  const ov=Math.min(T[1],Math.max(a,b))-Math.max(T[0],Math.min(a,b));
  return (ov>0)?Math.min(ov/L,1):0;
}
/* ONE kernel for the rail distribution at one node. The rating path and the
   report's per-axle contribution matrix used to be two separate implementations
   of this rule; they were verified to agree to 2e-16, but two copies of one rule
   is the exact structure that produced the earth-pressure display defects, and
   agreement today is not agreement after the next edit. The solver calls this
   with detail=false and takes the sum; the report calls it with detail=true and
   gets the same sum decomposed. There is no second implementation to drift. */
/* LONGITUDINAL FOOTPRINT PER AXLE.

   Uncapped, each axle spreads over L_s = 3 + 2*r*h and neighbouring axles'
   footprints are allowed to overlap; where they do, their pressures add. That is
   what elastic dispersion does and it conserves the applied load.

   Capped, an axle may spread no further than the track it owns — half the
   spacing to the axle behind plus half the spacing to the axle ahead. Cones
   never overlap, each axle keeps its own exclusive stretch, and the same total
   load is delivered at a higher pressure over a shorter length. This is the
   convention used when the calculation is done by hand with uniform-pressure
   rectangles, and on a span comparable with the axle spacing it usually governs
   harder because it concentrates the load.

   Both conserve load; they differ in shape. The cap is per axle and depends only
   on the vehicle, so it is computed once and cached on the vehicle object.

   Every consumer — solver, per-axle decomposition, worked examples and figures —
   goes through axleLs(). The per-axle decomposition shares railNodeLoad with the
   solver, so the contribution tables inherit the cap automatically; the figures
   and worked examples call axleLs() directly and are checked against the solver
   by the invariant on the Verification tab. */
/* Half-extents of the track each axle owns, measured from the axle: back to the
   midpoint of the gap behind it, forward to the midpoint of the gap ahead.

   These are NOT equal, and that is the whole point. A first attempt capped each
   axle symmetrically at half its own tributary, which does not prevent overlap
   when neighbours differ: on the Cooper E-80, axle 4 (5 ft each side, tributary
   5.0) reaches 2.5 ft forward while axle 5 (5 ft back, 9 ft forward, tributary
   7.0) reaches 3.5 ft back, and the two are 5 ft apart — a full foot of overlap
   in a mode whose entire purpose is to have none. Taking each half from its own
   gap makes the intervals abut exactly, whatever the spacing pattern.

   An end axle has no neighbour on the outer side, so nothing to overlap with,
   and the uncapped spread governs there. */
function axleHalves(vehicle){
  if(vehicle.__halves)return vehicle.__halves;
  const a=vehicle.axles, n=a.length, h=new Array(n);
  for(let k=0;k<n;k++){
    h[k]={back:(k>0)?(a[k].x-a[k-1].x)/2:Infinity,
          fwd :(k<n-1)?(a[k+1].x-a[k].x)/2:Infinity};
  }
  vehicle.__halves=h;
  return h;
}
function axleTrib(vehicle){
  const h=axleHalves(vehicle);
  return h.map(o=>o.back+o.fwd);
}
/* Footprint of axle k in MODEL coordinates, as half-extents to the left and
   right of the axle. dir<0 reverses the consist, so the axle behind in vehicle
   order is ahead in model x and the two halves swap. */
function axleFoot(p,vehicle,k,H,dir){
  const S=railSpread(p,H), half=S.Ls/2;
  if(!(p&&p.railCapLong))return {l:half,r:half,L:S.Ls};
  const o=axleHalves(vehicle)[k];
  const back=Math.min(half,o.back), fwd=Math.min(half,o.fwd);
  const l=(dir<0)?fwd:back, r=(dir<0)?back:fwd;
  return {l,r,L:l+r};
}
/* Length only, for callers that need the pressure denominator and not the
   extent. Direction does not change the length. */
function axleLs(p,vehicle,k,H){
  return axleFoot(p,vehicle,k,H,1).L;
}
function railNodeLoad(model,vehicle,pos,dir,i,detail){
  const p=model.p;
  const H=model.coverAt(i), T=tribSpan(model,i);
  const S=railSpread(p,H);
  const offs=vehicle.axles, maxOff=offs[offs.length-1].x;
  const fr=detail?new Array(offs.length):null;
  const Lk=new Array(offs.length);
  let Pax=0, PaxOverL=0;
  for(let k=0;k<offs.length;k++){
    const xa=(dir>0)?pos+offs[k].x:pos+maxOff-offs[k].x;
    const ft=axleFoot(p,vehicle,k,H,dir);
    Lk[k]=ft.L;
    const f=coverFrac(T,xa-ft.l,xa+ft.r);
    if(detail)fr[k]=f;
    /* Pressure is load / (width x LENGTH), and with capping the length differs
       per axle, so the per-axle terms must be divided before they are summed
       rather than after. PaxOverL carries sum(P*f/L_k); with no cap every L_k is
       the same and it reduces to Pax/L_s exactly. */
    if(f>0){Pax+=offs[k].P*f; PaxOverL+=offs[k].P*f/Lk[k];}
  }
  let wTr=0;
  if(vehicle.trail>0){
    const tailX=(dir>0)?pos+maxOff:pos;
    wTr=vehicle.trail*((dir>0)?coverFrac(T,tailX,Math.max(T[1],tailX))
                              :coverFrac(T,Math.min(T[0],tailX),tailX));
  }
  let best=null,bestVal=0;
  for(const g of S.groups){
    const v=((PaxOverL>0)?g.n*PaxOverL/g.width:0)+((wTr>0)?g.n*wTr/g.width:0);
    if(best===null||v>bestVal){bestVal=v;best=g;}
  }
  const tb=model.tribH[i];
  const out={q:bestVal*tb,p:bestVal};
  if(detail&&best){
    out.axQ=fr.map((f,k)=>(f>0)?best.n*offs[k].P*f/(best.width*Lk[k])*tb:0);
    out.axP=fr.map((f,k)=>(f>0)?best.n*offs[k].P*f/(best.width*Lk[k]):0);
    out.trP=(wTr>0)?best.n*wTr/best.width:0;
    out.trQ=out.trP*tb;
  }
  return out;
}
function nodalLLRail(model,vehicle,pos,dir){
  const q=new Array(model.nN).fill(0);
  for(let i=1;i<model.nN-1;i++)q[i]=railNodeLoad(model,vehicle,pos,dir,i,false).q;
  return q;
}

/* ---------- live load: pressure through fill (Std Spec 6.4) ---------- */
const TIRE_L=10/12, TIRE_W=20/12, GAGE=6.0;
/* ---------- shallow-cover rule, AASHTO Std. Spec. 6.4.1 ----------
   6.4.2 gives the familiar 1.75H square, but it is written for fill of 2 ft or
   more. Below that, 6.4.1 sends the wheel to Article 3.24.3 instead: it is NOT
   dispersed longitudinally through the fill, it arrives as a concentrated load
   and is distributed only ACROSS the width, over
       E = 4 + 0.06 S  <= 7.0 ft            (3.24.3.2, S = clear span)
   Applying 1.75H at shallow cover instead of this is unconservative in exactly
   the place a shallow arch rates lowest — the crown, where the cover is least
   and the moment influence ordinate is largest. On a ring with a foot or two of
   cover it is the single largest modelling choice in the rating.
   The regime is decided at the AXLE, from the cover at the station where the
   wheel lands, not at the node receiving the load: the dispersion happens where
   the load enters the fill. A vehicle can therefore have some axles concentrated
   over a shallow crown and others dispersed over a deep haunch in the same
   position, which is the physically right answer and what this does. */
const SHALLOW_FILL=2.0;                       // ft — the 6.4.1 / 6.4.2 boundary
function slabWidthE(S){return Math.min(4+0.06*(S||0),7.0);}
/* The Art. 6.4.1 branch is always active below 2 ft. It used to be switchable,
   with an off position that applied the 1.75H spread at every depth — but that
   is exactly what a credited spread of 1.75H produces, verified identical to
   every digit carried, so two controls expressed one idea and a reader of the
   calculation could not tell which was meant. The rate control alone now
   expresses the whole family. Kept as a function so an imported legacy session
   that carries the old flag still resolves. */
function shallowRuleOn(p){return !p||p.shallowRule!=="spread";}
/* Load delivered to the one-foot analysis strip by a concentrated axle.
   NOT the merge rule used for the dispersed branch. Art. 6.4.2 says in terms
   that where distribution areas overlap the total load is spread over the
   outside limits of the combined area — which is why the 1.75H branch divides
   by (s_g + w_t). Art. 3.24.3.2 says nothing of the kind: it gives each wheel
   line its own width E, and where two of them overlap the strip inside the
   overlap carries BOTH, by superposition. The peak strip load is therefore
       one wheel line:      w = (P_ax/2)/E
       overlapping lines:   w = 2 (P_ax/2)/E = P_ax/E
   Using the 6.4.2 merge here would understate the overlap case by close to a
   factor of two. Overlap only arises once E exceeds the 6 ft gage, i.e. for a
   clear span beyond about 33 ft, but that is an ordinary arch span. */
function stripLoadConc(Pax,E){return ((E>GAGE)?2:1)*(Pax/2)/E;}
/* Transverse distribution width for the shallow-fill branch.

     "tire"  DEFAULT. The tire contact width alone: no transverse distribution
             beyond the footprint.
     "slab"  Art. 3.24.3.2, E = 4 + 0.06S <= 7.0 ft, which is what Art. 6.4.1
             points to by reference.

   The default is the narrower one, and the reason is structural rather than
   editorial. E = 4 + 0.06S comes from Art. 3.24.3.2, an article on REINFORCED
   CONCRETE SLABS. That width exists because a slab has transverse flexural
   continuity — Art. 3.24.10 requires distribution reinforcement for exactly this
   purpose — so the strip either side of the wheel is dragged into action and
   shares the load. An unreinforced stone ring has no such mechanism: mortared or
   dry voussoirs, longitudinal joints, and ring separation as a recognized
   failure mode. Taking E = 4 + 0.06S over masonry imports a load path the
   structure does not possess.

   The position is consistent with the other branch. The 1.75H spread of 6.4.2
   does not rely on the ring's transverse stiffness at all; it is the FILL that
   spreads the load, a soil mechanism that works perfectly well over unreinforced
   masonry. Below 2 ft there is neither enough fill to spread through nor any
   reinforcement to distribute across, so neither mechanism is available and the
   wheel is taken to arrive on its own footprint.

   The slab width remains selectable — for a ring with demonstrated transverse
   continuity, for a barrel with a structural concrete saddle, or simply to
   bracket a result — but it must be a deliberate choice, and it is flagged
   wherever it is in use.

   Floor: never narrower than the analysis strip itself, or the strip would be
   handed more than the whole wheel. */
function shallowWidth(p){
  const basis=(p&&p.shallowE==="slab")?slabWidthE(p&&p.S):TIRE_W;
  return Math.max(basis,1.0);
}
/* Fill dispersion credit below 2 ft, as a spread rate applied SYMMETRICALLY.

   The tire footprint basis above takes no credit for the fill at all. That is a
   coherent code-compliance position — Art. 6.4.1 says concentrated — but it is
   conservative rather than physically true: there is real material over the
   extrados and it does spread the load. The credit, if taken, must be taken in
   BOTH horizontal directions. Fill does not know which direction is which; a
   dispersion cone through soil is symmetric, and crediting lateral spread while
   denying longitudinal spread through the same material has no basis.

   Note that this is a different question from the slab width E. E is a
   load-SHARING assumption — how much of the wheel exists on the one-foot strip
   at all — and sharing needs a structural mechanism, which is where the absence
   of distribution reinforcement bites. Fill dispersion needs no mechanism in the
   ring, only material above it.

     r = 0      no credit. Wheel arrives on its footprint. Program default.
     r = 1.0    the rate LRFD 3.6.1.2.6 applies to fill that is not select
                granular. Conservative against 6.4.2.
     r = 1.75   the Art. 6.4.2 rate. At this value the shallow branch IS 6.4.2,
                so the load is continuous across the 2 ft threshold and the step
                at H = 2 ft disappears entirely.

   The rate only governs where the 6.4.1 branch is active. The transverse width
   selector above applies at r = 0 only; once a spread is credited the width
   grows from the tire patch at the same rate. */
function shallowRate(p){
  const r=(p&&isFinite(+p.shallowRate))?+p.shallowRate:0;
  return (r>0)?Math.min(r,1.75):0;
}
/* Cover at an arbitrary station, for the axle regime test. Returns null off the
   ring, where the load is carried by the abutment and not by the barrel. */
function coverAtX(model,x){
  const ex=model.g.extrados;
  for(let k=0;k<ex.length-1;k++){
    const a=ex[k],b=ex[k+1];
    if((x>=a.x&&x<=b.x)||(x<=a.x&&x>=b.x)){
      const den=b.x-a.x, t=(Math.abs(den)<1e-12)?0:(x-a.x)/den;
      return Math.max(model.g.surfAt(x)-(a.y+(b.y-a.y)*t),0.1);
    }
  }
  return null;
}
/* Which branch an axle at station x takes, and the numbers behind it. */
function llRegime(model,x){
  const H=coverAtX(model,x);
  const on=shallowRuleOn(model.p);
  const E=shallowWidth(model.p);
  const r=shallowRate(model.p);
  return {H,E,r,conc:!!(on&&H!=null&&H<SHALLOW_FILL),ruleOn:on,
          basis:(r>0)?("spread "+r+"H"):((model.p&&model.p.shallowE==="slab")?"slab":"tire")};
}
/* A concentrated strip load at station x, placed on the two nodes that bracket
   it by linear interpolation. That is the exact treatment for a point load in a
   model whose influence coefficients are defined at nodes: the influence
   ordinate between two nodes is itself linear. A share landing on an end node is
   dropped — a load at the springing goes straight into the abutment. */
/* The station a node occupies AS A LOAD RECIPIENT is its extrados station, not
   its axis station. Cover (coverAt, coverAtX) and tributary length (tribH) are
   both measured on the extrados — that was the point of the extrados fix — but
   the footprint tests and this interpolation were still asking "is this node
   under the axle?" at the axis. On a deep ring the two differ by up to d/2·sinθ,
   about 0.71 ft at the springings of the MBTA barrel. Against a railroad L_s of
   15–26 ft that is nothing; against the 2–4 ft footprint of the shallow-fill
   6.4.1 branch it is a fifth to a third of the footprint, enough to put a node
   in or out of it. One grid for the whole live load. */
/* Concentrated strip load placed on the two nodes that bracket it. The bracket
   is on the EXTRADOS grid, matching tribSpan, coverAt and tribH — the load lands
   on the extrados, so that is the grid it is placed on. A share falling on an
   end node is dropped: a load at a fully restrained springing passes straight
   into the abutment and produces no internal force anywhere in the barrel. */
function addConc(model,q,x,w){
  const nd=model.g.nodes, nN=nd.length;
  for(let k=0;k<nN-1;k++){
    const xa=nd[k].extX, xb=nd[k+1].extX;
    if((x>=xa&&x<=xb)||(x<=xa&&x>=xb)){
      const den=xb-xa, t=(Math.abs(den)<1e-12)?0:(x-xa)/den;
      if(k>0&&k<nN-1)q[k]+=w*(1-t);
      if(k+1>0&&k+1<nN-1)q[k+1]+=w*t;
      return true;
    }
  }
  return false;
}
function nodalLL(model,vehicle,pos,dir){
  if(vehicle.mode==="rail")return nodalLLRail(model,vehicle,pos,dir);
  const q=new Array(model.nN).fill(0);
  const offs=vehicle.axles.map(a=>a.x), maxOff=offs[offs.length-1];
  /* Sort the axles into the two branches first (6.4.1 vs 6.4.2), then apply
     each branch. Splitting on the axle rather than on the node is what lets a
     single vehicle position use both. */
  const disp=[],conc=[];
  for(const ax of vehicle.axles){
    const xa=(dir>0)?pos+ax.x:pos+maxOff-ax.x;
    (llRegime(model,xa).conc?conc:disp).push({ax,xa});
  }
  for(let i=1;i<model.nN-1;i++){
    const h=model.coverAt(i), T=tribSpan(model,i);
    const spreadL=TIRE_L+1.75*h, wtr=TIRE_W+1.75*h;
    let press=0;
    for(const a of disp){
      const f=coverFrac(T,a.xa-spreadL/2,a.xa+spreadL/2);
      if(f>0)press += f*((wtr>=GAGE)? a.ax.P/((GAGE+wtr)*spreadL) : (a.ax.P/2)/(wtr*spreadL));
    }
    q[i]=press*model.tribH[i];
  }
  if(conc.length){
    const r=shallowRate(model.p);
    if(r<=0){
      const E=shallowWidth(model.p);
      for(const a of conc)addConc(model,q,a.xa,stripLoadConc(a.ax.P,E));
    }else{
      /* Same arithmetic as the 6.4.2 branch, at the credited rate. The overlap
         treatment goes with it: a fill spread is exactly the mechanism 6.4.2
         has in mind when it directs that overlapping areas be combined over
         their outside limits. */
      for(let i=1;i<model.nN-1;i++){
        const h=model.coverAt(i), T=tribSpan(model,i);
        const sL=TIRE_L+r*h, wt2=TIRE_W+r*h;
        let pr=0;
        for(const a of conc){
          const f=coverFrac(T,a.xa-sL/2,a.xa+sL/2);
          if(f>0)pr+=f*((wt2>=GAGE)?a.ax.P/((GAGE+wt2)*sL):(a.ax.P/2)/(wt2*sL));
        }
        q[i]+=pr*model.tribH[i];
      }
    }
  }
  return q;
}

/* Per-axle decomposition of the nodal live load. Both distribution routines are
   linear in the axle loads, so the total at a node can be split exactly into the
   share each axle contributes — the split is a decomposition of the same
   arithmetic the solve uses, not a second calculation. Returns loads BEFORE
   impact; the impact factor is reported separately so it can be shown as its own
   column. */
/* Per-axle decomposition, and it MUST reproduce nodalLL exactly — the report
   shows this breakdown beside the rating, so any divergence is a report telling
   the reader something the analysis did not do. Every branch below is the same
   overlap arithmetic, split by axle rather than summed. */
function nodalLLByAxle(model,vehicle,pos,dir){
  const p=model.p, nN=model.nN, nA=vehicle.axles.length;
  const offs=vehicle.axles.map(a=>a.x), maxOff=offs[offs.length-1];
  const axQ=[],axP=[];
  for(let k=0;k<nA;k++){axQ.push(new Array(nN).fill(0));axP.push(new Array(nN).fill(0));}
  const trQ=new Array(nN).fill(0), trP=new Array(nN).fill(0);
  const q=new Array(nN).fill(0), pTot=new Array(nN).fill(0);
  const rail=(vehicle.mode==="rail");
  for(let i=1;i<nN-1;i++){
    const H=model.coverAt(i), tb=model.tribH[i], T=tribSpan(model,i);
    if(rail){
      /* The same kernel the rating uses, asked for its decomposition. */
      const R=railNodeLoad(model,vehicle,pos,dir,i,true);
      if(R.axQ)for(let k=0;k<nA;k++){axQ[k][i]=R.axQ[k];axP[k][i]=R.axP[k];}
      if(R.trQ){trQ[i]=R.trQ;trP[i]=R.trP;}
    }else{
      const spreadL=TIRE_L+1.75*H, wtr=TIRE_W+1.75*H;
      const E=shallowWidth(p);
      vehicle.axles.forEach((ax,k)=>{
        const xa=(dir>0)?pos+ax.x:pos+maxOff-ax.x;
        const rg=llRegime(model,xa);
        if(rg.conc&&rg.r>0){
          const sL=TIRE_L+rg.r*H, wt2=TIRE_W+rg.r*H;
          const f=coverFrac(T,xa-sL/2,xa+sL/2);
          if(f>0){
            const pp=f*((wt2>=GAGE)?ax.P/((GAGE+wt2)*sL):(ax.P/2)/(wt2*sL));
            axP[k][i]=pp; axQ[k][i]=pp*tb;
          }
        }else if(rg.conc){
          /* 6.4.1 branch. The axle's strip load is shared between the two nodes
             that bracket it, so this node's share is its interpolation weight.
             The pressure reported back is the share divided by the tributary
             length, which keeps the identity q = p·b·t true on every row of the
             contribution matrix whichever branch produced it. */
          const one=new Array(nN).fill(0);
          addConc(model,one,xa,stripLoadConc(ax.P,E));
          if(one[i]){axQ[k][i]=one[i]; axP[k][i]=(tb>1e-9)?one[i]/tb:0;}
        }else{
          const f=coverFrac(T,xa-spreadL/2,xa+spreadL/2);
          if(f>0){
            const pp=f*((wtr>=GAGE)?ax.P/((GAGE+wtr)*spreadL):(ax.P/2)/(wtr*spreadL));
            axP[k][i]=pp; axQ[k][i]=pp*tb;
          }
        }
      });
    }
    let sp=0,sq=0;
    for(let k=0;k<nA;k++){sp+=axP[k][i];sq+=axQ[k][i];}
    sp+=trP[i]; sq+=trQ[i];
    pTot[i]=sp; q[i]=sq;
  }
  return {q,pTot,axQ,axP,trQ,trP,nAxles:nA,hasTrail:(vehicle.trail>0)};
}
function llEffects(model,q){
  const out=new Array(model.nN);
  for(let i=0;i<model.nN;i++){
    let C=0,M=0,V=0;
    const ic=model.ILC[i],im=model.ILM[i],iv=model.ILV[i];
    for(let j=1;j<model.nN-1;j++){const qj=q[j];if(qj===0)continue;C+=qj*ic[j];M+=qj*im[j];V+=qj*iv[j];}
    out[i]={C,M,V};
  }
  return out;
}

/* ADVERSE-ONLY LOADING. The same superposition, split by the sign of the moment
   influence ordinate at the section being checked: pos[] sums only the nodes
   whose ordinate is positive, neg[] only those whose ordinate is negative. Each
   is what the section would see if the live load existed solely over the part of
   the arch that aggravates it.

   Standard influence-line practice for a load that can genuinely be placed or
   withheld — a uniform trailing load ends where the train ends, so loading only
   the adverse region is not merely allowed but correct, and this program is
   under-conservative without it.

   It is NOT a real loading for the axle set. Axles are rigidly spaced; a
   locomotive cannot have its third axle present and its fourth absent. Applied
   to the axles this produces an upper-bound envelope no train can generate. The
   bound is conservative on both counts, which is why it is defensible as an
   envelope: dropping the opposing nodes raises the moment AND removes the thrust
   those nodes contributed, and since e = SigmaM/SigmaP both changes drive the
   eccentricity up.

   Cost is nil — llEffects already loops per section, so the sign test rides
   along inside the existing inner loop. */
/* The effect at ONE section under whichever half of the adverse-only split
   stresses it more, with the sign kept so a display can say which half it used
   and strike out the rest. Falls through to the plain superposition when the
   option is off, so callers need no branch of their own. */
function llAtSection(model,q,sec){
  if(!(model.p&&model.p.llAdverse))
    return Object.assign({keepSign:0,adverse:false},llEffects(model,q)[sec]);
  const S=llEffectsSplit(model,q);
  const D=model.DL[sec], d=model.dn[sec];
  const fp=stressMax(D.C+S.pos[sec].C,D.M+S.pos[sec].M,d);
  const fn=stressMax(D.C+S.neg[sec].C,D.M+S.neg[sec].M,d);
  const keep=(fn>fp)?-1:1;
  return Object.assign({keepSign:keep,adverse:true},keep>0?S.pos[sec]:S.neg[sec]);
}
function llEffectsSplit(model,q){
  const pos=new Array(model.nN), neg=new Array(model.nN);
  for(let i=0;i<model.nN;i++){
    let Cp=0,Mp=0,Vp=0,Cn=0,Mn=0,Vn=0;
    const ic=model.ILC[i],im=model.ILM[i],iv=model.ILV[i];
    for(let j=1;j<model.nN-1;j++){
      const qj=q[j]; if(qj===0)continue;
      if(im[j]>0){Cp+=qj*ic[j];Mp+=qj*im[j];Vp+=qj*iv[j];}
      else if(im[j]<0){Cn+=qj*ic[j];Mn+=qj*im[j];Vn+=qj*iv[j];}
    }
    pos[i]={C:Cp,M:Mp,V:Vp}; neg[i]={C:Cn,M:Mn,V:Vn};
  }
  return {pos,neg};
}

/* ---------- stress per §7.2.7.9B/10B (ksf, per ft width) ---------- */
function stressMax(P,M,d){
  if(P<=1e-9)return Infinity;
  const e=Math.abs(M)/P;
  if(e>=d/2-1e-9)return Infinity;
  if(e<=d/6)return (P/d)*(1+6*e/d);
  return 2*P/(3*(d/2-e));
}

/* Stress at both faces per §7.2.7.10B. eSigned is measured along the
   outward normal, so positive is toward the extrados. Returns extrados
   and intrados fibre stresses and the regime. stressMax above is left
   untouched and remains what the rating iteration uses. */
function stressPair(P,M,d){
  /* Net tension and "the resultant has left the section" both make the stress
     unbounded, but they are different findings. Net tension means the thrust
     line has left the ring entirely and the arch is being pulled apart at that
     section — more alarming than a crushed edge, and it should not be reported
     under the same label. */
  if(P<-1e-9)return {ext:Infinity,int:Infinity,e:Infinity,regime:"TENSION"};
  if(P<=1e-9)return {ext:Infinity,int:Infinity,e:Infinity,regime:"OUT"};
  const es=M/P, ae=Math.abs(es);   // +ve toward the extrados, moment sagging-positive
  if(ae>=d/2-1e-9)return {ext:Infinity,int:Infinity,e:es,regime:"OUT"};
  if(ae<=d/6)return {ext:(P/d)*(1+6*es/d), int:(P/d)*(1-6*es/d), e:es, regime:"KERN"};
  const f=2*P/(3*(d/2-ae));
  return (es>0)?{ext:f,int:0,e:es,regime:"WEDGE"}:{ext:0,int:f,e:es,regime:"WEDGE"};
}

/* ---------- impact, Std Spec 3.8.2.3 by fill depth ---------- */
/* Highway impact, AASHTO Std. Spec. 3.8.2.3 — stepped by depth of fill. */
function impactFor(coverFt){
  if(coverFt<=1)return 0.30;
  if(coverFt<=2)return 0.20;
  if(coverFt<3) return 0.10;
  return 0;
}
/* Railroad impact, AREMA form: 60% at 1.5 ft below the base of rail, falling
   linearly to zero at 10 ft.
       IM = [1 - (H - 1.5)/8.5] x 0.60
   H is the depth from the base of rail down to the top of the arch. The base of
   rail is the top of the tie, which is the surface this program measures cover
   from, so the same H that drives the load spread also drives the impact.
   Outside the stated range the expression is clamped: it is not extrapolated
   above 40% for shallow cover, and it does not go negative beyond 10 ft. */
/* Railroad impact, decaying linearly with fill depth:

       IM = [1 - (H - 1.5)/8.5] x 0.60

   60% at H = 1.5 ft (18 in) falling to 0% at H = 10 ft, with 8.5 = 10 - 1.5 so
   the bracket runs 1 to 0 over that range. H is the fill depth; this program
   measures it to the base of rail, which is the running surface for a railroad
   and the same datum the tie depth is taken from.

   The coefficient was 0.40 in this program before v2026.08.11g, giving 40% at
   the shallow end instead of 60% — a uniform 1.5x understatement of impact at
   every depth. Note the source equation is typeset with the 0.6 inside the
   bracket, which read literally would give 100% at H = 1.5 ft and 40% at 10 ft;
   the stated bounds of 60% and 0% settle it as a multiplier on the whole
   bracket, which is the form used here. */
function impactForRail(coverFt){
  if(coverFt<=1.5)return 0.60;
  if(coverFt>=10) return 0;
  return (1-(coverFt-1.5)/8.5)*0.60;
}
/* Impact for the loading in use. */
/* Impact for the loading in use. coverFt is measured from the extrados up to
   the running surface — for a railroad that surface is the base of rail, which
   is the datum AREMA measures fill depth below, and d_tie takes the live load
   spread down from it to the tie soffit. One offset serves both. */
function impactAt(p,coverFt){
  return (p&&p.loadMode==="rail")?impactForRail(coverFt):impactFor(coverFt);
}

function applyLocalImpact(model,q){
  const out=q.slice();
  for(let i=0;i<out.length;i++){
    if(out[i])out[i]*=1+impactAt(model.p,model.coverAt(i));
  }
  return out;
}

/* ---------- rating iteration (§7.2.7.12, Fig. 7.2.7-1) ---------- */
/* Allowable stress at a section. A deterioration entry can lower it locally —
   weathered or soft masonry keeps its depth but loses capacity, which is a
   different thing from losing section and should not be faked by removing
   depth. */
function faAt(model,i,faKsf){
  const fn=model.faN;
  return (fn&&fn[i]!=null)?fn[i]*0.144:faKsf;
}
/* Largest live load multiplier a section can carry in shear.
   Demand is linear in m, so this is solved directly rather than by bisection:
       |V_DL + m V_LL| <= f_v A
   The average shear stress V/A is used, not the 1.5 V/A peak of a parabolic
   distribution — for a masonry bed joint the check is sliding across the whole
   contact area, and an allowable quoted for masonry normally refers to the mean.
   If the allowable in hand refers to a peak fibre stress, divide it by 1.5
   before entering it. */
/* shearMargin() lived here and returned |V| − f_v·A, a force per foot of width.
   It was the only caller's habit of maxing that against a stress margin in ksf
   that made it dangerous, so it is gone rather than left available: the shear
   overload is now formed inline in rateAtPosition as a dimensionless ratio,
   alongside the stress overload it has to be comparable with. shearRF() below
   is a different calculation — the largest multiplier a section can carry in
   shear, reported on its own — and is unaffected. */
function shearRF(model,i,LL,imp,fvKsf){
  const A=model.dn[i]*1.0, cap=fvKsf*A;
  const v0=model.DL[i].V, vL=(1+imp)*LL[i].V;
  if(Math.abs(v0)>cap)return 0;                  // fails under dead load alone
  if(Math.abs(vL)<1e-12)return Infinity;         // no live shear here
  const a=(cap-v0)/vL, b=(-cap-v0)/vL;
  const hi=Math.max(a,b);
  return (hi>0)?hi:0;
}
/* `only` restricts the check to a single node. Passing it turns the governing
   rating into that section's own rating: the multiplier that brings THAT
   section to the allowable, minimized over the vehicle's positions. Everything
   else about the sweep is identical, so the two are directly comparable. */
function rateAtPosition(model,LL,faKsf,imp,fvKsf,only){
  const DL=model.DL, dn=model.dn;
  const shearOn=(fvKsf>0);
  const i0=(only!=null)?only:0, i1=(only!=null)?only+1:model.nN;
  /* Both margins are carried as a DIMENSIONLESS overload, demand/capacity − 1.
     They used to be absolute differences: the stress margin was f − f_a in ksf
     and the shear margin was |V| − f_v·A in k/ft, and the two were compared in
     the same max. The rating factor survived that, because max(a,b) ≤ 0 exactly
     when both are ≤ 0 and the bisection only ever reads the sign — but the
     argmax decides which section and which mode get REPORTED as governing, and
     an argmax over two different physical quantities is meaningless. It only
     recovered the right answer because the binding constraint sits at exactly
     zero once converged. Normalizing leaves every root where it was, keeps the
     convexity the bisection relies on (dividing by a positive constant), and
     makes the comparison mean what it claims to. */
  /* LL may be a plain array of effects, or {pos,neg} from llEffectsSplit when
     adverse-only loading is switched on. In the split case each section is
     evaluated against both halves and the worse is kept — the section does not
     care which sign of moment stresses it, only how far the thrust line moves. */
  const split=!!(LL&&LL.pos&&LL.neg);
  const sets=split?[LL.pos,LL.neg]:[LL];
  const g=(m)=>{
    let worst=-1e9,sec=-1,mode="stress";
    for(let i=i0;i<i1;i++){
      const fa=faAt(model,i,faKsf);
      for(const S of sets){
        const P=DL[i].C+m*(1+imp)*S[i].C, M=DL[i].M+m*(1+imp)*S[i].M;
        const f=stressMax(P,M,dn[i]);
        const u=(f===Infinity||!(fa>0))?1e9:(f/fa-1);
        if(u>worst){worst=u;sec=i;mode="stress";}
        if(shearOn){
          const cap=fvKsf*dn[i]*1.0;
          const uv=(cap>0)?(Math.abs(DL[i].V+m*(1+imp)*S[i].V)/cap-1):-1e9;
          if(uv>worst){worst=uv;sec=i;mode="shear";}
        }
      }
    }
    return {worst,sec,mode};
  };
  const z=g(0);
  if(z.worst>=0)return {m:0,sec:z.sec,mode:z.mode};
  let lo=0,hi=1;
  while(g(hi).worst<0&&hi<512)hi*=2;
  if(hi>=512&&g(hi).worst<0)return {m:512,sec:-1,mode:"unbounded"};
  for(let it=0;it<48;it++){const mid=(lo+hi)/2;(g(mid).worst<0)?lo=mid:hi=mid;}
  const m=(lo+hi)/2;
  const at=g(hi);
  return {m,sec:at.sec,mode:at.mode};
}
/* The §7.2.7.12 iteration, recorded rather than just executed.

   Fig. 7.2.7-1 describes the procedure as a loop: apply the vehicle, rate it,
   adjust the live load effect multiplier, rate again, until the rating factor
   is 1.0 — at which point the multiplier IS the rating factor. rateAtPosition
   runs that loop by bisection and returns only the answer, which is correct but
   leaves the reader nothing to check. This replays the same bisection and keeps
   each trial, so the Rating tab can show the loop turning.

   The trials are the real ones: the same bracket, the same midpoints, the same
   convergence test. Nothing is reconstructed for display. */
function rateTrace(model,LL,faKsf,imp,fvKsf,want){
  const DL=model.DL, dn=model.dn, shearOn=(fvKsf>0);
  const trial=(m)=>{
    let worst=-1e9,sec=-1,mode="stress",fAt=0,faSec=faKsf;
    for(let i=0;i<model.nN;i++){
      const P=DL[i].C+m*(1+imp)*LL[i].C, Mm=DL[i].M+m*(1+imp)*LL[i].M;
      const f=stressMax(P,Mm,dn[i]), fa=faAt(model,i,faKsf);
      const u=(f===Infinity||!(fa>0))?1e9:(f/fa-1);
      if(u>worst){worst=u;sec=i;mode="stress";fAt=f;faSec=fa;}
      if(shearOn){
        const cap=fvKsf*dn[i]*1.0;
        const uv=(cap>0)?(Math.abs(DL[i].V+m*(1+imp)*LL[i].V)/cap-1):-1e9;
        if(uv>worst){worst=uv;sec=i;mode="shear";fAt=Math.abs(DL[i].V+m*(1+imp)*LL[i].V)/Math.max(dn[i],1e-9);faSec=fvKsf;}
      }
    }
    return {m,worst,sec,mode,f:fAt,fa:faSec,util:(fAt===Infinity)?Infinity:fAt/faSec};
  };
  const steps=[];
  /* Step 1 of Fig. 7.2.7-1 — the vehicle as it stands, multiplier 1.0. This is
     the "preliminary load rating" the clause says must NOT simply be scaled. */
  steps.push(Object.assign(trial(1),{tag:"preliminary",
    note:"The vehicle applied as it stands, m = 1. §7.2.7.12 forbids scaling this to get the rating."}));
  const z=trial(0);
  if(z.worst>=0)return {steps,m:0,sec:z.sec,mode:z.mode,bracketHi:0,nBisect:0};
  let lo=0,hi=1;
  while(trial(hi).worst<0&&hi<512)hi*=2;
  if(hi>=512&&trial(hi).worst<0)return {steps,m:512,sec:-1,mode:"unbounded",bracketHi:hi,nBisect:0};
  steps.push(Object.assign(trial(hi),{tag:"bracket",lo:0,hi:hi,loNew:0,hiNew:hi,
    note:`Doubled from 1 until the section is overstressed. The answer now lies between 0 and ${nfxRaw(hi)}.`}));
  const keep=Math.max(2,Math.min(want||3,10));
  for(let it=0;it<48;it++){
    const mid=(lo+hi)/2, t=trial(mid);
    const under=(t.worst<0);
    if(it<keep)steps.push(Object.assign(t,{tag:"bisect",lo,hi,
      /* The bracket is carried on every row. Without it the midpoints look
         like they wander — 4, then 6, then 5 — when in fact each one halves
         the interval the answer is known to lie in. */
      loNew:under?mid:lo, hiNew:under?hi:mid,
      note:under?"Under the allowable, so the rating factor is above this."
                :"Over the allowable, so the rating factor is below this."}));
    under?lo=mid:hi=mid;
  }
  const m=(lo+hi)/2, at=trial(m);
  steps.push(Object.assign(at,{tag:"converged",lo,hi,loNew:lo,hiNew:hi,
    note:"Utilization is 1.000 at the governing section, so the multiplier is the rating factor."}));
  return {steps,m,sec:at.sec,mode:at.mode,bracketHi:hi,nBisect:48};
}
function nfxRaw(v){return (Math.round(v*1000)/1000).toString();}
/* Under right-to-left travel the sweep variable locates the LAST axle in the
   list, because offsets are measured from the far end of the consist. Reporting
   it as the "lead axle" was wrong by the length of the consist. This converts to
   the position of the physically leading axle, which is what every readout now
   prints. */
function leadAxleX(vehicle,pos,dir){
  const maxOff=vehicle.axles[vehicle.axles.length-1].x;
  return (dir<0)?(pos+maxOff):pos;
}
function rateVehicle(model,vehicle,faPsi,impMode,onlySec){
  impMode=impMode||"crown";
  const faKsf=faPsi*0.144;
  /* Allowable shear stress. Zero disables the check, which is the default: a
     shear rating is not part of §7.2.7, so it must be switched on deliberately
     rather than appearing in a rating nobody asked for. */
  const fvKsf=(model.p&&model.p.fv>0)?model.p.fv*0.144:0;
  const impCrown=impactAt(model.p,model.g.coverCrown+model.p.tws);
  const impComb=(impMode==="local")?0:impCrown;
  const Lveh=vehicle.axles[vehicle.axles.length-1].x;
  const x0=model.g.xmin-Lveh-2.0, x1=model.g.xmax+2.0;
  /* A true quarter-foot sweep. The old rule, max(0.25, range/240), silently
     coarsened to about half a foot for a long consist on a short span — exactly
     where it matters, because the RF envelope steps as axles cross footprint
     edges and a coarse sweep can step over the minimum. The cap only engages on
     an implausibly long sweep, and the step actually used is reported so the
     text can never again claim a resolution it did not use. */
  const STEP_TARGET=(model.p&&model.p.__sweepStep)||0.25, MAX_POS=4000;
  const span=x1-x0;
  const step=Math.max(STEP_TARGET,span/MAX_POS);
  let best={rf:Infinity,pos:0,dir:1,sec:-1,mode:"stress"};
  const rfByPos=[];
  for(let pos=x0;pos<=x1;pos+=step){
    let rfHere=Infinity;
    for(const dir of [1,-1]){
      let q=nodalLL(model,vehicle,pos,dir);
      if(impMode==="local")q=applyLocalImpact(model,q);
      const LL=(model.p&&model.p.llAdverse)?llEffectsSplit(model,q):llEffects(model,q);
      const r=rateAtPosition(model,LL,faKsf,impComb,fvKsf,onlySec);
      if(r.m<rfHere)rfHere=r.m;
      if(r.m<best.rf)best={rf:r.m,pos,dir,sec:r.sec,mode:r.mode};
    }
    rfByPos.push({pos,rf:rfHere});
  }
  let iMin=1,iMax=0;
  for(let i=1;i<model.nN-1;i++){const I=impactAt(model.p,model.coverAt(i));iMin=Math.min(iMin,I);iMax=Math.max(iMax,I);}
  return {rf:best.rf,pos:best.pos,dir:best.dir,sec:best.sec,mode:best.mode,fvKsf,
          imp:impCrown,impMode,iMin,iMax,rfByPos,tons:best.rf*vehicle.tons,
          sweepStep:step,sweepLo:x0,sweepHi:x1};
}

/* Rating factor at EVERY section, each at its own critical vehicle position.

   rateVehicle answers "what is the rating of this bridge" — the minimum over
   all sections and all positions. This answers "what is the rating of every
   section", which is a different and more useful question for a summary: the
   position that governs the crown is not the position that governs a springing,
   so each node needs its own sweep.

   Done naively that is one full sweep per node. It is one sweep total instead:
   the nodal live load and the influence-line superposition are the expensive
   part and depend only on the position, so they are computed once per position
   and then every node is bisected against them. On a 13-node model that is the
   same work as rating one vehicle, not thirteen. */
function rateAllSections(model,vehicle,faPsi,impMode){
  impMode=impMode||"crown";
  const faKsf=faPsi*0.144;
  const fvKsf=(model.p&&model.p.fv>0)?model.p.fv*0.144:0;
  const impCrown=impactAt(model.p,model.g.coverCrown+model.p.tws);
  const impComb=(impMode==="local")?0:impCrown;
  const Lveh=vehicle.axles[vehicle.axles.length-1].x;
  const x0=model.g.xmin-Lveh-2.0, x1=model.g.xmax+2.0;
  const STEP_TARGET=(model.p&&model.p.__sweepStep)||0.25, MAX_POS=4000;
  const step=Math.max(STEP_TARGET,(x1-x0)/MAX_POS);
  const per=[];
  for(let i=0;i<model.nN;i++)per.push({rf:Infinity,pos:0,dir:1,mode:"stress"});
  for(let pos=x0;pos<=x1;pos+=step){
    for(const dir of [1,-1]){
      let q=nodalLL(model,vehicle,pos,dir);
      if(impMode==="local")q=applyLocalImpact(model,q);
      const LL=(model.p&&model.p.llAdverse)?llEffectsSplit(model,q):llEffects(model,q);
      for(let i=0;i<model.nN;i++){
        const r=rateAtPosition(model,LL,faKsf,impComb,fvKsf,i);
        if(r.m<per[i].rf){per[i]={rf:r.m,pos,dir,mode:r.mode};}
      }
    }
  }
  let gov=-1;
  for(let i=0;i<model.nN;i++)if(gov<0||per[i].rf<per[gov].rf)gov=i;
  /* A note on the springings, because it is easy to get backwards. The
     influence COLUMN for a restrained node is zero — a unit load applied there
     passes straight into the abutment — but its influence ROW is not. Loads
     anywhere else produce real thrust, shear and moment AT the springing
     section, and on a fixed arch that section is usually the one that governs.
     So springing rows below are ordinary ratings and are ranked with the rest.
     What is genuinely lost is the small share of vehicle load that lands on the
     two end nodes themselves; addConc drops it rather than redistributing. */
  return {per,gov,sweepStep:step,
          tons:per.map(r=>r.rf*vehicle.tons),imp:impCrown,impMode};
}
/* Vehicle position that maximises or minimises an effect AT ONE SECTION.

   Distinct from the governing position, which is the minimum rating over every
   section — this answers "where do I put the train to work THIS section hardest",
   which is what the Live Load contribution table is describing. The two differ
   whenever the selected section is not the governing one, and on a barrel with a
   local defect they differ a great deal.

   Live load effects are taken with impact and at the unfactored vehicle, which
   is the basis the contribution table sums to. Eccentricity is the exception and
   is taken on the TOTAL, e = |M_DL + M_LL| / (P_DL + P_LL), because the
   eccentricity of a live load in isolation is not a quantity the section
   experiences — what moves the thrust line off the kern is the combination.

   The sweep is the rating sweep: same grid, both directions, and it reads every
   distribution option in force, so the position returned moves if the dispersion
   rate, the overlap cap or the adverse-influence filter is changed. That is
   correct and worth knowing — it is not a fixed property of the geometry. */
function extremeAt(model,vehicle,sec,mode,faPsi,impMode){
  impMode=impMode||"crown";
  const p=model.p;
  const impComb=(impMode==="local")?0:impactAt(p,model.g.coverCrown+p.tws);
  const Lveh=vehicle.axles[vehicle.axles.length-1].x;
  const x0=model.g.xmin-Lveh-2.0, x1=model.g.xmax+2.0;
  const STEP=(p&&p.__sweepStep)||0.25;
  const step=Math.max(STEP,(x1-x0)/4000);
  const D=model.DL[sec];
  let best=null;
  for(let pos=x0;pos<=x1;pos+=step){
    for(const dir of [1,-1]){
      let q=nodalLL(model,vehicle,pos,dir);
      if(impMode==="local")q=applyLocalImpact(model,q);
      const E=llAtSection(model,q,sec);
      const ML=(1+impComb)*E.M, PL=(1+impComb)*E.C;
      /* maxM / minM search the LIVE LOAD effect; maxTot searches the TOTAL.
         They are different questions and the second is usually the one that
         matters. Where the live load moment opposes the dead load moment, the
         largest live load effect can be the LEAST critical position — the
         section is relieved, not aggravated — so a rating driven by max live
         load alone can miss the governing case entirely. maxTot maximises
         |M_DL + M_LL| and finds the position that actually works the section
         hardest in bending. */
      let v;
      if(mode==="maxM")v=ML;
      else if(mode==="minM")v=-ML;
      else if(mode==="maxP")v=PL;
      else if(mode==="maxTot")v=Math.abs(D.M+ML);
      else if(mode==="maxE"){
        const P=D.C+PL;
        v=(P>1e-9)?Math.abs(D.M+ML)/P:-1e9;
      }else v=ML;
      if(best===null||v>best.v){best={v,pos,dir,ML,PL,MT:D.M+ML,
        e:(D.C+PL>1e-9)?Math.abs(D.M+ML)/(D.C+PL):NaN};}
    }
  }
  return best;
}
/* Thrust line: signed eccentricity along the section local y, which is the
   outward normal, so POSITIVE IS TOWARD THE EXTRADOS. offset = +M/C, matching
   the sign convention stated in the design basis and the two-face stress split
   in stressPair. This comment previously read "offset = -M/C", which contradicted
   both the code below it and every other statement of the convention in the
   program; the code was right. */
/* Offset of the resultant from the arch axis, positive toward the extrados.
   With moment sagging-positive, a positive moment lifts the thrust line toward
   the extrados, so the offset is +M/P. */
function thrustOffsets(model,F){ // F: per-node {C,M}
  const out=new Array(model.nN);
  for(let i=0;i<model.nN;i++){
    const C=F[i].C;
    out[i]=(C>1e-9)?(F[i].M/C):NaN;
  }
  return out;
}

const R=(()=>{
"use strict";
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* round for DISPLAY only — internal math stays full precision (§7) */
function num(v,dp){
  if(v===Infinity)return "\\infty";
  if(v===-Infinity)return "-\\infty";
  if(!isFinite(v))return "-";
  v=(Math.abs(v)<1e-9)?0:v;      // solver round-off is not a quantity
  dp=(dp==null)?2:dp;
  const a=Math.abs(v);
  if(a>=1e6)return v.toExponential(2).replace("e","\\times 10^{")+"}";
  return v.toFixed(dp);
}
/* Anything below this is round-off from the solve, not a quantity. A symmetric
   arch produces shears of order 1e-15 at the crown; printing those as
   "−3.31 × 10⁻¹⁵" dresses numerical noise up as a result and invites a reviewer
   to ask what it means. They are snapped to an exact zero. */
const NOISE_FLOOR=1e-9;
function snap(v){ return (isFinite(v)&&Math.abs(v)<NOISE_FLOOR)?0:v; }
function nfx(v,dp){ // plain text number
  if(!isFinite(v))return "—";
  v=snap(v);
  dp=(dp==null)?2:dp;
  const a=Math.abs(v);
  /* Exponential form is kept only for genuinely large magnitudes. Small values
     print at whatever precision was asked for: a table column reading 0.000 is
     honest, whereas switching that one cell to e-notation breaks the column and
     reads as false precision. */
  if(a>=1e6)return v.toExponential(2);
  if(a!==0&&a<Math.pow(10,-dp)/2)return (v>0?"<":">-")+Math.pow(10,-dp).toFixed(dp);
  return v.toFixed(dp);
}
let katexReady=false;
function tex(s,disp){
  if(window.katex&&katexReady){
    try{return katex.renderToString(s,{displayMode:!!disp,throwOnError:false,strict:false});}
    catch(e){/* fall through */}
  }
  // offline / failure fallback: readable plain text, never raw markup
  const t=s.replace(/\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)")
           .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)")
           .replace(/\\sqrt\{([^{}]*)\}/g,"sqrt($1)")
           .replace(/\\left|\\right/g,"")
           .replace(/\\cdot/g,"·").replace(/\\times/g,"×")
           .replace(/\\ge/g,"≥").replace(/\\le/g,"≤").replace(/\\Sigma/g,"Σ")
           .replace(/\\gamma/g,"γ").replace(/\\theta/g,"θ").replace(/\\infty/g,"∞")
           .replace(/\\text\{([^{}]*)\}/g,"$1").replace(/[{}]/g,"")
           .replace(/\\\\/g," ").replace(/\\,|\\;|\\ /g," ").replace(/_/g,"_").replace(/\^/g,"^");
  return '<span class="mono">'+esc(t)+'</span>';
}
function setKatexReady(){katexReady=!!window.katex;}

/* ---- the core three-line step ----
   {label, ref, sym, sub, res, units, note}
   renders:  label                                   [ref]
             sym = sub = res units                                   */
function step(o){
  let eq=o.sym||"";
  if(o.sub!=null&&o.sub!=="")eq+=" = "+o.sub;
  if(o.res!=null&&o.res!=="")eq+=" = "+o.res;
  /* Units are rendered in text mode, so a math command inside the string — the
     centred dot most often — prints as a red KaTeX error rather than a symbol.
     Normalise to a plain hyphen and strip any stray command before wrapping. */
  if(o.units){
    const u=String(o.units)
      .replace(/\\cdot\s*/g,"-")
      .replace(/·/g,"-")
      .replace(/\\;/g,",\\ ");
    eq+="\\ \\text{"+u+"}";
  }
  return `<div class="step">
    <div class="lbl">${o.ref?`<span class="ref">${esc(o.ref)}</span>`:""}${esc(o.label||"")}</div>
    <div class="eq">${tex(eq,true)}</div>
    ${o.note?`<div class="note">${o.note}</div>`:""}
  </div>`;
}
/* symbolic-only statement (definitions, criteria) */
function eqLine(label,e,ref,note){
  return `<div class="step">
    ${label?`<div class="lbl">${ref?`<span class="ref">${esc(ref)}</span>`:""}${esc(label)}</div>`:""}
    <div class="eq">${tex(e,true)}</div>
    ${note?`<div class="note">${note}</div>`:""}</div>`;
}
/* variable definition table (§6) */
function vars(rows,caption){
  return `<table class="vartab"><thead><tr><th>Symbol</th><th>Description</th>
    <th style="text-align:right">Value</th><th>Units</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="s">${tex(r[0])}</td><td>${r[1]}</td>
      <td class="v">${r[2]==null?"":(typeof r[2]==="number"?nfx(r[2],r[4]==null?2:r[4]):esc(r[2]))}</td>
      <td>${esc(r[3]||"")}</td></tr>`).join("")}
    </tbody></table>${caption?`<div class="note">${caption}</div>`:""}`;
}
/* data table: cols=[{k,h,dp,txt}] */
function dtab(cols,rows,opt){
  opt=opt||{};
  const body=rows.map((r,i)=>{
    let cls="";
    if(opt.govIdx!=null&&r.__i===opt.govIdx)cls="gv";
    if(opt.selIdx!=null&&r.__i===opt.selIdx)cls=(cls?cls+" ":"")+"sel";
    return `<tr${cls?` class="${cls}"`:""}${r.__i!=null?` data-i="${r.__i}"`:""}>`+
      cols.map(c=>`<td>${c.txt?esc(String(r[c.k]??"")):nfx(r[c.k],c.dp)}</td>`).join("")+"</tr>";
  }).join("");
  return `<div class="scrollx"><table class="dt"><thead><tr>${
    cols.map(c=>`<th>${c.h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function msg(kind,title,html){
  const k={err:"m-err",wrn:"m-wrn",inf:"m-inf",key:"m-key"}[kind]||"m-inf";
  return `<div class="msg ${k}">${title?`<b>${esc(title)}</b>`:""}${html||""}</div>`;
}
function badge(state,txt){
  const k={ok:"b-ok",bad:"b-bad",na:"b-na",wn:"b-wn"}[state]||"b-na";
  return `<span class="badge ${k}">${esc(txt)}</span>`;
}
return {step,eqLine,vars,dtab,msg,badge,num,nfx,tex,esc,setKatexReady};
})();

const UI=(()=>{
"use strict";
const collapsed={};          // id -> bool
function isClp(id){return !!collapsed[id];}
function setClp(id,v){collapsed[id]=!!v;}
function all(){return Object.assign({},collapsed);}
function restore(o){for(const k in o)collapsed[k]=o[k];}

/* pnl(id, number, title, bodyHTML, tag, sub?) */
function pnl(id,no,title,body,tag,sub){
  const c=isClp(id)?" clp":"";
  const cls=sub?"sub":"pnl";
  return `<div class="${cls}${c}" id="${id}" data-clp="${id}">

      <span>${no?no+". ":""}${title}</span>${tag?`<span class="tag">${tag}</span>`:""}</div>
    <div class="bd">${body}</div></div>`;
}
/* wire toggles inside a root element */
function wire(root){
  root.querySelectorAll("[data-tog]").forEach(h=>{
    h.onclick=()=>{
      const id=h.getAttribute("data-tog");
      const box=document.getElementById(id);
      const now=!isClp(id);

      box.classList.toggle("clp",now);
      h.querySelector(".tw").textContent=now?"▸":"▾";
      if(window.__autosave)window.__autosave();
    };
  });
}
/* sequential numbering helper: counters per scope, no gaps */
function counter(){let n=0;return ()=>++n;}
return {pnl,wire,isClp,setClp,all,restore,counter};

<script>
/* ==================================================================
