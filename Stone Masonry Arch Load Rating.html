      PD:M.DL[i].C,MD:M.DL[i].M,PL:PL,ML:ML,P:P,M:Mm,e:e,eIn:inOf(e),kIn:inOf(M.dn[i]/6),
      reg:regimeOf(e,M.dn[i]),f:(f===Infinity)?Infinity:f/KSF_PSI,
      u:(f===Infinity)?Infinity:f/faKsf});
  }
  h+=dtab([{k:"tag",h:"Section",txt:1},{k:"dIn",h:"d (in)",dp:2},
    {k:"PG",h:"P gravity",dp:2},{k:"MG",h:"M gravity",dp:2},
    {k:"PE",h:"P earth",dp:3},{k:"ME",h:"M earth",dp:3},{k:"shE",h:"earth % of M_DL",dp:0},
    {k:"PD",h:"P_DL total",dp:2},{k:"MD",h:"M_DL total",dp:2},
    {k:"PL",h:"P_LL(1+I)",dp:3},{k:"ML",h:"M_LL(1+I)",dp:3},
    {k:"P",h:"ΣP at RF",dp:2},{k:"M",h:"ΣM at RF",dp:2},
    {k:"eIn",h:"e (in)",dp:3},{k:"kIn",h:"kern d/6 (in)",dp:3},{k:"reg",h:"Regime",txt:1},
    {k:"f",h:"f (psi)",dp:0},{k:"u",h:"f/f_a",dp:3}],rows,{govIdx:res.sec});
  h+=`<div class="note">Dead load is split so the lateral earth pressure of §7.2.7.5B can be seen against
      everything else. <b>Gravity</b> is fill, wearing surface, superimposed dead load and ring self weight —
      the loads that act downward. <b>Earth</b> is the K·γ·z pressure acting inward on the haunches, which
      carries no net vertical force on a symmetric arch but supplies a large share of the springline moment,
      often with the opposite sign to the gravity moment. The two sum to the total, and the total is what the
      rating uses. The share column is left blank where the total dead load moment passes through zero, because
      a percentage of nothing is meaningless rather than large. Live load columns are the unfactored vehicle;
      ΣP and ΣM include the live load multiplier at its converged value. Forces in k/ft and k·ft/ft on the
      one-foot strip. Governing row shaded.</div>`;
  {
    const E0=(M.DLC&&M.DLC.earth)?M.DLC.earth[res.sec]:null;
    if(E0&&Math.abs(M.DL[res.sec].M)>1e-9){
      const sh=100*E0.M/M.DL[res.sec].M;
      if(Math.abs(sh)>25)h+=msg("wn","Lateral earth pressure dominates the dead load moment here",
        `At the governing section it supplies <b>${nfx(sh,0)}%</b> of the dead load moment, and it rests `+
        `entirely on the coefficient K = ${nfx(p.K,3)} that §7.2.7.5B prescribes without qualification. `+
        `That is the one load in this calculation that is assumed rather than measured. The sensitivity table `+
        `on the Earth Pressure tab shows what the rating would be at other coefficients; run it and keep it `+
        `with the calculation.`,"§7.2.7.5B");
    }
  }

  /* ---- one section fully worked (§0.1) ---- */
  const i=res.sec, d=M.dn[i];
  const PLg=(1+impU)*LL[i].C, MLg=(1+impU)*LL[i].M;
  h+=`<h4>${atSec?"Selected section":"Governing section"} ${secTag(M,i)} — worked in full</h4>`;
  h+=msg("inf","Basis of this worked section",
    "Combined effects below are AT THE CONVERGED MULTIPLIER — the live load carries m = RF, so the governing "+
    "check closes at exactly f/f_a = 1.000. The worked calculation on the Nodal Results tab shows the same "+
    "section at m = 1, the vehicle as it stands; both are correct on their own basis, and the multiplier is "+
    "the only difference between them.");

  /* The dead load arrives at this point as two numbers, P_DL and M_DL, which
     is where a reviewer loses sight of the lateral earth pressure entirely —
     and on an arch with deep side fill that load is not a rounding term. It is
     broken out here, in the rating, rather than only on the Earth Pressure tab,
     because the moment it contributes is often opposite in sign to the gravity
     moment and can be the larger of the two at the springings. */
  {
    const cmpName={fill:"Fill over the extrados",ws:"Wearing surface",
      sdl:"Superimposed dead load",self:"Ring self weight",earth:"Lateral earth pressure"};
    const cmpRef={fill:"§7.2.7.3B",ws:"§7.2.7.4B",sdl:"§7.2.7.4B",self:"§7.2.7.3B",earth:"§7.2.7.5B"};
    const cr=[];
    let sP=0,sV=0,sM=0;
    for(const w of (M.COMPS||[])){
      const c=M.DLC&&M.DLC[w]?M.DLC[w][i]:null; if(!c)continue;
      sP+=c.C;sV+=c.V;sM+=c.M;
      cr.push({__i:cr.length,comp:cmpName[w]||w,ref:cmpRef[w]||"",
        P:c.C,V:c.V,Mo:c.M,
        shP:(Math.abs(M.DL[i].C)>1e-9)?100*c.C/M.DL[i].C:NaN,
        shM:(Math.abs(M.DL[i].M)>1e-9)?100*c.M/M.DL[i].M:NaN});
    }
    cr.push({__i:cr.length,comp:"Total dead + earth",ref:"",P:sP,V:sV,Mo:sM,shP:100,shM:100});
    h+=`<h5>Dead load at this section, by component</h5>`;
    h+=dtab([{k:"comp",h:"Component",txt:1},{k:"ref",h:"Ref",txt:1},
      {k:"P",h:"P (k/ft)",dp:4},{k:"V",h:"V (k/ft)",dp:4},{k:"Mo",h:"M (k·ft/ft)",dp:4},
      {k:"shP",h:"% of P_DL",dp:0},{k:"shM",h:"% of M_DL",dp:0}],cr,{govIdx:cr.length-1});
    const E=(M.DLC&&M.DLC.earth)?M.DLC.earth[i]:null;
    h+=`<div class="note">Each component is a separate solve of the same frame, so they superpose exactly and
      the rows sum to the total the rating uses. `+
      (E?`Lateral earth pressure contributes ${nfx(E.C,4)} k/ft of thrust and ${nfx(E.M,4)} k·ft/ft of moment
      here. It acts inward on both haunches, so on a symmetric arch it delivers no net horizontal force — but
      it is not a null load: it squeezes the ring, raising thrust, and it generates moment at the haunches and
      springings that frequently opposes the gravity moment. `:``)+
      `Share columns are blank where the total passes through zero.</div>`;
  }

  if(!local)
    h+=step({label:"Live load thrust including impact",ref:"§7.2.4.6B",
      sym:"P_{LL}(1+I)",sub:`${num(LL[i].C,4)}\\times(1+${num(impU,2)})`,res:num(PLg,4),units:"k/ft"});
  else
    h+=step({label:"Live load thrust (impact already applied per node)",ref:"§7.2.4.6B",
      sym:"P_{LL}",sub:"",res:num(PLg,4),units:"k/ft",
      note:"On the local basis each node's pressure was factored by its own (1 + I) before superposition."});
  h+=step({label:"Live load moment"+(local?" (impact already applied per node)":" including impact"),
    sym:local?"M_{LL}":"M_{LL}(1+I)",
    sub:local?"":`${num(LL[i].M,4)}\\times(1+${num(impU,2)})`,res:num(MLg,4),units:"k·ft/ft"});

  {
    const E=(M.DLC&&M.DLC.earth)?M.DLC.earth[i]:{C:0,M:0};
    h+=step({label:"Dead load thrust, gravity plus earth pressure",ref:"§7.2.7.3B / 5B",
      sym:"P_{DL}=P_{grav}+P_{earth}",
      sub:`${num(M.DL[i].C-E.C,4)}+(${num(E.C,4)})`,res:num(M.DL[i].C,4),units:"k/ft"});
    h+=step({label:"Dead load moment, gravity plus earth pressure",ref:"§7.2.7.3B / 5B",
      sym:"M_{DL}=M_{grav}+M_{earth}",
      sub:`${num(M.DL[i].M-E.M,4)}+(${num(E.M,4)})`,res:num(M.DL[i].M,4),units:"k·ft/ft",
      note:"Signs are carried through, not magnitudes. Where the earth pressure moment opposes the gravity "+
        "moment the total is smaller than either part, and a K taken lower than the prescribed 0.25 would "+
        "then INCREASE the dead load moment rather than relieve it."});
  }
  h+=step({label:"Combined thrust at the rating multiplier",ref:"§7.2.7.9B",
    sym:"\\Sigma P=P_{DL}+m\\,P_{LL,i}",
    sub:`${num(M.DL[i].C,4)}+${num(res.rf,4)}\\times${num(PLg,4)}`,
    res:num(M.DL[i].C+res.rf*PLg,4),units:"k/ft"});
  h+=step({label:"Combined moment at the rating multiplier",ref:"§7.2.7.9B",
    sym:"\\Sigma M=M_{DL}+m\\,M_{LL,i}",
    sub:`${num(M.DL[i].M,4)}+${num(res.rf,4)}\\times${num(MLg,4)}`,
    res:num(M.DL[i].M+res.rf*MLg,4),units:"k·ft/ft"});

  const P=M.DL[i].C+res.rf*PLg, Mm=M.DL[i].M+res.rf*MLg;
  const e=(P>1e-9)?Math.abs(Mm)/P:Infinity;
  h+=step({label:"Eccentricity of the combined thrust",ref:"§7.2.7.9B",
    sym:"e=12\\,\\dfrac{\\Sigma M}{\\Sigma P}",
    sub:`12\\times\\dfrac{${num(Math.abs(Mm),4)}}{${num(P,4)}}`,res:num(inOf(e),3),units:"in",
    note:"§7.2.7.9B: the maximum eccentricity is calculated in order to determine the critical load locations, "+
      "by dividing the combined dead and live load moments by the combined dead and live load thrusts."});
  h+=step({label:"Kern limit (middle third)",ref:"§7.2.7.10B",
    sym:"e_k=\\dfrac{r^2}{c}=\\dfrac{d^2/12}{d/2}=\\dfrac{d}{6}",
    sub:`\\dfrac{${num(inOf(d),2)}}{6}`,res:num(inOf(d/6),3),units:"in",
    note:"§7.2.7.10B locates the kern points above and below the neutral axis at a distance r²/c, which for a "+
      "rectangular section of depth d is d/6."});

  const reg=regimeOf(e,d);
  const f=ARCH.stressMax(P,Mm,d);
  if(reg==="KERN"){
    h+=step({label:"Eccentricity within the kern — no tension",
      sym:"e\\le e_k",sub:`${num(inOf(e),3)}\\le${num(inOf(d/6),3)}`,res:"\\text{true}",units:"in"});
    h+=step({label:"Maximum compressive stress",ref:"§7.2.7.10B",
      sym:"f=\\dfrac{\\Sigma P}{A}\\left(1+\\dfrac{6e}{d}\\right)",
      sub:`\\dfrac{${num(P,4)}}{${num(d,3)}\\times 1.0}\\left(1+\\dfrac{6\\times${num(inOf(e),3)}}{${num(inOf(d),2)}}\\right)`,
      res:num(f/KSF_PSI,1),units:"psi",
      note:`The 6e/d term is a ratio, so it is evaluated in inches — ${nfx(inOf(e),3)} in over ${nfx(inOf(d),2)} in. `+
        `The area is not: A = d × b = ${nfx(d,3)} ft × 1.0 ft = ${nfx(d,3)} ft²/ft, kept on the foot basis `+
        `because \u03a3P is in k/ft and the stress must come out in ksf.`});
  }else if(reg==="WEDGE"){
    h+=step({label:"Eccentricity outside the kern — pressure wedge applies",
      sym:"e_k<e<\\dfrac{d}{2}",
      sub:`${num(inOf(d/6),3)}<${num(inOf(e),3)}<${num(inOf(d/2),3)}\\ \\text{in}`,res:"\\text{true}",
      note:"§7.2.7.10B: where the combined thrust falls outside the kern points, resulting in tension in the "+
        "masonry, a pressure wedge analysis shall be used to calculate the maximum compressive stress. The "+
        "portion of the section in tension is effectively ignored by redistributing the pressure over a smaller depth."});
    h+=step({label:"Effective bearing depth of the pressure wedge",ref:"§7.2.7.10B",
      sym:"t_w=3\\left(\\dfrac{d}{2}-e\\right)",
      sub:`3\\left(\\dfrac{${num(inOf(d),2)}}{2}-${num(inOf(e),3)}\\right)`,
      res:num(inOf(3*(d/2-e)),3),units:"in",
      note:`The masonry bears on only this depth; the rest of the section is in tension and is ignored per `+
        `§7.2.7.10B. As an area on the one-foot strip that is A = t_w·b = ${nfx(3*(d/2-e),4)} ft²/ft, which `+
        `is the form used below because \u03a3P is in k/ft.`});
    h+=step({label:"Maximum compressive stress",ref:"§7.2.7.10B",
      sym:"f=\\dfrac{2\\,\\Sigma P}{A},\\quad A=t_w\\,b",
      sub:`\\dfrac{2\\times${num(P,4)}}{${num(3*(d/2-e),4)}}`,res:num(f/KSF_PSI,1),units:"psi",
      note:`A = ${nfx(inOf(3*(d/2-e)),3)} in ÷ 12 × 1.0 ft = ${nfx(3*(d/2-e),4)} ft²/ft.`});
    /* How hard this section magnifies every uncertainty upstream of it.
       f = 2P/[3(d/2 - e)] has a pole at e = d/2, so the bearing depth is a small
       remainder of two nearly equal numbers and a proportional error in e
       arrives at f multiplied by (d/2)/(d/2 - e). At the crown of the reference
       barrel that factor is about 17: between 12 and 96 elements the dead load
       moment moved 6% and the stress moved 89%, which reads like a solver that
       will not settle and is nothing of the kind. Worth stating, because it
       governs how much mesh refinement the section needs and how much weight the
       assumed inputs — K, the unit weights, the superimposed dead load — carry
       once they reach the answer. */
    {
      const amp=(d/2-e>1e-9)?(d/2)/(d/2-e):Infinity;
      h+=msg(amp>=8?"wn":"key","Sensitivity of this section",
        `The bearing depth is a small difference of two nearly equal numbers: d/2 = `+
        `${nfx(inOf(d/2),3)} in against e = ${nfx(inOf(e),3)} in leaves `+
        `${nfx(inOf(d/2-e),3)} in. A proportional error in the eccentricity therefore reaches the stress `+
        `multiplied by <b>(d/2)/(d/2 &minus; e) = ${(amp===Infinity)?"&infin;":nfx(amp,1)}</b>. `+
        (amp>=8
          ? `<b>At that amplification, judge mesh convergence on the rating factor or the stress, never on `+
            `the moment</b> — a moment converged to 1% can still carry ${nfx(amp,0)}% of stress error. Every `+
            `assumed input reaching this section is magnified the same way: the earth pressure coefficient, `+
            `the fill unit weight, the superimposed dead load and the shear deformation choice all arrive `+
            `here multiplied by about ${nfx(amp,0)}.`
          : `That is a moderate amplification and the section is not unusually sensitive.`),
        "§7.2.7.10B");
    }
  }else{
    h+=msg("err","Thrust outside the section",
      `e = ${nfx(inOf(e),3)} in ≥ d/2 = ${nfx(inOf(d/2),3)} in. The resultant falls outside the masonry and no equilibrium `+
      "compressive stress block exists. The section is treated as failed at this load level.");
  }

  h+=step({label:"Utilization against the allowable",ref:"MBE 6B.5.2.6 / §7.2.7.11B",
    sym:"\\dfrac{f}{f_a}",
    sub:`\\dfrac{${num(f===Infinity?NaN:f/KSF_PSI,1)}}{${num(p.fa,0)}}`,
    res:(f===Infinity)?"\\infty":num(f/faKsf,3),units:"",
    note:"By construction of the iteration below, this equals 1.00 at the converged multiplier. "+
      "The Nodal Results tab works this same section at m = 1 — the vehicle before the multiplier — so the "+
      "lower utilization printed there is a difference of basis, not a disagreement between the two tabs."});

  /* ---- the iteration (§7.2.7.12 / Fig 7.2.7-1) ---- */
  h+=`<h4>Rating factor by iteration on the live load multiplier</h4>`;
  h+=msg("key","Why an iteration is required",
    "§7.2.7.12: since the applied loading to the arch affects the section compression forces, an iterative "+
    "process must be used to determine the load ratings. It is not permissible to simply use the rating factor "+
    "calculated from the applied rating vehicle loadings and multiply it by the vehicle tonnage. A live load "+
    "effect multiplier specific to each vehicle factors the live load axial forces and bending moments prior to "+
    "re-rating the arch elements; dead loads are not modified. The multiplier is increased or decreased until "+
    "the rating factor equals 1.0, at which point the multiplier is the rating factor for that vehicle "+
    "(Figure 7.2.7-1).");
  h+=eqLine("Convergence criterion",
    "\\text{find } m \\text{ such that } \\max_i f_i\\big(P_{DL}+m P_{LL}(1+I),\\ M_{DL}+m M_{LL}(1+I)\\big)=f_a",
    "§7.2.7.12 / Fig. 7.2.7-1",
    "Solved by bisection to 48 iterations, which converges the multiplier to better than 1×10⁻¹² of its value. "+
    "The maximum is taken over all sections at every step, so the governing section is free to migrate as the "+
    "multiplier changes — which it does, and which is precisely why the iteration is required.");

  /* The loop of Fig. 7.2.7-1, shown turning. These are the real trials from the
     real bisection, not a reconstruction for display. */
  {
    const TR=ARCH.rateTrace(M,LL,faKsf,impU,(p.fv>0?p.fv*0.144:0),3);
    if(TR&&TR.steps&&TR.steps.length){
      const stage={preliminary:"1 — preliminary",bracket:"2 — bracket",
                   bisect:"3 — refine",converged:"4 — converged"};
      const tr=TR.steps.map((st,k)=>({__i:k,
        stage:stage[st.tag]||st.tag,
        m:st.m,
        sec:(st.sec>=0)?secTag(M,st.sec):"—",
        f:(st.f===Infinity)?Infinity:st.f/KSF_PSI,
        u:(st.util===Infinity)?Infinity:st.util,
        br:(st.loNew!=null)?`${nfx(st.loNew,3)} – ${nfx(st.hiNew,3)}`:"—",
        act:st.note}));
      h+=`<h5>The iteration, step by step</h5>`;
      h+=dtab([{k:"stage",h:"Step",txt:1},{k:"m",h:"Multiplier m",dp:4},
        {k:"sec",h:"Governing section",txt:1},{k:"f",h:"f (psi)",dp:1},
        {k:"u",h:"f / f_a",dp:3},{k:"br",h:"RF known to lie in",txt:1},
        {k:"act",h:"What that tells the next step",txt:1}],tr,{govIdx:tr.length-1});
      const migrated=new Set(TR.steps.filter(x=>x.sec>=0).map(x=>x.sec)).size>1;
      h+=`<div class="note">Only the first ${
        TR.steps.filter(x=>x.tag==="bisect").length} refinement steps are listed; the solver runs
        ${TR.nBisect} in total. The midpoints are not monotonic and are not meant to be — each one halves the
        interval the answer is known to lie in, which is the column beside it. Dead loads are never scaled:
        only the live load thrust and moment carry the multiplier, per §7.2.7.12.`+
        (migrated
          ? ` <b>The governing section moves during the iteration</b>, which is exactly why the clause forbids
            scaling a single preliminary rating factor — the section that controls at m = 1 is not the section
            that controls at the answer.`
          : ` The governing section happens to stay at ${secTag(M,res.sec)} throughout on this model, but the
            search is over every section at every step and is free to move.`)+
        `</div>`;
      const prelim=TR.steps[0];
      if(prelim&&prelim.util>0&&prelim.util!==Infinity){
        const naive=1/prelim.util;
        h+=msg("key","Why the answer is not simply 1 / (f/f_a) at m = 1",
          `The preliminary trial puts the section at f/f_a = ${nfx(prelim.util,3)}. Scaling that the way an `+
          `elastic check would allow gives ${nfx(naive,3)}, against the correct answer of `+
          `<b>${nfx(TR.m,3)}</b> — a difference of ${nfx(100*Math.abs(naive-TR.m)/TR.m,1)}%. The stress is not `+
          `proportional to the load: the eccentricity e = ΣM/ΣP changes as the live load grows, and once the `+
          `thrust leaves the kern the section carries on a reduced bearing depth 3(d/2 − e), so f rises faster `+
          `than linearly and runs away as e approaches d/2. That non-linearity is the whole reason §7.2.7.12 `+
          `requires an iteration and states that scaling a preliminary rating factor is not permissible.`,
          "§7.2.7.12");
      }
    }
  }
  h+=step({label:"Converged live load multiplier = rating factor",ref:"§7.2.7.12",
    sym:"RF=m",sub:"",res:(res.rf>=500)?"\\ge 500":num(res.rf,3),units:"",
    note:"Inventory level, Allowable Stress method."});
  if(p.fv>0){
    h+=`<h4>Shear check</h4>`;
    h+=msg("wrn","Outside §7.2.7",
      "The clause rates stone masonry arches on combined compressive stress only. The check below is a "+
      "supplement, included in the governing rating factor because an allowable shear stress has been "+
      "entered. Report it as such.");
    h+=eqLine("Shear capacity of the section","V_{cap}=f_v\\,A=f_v\\,d\\,b","",
      "Average shear on the full bed area. A constant allowable takes no account of the normal thrust, which "+
      "is what resists sliding in a masonry joint — a springing under high thrust resists far more than a "+
      "lightly loaded crown, and that is not represented here.");
    /* Live shear at the governing position, on the same basis the rating used. */
    const locV=(res.impMode==="local");
    let qv=ARCH.nodalLL(M,veh,res.pos,res.dir);
    if(locV)qv=ARCH.applyLocalImpact(M,qv);
    const LLv=ARCH.llEffects(M,qv);
    const impV=locV?0:res.imp;
    const fImp=1+impV;
    const rowsV=M.g.nodes.map((n,i)=>{
      const A=M.dn[i]*1.0, cap=p.fv*0.144*A;
      const vD=M.DL[i].V, vL=fImp*LLv[i].V;
      const rf=ARCH.shearRF(M,i,LLv,impV,p.fv*0.144);
      return {__i:i,tag:secTag(M,i),d:M.dn[i],dIn:inOf(M.dn[i]),A:A,
        vD:vD,vL:vL,vT:vD+res.rf*vL,
        cap:cap,tau:Math.abs(vD+res.rf*vL)/A/0.144,
        util:Math.abs(vD+res.rf*vL)/Math.max(cap,1e-9),
        rf:(rf===Infinity)?NaN:rf};
    });
    h+=dtab([{k:"tag",h:"Section",txt:1},{k:"dIn",h:"d (in)",dp:2},{k:"A",h:"A (ft²/ft)",dp:3},
      {k:"vD",h:"V dead (k/ft)",dp:4},{k:"vL",h:"V live (k/ft)",dp:4},
      {k:"vT",h:"V at RF (k/ft)",dp:4},{k:"cap",h:"V capacity (k/ft)",dp:4},
      {k:"tau",h:"τ at RF (psi)",dp:1},{k:"util",h:"τ / f_v",dp:3},
      {k:"rf",h:"RF this section, shear",dp:3}],rowsV,{govIdx:res.sec});
    h+=`<div class="note">Shear is resolved on the section normal to the arch axis and averaged across the two
     adjacent element ends, the same basis as the thrust. <b>RF this section, shear</b> is the live load
     multiplier that would bring that section alone to the allowable in shear; a blank means the section carries
     no live shear at this vehicle position and so is not controlled by it. The reported rating factor for this
     vehicle is the lowest value over all sections and both checks.</div>`;
  }
  h+=step({label:"Rating in tons",
    sym:"W_{rating}=RF\\times W_{veh}",
    sub:`${num(res.rf,3)}\\times${num(veh.tons,2)}`,res:num(res.tons,2),units:"tons"});
  if(veh.eRef)
    h+=step({label:"Cooper E-rating",ref:"AREMA Cooper series",
      sym:"E=RF\\times E_{ref}",sub:`${num(res.rf,3)}\\times${num(veh.eRef,0)}`,
      res:"E"+ (res.rf*veh.eRef).toFixed(0),
      note:"The Cooper rating is conventionally reported as an E-number. The tonnage above derives from the "+
        "same 80 kip reference and is not a physical vehicle weight."});

  const pass=res.rf>=1.0;
  h+=msg(pass?"key":"err",pass?"Rating factor ≥ 1.0 — vehicle is acceptable":"Rating factor < 1.0 — vehicle is not acceptable",
    `RF = ${nfx(res.rf,3)} at section ${secTag(M,res.sec)}, lead axle at `+
    `x = ${nfx(ARCH.leadAxleX(veh,res.pos,res.dir),2)} ft traveling `+
    `${res.dir<0?"right to left":"left to right"}`+
    `${res.dir<0?", traveling right to left":""}. `+
    (pass?"":"Posting analysis is required per MBE Art. 6B.7; this tool does not perform it."));
  if(veh.ev)
    h+=msg("inf","EV vehicle reporting",
      "§7.2.7.11B: ratings for stone masonry arches shall only be provided at the Inventory Stress Level. "+
      "Ratings for the EV2 and EV3 vehicles shall also be calculated at the Inventory Stress Level but "+
      "reported at both Inventory and Operating Stress Levels for this type of structure — report the same "+
      "value for Items 64 and 66.");
  return h;
}

/* ==================================================================
   LIVE LOAD — complete worked calculation at the section of interest
   ================================================================== */
/* One section per call. The Live Load tab presents these as separate panels in
   the order the calculation takes them; passing no part returns all four, which
   is what the printed report uses. */
function liveWorked(p,M,veh,pos,dir,node,part){
  part=part||"all";
  const want=(s)=>(part==="all"||part===s);
  const rail=(veh.mode==="rail");
  const local=(p.impMode==="local");
  const q=ARCH.nodalLL(M,veh,pos,dir);
  const qI=local?ARCH.applyLocalImpact(M,q):q;
  const impCrown=local?0:ARCH.impactAt(p,M.g.coverCrown+p.tws);
  const LL=ARCH.llEffects(M,qI);
  const maxOff=veh.axles[veh.axles.length-1].x;
  let h="";

  if(want("scope"))h+=msg("key","Scope of this calculation",
    `Every step from ${esc(veh.name)} with its lead axle at `+
    `x = ${nfx(ARCH.leadAxleX(veh,pos,dir),2)} ft, traveling `+
    `${dir<0?"right to left":"left to right"}, to the live load thrust, moment and shear at `+
    `<b>${esc(CALC.secTag(M,node))}</b>. Impact is worked at every node, the pressure is worked at every node, `+
    `and the influence line superposition is shown term by term so the total can be added up by hand.`);

  /* ---- 1. impact, worked at every node ---- */
  if(want("impact")){
  if(part==="all")h+=`<h4>1. Impact — the percentage applied at each node</h4>`;
  if(rail){
    h+=eqLine("Impact below the base of rail",
      "IM=\\left[1-\\dfrac{H-1.5}{8.5}\\right]\\times 0.60","AREMA",
      "H is the depth from the base of rail down to the top of the arch. The base of rail is the top of the "+
      "tie, which is the surface this program measures cover from, so the same H that sets the load spread "+
      "sets the impact. The expression gives 60% at 1.5 ft and falls linearly to zero at 10 ft; it is clamped "+
      "at both ends rather than extrapolated.");
    h+=vars([["IM_{max}","Impact at 1.5 ft and shallower",40,"%",0],
             ["H_{0}","Depth at which impact vanishes",10,"ft",0]]);
  }else{
    h+=eqLine("Impact by depth of fill","I=\\begin{cases}30\\% & H\\le 1\\\\ 20\\% & 1<H\\le 2\\\\ "+
      "10\\% & 2<H<3\\\\ 0 & H\\ge 3\\end{cases}",
      (p.loadMode==="rail")?"AREMA":"Std Spec 3.8.2.3 / §7.2.4.6B",
      "H is the depth from the roadway surface to the extrados. The thresholds are steps, not a smooth curve, "+
      "so a node either side of a threshold can differ by a whole band.");
  }
  h+=msg(local?"inf":"key",local?"Local basis — each node uses its own depth"
      :"Crown basis — one percentage applied everywhere",
    local
      ? "Each node's own cover is used and (1 + I) multiplies that node's pressure before superposition, so "+
        "the deep haunches attract no impact while the crown does. This can never rate lower than the crown "+
        "basis."
      : `The minimum cover, at the crown, sets one percentage for the whole barrel: H = `+
        `${nfx(M.g.coverCrown+p.tws,3)} ft gives I = ${nfx(100*impCrown,0)}%, applied uniformly. This is the `+
        `conservative reading and is most likely what a legacy rating used.`);
  if(rail)
    h+=msg("inf","Railroad impact is applied, not the highway rule",
      "Impact follows the AREMA expression above, measured below the base of rail — not AASHTO Std. Spec. "+
      "3.8.2.3, which is a highway provision and would give zero beyond 3 ft of cover where AREMA still "+
      "requires around 28%. Confirm the expression against the track owner's criteria, which can differ.");
  h+=dtab([{k:"tag",h:"Node",txt:1},{k:"x",h:"x (ft)",dp:2},
    {k:"H",h:"cover at this node (ft)",dp:3},
    {k:"Hb",h:"depth used for I (ft)",dp:3},{k:"band",h:"Band applied",txt:1},
    {k:"I",h:"I (%)",dp:0},{k:"f",h:"(1 + I)",dp:2}],
    M.g.nodes.map((n,i)=>{
      const H=M.coverAt(i);
      const Iv=local?ARCH.impactAt(p,H):impCrown;
      const Hb=local?H:(M.g.coverCrown+p.tws);
      return {__i:i,tag:CALC.secTag(M,i),x:n.x,H:H,Hb:Hb,
        band:rail
          ?(Hb<=1.5?"H ≤ 1.5 ft — capped at 40%"
            :(Hb>=10?"H ≥ 10 ft — no impact":"1.5 < H < 10 ft — linear"))
          :(Hb<=1?"H ≤ 1 ft":(Hb<=2?"1 < H ≤ 2 ft":(Hb<3?"2 < H < 3 ft":"H ≥ 3 ft"))),
        I:100*Iv,f:1+Iv};
    }),{govIdx:node});
  h+=`<div class="note">${local
    ? "On the local basis the depth used is each node's own cover, so the two depth columns agree."
    : "On the crown basis the depth used is the crown cover for every node, which is why the band can differ "+
      "from what a node's own cover would give — the two depth columns deliberately disagree away from the "+
      "crown."} The section of interest is shaded.</div>`;

  }
  /* ---- 2. distribution and nodal loads ---- */
  if(want("dist")){
  if(part==="all")h+=`<h4>2. Pressure and the equivalent nodal load at every node</h4>`;
  h+=eqLine("Equivalent nodal load","q_j=p_j\\,b\\,t_j\\,(1+I_j)","§7.2.7.7B",
    "p is the pressure delivered to the extrados at that node, b = 1.00 ft is the analysis strip, and t is the "+
    "tributary horizontal length of the node, <b>measured on the extrados</b> because that is the surface "+
    "receiving the pressure — on a deep ring the extrados is materially wider than the arch axis beneath it. "+
    "The impact factor is folded in here on the local basis; on the "+
    "crown basis it multiplies the assembled effects instead.");
  /* The full distribution, node by node: the spread geometry, which axles reach
     the node, the pressure that arrives, and the nodal load that goes into the
     solve. Everything the reader needs to reproduce a row by hand, in the order
     the calculation actually takes. */
  const br=ARCH.nodalLLByAxle(M,veh,pos,dir);
  const totQ=qI.reduce((a,b)=>a+b,0)||1;
  const rowsD=M.g.nodes.map((n,i)=>{
    const H=M.coverAt(i);
    const ids=[],near=[];
    let sumP=0;
    if(br&&br.axQ)br.axQ.forEach((a,kx)=>{ if(a[i]>0){ids.push("A"+(kx+1));sumP+=veh.axles[kx].P;} });
    let Ls,wid,wEff,branch,nWheel;
    if(rail){
      const S=ARCH.railSpread(p,H);
      const grp=S.groups.reduce((x,y)=>(y.width>=x.width?y:x));
      Ls=S.Ls; wid=S.wTrack; wEff=grp.width;
      branch=grp.merged?(grp.n+" tracks merged"):"single track";
      nWheel=grp.n;
    }else{
      Ls=ARCH.TIRE_L+1.75*H; wid=ARCH.TIRE_W+1.75*H;
      const merged=(wid>=ARCH.GAGE);
      wEff=merged?(ARCH.GAGE+wid):wid;
      branch=merged?("merged, w_t ≥ "+nfx(ARCH.GAGE,2)):("separate, w_t < "+nfx(ARCH.GAGE,2));
      nWheel=merged?2:1;
    }
    return {__i:i,tag:CALC.secTag(M,i),x:n.x,H:H,
      Hi:local?H:(M.g.coverCrown+p.tws),
      Ls:Ls,wid:wid,branch:branch,wEff:wEff,area:wEff*Ls,
      nAx:ids.length,ids:ids.join(" ")||"—",wheels:nWheel,
      sumP:sumP,trail:(rail&&br&&br.trQ&&br.trQ[i]>0)?"yes":"—",
      p:M.tribH[i]>0?q[i]/M.tribH[i]:0,
      f:1+(local?ARCH.impactAt(p,H):impCrown),
      pi:M.tribH[i]>0?qI[i]/M.tribH[i]:0,
      trib:M.tribH[i],q0:q[i],q:qI[i],
      pct:100*qI[i]/totQ,
      shallow:(!rail&&H<2)?"H < 2 ft":""};
  });
  h+=`<div class="scrollx">`+dtab([
    {k:"tag",h:"Node",txt:1},{k:"x",h:"x (ft)",dp:2},
    {k:"H",h:"cover H (ft)",dp:3},{k:"Hi",h:"depth used for I (ft)",dp:3},
    {k:"Ls",h:rail?"L_s = 3.0+2h (ft)":"L_s = 10″+1.75H (ft)",dp:3},
    {k:"wid",h:rail?"W_tr = L_tie+2h (ft)":"w_t = 20″+1.75H (ft)",dp:3},
    {k:"branch",h:rail?"tracks":"Std Spec 6.4 branch",txt:1},
    {k:"wEff",h:"effective width (ft)",dp:3},{k:"area",h:"patch area (ft²)",dp:2},
    {k:"wheels",h:rail?"tracks in group":"wheel lines",dp:0},
    {k:"nAx",h:"axles",dp:0},{k:"ids",h:"which axles",txt:1},
    {k:"sumP",h:"Σ axle load (kip)",dp:1}].concat(
      rail?[{k:"trail",h:"trailing load",txt:1}]:[]).concat([
    {k:"p",h:"pressure p (ksf)",dp:5}]).concat(
    /* On the crown basis impact multiplies the assembled effects, not the nodal
       loads, so a "with impact" column here would repeat the unimpacted value
       beside a factor that has not been applied to it — which reads as an
       arithmetic error. Those columns appear only on the local basis. */
    local?[{k:"f",h:"1 + I at this node",dp:3},{k:"pi",h:"p with impact (ksf)",dp:5}]:[]).concat([
    {k:"trib",h:"trib t_j (ft)",dp:3},
    {k:"q0",h:local?"q before impact (k/ft)":"q (k/ft)",dp:5}]).concat(
    local?[{k:"q",h:"q applied (k/ft)",dp:5}]:[]).concat([
    {k:"pct",h:"% of Σq",dp:1}]).concat(
      rail?[]:[{k:"shallow",h:"caveat",txt:1}]),
    rowsD,{govIdx:node})+
    `<div class="note">One row per node, in the order the calculation takes them.
   <b>H</b> is the cover over that node and sets how far the load has spread by the time it arrives, which is why
   a deep haunch receives far less than the crown from the same axle; <b>depth used for I</b> differs from it on
   the crown impact basis and is shown separately for that reason.
   ${rail
     ? "<b>Tracks</b> records whether adjacent track widths overlap, in which case the outer limits are taken "+
       "and the combined load is spread over the merged width."
     : "<b>Std Spec 6.4 branch</b> records the decision that governs the transverse spread: the two wheel lines "+
       "spread independently and each carries half an axle until w_t reaches the 6.00 ft gage, after which the "+
       "axle acts as one patch over gage + w_t. That branch point is the most error-prone step in the "+
       "distribution, so the comparison is shown rather than just its outcome."}
   <b>Which axles</b> names them, so a pressure can be traced back to the specific wheels producing it in the
   axle contribution matrix above. <b>t_j</b> is the tributary horizontal length the node owns, measured along
   the extrados. <b>q applied</b> is what enters the solve, and <b>% of Σq</b> shows how few nodes usually carry
   the load. ${rail?"":"A <b>caveat</b> entry marks a node with less than 2 ft of cover, where Std. Spec. "+
   "3.24.3 calls for slab distribution instead of the through-fill spread used here — this program does not "+
   "perform that check. "}A blank row means no footprint reaches that node at this position. The section of
   interest is shaded.</div></div>`;
  const sq=qI.reduce((a,b)=>a+b,0);
  h+=step({label:"Total live load arriving on the one-foot strip",
    sym:"\\sum q_j",sub:"",res:num(sq,5),units:"k/ft",
    note:"Not the vehicle weight — the rest is carried by the fill outside the strip and by the abutments."});

  }
  /* ---- 3. superposition, term by term ---- */
  /* The superposition sums are needed by the combination section as well, so
     they are computed unconditionally and only their presentation is gated. */
  const supRows=[];
  let sP=0,sM=0,sV=0;
  for(let j2=0;j2<M.nN;j2++){
    const eP=M.ILC[node][j2], eM=M.ILM[node][j2], eV=M.ILV[node][j2];
    sP+=qI[j2]*eP; sM+=qI[j2]*eM; sV+=qI[j2]*eV;
    if(qI[j2]===0&&j2!==node)continue;
    supRows.push({__i:supRows.length,tag:CALC.secTag(M,j2),x:M.g.nodes[j2].x,q:qI[j2],
      eM:eM,pM:qI[j2]*eM,eP:eP,pP:qI[j2]*eP,eV:eV,pV:qI[j2]*eV});
  }
  const fI=local?1:(1+impCrown);
  if(want("sup")){
  h+=`<h4>3. Superposition at ${esc(CALC.secTag(M,node))} — term by term</h4>`;
  h+=eqLine("Live load effects at a section",
    "P_{LL}=\\sum_j q_j\\,\\eta^{P}_{i,j}\\qquad M_{LL}=\\sum_j q_j\\,\\eta^{M}_{i,j}\\qquad "+
    "V_{LL}=\\sum_j q_j\\,\\eta^{V}_{i,j}","§7.2.7.7B",
    "Each nodal load is multiplied by the influence ordinate at the section of interest and the products are "+
    "summed. Only the free nodes contribute — a load at a restrained springing passes straight into the "+
    "support, so those ordinates are zero.");
  h+=dtab([{k:"tag",h:"Load at",txt:1},{k:"x",h:"x (ft)",dp:2},{k:"q",h:"q_j (k/ft)",dp:5},
    {k:"eM",h:"η_M (ft)",dp:5},{k:"pM",h:"q·η_M",dp:5},
    {k:"eP",h:"η_P (—)",dp:5},{k:"pP",h:"q·η_P",dp:5},
    {k:"eV",h:"η_V (—)",dp:5},{k:"pV",h:"q·η_V",dp:5}],supRows);
  h+=`<div class="note">Only nodes carrying load are listed. The influence ordinates are the row of the
   coefficient tables for ${esc(CALC.secTag(M,node))}; a moment ordinate carries units of length, and a thrust
   or shear ordinate is dimensionless.</div>`;
  h+=step({label:"Live load moment",sym:"M_{LL}=\\sum q_j\\eta^{M}",sub:"",res:num(sM,5),units:"k·ft/ft"});
  h+=step({label:"Live load thrust",sym:"P_{LL}=\\sum q_j\\eta^{P}",sub:"",res:num(sP,5),units:"k/ft"});
  h+=step({label:"Live load shear",sym:"V_{LL}=\\sum q_j\\eta^{V}",sub:"",res:num(sV,5),units:"k/ft"});
  if(!local)
    h+=step({label:"Impact applied on the crown basis",ref:"§7.2.4.6B",
      sym:"(1+I)",sub:`1+${num(impCrown,3)}`,res:num(1+impCrown,3),units:"",
      note:"On the crown basis the factor multiplies the assembled effects; on the local basis it was already "+
        "folded into each nodal load above."});
  h+=step({label:"Live load effects with impact",
    sym:"P_{LL}(1+I),\\;M_{LL}(1+I)",
    sub:`${num(sP,5)}\\times${num(fI,3)},\\;${num(sM,5)}\\times${num(fI,3)}`,
    res:`${nfx(sP*fI,5)},\\;${nfx(sM*fI,5)}`,units:"k/ft,\\;k·ft/ft"});

  }
  /* ---- 4. combine with dead load ---- */
  if(want("comb")){
  h+=`<h4>4. Combined with dead load at ${esc(CALC.secTag(M,node))}</h4>`;
  const D=M.DL[node], d=M.dn[node];
  const P=D.C+sP*fI, Mm=D.M+sM*fI;
  h+=eqLine("Notation","P_{LL,i}\\equiv P_{LL}\\,(1+I)","",
    "The subscript i marks a live load effect that already carries impact. On the local basis the factor was "+
    "applied to each nodal load before superposition, so repeating (1+I) beside a value that already contains "+
    "it would read as applying impact twice.");
  h+=eqLine("Notation","P_{LL,i}\\equiv P_{LL}\\,(1+I)","",
    "The subscript i marks a live load effect that already carries impact. On the local basis the factor was "+
    "applied to each nodal load before superposition, so repeating (1+I) beside a value that already contains "+
    "it would read as applying impact twice.");
  h+=step({label:"Combined thrust",sym:"\\Sigma P=P_{DL}+P_{LL,i}",
    sub:`${num(D.C,4)}+${num(sP*fI,4)}`,res:num(P,4),units:"k/ft"});
  h+=step({label:"Combined moment",sym:"\\Sigma M=M_{DL}+M_{LL,i}",
    sub:`${num(D.M,4)}+${num(sM*fI,4)}`,res:num(Mm,4),units:"k·ft/ft"});
  h+=step({label:"Eccentricity",ref:"§7.2.7.9B",sym:"e=12\\,\\dfrac{\\Sigma M}{\\Sigma P}",
    sub:`12\\times\\dfrac{${num(Mm,4)}}{${num(P,4)}}`,
    res:num(P>1e-9?inOf(Mm/P):NaN,3),units:"in",
    note:"ΣM is k·ft/ft and ΣP is k/ft, so the quotient is in feet; the factor of 12 puts it in inches to be "+
      "compared with the kern and the depth."});
  const pr=ARCH.stressPair(P,Mm,d);
  h+=step({label:"Peak compressive stress",ref:"§7.2.7.10B",sym:"f",sub:"",
    res:(pr.ext===Infinity)?"\\infty":num(Math.max(pr.ext,pr.int)/0.144,1),units:"psi",
    note:`Regime ${pr.regime}. Extrados ${nfx(pr.ext/0.144,1)} psi, intrados ${nfx(pr.int/0.144,1)} psi — `+
      `the kern and pressure wedge figure on the Diagrams tab draws this.`});
  h+=step({label:"Utilization",sym:"f/f_a",
    sub:`${num(Math.max(pr.ext,pr.int)/0.144,1)}/${num(p.fa,0)}`,
    res:num(Math.max(pr.ext,pr.int)/(p.fa*0.144),3),units:"",
    note:"This is the service condition at the position shown, not the condition at the converged rating "+
      "multiplier; the rating iteration of §7.2.7.12 is on the Rating tab."});
  }
  return h;
}

return {validate,geometrySection,liveWorked,deadLoadSection,liveLoadSection,vehicleSection,secTag,regimeOf,KSF_PSI};
})();

/* ==================================================================
   NODAL RESULTS TABLE  (added: per-node audit table)
   ================================================================== */
const NODAL=(()=>{
"use strict";
const {step,eqLine,vars,dtab,msg,badge,num,nfx,esc}=R;
const KSF=0.144;

/* rating factor for one specific section, holding all others aside */
function sectionRF(M,i,LL,imp,faKsf){
  const d=M.dn[i], DL=M.DL[i];
  const f=m=>ARCH.stressMax(DL.C+m*(1+imp)*LL[i].C, DL.M+m*(1+imp)*LL[i].M, d);
  if(f(0)===Infinity||f(0)>=faKsf)return 0;
  let lo=0,hi=1;
  while(hi<512&&f(hi)<faKsf)hi*=2;
  if(hi>=512&&f(hi)<faKsf)return 512;
  for(let k=0;k<40;k++){const mid=(lo+hi)/2;(f(mid)<faKsf)?lo=mid:hi=mid;}
  return (lo+hi)/2;
}

function rows(p,M,veh,pos,dir){
  const local=(p.impMode==="local");
  const impU=local?0:ARCH.impactAt(p,M.g.coverCrown+p.tws);
  const faKsf=p.fa*KSF;
  let q=ARCH.nodalLL(M,veh,pos,dir);
  const qImp=local?ARCH.applyLocalImpact(M,q):q;
  /* Per node, so each row takes its own adverse half. */
  const LL=[]; for(let z=0;z<M.nN;z++)LL.push(ARCH.llAtSection(M,qImp,z));
  const offs=veh.axles.map(a=>a.x), maxOff=offs[offs.length-1];
  const out=[];
  for(let i=0;i<M.nN;i++){
    const n=M.g.nodes[i], d=M.dn[i];   // stress-check depth, not the geometry depth
    const H=M.coverAt(i);
    const hf=Math.max(M.g.bwsAt(n.extX)-n.extY,0);
    const rail=(veh.mode==="rail");
    const RS=rail?ARCH.railSpread(p,H):null;
    const Ls=rail?RS.Ls:(ARCH.TIRE_L+1.75*H);
    const wt=rail?RS.wTrack:(ARCH.TIRE_W+1.75*H);
    const merged=rail?RS.groups.some(gg=>gg.merged):(wt>=ARCH.GAGE);
    const wEff=rail?Math.max(...RS.groups.map(gg=>gg.width)):(merged?(ARCH.GAGE+wt):wt);
    let nAx=0,press=0,branch=merged?"merged":"separate",LsR=Ls,wtR=wt,wEffR=wEff;
    if(i>0&&i<M.nN-1)for(const ax of veh.axles){
      const xa=(dir>0)?pos+ax.x:pos+maxOff-ax.x;
      const rgN=rail?null:ARCH.llRegime(M,xa);
      if(rgN&&rgN.conc&&rgN.r>0){
        /* credited fill spread below 2 ft — same geometry as 6.4.2, at rate r */
        const sL=ARCH.TIRE_L+rgN.r*H, wt2=ARCH.TIRE_W+rgN.r*H;
        if(ARCH.coverFrac(ARCH.tribSpan(M,i),xa-sL/2,xa+sL/2)>0){
          nAx++; branch="6.4.1 at "+rgN.r+"H"; LsR=sL; wtR=wt2;
          wEffR=(wt2>=ARCH.GAGE)?(ARCH.GAGE+wt2):wt2;
        }
      }else if(rgN&&rgN.conc){
        /* 6.4.1 axle. It reaches this node only through the interpolation share,
           so count it when the node is one of the two brackets. The width and
           length reported are the ones the load actually used: E across, and the
           node's tributary length along, which reproduces p·A = P exactly. */
        const nds=M.g.nodes;
        for(let k=0;k<M.nN-1;k++){
          const a2=nds[k],b2=nds[k+1];
          if((xa>=a2.x&&xa<=b2.x)||(xa<=a2.x&&xa>=b2.x)){
            if(k===i||k+1===i){
              nAx++; const E2=ARCH.shallowWidth(p);
              branch="6.4.1 concentrated"; LsR=M.tribH[i]; wtR=E2;
              wEffR=(E2>ARCH.GAGE)?(E2/2):E2;   // effective width carrying one wheel
            }
            break;
          }
        }
      }else if(ARCH.coverFrac(ARCH.tribSpan(M,i),xa-Ls/2,xa+Ls/2)>0)nAx++;
    }
    press=(M.tribH[i]>0)?(qImp[i]||0)/M.tribH[i]:0;
    const Ii=local?ARCH.impactAt(p,H):impU;
    const PL=(1+impU)*LL[i].C, ML=(1+impU)*LL[i].M;
    const P=M.DL[i].C+PL, Mm=M.DL[i].M+ML;
    const e=(P>1e-9)?Math.abs(Mm)/P:Infinity;
    const fk=ARCH.stressMax(P,Mm,d);
    const pair=ARCH.stressPair(P,Mm,d);
    const eSigned=(P>1e-9)?(Mm/P):NaN;   // +ve toward the extrados, moment sagging-positive
    const th=isFinite(eSigned)?{x:n.x+n.nx*eSigned,y:n.y+n.ny*eSigned}:{x:NaN,y:NaN};
    const r={__i:i,tag:CALC.secTag(M,i),x:n.x,y:n.y,s:n.s,
      d,dIn:inOf(d),A:d*1.0,S:d*d/6,Ix:d*d*d/12,kern:d/6,kernIn:inOf(d/6),
      ang:Math.atan2(n.nx,n.ny)*180/Math.PI,
      hf,H,z:hf+((p.gf>0)?(p.gws/p.gf)*p.tws:0),
      Ls:LsR,wt:wtR,merged:branch,wEff:wEffR,area:wEffR*LsR,press,nAx,
      trib:M.tribH[i],q:qImp[i]||0,imp:Ii*100,
      ilMax:M.ILsum[i].maxM,ilMaxX:M.ILsum[i].maxAtX,
      ilMin:M.ILsum[i].minM,ilMinX:M.ILsum[i].minAtX,
      PL,ML,P,M:Mm,e,eIn:inOf(e),eod:e/d,
      reg:CALC.regimeOf(e,d),
      f:(fk===Infinity)?Infinity:fk/KSF,
      fExt:(pair.ext===Infinity)?Infinity:pair.ext/KSF,
      fInt:(pair.int===Infinity)?Infinity:pair.int/KSF,
      util:(fk===Infinity)?Infinity:fk/faKsf,
      rf:sectionRF(M,i,LL,impU,faKsf),
      tx:th.x,ty:th.y};
    for(const w of M.COMPS){r["P_"+w]=M.DLC[w][i].C;r["V_"+w]=M.DLC[w][i].V;r["M_"+w]=M.DLC[w][i].M;}
    r.P_dl=M.DL[i].C; r.V_dl=M.DL[i].V; r.M_dl=M.DL[i].M;
    out.push(r);
  }
  return {rows:out,qImp,LL,impU,local,veh,pos,dir};
}

function section(p,M,veh,pos,dir,govSec){
  const D=rows(p,M,veh,pos,dir);
  const rs=D.rows;
  const c=UI.counter();
  const opt={govIdx:govSec};
  let h="";

  h+=msg("inf","What this tab is",
    `Every quantity the rating depends on, node by node, for <b>${esc(veh.name)}</b> with the lead axle at `+
    `x = ${nfx(ARCH.leadAxleX(veh,pos,dir),2)} ft, traveling `+
    `${dir<0?"right to left":"left to right"}. Use it to audit any single section by hand `+
    `without reading through the worked narrative.`);

  h+=UI.pnl("nd_geo",c(),"Section properties and geometry",
    dtab([{k:"tag",h:"Node",txt:1},{k:"x",h:"x (ft)",dp:3},{k:"y",h:"y axis (ft)",dp:3},
      {k:"s",h:"arc s (ft)",dp:3},{k:"ang",h:"section tilt (°)",dp:2},
      {k:"dIn",h:"d (in)",dp:2},{k:"A",h:"A (ft²/ft)",dp:3},{k:"S",h:"S (ft³/ft)",dp:4},
      {k:"Ix",h:"I (ft⁴/ft)",dp:5},{k:"kernIn",h:"kern d/6 (in)",dp:3}],rs,opt)+
    `<div class="note">Section tilt is the angle of the section normal from vertical — zero at the crown,
     steepest at the springings. Properties are per foot of barrel width: A = d·b, S = d²b/6, I = d³b/12.</div>`,
    "§7.2.7.2B",true);

  h+=UI.pnl("nd_dep",c(),"Depths — three different measurements at each node",
    dtab([{k:"tag",h:"Node",txt:1},
      {k:"hf",h:"fill h_f, extrados→bottom of HMA (ft)",dp:3},
      {k:"H",h:"distribution depth H, extrados→top of HMA (ft)",dp:3},
      {k:"z",h:"equivalent depth z for K·γ_f·z (ft)",dp:3}],rs,opt)+
    `<div class="note"><b>These are three different things and they are deliberately not equal.</b>
     <br><br>
     <b>h_f</b> is fill only. It stops at the <b>bottom</b> of the HMA and is weighed at γ_f, so the pavement
     is never counted as soil. Its weight is computed separately as γ_ws·t_ws and distributed across the
     barrel per §7.2.7.4B.
     <br><br>
     <b>H</b> <b>includes</b> the HMA and is the depth that drives live load distribution and the local impact
     basis. The pavement is a stiffer medium than the fill beneath it, so it disperses a wheel load at least as
     well as soil does; excluding it from the distribution depth would understate the spread and, more to the
     point, would move a barrel across the 2 ft threshold of Std. Spec. 6.4 on a technicality about which layer
     is which.
     <br><br>
     <b>z</b> is the equivalent depth that reproduces the vertical stress at the extrados when multiplied by
     K·γ_f: z = h_f + (γ_ws/γ_f)·t_ws. The pavement bears on the fill as a surcharge, so it belongs in the
     vertical stress driving the lateral pressure — again at its own unit weight, not the soil's. Where the
     pavement and fill unit weights differ, z is not equal to H.
     <br><br>
     On a sloped grade all three vary independently along the barrel, and confusing them is an easy and
     consequential error.</div>`,"§7.2.7.3B / 4B / 5B",true);

  const isRail=(veh.mode==="rail");
  h+=UI.pnl("nd_ll",c(),"Live load distribution through fill"+(isRail?" — railroad, tie distribution":" — highway, Std Spec 6.4"),
    dtab([{k:"tag",h:"Node",txt:1},{k:"H",h:"H (ft)",dp:3},
      {k:"Ls",h:isRail?"L_s = 3.0+2h (ft)":"L_s = 10″+1.75H (ft)",dp:3},
      {k:"wt",h:isRail?"W_tr = L_tie+2h (ft)":"w_t = 20″+1.75H (ft)",dp:3},
      {k:"merged",h:isRail?"tracks":"wheel lines",txt:1},{k:"wEff",h:"effective width (ft)",dp:3},
      {k:"area",h:"spread area (ft²)",dp:3},{k:"nAx",h:"axles",dp:0},
      {k:"press",h:"pressure p (ksf)",dp:5},{k:"trib",h:"trib length (ft)",dp:3},
      {k:"q",h:"q_j (k/ft)",dp:4}],rs,opt)+
    `<div class="note">${isRail
      ? "Railroad distribution: load enters at the bottom of the ties over the tie length transversely and 3.0 ft "+
        "longitudinally, then spreads at the rate set in the Track and Tie panel — r horizontal per unit of "+
        "depth each side — so W = L_tie + 2rh and L_s = 3.0 + 2rh at depth h "+
        "below the ties. The tracks column records whether adjacent track widths overlap."
      : "Effective width is w_t where the two wheel lines spread independently, and (gage + w_t) = (6.00 + w_t) "+
        "once their spreads overlap and the axle acts as a single patch — the wheel lines column records which "+
        "branch of Std. Spec. 6.4 applied at that node. A row marked <b>6.4.1 concentrated</b> is one where the "+
        "axle landed on cover shallower than "+nfx(ARCH.SHALLOW_FILL,1)+" ft: it is not dispersed through the "+
        "fill at all, so the width shown is the Art. 3.24.3.2 distribution width E = 4 + 0.06S and the length "+
        "shown is the node's own tributary length, over which its share of the strip load is carried."}
     q_j = p × b × trib length is the equivalent nodal load, and includes impact when the local impact basis is
     selected; the pressure column is q_j divided by the tributary length, so the two are always consistent.
     <b>The tributary length is measured on the extrados</b>, where the pressure is delivered, not on the arch
     axis below it — on a deep ring the extrados is materially wider and measuring on the axis would understate
     the load.</div>`,
    isRail?"Tie distribution":"Std Spec 6.4",true);

  h+=UI.pnl("nd_imp",c(),"Impact",
    dtab([{k:"tag",h:"Node",txt:1},{k:"H",h:"depth used H (ft)",dp:3},{k:"imp",h:"I (%)",dp:0}],rs,opt)+
    `<div class="note">${D.local
      ? "Local basis: each node uses the fill depth over that node, and (1+I) is applied to that node's pressure before superposition."
      : "Crown basis: the percentage from the crown cover plus wearing surface is applied uniformly to all live load effects; the depth column is shown for reference only."}
     ${p.loadMode==="rail"
  ? "Railroad impact, AREMA: IM = [1 − (H − 1.5)/8.5] × 0.60, measured below the base of rail — 60% at 1.5 ft "+
    "falling linearly to zero at 10 ft, clamped at both ends. The highway stepped rule does not apply and "+
    "would give zero at most of the depths below."
  : "Thresholds per Std. Spec. 3.8.2.3 — 30% at H ≤ 1 ft, 20% to 2 ft, 10% below 3 ft, zero at or beyond 3 ft."}</div>`,
    (p.loadMode==="rail")?"AREMA":"Std Spec 3.8.2.3",true);

  const CNAME={fill:"Fill",ws:"Wearing surface",sdl:"Superimposed DL",
    self:"Ring self weight",earth:"Lateral earth pressure"};
  const comps=M.COMPS.map(w=>[w,CNAME[w]||w]);
  h+=UI.pnl("nd_dl",c(),"Dead and earth load force effects, by component",
    `<h4>Thrust P, by component (k/ft, compression positive)</h4>`+
    dtab([{k:"tag",h:"Node",txt:1}].concat(
      comps.map(w=>({k:"P_"+w[0],h:"P "+w[1],dp:3})),
      [{k:"P_dl",h:"P total",dp:3}]),rs,opt)+
    `<div class="note">Thrust at each node from each dead load acting alone. All five are compressive over most
     of the barrel; the lateral earth pressure column can change sign because it squeezes the ring inward.</div>`+
    `<h4>Moment M, by component (k·ft/ft, sagging positive)</h4>`+
    dtab([{k:"tag",h:"Node",txt:1}].concat(
      comps.map(w=>({k:"M_"+w[0],h:"M "+w[1],dp:3})),
      [{k:"M_dl",h:"M total",dp:3}]),rs,opt)+
    `<div class="note">Moment at each node from each dead load acting alone. These are the columns worth
     studying: the components frequently oppose one another, so the total is smaller than any single term, and
     the lateral earth pressure typically carries a large share of the springline moment while resting entirely
     on the assumed K.</div>`+
    `<h4>Shear V, by component (k/ft, on the section normal)</h4>`+
    dtab([{k:"tag",h:"Node",txt:1}].concat(
      comps.map(w=>({k:"V_"+w[0],h:"V "+w[1],dp:3})),
      [{k:"V_dl",h:"V total",dp:3}]),rs,opt)+
    `<div class="note">Thrust in k/ft, moment in k·ft/ft, shear in k/ft, all on the one-foot strip. Each
     component is a separate solve of the same frame; superposition is exact, so the component columns sum to
     the total. The lateral earth pressure column deserves attention — it is computed from the single assumed
     coefficient K = ${nfx(p.K,2)} of §7.2.7.5B and is usually the least certain load in the calculation, so
     seeing its share of the springline moment directly is worth more than seeing only the combined result.</div>`,
    "§7.2.7.3B / 4B / 5B",true);

  h+=UI.pnl("nd_il",c(),"Influence line summary",
    dtab([{k:"tag",h:"Section",txt:1},
      {k:"ilMax",h:"max +M ordinate",dp:4},{k:"ilMaxX",h:"load at x (ft)",dp:2},
      {k:"ilMin",h:"max −M ordinate",dp:4},{k:"ilMinX",h:"load at x (ft)",dp:2}],rs,opt)+
    `<div class="note">Peak influence ordinates for moment at each section, in ft — a moment per unit force,
     and the load position producing each. This condenses the full influence coefficient matrix of §7.2.7.7B
     into the two numbers that tell you where load has to sit to hurt a given section.</div>`,
    "§7.2.7.7B",true);

  h+=UI.pnl("nd_res",c(),"Combined results and stress check",
    dtab([{k:"tag",h:"Section",txt:1},{k:"dIn",h:"d (in)",dp:2},
      {k:"PL",h:"P_LL(1+I)",dp:3},{k:"ML",h:"M_LL(1+I)",dp:3},
      {k:"P",h:"ΣP (k/ft)",dp:3},{k:"M",h:"ΣM (k·ft/ft)",dp:3},
      {k:"eIn",h:"e (in)",dp:3},{k:"eod",h:"e/d",dp:4},{k:"reg",h:"Regime",txt:1},
      {k:"fExt",h:"f extrados (psi)",dp:1},{k:"fInt",h:"f intrados (psi)",dp:1},
      {k:"f",h:"f max (psi)",dp:1},{k:"util",h:"f/f_a",dp:3},{k:"rf",h:"RF this section",dp:3}],rs,opt)+
    `<div class="note">Live load columns are the unfactored vehicle at the position shown, so ΣP and ΣM here are
     the service condition, not the condition at the converged rating multiplier. The final column is each
     section's own rating factor — the multiplier that would bring that section alone to the allowable — so the
     margin at non-governing sections is visible rather than hidden behind the single governing value.
     Stresses are given at both faces as §7.2.7.10B sets them out: within the kern both faces are in
     compression, and outside it the face opposite the thrust reads zero because the masonry there is assumed
     to carry no tension and is ignored in the pressure wedge.</div>`,
    "§7.2.7.9B / 10B",true);

  h+=UI.pnl("nd_thr",c(),"Thrust line coordinates",
    dtab([{k:"tag",h:"Section",txt:1},{k:"x",h:"section x (ft)",dp:3},{k:"y",h:"section y (ft)",dp:3},
      {k:"eIn",h:"|e| (in)",dp:3},{k:"tx",h:"thrust x (ft)",dp:3},{k:"ty",h:"thrust y (ft)",dp:3}],rs,opt)+
    `<div class="note"><b>A coordinate outside the barrel is not an error.</b> The offset is measured along the
     section normal, and at a springing that normal is close to horizontal, so a modest eccentricity moves the
     point well beyond the end of the arch. Judge a springing by the eccentricity column, not by the plotted
     position. Coordinates of the resultant at each section, offset from the arch axis along the section
     normal by −ΣM/ΣP. These are the numbers behind the thrust line overlay, so the figure can be checked
     arithmetically rather than only by eye.</div>`,"§7.2.7.10B",true);

  // reactions
  const Rd=M.reactions(M.DL);
  const Rl=M.reactions(D.LL.map((v,i)=>({C:(1+D.impU)*v.C,V:(1+D.impU)*v.V,M:(1+D.impU)*v.M})));
  const rr=[
    {__i:0,w:"Dead + earth load",LRx:Rd.L.Rx,LRy:Rd.L.Ry,LMz:Rd.L.Mz,RRx:Rd.R.Rx,RRy:Rd.R.Ry,RMz:Rd.R.Mz},
    {__i:1,w:"Live load with impact",LRx:Rl.L.Rx,LRy:Rl.L.Ry,LMz:Rl.L.Mz,RRx:Rl.R.Rx,RRy:Rl.R.Ry,RMz:Rl.R.Mz},
    {__i:2,w:"Total",LRx:Rd.L.Rx+Rl.L.Rx,LRy:Rd.L.Ry+Rl.L.Ry,LMz:Rd.L.Mz+Rl.L.Mz,
     RRx:Rd.R.Rx+Rl.R.Rx,RRy:Rd.R.Ry+Rl.R.Ry,RMz:Rd.R.Mz+Rl.R.Mz}];
  h+=UI.pnl("nd_rxn",c(),"Springing reactions",
    dtab([{k:"w",h:"Case",txt:1},
      {k:"LRx",h:"left H (k/ft)",dp:3},{k:"LRy",h:"left V (k/ft)",dp:3},{k:"LMz",h:"left M (k·ft/ft)",dp:3},
      {k:"RRx",h:"right H (k/ft)",dp:3},{k:"RRy",h:"right V (k/ft)",dp:3},{k:"RMz",h:"right M (k·ft/ft)",dp:3}],rr)+
    `<div class="note">Per foot of barrel width. Horizontal thrust is the number an abutment stability or
     bearing check needs first. ${p.support==="pinned"?"Moment is zero at both springings because the restraint is pinned."
     :"Moment is the built-in restraint moment of the fixed idealization."}
     <span class="warn">This tool does not carry these reactions into any abutment, foundation or scour check.</span></div>`,
    "—",true);

  // conservation footer
  let qSum=0; for(const r of rs)qSum+=r.q;
  const nAxOver=veh.axles.filter(ax=>{
    const xa=(dir>0)?pos+ax.x:pos+(veh.axles[veh.axles.length-1].x)-ax.x;
    return xa>=M.g.xmin&&xa<=M.g.xmax;}).length;
  h+=UI.pnl("nd_chk",c(),"Arithmetic checks",
    step({label:"Sum of nodal live loads on the strip",
      sym:"\\Sigma q_j",sub:"",res:num(qSum,4),units:"k/ft",
      note:`${nAxOver} of ${veh.axles.length} axles lie over the barrel at this position. The sum is the load `+
        `arriving on the one-foot analysis strip, not the vehicle weight — the remainder is carried by the `+
        `fill outside the strip and by the abutments directly.`})+
    (()=>{
      const gf=p.gf/1000,gws=p.gws/1000,gm=p.gm/1000;
      let Wd=0;
      for(let e=0;e<M.nEl;e++){
        const a=M.g.nodes[e],b=M.g.nodes[e+1];
        const dx=b.x-a.x,dy=b.y-a.y,Le=Math.hypot(dx,dy),cc=dx/Le;
        const f2=[a,b].map(nn=>{const hh=Math.max(M.g.bwsAt(nn.extX)-nn.extY,0);
          return (gf*hh+gws*p.tws+(M.wSdl||0))*Math.abs(cc)+gm*nn.d;});
        Wd+=Le*(f2[0]+f2[1])/2;
      }
      const sumR=Rd.L.Ry+Rd.R.Ry;
      return step({label:"Vertical equilibrium, dead load",
        sym:"R_{V,L}+R_{V,R}\\ \\text{vs}\\ \\int w\\,ds",
        sub:`${num(Rd.L.Ry,4)}+${num(Rd.R.Ry,4)}=${num(sumR,4)}\\ \\text{vs}\\ ${num(Wd,4)}`,
        res:num(100*(sumR-Wd)/Math.max(Wd,1e-9),4),units:"\\%\\ \\text{error}",
        note:"The applied vertical dead load is integrated over the elements independently of the solve, so "+
          "this is a genuine check rather than a restatement."});
    })()+
    step({label:"Horizontal equilibrium",
      sym:"R_{H,L}+R_{H,R}",sub:`${num(Rd.L.Rx+Rl.L.Rx,4)}+${num(Rd.R.Rx+Rl.R.Rx,4)}`,
      res:num(Rd.L.Rx+Rl.L.Rx+Rd.R.Rx+Rl.R.Rx,6),units:"k/ft",
      note:"Must be zero to solver precision. A non-zero value here indicates a modeling or recovery error."}),
    "Checks",true);
  return {html:h,rows:rs,reactions:{d:Rd,l:Rl}};
}

function csv(p,M,veh,pos,dir){
  const D=rows(p,M,veh,pos,dir);
  const cols=[["node","tag"],["x_ft","x"],["y_ft","y"],["arc_s_ft","s"],["tilt_deg","ang"],
    ["d_ft","d"],["A_ft2","A"],["S_ft3","S"],["I_ft4","Ix"],["kern_ft","kern"],
    ["fill_h_ft","hf"],["cover_H_ft","H"],["lateral_z_ft","z"],
    ["spread_Ls_ft","Ls"],["spread_wt_ft","wt"],["wheel_lines","merged"],["eff_width_ft","wEff"],
    ["spread_area_ft2","area"],["axles_over","nAx"],["pressure_ksf","press"],
    ["trib_ft","trib"],["q_k_per_ft","q"],["impact_pct","imp"],
    ["P_fill","P_fill"],["P_ws","P_ws"],["P_self","P_self"],["P_earth","P_earth"],["P_DL_total","P_dl"],
    ["M_fill","M_fill"],["M_ws","M_ws"],["M_self","M_self"],["M_earth","M_earth"],["M_DL_total","M_dl"],
    ["V_fill","V_fill"],["V_ws","V_ws"],["V_self","V_self"],["V_earth","V_earth"],["V_DL_total","V_dl"],
    ["IL_maxM","ilMax"],["IL_maxM_at_x","ilMaxX"],["IL_minM","ilMin"],["IL_minM_at_x","ilMinX"],
    ["P_LL_imp","PL"],["M_LL_imp","ML"],["P_total","P"],["M_total","M"],
    ["e_ft","e"],["e_over_d","eod"],["regime","reg"],["f_extrados_psi","fExt"],["f_intrados_psi","fInt"],["f_max_psi","f"],["f_over_fa","util"],
    ["RF_section","rf"],["thrust_x_ft","tx"],["thrust_y_ft","ty"]];
  const head=cols.map(c=>c[0]).join(",");
  const body=D.rows.map(r=>cols.map(c=>{
    const v=r[c[1]];
    if(typeof v==="number")return isFinite(v)?v.toFixed(6):"inf";
    return String(v);
  }).join(",")).join("\n");
  const meta=[`vehicle,${veh.id}`,`lead_axle_x_ft,${pos.toFixed(3)}`,
    `direction,${dir>0?"L_to_R":"R_to_L"}`,`impact_basis,${p.impMode}`,
    `allowable_fa_psi,${p.fa}`,`support,${p.support}`,`elements,${M.nEl}`].join("\n");
  return meta+"\n\n"+head+"\n"+body;
}

/* ---------- worked calculation for a single selected node ---------- */
function worked(p,M,veh,pos,dir,i){
  const {step,eqLine,vars,msg,num,nfx,esc}=R;
  const n=M.g.nodes[i], d=M.dn[i], tag=CALC.secTag(M,i);   // stress-check depth
  const local=(p.impMode==="local");
  const impU=local?0:ARCH.impactAt(p,M.g.coverCrown+p.tws);
  const faKsf=p.fa*KSF;
  let q=ARCH.nodalLL(M,veh,pos,dir);
  const qImp=local?ARCH.applyLocalImpact(M,q):q;
  /* One section, so the adverse-only choice is that section's. */
  const LLs=ARCH.llAtSection(M,qImp,i);
  const LL=ARCH.llEffects(M,qImp);
  LL[i]=LLs;
  const H=M.coverAt(i), hf=Math.max(M.g.bwsAt(n.extX)-n.extY,0);
  const Ls=ARCH.TIRE_L+1.75*H, wt=ARCH.TIRE_W+1.75*H;
  const merged=(wt>=ARCH.GAGE), wEff=merged?(ARCH.GAGE+wt):wt;
  const offs=veh.axles.map(a=>a.x), maxOff=offs[offs.length-1];
  const concAx=(veh.mode==="rail")?[]:veh.axles
    .map(ax=>((dir>0)?pos+ax.x:pos+maxOff-ax.x))
    .filter(xa=>ARCH.llRegime(M,xa).conc);
  const gf=p.gf/1000, gws=p.gws/1000, gm=p.gm/1000;
  let h="";

  h+=msg("inf","Scope of this worked calculation",
    `Every quantity at node <b>${esc(tag)}</b> for <b>${esc(veh.name)}</b> with the lead axle at `+
    `x = ${nfx(ARCH.leadAxleX(veh,pos,dir),2)} ft, traveling `+
    `${dir<0?"right to left":"left to right"}. <b>Live load is at m = 1</b> — the vehicle as it stands, `+
    `before the §7.2.7.12 multiplier. The Rating tab works the same section at the converged multiplier, `+
    `where the governing check closes at f/f_a = 1.000; a lower utilization here is that difference of `+
    `basis, not a disagreement. Quantities that follow from the frame solve are identified where they `+
    `appear. <b>Rounding:</b> substituted values are printed to display precision, so multiplying the `+
    `printed factors can differ from the printed result in the last digit; the arithmetic is carried at `+
    `full precision throughout.`);

  /* ---- 1. geometry and section properties ---- */
  h+=`<h4>1. Geometry and section properties</h4>`;
  const u=n.s/M.g.Ltot;
  if(Math.abs(p.dC-p.dS)>1e-9&&!(p.dOver&&p.dOver.length))
    h+=step({label:"Ring depth from the crown-to-springing taper",ref:"§7.2.7.2B",
      sym:"d=d_{sp}+(d_{cr}-d_{sp})\\left(1-\\left|2u-1\\right|\\right)",
      sub:`${num(inOf(p.dS),2)}+(${num(inOf(p.dC),2)}-${num(inOf(p.dS),2)})\\left(1-\\left|2\\times${num(u,4)}-1\\right|\\right)`,
      res:num(inOf(d),2),units:"in",
      note:`u = s/L = ${nfx(n.s,3)}/${nfx(M.g.Ltot,3)} = ${nfx(u,4)} is the normalized arc position.`});
  else
    h+=step({label:"Ring depth at this node",ref:"§7.2.7.2B",sym:"d",sub:"",res:num(inOf(d),2),units:"in",
      note:(p.dOver&&p.dOver.length)?"From the local override table, interpolated by station.":"Prismatic ring."});
  h+=step({label:"Bearing area on the one-foot strip",sym:"A=d\\cdot b",
    sub:`\\dfrac{${num(inOf(d),2)}}{12}\\times 1.00`,res:num(d,4),units:"ft²/ft",
    note:"Section properties stay on the foot basis: the thrust is k/ft and the stress must come out in ksf."});
  h+=step({label:"Section modulus",sym:"S=\\dfrac{b\\,d^2}{6}",
    sub:`\\dfrac{1.00\\times${num(d,4)}^2}{6}`,res:num(d*d/6,5),units:"ft³/ft"});
  h+=step({label:"Moment of inertia",sym:"I=\\dfrac{b\\,d^3}{12}",
    sub:`\\dfrac{1.00\\times${num(d,4)}^3}{12}`,res:num(d*d*d/12,6),units:"ft⁴/ft"});
  h+=step({label:"Kern limit",ref:"§7.2.7.10B",
    sym:"e_k=\\dfrac{r^2}{c}=\\dfrac{d}{6}",sub:`\\dfrac{${num(inOf(d),2)}}{6}`,res:num(inOf(d/6),3),units:"in"});
  /* (n_x, n_y) is the RADIAL direction — the outward unit vector from intrados
     toward extrados, in the plane of the section. It is used correctly (step 9
     offsets the thrust line along it), but the old label called it the section
     normal, which is the axis tangent and points 90° away. In a program whose
     history includes sign-convention defects, a vector labelled as its own
     perpendicular is not a nitpick. */
  h+=step({label:"Radial direction of the section, from vertical",
    sym:"\\theta=\\tan^{-1}\\left(\\dfrac{n_x}{n_y}\\right)",
    sub:`\\tan^{-1}\\left(\\dfrac{${num(n.nx,4)}}{${num(n.ny,4)}}\\right)`,
    res:num(Math.atan2(n.nx,n.ny)*180/Math.PI,2),units:"°",
    note:"(n_x, n_y) is the outward radial unit vector, intrados toward extrados, lying IN the section plane "+
      "— eccentricity and the thrust-line offset in step 9 are measured along it. It is perpendicular to the "+
      "axis tangent, which is the section plane's true normal. The section itself is cut normal to the arch "+
      "axis, so it is vertical at the crown and near-horizontal at the springings, and thrust and shear are "+
      "resolved on that inclined plane."});

  /* ---- 2. depths ---- */
  h+=`<h4>2. Depths at this node</h4>`;
  h+=step({label:"Fill height, extrados to bottom of wearing surface",ref:"§7.2.7.3B",
    sym:"h_f=y_{bws}(x_{ext})-y_{ext}",
    sub:`${num(M.g.bwsAt(n.extX),4)}-${num(n.extY,4)}`,res:num(hf,4),units:"ft",
    note:"Drives the vertical fill dead load and the lateral earth pressure depth."});
  h+=step({label:"Cover to the roadway surface",ref:"Std Spec 6.4",
    sym:"H=y_{surf}(x_{ext})-y_{ext}=h_f+t_{ws}",
    sub:`${num(hf,4)}+${num(p.tws,4)}`,res:num(H,4),units:"ft",
    note:"Includes the wearing surface, and drives the live load spread and the local impact basis."});

  /* ---- 3. live load distribution ---- */
  const railW=(veh.mode==="rail");
  h+=`<h4>3. Live load distribution through fill</h4>`;
  if(railW){
    const RS=ARCH.railSpread(p,H);
    const grp=RS.groups.reduce((x,y)=>(y.width>=x.width?y:x));
    h+=step({label:"Spread depth below the bottom of the ties",ref:"Tie distribution",
      sym:"h=H-d_{tie}",sub:`${num(H,4)}-${num(p.tieDepth,3)}`,res:num(RS.h,4),units:"ft"});
    const rr2=ARCH.railRate(p);
    const sl2=(Math.abs(rr2-0.5)<1e-9)?"1H : 2V":((Math.abs(rr2-1)<1e-9)?"1H : 1V":nfx(rr2,3)+" each side");
    h+=step({label:"Transverse width per track",ref:"Tie distribution",
      sym:"W_{tr}=L_{tie}+2rh",
      sub:`${num(p.tieLen,3)}+2\\times${num(rr2,2)}\\times${num(RS.h,4)}`,res:num(RS.wTrack,4),units:"ft",
      note:`${sl2} from each tie end.`});
    h+=step({label:"Longitudinal length",ref:"Tie distribution",
      sym:"L_s=3.0+2rh",sub:`3.0+2\\times${num(rr2,2)}\\times${num(RS.h,4)}`,res:num(RS.Ls,4),units:"ft",
      note:"3.0 ft bearing length at the bottom of the ties, then 1:1."});
    h+=step({label:"Track overlap",sym:"",sub:"",
      res:grp.merged?`${grp.n}\\ \\text{tracks merged}`:"\\text{no overlap}",
      note:grp.merged?`Outer limits give W_eff = ${nfx(grp.width,4)} ft, shared by ${grp.n} tracks.`
        :`Each track is distributed over its own ${nfx(RS.wTrack,4)} ft.`});
    let Pax=0,nA=0;
    if(i>0&&i<M.nN-1)for(const ax of veh.axles){
      const xa=(dir>0)?pos+ax.x:pos+maxOff-ax.x;
      {const f=ARCH.coverFrac(ARCH.tribSpan(M,i),xa-RS.Ls/2,xa+RS.Ls/2);
       if(f>0){Pax+=ax.P*f;nA++;}}
    }
    h+=step({label:"Axle load reaching this node",
      sym:"\\sum P_{ax}\\,\\phi_{ax}",
      sub:`${nA}\\ \\text{axles overlapping this node's }${num(M.tribH[i],3)}\\ \\text{ft tributary}`,
      res:num(Pax,2),units:"kip",
      note:(p.railCapLong?`Each axle spreads over its own capped L_s — no wider than the track that axle `+
        `owns, so neighbouring footprints never overlap. `:`Each axle spreads over L_s = ${nfx(RS.Ls,3)} ft `+
        `centred on itself. `)+`φ is the fraction of this `+
        `node's tributary that footprint covers, so a partly overlapping axle contributes its part rather `+
        `than all or nothing. The φ over all nodes sum to the footprint length, so no load is created or `+
        `lost in the discretisation.`});
    if(veh.trail>0){
      const tailX=(dir>0)?pos+maxOff:pos;
      const TT=ARCH.tribSpan(M,i);
      const behind=((dir>0)?ARCH.coverFrac(TT,tailX,Math.max(TT[1],tailX))
                           :ARCH.coverFrac(TT,Math.min(TT[0],tailX),tailX))>0;
      h+=step({label:"Uniform trailing load at this node",sym:"w_{trail}",sub:"",
        res:behind?num(veh.trail,2):"0",units:"k/ft",
        note:behind?"This node lies behind the consist, so the trailing load applies."
          :"This node is under the consist, ahead of the trailing load."});
    }
    h+=step({label:"Pressure on the extrados",ref:"Tie distribution",
      sym:"p=\\dfrac{n_{tr}\\sum P_{ax}}{W_{eff}L_s}+\\dfrac{n_{tr}w_{trail}}{W_{eff}}",
      sub:p.railCapLong
        ?`\\dfrac{${grp.n}}{${num(grp.width,4)}}\\sum\\dfrac{P_{ax}\\phi}{L_{s,k}}`
        :`\\dfrac{${grp.n}\\times${num(Pax,2)}}{${num(grp.width,4)}\\times${num(RS.Ls,4)}}`,
      res:num(M.tribH[i]>0?(q[i]||0)/M.tribH[i]:0,5),units:"ksf",
      note:"Includes the trailing load contribution where it applies."});
    h+=step({label:"Equivalent nodal load on the strip",ref:"§7.2.7.7B",
      sym:"q_j=p\\,b\\,t_j",
      sub:`${num(M.tribH[i]>0?(q[i]||0)/M.tribH[i]:0,5)}\\times1.00\\times${num(M.tribH[i],4)}`,
      res:num(q[i]||0,5),units:"k/ft",
      note:`t_j = ${nfx(M.tribH[i],4)} ft is the tributary horizontal length of this node. A q of zero here `+
        `means no axle footprint reaches THIS node at this position — the live load thrust and moment further `+
        `down are superpositions over every loaded node on the arch, so they are non-zero whenever any node `+
        `carries load, not only this one.`});
  }else{
  if(concAx.length){
    const E2=ARCH.shallowWidth(p);
    h+=msg("warn","Some axles at this position are governed by Std. Spec. 6.4.1, not 6.4.2",
      `${concAx.length} of this vehicle's axles land on cover shallower than ${nfx(ARCH.SHALLOW_FILL,1)} ft `+
      `(at x = ${concAx.map(x=>nfx(x,2)).join(", ")} ft). Those axles are <b>not</b> dispersed through the fill: `+
      `Art. 6.4.1 carries them to the ring as concentrated loads distributed only across the width, over `+
      `E = 4 + 0.06S = ${nfx(E2,3)} ft per Art. 3.24.3.2. The 1.75H geometry worked immediately below applies `+
      `only to the remaining axles, which land on 2 ft of cover or more. The nodal load q that closes this `+
      `section includes both contributions.`);
  }
  h+=step({label:"Longitudinal spread length",ref:"Std Spec 6.4",
    sym:"L_s=\\ell_t+1.75H",
    sub:`${num(ARCH.TIRE_L,4)}+1.75\\times${num(H,4)}`,res:num(Ls,4),units:"ft"});
  h+=step({label:"Transverse spread width per wheel line",ref:"Std Spec 6.4",
    sym:"w_t=b_t+1.75H",
    sub:`${num(ARCH.TIRE_W,4)}+1.75\\times${num(H,4)}`,res:num(wt,4),units:"ft"});
  h+=step({label:"Wheel line overlap check",
    sym:"w_t\\ \\text{vs}\\ s_g",sub:`${num(wt,4)}\\ \\text{vs}\\ ${num(ARCH.GAGE,2)}`,
    res:merged?"w_t\\ge s_g":"w_t<s_g",
    note:merged
      ?"The transverse spreads of the two wheel lines overlap, so the axle is distributed as a single patch of "+
       "width (s_g + w_t)."
      :"The spreads do not meet, so each wheel line is distributed over its own width w_t and carries half the axle."});
  h+=step({label:"Effective distribution width",
    sym:merged?"w_{eff}=s_g+w_t":"w_{eff}=w_t",
    sub:merged?`${num(ARCH.GAGE,2)}+${num(wt,4)}`:`${num(wt,4)}`,res:num(wEff,4),units:"ft"});
  h+=step({label:"Spread area",sym:"A_{sp}=w_{eff}\\,L_s",
    sub:`${num(wEff,4)}\\times${num(Ls,4)}`,res:num(wEff*Ls,4),units:"ft²"});

  const contrib=[];
  if(i>0&&i<M.nN-1)for(const ax of veh.axles){
    const xa=(dir>0)?pos+ax.x:pos+maxOff-ax.x;
    if(ARCH.coverFrac(ARCH.tribSpan(M,i),xa-Ls/2,xa+Ls/2)>0)contrib.push({ax,xa,
      p:merged?ax.P/(wEff*Ls):(ax.P/2)/(wEff*Ls)});
  }
  if(i===0||i===M.nN-1){
    h+=msg("inf","Support node",
      "Live load is applied only at the free nodes; load arriving at a springing passes directly into the "+
      "support and generates no influence ordinate. §7.2.7.7B unit loads are likewise applied at the free nodes.");
  }else if(!contrib.length){
    h+=step({label:"Axles within the spread footprint",
      sym:"\\left|x_{node}-x_{axle}\\right|\\le \\dfrac{L_s}{2}",
      sub:`\\text{none within }${num(Ls/2,4)}\\text{ ft}`,res:"0\\ \\text{axles}",
      note:`At this truck position no axle spread reaches node ${esc(tag)}, so q = 0 here.`});
  }else{
    contrib.forEach(cc=>{
      h+=step({label:`Pressure from the axle at x = ${nfx(cc.xa,2)} ft, P = ${nfx(cc.ax.P,2)} kip`,
        ref:"Std Spec 6.4",
        sym:merged?"p_i=\\dfrac{P_{ax}}{w_{eff}L_s}":"p_i=\\dfrac{P_{ax}/2}{w_{eff}L_s}",
        sub:merged?`\\dfrac{${num(cc.ax.P,2)}}{${num(wEff,4)}\\times${num(Ls,4)}}`
                  :`\\dfrac{${num(cc.ax.P,2)}/2}{${num(wEff,4)}\\times${num(Ls,4)}}`,
        res:num(cc.p,5),units:"ksf",
        note:`Within the footprint: |${nfx(n.x,2)} − ${nfx(cc.xa,2)}| = ${nfx(Math.abs(n.x-cc.xa),3)} ≤ L_s/2 = ${nfx(Ls/2,3)} ft.`});
    });
    const pTot=contrib.reduce((a,c)=>a+c.p,0);
    if(contrib.length>1)
      h+=step({label:"Total pressure, overlapping axle spreads summed",
        sym:"p=\\sum p_i",sub:contrib.map(c=>num(c.p,5)).join("+"),res:num(pTot,5),units:"ksf",
        note:"Summing rather than redistributing over a merged area is slightly conservative."});
    h+=step({label:"Equivalent nodal load on the strip",ref:"§7.2.7.7B",
      sym:"q_j=p\\,b\\,t_j",
      sub:`${num(pTot,5)}\\times1.00\\times${num(M.tribH[i],4)}`,
      res:num(pTot*M.tribH[i],5),units:"k/ft",
      note:`t_j = ${nfx(M.tribH[i],4)} ft is the tributary horizontal length of this node. A q of zero here `+
        `means no axle footprint reaches THIS node at this position — the live load thrust and moment further `+
        `down are superpositions over every loaded node on the arch, so they are non-zero whenever any node `+
        `carries load, not only this one.`});
  }

  }
  /* ---- 4. impact ---- */
  h+=`<h4>4. Impact</h4>`;
  const Ii=local?ARCH.impactAt(p,H):impU;
  h+=step({label:local?"Impact from the local fill depth":"Impact from the crown cover, applied uniformly",
    ref:(p.loadMode==="rail")?"AREMA":"Std Spec 3.8.2.3 / §7.2.4.6B",
    sym:"I=I(H)",
    sub:local?`I(${num(H,3)}\\ \\text{ft})`:`I(${num(M.g.coverCrown,3)}+${num(p.tws,3)})=I(${num(M.g.coverCrown+p.tws,3)}\\ \\text{ft})`,
    res:num(Ii*100,0),units:"\\%",
    note:local
      ?"Local basis: this node's own depth is used, and (1+I) multiplies its pressure before superposition."
      :"Crown basis: the minimum cover governs and the percentage is applied to all live load effects."});
  if(local&&(qImp[i]||0)>0)
    h+=step({label:"Impacted nodal load",sym:"q_j(1+I)",
      sub:`${num((qImp[i]||0)/(1+Ii),5)}\\times(1+${num(Ii,2)})`,res:num(qImp[i]||0,5),units:"k/ft"});

  /* ---- 5. dead and earth load ---- */
  h+=`<h4>5. Dead and earth load intensities at this node</h4>`;
  h+=step({label:"Fill",ref:"§7.2.7.3B",sym:"w_{fill}=\\gamma_f h_f",
    sub:`${num(gf,4)}\\times${num(hf,4)}`,res:num(gf*hf,4),units:"ksf"});
  h+=step({label:"Wearing surface",ref:"§7.2.7.4B",sym:"w_{ws}=\\gamma_{ws}t_{ws}",
    sub:`${num(gws,4)}\\times${num(p.tws,3)}`,res:num(gws*p.tws,4),units:"ksf"});
  h+=step({label:"Ring self weight, per unit arc length",sym:"w_{self}=\\gamma_m d",
    sub:`${num(gm,4)}\\times${num(d,4)}`,res:num(gm*d,4),units:"k/ft"});
  const zAx=Math.max(M.g.bwsAt(M.g.nodes[i].x)-M.g.nodes[i].y,0);
  h+=step({label:"Depth to the arch axis, for the lateral pressure",ref:"§7.2.7.5B",
    sym:"z=y_{bws}(x)-y_{axis}",
    sub:`${num(M.g.bwsAt(M.g.nodes[i].x),4)}-${num(M.g.nodes[i].y,4)}`,res:num(zAx,4),units:"ft",
    note:"The lateral pressure is taken entirely on the ARCH AXIS — depth measured to it, pressure applied "+
      "to it. That differs from the fill height h_f above, which is measured to the EXTRADOS because the "+
      "fill physically rests on that face. The two loads reference different surfaces by design: a weight "+
      "bears on a face, whereas §7.2.7.5B applies the lateral pressure to the element, and the element is "+
      "the axis. Here z = "+nfx(zAx,3)+" ft against h_f = "+nfx(hf,3)+" ft."});
  h+=step({label:"Vertical stress at that depth",ref:"§7.2.7.5B",
    sym:"\\sigma_v=\\gamma_f z+\\gamma_{ws}t_{ws}",
    sub:`${num(gf,4)}\\times${num(zAx,4)}+${num(gws,4)}\\times${num(p.tws,3)}`,
    res:num(gf*zAx+gws*p.tws,4),units:"ksf",
    note:"The wearing surface is a surcharge. Its thickness is not part of z — the soil column stops at the "+
      "bottom of the pavement and is weighed at \u03b3_f — but its weight bears on that column and so belongs "+
      "in the vertical stress, at its own unit weight."});
  h+=step({label:"Lateral earth pressure",ref:"§7.2.7.5B",sym:"p_h=K\\sigma_v",
    sub:`${num(p.K,3)}\\times${num(gf*zAx+gws*p.tws,4)}`,res:num(p.K*(gf*zAx+gws*p.tws),4),units:"ksf",
    note:"Applied to the axis vertical projection of the adjacent elements, directed inward. K = 0.25 is "+
      "prescribed by §7.2.7.5B and is the least certain load in the calculation."});
  h+=msg("wrn","Force effects below follow from the frame solve",
    "The intensities above are applied as linearly varying element loads through consistent fixed-end load "+
    "vectors and distributed by the plane frame analysis. The resulting section forces cannot be reduced to "+
    "hand arithmetic at a single node — they depend on the whole structure — so they are reported from the "+
    "solve. Each component is a separate solve and the four sum exactly to the total.");
  const CN2={fill:"Fill",ws:"Wearing surface",sdl:"Superimposed DL",
    self:"Ring self weight",earth:"Lateral earth pressure"};
  const comps=M.COMPS.map(w=>[w,CN2[w]||w]);
  h+=R.dtab([{k:"w",h:"Component",txt:1},{k:"P",h:"P (k/ft)",dp:4},{k:"V",h:"V (k/ft)",dp:4},{k:"M",h:"M (k·ft/ft)",dp:4}],
    comps.map((w,k)=>({__i:k,w:w[1],P:M.DLC[w[0]][i].C,V:M.DLC[w[0]][i].V,M:M.DLC[w[0]][i].M}))
      .concat([{__i:9,w:"Total dead + earth",P:M.DL[i].C,V:M.DL[i].V,M:M.DL[i].M}]));
  const shr=(M.DL[i].M!==0)?100*M.DLC.earth[i].M/M.DL[i].M:0;
  if(Math.abs(shr)>15)
    h+=msg("key","Earth pressure share at this section",
      `Lateral earth pressure supplies ${nfx(shr,1)}% of the dead load moment here. That share rests entirely `+
      `on the assumed K = ${nfx(p.K,2)}; a sensitivity run at a different coefficient is worth documenting.`);

  /* ---- 6. influence lines ---- */
  h+=`<h4>6. Influence line summary at this section</h4>`;
  h+=step({label:"Peak positive moment ordinate",ref:"§7.2.7.7B",
    sym:"\\eta^{M}_{max}",sub:"",res:num(M.ILsum[i].maxM,5),units:"ft  (k·ft per kip)",
    note:`Produced by a unit load at x = ${nfx(M.ILsum[i].maxAtX,2)} ft.`});
  h+=step({label:"Peak negative moment ordinate",ref:"§7.2.7.7B",
    sym:"\\eta^{M}_{min}",sub:"",res:num(M.ILsum[i].minM,5),units:"ft  (k·ft per kip)",
    note:`Produced by a unit load at x = ${nfx(M.ILsum[i].minAtX,2)} ft.`});
  h+=eqLine("Superposition used for this section",
    "P_{LL}=\\sum_j q_j\\,\\eta^{P}_{i,j},\\qquad M_{LL}=\\sum_j q_j\\,\\eta^{M}_{i,j}","§7.2.7.7B");

  /* ---- 7. combined ---- */
  h+=`<h4>7. Combined force effects and stress check</h4>`;
  const PL=(1+impU)*LL[i].C, ML=(1+impU)*LL[i].M;
  h+=step({label:"Live load thrust"+(local?"":" including impact"),
    sym:local?"P_{LL}":"P_{LL}(1+I)",
    sub:local?"":`${num(LL[i].C,5)}\\times(1+${num(impU,2)})`,res:num(PL,5),units:"k/ft"});
  h+=step({label:"Live load moment"+(local?"":" including impact"),
    sym:local?"M_{LL}":"M_{LL}(1+I)",
    sub:local?"":`${num(LL[i].M,5)}\\times(1+${num(impU,2)})`,res:num(ML,5),units:"k·ft/ft"});
  const P=M.DL[i].C+PL, Mm=M.DL[i].M+ML;
  h+=step({label:"Combined thrust",ref:"§7.2.7.9B",sym:"\\Sigma P=P_{DL}+P_{LL,i}",
    sub:`${num(M.DL[i].C,5)}+${num(PL,5)}`,res:num(P,5),units:"k/ft"});
  h+=step({label:"Combined moment",ref:"§7.2.7.9B",sym:"\\Sigma M=M_{DL}+M_{LL,i}",
    sub:`${num(M.DL[i].M,5)}+${num(ML,5)}`,res:num(Mm,5),units:"k·ft/ft"});
  const e=(P>1e-9)?Math.abs(Mm)/P:Infinity;
  h+=step({label:"Eccentricity",ref:"§7.2.7.9B",sym:"e=\\dfrac{\\left|\\Sigma M\\right|}{\\Sigma P}",
    sub:`\\dfrac{${num(Math.abs(Mm),5)}}{${num(P,5)}}`,res:num(e,5),units:"ft"});
  h+=step({label:"Kern comparison",ref:"§7.2.7.10B",
    sym:"e\\ \\text{vs}\\ e_k",sub:`${num(e,5)}\\ \\text{vs}\\ ${num(d/6,5)}`,
    res:CALC.regimeOf(e,d)==="KERN"?"e\\le e_k":(CALC.regimeOf(e,d)==="WEDGE"?"e_k<e<d/2":"e\\ge d/2")});
  const reg=CALC.regimeOf(e,d), fk=ARCH.stressMax(P,Mm,d);
  if(reg==="KERN")
    h+=step({label:"Maximum compressive stress, resultant within the kern",ref:"§7.2.7.10B",
      sym:"f=\\dfrac{\\Sigma P}{A}\\left(1+\\dfrac{6e}{d}\\right)",
      sub:`\\dfrac{${num(P,5)}}{${num(d,4)}}\\left(1+\\dfrac{6\\times${num(e,5)}}{${num(d,4)}}\\right)`,
      res:num(fk/KSF,1),units:"psi"});
  else if(reg==="WEDGE"){
    h+=step({label:"Effective bearing depth, pressure wedge",ref:"§7.2.7.10B",
      sym:"A_{eff}=3\\left(\\dfrac{d}{2}-e\\right)b",
      sub:`3\\left(\\dfrac{${num(d,4)}}{2}-${num(e,5)}\\right)\\times1.00`,
      res:num(3*(d/2-e),5),units:"ft²/ft",
      note:"The tension zone is ignored and the pressure redistributed over a reduced depth."});
    h+=step({label:"Maximum compressive stress, pressure wedge",ref:"§7.2.7.10B",
      sym:"f=\\dfrac{2\\,\\Sigma P}{A_{eff}}",
      sub:`\\dfrac{2\\times${num(P,5)}}{${num(3*(d/2-e),5)}}`,res:num(fk/KSF,1),units:"psi"});
  }else
    h+=msg("err","Resultant outside the section",
      `e = ${nfx(e,4)} ft ≥ d/2 = ${nfx(d/2,4)} ft. No equilibrium compressive block exists at this section.`);
  const pr=ARCH.stressPair(P,Mm,d);
  h+=R.dtab([{k:"w",h:"Face",txt:1},{k:"f",h:"stress (psi)",dp:1}],
    [{__i:0,w:"Extrados",f:(pr.ext===Infinity)?Infinity:pr.ext/KSF},
     {__i:1,w:"Intrados",f:(pr.int===Infinity)?Infinity:pr.int/KSF}]);
  h+=msg("inf","Both faces, per §7.2.7.10B",
    reg==="KERN"
      ?"The resultant lies within the kern, so both faces are in compression and neither is ignored."
      :(reg==="WEDGE"
