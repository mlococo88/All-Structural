        ?`The resultant lies outside the kern toward the ${pr.e>0?"extrados":"intrados"}, so §7.2.7.10B assumes no tension at the ${pr.e>0?"intrados":"extrados"} and that face reads zero; the pressure is redistributed over the reduced depth and the peak occurs at the ${pr.e>0?"extrados":"intrados"}.`
        :"The resultant lies outside the section and no compressive block exists."));
  h+=step({label:"Utilization",ref:"MBE 6B.5.2.6",sym:"\\dfrac{f}{f_a}",
    sub:`\\dfrac{${num(fk===Infinity?NaN:fk/KSF,1)}}{${num(p.fa,0)}}`,
    res:(fk===Infinity)?"\\infty":num(fk/faKsf,4)});

  /* ---- 8. section rating factor ---- */
  h+=`<h4>8. Rating factor for this section alone</h4>`;
  const rf=sectionRF(M,i,LL,impU,faKsf);
  h+=step({label:"Live load multiplier bringing this section to the allowable",ref:"§7.2.7.12",
    sym:"\\text{find }m:\\ f\\big(P_{DL}+mP_{LL}(1+I),\\ M_{DL}+mM_{LL}(1+I)\\big)=f_a",
    sub:"",res:(rf>=500)?"\\ge500":num(rf,4),
    note:"Solved by bisection at this section only. The smallest such multiplier across all sections is the "+
      "reported rating factor for the vehicle; a larger value here means this section carries margin."});

  /* ---- 9. thrust line ---- */
  h+=`<h4>9. Thrust line position at this section</h4>`;
  const es=(P>1e-9)?(Mm/P):NaN;
  h+=step({label:"Signed offset along the section normal",ref:"§7.2.7.10B",
    sym:"e_s=\\dfrac{\\Sigma M}{\\Sigma P}",
    sub:`\\dfrac{${num(Mm,5)}}{${num(P,5)}}`,res:num(es,5),units:"ft",
    note:"Positive toward the extrados. With moment sagging-positive, a positive moment lifts the resultant "+
      "toward the extrados."});
  h+=step({label:"Coordinates of the resultant",
    sym:"\\left(x_t,\\ y_t\\right)=\\left(x+n_x e_s,\\ y+n_y e_s\\right)",
    sub:`\\left(${num(n.x,3)}+${num(n.nx,4)}\\times${num(es,4)},\\ ${num(n.y,3)}+${num(n.ny,4)}\\times${num(es,4)}\\right)`,
    res:`\\left(${num(n.x+n.nx*es,4)},\\ ${num(n.y+n.ny*es,4)}\\right)`,units:"ft"});
  return h;
}

return {section,csv,rows,worked};
})();

/* ---------------- read inputs ---------------- */
function parsePairs(t){
  const out=[];
  for(const ln of (t||"").split(/\n+/)){
    const s=ln.trim(); if(!s)continue;
    const m=s.split(/[\s,;]+/).map(Number);
    if(m.length<2||!isFinite(m[0])||!isFinite(m[1]))throw new Error(`Cannot read the line "${s}". Expected two numbers separated by a comma or space.`);
    out.push({x:m[0],y:m[1]});
  }
  return out;
}
function readTracks(txt){
  const out=[];
  for(const ln of (txt||"").split(/\n+/)){
    const s=ln.trim(); if(!s)continue;
    const v=parseFloat(s);
    if(!isFinite(v))throw new Error(`Track offset "${s}" is not a number.`);
    out.push(v);
  }
  return out.length?out:[0];
}
function readSdl(txt){
  const out=[];
  for(const ln of (txt||"").split(/\n+/)){
    const s=ln.trim(); if(!s)continue;
    const k=s.lastIndexOf(",");
    if(k<0)throw new Error(`Cannot read the superimposed load line "${s}". Expected: description, weight in plf.`);
    const n=s.slice(0,k).trim(), w=parseFloat(s.slice(k+1));
    if(!isFinite(w))throw new Error(`The weight on the line "${s}" is not a number.`);
    if(w<0)throw new Error(`The weight on the line "${s}" is negative.`);
    out.push({n:n||"item",w});
  }
  return out;
}
/* One deterioration entry per line. The first field says WHERE, and it is the
   field that matters most, because everything downstream is keyed to it:

     x 5.56, 7.8, 640                  station in feet, depth in INCHES
     x 5.56, 7.8, 640, capacity        joint degraded — check only, sound analysis
     x 5.56, 7.8, 640, capacity release   ... and release the moment there
     x 5.56, 7.8, 640, release         section loss plus a release
     x 4.0-7.0, 7.8, 640    a zone between two stations
     5.56, 7.8, 640         bare decimal — read as a station
     n7, 7.8, 640           node 7 on the CURRENT mesh
     7, 7.8, 640            bare integer — read as a node number, legacy form

   A bare integer stays a node number so that sessions saved by earlier builds
   open unchanged, but it is flagged, because a node number moves when the
   element count changes and a station does not. A bare decimal is a station:
   nobody writes node 5.56.

   Fields after the first are depth, allowable stress, hinge, all optional, so
   "x 12.0, , 120" lowers the allowable stress at that station without removing
   any section. */
function readDeter(txt){
  return String(txt||"").split(/\n+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const f=s.split(/[,;]/).map(x=>x.trim());
    const head=f[0].toLowerCase().replace(/\s+/g,"").replace(/ft$/,"");
    const num=(v)=>{const q=parseFloat(v);return isFinite(q)&&q>0?q:0;};
    const rest=f.slice(1).join(" ").toLowerCase();
    /* Remaining depth is entered in INCHES — "19 inch ring, 8 inches left" is
       how the field measurement arrives — and stored in feet. dIn is kept so the
       editor and the echo can show back exactly what was typed. */
    /* TREATMENT. A depth reduction means two physically different things and
       the number alone cannot distinguish them:

         section   the stone is gone — a spall. The reduced depth enters the
                   GEOMETRY, so it changes the element stiffness and moves the
                   arch axis to the mid-depth of what remains, as well as
                   reducing capacity. Default, and the legacy behaviour.
         capacity  the stone is there but the joint is degraded — lost mortar.
                   The ring is analysed with its SOUND section and axis, and the
                   reduced depth is used only in the stress check, as the depth
                   still bearing at that joint.

       Independently of either, `release` frees the moment at that node. Mortar
       loss deep enough that the joint cannot be relied on for moment is
       capacity + release; a raked surface joint is capacity alone. */
    const cap=/\bcap(acity)?\b/.test(rest);
    const prt=/\bpartial\b|\bprt\b/.test(rest);
    const rel=/\bhinge\b|\bhng\b|\brelease\b|\brls\b/.test(rest)&&!prt;
    const tail={d:ftOf(num(f[1])),dIn:num(f[1]),fa:num(f[2]),
                mode:cap?"capacity":"section",hinge:rel,partial:prt,raw:s};
    let m;
    if((m=head.match(/^(?:x=?)?([-+]?[\d.]+)(?:-|\.\.|to)([-+]?[\d.]+)$/)))
      return Object.assign({node:0,x:parseFloat(m[1]),x2:parseFloat(m[2])},tail);
    if((m=head.match(/^(?:x=?|s=?)([-+]?[\d.]+)$/)))
      return Object.assign({node:0,x:parseFloat(m[1]),x2:null},tail);
    if((m=head.match(/^(?:n=?|node=?|#)(\d+)$/)))
      return Object.assign({node:parseInt(m[1]),x:null,x2:null},tail);
    if(/^\d+$/.test(head))
      return Object.assign({node:parseInt(head),x:null,x2:null,legacy:true},tail);
    if(/^[-+]?[\d.]+$/.test(head))
      return Object.assign({node:0,x:parseFloat(head),x2:null},tail);
    return null;
  }).filter(e=>e&&(e.node>0||isFinite(e.x)));
}
function readOverrides(txt){
  /* Station in FEET, depth in INCHES — the pair is "where along the span" and
     "how deep is the ring there", and those are naturally different units on a
     masonry arch. Depth is converted to feet here so nothing downstream needs
     to know. */
  const v=parsePairs(txt).map(o=>({x:o.x,d:ftOf(o.y),dIn:o.y}));
  /* A single entry used to be rejected here with a warning about depth
     discontinuities. That predates the feathered edges in overridesToU: a lone
     point now blends back to the sound taper at 45 degrees on both sides, the
     same convention deterioration uses, so "18.0, 19" is a well-defined local
     thickening or thinning rather than a kink. The guard would have contradicted
     the behaviour documented twenty lines below it. */
  for(const o of v){
    if(!(o.d>0))throw new Error(`Ring depth override at x = ${o.x} ft must be greater than zero.`);
  }
  return v;
}
function readP(){
  const g=id=>$(id)?$(id).value:F[id];
  const n=id=>+g(id);
  const geoMode=g("geoMode");
  let S,Rr,measPts=null;
  if(geoMode==="measured"){
    measPts=parsePairs(g("measPts"));
    if(measPts.length<3)throw new Error("At least three measured intrados points are required to fit a curve.");
    measPts.sort((a,b)=>a.x-b.x);
    S=measPts[measPts.length-1].x-measPts[0].x;
    Rr=Math.max(...measPts.map(q=>q.y))-Math.min(measPts[0].y,measPts[measPts.length-1].y);
    if(S<=0)throw new Error("Measured points must span a positive width.");
  }else{S=n("span");Rr=n("rise");}
  let nEl=Math.floor(n("nelem"));
  const auto=Math.max(10,Math.ceil(S/4));
  if(!nEl||nEl<auto)nEl=auto;
  nEl=Math.min(nEl,120);

  /* Cover cannot be negative. A negative value puts the road surface BELOW the
     extrados, which is not a structure. It used to be accepted silently: every
     fill height clamps to zero, so the fill dead load and the earth pressure
     both vanish, the cover used for distribution and impact falls to its floor,
     and the program returns a complete set of confident numbers for an arch
     carrying nothing. The min="0" on the input box is not a guard — HTML range
     attributes are only enforced on form submission, and this program has no
     form. Check it here, where the value is actually read. */
  const covGrade=g("gradeMode");
  const badCov=[];
  if(covGrade==="ends"){
    if(n("covL")<0)badCov.push(["Cover at the left springing",n("covL")]);
    if(n("covR")<0)badCov.push(["Cover at the right springing",n("covR")]);
  }else if(n("cover")<0)badCov.push(["Fill cover at the crown",n("cover")]);
  if(n("tws")<0)badCov.push(["Wearing surface thickness",n("tws"),"in"]);
  /* Physically meaningless material inputs. Both previously slid through: E = 0
     zeroed the stiffness and the rating came back at the 512 search cap — a
     bridge with no modulus reported as "RF ≥ 500" — and f_a = 0 rated everything
     at zero with no hint that the allowable, not the arch, was the cause. */
  if(!(n("emod")>0))throw new Error(
    `The masonry modulus E is ${nfx(n("emod"),1)} ksi. A zero or negative modulus gives the frame no `+
    `stiffness, and the rating that comes back is an artifact of the search bounds rather than a property `+
    `of the arch. MBE 6B.5.2.6 commentary and the AASHTO masonry literature put stone masonry in the `+
    `hundreds-to-thousands of ksi; enter a positive value.`);
  if(!(n("fallow")>0))throw new Error(
    `The allowable compressive stress f_a is ${nfx(n("fallow"),0)} psi. With no allowable every section `+
    `fails at zero load and every vehicle rates at exactly zero — a statement about the input, not the `+
    `bridge. Determine the Inventory allowable per MBE Art. 6B.5.2.6 and enter it.`);
  if(!(n("dCrown")>0)||!(n("dSpring")>0))throw new Error(
    `Ring depth must be positive at both the crown (${nfx(n("dCrown"),2)} in entered) and the springings `+
    `(${nfx(n("dSpring"),2)} in entered). Depths are entered in INCHES as of v2026.08.10k — a 19 in ring is `+
    `entered as 19, not 1.583.`);
  if(badCov.length)throw new Error(
    badCov.map(b=>`${b[0]} is ${nfx(b[1],3)} ${b[2]||"ft"}.`).join(" ")+
    " A negative cover or thickness puts the road surface below the extrados, which is not a structure the "+
    "program can rate. Every fill height would clamp to zero, so the fill dead load and the lateral earth "+
    "pressure would both disappear and the arch would be rated as though it carried nothing but its own "+
    "weight. Enter the depth from the extrados up to the bottom of the wearing surface as a positive number; "+
    "if the extrados genuinely rises above the road, the geometry or the rise is what needs correcting.");

  return {geoMode,shape:g("shape"),S,R:Rr,measPts,fitSel:g("fitSel"),support:g("support"),
    dC:ftOf(n("dCrown")),dS:ftOf(n("dSpring")),dOver:readOverrides(g("dOver")),nEl,
    deter:readDeter(g("deter")),deterFace:g("deterFace")||"intrados",
    gradeMode:g("gradeMode"),gradePct:n("gradePct"),covL:n("covL"),covR:n("covR"),
    cover:n("cover"),tws:ftOf(n("tws")),gm:n("gm"),gf:n("gf"),gws:n("gws"),
    K:n("kcoef"),E:n("emod"),shearDef:g("shearDef")==="1",
    llAdverse:g("llAdverse")==="1",
    impMode:g("impMode"),shallowRule:"6.4.1",shallowE:g("shallowE")||"tire",shallowRate:+(g("shallowRate")||0),fa:n("fallow"),fv:n("fv"),
    barrelW:n("barrelW"),sdl:readSdl(g("sdlItems")),
    loadMode:g("loadMode"),tieLen:n("tieLen"),tieDepth:n("tieDepth"),
    railSpread:n("railSpread"),railCapLong:g("railCapLong")==="1",
    tracks:readTracks(g("tracks")),tracksGiven:String(g("tracks")||"").trim().length>0,
    assume:g("assume"),
    vehicles:[...document.querySelectorAll(".vchk")].filter(c=>c.checked).map(c=>c.value)};
}

function schematic(svg,pos,opt){

  const veh=opt.veh||ARCH.ALL_VEHICLES.find(v=>v.id==="HS20");

  const yhi=Math.max(g.surfAt(xlo),g.surfAt(xhi))+8;
  const s=Math.min((W-2*fr)/(xhi-xlo),(H-2*fr-34)/(yhi-ylo));

  el("polygon",{points:`${X(xlo)},${Y(g.surfAt(xlo))} ${X(xR)},${Y(g.surfAt(xR))} ${X(xR)},${Y(g.bwsAt(xR))} ${X(xlo)},${Y(g.bwsAt(xlo))}`,

  const tdim=el("text",{x:(X(g.xmin)+X(g.xmax))/2,y:dimY-6,"text-anchor":"middle","font-size":12,

  tdim.textContent=`arch axis span ${nfx(g.axisSpan,2)} ft  (clear span ${nfx(g.span,2)} ft)`;
  const xcr=g.xCrown, yTopI=Math.max(...g.intrados.map(q=>q.y));
  const rx=X(xcr)-46;
  el("line",{x1:rx,y1:Y(gy),x2:rx,y2:Y(yTopI),stroke:"#1f4e79","stroke-width":1},svg);
  el("line",{x1:rx-5,y1:Y(gy),x2:rx+5,y2:Y(gy),stroke:"#1f4e79","stroke-width":1},svg);

  /* A bare vertical line beside the crown with its label set 22 px further right

  const cx=X(xcr)+30, cy1=Y(exTop), cy2=Y(g.bwsAt(xcr));

  el("line",{x1:cx-5,y1:cy1,x2:cx+5,y2:cy1,stroke:"#1f4e79","stroke-width":1},svg);
  el("line",{x1:cx-5,y1:cy2,x2:cx+5,y2:cy2,stroke:"#1f4e79","stroke-width":1},svg);

  // live load + truck
  if(pos!=null){

  }
  // nodes
  for(let i=0;i<M.nN;i++){
    const nd=g.nodes[i], nm=CALC.secTag(M,i), named=!nm.startsWith("N");
    el("circle",{cx:X(nd.x),cy:Y(nd.y),r:named?4.5:2.6,fill:"#fff",stroke:"#1f4e79","stroke-width":1.6},svg);

      const t=el("text",{x:X(nd.x)+(isCrown?-36:0),y:Y(nd.y)+dy,"text-anchor":"middle","font-size":11,
        fill:"#4a4a4a","font-family":"Times New Roman,serif"},svg);
      t.textContent=nm;
    }
  }
  return svg;

/* Plotly is used for the graphs when it is available, with the native SVG
   renderer below as the fallback. Plots are given an EXPLICIT pixel width
   measured from the container at draw time: a plot created while its width is
   still zero — which happens when a tab has just been switched and layout has
   not settled — renders as an empty box and never recovers. Measuring first,
   and redrawing on resize, avoids that failure entirely. */
function plotWidth(div){
  let w=div.clientWidth||0;
  if(!w&&div.parentElement)w=div.parentElement.clientWidth||0;
  if(!w){const p=div.closest(".bd")||div.closest(".pnl");if(p)w=p.clientWidth||0;}
  return Math.max(320,Math.min(w||760,1100));
}
const PLOT_FONT={family:"Times New Roman, serif",size:13,color:"#1a1a1a"};
/* A secondary y axis whose zero sits at a different height from the primary is
   the easiest chart in this program to misread — a curve resting on its own
   zero looks like it is sitting at whatever the other axis reads there. The two
   ranges are therefore stretched so both zeros land on the same gridline, and
   each axis is colored to match the traces that belong to it. */
function alignedZeroRanges(a1,a2){
  const rng=arr=>{let lo=Infinity,hi=-Infinity;
    arr.forEach(s=>s.forEach(v=>{if(isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v);}}));
    if(!isFinite(lo)){lo=0;hi=1;}
    lo=Math.min(lo,0);hi=Math.max(hi,0);
    if(lo===hi){lo-=1;hi+=1;}
    const pad=(hi-lo)*0.08;return [lo-pad,hi+pad];};
  let [l1,h1]=rng(a1), [l2,h2]=rng(a2);
  const f1=(0-l1)/(h1-l1), f2=(0-l2)/(h2-l2);
  const f=Math.max(f1,f2);
  if(f>0&&f<1){
    if(f1<f)l1=-(f/(1-f))*h1;
    if(f2<f)l2=-(f/(1-f))*h2;
    const g1=(0-l1)/(h1-l1), g2=(0-l2)/(h2-l2);
    if(g1>g2&&g2>0)h2=-l2*(1-g1)/g1;
    if(g2>g1&&g1>0)h1=-l1*(1-g2)/g2;
  }
  return {r1:[l1,h1],r2:[l2,h2]};
}
/* dashed markers at the two springings, so it is obvious that the axis runs
   along the arch AXIS and therefore extends outside the clear span */
function springingMarks(M){
  const xL=M.g.nodes[0].x, xR=M.g.nodes[M.nN-1].x;
  return {
    shapes:[xL,xR].map(x=>({type:"line",x0:x,x1:x,yref:"paper",y0:0,y1:1,
      line:{color:"#8a857b",width:1,dash:"dot"}})),
    annotations:[{x:xL,yref:"paper",y:1.02,text:"SL-L",showarrow:false,
      font:{size:11,color:"#8a857b"},xanchor:"center"},
      {x:xR,yref:"paper",y:1.02,text:"SL-R",showarrow:false,
      font:{size:11,color:"#8a857b"},xanchor:"center"}]
  };
}
/* Chart rendering.
   Plotly is used when it is available and working, because the interactivity is
   worth having. It is not trusted blindly: newPlot returns a Promise, so a
   failure rejects asynchronously and a synchronous try/catch never sees it, and
   a plot can also come back with axes but no data. The result is therefore
   verified, and the built-in renderer takes over if Plotly did not actually draw
   traces. The engine can also be forced either way from the Chart engine
   control, which is what to reach for if a chart misbehaves. */
let chartEngine="auto";          // auto | plotly | svg
let lastEngineUsed="";
function plotlyUsable(){
  if(chartEngine==="svg")return false;
  if(!window.Plotly)return false;
  return true;
}
function drawPlot(div,traces,layout,svgFallback){
  if(!div)return;
  const useSvg=()=>{ if(svgFallback){div.innerHTML="";svgFallback(div);lastEngineUsed="static";} };
  if(!plotlyUsable()){ useSvg(); return; }
  const w=plotWidth(div);
  const lay=Object.assign({
    width:w,height:layout.height||330,
    margin:{l:64,r:64,t:26,b:48},
    font:PLOT_FONT,paper_bgcolor:"#fff",plot_bgcolor:"#fff",
    legend:{orientation:"h",y:1.16,x:0},
    hovermode:"closest"
  },layout);
  lay.width=w;
  const rendered=()=>{
    const sl=div.querySelector(".scatterlayer");
    return !!(sl&&sl.children&&sl.children.length>0);
  };
  const verify=()=>{
    if(rendered()){lastEngineUsed="interactive";markEngine(div,true);}
    else if(chartEngine!=="plotly"){useSvg();markEngine(div,false);}
  };
  let res=null;
  try{
    div.innerHTML="";
    res=window.Plotly.newPlot(div,traces,lay,
      {displaylogo:false,responsive:false,
       modeBarButtonsToRemove:["lasso2d","select2d","autoScale2d"],
       toImageButtonOptions:{format:"png",scale:2}});
  }catch(e){ useSvg(); markEngine(div,false); return; }
  if(res&&typeof res.then==="function")res.then(verify,()=>{useSvg();markEngine(div,false);});
  setTimeout(verify,400);
}
function markEngine(div,interactive){
  const fig=div.closest?div.closest("figure"):null;
  const host=fig||div.parentElement;
  if(!host)return;
  let tag=host.querySelector(".engtag");
  if(!tag){tag=document.createElement("div");tag.className="engtag noprint";host.appendChild(tag);}
  tag.innerHTML=interactive
    ? `<span style="color:#1f6b32">interactive chart — drag to zoom, hover for values</span>`
    : `<span style="color:#8a6d3b">static chart — this browser did not render the interactive version</span>`;
}

/* Native SVG charts, used when Plotly is unavailable. Drawn directly:
   a library chart created while its tab is hidden sizes itself to a zero-width
   box and renders blank, and a CDN is not reachable on every machine. SVG
   always renders, prints at full resolution, and needs no network. */
function svgChart(div,series,opts){
  opts=opts||{};
  const W=760,H=opts.height||320,m={l:74,r:opts.axis2?74:22,t:30,b:50};
  const nice=(lo,hi,n)=>{                       // round tick values
    const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const s=[1,2,2.5,5,10].find(x=>raw/mag<=x)||10;
    const st=s*mag, l0=Math.floor(lo/st)*st, out=[];
    for(let v=l0;v<=hi+st*1e-9;v+=st)if(v>=lo-st*1e-9)out.push(+v.toFixed(10));
    return out;};
  const all1=series.filter(s=>!s.axis2), all2=series.filter(s=>s.axis2);
  const rng=arr=>{let lo=Infinity,hi=-Infinity;
    arr.forEach(s=>s.y.forEach(v=>{if(isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v);}}));
    if(!isFinite(lo)){lo=0;hi=1;} if(lo===hi){lo-=1;hi+=1;}
    const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
    if(opts.zero){lo=Math.min(lo,0);hi=Math.max(hi,0);}
    return [lo,hi];};
  const logY=!!opts.logY;
  let [y1lo,y1hi]=rng(all1.length?all1:series);
  if(logY){
    let lo=Infinity,hi=-Infinity;
    (all1.length?all1:series).forEach(s=>s.y.forEach(v=>{if(isFinite(v)&&v>0){lo=Math.min(lo,v);hi=Math.max(hi,v);}}));
    if(!isFinite(lo)){lo=0.1;hi=10;}
    y1lo=Math.log10(lo*0.8); y1hi=Math.log10(hi*1.25);
  }
  const [y2lo,y2hi]=all2.length?rng(all2):[0,1];
  let xlo=Infinity,xhi=-Infinity;
  series.forEach(s=>s.x.forEach(v=>{xlo=Math.min(xlo,v);xhi=Math.max(xhi,v);}));
  if(xlo===xhi){xlo-=1;xhi+=1;}
  /* opts.equal locks the two axes to the same units-per-pixel. Without it the
     no-Plotly fallback would stretch the arch into an ellipse and a diagram
     drawn along the section normal would point in visibly wrong directions. */
  if(opts.equal){
    const pw=W-m.l-m.r, ph=H-m.t-m.b;
    const sx=(xhi-xlo)/pw, sy=(y1hi-y1lo)/ph, sc=Math.max(sx,sy);
    const cx=(xlo+xhi)/2, cy=(y1lo+y1hi)/2;
    xlo=cx-sc*pw/2; xhi=cx+sc*pw/2;
    y1lo=cy-sc*ph/2; y1hi=cy+sc*ph/2;
  }
  const X=v=>m.l+(v-xlo)/(xhi-xlo)*(W-m.l-m.r);
  const Y1=v=>{const t=logY?Math.log10(Math.max(v,1e-9)):v;
    return m.t+(y1hi-t)/(y1hi-y1lo)*(H-m.t-m.b);};
  const Y2=v=>m.t+(y2hi-v)/(y2hi-y2lo)*(H-m.t-m.b);
  const esc2=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fff">`;
  const fmtv=v=>{const av=Math.abs(v);
    if(av===0)return "0";
    if(av>=1000)return v.toExponential(1);
    if(av>=10)return v.toFixed(0);
    if(av>=1)return v.toFixed(1);
    if(av>=0.1)return v.toFixed(2);
    return v.toFixed(3);};
  const ticks1=logY
    ? (()=>{const t=[];for(let e=Math.floor(y1lo);e<=Math.ceil(y1hi);e++)
        for(const mlt of [1,2,5]){const v=mlt*Math.pow(10,e);
          if(Math.log10(v)>=y1lo&&Math.log10(v)<=y1hi)t.push(v);}return t;})()
    : nice(y1lo,y1hi,4);
  ticks1.forEach(v=>{
    const y=Y1(v);
    g+=`<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="#eee9dd"/>`;
    g+=`<text x="${m.l-7}" y="${y+4}" text-anchor="end" font-size="11" fill="#5c6a76"
         font-family="ui-monospace,Consolas,monospace">${fmtv(v)}</text>`;});
  if(all2.length)nice(y2lo,y2hi,4).forEach(v2=>{
    g+=`<text x="${W-m.r+7}" y="${Y2(v2)+4}" font-size="11" fill="#9c1c1c"
         font-family="ui-monospace,Consolas,monospace">${fmtv(v2)}</text>`;});
  nice(xlo,xhi,6).forEach(v=>{
    if(v<xlo||v>xhi)return;
    g+=`<line x1="${X(v)}" y1="${H-m.b}" x2="${X(v)}" y2="${H-m.b+4}" stroke="#5c6a76"/>`;
    g+=`<text x="${X(v)}" y="${H-m.b+17}" text-anchor="middle" font-size="11" fill="#5c6a76"
         font-family="ui-monospace,Consolas,monospace">${fmtv(v)}</text>`;});
  if(y1lo<0&&y1hi>0)g+=`<line x1="${m.l}" y1="${Y1(0)}" x2="${W-m.r}" y2="${Y1(0)}" stroke="#9a948a"/>`;
  g+=`<line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H-m.b}" stroke="#1a1a1a"/>`;
  g+=`<line x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}" stroke="#1a1a1a"/>`;
  g+=`<text x="${(m.l+W-m.r)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="#5c6a76"
       font-family="Times New Roman,serif">${esc2(opts.xlabel||"")}</text>`;
  g+=`<text transform="translate(15,${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle"
       font-size="12" fill="${all2.length?"#1f4e79":"#5c6a76"}" font-family="Times New Roman,serif"
       >${esc2((opts.ylabel||"").replace(/<[^>]*>/g,""))}</text>`;
  if(all2.length)g+=`<text transform="translate(${W-14},${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle"
       font-size="12" fill="#9c1c1c" font-family="Times New Roman,serif"
       >${esc2((opts.ylabel2||"right axis").replace(/<[^>]*>/g,""))}</text>`;
  (opts.vmarks||[]).forEach(vx=>{
    if(vx<xlo||vx>xhi)return;
    g+=`<line x1="${X(vx)}" y1="${m.t}" x2="${X(vx)}" y2="${H-m.b}" stroke="#8a857b"
         stroke-width="1" stroke-dasharray="2 3"/>`;
  });
  series.forEach(s=>{
    const YY=s.axis2?Y2:Y1;
    let d="";
    let pen=false;
    s.x.forEach((xv,i)=>{const yv=s.y[i];
      if(!isFinite(yv)||(logY&&!s.axis2&&yv<=0)){pen=false;return;}
      d+=(pen?"L":"M")+` ${X(xv)} ${YY(yv)} `;pen=true;});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}"${
      s.dash?` stroke-dasharray="${s.dash}"`:""} stroke-linejoin="round"/>`;
    if(s.marker)s.x.forEach((xv,i)=>{const yv=s.y[i]; if(!isFinite(yv))return;
      g+=`<circle cx="${X(xv)}" cy="${YY(yv)}" r="3" fill="${s.color}"/>`;});
  });
  const hIn=logY?(opts.hline>0&&Math.log10(opts.hline)>y1lo&&Math.log10(opts.hline)<y1hi)
                :(opts.hline>y1lo&&opts.hline<y1hi);
  if(opts.hline!=null&&hIn)
    g+=`<line x1="${m.l}" y1="${Y1(opts.hline)}" x2="${W-m.r}" y2="${Y1(opts.hline)}"
         stroke="#1f6b32" stroke-dasharray="6 4"/>`;
  if(opts.vline!=null&&opts.vline>=xlo&&opts.vline<=xhi)
    g+=`<line x1="${X(opts.vline)}" y1="${m.t}" x2="${X(opts.vline)}" y2="${H-m.b}"
         stroke="#9c1c1c" stroke-dasharray="4 3"/>`;
  let lx=m.l;
  series.forEach(s=>{
    g+=`<line x1="${lx}" y1="${m.t-12}" x2="${lx+16}" y2="${m.t-12}" stroke="${s.color}"
         stroke-width="2"${s.dash?` stroke-dasharray="${s.dash}"`:""}/>`;
    g+=`<text x="${lx+20}" y="${m.t-8}" font-size="11" fill="#4a4a4a"
         font-family="Times New Roman,serif">${esc2(s.name)}</text>`;
    lx+=26+String(s.name).length*5.6;
  });
  g+="</svg>";
  div.innerHTML=g;
}

/* ---------------- dashboard ---------------- */
function dashboard(p){
  let rows="";
  const govRF=results.length?Math.min(...results.map(r=>r.rf)):Infinity;
  // vehicle checks first
  for(const r of results){
    const v=ARCH.ALL_VEHICLES.find(x=>x.id===r.id);
    const ok=r.rf>=1.0;
    rows+=`<tr><td>${badge(ok?"ok":"bad",ok?"PASS":"FAIL")}</td>
      <td><a class="jump" data-go="veh_${r.id}">${esc(v.name)} rating factor</a></td>
      <td>RF = <b>${nfx(r.rf,3)}</b> &nbsp;→&nbsp; ${nfx(r.tons,1)} tons${
        v.eRef?` &nbsp;·&nbsp; <b>E${(r.rf*v.eRef).toFixed(0)}</b>`:""}; governs at ${CALC.secTag(M,r.sec)},
          lead axle x = ${nfx(ARCH.leadAxleX(ARCH.ALL_VEHICLES.find(v=>v.id===r.id),r.pos,r.dir),2)} ft${
            r.dir<0?", right to left":", left to right"}${
        v.trail>0?`; ${nfx(v.trail,1)} k/ft trailing load included in the search`:""}</td>
      <td>§7.2.7.12</td></tr>`;
  }
  for(const c of checks){
    /* add() is called with eleven distinct states across this file — ok, bad,
       wn, na, key, inf, on, dl, el, ev, ll — but only four were mapped, so the
       rest rendered a badge reading "undefined" in the Status column of a
       sealed report. Everything that is not a pass, a failure or a genuine
       not-applicable is informational: it is shown, it is not a finding, and
       it must never be silently unlabelled. The fallback catches any state
       added later without touching this map. */
    const BADGE={ok:["ok","OK"],bad:["bad","FAIL"],wn:["wn","REVIEW"],na:["na","N/A"],
                 key:["ok","NOTE"],inf:["na","INFO"],on:["ok","ON"],
                 dl:["na","INFO"],el:["na","INFO"],ev:["na","INFO"],ll:["na","INFO"]};
    const [b,lab]=BADGE[c.state]||["na","INFO"];
    rows+=`<tr><td>${badge(b,lab)}</td><td>${esc(c.name)}</td><td>${c.detail}</td>
      <td>${esc(c.ref||"—")}</td></tr>`;
  }
  let h=`<table><thead><tr><th style="width:74px">Status</th><th style="width:200px">Check</th>
    <th>Result / basis</th><th style="width:120px">Reference</th></tr></thead><tbody>${rows}</tbody></table>`;
  if(results.length){
    const worst=results.reduce((a,b)=>a.rf<b.rf?a:b);
    const v=ARCH.ALL_VEHICLES.find(x=>x.id===worst.id);
    h=msg(worst.rf>=1?"key":"err",
      worst.rf>=1?"Controlling result — all selected vehicles rate at or above 1.0"
                 :"Controlling result — at least one vehicle rates below 1.0",
      `Governing vehicle: <b>${esc(v.name)}</b>, RF = <b>${nfx(worst.rf,3)}</b> `+
      `(${nfx(worst.tons,1)} tons${v.eRef?`, <b>E${(worst.rf*v.eRef).toFixed(0)}</b>`:""}) `+
      `at section ${CALC.secTag(M,worst.sec)}. `+
      `Inventory level, Allowable Stress method, per MBE Art. 6A.9.1 and MassDOT §7.2.7.`+
      (p.loadMode==="rail"
        ? " Railroad loading: Cooper ratings are reported as an E-number, RF × 80; the tonnage figure for "+
          "Cooper derives from that same 80 kip reference and is not a physical vehicle weight."
        : ""))+h;
  }
  return h;
}

/* ---------------- build output ---------------- */
/* The axle matrix is a snapshot of one vehicle position, so it has to follow the
   Live Load slider. It is re-rendered into its own container on every slider
   move rather than waiting for a full render, and its two controls are re-bound
   afterwards because the markup they live in has just been replaced. */
/* Keep the shared bar in step when a tab's own slider moves without a full
   render — otherwise the bar reads one position while the figures show another,
   which is exactly the confusion the shared control was meant to remove. */
function syncFocusBar(){
  if($("focusPosLbl"))$("focusPosLbl").textContent="x = "+nfx(focusPos,2)+" ft";
  const sl=$("focusPosSl");
  if(sl&&M&&focusVeh){
    const vf=ARCH.ALL_VEHICLES.find(v=>v.id===focusVeh);
    if(vf){
      const lo=M.g.xmin-vf.axles[vf.axles.length-1].x-3, hi=M.g.xmax+3;
      sl.value=Math.max(0,Math.min(100,100*(focusPos-lo)/Math.max(hi-lo,1e-9)));
    }
  }
}
/* Run the extreme search for one vehicle and one mode at the selected section,
   move the vehicle there, and keep all five results so the panel and the focus
   bar can show why that position was chosen. Called by both controls. */
function runExtreme(v,mode){
  try{
    const r=ARCH.extremeAt(M,v,focusNode,mode,M.p.fa,M.p.impMode);
    if(!r)return;
    focusPos=r.pos; focusDir=r.dir; animPos=r.pos;
    const all={};
    for(const mo of ["maxM","minM","maxP","maxTot","maxE"]){
      try{all[mo]=ARCH.extremeAt(M,v,focusNode,mo,M.p.fa,M.p.impMode);}catch(e){}
    }
    axExtLast={mode,sec:focusNode,veh:v.id,r,all,MDL:M.DL[focusNode].M,PDL:M.DL[focusNode].C};
  }catch(e){}
}
function paintAxleTable(){
  const host=$("axHost");
  if(!host||!M)return;
  const sel=$("animVeh");
  const veh=sel?ARCH.ALL_VEHICLES.find(v=>v.id===sel.value):null;
  if(!veh)return;
  const pos=(animPos!=null)?animPos:(results[0]?results[0].pos:M.g.xmin);
  try{
    /* focusDir, not a hardcoded 1. This is the repaint path taken whenever a
       control on the panel changes, and it was drawing the consist left-to-right
       whatever the direction selector said — so after any search that returned a
       right-to-left position, the table described a different load case from the
       one named above it and from the one the solver used. The full render at
       the other call site passed focusDir correctly, which is why the two paths
       disagreed only after a control was touched. */
    host.innerHTML=AXLETAB.render(M.p,M,veh,pos,focusDir,focusNode,{hideZero:axHideZero,show:axShow});
    bindAxleControls();
  }catch(e){}
}
function bindAxleControls(){
  if($("rateBasisSel"))$("rateBasisSel").onchange=()=>{
    rateBasis=$("rateBasisSel").value; render(); autosave();};
  if($("axZero"))$("axZero").onchange=()=>{axHideZero=$("axZero").checked;paintAxleTable();autosave();};
  if($("axShow"))$("axShow").onchange=()=>{axShow=$("axShow").value;paintAxleTable();autosave();};
  /* ONE search, two controls. The dropdown now lives in the global focus bar
     alongside Governing, which is where a positioning control belongs; the copy
     on the Live Load panel is kept because that is where the comparison table
     is, and both call this. Duplicating the search in two handlers is how the
     two would drift. */
  if($("axExtreme"))$("axExtreme").onchange=()=>{
    const mode=$("axExtreme").value;
    if(!mode)return;
    const v=ARCH.ALL_VEHICLES.find(q=>q.id===focusVeh);
    if(!v||!M)return;
    $("axExtreme").disabled=true;
    setTimeout(()=>{runExtreme(v,mode);render();autosave();},20);
  };
  if($("axCsv"))$("axCsv").onclick=()=>{
    const t=$("axHost")?$("axHost").querySelector("table.axm"):null;
    if(!t)return;
    const lines=[...t.querySelectorAll("tr")].map(tr=>
      [...tr.children].map(td=>{
        const sub=td.querySelector(".sub2");
        let v=td.textContent.replace(/\s+/g," ").trim();
        if(sub)v=v.replace(sub.textContent.trim(),"").trim()+" | p="+sub.textContent.trim();
        return '"'+v.replace(/"/g,'""')+'"';
      }).join(","));
    navigator.clipboard&&navigator.clipboard.writeText(lines.join("\n"));
    $("axCsv").textContent="Copied";
    setTimeout(()=>{if($("axCsv"))$("axCsv").textContent="Copy CSV";},1400);
  };
}
function buildOutput(p){
  const panes={};
  /* Resolve the shared section of interest before any pane is built — every
     worked example depends on it. */
  {
    const gv0=results.length?results.reduce((x,y)=>x.rf<y.rf?x:y):null;
    if(focusNode==null||focusNode>=M.nN||focusNode<0)
      focusNode=gv0?gv0.sec:Math.round((M.nN-1)/2);
    const vset=ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id));
    if(!focusVeh||!vset.some(v=>v.id===focusVeh))
      focusVeh=gv0?gv0.id:(vset[0]?vset[0].id:null);
    const rr0=results.find(q=>q.id===focusVeh);
    if(focusPos==null&&rr0){focusPos=rr0.pos;focusDir=rr0.dir;}
    if(focusPos==null)focusPos=M.g.xmin;
    // the per-tab variables are now views onto the shared choice
    animVehId=focusVeh; animPos=focusPos;
    ndVeh=focusVeh; ndPos=focusPos; ndDir=focusDir;
  }
  const c1=UI.counter();
  let s="";
  s+=UI.pnl("o_dash",c1(),"Summary Dashboard — all code checks",dashboard(p),"");
  if(p.assume&&p.assume.trim())
    s+=UI.pnl("o_assume",c1(),"Engineering Assumptions (user entered)",
      `<div style="white-space:pre-wrap">${esc(p.assume)}</div>`,"");
  s+=UI.pnl("o_basis",c1(),"Design Basis &amp; Sign Conventions",
    msg("inf","Method",
      "Unreinforced stone masonry arch evaluated by the Allowable Stress method at the Inventory level, per "+
      "AASHTO MBE Art. 6A.9.1 and the special instructions of MassDOT Bridge Manual Part I §7.2.7. The barrel "+
      "is modeled as a two-dimensional plane frame on a one-foot-wide longitudinal strip.")+
    `<h4>Sign conventions</h4><ul>
      <li>Thrust <i>P</i> is compression-positive.</li>
      <li><b>Moment is sagging-positive</b> — a positive moment puts the intrados in tension and lifts the
          thrust line toward the extrados; a negative moment is hogging, tension at the extrados. This is the
          ordinary beam convention, verified against the closed-form two-hinged parabolic arch under a crown
          load, for which M at the crown is +7PL/128. The rating itself uses the magnitude of the moment, so
          the sign affects presentation and the thrust-line plot, not the rating factor.</li>
      <li>Axial force and shear are resolved on the section normal to the arch axis; at interior nodes the two
          adjacent element ends are averaged, so the reported value does not depend on which element is used.</li>
      <li>The x axis runs left to right along the span; y is vertical, positive up. Grade is positive rising to the right.</li>
      <li>Lateral earth pressure acts inward on both haunches.</li>
      <li>Eccentricity is positive toward the extrados, e<sub>s</sub> = ΣM/ΣP.</li>
    </ul>`+
    `<h4>Units</h4><p>Imperial throughout. Forces on the one-foot strip are k/ft; moments are k·ft/ft;
      stresses are reported in psi and computed internally in ksf (1 psi = 0.144 ksf).</p>`,"");
  panes.sum=s;

  const c2=UI.counter();
  s=UI.pnl("o_geo",c2(),"Geometry, Restraint and Model Definition",CALC.geometrySection(p,M),"§7.2.7.2B");
  if(mfLayers==null){mfLayers={};MODELFIG.LAYERS.forEach(l=>{mfLayers[l[0]]=l[2];});}
  if(mfSec==null||mfSec>=M.nN)mfSec=Math.round((M.nN-1)/2);
  s+=UI.pnl("o_fig1",c2(),"Longitudinal Section — to scale",
    `<div class="noprint">
      <div class="figbar" style="align-items:flex-start">
        <div style="flex:1">
          <div style="font-size:.92rem;color:#6a6459;margin-bottom:3px">Show</div>
          <div class="lyr">${MODELFIG.LAYERS.map(l=>
            `<label><input type="checkbox" class="mfL" value="${l[0]}"${mfLayers[l[0]]?" checked":""}> ${l[1]}</label>`
          ).join("")}</div>
        </div>
      </div>
      <div class="figbar">
        <label>Influence line / diagram section</label>
        <select id="mfSec">${M.g.nodes.map((n,k)=>
          `<option value="${k}"${k===mfSec?" selected":""}>${CALC.secTag(M,k)} — x = ${nfx(n.x,2)} ft</option>`).join("")}</select>
        <button id="mfAll">All layers</button>
        <button id="mfNone">Structure only</button>
        <button id="mfDefault">Default</button>
      </div>
    </div>
     <figure><svg id="figModel" viewBox="0 0 1180 820"></svg>
       <figcaption>Figure 1 — Longitudinal section through the barrel. Layers above control what is drawn:
       the fitted ring and fill, the model itself (nodes, element numbers, arch axis), the dead and lateral
       earth load intensities, the live load at the position selected on the Live Load tab, the kern band and
       thrust line, moment and thrust diagrams plotted normal to the axis, and the influence line for the
       selected section.</figcaption></figure>`,"§7.2.7.2B");
  panes.geo=s;

  const c3=UI.counter();
  s=UI.pnl("o_dl",c3(),"Dead Load — components and section forces",CALC.deadLoadSection(p,M),"§7.2.7.3B / 5B");
  panes.dl=s;

  const c4=UI.counter();
  const gv=results.length?results.reduce((a,b)=>a.rf<b.rf?a:b):null;
  const vset=ARCH.vehiclesFor(M.p.loadMode);
  if(animVehId==null||!vset.some(v=>v.id===animVehId))
    animVehId=gv?gv.id:(vset[1]||vset[0]).id;
  const veh0=ARCH.ALL_VEHICLES.find(v=>v.id===animVehId)||vset[0];
  const pos0=gv?gv.pos:M.g.xmin, dir0=gv?gv.dir:1;
  /* The interactive figure is the illustration of the spread rule explained
     alongside it, so the two belong in one panel rather than two. */
  s=UI.pnl("o_ll",c4(),"How the load spreads through the fill",
    msg("inf","Worked at the controlling case",
      gv?`The distribution below is worked for <b>${esc(veh0.name)}</b> — the governing vehicle — at its `+
         `governing position, lead axle x = ${nfx(gv.pos,2)} ft`+
         `${gv.dir<0?", traveling right to left":""}.`
        :"No vehicle selected; a default configuration is shown.")+
    CALC.liveLoadSection(p,M,veh0,pos0,dir0)+
    `<h4>Interactive load position</h4>`+

    `<div class="noprint">
      <div class="figbar">
        <button id="bPlay">▶ Run truck</button>
        <select id="animVeh">${ARCH.vehiclesFor(M.p.loadMode).map(v=>
          `<option value="${v.id}"${v.id===veh0.id?" selected":""}>${esc(v.name)}</option>`).join("")}</select>
        <input type="range" id="posSl" min="0" max="100" step="0.25" value="35">
        <span class="mono" id="posLbl"></span>
        <button id="bGov">Go to governing</button>
      </div>
      <div class="figbar">
        <label>Speed</label>
        <select id="animSpd"><option value="0.15">Slow</option><option value="0.4" selected>Normal</option>
          <option value="1.0">Fast</option></select>
        <label>Section cut at</label><select id="xsNode"></select>
        <button id="bXsMax">Cut at most-loaded node</button>
        <button id="bPeakClr">Reset peak</button>
      </div>
      <div id="liveRead"></div>
      <figure><svg id="figLive" viewBox="0 0 980 520"></svg>
        <figcaption>Elevation — pressure umbrellas spreading with fill depth, the thrust line, and the
        kern band. The dashed vertical marker shows where the transverse section below is cut.</figcaption></figure>
      <figure><svg id="figXsec" viewBox="0 0 980 470"></svg>
        <figcaption>Transverse section at the selected node, looking along the span, showing the two wheel
        lines at 6 ft gage and what actually reaches the ring beneath them.
        <b>The figure follows whichever branch of Std. Spec. 6.4 the analysis is in</b>, decided from the cover
        at the axle. Where the cover reaches 2 ft the wheels spread through the fill at 1.75 horizontal to 1
        vertical and a dashed cone is drawn; where it does not, Art. 6.4.1 applies, no dispersion is credited,
        and the load is drawn going straight down on its footprint — a cone there would show a spread the
        analysis is not taking. If the transverse dimension is a load-sharing width rather than a dispersion
        (Art. 3.24.3.2), the figure says so beneath the band.
        Each cone is bounded below by the <b>extrados itself</b>, not by a flat line at the depth under the
        axle: it keeps widening as it descends, so where the ring falls away toward the haunches the fill is
        deeper, the cone has spread further by the time it arrives, and the axle loads the arch further out
        than a flat-bottomed wedge would suggest.
        <b>The one-foot analysis strip is drawn under a wheel line</b>, which is where the pressure is greatest
        and the strip the rating is actually run on — not on the barrel centerline, which carries no live load
        at all until the two spreads meet. Once they merge the pressure is uniform across the combined width and
        the strip is shown on the centerline, as it then makes no difference.</figcaption></figure>
      <div id="liveTabHost"></div>
    </div>`,"Std Spec 6.4 / §7.2.7.8B");


  /* The tab now follows the calculation's own sequence, one topic per panel and
     nothing worked twice: how the load spreads (with the figure that illustrates
     it), the spread at every node, impact, the axle breakdown, the superposition
     at the section of interest, and the combination with dead load. */
  {
    const vLL=ARCH.ALL_VEHICLES.find(v=>v.id===animVehId)||ARCH.vehiclesFor(p.loadMode)[0];
    const posLL=(animPos!=null)?animPos:(results[0]?results[0].pos:M.g.xmin);
    const W=(part)=>CALC.liveWorked(p,M,vLL,posLL,focusDir,focusNode,part);

    s+=UI.pnl("ll_dist",c4(),"Distribution at every node",
      W("dist"),"Std Spec 6.4 / §7.2.7.7B");

    s+=UI.pnl("ll_imp",c4(),"Impact",
      W("impact"),(p.loadMode==="rail")?"AREMA":"Std Spec 3.8.2.3 / §7.2.4.6B");

    s+=UI.pnl("ll_axle",c4(),
      "Axle contribution matrix — every node against every axle",
      `<div class="figbar noprint">
         <label>Axle columns show</label>
         <select id="axShow">
           <option value="q"${axShow!=="p"?" selected":""}>nodal load q (k/ft)</option>
           <option value="p"${axShow==="p"?" selected":""}>pressure p (ksf)</option>
         </select>
         <label><input type="checkbox" id="axZero"${axHideZero?" checked":""}> hide nodes carrying no load</label>
         <button id="axCsv">Copy CSV</button>
         <span style="flex:1"></span>
         <label for="axExtreme">Move the vehicle to</label>
         <select id="axExtreme">
           <option value="">— select —</option>
           <option value="maxM">max live load moment at ${esc(CALC.secTag(M,focusNode))}</option>
           <option value="minM">min live load moment at ${esc(CALC.secTag(M,focusNode))}</option>
           <option value="maxP">max live load thrust at ${esc(CALC.secTag(M,focusNode))}</option>
           <option value="maxTot">max TOTAL moment |M_DL + M_LL| at ${esc(CALC.secTag(M,focusNode))}</option>
           <option value="maxE">max total eccentricity at ${esc(CALC.secTag(M,focusNode))}</option>
         </select>
       </div>`+
      ((axExtLast&&axExtLast.sec===focusNode&&axExtLast.veh===focusVeh)?(()=>{
        const A=axExtLast, lab={maxM:"max live load moment",minM:"min live load moment",
          maxP:"max live load thrust",maxTot:"max total moment |M_DL+M_LL|",
          maxE:"max total eccentricity"};
        const rows=["maxM","minM","maxP","maxTot","maxE"].filter(k=>A.all[k]).map((k,ix)=>({__i:ix,
          what:lab[k]+((k===A.mode)?"   \u25c0 selected":""),
          pos:A.all[k].pos, dir:A.all[k].dir>0?"L \u2192 R":"R \u2192 L",
          ML:A.all[k].ML, PL:A.all[k].PL, MT:A.all[k].MT, eIn:inOf(A.all[k].e)}));
        const negDL=A.MDL<0;
        return `<h5>What the search found at ${esc(CALC.secTag(M,A.sec))}</h5>`+
          dtab([{k:"what",h:"Position for",txt:1},{k:"pos",h:"x (ft)",dp:2},
                {k:"dir",h:"Travel",txt:1},{k:"ML",h:"M_LL(1+I)",dp:4},
                {k:"PL",h:"P_LL(1+I)",dp:4},{k:"MT",h:"M_DL + M_LL",dp:4},
                {k:"eIn",h:"e total (in)",dp:3}],rows)+
          msg("key","Why max eccentricity is not simply max moment",
            `The dead load moment at this section is <b>${nfx(A.MDL,4)}</b> k\u00b7ft/ft on a thrust of `+
            `${nfx(A.PDL,4)} k/ft. Eccentricity is e = |M_DL + M_LL| / (P_DL + P_LL), so the worst position `+
            `is the one that carries the thrust line furthest off the axis, not the one that delivers the `+
            `most moment — a slightly smaller moment at a noticeably lower thrust wins. `+
            (negDL
              ? `<b>Because the dead load moment here is negative, the live load that aggravates this `+
                `section is the one that makes it more negative</b>, so max eccentricity sits near the `+
                `MIN moment row above rather than the max. Its |M_LL| can be a little smaller than the `+
                `min-moment case and still produce the larger eccentricity, which is the point of `+
                `searching on e.`
              : `The dead load moment here is positive, so max eccentricity sits near the max moment row.`)+
            ` Compare the e column: the max eccentricity row is the largest, whatever its moment.`);
      })():"")+
      msg("inf","These positions are for this section, not for the bridge",
        "Each option sweeps the selected vehicle across the structure in both directions and stops where "+
        "that quantity is worst <b>at "+esc(CALC.secTag(M,focusNode))+"</b>, setting the position and the "+
        "direction of travel. That is not the governing position — <i>Governing</i> in the bar above finds "+
        "the minimum rating over every section, and the two coincide only when this section is the one that "+
        "governs. Moment and thrust are the live load effects with impact, the same quantities this table "+
        "sums to. Eccentricity is the exception and is taken on the total, |M_DL + M_LL| / (P_DL + P_LL), "+
        "because the eccentricity of a live load on its own is not something the section experiences. The "+
        "search reads every distribution option in force, so the position it finds moves if the dispersion "+
        "rate, the overlap cap or the adverse-influence filter is changed.")+
      `<div id="axHost">`+AXLETAB.render(p,M,vLL,posLL,focusDir,focusNode,{hideZero:axHideZero,show:axShow})+`</div>`,
      "§7.2.7.7B / 8B",true);

    s+=UI.pnl("ll_sup",c4(),
      "Influence line superposition at "+CALC.secTag(M,focusNode),
      msg("inf","The coefficients themselves are on their own tab",
        "The influence coefficient tables required by §7.2.7.7B, and the structural analysis that produces "+
        "them, are set out in full on the <b>Influence Lines</b> tab. The chart below is the row of that table "+
        "for the section of interest; the terms beneath it are that row multiplied by the nodal loads above.")+
      `<figure><div id="figIL" class="plot"></div>
        <figcaption>Influence lines for moment and thrust at ${esc(CALC.secTag(M,focusNode))}. Moment on the
        left axis in feet, thrust on the right, dimensionless; both share one zero gridline.</figcaption>
       </figure>`+
      W("sup"),"§7.2.7.7B");

    s+=UI.pnl("ll_comb",c4(),
      "Combined with dead load at "+CALC.secTag(M,focusNode),
      W("comb"),"§7.2.7.9B / 10B");
  }
  panes.ll=s;

  const c5=UI.counter();
  s=`<div class="btnrow noprint" style="margin-bottom:8px">
      <button id="bColGov">Collapse all but governing</button><button id="bExpAll">Expand all</button></div>`;
  s+=msg("inf","Every rating vehicle is worked in full",
    "MassDOT §7.2.7 is an Allowable Stress procedure with a single service load case, D + L(1+I); the rating "+
    "vehicles take the place of a load combination matrix. Each selected vehicle below is worked completely at "+
    "its own governing position and direction — none is omitted or summarized.");

  /* Rating at the section currently selected in the focus bar. Each vehicle is
     swept exactly as it is for the governing rating, but the stress check is
     restricted to this one node, so the number is that section's own rating
     factor: the multiplier that would bring THAT section to the allowable. It
     answers the question the per-vehicle panels below cannot — how much margin
     does the section I am looking at actually carry, and against which vehicle
     — without having to read the governing section's number and hope it is the
     same place. */
  if(M.nN>focusNode&&results.length){
    const gv0=results.reduce((x,y)=>x.rf<y.rf?x:y);
    const SR=secResults(p,M,focusNode);
    const secRows=results.map(r=>{
      const v=ARCH.ALL_VEHICLES.find(x=>x.id===r.id);
      const a=SR[r.id];
      return {tag:esc(v.name),rf:a.rf,tons:a.rf*v.tons,
        pos:ARCH.leadAxleX(v,a.pos,a.dir),dir:(a.dir<0?"right → left":"left → right"),
        mode:(a.mode==="shear"?"shear":"stress"),
        gov:(r.sec===focusNode)?"yes":CALC.secTag(M,r.sec),
        govRf:r.rf};
    });
    const worst=secRows.reduce((a,b)=>a.rf<b.rf?a:b);
    const isGov=(gv0&&gv0.sec===focusNode);
    s+=UI.pnl("rate_sec",c5(),"Rating at "+esc(CALC.secTag(M,focusNode))+" — the selected section",
      msg(isGov?"warn":"inf",
        isGov?"This is the governing section for the structure"
             :"This is not the governing section",
        isGov
          ? `Every vehicle's structure-wide rating is set here, so the numbers below are the reported ratings.`
          : `The structure is governed at <b>${esc(CALC.secTag(M,gv0?gv0.sec:0))}</b>. The numbers below are `+
            `local to ${esc(CALC.secTag(M,focusNode))} and are <b>not</b> the reported ratings — they are `+
            `larger, because this section is not the one that runs out of capacity first. They are here to `+
            `show how much margin this section carries and which vehicle presses it hardest.`)+
      dtab([{k:"tag",h:"Vehicle",txt:1},
        {k:"rf",h:"RF at this section",dp:3},{k:"tons",h:"tons",dp:1},
        {k:"pos",h:"lead axle x (ft)",dp:2},{k:"dir",h:"direction",txt:1},
        {k:"mode",h:"check",txt:1},
        {k:"govRf",h:"RF governing",dp:3},{k:"gov",h:"governs at",txt:1}],secRows,{})+
      `<div class="note">Each vehicle is swept over the same positions as for the governing rating, with the
       stress check restricted to this node, so <b>RF at this section</b> is the multiplier that would bring
       this section alone to the allowable and the position shown is the one that does it — not necessarily
       the vehicle's governing position. <b>RF governing</b> and <b>governs at</b> repeat the structure-wide
       result for comparison; where the two rating factors are equal, this section is the one setting that
       vehicle's rating. The hardest-pressed vehicle here is
       <b>${esc(worst.tag)}</b> at RF ${nfx(worst.rf,3)}.</div>`,
      "§7.2.7.9B / 10B");
  }
  const govId=results.length?results.reduce((a,b)=>a.rf<b.rf?a:b).id:null;
  {
    const atSec=(rateBasis==="sec");
    const SR=atSec?secResults(p,M,focusNode):null;
    s+=`<div class="figbar noprint" style="margin:10px 0 4px">
        <label for="rateBasisSel">Work each vehicle at</label>
        <select id="rateBasisSel">
          <option value="sec"${atSec?" selected":""}>the selected section — ${esc(CALC.secTag(M,focusNode))}</option>
          <option value="gov"${atSec?"":" selected"}>its own governing section</option>
        </select>
        <span class="h">the section selector is in the bar at the top of the page</span>
      </div>`;
    for(const r of results){
      const v=ARCH.ALL_VEHICLES.find(x=>x.id===r.id);
      const rr=(atSec&&SR[r.id])?SR[r.id]:r;
      const off=(atSec&&rr.sec!==r.sec);
      s+=UI.pnl("veh_"+r.id,c5(),
        esc(v.name)+(r.id===govId?" &mdash; GOVERNS":""),
        CALC.vehicleSection(p,M,v,rr,{atSec:off,gov:r}),
        off
          ? `RF at ${esc(CALC.secTag(M,rr.sec))} = ${nfx(rr.rf,3)} &nbsp;
             <span class="h">(rating ${nfx(r.rf,3)} at ${esc(CALC.secTag(M,r.sec))})</span>`
          : `RF = ${nfx(r.rf,3)} &nbsp; ${badge(r.rf>=1?"ok":"bad",r.rf>=1?"PASS":"FAIL")}`);
    }
  }
  panes.rate=s;
  /* Built only when its tab is open. Every section of every vehicle is a full
     position sweep, so on a refined mesh with ten highway vehicles this is a
     couple of seconds — not something to spend on every keystroke for a pane
     nobody is looking at. Once the report is being assembled it is built
     regardless, because a printed package cannot be built lazily. */
  panes.rsum=(activeTab==="rsum"||window.__buildingReport)
    ? ratingSummary(p)
    : msg("inf","Rating Summary",
        "Open this tab to build it. Rating every section against every vehicle is one full position sweep "+
        "per vehicle, so it is computed on demand rather than on every input change.");
  if(ilCase==null||ilCase<1||ilCase>M.nN-2)ilCase=Math.round((M.nN-1)/2);
  if(focusNode!=null&&focusNode<M.nN)ilSecSel=focusNode;
  if(ilSecSel==null||ilSecSel>=M.nN)ilSecSel=Math.round((M.nN-1)/2);
  if(ilEl>=M.nEl)ilEl=0;
  const gvL=results.length?results.reduce((x,y)=>x.rf<y.rf?x:y):null;
  const vsel=ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id));
  panes.veh=VEHTAB.pane(p,M,vsel,results);
  panes.lat=LATERAL.pane(p,M,gvL?ARCH.ALL_VEHICLES.find(v=>v.id===gvL.id):null,gvL);
  panes.veh=VEHTAB.pane(p,M,ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id)),results);
  // ---- force diagrams tab ----
  const dlist=ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id));
  if(dgState==null)dgState={show:{dl:true,ev:true,el:true,dlt:true,ll:true,tot:true,env:true},
    vehId:null,node:null,slider:35,dir:1,atRF:false,xaxis:"x",mode:"flat"};
  if(dlist.length){
    dgState.vehId=(focusVeh&&dlist.some(v=>v.id===focusVeh))?focusVeh:(gvL?gvL.id:dlist[0].id);
    dgState.node=(focusNode!=null&&focusNode<M.nN)?focusNode
      :(gvL?gvL.sec:Math.round((M.nN-1)/2));
    const dv=ARCH.ALL_VEHICLES.find(v=>v.id===dgState.vehId)||dlist[0];
    const Lv=dv.axles[dv.axles.length-1].x;
    const rg={lo:M.g.xmin-Lv-3,hi:M.g.xmax+3};
    dgState.pos=(focusPos!=null)?focusPos:(rg.lo+(rg.hi-rg.lo)*dgState.slider/100);
    dgState.dir=focusDir;
    dgState.pos=Math.max(rg.lo,Math.min(rg.hi,dgState.pos));
    dgState.slider=100*(dgState.pos-rg.lo)/(rg.hi-rg.lo);
    const rr=results.find(q=>q.id===dv.id);
    panes.diag=DIAG.pane(p,M,Object.assign({},dgState,
      {veh:dv,list:dlist,rf:rr?rr.rf:1,range:rg}));
    dgState.__veh=dv; dgState.__range=rg; dgState.__rf=rr?rr.rf:1;
  }else panes.diag=msg("inf","No rating vehicle selected",
    "Select at least one vehicle to draw the force diagrams.");
  panes.il=ILTAB.pane(p,M,ilEl,ilCase,ilSecSel);
  panes.nodes=nodalPane(p);
  panes.ver=verifyPane(p);
  panes.man=MANUAL.html();
  return panes;
}

/* ---------------- nodal results pane ---------------- */
function nodalPane(p){
  if(!results.length)return msg("inf","No rating vehicles selected",
    "Select at least one vehicle to populate the nodal results.");
  const gov=results.reduce((a,b)=>a.rf<b.rf?a:b);
  if(ndVeh==null||!results.find(r=>r.id===ndVeh)){ndVeh=gov.id;ndPos=gov.pos;ndDir=gov.dir;}
  const veh=ARCH.ALL_VEHICLES.find(v=>v.id===ndVeh);
  const rr=results.find(r=>r.id===ndVeh);
  if(ndPos==null){ndPos=rr.pos;ndDir=rr.dir;}
  const govSec=(ndPos===rr.pos&&ndDir===rr.dir)?rr.sec:null;
  ndNode=focusNode;
  const S=NODAL.section(p,M,veh,ndPos,ndDir,govSec);
  let h=`<div class="pnl"><div class="bd noprint">

        return `<option value="${r.id}"${r.id===ndVeh?" selected":""}>${esc(v.name)}${r.id===gov.id?" — governs":""}</option>`;}).join("")}</select>
      <label>Lead axle x (ft)</label><input type="number" id="ndPos" value="${nfx(ndPos,2)}" step="0.25" style="width:92px">
      <label>Direction</label>
      <select id="ndDir"><option value="1"${ndDir>0?" selected":""}>Left → right</option>
        <option value="-1"${ndDir<0?" selected":""}>Right → left</option></select>
      <button id="ndGov">Jump to governing</button>
      <button id="ndCsv">Copy CSV</button>
    </div></div></div>`;
  const wc=UI.counter();
  let wsel=`<div class="figbar noprint"><label>Node</label>
    <select id="ndNode">${M.g.nodes.map((nn,k)=>
      `<option value="${k}"${k===ndNode?" selected":""}>${CALC.secTag(M,k)} — x = ${nfx(nn.x,2)} ft${
        (govSec!=null&&k===govSec)?"  (governs)":""}</option>`).join("")}</select>
    <button id="ndWGov">Governing section</button></div>`;

    wsel+NODAL.worked(p,M,veh,ndPos,ndDir,ndNode),"every output derived",true);
  return h+S.html+wk;
}

function comparisonBlock(p){
  if(!impCmp)return "";
  const tol=2.0;
  const okM=impCmp.worstM<=tol, okC=impCmp.worstC<=tol;
  let h="";
  h+=`<h4>Sign and end conventions</h4>`;
  const cOK=impConv.continuity<1e-3;
  h+=msg(cOK?"inf":"wrn","Sign mapping resolved from physics, not fitted to this program",
    `<b>How the mapping was found.</b> Programs differ in whether they report the internal force diagram or the
     applied end forces, and in which direction is positive. Rather than assume, the mapping is resolved by
     continuity: at a node carrying no applied load the two adjacent element ends must give the same section
     force once projected onto the section. A joint search over the relative and global sign options finds the
     mapping that satisfies that condition. Continuity is unchanged if every sign flips at once, so it fixes the
     mapping only up to one overall sign; that last choice is settled by arch behavior — the mapping giving net
     compression is adopted. <b>None of this is fitted to the internal solver</b>, so the magnitudes reported
     below remain an independent check.<br><br>
     <b>Adopted mapping:</b> axial ${impConv.sA>0?"+1":"\u22121"}, shear ${impConv.sV>0?"+1":"\u22121"},
     J-end axial ${impConv.relN>0?"+1":"\u22121"}, J-end shear ${impConv.relV>0?"+1":"\u22121"},
     J-end moment ${impConv.relM>0?"+1":"\u22121"}, moment sense ${impSgn.mom>0?"+1":"\u22121"}.<br>
     <b>Sign mapping is resolved by continuity of thrust and shear at unloaded nodes.</b> Where two mappings
     satisfy continuity equally well the choice cannot be made on physics alone; the program keeps the
     continuity-satisfying mapping rather than the best-fitting one, so a residual difference below is a real
     difference between the models and not an artefact of the mapping.<br>
     <b>Continuity residual (median):</b> ${impConv.continuity.toExponential(2)} over ${impConv.nPairs}
     interior node pairs${impConv.alternatives>1?", with "+impConv.alternatives+" mappings tied on continuity and the compressive one adopted":""}.
     ${cOK?"A residual at this level confirms the mapping is correct."
          :"<b>This residual is large.</b> The element end forces are not continuous under any sign mapping, which usually means the pasted results are not from the exported model, the element numbering differs, or the wrong result columns were picked up. Resolve this before reading the comparison below."}`);
  h+=`<h4>Agreement, ordinate by ordinate</h4>`;
  h+=R.step({label:"Relative difference, scaled to the largest ordinate in each load case",
    sym:"\\Delta=\\dfrac{\\left|\\eta_{Midas}-\\eta_{internal}\\right|}{\\max_i\\left|\\eta_{internal,i}\\right|}\\times100",
    sub:"",res:"",units:"\\%",
    note:"Scaling to the case maximum rather than to the local ordinate matters. Load cases near a springing "+
      "consist mostly of ordinates a few hundredths in size, where half a rounding unit is already tens of "+
      "percent; dividing by those would report a meaningless number. Absolute differences are given alongside "+
      "and compared against the precision of the pasted data. Comparison is made after this program's own "+
      "section force recovery is applied to the imported end forces, so the test isolates the solve."});
  const noiseStr=impCmp.decimals?`${impCmp.decimals} decimal place${impCmp.decimals>1?"s":""}, so values are rounded to ±${impCmp.noise}`:"unknown precision";
  h+=`<div class="msg ${impCmp.withinNoise?"m-key":"m-wrn"}">
      <b>${impCmp.withinNoise
        ? "Agreement is within the precision of the pasted data"
        : "Differences exceed what rounding can explain — the two models are not identical"}</b><br>
      Worst difference, scaled to the case maximum: moment <b>${impCmp.worstM>0?nfx(impCmp.worstM,2)+"%":"—"}</b>
      ${impCmp.wmCase?"at "+esc(impCmp.wmCase):""}, thrust
      <b>${impCmp.worstC>0?nfx(impCmp.worstC,2)+"%":"—"}</b>
      ${impCmp.wcCase?"at "+esc(impCmp.wcCase):""}.<br>
      ${impCmp.nUnres?`<b>${impCmp.nUnres}</b> load case${impCmp.nUnres>1?"s are":" is"} excluded from that
      percentage because ${impCmp.nUnres>1?"their peaks are":"its peak is"} below
      ${impCmp.resolveMult}× the rounding unit of the pasted data — rounding alone would move
      ${impCmp.nUnres>1?"them":"it"} by tens of percent, so the figure would be noise. Their absolute
      differences are still shown and still checked.<br>`:""}
      Worst absolute difference: moment <b>${nfx(impCmp.absM,4)}</b> kip·ft, thrust
      <b>${nfx(impCmp.absC,4)}</b> kip. The pasted results carry ${noiseStr}.<br>
      ${impCmp.nCmp} ordinates compared across ${impCmp.rows.length} unit load cases.<br>
      <b>Best achievable with this data: ±${impCmp.noise}.</b> Printing an exact answer at
      ${impCmp.decimals||2} decimal places loses up to half a unit, so two programs in perfect agreement would
      still differ by up to that much — in moment and in thrust alike. A difference at or below that figure is
      the data speaking, not the models. Thrust ordinates are of order one while moment ordinates near a
      springing are hundredths, so the same absolute rounding loss reads as a fraction of a percent in thrust
      and tens of percent in moment; that asymmetry is presentational, not physical.
      ${impCmp.missing.length?`<br>Load cases in the model but not in the pasted data: `+
        esc(impCmp.missing.slice(0,12).join(", "))+(impCmp.missing.length>12?" …":"")+".":""}</div>`;
  if(!impCmp.withinNoise)
    h+=msg("wrn","What to check when the models differ",
      "The sign and end conventions above resolved cleanly, so the pasted data is being read correctly — the "+
      "difference is in the models themselves, not the import. In order of likelihood:"+
      `<ul>
        <li><b>The exported file is not the one that was run.</b> Re-export the MCT from the current inputs and
            re-run it; any change to span, rise, ring depth, restraint or element count since the export will
            show up here.</li>
        <li><b>The model was edited in Midas.</b> Section properties in particular — this program writes the ring
            as a solid rectangle of depth d by 1.00 ft width, and the <span class="mono">SB</span> shape is the
            one block whose field order could not be confirmed against a reference file.</li>
        <li><b>The arch axis.</b> Nodes are written on the arch axis, which is the intrados offset normally by
            d/2. On a deep ring that is noticeably outside the intrados — for this model the axis springs at
            x = ${nfx(M.g.nodes[0].x,2)} ft rather than at the clear-span springing. A model built on the
            intrados or on the extrados will not match.</li>
        <li><b>Restraint.</b> Fixed against pinned changes the ordinates substantially.</li>
      </ul>`+
      "As a scale check, this model gives a horizontal thrust of "+
      nfx(Math.abs(M.reactions(M.unitLoadCase(Math.round((M.nN-1)/2)).sec).L.Rx),3)+
      " kip under a unit load at the crown; comparing that against the same quantity in Midas isolates the "+
      "geometry from everything else.");
    h+=dtab([{k:"name",h:"Load case",txt:1},{k:"node",h:"Loaded node",txt:1},
    {k:"scaleM",h:"case max |η_M|",dp:4},{k:"dM",h:"Δ moment (%)",dp:2},{k:"aM",h:"Δ moment (abs)",dp:4},
    {k:"scaleC",h:"case max |η_P|",dp:4},{k:"dC",h:"Δ thrust (%)",dp:2},{k:"aC",h:"Δ thrust (abs)",dp:4}],
    impCmp.rows);
  if(impDead){
    h+=`<h4>Dead load, component by component</h4>`;
    h+=msg(impDead.withinNoise?"key":"wrn",
      impDead.withinNoise?"Every dead load component agrees within the data precision"
        :`Largest dead load difference is in <b>${esc(impDead.worstWhat)}</b>`,
      "The export writes each dead load component as its own load case — fill, wearing surface, superimposed "+
      "dead load, ring self weight, and lateral earth pressure — so a disagreement can be traced to the load "+
      "that causes it rather than left in one combined figure. Differences are shown against the peak value of "+
      "that component, since a component that is small everywhere cannot be judged on a percentage. "+
      (impDead.tolNote?esc(impDead.tolNote)+".":""));
    h+=dtab([{k:"name",h:"Load case",txt:1},{k:"comp",h:"Component",txt:1},
      {k:"peakM",h:"peak |M| (k·ft/ft)",dp:3},{k:"aM",h:"worst ΔM",dp:5},{k:"pM",h:"ΔM (%)",dp:2},
      {k:"peakP",h:"peak |P| (k/ft)",dp:3},{k:"aP",h:"worst ΔP",dp:5},{k:"pP",h:"ΔP (%)",dp:2}],
      impDead.rows);
  }
  h+=`<figure><div id="figCmp" class="plot" style="height:320px"></div>
      <figcaption>Figure — internal against imported influence ordinates for moment at the crown. Curves that
      overlie one another indicate the two solvers agree.</figcaption></figure>`;
  return h;
}

/* Rating tab basis. "sec" works every vehicle at the section chosen in the focus
   bar; "gov" works each at its own governing section, which is what the tab did
   before. On a freshly built model the focus bar starts on the governing
   section, so the two agree until the section selector is moved — which is
   exactly when the distinction is wanted.

   The restricted sweeps are cached: the summary table at the top of the tab and
   each vehicle's worked calculation need the same result, and a sweep per
   vehicle is not free. */
let rateBasis="sec", secResCache=null, secResKey=null;
function secResults(p,M,node){
  const key=node+"|"+p.fa+"|"+p.impMode+"|"+(p.fv||0)+"|"+results.map(r=>r.id).join(",")+"|"+M.nN;
  if(secResCache&&secResKey===key)return secResCache;
  const out={};
  for(const r of results){
    const v=ARCH.ALL_VEHICLES.find(x=>x.id===r.id);
    if(v)out[r.id]=ARCH.rateVehicle(M,v,p.fa,p.impMode,node);
  }
  secResCache=out; secResKey=key;
  return out;
}
/* ---------------- Rating Summary ----------------
   One table: every section down the side, every vehicle across the top, and the
   rating of that section for that vehicle — each at its OWN critical position,
   not at the position that governs the bridge. Those are different questions and
   the distinction is the point of the tab. A section can look comfortable at the
   governing vehicle's governing position and still be the second thing to fail. */
function rsCompute(p){
  const key=MESHCONV.fingerprint(p,M)+"|"+(p.vehicles||[]).slice().sort().join(",");
  if(rsCache&&rsKey===key)return rsCache;
  const vset=ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id));
  const t0=Date.now();
  const cols=vset.map(v=>({v,S:ARCH.rateAllSections(M,v,p.fa,p.impMode)}));
  rsCache={cols,ms:Date.now()-t0,when:new Date().toISOString().slice(0,10)};
  rsKey=key;
  return rsCache;
}
function ratingSummary(p){
  const c=UI.counter();
  let s="";
  const vset=ARCH.vehiclesFor(p.loadMode).filter(v=>p.vehicles.includes(v.id));
  if(!vset.length)
    return UI.pnl("rs_none",c(),"Rating Summary",
      msg("wn","No rating vehicles selected",
        "Select at least one vehicle in the Rating Vehicles panel."),"§7.2.7.12");

  const R=rsCompute(p);
  const tonsMode=(rsBasis==="tons");
  const cooper=vset.some(v=>v.eref>0);

  s+=UI.pnl("rs_tab",c(),"Rating at every section, every vehicle",
    `<div class="btnrow noprint">
      <button id="rsRF" class="${tonsMode?"":"pri"}">Rating factor</button>
      <button id="rsTN" class="${tonsMode?"pri":""}">Rating ${cooper?"tonnage / E":"tonnage"}</button>
     </div>`+
    rsTable(p,R,tonsMode)+
    msg("key","How to read this table",
      "Each cell is the live load effect multiplier that brings <b>that section</b> to its allowable stress, "+
      "with the vehicle at <b>that section's own critical position</b> — found by sweeping the vehicle across "+
      "the structure in both directions and taking the minimum at that section alone. It is not the rating "+
      "evaluated at the position that governs the bridge, which would understate every other section. "+
      "<b>The governing cell in each vehicle's column is boxed and marked</b>, and its value is the rating "+
      "factor reported for that vehicle. Every other cell in the column is the margin that section carries "+
      "beyond the governing one.")+
    `<div class="note">Sections are listed springing to springing. Rows shade from the governing section
      outward, so where the margin is thin across several sections — which is where a small change of
      assumption moves which one governs — it is visible at a glance rather than by reading numbers.
      ${R.ms>400?`Computed in ${nfx(R.ms/1000,1)} s; this table is one full position sweep per vehicle and is
      cached until the model changes.`:""}</div>`,"§7.2.7.12");

  s+=UI.pnl("rs_margin",c(),"Where the margin is thinnest",rsMargin(p,R),"§7.2.7.9B");
  return s;
}
function rsTable(p,R,tonsMode){
  const cols=R.cols;
  const govOf={};
  cols.forEach(c=>{govOf[c.v.id]=c.S.gov;});
  const rows=[];
  for(let i=0;i<M.nN;i++){
    const row={__i:i,tag:CALC.secTag(M,i),x:M.g.nodes[i].x,d:M.dn[i],dIn:inOf(M.dn[i])};
    cols.forEach(c=>{
      const r=c.S.per[i];
      const val=tonsMode?(r.rf*c.v.tons):r.rf;
      row["v_"+c.v.id]=(r.rf>=500)?Infinity:val;
      row["g_"+c.v.id]=(govOf[c.v.id]===i);
    });
    rows.push(row);
  }
  const defs=[{k:"tag",h:"Section",txt:1},{k:"x",h:"x (ft)",dp:2},{k:"dIn",h:"d (in)",dp:2}];
  cols.forEach(c=>defs.push({k:"v_"+c.v.id,
    h:esc(c.v.name)+(tonsMode?(c.v.eref>0?" (tons)":" (tons)"):""),
    dp:tonsMode?1:3, mark:"g_"+c.v.id}));
  let h=`<div class="tw"><table class="dt rs"><thead><tr>${
    defs.map(d=>`<th>${d.h}</th>`).join("")}</tr></thead><tbody>`;
  for(const r of rows){
    const isGov=cols.some(c=>r["g_"+c.v.id]);
    h+=`<tr class="${isGov?"rsGovRow":""}">`;
    defs.forEach(d=>{
      const v=r[d.k];
      const gov=d.mark?r[d.mark]:false;
      const txt=(d.txt)?v:((v===Infinity)?"≥500":nfx(v,d.dp));
      h+=`<td class="${gov?"rsGov":""}${d.txt?"":" num"}">${txt}${
        gov?`<span class="rsFlag" title="governs this vehicle">governs</span>`:""}</td>`;
    });
    h+=`</tr>`;
  }
  h+=`</tbody><tfoot><tr><td colspan="3"><b>Reported rating</b></td>`;
  cols.forEach(c=>{
    const g=c.S.per[c.S.gov];
    const val=tonsMode?(g.rf*c.v.tons):g.rf;
    h+=`<td class="num"><b>${(g.rf>=500)?"≥500":nfx(val,tonsMode?1:3)}</b>`+
       (tonsMode&&c.v.eref>0?`<div class="h">E${Math.round(g.rf*c.v.eref)}</div>`:"")+
       `<div class="h">at ${CALC.secTag(M,c.S.gov)}</div></td>`;
  });
  h+=`</tr></tfoot></table></div>`;
  if(tonsMode)h+=`<div class="note">Tonnage is the rating factor times the vehicle's rating weight.
    For a highway truck that is the truck's own weight; for a railroad consist the axle train may represent
    several identical units, and for the Cooper series the reference is 80 kip rather than a physical weight,
    so the E-number below each Cooper total is the meaningful figure.</div>`;
  return h;
}
function rsMargin(p,R){
  /* The second-lowest section matters more than most reports admit: if it sits
     within a few percent of the governing one, then which section governs is
     decided by assumptions rather than by the structure, and a modest change in
     K, in the fill unit weight or in the mesh will swap them. */
  /* The next-lowest section is only informative if it is a DIFFERENT part of
     the arch. On a symmetric barrel the mirror of the governing section rates
     within a fraction of a percent of it, every time, for every vehicle — that
     is the geometry being symmetric, not the rating being fragile. Reporting it
     would mark every row "close" and teach the reader to ignore the column. The
     mirror is therefore skipped, and its near-equality is reported separately as
     the symmetry check it actually is. */
  const mirrorOf=(i)=>M.nN-1-i;
  const out=[];
  let symWorst=0;
  for(const c of R.cols){
    const ranked=c.S.per.map((r,i)=>({i,rf:r.rf})).sort((a,b)=>a.rf-b.rf);
    const g=ranked[0];
    const mi=mirrorOf(g.i);
    if(mi!==g.i){
      const mr=c.S.per[mi];
      if(isFinite(mr.rf)&&g.rf>0)symWorst=Math.max(symWorst,100*Math.abs(mr.rf-g.rf)/g.rf);
    }
    const n=ranked.find(q=>q.i!==g.i&&q.i!==mi)||ranked[1];
    const gap=(g.rf>0&&isFinite(n.rf))?100*(n.rf-g.rf)/g.rf:Infinity;
    out.push({__i:out.length,veh:c.v.name,
      gov:CALC.secTag(M,g.i),rf:g.rf,
      next:CALC.secTag(M,n.i),rf2:isFinite(n.rf)?n.rf:Infinity,
      gap:gap,
      note:(gap<10)?"close — which section governs is not robust"
          :(gap<25)?"moderate"

    `For ${tight.map(o=>"<b>"+esc(o.veh)+"</b>").join(", ")} the second-lowest section is within 10% of the `+

    `structural margin: the lateral earth pressure coefficient, the fill unit weight, the element count and `+
    `the deterioration extent can each move the two past one another. Check that both sections are defensible `+
    `rather than only the one that happens to be reported.`,"§7.2.7.9B");

    "one, so the reported location is not sensitive to small changes in assumption.");

    symmetric barrel it rates within a fraction of a percent of the governing section for every vehicle, which
    is the geometry being symmetric rather than the rating being finely balanced, and including it would mark
    every row close.</div>`;
  if(symWorst>0)h+=msg(symWorst>2?"wn":"key",
    symWorst>2?"Mirror sections do not agree":"Symmetry check on the rating sweep",
    `The largest disagreement between a governing section and its mirror is <b>${nfx(symWorst,2)}%</b>. `+

         critical position does not always fall on that grid. It bounds the discretisation error in the
         reported rating and is a useful number to quote.`),"§7.2.7.8B");
