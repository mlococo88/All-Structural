<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Masonry Arch Load Rating</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<style>
:root{
  --ink:#1a1a1a; --soft:#4a4a4a; --line:#c9c4b8; --grid:#e8e4da;
  --paper:#f7f5f0; --sheet:#ffffff; --band:#f0ede5;
  --blue:#1f4e79; --blue-lt:#dce6f1; --ok:#1f6b32; --ok-bg:#dff0d8;
  --bad:#9c1c1c; --bad-bg:#f6d9d9; --warn:#8a5a00; --warn-bg:#fcf0d8;
  --na:#5a5a5a; --na-bg:#ececec;
}
*{box-sizing:border-box;}
html{font-size:15px;height:100%;}
/* App fills the viewport: the header is fixed, and only the two panels
   scroll. Without this the document scrolls behind the panels and you get
   two scrollbars and can run off the end of the content. */
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Times New Roman",Times,serif;line-height:1.5;
  height:100%;overflow:hidden;display:flex;flex-direction:column;}
.mono{font-family:"Courier New",Courier,monospace;}

/* ---------- fixed title block header ---------- */
#hdr{flex:0 0 auto;z-index:50;background:var(--sheet);
  border-bottom:2px solid var(--ink);padding:8px 18px 9px;}
#hdrIn{max-width:2100px;margin:0 auto;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
#appTitle{min-width:250px;}
#appTitle h1{margin:0;font-size:1.34rem;letter-spacing:.02em;font-weight:700;line-height:1.15;}
#appTitle .by{font-size:.94rem;color:var(--soft);font-style:italic;}
#appTitle .gov{font-size:.9rem;color:var(--soft);}
#tblk{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:3px 12px;flex:1;min-width:420px;}
#tblk label{font-size:.9rem;color:var(--soft);display:block;line-height:1.25;}
#tblk input{width:100%;font-family:"Times New Roman",Times,serif;font-size:.96rem;
  padding:2px 5px;border:1px solid var(--line);background:#fff;color:var(--ink);}
#tblk input:focus{outline:2px solid var(--blue);}

/* ---------- two panel layout ---------- */
/* The 1560px cap dated from a narrower output tab set. The Rating Summary is a
   section-by-vehicle matrix that can run a dozen columns wide, and on a 1920
   screen the cap left roughly 180px of dead margin on each side while that table
   scrolled horizontally. The cap is now 2100px, which still stops the text
   columns from becoming unreadably long on an ultrawide, and the input column is
   allowed to grow so the deterioration editor fits without clipping. */
#wrap{width:100%;max-width:2100px;margin:0 auto;display:grid;
  grid-template-columns:minmax(360px,0.9fr) 2.6fr;gap:16px;padding:14px 14px 14px;
  flex:1 1 auto;min-height:0;align-items:stretch;}
/* The section, vehicle and position selectors govern everything below them, so
   they have to stay on screen while the output is read — otherwise you scroll
   into a table and can no longer see which load case it describes. #outPanel is
   the scrolling container, so a sticky wrapper holding the bar and the tab strip
   pins both to its top. */
#outTop{position:sticky;top:0;z-index:40;background:var(--paper);
  box-shadow:0 3px 6px -3px rgba(0,0,0,.28);}
#inPanel,#outPanel{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding-right:4px;}
@media(max-width:1050px){
  html,body{height:auto;overflow:visible;display:block;}
  #wrap{grid-template-columns:1fr;min-height:0;}
  #inPanel,#outPanel{height:auto;overflow:visible;}
}

/* ---------- panels / collapsibles ---------- */
.pnl{background:var(--sheet);border:1px solid var(--line);margin-bottom:12px;}
.pnl>.hd{padding:6px 12px;background:var(--band);border-bottom:1px solid var(--line);
  font-weight:700;font-size:1rem;cursor:pointer;user-select:none;display:flex;
  align-items:center;gap:8px;}
.pnl>.hd .tw{font-size:.85rem;width:11px;display:inline-block;color:var(--soft);}
.pnl>.hd .tag{margin-left:auto;font-weight:400;font-size:.88rem;color:var(--soft);}
.pnl>.bd{padding:10px 13px;}
.pnl.clp>.bd{display:none;}
.sub{border:1px solid var(--grid);margin:10px 0;}
.sub>.hd{padding:5px 10px;background:#f6f4ee;border-bottom:1px solid var(--grid);
  font-weight:700;font-size:.98rem;cursor:pointer;user-select:none;display:flex;gap:8px;align-items:center;}
.sub>.bd{padding:9px 11px;}
.sub.clp>.bd{display:none;}

/* ---------- inputs ---------- */
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:5px 0;}
.row label{font-size:.97rem;flex:1;}
.row label .h{display:block;font-size:.9rem;color:var(--soft);font-style:italic;line-height:1.25;}
input[type=number],input[type=text],select{font-family:"Times New Roman",Times,serif;font-size:.97rem;
  padding:2px 5px;border:1px solid var(--line);background:#fff;color:var(--ink);}
input[type=number]{width:106px;text-align:right;}
select{max-width:172px;}
textarea{width:100%;font-family:"Courier New",Courier,monospace;font-size:.92rem;
  border:1px solid var(--line);padding:5px;resize:vertical;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);}
.unit{font-size:.9rem;color:var(--soft);min-width:42px;display:inline-block;}
button{font-family:"Times New Roman",Times,serif;font-size:.96rem;cursor:pointer;
  border:1px solid var(--ink);background:#fff;color:var(--ink);padding:3px 10px;}
button:hover{background:var(--ink);color:#fff;}
button.pri{background:var(--ink);color:#fff;}
button.pri:hover{background:#000;}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;}
.vgrid label{font-size:.95rem;display:flex;gap:5px;align-items:center;}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:12px;flex-wrap:wrap;
  position:sticky;top:0;background:var(--paper);z-index:20;padding-top:2px;}
#tabs button{border:1px solid var(--line);border-bottom:none;background:var(--band);
  padding:5px 13px;font-size:.99rem;margin-right:3px;color:var(--soft);}
#tabs button.on{background:var(--sheet);color:var(--ink);font-weight:700;
  border-color:var(--ink);border-bottom:2px solid var(--sheet);margin-bottom:-2px;}
#tabs button:hover{background:var(--sheet);color:var(--ink);}
.tabpane{display:none;} .tabpane.on{display:block;}
/* Rating Summary. The governing cell has to survive being printed in black and
   white, so it carries a border and the word "governs" rather than colour alone
   — a shaded cell that photocopies flat is worthless in a calc package. */
/* Deterioration editor. Two lines per entry so it fits the input column at any
   width the layout allows; the fields wrap rather than running off the edge. */
.dtRows{margin:2px 0 6px;}
.dtRow{border:1px solid #d8d2c4;border-radius:3px;padding:5px 6px;margin-bottom:5px;
  background:rgba(0,0,0,.012);}
.dtLine1{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;}
.dtLine1 label{display:flex;flex-direction:column;font-size:.82rem;flex:1 1 68px;min-width:60px;gap:1px;}
.dtLine1 label .h{font-size:.68rem;line-height:1.05;}
.dtLine1 input{width:100%;min-width:0;}
.dtLine1 .dtDel{flex:0 0 auto;align-self:flex-end;padding:2px 8px;line-height:1.3;}
.dtLine2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;}
.dtLine2 .dtTreat{display:flex;align-items:center;gap:5px;font-size:.82rem;flex:1 1 auto;}
.dtLine2 select{max-width:none;flex:1 1 auto;min-width:148px;}
.dtRes{font-size:.8rem;flex:1 1 100%;}
.dtRes .h{font-size:.7rem;}
table.rs td.rsGov{outline:2px solid var(--accent,#0F6E56);outline-offset:-2px;
  background:rgba(15,110,86,.08);font-weight:600;position:relative;}
table.rs td.rsGov .rsFlag{display:block;font-size:.62rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--accent,#0F6E56);font-weight:600;line-height:1.1;margin-top:1px;}
table.rs tr.rsGovRow td{background:rgba(15,110,86,.035);}
table.rs td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.rs tfoot td{border-top:1.5px solid currentColor;}
@media print{
  table.rs td.rsGov{outline:1.2pt solid #000;outline-offset:-1.2pt;background:#eee;}
  table.rs td.rsGov .rsFlag{color:#000;}
  table.rs tr.rsGovRow td{background:#f6f6f6;}
}

/* ---------- dashboard ---------- */
#dash table{width:100%;border-collapse:collapse;}
#dash th{font-size:.92rem;text-align:left;border-bottom:2px solid var(--ink);padding:4px 7px;}
#dash td{border-bottom:1px solid var(--grid);padding:4px 7px;font-size:.97rem;vertical-align:top;}
.badge{display:inline-block;padding:1px 9px;font-weight:700;font-size:.92rem;border:1px solid;}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);}
.b-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);}
.b-na{background:var(--na-bg);color:var(--na);border-color:var(--na);}
.b-wn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
a.jump{color:var(--blue);text-decoration:none;border-bottom:1px dotted var(--blue);cursor:pointer;}

/* ---------- calc steps ---------- */
.step{margin:9px 0 11px;}
.step .lbl{font-weight:700;font-size:.99rem;}
.step .ref{float:right;font-size:.9rem;color:var(--soft);font-style:italic;font-weight:400;}
.step .eq{margin:3px 0 2px;text-align:left;overflow-x:auto;overflow-y:hidden;padding:2px 0;}
.step .eq .katex-display{margin:.28em 0;text-align:left !important;}
.step .eq .katex-display>.katex{text-align:left !important;display:inline-block;}
.step .note{font-size:.93rem;color:var(--soft);font-style:italic;}
.vartab{width:100%;border-collapse:collapse;margin:6px 0 10px;}
.vartab th{font-size:.9rem;text-align:left;border-bottom:1.5px solid var(--ink);padding:3px 7px;color:var(--soft);}
.vartab td{border-bottom:1px solid var(--grid);padding:3px 7px;font-size:.95rem;}
.vartab td.s{width:78px;font-style:italic;}
.vartab td.v{width:120px;text-align:right;font-family:"Courier New",monospace;font-size:.92rem;}

/* ---------- data tables ---------- */
table.dt{width:100%;border-collapse:collapse;font-size:.93rem;}
table.dt th{border-bottom:2px solid var(--ink);padding:3px 6px;text-align:right;font-size:.9rem;
  white-space:nowrap;}
table.dt th:first-child{text-align:left;}
table.dt td{border-bottom:1px solid var(--grid);padding:3px 6px;text-align:right;
  font-family:"Courier New",Courier,monospace;font-size:.9rem;white-space:nowrap;}
table.dt td:first-child{text-align:left;font-family:"Times New Roman",serif;}
/* Adverse-influence-only: nodes whose influence opposes the section being checked
   carry no load and are struck through, so the table reads as the calculation
   that was actually performed rather than as one with missing numbers. */
table.dt tr.drop td{opacity:.45;text-decoration:line-through;}
@media print{table.dt tr.drop td{opacity:1;color:#777;}}
table.dt tr.gv td{background:#fdf2ef;font-weight:700;}
table.dt tr.sel td{background:var(--blue-lt);}
.scrollx{overflow-x:auto;}

/* ---------- messages ---------- */
.msg{border-left:4px solid;padding:6px 11px;margin:8px 0;font-size:.97rem;}
.m-err{background:var(--bad-bg);border-color:var(--bad);}
.m-wrn{background:var(--warn-bg);border-color:var(--warn);}
.m-inf{background:var(--blue-lt);border-color:var(--blue);}
.m-key{background:#eef6ee;border-color:var(--ok);}
/* A callout title is the first <b>; inline emphasis inside the body must stay
   inline, or every bold phrase becomes its own line and the callout breaks up
   into fragments across a page boundary in print. */
.msg > b:first-child{display:block;}

/* ---------- figures ---------- */
figure{margin:10px 0;}
figure svg{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);}
/* Plotly builds a stack of absolutely-positioned SVG layers sized in pixels.
   The rule above would force width:100% and height:auto onto those layers,
   which collapses them to zero height — the plot is present in the DOM but
   invisible. Everything Plotly owns is exempted. */
.js-plotly-plot svg, .plot-container svg, .svg-container svg{
  display:inline !important; width:auto !important; height:auto !important;
  max-width:none !important; background:none !important; border:none !important;}
.js-plotly-plot, .plot-container, .svg-container{background:#fff;}
figcaption{font-size:.93rem;color:var(--soft);font-style:italic;margin-top:3px;text-align:left;}
.plot{width:100%;height:330px;}
.figbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:.95rem;}
.figbar input[type=range]{flex:1;min-width:130px;}

/* ---------- manual ---------- */
#manNav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:11px;}
#manNav button{font-size:.94rem;padding:3px 9px;}
#manNav button.on{background:var(--ink);color:#fff;}
.manpart{display:none;} .manpart.on{display:block;}
.manpart h3{font-size:1.1rem;margin:14px 0 5px;border-bottom:1px solid var(--line);padding-bottom:2px;}
.manpart h4{font-size:1.02rem;margin:11px 0 3px;}
.manpart p,.manpart li{font-size:.99rem;}
.manpart ul,.manpart ol{margin:5px 0 9px;padding-left:26px;}

/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px;}
#modalBg.on{display:flex;}
#modal{background:#fff;border:2px solid var(--ink);max-width:640px;width:100%;
  max-height:86vh;overflow-y:auto;padding:14px 18px;}
#modal h3{margin:0 0 8px;font-size:1.1rem;}
#modal .grp{border:1px solid var(--grid);padding:7px 10px;margin:7px 0;}
#modal label{display:block;font-size:.97rem;margin:2px 0;}
#modal .lvl2{padding-left:20px;font-size:.95rem;}

/* ---------- print ---------- */
#rptHost{display:none;}
@media print{
  /* nothing is sticky on paper */
  #outTop{position:static !important;box-shadow:none !important;}
  html{font-size:10.5pt;}
  html,body{height:auto;overflow:visible;display:block;background:#fff;}
  #wrap{display:block;max-width:none;padding:0;}
  #inPanel,#outPanel{height:auto;overflow:visible;}
  #hdr,#wrap,#modalBg{display:none !important;}
  #rptHost{display:block !important;}
  .rpt-pg{page-break-after:always;}
  .rpt h2{font-size:1.18rem;border-bottom:1.5px solid #000;margin:13px 0 6px;padding-bottom:2px;}
  .rpt h3{font-size:1.05rem;margin:10px 0 4px;}
  /* numbered headings inside a section are indented and lighter, so "9. Thrust
     line position" cannot be read as document section 9 */
  .rpt h4{font-size:.98rem;font-weight:600;color:#3a3a3a;margin:8px 0 3px 14px;
    border-left:3px solid var(--line);padding-left:8px;}
  .rpt-toc{page-break-after:always;}
  .step,figure,table.dt,.vartab,.msg{page-break-inside:avoid;}
  /* ---- wide tables ----
     table-layout:fixed alone is not enough: the screen rule sets
     white-space:nowrap on both th and td, so a header that cannot wrap overflows
     its fixed cell and prints on top of its neighbors. Both must be released,
     and 8.4pt is the smallest that stays legible in a sealed document. */
  table.dt{font-size:8.4pt;width:100%;table-layout:fixed;}
  table.dt th,table.dt td{padding:1.5px 3px;white-space:normal !important;
    word-break:break-word;overflow-wrap:anywhere;vertical-align:top;}
  table.axm{font-size:6.6pt;}
  .mtx{overflow:visible;} .mtx table{font-size:7.4pt;table-layout:fixed;width:100%;}
  figure svg{max-width:100%;height:auto;}
  .js-plotly-plot svg,.svg-container svg{width:auto !important;height:auto !important;max-width:none !important;}
  /* ---- nothing may stay scrollable on paper ----
     A scroll container prints its visible window only, so anything past the
     right edge is lost and a grey scroll track prints across the page. This cost
     the closing number of the last equation in the calculation. */
  .bd{max-height:none !important;overflow:visible !important;}
  .scrollx{overflow:visible !important;}
  .step .eq{overflow:visible !important;overflow-x:visible !important;}
  .katex-display,.katex-display>.katex{overflow:visible !important;white-space:normal !important;}
  /* ---- keep blocks and their headings together ---- */
  .msg{page-break-inside:avoid;}
  .rpt h2,.rpt h3,.rpt h4,h4{page-break-after:avoid;break-after:avoid-page;}
  figcaption{page-break-before:avoid;}
  .noprint{display:none !important;}
  a.jump{color:#000;border:none;}
}
/* The running header and footer are position:fixed, which repeats them on every
   sheet but reserves no space in the flow — and both carry background:#fff, so
   they do not merely collide with body text, they paint over it. On the sealed
   package this deleted the "Allowable stress f_a = 640 psi" input row outright
   between two pages, and clipped the second line of a rating-vehicle row.
   The page margins now carry the bands: 1.25in top and 1.15in bottom against
   band heights of about 0.30in, leaving roughly 0.35in of clear air on each
   side of the text column. Change the two offsets below together with these
   margins — they are one measurement expressed in two places. */
@page{margin:1.25in 0.55in 1.15in;}
/* Chrome does not support @page @bottom-right{content:counter(page)}, so the
   running header and footer are fixed-position elements. A fixed element repeats
   on every printed sheet, which is what a calculation package needs: project,
   task and sheet identification on each page rather than only on the first. */
#runHead,#runFoot{display:none;}
@media print{
  #runHead,#runFoot{display:block;position:fixed;left:0;right:0;
    font-size:8pt;color:#111;background:#fff;}
  /* Offsets are measured from the text column edge into the @page margin above.
     0.60in of the 1.25in top margin puts the band clear of the first line;
     0.58in of the 1.15in bottom margin does the same below. */
  #runHead{top:-0.60in;border-bottom:0.75pt solid #000;padding-bottom:2px;}
  #runFoot{bottom:-0.58in;border-top:0.75pt solid #000;padding-top:2px;}
  #runHead .l,#runFoot .l{float:left;} #runHead .r,#runFoot .r{float:right;}
  #runFoot .c{text-align:center;}
}
#rptHead{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px;}
#rptHead .t{font-size:1.35rem;font-weight:700;}
#rptHead table{width:100%;border-collapse:collapse;margin-top:5px;font-size:.95rem;}
#rptHead td{padding:1px 6px;border:1px solid #999;}
#rptFoot{border-top:1px solid #000;margin-top:14px;padding-top:5px;font-size:.9rem;font-style:italic;color:#333;}
</style>
</head>
<body>

<div id="hdr"><div id="hdrIn">
  <div id="appTitle">
    <h1>Stone Masonry Arch Load Rating</h1>
    <div class="by">by Mario Lococo</div>
    <div class="gov">MassDOT BM Pt. I §7.2.7 &middot; AASHTO MBE 6A.9.1</div>
  </div>
  <div id="tblk">
    <div><label>Project</label><input id="tbProject" type="text"></div>
    <div><label>Subject</label><input id="tbSubject" type="text"></div>
    <div><label>Task</label><input id="tbTask" type="text"></div>
    <div><label>Computed by</label><input id="tbBy" type="text"></div>
    <div><label>Date</label><input id="tbDate" type="text"></div>
    <div><label>Checked by</label><input id="tbChk" type="text"></div>
    <div><label>Checked date</label><input id="tbChkDate" type="text"></div>
    <div><label>&nbsp;</label><button id="printBtn" style="width:100%">Print / PDF Report</button></div>
  </div>
</div></div>

<div id="wrap">
<!-- ================= INPUT PANEL ================= -->
<div id="inPanel"></div>
<!-- ================= OUTPUT PANEL ================= -->
<div id="outPanel">
  <div id="outTop">
    <div id="focusBar" class="focusbar noprint"></div>
    <div id="tabs"></div>
  </div>
  <div id="panes"></div>
</div>
</div>

<div id="modalBg"><div id="modal"></div></div>
<div id="runHead"></div>
<div id="runFoot"></div>
<div id="rptHost"></div>

<script>

/* ============================ CORE (pure) ============================ */
/* ---------------- units ----------------
   Everything the solver touches is in FEET, because the whole calculation is
   built per foot of barrel width: thrusts are k/ft, moments are k·ft/ft, areas
   ft²/ft, stresses ksf. That basis is not negotiable and is not changed here.

   What changes is the units a person reads and types. A stone ring is 19 inches
   deep and has 8 left; nobody measures that as 1.583 ft and 0.667 ft, and the
   decimals hide what the number means. So the through-thickness dimensions —
   ring depth, remaining depth after loss, the kern, the eccentricity, the
   pressure-wedge bearing depth, the thrust-line offset, the wearing surface —
   are entered and displayed in INCHES, converted at the single point where
   input is read and at the points where output is formatted.

   Lengths along or across the structure stay in feet: span, rise, cover,
   stations, tributary lengths, barrel width, tie length. Those are naturally
   feet on a bridge and always have been.

   Section properties A, S and I stay on the foot basis, because they are
   consumed directly by the stress expressions alongside k/ft forces. Showing
   A in in²/ft beside a thrust in k/ft would invite exactly the arithmetic error
   this change is meant to prevent. */
const IN_PER_FT=12;
const inOf=(ft)=>ft*IN_PER_FT;          // feet -> inches, for display
const ftOf=(inch)=>inch/IN_PER_FT;      // inches -> feet, for input
/* Depth-class fields, entered in inches and stored in the model in feet. Listed
   once so the input reader, the session migration and the manual cannot drift
   apart. */
const INCH_FIELDS=["dCrown","dSpring","tws"];
const ARCH = (() => {
"use strict";

/* ---------- linear algebra: dense LU with partial pivoting ---------- */
function luFactor(A){
  const n=A.length, piv=new Array(n);
  for(let i=0;i<n;i++)piv[i]=i;
  for(let k=0;k<n;k++){
    let p=k,mx=Math.abs(A[k][k]);
    for(let i=k+1;i<n;i++){const v=Math.abs(A[i][k]);if(v>mx){mx=v;p=i;}}
    if(mx<1e-14)throw new Error("Singular matrix");
    if(p!==k){const t=A[p];A[p]=A[k];A[k]=t;const tp=piv[p];piv[p]=piv[k];piv[k]=tp;}
    const akk=A[k][k];
    for(let i=k+1;i<n;i++){
      const f=A[i][k]/=akk;
      if(f!==0){const Ai=A[i],Ak=A[k];for(let j=k+1;j<n;j++)Ai[j]-=f*Ak[j];}
    }
  }
  return {LU:A,piv};
}
function luSolve(F,b){
  const {LU,piv}=F,n=LU.length,x=new Array(n);
  for(let i=0;i<n;i++)x[i]=b[piv[i]];
  for(let i=0;i<n;i++){let s=x[i];for(let j=0;j<i;j++)s-=LU[i][j]*x[j];x[i]=s;}
  for(let i=n-1;i>=0;i--){let s=x[i];for(let j=i+1;j<n;j++)s-=LU[i][j]*x[j];x[i]=s/LU[i][i];}
  return x;
}
function lsq(A,b){ // least squares via normal equations (small systems)
  const m=A.length,n=A[0].length;
  const N=[],r=new Array(n).fill(0);
  for(let i=0;i<n;i++){N.push(new Array(n).fill(0));}
  for(let k=0;k<m;k++){
    const row=A[k];
    for(let i=0;i<n;i++){r[i]+=row[i]*b[k];
      for(let j=i;j<n;j++)N[i][j]+=row[i]*row[j];}
  }
  for(let i=0;i<n;i++)for(let j=0;j<i;j++)N[i][j]=N[j][i];
  return luSolve(luFactor(N),r);
}

/* ---------- curve fitting (#1, §7.2.7.2B best fit) ---------- */
function rmsVert(pts,yF){
  let s=0,n=0;
  for(const p of pts){const y=yF(p.x);if(!isFinite(y))return Infinity;s+=(p.y-y)*(p.y-y);n++;}
  return Math.sqrt(s/n);
}
function fitCircle(pts){ // Kasa: x²+y²+Dx+Ey+F=0
  if(pts.length<3)return {ok:false,type:"circle",label:"Circular",why:"needs at least 3 points"};
  const A=pts.map(p=>[p.x,p.y,1]), b=pts.map(p=>-(p.x*p.x+p.y*p.y));
  let D,E,F;
  try{[D,E,F]=lsq(A,b);}catch(e){return {ok:false,type:"circle",label:"Circular",why:"fit is singular for these points"};}
  const cx=-D/2,cy=-E/2,R2=cx*cx+cy*cy-F;
  if(R2<=0)return {ok:false,type:"circle",label:"Circular",why:"solution has no real radius"};
  const R=Math.sqrt(R2);
  const yF=x=>{const t=R*R-(x-cx)*(x-cx);return t<0?NaN:cy+Math.sqrt(t);};
  return {ok:true,type:"circle",label:"Circular",cx,cy,R,yF,rms:rmsVert(pts,yF)};
}
function fitParabola(pts){
  if(pts.length<3)return {ok:false,type:"parabola",label:"Parabolic",why:"needs at least 3 points"};
  const A=pts.map(p=>[p.x*p.x,p.x,1]), b=pts.map(p=>p.y);
  let a2,a1,a0;
  try{[a2,a1,a0]=lsq(A,b);}catch(e){return {ok:false,type:"parabola",label:"Parabolic",why:"fit is singular for these points"};}
  if(a2>=0)return {ok:false,type:"parabola",label:"Parabolic",why:"best-fit parabola opens upward, not an arch form"};
  const yF=x=>a2*x*x+a1*x+a0;
  return {ok:true,type:"parabola",label:"Parabolic",a2,a1,a0,yF,rms:rmsVert(pts,yF)};
}
function fitEllipse(pts){ // axis-aligned: x² + E y² + D x + F y + G = 0
  if(pts.length<4)return {ok:false,type:"ellipse",label:"Elliptical",why:"needs at least 4 points"};
  const A=pts.map(p=>[p.y*p.y,p.x,p.y,1]), b=pts.map(p=>-(p.x*p.x));
  let E,D,F,G;
  try{[E,D,F,G]=lsq(A,b);}catch(e){return {ok:false,type:"ellipse",label:"Elliptical",why:"fit is singular for these points"};}
  if(E<=0)return {ok:false,type:"ellipse",label:"Elliptical",why:"best-fit conic is a hyperbola, not an ellipse — the survey arc does not constrain an elliptical form"};
  const cx=-D/2, cy=-F/(2*E);
  const A2=cx*cx+E*cy*cy-G;
  if(A2<=0)return {ok:false,type:"ellipse",label:"Elliptical",why:"solution has no real semi-axes"};
  const a=Math.sqrt(A2), bb=Math.sqrt(A2/E);
  // upper or lower branch toward the data crown
  let crownY=-Infinity;for(const p of pts)crownY=Math.max(crownY,p.y);
  const sgn=(crownY>=cy)?1:-1;
  const yF=x=>{const t=1-((x-cx)/a)*((x-cx)/a);return t<0?NaN:cy+sgn*bb*Math.sqrt(t);};
  return {ok:true,type:"ellipse",label:"Elliptical",cx,cy,a,b:bb,sgn,yF,rms:rmsVert(pts,yF)};
}
function fitPoly5(pts){
  if(pts.length<6)return {ok:false,type:"poly5",label:"5th-order polynomial",why:"needs at least 6 points"};
  const x0=pts[0].x, x1=pts[pts.length-1].x, dx=x1-x0;
  const A=pts.map(p=>{const u=(p.x-x0)/dx;return [1,u,u*u,u**3,u**4,u**5];});
  let c;
  try{c=lsq(A,pts.map(p=>p.y));}catch(e){return {ok:false,type:"poly5",label:"5th-order polynomial",why:"fit is singular for these points"};}
  const yF=x=>{const u=(x-x0)/dx;let y=0,uu=1;for(let k=0;k<6;k++){y+=c[k]*uu;uu*=u;}return y;};
  return {ok:true,type:"poly5",label:"5th-order poly",c,x0,dx,yF,rms:rmsVert(pts,yF)};
}
function fitAll(pts){   // every candidate, including rejections with a stated reason
  return [fitCircle(pts),fitParabola(pts),fitEllipse(pts),fitPoly5(pts)]
    .map(f=>(f.ok&&!isFinite(f.rms))?{ok:false,type:f.type,label:f.label,why:"residual is not finite"}:f);
}
function fitOk(pts){return fitAll(pts).filter(f=>f.ok);}

/* ---------- dense intrados generation ---------- */
const M_DENSE=800;
function angNorm(a){return (a<-Math.PI/2)?a+2*Math.PI:a;} // keep sweep off the bottom
function denseFromCircle(cx,cy,R,xa,ya,xb,yb){
  const a0=angNorm(Math.atan2(ya-cy,xa-cx)), a1=angNorm(Math.atan2(yb-cy,xb-cx));
  const pts=[];
  for(let i=0;i<=M_DENSE;i++){const a=a0+(a1-a0)*i/M_DENSE;
    pts.push({x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)});}
  return pts;
}
function denseFromEllipse(f,xa,ya,xb,yb){
  const t0=angNorm(Math.atan2((ya-f.cy)/f.b,(xa-f.cx)/f.a));
  const t1=angNorm(Math.atan2((yb-f.cy)/f.b,(xb-f.cx)/f.a));
  const pts=[];
  for(let i=0;i<=M_DENSE;i++){const t=t0+(t1-t0)*i/M_DENSE;
    pts.push({x:f.cx+f.a*Math.cos(t),y:f.cy+f.b*Math.sin(t)});}
  return pts;
}
function denseFromY(yF,xa,xb){
  const pts=[];
  for(let i=0;i<=M_DENSE;i++){const x=xa+(xb-xa)*i/M_DENSE;pts.push({x,y:yF(x)});}
  return pts;
}
/* p: geometry params. Returns {pts dense intrados, fits (measured mode), span, rise} */
function denseIntrados(p){
  if(p.geoMode==="measured"){
    const data=p.measPts;
    if(!data||data.length<3)throw new Error("Need at least 3 measured points.");
    const pts=[...data].sort((a,b)=>a.x-b.x);
    const all=fitAll(pts);
    const fits=all.filter(f=>f.ok);
    if(!fits.length)throw new Error("None of the four candidate curves could be fitted to these points: "+
      all.map(f=>f.label+" ("+f.why+")").join("; ")+".");
    fits.sort((a,b)=>a.rms-b.rms);
    let f;
    if(p.fitSel&&p.fitSel!=="auto"){
      f=fits.find(q=>q.type===p.fitSel);
    }else{
      // parsimony tiebreak: prefer simpler curve when RMS within 5% of best
      const rank={circle:0,parabola:0,ellipse:1,poly5:2};
      f=fits[0];
      for(const q of fits)if(q.rms<=fits[0].rms*1.05+1e-6&&rank[q.type]<rank[f.type])f=q;
    }
    if(!f)throw new Error("The selected curve type could not be fitted to these points: "+
      (all.find(q=>q.type===p.fitSel)||{why:"unknown reason"}).why+".");
    if(!f)throw new Error("Selected fit type is not valid for these points (check count/shape).");
    const a=pts[0],b=pts[pts.length-1];
    let dense;
    if(f.type==="circle")dense=denseFromCircle(f.cx,f.cy,f.R,a.x,f.yF(a.x),b.x,f.yF(b.x));
    else if(f.type==="ellipse")dense=denseFromEllipse(f,a.x,f.yF(a.x),b.x,f.yF(b.x));
    else dense=denseFromY(f.yF,a.x,b.x);
    let ymax=-1e9;for(const q of dense)ymax=Math.max(ymax,q.y);
    return {pts:dense,fits:all,chosen:f.type,
      span:b.x-a.x, rise:ymax-Math.min(dense[0].y,dense[dense.length-1].y)};
  }
  // idealized
  const S=p.S,R=p.R;
  if(p.shape==="circular"){
    const Rc=S*S/(8*R)+R/2, cx=S/2, cy=R-Rc;
    return {pts:denseFromCircle(cx,cy,Rc,0,0,S,0),span:S,rise:R};
  }
  return {pts:denseFromY(x=>4*R*x*(S-x)/(S*S),0,S),span:S,rise:R};
}

/* ---------- ring depth profile (#5) ---------- */
/* base linear crown↔springing by arc fraction; overrides [{x,d}] interpolated by x */
/* Static condensation of one degree of freedom out of an element stiffness
   matrix — used to release a moment at a hinged end.
       k* = k - k[:,r] k[r,:] / k[r,r]
   The released row and column are then zero, so that end carries no moment. */
function releaseDof(k,r){
  const p0=k[r][r];
  if(Math.abs(p0)<1e-12)return null;
  const col=k.map(row=>row[r]), row=k[r].slice();
  for(let i=0;i<6;i++)for(let j=0;j<6;j++)k[i][j]-=col[i]*row[j]/p0;
  for(let i=0;i<6;i++){k[i][r]=0;k[r][i]=0;}
  return {r,col,piv:p0};
}
/* The same condensation has to be applied to the element's fixed-end force
   vector, or an element carrying distributed load still delivers its fixed-end
   moment to an end that is supposed to be free to rotate. */
/* Static condensation of a rotational degree of freedom against a spring.
   ks = 0 is a full release; ks -> infinity leaves the matrix untouched. The
   existing releaseDof is this with ks = 0 and is kept for that path. */
function releaseDofK(k,r,ks){
  const piv=k[r][r]+ks;
  if(!isFinite(piv)||Math.abs(piv)<1e-12)return null;
  const col=k.map(row=>row[r]);
  for(let i=0;i<6;i++)for(let j=0;j<6;j++)k[i][j]-=col[i]*k[r][j]/piv;
  return {r,col,piv};
}
function releaseFe(fe,rel){
  if(!rel)return fe;
  const out=fe.slice(), fr=fe[rel.r];
  for(let i=0;i<6;i++)out[i]=fe[i]-rel.col[i]*fr/rel.piv;
  out[rel.r]=0;
  return out;
}
/* the ring depth with no deterioration applied — the sound section */
function baseDepth(p,u){
  const t=1-Math.abs(2*u-1);
  let d=p.dS+(p.dC-p.dS)*t;
  /* Local overrides, keyed on intrados arc fraction. They belong HERE, in the
     sound-ring profile, not bolted on afterwards: the deterioration machinery
     samples baseDepth for the sound section at its zone edges, and when the
     overrides lived outside this function a spall next to an overridden region
     feathered back to the TAPER depth instead of the ring the engineer had
     actually described. */
  const xo=p.__xOverU;
  if(xo&&xo.length>1){
    if(u>=xo[0].u&&u<=xo[xo.length-1].u){
      for(let k=0;k<xo.length-1;k++){
        if(u>=xo[k].u&&u<=xo[k+1].u){
          const t2=(u-xo[k].u)/Math.max(xo[k+1].u-xo[k].u,1e-12);
          d=xo[k].d+(xo[k+1].d-xo[k].d)*t2; break;
        }
      }
    }
  }
  return d;
}
/* Convert the override table from stations to arc fractions, on the same sound
   intrados the deterioration resolver uses. The old path interpolated on the
   PRE-SHIFT intrados x — the coordinate before the origin moves to the axis
   springing — while every station the user can read off the node table is
   post-shift. On the MBTA barrel those systems differ by 0.71 ft, so an
   override entered at the crown landed 0.71 ft up the far haunch. Mapping
   through the intrados arc removes the coordinate question entirely: the
   intrados is the fitted curve, it does not move when the ring thins, and it is
   the same reference the deterioration stations already use. */
function overridesToU(p){
  const raw=(p.dOver||[]).filter(o=>isFinite(o.x)&&o.d>0);
  if(!raw.length)return p;
  const g0=buildGeometry(Object.assign({},p,{__uOver:null,__xOverU:null}));
  const ip=g0.intrados, NI=ip.length;
  const cum=[0];
  for(let i=1;i<NI;i++)cum.push(cum[i-1]+Math.hypot(ip[i].x-ip[i-1].x,ip[i].y-ip[i-1].y));
  const LI=cum[NI-1]||1;
  const xLo=Math.min(ip[0].x,ip[NI-1].x), xHi=Math.max(ip[0].x,ip[NI-1].x);
  const uAtX=(x)=>{
    for(let i=0;i<NI-1;i++){
      const a=ip[i],b=ip[i+1];
      if((x>=a.x&&x<=b.x)||(x<=a.x&&x>=b.x)){
        const t=(Math.abs(b.x-a.x)<1e-12)?0:(x-a.x)/(b.x-a.x);
        return (cum[i]+(cum[i+1]-cum[i])*t)/LI;
      }
    }
    return (x<=xLo)?0:1;
  };
  const tol=Math.max(0.5,0.02*(xHi-xLo));
  for(const o of raw)
    if(o.x<xLo-tol||o.x>xHi+tol)
      throw new Error(`The depth override station x = ${o.x.toFixed(2)} ft is outside the arch, which runs `+
        `x = ${xLo.toFixed(2)} to ${xHi.toFixed(2)} ft.`);
  let pts=raw.map(o=>({u:uAtX(o.x),d:o.d})).sort((a,b)=>a.u-b.u);
  /* End conditions. A single entry used to be a silent no-op — the interpolation
     loop needed two points and fell straight through to the taper — and a
     multi-point table stepped abruptly to the taper beyond its first and last
     stations. Both ends now feather to the sound taper at 45 degrees over the
     depth difference, the same convention the deterioration zones use, so a
     single "18.0, 19" entry means what it reads: 19 in at x = 18, blending back
     to the ring on either side. */
  const taper=(u)=>{const t=1-Math.abs(2*u-1);return p.dS+(p.dC-p.dS)*t;};
  const edge=(q,dir)=>{
    const w=Math.max(Math.abs(taper(q.u)-q.d),0.25)/LI;
    const ue=Math.max(0,Math.min(1,q.u+dir*w));
    return {u:ue,d:taper(ue)};
  };
  pts=[edge(pts[0],-1),...pts,edge(pts[pts.length-1],+1)]
      .sort((a,b)=>a.u-b.u)
      .filter((q,k,arr)=>k===0||q.u>arr[k-1].u+1e-9);
  return Object.assign({},p,{__xOverU:pts});
}
function makeDProfile(p){
  /* Deterioration control points (arc-fraction keyed) override the sound ring;
     everything else — taper AND station overrides — now lives in baseDepth, so
     there is exactly one definition of the sound profile. The old x-keyed
     branch that lived here interpolated on the pre-shift intrados coordinate
     and has been removed; see overridesToU. */
  const uo=(p.__uOver||[]).slice().sort((a,b)=>a.u-b.u);
  return (u,x)=>{
    if(uo.length>1&&u>=uo[0].u&&u<=uo[uo.length-1].u){
      for(let k=0;k<uo.length-1;k++){
        if(u>=uo[k].u&&u<=uo[k+1].u){
          const t=(u-uo[k].u)/Math.max(uo[k+1].u-uo[k].u,1e-12);
          return uo[k].d+(uo[k+1].d-uo[k].d)*t;
        }
      }
    }
    return baseDepth(p,u);
  };
}

/* ---------- geometry assembly ---------- */
function buildGeometry(p){
  const di=denseIntrados(p);
  const raw=di.pts;
  // numeric tangents → normals = rot CCW (points up/outward for L→R parametrization)
  const N=raw.length, nrm=new Array(N);
  for(let i=0;i<N;i++){
    const a=raw[Math.max(i-1,0)], b=raw[Math.min(i+1,N-1)];
    const tx=b.x-a.x, ty=b.y-a.y, L=Math.hypot(tx,ty)||1e-12;
    nrm[i]={x:-ty/L,y:tx/L};
  }
  // arc length on intrados (d varies → axis arc computed after offset)
  const cumI=[0];
  for(let i=1;i<N;i++)cumI.push(cumI[i-1]+Math.hypot(raw[i].x-raw[i-1].x,raw[i].y-raw[i-1].y));
  const LI=cumI[N-1];
  const dProf=makeDProfile(p);
  const dDense=new Array(N), d0Dense=new Array(N);
  for(let i=0;i<N;i++){
    dDense[i]=Math.max(dProf(cumI[i]/LI,raw[i].x),0.1);
    d0Dense[i]=Math.max(baseDepth(p,cumI[i]/LI),0.1);   // sound ring, before any loss
  }
  /* Which face the lost material comes off. The arch axis is the mid-depth line,
     so this is not a bookkeeping detail: it decides where the axis goes and
     therefore the shape of the structure being analyzed.
       intrados  the sound material is on top, the extrados holds station and the
                 axis RISES into the zone. This is the case an inspector actually
                 sees — spalled voussoir soffits, frost and fire damage — and the
                 fill above is undisturbed.
       extrados  the intrados holds station and the axis DROPS. Right for lost
                 backing or ring separation from above.
       both      material lost equally from each face; the axis does not move.
     "off" is the offset from the intrados out to the axis at each point. */
  const face=(p.deterFace||"intrados");
  const offAx=new Array(N), offEx=new Array(N);
  for(let i=0;i<N;i++){
    const d=dDense[i], d0=Math.max(d0Dense[i],d);
    if(face==="extrados"){ offAx[i]=d/2;              offEx[i]=d; }
    else if(face==="both"){ offAx[i]=d0/2;            offEx[i]=(d0+d)/2; }
    else                  { offAx[i]=d0-d/2;          offEx[i]=d0; }   // intrados loss
  }
  const axis=raw.map((q,i)=>({x:q.x+nrm[i].x*offAx[i],y:q.y+nrm[i].y*offAx[i]}));
  const ext =raw.map((q,i)=>({x:q.x+nrm[i].x*offEx[i],y:q.y+nrm[i].y*offEx[i]}));
  /* Put the origin at the left springing of the ARCH AXIS, which is the line the
     model is actually built on and the coordinate the MCT exports. On a deep or
     near-semicircular ring the axis springs outside the intrados — the d/2
     offset is horizontal there — so without this the model would start at a
     negative x and every plot and every exported node would carry that offset.
     The shift is a rigid translation, so nothing about the analysis changes. */
  const xShift=-axis[0].x;
  if(Math.abs(xShift)>1e-12){
    for(let i=0;i<N;i++){raw[i].x+=xShift;axis[i].x+=xShift;ext[i].x+=xShift;}
  }
  const xIntL=raw[0].x, xIntR=raw[N-1].x;   // intrados springings, for dimensioning
  const cum=[0];
  for(let i=1;i<N;i++)cum.push(cum[i-1]+Math.hypot(axis[i].x-axis[i-1].x,axis[i].y-axis[i-1].y));
  const Ltot=cum[N-1];
  function sampleAt(s,arr){
    let lo=0,hi=N-1;
    while(hi-lo>1){const m=(lo+hi)>>1;(cum[m]<=s)?lo=m:hi=m;}
    const t=(s-cum[lo])/Math.max(cum[hi]-cum[lo],1e-12);
    const lerp=(A,B)=>A+(B-A)*t;
    if(typeof arr[0]==="number")return lerp(arr[lo],arr[hi]);
    return {x:lerp(arr[lo].x,arr[hi].x),y:lerp(arr[lo].y,arr[hi].y)};
  }
  let extYmax=-1e9,xCr=0;
  for(const e of ext)if(e.y>extYmax){extYmax=e.y;xCr=e.x;}
  /* grade line (bottom of WS): bws(x)=y0+gr·x  (#grade) */
  let gr,y0;
  if(p.gradeMode==="ends"){
    const eL=ext[0],eR=ext[ext.length-1];
    const yL=eL.y+(isFinite(p.covL)?p.covL:p.cover);
    const yR=eR.y+(isFinite(p.covR)?p.covR:p.cover);
    gr=(yR-yL)/((eR.x-eL.x)||1e-9); y0=yL-gr*eL.x;
  }else{
    gr=(p.gradePct||0)/100;
    y0=(extYmax+p.cover)-gr*xCr;
  }
  const bwsAt=x=>y0+gr*x, surfAt=x=>y0+gr*x+p.tws;
  const coverCrown=bwsAt(xCr)-extYmax;
  let covMin=1e9;
  for(const e of ext)covMin=Math.min(covMin,bwsAt(e.x)-e.y);
  if(covMin<-0.01)throw new Error("Grade line passes below the arch extrados (min cover "+covMin.toFixed(2)+" ft) — check covers / slope.");
  const nEl=p.nEl,nN=nEl+1,nodes=[];
  for(let i=0;i<nN;i++){
    const s=Ltot*i/nEl;
    const a=sampleAt(s,axis), e=sampleAt(s,ext), it=sampleAt(s,raw);
    const nx=sampleAt(s,nrm.map(q=>q.x)), ny=sampleAt(s,nrm.map(q=>q.y));
    const nl=Math.hypot(nx,ny)||1;
    nodes.push({x:a.x,y:a.y,s,extX:e.x,extY:e.y,intX:it.x,intY:it.y,
      nx:nx/nl,ny:ny/nl,d:sampleAt(s,dDense)});
  }
  return {nodes,nEl,bwsAt,surfAt,grade:gr,coverCrown,covMin,xCrown:xCr,Ltot,intrados:raw,extrados:ext,
    xShift,xIntL,xIntR,axisSpan:Math.abs(nodes[nN-1].x-nodes[0].x),
    fits:di.fits,chosenFit:di.chosen,span:di.span,rise:di.rise,
    xmin:Math.min(nodes[0].x,nodes[nN-1].x),xmax:Math.max(nodes[0].x,nodes[nN-1].x)};
}

/* ---------- consistent (FEF) load vectors (#4) ---------- */
/* trapezoidal transverse q1→q2 and axial p1→p2 over element length L (local) */
function feTrap(L,qa1,qa2,qt1,qt2){
  return [
    L*(2*qa1+qa2)/6,            // n1
    L*(7*qt1+3*qt2)/20,         // v1
    L*L*(3*qt1+2*qt2)/60,       // m1
    L*(qa1+2*qa2)/6,            // n2
    L*(3*qt1+7*qt2)/20,         // v2
    -L*L*(2*qt1+3*qt2)/60       // m2
  ];
}

/* ---------- frame model ---------- */
/* Deterioration is resolved to a ZONE ON THE INTRADOS ARC, expressed as an arc
   fraction u. That parameter is the only one in this geometry that holds still:
   the intrados is the fitted curve and does not move when the ring thins, and
   an arc fraction does not care how many elements the mesh has.

   What it replaces, and why. Entries used to be keyed to a node NUMBER and
   placed at u = i/nEl. Two things were wrong with that.

   First, a node number is a position in the mesh, not a position on the arch.
   On the MBTA barrel "node 7" is the crown at 12 elements, sits at x = 3.28 ft
   at 16, and reaches the springing by 60 — so refining the mesh walked the
   damage down the arch, and at 20 to 40 elements it put a 0.7 ft section on the
   haunch and the arch failed under its own weight. The dashboard tells the user
   to refine until the rating settles, which made that the expected workflow.

   Second, even at a fixed mesh the placement was off. Nodes are spaced at equal
   AXIS arc length, but the depth profile is sampled at equal INTRADOS arc
   length, and those two parameterizations separate as soon as the depth varies.
   Control points meant to pin the sound depth either side of the loss landed
   slightly inside it, so the neighbours of a deteriorated node came out at
   1.378 ft where 1.420 was intended.

     the taper runs the DEPTH REMOVED, not the full ring depth — a 0.77 ft spall
     in a 1.42 ft ring feathers over 0.77 ft. Being a physical length it does not
     move with the mesh, which is the point; and on the MBTA barrel it lands
     just inside the node spacing, so the neighbours of a crown loss read their
     sound 1.420 ft exactly, where the old u-mapping gave them 1.378. */

      u1=u2=nodeU[i]; xReq1=xReq2=g0.nodes[i].intX; fromNode=true;
    }else if(e.x2!=null){

    /* A station off the structure is an input error, not something to snap to
       the nearest springing. An entry at x = 99 on a 9.7 ft barrel was being
       silently applied at the right springing — the deterioration landed
       somewhere the engineer never named, and the rating moved 14% with no
       indication why. Small overshoot is tolerated because measured spans and

       profile, which is why the two are resolved separately. */

       applies to every node in it. A moment release is a DISCRETE thing at one
       joint and must not be: applying it per node made the number of hinges a
       function of the element count — the 0.1 ft zone in the reference session
       caught one node at 160 elements and two at 192, which is two hinges, a
       different structure, and the rating fell from 2.03 to 0.73 with no input
       having changed. One entry now places exactly one release, at the node
       nearest the centre of the zone, which is mesh-independent. An engineer who
       means three degraded joints enters three rows and can see that they have
       done so — and the mechanism guard can then count them honestly. */
    for(const k of hit){ if(z.fa>0)faN[k]=z.fa; }
    if(z.hinge)hinges[z.node]=1;
    /* PARTIAL RELEASE, derived from the section loss rather than asserted.
       A length L_j of ring whose second moment is reduced from I to I_c adds
       rotational flexibility L_j(1/I_c - 1/I)/E at that point, so the joint
       behaves as a rotational spring of

           k_theta = E I I_c / [ L_j (I - I_c) ]

       This is derivable entirely from things the engineer measures — the sound
       depth, the depth still bearing, and how far along the ring the loss
       extends — with no mortar modulus or bed thickness to guess at. It reduces
       to a rigid joint as I_c approaches I, and to a hinge as I_c approaches
       zero, so it spans the whole range with the two existing options as its
       limits.

       L_j is the zone the engineer entered. For a point entry there is no
       length, so the depth removed is used, which is the same 45-degree logic
       the section taper uses and is a physical dimension rather than a mesh one.

       Be warned by the arithmetic: a narrow joint is stiff. A 1 in wide zone at
       8 of 17 in leaves about 90% of the moment in place, because a short
       reduced length adds little flexibility however deep the loss. That is the
       honest linear-elastic answer and it is why a full hinge remains a separate
       choice — it says the joint has opened, which is a judgement no stiffness
       calculation can make for you. */

         centre. hit[0] was the first node inside the zone, which moves with the
         mesh. */

function buildModelRaw(p){

  }

    const dm=(a.d+b.d)/2, A=dm, I=dm*dm*dm/12;

       Midas includes shear deformation in beam elements by default, deriving the
       shear areas from the section; a solid rectangle gives As = 5A/6. The ring
       here is deep relative to the element length that §7.2.7.2B produces — d/L
       approaching or exceeding one is ordinary — so the difference is real, not
       academic: it moves the springline moment by roughly 2%.
       Evidence: against a Midas run of an exported model, this formulation
       agreed to 0.005 in both moment and thrust ordinates, which is the rounding
       precision of the pasted results; the Bernoulli formulation differed by up
       to 0.045. Bernoulli remains available and is flagged when selected, but
       the default is the one a checker rebuilding the model in Midas will
       reproduce. */

       free node carrying no applied couple the element end moments must sum to
       zero — so releasing the moment at ONE of the two element ends meeting
       there makes the section a true hinge. The release is applied by static
       condensation of that rotational degree of freedom out of the element
