<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Anchor Pro v4.9 - Visual Control</title>
    
    <!-- React Framework -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .calc-line { border-bottom: 1px solid #1e293b; }
        .katex { font-size: 1.05em; color: #e2e8f0; }
        .katex .base { color: #e2e8f0; }
        
        .ref-tooltip { position: relative; cursor: help; }
        .ref-tooltip:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%; right: 0;
            background: #1e293b; color: #94a3b8;
            padding: 4px 8px; font-size: 10px;
            border: 1px solid #475569; rounded: 4px;
            white-space: nowrap; pointer-events: none; z-index: 50;
        }
        .unit-label { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #64748b; pointer-events: none; }
        .input-wrap { position: relative; }
        .input-field { width: 100%; background-color: #1e293b; border: 1px solid #475569; rounded: 4px; padding: 4px 28px 4px 8px; font-size: 14px; color: white; }
        .input-field:focus { outline: none; border-color: #3b82f6; }

        /* Toggle Switch Style */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }

        @media print {
            body { background: white; color: black; height: auto; overflow: visible; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #calc-panel { width: 100%; border: none; height: auto; overflow: visible; position: relative; top: 0; left: 0; }
            .katex { color: black !important; }
            .katex .base { color: black !important; }
            .calc-line { border-color: #ccc; }
            .bg-slate-900 { background-color: white !important; border: 1px solid #ddd !important; color: black !important; }
            .text-slate-200, .text-slate-300 { color: black !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen overflow-hidden font-sans">

<div id="root"></div>

<script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // --- CONSTANTS ---
    const CONSTANTS = { kc: 24, kcp: 2.0 };
    const STEEL_GRADES = {
        "F1554-36": { fut: 58000, fy: 36000 },
        "F1554-55": { fut: 75000, fy: 55000 },
        "F1554-105": { fut: 125000, fy: 105000 },
    };

    const TOOLTIPS = {
        "17.6.1.2": "Nominal Steel Strength in Tension",
        "17.5.3": "Strength Reduction Factors (phi)",
        "17.6.2.2": "Basic Concrete Breakout Strength",
        "17.6.2.3.1": "Modification Factor for Eccentricity",
        "17.6.3.1": "Nominal Pullout Strength",
        "17.6.4.1": "Side-Face Blowout Strength",
        "17.7.1.2": "Nominal Steel Strength in Shear",
        "17.7.2.2": "Basic Concrete Breakout Strength in Shear",
        "17.7.3.1": "Nominal Pryout Strength",
        "App D": "Plate Yield Line Analysis (AISC Design Guide 1)"
    };

    const fmt = (n, d=2) => n?.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) || "0";

    // --- ENGINEERING LOGIC ---

    const distributeLoads = (N, Vx, Vy, Mx, My, numAnchors, sx, sy) => {
        const V_resultant = Math.sqrt(Vx*Vx + Vy*Vy);
        const V_per_bolt = V_resultant / numAnchors; 
        
        const M_res = Math.sqrt(Mx*Mx + My*My);
        const e_prime_N = (N > 0) ? (M_res / N) : 0;

        const anchors = [];
        let N_max_bolt = 0;

        if (numAnchors === 1) {
            anchors.push({ id: 1, x: 0, y: 0, N: N, V: V_per_bolt });
            N_max_bolt = N;
        } else {
            const dx = sx/2; 
            const dy = sy/2;
            const Ix = 4 * dy*dy; 
            const Iy = 4 * dx*dx; 
            
            const pos = [
                { id: 1, x: dx, y: dy },   // TR
                { id: 2, x: -dx, y: dy },  // TL
                { id: 3, x: -dx, y: -dy }, // BL
                { id: 4, x: dx, y: -dy }   // BR
            ];

            pos.forEach(p => {
                const axial = N / 4;
                let N_calc = axial;
                // Add My effect (X-axis arm) - +My puts +X in Tension? Assume +M = Tension at +Coords for viz
                if (p.x > 0) N_calc += (My / (2*sx)); else N_calc -= (My / (2*sx));
                // Add Mx effect (Y-axis arm)
                if (p.y > 0) N_calc += (Mx / (2*sy)); else N_calc -= (Mx / (2*sy));
                
                anchors.push({ id: p.id, x: p.x, y: p.y, N: N_calc, V: V_per_bolt });
            });
            
            // For design check, use max tension regardless of sign convention
            // Conservative: N/4 + |Mx|/2sy + |My|/2sx
            N_max_bolt = (N/4) + (Math.abs(My)/(2*sx)) + (Math.abs(Mx)/(2*sy)); 
        }

        return {
            val: { V_resultant, V_per_bolt, N_max_bolt, e_prime_N, anchors },
            tex: {
                V_res: { eq: `V_{ua} = \\sqrt{V_{ux}^2 + V_{uy}^2}`, res: fmt(V_resultant,0), unit: "lb" },
                N_dist: { eq: numAnchors===4?`N_{max} = \\frac{N}{4} + \\frac{|M_x|}{2s_y} + \\frac{|M_y|}{2s_x}`:`N_{ua,i} = N_{ua}/1`, res: fmt(N_max_bolt,0), unit: "lb" },
                e_prime: { eq: `e'_N = M_{res} / N_{ua}`, res: fmt(e_prime_N, 2), unit: "in" }
            }
        };
    };

    const calculateSteel = (da, gradeKey, N_max_bolt, V_per_bolt, seismic) => {
        const grade = STEEL_GRADES[gradeKey];
        const AseN = 0.7854 * Math.pow(da, 2); 
        const Nsa_single = AseN * grade.fut;
        const phi_steel = 0.75; 
        let phiNsa_single = phi_steel * Nsa_single * (seismic ? 0.75 : 1.0);
        const Vsa_single = 0.6 * AseN * grade.fut;
        const phi_shear_steel = 0.65;
        let phiVsa_single = phi_shear_steel * Vsa_single * (seismic ? 0.75 : 1.0);

        return {
            val: { AseN, phiNsa_single, phiVsa_single, fy: grade.fy },
            tex: {
                Nsa: { eq: `N_{sa} = A_{se,N} f_{ut}`, sub: `${fmt(AseN,3)} \\cdot ${grade.fut}`, res: fmt(Nsa_single,0), unit: "lb" },
                phiNsa: { eq: `\\phi N_{sa}`, sub: `${phi_steel} \\cdot ${fmt(Nsa_single,0)}`, res: fmt(phiNsa_single,0), unit: "lb" },
                Vsa: { eq: `V_{sa} = 0.6 A_{se,N} f_{ut}`, sub: `0.6 \\cdot ${fmt(AseN,3)} \\cdot ${grade.fut}`, res: fmt(Vsa_single,0), unit: "lb" },
                phiVsa: { eq: `\\phi V_{sa}`, sub: `${phi_shear_steel} \\cdot ${fmt(Vsa_single,0)}`, res: fmt(phiVsa_single,0), unit: "lb" }
            }
        };
    };

    const calculateBreakoutTension = (hef, fc, wc, c1, c2, c3, c4, sx, sy, numAnchors, cracked, condB, seismic, e_prime_N) => {
        const lambda = wc >= 135 ? 1.0 : (wc <= 100 ? 0.75 : 0.75 + (wc-100)/35 * 0.25);
        const Nb = CONSTANTS.kc * lambda * Math.sqrt(fc) * Math.pow(hef, 1.5);
        const Anco = 9 * Math.pow(hef, 2);
        const limit = 1.5 * hef;
        const w_x = Math.min(c1, limit) + (numAnchors > 1 ? sx : 0) + Math.min(c3, limit);
        const w_y = Math.min(c2, limit) + (numAnchors > 2 ? sy : 0) + Math.min(c4, limit);
        const Anc = w_x * w_y;
        let psi_ecN = 1.0;
        if (e_prime_N > 0) psi_ecN = 1.0 / (1.0 + (2.0 * e_prime_N) / (3.0 * hef));
        const c_min = Math.min(c1, c2, c3, c4);
        let psi_edN = 1.0;
        if (c_min < 1.5 * hef) psi_edN = 0.7 + 0.3 * (c_min / (1.5 * hef));
        const psi_cN = cracked ? 1.0 : 1.25;
        const Ncb = (Anc / Anco) * psi_edN * psi_cN * psi_ecN * Nb;
        const phi = condB ? 0.70 : 0.75;
        const phiNcb = phi * Ncb * (seismic ? 0.75 : 1.0);

        return {
            val: { Nb, Anc, Ncb, phiNcb, c_min, lambda },
            tex: {
                lambda: { eq: `\\lambda (w_c=${wc})`, res: fmt(lambda, 2), unit: "" },
                Nb: { eq: `N_b = k_c \\lambda \\sqrt{f'_c} h_{ef}^{1.5}`, res: fmt(Nb,0), unit: "lb" },
                Anc: { eq: `A_{Nc}`, sub: `${fmt(w_x,1)} \\times ${fmt(w_y,1)}`, res: fmt(Anc,1), unit: "in²" },
                Ncb: { eq: `N_{cbg} = \\frac{A_{Nc}}{A_{Nco}} \\psi_{ed,N} \\psi_{c,N} \\psi_{ec,N} N_b`, res: fmt(Ncb,0), unit: "lb" },
                phiNcb: { eq: `\\phi N_{cbg}`, res: fmt(phiNcb,0), unit: "lb" }
            }
        };
    };

    const calculatePullout = (fc, da, type, cracked, condB, seismic) => {
        const psi_c_p = cracked ? 1.0 : 1.4;
        let Np = 0, eqStr = "";
        if (type === "hex") { const Abrg = 0.9 * da * da; Np = 8 * Abrg * fc; eqStr = `8 A_{brg} f'_c`; } 
        else { const eh = 3 * da; Np = 0.9 * fc * eh * da; eqStr = `0.9 f'_c e_h d_a`; }
        const Npn = Np * psi_c_p; 
        const phi = condB ? 0.70 : 0.75;
        let phiNpn = phi * Npn * (seismic ? 0.75 : 1.0);
        return { val: { phiNpn }, tex: { Npn: { eq: `N_{pn}`, res: fmt(Npn,0), unit: "lb" }, phiNpn: { eq: `\\phi N_{pn}`, res: fmt(phiNpn,0), unit: "lb" } } };
    };

    const calculateSideFaceBlowout = (hef, c1, c2, c3, c4, fc, da, type, condB, seismic) => {
        const c_min = Math.min(c1, c2, c3, c4);
        const isDeep = hef > 2.5 * c_min;
        const isHeaded = type === "hex";
        if (!isDeep || !isHeaded) return { val: { phiNsb: 999999 }, applicable: false };
        const Abrg = 0.9 * da * da;
        const Nsb = 160 * c_min * Math.sqrt(Abrg) * Math.sqrt(fc);
        const phi = condB ? 0.70 : 0.75;
        let phiNsb = phi * Nsb * (seismic ? 0.75 : 1.0);
        return { val: { phiNsb }, applicable: true, tex: { Nsb: { eq: `N_{sb}`, res: fmt(Nsb,0), unit: "lb" }, phiNsb: { eq: `\\phi N_{sb}`, res: fmt(phiNsb,0), unit: "lb" } } };
    };

    const calculateBreakoutShear = (hef, fc, c1, c2, c3, c4, da, numAnchors, sx, cracked, condB, seismic, Vux, Vuy) => {
        let ca1_shear = c1;
        if (Math.abs(Vux) >= Math.abs(Vuy)) ca1_shear = Vux >= 0 ? c3 : c1; else ca1_shear = Vuy >= 0 ? c4 : c2;
        const le = Math.min(hef, 8*da);
        const Vb = 7 * Math.pow(le/da, 0.2) * Math.sqrt(da) * Math.sqrt(fc) * Math.pow(ca1_shear, 1.5);
        const Avco = 4.5 * Math.pow(ca1_shear, 2);
        const width = (1.5 * ca1_shear) + (numAnchors > 1 ? sx : 0) + (1.5 * ca1_shear); 
        const Avc = width * 1.5 * ca1_shear; 
        const psi_cV = cracked ? 1.0 : 1.4;
        const Vcbg = (Avc / Avco) * psi_cV * Vb; 
        const phi = condB ? 0.70 : 0.75;
        const phiVcbg = phi * Vcbg * (seismic ? 0.75 : 1.0);
        return { val: { Vb, Vcbg, phiVcbg, ca1_shear }, tex: { Vb: { eq: `V_b`, res: fmt(Vb,0), unit: "lb" }, Vcbg: { eq: `V_{cbg}`, res: fmt(Vcbg,0), unit: "lb" }, phiVcbg: { eq: `\\phi V_{cbg}`, res: fmt(phiVcbg,0), unit: "lb" } } };
    };

    const calculateBasePlate = (N_max, lx, fy, t_actual) => {
        if (N_max <= 0) return { val: {dcr:0}, tex: { eq: "N \\le 0", res: "OK" } };
        const beff = 4; const phi = 0.9;
        const treq = Math.sqrt( (4 * N_max * lx) / (phi * fy * beff) );
        const dcr = treq / t_actual;
        return { val: { treq, dcr }, tex: { treq: { eq: `t_{req}`, res: fmt(treq, 3), unit: "in" } } };
    };

    const calculatePryout = (Ncb_val, hef, condB, seismic) => {
        const kcp = hef >= 2.5 ? 2.0 : 1.0; const Vcp = kcp * Ncb_val;
        const phi = condB ? 0.70 : 0.75; let phiVcp = phi * Vcp * (seismic ? 0.75 : 1.0);
        return { val: { phiVcp }, tex: { phiVcp: { eq: `\\phi V_{cp}`, res: fmt(phiVcp,0), unit: "lb" } } };
    };

    // --- COMPONENTS ---
    
    const Latex = ({ children }) => {
        const ref = useRef();
        useEffect(() => {
            if(ref.current && window.katex) {
                const str = Array.isArray(children) ? children.join('') : String(children || '');
                try { window.katex.render(str, ref.current, {throwOnError:false}); } catch(e){}
            }
        }, [children]);
        return <span ref={ref} className="font-serif text-[1.1em]" />;
    };

    const EquationLine = ({ label, tex, refCode }) => (
        <div className="calc-line py-2">
            <div className="flex justify-between text-sm mb-1">
                <span className="text-slate-300 font-medium">{label}</span>
                {refCode && <span className="text-[10px] text-blue-500 font-mono ref-tooltip" data-tip={TOOLTIPS[refCode] || "ACI Reference"}>[{refCode}]</span>}
            </div>
            <div className="pl-2 border-l-2 border-slate-600">
                {tex.eq && <div className="overflow-x-auto"><Latex>{tex.eq}</Latex> {tex.sub && <><span className="mx-1 text-slate-500">=</span> <Latex>{tex.sub}</Latex></>}</div>}
                {tex.res && <div className="text-right font-bold text-slate-200 mt-1 text-lg">= {tex.res} <span className="text-xs font-normal text-slate-500">{tex.unit}</span></div>}
            </div>
        </div>
    );

    const CalcBox = ({ title, data }) => {
        const [isOpen, setIsOpen] = useState(true);
        return (
            <div className="mb-4 border border-slate-700 rounded bg-slate-800/50 overflow-hidden print-no-border">
                <div onClick={() => setIsOpen(!isOpen)} className="px-4 py-2 bg-slate-800 flex justify-between cursor-pointer hover:bg-slate-700 print-header">
                    <h3 className="font-bold text-blue-400">{title}</h3>
                    <span className="no-print">{isOpen ? '▼' : '▶'}</span>
                </div>
                {isOpen && <div className="p-4 space-y-3">{data}</div>}
            </div>
        );
    };

    const AnchorTable = ({ anchors, N_max }) => (
        <div className="overflow-x-auto">
            <table className="w-full text-xs text-left border-collapse">
                <thead>
                    <tr className="text-slate-400 border-b border-slate-600">
                        <th className="py-1">ID</th>
                        <th className="py-1">Pos (in)</th>
                        <th className="py-1 text-right">Tens (lb)</th>
                        <th className="py-1 text-right">Shear (lb)</th>
                    </tr>
                </thead>
                <tbody>
                    {anchors.map(a => (
                        <tr key={a.id} className={`border-b border-slate-700/50 ${Math.abs(a.N - N_max) < 1 ? 'bg-red-900/20' : ''}`}>
                            <td className="py-1 font-bold text-slate-300">{a.id}</td>
                            <td className="py-1 text-slate-500">({fmt(a.x,1)}, {fmt(a.y,1)})</td>
                            <td className={`py-1 text-right font-mono ${Math.abs(a.N - N_max) < 1 ? 'text-red-400 font-bold' : 'text-slate-300'}`}>{fmt(a.N, 0)}</td>
                            <td className="py-1 text-right font-mono text-slate-300">{fmt(a.V, 0)}</td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );

    const InputRow = ({ label, value, onChange, unit, help }) => (
        <div className="mb-2">
            <div className="flex justify-between text-xs text-slate-400 mb-1"><span>{label}</span>{help && <span className="text-[9px] text-slate-500">{help}</span>}</div>
            <div className="input-wrap"><input type="number" value={value} onChange={e => onChange(parseFloat(e.target.value))} className="input-field" /><span className="unit-label">{unit}</span></div>
        </div>
    );

    const Toggle = ({ label, active, toggle }) => (
        <div className="flex items-center gap-2 cursor-pointer" onClick={toggle}>
            <div className={`w-3 h-3 border border-slate-500 rounded-sm ${active ? 'bg-blue-500 border-blue-500' : 'bg-transparent'}`}></div>
            <span className={`text-xs ${active ? 'text-white' : 'text-slate-500'}`}>{label}</span>
        </div>
    );

    // --- VISUALIZATION ---
    const Visualization = ({ inputs, results }) => {
        const [view, setView] = useState({ shear: true, moment: true, axial: true, reactions: false, dims: true });
        
        const { c1, c2, c3, c4, sx, sy, hef, da, numAnchors, Vux, Vuy, Mux, Muy, Nua } = inputs;
        const anchors = results.loads.val.anchors;
        
        const scale = 8; 
        const W=600, H=400, cx=300, cy=200;
        const gx = (numAnchors>1 ? sx/2 : 0);
        const gy = (numAnchors>1 ? sy/2 : 0);
        const slabL = cx - (gx + c1)*scale;
        const slabR = cx + (gx + c3)*scale;
        const slabT = cy - (gy + c2)*scale;
        const slabB = cy + (gy + c4)*scale;
        const cone = 1.5 * hef * scale;
        const coneL = Math.max(slabL, cx - gx*scale - cone);
        const coneR = Math.min(slabR, cx + gx*scale + cone);
        const coneT = Math.max(slabT, cy - gy*scale - cone);
        const coneB = Math.min(slabB, cy + gy*scale + cone);
        
        const mag = Math.sqrt(Vux*Vux + Vuy*Vuy);
        const angle = Math.atan2(Vuy, Vux) * 180 / Math.PI;

        return (
            <div className="w-full h-full relative bg-slate-950 overflow-hidden border-b border-slate-800">
                {/* VIEW CONTROL */}
                <div className="absolute top-4 left-4 z-20 bg-slate-900/90 border border-slate-700 p-2 rounded shadow-lg space-y-1">
                    <div className="text-[10px] font-bold text-slate-400 mb-1 uppercase">View Controls</div>
                    <Toggle label="Shear Vectors (V)" active={view.shear} toggle={()=>setView(p=>({...p, shear:!p.shear}))} />
                    <Toggle label="Moment Vectors (M)" active={view.moment} toggle={()=>setView(p=>({...p, moment:!p.moment}))} />
                    <Toggle label="Axial Load (N)" active={view.axial} toggle={()=>setView(p=>({...p, axial:!p.axial}))} />
                    <Toggle label="Reactions (R)" active={view.reactions} toggle={()=>setView(p=>({...p, reactions:!p.reactions}))} />
                    <Toggle label="Dimensions" active={view.dims} toggle={()=>setView(p=>({...p, dims:!p.dims}))} />
                </div>

                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" /></pattern>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#facc15" /></marker>
                        <marker id="arrow-dbl" markerWidth="12" markerHeight="10" refX="6" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,5 L4,2 L4,8 Z M12,5 L8,2 L8,8 Z" fill="#a855f7" /></marker>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#grid)" />
                    
                    <path d={`M ${slabL} ${slabT} L ${slabR} ${slabT} L ${slabR} ${slabB} L ${slabL} ${slabB} Z`} fill="#334155" stroke="#94a3b8" strokeWidth="2" opacity="0.5" />
                    <rect x={coneL} y={coneT} width={Math.max(0, coneR-coneL)} height={Math.max(0, coneB-coneT)} fill={results.interaction > 1.2 ? "rgba(239,68,68,0.2)" : "rgba(16,185,129,0.2)"} stroke={results.interaction > 1.2 ? "#ef4444" : "#10b981"} strokeDasharray="4,4" />
                    
                    {/* Axes */}
                    <line x1={0} y1={cy} x2={W} y2={cy} stroke="cyan" strokeWidth="1" strokeDasharray="5,5" opacity="0.3" />
                    <line x1={cx} y1={0} x2={cx} y2={H} stroke="cyan" strokeWidth="1" strokeDasharray="5,5" opacity="0.3" />

                    {anchors.map((p) => (
                        <g key={p.id}>
                            <circle cx={cx + p.x*scale} cy={cy - p.y*scale} r={da*scale*0.8} fill="#3b82f6" stroke="white" />
                            {view.reactions && Math.abs(p.N) > 10 && (
                                <circle cx={cx + p.x*scale} cy={cy - p.y*scale} r={Math.min(Math.abs(p.N)/500, 20)} fill={p.N>0?"#ef4444":"#3b82f6"} opacity="0.6" />
                            )}
                            <text x={cx + p.x*scale} y={cy - p.y*scale + 20} fill="white" fontSize="10" textAnchor="middle">{p.id}</text>
                        </g>
                    ))}

                    {/* SHEAR */}
                    {view.shear && mag > 0 && (
                        <g transform={`translate(${cx}, ${cy}) rotate(${angle})`}>
                            <line x1="0" y1="0" x2={Math.min(mag/50, 80)} y2="0" stroke="#facc15" strokeWidth="3" markerEnd="url(#arrow)" />
                            <text x={Math.min(mag/50, 80)+10} y="0" fill="#facc15" fontSize="12" fontWeight="bold" transform={`rotate(${-angle})`}>V={fmt(mag,0)}</text>
                        </g>
                    )}
                    {view.shear && (Math.abs(Vux)>0 || Math.abs(Vuy)>0) && (
                        <g opacity="0.3">
                            {Math.abs(Vux)>0 && <line x1={cx} y1={cy} x2={cx+Vux/50} y2={cy} stroke="#facc15" strokeWidth="1" />}
                            {Math.abs(Vuy)>0 && <line x1={cx} y1={cy} x2={cx} y2={cy+Vuy/50} stroke="#facc15" strokeWidth="1" />}
                        </g>
                    )}

                    {/* MOMENT */}
                    {view.moment && Math.abs(Mux) > 0 && (
                        <g>
                            <line x1={cx-slabL > 50 ? slabL+10 : cx-50} y1={cy} x2={cx+50} y2={cy} stroke="#a855f7" strokeWidth="3" markerEnd="url(#arrow-dbl)" markerStart="url(#arrow-dbl)" />
                            <text x={cx+55} y={cy-5} fill="#a855f7" fontSize="10" fontWeight="bold">Mux={fmt(Mux,0)}</text>
                        </g>
                    )}
                    {view.moment && Math.abs(Muy) > 0 && (
                        <g>
                            <line x1={cx} y1={cy-50} x2={cx} y2={cy+50} stroke="#a855f7" strokeWidth="3" markerEnd="url(#arrow-dbl)" markerStart="url(#arrow-dbl)" />
                            <text x={cx+5} y={cy+60} fill="#a855f7" fontSize="10" fontWeight="bold">Muy={fmt(Muy,0)}</text>
                        </g>
                    )}

                    {/* AXIAL */}
                    {view.axial && (
                        <text x={cx+5} y={cy+15} fill="white" fontSize="10" fontWeight="bold">N={fmt(Nua,0)}</text>
                    )}

                    {/* DIMS */}
                    {view.dims && (
                        <g opacity="0.7">
                            <text x={slabL+5} y={cy} fill="#94a3b8" fontSize="10" dominantBaseline="middle">c1: {c1}"</text>
                            <text x={slabR-5} y={cy} fill="#94a3b8" fontSize="10" textAnchor="end" dominantBaseline="middle">c3: {c3}"</text>
                            <text x={cx} y={slabT+10} fill="#94a3b8" fontSize="10" textAnchor="middle">c2: {c2}"</text>
                            <text x={cx} y={slabB-5} fill="#94a3b8" fontSize="10" textAnchor="middle">c4: {c4}"</text>
                        </g>
                    )}
                </svg>
            </div>
        );
    };

    // --- MAIN APP ---

    const App = () => {
        const [project, setProject] = useState({ name: "Bridge A", job: "23-001", eng: "JD" });
        const [inputs, setInputs] = useState({
            fc: 4000, wc: 150, cracked: true, condB: true, seismic: false,
            hef: 6.0, 
            c1: 12.0, c2: 12.0, c3: 12.0, c4: 12.0, 
            numAnchors: 4, sx: 6.0, sy: 6.0,
            da: 0.75, grade: "F1554-36", type: "hex",
            Nua: 5000, Vux: 2000, Vuy: 0, Mux: 1000, Muy: 0,
            plateT: 0.5, plateLx: 2.0
        });
        const [reportMode, setReportMode] = useState(false);

        const update = (k, v) => setInputs(p => ({...p, [k]: v}));
        const updateProj = (k, v) => setProject(p => ({...p, [k]: v}));

        const setPreset = (type) => {
            if(type === 'center') setInputs(p => ({...p, c1:24, c2:24, c3:24, c4:24}));
            if(type === 'edge')   setInputs(p => ({...p, c1:6, c2:24, c3:24, c4:24}));
            if(type === 'corner') setInputs(p => ({...p, c1:6, c2:6, c3:24, c4:24}));
        };

        const handleSave = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({project, inputs}));
            const a = document.createElement('a'); a.href = dataStr; a.download = "anchor.json"; a.click();
        };
        const handleLoad = (e) => {
            const fr = new FileReader();
            fr.onload = e => { const d = JSON.parse(e.target.result); setProject(d.project); setInputs(d.inputs); };
            fr.readAsText(e.target.files[0]);
        };

        const res = useMemo(() => {
            const { da, grade, type, numAnchors, hef, fc, wc, c1, c2, c3, c4, sx, sy, cracked, condB, seismic, Nua, Vux, Vuy, Mux, Muy, plateT, plateLx } = inputs;
            
            const loads = distributeLoads(Nua, Vux, Vuy, Mux, Muy, numAnchors, sx, sy);
            const steel = calculateSteel(da, grade, loads.val.N_max_bolt, loads.val.V_per_bolt, seismic);
            const tBreak = calculateBreakoutTension(hef, fc, wc, c1, c2, c3, c4, sx, sy, numAnchors, cracked, condB, seismic, loads.val.e_prime_N);
            const pullout = calculatePullout(fc, da, type, cracked, condB, seismic);
            const blowout = calculateSideFaceBlowout(hef, c1, c2, c3, c4, fc, da, type, condB, seismic);
            const sBreak = calculateBreakoutShear(hef, fc, c1, c2, c3, c4, da, numAnchors, sx, cracked, condB, seismic, Vux, Vuy);
            const pryout = calculatePryout(tBreak.val.Ncb, hef, condB, seismic);
            const plate = calculateBasePlate(loads.val.N_max_bolt, plateLx, steel.val.fy, plateT);

            const utilN = Math.max(loads.val.N_max_bolt/steel.val.phiNsa_single, Nua/tBreak.val.phiNcb, loads.val.N_max_bolt/pullout.val.phiNpn, blowout.applicable ? loads.val.N_max_bolt/blowout.val.phiNsb : 0);
            const utilV = Math.max(loads.val.V_per_bolt/steel.val.phiVsa_single, loads.val.V_resultant/sBreak.val.phiVcbg, loads.val.V_resultant/pryout.val.phiVcp);
            const interaction = utilN + utilV;

            return { loads, steel, tBreak, pullout, blowout, sBreak, pryout, plate, utilN, utilV, interaction };
        }, [inputs]);

        return (
            <div className="flex h-screen w-full bg-slate-900 text-slate-200 font-sans overflow-hidden">
                
                {/* LEFT PANEL: INPUTS */}
                <div className={`w-80 bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto ${reportMode?'hidden':''}`}>
                    <div className="p-4 border-b border-slate-800 sticky top-0 bg-slate-900 z-10">
                        <div className="flex justify-between items-center mb-2">
                            <h1 className="font-black text-xl text-white">ANCHOR PRO <span className="text-blue-500">v4.9</span></h1>
                            <div className="flex gap-1">
                                <button onClick={handleSave} className="text-xs bg-slate-700 p-1 rounded hover:bg-blue-600">💾</button>
                                <label className="text-xs bg-slate-700 p-1 rounded cursor-pointer hover:bg-blue-600">📂<input type="file" className="hidden" onChange={handleLoad}/></label>
                            </div>
                        </div>
                        <input value={project.name} onChange={e=>updateProj('name',e.target.value)} className="w-full bg-slate-800 text-xs border-b border-slate-600 pb-1 mb-1 placeholder-slate-500" placeholder="Project Name"/>
                        <div className="flex gap-2">
                            <input value={project.job} onChange={e=>updateProj('job',e.target.value)} className="w-1/2 bg-slate-800 text-xs border-b border-slate-600 pb-1 placeholder-slate-500" placeholder="Job #"/>
                            <input value={project.eng} onChange={e=>updateProj('eng',e.target.value)} className="w-1/2 bg-slate-800 text-xs border-b border-slate-600 pb-1 placeholder-slate-500" placeholder="Eng"/>
                        </div>
                    </div>
                    
                    <div className="p-4 space-y-6">
                        {/* 1. SYSTEM */}
                        <div className="space-y-2">
                            <h2 className="text-xs font-bold text-slate-500 border-b border-slate-700 pb-1">1. SYSTEM</h2>
                            <div className="flex gap-1">
                                <button onClick={()=>setPreset('center')} className="flex-1 py-1 bg-slate-800 border border-slate-600 text-[10px] rounded hover:bg-slate-700">CENTER</button>
                                <button onClick={()=>setPreset('edge')} className="flex-1 py-1 bg-slate-800 border border-slate-600 text-[10px] rounded hover:bg-slate-700">EDGE</button>
                                <button onClick={()=>setPreset('corner')} className="flex-1 py-1 bg-slate-800 border border-slate-600 text-[10px] rounded hover:bg-slate-700">CORNER</button>
                            </div>
                            <div className="flex gap-1">
                                <button onClick={()=>update('numAnchors', 1)} className={`flex-1 py-1 text-[10px] border rounded ${inputs.numAnchors===1?'bg-blue-600 border-blue-500':'bg-slate-800 border-slate-600'}`}>SINGLE</button>
                                <button onClick={()=>update('numAnchors', 4)} className={`flex-1 py-1 text-[10px] border rounded ${inputs.numAnchors===4?'bg-blue-600 border-blue-500':'bg-slate-800 border-slate-600'}`}>GROUP</button>
                            </div>
                            <div className="flex gap-1">
                                <button onClick={()=>update('type','hex')} className={`flex-1 py-1 text-[10px] border rounded ${inputs.type==='hex'?'bg-slate-600 border-slate-500':'bg-slate-800 border-slate-700'}`}>HEX</button>
                                <button onClick={()=>update('type','hook')} className={`flex-1 py-1 text-[10px] border rounded ${inputs.type==='hook'?'bg-slate-600 border-slate-500':'bg-slate-800 border-slate-700'}`}>L-BOLT</button>
                            </div>
                            <label className="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" checked={inputs.seismic} onChange={e=>update('seismic',e.target.checked)}/> Seismic (0.75)</label>
                            <label className="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" checked={inputs.conditionB} onChange={e=>update('conditionB',e.target.checked)}/> Cond. B (No Reinf)</label>
                        </div>

                        {/* 2. GEOMETRY */}
                        <div className="space-y-2">
                            <h2 className="text-xs font-bold text-slate-500 border-b border-slate-700 pb-1">2. GEOMETRY</h2>
                            <InputRow label="Embedment (hef)" value={inputs.hef} onChange={v=>update('hef',v)} unit="in" />
                            <div className="grid grid-cols-2 gap-2">
                                <InputRow label="Left (c1)" value={inputs.c1} onChange={v=>update('c1',v)} unit="in" />
                                <InputRow label="Right (c3)" value={inputs.c3} onChange={v=>update('c3',v)} unit="in" />
                                <InputRow label="Top (c2)" value={inputs.c2} onChange={v=>update('c2',v)} unit="in" />
                                <InputRow label="Bottom (c4)" value={inputs.c4} onChange={v=>update('c4',v)} unit="in" />
                            </div>
                            {inputs.numAnchors === 4 && (
                                <div className="grid grid-cols-2 gap-2 bg-slate-800/50 p-2 rounded border border-slate-700 mt-2">
                                    <InputRow label="Spacing X" value={inputs.sx} onChange={v=>update('sx',v)} unit="in" />
                                    <InputRow label="Spacing Y" value={inputs.sy} onChange={v=>update('sy',v)} unit="in" />
                                </div>
                            )}
                        </div>

                        {/* 3. MEMBER */}
                        <div className="space-y-2">
                            <h2 className="text-xs font-bold text-slate-500 border-b border-slate-700 pb-1">3. MEMBER & ANCHOR</h2>
                            <div className="grid grid-cols-2 gap-2">
                                <InputRow label="Conc. f'c" value={inputs.fc} onChange={v=>update('fc',v)} unit="psi" />
                                <InputRow label="Density wc" value={inputs.wc} onChange={v=>update('wc',v)} unit="pcf" />
                            </div>
                            <div className="mb-2">
                                <label className="text-xs text-slate-400">Diameter</label>
                                <select value={inputs.da} onChange={e=>update('da',parseFloat(e.target.value))} className="input-field mt-1">
                                    <option value="0.5">1/2"</option>
                                    <option value="0.625">5/8"</option>
                                    <option value="0.75">3/4"</option>
                                    <option value="1.0">1.0"</option>
                                </select>
                            </div>
                            <div className="p-2 border border-slate-700 rounded bg-slate-800/30">
                                <div className="text-[10px] font-bold text-slate-500 mb-2">BASE PLATE CHECK</div>
                                <div className="grid grid-cols-2 gap-2">
                                    <InputRow label="Thick (t)" value={inputs.plateT} onChange={v=>update('plateT',v)} unit="in" />
                                    <InputRow label="Cantilever (lx)" value={inputs.plateLx} onChange={v=>update('plateLx',v)} unit="in" />
                                </div>
                            </div>
                        </div>
                        
                        {/* 4. LOADS */}
                         <div className="space-y-2">
                            <h2 className="text-xs font-bold text-slate-500 border-b border-slate-700 pb-1">4. FACTORED LOADS</h2>
                            <InputRow label="Tension (Nua)" value={inputs.Nua} onChange={v=>update('Nua',v)} unit="lb" />
                            <div className="grid grid-cols-2 gap-2">
                                <InputRow label="Shear X (Vux)" value={inputs.Vux} onChange={v=>update('Vux',v)} unit="lb" />
                                <InputRow label="Shear Y (Vuy)" value={inputs.Vuy} onChange={v=>update('Vuy',v)} unit="lb" />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <InputRow label="Moment X (Mux)" value={inputs.Mux} onChange={v=>update('Mux',v)} unit="lb-in" />
                                <InputRow label="Moment Y (Muy)" value={inputs.Muy} onChange={v=>update('Muy',v)} unit="lb-in" />
                            </div>
                        </div>
                    </div>
                </div>

                {/* CENTER VISUALIZATION */}
                <div className={`flex-1 bg-black flex flex-col ${reportMode?'hidden':''}`}>
                    <Visualization inputs={inputs} results={res} />
                    <div className="p-4 bg-slate-900 text-center relative z-10 border-t border-slate-800">
                        <div className="inline-block px-6 py-2 bg-slate-800 rounded border border-slate-700 shadow-xl">
                             <div className="text-xs text-slate-400 uppercase tracking-widest mb-1">Interaction Ratio</div>
                             <div className="text-3xl font-black flex gap-2 items-baseline justify-center font-mono">
                                <span className={res.utilN > 1 ? "text-red-500" : "text-slate-300"}>{fmt(res.utilN,2)}</span>
                                <span className="text-slate-600 text-lg">+</span>
                                <span className={res.utilV > 1 ? "text-red-500" : "text-slate-300"}>{fmt(res.utilV,2)}</span>
                                <span className="text-slate-600 text-lg">=</span>
                                <span className={res.interaction>1.2?"text-red-500":"text-emerald-400"}>{fmt(res.interaction,2)}</span>
                             </div>
                             <div className="text-[10px] mt-1 text-slate-500">Limit: 1.2</div>
                        </div>
                        <button onClick={()=>setReportMode(true)} className="ml-6 px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded text-sm font-bold text-white shadow-lg transition-colors">VIEW REPORT</button>
                    </div>
                </div>

                {/* RIGHT / REPORT PANEL */}
                <div id="calc-panel" className={`${reportMode?'w-full':'w-[450px]'} bg-slate-800 border-l border-slate-700 overflow-y-auto flex-shrink-0`}>
                    <div className={`p-8 ${reportMode?'max-w-4xl mx-auto':''}`}>
                        {reportMode && <button onClick={()=>setReportMode(false)} className="mb-6 text-xs bg-slate-700 text-slate-300 px-3 py-2 rounded no-print hover:bg-slate-600">← BACK TO EDIT</button>}
                        
                        <div className="mb-8 border-b border-slate-600 pb-4 flex justify-between items-end">
                            <div>
                                <h1 className="text-2xl font-bold font-serif text-white">{project.name || "Untitled Project"}</h1>
                                <div className="text-sm text-slate-400 mt-1">Job: {project.job} | Eng: {project.eng}</div>
                            </div>
                            <div className="text-right text-xs text-slate-500">
                                <div>{new Date().toLocaleDateString()}</div>
                                <div>ACI 318-19 Ch. 17</div>
                            </div>
                        </div>

                        <div className="space-y-8">
                            <div>
                                <h3 className="text-blue-400 font-bold border-b border-slate-600 mb-4 pb-1 uppercase tracking-wider text-sm">1. Tension Design</h3>
                                
                                <CalcBox title="Load Distribution" data={
                                    <>
                                        <EquationLine label="Max Bolt Tension" tex={res.loads.tex.N_dist}/>
                                        {inputs.numAnchors === 4 && <div className="mt-2">
                                            <div className="text-xs text-slate-400 mb-1 font-bold">Individual Anchor Forces:</div>
                                            <AnchorTable anchors={res.loads.val.anchors} N_max={res.loads.val.N_max_bolt} />
                                        </div>}
                                    </>
                                } />

                                <CalcBox title="Steel & Pullout" data={<>
                                    <EquationLine label="Steel Strength" tex={res.steel.tex.phiNsa} refCode="17.6.1.2"/>
                                    <EquationLine label="Pullout Strength" tex={res.pullout.tex.phiNpn} refCode="17.6.3.1"/>
                                </>} />
                                <CalcBox title="Concrete Breakout" data={<>
                                    <EquationLine label="Basic Strength" tex={res.tBreak.tex.Nb} refCode="17.6.2.2"/>
                                    <EquationLine label="Projected Area" tex={res.tBreak.tex.Anc} refCode="17.6.2.1"/>
                                    <EquationLine label="Breakout Strength" tex={res.tBreak.tex.phiNcb} refCode="17.6.2.1"/>
                                </>} />
                                {res.blowout.applicable && <CalcBox title="Side-Face Blowout" data={<>
                                    <EquationLine label="Blowout Strength" tex={res.blowout.tex.phiNsb} refCode="17.6.4.1"/>
                                </>} />}
                            </div>

                            <div>
                                <h3 className="text-blue-400 font-bold border-b border-slate-600 mb-4 pb-1 uppercase tracking-wider text-sm">2. Shear Design</h3>
                                <CalcBox title="Steel & Pryout" data={<>
                                    <EquationLine label="Steel Shear" tex={res.steel.tex.phiVsa} refCode="17.7.1.2"/>
                                    <EquationLine label="Pryout" tex={res.pryout.tex.phiVcp} refCode="17.7.3.1"/>
                                </>} />
                                <CalcBox title="Concrete Breakout" data={<>
                                    <EquationLine label="Basic Shear" tex={res.sBreak.tex.Vb} refCode="17.7.2.2"/>
                                    <EquationLine label="Shear Capacity" tex={res.sBreak.tex.phiVcbg} refCode="17.7.2.1"/>
                                </>} />
                            </div>

                            <div>
                                <h3 className="text-blue-400 font-bold border-b border-slate-600 mb-4 pb-1 uppercase tracking-wider text-sm">3. Checks</h3>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div className="bg-slate-900 p-3 rounded border border-slate-700">
                                        <div className="text-xs text-slate-500 mb-1">Base Plate t_req</div>
                                        <div className="font-mono text-lg">{res.plate.tex.treq.res} <span className="text-xs text-slate-500">in</span></div>
                                        <div className={`text-xs font-bold mt-1 ${res.plate.val.dcr>1?'text-red-500':'text-emerald-500'}`}>
                                            DCR: {fmt(res.plate.val.dcr,2)}
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-3 rounded border border-slate-700">
                                        <div className="text-xs text-slate-500 mb-1">Min Edge Dist</div>
                                        <div className="font-mono text-lg">{fmt(res.tBreak.val.c_min, 2)} <span className="text-xs text-slate-500">in</span></div>
                                        <div className="text-xs text-slate-500 mt-1">Actual</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {reportMode && <button onClick={()=>window.print()} className="mt-8 w-full py-4 bg-slate-700 font-bold no-print hover:bg-slate-600 text-white rounded shadow-lg">PRINT TO PDF</button>}
                    </div>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
