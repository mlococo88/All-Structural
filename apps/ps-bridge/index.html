<!-- PS Bridge, the Prestressed Bridge Design rebuild (docs/ps-bridge-plan.md; engineer decisions PS-1 to PS-14, 2026-11-12). Built like the
     Steel Bridge app (apps/steel-bridge/): plain HTML/JS/CSS, classic scripts, opens from file://, relative paths only.
     Engine: engine/*.js (no DOM). Report: report/*.js. UI: ui/*.js. Saved data: localStorage keys psb2.* only (engine/model.js).
     PR 1 (skeleton): the shell, the input and output tabs with placeholders, the project model (psb2.project v1). PR 2a: the old app's
     engine moved in unchanged (engine/pbd-*.js) and the project's base design (model base). PR 2b: the input tabs wired to base (one design
     girder, engine/design.js) with the input checks (engine/inputcheck.js, ui/inputcheck.js); the Section properties, Loads & LLDF and
     Analysis tabs. PR 2c-1: the Losses and Stresses tabs, the strand-pattern graphic, the check chips of their checks. PR 2c-2: the
     Flexure and Shear tabs and their chips. PR 2d-1: the End zone & hold-down and Camber & deflection tabs and their chips. PR 2d-2: the
     Handling, Deck and Rating tabs and their chips. PR 2d-3: the PS-10 hold-down check for AASHTO / RIDOT (engine/holddown.js). PR 2e:
     the Report tab (report/*.js on shared/report.js: every result tab's cards and worked steps, the check summary, the assumptions). PR 2f:
     "From the old app" on the Project tab (engine/legacy.js, ui/legacy.js): the old app's saved designs read (never written) and imported.
     PR 3a-1: the bridge level, girder types on the girder lines of each span (engine/bridge.js, ui/types.js; PS-8). PR 3a-2: every type
     checked on every line (the check summary, the Summary tab's table, the Report's §1); unequal bays and different end skews. PR 3a-3:
     DC2 and DW distributed to each girder line by the Steel Bridge app's method (engine/bridge-dl.js, ui/bridgedl.js; §4). PR 3a-4: an
     imported old bridge model's other designs restored as girder types (engine/legacy.js restore, PS-17). PR 3b: the Summary tab
     (ui/summary.js: verdict, girder × span grid, type × check-group table, weights, links to the worked steps) and the run of every type
     × line in chunks with Stop / Run all / Re-run all.
     The old Prestressed Bridge Design.html stays the working tool. -->

<style>

  /* layout: copied from BasePlateAnchorDesigner.html (tokens, #app, #hdr, #main, the two scrolling panels, tabs, cards) */
  :root{
    --navy-900:#16304F; --navy-800:#1E3A5F; --blue-600:#2563EB;
    --green-600:#059669; --red-600:#DC2626; --amber-700:#B45309;
    --slate-50:#F8FAFC; --slate-100:#F1F3F5; --slate-200:#E4E7EB; --slate-400:#94A3B8; --slate-900:#0F172A;
    --color-primary:var(--navy-800); --color-secondary:var(--blue-600); --color-ring:var(--blue-600);
    --color-bg:var(--slate-50); --color-surface:#ffffff; --color-border:var(--slate-200); --color-fg:var(--slate-900);
    --ink:var(--slate-900); --paper:#ffffff; --line:var(--slate-200); --accent:var(--navy-800); --pass:var(--green-600); --fail:var(--red-600); --warn:var(--amber-700);

  html,body{height:100%;margin:0;}
  body{font-family:var(--font-doc);font-size:10pt;color:var(--ink);background:#efede8;}
  #app{max-width:none;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 12px rgba(0,0,0,.12);}
  html,body{overflow:hidden;}
  #hdr{flex:0 0 auto;border-bottom:3px solid var(--navy-900);padding:9px 14px 8px;background:var(--color-primary);color:#fff;z-index:20;}
  #hdr .titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  #hdr h1{font-size:15pt;margin:0;letter-spacing:.4px;font-family:var(--font-ui);font-weight:600;color:#fff;}
  #hdr .byline{font-size:9pt;color:#C7D4E4;margin-top:1px;font-family:var(--font-ui);}
  #hdrBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  #hdrUR{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;}
  #hdr .allToolsLink{font-size:8.5pt;color:#C7D4E4;text-decoration:none;font-family:var(--font-ui);}
  #hdr .allToolsLink:hover{color:#fff;text-decoration:underline;}
  #main{flex:1 1 auto;display:flex;min-height:0;}
  #inputPanel{flex:0 0 calc(100% * var(--sbIn,.33));max-width:calc(100% * var(--sbIn,.33));border-right:1px solid var(--color-border);overflow-y:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--color-bg);padding:10px 12px 60px;font-family:var(--font-ui);font-size:9.5pt;}
  #outputPanel{flex:1 1 67%;min-width:0;overflow-y:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 80px;background:var(--paper);}
  @media screen and (max-width:899.98px){
    html,body{overflow:visible;height:auto;}
    #app{height:auto;min-height:100vh;}
    #main{flex-direction:column;}
    #inputPanel{flex:none;max-width:none;border-right:none;border-bottom:2px solid var(--ink);overflow:visible;padding-bottom:16px;}
    #outputPanel{flex:none;overflow:visible;}
    .inTabs{top:0;}
    /* QAP (2026-11-09): on a phone the Report's and the Drawings' drop-downs (width:auto: as wide as their longest choice, up to 454 px) fit the
       screen; the Report tab no longer scrolls the page 91 px sideways (display only) */
    #out .rp-bar select,#out .dwg-bar select{max-width:calc(100vw - 48px);}
  }
  .inTabs{position:sticky;top:-10px;z-index:12;display:flex;flex-wrap:wrap;gap:2px;margin:-10px -12px 0;padding:8px 12px 0;background:var(--color-bg);border-bottom:2px solid var(--ink);}
  .inTabs button,#tabBar button{border:1px solid var(--color-border);border-bottom:none;border-radius:6px 6px 0 0;font-size:9pt;font-family:var(--font-ui);padding:5px 10px;background:var(--slate-100);color:#475569;}
  .inTabs button[aria-selected="true"],#tabBar button[aria-selected="true"]{background:var(--paper);font-weight:600;color:var(--color-primary);box-shadow:inset 0 3px 0 var(--color-secondary);}

  #autoBar .spin{display:inline-block;width:12px;height:12px;border:2px solid #CBD5E1;border-top-color:var(--color-primary);border-radius:50%;animation:sbspin .8s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes sbspin{to{transform:rotate(360deg);}} @media (prefers-reduced-motion:reduce){#autoBar .spin{animation:none;}}

  button:hover{background:var(--slate-100);border-color:var(--slate-400);}

  table.tbl td input{width:62px;font-size:9pt;padding:1px 3px;text-align:right;}
  table.tbl tr.sel{background:#eef4fb;}
  .tscroll{overflow-x:auto;}

  .alert{border:1px solid var(--color-border);border-left:4px solid var(--warn);background:#FFFBEB;padding:6px 9px;margin:8px 0;font-family:var(--font-ui);font-size:9pt;}

  .stale{display:flex;align-items:center;gap:10px;}
  .alert[hidden]{display:none;}
  .srcBar{border:1px solid var(--color-border);border-left:4px solid var(--pass);background:#F0FDF4;padding:5px 9px;margin:4px 0 8px;font-family:var(--font-ui);font-size:9.5pt;} .srcBar.ex{border-left-color:var(--accent);background:#EFF6FF;} .srcBar.warn{border-left-color:var(--warn);background:#FFFBEB;} .srcBar .srcWhy{color:#475569;font-size:8.5pt;}

  #notices .notice>div:first-child,#out .notice>div:first-child{flex:1 1 240px;min-width:0;overflow-wrap:anywhere;} #notices .nBtns,#out .nBtns{display:flex;gap:6px;margin-left:auto;}

    .steps li{break-inside:avoid;} .katex,.katex *{-webkit-print-color-adjust:exact;print-color-adjust:exact;} .katex .frac-line,.katex .overline-line,.katex .underline-line{border-bottom-color:#000!important;min-height:1px;} .katex-display{overflow:visible;} }

<body>
<div id="app">
  <header id="hdr">
    <div class="titleRow">
      <div>
        <h1>Prestressed Bridge Design <span style="font-weight:400;font-size:11pt">(new, in development)</span></h1>
        <div class="byline">AASHTO LRFD 10th Ed. (2024) <span id="saveState" aria-live="polite"></span></div>
        <a class="allToolsLink" href="../../tools.html" title="Open the list of all tools">&larr; All tools</a>
      </div>
      <div id="hdrBtns">
        <span id="hdrUR"><!-- PR 6: Undo and Redo (the steel app's header, apps/steel-bridge/index.html), kept together when the header wraps -->
        <button type="button" id="bUndo" title="Undo the last input change (Ctrl+Z)" disabled>Undo</button>
        <button type="button" id="bRedo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" disabled>Redo</button>
        </span>
        <input type="file" id="fImport" accept=".json,application/json" hidden>
      </div>
    </div>
  </header>
  <div id="main">
    <aside id="sbDashCol" aria-label="Check summary"></aside><!-- the check summary column, screens 1200 px and wider (ui/dash.js) -->
    <aside id="inputPanel">
      <div class="inTabs" role="tablist" id="inTabs"></div>
      <div id="inPanes"></div>
    </aside>
    <div id="sbSplit" role="separator" aria-orientation="vertical" aria-controls="inputPanel outputPanel" aria-label="Width of the input and output panels (arrow keys move it, Home / End to the limits, double-click or Enter resets)" tabindex="0" title="Drag to change the width of the input and output panels; double-click to reset"></div><!-- ui/splitter.js -->
    <main id="outputPanel">
      <div id="tabBar" role="tablist"></div>
      <div id="notices" role="status" aria-live="polite"></div><!-- PS-22: the notices, inline banners above the tab content -->
      <div id="out"></div>
    </main>
  </div>
</div>
<script>
(function () {
  'use strict';
  /* The page controller (PR 1 skeleton), in the steel app's pattern (apps/steel-bridge/index.html): one project P (engine/model.js),
     autosaved to psb2.project.current on every change; the input tabs on the left, the output tabs on the right; the page's tab choices in
     psb2.ui. Only the Project, Bridge layout and Cross-section inputs of schema v1 are editable; every other tab is a placeholder naming
     what it will hold and the PR that brings it (docs/ps-bridge-plan.md §2.2, §2.3, §5). Nothing is calculated. */
  const M = window.PSBModel, BR = window.PSBBridge, TY = window.PSBTypesUI, DLUI = window.PSBBridgeDLUI;
  const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = (() => { try { const k = '__psb2_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
  const memStore = { getItem: () => null, setItem: () => {}, removeItem: () => {} }, LS = store || memStore;
  const L = M.load(LS);
  let P = L.project, autosave = !L.noAutosave, autoFailed = false, errs = [];
  let ui = { itab: 'proj', otab: 'sum' };
  try { Object.assign(ui, JSON.parse((store && store.getItem(M.KEYS.ui)) || '{}')); } catch (e) { /* default tabs */ }
  const saveUi = () => { try { store && store.setItem(M.KEYS.ui, JSON.stringify(ui)); } catch (e) { /* not kept */ } };
  /* PR 5: the saved-project link (engine/library.js, as the steel app): cur.id = the library item the open project was last saved to / opened
     from; cur.text = its file text then (M.exportJSON; null: not saved anywhere in the browser). pb: the standard save controls (below). */
  const LIB = window.PSBLibrary, norm = Q => M.exportJSON(Q);
  let pb = null, cur = { id: null, text: null };
  /* PR 6: Undo / Redo (the steel app's, apps/steel-bridge/index.html "undo / redo"): snapshots of the project text (JSON.stringify(P)), one
     per project change, the last UNDO_MAX kept, in this page's memory only (nothing is stored: the steel app stores none either). snap = the
     text of the project on screen; stepNo counts the steps (a notice's Undo is offered only while its change is the last step). */
  let snap = '', undoS = [], redoS = [], stepNo = 0;
  const UNDO_MAX = 100;

  /* ---------- tabs (docs/ps-bridge-plan.md §2.2 and §2.3) ---------- */
  const TABS = [['proj', 'Project'], ['layout', 'Bridge layout'], ['xsec', 'Cross-section'], ['gird', 'Girders & strands'], ['mat', 'Materials'],
    ['dd', 'Diaphragms / deck'], ['loads', 'Loads'], ['own', 'Owner rules'], ['ad', 'Auto design']];
  const OTABS = [['sum', 'Summary'], ['sec', 'Section properties'], ['lds', 'Loads & LLDF'], ['an', 'Analysis'], ['loss', 'Losses'], ['str', 'Stresses'],
    ['flex', 'Flexure'], ['shear', 'Shear'], ['end', 'End zone & hold-down'], ['camb', 'Camber & deflection'], ['hand', 'Handling'], ['deck', 'Deck'],
    ['rt', 'Rating'], ['rpt', 'Report'], ['dwg', 'Drawings'], ['ad', 'Auto design'], ['3d', '3D view']];
  if (!TABS.some(t => t[0] === ui.itab)) ui.itab = 'proj';
  if (!OTABS.some(t => t[0] === ui.otab)) ui.otab = 'sum';

  /* ---------- inputs ---------- */
  const get = path => path.split('.').reduce((o, k) => o == null ? o : o[k], P);
  const set = (path, v) => { const ks = path.split('.'), last = ks.pop(), o = ks.reduce((a, k) => a[k], P); o[last] = v; };
  const num = (path, label, unit, o) => `<div class="fRow"><label for="i_${path}">${label}</label><input type="${o && o.text ? 'text' : 'number'}" step="any" id="i_${path}" data-path="${path}" data-kind="${o && o.text ? 'text' : 'num'}" value="${esc(get(path))}"><span class="unit">${unit || ''}</span></div>`;
  const sel = (path, label, opts) => `<div class="fRow"><label for="i_${path}">${label}</label><select id="i_${path}" data-path="${path}" data-kind="sel">${opts.map(([v, t]) => `<option value="${esc(v)}"${String(get(path)) === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
  const list = (path, label, unit, o) => `<div class="fRow"><label for="i_${path}">${label}</label><input type="text" class="wide" id="i_${path}" data-path="${path}" data-kind="list"${o && o.int ? ' data-int="1"' : ''} value="${esc((get(path) || []).join(', '))}"><span class="unit">${unit || ''}</span></div>`;
  const card = (title, body) => `<section class="sec"><div class="secHead">${title}</div><div class="secBody">${body}</div></section>`;
  /* ph(title, pr, items): a placeholder card: what the card will hold and the PR that brings it */
  const ph = (title, pr, items) => `<div class="ph"><b>${title}</b> <span class="devBadge">${/^\d/.test(pr) ? 'PR ' + pr : pr}</span><ul>${items.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
  const fmt = (x, d) => (typeof x === 'number' && isFinite(x)) ? x.toFixed(d) : '—';

  /* PR 3a-1: the inputs the Girders & strands, Materials and Loads tabs show: the base design, or (ui.scope = a girder type) that type's own
     inputs (the base with its overrides; edits become its overrides, engine/bridge.js setOvr) */
  const scopeK = () => TY.scopeOf(P, ui);
  const viewOf = k => k >= 0 ? Object.assign({}, P, { base: BR.effBase(P, k) }) : P;
  function panes() {
    const nS = P.spans.lengths.length, off = M.girderOffsets(P), deckW = off[off.length - 1] + (+P.xs.ohR || 0), sk = scopeK(), V = viewOf(sk);
    return {
      // PR 5: the standard card (shared/projects-ui.js projectBar, mounted after each redraw): Save · Save as… · Saved projects… · New;
      // Export JSON · Import JSON (as the steel app's STDS-B card)
      proj: card('Save and open', `<div id="pbHost"></div><p class="note">Import JSON also opens an old-app Export JSON file (as "From the old app" below).</p>`)
        + LGUI.card(P)
        + card('Project', ['name', 'number', 'owner', 'designer', 'checker', 'date'].map(k => num('project.' + k, k === 'owner' ? 'Client name (title block, optional)' : k[0].toUpperCase() + k.slice(1), '', { text: true })).join('')
          + num('project.notes', 'Notes', '', { text: true }))
        + IN.cards('proj', P)
        + ph('Hand-offs', '9', ['to and from the other tools, from the switch-over (PS-14): bearings to Elastomeric Bearing Design, every girder\'s reactions to Substructure Loading; before that, by file only']),
      layout: card('Spans', `${sel('spans.continuity', 'Continuity', [['simple', 'Simple spans'], ['composite', 'Made continuous for composite loads (5.12.3.3)']])}
          ${list('spans.lengths', 'Span lengths', '')}
          <p class="note">One row per span, left to right (Enter adds a row; a pasted list is split into rows). Total ${fmt(M.totalLength(P), 2)} ft. Made continuous: girder and DC1 simple; DC2, DW and live load continuous; restraint moments switchable (as the old app, PS-7).</p>`)
        + card('Support skews', `${list('xs.skews', 'Skews', '')}<p class="note">One row per support, left to right: abutment, ${nS > 1 ? 'piers, ' : ''}abutment (${nS + 1} values); skew θ from the normal to the girders.</p>`)
        + IN.cards('layout', P)
        + planCard(),   // 2026-11-14: the framing plan (ui/plan.js), true scale or ×2 width
      xsec: card('Girders', `${sel('xs.spMode', 'Girder spacing', [['individual', 'Individual spacings'], ['equal', 'Equal spacing']])}${num('xs.nb', 'Number of girders N<sub>b</sub>', '')}${P.xs.spMode === 'equal' ? equalRows() : list('xs.bays', 'Girder spacings (bays)', '')}${num('xs.ohL', 'Left overhang', 'ft')}${num('xs.ohR', 'Right overhang', 'ft')}
          <p class="note">${P.xs.spMode === 'equal' ? '' : `Bays left to right (${Math.max(0, (P.xs.nb | 0) - 1)} values). `} Unequal bays (PS-9): each girder's spacing S is the bay next to it (exterior) or the mean of its two bays (interior); see Loads &amp; LLDF. Overhangs from the exterior girder centreline. Deck width ${fmt(deckW, 2)} ft. A change of the girder count re-assigns the girder types' lines (the outer lines keep the exterior types; a notice lists each change, with Undo).</p>`)
        + lineTypeCard()   // 2026-11-14: the girder type of each line (the Girders & strands tab's line boxes, the same data)
        + IN.cards('xsec', P)
        + DLUI.card(P),   // PR 3a-3: DC2 / DW to each girder line (PS-9)
      gird: TY.card(P, ui) + TY.shownCard(P) + TY.scopeBar(P, ui, 'gird') + IN.cards('gird', V)
        + `<section class="sec"><div class="secHead">Strand pattern${sk >= 0 ? ` of ${esc(P.types[sk].label)}` : ''}</div><div class="secBody" id="gfx_strands_in"><p class="note">Shown when the inputs have no error.</p></div></section>`
        + ph('Girder library', '4', ['girder library from the standard sheets (NEBT, NEDBT, NEXT, boxes): PR 4, waits for the sheets (PS-2)']),
      mat: TY.scopeBar(P, ui, 'mat') + IN.cards('mat', V),
      dd: IN.cards('dd', P),
      loads: TY.scopeBar(P, ui, 'loads') + IN.cards('loads', V),
      own: IN.cards('own', P, ownRes()),
      ad: ph('Auto design', '5', ['waits for the girder library (PR 4, PS-2)', 'strands in symmetric pairs (PS-12) → draping, hold-down 0.33–0.45 L (PS-5) → f′<sub>ci</sub> / f′<sub>c</sub> in 0.5 ksi steps (PS-11)', 'locked fields never changed; Apply with Undo'])
    };
  }
  /* 2026-11-14 (equal spacing, the Steel Bridge app's EQSP, apps/steel-bridge/ui/loads.js equalRows): W_cc and the worked step
     S = W_cc / (N_b − 1); every bay takes S (M.applyEqual on each change); the deck width out to out shown */
  function equalRows() {

    // the header has the chip only (HDRS, as the steel app): Save and Saved projects… are in the card; Ctrl+S / Ctrl+Shift+S work from anywhere
    headerSave: false, chipClick: () => { const t = document.querySelector('#inTabs [data-itab="proj"]'); if (t) t.click(); const c = $('pbHost'); if (c) c.scrollIntoView({ block: 'nearest' }); }, chipHint: 'the Project tab (Save and open)',
    renamed: () => { if (lastRen && lastRen.id === cur.id) { const q = M.importJSON(lastRen.text); if (q.ok) { P.project.name = q.project.project.name; cur.text = norm(q.project); } changed(); } lastRen = null; },
    deleted: () => { if (cur.id && !LIB.list(LS).some(i => i.id === cur.id)) cur = { id: null, text: null }; syncBar(); },
    changed: () => syncBar(),
    ghNote: v => { const i = vItem(v); return i && v !== i.name ? '<span class="note" data-sp="gh-cell">not synced: a newer saved project has the same name (Rename this one to sync it)</span>' : ''; },
    ...(store && window.SharedGitHubSync ? { cloud: { tool: 'ps-bridge-app', label: 'Prestressed Bridge Design (new app)', toFile: t => t, store: ghStore,   // no browser storage: no sync
      fromFile: (j, n) => { const r = M.importJSON(JSON.stringify(j)); if (!r.ok) throw new Error(r.error); r.project.project.name = n; return r.project; } } } : {}) });
  B_EX.addEventListener('click', () => exportFile(P));
  B_IM.addEventListener('click', () => pb.importJSON());   // asks first on unsaved changes, then the file chooser
  /* PR 6: Undo / Redo buttons and keys, as the steel app: Ctrl+Z undo, Ctrl+Y or Ctrl+Shift+Z redo (⌘ on a Mac). Text being typed in a field
     (an input event since its last change / blur) keeps the browser's own undo of that field; nothing while a dialog is open. */
  $('bUndo').addEventListener('click', undo); $('bRedo').addEventListener('click', redo);
  document.addEventListener('input', e => { if (e.target && e.target.dataset) e.target.dataset.typing = '1'; }, true);
  document.addEventListener('change', e => { if (e.target && e.target.dataset) delete e.target.dataset.typing; }, true);
  document.addEventListener('blur', e => { if (e.target && e.target.dataset) delete e.target.dataset.typing; }, true);
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return; const k = (e.key || '').toLowerCase(), t = e.target;
    if (t && t.dataset && t.dataset.typing) return;   // text being typed in a field: the browser's own undo for that field
    if (document.querySelector('dialog[open]')) return;   // a dialog is open (Saved projects, Save as, Cloud sync)
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); } else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
  });
  snap = JSON.stringify(P);   // PR 6: the project as opened is the start of the history

  drawInputs(); drawOut(); syncBar();
  if (L.notes && L.notes.length) toast(L.notes.join(' '));   // PR 3a-1 / 3a-4: what the load migrated or restored (stored with the next change)
  if (window.PSBDashUI) window.PSBDashUI.init({ el: $('sbDashCol'), store, getP: () => P, errors: () => errs, result: () => { if (errs.length) return null; const rc = result(); return rc.R.error ? null : rc.R; }, all: allResults, run: runState, runCtl, pick, goto: gotoStep, fix: gotoErr, goin: t => { ui.itab = t; saveUi(); drawInputs(); $('inputPanel').scrollTop = 0; } });
})();
</script>
