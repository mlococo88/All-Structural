<style>

  .kv div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0;}

<body>
<div id="toast" role="status" hidden></div>
<div id="app">
  <header id="hdr">
    <div class="titleRow">
      <div>
        <h1>Prestressed Bridge Design <span style="font-weight:400;font-size:11pt">(new, in development)</span></h1>
        <div class="byline">AASHTO LRFD 10th Ed. (2024) <span id="saveState" aria-live="polite"></span></div>
        <a class="allToolsLink" href="../../tools.html" title="Open the list of all tools">&larr; All tools</a>
      </div>
      <div id="hdrBtns"><input type="file" id="fImport" accept=".json,application/json" hidden></div>
    </div>
  </header>
  <div id="main">
    <aside id="sbDashCol" aria-label="Check summary"></aside><!-- the check summary column, screens 1200 px and wider (ui/dash.js) -->
    <aside id="inputPanel">
      <div class="inTabs" role="tablist" id="inTabs"></div>
      <div id="inPanes"></div>
    </aside>
    <div id="sbSplit" role="separator" aria-orientation="vertical" aria-controls="inputPanel outputPanel" aria-label="Width of the input and output panels (arrow keys move it, Home / End to the limits, double-click or Enter resets)" tabindex="0" title="Drag to change the width of the input and output panels; double-click to reset"></div><!-- ui/splitter.js -->
    <main id="outputPanel">
      <div id="tabBar" role="tablist"></div>
      <div id="out"></div>
    </main>
  </div>
</div>
<script>
(function () {
  'use strict';
  /* The page controller (PR 1 skeleton), in the steel app's pattern (apps/steel-bridge/index.html): one project P (engine/model.js),
     autosaved to psb2.project.current on every change; the input tabs on the left, the output tabs on the right; the page's tab choices in
     psb2.ui. Only the Project, Bridge layout and Cross-section inputs of schema v1 are editable; every other tab is a placeholder naming
     what it will hold and the PR that brings it (docs/ps-bridge-plan.md §2.2, §2.3, §5). Nothing is calculated. */
  const M = window.PSBModel;
  const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = (() => { try { const k = '__psb2_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
  const memStore = { getItem: () => null, setItem: () => {}, removeItem: () => {} }, LS = store || memStore;
  const L = M.load(LS);
  let P = L.project, autosave = !L.noAutosave, autoFailed = false, errs = [];
  let ui = { itab: 'proj', otab: 'sum' };
  try { Object.assign(ui, JSON.parse((store && store.getItem(M.KEYS.ui)) || '{}')); } catch (e) { /* default tabs */ }
  const saveUi = () => { try { store && store.setItem(M.KEYS.ui, JSON.stringify(ui)); } catch (e) { /* not kept */ } };

  /* ---------- tabs (docs/ps-bridge-plan.md §2.2 and §2.3) ---------- */
  const TABS = [['proj', 'Project'], ['layout', 'Bridge layout'], ['xsec', 'Cross-section'], ['gird', 'Girders & strands'], ['mat', 'Materials'],
    ['dd', 'Diaphragms / deck'], ['loads', 'Loads'], ['own', 'Owner rules'], ['ad', 'Auto design']];
  const OTABS = [['sum', 'Summary'], ['sec', 'Section properties'], ['lds', 'Loads & LLDF'], ['an', 'Analysis'], ['loss', 'Losses'], ['str', 'Stresses'],
    ['flex', 'Flexure'], ['shear', 'Shear'], ['end', 'End zone & hold-down'], ['camb', 'Camber & deflection'], ['hand', 'Handling'], ['deck', 'Deck'],
    ['rt', 'Rating'], ['rpt', 'Report'], ['dwg', 'Drawings'], ['ad', 'Auto design'], ['3d', '3D view']];
  if (!TABS.some(t => t[0] === ui.itab)) ui.itab = 'proj';
  if (!OTABS.some(t => t[0] === ui.otab)) ui.otab = 'sum';

  /* ---------- inputs ---------- */
  const get = path => path.split('.').reduce((o, k) => o == null ? o : o[k], P);
  const set = (path, v) => { const ks = path.split('.'), last = ks.pop(), o = ks.reduce((a, k) => a[k], P); o[last] = v; };
  const num = (path, label, unit, o) => `<div class="fRow"><label for="i_${path}">${label}</label><input type="${o && o.text ? 'text' : 'number'}" step="any" id="i_${path}" data-path="${path}" data-kind="${o && o.text ? 'text' : 'num'}" value="${esc(get(path))}"><span class="unit">${unit || ''}</span></div>`;
  const sel = (path, label, opts) => `<div class="fRow"><label for="i_${path}">${label}</label><select id="i_${path}" data-path="${path}" data-kind="sel">${opts.map(([v, t]) => `<option value="${esc(v)}"${String(get(path)) === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
  const list = (path, label, unit, o) => `<div class="fRow"><label for="i_${path}">${label}</label><input type="text" class="wide" id="i_${path}" data-path="${path}" data-kind="list"${o && o.int ? ' data-int="1"' : ''} value="${esc((get(path) || []).join(', '))}"><span class="unit">${unit || ''}</span></div>`;
  const card = (title, body) => `<section class="sec"><div class="secHead">${title}</div><div class="secBody">${body}</div></section>`;
  /* ph(title, pr, items): a placeholder card: what the card will hold and the PR that brings it */
  const ph = (title, pr, items) => `<div class="ph"><b>${title}</b> <span class="devBadge">PR ${pr}</span><ul>${items.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
  const fmt = (x, d) => (typeof x === 'number' && isFinite(x)) ? x.toFixed(d) : '—';

  function panes() {
    const nS = P.spans.lengths.length, off = M.girderOffsets(P), deckW = off[off.length - 1] + (+P.xs.ohR || 0);
    return {
      proj: card('Save and open', `<div class="fRow"><button type="button" id="bExport" title="Save the open project as a .json file">Export JSON</button><button type="button" id="bImport" title="Open a PS Bridge (.psb2.json) project file">Import JSON</button><button type="button" id="bNew" title="Start a new project (export the open one first to keep it)">New</button></div>
          <p class="note">The open project is kept in this browser automatically. The saved-projects list (Save, Save as…, Saved projects…) and "From old app" (read-only import of the old Prestressed Bridge Design data) come in later PRs.</p>`)
        + card('Project', ['name', 'number', 'owner', 'designer', 'checker', 'date'].map(k => num('project.' + k, k === 'owner' ? 'Client name (title block, optional)' : k[0].toUpperCase() + k.slice(1), '', { text: true })).join('')
          + num('project.notes', 'Notes', '', { text: true }))
        + ph('Assumptions', '2b', ['every assumption of the input tabs, listed here and in the Report (engineer rule)'])
        + ph('Hand-offs', '9', ['to and from the other tools, from the switch-over (PS-14): bearings to Elastomeric Bearing Design, every girder\'s reactions to Substructure Loading; before that, by file only']),
      layout: card('Spans', `${sel('spans.continuity', 'Continuity', [['simple', 'Simple spans'], ['composite', 'Made continuous for composite loads (5.12.3.3)']])}
          ${list('spans.lengths', 'Span lengths', 'ft')}
          <p class="note">Left to right, separated by commas. Total ${fmt(M.totalLength(P), 2)} ft. Made continuous: girder and DC1 simple; DC2, DW and live load continuous; restraint moments switchable (as the old app, PS-7).</p>`)
        + card('Support skews', `${list('xs.skews', 'Skews', 'deg')}<p class="note">One per support, left to right: abutment, ${nS > 1 ? 'piers, ' : ''}abutment (${nS + 1} values).</p>`)
        + ph('Plan and age at continuity', '3a', ['the plan of the girders and supports', 'age of the girders when made continuous']),
      xsec: card('Girders', `${num('xs.nb', 'Number of girders', '')}${list('xs.bays', 'Girder spacings (bays)', 'ft')}${num('xs.ohL', 'Left overhang', 'ft')}${num('xs.ohR', 'Right overhang', 'ft')}
          <p class="note">Bays left to right (${Math.max(0, (P.xs.nb | 0) - 1)} values); unequal bays allowed (PS-9). Overhangs from the exterior girder centreline. Deck width ${fmt(deckW, 2)} ft.</p>`)
        + ph('Deck, haunch and edges', '2b', ['structural slab t<sub>s</sub>, haunch, b<sub>eff</sub> (as the old app, PS-14)', 'barriers, sidewalks and wearing surface (DW)'])
        + ph('Dead-load distribution', '3a', ['DC2 and DW to each girder by the Steel Bridge app\'s method, with unequal bays (PS-9; a calculation change against the old app, with §4 callouts)']),
      gird: ph('Girder shape per span', '2b / 3a', ['the same shape for every girder of a span (PS-8)', 'interior and exterior design per span, optional per-girder override (PS-8)', 'girder library from the standard sheets (NEBT, NEDBT, NEXT, boxes): PR 4, waits for the sheets (PS-2)'])
        + ph('Strands', '2b', ['strand rows (number, height), debonding (entered only; auto-design never adds it, PS-12)', 'strand-pattern graphic in the Steel Bridge style'])
        + ph('Draped strands', '2b', ['number n<sub>h</sub>, y<sub>end</sub>, y<sub>mid</sub>', 'two hold-down points at frac × L from ℄ bearing (PS-5, PS-13; default 0.40)'])
        + ph('Reinforcement', '2b', ['stirrups, confinement, splitting and release tension steel, top bars over the piers']),
      mat: ph('Concrete and strands', '2b', ['f′<sub>ci</sub>, f′<sub>c</sub>, w<sub>c</sub>, deck concrete', 'strand size, f<sub>pu</sub>, jacking, E<sub>p</sub>'])
        + ph('Time-dependent', '2b', ['relative humidity H, V/S, ages at release, deck placement and final', 'loss method (refined or approximate)']),
      dd: ph('Diaphragms', '2b', ['entered once for the bridge and applied to every girder (PS-14)'])
        + ph('Deck design', '2b', ['strip-method deck design, on or off (as the old app, PS-14)']),
      loads: ph('Dead loads', '2b / 3a', ['DC1 (girder, deck, haunch), DC2, DW; per girder from PR 3a (PS-9)'])
        + ph('Live load', '2b', ['HL-93, live-load distribution factors (or entered), external demands by file (MIDAS)', 'rating vehicles'])
        + ph('Handling', '2b', ['lifting and hauling, on or off']),
      own: ph('Owner', '2b', ['AASHTO, MassDOT, CTDOT or RIDOT and the load modifiers η', 'release compression limit factor, exposure'])
        + ph('Hold-down', '2b', ['F<sub>hd</sub> = 2 n<sub>h</sub> f<sub>pbt</sub> A<sub>b</sub> sin α ≤ limit: MassDOT 3.7.2.2, CTDOT V2 5.9.1.6', 'AASHTO and RIDOT: optional check, on by default, limit 75 % of the beam weight, editable (PS-10)']),
      ad: ph('Auto design', '5', ['waits for the girder library (PR 4, PS-2)', 'strands in symmetric pairs (PS-12) → draping, hold-down 0.33–0.45 L (PS-5) → f′<sub>ci</sub> / f′<sub>c</sub> in 0.5 ksi steps (PS-11)', 'locked fields never changed; Apply with Undo'])
    };
  }
  function drawInputs() {
    $('inTabs').innerHTML = TABS.map(([k, t]) => `<button type="button" role="tab" data-itab="${k}" aria-selected="${ui.itab === k}">${t}<span class="inDot"></span></button>`).join('');
    const p = panes();
    $('inPanes').innerHTML = TABS.map(([k]) => `<div class="pane" data-pane="${k}"${ui.itab === k ? '' : ' hidden'}>${p[k]}</div>`).join('');
    markErrors();
  }
  /* the model's input errors (engine/model.js validate): their fields marked, counted on their input tab; no results while one exists */
  const TAB_RULES = [[/^project\b/, 'proj'], [/^(spans|xs\.skews)\b/, 'layout'], [/^xs\b/, 'xsec']];
  const tabOf = p => { const r = TAB_RULES.find(q => q[0].test(p || '')); return r ? r[1] : 'proj'; };
  const fieldOf = p => { let q = String(p || ''); while (q) { const el = document.querySelector(`#inPanes [data-path="${q}"]`); if (el) return el; q = q.replace(/\.?[^.]*$/, ''); } return null; };
  function markErrors() {
    errs = M.validate(P).errors;
    document.querySelectorAll('#inPanes .bad').forEach(el => { el.classList.remove('bad'); el.removeAttribute('aria-invalid'); el.removeAttribute('title'); });
    const cnt = {};
    errs.forEach(e => { const el = fieldOf(e.path); if (el) { el.classList.add('bad'); el.setAttribute('aria-invalid', 'true'); el.title = e.msg; } const t = tabOf(e.path); cnt[t] = (cnt[t] || 0) + 1; });
    document.querySelectorAll('#inTabs [data-itab]').forEach(b => { const n = cnt[b.dataset.itab] || 0, d = b.querySelector('.inDot');
      b.classList.toggle('has-err', n > 0); if (d) d.textContent = n ? String(n) : ''; if (n) b.title = `${n} input${n > 1 ? 's' : ''} to fix on this tab`; else b.removeAttribute('title'); });
  }
  function gotoErr(i) { const e = errs[i]; if (!e) return; ui.itab = tabOf(e.path); saveUi(); drawInputs(); const el = fieldOf(e.path); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } }
  const parseList = v => String(v).split(/[,;\s]+/).filter(Boolean).map(Number);
  /* resize(a, n, fill): a list kept at n values when the span or girder count changes (new values: the last one, else fill) */
  const resize = (a, n, fill) => { const b = (a || []).slice(0, Math.max(0, n)); while (b.length < n) b.push(b.length ? b[b.length - 1] : fill); return b; };
  $('inTabs').addEventListener('click', e => { const b = e.target.closest('[data-itab]'); if (!b) return; ui.itab = b.dataset.itab; saveUi(); drawInputs(); });
  $('inPanes').addEventListener('change', e => {
    const el = e.target, path = el.dataset.path, k = el.dataset.kind; if (!path) return;
    const v = el.value;
    if (k === 'num') set(path, v === '' ? NaN : Number(v));
    else if (k === 'list') set(path, parseList(v));
    else set(path, v);
    if (path === 'spans.lengths' && P.spans.lengths.length) P.xs.skews = resize(P.xs.skews, P.spans.lengths.length + 1, 0);   // one skew per support
    if (path === 'xs.nb' && Number.isInteger(P.xs.nb) && P.xs.nb >= 1) P.xs.bays = resize(P.xs.bays, P.xs.nb - 1, 9);         // one spacing per bay
    changed();
  });
  $('inPanes').addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'bExport') exportFile(P);
    else if (t.id === 'bImport') $('fImport').click();
    else if (t.id === 'bNew') { if (confirm('Start a new project? The open project is replaced here (export it first to keep it).')) { P = M.defaultProject(); autosave = true; changed(); } }
  });
  function changed() {
    if (autosave) autoFailed = !M.save(LS, P);
    drawInputs(); drawOut(); syncBar();
  }
  function syncBar() { const el = $('saveState'); el.className = autoFailed ? 'err' : ''; el.textContent = autoFailed ? '· Autosave failed: browser storage is full. Export JSON now.' : !autosave ? '· Autosave off (see the note on the output panel).' : ''; }

  /* ---------- outputs (placeholders; docs/ps-bridge-plan.md §2.3, §5) ---------- */
  const OUT = {
    sec: ['2b', ['gross and composite section properties per design group, with worked steps', 'the girder section graphic with the strands, in the Steel Bridge style']],
    lds: ['2b / 3a', ['DC1, DC2 and DW per girder (the Steel Bridge method with unequal bays from PR 3a, PS-9)', 'live-load distribution factors']],
    an: ['2b', ['moment and shear envelopes along the girder', 'continuity for composite loads and the restraint moments (5.12.3.3, PS-7)']],
    loss: ['2c', ['instantaneous and long-term prestress losses, with the losses graphic']],
    str: ['2c', ['release and service stresses at every station, with the stress diagrams']],
    flex: ['2c', ['Strength I flexural resistance and minimum reinforcement']],
    shear: ['2c', ['shear resistance, stirrup spacing and the longitudinal reinforcement check']],
    end: ['2d', ['splitting and confinement steel, debonding rules', 'draped strands and the hold-down force against its limit (PS-1, PS-10)']],
    camb: ['2d', ['camber at release and erection, final camber, live-load deflection']],
    hand: ['2d', ['lifting and hauling checks, where on']],
    deck: ['2d', ['strip-method deck design, where on']],
    rt: ['2d', ['LRFR rating factors']],
    dwg: ['7', ['girder sheet, strand and draping schedule (hold-down from ℄ bearing and from the girder end, PS-13), camber table; DXF']],
    ad: ['5', ['the auto-design proposal per design group and its trial log (Run on the Auto design input tab)']],
    '3d': ['3c', ['the bridge in 3D (three.js, as the Steel Bridge app)']]
  };
  function drawOut() {
    $('tabBar').innerHTML = OTABS.map(([k, t]) => `<button type="button" role="tab" data-otab="${k}" aria-selected="${ui.otab === k}">${t}</button>`).join('');
    let h = '';
    if (L.note) h += `<div class="alert err">${esc(L.note)}</div>`;
    if (errs.length) { h += `<div class="alert err"><b>Input errors: results are not shown until they are fixed.</b><ul>${errs.map((e, i) => `<li><a href="#" data-icgo="${i}">${esc(e.msg)}</a></li>`).join('')}</ul></div>`; }
    h += `<div class="alert">In development (PR 1, skeleton): no checks are calculated yet. Use the old <a href="../../Prestressed%20Bridge%20Design.html">Prestressed Bridge Design</a> for design work.</div>`;
    const name = (OTABS.find(t => t[0] === ui.otab) || [, ''])[1];
    if (ui.otab === 'sum') {
      const off = M.girderOffsets(P);
      h += errs.length ? '' : card('Project', `<div class="kv"><div><span>Project</span><span>${esc(P.project.name)}</span></div><div><span>Spans</span><span>${P.spans.lengths.map(x => fmt(x, 1)).join(' – ')} ft</span></div>
          <div><span>Continuity</span><span>${P.spans.continuity === 'composite' ? 'made continuous for composite loads' : 'simple spans'}</span></div><div><span>Girders</span><span>${P.xs.nb}</span></div>
          <div><span>Bays</span><span>${P.xs.bays.map(x => fmt(x, 2)).join(', ')} ft</span></div><div><span>Girder lines from the left deck edge</span><span>${off.map(x => fmt(x, 2)).join(', ')} ft</span></div></div>
          <p class="note">Entered values only (nothing calculated).</p>`)
        + ph('Summary', '3b', ['every girder × span × check, coloured by ratio; a cell opens the tab and card that works it', 'the check summary column (left, screens 1200 px and wider) shows the same values']);
    } else if (ui.otab === 'rpt') {
      h += ph('Report', '2e', ['the calculation report in the Steel Bridge style (shared/report.js), every value from the prestressed engine, with § references to its derivation']) + card('Planned sections', `<ol>${window.PSBReportPlan.SECTIONS.map(s => `<li><b>${esc(s.title)}</b>: ${esc(s.what)}</li>`).join('')}</ol>`);
    } else { const o = OUT[ui.otab]; h += ph(esc(name), o[0], o[1]); }
    $('out').innerHTML = h;
    if (window.PSBDashUI) window.PSBDashUI.refresh();
  }
  const gotoOut = t => { ui.otab = t; saveUi(); drawOut(); $('outputPanel').scrollTop = 0; };
  $('tabBar').addEventListener('click', e => { const b = e.target.closest('[data-otab]'); if (b) gotoOut(b.dataset.otab); });
  $('out').addEventListener('click', e => { const a = e.target.closest('[data-icgo]'); if (a) { e.preventDefault(); gotoErr(+a.dataset.icgo); } });

  /* ---------- file ---------- */
  function exportFile(Q) {
    const a = document.createElement('a'), name = (Q.project.name || 'ps-bridge').replace(/[^\w.-]+/g, '_');
    a.href = URL.createObjectURL(new Blob([M.exportJSON(Q)], { type: 'application/json' })); a.download = name + '.psb2.json'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  $('fImport').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { const r = M.importJSON(String(rd.result)); e.target.value = '';
      if (!r.ok) { alert(r.error); return; }
      if (!confirm('Open this project? It replaces the open project here (export it first to keep it).')) return;
      P = r.project; autosave = true; changed(); };
    rd.readAsText(f); });

  drawInputs(); drawOut(); syncBar();
  if (window.PSBDashUI) window.PSBDashUI.init({ el: $('sbDashCol'), store, getP: () => P, errors: () => errs, goto: gotoOut, fix: gotoErr });
})();
</script>
</body>
</html>
