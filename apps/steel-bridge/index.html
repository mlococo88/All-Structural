<style>
  /* layout: copied from BasePlateAnchorDesigner.html (tokens, #app, #hdr, #main, the two scrolling panels, tabs, cards) */
  :root{
    --navy-900:#16304F; --navy-800:#1E3A5F; --blue-600:#2563EB;
    --green-600:#059669; --red-600:#DC2626; --amber-700:#B45309;
    --slate-50:#F8FAFC; --slate-100:#F1F3F5; --slate-200:#E4E7EB; --slate-400:#94A3B8; --slate-900:#0F172A;
    --color-primary:var(--navy-800); --color-secondary:var(--blue-600); --color-ring:var(--blue-600);
    --color-bg:var(--slate-50); --color-surface:#ffffff; --color-border:var(--slate-200); --color-fg:var(--slate-900);
    --ink:var(--slate-900); --paper:#ffffff; --line:var(--slate-200); --accent:var(--navy-800); --pass:var(--green-600); --fail:var(--red-600); --warn:var(--amber-700);
    --font-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --font-doc:"Times New Roman",Times,serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--font-doc);font-size:10pt;color:var(--ink);background:#efede8;}
  #app{max-width:1500px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 12px rgba(0,0,0,.12);}
  html,body{overflow:hidden;}
  #hdr{flex:0 0 auto;border-bottom:3px solid var(--navy-900);padding:9px 14px 8px;background:var(--color-primary);color:#fff;z-index:20;}
  #hdr .titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  #hdr h1{font-size:15pt;margin:0;letter-spacing:.4px;font-family:var(--font-ui);font-weight:600;color:#fff;}
  #hdr .byline{font-size:9pt;color:#C7D4E4;margin-top:1px;font-family:var(--font-ui);}
  #hdrBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  #hdr .allToolsLink{font-size:8.5pt;color:#C7D4E4;text-decoration:none;font-family:var(--font-ui);}
  #hdr .allToolsLink:hover{color:#fff;text-decoration:underline;}
  #main{flex:1 1 auto;display:flex;min-height:0;}
  #inputPanel{flex:0 0 33%;max-width:33%;border-right:1px solid var(--color-border);overflow-y:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--color-bg);padding:10px 12px 60px;font-family:var(--font-ui);font-size:9.5pt;}
  #outputPanel{flex:1 1 67%;min-width:0;overflow-y:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 80px;background:var(--paper);}
  @media screen and (max-width:899.98px){
    html,body{overflow:visible;height:auto;}
    #app{height:auto;min-height:100vh;}
    #main{flex-direction:column;}
    #inputPanel{flex:none;max-width:none;border-right:none;border-bottom:2px solid var(--ink);overflow:visible;padding-bottom:16px;}
    #outputPanel{flex:none;overflow:visible;}
    .inTabs{top:0;}
  }
  .inTabs{position:sticky;top:-10px;z-index:12;display:flex;flex-wrap:wrap;gap:2px;margin:-10px -12px 0;padding:8px 12px 0;background:var(--color-bg);border-bottom:2px solid var(--ink);}
  .inTabs button,#tabBar button{border:1px solid var(--color-border);border-bottom:none;border-radius:6px 6px 0 0;font-size:9pt;font-family:var(--font-ui);padding:5px 10px;background:var(--slate-100);color:#475569;}
  .inTabs button[aria-selected="true"],#tabBar button[aria-selected="true"]{background:var(--paper);font-weight:600;color:var(--color-primary);box-shadow:inset 0 3px 0 var(--color-secondary);}
  .inDot{display:none;width:7px;height:7px;border-radius:50%;background:var(--fail);margin-left:6px;}
  .inTabs button.has-err .inDot{display:inline-block;}
  #autoBar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:6px 0 2px;font-family:var(--font-ui);font-size:9pt;color:#475569;min-height:26px;} #autoBar[hidden]{display:none;}
  #autoBar .spin{display:inline-block;width:12px;height:12px;border:2px solid #CBD5E1;border-top-color:var(--color-primary);border-radius:50%;animation:sbspin .8s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes sbspin{to{transform:rotate(360deg);}} @media (prefers-reduced-motion:reduce){#autoBar .spin{animation:none;}}
  #tabBar{position:sticky;top:0;background:var(--paper);z-index:10;display:flex;gap:2px;border-bottom:2px solid var(--ink);padding:8px 0 0;flex-wrap:wrap;}
  .pane[hidden]{display:none!important;}
  .sec{border:1px solid var(--color-border);border-radius:6px;background:var(--color-surface);margin:10px 0;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .sec>.secHead{padding:6px 9px;background:var(--slate-100);border-bottom:1px solid var(--color-border);font-family:var(--font-ui);font-size:8.5pt;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#334155;}
  .sec>.secBody{padding:8px 10px;}
  .fRow{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap;}
  .fRow label{min-width:170px;font-size:10pt;}
  input[type=number],input[type=text],select{font-family:var(--font-ui);font-size:9.5pt;padding:3px 6px;border:1px solid var(--color-border);border-radius:4px;width:110px;background:#fff;color:var(--color-fg);}
  input:focus-visible,select:focus-visible{outline:none;border-color:var(--color-ring);box-shadow:0 0 0 2px rgba(37,99,235,.25);}
  input.bad{border-color:var(--fail);background:#FEF2F2;}
  .unit{color:#555;font-size:10pt;}
  button{font-family:var(--font-ui);font-size:9.5pt;padding:4px 11px;border:1px solid var(--color-border);border-radius:4px;background:var(--color-surface);color:var(--color-fg);cursor:pointer;}
  button:hover{background:var(--slate-100);border-color:var(--slate-400);}
  #hdrBtns button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#fff;}
  #hdrBtns button:hover{background:rgba(255,255,255,.18);}
  button.primary{background:var(--color-secondary);color:#fff;border-color:var(--color-secondary);}
  table.tbl{border-collapse:collapse;width:100%;font-size:10pt;margin:6px 0;}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:3px 5px;text-align:center;}
  table.tbl th{background:#f1efe9;font-weight:bold;}
  table.tbl td.lft,table.tbl th.lft{text-align:left;}
  table.tbl td input{width:62px;font-size:9pt;padding:1px 3px;text-align:right;}
  table.tbl tr.sel{background:#eef4fb;}
  .tscroll{overflow-x:auto;}
  /* this app */
  .note{font-size:9pt;color:#475569;margin:4px 0;}
  .alert{border:1px solid var(--color-border);border-left:4px solid var(--warn);background:#FFFBEB;padding:6px 9px;margin:8px 0;font-family:var(--font-ui);font-size:9pt;}
  .alert.err{border-left-color:var(--fail);background:#FEF2F2;}
  .stale{display:flex;align-items:center;gap:10px;}
  .alert[hidden]{display:none;}
  .srcBar{border:1px solid var(--color-border);border-left:4px solid var(--pass);background:#F0FDF4;padding:5px 9px;margin:4px 0 8px;font-family:var(--font-ui);font-size:9.5pt;} .srcBar.ex{border-left-color:var(--accent);background:#EFF6FF;} .srcBar.warn{border-left-color:var(--warn);background:#FFFBEB;} .srcBar .srcWhy{color:#475569;font-size:8.5pt;}
  .steps{list-style:none;padding:0;margin:4px 0;}
  .steps li{padding:3px 0;border-bottom:1px dotted var(--line);}
  .steps li:target{background:#FFF7D6;}
  .steps .lbl{font-family:var(--font-ui);font-size:8.5pt;color:#475569;}
  .steps .ref{font-family:var(--font-ui);font-size:8pt;color:#64748b;margin-left:6px;}
  .steps .nt{font-family:var(--font-ui);font-size:8.5pt;color:var(--warn);}
  .steps .no{color:#94A3B8;}
  .st-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:92%;margin:0 2px;}
  .st-frac>.st-num{border-bottom:1px solid currentColor;padding:0 2px;}
  .st-frac>.st-den{padding:0 2px;}
  .st-bar{text-decoration:overline;}
  .steps .katex{font-size:1.08em;} .steps .lbl{margin-bottom:3px;}
  .steps .katex .katex-error{color:var(--fail);}
  a.wk{font-family:var(--font-ui);font-size:8.5pt;}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;margin:6px 0;}
  .kv div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0;}
  /* saved-project list, undo / redo and the change message (2026-11-01) */
  #hdrBtns button:disabled{opacity:.4;cursor:default;} #saveState{font-family:var(--font-ui);font-size:9pt;} #saveState.dirty{color:#FDE68A;font-weight:600;} #saveState.err{color:#FECACA;font-weight:600;}
  #libDlg{border:1px solid var(--slate-400);border-radius:8px;padding:12px 16px;width:min(860px,94vw);max-height:86vh;overflow:auto;font-family:var(--font-ui);font-size:10pt;color:var(--ink);}
  #libDlg::backdrop{background:rgba(15,23,42,.45);} #libDlg .libHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12pt;}
  #libDlg .libAct{white-space:nowrap;text-align:right;} #libDlg .libAct button{margin-left:4px;font-size:9pt;padding:2px 8px;}
  #libDlg .libUse{display:flex;gap:10px;align-items:center;font-size:9pt;color:#475569;margin:8px 0;} .libBar{flex:0 0 140px;height:10px;border-radius:5px;background:var(--slate-200);overflow:hidden;} .libBar i{display:block;height:100%;background:var(--green-600);}
  .libBar.high i{background:var(--amber-700);} .libBar.full i{background:var(--fail);}
  /* STDS-B (2026-11-06): the standard save controls and dialogs (shared/projects-ui.js) in the app's UI font */
  body dialog.spLib,#hdrBtns button.spChip[data-sp]{font-family:var(--font-ui);}
  #toast{position:fixed;right:14px;top:84px;max-width:min(520px,calc(100vw - 28px));max-height:60vh;overflow:auto;z-index:50;background:#fff;border:1px solid var(--slate-400);border-left:4px solid var(--navy-800);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:8px 12px;font-family:var(--font-ui);font-size:9.5pt;}
  #toast[hidden]{display:none;} #toast.err{border-left-color:var(--fail);} #toast ul{margin:4px 0 6px;padding-left:18px;} #toast .tBtns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;} #toast .tFld{font-weight:600;} #toast .tArr{color:#475569;}
  @media print{ #hdrBtns,#toast,#libDlg,.inTabs,#tabBar,#autoBar,#inputPanel{display:none!important;} html,body{overflow:visible;height:auto;} #app{height:auto;box-shadow:none;} #outputPanel{overflow:visible;}
    .steps li{break-inside:avoid;} .katex,.katex *{-webkit-print-color-adjust:exact;print-color-adjust:exact;} .katex .frac-line,.katex .overline-line,.katex .underline-line{border-bottom-color:#000!important;min-height:1px;} .katex-display{overflow:visible;} }
</style>

<body>
<div id="toast" role="status" hidden></div>
<div id="app">
  <header id="hdr">
    <div class="titleRow">
      <div>
        <h1>Steel Bridge Design <span style="font-weight:400;font-size:11pt">(new, in development)</span></h1>
        <div class="byline">AASHTO LRFD 10th Ed. (2024) <span id="saveState" aria-live="polite"></span></div>
        <a class="allToolsLink" href="../../tools.html" title="Open the list of all tools">&larr; All tools</a>
      </div>
      <div id="hdrBtns">
        <button type="button" id="bUndo" title="Undo the last input change (Ctrl+Z)" disabled>Undo</button>
        <button type="button" id="bRedo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" disabled>Redo</button>
        <input type="file" id="fImport" accept=".json,application/json" hidden>
      </div>
      <div id="pbMove" hidden><!-- STDS-B: moved into the Project tab's "Save and open" card at start-up (they were in the header) -->
        <button type="button" id="bExport" title="Save the open project as a .json file">Export JSON</button>
        <button type="button" id="bImport" title="A project of this app, or of the old Steel Bridge Design (GirderDetail, Preliminary sizing, ST-Girder)">Import JSON</button>
        <button type="button" id="bOld" title="Import the project the old Steel Bridge Design autosaved in this browser (read only: the old app's saved data is not changed)">From old app</button>
      </div>
    </div>
  </header>
  <div id="main">
    <aside id="inputPanel">
      <div class="inTabs" role="tablist" id="inTabs"></div>
      <div id="inPanes"></div>
    </aside>
    <main id="outputPanel">
      <div id="tabBar" role="tablist"><button type="button" role="tab" aria-selected="true" data-otab="sec">Section properties</button><button type="button" role="tab" aria-selected="false" data-otab="flex">Flexure</button><button type="button" role="tab" aria-selected="false" data-otab="loads">Loads &amp; LLDF</button><button type="button" role="tab" aria-selected="false" data-otab="shear">Shear &amp; stiffeners</button><button type="button" role="tab" aria-selected="false" data-otab="fat">Fatigue &amp; studs</button><button type="button" role="tab" aria-selected="false" data-otab="an">Analysis</button><button type="button" role="tab" aria-selected="false" data-otab="cn">Constructibility</button><button type="button" role="tab" aria-selected="false" data-otab="cf">Cross-frames</button><button type="button" role="tab" aria-selected="false" data-otab="spl">Field splices</button><button type="button" role="tab" aria-selected="false" data-otab="rt">Rating</button><button type="button" role="tab" aria-selected="false" data-otab="wt">Welds</button><button type="button" role="tab" aria-selected="false" data-otab="rpt">Report</button><button type="button" role="tab" aria-selected="false" data-otab="dwg">Drawings</button><button type="button" role="tab" aria-selected="false" data-otab="ad">Auto design</button><button type="button" role="tab" aria-selected="false" data-otab="3d">3D view</button></div>
      <div id="autoBar" hidden><span id="autoMsg" role="status" aria-live="polite"></span><button type="button" id="bRerun" title="Calculate this tab again now">Re-run</button></div>
      <div id="out"></div>
    </main>
  </div>
</div>
<script>
(function () {
  'use strict';
  const M = window.SBDModel, SEC = window.SBDSections, ST = window.SharedSteps, U = window.SharedUnits, UL = window.SBDUiLoads, OWN = window.SBDOwners;
  const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = (() => { try { const k = '__sbd2_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
  const memStore = { getItem: () => null, setItem: () => {} };
  if (window.SBDReportData && window.SBDReportData.install) window.SBDReportData.install();   // one analysis cache for every output tab and the report (paths PR, 2026-10-30)
  const L = M.load(store || memStore);
  let P = L.project, autosave = !L.noAutosave, stale = true, R = null;
  const LIB = window.SBDLibrary, LS = store || memStore;
  /* saved-project link (engine/library.js): cur.id = the library item the open project was last saved to / opened from; cur.text = its
     normalised file text then (null: not saved anywhere in the browser). The open project is "unsaved" when its normalised text differs. */
  const ensureAll = Q => { UL.ensure(Q); window.SBDShearUI.ensure(Q); window.SBDFatigueUI.ensure(Q); window.SBDFramingUI.ensure(Q); window.SBDSplicesUI.ensure(Q); window.SBDRatingUI.ensure(Q); };
  const norm = Q => { const c = JSON.parse(JSON.stringify(Q)); ensureAll(c); return M.exportJSON(c); };
  let pb = null;   // STDS-B: the standard save controls (shared/projects-ui.js projectBar), made below
  let cur = { id: null, text: null }, autoFailed = false, snap = '', undoS = [], redoS = [], stepNo = 0, toastStep = -1;
  const UNDO_MAX = 100;   // steps kept in this session (the brief asks for at least 50)
  let ui = { itab: 'proj', g: 0, seg: 0, region: 'pos', otab: 'sec', lg: 0, lr: 0 };
  try { Object.assign(ui, JSON.parse((store && store.getItem(M.KEYS.ui)) || '{}')); } catch (e) { /* default tabs */ }
  /* TABR (2026-11-09): the input tabs reorganised (display only). An input tab saved under an older name opens the tab that now holds its
     inputs: 'fr' (the old Framing tab) and 'spans' (Spans & framing: the Spans card first) as below, 'xs' (Cross-section & loads) the
     Cross-section tab. Only ui.itab (the page's UI state, key unchanged) is mapped; the project and its format are not touched. */
  { const IT_OLD = { fr: 'framing', spans: 'layout', xs: 'xsec' }; if (IT_OLD[ui.itab]) ui.itab = IT_OLD[ui.itab]; }
  const saveUi = () => { try { store && store.setItem(M.KEYS.ui, JSON.stringify(ui)); } catch (e) { /* not kept */ } };

  /* ---------- inputs ---------- */
  const get = path => path.split('.').reduce((o, k) => o == null ? o : o[k], P);
  const set = (path, v) => { const ks = path.split('.'), last = ks.pop(), o = ks.reduce((a, k) => a[k], P); o[last] = v; };
  const num = (path, label, unit, o) => `<div class="fRow"><label for="i_${path}">${label}</label><input type="${o && o.text ? 'text' : 'number'}" step="any" id="i_${path}" data-path="${path}" data-kind="${o && o.text ? 'text' : 'num'}" value="${esc(get(path))}"><span class="unit">${unit || ''}</span></div>`;
  const sel = (path, label, opts, cur) => `<div class="fRow"><label for="i_${path}">${label}</label><select id="i_${path}" data-path="${path}" data-kind="sel">${opts.map(([v, t]) => `<option value="${esc(v)}"${String(cur !== undefined ? cur : get(path)) === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;

    else if (L.source === 'default') cur = { id: null, text: norm(P) };
    snap = JSON.stringify(P); syncBar(); }
  if (L.notes && L.notes.length && autosave) { autoFailed = !M.save(LS, P); syncBar(); }   // the migrated project to the autosave, so its notice shows once
  loadNotes(L.notes);
})();
</script>
