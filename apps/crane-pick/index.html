<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Crane Pick Analyzer</title>
<!-- Crane Pick Analyzer (engineer decisions 2026-11-16): an interactive lift-planning aid. The site is drawn on a map (Leaflet) or on a
     plan sheet; cranes, picks and sets (phase C2) are dragged on it and every result updates live. Built like the bridge apps
     (apps/steel-bridge, apps/ps-bridge): plain HTML/JS/CSS, classic scripts, opens from file://, relative paths only.
     Engine: engine/*.js (no DOM). UI: ui/*.js. Report: report/*.js. Saved data: localStorage keys crane.* and IndexedDB crane.sheets.v1
     only (engine/model.js). Units: US customary (ft, kip, psf / ksf).
     C1-1: the shell (header, input / output tabs, Project tab with Save and open, title block, notes), Undo / Redo, the map (base layers,
     scale bar, cursor coordinates in latitude / longitude and State Plane, go to a coordinate), the Site and Report output tabs.
     C1-2: plan-sheet underlays (PNG / JPG / PDF page), scale calibration, georeference, opacity, lock; images in IndexedDB.
     C1-3: site items (obstructions, power lines with the OSHA clearance, buried utilities / culverts / walls, exclusion zones, labels,
     dimensions), drawn, dragged and edited on the map; Site and Report sections.
     C2-1: the crane library (from the engineer's private GitHub repository with the Cloud sync token, or from files; a chart pasted
     from Excel in the crane editor), the project's cranes (each copied into the project), crane cards and the Report's §Cranes.
     C2-2: crane setups drawn to scale and dragged / rotated on the map; pick and set points with the swing path; live radius, chart
     capacity and % of chart on every drag; plan clearances to power lines, exclusion zones and obstructions; the Lifts tab.
     C2-3: the Picks output tab (every pick with its crane, chart, radii, capacities, % of chart, governing point, flags, links) and the
     Report's §Lifts (basis, summary, plan figure, each pick's inputs, flags and worked steps).
     C3-1: heights (engine/elev.js): the crane's elevation geometry (boom-foot pin, head allowance, boom width, counterweight heights;
     file / entered / stated assumption), the crane pad and the pick / set heights; boom angle (geometry, or the chart's printed angle),
     boom tip, load bottom, hook, block top, hook reach at the pick, the set and along the swing, with worked steps.
     C3-2: 3D clearances (engine/clear3d.js) of the boom, load line, load and counterweight along the path against power lines (OSHA
     D_min in 3D, sag / sway), obstructions (prisms) and exclusion zones; the path model setting (uniform / luff then swing); flags on
     the map, the live card, the Picks tab and the Report with worked steps; the elevation view along the boom (a dock under the map,
     live while dragging; Report §Elevations).
     C3-3: the 3D view (ui/view3d.js) in the same dock: site, plan sheet as the ground, cranes, the boom at the chosen point, the swing
     envelope, power lines with their D_min tubes, the 3D clearance flags; orbit; live with drags; a snapshot in the Report.
     C6: the trucking route (engine/route.js, ui/route.js): drawn routes with curve radii, the vehicle (tractor + semi / stretch trailer /
     steerable rear dolly / jeep + dolly) and its load, the kinematic swept path live while dragging, turns (off-tracking, inside /
     outside radii), site conflicts, overhead clearances (marks, power lines: 29 CFR 1926.1411 Table T), axle loads, haul-road bearing,
     posted bridges, staging at the pick; Route input / output tabs and Report §Route. 
     C7: the lift-plan drawings (ui/drawset.js, ui/drawings.js: cover and sheet index, general notes, a lift plan per pick and per girder lift
     with plan and elevations to scale, rigging / load share, ground, route; one DXF R12 file via shared/dxf.js; Print sheet / all), the
     Summary tab (every lift and route; ui/summary.js) and the Report's §1 Summary, §2 Basis, the section order and figure numbers.
     C8: preliminary terrain from USGS 3DEP (engine/terrain.js, ui/terrain.js), fetched in the browser (ImageServer getSamples; EPQS for a
     few points) and cached per browser (IndexedDB crane.terrain.v1): crane levelness and blocking, ground elevations from the terrain,
     pad cut / fill, route grades / crests / sags / long-load clearance, contours and slope colours, the cursor elevation; Terrain tabs,
     Report §Terrain. Not adequate to certify crane levelness: survey data governs.
     C9: the Crane output tab (ui/cranefig.js, ui/cranetab.js): the crane as the analysis uses it (plan, side elevation, the load chart with
     the operating points, weights and CGs), every value labelled with its source (file p.x / chart p.x / entered / ASSUMED (default)), the
     input table with links; Report §Cranes figures; a Crane sheet per setup in the Drawings set. -->
<!-- pdf.js 3.11.174 (engineer-approved 2026-11-16; BasePlateAnchorDesigner.html's pinned jsDelivr URL) is loaded by ui/sheets.js when the
     first PDF is opened: https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js (worker: build/pdf.worker.min.js) -->
<!-- three.js r128 + OrbitControls (engineer-approved 2026-11-16 for C3; the pinned files apps/steel-bridge/index.html uses) are loaded by
     ui/view3d.js when the 3D view is first opened: https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js and
     https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js -->
<!-- Leaflet 1.9.4 and proj4js 2.11.0 (engineer-approved 2026-11-16; the versions and URLs Bridge Geometry.html already pins, CLAUDE.md §2) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<!-- the app's scripts with ?v=<index.html Last-Modified> (as apps/steel-bridge/index.html: parser-blocking classic scripts, in order) -->
<script>
(function () {
  var v = Date.parse(document.lastModified) || Date.now();
  [
    'engine/geo.js',        // coordinates (State Plane zones, proj4), plane geometry, sheet placement
    'engine/model.js',      // the project, its storage keys and file format
    'engine/worked.js',     // worked steps of the computed values
    '../../shared/steps.js',       // the worked-step format and renderer (shared, unchanged)
    '../../shared/report.js',      // the calculation report viewer (shared, unchanged)
    '../../shared/projects.js',    // the standard save (shared, unchanged)
    '../../shared/projects-ui.js', // projectBar: header chip, Save / Save as… / Saved projects…, the "Save and open" card
    '../../shared/github-sync.js', // Cloud sync of the saved projects to a private GitHub repository (off until set up; tool 'crane-pick')
    'ui/app.js',            // the page controller: project, autosave, undo / redo, tabs, notices
    'ui/project.js',        // Project tab: Save and open, title block, notes
    'ui/map.js',            // the map: base layers, scale bar, cursor coordinates, go to
    'ui/sitetab.js',        // Site & map input tab: zone, base map, go to
    'ui/site.js',           // Site output tab: the plan summary
    'report/builders.js',   // the report model
    'ui/report.js',         // Report output tab (shared/report.js viewer)
    'ui/sheetstore.js',     // C1-2: the plan-sheet images in IndexedDB (crane.sheets.v1)
    'ui/sheets.js',         // C1-2: Plan sheets input tab: underlay, calibration, georeference (pdf.js loaded on first PDF)
    'engine/osha.js',       // C1-3: 29 CFR 1926.1408 Table A power-line clearance
    'ui/draw.js',           // C1-3: Site items input tab and the map's Draw bar: drawing, dragging, editing the site items
    'engine/cranes.js',     // C2-1: crane files (schema crane-pick.crane.v1), chart lookup, zones, plan dimensions, pasted charts
    'ui/cranes.js',         // C2-1: Cranes input tab: the library (GitHub / files), the project's cranes, the sync-repository check
    'ui/craneedit.js',      // C2-1: the crane editor (crane data, plan dimensions, configs, a chart pasted from Excel)
    'engine/lift.js',       // C2-2: setups, picks, capacity at the hook, swing path, plan footprint and clearances
    'engine/elev.js',       // C3-1: the lift in elevation: boom angle, tip, hook and load heights, hook reach
    'engine/clear3d.js',    // C3-2: 3D clearances along the path (boom, load line, load, counterweight vs power lines, obstructions, exclusion zones)
    'ui/place.js',          // C2-2: Lifts input tab; cranes, pick and set points dragged on the map with live capacity
    'ui/picks.js',          // C2-3: Picks output tab (every pick, links) and the Report's §Lifts
    'ui/elev.js',           // C3-2: the elevation view along the boom (dock under the map, Report §Elevations)
    'ui/view3d.js',         // C3-3: the 3D view in the same dock (three.js r128 + OrbitControls, loaded from the CDN when first opened)
    '../../shared/boussinesq.js',  // C4: Boussinesq stress below a loaded rectangle (shared, unchanged; also Spread Footing)
    'engine/ground.js',     // C4: float / track loads along the swing, bounding estimate, mats, bearing, stress at depth
    'ui/ground.js',         // C4: Ground input and output tabs, the pressure map and float-load labels, Report §Ground
    'engine/tandem.js',     // C5: girder lifts (one crane or two in tandem): load share, the girder path, per-step checks
    'ui/tandem.js',         // C5: Girder lifts input tab, the girder poses on the map, scrubber, Picks rows, Report §Tandem lifts
    'engine/align.js',      // 2026-11-17: the fitted alignment (tangents + circular curves) of a drawn / traced / OpenStreetMap route line
    'engine/osm.js',        // 2026-11-17: OpenStreetMap roads (Overpass API): road graph, snapping, shortest path along the roads, names, one-way
    'engine/route.js',      // C6: trucking route: path, kinematic swept path, overhead clearances, axle loads, haul road, posted bridges, staging
    'ui/route.js',          // C6: Route input and output tabs, the route on the map (live while dragging), Report §Route
    'ui/road.js',           // 2026-11-17: Snap to road (OpenStreetMap, cached per browser) and Trace tools of the Route tab
    '../../shared/dxf.js',  // C7: the DXF R12 writer, previews and sheet printing (shared, unchanged; also the bridge apps)
    'ui/drawset.js',        // C7: the lift-plan drawing set (cover, notes, lift plans, rigging, ground, route sheets) and the multi-lift summary
    'ui/drawings.js',       // C7: Drawings output tab (paper, preview, Download DXF, Print sheet / all, sheet index with links)
    'ui/summary.js',        // C7: Summary output tab (every lift and route in one table, with links)
    'ui/cranefig.js',       // C9: the crane graphics (plan, elevation, load chart, weights / CGs, the input table; no DOM) and the Crane drawing sheets
    'ui/cranetab.js',       // C9: Crane output tab (picker, live figures, inputs with their sources), Report §Cranes figures, Drawings sheets
    'engine/terrain.js',    // C8: preliminary terrain (USGS 3DEP): the grid, bilinear surface, levelness, pad grading, route profile, contours
    'ui/terrain.js'         // C8: Terrain input and output tabs, the fetch (USGS 3DEP, cached per browser), contours / slope map, level badges, Report §Terrain
  ].forEach(function (s) { document.write('<script src="' + s + '?v=' + v + '"><\/script>'); });
})();
</script>
<style>
  /* shell: the bridge apps' tokens and panels (apps/ps-bridge/index.html), adapted: the map fills the output panel */

  /* C1-2: plan sheets */
